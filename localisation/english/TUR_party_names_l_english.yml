 TUR.Anarchist_Communism:0 "£tur_anarcho_red Anarcho-Left Leanings"
 TUR.Anarchist_Communism_desc:0 "Social anarchism, sometimes referred to as red anarchism, is the branch of anarchism that sees individual freedom as interrelated with mutual aid."
 TUR.Anarchist_Communism_icon:0 "£tur_anarcho_red"
 TUR.Anarchist_Social:0 "£tur_anarcho_pacifism Anarcho-Pacifism"
 TUR.Anarchist_Social_desc:0 "Anarcho-pacifism is a form of anarchism which completely rejects the use of violence in any form for any purpose. The main precedent was Henry David Thoreau who through his work Civil Disobedience influenced both Leo Tolstoy and Mohandas Gandhi's advocacy of nonviolent resistance."
 TUR.Anarchist_Social_icon:0 "£tur_anarcho_pacifism"
 TUR.Anarchist_Libertarian:0 "£tur_anarcho_capitalism Anarcho-Capitalism"
 TUR.Anarchist_Libertarian_desc:0 "Anarcho-capitalism (or, colloquially, ancap) is a political philosophy and economic theory that seeks to abolish centralized states in favor of stateless societies with systems of private property enforced by private agencies, the non-aggression principle, free markets and the right-libertarian interpretation of self-ownership, which extends the concept to include control of private property as part of the self. In the absence of statute, anarcho-capitalists hold that society tends to contractually self-regulate and civilize through participation in the free market which they describe as a voluntary society."
 TUR.Anarchist_Libertarian_icon:0 "£tur_anarcho_capitalism"
 TUR.Anarchist_Green:0 "£tur_anarcho_green Anarcho-Naturism"
 TUR.Anarchist_Green_desc:0 "Anarcho-naturism appeared in the late 19th century as the union of anarchist and naturist philosophies."
 TUR.Anarchist_Green_icon:0 "£tur_anarcho_green"
 #Turkic
 TURKIC.Nat_Autocracy:0 "£turkic_nationalist_military_junta Turkic Armed Forces"
 TURKIC.Nat_Autocracy_desc:0 "Known as the army of the Turks, it descends from the Göktürks. The purpose of the Turkic army is to defend the homeland and even to take power if necessary."
 TURKIC.Nat_Autocracy_icon:0 "£turkic_nationalist_military_junta"
 TURKIC.Nat_Populism:0 "£turkic_mhp MHP"
 TURKIC.Nat_Populism_icon:0 "£turkic_mhp"
 TURKIC.Nat_Populism_desc:0 "The Nationalist Movement Party is a Turkic far-right political party that adheres to Turkic ultranationalism and Euroscepticism. The party decisively supports the Turkic Union."
 TURKIC.Monarchist:0 "£turkic_family Turkic Khaganate"
 TURKIC.Monarchist_icon:0 "£turkic_family"
 TURKIC.oligarchism:0 "£turkic_bbp BBP"
 TURKIC.oligarchism_icon:0 "£turkic_bbp"
 TURKIC.Western_AutocracyDP:0 "£turkic_dp TDP"
 TURKIC.Western_AutocracyDP_icon:0 "£turkic_dp"
 TURKIC.socialism:0 "£turkic_chp CHP"
 TURKIC.socialism_icon:0 "£turkic_chp"
 TURKIC.socialism_desc:0 "The Republican People's Party is a social-democratic, Kemalist political party in the Turkic Union. It is the oldest political party in the country. The CHP describes itself as "a modern social democratic party" faithful to the founding principles and values of the Turkic Union and the Republic of Turkey. The party is cited as "the founding party of modern Turkey". Its logo consists of the Six Arrows, which represent the founding principles of Kemalism: republicanism, nationalism, statism, populism, laicism and reformism. In addition, the CHP is an associate member of the Party of European Socialists (PES) and a member of the Socialist International and the Progressive Alliance."
 TURKIC.Communist-State:0 "£turkic_communist TCP"
 TURKIC.Communist-State_icon:0 "£turkic_communist"
 TURKIC.Communist-State_desc:0 "This party derives its general strength from DİSK and from pre-existing communist parties. The name of the party is the Turkish Communist Party. The party is a common sight on the streets. Its aim is to protect the workers and to achieve this in a nationalist environment."
 UTU.Nat_Populism: "£tur_nationalist_fascism MHP"
 UTU.Nat_Fascism: "£tur_bozkurtlar Bozkurtlar"
 TUR.TKPH:0 "£tur_emerging_communism TKP"
 TUR.TKPH_icon:0 "£tur_emerging_communism"
 TUR.TKPH_desc:0 "It was founded as the Socialist Power Party on 16 August 1993. In 2001, the party changed its name to the Communist Party of Turkey (TKP) and took over the historical legacy of the TKP."
 # Turkish parties that used the generic names
 TUR.liberalism_2000: "£tur_ldp Liberal Demokrat Parti (LDP)"
 TUR.liberalism_2000_desc: "Founded in 1994 by Besim Tibuk, the Liberal Democratic Party is Turkey's small classical liberal party. It defends free markets, a minimal state, privatisation and individual liberties, and has never come close to the electoral threshold."
 TUR.liberalism_2000_icon: "£tur_ldp"
 TUR.anarchist_communism_2000: "Özgürlük ve Dayanışma Partisi (ÖDP)"
 TUR.anarchist_communism_2000_desc: "The Freedom and Solidarity Party was founded in 1996 as a meeting ground for Turkey's radical left: socialists, ex-revolutionaries, feminists and environmentalists. It stands for workers' rights, secularism and peace, and stays far from power."
 TUR.Vilayat_e_Faqih_2000: "Türk Hizbullahı"
 TUR.Vilayat_e_Faqih_2000_desc: "Turkish Hezbollah is a banned, violent Islamist organisation active in the Kurdish south-east. It draws inspiration from the Iranian revolution and wants an Islamic state. It has no legal party and works underground."
 TUR.Kingdom_2000: "Kitap ve Sünnet Cemaati"
 TUR.Kingdom_2000_desc: "The Book and Sunnah community is the best-known Salafi network in Turkey. It preaches a strict return to the Quran and the Sunnah, keeps away from party politics and does not challenge the state openly."
 TUR.Caliphate_2000: "£tur_ibdas İBDA-C"
 TUR.Caliphate_2000_desc: "The Great Eastern Islamic Raiders' Front is an outlawed underground movement led by Salih Mirzabeyoğlu. It rejects the secular republic, calls for an Islamic order and has carried out bombings and attacks."
 TUR.Caliphate_2000_icon: "£tur_ibdas"
 TUR.Neutral_green_2000: "Yeşiller"
 TUR.Neutral_green_2000_desc: "The Greens are Turkey's small environmentalist movement. Briefly a party in the late 1980s, it lives on in local campaigns against dams, gold mines and nuclear plants, and in civil society."
 TUR.neutral_Social_2000: "Sosyaldemokrat Halkçı Parti (SHP)"
 TUR.neutral_Social_2000_desc: "The name of the Social Democratic Populist Party, which merged into the CHP in 1995, was revived by a group of social democrats unhappy with the CHP leadership. It speaks for the centre-left outside Deniz Baykal's party."
 TUR.Neutral_Muslim_Brotherhood_2000: "Yenilikçiler"
 TUR.Neutral_Muslim_Brotherhood_2000_desc: "The Reformists are the young wing of the Virtue Party around Recep Tayyip Erdoğan, Abdullah Gül and Bülent Arınç. They want to leave the hard line of the National Outlook behind and build a conservative democratic movement."
