 TUR.conservatism_2017: "£tur_western_conservative_2017 İYİ Party"
 TUR.conservatism_2017_icon: "£tur_western_conservative_2017"
 TUR.conservatism_2017_desc:0 "The İYİ (Good) Party is a nationalist, Kemalist and secularist political party in Turkey that aims to overcome social injustice by building a well-functioning social state. Established on 25 October 2017, the party adheres to the principles and ideals of Turkey's founder, Mustafa Kemal Atatürk."
 TUR.Communist-State: "£tur_non_aligned_social_democrat IP"
 TUR.Communist-StateP: "£tur_non_aligned_social_democrat Patriotic Party"
 TUR.Communist-State_icon: "£tur_non_aligned_social_democrat"
 TUR.Communist-State_desc: "The Workers' Party of Turkey is a Marxist-Leninist political party in Turkey. The party was founded as a result of internal strife between two rival factions within the Communist Party of Turkey (TKP)."
 TUR.Conservative_saadet:0 "£tur_saadet Saadet Party"
 TUR.Conservative_saadet_icon: "£tur_saadet"
 TUR.Conservative_saadet_desc:0 "It was founded on 20 July 2001 after the Virtue Party (FP) was banned by the Constitutional Court. While the party's reformist wing formed the Justice and Development Party (AKP), the hardliners founded the Felicity Party. Although an Islamist party, its policy platform covers the whole span of political issues in Turkey."
 TUR.Autocracy_rfp: "£tur_yeniden_refah Yeniden Refah"
