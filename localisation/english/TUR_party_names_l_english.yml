 TECH.oligarchism:0 "£tur_hp HP"
 TECH.oligarchism_icon:0 "£tur_hp HP"
 TECH.oligarchism_desc:0 "Technocracy is a form of government in which the decision-makers are selected based on their expertise in a given area of responsibility, particularly with regard to scientific or technical knowledge. This system explicitly contrasts with representative democracy, the notion that elected representatives should be the primary decision-makers in government."
 MIT.oligarchism:0 "£tur_mit MIT"
 MIT.oligarchism_icon:0 "£tur_mit MIT"
 MIT.oligarchism_desc:0 "The National Intelligence Organization is the intelligence agency of the Turkish government tasked with gathering information of national interest. It gathers information for the Presidency and the Armed Forces about current and potential threats, from inside and outside, against all the elements that make up Turkey's integrity, constitutional order, existence, independence, security and national power, and takes precautions when necessary."
 SADAT.oligarchism:0 "£tur_SADAT SADAT"
 SADAT.oligarchism_icon:0 "£tur_SADAT SADAT"
 SADAT.oligarchism_desc:0 "SADAT Inc. International Defense Consultancy is a private Turkish PMC headquartered in Istanbul, Turkey. It is the country's first domestic military consultancy firm, founded in 2012 by former Turkish Armed Forces (TSK) brigadier general, Adnan Tanrıverdi."
 TUR.Neutral_Communism_TIP: "£tur_tip TİP"
 TUR.Neutral_Communism_icon_TIP: "£tur_tip"
 TUR.Neutral_Communism_desc_TIP: "The Workers' Party of Turkey (TİP) is a political party in Turkey. The party was founded out of a split in the Communist Party of Turkey (TKP). As a result of the internal strife between two rival factions, the group led by former chairman Erkan Baş first established the People's Communist Party of Turkey (HTKP) in 2014, and three years later, it was rebranded as the Workers' Party of Turkey in 2017 with the participation of intellectuals, young people, women, trade union leaders and workers."
 TUR.Nat_Fascism_Zafer:0 "£tur_zafer_partisi Zafer Party"
 TUR.Nat_Fascism_Zafer_icon:0 "£tur_zafer_partisi"
 TUR.Nat_Fascism_Zafer_desc:0 "The Victory Party is a right-wing to far-right, nationalist, anti-immigrant and Kemalist political party in Turkey founded on August 26, 2021 under the leadership of Ümit Özdağ. It is currently represented in the Grand National Assembly by a single MP, Özdağ himself. The Victory Party is the continuation of the Ayyıldız Movement initiated by Ümit Özdağ, which became a youth movement after the establishment of the party."
