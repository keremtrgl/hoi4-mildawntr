 TUR.Mod_Vilayat_e_Faqih: "£tur_kurd_party HADEP"
 TUR.Mod_Vilayat_e_Faqih_icon: "£tur_kurd_party"
 TUR.Mod_Vilayat_e_Faqih_desc: "The People's Democracy Party was a Kurdish political party in Turkey. It was founded on 11 May 1994 by the lawyer Murat Bozlak."
 TUR.Mod_Vilayat_e_Faqih_2017: "£tur_emerging_left_wing_radical HDP"
