 MTU.Nat_Populism_desc:0 "The Gülen movement, referred to by its participants as Hizmet (service) or Cemaat (community) and since 2015 by the Government of Turkey as FETÖ (Fethullahist Terrorist Organisation), is a transnational Islamic movement with political overtones and aspirations, inspired by the writings and sermons of Fethullah Gülen, a Turkish Islamic preacher who lived in the United States from 1999. The movement is designated as a terrorist organization by Turkey, Pakistan and the GCC. Owing to the outlawed status of the Gülen movement in Turkey, some observers regard the movement's Turkish Muslim volunteers as effectively a sub-sect of Sunni Islam; these volunteers generally hold their religious tenets as generic Turkish Sunni Islam. The movement also includes participants of other nationalities and religious affiliations."
 CTU.Conservative:0 "£tur_emerging_communism TKP"
 CTU.Conservative_desc:0 "It was founded as the Socialist Power Party on 16 August 1993. In 2001, the party changed its name to the Communist Party of Turkey (TKP) and took over the historical legacy of the TKP."
