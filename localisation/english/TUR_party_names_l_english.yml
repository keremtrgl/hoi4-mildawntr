 TUR.Mod_Vilayat_e_Faqih_2017_icon: "£tur_emerging_left_wing_radical"
 TUR.Mod_Vilayat_e_Faqih_2017_desc: "The HDP is a pro-minority political party in Turkey. Generally left-wing, the party places a strong emphasis on participatory and radical democracy, feminism, minority rights, youth rights and egalitarianism."
