l_english:
 ATA_lock.1.t:0 "The Republic Holds"
 ATA_lock.1.d:0 "A change of government has been undone. While the path of Atatürk lasts, no election, coup or party manoeuvre can take power from it. The government that belongs to this path is back in office and elections stay suspended."
 ATA_lock.1.a:0 "As it should be"
