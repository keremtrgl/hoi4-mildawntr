l_english:
 PKK_hard_fought_freedom:0 "Hard Fought Freedom"
 PKK_hard_fought_freedom_desc:0 "Our freedom did not come with ease. It took the brave fighters of Kurdistan decades to gain autonomy from the Turkish state, and this freedom will be protected down to the very last Kurd!"
 TUR_belgian_workers:0 "Belgian Scientists"
 TUR_no_economic_plan:0 "No Economic Plan"
 TUR_no_economic_plan_desc:0 "§RWe can't increase our §YEconomic Cycle§! above §YRecession§!§!\n\nSeveral attempts to form governments in the late 90s, a subsequent military coup with a newly elected government and IMF warnings of a collapsing economy have caused dozens of billions of dollars to disappear from the economy as foreign investors have pulled out of the country. As the Turkish economy is practically built on foreign investment, this has stopped any economic growth.."
 TUR_party_rumours:0 "Party Rumours"
 TUR_party_rumours_desc:0 "§RWe can't manually boost §W[socialism_L]§!'s popularity§!\n\nPrime Minister Bülent Ecevit is already an elderly person, and there are rumours that his health is failing. There are also rumours that the Deputy Prime minister Hüsamettin Özkan is part of a group of §W[socialism_L]§! MPs who are planning to oust Ecevit due to his health and inefficient administration. These sort of rumours and dissidence inside the party are poison to the government's ability to function.\n\nCalling Özkan out publicly would force him to leave the party but he might take some of the other MPs with him. Alternatively we can wait it out and hope that these are no more than rumours."
 TUR_neo_ottomanism:0 "Neo-Ottomanism"
 TUR_neo_ottomanism_desc:0 "Neo-Ottomanism is a form of aggressive Turkish foreign policy which has let the government influence neighboring countries and exert Turkish influence outwards."
 TUR_no_disasters_plan:0 "No Disaster Plans"
 TUR_no_disasters_plan_desc:0 "Currently, our government has no disaster readiness plans, meaning that anytime a disaster occurs we are unready for it"
 TUR_attacking_mafia1:0 "Attacking the Mafia"
 TUR_attacking_mafia1_desc:0 "We are engaged in an active conflict with the Mafia and its members"
 TUR_attacking_mafia2:0 "Damaging the Mafia"
 TUR_attacking_mafia2_desc:0 "We are engaged in an active conflict with the Mafia and its members, and we are winning"
 TUR_committees_of_resistance_patrol:0 "Committees of Resistance"
 TUR_committees_of_resistance_patrol_desc:0 "Committees of Resistance are patrolling the streets looking for unpatriotic activity"
 CIW_member:0 "CIW Member"
 CIW_member_desc:0 "This country is a member of CIW (Confederation of Islamic Wellbeing), an economic organization that partakes in various economical projects across the Middle East and nearby areas, with the main goal of improving the economical wellbeing of Muslims"
 TUR_PKK_released_TT:0 "The £TUR_Neutral_Communism  §OPKK Insurgency§! will end!\n - The £TUR_Neutral_Communism  §OPKK§! will become the ruling body of the new Kurdish state."
 TUR_PKK_insurgency_formally_ends_TT:0 "The £TUR_Neutral_Communism  §OPKK Insurgency§! will end"
 TUR_PKK_broke_free_tt:0 "The [PKK.GetFlag] PKK will break free!\n - We will not be able to directly intervene, unless we justify a wargoal or start a war through a raid\n - The [PKK.GetFlag] PKK will have a standing army, with a major defensive bonus against us.\n - We will lose all cores on the Kurdish regions."
 TUR_through_troubles:0 "Through The Troubles"
 TUR_through_troubles_desc:0 "Turkey is going through an economical crisis right now. We need to insure our people that the government can get through this"
 TUR_beacon_of_islam:0 "The Great Scholar"
 TUR_beacon_of_islam_desc:0 "Fethullah Gülen is the greatest scholar of Islam, and his teachings will be known around the world. Of course, preaching conservative Islam might have some side effects..."
 TUR_drug_problem:0 "The Drug Problem"
 TUR_drug_problem_desc:0 "At times, drugs are required for medical use, but that doesn't stop certain individuals from abusing the system and using them for recreational purposes with dangerous outcomes."
 TUR_federalize_turkish_kurdistan:0 "Federalization of Diyarbakir"
 TUR_federalize_turkish_kurdistan_desc:0 "We will federalize the Kurdistan province in our country, as it would be the best for both our interest, and the PKK's. We will maintain some level of control over them and the region, but they would also gain some level of autonomy."
 TUR_rebuilding_kurdistan:0 "Rebuilding Kurdistan"
 TUR_rebuilding_kurdistan_desc:0 "\n£TUR_desctext_PKK \n\n\n\n\nOur promise of reconciliation has renewed hopes in the Kurdish population living in the Eastern parts of our great nation. Though they will be a separate entity, the new Kurdish state will still need to answer to our government. In order to create a stable, and self-sufficient Kurdish state, we must first create the necessary infrastructure and framework for it to hold itself without collapsing or relying on us too much. If we fail to deliver this promise, we may lose complete control over the region."
 TUR_the_promise_of_no_return:0 "The Promise Of No Return"
 TUR_the_promise_of_no_return_desc:0 "We promised the Kurdish community in the east greater autonomy. Complete five reforms and finalize them before the deadline. Starting each reform extends the deadline. Military operations against PKK bases do not affect this mission."
 TUR_seize_goods_from_ports:0 "Steal goods from Ports"
 TUR_islamic_legacy:0 "Islamic Legacy"
 TUR_islamic_legacy_desc:0 "Islam has had a very long history in our nation, and we cannot forget that. We will utilize it to our advantage for ideological purposes"
 TUR_flavor_event.1.t:0 "Turkish Economic Collapse!"
 TUR_flavor_event.1.d:0 "It appears that our economy has collapsed, and we are unable to do anything to save it this instant. We are going to have to devise an economic plan which let's us slowly repair the economy, and set forth a Turkish Economic boom. We have a long road ahead of us, so we will have to get to work as soon as possible."
 TUR_flavor_event.1.a:0 "Let us hope this is the last of our problems"
 TUR_flavor_event.2.t:0 "Major Earthquake in Bingol"
 TUR_flavor_event.2.d:0 "A major 6.4 magnitude earthquake has rocked the Eastern city of Bingol. 177 people were killed, 84 of which being the result of a collapsing dormitory block in a boarding school. Roughly of 8,000 houses were damaged, and about 4 schools have collapsed. This earthquake must act as a reminder for us to step up our disaster relief program.."
 TUR_flavor_event.2.a:0 "A sad day for our nation"
 TUR_flavor_event.3.t:0 "Bombing in Istanbul!"
 TUR_flavor_event.3.d:0 "At around 9:30 in the morning about five days ago, two trucks loaded with bombs were detonated in Istanbul. One near Nevem Shalom Synagogue, and one in Bet Israel Synagague. About 28 people have lost their lives, while another 300 were injured. Today, we have gotten news that another 31 people were killed during an attack on the British consulate, and another 450 people were injured. In total, 59 people lost their lives, and 750 more were injured as a result of these attacks.."
 TUR_flavor_event.3.a:0 "Terrible"
 TUR_flavor_event.3.b:0 "Prepare some level of aid"
 TUR_flavor_event.3.c:0 "Prepare all the aid at hand"
 TUR_flavor_event.4.t:0 "Introduction of new Lira"
 TUR_flavor_event.4.d:0 "Recently, a major change to the Lira has been brought about. The Grand Nationa Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivelent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation.."
 TUR_flavor_event.4.a:0 "No, this is a good change"
 TUR_flavor_event.4.b:0 "Old is Gold"
 TUR_flavor_event.5.t:0 "Assassination of Hrant Dink"
 TUR_flavor_event.5.d:0 "Hrant Dink, an Armenian national had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively saught out the reconcilliation between Armenians, and Turks. The murderer has been identified as 17 year old male, and he is now under police custody. Hrants death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a:0 "Tragic"
 TUR_flavor_event.5.b:0 "Tragic"
 TUR_flavor_event.6.t:0 "Influx of Migrants"
 TUR_flavor_event.6.d:0 "Lately, we have been receiving more and more migrants from neighboring countries and abroad due to increasing conflicts. This is starting to slowly destabilize our politics, and some people are even pushing for more aggressive policies. We will have to prepare a response to the series of events.."
 TUR_flavor_event.6.a:0 "The more the merrier?"
 TUR_flavor_event.7.t:0 "Increase in drug use"
 TUR_flavor_event.7.d:0 "Drug use has been slowly growing in certain areas of the country, especially the lower-income areas. This is going to have devastating effects as our policies and laws are all over the place regarding the matter."
 TUR_flavor_event.7.a:0 "Revise the laws"
 TUR_flavor_event.8.t:0 "Gaza Flotilla Raid"
 TUR_flavor_event.8.d:0 "Earlier in the day, Israeli naval commandos conducted an operation against several civilian ships, killing 9 Turkish citizens onboard the Mavi Marmara. The flotillas were carrying humanitarian relief and aid in an attempt to break the Israeli blockade of the Gaza strip. This however, does not excuse the killing of our nationals, and Israel has been very reluctant in giving any sort of compensation or apology..."
 TUR_flavor_event.8.a:0 "Demand reparations AND an apology!"
 TUR_flavor_event.8.b:0 "We have bigger problems at hand.."
 TUR_flavor_event.81.t:0 "Turkey demands reparations for Gaza Flotilla Raid"
 TUR_flavor_event.81.d:0 "The Turkish government is angered over our commandos boarding and stopping ships from breaking the Gaza strip blockade. Of course, they are the ones at fault as we gave them several warnings, but they do not care."
 TUR_flavor_event.81.a:0 "Pay the reparations, get it over with"
 TUR_flavor_event.81.b:0 "We aren't paying for anything"
 TUR_flavor_event.811.t:0 "Israel pays reparations"
 TUR_flavor_event.811.d:0 "Israel has agreed to pay reparations to the victims families and our state as a result of the unjustified raid against the Free Gaza Movement."
 TUR_flavor_event.811.a:0 "Reparations are never enough.."
 TUR_flavor_event.812.t:0 "Israel ignores our request"
 TUR_flavor_event.812.d:0 "The Israel government has rebuffed our demands, saying that we have no say in demanding reparations as we were the ones at fault. This is an outragous statement, but we will not forget this."
 TUR_flavor_event.812.a:0 "Unbelievable"
 TUR_flavor_event.9.t:0 "Earthquake rocks Van"
 TUR_flavor_event.9.d:0 "Earlier today, an Earthquake of about 7.1 magnitude had rocked Van. About 11,000 buildings were damaged or destroyed, leaving more than 60,000 people homeless, and around 600 dead. Sadly, this is not uncommon as our Eastern regions are no stranger to natural disasters such as Earthquakes."
 TUR_flavor_event.9.a:0 "A tragedy"
 TUR_flavor_event.9.b:0 "Mobilize disaster relief"
 TUR_flavor_event.10.t:0 "Nowruz Protests"
 TUR_flavor_event.10.d:0 "Kurds across the nation are starting to protest against our governments policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a:0 "Get riot police on stand-by"
 TUR_flavor_event.10.b:0 "Let them protest"
 TUR_flavor_event.11.t:0 "U.S. Embassy attacked!"
 TUR_flavor_event.11.d:0 "The U.S. Embassy in Istanbul has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security gaurd dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a:0 "No need for an investigation if their doing one"
 TUR_flavor_event.11.b:0 "Launch our own investigation"
 TUR_flavor_event.12.t:0 "Mining disaster in Soma"
 TUR_flavor_event.12.d:0 "About 2 days ago, a fire was caused by blasting in the Soma, at a coal mine. The fire lasted for about 2 days, and rescue missions were mobilized as soon as possible, but were ultimately not very successful due to the thick smoke from the fire. It has been confirmed that about 301 were killed, and luckily, 486 were able to survive. Fingers are being pointed at the inadequete inspections, and officials in charge of inspections."
 TUR_flavor_event.12.a:0 "Tragic"
 TUR_flavor_event.12.b:0 "Overhaul inspection protocol"
 TUR_flavor_event.13.t:0 "Bombings in Ankara"
 TUR_flavor_event.13.d:0 "A short while ago, 2 bombs were detonated near Ankara Central railway station, leaving 109 civlians dead, and another 500 injured. It appears that the bombs were intended to disrupt a \"Labour, Peace, and Democracy\" rally in Ankara, organized by several groups. Several opposition parties have been blaming our government and our inabilities to prevent the attack, but all we can do for now is make changes where we can.."
 TUR_flavor_event.13.a:0 "Unfortunate"
 TUR_flavor_event.13.b:0 "Tighten security"
 TUR_flavor_event.14.t:0 "Debate over the curriculum"
 TUR_flavor_event.14.d:0 "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools curriculums. This has worried the secularist in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a:0 "Remove it, what evidence do they have anyway?"
 TUR_flavor_event.14.b:0 "Ridiculous"
 TUR_flavor_event.15.t:0 "CASA CN 235 Crashes in Isparta"
 TUR_flavor_event.15.d:0 "Some time ago, an Air Force CN-235 was on a training mission with two pilots and a technician on board. Due to thick fog in the area, the crew were unable to properly navigate the path, and tragically crashed, killing all onboard."
 TUR_flavor_event.15.a:0 "Truly unfortunate"
 TUR_flavor_event.15.b:0 "Make some changes"
 TUR_flavor_event.16.t:0 "Scientists establish a base in Antarctica"
 TUR_flavor_event.16.d:0 "A group of our nations scientists have established a base in Antarctica, marking major scientific progress for our nation!"
 TUR_flavor_event.16.a:0 "Great"
 TUR_flavor_event.17.t:0 "Kurdish Rights"
 TUR_flavor_event.17.d:0 "Liberal elements in our nation have been calling for more reforms when it comes to the existing Kurdish laws. They are asking that we relax them, making it easier for Kurdish parties to gain popularity. But more conservative groups are saying that we should keep the status quo for stability."
 TUR_flavor_event.17.a:0 "Reforms are dangerous"
 TUR_flavor_event.17.b:0 "Reforms are needed"
 TUR_flavor_event.18.t:0 "A shift in family values"
 TUR_flavor_event.18.d:0 "Recently, a new law has passed that allows women to become the head of family. While this change has pleased a lot of liberals in the country, it has angered the conservatives. We have a one time chance to change this law, be it for the better or the worse."
 TUR_flavor_event.18.a:0 "We must maintain our traditions"
 TUR_flavor_event.18.b:0 "Change is necessary"
 TUR_flavor_event.19.t:0 "Normalizing relations with Armenia"
 TUR_flavor_event.19.d:0 "After what seemed like forever, the Armenians are opening up to normalize relations between our two countries. Following the Assassination of Hrant Dink, our relations with Armenia took a nosedive, leading to an unneccesary amount of animosity between our two nations. However recently they have begun to move on from the past, and they are open to normalizing relations once more.."
 TUR_flavor_event.19.a:0 "They may be open to normalizing relations, but I'm not"
 TUR_flavor_event.19.b:0 "Great news"
 TUR_flavor_event.20.t:0 "Trans-Caspian Gas Pipeline"
 TUR_flavor_event.20.d:0 "After some convincing from the Americans, Turkmenistan has agreed to allow the construction of a subsea oil pipeline stretching from Turkmenbashi to Adana, Turkey. However, many in the government are scepticle, as they argue that the financial burden will ultimately fall on us, which could possibly put our economy at risk.."
 TUR_flavor_event.20.a:0 "Sounds like a great opportunity"
 TUR_flavor_event.20.b:0 "Yeah.. No"
 TUR_pkk.214.t:0 "Operational Success In Van"
 TUR_pkk.214.d:0 "After decades of fighting, organized Kurdish resistance has come to an end in the greater Van area. The glorious banner of the Turkish state flies higher than ever before, as a new start for the province has renewed hopes for all kinds of peoples living there."
 TUR_pkk.214.a:0 "At long last.."
 TUR_pkk.215.t:0 "Operational Success In Middle Euphrates"
 TUR_pkk.215.d:0 "After decades of fighting, organized Kurdish resistance has come to an end in the greater Middle Euphrates area. The glorious banner of the Turkish state flies higher than ever before, as a new start for the province has renewed hopes for all kinds of peoples living there."
 TUR_pkk.215.a:0 "At long last.."
 TUR_pkk.216.t:0 "Operational Success In Diyarbakır"
 TUR_pkk.216.d:0 "After decades of fighting, organized Kurdish resistance has come to an end in the greater Diyarbakır area. The glorious banner of the Turkish state flies higher than ever before, as a new start for the province has renewed hopes for all kinds of peoples living there."
 TUR_pkk.216.a:0 "At long last.."
 TUR_pkk.217.t:0 "[TUR.GetName] Proclaims Victory Over The PKK"
 TUR_pkk.217.d:0 "The [TUR.GetAdjective] government has recently released a statement declaring that all major PKK bases, cells, and hideouts have been cleared out by the [TUR.GetAdjective] Armed Forces (TSK). This announcement has worried Kurdish separatists across the middle east, including [TUR.GetName] itself. The PKK had been active in [TUR.GetName] for a very long time, spanning several decades from its start in the 1970's. The Kurdish group initially hoped to create an independent state in what is the Turkish East, but their movement quickly came down to the want for autonomy rather than total independence. The [TUR.GetAdjective] government had been resilient in the face of such pressure, and it has now reached a point where it can declare victory over the movement."
 TUR_pkk.217.a:0 "Interesting"
 TUR_pkk.600.t:0 "Catastrophic Consequences Following Failure In Delivering Our Promise"
 TUR_pkk.600.d:0 "Our empty promises have now caught up to us. The Kurdish that reside in the east of our state have seized control over Kurdish majority areas. We no longer formally control these territories, with our government being essentially powerless in making an immediate decision as a result of the bureucratic process that we are stuck in."
 TUR_pkk.600.a:0 "Oh no"
 TUR_pkk.601.t:0 "Kurdish Autonomy Referendum Passes"
 TUR_pkk.601.d:0 "The Kurdish independence referendum has passed with an overwhelming majority of Kurds voting in favor of autonomization. With this referendum, the People's Republic of Kurdistan will become an Eyalet of [TUR.GetName]. The Kurdistan Worker's Party will be the ruling authority in the state, and they will be able to field an army, govern the laws and politics of the region, and hold elections as they see fit. We will still retain control over major industrial and economic sectors, but a fraction of the profits will still go to the Kurdish state."
 TUR_pkk.601.a:0 "Okay"
 TurkeyFocusEvents.191.t:0 "Syria gives permission for a buffer zone"
 TurkeyFocusEvents.191.d:0 "The Syrian government has caved into the pressure, and has allowed us to create a buffer zone between our nations borders."
 TurkeyFocusEvents.191.a:0 "Good"
 TurkeyFocusEvents.192.t:0 "Syria does not give permission for a buffer zone"
 TurkeyFocusEvents.192.d:0 "The Syrian government has rejected our request to establish a buffer zone between our states."
 TurkeyFocusEvents.192.a:0 "Well then.."
 TurkeyFocusEvents.36.t:0 "Welsh and Scottish Mafias form their own states!"
 TurkeyFocusEvents.36.d:0 "It appears the Anatolian Syndicate has funded and trained the Scottish and Welsh mafias just right under our nose. We failed to catch on and stop them in a timely manner, and therefore we are now going to have to make a decision.."
 TurkeyFocusEvents.36.a:0 "Our Kingdom is a UNITED one!"
 TurkeyFocusEvents.36.b:0 "It's not worth it"
 TurkeyFocusEvents.37.t:0 "Anatolian Syndicate warns us of Australia"
 TurkeyFocusEvents.37.d:0 "The Anatolian Syndicate are warning us about an incoming attack from the Australians. Obviously this could all be a lie, considering that they are a Mafia state. But there is also a chance they aren't lying.."
 TurkeyFocusEvents.37.a:0 "They can't be lying!"
 TurkeyFocusEvents.37.b:0 "No.. They are obviously lying"
 TurkeyFocusEvents.53.t:0 "Osman V Passes"
 TurkeyFocusEvents.53.d:0 "Terrible news has spread across Konstantiniyye today, as the people learn of the passing of Osman V. Though his death brings great sorrow to the people, Beyezid III will be sure to continue his legacy."
 TurkeyFocusEvents.53.a:0 "The throne shifts"
 TurkeyFocusEvents.54.t:0 "Beyezid III Passes"
 TurkeyFocusEvents.54.d:0 "Sadly today we have learned of the passing of Beyezid III. People are mourning his death on the streets, and sadness has swept the nation. However all hope is not lost, as Dundar I will be coronated shortly after the national mourning period is over, marking the start of his rule."
 TurkeyFocusEvents.54.a:0 "The throne shifts once more.."
 Turkish_mafia.1200.t:0 "PKK Insurgency Eliminated"
 Turkish_mafia.1200.d:0 "Our security forces have completed operations across the Kurdish regions. The PKK's capacity to threaten Turkish territory has been broken and order is being restored."
 Turkish_mafia.1200.a:0 "Our work here is done."
 Turkish_parties.10.t:0 "Only AI should see this"
 Turkish_parties.10.d:0 "AI Only"
 Turkish_parties.10.a:0 "If you see this, please let us know"
 Turkish_parties.11.t:0 "The Rights and Equality Party"
 Turkish_parties.11.d:0 "Retired general Osman Pamukoğlu, celebrated for his command in the southeast and known to his supporters as the 'Legendary Commander', has founded the Hak ve Eşitlik Partisi (HEPAR). The party blends staunch secular Kemalism with a hard line on the Kurdish question, presenting itself as a nationalist alternative untainted by the established parties."
 Turkish_parties.11.a:0 "A new force enters the arena"
 TUR_bulent_ecevit_desc:0 "Bülent Ecevit is a senior politican who has been active in the Turkish political scene since the 1950s. Rising to a leadership in the CHP, he eventually became Prime Minister in 1972, succeeding Ismet Inönü. His government ordered the invasion of Cyprus in 1974, where he gained the nickname 'Conqueror of Cyprus' ('Kıbrıs Fatihi'). Following the military coup of 1980, Ecevit was incarcerated and banned from politics, eventually rejoining the scene in 1987 by taking the chairman position of DSP from his wife Rahsan. Finally in 1999, he regained the position of Prime Minister of Turkey, after his party's popularity soared with the capture of PKK leader Abdullah Öcalan.\n\nEcevit is also an adamant poet and writer, having written many books on both subjects, and translating many poems into Turkish.\n\nEcevit never finished his university degree, making it impossible for him to ever run for President."
 TUR_afrin:0 "Announce Anti-Kurdish Operations in Syria"
 TUR_afrin_desc:0 "Kurdish terrorists go by many names, but that does not mean they do not share the same ideals as each other. The PKK has always been a threat to Turkey and it will remain a threat until it along with it's allies in the YPG, PYD, SDF, et cetera, are destroyed. It starts with Afrin, gather the troops."
 TUR_afrin2:0 "Launch Operation Olive Branch"
 TUR_afrin2_desc:0 "If the Kurds cannot learn to accept their failure and defeat, they will continue to attack Turkey and it's people, and this is where we must draw the line. Olive Branch will put an end to Kurdish terror attacks originating from the YPG held territory of Afrin. The operation is determined to root out and destroy Kurdish terrorists without collateral damage, we must proceed carefully."
 TUR_afrin_d:0 "Turkish Forces Threaten Afrin"
 TUR_afrin_d_desc:0 "The Turkish onslaught of Kurdish people continues. The threat of an invasion of Afrin is real, as the Turkish president [their_country.GetLeader], unsurprisingly branded us as terrorists aligned with the PKK and threatened to strangle us before we could attack Turkish land in a ridiculous terror attack. This is not our way, but we must prepare for an attack immediately!"
 TUR_afrin_d2:0 "Turkish Forces Continue to Advance"
 TUR_afrin_d2_desc:0 "They call it \"Operation Olive Branch\", funny how the saying goes that the olive branch is in offer of peace. The Turks no not the meaning of peace, and their campaign of Kurdish oppression continues against the wrong opponent. Alas, if they want to continue this fight, we shall continue to defend ourselves."
 strenghten_outposts_1:0 "Strengthen Outposts"
 strenghten_outposts_2:0 "Starting up on Strong Outposts"
 strenghten_outposts_3:0 "Critical positions first"
 strenghten_outposts_4:0 "Further Improvements"
 strenghten_outposts_5:0 "Strategic Brilliance"
 strenghten_outposts_6:0 "Success loves preparation"
 doing_counter_terror_op_mil:0 "Conducting another military operation"
 doing_ext_sec:0 "Already conducting a Cross-Border Operation"
 doing_int_sec:0 "Already conducting an Internal Security Sweep"
 airstrike_prepare:0 "Preparing for Air Strikes"
 airstrike_thingy:0 "Conducting Air Strikes"
 internal_preparation_1:0 "Normal Preparations for Internal Operations"
 internal_preparation_1_desc:0 "The fastest and cheapest one. If we pick this, the actual offensive will have a success rate of %40. In terms of cost efficiency, this one is better.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_2:0 "Mediocre Preparations for Internal Operations"
 internal_preparation_2_desc:0 "Normal one. If we pick this, the actual offensive will have a success rate of %50.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_3:0 "Good Preparations for Internal Operations"
 internal_preparation_3_desc:0 "The slowest and most expensive one. If we pick this, the actual offensive will have a success rate of %60. Not cost-efficient but with more guaranteed results.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_security:0 "Internal Operations"
 internal_security_desc:0 "Eastern part of our country has a rough terrain, it holds many deserted villages, castle-like natural valleys filled with caves, narrow passages around mountains that no one lives. This features are so useful for insurgencies and PKK uses it. We need to constantly attack and raze their makeshift bases to reduce their power and hinder their recruitment efforts.\n\nWe can't make cross-border operations and internal operations at the same time."
 external_preparation_1:0 "Normal Preparations for External Operations"
 external_preparation_1_desc:0 "The fastest and cheapest one. If we pick this, the actual offensive will have a success rate of %40. In terms of cost efficiency, this one is better.\n\n§RWe can't make several preparations for a single operation type!§!"
 external_preparation_2:0 "Mediocre Preparations for External Operations"
 external_preparation_2_desc:0 "Normal one. If we pick this, the actual offensive will have a success rate of %50.\n\n§RWe can't make several preparations for a single operation type!§!"
 external_preparation_3:0 "Good Preparations for External Operations"
 external_preparation_3_desc:0 "The slowest and most expensive one. If we pick this, the actual offensive will have a success rate of %60. Not cost-efficient but with more guaranteed results.\n\n§RWe can't make several preparations for a single operation type!§!"
 external_security:0 "Cross-border operations"
 external_security_desc:0 "PKK does not only exist inside our borders, a good portion of their members has bases in Northern Iraq too, to take advantage of the same rough terrain, be somewhat more secure from our military might, control smuggling and for recruitment. We need to attack these positions too, although we may face accusations from foreign powers.\n\nWe can't make cross-border operations and internal operations at the same time."
 prepping_ext:0 "Already planning a cross-border operation"
