 TUR_LOAD_ORDER_WARNING_TITLE:0 "Mod Conflict Detected"
 TUR_LOAD_ORDER_WARNING_TEXT:0 "§R+Turkey's setup for Turkey did not load.§!\n\nAnother mod in your playset replaces Turkey's country history, so Turkey is starting without +Turkey's parties, leaders, national spirits and start-up settings, and its focus trees and events may not work as intended.\n\nUsually this is a second Turkey mod or an overhaul that also changes Turkey. To fix it:\n §Y1.§! Disable the other mod that changes Turkey, or\n §Y2.§! put §Y+Turkey§! below it in your playset (Millennium Dawn stays at the top).\n\nThen start a new game."
