 TUR_LOAD_ORDER_WARNING_TEXT:0 "§RMillennium Dawn is loaded after +Turkey.§!\n\nBecause of this, Millennium Dawn has replaced the focus trees, events and national spirits of +Turkey, and Turkey is playing with Millennium Dawn's default content.\n\nTo fix it, open your playset in the launcher and order the mods like this:\n §Y1. Millennium Dawn: A Modern Day Mod§!\n §Y2. Millenium Dawn +Turkey (MD 2.0 Update)§!\n §Y3. Turkish language pack (if you use it)§!\n\nThen start a new game."
