 TurkeyO.1.desc:0 "Seeing that the Islamists had taken complete control of the country, the Kemalist forces armed themselves and seized several areas. We will restore the country to its former state by clearing the Kemalist forces out of the areas they occupy."
 TurkeyO.1.a:0 "They Wanted War" 
 TurkeyO.2.title:0 "Victory in the Civil War"
 TurkeyO.2.desc:0 "Public order has been fully restored across the country. With this victory, we can build our state with no obstacles in our way."
 TurkeyO.2.a:0 "All Other Factions Have Been Wiped Out" 

