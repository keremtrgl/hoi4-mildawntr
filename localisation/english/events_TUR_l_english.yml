 TurkeyCourt.1.title:0 "The Constitutional Court Calls New Elections"
 TurkeyCourt.1.desc:0 "The Constitutional Court has found the last elections questionable and ordered them to be repeated. A new election date will be set by parliament."
 TurkeyCourt.1.a:0 "The Court Has Made Its Decision"
 TurkeyCourt.2.title:0 "The Constitutional Court Rejects New Elections"
 TurkeyCourt.2.desc:0 "The Constitutional Court has found nothing questionable about the last elections and decided not to repeat them. Parliament will continue its work."
 TurkeyCourt.2.a:0 "The Court Has Made Its Decision"
 TurkeyCourt.3.title:0 "The Constitutional Court Agrees to Investigate the Opposition"
 TurkeyCourt.3.desc:0 "Ruling in favor of the government, the Constitutional Court has placed the opposition under investigation. These investigations will shake confidence in the opposition parties."
 TurkeyCourt.3.a:0 "The Court Has Made Its Decision"
 TurkeyCourt.4.title:0 "The Constitutional Court Refuses to Investigate the Opposition"
 TurkeyCourt.4.desc:0 "Despite pressure from the government's side, the Constitutional Court has decided not to investigate the opposition, sparing the opposition parties a blow to public confidence."
 TurkeyCourt.4.a:0 "The Court Has Made Its Decision"
 TurkeyCourt.5.title:0 "The Constitutional Court Agrees to Investigate the Government"
 TurkeyCourt.5.desc:0 "Ruling in favor of the opposition, the Constitutional Court has placed the government under investigation. These investigations will shake confidence in the ruling or coalition parties."
 TurkeyCourt.5.a:0 "The Court Has Made Its Decision"
 TurkeyCourt.6.title:0 "The Constitutional Court Refuses to Investigate the Government"
 TurkeyCourt.6.desc:0 "Ruling in favor of the government, the Constitutional Court has declined to investigate it, so confidence in the ruling or coalition parties will not be shaken."
 TurkeyCourt.6.a:0 "The Court Has Made Its Decision"
 TurkeyCourt.7.title:0 "The Constitutional Court Raises New Political Questions"
 TurkeyCourt.7.desc:0 "As events unfolded, the Constitutional Court began to become politicized, and its own bureaucracy failed to prevent it."
 TurkeyCourt.7.a:0 "A Politicized Court?"
 TurkeyCourt.8.title:0 "The Constitutional Court Refuses to Raise New Political Questions"
 TurkeyCourt.8.desc:0 "As events unfolded, the Constitutional Court managed to avoid politicization, thanks to its own well-structured bureaucracy."
 TurkeyCourt.8.a:0 "The Court Stands Firm!"

 ####### Turkish Communist Civil War #######
 #TurkeyCo.1.title:0 "Labour Day Celebrations"
 #TurkeyCo.1.desc:0 "May 1 Labor Day was celebrated with rallies and demonstrations held throughout Turkey, especially in Istanbul, Ankara, and Izmir.\n\nOfficial celebrations were held in the Maltepe rally area on May 1 in Istanbul. DISK, KESK, chambers of Turkish engineers and architects (TMMOB), and the Union of Turkish Medical Association (TTB organized under the leadership of, "May 1 labor and Solidarity Day" celebrations unions and non-governmental organizations, as well as the CHP deputies Sezgin Tanrikulu, Gürsel Tekin, Ali Gülay Yedekci Sugar and joined."
 #TurkeyCo.1.a:0 "Nice"
 #TurkeyCo.1.b:0 "Enough! Let's get rid of this!"
 TurkeyCo.2.title:0 "EMEP Backs the Workers"
 TurkeyCo.2.desc:0 "EMEP has announced that it will provide material and moral support to the labor movement if the 1 May Labor Day celebrations are banned."
 TurkeyCo.2.a:0 "Ough..."
 TurkeyCo.3.title:0 "ÖDP Backs the Workers"
 TurkeyCo.3.desc:0 "ÖDP has announced that it will provide material and moral support to the labor movement if the 1 May Labor Day celebrations are banned."
 TurkeyCo.3.a:0 "Ough..."
 TurkeyCo.4.title:0 "TKP Backs the Workers"
 TurkeyCo.4.desc:0 "The TKP has announced that it will provide material and moral support to the labor movement if the 1 May Labor Day celebrations are banned."
 TurkeyCo.4.a:0 "Ough..."
 TurkeyCo.5.title:0 "The TKP-ÖDP-EMEP Rebellion Is Formed"
 TurkeyCo.5.desc:0 "The streets are filling with people, some armed and some not. The police tried and failed to stop the crowds, while armed organizations supplied the communists with equipment. Nationalist groups opposing them began arming themselves alongside the government, and military units were sent in. As violence against the demonstrators grew, so did the resistance, until the insurgents seized areas in the west and set up their own regime. Turkey has been split in two, and civil war has broken out."
 TurkeyCo.5.a:0 "Long Live the Supreme Regime"
 TurkeyCo.6.title:0 "The Communist Congress"
 TurkeyCo.6.desc:0 "After the end of the war, the first extraordinary congress has convened to decide which party will come to power. Which party should it be? The choice is yours."
 TurkeyCo.6.a:0 "ÖDP is the right choice to lead!"
 TurkeyCo.6.b:0 "EMEP is the right choice to lead!"
 TurkeyCo.6.c:0 "Perinçek has the true spirit of a leader!"
 TurkeyCo.6.d:0 "Install the TKP Regime"
 TurkeyCo.7.title:0 "The Great Turkish Revolution"
 TurkeyCo.7.desc:0 "The army of the peoples has united and overthrown the imperialist order once again. We are victorious! Comrades, under the new order the peoples will live happily and justly."
 TurkeyCo.7.a:0 "Victory!"
 TurkeyCo.8.title:0 "The 5th ÖDP Congress"
 TurkeyCo.8.desc:0 "The 5th ÖDP Congress has been held, strengthening the ruling ÖDP."
 TurkeyCo.8.a:0 "Good for the ÖDP"

