 TurkeyF.73.desc:0 "Egypt rejects our offer of alliance to avoid risking its ties with other organizations. This is their loss, let's move on." 
 TurkeyF.73.a:0 "It's Their Loss"
 TurkeyF.74.title:0 "Turkey Demands Our Submission"
 TurkeyF.74.desc:0 "Turkey has massed troops on our borders and demanded our outright surrender. If we refuse, we will face a major war with Turkey. Sir, do we surrender or fight on?" 
 TurkeyF.74.a:0 "We Will Defend Ourselves to the End"
 TurkeyF.74.b:0 "We Have No Chance of Resisting"
 TurkeyF.75.title:0 "Iraq Rejects Our Demands"
 TurkeyF.75.desc:0 "Iraq has announced that it will not surrender. In return, we will declare war on Iraq. Iraqi oil will be ours!" 
 TurkeyF.75.a:0 "Then We Will Invade Them"
 TurkeyF.76.title:0 "Turkey Orchestrates a Coup in Greece"
 TurkeyF.76.desc:0 "The nationalist faction has seized every lever of government in the country. This military coup was clearly organized by Turkey, and the nationalists have become Turkey's puppets. We have lost our freedom!" 
 TurkeyF.76.a:0 "We Have Lost Everything!"
 TurkeyF.77.title:0 "Turkey Asks for Technical Support for Its Nuclear Program"
 TurkeyF.77.desc:0 "The Turkish authorities are expecting our support. If we help, Turkey will acquire nuclear weapons faster; if we don't, it will fall behind on the nuclear front. Sir, should we support them or not?" 
 TurkeyF.77.a:0 "Nonsense, We Won't Give Such Support"
 TurkeyF.77.b:0 "It Is Important to Give Such Support"
 TurkeyF.78.title:0 "Iran Refuses to Help"
 TurkeyF.78.desc:0 "According to feedback from our contacts in Iran, the answer is negative: Iran will not help us. We will have to achieve nuclear armament on our own."
 TurkeyF.78.a:0 "Bad News"
 TurkeyF.79.title:0 "Iran Agrees to Help"
 TurkeyF.79.desc:0 "According to feedback from our contacts in Iran, the answer is positive: Iran will help us. We will now achieve nuclear armament quickly." 
 TurkeyF.79.a:0 "Good to Hear"
 TurkeyF.80.title:0 "Turkey Asks for Technical Support for Its Nuclear Program"
 TurkeyF.80.desc:0 "The Turkish authorities are expecting our support. If we help, Turkey will acquire nuclear weapons faster; if we don't, it will fall behind on the nuclear front. Sir, should we support them or not?" 
 TurkeyF.80.a:0 "Nonsense, We Won't Give Such Support"
 TurkeyF.80.b:0 "It Is Important to Give Such Support"
 TurkeyF.81.title:0 "Russia Refuses to Help"
 TurkeyF.81.desc:0 "According to feedback from our contacts in Russia, the answer is negative: Russia will not help us. We will have to achieve nuclear armament on our own."
 TurkeyF.81.a:0 "Bad News"
 TurkeyF.82.title:0 "Russia Agrees to Help"
 TurkeyF.82.desc:0 "According to feedback from our contacts in Russia, the answer is positive: Russia will help us. We will now achieve nuclear armament quickly." 
 TurkeyF.82.a:0 "Good to Hear"
 TurkeyF.83.title:0 "The First Mafia Council Meeting"
 TurkeyF.83.desc:0 "As expected, all the mafias came together and signed a joint resolution. According to its decisions, the government has become dysfunctional and the mafias must take control of running the country. The mafias are now expected to arm and organize to seize power. Mafia rule is drawing near." 
 TurkeyF.83.a:0 "The Decisions Have Been Made"
 TurkeyF.84.title:0 "The Mafias Take Over the Regime"
 TurkeyF.84.desc:0 "Their preparations complete, the mafias quickly toppled the government with their armed forces and a cyberattack on its networks. The press and the judiciary are in shock, and a heavy air of uncertainty hangs over the country. There is no response from the military either. Time will tell where this country is heading." 
 TurkeyF.84.a:0 "The Civilian Government Is Finished"
 TurkeyF.87.title:0 "The Assassination of the US President"
 TurkeyF.87.desc:0 "The President of the United States was assassinated late last night. Bent on revenge, the United States will throw everything it has at us and wear itself out doing so, which makes invading the United States all the easier for us." 
 TurkeyF.87.a:0 "We're doing fine, keep it up!"
 TurkeyF.88.title:0 "Europe's Religious Communities Under Attack!"
 TurkeyF.88.desc:0 "The mafias have begun hunting down and shooting religious people in the streets, fueling unrest and riots across Europe. There is nothing as vile as these mafias." 
 TurkeyF.88.a:0 "Argh! Damn Mafias!"
 TurkeyF.89.title:0 "Europe Is in Chaos!"
 TurkeyF.89.desc:0 "Europe is in chaos. These mafias have subverted Europe's order and traditions, and they must be destroyed. Otherwise, Europe will lose this war against the mafias amid the chaos." 
 TurkeyF.89.a:0 "It Is Getting Out of Hand"
 TurkeyF.90.title:0 "The United States Is in Chaos!"
 TurkeyF.90.desc:0 "The United States of America is in chaos. These mafias have subverted the order and traditions of the United States, and they must be destroyed. Otherwise, the United States will lose this war against the mafias amid the chaos." 
 TurkeyF.90.a:0 "It Is Getting Out of Hand"
 TurkeyF.91.title:0 "The Question of the Mafia Leader"
 TurkeyF.91.desc:0 "After seizing power, the mafia council has put forward a motion to elect a mafia leader. We can elect a leader through this motion, or ignore it and carry on under the main council." 
 TurkeyF.91.a:0 "Make Sedat Peker the Leader"
 TurkeyF.91.b:0 "Make Kürt İdris the Leader"
 TurkeyF.91.c:0 "Make Alaattin Çakıcı the Leader"
 TurkeyF.91.d:0 "Let's Stay With the Main Council" 
 TurkeyF.92.title:0 "Deals With the MHP"
 TurkeyF.92.desc:0 "A full agreement has been reached with the MHP. The MHP will back the winds of change within the AK Party and help Abdullah Gül replace Recep Tayyip Erdoğan. Long live the Winds of Reform!" 
 TurkeyF.92.a:0 "One Step Closer to Victory"
 TurkeyF.93.title:0 "Deals With the CHP"
 TurkeyF.93.desc:0 "A full agreement has been reached with the CHP. The CHP will back the winds of change within the AK Party and help Abdullah Gül replace Recep Tayyip Erdoğan. Long live the Winds of Reform!" 
 TurkeyF.93.a:0 "One Step Closer to Victory"
 TurkeyF.94.title:0 "The AK Party Calls an Extraordinary Congress"
 TurkeyF.94.desc:0 "AK Party delegates have called for an extraordinary party congress, and a majority voted in favor. The party's leader will be decided at the coming congress. The winds of reform within the AK Party are picking up speed." 
 TurkeyF.94.a:0 "The Start of a Major Development"
 TurkeyF.95.title:0 "Gül Takes Power"
 TurkeyF.95.desc:0 "Abdullah Gül and his liberal wing scored an extraordinary success at the congress, taking the leadership from Recep Tayyip Erdoğan. Gül and his team have now begun preparing to announce the new government." 
 TurkeyF.95.a:0 "A Wise Outcome"
 TurkeyF.96.title:0 "Meetings With the Unions"
 TurkeyF.96.desc:0 "We have held a meeting with union leaders at which the demands of the working class were discussed. In line with their requests, our government will announce a "Labor Package"." 
 TurkeyF.96.a:0 "A Task Has Been Completed"
 TurkeyF.97.title:0 "Meetings With the Parties"
 TurkeyF.97.desc:0 "We have held a meeting with party leaders at which bureaucratic reform, among other matters, was discussed. In line with their requests, our government will announce a "Declaration of Bureaucratic Renewal"." 
 TurkeyF.97.a:0 "A Task Has Been Completed"
 TurkeyF.98.title:0 "Meetings With Barzani"
 TurkeyF.98.desc:0 "Our negotiations with Barzani have produced a common solution: the two sides will support each other against the PKK, and Turkey will grant the Kurds more rights." 
 TurkeyF.98.a:0 "A Fine Peaceful Solution"
 TurkeyF.99.title:0 "The August Protests"
 TurkeyF.99.desc:0 "The growing authoritarianism of the liberal government and its abandonment of its own principles had recently cost the AK Party votes. In August, mass civil disobedience broke out after the government issued a wave of arrest warrants, and protests engulfed the cities. When the police tried to break them up by force, the protests turned violent: Molotov cocktails flew in the streets, and the police retaliated with tear gas canisters. The media openly turned against the government, and in Parliament the opposition made harsh speeches demanding Abdullah Gül's resignation. The leadership must take control quickly, defuse the anger and restore calm." 
 TurkeyF.99.a:0 "Suppress the Riots!"
 TurkeyF.100.title:0 "The August Protests Begin to Calm"
 TurkeyF.100.desc:0 "Things are starting to calm down and the protests have subsided. Our opponents are trying to cast the AK Party as the culprit behind the protests and their toll, but we have quickly put the crisis behind us." 
 TurkeyF.100.a:0 "Good to See"
 TurkeyF.101.title:0 "The Military Coup Attempt Has Failed"
 TurkeyF.101.desc:0 "As the Gülen Movement's influence within the Turkish Armed Forces grew and it gained control of the tanks, the movement took to the streets with weapons to overthrow the state. Tanks surrounded the General Staff and security bases. The people poured into the streets in protest and climbed onto the tanks, and by morning the Gülenist coup attempt had failed. AK Party spokesman Ömer Çelik announced that the so-called "Peace at Home Council" had failed and been crushed." 
 TurkeyF.101.a:0 "A Decisive Victory for the AKP!"
 TurkeyF.102.title:0 "The EU-US Crisis"
 TurkeyF.102.desc:0 "The tension between Turkey and the United States has sparked a crisis between the European Union and America, sending the dollar and the euro into sharp decline. By weathering this crisis alongside the European Union, we will strip the United States of its superpower status." 
 TurkeyF.102.a:0 "We Cannot Back Down Now"
 TurkeyF.103.title:0 "Abandoning the Dollar in Trade?"
 TurkeyF.103.desc:0 "Sir, should we stop using the dollar in trade and the economy? If we do, we will help bring the dollar down." 
 TurkeyF.103.a:0 "Abandon the Dollar"
 TurkeyF.103.b:0 "Stick With the Dollar"
 TurkeyF.104.title:0 "A European Army?"
 TurkeyF.104.desc:0 "Talk of creating a European Union army has been growing lately. Sir, how should we vote on establishing an EU army? If it is created, we will no longer need an alliance like NATO." 
 TurkeyF.104.a:0 "A European Army Should Be Created"
 TurkeyF.104.b:0 "Nonsense"
 TurkeyF.105.title:0 "Expanding European Military Service?"
 TurkeyF.105.desc:0 "There has lately been strong demand for EU countries to boost the strength of their own armies. Sir, how should we respond? Should we strengthen our own army, or hold back, seeing it as an economic mistake?" 
 TurkeyF.105.a:0 "The Military Plays a Vital Role in Every Sector"
 TurkeyF.105.b:0 "The Military Is Just an Economic Burden"
 TurkeyF.106.title:0 "A Unified European Command?"
 TurkeyF.106.desc:0 "A unified command for the European Union has been in strong demand lately. Sir, how should we answer? Shall we join the unified command or not?" 
 TurkeyF.106.a:0 "Yes, of Course"
 TurkeyF.106.b:0 "No, a Unified Command Is Unnecessary"
 TurkeyF.107.title:0 "More European Military Interventionism?"
 TurkeyF.107.desc:0 "There has lately been strong demand for the European Union to intervene in other countries in the name of democracy. Sir, how should we answer? Shall we back the interventions?" 
 TurkeyF.107.a:0 "Go for It"
 TurkeyF.107.b:0 "We Believe in the Rules of Democracy"
 TurkeyF.108.title:0 "Talks with Greta"
 TurkeyF.108.desc:0 "According to our talks with Greta, our ecological record is quite good. With that, we can now move on to the practice of Ecological Imperialism." 
 TurkeyF.108.a:0 "Another Achievement"
 TurkeyF.109.title:0 "Ergenekon Trials"
 TurkeyF.109.desc:0 "The Ergenekon trials were a series of high-profile trials held in Turkey between 2008 and 2016, in which 275 people, including military officers, journalists and opposition MPs, all alleged members of Ergenekon, a suspected secularist clandestine organization, were accused of plotting against the government. Most of the accused received lengthy prison sentences." 
 TurkeyF.109.a:0 "Kemalism Must Not Survive in the Armed Forces"
 TurkeyF.110.title:0 "IBDA-C Overthrows the Interim Government"
 TurkeyF.110.desc:0 "Last evening, the armed forces of IBDA-C took up positions in the streets and seized the supervisory boards, bringing down the interim government. No movement against the IBDA-C coup emerged, as the public largely supports it." 
 TurkeyF.110.a:0 "A New Islamic Age Dawns for the Nation!"
 TurkeyF.111.title:0 "Electing the New Caliph"
 TurkeyF.111.desc:0 "Delegates from Muslim countries gathered and held the first caliphal election, securing Islamic unity. May this new caliphate bring blessings to all Muslim countries." 
 TurkeyF.111.a:0 "Ebu Hanzala Is the Rightful Caliph"
 TurkeyF.111.b:0 "Salih Mirzabeyoğlu Is the Rightful Caliph" 
 TurkeyF.112.title:0 "The Islamic State Threatens Us With Waves of Migrants"
 TurkeyF.112.desc:0 "The Islamic State is openly threatening us: either we stay out of the war and stand aside, or we fight them and suffer a wave of migration. Sir, what is our decision? War or neutrality?" 
 TurkeyF.112.a:0 "What Are They Thinking?"
 TurkeyF.113.title:0 "The Islamic Unification Ultimatum"
 TurkeyF.113.desc:0 "The jihadist Islamic State is urging our country to unite with it. If we refuse, it will declare us enemies and we will be counted on the side of the non-Muslims; if we accept, we will join its cause and wage jihad against the non-Muslims." 
 TurkeyF.113.a:0 "We Should Join the Islamic Cause"
 TurkeyF.113.b:0 "We Must Not Ally With Radical Islamists"
 TurkeyF.114.title:0 "The Umayyads Offer Peace?"
 TurkeyF.114.desc:0 "The war between the Islamic and Christian worlds has reached a stalemate. The new Umayyad, leader of the Islamic side, has sent us a peace offer. Sir, shall we accept it and end this horror?" 
 TurkeyF.114.a:0 "Yes, We Need This Peace"
 TurkeyF.114.b:0 "This War Will Go On to the End!"
 TurkeyF.115.title:0 "The Ottomans Replace the Interim Government"
 TurkeyF.115.desc:0 "As of now, the interim government has become the Ottoman regime. This is the dawn of a new Ottoman era. Guided by the spirit of jihad and ghaza, we will build and strengthen the new Ottoman Empire." 
 TurkeyF.115.a:0 "Long Live the New Ottoman Empire!"
 TurkeyF.116.title:0 "The Death of the Republic"
 TurkeyF.116.desc:0 "The Republic is no more. Now there is an empire and its power. Now we can chart our own course. God bless the state!" 
 TurkeyF.116.a:0 "This Is A New Beginning"
 TurkeyF.117.title:0 "The Coronation of Orhan Osmanoğlu"
 TurkeyF.117.desc:0 "Orhan Osmanoğlu has taken up the crown, long left vacant. We hope our new sultan will succeed in his duties. With the return of the monarchy, the country has cut all ties with the Republic." 
 TurkeyF.117.a:0 "Let's See How the New Leadership Fares"
 TurkeyF.118.title:0 "The Anti-Gülenist Fatwa Is Declared"
 TurkeyF.118.desc:0 "The Islamic ulema have issued an anti-Gülenist fatwa. Thanks to it, we will rid ourselves of this vile organization that trades on religion." 
 TurkeyF.118.a:0 "Good, It's Time to Destroy These Gülenists!"
 TurkeyF.119.title:0 "Declaration of Islamic Jihad"
 TurkeyF.119.desc:0 "The Ottoman Islamic ulema have gathered and called Muslims to jihad. With this call, we will defeat the enemies of the Muslims with ease." 
 TurkeyF.119.a:0 "It's Time for the Final Blow!"
 TurkeyF.120.title:0 "The Ottoman Empire Proposes an Oil-for-Troops Deal"
 TurkeyF.120.desc:0 "Ottoman diplomats have offered our country an oil deal to settle the situation in the Middle East. If we accept, we will reduce our military presence in the region and they will expand their influence there, but in return they will give us oil and bases. If we refuse, I fear we may have to go to war with the Ottoman Empire." 
 TurkeyF.120.a:0 "The Deal Seems Acceptable"
 TurkeyF.120.b:0 "No Concessions Can Be Made in the Middle East"
 TurkeyF.121.title:0 "America Accepts Our Oil-for-Troops Deal"
 TurkeyF.121.desc:0 "America has accepted the oil deal. It will reduce its military presence in the Middle East and we will expand our influence there, while giving them oil and bases in return." 
 TurkeyF.121.a:0 "Good To Hear"
 TurkeyF.122.title:0 "America Rejects Our Oil-for-Troops Deal"
 TurkeyF.122.desc:0 "America has rejected the oil deal. It will not reduce its forces in the Middle East, and we will have to fight America, openly or covertly, to expand our influence there." 
 TurkeyF.122.a:0 "Terrible News"
 TurkeyF.123.title:0 "Armed Neo-Nazis Take Action"
 TurkeyF.123.desc:0 "Neo-Nazis armed by the Ottomans and other powers are opening fire in the streets. They must be stopped immediately; otherwise, power will soon fall into the hands of the monarchists and fascists." 
 TurkeyF.123.a:0 "Arrest These Monsters!"
 TurkeyF.124.title:0 "Waves of Migrants From the Ottomans"
 TurkeyF.124.desc:0 "The Ottoman State has begun openly sending refugees our way. This will stir up the country's radicals and boost their support. We must stop it immediately and take control of our borders." 
 TurkeyF.124.a:0 "Send Troops to the Borders!"
 TurkeyF.125.title:0 "Instability Spreads Across the Country"
 TurkeyF.125.desc:0 "Internal conflicts have now pushed the government toward resignation and the country into instability. It is only a matter of time before our current regime collapses and falls into the hands of the radicals. If we stay strong, we will come through these internal conflicts and intrigues intact." 
 TurkeyF.125.a:0 "Ugh..."
 TurkeyF.126.title:0 "The Ottomans Propose a Crimean Agreement"
 TurkeyF.126.desc:0 "The Ottoman State wants Crimea to become an independent state; in return, it will take a firm line against Ukraine. As the Russian government, how should we answer this offer?" 
 TurkeyF.126.a:0 "These Terms Are Acceptable"
 TurkeyF.126.b:0 "These Terms Are Unacceptable"
 TurkeyF.127.title:0 "Russia Rejects the Ottoman Requests"
 TurkeyF.127.desc:0 "The Russian State has called our proposal absurd and rejected it. As a result, peace in the Black Sea has become shaky." 
 TurkeyF.127.a:0 "Not Good At All"
 TurkeyF.128.title:0 "The Ottomans Demand to Protect Us"
 TurkeyF.128.desc:0 "The Ottoman State believes it must protect us from Russia and has sent us an offer of protection. If we accept, Ottoman troops will enter our territory for defensive purposes; if we refuse, they will attack us." 
 TurkeyF.128.a:0 "We Need Turkish Protection"
 TurkeyF.128.b:0 "We Don't Need Imperialist Protection"
 TurkeyF.129.title:0 "Georgia Rejects Turkish Protection"
 TurkeyF.129.desc:0 "Georgia has rejected the Ottoman offer of protection. In that case, the Ottomans will take Georgia by force in order to "protect" it." 
 TurkeyF.129.a:0 "Then We Will Enter Georgia by Force"
 TurkeyF.130.title:0 "The Ottomans Want to Subjugate Muslim Europe"
 TurkeyF.130.desc:0 "The Ottoman Empire is sending ultimatums to the Muslim states of Europe demanding that they join it. As a Muslim state in Europe, we too must take a stance. Should we side with the Ottomans and join the empire, or begin preparing for war against them?" 
 TurkeyF.130.a:0 "As a Muslim European Nation, We Should Join the Ottomans"
 TurkeyF.130.b:0 "We Are Not the Ottomans' Puppets"
 TurkeyF.131.title:0 "The Ottomans Propose New Central Powers to Germany"
 TurkeyF.131.desc:0 "The Ottoman Empire is calling on Germany to renew their old alliance, aiming to revive old traditions and restore their strength. Sir, how should we respond to the Ottoman request?" 
 TurkeyF.131.a:0 "A Pretty Good Idea"
 TurkeyF.131.b:0 "The Past Is the Past"
 TurkeyF.132.title:0 "Germany Rejects Our Request"
 TurkeyF.132.desc:0 "Germany has rejected our offer, preferring the status quo. It is their loss. We must keep pressing forward abroad." 
 TurkeyF.132.a:0 "They Have Made a Huge Mistake"
 TurkeyF.133.title:0 "Austria Wants to Join the Central Powers"
 TurkeyF.133.desc:0 "Austria wants to join the alliance we have formed with the Ottoman Empire. Accepting could bring back our former glory. Sir, what is our answer?" 
 TurkeyF.133.a:0 "Of Course, Together We Are Stronger"
 TurkeyF.133.b:0 "Austria Is the Enemy of the New Germany!"
 TurkeyF.134.title:0 "Germany Rejects the Austrian Request"
 TurkeyF.134.desc:0 "Germany has rejected our offer of alliance. It is their loss, when we could have reminded the world of our old days together." 
 TurkeyF.134.a:0 "Fine"
 TurkeyF.135.title:0 "The Ottomans Propose a Future Border Agreement"
 TurkeyF.135.desc:0 "It seems that border disputes between Austria and the Ottomans are bound to arise in the future, so we are offering Austria an agreement to settle them in advance." 
 TurkeyF.135.a:0 "The Proposal Would Be Useful"
 TurkeyF.135.b:0 "The Proposal Is Unnecessary"
 TurkeyF.136.title:0 "Austria Accepts the Border Agreement"
 TurkeyF.136.desc:0 "Vienna has accepted Istanbul's offer, declaring that future border disputes will be prevented and, if any arise, resolved peacefully. This is very good news for our country." 
 TurkeyF.136.a:0 "Good News"
 TurkeyF.137.title:0 "Austria Rejects the Border Agreement"
 TurkeyF.137.desc:0 "Vienna has rejected Istanbul's offer and declared that any border disputes, now or in the future, will be settled by force. This is bad news for our country; it seems we cannot get out of this without a war with Austria." 
 TurkeyF.137.a:0 "Fine"
 TurkeyF.138.title:0 "The MHP Tours Turkey"
 TurkeyF.138.desc:0 "The MHP continues its tour of Turkey, presenting plans to solve the country's problems along the way. Our people seem extremely pleased with the rising right-wing party." 
 TurkeyF.138.a:0 "Excellent"
 TurkeyF.139.title:0 "The Right-Wing Front Is Formalized"
 TurkeyF.139.desc:0 "The right-wing front has been established to fight the traitors spawned by communism and the left. United, this front will be our vehicle for development and for a return to our traditions." 
 TurkeyF.139.a:0 "United, We Are Strong"
 TurkeyF.140.title:0 "Building Up the OIC"
 TurkeyF.140.desc:0 "Our President has declared that all Muslims must stand united, announcing that the Organization of Islamic Cooperation will take steps to become more organized and stronger." 
 TurkeyF.140.a:0 "The Outlook Is Good"
 TurkeyF.141.title:0 "Turanist Enlargement Planning"
 TurkeyF.141.desc:0 "We can now strengthen and enlarge our country along Turkist lines by pursuing expansion in the name of Turkishness. We believe this will end well." 
 TurkeyF.141.a:0 "Nihal Atsız Was Right About Expansionism!"
 TurkeyF.142.title:0 "Islamic Enlargement Planning"
 TurkeyF.142.desc:0 "We will expand our country in the name of spreading Islam. With this expansion, the lands around us and those we conquer will become Muslim for good." 
 TurkeyF.142.a:0 "For the Power of Jihad!"
 TurkeyF.143.title:0 "The Founding of the Organization of Islamic Cooperation Front"
 TurkeyF.143.desc:0 "The Organization of Islamic Cooperation is becoming a united front. As a front, it will make us a much stronger state and keep our enemies out of our region." 
 TurkeyF.143.a:0 "It's Time for a New Power to Rise!"
 TurkeyF.144.title:0 "Talks With the Turkic Union Countries"
 TurkeyF.144.desc:0 "A dozen rounds of talks have been held to bring the Turkic Union closer to the Organization of Islamic Cooperation. These negotiations will pave the way for a great union in the future." 
 TurkeyF.144.a:0 "Sounds Good"
 TurkeyF.145.title:0 "Talks With the Islamic Countries"
 TurkeyF.145.desc:0 "A dozen rounds of talks have been held to bring the Organization of Islamic Cooperation closer to the Turkic Union. These negotiations will pave the way for a great union in the future." 
 TurkeyF.145.a:0 "Sounds Good"
 TurkeyF.146.title:0 "Turkey Invites Us to Invade Iran"
 TurkeyF.146.desc:0 "Turkey is inviting us to join a war against Iran. If we take part, we could gain a great deal and contribute to the Turkic Union." 
 TurkeyF.146.a:0 "Let's Finish Off the Iranians"
 TurkeyF.146.b:0 "We Don't Need to Take Risks"
 TurkeyF.147.title:0 "Turkmenistan Rejects Our Invitation"
 TurkeyF.147.desc:0 "Turkmenistan has declared that it will stay out of the war and remain neutral. This declaration will surely hurt the Turkic Union." 
 TurkeyF.147.a:0 "Well Then"
 TurkeyF.148.title:0 "The Organization of Islamic Cooperation Becomes an Alliance"
 TurkeyF.148.desc:0 "The Organization of Islamic Cooperation has now become a full alliance. Its continuation will surely please everyone, and we are now a center of power against NATO and other alliances." 
 TurkeyF.148.a:0 "Pure Perfection!"
 TurkeyF.148.b:0 "Leave This Organization Immediately"
 TurkeyF.149.title:0 "Our People Are Angry About East-West Inequality"
 TurkeyF.149.desc:0 "Our people are asking themselves: why are we less developed than Western Europe? Because the European Union and democracy exist only to serve the West, they answer. This sentiment is fueling growing ideological mobilization." 
 TurkeyF.149.a:0 "How Depressing"
 TurkeyF.150.title:0 "Nationalists Want Change"
 TurkeyF.150.desc:0 "Nationalists across Europe are restless: they reject the status quo and want no part of the current system. This is a crisis! We must find a way through it!" 
 TurkeyF.150.a:0 "It's What They Want"
 TurkeyF.151.title:0 "Balkan Nationalists Turn Against the European Union"
 TurkeyF.151.desc:0 "Classic nationalists in the Balkans are turning against the European Union and similar international organizations. Balkan politicians, with funding from an unknown source, are pushing for change." 
 TurkeyF.151.a:0 "Nationalism Lives On..."
 TurkeyF.152.title:0 "Neo-Nazis Are Tired of the State's Ineffectiveness"
 TurkeyF.152.desc:0 "Fed up with Germany's weakness and powerlessness, neo-Nazis are now protesting and demonstrating in the streets. Tension and unrest in the country are rising." 
 TurkeyF.152.a:0 "We Must Deal With These Fascists!"
 TurkeyF.153.title:0 "Talks Between the Turkic and Islamic States"
 TurkeyF.153.desc:0 "The Turkic Union and the states of the Organization of Islamic Cooperation have met to discuss their common ground and their differences. These talks could pave the way for the two to unite in the future." 
 TurkeyF.153.a:0 "Keep It Up!"
 TurkeyF.154.title:0 "The Islamization of the Turkic Union"
 TurkeyF.154.desc:0 "Efforts to Islamize the Turkic Union have come to light. As a member of the Turkic Union, we are being subjected to this Islamization policy." 
 TurkeyF.154.a:0 "A Radical Movement"
 TurkeyF.155.title:0 "The Merger of Two Powers"
 TurkeyF.155.desc:0 "Successful talks between the Turkic Union and the Organization of Islamic Cooperation have brought them to the point of unification. Should we pull out of this merger, or commit to becoming one union?" 
 TurkeyF.155.a:0 "Hooray!"
 TurkeyF.155.b:0 "The Merger Sounds Terrible!"
 TurkeyF.156.title:0 "Turkey Backs the Turks in Germany"
 TurkeyF.156.desc:0 "There are many Turks in Germany, and Turkey is determined to protect them. Its support will raise their standing." 
 TurkeyF.156.a:0 "Horrifying!"
 TurkeyF.157.title:0 "Turkey Encourages Turks in France to Move to Germany"
 TurkeyF.157.desc:0 "Turkey will support the migration of Turks from France to Germany. As the Turkish share of Germany's population grows, Germany will become a Turkish state. As France, we must take action." 
 TurkeyF.157.a:0 "Poor Germans..."
 TurkeyF.158.title:0 "Turkey Backs the Turks in France"
 TurkeyF.158.desc:0 "There is a sizable Turkish community in France, and Turkey is determined to protect it. Its support will raise their standing." 
 TurkeyF.158.a:0 "Horrifying!"
 TurkeyF.160.title:0 "The Rapid Unification of the Turkic Union"
 TurkeyF.160.desc:0 "The Turkic Union has entered the unification process in a short time, thanks above all to the effectiveness of the nationalists." 
 TurkeyF.160.a:0 "We Have Done It!" 
 TurkeyF.163.title:0 "A Call for Ecology in the United States"
 TurkeyF.163.desc:0 "The American people say our country is not environmentally minded. If we are not environmentalists, then who is? Down with those clowns!" 
 TurkeyF.163.a:0 "Kick Them Out!" 
 TurkeyF.164.title:0 "A Call for Ecology in China"
 TurkeyF.164.desc:0 "The Chinese people say our country is not environmentally minded. If we are not environmentalists, then who is? Down with those clowns!" 
 TurkeyF.164.a:0 "Kick Them Out!" 
 TurkeyF.165.title:0 "Green Anarchists Take the Lead at the UN"
 TurkeyF.165.desc:0 "Green anarchists have become the leaders of the United Nations. An interesting development: environmentalist pressure looks set to grow." 
 TurkeyF.165.a:0 "For a Safer World" 
 TurkeyF.166.title:0 "An Invitation to Greta"
 TurkeyF.166.desc:0 "We have invited Greta to our country to lead our climate projects. Naturally, a champion of the green cause like Greta will boost our achievements." 
 TurkeyF.166.a:0 "Time to Save Ecology!" 
 TurkeyF.167.title:0 "A European Ceasefire"
 TurkeyF.167.desc:0 "The anarchists want a ceasefire with the European Union. We must decide how to respond. Shall we accept it, or keep fighting?" 
 TurkeyF.167.a:0 "Sounds Good" 
 TurkeyF.167.b:0 "Sounds Bad" 
 TurkeyF.168.title:0 "Climate Meetings"
 TurkeyF.168.desc:0 "Climate meetings were held, at which factories and the use of coal were named as factors harming the climate. The meeting will pave the way for tougher climate policies in the future." 
 TurkeyF.168.a:0 "The Climate Must Be Protected" 
 TurkeyF.169.title:0 "The Anarchists Urge Us to Unify the EU"
 TurkeyF.169.desc:0 "The anarchists are pressing us to build a united European Union. Should we speed up along the European Union path, or keep moving slowly?" 
 TurkeyF.169.a:0 "Yes, We Need This" 
 TurkeyF.169.b:0 "It's Simply Unnecessary" 
 TurkeyF.170.title:0 "An Ecologist Vision for the EU"
 TurkeyF.170.desc:0 "We are now preparing for an ecological Europe. With this vision, we will save our carrots, our trees, in short, our nature. This rescue will be a lesson to the world." 
 TurkeyF.170.a:0 "A Better Ecology for Our Children" 
 TurkeyF.171.title:0 "The General Communist Military Congress"
 TurkeyF.171.desc:0 "The members of the government have been sent into exile, and power has passed entirely to the communists. Since then, rifts have opened between the communist parties over which of them should rule Turkey. The TKP leaders say they are the true communists, the ÖDP leaders say they are the true populists, the EMEP leaders say they alone will bring the real revolution, and the VATAN leaders say they will build the real state. Sir, which faction should the communist army bring to power? The choice is yours." 
 TurkeyF.171.a:0 "TKP Is The Right Side!" 
 TurkeyF.171.b:0 "EMEP Is the Strongest!" 
 TurkeyF.171.c:0 "ÖDP Is the Realistic Choice!" 
 TurkeyF.171.d:0 "VATAN Has the True Vision!" 
 TurkeyF.172.title:0 "An Invitation From Turkey"
 TurkeyF.172.desc:0 "We have received an offer from the Turks, who want to build an alliance that will change the balance of power, founded on peace and economic cooperation. Sir, how should we respond?" 
 TurkeyF.172.a:0 "We Are Stronger Together" 
 TurkeyF.172.b:0 "We Really Don't Need This"
 TurkeyF.173.title:0 "Greece Rejects Our Offer"
 TurkeyF.173.desc:0 "Greece has announced that it rejects our offer. We will have to walk this path alone!" 
 TurkeyF.173.a:0 "Damn" 
 TurkeyF.174.title:0 "An Invitation From Turkey"
 TurkeyF.174.desc:0 "We have received an offer from the Turks, who want to build an alliance that will change the balance of power, founded on peace and economic cooperation. Sir, how should we respond?" 
 TurkeyF.174.a:0 "We Are Stronger Together" 
 TurkeyF.174.b:0 "We Really Don't Need This"
 TurkeyF.175.title:0 "Syria Rejects Our Offer"
 TurkeyF.175.desc:0 "Syria has announced that it rejects our offer. We will have to walk this path alone!" 
 TurkeyF.175.a:0 "Damn" 
 TurkeyF.176.title:0 "An Invitation From Turkey"
 TurkeyF.176.desc:0 "We have received an offer from the Turks, who want to build an alliance that will change the balance of power, founded on peace and economic cooperation. Sir, how should we respond?" 
 TurkeyF.176.a:0 "We Are Stronger Together" 
 TurkeyF.176.b:0 "We Really Don't Need This" 
 TurkeyF.177.title:0 "Bulgaria Rejects Our Offer"
 TurkeyF.177.desc:0 "Bulgaria has announced that it rejects our offer. We will have to walk this path alone!" 
 TurkeyF.177.a:0 "Damn" 
 TurkeyF.178.title:0 "An Invitation From Turkey"
 TurkeyF.178.desc:0 "We have received an offer from the Turks, who want to build an alliance that will change the balance of power, founded on peace and economic cooperation. Sir, how should we respond?" 
 TurkeyF.178.a:0 "We Are Stronger Together" 
 TurkeyF.178.b:0 "We Really Don't Need This" 
 TurkeyF.179.title:0 "Iraq Rejects Our Offer"
 TurkeyF.179.desc:0 "Iraq has announced that it rejects our offer. We will have to walk this path alone!" 
 TurkeyF.179.a:0 "Damn" 
 TurkeyF.180.title:0 "The United Front"
 TurkeyF.180.desc:0 "The secretary of our communist party has returned from communist Turkey and made an announcement: "We must now stand as one body against these capitalist ambitions! If capitalism will not stop, we will stop it! Long live the anti-capitalists!"" 
 TurkeyF.180.a:0 "Meh, Sounds So-So" 
 TurkeyF.181.title:0 "The EMEP's Coup Attempt Has Failed"
 TurkeyF.181.desc:0 "Angered by the TKP's victory, EMEP members called on their own militias to stage a coup against the TKP. In the evening, EMEP militias launched a planned attack on military facilities in Ankara and Istanbul. The next day, the strong patriotic TKP militia took to the streets and opened fire on the EMEP forces. A curfew was declared, and the fighting lasted three days, at the end of which the EMEP's forces began to break up and surrender, and its main army collapsed. The coup may have been repelled, but EMEP gunmen are still causing havoc. We must wipe out this new terrorist organization!" 
 TurkeyF.181.a:0 "Traitors!" 
 TurkeyF.182.title:0 "Communist Agitation in Our Country"
 TurkeyF.182.desc:0 "The communists are on the rise, aiming to bring a new communist government to power. If we don't defeat them in the next election, they may well take over." 
 TurkeyF.182.a:0 "That Doesn't Sound Good" 
 TurkeyF.183.title:0 "Communist Agitation in Our Country"
 TurkeyF.183.desc:0 "The communists are on the rise, aiming to bring a new communist government to power. If we don't defeat them in the next election, they may well take over." 
 TurkeyF.183.a:0 "That Doesn't Sound Good" 
 TurkeyF.184.title:0 "A United Communist Call"
 TurkeyF.184.desc:0 "The secretary of our communist party has returned from communist Turkey and made an announcement: "We must now stand as one body against these capitalist ambitions! If capitalism will not stop, we will stop it! Long live the anti-capitalists!"" 
 TurkeyF.184.a:0 "Meh, Sounds So-So" 
 TurkeyF.185.title:0 "Turkey Proposes Peace"
 TurkeyF.185.desc:0 "The conflict with the Turks has been bloody, and now they are offering us peace: if we leave the Caucasus alone, they will leave the war and withdraw from the territories. Sir, how should we respond to such a proposal?" 
 TurkeyF.185.a:0 "Fine, We Will Withdraw" 
 TurkeyF.185.b:0 "We Will Keep Fighting" 
 TurkeyF.186.title:0 "Russia Rejects Our Peace Proposal"
 TurkeyF.186.desc:0 "Russia has harshly rejected our peace offer. As a result, we will fight on, to the very end..." 
 TurkeyF.186.a:0 "The Fighting Continues..." 
 TurkeyF.187.title:0 "A Violent Coup!"
 TurkeyF.187.desc:0 "The Gülenist problem, left unchecked for too long, has grown until the Gülenists finally took to the streets with their weapons to overthrow the constitutional order. Despite heavy losses, the Gülenist organization managed to topple the government. A civil war is expected to follow this change of power." 
 TurkeyF.187.a:0 "May Heaven Help Us!" 
 TurkeyF.189.title:0 "Turkey Pushes Us Away From the EU"
 TurkeyF.189.desc:0 "Turkey is pushing us to turn away from Europe and embrace Turkic ties and values. Will we allow this, or hold firm to our pro-European stance?" 
 TurkeyF.189.a:0 "Never, We Will Stick With Our Ties" 
 TurkeyF.189.b:0 "Maybe It's Time to Leave the EU" 
 TurkeyF.190.title:0 "A Turkish Partnership Offer"
 TurkeyF.190.desc:0 "Turkey wants to ally with us. Should we accept and strengthen our Turkic ties, or reject it and keep our pro-European stance?" 
 TurkeyF.190.a:0 "This Is What We Have Been Waiting For!" 
 TurkeyF.190.b:0 "No, This Is Unnecessary" 
 TurkeyF.191.title:0 "Hungary Rejects the Offer"
 TurkeyF.191.desc:0 "Hungary has rejected our offer. We could not extend our Turkic ties to distant lands, and Turkic-Hun cooperation may stall in the future." 
 TurkeyF.191.a:0 "Sounds Bad" 
 TurkeyF.192.title:0 "Hungary Accepts the Offer"
 TurkeyF.192.desc:0 "Hungary has accepted our offer. We have successfully extended our Turkic ties to distant lands, and Turkic peoples can now unite in peace." 
 TurkeyF.192.a:0 "Sounds Good" 
 TurkeyF.193.title:0 "European Adaptation, Chapter 1"
 TurkeyF.193.desc:0 "We have completed the first chapter of Turkey's integration with the European Union and are now halfway through the accession process. Wait for us, European Union!" 
 TurkeyF.193.a:0 "Good!" 
 TurkeyF.194.title:0 "European Adaptation, Chapter 2"
 TurkeyF.194.desc:0 "We have completed the second chapter of Turkey's integration with the European Union, and with it the accession process. A new beginning awaits Turkey!" 
 TurkeyF.194.a:0 "For European Membership!" 
 TurkeyF.195.title:0 "NATO-Georgia Integration"
 TurkeyF.195.desc:0 "Foreseeing that Russia's rapid rearmament could lead to an armed attack on Georgia, NATO forces will jointly support Georgia's defense." 
 TurkeyF.195.a:0 "United Against Russian Imperialism" 
 TurkeyF.196.title:0 "Transcaucasian Oil Deal"
 TurkeyF.196.desc:0 "Oil refineries are to be opened in the Caucasus with Turkish financing. Our government is very pleased, and our oil output will soon rise to high levels." 
 TurkeyF.196.a:0 "Time to Make More Profit" 
 TurkeyF.197.title:0 "The Court Ends Its First Term"
 TurkeyF.197.desc:0 "The Court has completed its first term. Changes will now begin within the Court as it renews its system, bringing order to our political development and stability." 
 TurkeyF.197.a:0 "The Court Has Made Its Decision" 
 TurkeyF.198.title:0 "The Court Ends Its Second Term"
 TurkeyF.198.desc:0 "The Court has completed its second term. Changes will now begin within the Court as it renews its system, bringing order to our political development and stability." 
 TurkeyF.198.a:0 "The Court Has Made Its Decision" 
 TurkeyF.199.title:0 "The Court Ends Its Third Term"
 TurkeyF.199.desc:0 "The Court has completed its third term. Changes will now begin within the Court as it renews its system, bringing order to our political development and stability." 
 TurkeyF.199.a:0 "The Court Has Made Its Decision" 
 TurkeyF.201.title:0 "A Turkish-European Brotherhood"
 TurkeyF.201.desc:0 "The eastern member states of the European Union have drawn closer to Turkey, which wants to act jointly with them. We must decide what to do about it." 
 TurkeyF.201.a:0 "We Need Cooperation" 
 TurkeyF.201.b:0 "Bah! Who Needs the Turks?" 
 TurkeyF.200.title:0 "The Court Takes Over"
 TurkeyF.200.desc:0 "Amid the turmoil, the Constitutional Court has overthrown the government and become the government itself, quickly dividing itself into departments. The administration set up by the Court will be led by Ahmet Necdet Sezer, an experienced figure who previously served as President of Turkey." 
 TurkeyF.200.a:0 "Justice Was Needed" 
 TurkeyF.202.title:0 "The Military Drama"
 TurkeyF.202.desc:0 "The Turkish Armed Forces are deeply uneasy about the politicization of the Constitutional Court and want the Court to put its house in order. How we respond will decide our fate." 
 TurkeyF.202.a:0 "The Military Is Right! Okay?" 
 TurkeyF.202.b:0 "The Military Must Not Be Able to Intervene" 
 TurkeyF.203.title:0 "Strange Sounds From Atatürk's Mausoleum"
 TurkeyF.203.desc:0 "Strange sounds have begun coming from Atatürk's tomb, and an investigation will be opened. There is public unrest over the possibility that the tomb may have been damaged."
 TurkeyF.203.a:0 "Anıtkabir Must Be Under Attack!"
 TurkeyF.204.title:0 "Anıtkabir Under Investigation"
 TurkeyF.204.desc:0 "The investigation team we sent has damaged the historic monuments around the site. Worse still, Atatürk's body was not found in the tomb. Domestic unrest is growing, and so is the risk of the military taking matters into its own hands. We must get to the bottom of this, or it could be the end of us."
 TurkeyF.204.a:0 "Search Everywhere"
 TurkeyF.205.title:0 "Atatürk! He Is Back!"
 TurkeyF.205.desc:0 "A taxi driver claimed to have seen Atatürk himself near Anıtkabir. A search of the area followed, and camera footage showed someone resembling Atatürk walking by. The next day, a man who looked exactly like Atatürk was found at the gate of Atatürk Forest Farm, and his claim to be Atatürk turned out to be true. The spot where he was found turned into a rally, guards were reinforced and Atatürk was escorted away. The following day he went to the CHP headquarters, which announced: "Atatürk is alive!" Most people did not believe it and called the CHP liars, while some religious circles were alarmed and the tariqas grew uneasy."
 TurkeyF.205.a:0 "Impossible!"
 TurkeyF.206.title:0 "Atatürk Returns to Politics"
 TurkeyF.206.desc:0 "Although some still refuse to accept it, Atatürk's return to life is now official. After presenting his bill to reform the CHP, Atatürk announced that he would enter politics. He is expected to become CHP leader soon, and a change of cadres within the party is also possible."
 TurkeyF.206.a:0 "Here We Go!"
 TurkeyF.207.title:0 "Atatürk Elected Supreme President"
 TurkeyF.207.desc:0 "Atatürk has been elected President of the country and is expected to overhaul every kind of system. This spirit of change will surely benefit our country."
 TurkeyF.207.a:0 "As Expected"
 TurkeyF.208.title:0 "Turkey Demands Batumi"
 TurkeyF.208.desc:0 "In pursuit of its National Pact (Misak-ı Millî) goals, Turkey wants Batumi, a Georgian land. Sir, refusing could lead to war; we must think carefully."
 TurkeyF.208.a:0 "No, We Stand Our Ground"
 TurkeyF.208.b:0 "Yes, We Cannot Risk Our Relations"
 TurkeyF.209.title:0 "Turkey Presses for Recognition of Northern Cyprus"
 TurkeyF.209.desc:0 "Turkey is pressing for the recognition of Northern Cyprus. Sir, should Northern Cyprus be recognized or not? The choice is yours."
 TurkeyF.209.a:0 "We Will Think About It"
 TurkeyF.210.title:0 "The Question of a Modern Saadabad"
 TurkeyF.210.desc:0 "The Turks want to draw up a peace accord with us to restore stability in the region. Should we reject it and keep our belligerent stance, or end our hostility for the sake of regional stability and peace?"
 TurkeyF.210.a:0 "Let's Restore It"
 TurkeyF.210.b:0 "It Doesn't Need to Be Restored"
 TurkeyF.211.title:0 "The Question of a Kurdish Referendum"
 TurkeyF.211.desc:0 "Our country launched Kurdish federalization and has carried it through successfully. Kurds can now speak their language freely, and Kurdish cities are called by their Kurdish names. Through this federalization, we won over the people of eastern Anatolia and destroyed the PKK. We want to repeat this success in the Northern Iraqi region, so we have sent them a draft referendum."
 TurkeyF.211.a:0 "Let's Make This Deal"
 TurkeyF.212.title:0 "A Referendum Offered by Turkey"
 TurkeyF.212.desc:0 "Turkey is inviting us to hold a referendum on annexing the Kurdish region to Turkey. If we refuse, they will do nothing about it, as they are committed to democratic means. Sir, what shall we tell these Turks?"
 TurkeyF.212.a:0 "Acceptable"
 TurkeyF.212.b:0 "Long Live the Kurdish Nation!"
 TurkeyF.213.title:0 "An Answer From Northern Kurdistan"
 TurkeyF.213.desc:0 "The Kurdish people have rejected our referendum; they do not want to live in a welfare state like Turkey. We will carry on living alongside the Kurds of Eastern Anatolia."
 TurkeyF.213.a:0 "Damn"
 TurkeyF.214.title:0 "Sanctions Over Gülen?"
 TurkeyF.214.desc:0 "Fethullah Gülen, who lived in our country and had been declared a terrorist by Turkey, has been assassinated. Our intelligence agencies believe the Turkish government was behind it. Should we impose sanctions on Turkey for targeting residents on US soil?"
 TurkeyF.214.a:0 "Issue Sanctions"
 TurkeyF.214.b:0 "Refrain From Any Sanctions"
 TurkeyF.215.title:0 "The American Reaction"
 TurkeyF.215.desc:0 "The United States has discovered that we assassinated Fethullah Gülen and has decided to impose sanctions. This could damage our economy; we must be prepared."
 TurkeyF.215.a:0 "We Must Prepare for This!"
 TurkeyF.216.title:0 "The HP Announces a Bold Bid for Political Opportunities in Turkey"
 TurkeyF.216.desc:0 "In a surprising development, the People's Party (HP) of Northern Cyprus has revealed plans to seek new avenues of political participation in neighboring Turkey, after struggling to win parliamentary representation at home. The party wants to bring technocratic thinking to our country. Should we allow it?"
 TurkeyF.216.a:0 "The HP Should Be Supported"
 TurkeyF.216.b:0 "No, Keep Them From Gaining Power"
 TurkeyF.217.title:0 "The HP Expands Its Horizons Into Turkish Politics"
 TurkeyF.217.desc:0 "At the official inauguration ceremony in Istanbul, HP chairman Mustafa Akıncı stressed the importance of the occasion: "Today marks a historic milestone for our party and the people we represent. By establishing our presence in Turkey, we aim to bridge divides and promote dialogue, fostering a stronger sense of unity between our two nations. Our principles and our dedication to serving the public remain steadfast, and we believe this expansion will create valuable opportunities for cooperation and progress." Political analysts have praised the move, seeing potential for constructive exchanges and mutual benefit between the HP and Turkish political actors. The party's agenda of social inclusion, economic prosperity and sustainable development resonates with many of Turkey's progressive groups. As it opens a new chapter in its political journey, the HP remains committed to following all relevant legal and regulatory procedures in Turkey, and its representatives have begun talks with the Turkish authorities to ensure full compliance with the country's political rules."
 TurkeyF.217.a:0 "Very Interesting"
 TurkeyF.218.title:0 "Renowned Leader Kemal Derviş Joins the Technocratic HP as It Expands Into Turkey"
 TurkeyF.218.desc:0 "In a significant political development, the Technocratic Party, also known as Halkın Partisi (HP), has officially launched its operations in Turkey, accompanied by the high-profile addition of Kemal Derviş to its ranks. Derviş, a respected political figure and former prominent member of the Republican People's Party (CHP), announced his decision to join the HP, citing his alignment with the party's vision of progressive governance and forward-looking policies.\n\nThe launch of the HP's Turkish branch was marked by a grand ceremony in Ankara, where party officials and supporters gathered for the occasion. HP chairman Ali Demir thanked Turkish citizens for their warm welcome and pledged to contribute positively to Turkey's political landscape.\n\n"We believe in the power of technocracy and evidence-based policy to drive sustainable development and social progress. By establishing the HP in Turkey, we aim to bring fresh perspectives to political debate and to work with like-minded individuals and parties," Chairman Demir declared.\n\nThe highlight of the event came when Kemal Derviş, a seasoned economist and diplomat who had served as Turkey's Minister of State for the Economy and later as Administrator of the United Nations Development Programme, officially joined the party. Derviş had been an influential figure in the CHP, but he said his decision to switch was driven by his belief in the HP's pragmatic approach to governance and its emphasis on expertise-driven solutions.\n\nIn a statement to the press, Derviş said: "I have always been committed to the values of progressive politics, evidence-based decision-making and practical solutions to complex challenges. The HP's dedication to technocracy and its desire to bring together experts from many fields to tackle society's problems deeply resonated with me. I am thrilled to begin this new chapter with the HP and help shape a brighter future for Turkey.""
 TurkeyF.218.a:0 "An Unexpected Move From Kemal Derviş"
 TurkeyF.219.title:0 "Renowned Leader Kemal Derviş Joins the Technocratic HP as It Expands Into Turkey"
 TurkeyF.219.desc:0 "In a significant political development, the Technocratic Party, also known as Halkın Partisi (HP), has officially launched its operations in Turkey, accompanied by the high-profile addition of Kemal Derviş to its ranks. Derviş, a respected political figure and former prominent member of the Republican People's Party (CHP), announced his decision to join the HP, citing his alignment with the party's vision of progressive governance and forward-looking policies.\n\nThe launch of the HP's Turkish branch was marked by a grand ceremony in Ankara, where party officials and supporters gathered for the occasion. HP chairman Ali Demir thanked Turkish citizens for their warm welcome and pledged to contribute positively to Turkey's political landscape.\n\n"We believe in the power of technocracy and evidence-based policy to drive sustainable development and social progress. By establishing the HP in Turkey, we aim to bring fresh perspectives to political debate and to work with like-minded individuals and parties," Chairman Demir declared.\n\nThe highlight of the event came when Kemal Derviş, a seasoned economist and diplomat who had served as Turkey's Minister of State for the Economy and later as Administrator of the United Nations Development Programme, officially joined the party. Derviş had been an influential figure in the CHP, but he said his decision to switch was driven by his belief in the HP's pragmatic approach to governance and its emphasis on expertise-driven solutions.\n\nIn a statement to the press, Derviş said: "I have always been committed to the values of progressive politics, evidence-based decision-making and practical solutions to complex challenges. The HP's dedication to technocracy and its desire to bring together experts from many fields to tackle society's problems deeply resonated with me. I am thrilled to begin this new chapter with the HP and help shape a brighter future for Turkey.""
 TurkeyF.219.a:0 "Long Live Kudret Özersay"
 TurkeyF.219.b:0 "We Will Move Forward With Kemal Derviş"
 TurkeyF.220.title:0 "The HP's Technocratic Referendum Triumphs"
 TurkeyF.220.desc:0 "In a momentous turn of events, the Technocratic Party, also known as Halkın Partisi (HP), has won a resounding victory in Turkey's technocratic referendum, despite fierce opposition from the Nationalist Movement Party (MHP) and the Justice and Development Party (AKP). The referendum, held to gauge public support for a technocratic system of government, drew strong backing from Kemalist democrats and the Kurdish community.\n\nAmid an atmosphere of political fervor, Turkish citizens turned out to vote on the technocratic model put forward by the HP. It was the first referendum of its kind in Turkey, reflecting growing demand for evidence-based, expert-driven policies to tackle the nation's challenges.\n\nFrom the outset, the referendum faced strong opposition from the MHP and the AKP, which publicly criticized technocracy as a threat to Turkey's traditional political values, citing concerns that grassroots voices would be marginalized and that the country would drift away from representative democracy.\n\nDespite these hurdles, the HP's visionary approach won broad support across society. Kemalist democrats, who value Turkey's secular heritage and modernizing principles, saw the referendum as a chance to introduce pragmatic reforms, while the Kurdish community, long seeking greater inclusion and recognition of its cultural rights, embraced a system of government that could prioritize equitable development.\n\nAs the results were announced, jubilant celebrations broke out among HP supporters across the country. Preliminary data showed a majority in favor of the technocratic model, a clear mandate for change. HP chairman Ali Demir thanked all supporters and reaffirmed the party's commitment to a more transparent, efficient and inclusive government.\n\nMHP and AKP leaders, for their part, voiced disappointment but accepted the democratic process, vowing to keep promoting their ideologies while respecting the outcome.\n\nKemal Derviş, who played a pivotal role in the HP's campaign, thanked the Kemalist democrats and the Kurdish community for their support: "Today we have taken a major step toward a more accountable and effective government. The results show the power of cooperation and the desire for innovation in our political system. We will honor the trust placed in us and work tirelessly to implement evidence-based policies that serve all citizens."\n\nThe outcome has left political analysts speculating about its impact on Turkey's future. The HP's triumph has not only established technocracy as a viable political model but also reshaped the political landscape by uniting diverse parts of society around a shared vision of progress.\n\nWith this historic victory, the HP has become a key player in shaping Turkey's political course, and its commitment to technocratic principles will surely be tested in the days ahead. As Turkey embraces this new era of governance, the world is watching closely to see how evidence-based decision-making will drive the nation forward."
 TurkeyF.220.a:0 "Victory!"
 TurkeyF.221.title:0 "The Technocratic Pains"
 TurkeyF.221.desc:0 "In a surprising turn of events, the Technocratic Party, also known as Halkın Partisi (HP), has won the technocratic referendum in Turkey. Yet despite the victory, its aftermath has brought serious challenges and divisions within Turkish society.\n\nThe referendum, held to gauge public support for a technocratic model of government, saw the HP's campaign resonate with a large part of the electorate, leading to its success. The promise of evidence-based policies and streamlined decision-making captured the imagination of many citizens weary of traditional politics."
 TurkeyF.221.a:0 "Agh!"
 TurkeyF.222.title:0 "The Economist Group Wins the Internal Election"
 TurkeyF.222.desc:0 "As the contest within the People's Party reached its peak, the "Economist Group" emerged as the clear winner, backed by a large majority of the party. Its decisive win highlighted the growing influence of its members, who share a common vision and expertise in economics and policy-making, and sparked debate and excitement within the party and across the political landscape. As the leadership weighed the implications of this shift in power, a critical question arose: who would lead the Economist Group? Several prominent figures emerged as possible leaders, each with their own strengths and policy vision, among them seasoned economists, academics and policymakers who had long championed evidence-based decision-making and pragmatic solutions to pressing social problems."
 TurkeyF.222.a:0 "Özgür Demirtaş Will Lead Us"
 TurkeyF.222.b:0 "Daron Acemoğlu Will Lead Us"
 TurkeyF.223.title:0 "The Scientific Group Wins the Internal Election"
 TurkeyF.223.desc:0 "As the contest within the People's Party reached its peak, the "Scientific Group" emerged as the clear winner, backed by a large majority of the party. Its decisive win highlighted the growing influence of its members, who share a common vision and expertise in policy-making, and sparked debate and excitement within the party and across the political landscape. As the leadership weighed the implications of this shift in power, a critical question arose: who would lead the Scientific Group? Several prominent figures emerged as possible leaders, each with their own strengths and policy vision, among them seasoned academics and policymakers who had long championed evidence-based decision-making and pragmatic solutions to pressing social problems."
 TurkeyF.223.a:0 "Celal Şengör Will Lead Us"
 TurkeyF.223.b:0 "Aziz Sancar Will Lead Us"
 TurkeyF.223.c:0 "Kudret Özersay Will Lead Us"
 TurkeyF.224.title:0 "MİT's Secret Plan"
 TurkeyF.224.desc:0 "Since the mafias seized power, MİT has been organizing everywhere to save the country from mafia misrule. Should we side with them or against them? Let's decide right now."
 TurkeyF.224.a:0 "This Mafia Government Must Be Destroyed"
 TurkeyF.224.b:0 "MİT Will Never Manage to Topple This Government"
 TurkeyF.225.title:0 "SADAT Moves to Topple the Government"
 TurkeyF.225.desc:0 "An alarming situation has unfolded in the Turkish capital: a coup attempt organized by a group allegedly linked to SADAT, a private defense consultancy, seeks to topple the MİT-led government of Hakan Fidan and Fahrettin Altun. Despite the state's efforts to thwart it, the situation has escalated, raising tensions in Ankara.\n\nIn the early hours of the morning, a convoy of tanks and armed personnel began moving toward Ankara, prompting a swift response from the security forces. The government immediately declared a state of emergency, and the army was mobilized to confront the advancing convoy.\n\nAs the convoy neared the city, clashes broke out between the plotters and government forces, with sporadic gunfire and explosions sending shockwaves through the capital. Reports of civilian casualties and damage to public infrastructure deepened the uncertainty and fear among residents."
 TurkeyF.225.a:0 "There Is No Return!"
 TurkeyF.226.title:0 "An Israeli-Turkish Alliance?"
 TurkeyF.226.desc:0 "Turkey's Jewish government wants to form an alliance with Israel. Should we give them a positive answer or a negative one?"
 TurkeyF.226.a:0 "Long Live the Jewish Coalition"
 TurkeyF.227.title:0 "Israel's Plan Is Rejected"
 TurkeyF.227.desc:0 "Turkey's Jewish government has rejected Israel for unknown reasons, and the whole country finds the decision very strange."
 TurkeyF.227.a:0 "Why?"
 TurkeyF.228.title:0 "They Are Asking the United States for Help"
 TurkeyF.228.desc:0 "In a major step to combat the growing threat of the mafias, the Turkish government led by MİT Chief Hakan Fidan has formally asked the United States for assistance and support in winning the war against organized crime. The appeal comes as the country faces mounting challenges from powerful criminal networks, prompting the authorities to seek international cooperation. Should we support them or not?"
 TurkeyF.228.a:0 "No, We Won't Help Them!"
 TurkeyF.228.b:0 "We Are Ready to Help Them!"
 TurkeyF.229.title:0 "The United States Provides Military Aid"
 TurkeyF.229.desc:0 "In a major show of solidarity and cooperation, the United States has extended robust support to Turkey in its war against the mafias, led by MİT Chief Hakan Fidan. The joint commitment reflects both countries' determination to fight organized crime and protect their citizens from the pervasive influence of criminal networks."
 TurkeyF.229.a:0 "Thank You Sir"
