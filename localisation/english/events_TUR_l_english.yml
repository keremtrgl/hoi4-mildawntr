 TurkeyU.1.title:0 "An Ülkücü Rebellion Breaks Out"
 TurkeyU.1.desc:0 "The nationalists in the streets have launched a full-scale armed war, splitting the country and plunging it into civil war. Our country is now entirely communist and without opposition. Red Guards, rise up and crush this rebellion!"
 TurkeyU.1a:0 "They Wanted War" 
 
