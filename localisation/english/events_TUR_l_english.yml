 TurkeyF.57.a:0 "We Have Been Betrayed!" 
 TurkeyF.58.title:0 "The IYI Party Joins the Secular Front"
 TurkeyF.58.desc:0 "Our negotiations with the IYI Party are over, and it has decided to join the secular front. The secular front is growing against reactionism."
 TurkeyF.58.a:0 "United Against Reaction" 
 TurkeyF.59.title:0 "The DYP Joins the Secular Front"
 TurkeyF.59.desc:0 "Our negotiations with the DYP are over, and it has decided to join the secular front. The secular front is growing against reactionism."
 TurkeyF.59.a:0 "United Against Reaction" 
 TurkeyF.60.title:0 "An Invitation From Turkey"
 TurkeyF.60.desc:0 "Turkey wants to form an alliance with us. Joining it could cause problems with other organizations we belong to. Sir, how should we answer Ankara's offer?" 
 TurkeyF.60.a:0 "A Wise Idea"
 TurkeyF.60.b:0 "We Don't Need An Alliance"
