 TurkeyF.56.desc:0 "After the normalization of relations between Cyprus and Turkey, an unexpected offer has come from Ankara: Turkey is founding a Mediterranean Bloc and wants us to join. Sir, what should we do about this strange offer? Are we no longer old enemies?"
 TurkeyF.56.a:0 "We Are Honored to Help Found This Alliance"
 TurkeyF.56.b:0 "This Alliance Is Absurd" 
 TurkeyF.53.title:0 "Greece Rejects Our Invitation"
 TurkeyF.53.desc:0 "Greece has opposed the creation of this alliance, dealing a heavy blow to all our goals and ideals. We will make them pay for this."
 TurkeyF.53.a:0 "We Have Been Betrayed!"
 TurkeyF.55.title:0 "Armenia Rejects Our Invitation"
 TurkeyF.55.desc:0 "Armenia has opposed the creation of this alliance, dealing a heavy blow to all our goals and ideals. We will make them pay for this."
