 ####### Super Events #######
 SUPEREVENT_1_T:0 "Turkey's 2023 Vision"
 SUPEREVENT_1_DESC:0 "Rising new generation! You are the future. We founded the Republic; it is you who will raise it up and keep it alive. The form of government best suited to the character and customs of the Turkish nation is the Republic. - Mustafa Kemal Atatürk"
 SUPEREVENT_2_T:0 "The Turkic Union"
 SUPEREVENT_2_DESC:0 "Nations that walk the path of conquest strike fear into other nations and win their admiration. - Hüseyin Nihal Atsız"
 SUPEREVENT_3_T:0 "Turkey Joins the European Union"
 SUPEREVENT_3_DESC:0 "Europe is a culture of flux, exchange and seafaring: a word that defies definition. - Cemil Meriç"
 SUPEREVENT_4_T:0 "The Turkish Military Purges"
 SUPEREVENT_4_DESC:0 "I leave you alone with your conscience, and I offer my humble life to the Republic founded by the great Mustafa Kemal. Your conscience is the last authority that can end this persecution. I leave you alone with it. - Hurşit Tolon"
 SUPEREVENT_5_T:0 "Erdoğan Loses the Elections"
 SUPEREVENT_5_DESC:0 "We will be the ones to put the stone right where it belongs. - Recep Tayyip Erdoğan"
 SUPEREVENT_6_T:0 "Erdoğan Becomes President"
 SUPEREVENT_6_DESC:0 "I am honored to be the President of the Republic of Turkey and of this heroic nation. - Recep Tayyip Erdoğan"
 SUPEREVENT_7_T:0 "The Kanal Istanbul Project"
 SUPEREVENT_7_DESC:0 "I have been accused of opposing a state project. This project, which we call the "concrete canal", is not a state project; it is an election project. - Ekrem İmamoğlu"
 SUPEREVENT_8_T:0 "Turkey Leaves NATO"
 SUPEREVENT_8_DESC:0 "They say NATO is the organization that protects us and that NATO countries are our allies. Now Turkey faces the great truth: NATO has put Atatürk on its target board, and it has announced this to the world. - Doğu Perinçek"
 SUPEREVENT_9_T:0 "The Turkish Headscarf Crisis"
 SUPEREVENT_9_DESC:0 "A headscarf does not make a person devout who lacks a veil of morality. - Mevlana"
 SUPEREVENT_10_T:0 "Atatürk's Ideal State"
 SUPEREVENT_10_DESC:0 "One day my mortal body will turn to dust, but the Republic of Turkey will stand forever. - Mustafa Kemal Atatürk"
 SUPEREVENT_11_T:0 "The End of Sectarian Woes"
 SUPEREVENT_11_DESC:0 "If every Turk does his duty in his place with faith, the ideal of Turkism becomes solid and Turkishness grows stronger. - Hüseyin Nihal Atsız"
 SUPEREVENT_12_T:0 "Turkey Develops Its Own Aircraft"
 SUPEREVENT_12_DESC:0 "The future is in the skies. Nations that cannot protect their skies can never be sure of their tomorrow. - Mustafa Kemal Atatürk"
 SUPEREVENT_13_T:0 "Turkish Germany Proclaimed"
 SUPEREVENT_13_DESC:0 "He who borrows sells his freedom. - German proverb"
 SUPEREVENT_14_T:0 "Turkish Industrialization Achieved"
 SUPEREVENT_14_DESC:0 "The long run is a misleading guide to current affairs. In the long run we are all dead. - John M. Keynes"


 X_T:0 "Welcome to §YMD +Turkey§!"
 MOD_OPENING_DESC:0 "§YThe most detailed Turkey for Millennium Dawn.§!\nLead the Republic from 2000 through coalitions, crises, coups, elections and wars, on paths from the AKP to the Ottomans.\n\nThe §YPath Guide§! explains how to reach every path. Super events, extra sounds and the hidden paths start switched off: turn them on in §YMod Settings§!.\n\nFound a bug or have an idea? Tell us on §YDiscord§!.\n§gVersion 2.0.3-TUR.9 · Millennium Dawn 2.0.3§!"
 BITCOIN_DESC:0 "Mod Settings"
 MD_GO:0 "§GLet's Go!§!"
 FAQ_S:0 "Path Guide 1/10"
 FAQ_1_DESC:0 "§YHow to use this guide§!\nPaths open at set dates. If nothing happens, check the date first: §Rmany events only fire inside a time window, so you have to wait for it§!.\n\n§YKey dates§!\n§YDec 2000 - Jan 2001§!: Rahşan Amnesty (Mafia, Anarchists)\n§YFeb 2001§!: the 2001 economic crisis\n§YJan 2001 - May 2002§!: the Atatürk window\n§YJun - Sep 2001§!: Technocratic HP events\n§YBefore 2003§!: Ottoman and Pamukoğlu decisions\n§YMay 2003§!: MİT\n§Y2007§!: Reformed AKP\n§Y2016 and later§!: Ülkücü regime\n§Y2023§!: CHP leaders\n\nThe Mafia, Anarchist, MİT and Atatürk paths need §YFictional Reality§! switched on in §YMod Settings§!. It starts off."
 RETURN_TO_MENU_MD_DESC:0 "§YBack to Menu§!"
 FAQ_S_2:0 "Path Guide 2/10"
 FAQ_2_DESC:0 "§YThe 2001 crisis (1/2)§!\nEvery party path branches from here.\n\n1. Work down the main tree: §YFuture of the Republic?§!, the anti-corruption focuses, §YConstitutional Changes§! (after June 2000), the prison focuses, §YWinds of 2001§! (after 1 January 2001) and §YInternationalize Sabiha Gökçen§!.\n2. §RWait§! for the event §YThe Turkish 2001 Economic Crisis§!. It fires from 20 February 2001 and gives the crisis spirit.\n3. Take §Y2001 Economic Crisis§!.\n4. Choose ONE successor focus below it. They exclude each other.\n\n§RAll successors except the DSP need stability below 45%§!. Check it before the crisis focus finishes."
 FAQ_S_3:0 "Path Guide 3/10"
 FAQ_3_DESC:0 "§YThe 2001 crisis (2/2)§!\n§YAKP§! (The AKP Movement): open to any government.\n§YDSP§! (The Government Is Not Done Yet!): no stability limit.\n§YMHP§!, §YSaadet§!, §YTKP§!, §YMilitary Plot§!: open to any government.\n§YCHP§!: the social democrats must lead the government.\n§YLDP§!: the liberals must lead it. §YANAP§!: the libertarians.\n§YGENÇPARTİ§!: an autocratic party must lead it.\n§YTechnocratic HP§!: in June 2001 §YThe HP Announces a Bold Bid§! fires. Choose §YThe HP Should Be Supported§!, wait for the follow-up in August, then take §YSparks of Innovation§!.\n\nThe party in power is shown on the politics screen. Elections and coalition decisions change it."
