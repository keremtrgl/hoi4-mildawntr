 TurkeyF.236.title:0 "Who Will Be Our Leader?"
 TurkeyF.236.desc:0 "After the coup, a military committee has been set up to choose the new Chief of the General Staff, who will hold great power over Turkey's future. The committee is carefully weighing the qualifications and merits of the leading candidates, all distinguished officers."
 TurkeyF.236.a:0 "Hilmi Özkök"
 TurkeyF.236.b:0 "Çevik Bir"
 TurkeyF.236.c:0 "The Current Leader!"
 TurkeyF.237.title:0 "Israel Demands Submission!"
 TurkeyF.237.desc:0 "Israel has proposed that the country's administration be handed over to the guilds to secure future dominance. How should we respond to this sinister offer? Do we accept or not?"
 TurkeyF.237.a:0 "We Need A Fresh Start"
 TurkeyF.237.b:0 "Let's Play These Dark Games"
 TurkeyF.238.title:0 "Iran Attacks Our Regional Defenses!"
 TurkeyF.238.desc:0 "The simmering tensions between Iran and Turkey have finally boiled over. In a brazen move, Iran has launched a surprise attack on Turkey's regional defenses, escalating the conflict to a critical level. With its territorial integrity and national security under direct threat, Turkey must decide how to respond to this act of aggression."
 TurkeyF.238.a:0 "This is Unacceptable!"
 TurkeyF.239.title:0 "...Evangelicalism"
 TurkeyF.239.desc:0 "Our space research has had unintended consequences and awakened something hidden. Perhaps we should never have attempted it."
 TurkeyF.239.a:0 "What Is That?!"

 ####### Presidential Rivals #######
 TurkeyPresidency.1.title:0 "Ahmet Necdet Sezer vs. Nevzat Yalçıntaş"
 TurkeyPresidency.1.desc:0 "The 2000 Turkish presidential election consisted of a first round on 27 April 2000, a second round on 1 May and a third on 5 May. It came at the end of 9th President Süleyman Demirel's seven-year term. There was a small effort to change the presidency to two five-year terms, which would have given Demirel three more years, but the proposal never won broad support.\n\nIn the months before the vote, each of the five largest parties in parliament informally backed its own candidate. With no party holding a decisive majority, a neutral compromise candidate was sought and eventually found in Ahmet Necdet Sezer, former President of the Constitutional Court. Sezer was endorsed by the leaders of the governing Democratic Left, Nationalist Movement and Motherland parties, as well as the opposition Virtue and True Path parties.\n\nA number of MPs broke ranks and nominated themselves, among them Speaker of Parliament and former Prime Minister Yıldırım Akbulut, who failed to win enough support and withdrew after the second round."
 TurkeyPresidency.1.a:0 "A Critical Moment"
 TurkeyPresidency.2.title:0 "Abdullah Gül vs. Sabahattin Çakmakoğlu"
 TurkeyPresidency.2.desc:0 "The 2007 Turkish presidential election refers to two attempts to elect the country's 11th president to succeed Ahmet Necdet Sezer. The most likely candidate was Abdullah Gül. As the presidency is regarded as the guardian of Turkey's secular system, the fact that Gül's wife wears the Islamic headscarf, together with his own background in political Islam, turned the election into a political crisis.\n\nThe first attempt consisted of the first round on 27 April and its repeat on 6 May, after the Constitutional Court annulled the first round, ruling that a two-thirds quorum was required, which was impossible without opposition support. Both first rounds were almost entirely boycotted by opposition MPs to prevent voting from starting, so the ruling Justice and Development Party (AKP) failed to elect its candidate, Foreign Minister Abdullah Gül. The AKP then called a snap election, held on 22 July 2007."
 TurkeyPresidency.2.a:0 "A Critical Moment"
 TurkeyPresidency.3.title:0 "Recep Tayyip Erdoğan vs. Ekmeleddin İhsanoğlu"
 TurkeyPresidency.3.desc:0 "Presidential elections were held in Turkey on 10 August 2014 to elect the 12th President.\n\nThe election took place under the reforms of the 2007 constitutional referendum, which introduced a direct popular vote instead of election by parliament. Over 55 million people were eligible to vote, both in Turkey and abroad."
 TurkeyPresidency.3.a:0 "A Critical Moment"
 TurkeyPresidency.4.title:0 "Victory of Nevzat Yalçıntaş"
 TurkeyPresidency.4.desc:0 "In a shocking turn of events, Nevzat Yalcintas, a relatively unknown figure in Turkish politics, has been elected as the President of Turkey in the 2000 presidential elections. Defying all expectations, Yalcintas secured a remarkable victory in the Grand National Assembly of Turkey.\n\nYalcintas, a successful entrepreneur and philanthropist, was not associated with any major political party, making his rise to the presidency even more surprising. His campaign focused on unity, economic development, and a commitment to addressing social issues that had long plagued the nation.\n\nThe 2000 Turkish presidential election was marked by intense political rivalries and a highly competitive race among prominent political figures. Despite the fierce competition, Yalcintas managed to capture the hearts of the assembly members with his vision for a prosperous and inclusive Turkey.\n\nUpon learning of his victory, Yalcintas delivered a heartfelt speech, expressing gratitude to the assembly members for their trust and vowing to work tirelessly for the betterment of the nation. He emphasized the importance of collaboration and unity in addressing the challenges that lay ahead.\n\nObservers and analysts were taken aback by the unexpected outcome, with many praising Yalcintas's ability to connect with people from all walks of life. His non-partisan approach and fresh perspective on governance resonated with a significant portion of the Turkish population.\n\nAs President-elect, Yalcintas is set to take office and embark on a transformative journey for Turkey, promising to lead the country into a new era of prosperity and progress."
 TurkeyPresidency.4.a:0 "Good News"
 TurkeyPresidency.5.title:0 "Victory of Ahmet Necdet Sezer"
 TurkeyPresidency.5.desc:0 "In a decisive victory, Ahmet Necdet Sezer has been elected as the 10th President of Turkey in the 2000 presidential elections. The Grand National Assembly of Turkey cast their votes, and Sezer secured a significant majority, earning widespread support from various political parties.\n\nAhmet Necdet Sezer, a distinguished jurist and former Chief Justice of the Turkish Constitutional Court, emerged as the consensus candidate during the election process. Known for his impartiality, integrity, and commitment to upholding the rule of law, Sezer was widely respected across the political spectrum.\n\nThroughout the election campaign, Sezer emphasized the importance of maintaining the country's secular values, protecting democratic institutions, and promoting social harmony. He addressed the concerns of various interest groups, promising to be a unifying figure for all Turks.\n\nAfter the election results were announced, President-elect Sezer delivered a humble and forward-looking acceptance speech, expressing his gratitude for the trust placed in him by the assembly members. He reaffirmed his dedication to serving the nation with fairness and transparency, promising to work towards a stronger and more prosperous Turkey.\n\nAhmet Necdet Sezer's victory marks a moment of continuity and stability for the Turkish Republic. His wealth of legal experience and principled approach to governance have instilled confidence among both citizens and the international community.\n\nAs the new President, Sezer's vision for Turkey focuses on strengthening democratic institutions, advancing human rights, fostering economic growth, and addressing social inequalities. His leadership is expected to shape a path towards further progress and development for the nation.\n\nWith the presidential election now concluded, the nation looks ahead to a new chapter under the guidance of President Ahmet Necdet Sezer. The hope is that his presidency will be characterized by a commitment to the ideals of a modern, inclusive, and prosperous Turkey."
 TurkeyPresidency.5.a:0 "Good News"
 TurkeyPresidency.6.title:0 "Victory of Abdullah Gül"
 TurkeyPresidency.6.desc:0 "Abdullah Gül has been elected President of Turkey, a result that reflects the AKP's growing influence in Turkish politics. The election process was not without its challenges, with strong opposition from some political parties and concerns about the preservation of Turkey's secular traditions.\n\nIn his acceptance speech, Gül thanked the assembly members for their confidence and pledged to work tirelessly for the welfare of the Turkish people. He stressed the importance of respecting pluralism and preserving the nation's democratic institutions.\n\nAs President, Gül is expected to focus on domestic reforms to strengthen the economy, improve education and address social issues. His extensive diplomatic experience is also expected to enhance Turkey's role on the international stage and foster stronger ties with global partners.\n\nThe election of Abdullah Gül marks a pivotal moment in Turkey's political landscape, reflecting the nation's evolving aspirations for a more inclusive and prosperous future. As he takes office, President Gül is poised to navigate the complexities of a diverse society while upholding the country's democratic principles.\n\nThe Turkish people, along with the international community, eagerly await the start of President Abdullah Gül's tenure and the positive changes he may bring to the nation."
 TurkeyPresidency.6.a:0 "Good News"
 TurkeyPresidency.7.title:0 "Victory of Sabahattin Çakmakoğlu"
 TurkeyPresidency.7.desc:0 "In a historic moment for Turkey, Sabahattin Cakmakoglu has been elected as the 11th President of the Republic of Turkey in the 2007 presidential elections. The Grand National Assembly of Turkey gathered to cast their votes, and Cakmakoglu secured a clear majority, becoming the first candidate from an independent background to win the presidency.\n\nSabahattin Cakmakoglu, an esteemed academician and social reformer, was not affiliated with any political party, which set him apart from previous presidential candidates. His candidacy was met with enthusiasm from a diverse range of citizens who sought a fresh perspective and new ideas for the country's future.\n\nThroughout his campaign, Cakmakoglu advocated for a balanced approach to governance, emphasizing the importance of social welfare, education, and economic growth. He pledged to build bridges between different societal groups, working towards national unity and harmony.\n\nUpon learning of his victory, President-elect Cakmakoglu delivered a stirring speech, expressing his deep gratitude to the assembly members for their trust and support. He reaffirmed his commitment to serving the people of Turkey with dedication, integrity, and humility.\n\nAs a prominent intellectual and visionary leader, Cakmakoglu's presidency is expected to usher in an era of innovation and progress. His comprehensive vision for Turkey's future includes reforms in education, healthcare, and infrastructure, along with strategies to promote sustainable economic development.\n\nThe election of Sabahattin Cakmakoglu reflects a desire for change and renewal within Turkish politics. His non-partisan stance and academic background have resonated with many citizens who seek a leader capable of addressing the nation's challenges through a pragmatic and inclusive approach.\n\nAs the new President, Cakmakoglu's administration is anticipated to prioritize human rights, democratic values, and social justice. With a focus on strengthening Turkey's position on the global stage, President Sabahattin Cakmakoglu aims to forge stronger diplomatic ties and promote international cooperation.\n\nWith Sabahattin Cakmakoglu assuming office as the 11th President of Turkey, the nation looks forward to a period of innovation, progress, and unity, driven by the leadership of a forward-thinking intellectual and dedicated statesman."
 TurkeyPresidency.7.a:0 "Good News"
 TurkeyPresidency.8.title:0 "Victory of Recep Tayyip Erdoğan"
 TurkeyPresidency.8.desc:0 "In a closely watched and highly anticipated election, Recep Tayyip Erdoğan has won the 2014 Turkish presidential election, becoming the 12th President of the Republic of Turkey. Citizens went to the polls, and Erdoğan's victory was confirmed with a significant majority.\n\nRecep Tayyip Erdoğan, the former Prime Minister and leader of the Justice and Development Party (AKP), carried his party's nomination into the race. His candidacy marked a transformation of the Turkish political system, as this was the first time the President was chosen by direct popular vote.\n\nThroughout his campaign, Erdoğan set out his vision of a strong and prosperous Turkey, emphasizing economic growth, social welfare and continued democratization. He spoke of a new era in Turkish politics, promising to uphold the country's secular principles while pursuing policies that meet the diverse needs of the Turkish people.\n\nThe 2014 presidential election was marked by spirited debate and a competitive field of candidates from various parties. Despite the intense competition, Erdoğan's long political experience, the economic successes of his time as Prime Minister and his popularity across many segments of the population secured his victory.\n\nIn his victory speech, President-elect Erdoğan thanked the Turkish people for entrusting him with the highest office in the country. He vowed to work diligently to fulfill the aspirations of all citizens and to promote unity and inclusiveness across the nation.\n\nAs President, Erdoğan is expected to focus on socio-economic challenges, infrastructure improvements and further strengthening Turkey's global standing, maintaining stability while fostering progress across the country.\n\nThe election of Recep Tayyip Erdoğan as the 12th President of Turkey signals continuity in government and the continued dominance of the AKP in Turkish politics. As he begins his term, President Erdoğan will have to navigate a complex geopolitical landscape while meeting the expectations of the Turkish people.\n\nThe nation looks forward to seeing the impact of President Erdoğan's policies and the changes they may bring to Turkey during his presidency."
 TurkeyPresidency.8.a:0 "Good News"
 TurkeyPresidency.9.title:0 "Victory of Ekmeleddin İhsanoğlu"
 TurkeyPresidency.9.desc:0 "In a remarkable and unprecedented turn of events, Ekmeleddin İhsanoğlu, a respected academician and diplomat, has secured a historic victory in the 2014 Turkish presidential elections, becoming the 12th President of the Republic of Turkey. İhsanoğlu's triumph marks a significant departure from previous elections, as he was a joint candidate supported by opposition parties.\n\nEkmeleddin İhsanoğlu's candidacy was an alliance between the Republican People's Party (CHP) and the Nationalist Movement Party (MHP), symbolizing a united front against the ruling Justice and Development Party (AKP). As a non-partisan figure, İhsanoğlu offered an alternative vision for the country, pledging to uphold Turkey's democratic values while prioritizing national unity and social cohesion.\n\nThroughout his campaign, İhsanoğlu emphasized the importance of preserving Turkey's secular identity, protecting civil liberties, and fostering an inclusive and tolerant society. As a former Secretary-General of the Organization of Islamic Cooperation (OIC) and an internationally recognized scholar, he presented himself as a candidate with vast diplomatic experience and a commitment to multilateral cooperation.\n\nThe 2014 Turkish presidential elections witnessed a highly competitive and closely contested race, with İhsanoğlu's victory considered by many as a significant political upset. His ability to appeal to a broad cross-section of the population, transcending party lines, resonated with citizens who sought a unifying figure in the country's highest office.\n\nFollowing the announcement of his victory, President-elect İhsanoğlu delivered a gracious acceptance speech, extending his gratitude to the opposition parties, the Turkish people, and the assembly members for their support. He emphasized the need for constructive dialogue and national consensus in addressing Turkey's challenges and building a brighter future.\n\nAs President, İhsanoğlu's administration is expected to focus on economic reforms, social welfare programs, and strengthening democratic institutions. His extensive diplomatic background is anticipated to play a crucial role in promoting Turkey's international standing and fostering global cooperation.\n\nThe election of Ekmeleddin İhsanoğlu represents a turning point in Turkish politics, signifying a broad-based desire for change and a commitment to preserving the nation's secular and democratic values. As he begins his term, President İhsanoğlu is poised to steer Turkey towards a path of unity, prosperity, and renewed international engagement.\n\nThe nation eagerly anticipates the impact of President İhsanoğlu's leadership and the positive transformations he is expected to bring to Turkey during his term."
 TurkeyPresidency.9.a:0 "Good News"

 ####### Turkish Anarchist Civil War #######
 TurkeyX.1.title:0 "An Anarchist Takeover!"
 TurkeyX.1.desc:0 "Anarchists took to the streets and overthrew the government. The Turkish Armed Forces then moved in and opened fire to crush them. After long clashes, the army withdrew from the western region, which fell under anarchist rule. The resistance continues, with the army holding the other side."
 TurkeyX.1.a:0 "We must destroy them!"

 ####### Turkish Mafia Civil War #######
 TurkeyM.1.title:0 "MİT Launches a Counterstrike Against the Mafias!"
 TurkeyM.1.desc:0 "An unprecedented wave of violence has engulfed Turkey, as tensions escalate between powerful mafia groups and government forces led by MİT Chief Hakan Fidan. Once stable, the nation now finds itself on the brink of civil war, with clashes between the warring factions spreading chaos and fear across the country.\n\nThe conflict grew out of long-standing rivalries and power struggles between organized crime syndicates, seeking to dominate territory and resources, and government forces determined to maintain law and order. As the violence intensifies, innocent civilians have been caught in the crossfire, leading to a devastating humanitarian crisis.\n\nUnder Hakan Fidan's leadership, MİT, Turkey's National Intelligence Organization, has taken decisive action against the mafia threat. Government forces are carrying out operations to root out criminal networks and break their hold over key sectors of the economy and government."
 TurkeyM.1.a:0 "We must destroy them!"

 ####### Turkish FETÖ Civil War #######
 TurkeyC.1.title:0 "The Turkish Civil War"
 TurkeyC.1.desc:0 "After the coup, internal clashes gathered pace. Kemalists and Erdoğan supporters have taken up arms in the streets, and the coup plotters have lost large areas as a result. Fighting side by side, the rebellious Kemalists and Erdoğan supporters have seized some of our war stockpiles. The unrest has turned into a full civil war."
 TurkeyC.1.a:0 "Time to take over!"
 TurkeyC.1.b:0 "Let's destroy them!"
 TurkeyC.2.title:0 "The Question of the Kemalists"
 TurkeyC.2.desc:0 "We can try to destroy the Kemalists by fighting them in the civil war, or keep our alliance with them and destroy the traitors trying to overthrow our country together. The decision is yours."
 TurkeyC.2.a:0 "Time to destroy them!"
 TurkeyC.2.b:0 "We need them!"
 TurkeyC.3.title:0 "The Military Wants to Seize Power"
 TurkeyC.3.desc:0 "The army wants to take over. If we hand power to the army, there will be no democracy in the country until the civil war is over. The choice is yours."
 TurkeyC.3.a:0 "Let the military take action"
 TurkeyC.3.b:0 "We don't need that"
 TurkeyC.4.title:0 "The Military Withdraws From Power"
 TurkeyC.4.desc:0 "The war is over, and the army has withdrawn from power. With its withdrawal, democracy has returned to the country."
 TurkeyC.4.a:0 "Democracy Returns!"
 TurkeyC.5.title:0 "The Kurdish Armed Movement"
 TurkeyC.5.desc:0 "The Kurds have risen against the government and begun armed resistance. We must crush them immediately."
 TurkeyC.5.a:0 "We must destroy them!"
 TurkeyC.6.title:0 "The Turkish Civil War"
 TurkeyC.6.desc:0 "After the coup, internal clashes gathered pace. Kemalists and Erdoğan supporters have taken up arms in the streets, and the coup plotters have lost large areas as a result. Fighting side by side, the rebellious Kemalists and Erdoğan supporters have seized some of our war stockpiles. The unrest has turned into a full civil war."
 TurkeyC.6.a:0 "Time to take over!"
 TurkeyC.6.b:0 "Let's destroy them!"

 ###### American Operations ######
 TurkeyNATO.1.title:0 "US Headquarters Questions Turkey"
 TurkeyNATO.1.desc:0 "Turkey is a member of the NATO alliance, but it has now descended into civil war between the secular, democratic Turkish people and a terrorist Ottoman Turkish state. Should we leave the region to these bigoted Ottomans, give up our access to the Russian Black Sea and turn a blind eye to the rise of a Russia-friendly state there? Or should we organize a general operation with the NATO states and make it clear that Turkey belongs to NATO?"
 TurkeyNATO.1.a:0 "It's Time for NATO to Act"
 TurkeyNATO.1.b:0 "Refrain From Intervening"
 TurkeyNATO.2.title:0 "The Question of Military Aid to Turkey"
 TurkeyNATO.2.desc:0 "Turkey, a NATO member, has recently fallen into a serious civil war: the communists have risen up against the Turkish government, and the Kurds have seized the opportunity to launch a struggle for independence. It is up to you to decide whom to support in line with our interests in the region."
 TurkeyNATO.2.a:0 "Arm The Kurds"
 TurkeyNATO.2.b:0 "Send Military Aid to the Ülkücüs"
 TurkeyNATO.2.c:0 "Send Military Aid to the Government Forces"
 TurkeyNATO.2.d:0 "We Should Not Intervene"
 TurkeyNATO.3.title:0 "The Question of Military Aid to Turkey"
 TurkeyNATO.3.desc:0 "Turkey, a NATO member, has recently fallen into a serious civil war: the communists have risen up against the Turkish government, and the Kurds have seized the opportunity to launch a struggle for independence. It is up to you to decide whom to support in line with our interests in the region."
 TurkeyNATO.3.a:0 "Arm The Kurds"
 TurkeyNATO.3.b:0 "Send Military Aid to the Communists"
 TurkeyNATO.3.c:0 "Send Military Aid to the Government Forces"
 TurkeyNATO.3.d:0 "We Should Not Intervene"
 TurkeyNATO.4.title:0 "The Question of Military Aid to Turkey"
 TurkeyNATO.4.desc:0 "Turkey, a NATO member, has recently fallen into a serious civil war: the communists have risen up against the Turkish government, and the Kurds have seized the opportunity to launch a struggle for independence. It is up to you to decide whom to support in line with our interests in the region."
 TurkeyNATO.4.a:0 "Arm The Kurds"
 TurkeyNATO.4.b:0 "Send Military Aid to the Government Forces"
 TurkeyNATO.4.c:0 "Send Military Aid to the Anarchists"
 TurkeyNATO.4.d:0 "We Should Not Intervene"
 TurkeyNATO.5.title:0 "The United States Backs Us"
 TurkeyNATO.5.desc:0 "The United States has decided to support us in order to protect its own interests. With this material and moral backing, we can emerge victorious from the civil war. Long live the auxiliary forces!"
 TurkeyNATO.5.a:0 "Hurrah!"
 TurkeyNATO.6.title:0 "The United States Pokes Its Nose Into Our Sea Lanes"
 TurkeyNATO.6.desc:0 "From NATO's attempts to invade Turkey, it is clear that the United States is openly attacking the Montreux Convention and Russia's interests. Russia must not allow the Straits to fall under such control; we must intervene militarily!"
 TurkeyNATO.6.a:0 "The United States Must Be Stopped"
 TurkeyNATO.6.b:0 "We Should Not Flex Our Muscles at the West"
 TurkeyNATO.7.title:0 "Perinçek's Protests"
 TurkeyNATO.7.desc:0 "Perinçek and his supporters strongly condemned Turkey's entry into the war with China, demonstrating with Chinese banners. Perinçek said the war would spell the end of Turkey and stressed the importance of Maoism."
 TurkeyNATO.7.a:0 "Shut Him Up"

 ###### Turkish News #######
 Turkey_news.1.t:0 "Gezi Park Protests"
 Turkey_news.1.d:0 "A wave of demonstrations and civil unrest in Turkey began on 28 May 2013, initially to contest the urban development plan for Istanbul's Taksim Gezi Park. The protests were sparked by outrage at the violent eviction of a sit-in at the park protesting the plan. Subsequently, supporting protests and strikes took place across Turkey, protesting a wide range of concerns at the core of which were issues of freedom of the press, expression, and assembly, as well as the Islamist government's erosion of Turkey's secularism. With no centralized leadership beyond the small assembly that organized the original environmental protest, the protests have been compared to the Occupy movement and the May 1968 events. Social media played a key part in the protests, not least because much of the Turkish media downplayed the protests, particularly in the early stages. Three and a half million people are estimated to have taken an active part in almost 5,000 demonstrations across Turkey connected with the original Gezi Park protest. Twenty-two people were killed and more than 8,000 were injured, many critically.\n\n"
 Turkey_news.1.a:0 "Protests in Turkey? Interesting"
 Turkey_news.2.t:0 "The Turkish Coup Attempt Has Failed"
 Turkey_news.2.d:0 "A coup d'état was attempted in Turkey against state institutions, including the government and President Recep Tayyip Erdoğan. It was carried out by a faction within the Turkish Armed Forces calling itself the Peace at Home Council, whose members were never fully identified. They tried to seize control of several key locations in Ankara, Istanbul, Marmaris and elsewhere, such as the Asian-side entrance to the Bosphorus Bridge, but failed after forces loyal to the state defeated them. The Council cited the erosion of secularism, the elimination of democratic rule, disregard for human rights and Turkey's loss of credibility on the international stage as its reasons. The government said the coup leaders were linked to the Gülen movement, designated a terrorist organization by the Republic of Turkey and led by Fethullah Gülen, a Turkish businessman and cleric living in Pennsylvania. The government alleged that Gülen was behind the coup, which he denied, and that the United States was harboring him."
 Turkey_news.2.a:0 "Erdoğan Wins..."
 Turkey_news.3.t:0 "Turkey Decides to Buy the S-400"
 Turkey_news.3.d:0 "After the United States failed to respond positively to its ally Turkey's request for the Patriot missile defense system, Ankara turned to other options, weighed Russia's attractive offer and decided to buy the S-400 air defense system. \n\nWith its security needs growing every day, especially in the Syrian war, and its airspace exposed to threats, Turkey has turned to building its own air defenses because its NATO allies would not support it."
 Turkey_news.3.a:0 "Interesting"
 Turkey_news.4.t:0 "Turkey Threatens Europe With a Wave of Migrants"
 Turkey_news.4.d:0 "The Turkish offensive into northeastern Syria has begun, displacing 130,000 people in the first week and a half. On 10 October, President Erdoğan reportedly threatened to send "millions" of Syrian refugees to Europe in response to criticism of his offensive into Kurdish-controlled northern Syria. On 27 February 2020, a senior Turkish official said police, coast guard and border officials had been ordered to stop blocking refugees' land and sea crossings into Europe."
 Turkey_news.4.a:0 "Bad Times for the EU"
 Turkey_news.5.t:0 "The Lira Is Losing Its Value"
 Turkey_news.5.d:0 "The dollar rose against the lira after the US sanctions, and Turkey could do nothing but raise interest rates. As the dollar climbed, the Turkish economy weakened and support for Erdoğan began to decline."
 Turkey_news.5.a:0 "Uncertain Times"
 Turkey_news.6.t:0 "Turkish Expansionism"
 Turkey_news.6.d:0 "After a long period, Turkey has quietly militarized and, as a result, begun to expand its territory. \n\nThe expansion has soured Turkey's relations with the countries of the region and raised tensions worldwide."
 Turkey_news.6.a:0 "Militarism leads to expansionism"
 Turkey_news.7.t:0 "The Turkish Economic Crisis of 2001"
 Turkey_news.7.d:0 "On 19 February 2001, Prime Minister Ecevit emerged from a meeting with President Sezer saying, "This is a serious crisis." This underscored the financial and political instability and led to further panic in the markets. Stocks plummeted and the interest rate reached 3,000%. Large quantities of Turkish lira were exchanged for US dollars or euros, causing the Turkish central bank to lose 5 billion of its reserves. The crash triggered even more economic turmoil. In the first eight months of 2001, 14,875 jobs were lost, the dollar rose to 1,500,000 liras, and income inequality rose from its already high level."
 Turkey_news.7.a:0 "Uncertain Times"
 Turkey_news.8.t:0 "The Turkish Civil War"
 Turkey_news.8.d:0 "After the coup in Turkey, the Kemalists and Erdoğan's forces fighting the coup plotters have taken control of large parts of the country, and after fierce fighting the plotters have fallen back to the Marmara line. \n\nThe intensity of the fighting is proof that a civil war is breaking out in Turkey."
 Turkey_news.8.a:0 "Uncertain Times"
 Turkey_news.9.t:0 "A Turkish Military Coup"
 Turkey_news.9.d:0 "As the economy worsened and corruption spread, the Turkish Armed Forces took over. Around 223 people were arrested, and 2 guards were killed during the coup. The army stated that it would hand back the administration at any time and that it was firmly committed to Atatürk's principles."
 Turkey_news.9.a:0 "Uncertain Times"
 Turkey_news.10.t:0 "The Rise of Covid-19"
 Turkey_news.10.d:0 "Coronavirus disease 2019 (COVID-19) is a contagious disease caused by severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2). The first case was identified in Wuhan, China, in December 2019, and the disease has since spread worldwide, leading to an ongoing pandemic. \n\nNaturally, this will cause great damage to the world's economies."
 Turkey_news.10.a:0 "Difficult days ahead"
 Turkey_news.11.t:0 "Clashes in Karabakh"
 Turkey_news.11.d:0 "Clashes broke out on the morning of 27 September 2020 along the Nagorno-Karabakh Line of Contact, established after the First Nagorno-Karabakh War (1988–1994). In response, Armenia and Artsakh declared martial law and total mobilization, while Azerbaijan declared martial law, a curfew and partial mobilization. Turkey provided military support to Azerbaijan, though the extent of that support is disputed. Turkey's involvement is thought to have been an attempt to extend its sphere of influence, both by strengthening Azerbaijan's position in the conflict and by sidelining Russia's influence in the region."
 Turkey_news.11.a:0 "Get to the bunkers"
 Turkey_news.12.t:0 "The Turkish Civil War Ends"
 Turkey_news.12.d:0 "The civil war has finally ended. The cities suffered heavy damage, and with peace restored, Turkey can now begin rebuilding them. The reconstruction will certainly strain the country's economy."
 Turkey_news.12.a:0 "Peace arrives in Turkey"
 Turkey_news.13.t:0 "Azerbaijan Joins Turkey"
 Turkey_news.13.d:0 "Thanks to their excellent relations, Turkey and Azerbaijan have decided to merge. The union will benefit both countries and could be a big step toward the Turkic Union. Strength comes from unity."
 Turkey_news.13.a:0 "Interesting"
 Turkey_news.14.t:0 "The Unification of the Turks"
 Turkey_news.14.d:0 "The Turks have decided to unite and form the Turan Union, with Ankara as its capital, the Turkish lira as its currency and a common language. Far from objecting, the Turkish opposition backed the Turan Union, binding the new union even tighter. Its formation has shifted the global balance of power, and Russia and China will hardly be pleased."
 Turkey_news.14.a:0 "Strength comes from unity"
 Turkey_news.15.t:0 "The Ottoman Sultanate is Reborn"
 Turkey_news.15.d:1 "Much to the world's dismay, the Ottoman Sultan has been restored to his throne after a particularly brutal civil war between the country's coup plotters and its secularist Kemalists. In an extravagant ceremony that seemed straight out of the Middle Ages, the Sultan was returned to his former position and Mustafa Kemal Atatürk's republic was dissolved forever. \n\n[TUR.GetLeader] addressed his newly reborn sultanate, expressing a mix of surprise and humility at being restored to his ancestors' station. The new Sultan is a mild-mannered man, but he is surrounded by a court of warmongers and irredentists. Experts, who never believed the Sultan's return was even possible, have no idea what the future holds."
 Turkey_news.15.a:1 "Alhamdulillah!"
 Turkey_news.16.t:0 "The Islamic Republic of Turkey Has Been Declared"
 Turkey_news.16.d:1 "After seizing complete control of the administration, the coup plotters have established an Islamic Republic aligned with the United States. Unrest in the country has reached fever pitch, and the secularists have begun turning to guerrilla warfare."
 Turkey_news.16.a:1 "Alhamdulillah!"
 Turkey_news.17.t:0 "The Great Turkish Civil War"
 Turkey_news.17.d:1 "Under heavy police pressure, demonstrators and workers began to arm themselves and eventually opened fire on the police. The streets have become a bloodbath, and troops have been dispatched. Partisan groups formed in one region united, took over western Turkey and established a new regime there. The goal of this front, called the Liberation Front, is to rid the country of the capitalist order.\n\nNATO has announced that it will back the current Turkish regime, while Russia has said it will support the Liberation Front."
 Turkey_news.17.a:1 "Une Nouvelle Révolution"
 Turkey_news.18.t:0 "Turkey Adopts the Copenhagen Criteria"
 Turkey_news.18.d:1 "In recent years, Turkish governments have made sweeping changes to the Constitution and the law and put these reforms into effect. Meanwhile, the Customs Union agreement has been extended to the 10 new member states of the Union. Although the political criteria of Copenhagen are at the forefront for Turkey, adopting the Copenhagen economic criteria is essential for Turkey's full membership of the European Union, since economic issues make up a large part of the 35 chapters to be covered in the accession negotiations starting on 3 October 2005. The Copenhagen economic criteria cover two main economic aspects."
 Turkey_news.18.a:1 "Liberalization of the Markets"
 Turkey_news.19.t:0 "The Great Recession of 2008"
 Turkey_news.19.d:1 "The Great Recession was a period of marked decline in national economies worldwide between 2007 and 2009, varying in scale and timing from country to country. At the time, the International Monetary Fund (IMF) concluded that it was the most severe economic and financial meltdown since the Great Depression, and it seriously disrupted normal international relations.\n\nIts causes include a combination of vulnerabilities that had built up in the financial system and a series of triggering events that began with the bursting of the US housing bubble in 2005–2012."
 Turkey_news.19.a:1 "The Mortgage Show"
 Turkey_news.20.t:0 "Lehman Brothers Goes Bankrupt"
 Turkey_news.20.d:1 "On 15 September 2008, Lehman Brothers filed for Chapter 11 bankruptcy protection after an exodus of most of its clients, steep losses in its stock and devaluation of its assets by credit rating agencies, driven largely by a loss of confidence, its involvement in the subprime mortgage crisis and its exposure to less liquid assets. It was the largest bankruptcy filing in US history and is thought to have played a major role in the unfolding of the 2007–2008 financial crisis. The collapse also lent support to the "too big to fail" doctrine."
 Turkey_news.20.a:1 "Tschüss!"
 Turkey_news.21.t:0 "The ISE in Despair"
 Turkey_news.21.d:1 "The Istanbul Stock Exchange is about to put the worst year in its history behind it. Having lost 52.4 percent in 2008, the ISE will record its biggest annual decline ever. The ISE was one of the markets hit hardest by the global crisis: after ending 2007 up 42 percent, it lived through a complete nightmare in 2008. Having started the year at 55,538 points, it fell to 26,411 points as of yesterday's close, an annual loss of 52.4 percent. No previous year comes close: in our research going back to 1988, the biggest loss before 2008 was 45 percent in 1988, followed by 38 percent in 2000, 24.76 percent in 2002 and 24.72 percent in 1998."
 Turkey_news.21.a:1 "Got a Cigarette?"
 Turkey_news.22.t:0 "The Mavi Marmara Crisis"
 Turkey_news.22.d:1 "On 23 July 2010, the Israeli government decided to release the three ships of the Gaza Freedom Flotilla, two of which had been moored at the Port of Haifa and the third at the Port of Ashdod since their interception. Three Turkish tugboats were sent to bring them back to Turkey. The Mavi Marmara was towed by the Ocean Ergün on a two-day journey to the Port of İskenderun, arriving on 7 August 2010. No one was allowed aboard because of the public prosecutor's ongoing investigation, but broken windows and bullet holes in the pilothouse glass were visible in released photographs. The IHH emblem on the ship's port side had been painted over in white. According to Turkish media, forensic teams identified some 250 bullet holes in the ship, many of which they said had been painted or plastered over by Israel. The ship returned to Istanbul harbor on 26 December 2010 at a welcoming ceremony attended by thousands."
 Turkey_news.22.a:1 "Imperialism Around the Corner"
 Turkey_news.23.t:0 "The Legacy of Ecevit"
 Turkey_news.23.d:1 "The Republic of Turkey is turning back to its traditions, and Ecevit's party is once again trying to salvage something. Turkish heroism and assertiveness look set to grow. According to a statement from the US State Department, any misstep by Turkey will first bring sanctions and, if another mistake follows, war, especially if America feels threatened. The US military is expected to hold exercises in Alexandroupoli."
 Turkey_news.23.a:1 "Long Live Turkish Heroism!"
 Turkey_news.24.t:0 "The Turkish Gateway Project Succeeds"
 Turkey_news.24.d:1 "The Republic of Turkey has announced that it has completed the Turkish transit corridor project after carrying out its plans and the necessary investments. Turkey has become a major transit hub, and the trade now flowing through the country will make a significant contribution to its economy. Turkey is developing rapidly."
 Turkey_news.24.a:1 "What A Trade Route!"
 Turkey_news.25.t:0 "The Rise of Greco-Turkism"
 Turkey_news.25.d:1 "The ideals of Greco-Turkism have come to power in Turkey, and the same change is expected in Greece. The enmity between the two rivals seems to be coming to an end, which will anger the nationalists of both countries and above all Russia. According to its supporters, a bilingual "Greco-Turkish Confederation" (Eastern Mediterranean Confederation) of Greece, Turkey and Cyprus, with national capitals in Athens, Ankara and Nicosia and a confederal parliament in Istanbul, would to some extent be a reincarnation of the Byzantine and Ottoman Empires, filling the political, cultural and economic vacuum left by the absence of these two historic superpowers in the Eastern Mediterranean. It would have the largest economy and military in a region spanning the Balkans, the Middle East, the Eastern Mediterranean, the Caucasus and Central Asia, and its geographic position would make it one of the world's great powers."
 Turkey_news.25.a:1 "What!"
 Turkey_news.26.t:0 "The First Mafia Takeover"
 Turkey_news.26.d:1 "After a long struggle, the mafias have seized power in Turkey, sending shockwaves around the world. \n\nPublic fears are growing. With the mafias in power, organized crime will surge, and crime in general will rise with it. We hope the United Nations and other world organizations will be able to deal with this mafia regime."
 Turkey_news.26.a:1 "Oh Dear"
 Turkey_news.27.t:0 "The Organization of Islamic Cooperation Becomes Real"
 Turkey_news.27.d:1 "The Islamic Cooperation bloc has been growing stronger following its decision to unite. \n\nAlongside this decision, anti-American demonstrations have surged. The Islamic world now stands as the only voice that will oppose American influence, defend its lands from invaders and protect itself against non-Muslims."
 Turkey_news.27.a:1 "Islam Finds Itself United"
 Turkey_news.28.t:0 "Anarchists Take Control of the IMF"
 Turkey_news.28.d:1 "Control of the IMF has passed to anarchists, and the countries of the world have accepted it, believing the anarchists will run the IMF more systematically. \n\nThe world is meeting anarcho-capitalism for the first time and wants to reap its blessings. What does the future hold? Time will tell."
 Turkey_news.28.a:1 "International Anarchism?"
 Turkey_news.29.t:0 "A NATO Country Turning Into a Russian Ally?"
 Turkey_news.29.d:1 "On 31 July, the deadline set by the United States for Turkey to abandon its S-400 deal with Russia expired. \n\nAs Ankara continues trying to negotiate with Washington and persuade it not to impose sanctions, Western pundits have begun talking about a major shift in Turkish foreign policy. Some have even suggested that Turkey has "turned its back on the US" and is gravitating toward Russia."
 Turkey_news.29.a:1 "An Incident"
 Turkey_news.30.t:0 "Andrew Brunson Sent Back to the USA"
 Turkey_news.30.d:1 "Evangelical Christians in the US swiftly took up his case, saying the accusations against him were baseless and that he was being detained and persecuted for his faith. The American Center for Law and Justice, a conservative Christian organization, lobbied the White House and others on Brunson's behalf and launched a petition declaring that "Christianity is on trial", signed by almost 600,000 people. \n\nTrump's first tweet about Brunson, posted in April, read: "Pastor Andrew Brunson, a fine gentleman and Christian leader in the United States, is on trial and being persecuted in Turkey for no reason. They call him a Spy, but I am more a Spy than he is. Hopefully, he will be allowed to come home to his beautiful family where he belongs!""
 Turkey_news.30.a:1 "What A Tragedy!"
 Turkey_news.31.t:0 "The Turkish Civil War"
 Turkey_news.31.d:1 "Tensions are rising in Turkey after the communists won legitimate power at the ballot box. Unhappy with the results, the right wing took to the streets and rebelled, starting a civil war. This right-wing movement is openly funded by Ülkücü nationalists, which explains why it is so strong. \n\nThe fighting is expected to go on for a long time, with the communists expected to win in the end."
 Turkey_news.31.a:1 "The Homeland Is at War!"
 Turkey_news.32.t:0 "The First Anarchist Takeover"
 Turkey_news.32.d:1 "The anarchist revolution has arrived in Turkey, and it has resonated around the world. \n\nAnarchism may spread across the globe. If it did, who would be left standing? The revolution sends shivers down people's spines."
 Turkey_news.32.a:1 "The Start of a Witch Hunt"
 Turkey_news.34.t:0 "Swedish-Turkish Political Crisis"
 Turkey_news.34.d:1 "Turkey has strongly condemned the Qur'an burning in Sweden, and Erdoğan has said Sweden should not be admitted to NATO. The Danish right-wing extremist Paludan, who burned the Qur'an in Sweden, drew condemnation from across the Islamic world, and protests were held in front of several Swedish consulates. Some said it would take a long time for the tension with Sweden to ease."
 Turkey_news.34.a:1 "Oh Dear..."
 Turkey_news.35.t:0 "A Constitutional Government Takes Over Turkey"
 Turkey_news.35.d:1 "An unexpected event has taken place in Turkey: the Constitutional Court has risen against the Turkish Armed Forces and the government, seizing legislative, executive and judicial power. The chain of command in the army has been thrown into disarray. The Court called on citizens to remain calm and stressed Atatürk's principles of justice, while NATO and the European Union backed the Court's move."
 Turkey_news.35.a:1 "This Was Not Expected"
 Turkey_news.36.t:0 "The Kahramanmaraş 7.7 and 7.6 Earthquakes"
 Turkey_news.36.d:1 "On 6 February, at around 04:15 local time, a magnitude 7.8 earthquake struck south-central Türkiye near the Syrian border. Just 11 minutes later it was followed by a magnitude 6.7 aftershock. The largest aftershock at the time of writing was a M7.5 quake that struck 95 km (about 60 miles) to the north. USGS observations and analyses indicate that all of these events are occurring within the East Anatolian fault system.\n\nThe two largest earthquakes in the sequence are relatively shallow, with the mainshock 18 kilometers (11 miles) deep and the M7.5 aftershock 10 kilometers (just over 6 miles) deep, which is why the shaking is so severe."
 Turkey_news.36.a:1 "May Heaven Help Us"
 Turkey_news.37.t:0 "Kilicdaroglu Becomes the Opposition Candidate"
 Turkey_news.37.d:1 "Turkish opposition leader Kemal Kilicdaroglu emerged on Monday as the main challenger to President Tayyip Erdogan in the landmark elections expected on 14 May, after a six-party alliance picked him as its presidential candidate, as expected.\n\nKilicdaroglu, 74, head of the country's second-largest party, aims to step out of Erdogan's shadow and unseat the President after a two-decade rule that has transformed the NATO member and major emerging-market economy. "Our table is the table of peace. Our only goal is to lead the country to days of prosperity, peace and joy," Kilicdaroglu, chairman of the Republican People's Party (CHP), told about 2,000 people gathered in Ankara."
 Turkey_news.37.a:1 "Interesting"
 Turkey_news.38.t:0 "Victory of Muharrem İnce in 2023"
 Turkey_news.38.d:1 "Muharrem İnce has brought an end to a long-lasting government: the AK Party era of some 20 years is over. On election day there was great enthusiasm around İnce, who has now become President by defeating his strong rivals Recep Tayyip Erdoğan, Kemal Kılıçdaroğlu and Sinan Oğan. Some uncertainty is expected after the end of the long AK Party rule, but if nothing unexpected happens, things will be fine."
 Turkey_news.38.a:1 "Very Interesting"
 Turkey_news.39.t:0 "Victory of Sinan Oğan in 2023"
 Turkey_news.39.d:1 "Sinan Oğan has brought an end to a long-lasting government: the AK Party era of some 20 years is over. On election day there was great enthusiasm around Oğan, who has now become President by defeating his strong rivals Recep Tayyip Erdoğan, Kemal Kılıçdaroğlu and Muharrem İnce. Some uncertainty is expected after the end of the long AK Party rule. Oğan's rise to power also raises another question: what will happen to the refugees now? Will they be expelled from the country as promised, regardless of the European Union?"
 Turkey_news.39.a:1 "Very Interesting"
 Turkey_news.40.t:0 "Victory of Erdoğan in 2023"
 Turkey_news.40.d:1 "According to unofficial results, President Recep Tayyip Erdoğan has been re-elected with 52 percent of the vote. After his victory, Erdoğan gave his customary "balcony speech" at the Presidential Complex in Beştepe, opening with a song he had often sung at his campaign rallies, while the crowd chanted "Here is the army, here is the commander".\n\n"You did not let the People's Alliance down, you did not leave it alone," Erdoğan said. "We walked this road together, day and night, and you have entrusted us with this task once again. God willing, we will keep building the Century of Türkiye together.""
 Turkey_news.40.a:1 "Very Interesting §Y(With No Speech)§!"
 Turkey_news.40.b:1 "Long Live Recep Tayyip Erdoğan"
 Turkey_news.41.t:0 "Victory of Kılıçdaroğlu in 2023"
 Turkey_news.41.d:1 "In an unexpected turn of events, Kemal Kılıçdaroğlu, leader of the Republican People's Party (CHP), has won the Turkish elections. His victory signals a dramatic shift in Turkey's political landscape and promises a new era of unity, reform and inclusive government.\n\nIn a closely fought race, Kılıçdaroğlu's campaign gained momentum with its message of national unity and social justice. Voters longing for an end to the prevailing political polarization responded warmly to his inclusive approach, carrying him to victory."
 Turkey_news.41.a:1 "Very Interesting"
 Turkey_news.42.t:0 "The Return of Atatürk"
 Turkey_news.42.d:1 "It has turned out that Mustafa Kemal Atatürk is alive, an unbelievable development that has left scientists baffled. Did God bring Atatürk back out of pity for the Turks? His return has caused tension in Greece, Armenia and Syria alike. Atatürk is expected to take over the country and carry out sweeping reforms, and Turkey hopes to break somewhat with the European Union's excesses and achieve free, democratic economic development under his supreme leadership."
 Turkey_news.42.a:1 "It's Impossible"
 Turkey_news.43.t:0 "North Kurdistan Joins Turkey"
 Turkey_news.43.d:1 "In a surprising move, the autonomous region of North Kurdistan has decided to join Turkey as a fully integrated province. The decision follows months of negotiations between the Kurdish government and Turkish officials, with both sides agreeing to a series of terms for the merger. Under the agreement, North Kurdistan will become Turkey's 82nd province, with its own governor and administrative structure. Kurdish will be recognized as an official language alongside Turkish, and the Kurdish population will enjoy full citizenship rights and representation in the Turkish parliament. The decision has drawn mixed reactions in the region: some Kurdish nationalists denounce it as a betrayal of their struggle for independence, while others see it as a step toward greater unity and cooperation between Kurds and Turks and hope it will bring greater stability and prosperity to the region as a whole."
 Turkey_news.43.a:1 "It's Impossible"
 Turkey_news.44.t:0 "The Assassination of Gülen"
 Turkey_news.44.d:1 "In a shocking turn of events, Fethullah Gülen, the controversial Turkish cleric, failed to survive an assassination attempt earlier today. The attack took place at Gülen's residence, where unidentified assailants infiltrated the premises with the apparent aim of killing him. Although his security personnel intervened, they could not stop the attackers in time. As investigations continue, the world is watching closely to see how this development will affect the already complex relationship between Turkey and the United States. The incident is a reminder of the ongoing power struggles, political tensions and controversies surrounding Fethullah Gülen and his movement."
 Turkey_news.44.a:1 "Oh Dear"
 Turkey_news.45.t:0 "Operation Blue Skirmish"
 Turkey_news.45.d:1 "In a surprising move, the United States and NATO governments have declared their intention to intervene in the ongoing Turkish Civil War, with a primary focus on providing NATO aid and promoting peace in the region. The decision comes after months of careful deliberation and extensive diplomatic efforts to address the escalating political crisis and the widespread suffering caused by the conflict.\n\nAs the Turkish Civil War rages on, the toll on civilian lives and infrastructure keeps mounting. Reports of mass displacement, food shortages and a lack of medical supplies have drawn international attention and concern. Recognizing the urgency of the situation, the United States and NATO have committed to helping ease the suffering and restore stability to the war-torn country."
 Turkey_news.45.a:1 "The United States Brings Freedom Again"
 Turkey_news.46.t:0 "Russia Smashes Operation Blue Skirmish"
 Turkey_news.46.d:1 "In a worrying turn of events, Russia has voiced deep concern over the intervention of the United States and NATO in the ongoing Turkish Civil War. As the conflict escalates, Russian officials have warned that the involvement of foreign powers could have far-reaching consequences, including for critical international waterways such as the Turkish Straits.\n\nAs tensions rise, reports confirm that Russian troops, backed by armored vehicles and air support, have crossed into the Straits region. The move is seen as a show of force and a clear message that Russia will not tolerate what it sees as encroachment on its sphere of influence, raising fears of a wider regional confrontation."
 Turkey_news.46.a:1 "Tensions Are Escalating"
 Turkey_news.47.t:0 "SADAT-Led Tank Convoy Attempts to Topple the Government"
 Turkey_news.47.d:1 "In an unprecedented turn of events, Turkey has been plunged into turmoil by a coup attempt organized by a group linked to SADAT, a private defense consultancy, seeking to topple the MİT-led government of Hakan Fidan and Fahrettin Altun. The state faced unexpected challenges as the coup plotters sent a tank convoy marching toward Ankara, threatening the nation's institutions. The attempt sent shockwaves across the country and alarmed the international community about the consequences of a successful overthrow."
 Turkey_news.47.a:1 "SADAT Marches"
 Turkey_news.48.t:0 "The HP's Technocratic Referendum Triumph"
 Turkey_news.48.d:1 "Turkey is navigating uncharted waters after the Technocratic Party (Halkın Partisi, HP) won a resounding victory in the technocratic referendum, signaling a paradigm shift in the nation's government. While the HP's success shows a public mandate for evidence-based decision-making, its aftermath has revealed a series of unforeseen challenges and social complexities that have left the nation searching for solutions. The results, a majority in favor of the HP's technocratic vision, reflect a growing desire among Turkish citizens for a government guided by experts and data-driven policy. The HP's promises of efficiency, progress and effective problem-solving resonated with voters looking for new answers to pressing problems."
 Turkey_news.48.a:1 "A Technocratic Takeover?"
 Turkey_news.49.t:0 "The Turkish Civil War"
 Turkey_news.49.d:1 "Turkey has descended into chaos as a fierce civil war erupts between powerful mafia groups and government forces led by MİT Chief Hakan Fidan. The nation stands on the brink of destruction as violent clashes spread across major cities, leaving a trail of devastation and loss. The crisis began when tensions between the government and the mafias, fueled by long-standing rivalries and competing interests, reached boiling point. Seeking to assert control and expand their influence, the mafias launched a series of brazen attacks on key government institutions and officials. Hakan Fidan, head of Turkey's National Intelligence Organization (MİT), took charge of the government's response, vowing to protect the state's institutions and maintain law and order."
 Turkey_news.49.a:1 "Turkey Falls Into Instability"
 Turkey_news.50.t:0 "Turkey Shoots Down Russian Planes"
 Turkey_news.50.d:1 "In a highly provocative incident, Turkey has reportedly shot down two Russian military planes that entered its airspace near the Syrian border. The incident has raised tensions between Turkey and Russia and caused international concern over its possible consequences for regional stability.\n\nAccording to the Turkish authorities, the Russian aircraft violated Turkish airspace without authorization and ignored multiple warnings to turn back. In response to the threat to its territorial integrity, Turkish fighter jets engaged and downed the Russian planes.\n\nThe Russian government has vehemently disputed Turkey's account, claiming that its planes were on a routine patrol over Syria and never crossed into Turkish airspace."
 Turkey_news.50.a:1 "What a Dramatic Situation!"
 Turkey_news.51.t:0 "The Turkish Government Arrests Ekrem İmamoğlu"
 Turkey_news.51.d:1 "Istanbul Mayor Ekrem İmamoğlu, President Recep Tayyip Erdoğan's biggest rival, has appeared in court for the first time since he was arrested last month and placed in a high-security prison. İmamoğlu is being held on corruption and terrorism charges, but on Friday he appeared before a special court at Silivri prison in a separate case in which he is accused of trying to intimidate Istanbul's chief prosecutor. Turkey's opposition has condemned his arrest as a "coup attempt against our next president", and his detention has sparked the biggest anti-Erdoğan protests in more than a decade.\n\n"I am here because I won elections three times in Istanbul," İmamoğlu told the court. "I am here under arrest because I proved the saying 'Whoever wins Istanbul, wins Turkey'."\n\nİmamoğlu was referring to President Erdoğan, who launched his political career as mayor of Turkey's largest city and has often used the phrase since."
 Turkey_news.51.a:1 "That Doesn't Sound Good"

