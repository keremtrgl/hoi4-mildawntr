 TurkeyF.72.desc:0 "Turkey wants to form an alliance with us. Joining it could cause problems with other organizations we belong to. Sir, how should we answer Ankara's offer?" 
 TurkeyF.72.a:0 "A Wise Idea"
 TurkeyF.72.b:0 "We Don't Need An Alliance"
