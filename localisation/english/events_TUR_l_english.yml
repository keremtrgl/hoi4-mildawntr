 Turkey.531.title:0 "Hidden Financial Turmoil: Interest Rate Cut To 8.5"
 Turkey.531.desc:0 "With elections approaching, the economy was felt to need tight control. Since a rise in foreign exchange rates would cause us political difficulties and interest rates could not be raised for political reasons, the CBRT made this decision under pressure from the ruling party.\n\nFailing to bring the exchange rate under control came at a heavy cost: the Central Bank suffered extraordinary losses. The slowdown in the exchange rate began to fade, and worrying changes started to appear in interbank trading. This will inevitably cause Turkey great harm in the future."
 Turkey.531.a:0 "That's How Populism Works"  
 Turkey.565.title:0 "Dollar Rises To 23.60"
 Turkey.565.desc:0 "The dollar/TL rate, which had traded in a narrow, publicly controlled band before the election, has completely broken out of its horizontal course. The Turkish lira opened the day down more than 7 percent against the dollar."
 Turkey.565.a:0 "Turkish Economy Is In Trouble"  
 Turkey.610.title:0 "Central Bank Increases Interest Rate To 15"
 Turkey.610.desc:0 "The Central Bank of the Republic of Turkey (CBRT) has raised interest rates for the first time in 27 months. At the first Monetary Policy Committee (MPC) meeting chaired by CBRT Governor Hafize Gaye Erkan, the policy rate was raised by 650 basis points, from 8.5 percent to 15 percent. After the decision, the dollar/TL rate passed 24.41 and the euro/TL rate passed 26.84 for the first time. Turkey's credit default swap (CDS) spread rose by 21 points to 518."
 Turkey.610.a:0 "We Need To Ease Our Economic Conditions"  
 Turkey.611.title:0 "Central Bank Increases Interest Rate To 17.5"
 Turkey.611.desc:0 "The Central Bank's policy rate decision, eagerly awaited by citizens and by every sector tied to the economy, has been announced. The hike was limited to 250 basis points (2.5 percent), falling short of expectations."
 Turkey.611.a:0 "We Need To Ease Our Economic Conditions"  
 Turkey.624.title:0 "Central Bank Increases Interest Rate To 25"
 Turkey.624.desc:0 "Turkey’s Central Bank hiked interest rates Thursday by 750 basis points from 17.5% to 25%. The larger than expected rise prompted the Turkish lira to recover from a record low."
 Turkey.624.a:0 "Good Reaction From The Central Bank"
 Turkey.630.title:0 "Central Bank Increases Interest Rate To 30"
 Turkey.630.desc:0 "The Central Bank's Monetary Policy Committee decided to raise the one-week repo auction rate, the policy rate, from 25 percent to 30 percent. In a statement, the Central Bank stressed that the Committee had decided to "continue the monetary tightening process in order to establish disinflation as soon as possible, anchor inflation expectations and contain the deterioration in pricing behavior.""
 Turkey.630.a:0 "Another Reaction"
 Turkey.631.title:0 "Central Bank Increases Interest Rate To 35"
 Turkey.631.desc:0 "The Monetary Policy Committee of the Central Bank of the Republic of Turkey (CBRT) convened under the chairmanship of Hafize Gaye Erkan and raised the policy rate by 500 basis points, from 30 percent to 35 percent. The announcement said the Committee had decided to continue monetary tightening in order to establish disinflation as soon as possible, anchor inflation expectations and contain the deterioration in pricing behavior, and noted that inflation in the third quarter had come in above forecast."
 Turkey.631.a:0 "Is This Really Working!?"
 Turkey.643.title:0 "Central Bank Increases Interest Rate To 40"
 Turkey.643.desc:0 "Turkey's central bank has raised interest rates to 40 percent, its highest level in nearly two decades, in a significant move to tame the country's runaway inflation after the country's president, Recep Tayyip Erdogan, had previously defied economic convention by cutting rates to slow price increases."
 Turkey.643.a:0 "Price Stability First!"
 Turkey.644.title:0 "Central Bank Increases Interest Rate To 42.5"
 Turkey.644.desc:0 "The Monetary Policy Committee (the Committee) has decided to raise the policy rate (the one-week repo auction rate) from 40 percent to 42.5 percent. Headline inflation edged up in November and remains in line with the outlook presented in the most recent Inflation Report."
 Turkey.644.a:0 "Price Stability First!"
 Turkey.645.title:0 "Central Bank Increases Interest Rate To 45"
 Turkey.645.desc:0 "Turkey's central bank raised its key interest rate to 45% on Thursday, as expected. Annual inflation in Turkey rose to 64.8% in December, up from 62% in November."
 Turkey.645.a:0 "Price Stability First!"
 Turkey.649.title:0 "Central Bank Increases Interest Rate To 50"
 Turkey.649.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday raised its policy rate by 500 basis points to 50 percent. Taken just 10 days before the local elections, the decision sends a strong and valuable signal as the Central Bank tries to restore its credibility."
 Turkey.649.a:0 "It Hurts!"


 Turkey.293.title:0 "Tanks Are Passing Through Ankara" 
 Turkey.293.desc:0 "We made it clear that the new government would put the country in a difficult position and would never get along with our military. That is why military intervention has become inevitable. Great Turkish nation, our goal is not to impose stability through ultranationalism. Our goal is to set the country back on a democratic course!"
 Turkey.293.a:0 "Military intervention is here!" 
 Turkey.295.title:0 "Ilker Basbug Arrested" 
 Turkey.295.desc:0 "Seventeen months after his retirement, on 2 January 2012, an investigation was opened against Basbug as part of the "internet memorandum" case, in which he had been expected to testify as a witness. He was arrested on 6 January 2012 on charges of "leading an armed terrorist organization and attempting to overthrow the government.""
 Turkey.295.a:0 "Gülen's Influence Is Rising" 
 Turkey.296.title:0 "Ilker Basbug Released" 
 Turkey.296.desc:0 "Retired General Ilker Basbug, former Chief of the General Staff, walked out of Silivri Prison after the High Criminal Court ordered his release.\n\nSpeaking to the press after his release, Basbug recalled that when he was arrested on 6 January 2012 he had said, "The 26th Chief of the General Staff has been arrested on charges of founding and running a terrorist organization. I leave the judgment to the great Turkish nation," and noted that 26 months had passed since then. He continued:\n\n"Those driven by hatred and revenge kept us in this prison for 26 months. They stole 26 months of my life. They deprived me of my freedom for 26 months. But as I said on 6 January 2012, the great Turkish nation soon saw through the game: the allegations were baseless, and accusing the Chief of the General Staff and his headquarters of being a terrorist organization was unacceptable. We had nothing to do with any coup. If I stand here today, it is thanks to the love and support my great nation has shown us. So first of all, I express my deepest gratitude to the great Turkish nation in your presence."\n\nHe said he believed his release was only a beginning:\n\n"My release today is a start. I believe with all my heart that my friends in Silivri, Hasdal and Maltepe, whose innocence is plain, will be freed as soon as possible. Otherwise my freedom today will mean nothing to me. However innocent I am, Tuncer Kılınç Pasha, Hurşit Tolon Pasha, Bilgin Balanlı Pasha and Hasan Iğsız Pasha, and on the other side Tuncay Özkan and Doğu Perinçek, are just as innocent. I also want to stress that the grounds for my release today apply to every one of them. Therefore all of those held captive in these dungeons will surely regain their freedom as soon as possible. We are certain of it. No force can stop it.""
 Turkey.296.a:0 "The Result of a Grave Mistake" 
 Turkey.297.title:0 "Former Chief of the General Staff Ilker Basbug Sued" 
 Turkey.297.desc:0 ""The 27 May military coup could probably have been prevented if Menderes had announced the date of early elections in Eskisehir on 25 May 1960," Ilker Basbug said in an interview with the Cumhuriyet newspaper on 4 January, "because staging a military coup against a government that has decided to hold early elections would obviously be a blow to the nation's political will."\n\nThe indictment claimed that with this interview Basbug had hinted at a "coup" and thus committed the crime of "publicly inciting the people to hatred and hostility"; Basbug's statement to the prosecutor's office was included in it.\n\nAccording to the statement quoted in the indictment, Basbug said that the third book of his series, "The Struggle of Power Centers in the Republic of Turkey", assessed the period 1961-1980 under the conditions of that day and within the framework of events of that time, that similar remarks had been made earlier by other authors, and that it was wrong to link them to today's events. Ilker Basbug denied the accusations.\n\nThe indictment asked for Basbug to be sentenced to 1 to 3 years in prison for "publicly inciting hatred and hostility".\n\nThe Istanbul Criminal Court of First Instance accepted the indictment sent by the chief prosecutor's office. Basbug will appear before a judge in the coming days."
 Turkey.297.a:0 "No problem, we will defend him" 
 Turkey.297.b:0 "There will be no more coups in the Turkish Republic"
 Turkey.298.title:0 "Devlet Bahceli Announces a 100-Article Constitution" 
 Turkey.298.desc:0 "MHP Chairman Devlet Bahceli announced that his party's proposal for a new 100-article constitution is ready and that it will first be shared with the AK Party and the President. Bahçeli said the unamendable articles of the Constitution are preserved as they are."
 Turkey.298.a:0 "Interesting News From The Partner" 
 Turkey.299.title:0 "Ali Demir, Hero of 15 July, Joins the IYI Party" 
 Turkey.299.desc:0 "At today's IYI Party group meeting, party chair Meral Akşener pinned the party badge on Ali Demir, one of the heroes of 15 July. "I am honored to join the IYI Party," Demir said."
 Turkey.299.a:0 "Interesting" 
 Turkey.300.title:0 "Deniz Baykal Resigns" 
 Turkey.300.desc:0 "Appearing before journalists, Deniz Baykal said:\n\n"I am announcing the assessment and decision you have been waiting for for days. This is not a matter of a tape; it is a conspiracy. A conspiracy is an unlawful and immoral scheme. When you conspire, you sometimes break into a home. With hidden cameras you take the most unguarded images of people, then cut, edit and distort them. You trample on the moral code of every religion and of humanity itself. They have no regard for people's honor. Those behind this conspiracy are perverts; they did not do it for blackmail, but to do politics.\n\nA conspiracy has been fabricated, a fresh one, two weeks old. Its target is not one person. Its target is the struggle the CHP is waging, almost alone, against the civilian dictatorship. It was edited and released within the last two weeks; the conspiracy workshop's materials and footage are fresh. Such a crude scheme could not have been prepared and released without the knowledge of the highest levels of power. Their so-called well-meaning statements after the incident are not enough to hide the guilt of those behind the scenes. This could not have been released without the government's knowledge and approval. Indeed, the shameful ones are those who commit the shameful act.\n\nI also believe in the sincerity of the messages of sympathy I received from the United States, from Pennsylvania. 'It is a shame,' they say, but I have a word for them: you cannot defend yourself while profiting from immoral and unlawful conspiracies. Those who call it a shame while opening the way for conspiracies are the real shame. We will all see how far those who give credit to these conspiracies can go.\n\nI will not surrender to this scheme. I will not let anyone call me to account. If there is a price for that, and if the price is leaving the leadership of the CHP, I will pay it. My resignation is not running away. On the contrary, it is a challenge. I am resigning, because the target here is not me, it is the CHP."\n\nIt was announced that Deputy Chairman Cevdet Selvi would serve as acting leader in accordance with the party's bylaws.\n\nAfter Baykal announced his resignation, some party members were heard shouting, "No, don't do it!"\n\nSome party members could not hold back their tears during the announcement."
 Turkey.300.a:0 "Sad Moments For CHP" 
 Turkey.300.b:0 "Sad Moments For CHP §Y(With No Speech)§!" 
 Turkey.301.title:0 "An Attack On Kılıçdaroğlu" 
 Turkey.301.desc:0 "CHP leader Kemal Kılıçdaroğlu was assaulted by a group throwing punches after the funeral prayer of martyred contract infantry private Yener Kırıkçı in the Çubuk district. With the intervention of his bodyguards and nearby security forces, Kılıçdaroğlu was taken to a nearby house."
 Turkey.301.a:0 "He Must Be Badly Shaken" 
 Turkey.302.title:0 "The March for Justice" 
 Turkey.302.desc:0 "The March for Justice was a 450 km (280-mile) march from Ankara to Istanbul to protest the arrests made in the government crackdown following the July 2016 coup attempt. After the coup attempt, the ruling Justice and Development Party (AKP) government declared a state of emergency; since then at least 50,000 people have been arrested and another 140,000 removed from their posts. The protest was led by opposition leader Kemal Kılıçdaroğlu in response to the lengthy prison sentence handed to Enis Berberoğlu for allegedly giving the press a video showing Turkish intelligence smuggling weapons into Syria. The march ended in Istanbul on 9 July with a rally attended by hundreds of thousands of people, where Kılıçdaroğlu spoke at length about the purge's effect on the judiciary and the rule of law in Turkey.\n\nPresident Recep Tayyip Erdoğan declared the march illegal. During the march, Prime Minister Binali Yıldırım and President Erdoğan compared it to the July 2016 coup attempt and accused the participants and Kılıçdaroğlu of supporting the Gülen movement, which the government blames for the coup attempt. AKP supporters held counter-demonstrations. Police provided security for the marchers, and the march ended peacefully in Maltepe, Istanbul."
 Turkey.302.a:0 "What the...?"
 Turkey.303.title:0 "Yenikapi Rally" 
 Turkey.303.desc:0 "The Democracy and Martyrs Rally was held in Yenikapı Square on 7 August 2016, with the Justice and Development Party, the Republican People's Party and the Nationalist Movement Party all attending in protest against the 15 July coup attempt. The rally was the culmination of a series of anti-coup demonstrations. President Recep Tayyip Erdogan, Prime Minister Binali Yildirim, CHP leader Kemal Kilicdaroglu, MHP leader Devlet Bahceli, Chief of the General Staff Hulusi Akar and Speaker of the Grand National Assembly Ismail Kahraman addressed the crowd. The Qur'an was recited for the citizens who lost their lives in the coup attempt."
 Turkey.303.a:0 "Turkey is indivisible"  
 Turkey.304.title:0 "Devlet Bahceli's Announcement" 
 Turkey.304.desc:0 "MHP Chairman Devlet Bahceli spoke at his party's group meeting in Parliament. On the call for early elections, Bahceli said: "The CHP leader wants to go to the polls as soon as possible; he is obviously in a hurry. Our country has no such agenda as pressure, accountability and early elections that Kilicdaroglu is pushing. Don't forget that." On the alleged insult against Atatürk, he said: "This is a provocation in the guise of Islam. Whether they are secret Gülenists must be investigated. Everyone must be vigilant. Atatürk is the common denominator of our national unity. Do those who speak ill of Atatürk think they are better Muslims than he was? Hostility to Atatürk serves treason.""
 Turkey.304.a:0 "Interesting"  
 Turkey.305.title:0 "Suleyman Soylu Resigns" 
 Turkey.305.desc:0 "A curfew was declared because of the virus, and people rushed to fill the grocery stores. In the fallout, Minister of the Interior Suleyman Soylu resigned. Erdogan did not accept his resignation."
 Turkey.305.a:0 "He Is Needed" 
 Turkey.306.title:0 "2013 Corruption Scandal" 
 Turkey.306.desc:0 "On 17 December 2013, the largest corruption and bribery scandal in the history of the Republic broke out. The operation, which targeted ministers, bureaucrats, businessmen and mayors, was followed by a second wave on 25 December. Shortly after that wave, which included Bilal Erdogan, son of then Prime Minister Tayyip Erdogan, along with a group of 41 businessmen, a third operation targeting the Istanbul Fire Department and Beyoglu Municipality followed on 16 January. However, the last two waves were blocked by the AKP government and could not be carried out.\n\n1. The Black Money File\n\nThe first investigation, the "Black Money File", covered 21 people, including businessman Reza Zarrab, the ministers' sons Barış Güler and Kaan Çağlayan, and Halkbank General Manager Süleyman Aslan. Prosecutors sought their arrest for "gold smuggling, money laundering and bribery".\n\n2. Zoning Corruption\n\nThe "Fatih File", covering corruption and bribery in the AKP-run Fatih Municipality, named 27 suspects including Mayor Mustafa Demir. Prosecutors sought their arrest on charges of "giving and taking bribes".\n\n3. Urban Planning Crimes\n\nThe "urban crimes" file named 23 suspects, among them the well-known businessman Ali Ağaoğlu and Abdullah Oğuz Bayraktar, son of Environment and Urban Planning Minister Erdoğan Bayraktar. The suspects were alleged to have pushed through zoning plans that municipalities had not approved, interfered with the Cultural and Natural Heritage Board's plan changes by pressuring board and commission members, and obtained bribes or false reports to open registered cultural and historic sites, natural protected areas and green spaces, including land under the Bosphorus protection law, to development.\n\n4. The Money Counting Machine in the Bedroom\n\nA search ordered by the Istanbul Chief Public Prosecutor's Office at the home of Barış Güler, son of Interior Minister Muammer Güler, found large amounts of Turkish lira and foreign currency, along with six steel safes packed in boxes. Minister Güler claimed the money came from the sale of a villa in Bahçeşehir, including the 1.2 million dollars stacked in the bedroom, and that the six safes belonged to his son's closed businesses and had been moved from the office to the house.\n\nAt the home of Halkbank General Manager Aslan, 4.5 million dollars were found hidden in shoeboxes, along with call records and photographs. In his statement to the prosecutor, Aslan said: "All of the 4.5 million dollars found in my house is donation money collected to build schools. It was to be used for the construction of Balkan University in Macedonia and an Imam Hatip high school in Osmancık, Çorum. It was collected from benevolent people and I was going to send it there."\n\nOn Saturday, 21 December, four days later, the ministers' sons Barış Güler and Salih Kaan Çağlayan, businessman Reza Zarrab and Halkbank General Manager Süleyman Aslan were arrested. The two ministers' sons were charged with "mediating the giving and taking of bribes". The other suspects, including Minister Bayraktar's son, businessman Ağaoğlu and the Mayor of Fatih, were released. In total, 26 people were sent to prison in the first wave."
 Turkey.306.a:0 "Money, money, money!" 
 Turkey.307.title:0 "Binali Yildirim Makes a Statement" 
 Turkey.307.desc:0 "Responding to the claim that his son had gone to Venezuela to traffic dirty money, AKP Deputy Chairman Binali Yildirim said: "This is pure slander. It is a lie, and we strongly reject it.""
 Turkey.307.a:0 "Sounds Right"   
 Turkey.308.title:0 "Uber Returns" 
 Turkey.308.desc:0 "After a period of being blocked, Uber has quietly been allowed to operate again."
 Turkey.308.a:0 "Interesting"
 Turkey.309.title:0 "Ali Babacan Returns to Economic Forums" 
 Turkey.309.desc:0 "Ali Babacan has turned his attention to the economy once more, taking part in economic forums to help Turkey shake off the effects of the 2008 economic crisis as quickly as possible."
 Turkey.309.a:0 "Economy Needs To Be Saved"   
 Turkey.310.title:0 "Step by Step Toward the European Union" 
 Turkey.310.desc:0 "To keep relations with Europe on a good footing and to pave the way for EU membership, we have amended the Constitution through a series of EU harmonization laws. We hope that joining the European Union will allow our economy to keep growing."
 Turkey.310.a:0 "Very Nice"  
 Turkey.311.title:0 "Bülent Arinc's Unexpected Statement" 
 Turkey.311.desc:0 "A major feud between Deputy Prime Minister Bulent Arinc and Ankara Metropolitan Mayor Melih Gokcek erupted with a statement on 21 March. That day Arinc made an unexpected move, criticizing President Recep Tayyip Erdogan for his remarks about the peace process.\n\nWhile President Erdogan was expected to respond, Arinc came under heavy fire from a direction he did not expect. Ankara Metropolitan Mayor Melih Gokcek suddenly jumped into the fray, attacking Arinc over his son-in-law and branding him part of the "parallel structure"."
 Turkey.311.a:0 "Clashes In The AKP"  
 Turkey.312.title:0 "Melih Gokcek Resigns" 
 Turkey.312.desc:0 "Ankara Metropolitan Mayor Melih Gokcek, one of six mayors whom President and AKP leader Erdogan had asked to resign, said: "The President asked me to resign. In line with the President's instruction, I am leaving the office of mayor," stepping down from a post he had held for 23 years. At the end of his farewell speech, Gokcek prayed: "O Lord, destroy the seditionists among us who look like us but are not of us." Belma Ilhan, the municipality's general manager, could not hold back her tears during the farewell."
 Turkey.312.a:0 "Orders are orders"  
 Turkey.313.title:0 "Constitutional Referendum Result: YES" 
 Turkey.313.desc:0 "A constitutional referendum was held throughout Turkey on 16 April 2017 on whether to approve 18 proposed amendments to the Turkish constitution put forward by the governing Justice and Development Party (AKP) and the Nationalist Movement Party (MHP). With its approval, the office of Prime Minister was abolished and the existing parliamentary system was replaced by an executive presidency. The number of seats in Parliament was raised from 550 to 600 and, among a series of other changes, the president was given more control over appointments to the Supreme Board of Judges and Prosecutors (HSYK). The referendum was held under the state of emergency declared after the failed military coup attempt of July 2016.\n\nEarly results showed a 51–49% lead for "Yes". In an unprecedented move, the Supreme Electoral Council (YSK) allowed unstamped ballots to be counted as valid. Critics of the reform denounced the move as illegal, claiming that as many as 1.5 million ballots were unstamped, and refused to recognize the results. Large-scale protests against the YSK's decision broke out after the results were announced. In later reports, the Organization for Security and Co-operation in Europe (OSCE) and the Parliamentary Assembly of the Council of Europe (PACE) both criticized the unfairness of the campaign and declared the YSK's decision illegal."
 Turkey.313.a:0 "A Brand New Turkey"  
 Turkey.314.title:0 "Swearing-In Ceremony After the Constitutional Changes" 
 Turkey.314.desc:0 "Following the constitutional amendment, the new system was established. Erdogan and his ministers took their oaths at the swearing-in ceremony."
 Turkey.314.a:0 "What A Change!"
 Turkey.315.title:0 "Construction of the New Presidential Complex" 
 Turkey.315.desc:0 "Construction of the new Presidential Complex is complete, and the country can now be governed more comfortably from a single center. The new complex has been sharply criticized by the opposition."
 Turkey.315.a:0 "Interesting"
 Turkey.316.title:0 "TKP Defeats HDP In Tunceli" 
 Turkey.316.desc:0 "The TKP has won the election in Tunceli, defeating the HDP. Fatih Mehmet Maçoğlu becomes Mayor of Tunceli and is expected to give a speech in the city."
 Turkey.316.a:0 "Tunceligrad?"
 Turkey.317.title:0 "Sea Snot Begins to Invade the Sea of Marmara" 
 Turkey.317.desc:0 "The "sea snot" forming in and around the Sea of Marmara, coating both the seabed and the surface, keeps getting worse. The mucilage has made headlines in the world press as well. If it keeps spreading at this rate, it may become unstoppable. We must act immediately and start the clean-up."
 Turkey.317.a:0 "Act Fast!"
 Turkey.318.title:0 "Mansur Yavaş Joins a Twitch Stream" 
 Turkey.318.desc:0 "Ankara Metropolitan Mayor Mansur Yavaş joined the live stream of Pelin Baynazoğlu (Pqueen) on Twitch. Average live viewership exceeded 300,000, breaking the platform's viewing record in Turkey.\n\nMore than 20,000 TL raised during the stream will be donated to the "Green Capital" project launched by Ankara Metropolitan Municipality.\n\n"I sincerely thank dear Pelin and everyone who supported our Green Capital project and helped us set a live-stream record by watching. I will keep leading Ankara in the light of your ideas and will always listen to you. I'm glad you're here," he said."
 Turkey.318.a:0 "Interesting"
 Turkey.319.title:0 "Kemal Kilicdaroglu Joins a Twitch Stream" 
 Turkey.319.desc:0 "Following Mansur Yavaş, CHP leader Kemal Kılıçdaroğlu appeared with Jahrein, a famous Twitch streamer. The country's problems were discussed on the stream. It shows that the CHP keeps expanding its presence on Twitch."
 Turkey.319.a:0 "Interesting"
 Turkey.320.title:0 "AKP Releases Animated Propaganda Against the CHP" 
 Turkey.320.desc:0 "CHP leader Kemal Kilicdaroglu and CHP spokesman Faik Oztrak were caricatured in an AKP propaganda video made in cartoon style. The animation opens with the "Republican People's Party" sign falling to reveal a "CHP Lie Production Center" sign. The video has drawn backlash on social media."
 Turkey.320.a:0 "A Strange Move" 
 Turkey.322.title:0 "Ülkücüs Overthrow the Government" 
 Turkey.322.desc:0 "Nationalist armed groups secretly organized within the army have overthrown the government. Numerous arrests followed the coup."
 Turkey.322.a:0 "Wait, what?!" 
 Turkey.323.title:0 "Muharrem Ince Resigns" 
 Turkey.323.desc:0 "At the CHP congress, an angry Muharrem Ince announced that he would no longer run as the CHP candidate and would stand as an independent instead. About 60 MPs resigned from the party after his decision. Their aim is to leave the CHP and come to power on their own."
 Turkey.323.a:0 "Wait, what?!" 
 Turkey.324.title:0 "Ekrem Imamoglu Gains Power in the CHP" 
 Turkey.324.desc:0 "Ekrem Imamoglu, who defeated Erdogan, once considered invincible, twice, spoke with Kemal Kilicdaroglu about becoming the presidential candidate. Kilicdaroglu agreed, but there has been no response from Meral Akşener, who is expected to put forward her own candidate."
 Turkey.324.a:0 "Interesting" 
 Turkey.325.title:0 "Mansur Yavaş Gains Power in the IYI Party" 
 Turkey.325.desc:0 "Mansur Yavaş, known for his nationalist identity and for defeating Erdogan, once considered invincible, spoke with Meral Akşener about becoming the presidential candidate. Akşener agreed, but there has been no response from Kemal Kilicdaroglu, who is expected to put forward his own candidate."
 Turkey.325.a:0 "Interesting" 
 Turkey.326.title:0 "Erdogan Pushes For Early Elections" 
 Turkey.326.desc:0 "Former President Erdogan has begun pressuring us to call early elections; his aim is to seize power while the CHP is weak. What should we do about it?"
 Turkey.326.a:0 "Unnecessary Attacks" 
 Turkey.327.title:0 "Ali Babacan Joins a Twitch Stream" 
 Turkey.327.desc:0 "Ali Babacan, who broke away from the AKP, appeared on a stream with social media phenomenon Jahrein. The conversation lasted three hours. It looks like a profitable move for promoting his party."
 Turkey.327.a:0 "The opposition keeps taking over Twitch" 
 Turkey.328.title:0 "Turkey Becomes a Full Member of the European Union" 
 Turkey.328.desc:0 "After long negotiations, Turkey's accession to the European Union has been given the green light. Turkey took the final step and became an official member. Huge celebrations were held across the country."
 Turkey.328.a:0 "Finally!" 
 Turkey.328.b:0 "Finally! §Y(With No Sound)§!" 
 Turkey.329.title:0 "The End of Turkey's NATO Membership" 
 Turkey.329.desc:0 "NATO announced yesterday that it has completely severed its ties with Turkey. American naval forces then began withdrawing under Turkish and Russian pressure. With the US Navy gone and NATO having lost the state that controls the Straits, Russia has grown stronger and sent its fleet into the Mediterranean. NATO is no longer secure, and Russia's prestige is on the rise."
 Turkey.329.a:0 "NATO begins to lose its military cohesion"
 Turkey.329.b:0 "NATO begins to lose its military cohesion §Y(With No Sound)§!"
 Turkey.330.title:0 "Akinci Drone Breaks the Altitude Record" 
 Turkey.330.desc:0 ""The Akinci drone has broken the altitude record in the history of Turkish aviation, reaching the highest altitude ever achieved by a domestic and national air vehicle," Ismail Demir, head of the Presidency of Defense Industries, said on his Twitter account."
 Turkey.330.a:0 "Good"
 Turkey.331.title:0 "President Recep Tayyip Erdogan Announces Good News" 
 Turkey.331.desc:0 "Speaking at a special session of the TRNC Parliament, President Recep Tayyip Erdogan announced good news: a Presidential Complex and a National Garden will be built in the TRNC."
 Turkey.331.a:0 "Interesting"
 Turkey.332.title:0 "Tanju Ozcan Speaks Against Refugees" 
 Turkey.332.desc:0 "The Mayor of Bolu has spoken harshly about refugees from other countries. \n\n Bolu Mayor Tanju Ozcan: "For foreign nationals among our subscribers, water rates, solid waste fees and some other fees will increase tenfold. A Turkish citizen and a foreign national will not pay the same price for water. Why are we raising water and solid waste charges tenfold? Because we want them to leave. This hospitality has gone on too long. I don't have the authority to drive them out of town with the police. When the borders were opened, we provided buses and sent people off. And now we are ready to send them again. Let's just send them.""
 Turkey.332.a:0 "He's Completely Wrong!"
 Turkey.332.b:0 "He Was Actually Right!"
 Turkey.333.title:0 "The Bottomless Well Has Been Destroyed" 
 Turkey.333.desc:0 "The ancient Bottomless Well was excavated with legal permission, but the treasure expected there was never found. Finding nothing, the team of researchers left the site. The destruction of the well has caused outrage on social media."
 Turkey.333.a:0 "Start An Investigation Immediately"
 Turkey.334.title:0 "Animal Protection Law" 
 Turkey.334.desc:0 "New offenses and penalties have been introduced by the Animal Protection bill and the accompanying amendments to the Turkish Penal Code, adopted by Parliament's Agriculture, Forestry and Rural Affairs Committee."
 Turkey.334.a:0 "Good"
 Turkey.335.title:0 "Recep Tayyip Erdogan Visits Diyarbakir" 
 Turkey.335.desc:0 "Our leader Recep Tayyip Erdogan visited Diyarbakir, where he was given an enthusiastic welcome. We sincerely believe the Kurdish people are still on our side."
 Turkey.335.a:0 "Perfect!"
 Turkey.336.title:0 "Melih Bulu Has Been Dismissed" 
 Turkey.336.desc:0 "Prof. Dr. Melih Bulu was dismissed by Presidential Decree six months after his appointment as rector of Boğaziçi University. His dismissal shows that the protests are working."
 Turkey.336.a:0 "A Populist Move"
 Turkey.337.title:0 "Sedat Peker's Videos" 
 Turkey.337.desc:0 "Sedat Peker has been publishing videos episode by episode, using them to spread dirty slander against the party of our country's leader Recep Tayyip Erdogan and against several other parties. No one can bring down the Republic of Turkey or our governing party, the AKP."
 Turkey.337.a:0 "We Need To Act"
 Turkey.338.title:0 "Clashes With Terrorists" 
 Turkey.338.desc:0 "Two Turkish soldiers were killed and one was wounded and taken to hospital in an exchange of fire in Northern Iraq. A terrorist from the separatist terrorist organization was neutralized in the clash."
 Turkey.338.a:0 "Aman Tanrım"
 Turkey.339.title:0 "Mehmet Aydin Surrenders" 
 Turkey.339.desc:0 "Mehmet Aydin, nicknamed "Tosuncuk", owner of Çiftlikbank, which defrauded people across Turkey, has surrendered in Brazil. We will bring him back to our country and make sure he stands trial."
 Turkey.339.a:0 "Great News for the Defrauded"
 Turkey.340.title:0 "USA Removes Turkey From the F-35 Program" 
 Turkey.340.desc:0 "The United States has notified Ankara that it has officially removed Turkey from the F-35 program. It noted that the 2007 agreement has been updated with the remaining eight partners and that no new participants have been added to the program."
 Turkey.340.a:0 "Suspend the US Black Sea Exercise in Retaliation"
 Turkey.340.b:0 "We Don't Care"
 Turkey.341.title:0 "Turkish Mission in Afghanistan" 
 Turkey.341.desc:0 "The United States has begun withdrawing its troops from Afghanistan. Other NATO states have also started to pull out, but we are still there. The United States wants us to stay and keep up the fight, while our people want us to withdraw. What should we do, sir?"
 Turkey.341.a:0 "We will stay in the region"
 Turkey.341.b:0 "It is time to leave"
 Turkey.342.title:0 "Turkish Mission in Afghanistan" 
 Turkey.342.desc:0 "The United States has begun withdrawing its troops from Afghanistan. Other NATO states have also started to pull out, but we are still there. The United States wants us to stay and keep up the fight, while our people want us to withdraw. What should we do, sir?"
 Turkey.342.a:0 "We will stay in the region"
 Turkey.343.title:0 "The Return of Erbakan" 
 Turkey.343.desc:0 "Through the courts, we have had Erbakan's political ban lifted early. Necmettin Erbakan, the movement's founding leader, will once again lead the Saadet Party."
 Turkey.343.a:0 "Sounds Nice"
 Turkey.344.title:0 "Turkey Wants to Turn the D-8 Into an Alliance" 
 Turkey.344.desc:0 "Turkey believes the time has come to turn the D-8 Organization for Economic Cooperation into a true alliance. As a member of the D-8, should we accept this offer and form a real alliance?"
 Turkey.344.a:0 "Sounds Nice"
 Turkey.344.b:0 "We Don't Need This"
 Turkey.345.title:0 "The Death of Necmettin Erbakan" 
 Turkey.345.desc:0 "The death of our leader Necmettin Erbakan has shocked the whole country. After his funeral, the real question arose: who will now lead the Saadet Party? We must make the choice."
 Turkey.345.a:0 "Fatih Erbakan Should Take Over"
 Turkey.345.b:0 "Temel Karamollaoğlu Should Take Over"
 Turkey.346.title:0 "Wildfires All Over Turkey" 
 Turkey.346.desc:0 "The 2021 Turkey wildfires began on 28 July 2021 in the Manavgat district of Antalya and spread to many cities across Turkey. As of 12 August 2021, 299 forest fires in 49 provinces, mostly in the Mediterranean, Aegean, Marmara, Western Black Sea and Southeastern Anatolia regions, had killed 8 people, while hundreds of thousands of hectares of forest and settlements had turned to ash and thousands of animals had died.\n\nThe 299 fires that began on 28 July, 15 of them major, were brought fully under control on 12 August 2021 when the fire in the Köyceğiz district of Muğla was extinguished. 15 firefighting aircraft, 62 helicopters, 9 unmanned aerial vehicles, 1 unmanned helicopter, 850 land vehicles and water tankers, 450 work machines and 5,250 personnel took part in the response. Many countries, including Azerbaijan, Ukraine, Russia, Spain, Croatia, Qatar and Iran, sent personnel and equipment. Thousands of residents and tourists were evacuated by land and sea from hundreds of villages and towns as the fires reached settlements.\n\nThe fires, described as the largest in the history of the Republic of Turkey, sparked heated debate. The Ministry of Agriculture and Forestry and the Turkish Aeronautical Association were criticized by the opposition and the public for responding late and slowly. The controversy centered on the inadequate firefighting fleet of the ministry, the planes left idle in hangars, claims that burned forest land would be opened to construction, the division of responsibility for fighting fires in residential areas, the role of global warming, and Recep Tayyip Erdogan tossing tea to people in the disaster area."
 Turkey.346.a:0 "Enormous Damage to Us"
 Turkey.347.title:0 "Turkey Defeats The Coup Attempt" 
 Turkey.347.desc:0 "The rise of Erbakan's party to power provoked a reaction in the army, which saw Erbakan as a reactionary. Seeing the party it had once toppled with the help of the press back in power, the army decided to intervene once more, just as on 28 February. Once the plans were drawn up, several tank companies headed for the capital. In the capital, our people stood up to the tanks. The army tried to intimidate us with low-flying jets over Ankara, but it did not work. Our people took to the streets; they did not want another coup. After one day the army gave up and surrendered. Now all power is officially ours."
 Turkey.347.a:0 "Long live!"
 Turkey.348.title:0 "Turkey Strikes at Our Presence in the Black Sea" 
 Turkey.348.desc:0 "In a move we did not expect, Turkey has retaliated against us by closing the Straits to the United States. This means the collapse of American activity in the Black Sea. Russia will certainly be pleased."
 Turkey.348.a:0 "What the...?"
 Turkey.349.title:0 "Turkey Joins F-35 Program" 
 Turkey.349.desc:0 "Turkey joined the F-35 (Joint Strike Fighter) project as the seventh international partner on 12 July 2002, and also signed a memorandum of understanding on F-35 production. Turkey will be able to acquire these aircraft once F-35 production begins!"
 Turkey.349.a:0 "Nice"
 Turkey.350.title:0 "PKK Admits Setting Fires" 
 Turkey.350.desc:0 "As wildfires sweep through southern Turkey and burn across the country, the PKK terror group has admitted to starting fires. Social media accounts linked to the PKK said the fires were set by the "Children of Fire Initiative"."
 Turkey.350.a:0 "We Will Find Them One by One!"
 Turkey.351.title:0 "The Fire Has Been Put Out" 
 Turkey.351.desc:0 "The fires in Turkey are being brought under control with the help of specialist teams, and not only Turkish ones: Ukrainian and Russian firefighting aircraft and Azerbaijani personnel were also sent to help us. We won this fight through the friends who stood by us on a dark day and through Turkish perseverance."
 Turkey.351.a:0 "Good Job Team!"
 Turkey.352.title:0 "An Attack on the HDP Building in Izmir" 
 Turkey.352.desc:0 "On 17 June 2021 at 11:05, Onur Gencer entered the provincial office of the Peoples' Democratic Party (HDP) on Şair Eşref Boulevard in Izmir's Konak district and opened fire with a pistol, killing party employee Deniz Poyraz."
 Turkey.352.a:0 "Uncertain Times"
 Turkey.353.title:0 "Provocative Attack on a Kurdish Family" 
 Turkey.353.desc:0 "The home of a Kurdish family that was attacked by a group in Konya on 12 May was attacked for a second time today. Seven members of the Dedeoğlu family were killed, and the attackers set part of the house on fire. According to DHA, the incident took place at around 18:50 on Özşahin Street in the Hasanköy neighborhood of Konya's central Meram district. On 12 May, the family had been attacked by a group of 60 people armed with knives, stones and sticks, shouting: "We are locals here, we won't let you live here." Five people detained over the first attack were released for lack of evidence. A large number of riot police were deployed around the house while the prosecutor and the police chief examined the scene. Relatives of the family are expected to arrive from Kars. Those killed were Yaşar Dedeoğlu, Barış Dedeoğlu, Serpil Dedeoğlu, Serap Dedeoğlu, İpek Dedeoğlu, Metin Dedeoğlu and Sibel Dedeoğlu. Funeral vehicles were brought to the area. The press is not allowed near the house, which has been cordoned off by police."
 Turkey.353.a:0 "Uncertain Times"
 Turkey.354.title:0 "Mete Gazoz Becomes Olympic Champion" 
 Turkey.354.desc:0 "Our national archer Mete Gazoz has become Olympic champion! We are delighted to see our country doing so well in sports."
 Turkey.354.a:0 "Nice"
 Turkey.355.title:0 "Recep Tayyip Erdogan Speaks Out Against the Americans" 
 Turkey.355.desc:0 "Referring to the tensions with the United States, the fluctuations in the economy and the rise of the dollar, he said: "Various campaigns are being waged. Never listen to them. Remember: if they have their dollars, we have our people, we have our rights, we have Allah. We have worked hard, very hard. What were we 16 years ago, and what are we now? We will be even better. I wish you patience and hard work. We will work hard, run hard and enter 2023 in a very different place.""
 Turkey.355.a:0 "An Enthusiastic Speech"
 Turkey.356.title:0 "First COVID-19 Case in Turkey"
 Turkey.356.desc:0 "The coronavirus has reached our country. Along with the virus, our economy will decline, and the spending needed to contain it will weigh heavily on economic activity."
 Turkey.356.a:0 "Oh No!"
 Turkey.357.title:0 "First COVID-19 Case in Turkey"
 Turkey.357.desc:0 "The coronavirus has reached our country. Along with the virus, our economy will decline, and the spending needed to contain it will weigh heavily on economic activity."
 Turkey.357.a:0 "Oh No!"
 Turkey.358.title:0 "Turkey Reacts Against Greece"
 Turkey.358.desc:0 "According to ministry sources, Eleni Vakali, chargé d'affaires of the Greek Embassy in Ankara, was summoned to the Ministry and handed a note conveying Turkey's reaction to the death of a Turkish citizen shot by Greece at the border in Edirne last night."
 Turkey.358.a:0 "We Have To React"
 Turkey.359.title:0 "The #OYMOYYOK Hashtag"
 Turkey.359.desc:0 "On the eve of the university entrance exam (YKS), President Erdogan met young people via video conference and answered their questions about the exam, social media and the coronavirus epidemic. "We didn't want students to suffer another month of exam stress," he said, adding, "If we hated social media, we wouldn't use it so widely and effectively," citing his 16 million followers on Twitter. Erdogan said they would build a strong legal framework for social media: "With the legal regulations we will introduce, we will give our nation back a reliable internet environment."\n\nAs the stream continued on platforms such as YouTube and Twitter, many young viewers posted comments such as "No vote for you" and "See you at the ballot box." Comments were then disabled, and the young people carried their reaction to social media under the hashtag #OyMoyYok."
 Turkey.359.a:0 "Who do they think they are?"
 Turkey.360.title:0 "The Teleprompter Mishap"
 Turkey.360.desc:0 "President Erdogan suffered a "teleprompter mishap" live on air. When the lines scrolled too quickly on the screen, Erdogan could not keep up and asked for them to be scrolled back, but his team warned him: "We are live." Erdogan was then seen biting his lip."
 Turkey.360.a:0 "Terrible News!"
 Turkey.361.title:0 ""Hudut Namustur" Banners"
 Turkey.361.desc:0 "Six teenagers were detained for hanging a banner reading "Hudut Namustur" ("The Border Is Our Honor"). The incident caused an uproar on social media and will deal a blow to stability and to our people's trust in us."
 Turkey.361.a:0 "That Doesn't Sound Good at All"
 Turkey.362.title:0 "The Legacy of 28 February"
 Turkey.362.desc:0 "The 1997 military memorandum in Turkey refers to the decisions issued by the Turkish military leadership at a National Security Council meeting on 28 February 1997. The memorandum set in motion the process that led to the resignation of Islamist Prime Minister Necmettin Erbakan of the Welfare Party and the end of his coalition government.\n\nBecause the government was forced out without dissolving parliament or suspending the constitution, Turkish admiral Salim Dervişoğlu famously labeled the event a "postmodern coup". The process that followed is alleged to have been organized by the Western Working Group, a purported clandestine group within the military."
 Turkey.362.a:0 "The Military Has a Huge Presence in Politics"
 Turkey.363.title:0 "The Legacy of 15 July"
 Turkey.363.desc:0 "On 15 July, we defeated the treacherous coup attempt. The Gülenist organization, which had infiltrated every level of the state, failed to destroy Turkey despite wielding the power of the state, because the people would not allow it. The Turkish nation stood with President Recep Tayyip Erdogan against this treacherous coup attempt. The lieutenant generals and generals behind it were arrested and given severe sentences for attempting to destroy the Republic of Turkey."
 Turkey.363.a:0 "Long Live the Heroic Turkish Nation!"
 Turkey.364.title:0 "The GENÇPARTİ Requests Our Support"
 Turkey.364.desc:0 "Members of the Young Party are asking for our support so that their party can clear the electoral threshold and stay in power. Sir, should we support them or not?"
 Turkey.364.a:0 "Support Them"
 Turkey.364.b:0 "There Is No Need to Support Them"
 Turkey.365.title:0 "Covid-19 Hits Our Country"
 Turkey.365.desc:0 "The coronavirus has reached our country. Along with the virus, our economy will decline, and the spending needed to contain it will weigh heavily on economic activity."
 Turkey.365.a:0 "The Covid-19 Crisis Is Upon Us"
 Turkey.366.title:0 "NATO Visits Hatay"
 Turkey.366.desc:0 "NATO Secretary General Jens Stoltenberg came to Hatay for a series of visits together with Deputy Foreign Minister Yavuz Selim Kıran.\n\nStoltenberg landed at Hatay Airport at 10:45 on Tuesday, 7 May 2019, where he, Deputy Foreign Minister Yavuz Selim Kıran and the delegation of representatives from NATO member and observer countries were welcomed by Hatay Governor Rahmi Doğan, Hatay Metropolitan Mayor Lütfü Savaş, Provincial Gendarmerie Commander Colonel Uğur Ertekin and other members of the protocol.\n\nStoltenberg and the accompanying delegation then went to the Hatay Provincial Disaster and Emergency Directorate.\n\nAt the meeting chaired by Stoltenberg in the directorate's halls, topics such as "Turkey's view of regional threats", "Turkey's fight against irregular migration" and the return of people to the Olive Branch and Euphrates Shield areas cleared of terrorist organizations were discussed.\n\nAfter the meeting, which was closed to the press, the Secretary General and his delegation visited a primary school as part of the social program arranged for them, sampled Hatay's cuisine and toured the Church of St. Pierre and the Hatay Archaeology Museum before leaving the city by air."
 Turkey.366.a:0 "Very Good News for the Hatay Question"
 Turkey.367.title:0 "NATO Rejects Syrian Claims to Hatay"
 Turkey.367.desc:0 "NATO has completely rejected Syria's claims to Hatay and stated that Hatay is Turkish territory. NATO declared that any Syrian attack to seize Hatay would mean war with all NATO countries."
 Turkey.367.a:0 "NATO Works Well"
 Turkey.368.title:0 "Recep Tayyip Erdogan Begins His African Tour"
 Turkey.368.desc:0 "Recep Tayyip Erdogan has announced the start of his African tour. The President will visit Angola, Togo, Burkina Faso, Liberia and Nigeria. The tour is sure to make Turkey politically stronger."
 Turkey.368.a:0 "Very Interesting"
 Turkey.369.title:0 "Erdogan Publishes His New Book"
 Turkey.369.desc:0 "The book "A Fairer World Is Possible", written by President Recep Tayyip Erdoğan and first published in Turkish by Turkuvaz Kitap, will be released tomorrow.\n\nThe book, priced at 40 TL, includes the following passages:\n\n"It is neither moral nor fair that only five countries decide on matters affecting the fate of the whole world. The world is bigger than five.\n\nA UN that reflects multiculturalism and multipolarity is needed to ensure a just and more sustainable global peace.\n\nThe world is neither unipolar nor bipolar, nor is it under the cultural hegemony of a single dominant culture or of a few privileged actors. It is possible to build a multipolar, multicentric, multicultural, more inclusive and just world, and the first address for such a world is the UN.\n\nThe path to peace, stability, justice and effective global governance runs through reform of the UN. Reforming the UN, and in particular restructuring the Security Council, can of course only be achieved through the agreement of all the countries of the world.\n\nAs Turkey, we have long put forward our proposal within this framework and opened it to discussion by all countries. Our proposed solution is to embrace the perspective summed up in the phrase 'The world is bigger than five' and to focus on changing the structure of the UN Security Council. Restructuring the Council so that it represents continents, faiths, origins and cultures as fairly as possible would be a revolutionary step toward a solution and toward lasting global peace.""
 Turkey.369.a:0 "Interesting"
 Turkey.370.title:0 "Cem Uzan Attacks the EU"
 Turkey.370.desc:0 "In a speech, Cem Uzan attacked the European Union: "As a result of the talks between the UK and Turkey, Turkey will not join the European Union, and the UK will leave it too." His claim that the UK would leave threw Europe into a panic."
 Turkey.370.a:0 "Lovely"
 Turkey.371.title:0 "Cem Uzan Signs Agreements With British Industrialists"
 Turkey.371.desc:0 "Cem Uzan traveled to the UK and held meetings with British investors, leaving both sides satisfied. The British will invest in Turkey, and in return Turkey will make it easier for the UK to buy oil from Arabia."
 Turkey.371.a:0 "Great Deal"
 Turkey.372.title:0 "CHP-MHP Alliance Formed"
 Turkey.372.desc:0 "The CHP-MHP negotiations have concluded, and the two sides have decided to form an alliance. Its purpose is to remove us from power and seize the legitimate government."
 Turkey.372.a:0 "They Have United Against Our Rule"
 Turkey.373.title:0 "Ekmeleddin Ihsanoglu Becomes the CHP-MHP Presidential Candidate"
 Turkey.373.desc:0 "As part of his consultations on a presidential candidate, Kılıçdaroğlu visited MHP Chairman Devlet Bahçeli in his office in Parliament.\n\nSpeaking to journalists after the meeting, Kılıçdaroğlu recalled that he had been visiting political parties, NGOs and artists for some time to hear their views on the presidency.\n\nCHP Chairman Kemal Kilicdaroglu proposed to MHP Chairman Devlet Bahceli the name of Ekmeleddin Ihsanoglu, former Secretary General of the Organization of Islamic Cooperation (OIC), as a joint "umbrella candidate" for President. Bahceli announced that they welcomed the candidate and would work together behind him."
 Turkey.373.a:0 "The Enemy Has Chosen Its Candidate"
 Turkey.374.title:0 "The Pelican Files"
 Turkey.374.desc:0 "The Pelican Files refer to an anonymous list of 27 items released in April 2016 detailing points of conflict between Prime Minister Ahmet Davutoğlu and President Recep Tayyip Erdoğan, two Justice and Development Party politicians who had taken office on 28 August 2014. Published by unnamed Erdoğan supporters as a WordPress.com blog, the files harshly criticized Davutoğlu for straying from Erdoğan's political agenda. The release is widely credited with setting off the events that eventually led to Davutoğlu's ouster as Prime Minister. The name is a reference to the 1993 political thriller The Pelican Brief. The files appeared at a time when relations between the two men had deteriorated sharply. Rumors that Davutoğlu had offered his resignation were followed by the AKP Central Decision and Executive Board (MKYK) stripping him of the right to appoint provincial and district party officials. On 4 May 2016, a day earlier than planned, Davutoğlu and Erdoğan met at the Presidential Complex. Although presidential staff initially called it a "routine meeting", it was shortly followed by the AKP's decision to hold an extraordinary congress in 2016 at which Davutoğlu would not stand for the leadership. The publication and purpose of the "memorandum" had been predicted by the blogger Fuat Avni, who wrote on 19 April 2016 that Erdoğan was planning a "coup against Davutoğlu" and that the "pelican" of "Berat and Serhat" (a reference to Erdoğan's son-in-law and his brother) was about to take flight. Turkish social media and other sources described it as a palace coup."
 Turkey.374.a:0 "The Way Is Clear for Binali Yildirim"
 Turkey.375.title:0 "MHP-DSP Coalition Talks Succeed"
 Turkey.375.desc:0 "The talks between the MHP and the DSP have paid off: the MHP will stand with the DSP in the elections. This is very good news for the DSP and Bülent Ecevit."
 Turkey.375.a:0 "Great News"
 Turkey.376.title:0 "ANAP-DSP Coalition Talks Succeed"
 Turkey.376.desc:0 "The talks between ANAP and the DSP have paid off: ANAP will stand with the DSP in the elections. This is very good news for the DSP and Bülent Ecevit."
 Turkey.376.a:0 "Great News"
 Turkey.377.title:0 "The Health of Bülent Ecevit"
 Turkey.377.desc:0 "Our leader Ecevit is showing his age. We may have treated him and found the right diagnosis to keep him alive, but there is no cure for old age. We have two options: carry on with Ecevit, or retire him without risking our hold on power and continue with the successor he names."
 Turkey.377.a:0 "It Is Time for Him to Step Down!"
 Turkey.377.b:0 "He Will Lead Us Until His Death"
 Turkey.378.title:0 "Ecevit's Failing Policies"
 Turkey.378.desc:0 "Ecevit's policies are starting to fail, and his political maneuvers feel outdated. We must strengthen and modernize ourselves politically. A change of cadre will surely fix these problems."
 Turkey.378.a:0 "The Cadre Change Must Happen as Soon as Possible"
 Turkey.379.title:0 "The Founding of the YTP"
 Turkey.379.desc:0 "The poor health of the elder statesman Bülent Ecevit, Prime Minister and party leader, fueled rumors that his Deputy Prime Minister and Minister of State, Hüsamettin Özkan, was plotting to replace him. As a result, Özkan was forced to resign. However, nearly half of the DSP's MPs followed him, including Foreign Minister İsmail Cem. Özkan, Cem and Kemal Derviş, Minister of State for the Economy and former Vice President of the World Bank, then decided to found a new social democratic party, the New Turkey Party (Yeni Türkiye Partisi). Cem became its leader."
 Turkey.379.a:0 "Traitors!"
 Turkey.380.title:0 "The Rise of TELSIM!"
 Turkey.380.desc:0 "With the Young Party in power, the TELSIM company has grown stronger, and its growth has in turn emboldened the party and taken it to new heights. Now that the company has taken on a political role, it could either surge rapidly or crash. Should we expand the company?"
 Turkey.380.a:0 "No Need to Expand the Company"
 Turkey.380.b:0 "Expand the Company"
 Turkey.381.title:0 "Ekrem Imamoglu Joins a Twitch Stream"
 Turkey.381.desc:0 "Ekrem Imamoglu, who has grown popular as mayor of the metropolis of Istanbul, has announced that he will stream with the Twitch broadcaster Purplebixi. The CHP appears to be stepping up its social media campaigns to win over Generation Z. Social media platforms are ideal for winning votes one on one."
 Turkey.381.a:0 "Twitch Is Turning Into Twitter-Style Politics"
 Turkey.382.title:0 "Central Bank Cuts Interest Rate to 16"
 Turkey.382.desc:0 "The Central Bank has cut its policy rate from 18 percent to 16 percent, a much deeper cut than expected. The bank had already lowered the rate by 100 basis points at its meeting on 23 September. The dollar gained momentum after the decision."
 Turkey.382.a:0 "The Dollar Is Racing Ahead"
 Turkey.383.title:0 "2003: The Delayed Elections"
 Turkey.383.desc:0 "The 15th Turkish general election was due to be held on 3 November 2002, but after resistance from the DSP-MHP-ANAP coalition led by Bülent Ecevit, it was postponed to 6 June 2003. All 550 seats of the Grand National Assembly are up for election."
 Turkey.383.a:0 "Let's Go!"
 Turkey.384.title:0 "Uzbekistan Joins the Turkic Union as a Full Member"
 Turkey.384.desc:0 "With the votes of the Turkic Council members, Uzbekistan has become a full member. The Turkic Council keeps growing."
 Turkey.384.a:0 "Good News"
 Turkey.385.title:0 "Hungary and Turkmenistan Become Observers of the Turkic Union"
 Turkey.385.desc:0 "With the votes of the Turkic Council members, Turkmenistan and Hungary have become observers. The Turkic Council keeps growing."
 Turkey.385.a:0 "Good News"
 Turkey.386.title:0 "Ukraine and Finland Become Observers of the Turkic Union"
 Turkey.386.desc:0 "With the votes of the Turkic Council members, Ukraine and Finland have become observers. The Turkic Council keeps growing."
 Turkey.386.a:0 "Good News"
 Turkey.387.title:0 "The Tale of the Two Men From Rize"
 Turkey.387.desc:0 "Two men from Rize met in Rize and talked about the state of the country. Seen from a wider perspective, these two men from Rize have left deep marks on the Republic of Turkey."
 Turkey.387.a:0 "After Malatya, It's Rize's Turn to Lead"
 Turkey.388.title:0 "CHP and IYI Call for Early Elections"
 Turkey.388.desc:0 "CHP Chairman Kemal Kılıçdaroğlu visited IYI Party Chairman Meral Akşener. After the visit at the IYI Party headquarters, the two leaders made a joint statement.\n\nArguing that the economy is in bad shape, Kilicdaroglu said: "The Turkish lira is losing value at an extraordinary rate, yet nobody in Turkey is offering a solution. The Central Bank should be ensuring price stability, but it has ceased to function and simply watches from the sidelines as the lira depreciates and foreign currency soars."\n\nKilicdaroglu said the institution legally responsible for price stability should not be a mere spectator: "It cannot intervene. It has no tools to intervene and no reserves; 128 billion dollars have evaporated and nobody knows where they went. Its net reserves stand at minus 35 billion dollars."\n\nSaying it was wrong to keep silent about the economy, Kılıçdaroğlu added: "We are asking them to produce a solution and say something about where the economy is heading. How will they stop the lira's slide? We want someone to come out and explain. We face a wall; there is no explanation."\n\nExplaining that they met because they feel responsible for the country's economy, Kilicdaroglu said: "As the lira melts away, Turkey looks like a poor country far below economic standards. Everything has become cheap: factories, companies, institutions. There is a perception that the whole country can be bought for very few dollars. We are calling on them once again.\n\nWe know you cannot govern. Either take charge of the Central Bank and make a statement, or, if you think it is wrong to interfere with the Central Bank, then stop interfering. A huge institution has been discredited not only in Turkey but around the world. I am calling on him clearly and unequivocally: you cannot govern, so do not put any more burden on the nation's back. This nation cannot carry such a burden. Turkey must go to the polls as soon as possible.""
 Turkey.388.a:0 "The Opposition Keeps Attacking"
 Turkey.389.title:0 "Binali Becomes "Aksakal" of the Turkic Council"
 Turkey.389.desc:0 "President Recep Tayyip Erdogan currently chairs the Cooperation Council of Turkic-Speaking States. In his speech at the summit, Erdogan announced that Binali Yıldırım had been appointed Aksakal (Elder) of the Turkic Council."
 Turkey.389.a:0 "Nice to See Binali Has a Job Now"
 Turkey.390.title:0 "Osman Pamukoglu Is Ready to Crush the Terrorists"
 Turkey.390.desc:0 "Osman Pamukoglu is ready. We can keep him serving in the army, or let him resign and enter politics. Sir, the choice is yours."
 Turkey.390.a:0 "He Should Resign and Enter Politics"
 Turkey.390.b:0 "He's More Useful in the Armed Forces"
 Turkey.391.title:0 "Huge Fuel Price Hikes Cause Queues"
 Turkey.391.desc:0 "Following the rise of the dollar, gasoline went up by 52 kuruş, diesel by 50 kuruş and LPG by 45 kuruş. Before the hike took effect at midnight, long queues formed at gas stations."
 Turkey.391.a:0 "Fuel Crisis!"
 Turkey.392.title:0 "The Nakhchivan Agreement (Founding of the Turkic Union)"
 Turkey.392.desc:0 "The Nakhchivan Agreement was signed on 3 October 2009 by Azerbaijan, Kazakhstan, Kyrgyzstan and Turkey, the participating states of the Summit of Heads of State of Turkic-Speaking Countries, and laid the groundwork for the Turkic Union. Its main purpose is to institutionalize cooperation between the participating states, and it established an international organization called the Turkic Union. The summit, hosted by President of Azerbaijan Ilham Aliyev, was attended by President of Turkey Abdullah Gul, President of Kazakhstan Nursultan Nazarbayev, President of Kyrgyzstan Kurmanbek Bakiyev and Vice President of Turkmenistan Hojamyrat Saparliyev."
 Turkey.392.a:0 "Here We Go!"
 Turkey.392.b:0 "Here We Go! §Y(With No Sound)§!"
 Turkey.393.title:0 "Central Bank Sets Interest Rate to 10.5"
 Turkey.393.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.393.a:0 "The Central Bank has made its decision"
 Turkey.394.title:0 "Central Bank Sets Interest Rate to 15.5"
 Turkey.394.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.394.a:0 "The Central Bank has made its decision"
 Turkey.395.title:0 "Central Bank Sets Interest Rate to 8.1"
 Turkey.395.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.395.a:0 "The Central Bank has made its decision"
 Turkey.396.title:0 "Central Bank Sets Interest Rate to 9.6"
 Turkey.396.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.396.a:0 "The Central Bank has made its decision"
 Turkey.397.title:0 "Central Bank Sets Interest Rate to 3.4"
 Turkey.397.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.397.a:0 "The Central Bank has made its decision"
 Turkey.398.title:0 "Central Bank Sets Interest Rate to 4.5"
 Turkey.398.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.398.a:0 "The Central Bank has made its decision"
 Turkey.399.title:0 "Central Bank Sets Interest Rate to 19.5"
 Turkey.399.desc:0 "The Central Bank has decided to adjust interest rates in light of the economy's good performance. The decision will steer the country in a new economic direction. We hope our Central Bank has acted in the country's best interest."
 Turkey.399.a:0 "The Central Bank has made its decision"
 Turkey.400.title:0 "CHP Rally in Mersin"
 Turkey.400.desc:0 "The CHP's first pre-election rally, "The Voice of the Nation", drew enormous interest. From early morning, those wishing to enter the rally area were let in through 10 separate security checkpoints, and the huge turnout caused heavy crowding at the checkpoints."
 Turkey.400.a:0 "Bad News"
 Turkey.401.title:0 "Want to Buy or Sell Bitcoin?"
 Turkey.401.desc:0 "Bitcoin trading becomes available through decisions starting in 2009. Because these decisions can break the realism of the game, you can choose here whether to enable them. So, do you want to buy and sell Bitcoin or not? Binance is waiting for your answer."
 Turkey.401.a:0 "§GI'm Just Playing for Fun§!"
 Turkey.401.b:0 "§RNope, Realism First§!"
 Turkey.403.title:0 "Eastern Express Project Passes Parliament"
 Turkey.403.desc:0 "A project to expand the Eastern Express has passed Parliament. We can now begin developing the Eastern Express."
 Turkey.403.a:0 "Perfect"
 Turkey.402.title:0 "Turkish Bar Association Elects a New Leader"
 Turkey.402.desc:0 "Voting has concluded at the 36th Ordinary General Assembly of the Union of Turkish Bar Associations (TBB). According to unofficial results, in the election in which 348 delegates voted, Ankara Bar Association President Erinç Sağkan defeated incumbent President Metin Feyzioğlu to become the new President of the TBB."
 Turkey.402.a:0 "Good luck"
 Turkey.404.title:0 "Dollar Hits 13.50 Lira"
 Turkey.404.desc:0 "After President Recep Tayyip Erdogan said "a higher exchange rate boosts employment" following the cabinet meeting on 22 November, the dollar/TL rate set a new record, passing 13.46.\n\nThe euro/TL rate passed 15.16, while the pound/TL rate hit 18 for the first time.\n\nIn September, October and November, contrary to market expectations, the Central Bank of the Republic of Turkey (CBRT) cut interest rates by a total of 400 basis points, accelerating the lira's depreciation.\n\nWith inflation close to 20 percent, the CBRT's cutting of the policy rate to 15 percent is adding to the pressure on the lira."
 Turkey.404.a:0 "Inflation as bad as a devaluation"
 Turkey.405.title:0 "Dollar Hits 16.42 Lira"
 Turkey.405.desc:0 "The dollar and the euro opened the day at fresh records as the rise in exchange rates continued. The dollar/TL rate crossed 17, an all-time high. The Central Bank intervened when the dollar passed 17 lira, but after a brief dip to 16.20, the dollar settled back above 16.82."
 Turkey.405.a:0 "The Central Bank's Interventions Don't Seem to Be Working"
 Turkey.406.title:0 "The Three Leaders' Statement"
 Turkey.406.desc:0 "The leaders of three parties issued a joint statement on the PKK. In short, it reads: "The PKK must be crushed wherever it is found.""
 Turkey.406.a:0 "Good News for National Unity"
 Turkey.407.title:0 "The Crown Jewel of Social Democracy"
 Turkey.407.desc:0 "The CHP's social democracy is working, and its socio-economic effects are positive. We hope it will not trip us up in the future, but right now we are doing very well. Long live the Great Ascent!"
 Turkey.407.a:0 "Hurrah!" 
 Turkey.408.title:0 "The Economic Boom of CHP-Governed Turkey"
 Turkey.408.desc:0 "Thanks to the CHP government, our economy has made great breakthroughs, and our people are very pleased. Social democracy is working. Atatürk's party is following in the footsteps of its founder."
 Turkey.408.a:0 "What an Improvement!" 
 Turkey.409.title:0 "The Lira Gets a Boost"
 Turkey.409.desc:0 "The Turkish lira is having a historic week. The exchange rate, which hit a record 18.36 on Monday evening, all but collapsed after President Recep Tayyip Erdogan announced a package to support the lira.\n\nHaving broken records by exceeding 18 before Monday's cabinet meeting, the dollar/TL rate fell to 10.42 when the measures to support the lira were announced.\n\nOn Tuesday morning the dollar fell more than 14 percent after testing 11.09, then climbed back above 14. After an intraday peak of 14.37, the dollar/TL declined again and dropped below 10.42.\n\nTurkey's CDS stands at 592 basis points, while the 10-year bond yield is around 23.04 percent.\n\nOne-month implied volatility for the Turkish lira hit an all-time high of 62.62 on Tuesday. The indicator last climbed to 61.47 on 13 August 2018."
 Turkey.409.a:0 "What an Improvement!" 
 Turkey.410.title:0 "Deniz Baykal Resigns" 
 Turkey.410.desc:0 "Appearing before journalists, Deniz Baykal said:\n\n"I am announcing the assessment and decision you have been waiting for for days. This is not a matter of a tape; it is a conspiracy. A conspiracy is an unlawful and immoral scheme. When you conspire, you sometimes break into a home. With hidden cameras you take the most unguarded images of people, then cut, edit and distort them. You trample on the moral code of every religion and of humanity itself. They have no regard for people's honor. Those behind this conspiracy are perverts; they did not do it for blackmail, but to do politics.\n\nA conspiracy has been fabricated, a fresh one, two weeks old. Its target is not one person. Its target is the struggle the CHP is waging, almost alone, against the civilian dictatorship. It was edited and released within the last two weeks; the conspiracy workshop's materials and footage are fresh. Such a crude scheme could not have been prepared and released without the knowledge of the highest levels of power. Their so-called well-meaning statements after the incident are not enough to hide the guilt of those behind the scenes. This could not have been released without the government's knowledge and approval. Indeed, the shameful ones are those who commit the shameful act.\n\nI also believe in the sincerity of the messages of sympathy I received from the United States, from Pennsylvania. 'It is a shame,' they say, but I have a word for them: you cannot defend yourself while profiting from immoral and unlawful conspiracies. Those who call it a shame while opening the way for conspiracies are the real shame. We will all see how far those who give credit to these conspiracies can go.\n\nI will not surrender to this scheme. I will not let anyone call me to account. If there is a price for that, and if the price is leaving the leadership of the CHP, I will pay it. My resignation is not running away. On the contrary, it is a challenge. I am resigning, because the target here is not me, it is the CHP."\n\nIt was announced that Deputy Chairman Cevdet Selvi would serve as acting leader in accordance with the party's bylaws.\n\nAfter Baykal announced his resignation, some party members were heard shouting, "No, don't do it!"\n\nSome party members could not hold back their tears during the announcement."
 Turkey.410.a:0 "Sad Moments For CHP" 
 Turkey.410.b:0 "Sad Moments For CHP §Y(With No Speech)§!" 
 Turkey.411.title:0 "Editor's Note: The 2024 Local Elections"
 Turkey.411.desc:0 "Turkey is heading into local elections in the year of its centenary. May whoever deserves it win the elections on 31 March. WARNING: Because these elections are current events, please avoid politicizing the game too much."
 #Turkey.411.desc:0 "The Republic founded by Atatürk and his comrades-in-arms has entered the centenary year. We celebrate this historic event. Long live the Modern Republic of Turkey to many new centuries!\n\nAbout the Mod: With Millennium Dawn bringing content to Turkey as part of the new update, I will slow down and gradually terminate the developments about the mod. Thank you for your unremitting support over the past two years."
 #Turkey.411.desc:0 "With the confirmation of the Supreme Election Board of the Republic of Turkey, Recep Tayyip Erdogan has been elected as president and will continue to rule for another 5 years.\n\nI hope that these elections will be beneficial for Turkey.\n\nKeywords: Turkish Economy, Nationalism, Terrorism Suspicions, Political commitment"
 #Turkey.411.desc:0 "The people have made their decision, the AK party will accompany the 100th anniversary of Turkey, so that the AK party regime will continue to rule for another 25 years. I hope these elections have been good for Turkey."
 Turkey.411.a:0 "Let's Move On!"
 Turkey.411.b:0 "§RI Want to Listen to the 100th Anniversary March§!"
 OLDTurkey.411.b:0 "Erdogan Delivers His Balcony Speech"
 Turkey.412.title:0 "2022 Is Almost Here"
 Turkey.412.desc:0 "The year 2022 has arrived in no time. Happy New Year to you all; I wish you a strong economy and good health in the year ahead."
 Turkey.412.a:0 "Move On!"
 Turkey.413.title:0 "Kenan Yaşar Elected to the Constitutional Court"
 Turkey.413.desc:0 "Elected with 302 votes in the General Assembly of the Grand National Assembly of Turkey, Kenan Yaşar has become the newest member of the Constitutional Court (AYM).\n\nThe election for the seat being vacated by Celal Mümtaz Akıncı, who retires on 31 January upon reaching the age limit, was held in the General Assembly. In the secret ballot, the candidates were Çorum Bar Association President Kenan Yaşar, Diyarbakır Bar Association member Zülal Erdoğan and Erzurum Bar Association President Talat Göğebakan. After three rounds of voting, Kenan Yaşar was elected with 302 votes."
 Turkey.413.a:0 "Move On!"
 Turkey.414.title:0 "Osman Pamukoğlu Enters Politics"
 Turkey.414.desc:0 "Osman Pamukoglu has announced that he is leaving military service to enter politics, sending a wave of panic through the political establishment. It was later learned that he has founded a party called HEPAR. A new player is coming."
 Turkey.414.a:0 "He Is Coming!"
 Turkey.415.title:0 "Osman Pamukoğlu Stays in the Army"
 Turkey.415.desc:0 "To end the uncertainty, Osman Pamukoglu has announced that he will not leave military service or enter politics. Politicians welcomed the news: with a man of his military background staying out of politics, things were going to get easier."
 Turkey.415.a:0 "Good To Hear"
 Turkey.416.title:0 "Osman Pamukoğlu's Rallies"
 Turkey.416.desc:0 "Osman Pamukoglu's rallies have drawn huge crowds, and the balance is shifting. He is expected to collect a large number of votes at the ballot box."
 Turkey.416.a:0 "Politics Is Getting Hardcore"
 Turkey.417.title:0 "Osman Pamukoğlu's Victory"
 Turkey.417.desc:0 "The election has been won. With Osman Pamukoglu in power, the roots of the terrorist organizations are expected to dry up. Long live the new government! Long live the new balance!"
 Turkey.417.a:0 "Good News"
 Turkey.418.title:0 "Snow Paralyzes Istanbul"
 Turkey.418.desc:0 "The snowfall affecting most of the country has brought Istanbul to a standstill today. As the snow grew heavier in the evening, traffic ground to a halt across most of the city and vehicles were stuck on the roads. Some residents abandoned their cars and walked home. Traffic density in Istanbul has reached 90 percent, and public transport is also severely crowded. Despite the warnings, the megacity was not prepared, and some Metrobus and bus services were disrupted, leaving residents struggling to get home. Many are still stranded outside."
 Turkey.418.a:0 "Damn!"
 Turkey.419.title:0 "The Rahşan Amnesty"
 Turkey.419.desc:0 "The Law on Conditional Release and the Suspension of Proceedings and Sentences, proposed by Rahşan Ecevit and adopted on 22 December 2000, introduced conditional release or suspension for all crimes except those committed against the state.\n\nLaw No. 4616 on Conditional Release and Suspension was passed on 22 December, three days after Operation Return to Life was launched on 19 December 2000 to end the death fasts. After the amnesty, which was enacted because the prisons had run out of space, the prison population fell from its capacity of 70,000 to 40,000."
 Turkey.419.a:0 "The Scope of Amnesty Is Sufficient"
 Turkey.419.b:0 "Make Minor Changes to the Amnesty"
 Turkey.419.c:0 "Expand the Amnesty Outright"
 Turkey.4190.title:0 "The Rahşan Amnesty"
 Turkey.4190.desc:0 "The Law on Conditional Release and the Suspension of Proceedings and Sentences, proposed by Rahşan Ecevit and adopted on 22 December 2000, introduced conditional release or suspension for all crimes except those committed against the state.\n\nLaw No. 4616 on Conditional Release and Suspension was passed on 22 December, three days after Operation Return to Life was launched on 19 December 2000 to end the death fasts. After the amnesty, which was enacted because the prisons had run out of space, the prison population fell from its capacity of 70,000 to 40,000."
 Turkey.4190.a:0 "The Scope of Amnesty Is Sufficient"
 Turkey.420.title:0 "Public Reaction to the Attack on the Atatürk Statue"
 Turkey.420.desc:0 "After the attack on the Atatürk statue in Samsun, a crowd gathered around the statue in the evening."
 Turkey.420.a:0 "Kemalists Are in the Streets!" 
 Turkey.421.title:0 "Recep Tayyip Erdogan Returns to His Party"
 Turkey.421.desc:0 "President Recep Tayyip Erdogan has rejoined the AK Party, which he founded. Many articles of the amendments adopted in the 16 April referendum will only take effect with the elections in November 2019, but the provision allowing the President to keep ties with his party took effect immediately, paving the way for Erdogan to rejoin the AK Party.\n\nErdogan is also expected to be re-elected party leader at the congress on 21 May.\n\nErdogan symbolically signed his membership form at a ceremony at the AK Party headquarters. The tears of Erdogan and several party members drew attention.\n\n"I am returning to my home, my love, my passion, my cause: the party I founded and had to leave under the constitution when our nation elected me President on 27 August 2014," Erdogan said at the ceremony. "Exactly 979 days later, this longing ends, praise be to God.""
 Turkey.421.a:0 "He Is the Best for the AKP!" 
 Turkey.422.title:0 "Six Opposition Leaders Unite"
 Turkey.422.desc:0 "Six opposition leaders have come together with the goal of drafting a new constitution. We are not at all fond of the constitutional proposal that will come out of their deliberations."
 Turkey.422.a:0 "What a Terrible Moment!" 
 Turkey.423.title:0 "The 28 February Declaration"
 Turkey.423.desc:0 "The opposition issued a joint statement known as the 28 February Declaration. With it, the supporters of a return to the parliamentary system will strengthen their hand within the opposition against our government."
 Turkey.423.a:0 "The Opposition Grows Stronger" 
 Turkey.424.title:0 "AKP Delegates Call for Reform"
 Turkey.424.desc:0 "AK Party delegates are calling on our party to reform. By changing and modernizing the party while staying true to our principles, we could win more votes. On the other hand, reform and modernization could cost us things we hold dear, such as Erdogan himself."
 Turkey.424.a:0 "Accept the Reform Plan" 
 Turkey.424.b:0 "The AKP Stays With Erdogan!" 
 Turkey.425.title:0 "Bayraktar Kizilelma Unmanned Fighter Unveiled to the Public"
 Turkey.425.desc:0 "The Bayraktar Kizilelma has been unveiled to the Turkish people. It is a jet-powered, single-engine, low-observable, supersonic, carrier-capable unmanned fighter aircraft being developed by the Turkish defense company Baykar."
 Turkey.425.a:0 "We Have Joined the Technology Race"
 Turkey.426.title:0 "Peace Talks at the Antalya Diplomacy Forum"
 Turkey.426.desc:0 "Foreign Ministers Sergey Lavrov and Dmytro Kuleba met for talks in Antalya, Turkey, with Turkish Foreign Minister Mevlüt Çavuşoğlu as mediator, in the first high-level contact between the two sides since the invasion began. Ukraine sought a 24-hour ceasefire to deliver aid and evacuate civilians, especially in Mariupol. After two hours of talks, no agreement was reached, and the airstrikes on the port city continued."
 Turkey.426.a:0 "No Peace, but a Political Victory for Us"
 Turkey.427.title:0 "Police Attack on the Furkan Foundation"
 Turkey.427.desc:0 "Members of the Furkan Foundation, led by Alparslan Kuytul, gathered on Cevat Yurdakul Street in Adana's Seyhan district to protest the detention of 8 volunteers.\n\nThe group, including Alparslan Kuytul himself, was attacked by the police, and Kuytul was dragged to the ground. According to footage shared by the Furkan Foundation, the police used pepper spray and rubber bullets and beat the activists with batons.\n\nThe Furkan Foundation's official Twitter account posted: "We do not want a minister who gives unlawful orders to the security forces! On the instructions of Soylu, masked police rained batons on members of the Furkan Movement!""
 Turkey.427.a:0 "The Police Were Right to Act!"
 Turkey.428.title:0 "The Montreux Statement"
 Turkey.428.desc:0 "Cavusoglu noted that the Montreux Convention clearly regulates how long and in what numbers the warships of Black Sea and non-Black Sea states may pass through the Straits and remain in the Black Sea.\n\nExplaining that Turkey has fully implemented the Montreux Convention to date, Cavusoglu said: "Under these conditions, of course, we will implement the Montreux Convention. In a war to which Turkey is not a party, Turkey may close the Straits to the warships of the belligerent countries. Article 19 of the Montreux Convention is crystal clear on this."\n\nAsked whether the recent developments should be called a "war, conflict or operation", Cavusoglu said:\n\n"At first, there was an attack by Russia. But we assessed it with our experts, our soldiers and our lawyers. It is now especially evident in many cities that this has turned into a war; the clashes in the streets have become a war between the parties. We have reached a conclusion on this. There is now a serious conflict between the states. This is not a military operation, nor a temporary air strike or two; there is officially a state of war in the country."\n\nStressing that the process must be transparent, Cavusoglu noted that some Russian ships bound for their bases in the Black Sea are currently in the Mediterranean.\n\nCavusoglu also noted that Article 19 of the Montreux Convention provides an exception for the warships of belligerent countries: "What is this exception? If a warship is returning to its base in the belligerent country, to the port where it is registered, then its passage cannot be blocked. This is an exception to the general rule." \n\n"Of course, there must be no abuse of this either," Cavusoglu said. "No one should say 'I am going back to my base' and then join the war after passing through the Bosphorus. We will apply all the provisions of Montreux in this way, transparently.""
 Turkey.428.a:0 "Peace in the Black Sea Must Be Maintained"
 Turkey.429.title:0 "Peace Talks in Istanbul"
 Turkey.429.desc:0 "On Tuesday, for the first time in more than two weeks, Ukrainian and Russian negotiators came face to face. They sat across a white tablecloth at a long table inside a 19th-century Ottoman palace on the banks of the Bosphorus, welcomed personally by President Recep Tayyip Erdogan, who greeted them in English with "good morning.""
 Turkey.429.a:0 "No Peace, but a Second Political Victory for Us"
 Turkey.430.title:0 "USA Prepares to Sell F-16s"
 Turkey.430.desc:0 "In a letter to Congress, the US State Department said the Biden administration believes a potential sale of F-16 fighter jets to Turkey would serve US national security interests as well as the long-term unity of NATO."
 Turkey.430.a:0 "Let's Hope They Sell Them"
 Turkey.431.title:0 "A Mine Detected in the Bosphorus"
 Turkey.431.desc:0 "A mine spotted by fishermen off Sarıyer yesterday caused alarm. The strait was closed to shipping for 5 hours while SAS teams neutralized it. Minister Akar explained that it was an old-type mine."
 Turkey.431.a:0 "It's Been Defused, So We Can Carry On"
 Turkey.432.title:0 "ESK Dramatically Raises Meat Prices"
 Turkey.432.desc:0 "The Meat and Milk Board (ESK) has raised the price of red meat by 48 percent, leaving people convinced the economy is completely broken."
 Turkey.432.a:0 "Not Good to Hear"
 Turkey.433.title:0 "The Founding of the Zafer Party"
 Turkey.433.desc:0 "After the party submitted the documents required to found the Zafer Party, Özdağ, who came to the Ministry of the Interior with his delegation to collect the approved papers, spoke to the press.\n\n"We will keep touring Turkey with the motto 'Science, unity, peace'. Today, 26 August, marks the 950th anniversary of our arrival in Anatolia and the 99th anniversary of the Great Offensive, and we are founding our own party. We wish Turkey, the great Turkish nation and the Turkic world well.""
 Turkey.433.a:0 "Interesting"
 Turkey.434.title:0 "Kilicdaroglu Attacks SADAT"
 Turkey.434.desc:0 "In a surprise move, CHP Chairman Kemal Kilicdaroglu went to the front of SADAT's headquarters, accompanied by a large number of CHP MPs.\n\nMaking a statement there, the CHP leader said: "The SADAT we are dealing with is a paramilitary organization... It is an institution that trains terrorists." Stressing the importance of election security, Kılıçdaroğlu added: "If anything happens that overshadows the election and undermines its security, this place and the Palace will be responsible.""
 Turkey.434.a:0 "A Dreadful Move"
 Turkey.435.title:0 "Zafer Party Leader Challenges the Interior Minister to a Duel"
 Turkey.435.desc:0 "Zafer Party Chairman Ümit Özdağ went to the Ministry of the Interior yesterday to confront Interior Minister Süleyman Soylu, who had called him "lower than an animal" and "a child of Soros". Blocked there by the security forces, Özdağ keeps posting striking messages on social media. Challenging Soylu once again, he wrote: "Name the place. Whenever you want, wherever you want.""
 Turkey.435.a:0 "What!"
 Turkey.436.title:0 "Finland and Sweden Want to Join NATO"
 Turkey.436.desc:0 "The first country seeking the security umbrella of NATO's Article 5 was Finland, which shares a 1,300-kilometer border with Russia.\n\nSwedish public opinion soon followed its Finnish neighbors, ending the country's 200-year policy of neutrality.\n\nThe two countries' applications for NATO membership mark a radical break with their previous neutrality toward the alliance, which is why these steps are considered historic."
 Turkey.436.a:0 "Time to Use Our Veto"
 Turkey.436.b:0 "Let Them In!"
 Turkey.437.title:0 "Turkey Strikes a Deal in NATO"
 Turkey.437.desc:0 "Turkey, Sweden and Finland all classify the PKK as a terrorist organization, but Erdogan accused the two Nordic states of harboring and supporting PKK fighters, which they deny. Sweden in particular does support and send aid to other Kurdish groups in Syria that the Turkish government does not distinguish from the PKK.\n\nFor Erdogan, the top priority was a guarantee of closer cooperation on this issue and visible respect for Turkey's security needs.\n\nTurkey "got what it wanted" from the deal with Sweden and Finland signed on Tuesday night, the Turkish presidency said in a statement. That meant "full cooperation with Turkey in the fight against the PKK and its affiliates", including the YPG, a PKK offshoot in Syria that Western countries, including the US, had backed in the fight against ISIS.\n\nAccording to the statement, Stockholm and Helsinki also pledged "not to impose embargo restrictions in the field of the defense industry" on Turkey and to take "concrete steps on the extradition of terrorist criminals"."
 Turkey.437.a:0 "It Would Be Great!"
 Turkey.438.title:0 "Çeşme Forest Is Burning"
 Turkey.438.desc:0 "A fire broke out in a grassy area in the Çeşme district of Izmir. Çeşme Mayor Ekrem Oran said: "The center of Ildır is on fire. I appeal to all owners of private water tankers: fill them up and come to help." The fire was brought under control by the crews."
 Turkey.438.a:0 "Awful"
 Turkey.439.title:0 "Grain Corridor Talks"
 Turkey.439.desc:0 "The first day of the planned four-day meeting took place against the backdrop of Russia's invasion of Ukraine and its seizure of the Black Sea ports previously used to export Ukrainian wheat.\n\nThe meeting came as the invasion entered its fifth month, with the blockade of Ukraine's Black Sea ports raising fears of hunger in Africa and the Middle East.\n\nUkraine is a major exporter of wheat and other crops such as barley, maize and sunflower seeds. Kyiv estimates that up to 25 million tons of grain are currently stuck in its ports.\n\nThe negotiators hope to reach a solution that will empty the silos in time for Ukraine's upcoming harvest. Some grain is currently being moved through Europe by rail, road and river, but the amount is small compared with what could be exported by sea."
 Turkey.439.a:0 "Let's See How This Goes"
 Turkey.440.title:0 "Turkish Industry Reaches 150"
 Turkey.440.desc:0 "Turkish industry has passed the 150 mark. Our industry has reached an excellent level of capability and will now develop faster than ever."
 Turkey.440.a:0 "What a Success!"
 Turkey.440.b:0 "What a Success! §Y(With No Speech)§!"
 Turkey.441.title:0 "Turkish Aircraft Developed"
 Turkey.441.desc:0 "Turkish aircraft have been developed. Thanks to these domestic designs, we will have more reliable, more powerful and easier-to-build aircraft. Now we can rule the skies!"
 Turkey.441.a:0 "The Engines Are Running Well"
 Turkey.441.b:0 "The Engines Are Running Well §Y(With No Sound)§!"
 Turkey.442.title:0 "Turkey Changes Its Name to Türkiye"
 Turkey.442.desc:0 "The efforts to promote the use of "Türkiye" instead of "Turkey" on the international stage have succeeded. At Ankara's request, the United Nations has changed "Turkey" to "Türkiye" in foreign languages."
 Turkey.442.a:0 "Hooray!"
 Turkey.443.title:0 "Greek-Turkish Maritime Border Crisis"
 Turkey.443.desc:0 "Following Greek Prime Minister Kyriakos Mitsotakis's address to the US Congress last month, long-running tensions between Turkey and Greece are flaring up again. As both countries face an economic downturn with severe inflation and approach elections in 2023, experts say the tension between them is increasingly being used for domestic purposes.\n\nIn several tweets written in Greek, Turkish President Recep Tayyip Erdogan directly warned the Greeks to be careful about their stance in the Aegean, or else "they will regret it".\n\nErdogan recently said that Mitsotakis "no longer exists" for him, accusing him of trying to block the sale of F-16 fighter jets to Turkey. He also warned: "Don't try to dance with Turkey. You'll get tired and stuck on the road."\n\nIn response, the Greek government called for national unity against an "unpredictable" neighbor, while former Prime Minister Alexis Tsipras replied to Erdogan in Turkish: "Greece will protect its sovereignty against all threats. So let's end the provocations and return to dialogue on the basis of international law. The answer to the economic crisis we all face is not extreme nationalism.""
 Turkey.443.a:0 "When Will This End?"
 Turkey.444.title:0 "Turkish Foreign Minister Visits Israel"
 Turkey.444.desc:0 "The first visit by a Turkish foreign minister to Israel in 15 years has taken place. "We believe that a two-state solution is the only path to lasting peace," Cavusoglu said, noting that he had exchanged views on regional issues with his counterpart Yair Lapid."
 Turkey.444.a:0 "Old Allies Reunite"
 Turkey.445.title:0 "Gazprom Completes the TurkStream Project"
 Turkey.445.desc:0 "Russian energy company Gazprom had started building the offshore section of the TurkStream pipeline. In a statement, Gazprom said that construction of the pipeline across the Black Sea had begun on schedule.\n\nThe statement said the work was being carried out with Allseas's Audacia vessel, while the pipeline in the deeper parts of the Black Sea would be laid by the Pioneering Spirit.\n\nThe intergovernmental agreement was signed in Istanbul in October two years earlier. The TurkStream project envisages two pipelines, each with a capacity of 15.75 billion cubic meters per year: the first line will supply natural gas to Turkey, and the second will supply Europe, provided the necessary guarantees are obtained."
 Turkey.445.a:0 "Good To Hear"
 Turkey.446.title:0 "Mesut Yilmaz Was Beaten Up"
 Turkey.446.desc:0 "Photos of Mesut Yılmaz being beaten up in Budapest years ago have begun to surface in the media. The photos are deeply damaging to the country's prestige."
 Turkey.446.a:0 "Ouch"
 Turkey.447.title:0 "The Rise of the MP"
 Turkey.447.desc:0 "After strong gains in the elections, the Motherland Party (MP) has risen to the top of power. It is a most unexpected turn. We hope it will be good for the whole country."
 Turkey.447.a:0 "Seems Right"
 Turkey.448.title:0 "KPSS Crisis"
 Turkey.448.desc:0 "An investigation has been launched into allegations that questions were leaked in the Public Personnel Selection Exam (KPSS), and the head of ÖSYM was dismissed. Prof. Dr. Bayram Ali Ersoy, appointed to replace Prof. Dr. Halis Aygün as ÖSYM President, made a statement yesterday announcing that all sessions had been canceled. Ersoy said some of the questions put to candidates had been found in the question booklets of a publishing house."
 Turkey.448.a:0 "A Total Disaster!"
 Turkey.449.title:0 "A New Media Law Announced"
 Turkey.449.desc:0 "The Law Amending the Press Law and Certain Other Laws has been published in the Official Gazette. The regulation, intended to prevent the spread of misleading information on social media, has entered into force."
 Turkey.449.a:0 "Good"
 Turkey.450.title:0 "CHP Files Petition to Annul the Media Law"
 Turkey.450.desc:0 "The CHP took action after the Press Law amendments, known as the disinformation law, were published in the Official Gazette.\n\nCHP Group Deputy Chairman Engin Altay submitted a petition seeking the annulment and suspension of Article 29 of the Law Amending the Press Law and Certain Other Laws, which provides for 1 to 3 years in prison for those who commit the crime of "publicly disseminating misleading information". Altay then made a statement in front of the Constitutional Court.\n\nThe petition submitted to the Constitutional Court stated: "Article 217/A, added to Turkish Penal Code No. 5237 of 26/9/2004 by Article 29 of Law No. 7418 of 13/10/2022 Amending the Press Law and Certain Other Laws, is contrary to Articles 2, 13, 25, 26, 28, 38 and 153 of the Constitution. It must therefore be annulled, and since its application would cause damage and situations that are difficult or impossible to remedy, its enforcement must be suspended until the annulment case is concluded.""
 Turkey.450.a:0 "How Dare They?"
 Turkey.453.title:0 "Bomb Explosion on Istiklal Avenue, Istanbul"
 Turkey.453.desc:0 "Six people were killed and 81 wounded on Sunday when an explosion rocked a busy pedestrian street in central Istanbul, in what Turkish President Tayyip Erdogan called a bomb attack that "smells of terrorism". Hundreds of people fled the historic Istiklal Avenue after the blast as ambulances and police raced in. The area, in the Beyoglu district of Turkey's largest city, had been crowded as usual at the weekend with shoppers, tourists and families."
 Turkey.453.a:0 "Oh no..."
 Turkey.454.title:0 "The Assassination of Sinan Ateş"
 Turkey.454.desc:0 "Assoc. Prof. Dr. Sinan Ateş, former President of the Ülkü Ocakları Education and Culture Foundation and a faculty member at Hacettepe University, and his friend Selman Bozkurt were attacked by a gunman on a motorcycle last Friday as they left the mosque on 1456th Street in the Kızılırmak neighborhood of Ankara's Çankaya district. Shot in the head, Ateş died at the scene, while Bozkurt was wounded in the shoulder. Three people were detained along with the attacker. Sinan Ateş was laid to rest in the Emir Sultan Cemetery after a funeral prayer attended by about 10,000 people at the Grand Mosque of Bursa."
 Turkey.454.a:0 "Not Good"
 Turkey.455.title:0 "Özgür Özel Attacks the Interior Minister"
 Turkey.455.desc:0 "CHP Group Deputy Chairman Özgür Özel, saying he had given copies of a file he claimed concerned Interior Minister Süleyman Soylu to three other people in case "something happens to him", revealed the documents in his possession on live TV."
 Turkey.455.a:0 "What Nonsense Are They Talking?"
 Turkey.456.title:0 "Devlet Bahceli Draws Attention"
 Turkey.456.desc:0 "MHP leader Devlet Bahçeli was met with intense attention from journalists as he walked through the corridors of Parliament after his party's group meeting.\n\nYıldız Yazıcıoğlu, Ankara correspondent for Voice of America, held out a microphone and asked: "There is debate that Erdogan cannot run for a third time unless Parliament takes a decision... What are your views?" Bahçeli replied: "I gather you weren't listening to me."\n\nMHP Deputy Chairman Muhammed Levent Bülbül's eyes widened when he heard the words "Sinan Ateş" come out of the journalist's mouth.\n\nAs Bahçeli tried to leave, the reporter asked another question, this time beginning "The accusations against the MHP over the murder of Sinan Ateş...". The MHP leader lost his temper and snapped: "Mind your own business, come on.""
 Turkey.456.a:0 "What Can We Do About It?"
 Turkey.457.title:0 "Rasmus Paludan Burns the Qur'an in Front of the Turkish Embassy"
 Turkey.457.desc:0 "Rasmus Paludan, founder of the far-right Stram Kurs party, announced yesterday that the Swedish police had authorized his protest for today and invited everyone to join it on his social media accounts. At 15:00, inside the security cordon set up by the Swedish police in an area in front of the Turkish Embassy in Stockholm, Paludan gave a long speech with a lighter in his hand.\n\nPaludan then set fire to the Holy Qur'an and continued speaking with the burning book in his hand. The Swedish police did not intervene at any point during the protest.\n\nRasmus Paludan, a Danish-Swedish citizen known for his extreme right-wing views, founded the far-right party Stram Kurs, which is active in Denmark and Sweden. He was sentenced in Denmark in 2020 to one month in prison for several offenses, including racism.\n\nPaludan has staged Qur'an burnings before, most recently last year in a predominantly Muslim neighborhood."
 Turkey.457.a:0 "How Dare They?"
 Turkey.458.title:0 "Turkey Suspends the Trilateral Talks Indefinitely"
 Turkey.458.desc:0 "At Ankara's request, the trilateral mechanism meeting between Turkey, Sweden and Finland has been postponed indefinitely. The next meeting had been scheduled for February in Brussels. \n\nPresident Tayyip Erdogan said yesterday: "If Sweden cannot respect the religious beliefs of Muslims, it will receive no support from us on NATO.""
 Turkey.458.a:0 "Goodbye NATO!"
 Turkey.459.title:0 "The Founding of the "Table of Six""
 Turkey.459.desc:0 "The Table of Six was formed as a political platform by the CHP, the IYI Party, the Saadet Party, the Democrat Party, the DEVA Party and the Gelecek Party at its first meeting on 12 February 2022. IYI Party Secretary General Uğur Poyraz explained that the Nation Alliance is an electoral alliance, whereas the Table of Six is a working partnership that goes beyond the election process."
 Turkey.459.a:0 "The Opposition Has United"
 Turkey.460.title:0 "Warnings From Several Consulates"
 Turkey.460.desc:0 "Following the security alert issued by the US Embassy on 27 January, leading European countries issued similar statements and decided to temporarily close their consulates in Istanbul, especially those around Taksim. The alert was based on "serious and specific" intelligence about a possible terrorist attack targeting foreign missions, churches, synagogues and tourist hotspots, and the statements were issued in cooperation with the Turkish authorities."
 Turkey.460.a:0 "What Are They Planning?"
 Turkey.461.title:0 "The "Table of Six" Publishes Its Joint Memorandum of Understanding"
 Turkey.461.desc:0 "The "Table of Six", made up of the CHP, the IYI Party, the DEVA Party, the Gelecek Party, the Saadet Party and the Democrat Party, has published a Joint Memorandum of Understanding setting out its election promises. The memorandum contains more than 2,000 measures under 9 headings; the electoral threshold, the presidential term limit and Atatürk Airport were among the promises that drew the most attention.\n\nThe text of the Nation Alliance's Memorandum of Common Policies was announced at a meeting attended by the leaders of the six parties and presented by six deputy chairmen. It consists of 9 main headings: "Law, Justice and the Judiciary", "Public Administration", "Anti-Corruption, Transparency and Auditing", "Economy, Finance and Employment", "Science, R&D, Innovation, Entrepreneurship and Digital Transformation", "Sectoral Policies", "Education", "Social Policy" and "Foreign Policy, Defense, Security and Migration Policy".\n\nThe Headline Election Promises\n\nAmong the more than 2,000 measures, the 12 that have been most talked about on social media are:\n\n1) The residences and palaces allocated to the Presidency will be opened to the public, and some of the Presidency's planes will be sold.\n2) The electoral threshold will be lowered to 3 percent.\n3) Proceeds of corruption smuggled abroad will be brought back, and an Asset Recovery Office will be set up for this purpose.\n4) The Turkey Wealth Fund will be closed.\n5) The Kanal Istanbul project will be canceled and Atatürk Airport will be reopened.\n6) Trustees appointed to local governments will be removed.\n7) Offices set up within the Presidency, such as the finance and human resources offices, will be closed.\n8) The Central Bank, which is preparing to move to Istanbul, will stay in Ankara with all its offices.\n9) The FX-Protected Deposit scheme will be wound down.\n10) Where irregularities and corruption are found in public-private partnership projects, legal action will be taken against the contractors, their partners and those responsible for any public loss, and the losses will be recovered from them.\n11) No one will draw more than one public salary, and interviews in public hiring will be abolished.\n12) The Council of Higher Education will be abolished; universities will choose their own administrations, and their own faculty will carry out audits."
 Turkey.461.a:0 "Interesting"
 Turkey.462.title:0 "Kilicdaroglu Talks With a Young Man"
 Turkey.462.desc:0 "CHP Chairman Kemal Kılıçdaroğlu attended the Future Youth Festival held in Istanbul yesterday.\n\nDuring his speech, high school student Ömer Faruk Berber, sitting in the back row of the stands, called out to the CHP leader: "Don't run as a candidate."\n\nWhile some attendees reacted angrily to Ömer Faruk Berber, Kılıçdaroğlu went over and met the young man.\n\nCHP Group Deputy Chairman Engin Özkoç wrote about the meeting on social media: "Our Chairman Kemal Kılıçdaroğlu met with high school student Ömer Faruk, who protested him at the Youth Festival. He said that everyone has freedom of opinion and that he respects every view. 'Democracy will win,' he said.""
 Turkey.462.a:0 "Whatever"
 Turkey.464.title:0 "The Pazarcık Earthquake"
 Turkey.464.desc:0 "On 6 February 2023, an earthquake struck southern and central Turkey and northern and western Syria. It occurred 34 km (21 mi) west of the city of Gaziantep at 04:17 TRT (01:17 UTC), with a maximum Mercalli intensity of XI (Extreme) and a magnitude of at least Mw 7.8, causing widespread damage and tens of thousands of deaths.\n\nIt was the deadliest and strongest earthquake in Turkey since the 1939 Erzincan earthquake of the same magnitude, the deadliest to affect Syria since the 1822 Aleppo earthquake, one of the strongest ever recorded in the Levant and the deadliest worldwide since the 2010 Haiti earthquake. It was felt, and caused structural damage, as far away as Israel, Lebanon, Cyprus and Turkey's Black Sea coast. The earthquake was followed by more than 1,000 aftershocks, including an unusually powerful Mw 7.7 quake nine hours after the mainshock. As of 10 February, more than 24,000 deaths had been reported: 20,000 in Turkey and 4,000 in Syria. A major winter storm hampered rescue efforts, dropping snow on the ruins and bringing plunging temperatures. Because of the freezing weather, survivors, especially those trapped under rubble, face a grave risk of hypothermia."
 Turkey.464.a:0 "Devastating"
 Turkey.465.title:0 "The Death of Deniz Baykal"
 Turkey.465.desc:0 "Former CHP Chairman Deniz Baykal, one of the most important figures in Turkish politics, has passed away. The news was announced by CHP Chairman Kemal Kılıçdaroğlu on his social media account. His daughter Aslı Baykal said: "My father passed away peacefully in his sleep at home this morning. We plan to lay him to rest in Antalya on Tuesday.""
 Turkey.465.a:0 "Rest in Peace"
 Turkey.466.title:0 "The Legacy of the 1999 Gölcük Earthquake"
 Turkey.466.desc:0 "On 17 August 1999, a catastrophic magnitude 7.6 earthquake struck Turkey's Kocaeli Province, causing enormous damage and between 17,127 and 18,373 deaths. Named for its proximity to the northwestern city of Izmit, it is also widely known as the 17 August Earthquake or the 1999 Gölcük Earthquake. It struck at 03:01 local time (00:01 UTC) at a shallow depth of 15 km, with a maximum Mercalli intensity of X (Extreme). The shaking lasted 37 seconds, and the quake is remembered as one of the deadliest natural disasters in modern Turkish history.\n\nThe 1999 earthquake was part of a seismic sequence along the North Anatolian Fault that began in 1939, producing large earthquakes that moved progressively from east to west over 60 years. It led to the introduction of a so-called earthquake tax intended to help those affected.\n\nThe earthquake devastated the Marmara region, killing thousands and bringing down many buildings. We began rebuilding back then, but the damage is still there. These areas must be fully restored."
 Turkey.466.a:0 "We Still Need to Rebuild!"
 Turkey.467.title:0 "The Pazarcık Earthquake"
 Turkey.467.desc:0 "The Mw 7.8 earthquake is the largest in Turkey since the 1939 Erzincan earthquake of the same magnitude, and jointly the second-strongest in the country's recorded history, after the 1668 North Anatolia earthquake. It is also one of the strongest earthquakes ever recorded in the Levant. It was felt as far away as Egypt and Turkey's Black Sea coast, and more than 10,000 aftershocks followed in the next three weeks. The sequence was caused by shallow strike-slip faulting.\n\nDamage was widespread across an area of about 350,000 km2 (140,000 sq mi), roughly the size of Germany. An estimated 14 million people, 16 percent of Turkey's population, were affected, and UN development experts estimated that about 1.5 million people were left homeless.\n\nThe confirmed death toll stood at 59,259: 50,783 in Turkey and 8,476 in Syria. It is the deadliest earthquake in present-day Turkey since the 526 Antioch earthquake and the deadliest natural disaster in the country's modern history. It is also the deadliest in present-day Syria since the 1822 Aleppo earthquake, the deadliest worldwide since the 2010 Haiti earthquake and the fifth-deadliest of the 21st century. Damage was estimated at 104 billion US dollars in Turkey and 14.8 billion in Syria, making it the fourth-costliest earthquake on record."
 Turkey.467.a:0 "Devastating"
 Turkey.468.title:0 "The Pazarcık Earthquake"
 Turkey.468.desc:0 "On 6 February 2023, an earthquake struck southern and central Turkey and northern and western Syria. It occurred 34 km (21 mi) west of the city of Gaziantep at 04:17 TRT (01:17 UTC), with a maximum Mercalli intensity of XI (Extreme) and a magnitude of at least Mw 7.8, causing widespread damage and many deaths.\n\nIt was the strongest earthquake in Turkey since the 1939 Erzincan earthquake of the same magnitude, the deadliest to affect Syria since the 1822 Aleppo earthquake and one of the strongest ever recorded in the Levant. It was felt, and caused structural damage, as far away as Israel, Lebanon, Cyprus and Turkey's Black Sea coast. The earthquake was followed by more than 1,000 aftershocks, including an unusually powerful Mw 7.7 quake nine hours after the mainshock. Thanks to Turkey's well-built structures, the toll there was remarkably low: as of 10 February, 11,027 deaths had been reported, 27 in Turkey and 11,000 in Syria. A major winter storm hampered rescue efforts, dropping snow on the ruins and bringing plunging temperatures. Because of the freezing weather, survivors, especially those trapped under rubble, face a grave risk of hypothermia."
 Turkey.468.a:0 "Our Buildings Stood Strong!"
 Turkey.469.title:0 "2020 Aegean Sea Earthquake"
 Turkey.469.desc:0 "The İzmir earthquake, with a moment magnitude of 7.0, struck on Friday, 30 October 2020, about 14 km (8.7 mi) northeast of the Greek island of Samos. Many buildings were severely damaged or collapsed; the Church of the Assumption of Mary in Karlovasi, Greece, partially collapsed, while in the hard-hit Turkish city of İzmir dozens of buildings were damaged or destroyed. Emergency services in both countries rushed to the scene, and rescue efforts continued through the night. 1,170 people are known to have died in İzmir Province, with 7,034 more injured. \n\nIn Greece, two more people died and nineteen suffered minor injuries. It was the most powerful earthquake in the Aegean Sea since 1981, the deadliest in İzmir Province since a magnitude 6.6 quake killed four people in 1955, and the deadliest earthquake of 2020."
 Turkey.469.a:0 "Oh No!"
 Turkey.470.title:0 "2020 Elazığ Earthquake"
 Turkey.470.desc:0 "The 2020 Elazığ earthquake struck Turkey at 20:55 on 24 January, with a magnitude of 6.7 Mw. Its epicenter was near the town of Sivrice in Elazığ Province, and it was felt in the neighboring provinces of Diyarbakır, Malatya and Adıyaman as well as in Armenia, Syria and Iran. Kandilli Observatory reported the magnitude as 6.5 Mw. In total, 783 people were killed and more than 3,600 were injured."
 Turkey.470.a:0 "Oh No!"
 Turkey.471.title:0 "The IYI Party Leaves the Table of Six"
 Turkey.471.desc:0 "IYI Party Chairman Meral Akşener held a press conference after meeting with the members of the party's General Administrative Board. Akşener said that, at the point things had reached, the IYI Party was being squeezed and forced into a fait accompli, but that it would not submit.\n\nNoting that 5 political parties had backed Kemal Kilicdaroglu's candidacy at the Table of Six meeting the day before, Akşener said: "As the IYI Party, we expressed our view on the candidacy of 2 names we have heard again and again in the streets, shops and squares for more than 3 years. We have witnessed our nation's deep affection for them almost everywhere, and we have seen them beat Mr. Erdogan by a wide margin in every poll for a long time. These 2 names were the Mayor of Ankara, Mr. Mansur Yavaş, and the Mayor of Istanbul, Mr. Ekrem Imamoğlu.""
 Turkey.471.a:0 "A Firm Decision"
 Turkey.472.title:0 "Clearing Mines Along the Syrian Border"
 Turkey.472.desc:0 "Whatever our relations with Syria, we are obliged to clear these mines because we have signed the Ottawa Convention. The border mines have now been cleared, as of 2011."
 Turkey.472.a:0 "For Humanity!"
 Turkey.473.title:0 "Umit Ozdag and Muharrem Ince Form an Alliance"
 Turkey.473.desc:0 "Zafer Party Chairman Ümit Özdağ, Memleket Party Chairman Muharrem Ince, Doğru Party Chairman Rifat Serdaroğlu and Adalet Party Chairman Vecdet Öz have reportedly come together to form Turkey's fourth alliance.\n\nThe People's Alliance, the Nation Alliance and the Labor and Freedom Alliance have already been formed for the May 2023 elections. The Memleket Party, the Zafer Party, the Doğru Party and the Adalet Party had previously announced that they would form a fourth alliance."
 Turkey.473.a:0 "Whatever"
 Turkey.474.title:0 "The End of the Ozdag-Ince Alliance"
 Turkey.474.desc:0 "Ümit Özdağ said on a TV program that Muharrem Ince had walked out of the alliance they had been planning. According to Özdağ, the reason was that he had called on Ankara Mayor Mansur Yavaş to take on a role. Özdağ admitted that he had expected something like this, adding that he found Ince's attitude wrong."
 Turkey.474.a:0 "And There Goes the Alliance!"
 Turkey.475.title:0 "Anti-Government Protests in the Stands"
 Turkey.475.desc:0 "At last week's Fenerbahçe-Konyaspor and Beşiktaş-Antalyaspor matches, fans chanting for the government to resign, just months before the election, drew a sharp reaction from the government."
 Turkey.475.a:0 "How Dare They?"
 Turkey.476.title:0 "The IYI Party Returns to the Table of Six"
 Turkey.476.desc:0 "IYI Party Chairman Meral Akşener met with Ekrem Imamoğlu and Mansur Yavaş and then with CHP Chairman Kemal Kılıçdaroğlu. Imamoğlu and Yavaş were reportedly also present at Akşener and Kılıçdaroğlu's meeting at a hotel in Çukurambar.\n\nAkşener reportedly proposed to Kılıçdaroğlu that Imamoğlu and Yavaş be given the posts of vice president. After the meeting, Akşener and Kılıçdaroğlu left the hotel separately.\n\nAfterwards, IYI Party Spokesman Kürşad Zorlu made a statement in front of the party headquarters. Zorlu said that party leader Meral Akşener had met with CHP Chairman Kemal Kılıçdaroğlu and added: "As of now, our chairman has decided to attend the Nation Alliance meeting at the Saadet Party shortly.""
 Turkey.476.a:0 "They're Back!"
 Turkey.477.title:0 "Kilicdaroglu Becomes the Nation Alliance's Presidential Candidate"
 Turkey.477.desc:0 "The presidential candidacy was settled today at the Nation Alliance's critical meeting. After IYI Party leader Meral Akşener objected to CHP leader Kemal Kılıçdaroğlu's candidacy, following the meeting at which the Table of Six was to decide the candidate, events moved quickly. Today, the CHP, the IYI Party, the DEVA Party, the Gelecek Party, the Saadet Party and the Democrat Party came together again, hosted by the Saadet Party. The meeting lasted 4.5 hours, and Kemal Kılıçdaroğlu was announced as the Nation Alliance's presidential candidate. The popular mayors Mansur Yavaş and Ekrem İmamoğlu are to become vice presidents."
 Turkey.477.a:0 "Here We Go!"
 Turkey.477.b:0 "Here We Go! §Y(With No Speech)§!"
 Turkey.478.title:0 "The CHP's New Presidential Candidate"
 Turkey.478.desc:0 "The CHP mayors of Ankara and Istanbul have become popular across the country. We can make Ekrem İmamoğlu or Mansur Yavaş our presidential candidate. The choice is yours."
 Turkey.478.a:0 "Mansur Yavaş"
 Turkey.478.b:0 "Ekrem İmamoğlu"
 Turkey.479.title:0 "Flood in Adıyaman"
 Turkey.479.desc:0 "Tokat Governor Numan Hatipoğlu, appointed coordinator for the Gölbaşı district of Adıyaman, announced that 1 person had died and 3 were missing after a container in a garden in the Tut district was swept away by the floodwaters during the downpour. The 3 missing people were reportedly from the same family. On the situation in the city, where 103 kg of rain fell per square meter, Adıyaman Mayor Süleyman Kılınç said: "We are getting the heaviest rainfall in recent memory. Keep the information coming. We have 1 death in our district and 3 missing. There are problems in the tents, and we are evacuating them step by step." AFAD said in a statement: "Excessive rainfall in the region has caused flooding in the Tut district of Adıyaman. Our Adıyaman, Adana, Kahramanmaraş and Diyarbakır AFAD teams have been dispatched to the area. We are following the developments.""
 Turkey.479.a:0 "Another Disaster After the Earthquake"
 Turkey.480.title:0 "Heavy Hail in Gaziantep"
 Turkey.480.desc:0 "Rain and hail that began in the evening left puddles on some streets, making life hard for drivers and pedestrians alike. With cars covered in a white blanket of hail, some residents covered their vehicles with blankets and carpets to protect them."
 Turkey.480.a:0 "Another Disaster After the Earthquake"
 Turkey.481.title:0 "The Yeniden Refah and AK Party Alliance"
 Turkey.481.desc:0 "Hours before the parties were due to submit their alliance protocols to the Supreme Electoral Council (YSK), the New Welfare Party (YRP), chaired by Fatih Erbakan, joined the People's Alliance after a last-minute agreement.\n\nThe protocol of the People's Alliance, made up of the Justice and Development Party (AKP), the Nationalist Movement Party (MHP), the Great Unity Party (BBP) and the YRP, was signed by the party leaders in line with the agreement and submitted to the YSK by party officials."
 Turkey.481.a:0 "We Stand United Against the Table of Six"
 Turkey.482.title:0 "Mehmet Simsek Turns Down the AK Party"
 Turkey.482.desc:0 "AKP Chairman Recep Tayyip Erdogan met former Finance Minister Mehmet Simsek at the AKP headquarters. During the meeting, Simsek said he had no plans to enter active politics but was ready to help on matters within his expertise."
 Turkey.482.a:0 "Whatever"
 Turkey.483.title:0 "HÜDA PAR Joins the AK Party Camp"
 Turkey.483.desc:0 "HÜDA PAR Chairman Zekeriya Yapıcıoğlu said: "We have decided to support the People's Alliance candidate Recep Tayyip Erdoğan in the 2023 presidential election. Our talks on the parliamentary elections are continuing.""
 Turkey.483.a:0 "We Stand United Against the Table of Six"
 Turkey.484.title:0 "TOGG Enters Everyday Life"
 Turkey.484.desc:0 "The excitement over TOGG's mass production began with the factory's opening ceremony. Turkey's smart car factory was opened today in the Gemlik district of Bursa with the President in attendance. Mass production will soon be running at full speed in the factory, built on one of the most advanced technological infrastructures in the world. With an annual capacity of 175,000 vehicles, the plant aims to produce a total of 1 million vehicles across 5 models within 10 years."
 Turkey.484.a:0 "Good News"
 Turkey.485.title:0 "First HÜRJET Flight"
 Turkey.485.desc:0 "The HÜRJET jet trainer and light attack aircraft developed by Turkish Aerospace (TUSAŞ) has taken to the air with its F404 turbofan engine. With engine integration successfully completed, HÜRJET began ground tests and has now successfully completed its first flight."
 Turkey.485.a:0 "Good News"
 Turkey.486.title:0 "The First Boron Carbide Plant"
 Turkey.486.desc:0 "According to a statement from the Ministry of Energy and Natural Resources, Eti Maden broke a record last year with sales revenue of 1 billion 321 million dollars in Turkey, which holds 73 percent of the world's boron reserves. Turkey's first boron carbide plant, one of the country's first strategic facilities and a boost to the defense industry, opens today in the Bandırma district of Balıkesir.\n\nThe facility, which will employ 279 people at full capacity, will produce 1,000 tons of boron carbide a year. Boron carbide, the third-hardest material after diamond and cubic boron nitride, is used in many fields, especially the defense industry."
 Turkey.486.a:0 "Good News"
 Turkey.487.title:0 "TCG Anadolu"
 Turkey.487.desc:0 "TCG Anadolu (L-400) is an amphibious assault ship of the Turkish Navy that can be configured as a V/STOL aircraft carrier. It is named after the Anatolian peninsula, which makes up most of Turkey's landmass. Construction began on 30 April 2016 at the Sedef Shipbuilding yard in Istanbul, and the keel was laid on 7 February 2018. TCG Anadolu was commissioned in a ceremony on 10 April 2023."
 Turkey.487.a:0 "Good News"
 Turkey.488.title:0 "The Turkish Red Crescent Scandal"
 Turkey.488.desc:0 "Responding on CNN Türk to allegations that Red Crescent tents had been sold to the Ahbap association, Red Crescent President Kerem Kınık said: "About 2,050 of our tents were delivered at cost price. We do this for financial sustainability."\n\nAfter this admission, voluntary blood donations to the Red Crescent dropped sharply, and the organization's reputation was badly damaged."
 Turkey.488.a:0 "The Situation Is Getting Worse"
 Turkey.489.title:0 "Mahir Akkoyun Arrested"
 Turkey.489.desc:0 "Some of the images recently shared on social media were among the most creative and eye-catching political protests of recent times. Stickers reading "Thanks to Erdogan" were stuck on products in grocery stores and shops, criticizing the cost of living, which has recently become unbearable. These stickers, plastered on the shelves of pricey grocery stores, led to a striking development: their designer, Mahir Akkoyun, announced on social media that he had been detained. Naturally, many politicians and thousands of social media users reacted strongly to his detention."
 Turkey.489.a:0 "Eh"
 Turkey.490.title:0 "The IYI Party Attacks Fahrettin Altun"
 Turkey.490.desc:0 "The IYI Party has targeted Fahrettin Altun with an animated video, claiming that Communications Director Fahrettin Altun manipulates the media and has built a troll army."
 Turkey.490.a:0 "This Is Unacceptable"
 Turkey.491.title:0 "Suleyman Soylu Attacks the Opposition"
 Turkey.491.desc:0 "Addressing party members at the AK Party's Sarıyer district office, Interior Minister Süleyman Soylu said: "It is not the government that will change, it is the opposition. We are facing an opposition that does not even deserve to be the opposition, let alone to govern. The people will do what is needed.""
 Turkey.491.a:0 "Move On!"
 Turkey.492.title:0 "Mansur Yavas Gives a Hard-Line Anti-PKK Speech"
 Turkey.492.desc:0 "Ankara Mayor Mansur Yavaş, the Nation Alliance's vice presidential candidate, lashed out at the PKK terrorist organization in very harsh words. Saying the Table of Six wanted to open a clean page but Qandil was trying to spoil it, Yavaş declared: "We say it clearly: we will bring Qandil down on their heads too! We are against the PKK as well.""
 Turkey.492.a:0 "Bad News"
 Turkey.493.title:0 "The Founding of Mustazaf-Der"
 Turkey.493.desc:0 "After the decision to end the armed struggle in 2002, activists from Hizbullah's Menzil group founded an association called "Solidarity with the Oppressed" (Mustazaf-Der) in 2004."
 Turkey.493.a:0 "A New Foundation"
 Turkey.494.title:0 "Court Shuts Down Mustazaf-Der"
 Turkey.494.desc:0 "On 20 April 2010, a court in Diyarbakır ordered the closure of the Association for Solidarity with the Oppressed (Mustazaf-Der) on the grounds that it was "conducting activities on behalf of the terrorist organization Hizbullah". The decision was upheld by the Court of Cassation on 11 May 2012."
 Turkey.494.a:0 "The Movement Will Continue Under a New Name"
 Turkey.495.title:0 "The HDP Becomes the YSP"
 Turkey.495.desc:0 "At the meeting introducing the candidates, HDP Co-Chair Mithat Sancar referred to the closure case against his party and said: "The power of change is in our hands, and the responsibility for building a future of freedom and equality is on our shoulders. We could never leave this responsibility and duty to the discretion of the court or the mercy of the government, and we did not. That is how we have made our way against every scheme. Now the road leads through the Green Left."\n\nThe HDP, which decided to run in the elections under the umbrella of the Green Left Party, did not give an oral defense to the Constitutional Court, in line with its earlier decision. Instead of appearing before the Constitutional Court, party officials attended the Green Left Party's candidate launch, where they presented their parliamentary candidates."
 Turkey.495.a:0 "What A Dramatic Change!"
 Turkey.496.title:0 "Black Sea Floods"
 Turkey.496.desc:0 "In August 2021, Turkey's Black Sea region was hit by catastrophic flooding when a series of thunderstorms in northern Turkey, from 7 to 14 August, triggered multiple floods and landslides. The water rose as high as 4 meters (13 ft) in places, and the floods have been described as the worst in Turkey's history. 97 people died and about 228 were injured, and more than 1,800 people were evacuated, many of them rescued from rooftops. At least 454 buildings suffered significant damage, bridges were damaged or destroyed, and the infrastructure of several towns was badly hit. Experts said urbanization and climate change had made the floods worse, although the share of each factor is disputed."
 Turkey.496.a:0 "A Complete Disaster"
 Turkey.497.title:0 "The Soma Mine Disaster"
 Turkey.497.desc:0 "On 13 May 2014, blasting at the Eynez coal mine in Soma, Manisa, caused an underground fire that burned until 15 May. In total, 301 people were killed in the worst mining disaster in Turkey's history. The mine, operated by coal producer Soma Kömür İşletmeleri A.Ş., caught fire for reasons later found to be complex. The fire broke out during a shift change, when 787 workers were underground. At first, the disaster was thought to be mainly an explosion rather than a fire. After the last bodies were recovered on 17 May 2014, four days after the fire, Minister of Energy and Natural Resources Taner Yıldız confirmed the death toll at 301. The Disaster and Emergency Management Presidency (AFAD) published the names of the 301 workers who died and the 486 who survived."
 Turkey.497.a:0 "A Complete Disaster"
 Turkey.498.title:0 "The Creation of Ankapark"
 Turkey.498.desc:0 "Under Mayor Melih Gökçek, steps have been taken toward an Ankapark project in Ankara. We hope Ankapark will help attract tourists."
 Turkey.498.a:0 "Interesting"
 Turkey.499.title:0 "Mansur Yavas Agrees to Reopen Ankapark"
 Turkey.499.desc:0 "Answering AKP MP Sinan Burhan's question "Will you open Ankapark?" with "Yes, I will," Yavaş continued: "Why shouldn't I open it? My money is in there too. I will open it to the public, and not for a fortune.""
 Turkey.499.a:0 "It Seems Like Good News"
 Turkey.500.title:0 "The Cem Saygı Scandal"
 Turkey.500.desc:0 "After Memleket Party Chairman Muharrem Ince's "gas pedal" dance shook social media, footage of Cem Saygı dancing also went viral. He defended himself by saying: "So what if I twerked, bro? Ince does the gas pedal too."\n\nAfterwards, Cem Saygı claimed he had been offered 5,000 TL to withdraw as a parliamentary candidate for Ince's Memleket Party and had received death threats. Speaking on a live stream from his social media account, Saygı reproached Ince: "Is this how he makes way for young people?""
 Turkey.500.a:0 "Bad News"
 Turkey.501.title:0 "Muharrem Ince Promises Space Mining"
 Turkey.501.desc:0 "In his campaign speech, Muharrem Ince made strange and unrealistic promises, telling the public about space mining, nanotechnology and fusion. He mentioned fusion three times."
 Turkey.501.a:0 "He's a Good Dancer, Though"
 Turkey.502.title:0 "Melih Gokcek Pops Balloons"
 Turkey.502.desc:0 "Melih Gökçek attacked opposition leader Kılıçdaroğlu in an unusual way: he wrote Kılıçdaroğlu's name on a balloon and popped it. The public found the stunt bizarre."
 Turkey.502.a:0 "What Is He Up To?"
 Turkey.503.title:0 "The Istanbul Finance Center"
 Turkey.503.desc:0 "The Istanbul Finance Center is a financial district project in the Ümraniye district of Istanbul. According to the Ministry of Environment and Urbanization, its goal is to build a financial center larger than those in New York, London and Dubai and to turn Istanbul into an international financial hub. The project aims to create both the heart of the financial sector and a place that is alive 24 hours a day, and once completed it is expected to provide jobs for about 30,000 people. Of its roughly 2.5 million square meters of construction area, 560,000 square meters will be offices, 90,000 shopping malls, 70,000 hotels and 60,000 residences, along with a culture and congress center for 2,000 people."
 Turkey.503.a:0 "For a Great Future"
 Turkey.504.title:0 "İMECE Launched Into Space"
 Turkey.504.desc:0 "İMECE began in 2013 as an infrastructure project funded by the Ministry of Development, and from 2017 it was supported as the "İMECE Satellite Project" under the TÜBİTAK 1007 Program, with work carried out at TÜBİTAK UZAY. The İMECE satellite, the main output of the six-year project, was launched on 15 April 2023. It separated from its Falcon 9 launch vehicle at 12:23 and sent its first signals within minutes."
 Turkey.504.a:0 "A New Step in Space"
 Turkey.505.title:0 "Mansur Yavas Wins the 2021 World Mayor Prize"
 Turkey.505.desc:0 "Ankara Mayor Mansur Yavaş announced that he had won the 2021 World Mayor Prize, for which 32 mayors from 21 countries were nominated. "This success does not belong to Mansur Yavaş," he said. "To the 6 million people of Ankara: God willing, I will receive this award on your behalf.""
 Turkey.505.a:0 "Good for the CHP"
 Turkey.506.title:0 "Erdogan's Natural Gas Policy"
 Turkey.506.desc:0 "On Thursday, President Tayyip Erdogan flipped the switch on Turkey's first delivery of natural gas to an onshore plant from a reserve discovered in the Black Sea, and promised free natural gas for households ahead of the 14 May elections."
 Turkey.506.a:0 "Good News"
 Turkey.507.title:0 "AK Party-Orchestrated Attack on Kilicdaroglu"
 Turkey.507.desc:0 "On the first day of the Ramadan holiday, after Kemal Kılıçdaroğlu, the main opposition leader in the upcoming 14 May elections, was targeted with sectarian insults while praying at a cemetery for earthquake victims, a group attacked members of the opposition Republican People's Party (CHP) during a visit to a tomb in Adıyaman.\n\n The incident took place after Kılıçdaroğlu visited a religious shrine. As the delegation was leaving the tomb, a man tried to get close to Kılıçdaroğlu and shouted: "We don't want you. Don't come here. You don't belong here." Some people at the scene tried to attack Kılıçdaroğlu's bodyguards."
 Turkey.507.a:0 "Whatever"
 Turkey.508.title:0 "The Çiftlikbank Fraud"
 Turkey.508.desc:0 "The company known as Çiftlikbank swindled people out of huge sums of money. "Tosuncuk", the man who ran Çiftlikbank, has vanished from the country and most likely fled abroad. The people he defrauded are furious."
 Turkey.508.a:0 "That Must Be Bad"
 Turkey.509.title:0 "CHP Protests in Front of the TÜİK Building"
 Turkey.509.desc:0 "After the inflation figures were announced, CHP Chairman Kemal Kilicdaroglu announced he would visit the Turkish Statistical Institute (TÜİK), but the doors were not opened to him and his delegation on the grounds that they had no appointment. Speaking in front of the building, Kılıçdaroğlu said: "TÜİK has ceased to be a state institution and has turned into a palace institution. It is no longer a state institution.""
 Turkey.509.a:0 "They Are Targeting Us!"
 Turkey.510.title:0 "The Pazarcık Tornado"
 Turkey.510.desc:0 "A tornado in the Pazarcık district of Kahramanmaraş blew away the tents housing earthquake survivors. One person was killed and 50 were injured by debris flung from the roofs of damaged buildings."
 Turkey.510.a:0 "Another Disaster After the Earthquake"
 Turkey.512.title:0 "The Zafer Party's Campaign"
 Turkey.512.desc:0 "Zafer Party Chairman Ümit Özdağ has taken to the streets to collect votes for presidential candidate Sinan Oğan, hammering the government over its immigration policy."
 Turkey.512.a:0 "They Are Targeting Us!"
 Turkey.513.title:0 "Attack on the IYI Party Building"
 Turkey.513.desc:0 "A bullet hit a window of the IYI Party's Istanbul provincial headquarters on Friday morning. IYI Party Chairman Meral Akşener first shared the incident on Twitter, addressing President and AKP Chairman Recep Tayyip Erdogan: "Stop having your bullets fired at us and your threats delivered by proxy; if you are going to come, come yourself!""
 Turkey.513.a:0 "Launch an Investigation"
 Turkey.514.title:0 "HDP Aims to Finish the Election in the First Round"
 Turkey.514.desc:0 "On behalf of the Labor and Freedom Alliance, HDP Co-Chair Pervin Buldan announced that they would not field a candidate in the 14 May presidential election, saying: "We will fulfill our historic responsibility against one-man rule in the presidential election.""
 Turkey.514.a:0 "Confusing"
 Turkey.515.title:0 "The DSP Joins the AK Party's Alliance"
 Turkey.515.desc:0 "The Democratic Left Party (DSP) was the latest stop for officials of the ruling Justice and Development Party (AK Party) as they seek to expand their pre-election alliance.\n\nThe AK Party's acting chair Binali Yıldırım and deputy chair and spokesperson Ömer Çelik visited the DSP headquarters in Ankara, where they were received by DSP leader Önder Aksakal.\n\nAksakal said they would discuss the proposal to join the People's Alliance at a party board meeting and would then announce their decision."
 Turkey.515.a:0 "We Stand United Against the Table of Six"
 Turkey.516.title:0 "Erdogan Announces Turkey's First Space Travelers"
 Turkey.516.desc:0 "Türkiye has selected Alper Gezeravcı and Tuva Cihangir Atasever as the country's first space travelers, to be sent into space in the last quarter of this year, President Recep Tayyip Erdogan announced on Saturday.\n\nSpeaking at TEKNOFEST, the country's flagship technology event, he said Gezeravcı, a Turkish Air Force pilot, will be sent to the International Space Station, while Atasever, a space launch systems engineer at the Turkish missile maker Roketsan, was chosen as the backup."
 Turkey.516.a:0 "Good News"
 Turkey.517.title:0 "New Worries About Erdogan's Health"
 Turkey.517.desc:0 "After Turkish President Recep Tayyip Erdoğan fell ill during a live broadcast on the evening of Tuesday, 25 April, and two days of events were canceled, his administration issued several updates on his health. Saying the President had a common cold, the updates from his communications office sought to quell online rumors that he was suffering from a more serious condition."
 Turkey.517.a:0 "There Is No Problem at All"
 Turkey.518.title:0 "Suleyman Soylu Calls 14 May a Coup Attempt"
 Turkey.518.desc:0 "Asked about his remark that "14 May is a political coup attempt", Soylu replied: "What's wrong with it? They want to achieve through elections what they could not achieve through a coup. Erdogan has dismantled the system the United States set up." Pointing to US President Joe Biden, he continued: "In this speech, Biden says, 'We must now bring together all the opposition in Turkey to achieve this in the 2023 elections.' This is not a journalist saying it; it is the American President. Not by a coup, he says, but by an election.""
 Turkey.518.a:0 "He Is Right"
 Turkey.519.title:0 "Opening Ceremony of the Akkuyu Nuclear Power Plant"
 Turkey.519.desc:0 "The Kremlin said on Tuesday that Russia will be represented at "the proper level" at the ceremony for the Akkuyu Nuclear Power Plant (NPP) in Türkiye later this month.\n\nSpeaking at a press briefing in Moscow, spokesman Dmitry Peskov said the Kremlin would soon announce who will lead the Russian delegation at the opening, adding that there would also be participation by video link. Earlier, Turkish President Recep Tayyip Erdogan said his Russian counterpart Vladimir Putin might attend the 27 April ceremony in person or by teleconference.\n\nBuilt as part of Russian-Turkish cooperation, the Akkuyu NPP in Mersin province will be Türkiye's first nuclear power plant, with four reactors and an installed capacity of 4,800 megawatts."
 Turkey.519.a:0 "To the Turkish Nuclear Age!"
 Turkey.520.title:0 "Erdogan Announces New Oil Reserves"
 Turkey.520.desc:0 "Turkish President Recep Tayyip Erdogan announced the discovery of a new oil reserve on Tuesday, revealing that it lies in the country's southeast.\n\n"I'd like to share some fresh good news. We have discovered oil reserves with a production capacity of 100,000 barrels per day in Cudi and Gabar," the President said at the opening ceremony of the Karapınar solar power plant.\n\nErdogan declared that the newly found oil "is of high quality" and said that "Turkey will no longer depend on others for energy but will become an energy exporter.""
 Turkey.520.a:0 "Somehow It Managed to Backfire"
 Turkey.521.title:0 "The TİP's Labor Day Rallies"
 Turkey.521.desc:0 "The Workers' Party of Turkey (TİP), a left-wing party, is one of the organizations that traditionally hold Labor Day rallies in the country. In 2021, the TİP held rallies in several cities, including Istanbul, Ankara and Izmir, calling for better working conditions, higher wages and greater job security.\n\nIn Istanbul, the TİP's rally began in Kadıköy Square, where party members and supporters gathered to hear speeches and take part in demonstrations. The rally was peaceful, with participants carrying banners and placards calling for an end to exploitation and oppression in the workplace.\n\nSimilar rallies were held in other cities, where TİP members and supporters joined forces with labor unions and other progressive organizations to demand more rights and protections for workers. The rallies were seen as an important chance to highlight the struggles of workers in Turkey and around the world and to call for greater solidarity and collective action."
 Turkey.521.a:0 "The Communists Gather for a Great Cause"
 Turkey.522.title:0 "The CHP's and Kilicdaroglu's 2023 Rallies"
 Turkey.522.desc:0 "In 2023, the Republican People's Party (CHP) held a series of rallies across Turkey in the run-up to the parliamentary elections, aimed at mobilizing supporters and raising awareness of the party's policies and platform.\n\nOverall, the CHP's 2023 rallies showed the party's commitment to democratic values, social justice and economic prosperity. The events were well attended and energized supporters ahead of the parliamentary elections, which resulted in a strong showing for the CHP and its allies."
 Turkey.522.a:0 "Interesting"
 Turkey.523.title:0 "The AKP's and Erdogan's 2023 Rallies"
 Turkey.523.desc:0 "In 2023, the ruling Justice and Development Party (AKP) held a series of rallies across Turkey in the run-up to the parliamentary elections, aimed at mobilizing supporters and highlighting the AKP's achievements in power.\n\nOverall, the AKP's 2023 rallies showed the party's commitment to stability, security and economic growth. The events were well attended and energized supporters ahead of the elections, which resulted in a strong showing for the AKP in many parts of the country."
 Turkey.523.a:0 "Interesting"
 Turkey.525.title:0 "The Founding of the People's Alliance"
 Turkey.525.desc:0 "The alliance was formed by the ruling Justice and Development Party (AKP) and the right-wing Nationalist Movement Party (MHP) to consolidate the conservative vote and secure the re-election of President Recep Tayyip Erdogan.\n\nFounded on a shared vision of nationalism, conservatism and strong leadership, the People's Alliance appealed to a wide range of voters across Turkey. During the campaign, it stressed its commitment to economic growth, security and stability and promised to tackle the challenges facing the country."
 Turkey.525.a:0 "Pre-Election Reorganization"
 Turkey.526.title:0 "The Founding of the Nation Alliance"
 Turkey.526.desc:0 "The Nation Alliance is a political coalition formed in Turkey in 2018 ahead of the parliamentary and presidential elections. It brought together several opposition parties, including the Republican People's Party (CHP), the IYI Party and the Saadet Party (SP), to offer a viable alternative to the ruling Justice and Development Party (AKP).\n\nThe Nation Alliance was formed in response to growing concern over the AKP's increasingly authoritarian rule and the erosion of democratic institutions and civil liberties in Turkey. The opposition parties recognized that they had to work together to consolidate the opposition vote and keep the AKP from winning a parliamentary majority and the presidency."
 Turkey.526.a:0 "Pre-Election Reorganization"
 Turkey.527.title:0 "Erdogan's National Aircraft"
 Turkey.527.desc:0 "This time the AK Party entered the elections with a poster titled "Our domestic aircraft in the skies". Thanks to the image on the posters, voters began turning to the AK Party, which looks set to perform strongly in these elections."
 Turkey.527.a:0 "It's Reality"
 Turkey.528.title:0 "Concerns About Election Security"
 Turkey.528.desc:0 "Trust in these elections is also lacking. For example, the YSK's objection to GAMER, a parallel structure within the interior ministry, and pre-marked AKP ballots in overseas voting were issues that deepened concerns about election security."
 Turkey.528.a:0 "Whatever"
 Turkey.529.title:0 "Crowd Attacks a HÜDA PAR Election Stand"
 Turkey.529.desc:0 "Ahead of President Erdogan's rally in the city today, HÜDA PAR set up a stand on Kahramanmaraş Street to hand out leaflets. Some Trabzon residents passing by reacted to the stand, and the crowd quickly grew. Chanting "Happy is the one who says I am a Turk", they stormed the stand, tore down the party's banner and threw it on the ground."
 Turkey.529.a:0 "The Work of the Zafer Party?"
 Turkey.532.title:0 "Ali Yeşildağ's Scandalous Statements"
 Turkey.532.desc:0 "A man named Ali Yeşildağ has exposed government corruption in the style of Sedat Peker. His statements have stirred anti-AK Party sentiment among voters, which will affect the election results."
 Turkey.532.a:0 "Ouch"
 Turkey.533.title:0 "The Economist Attacks Erdogan"
 Turkey.533.desc:0 "The UK-based weekly magazine The Economist put the 14 May elections on its cover this week, calling them "the most important election of 2023".\n\n Alongside the Turkish flag, the cover featured a sticker reading "Erdogan must go", "Save democracy" and "Vote!".\n\nThe editorial said that if President Recep Tayyip Erdogan lost the election, it "will give hope to democrats all over the world and show that dictators can be removed by elections"."
 Turkey.533.a:0 "They Are Targeting Our Democracy"
 Turkey.534.title:0 "The Erzurum Attack!"
 Turkey.534.desc:0 "Ahead of the Istanbul Mayor's planned campaign rally, Erzurum's local government parked dozens of public buses in the city's main square to keep the event from going ahead as planned. The city's mayor, Mehmet Sekmen, belongs to President Recep Tayyip Erdoğan's Justice and Development Party (AKP). This first attempt to derail İmamoğlu's rally drew widespread condemnation from opposition leaders. \n\nThen, shortly after İmamoğlu began speaking, the rally area and his campaign bus were attacked by a group throwing marble stones and building materials. Several people were reported injured, including children. Interrupting his speech, İmamoğlu rebuked the local police standing by during the attack: "You policemen who are just watching: we are watching you too. To this city's local government and police department: we are watching you. A criminal complaint will be filed against you."\n\nİmamoğlu also accused the police of encouraging the violence through their inaction: "You are provoking this attack against a crowd carrying Turkish flags. All of this in the name of so-called patriotism. People holding Turkish flags are being insulted." Videos and photos posted by the Istanbul Municipality from inside the bus showed major damage to its windows, as well as Erzurum's riot police standing idly by as the group hurled pieces of marble at the Istanbul Mayor's campaign bus."
 Turkey.534.a:0 "Victimization Wins Votes"
 Turkey.535.title:0 "Ekrem Imamoğlu Faces Criminal Charges"
 Turkey.535.desc:0 "During the Istanbul elections, Ekrem Imamoglu had sharply criticized the election authorities. Now he has been sued for insulting public officials and faces a prison sentence. The case is not expected to end soon."
 Turkey.535.a:0 "It's Getting Hardcore"
 Turkey.536.title:0 "Erdogan Talks With Young People on TV"
 Turkey.536.desc:0 "President Erdogan has recently been on a downward trend in the polls. To reverse it, he took part in a program organized by his own team. Because the questions and answers were prepared in advance and the questioners were timid, the program gave Erdogan a favorable image that would help him win votes."
 Turkey.536.a:0 "Interesting"
 Turkey.537.title:0 "Trouble on the Istanbul Stock Exchange"
 Turkey.537.desc:0 "The Istanbul Stock Exchange (BIST) has been under heavy strain because of the elections. The market suffered steep losses, and Kemal Kılıçdaroğlu blamed the AK Party for its state. The economic balance has become fragile."
 Turkey.537.a:0 "What a Failure"
 Turkey.538.title:0 "The Kaz Mountains Are Destroyed"
 Turkey.538.desc:0 "Forests on the Kaz Mountains were destroyed in the search for gold. The images that emerged upset climate activists and ecologists, and the institutions responsible were strongly condemned by foundations and organizations."
 Turkey.538.a:0 "Dramatic Times"
 Turkey.539.title:0 "Muharrem Ince Quits the Race"
 Turkey.539.desc:0 "Turkish presidential candidate Muharrem İnce withdrew from the race after the release of an alleged sex tape, boosting the other candidates' chances of an outright win in a race the polls suggest will be close.\n\nİnce, a two-time presidential candidate who also lost to Recep Tayyip Erdoğan in 2018, pulled out just days before Turkey's most consequential election in a generation, saying: "I offered Turkey a third option, a third way. We could not succeed this way."\n\nThe former school principal and longtime member of the Republican People's Party (CHP) said the alleged sex tape circulating online was a deepfake made with footage taken from "an Israeli porn site"."
 Turkey.539.a:0 "That's That"
 Turkey.540.title:0 "The Restored Maiden's Tower"
 Turkey.540.desc:0 "The tower reopened after a major two-year restoration under a Ministry of Culture and Tourism project. The materials used were faithful to the tower's state during the reign of Ottoman Sultan Mahmud II (1808-1839), and later additions to the structure were removed.\n\nThe restoration was carried out in line with international restoration principles by Feridun Çılı of Istanbul Technical University, restoration scholar Zeynep Ahunbay and architect Han Tümertekin, under the supervision of a scientific committee."
 Turkey.540.a:0 "Interesting"
 Turkey.541.title:0 "Kerem Kinik Forced to Resign"
 Turkey.541.desc:0 "After the Kahramanmaraş earthquakes, when the tents needed by survivors should have been provided free of charge, Red Crescent President Kerem Kınık came under fire over reports that he had sold tents from his warehouses to the AHBAP association and the Turkish Pharmacists' Association in the first week after the disaster. He has now resigned as President of the Turkish Red Crescent."
 Turkey.541.a:0 "Good Riddance"
 Turkey.542.title:0 "The Death of Kemal Derviş"
 Turkey.542.desc:0 "Kemal Derviş, the economist who was instrumental in leading his native Turkey out of economic crisis early this century and who later became the first person from a country that had received aid from the United Nations Development Programme to lead it, died on Sunday in Bethesda, Maryland. He was 74."
 Turkey.542.a:0 "Rest In Peace"
 Turkey.543.title:0 "Nebationomics"
 Turkey.543.desc:0 "Nebati, the head of the economy of the Republic of Turkey, tries to deflect attention by joking about the rise of the dollar and the country's monetary losses. The public has reacted with anger, and it is now widely accepted that high inflation and the crushing of the Turkish economy under the dollar have put the country in an extremely bad place."
 Turkey.543.a:0 "A History of Failure"
 Turkey.544.title:0 "Umit Ozdag Shows Up With Mines"
 Turkey.544.desc:0 "Zafer Party Chairman Ümit Özdağ, who came to Hatay for a series of meetings and visits, wanted to plant a symbolic mine in a field in the Reyhanlı district. The gendarmerie did not allow the symbolic mine stunt, which Özdağ said was actually a car spare part, to go ahead."
 Turkey.544.a:0 "Very Weird"
 Turkey.545.title:0 "The Ship Controversy"
 Turkey.545.desc:0 "Answering questions on the "Election 2007" program on NTV, Erdogan said the media had made an issue of his son buying a ship. "There are ships and there are boats," Erdogan said, continuing:\n\n"There are new ones and there are old ones. If you buy a ship that is 15, 16 or 17 years old, a small one at that, on good payment terms, and it is in a position to pay for itself, why shouldn't it be bought? You can buy a ship with a down payment of 300, 400 or 500 thousand dollars, and then, if the ship can pay its installments by itself, you can do it.""
 Turkey.545.a:0 "Interesting"
 Turkey.546.title:0 "The End of the 2023 Election Campaign"
 Turkey.546.desc:0 "While Kılıçdaroğlu wrapped up his campaign with a visit to Anıtkabir, Erdoğan chose to end his at Hagia Sophia. The election is starting to look like a referendum, and the people will make their own decision."
 Turkey.546.a:0 "It's Over"
 Turkey.547.title:0 "The United States Recognizes the Armenian Genocide"
 Turkey.547.desc:0 "The United States recognizes the Armenian genocide through resolutions passed by both houses of Congress and by presidential proclamation. The House of Representatives passed a resolution with broad support on 29 October 2019, and the Senate followed by unanimous consent on 12 December 2019, making recognition of the Armenian genocide part of US policy."
 Turkey.547.a:0 "Ouch"
 Turkey.548.title:0 "HDP and TİP Form a New Alliance"
 Turkey.548.desc:0 "The Peoples' Democratic Party (HDP), the Workers' Party of Turkey (TİP), the Labor Party (EMEP), the Social Freedom Party (TÖP), the Labor Movement Party (EHP) and the Federation of Socialist Assemblies (SMF) have announced the founding of the Labor and Freedom Alliance."
 Turkey.548.a:0 "Whatever"
 Turkey.549.title:0 "Sinan Ogan Signals He Will Bargain for His Support"
 Turkey.549.desc:0 "Presidential candidate Sinan Oğan said that if the election goes to a second round, he will sit down at the bargaining table with the remaining candidates. After the opposition reacted, Oğan said: "Since you took my words out of context on the eve of the election and made unfair accusations and attacks against us, I take it you won't need our voters' support in the second round." Critics fired back: "Won't Sinan Oğan's support be very valuable in the second round? Won't you have to win over his voters?""
 Turkey.549.a:0 "Did He Just Attack His Own Voters?"
 Turkey.550.title:0 "The Great 2023 Elections"
 Turkey.550.desc:0 "The previous Turkish general election took place in 2018. It marked the country's transition from a parliamentary to a presidential system, narrowly approved by voters in the 2017 constitutional referendum. That election resulted in victory for incumbent President Recep Tayyip Erdoğan, in office since 2014. Meanwhile, the ruling Justice and Development Party (AK Party) lost its absolute majority in the Grand National Assembly for the first time since June 2015, forcing it to rely on its coalition partner, Devlet Bahçeli's Nationalist Movement Party (MHP), to pass legislation. The office of Prime Minister was abolished on 12 July 2018, and its last holder, Binali Yıldırım, became Speaker of the Grand National Assembly.\n\nAlthough there was speculation about a snap election before the regular one in 2023, Bahçeli ruled it out, stating in writing that no election would be held before 2023. He also confirmed that the AK Party-MHP alliance would remain intact and that Erdoğan would be their joint presidential nominee. Erdoğan declared his candidacy on 9 June 2022. On 22 January 2023, he announced that he would call the elections on 10 March, bringing the date forward from 18 June to 14 May. The impact of the devastating Turkey-Syria earthquake on voters' opinions is not yet known. Muharrem İnce announced his withdrawal on 11 May."
 Turkey.550.a:0 "Danger Ahead!"
 Turkey.550.b:0 "Is It Time for a Second Round?"
 Turkey.551.title:0 "Kemal Kilicdaroglu on Babala TV"
 Turkey.551.desc:0 "Yesterday, Babala TV owner Oğuzhan Uğur filmed an "Open Mic" broadcast with Nation Alliance presidential candidate Kemal Kılıçdaroğlu. People scrambled on social media to watch it, but although the filming took place yesterday, the footage was not broadcast live."
 Turkey.551.a:0 "Interesting"
 Turkey.552.title:0 "Sinan Ogan Declares Support for Erdogan"
 Turkey.552.desc:0 "In the first round of the presidential election on 14 May, ATA Alliance candidate Sinan Oğan received 5.17 percent of the vote. At a press conference in Ankara today (22 May), Oğan announced that he will support the People's Alliance candidate, AKP Chairman and President Recep Tayyip Erdogan.\n\nSaying that they had met with both the People's Alliance and the Nation Alliance, Oğan said: "In the 14 May elections, Turkish voters gave both the People's Alliance and the Nation Alliance a serious warning for failing to show due regard for the sensitivities of the Turkish nation. The voters have also given us the task of defending those sensitivities through executive power.""
 Turkey.552.a:0 "The Collapse of the ATA Alliance"
 Turkey.553.title:0 "Umit Ozdag Declares Support for Kilicdaroglu"
 Turkey.553.desc:0 "Nation Alliance presidential candidate and CHP leader Kemal Kılıçdaroğlu met Ümit Özdağ at the Zafer Party headquarters, where they announced that the party would back Kılıçdaroğlu in the second round. Özdağ called on all voters: "Dear citizens, if you want to pass on the Turkey you inherited from your parents to your children, if you don't want Turkey to become a land of migrants, if you don't want to worry when your daughter goes out, if you want to send your son safely to the corner shop at 9:30 in the evening, then support the policy that will send 13 million asylum seekers home on 28 May and vote for Kemal KILIÇDAROĞLU. This is the only way to keep Turkey from becoming a land of migrants.""
 Turkey.553.a:0 "The Rise of Factionalism"
 Turkey.554.title:0 "Muharrem Ince Declares Neutrality"
 Turkey.554.desc:0 "Three days before the second round of the presidential election on 28 May, Memleket Party Chairman Muharrem Ince, who had withdrawn his candidacy before the first round, met with his party's officials.\n\nInce, who had denied from his hospital bed the claim that he would back Nation Alliance candidate Kemal Kılıçdaroğlu on 28 May, held a meeting with his party's 22-member Central Executive Board in the afternoon.\n\nAt the meeting, where backing Kılıçdaroğlu and staying neutral were both discussed, many provincial chairs reportedly asked to support Kılıçdaroğlu. Ince had not endorsed anyone after withdrawing, and the party decided to keep that stance in the second round. No announcement of the decision will be made."
 Turkey.554.a:0 "Whatever"
 Turkey.555.title:0 "The Runoff of the Great 2023 Elections"
 Turkey.555.desc:0 "The presidential vote will decide not only who leads Turkey but also whether it returns to a more secular, democratic path, how it tackles its severe cost-of-living crisis and how it manages key relations with Russia, the Middle East and the West.\n\nKilicdaroglu, who said he would prevail in the runoff, urged his supporters to be patient and accused Erdogan's party of interfering with the counting and reporting of results."
 Turkey.555.a:0 "It's Risky!"
 Turkey.556.title:0 "The Chaotic 13th Extraordinary CHP Convention"
 Turkey.556.desc:0 "The 13th Extraordinary Convention of the Republican People's Party was held on 29 and 30 January 2005 to elect the leader of the CHP, Turkey's center-left party. Incumbent leader Deniz Baykal was challenged for the leadership by Şişli Mayor Mustafa Sarıgül. The convention was marred by violence between supporters of the two rivals, who had accused each other of corruption and elitism in their speeches."
 Turkey.556.a:0 "The CHP's Troubles"
 Turkey.557.title:0 "The Chaotic 13th Extraordinary CHP Convention"
 Turkey.557.desc:0 "The 13th Extraordinary Convention of the Republican People's Party was held on 29 and 30 January 2005 to elect the leader of the CHP, Turkey's center-left party. Incumbent leader Deniz Baykal was challenged for the leadership by Şişli Mayor Mustafa Sarıgül. The convention was marred by violence between supporters of the two rivals, who had accused each other of corruption and elitism in their speeches."
 Turkey.557.a:0 "Long Live Deniz Baykal"
 Turkey.557.b:0 "Long Live Mustafa Sarıgül"
 Turkey.558.title:0 "Erdogan's Third Term"
 Turkey.558.desc:0 "Recep Tayyip Erdogan has been sworn in as Turkey's president for an unprecedented third time. Erdogan won another five-year term after a runoff against opposition candidate Kemal Kilicdaroglu last week. Neither candidate reached the 50% threshold on 14 May, but in the second round two weeks later Erdogan secured 52.1%. The 69-year-old took the oath in parliament in Ankara on Saturday, ahead of a separate inauguration ceremony attended by foreign dignitaries. This makes him the longest-serving leader in Turkey's history, having led the country with his AK Party since 2002.\n\nHe will announce his new cabinet later this weekend."
 Turkey.558.a:0 "Bye Bye, Kemal!"
 Turkey.559.title:0 "Erdogan Returns to Orthodox Economics"
 Turkey.559.desc:0 "President Tayyip Erdogan signaled on Saturday that his newly elected government would return to more orthodox economic policies when he named Mehmet Simsek to his cabinet to tackle Turkey's cost-of-living crisis and other strains.\n\nSimsek's appointment as Treasury and Finance Minister could pave the way for interest rate hikes in the coming months, analysts said, a marked turnaround from Erdogan's longstanding policy of slashing rates despite soaring inflation."
 Turkey.559.a:0 "A U-Turn From Erdogan?"
 Turkey.560.title:0 "The MKE Explosion"
 Turkey.560.desc:0 "At least five workers were killed in a blast at an explosives factory near the Turkish capital Ankara, the defense ministry said in a statement on Saturday. The explosion occurred at the MKE Rocket and Explosives Factory, some 40 km (25 miles) outside Ankara. "According to the technical staff, there was an explosion in the factory's dynamite department as a result of a chemical experiment," Ankara Governor Vasip Şahin told reporters.\n\n"Unfortunately five workers have died; our condolences go to their families," Şahin said. The defense ministry confirmed the death toll in a separate statement. "Five other workers were under the rubble, but we managed to rescue them."\n\nInjured employees were taken to hospitals, according to state media, which said an investigation into the incident had been launched."
 Turkey.560.a:0 "It's Bad"
 Turkey.561.title:0 "The Opposition Questions Itself"
 Turkey.561.desc:0 "Under Kemal Kılıçdaroğlu's leadership, the Republican People's Party lost the presidential election. The party's vote share also slipped slightly, and it lost a significant number of MPs. After these heavy losses, the CHP has descended into chaos: party members want Kılıçdaroğlu to resign, while he is trying to hold on to the leadership through the delegates.\n\nEkrem İmamoğlu, who won the Istanbul mayoralty, Bolu Mayor Tanju Özcan and Özgür Özel have all come out against Kılıçdaroğlu's attempt to stay on. Mustafa Sarıgül, who recently made headlines as the MP for Erzincan, is also likely to challenge him.\n It is clear that the CHP's next ordinary congress will be a stormy one."
 Turkey.561.a:0 "Ah, CHP Classics!"
 Turkey.562.title:0 "The TDP Merges With the CHP"
 Turkey.562.desc:0 "TDP Chairman and CHP Erzincan MP Mustafa Sarıgül announced in a statement that his party is joining the CHP. "As the TDP, we are taking a historic decision; we will be on the right side of history. The merger process of the TDP and the CHP has begun as of today," Sarıgül said."
 Turkey.562.a:0 "Whatever"
 Turkey.563.title:0 "Ecological Troubles"
 Turkey.563.desc:0 "Turkey's recent industrialization has begun to raise the country's carbon levels, giving rise to a growing environmental movement. We need to take its concerns seriously and prevent the problems that may arise."
 Turkey.563.a:0 "As Expected"
 Turkey.564.title:0 "The Turkish Brain Drain"
 Turkey.564.desc:0 "The influx of Syrians into our country, Turkey's growing Islamization and the drift away from secularism have made the country's educated people eager to leave as soon as possible. We must stop this; if we don't, we will face a shortage of skilled labor and a loss of productivity."
 Turkey.564.a:0 "We Need to Overcome This"
 Turkey.566.title:0 "The Turkey Wealth Fund"
 Turkey.566.desc:0 "After the 2017 constitutional referendum, the office of Prime Minister was abolished. Following this change, the Turkey Wealth Fund law was amended so that the President of Turkey chairs the fund and appoints its CEO, vice chairman and board members."
 Turkey.566.a:0 "Another Good Institution"

 Turkey.567.title:0 "September 2001 Istanbul Bombing"
 Turkey.567.desc:0 "On 10 September 2001, Uğur Bülbül, a member of the Revolutionary People's Liberation Party-Front (DHKP-C), carried out a suicide attack at a police checkpoint in the Gümüşsuyu neighborhood of Beyoğlu, Istanbul. The explosion killed two police officers and a civilian passerby, along with the attacker, and injured 23 others."
 Turkey.567.a:0 "Aman Tanrım"
 Turkey.568.title:0 "January 2001 Istanbul Bombing"
 Turkey.568.desc:0 "On 3 January 2001, Gültekin Koç, a member of the Revolutionary People's Liberation Party-Front (DHKP-C), carried out a suicide attack at a police station in Şişli, Istanbul. The explosion killed one civilian along with the attacker and injured 7 others, 2 of them critically."
 Turkey.568.a:0 "Aman Tanrım"
 Turkey.569.title:0 "The 2003 Attack on the Grand Lodge of Free and Accepted Masons"
 Turkey.569.desc:0 "On 9 March 2003, two attackers entered the building of the Grand Lodge of Free and Accepted Masons in Istanbul's Kartal district, wounded a security guard and detonated explosives. The attack was found to have been carried out by Engin Vural and Nihat Doğruel, members of al-Qaeda's Turkish network. Vural survived with injuries; all of the other dead and injured were civilians. In the case heard at the Istanbul 9th High Criminal Court, 4 defendants were sentenced to life imprisonment."
 Turkey.569.a:0 "Aman Tanrım"
 Turkey.570.title:0 "The 2006 Van Bombing"
 Turkey.570.desc:0 "The 2006 Van attack was a suicide bombing carried out on 9 March 2006 in the Turkish city of Van, when Devrim Solduk, a PKK member, approached a traffic vehicle belonging to Van Municipality and detonated explosives. Besides the attacker, two people were killed and 19 were injured."
 Turkey.570.a:0 "Aman Tanrım"
 Turkey.571.title:0 "The 2007 Ankara Bombing"
 Turkey.571.desc:0 "The 2007 Ankara bombing was a suicide attack in the Turkish capital Ankara on 22 May 2007. Six people were reported killed, including one of Pakistani origin, and 121 were wounded. A seventh person died of their injuries on 7 June and another on 17 June, raising the death toll to eight; a ninth died on 4 July."
 Turkey.571.a:0 "Aman Tanrım"
 Turkey.572.title:0 "The 2011 Bingöl Bombing"
 Turkey.572.desc:0 "The 2011 Bingöl attack was a suicide bombing carried out on 29 October 2011 in the center of Bingöl province, Turkey. Four people, including the attacker, were killed and 20 were injured in the attack by PKK member Nazlı Görer."
 Turkey.572.a:0 "Aman Tanrım"
 Turkey.573.title:0 "The 2012 Kayseri Bombing"
 Turkey.573.desc:0 "The 2012 Pınarbaşı attack took place on 25 May 2012 against the Pınarbaşı police station in the Pınarbaşı district of Kayseri province, beginning as an armed assault and ending in a suicide bombing. Besides the two PKK attackers, 4 people were killed, among them a police officer and a civilian."
 Turkey.573.a:0 "Aman Tanrım"
 Turkey.574.title:0 "The 2012 Istanbul Suicide Bombing"
 Turkey.574.desc:0 "The 2012 Istanbul suicide bombing took place at a police station in the Sultangazi district of Istanbul. The bomber, İbrahim Çuhadar, was a member of the Revolutionary People's Liberation Party-Front (DHKP-C). On 11 September 2012, he tried to enter the police station and, when the police refused him entry, detonated his explosives at the entrance. The explosion killed the attacker and a police officer and injured seven others."
 Turkey.574.a:0 "Aman Tanrım"
 Turkey.575.title:0 "2015 Istanbul Suicide Bombing"
 Turkey.575.desc:0 "On 6 January 2015, Diana Ramazova from Dagestan detonated a bomb vest at a police station in Istanbul's central Sultanahmet district, near the Blue Mosque and Hagia Sophia. The attack killed Ramazova and injured two police officers, one of whom later succumbed to his wounds. Ramazova was the pregnant widow of a Norwegian-Chechen ISIS fighter in Syria who had been killed in December 2014."
 Turkey.575.a:0 "Aman Tanrım"
 Turkey.576.title:0 "The Suruç Bombing"
 Turkey.576.desc:0 "The Suruç bombing was a suicide attack by the Dokumacılar, the Turkish cell of the Islamic State, against Turkish leftists outside the Amara Culture Center in the Suruç district of Şanlıurfa Province on 20 July 2015. A total of 34 people were killed (including the perpetrator) and 104 were injured. Most of the victims were members of the youth wing of the Socialist Party of the Oppressed (ESP) and the Federation of Socialist Youth Associations (SGDF), university students holding a press conference about their planned trip to help rebuild the Syrian border town of Kobanî."
 Turkey.576.a:0 "Aman Tanrım"
 Turkey.577.title:0 "December 2016 Istanbul Bombings"
 Turkey.577.desc:0 "On the evening of 10 December 2016, a car bomb and a suicide bombing in Istanbul's Beşiktaş district killed 48 people and injured 166. Of those killed, 39 were police officers, 7 were civilians and 2 were the perpetrators. The Kurdistan Freedom Hawks (TAK) claimed responsibility, saying their members had killed more than 100 police officers."
 Turkey.577.a:0 "Aman Tanrım"
 Turkey.578.title:0 "2016 Bursa Bombing"
 Turkey.578.desc:0 "On 27 April 2016, a suicide bombing took place in the Turkish city of Bursa at 17:26 (UTC+3), near the western entrance of the Grand Mosque and a covered bazaar. Only the bomber was killed; 13 people suffered light injuries. Extensive damage to nearby shops and cafés was reported."
 Turkey.578.a:0 "Aman Tanrım"
 Turkey.579.title:0 "2016 Cizre Bombing"
 Turkey.579.desc:0 "The 2016 Cizre bombing was a suicide attack by PKK member Mustafa Aslan in Cizre, Turkey. The attacker used a car bomb against a checkpoint outside the police headquarters. Twelve police officers and Aslan were killed, and 75 police officers and three civilians were injured."
 Turkey.579.a:0 "Aman Tanrım"
 Turkey.580.title:0 "2016 Elazığ Bombing"
 Turkey.580.desc:0 "The 2016 Elazığ bombing was a car bomb attack on a police station in Elazığ, Turkey, on Thursday, 18 August 2016, carried out by the Kurdistan Workers' Party (PKK). Six people, including one perpetrator, died and 217 were injured. Two people were arrested in connection with the attack."
 Turkey.580.a:0 "Aman Tanrım"
 Turkey.581.title:0 "2016 Şemdinli Bombing"
 Turkey.581.desc:0 "The 2016 Şemdinli bombing was a car bomb attack on a Turkish military base carried out by the HPG, the PKK's armed wing, on 9 October 2016. According to the Turkish authorities, the car bomb killed at least 18 people, 10 soldiers and 8 civilians, and initial reports said another 27 were wounded. The HPG claimed the attack and said it had killed more than 32 soldiers."
 Turkey.581.a:0 "Aman Tanrım"
 Turkey.582.title:0 "August 2016 Gaziantep Bombing"
 Turkey.582.desc:0 "On 20 August 2016 at 22:50 local time, a suicide bomber targeted a wedding party in Gaziantep, Turkey, attended by more than 200 people. According to witnesses, the attack targeted a Kurdish family who had fled Siirt because of the violence between Turkey and the PKK, and took place during the traditional henna night. The groom was injured, though not critically, while the bride escaped unharmed. A witness reported that two suspicious people had approached the party and left after the attack, and the security forces are searching for them. The Peoples' Democratic Party (HDP) announced that the wedding attacked was that of its party members."
 Turkey.582.a:0 "Aman Tanrım"
 Turkey.583.title:0 "2015 Ankara Bombings"
 Turkey.583.desc:0 "On 10 October 2015 at 10:04 local time (EEST), two bombs were detonated outside Ankara Central railway station in the Turkish capital. With 109 civilians killed, the attack surpassed the 2013 Reyhanlı bombings as the deadliest terrorist attack in Turkish history; another 500 people were injured. The censorship monitoring group Turkey Blocks identified a nationwide slowdown of social media services after the blasts, which Human Rights Watch described as an "extrajudicial" measure to restrict independent coverage of the incident."
 Turkey.583.a:0 "Aman Tanrım"
 Turkey.584.title:0 "2016 Bursa Bombing"
 Turkey.584.desc:0 "On 27 April 2016, a suicide bombing took place in the Turkish city of Bursa at 17:26 (UTC+3), near the western entrance of the Grand Mosque and a covered bazaar. Only the bomber was killed; 13 people suffered light injuries. Extensive damage to nearby shops and cafés was reported."
 Turkey.584.a:0 "Aman Tanrım"
 Turkey.585.title:0 "2016 Gaziantep Bombings"
 Turkey.585.desc:0 "The October 2016 Gaziantep attacks were suicide bombings carried out on 16 October 2016, when militants of the Islamic State of Iraq and the Levant detonated explosives in two separate houses they had been using in the Şehitkamil and Şahinbey districts of Gaziantep during a raid by the security forces. Besides the attackers, 3 police officers were killed and 13 people, 4 of them Syrians, were injured."
 Turkey.585.a:0 "Aman Tanrım"
 Turkey.586.title:0 "November 2016 Diyarbakır Bombing"
 Turkey.586.desc:0 "The November 2016 Diyarbakır bombing was an explosion near a police building in the Bağlar district of Diyarbakır, Turkey, on 4 November. The bomb killed at least 11 people, including two police officers. Both the Islamic State of Iraq and the Levant and the Kurdistan Freedom Hawks claimed responsibility."
 Turkey.586.a:0 "Aman Tanrım"
 Turkey.587.title:0 "2016 Kayseri Bombing"
 Turkey.587.desc:0 "On 17 December 2016, a suspected car bomb in Kayseri, Turkey, killed 15 soldiers aboard a bus and wounded at least 55 others. According to the Daily Sabah newspaper, the soldiers, all low-ranking privates and non-commissioned officers, had been given leave from the commando headquarters in the city. The explosion came a week after 44 people were killed in a double bombing in Istanbul after a football match."
 Turkey.587.a:0 "Aman Tanrım"
 Turkey.588.title:0 "March 2016 Ankara Bombing"
 Turkey.588.desc:0 "The March 2016 Ankara bombing killed at least 37 people and injured 125, 19 of them seriously. Several buildings were damaged, and a bus and many cars were reportedly destroyed."
 Turkey.588.a:0 "Aman Tanrım"
 Turkey.589.title:0 "March 2016 Istanbul Bombing"
 Turkey.589.desc:0 "On 19 March 2016, a suicide bombing took place in front of the district governor's office in Istanbul's Beyoğlu district, at 10:55 (EET) at the junction of Balo Street and İstiklal Avenue, a central shopping street. At least five people were killed, including the bomber, and thirty-six were injured, seven of them seriously; twelve of the injured were foreign tourists. Two of those killed held dual Israeli-US citizenship. On 22 March, the Turkish interior minister said the bomber had links to ISIL."
 Turkey.589.a:0 "Aman Tanrım"
 Turkey.590.title:0 "January 2016 Istanbul Bombing"
 Turkey.590.desc:0 "On 12 January 2016, a suicide attack in Istanbul's historic Sultanahmet district killed 13 people, all of them foreigners, and injured 14. The attack occurred at 10:20 local time near the Blue Mosque and Hagia Sophia, an area popular with tourists."
 Turkey.590.a:0 "Aman Tanrım"
 Turkey.591.title:0 "June 2016 Istanbul Bombing"
 Turkey.591.desc:0 "On 7 June 2016, at around 08:40 (UTC+3), a bombing in central Istanbul killed 12 people and injured 51, three of them seriously. The attack targeted a bus carrying police officers as it passed through Vezneciler, near the Şehzade Mosque and the Vezneciler metro station."
 Turkey.591.a:0 "Aman Tanrım"
 Turkey.592.title:0 "Rocket Attacks on Iğdır"
 Turkey.592.desc:0 "In the morning, PKK members opened fire with long-barreled weapons on the Martyr Bülent Aydın Police Station in the Aralık district of Iğdır, on the Iranian border. One soldier was martyred and two were wounded in the attack."
 Turkey.592.a:0 "Aman Tanrım"
 Turkey.593.title:0 "May 2016 Dürümlü Bombing"
 Turkey.593.desc:0 "The May 2016 Dürümlü bombing (also known in Turkey as the Dürümlü massacre) was a truck bombing in the hamlet of Dürümlü in Diyarbakır's Sur district on 12 May 2016 at around 22:30 local time. Sixteen villagers were killed and 23 were wounded."
 Turkey.593.a:0 "Aman Tanrım"
 Turkey.594.title:0 "August 2016 Gaziantep Bombing"
 Turkey.594.desc:0 "On 20 August 2016, a suicide bomber targeted a Kurdish wedding in Gaziantep, Turkey. 57 people were killed and 66 injured in the attack, 14 critically."
 Turkey.594.a:0 "Aman Tanrım"
 Turkey.595.title:0 "The Midyat Bombing in Mardin"
 Turkey.595.desc:0 "Five years on, the pain of the PKK's car bomb attack on the Midyat Police Department, which martyred 3 police officers, one of them pregnant, killed 3 other people and injured 50, has not faded."
 Turkey.595.a:0 "Aman Tanrım"
 Turkey.596.title:0 "2013 Reyhanlı Car Bombings"
 Turkey.596.desc:0 "The 2013 Reyhanlı car bombings took place on 11 May 2013, when two car bombs exploded in the Turkish town of Reyhanlı, a town of 64,000 people, 5 km from the Syrian border and the busiest land border post with Syria, in Hatay Province, Turkey. At least 52 people were killed and 140 injured in the attack."
 Turkey.596.a:0 "Aman Tanrım"

 Turkey.597.title:0 "The Kürecik Radar Base?"
 Turkey.597.desc:0 "The United States Senate has issued a surprising statement questioning investment in the Kürecik Radar Base in Turkey. Delivered by a senior official, the statement raised concerns about the base's long-term viability and strategic importance in light of shifting geopolitics and advancing technology."
 Turkey.597.a:0 "Push Ahead With the Investment"
 Turkey.597.b:0 "We Can't Afford It"
 Turkey.598.title:0 "The United States Launches the Kürecik Radar Base"
 Turkey.598.desc:0 "In an unexpected turn of events, the United States and Turkey jointly announced the official opening of the "Kürecik Global Aerospace Research Center" in Turkey's Kürecik region. The center marks a major milestone in the two nations' cooperation on space exploration and advanced radar technology."
 Turkey.598.a:0 "Thank You Sir!"
 Turkey.599.title:0 "The United States Launches the Kürecik Radar Base"
 Turkey.599.desc:0 "The United States has announced a military investment in Kürecik, near our border. This has pushed our patience to the limit; we see it as standing guard for Israel. We have to get out of this situation."
 Turkey.599.a:0 "The Turks Are Working With Israel!"
 Turkey.600.title:0 "The Zarrab Affair"
 Turkey.600.desc:0 "Zarrab is alleged to have carried out financial transactions worth millions of dollars, together with two Iranian citizens, on behalf of the Iranian state and certain companies in order to illegally evade US sanctions."
 Turkey.600.a:0 "Agh!"
 Turkey.601.title:0 "?Zınısım Adnıkraf Ninekilhet"
 Turkey.601.desc:0 "The Cumhuriyet newspaper has added a new installment to its "?Zınısım Adnıkraf Ninekilhet" campaign ("Are you aware of the danger?" written backwards), launched months ago. Hinting that the candidate to emerge in Çankaya would be from the AKP, the paper asked: "On 16 May, the clocks will be turned back 100 years. Do you realize the danger?" What is your view? Is the Republic really in danger? Would an AKP member in Çankaya take Turkey backward? Is it normal for a newspaper to take sides in the debate over Çankaya? Even if Cumhuriyet is right, is its method correct?"
 Turkey.601.a:0 "?Zınısım Adnıkraf Ninekilhet"
 Turkey.602.title:0 "Demirtas Arrested"
 Turkey.602.a:0 "Good For The Government"
 Turkey.602.desc:0 "At the 2013 Newroz celebration, during the peace process between the PKK and Turkey, Selahattin Demirtaş and HDP MP Sırrı Süreyya Önder both gave speeches. Demirtaş was absent from the hearing in April 2018, while Önder argued in his defense that the police had mistranslated his speech. In September 2018, Demirtaş was sentenced to 4 years and 8 months for praising Abdullah Öcalan, the imprisoned leader of the PKK, while Önder received 3 years and 6 months in the same trial."
 Turkey.603.title:0 "Demirtas Attacks Erdogan"
 Turkey.603.desc:0 "Co-Chair Selahattin Demirtaş held the shortest group meeting in history. He began by greeting the people in the hall and noted that the flowers sent from all over Turkey had made the meeting all the more meaningful. Saying that they would meet the Black Sea branches at the HDP headquarters, Demirtaş declared: "I have taken the podium today to say a single sentence. I have come to repeat our promise to our peoples that we will never give up the struggle for democracy, peace and freedom. We are not a movement that bargains. There has never been, and there will never be, any dirty cooperation or deal between us and the AKP."\n\nNoting that there were many topics they would discuss at future group meetings, Demirtaş continued: "But let me say the one sentence that is my reason for taking the stand. Dear Recep Tayyip Erdogan, as long as the HDP exists, as long as the HDP's people breathe in this land, you will not become President. Dear Recep Tayyip Erdogan, we will not make you President, we will not make you President, we will not make you President.""
 Turkey.603.a:0 "How Dare They!"
 Turkey.604.title:0 "Iran-Turkey Natural Gas Arbitration"
 Turkey.604.desc:0 "Turkey is reported to have won the arbitration case it opened in 2012 over the price of natural gas bought from Iran. Officials of the Ministry of Energy and Natural Resources said: "The court has ruled in Turkey's favor; the arbitration board will determine the rate." Azerbaijan's Trend News Agency reported that Iranian Deputy Oil Minister Hamid Reza Araghi had confirmed Turkey won the case it brought over Iranian gas prices, with the International Court of Arbitration finding in favor of the plaintiff, Turkey. A discount of 10-15 percent is now expected on the price of the gas Turkey bought from Iran in 2011-2015."
 Turkey.604.a:0 "How Dare They!"
 Turkey.605.title:0 "The 10th International Turkish Olympiad"
 Turkey.605.desc:0 "The 10th International Turkish Olympiad was held in Turkey from 30 May to 14 June 2012. Organized by the International Turkish Language Association (TÜRKÇEDER), it brought together a total of 1,500 competitors from 135 countries in 20 competitions across 3 categories."
 Turkey.605.a:0 "A Fine Ceremony"
 Turkey.606.title:0 "The March for Change and Justice"
 Turkey.606.desc:0 "Özcan and his supporters set off from Anıtpark in Bolu on 3 July 2023. He said he had started the march because he wanted to bring his party back to Atatürk's line. On the first day, Özcan walked 24 kilometers, joined by his wife, his cousin and his supporters, and spent the night in a caravan in the Tekkeköy area.\n\nOn the second day he reached the Yeniçağa district, spent the night in his caravan there and set off again at 8 o'clock on the third day. Passing the Gerede district, he finished the third day in the village of Süller, having walked a total of 68 kilometers. On the fourth day he reached the Ankara provincial border.\n\nOn the fifth day, Özcan lashed out at Kemal Kılıçdaroğlu: "They won't let us into the headquarters on 12 July. Who are you to keep us out, and in whose place are you sitting as chairman? I am not coming to your house; if I came to your house, you might not let me in. I am going to Atatürk's house, to our house. Is it your father's farm?""
 Turkey.606.a:0 "The CHP's Troubles"
 Turkey.607.title:0 "The Assassination of Andrei Karlov"
 Turkey.607.desc:0 "Andrei Karlov, the Russian Ambassador to Turkey, was assassinated by Mevlüt Mert Altıntaş, an off-duty Turkish police officer, at an art exhibition in Ankara on the evening of 19 December 2016. The assassination followed several days of protests in Turkey over Russia's involvement in the Syrian Civil War and the battle for Aleppo."
 Turkey.607.a:0 "Such Tension With Russia"
 Turkey.608.title:0 "Tensions in the US"
 Turkey.608.desc:0 "A group protesting President Recep Tayyip Erdogan in front of the Turkish Ambassador's residence in Washington got into a fight with Erdogan's bodyguards, and American police struggled to break it up. The trouble began before the President arrived and flared up when he did. A group gathered on the sidewalk opposite the residence, carrying a "Freedom for Demirtaş" banner and shouting slogans against Erdogan. A shouting match broke out between them and a group holding Turkish flags in front of the residence, and after a while it turned into a brawl, which members of Erdogan's protection detail joined."
 Turkey.608.a:0 "A Very Unexpected Situation"
 Turkey.609.title:0 "Policeman Martyred in Izmir Attack Hailed as a Hero"
 Turkey.609.desc:0 "The terrorist attack in Izmir took place just outside the city's main courthouse, when 43-year-old police officer Fethi Sekin stopped a suspicious vehicle that turned out to be carrying explosives. Realizing at once who they were, Sekin opened fire on the terrorists and prevented civilian casualties by stopping the vehicle from going any further. In the ensuing clash with the security forces and the car bomb attack, Sekin and a court employee were martyred and five others were injured, while a bigger blast involving another vehicle was thwarted."
 Turkey.609.a:0 "This Country Owes You"
 Turkey.612.title:0 "The 2009 Turkish Local Elections"
 Turkey.612.desc:0 "Local elections were held in Turkey on 29 March 2009. The overall winner was the ruling Justice and Development Party, although its vote fell compared with the 2007 general election. The main opposition party, the social democratic and Kemalist CHP, increased its share, as did several smaller parties, including the SP, the DTP and the BBP, whose leader Muhsin Yazıcıoğlu had died in a helicopter crash four days before the election. The third-largest party, the Turkish nationalist MHP, saw a more modest rise. Cem Uzan's GP did not contest the election."
 Turkey.612.a:0 "The people have spoken"
 Turkey.613.title:0 "The 2014 Turkish Local Elections"
 Turkey.613.desc:0 "Local elections were held in Turkey on 30 March 2014, with some repeated on 1 June 2014. Metropolitan and district mayors and municipal council members were elected in the cities, along with muhtars and councils of elders in rural areas (and in urban neighborhoods). Given the controversy surrounding them, the elections were seen as a referendum on the government."
 Turkey.613.a:0 "The people have spoken"
 Turkey.614.title:0 "The 2019 Turkish Local Elections"
 Turkey.614.desc:0 "The 2019 Turkish local elections were held on Sunday, 31 March 2019, across all 81 provinces of Turkey. A total of 30 metropolitan and 1,351 district mayors, along with 1,251 provincial and 20,500 municipal councilors, were elected, as well as numerous non-partisan local posts such as neighborhood heads (muhtars) and councils of elders."
 Turkey.614.a:0 "The people have spoken"
 Turkey.651.title:0 "The 2024 Turkish Local Elections"
 Turkey.651.desc:0 "The 2024 Turkish local elections will be held on 31 March 2024 to determine Turkey's local governments. In 1,393 municipalities, voters will elect mayors, metropolitan mayors, municipal council members, provincial council members, muhtars and councils of elders."
 Turkey.651.a:0 "The people have spoken"
 Turkey.615.title:0 "İmamoğlu's Secret Plans"
 Turkey.615.desc:0 "Things are getting more complicated by the day in the CHP, still reeling from its historic election defeat. A Zoom meeting of party members seeking change was held under the leadership of Istanbul Metropolitan Mayor Ekrem İmamoğlu, and its purpose was believed to be "toppling Kılıçdaroğlu". When the secret meeting leaked to the media, betrayal became the party's main topic. CHP Chairman Kemal Kılıçdaroğlu addressed it on a live broadcast yesterday, saying such meetings can happen but that he found it "ethically disturbing"."
 Turkey.615.a:0 "Strange Things Are Happening"
 Turkey.616.title:0 "Tanju Ozcan Expelled From the CHP"
 Turkey.616.desc:0 "The Republican People's Party has decided to expel Bolu Mayor Tanju Özcan.\n\nThe CHP High Disciplinary Board said in a statement: "At the High Disciplinary Board meeting of 26.07.2023, Tanju Özcan was given the penalty of permanent expulsion under Article 68, paragraphs 1-a and 1-b, of the CHP Bylaws." After the decision, Özcan criticized CHP leader Kemal Kılıçdaroğlu in a statement on his social media account."
 Turkey.616.a:0 "Interesting"
 Turkey.617.title:0 "Attacks on HÜDA PAR"
 Turkey.617.desc:0 "A senior member of a Kurdish conservative party was killed and a colleague injured in a knife attack in the Turkish city of Adana on Saturday. Salih Demir, provincial head of the Free Cause Party (HÜDA PAR), and Sacit Pisgin, the party's provincial secretary, were stabbed in the prayer room of the party's Adana office. Demir was seriously injured and Pisgin was killed."
 Turkey.617.a:0 "Ah!"
 Turkey.618.title:0 "Emine Ulker Tarhan Leaves the CHP"
 Turkey.618.desc:0 "Emine Ülker Tarhan, one of the MPs who had called on CHP Chairman Kemal Kılıçdaroğlu to step down after the presidential election, has resigned from her party.\n\nIn a written statement today, CHP Ankara MP Emine Ülker Tarhan said her call to learn from the election defeats and mistakes had been ignored. Her statement reads: \n\n"Our country faces grave conditions, including the danger of war, ahead of the 2015 general elections, which have taken on extraordinary importance for our children's future. My call for democracy to function within the party, for lessons to be learned from the election defeats, especially the mistakes that handed the presidency to the government in the first round, and for a serious road map to be drawn up, has been ignored, and the congress has been turned into a scramble for seats. The party has quietly watched as the state its founder built with great sacrifice is torn down, the trees he planted are uprooted, and an authoritarian state embodied in a monstrous palace called 'ak' is built in its place, turning the republican mansion into a dynastic palace. At this critical time, when Turkey faces internal and external threats and is shaken by political and terrorist murders, the CHP leadership insists on irresponsible calls, inconsistent rhetoric on war mandates, vague policies and a style of opposition cut off from the sensibilities of our people. As I understand that I cannot change these grave choices, I am resigning from the CHP, which I joined with high hopes, so as not to be part of wrong and weak policies that have neither the hope nor the goal of coming to power.""
 Turkey.618.a:0 "Bad for the CHP"
 Turkey.619.title:0 "Emine Ulker Tarhan Leaves the CHP"
 Turkey.619.desc:0 "Emine Ülker Tarhan, one of the MPs who had called on CHP Chairman Kemal Kılıçdaroğlu to step down after the presidential election, has resigned from her party.\n\nIn a written statement today, CHP Ankara MP Emine Ülker Tarhan said her call to learn from the election defeats and mistakes had been ignored. Her statement reads: \n\n"Our country faces grave conditions, including the danger of war, ahead of the 2015 general elections, which have taken on extraordinary importance for our children's future. My call for democracy to function within the party, for lessons to be learned from the election defeats, especially the mistakes that handed the presidency to the government in the first round, and for a serious road map to be drawn up, has been ignored, and the congress has been turned into a scramble for seats. The party has quietly watched as the state its founder built with great sacrifice is torn down, the trees he planted are uprooted, and an authoritarian state embodied in a monstrous palace called 'ak' is built in its place, turning the republican mansion into a dynastic palace. At this critical time, when Turkey faces internal and external threats and is shaken by political and terrorist murders, the CHP leadership insists on irresponsible calls, inconsistent rhetoric on war mandates, vague policies and a style of opposition cut off from the sensibilities of our people. As I understand that I cannot change these grave choices, I am resigning from the CHP, which I joined with high hopes, so as not to be part of wrong and weak policies that have neither the hope nor the goal of coming to power.""
 Turkey.619.a:0 "We Need a Change!"
 Turkey.619.b:0 "Bad for the CHP"
 Turkey.620.title:0 "Erdogan Gives His "Destiny" Speech"
 Turkey.620.desc:0 "Don't call it fate! There is a fate above fate. Whatever they do is in vain; the decree comes from Heaven..."
 Turkey.620.a:0 "He Is His Excellency"
 Turkey.620.b:0 "He Is His Excellency §Y(With No Speech)§!"
 Turkey.621.title:0 "The White Energy Operation"
 Turkey.621.desc:0 "In their statements to the gendarmerie, Deputy Undersecretary Mendilcioğlu and former TEAŞ General Manager Selvi, defendants in the White Energy Operation, said that Minister Ersümer had interfered in tenders. "There is a culture of kickbacks in the ministries, and it was the same under Mr. Cumhur," they claimed."
 Turkey.621.a:0 "This Is Unacceptable"
 Turkey.622.title:0 "The Bank Operations"
 Turkey.622.desc:0 "In the 2000s, Turkey was rocked by a major banking scandal that shook the country's financial sector. It exposed corruption and financial misconduct at certain banks, causing a loss of public trust and severe consequences for the institutions involved."
 Turkey.622.a:0 "This Is Unacceptable"
 Turkey.623.title:0 "Explosion at the TMO Silo in Kocaeli"
 Turkey.623.desc:0 "An explosion occurred at the Turkish Grain Board (TMO) silo at Derince Port in Kocaeli. The blast was felt across the city, and many emergency teams were sent to the scene. Kocaeli Metropolitan Mayor Tahir Büyükakın announced that 12 people had been injured, 3 of whom were intubated. Justice Minister Yılmaz Tunç announced that a judicial investigation had been opened. The TMO said in a statement: "It is believed that the explosion may have been caused by dust compression; the cause will become clear after a detailed technical examination." Footage of the moment of the explosion has also emerged."
 Turkey.623.a:0 "Aman Tanrım"
 Turkey.625.title:0 "The AKP's Pro-Palestinian Rally"
 Turkey.625.desc:0 "Hundreds of thousands of people gathered at a pro-Palestinian rally organized by the Istanbul branch of the ruling Justice and Development Party (AKP) on 28 October. At the event, held at Istanbul's Atatürk Airport, President Recep Tayyip Erdogan gave a long speech condemning both Israel and Western nations over the recent events in Gaza. "It is the West that bears the greatest responsibility for the massacre in Gaza," he said, and he unequivocally declared Israel a "war criminal".\n\nHis words resonated with the crowd, many of whom waved Palestinian and Turkish flags. It was the largest pro-Palestinian demonstration in Türkiye since the 7 October Hamas attacks and Israel's subsequent airstrikes on Gaza. Attendees, who began arriving in droves from noon, chanted slogans such as "Murderer Israel".\n\nNotably, Devlet Bahçeli, leader of the AKP's alliance partner, the Nationalist Movement Party (MHP), also attended the rally."
 Turkey.625.a:0 "Hurrah!"
 Turkey.626.title:0 "Protests at the US Base at İncirlik"
 Turkey.626.desc:0 "Tensions erupted during a protest against Israel's attacks on Palestine in front of İncirlik Air Base in Adana. Six police officers were injured as they intervened against some of the activists with water cannon and pepper spray."
 Turkey.626.a:0 "How Dare They?"
 Turkey.627.title:0 "The Court of Cassation Defies the Constitutional Court"
 Turkey.627.desc:0 "The Court of Cassation refused to accept the Constitutional Court's ruling and did not release the TİP's imprisoned MP. In response, the Istanbul Bar Association began a march and CHP MPs protested in the Grand National Assembly. Tensions in the country have escalated and distrust in the justice system has grown."
 Turkey.627.a:0 "Law and Order?"
 Turkey.628.title:0 "Ali Yerlikaya Orders Drug Operations!"
 Turkey.628.desc:0 "Interior Minister Ali Yerlikaya reported that 210 suspects had been detained in the "Narkogüç" operations against drug trafficking.\n\nIn a statement on social media, Yerlikaya said the Ankara Police Narcotics Crimes Branch had carried out simultaneous "Narkogüç" operations against a criminal organization based in Ankara and operating in 32 provinces, which left drugs at drop points shared by location, sold drugs through payments into bank accounts and laundered the proceeds of crime. Yerlikaya explained that the organization's foreign ringleader, Jamukhan Ulus, had also been caught, that 210 suspects had been detained and that the organization's leadership network had been dismantled."
 Turkey.628.a:0 "Good!"
 Turkey.629.title:0 "The CHP's 38th Ordinary Congress"
 Turkey.629.desc:0 "Turkey's main opposition Republican People's Party (CHP) on Sunday elected Özgür Özel as its new leader, ending Kemal Kılıçdaroğlu's 13-year tenure as the country gears up for local elections next March. Özel, 49, has served as the CHP's deputy parliamentary group chairman since 2015 and has been an MP since 2011. He announced his candidacy in September, after Kılıçdaroğlu and the CHP's painful defeat to President Tayyip Erdogan and his ruling alliance in the May presidential and parliamentary elections.\n\nÖzel, a pharmacist by profession, won 812 of 1,366 possible votes at a tense, hours-long party congress in Ankara that went to two rounds. "This is the greatest honor of my life," Özel said after the results were announced, thanking Kılıçdaroğlu for his work for the party. "We are setting out on the road to victory in the local elections," he added.\n\n"We have believed in turning hopelessness into hope; we are hopeful," Özel said, surrounded by applauding party members and standing alongside Istanbul Mayor Ekrem İmamoğlu."
 Turkey.629.a:0 "After 13 Years, a New Leader Takes Charge"
 Turkey.632.title:0 "An Elevator Carrying 16 Students Falls"
 Turkey.632.desc:0 "An elevator "accident" occurred at the Güzelhisar Girls' Dormitory in the Efeler district of Aydın, run by the Credit and Dormitories Agency (KYK). The elevator, carrying 16 people, reportedly fell from the upper floors. According to DHA, the student who was caught while trying to get out of the elevator and lost her life was Zeren Ertaş, a fourth-year student at Adnan Menderes University's Faculty of Economics and Administrative Sciences. Her family has been informed.\n\nAfter news of Zeren Ertaş's death, students staying in the dormitory protested with the slogan "Murderer KYK"."
 Turkey.632.a:0 "That Sounds Terrible"
 Turkey.633.title:0 "Police Arrest Televangelist Adnan Oktar"
 Turkey.633.desc:0 "Istanbul police arrested a controversial televangelist early on Wednesday and are seeking the arrest of 235 people suspected of links to his "gang".\n\nAdnan Oktar, also known as Harun Yahya, was on the most-wanted list of the police Financial Crimes Division, said security sources, who asked not to be named because of restrictions on speaking to the media. Police said Oktar was caught while preparing to flee.\n\nOktar's gang has been accused of crimes including founding a criminal organization, child sexual abuse, sexual intercourse with a minor, kidnapping, tax violations and violating the anti-terrorism law.\n\nPolice are searching for suspects across five provinces, with 166 detained so far. The Istanbul Criminal Court of Peace also ordered the seizure of the 235 suspects' assets and appointed trustees to their companies, organizations and associations."
 Turkey.633.a:0 "Good To Hear"

 Turkey.634.title:0 "Tensions After the March"
 Turkey.634.desc:0 "İsmail Aydemir, who took part in the "Mercy for the martyrs, support for Palestine, curses on Israel" march held in Fatih yesterday morning, was walking with the Kalima Tawhid flag in his hand after the march when university student Ege Akersoy punched him on the Galata Bridge. Aydemir was left with a bloodied face, and Akersoy was detained by police. After police procedures, Akersoy was referred to the Istanbul Chief Public Prosecutor's Office."
 Turkey.634.a:0 "Damn"
 Turkey.635.title:0 "Turkish Parliament Ratifies Sweden's NATO Bid"
 Turkey.635.desc:0 "Turkish MPs have ratified Sweden's bid to join NATO in a long-delayed vote that marks a big step forward on the Nordic nation's path to membership.\n\nSweden applied to join in 2022 after Russia's full-scale invasion of Ukraine, but Turkey withheld approval amid a row over what it called Sweden's support for Kurdish separatists.\n\nPresident Erdogan is expected to sign the legislation within days, leaving Hungary as the only NATO member yet to ratify Sweden's accession. Swedish Prime Minister Ulf Kristersson posted on social media: "Today we are one step closer to becoming a full member of NATO." NATO Secretary General Jens Stoltenberg welcomed Turkey's vote, saying he was counting on Hungary to "complete its national ratification as soon as possible"."
 Turkey.636.a:0 "We Have Made Our Decision. Accept It!"
 Turkey.637.title:0 "Demirtaş Nominated for the Nobel Prize"
 Turkey.637.desc:0 "Former HDP Co-Chair Selahattin Demirtaş has reportedly been nominated for the Nobel Peace Prize. According to Emir Ali Türkmen, publisher of Demirtaş's book "Seher", Swedish Social Democratic MP Thomas Hammarberg has put Demirtaş forward as a candidate."
 Turkey.637.a:0 "Sweden Repays Our Ratification"
 Turkey.638.title:0 "Turkey's First Astronaut"
 Turkey.638.desc:0 "Alper Gezeravcı has made history for Turkey. The dream of space travel came true as the first Turkish astronaut set off for the International Space Station aboard the rocket carrying the Axiom Mission 3 (Ax-3) crew. Turkey's historic mission made headlines in the world press, with international agencies reporting on the first Turkish astronaut's journey into space."
 Turkey.638.a:0 "Very Good News!"
 Turkey.639.title:0 "MP Can Atalay Stripped of His Seat"
 Turkey.639.desc:0 "The Court of Cassation's decision stripping Workers' Party of Turkey (TİP) Hatay MP Can Atalay of his seat was read out today in the General Assembly of the Grand National Assembly of Turkey. With the reading, Atalay officially lost his parliamentary status, and the TİP's number of MPs fell to 3.\n\n TİP, DEM Party and CHP MPs occupied the Speaker's podium with banners, and a copy of the Constitution was thrown at Bozdağ. Deputy Speaker Bekir Bozdağ, who was chairing the session, adjourned it on the grounds that work could not continue amid the protests."
 Turkey.639.a:0 "The Constitutional Court Has Been Overruled"
 Turkey.640.title:0 "ISIS Attack on a Church"
 Turkey.640.desc:0 "The Islamic State has claimed responsibility for Sunday's attack on a Roman Catholic church in Istanbul that left one person dead. Experts see the hand of the extremist group's Khorasan branch. During Sunday mass, two attackers wearing ski masks stormed the Santa Maria Catholic Church in Istanbul's Sarıyer district, opened fire at random and killed 52-year-old Tuncer Cihan before fleeing. According to local news sources, Cihan, who was buried with a Muslim ceremony, occasionally visited the church."
 Turkey.640.a:0 "This Is Really Bad"
 Turkey.641.title:0 "Terrorist Attack in Northern Iraq"
 Turkey.641.desc:0 "The PKK terrorist organization tried to infiltrate a base area in Northern Iraq. Nine Turkish Armed Forces personnel were martyred and four were injured in the clashes that followed. The Ministry of National Defense announced that the number of terrorists neutralized after the attack had risen to 23. Operations in the region continue with commando teams, and F-16s are striking terrorist hideouts. It was also reported that 29 targets were destroyed in air operations in northern Iraq and Syria."
 Turkey.641.a:0 "We Need to Clear the Region"
 Turkey.642.title:0 "Armed Raid on the P&G Factory"
 Turkey.642.desc:0 "P&G's factory in Gebze was raided by two armed men. Initial reports say the attackers took seven employees hostage. The hostage-takers are said to be employees, and the rest of the factory has been evacuated. A photo of one suspect showed that he was wearing a "bomb device"."
 Turkey.642.a:0 "Arrest Him Right Now!"
 Turkey.646.title:0 "The Anagold Disaster"
 Turkey.646.desc:0 "A landslide on the mountain of cyanide waste at the Anagold Madencilik mine in the İliç district of Erzincan, where gold has been produced since December 2010, has buried many workers. This is not the first danger in the region, where toxic waste is feared to threaten the surrounding provinces: in June 2022, a pipe carrying cyanide burst at the gold mine and toxic waste seeped into the İliç Dam on the Euphrates."
 Turkey.646.a:0 "A Catastrophe"
 Turkey.647.title:0 "The Council of State Decision"
 Turkey.647.desc:0 "The Council of State responded to the Sabah newspaper's claim that 4,500 judges and prosecutors had been reinstated, stating that only the dismissals of 450 people had been overturned. Those dismissed had been accused of links to FETÖ."
 Turkey.647.a:0 "Whatever"
 Turkey.648.title:0 "The New Army Flag"
 Turkey.648.desc:0 "The flag of the Land Forces Command has been changed. In a written statement, the Ministry of National Defense said: "Out of the need for a new flag design, a new flag reflecting the ancient heritage of the Land Forces Command, whose history is full of glory and honor, has been designed, approved and put into use. There is no change to the badge and emblem of the Land Forces Command.""
 Turkey.648.a:0 "Good News"
 Turkey.650.title:0 "Health Scandal at Karabük University"
 Turkey.650.desc:0 "Claims by some students that they had sexual relations with foreign students became a hot topic on Karabük University's Instagram "confessions page". Some students said they had gone to hospital with HPV, and others with suspected HIV. The Karabük Provincial Health Directorate denied the claims."
 Turkey.650.a:0 "Ugh!"
 Turkey.652.title:0 "PKK Supporters Provoke Clashes in Belgium"
 Turkey.652.desc:0 "Belgian police used water cannon to break up a clash started by PKK sympathizers who shouted provocative slogans and attacked Turkish-origin residents while passing through their neighborhood in Heusden-Zolder, in Limburg province near Brussels. The group of PKK sympathizers was driving back from Newroz celebrations on Sunday morning, carrying flags of the PKK terrorist organization, and shouted provocative slogans as they passed through a street largely inhabited by Turkish-origin residents. The Turks responded, and a clash broke out."
 Turkey.652.a:0 "Protest Against Them!"
 Turkey.653.title:0 "Deadly Cable Car Accident in Antalya"
 Turkey.653.desc:0 "During the busy Ramadan holiday, a pole collapsed at 17:28 on Friday and struck a cabin, killing one person and injuring seven, including two children. 184 people were left stranded in 24 cabins in mid-air.\n\nRescue operations continued through the night with helicopters equipped with night vision. After 22.5 hours of concerted effort by seven helicopters, 87 vehicles and around 500 personnel, everyone trapped in the cabins was rescued."
 Turkey.653.a:0 "Aman Tanrım"
 Turkey.654.title:0 "The Turkish Government Temporarily Blocks Instagram"
 Turkey.654.desc:0 "The Information and Communication Technologies Authority (BTK) blocked access to Instagram on 2 August without giving a specific reason. Government officials later said the ban was imposed because the platform had failed to comply with Turkish law."
 Turkey.654.a:0 "We Must Maintain Order on Social Media"
 Turkey.655.title:0 "The Turkish Government Blocks Discord"
 Turkey.655.desc:0 "Justice Minister Yılmaz Tunç said an Ankara court had blocked access to Discord in Turkey because there was sufficient suspicion that some users had committed the crimes of "child sexual abuse and obscenity" on the platform. The block follows public outrage over the murder of two women by a 19-year-old man in Istanbul this month, after which Discord users were seen praising the killings."
 Turkey.655.a:0 "We Must Maintain Order on Social Media"
 Turkey.656.title:0 "The Arrest of Ahmet Özer"
 Turkey.656.desc:0 "Özer, a distinguished Kurdish academic and member of the main opposition Republican People's Party (CHP), was detained in a raid on his home on 31 October and subsequently remanded in custody on "terrorism" charges."
 Turkey.656.a:0 "The CHP Is Under Pressure"
 Turkey.658.title:0 "Turkish Government Ousts the Mayor of Van"
 Turkey.658.desc:0 "The Turkish Interior Ministry has removed Van Co-Mayor Abdullah Zeydan of the pro-Kurdish DEM Party after he was convicted of "aiding and spreading propaganda for a terrorist group". The ministry appointed the Governor of Van as trustee mayor, and thousands of Van residents, along with the DEM Party, protested the move. Police detained 127 people during the protests."
 Turkey.658.a:0 "Widespread Clashes"
 Turkey.659.title:0 "A Turk Wins the Nobel Prize"
 Turkey.659.desc:0 "MIT economists Daron Acemoğlu and Simon Johnson, whose work has illuminated the relationship between political systems and economic growth, have been named winners of the 2024 Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel. Political scientist James Robinson of the University of Chicago, their close collaborator, also shares the award."
 Turkey.659.a:0 "Some Good News"
 Turkey.660.title:0 "The Common Turkic Alphabet"
 Turkey.660.desc:0 "The common alphabet, under consideration by the Turkic Academy and the Turkish Language Association since 1991, has been created from the Latin-based Turkish alphabet. The new 34-letter alphabet has been adopted as the common Turkic alphabet by the Organization of Turkic States, with the signatures of all member countries."
 Turkey.660.a:0 "Some Good News"
 Turkey.661.title:0 "Bahçeli Meets the İmralı Delegation"
 Turkey.661.desc:0 "After its meeting with PKK leader Abdullah Öcalan on 28 December, the İmralı delegation of the Peoples' Equality and Democracy Party (DEM Party), which is pursuing a new round of political talks, met with Devlet Bahçeli, Chairman of the Nationalist Movement Party (MHP).\n\nAccording to the Mezopotamya Agency, Bahçeli greeted the DEM Party delegation at the door. The closed-door meeting in the MHP leader's office in Parliament lasted about 40 minutes. Its content has not yet been made public."
 Turkey.661.a:0 "Whatever"
 Turkey.662.title:0 "The New Path"
 Turkey.662.desc:0 "The Saadet Party, the Gelecek Party and the DEVA Party have completed their efforts to form a joint parliamentary group under the name "New Path". Former Constitutional Court member and DEVA Party Vice Chairman Celal Mümtaz Akıncı was elected group chairman."
 Turkey.662.a:0 "Whatever"
 Turkey.663.title:0 "The Arrest of Ümit Özdağ"
 Turkey.663.desc:0 "A court in Istanbul has ordered the arrest of Ümit Özdağ, chairman of the anti-migrant, far-right Zafer Party, for "publicly inciting hatred and hostility".\n\nThe prosecutor's office pointed to Özdağ's alleged influence on the anti-migrant unrest in Kayseri province in 2024, saying his statements had displayed "provocative attitudes and behavior".\n\nTurkey saw anti-migrant and anti-refugee protests in July 2024 after an alleged case of child abuse involving Syrian refugees in Kayseri. Angry protesters raided shops owned by Syrians and set several vehicles on fire.\n\nÖzdağ denied the allegations. "The Zafer Party has nothing to do with the incidents in Kayseri," he said in his defense in court."
 Turkey.663.a:0 "Heavy Pressure on the Zafer Party"
 Turkey.664.title:0 "The Bolu Grand Hotel Fire"
 Turkey.664.desc:0 "On 21 January 2025, a fire broke out at the Grand Kartal Hotel at the Kartalkaya ski resort in Bolu Province, Turkey, killing at least 78 people and injuring 51. The fire started in the kitchen and restaurant area on the hotel's fourth floor during the Turkish winter school break, when the hotel was 80–90% full. Its scale and death toll were made worse by the absence of smoke detectors, automatic sprinklers, working fire alarms, working emergency exit lights and other fire safety measures. Rescue efforts were hampered by freezing weather and the hotel's remote location; firefighters arrived more than an hour after the fire was reported. Most victims died of smoke inhalation."
 Turkey.664.a:0 "A Disaster!"
 Turkey.665.title:0 "The "Newborn" Gang"
 Turkey.665.desc:0 "Forty-seven people have gone on trial in Turkey over an alleged scheme in which newborns were transferred between hospitals for profit.\n\nProsecutors say doctors, nurses and ambulance drivers are responsible for the deaths of at least 10 babies. The defendants are accused of making false diagnoses to transfer babies to 19 private hospitals, where they were allegedly kept in neonatal intensive care for lengthy and sometimes unnecessary treatment.\n\nAccording to the 1,400-page indictment, those involved shared the social security payments earned for each day a baby stayed in the unit. The defendants deny wrongdoing, saying they acted in good faith and gave the babies the best possible care. One of the accused, Dr. Fırat Sarı, told prosecutors that everything had been done "in accordance with procedures", the Associated Press reports. As the trial opened, dozens of people protested outside the courthouse near Istanbul, chanting "Baby killers will be held accountable" and "Private hospitals should be shut down", AP adds.\n\nPolice launched an inquiry after an anonymous tip-off in March 2023. Ten hospitals have had their licenses revoked as a result of the investigation."
 Turkey.665.a:0 "..."
 Turkey.666.title:0 "Zorlu Holding CEO Forced to Resign"
 Turkey.666.desc:0 "On Friday, Ergün Güler, chief executive of the electronics firm Vestel, a subsidiary of Zorlu Holding, sent employees a message celebrating the start of Ramadan, which began on Saturday. Zorlu Holding CEO Cem Köksal then sent an internal email saying the company officially celebrated only the two bayrams, Eid al-Fitr and Eid al-Adha, not Ramadan, and that it wanted to keep a secular stance as it worked to become a multinational company with employees of various beliefs and origins.\n\nAfter images of the email circulated in local and social media, an Istanbul prosecutor's office opened an investigation, Anadolu Agency (AA) reported, adding that Köksal was detained on Saturday for "obstructing the exercise of freedom of belief, thought and expression". In a statement, Zorlu Holding later acknowledged the "sensitivity" caused by the "internal disagreement over management principles" and said Köksal had resigned as of 1 March."
 Turkey.666.a:0 "For Ramadan"
 Turkey.667.title:0 "The Arrest of Ekrem İmamoğlu"
 Turkey.667.desc:0 "On the morning of 19 March 2025, Turkish police surrounded İmamoğlu's residence in Istanbul. In a video tweeted at around 7 a.m. local time, İmamoğlu said: "We are facing great oppression, but I will not give up. I entrust myself to my nation." Shortly afterwards, İmamoğlu and around 100 others, including his adviser Murat Ongun, were detained, along with two CHP district mayors in Istanbul and several journalists and business figures. This came just as İmamoğlu was about to become the CHP's presidential candidate. The CHP condemned the detentions as a "coup attempt" and declared its support for İmamoğlu. On 23 March, twenty people were arrested, including Murat Ongun, chairman of the board of Medya A.Ş., Istanbul Planning Agency President Buğra Gökçe, İmamoğlu İnşaat General Manager Tuncay Yılmaz and İBB Kültür A.Ş. General Manager Murat Abbas. Forty-eight people, including İmamoğlu, were arrested in the corruption investigation, three were arrested in the terrorism investigation, and judicial control measures were imposed on forty-one people. That same day, İmamoğlu was the only candidate in the CHP's presidential primary to choose its nominee for the next presidential election. According to CHP Chairman Özgür Özel, İmamoğlu received more than 14.85 million votes. \n\nThe Istanbul Chief Public Prosecutor's Office accused İmamoğlu of being the "leader of a criminal organization", alleging corruption, extortion, bribery and money laundering tied to municipal contracts. Prosecutors also charged him with aiding the Kurdistan Workers' Party (PKK) by forming an electoral alliance with the pro-Kurdish Peoples' Equality and Democracy Party (DEM) in the 2024 municipal elections, claiming that this "urban consensus" had increased the PKK's influence in the cities. İmamoğlu and his supporters rejected the charges as fabricated, saying they were designed to eliminate him as a political threat to President Recep Tayyip Erdoğan. The prosecutor's office also announced that İmamoğlu's construction company had been seized and its general manager detained. The government imposed a four-day ban on public demonstrations in Istanbul, closed major roads and restricted access to social media platforms such as Twitter, YouTube and Instagram, according to the internet watchdog NetBlocks. İmamoğlu was taken to the Vatan Security Directorate in Istanbul, where he remained in custody pending further proceedings."
 Turkey.667.a:0 "Problems Are Escalating"
 Turkey.667.b:0 "Problems Are Escalating §Y(With No Speech)§!" 
 Turkey.668.title:0 "Morgan Stanley Leaves Borsa Istanbul"
 Turkey.668.desc:0 "In a statement to the Public Disclosure Platform (KAP) on 19 March 2025, Borsa İstanbul A.Ş. announced that Morgan Stanley Securities had been removed from the exchange."
 Turkey.668.a:0 "They Made Their Decision"
 Turkey.670.title:0 "Istanbul Bar Association Leadership Removed"
 Turkey.670.desc:0 "In a decision widely condemned as politically motivated, the İstanbul 2nd Civil Court of First Instance has removed the entire executive board of the İstanbul Bar Association, including its president, constitutional law scholar Prof. Dr. İbrahim Özden Kaboğlu. The ruling responds to a statement the Bar issued after two journalists were killed in an airstrike in northern Syria in December 2024, and marks an escalation in the government's crackdown on legal institutions and independent voices."
 Turkey.670.a:0 "The Rule of Law Overshadowed"
 Turkey.672.title:0 "The 2 April Boycott Campaign"
 Turkey.672.desc:0 "An opposition-led boycott in Turkey began on 19 March, the day Istanbul Mayor Ekrem İmamoğlu was detained. That night, Özgür Özel, leader of the main opposition Republican People's Party, told the crowd outside Istanbul City Hall to boycott pro-government TV channels and a list of companies linked to the government, because the channels were not covering the mass demonstrations.\n\nOver the following days, as people kept gathering in the same square, Özel stepped up the calls, adding more companies and brands that kept advertising on pro-government channels and urging people to boycott their products. The party even set up a website, which was blocked days later by order of a criminal judgeship of peace.\n\nThen on 1 April, joining calls by students across Turkey, Özel urged the public to stage a day-long economic boycott: "Stop all purchases! Supermarkets, online shopping, restaurants, gasoline, coffee: buy nothing." Scores of businesses, large and small, announced they were closing their shops and e-commerce sites in solidarity. Meanwhile, the Istanbul Prosecutor's Office said on 1 April that it was opening an investigation on the grounds that "divisive rhetoric" in traditional and social media aimed at hindering economic activity constituted "hatred and discrimination" and "incitement to hatred and hostility", according to local media."
 Turkey.672.a:0 "Shocking"
 Turkey.674.title:0 "The LeMan Protests"
 Turkey.674.desc:0 "Clashes erupted in Istanbul on Monday as police fired rubber bullets and tear gas to disperse a mob after claims that a satirical magazine had published a cartoon of the Prophet Muhammad. The clashes came after Istanbul's chief prosecutor ordered the arrest of LeMan magazine's editors on the grounds that it had published a cartoon that "publicly insulted religious values"."
 Turkey.674.a:0 "A Religious Issue"
 Turkey.673.title:0 "A Man Attacks the Turkish Opposition Leader"
 Turkey.673.desc:0 "The leader of Turkey's main opposition party was attacked as he left a memorial ceremony in Istanbul on Sunday. Özgür Özel, head of the Republican People's Party (CHP), was leaving the Atatürk Cultural Center in the city center when a white-haired man approached and slapped him in the face, TV footage showed.\n\nÖzel, who was attending a memorial for Sırrı Süreyya Önder, a pro-Kurdish politician who died on Saturday, was reportedly unhurt. The suspect was detained, according to the Istanbul Chief Public Prosecutor's Office. The Interior Ministry later said the attacker was a 66-year-old man who had killed his two children in 2004 and was released on parole in 2020. The Cumhuriyet newspaper reported that he had shot and stabbed his son and daughter, aged 19 and 17. The incident renewed fears for the safety of politicians in Turkey."
 Turkey.673.a:0 "The Country Is Destabilizing"
 Turkey.675.title:0 "The Arrest of Tunç Soyer"
 Turkey.675.desc:0 "In the operation against İzmir Metropolitan Municipality on 1 July, 99 of the 119 people detained and brought to court this morning were referred with a request for arrest. Former İzmir Metropolitan Mayor Tunç Soyer and CHP İzmir Provincial Chair Şenol Aslanoğlu were among those arrested, along with 33 others."
 Turkey.675.a:0 "The CHP Is Under Pressure"
 Turkey.676.title:0 "CHP Mayors of Antalya, Adana and Adıyaman Detained"
 Turkey.676.desc:0 "The operation against the CHP-run municipalities of Antalya, Adana and Adıyaman follows investigations that began in Istanbul and then spread to Izmir, the third-largest city. As part of the ongoing operations against municipalities run by the main opposition Republican People's Party (CHP), Adana Mayor Zeydan Karalar and Adıyaman Mayor Abdurrahman Tutdere were detained on Saturday morning."
 Turkey.676.a:0 "The CHP Is Under Pressure"
 Turkey.677.title:0 "Methane Gas Kills 12 Turkish Soldiers"
 Turkey.677.desc:0 "Twelve Turkish soldiers have died after being exposed to methane gas while searching a cave in northern Iraq, the Turkish Ministry of National Defense said. At least 19 personnel were exposed to the gas during the search-and-clear operation on Sunday and were immediately taken to hospital."
 Turkey.677.a:0 "Aman Tanrım"
 Turkey.678.title:0 "Sözcü TV Forced Off the Air"
 Turkey.678.desc:0 "Turkey's pro-opposition Sözcü TV went off the air for 10 days at midnight local time on Wednesday, in what many see as a new front in the country's intensifying crackdown on dissent. "When the clock strikes 12, Sözcü TV will go off the air," anchor Serap Belovacıklı told viewers earlier on Tuesday. "But will we give up? No! We will not stop being your voice."\n\nThe blackout comes amid a widening crackdown on the main opposition Republican People's Party (CHP), which has sharply escalated over the past week. Three more CHP mayors, including some in former ruling-party strongholds that flipped in last year's historic local elections, were detained, fueling growing alarm over the state of democracy in the country."
 Turkey.678.a:0 "Opposition Media Must Be Brought Under Our Control"
 Turkey.679.title:0 "Grok AI Chatbot Blocked in Turkey"
 Turkey.679.desc:0 "The ban stems from content generated by Grok that was allegedly insulting to Mustafa Kemal Atatürk, the founder of modern Turkey, President Recep Tayyip Erdoğan and the Prophet Muhammad.\n\nThe court's decision to block Grok was announced by Turkey's Media and Law Studies Association (MLSA). According to legal scholar Yaman Akdeniz, the ban makes Turkey the first country in the world to censor the Grok AI tool."
 Turkey.679.a:0 "An Independent AI?"
 Turkey.680.title:0 "The Arrest of Özgür Kabadayı"
 Turkey.680.desc:0 "Operations against CHP-run municipalities are continuing. In the early hours of the morning, Istanbul police raided Şile Municipality and took Mayor Özgür Kabadayı into custody. CHP Parliamentary Group Deputy Chair Ali Mahir Başarır called the operation "a mafia order", while CHP Deputy Chair Burhanettin Bulut said: "We do not accept this corrupt order!""
 Turkey.680.a:0 "The CHP Is Under Pressure"
 Turkey.681.title:0 "Muharrem İnce Rejoins the CHP"
 Turkey.681.desc:0 "Operations against CHP-run municipalities are continuing. In the early hours of the morning, Istanbul police raided Şile Municipality and took Mayor Özgür Kabadayı into custody. CHP Parliamentary Group Deputy Chair Ali Mahir Başarır called the operation "a mafia order", while CHP Deputy Chair Burhanettin Bulut said: "We do not accept this corrupt order!""
 Turkey.681.a:0 "The Opposition Is Uniting"
 Turkey.682.title:0 "Erdoğan Announces His New Coalition"
 Turkey.682.desc:0 "After the PKK's symbolic disarmament ceremony, President Recep Tayyip Erdoğan once again repeated his commitment to the three-party idea. Speaking at the Kızılcahamam camp, he said: "As three parties, we are determined to steer this process safely." \n\nResponding openly to criticism, Erdoğan argued that the new process "places significant responsibilities on all political parties". His statement that the process would be run by three parties is drawing criticism from other party leaders."
 Turkey.682.a:0 "A Three-Party Coalition Takes Shape"
 Turkey.683.title:0 "The Arrest of Fatih Altaylı"
 Turkey.683.desc:0 "On 23 June 2025, veteran Turkish journalist and commentator Fatih Altaylı was arrested after posting a video commentary on his YouTube channel in which he discussed historical cases of Ottoman sultans being overthrown or assassinated. Prosecutors claimed the comments constituted a threat to President Recep Tayyip Erdoğan.\n\nAltaylı, born in 1962, is a former columnist and TV presenter who left traditional media in 2023 to launch his own YouTube channel, which has become one of the most popular in the country. In the video posted on 21 June, he referred to historical patterns of political accountability in the Ottoman Empire: "This is a nation that strangled its sultans when it didn't like them or want them." After the video spread online, Altaylı was arrested and placed in pre-trial detention.\n\nEleven journalists' unions, media organizations and NGOs publicly condemned the arrest. In a joint statement, they said Altaylı's comments fell squarely within the scope of journalistic commentary and neither incited violence nor contained any threat. The Journalists' Union of Türkiye (TGS) called the arrest unlawful and politically motivated: "No journalist can be targeted for their thoughts, writings or criticisms, and the judiciary cannot be used as a tool for such targeting.""
 Turkey.683.a:0 "Pro-Opposition Journalists Are in the Crosshairs"
 Turkey.684.title:0 "The Arrest of İsmail Saymaz"
 Turkey.684.desc:0 "On 19 March 2025, police detained İsmail Saymaz, a freelance journalist and TV commentator who previously worked for outlets such as Halk TV and Sözcü, in a raid on his home in Istanbul. His lawyer said he was questioned in custody about his journalism, his contacts and his social media activity while reporting on the Gezi protests, including his communication with some of those convicted of organizing the unrest, such as businessman Osman Kavala, lawyer Can Atalay, film producer Çiğdem Mater and architect Mücella Yapıcı.\n\nOn 21 March, the Istanbul 10th Criminal Judgeship of Peace placed Saymaz under house arrest on the charge of "aiding an attempt to overthrow the government" during the nationwide Gezi Park protests of 2013. A few days before his detention, Saymaz had announced that he had been banned from traveling abroad and that his passport had been confiscated."
 Turkey.684.a:0 "Pro-Opposition Journalists Are in the Crosshairs"
 Turkey.685.title:0 "TÜRKSAT 6A"
 Turkey.685.desc:0 "Under an agreement signed on 15 December 2014, the satellite was to be developed and built domestically by specialists led by the TÜBİTAK Space Technologies Research Institute (TÜBİTAK UZAY), in cooperation with Turkish Aerospace (TUSAŞ), ASELSAN and CTech Bilişim Teknolojileri A.Ş. TUSAŞ was responsible for designing and producing the satellite structure and subsystems such as thermal control, chemical propulsion, wiring harness and the mechanical ground support equipment. TUSAŞ and TÜBİTAK UZAY worked together on the software for on-board data handling and on satellite command and control, and carried out assembly, integration and testing together at the TUSAŞ Satellite Assembly, Integration and Test Facility.\n\nThe satellite was launched on a SpaceX Falcon 9 rocket."
 Turkey.685.a:0 "Good News"
 Turkey.686.title:0 "The 2025 Istanbul Earthquake"
 Turkey.686.desc:0 "On 23 April 2025 at 12:49:10 TRT, a Mww 6.2 earthquake struck the Sea of Marmara, 28 km (17 mi) southeast of Marmara Ereğlisi in Tekirdağ Province, near Istanbul. One person died of a heart attack, 359 were injured and moderate damage was recorded across the Marmara Region."
 Turkey.686.a:0 "Can You Feel the Risk?"
 Turkey.687.title:0 "The Release of Ümit Özdağ"
 Turkey.687.desc:0 "Ümit Özdağ, chairman of the anti-refugee Zafer Party, was released from prison today after being sentenced to two years, four months and three days for "inciting the public to hatred and hostility" under Article 216 of the Turkish Penal Code. The verdict was delivered by the Istanbul 18th Criminal Court of First Instance at a hearing held in the Marmara Prison complex in Silivri. Özdağ had been in detention for nearly five months.\n\nThe hearing was attended by several political and legal figures, including Ankara Mayor Mansur Yavaş, opposition MPs and Union of Turkish Bar Associations President Erinç Sağkan. Supporters applauded Özdağ as he entered the courtroom, and some sang the national anthem before the session began."
 Turkey.687.a:0 "He Is Out"
 Turkey.688.title:0 "Northern Lights Over Turkey"
 Turkey.688.desc:0 "The aurora borealis was widely observed across Türkiye due to a geomagnetic storm. The Turkish Space Agency (TUA) said the northern lights seen last night were caused by a geomagnetic storm triggered by a solar flare, which made it possible to see them at mid-latitudes."
 Turkey.688.a:0 "Wonderful"
 Turkey.689.title:0 "The IYI Party Elects Müsavat Dervişoğlu as Its New Chairman"
 Turkey.689.desc:0 "The IYI Party has elected Müsavat Dervişoğlu as its new chairman at a party congress held in the wake of its recent electoral setback. Dervişoğlu, the party's parliamentary group chairman and an MP for İzmir, won the leadership election with 611 votes.\n\nThe election on 27 April went to three rounds, as no candidate won an absolute majority in the first two. His rival, Koray Aydın, received 548 votes."
 Turkey.689.a:0 "A New Chairman?"
 Turkey.691.title:0 "Erdogan Makes Peace With Sisi and Strikes a Deal"
 Turkey.691.desc:0 "Turkish President Recep Tayyip Erdogan and Egyptian President Abdel Fattah al-Sisi met on Thursday to discuss Syria, Gaza and bilateral relations, in their first meeting since the fall of the Syrian regime.\n\nAt their meeting on the sidelines of the D-8 Organization for Economic Cooperation summit in Cairo, Erdogan pledged continued Turkish support for Syria's unity and its reconstruction after 13 years of civil war. Unlike Turkey, the main backer of the Syrian rebels who ousted Bashar al-Assad on 8 December, the Egyptian government had long favored Assad over the Islamist-leaning opposition. Assad's fall has raised concerns in Cairo about a possible resurgence of the Muslim Brotherhood, which was removed from power in Egypt in 2013."
 Turkey.691.a:0 "Alright"
 Turkey.693.title:0 "The CHP Rallies of 2025"
 Turkey.693.desc:0 "The rallies organized by the Republican People's Party (CHP) to protest the arrest of Istanbul Mayor Ekrem İmamoğlu and demand early elections are bringing together a wide range of political groups, main opposition leader Özgür Özel said on 24 April.\n\n"We are going through a valuable process in which social democrats, socialist democrats, conservative democrats, nationalist democrats and Kurdish democrats stand shoulder to shoulder in the squares," Özel told reporters after visiting the Left Party headquarters in Ankara.\n\nThe CHP delegation led by Özel included deputy chairs Gül Çiftci, Gamze Taşcıer and Yalçın Karatepe, while the Left Party was represented by its spokespersons Önder İşleyen, İsmail Hakkı Tombul, Gizem Özdem and İlknur Başer. "This process can be lasting, and it is Türkiye's hope," Özel said. "For the opposition, and for the millions who voted for the government but do not think what is happening today is right, our first demand is democracy and justice.""
 Turkey.693.a:0 "They Will Resist"
 Turkey.694.title:0 "The 2025 Turkish Protests"
 Turkey.694.desc:0 "Protests broke out across Turkey on 19 March 2025 after the authorities detained and arrested Istanbul Mayor Ekrem İmamoğlu and more than 100 other opposition members and protesters. The gatherings represented a major public challenge to what participants called politically motivated legal action against İmamoğlu, the main opposition candidate for the 2028 presidential election and President Recep Tayyip Erdoğan's chief political rival.\n\nThe demonstrations have been backed by the CHP and many other parties, organizations and associations. Hundreds of thousands of people are protesting in almost every Turkish city, especially Istanbul, Ankara and İzmir, with the largest crowd in front of the Istanbul Metropolitan Municipality headquarters. University students are playing a major role.\n\nThe protesters span a broad ideological spectrum, from right to left. Symbols of the Republic, Atatürk above all, serve as a unifying framework and common point of reference throughout the demonstrations.\n\nThe protests are taking place amid an economic crisis: the Turkish lira lost 16.3% of its value against the US dollar in the three days after İmamoğlu's arrest."
 Turkey.694.a:0 "Signs of General Instability" 
 Turkey.695.title:0 "The Saraçhane Rallies"
 Turkey.695.desc:0 "In the evening, thousands of people answered the CHP's call and gathered in front of the Istanbul Metropolitan Municipality building in Saraçhane. The demonstrators chanted slogans such as "There is no salvation alone: either all of us together, or none of us" and "Government, resign!"\n\nCHP Chairman Özgür Özel and İmamoğlu's wife, Dilek İmamoğlu, addressed the crowd.\n\n"Today, the will of the people is being stolen through a judicial coup," Özel said.\n\nÖzel reminded the crowd of the primary to be held on Sunday, 23 March, to choose the CHP's presidential candidate, in which İmamoğlu was the only candidate:\n\n"On Sunday, thousands, tens of thousands, millions of us will be in the streets, at the ballot box, in the squares. I call on all 86 million... to fight, to rise up.""
 Turkey.695.a:0 "They Are Preparing for Chaos" 
 Turkey.696.title:0 "The Iconic CHP Rally in Yozgat"
 Turkey.696.desc:0 "The CHP held a rally in Yozgat attended by thousands of citizens. Before the rally, farmers formed a convoy of about a thousand tractors, and CHP Chairman Özgür Özel arrived at the rally area on a tractor alongside them. In a message read out at the rally, Ekrem İmamoğlu, the CHP's jailed presidential candidate, stressed the need for early elections, saying: "The judgment of the nation is the cure for every problem." Farmer Abdullah Ceylan told the crowd: "The state is not governed with radishes and turnips. It is governed with justice and law." Özel said: "Erdoğan, you were the victim of the past and you are the oppressor of today. This is not chivalry, this is not bravery. This is cowardly behavior.""
 Turkey.696.a:0 "Things Are Changing" 
 Turkey.697.title:0 "Central Bank Cuts Interest Rate to 47.5"
 Turkey.697.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 250 basis points to 47.5 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.697.a:0 "Inflation Is Cooling"
 Turkey.698.title:0 "Central Bank Cuts Interest Rate to 45"
 Turkey.698.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 250 basis points to 45 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.698.a:0 "Inflation Is Cooling"
 Turkey.699.title:0 "Central Bank Cuts Interest Rate to 42.5"
 Turkey.699.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 250 basis points to 42.5 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.699.a:0 "Inflation Is Cooling"
 Turkey.700.title:0 "Central Bank Raises Interest Rate to 46"
 Turkey.700.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday raised its policy rate by 350 basis points to 46 percent. Events such as Ekrem İmamoğlu's arrest have dealt deep wounds to the Turkish economy, and those wounds have in turn forced interest rate hikes."
 Turkey.700.a:0 "Another Blow to the Medium-Term Program"
 Turkey.701.title:0 "Central Bank Cuts Interest Rate to 43"
 Turkey.701.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 300 basis points to 43 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.701.a:0 "Inflation Is Cooling"
 Turkey.702.title:0 "Anti-Refugee Riots in Turkey"
 Turkey.702.desc:0 "After rumors that a Syrian refugee had sexually assaulted a seven-year-old Syrian girl (later revealed to be his own cousin) spread on social media, the city of Kayseri erupted in violence. The protests spread to Istanbul, Hatay, Adana, Urfa, Bursa, Gaziantep, Konya, İzmir and Antalya. Protesters waved Turkish flags and made the grey wolf salute in the streets, chanting slogans such as "Erdoğan, resign!" and "I don't want refugees in my country."\n\nDozens of properties and vehicles belonging to Syrians were set on fire. Fourteen police officers and one firefighter were among the injured. At a restaurant in Maslak, a Turkish man holding a knife approached a table of Saudi businessmen, including the billionaires Khaled al-Fawzan and Ibrahim al-Hadithi, making slicing motions and the wolf salute; he was later arrested. A 15-year-old Syrian, Ahmed al-Naif, died in hospital after being stabbed by three teenagers in Serik."
 Turkey.702.a:0 "Tensions Rise"
 Turkey.703.title:0 "Stabbings in Eskişehir"
 Turkey.703.desc:0 "On 12 August, a knife attacker in Eskişehir stabbed passers-by, injuring five people, while streaming live on social media. After being detained, the suspect was arrested and found to be wearing gear decorated with Nazi symbols."
 Turkey.703.a:0 "What?!"
 Turkey.704.title:0 "The Erdoğan-Feyzioğlu Spat"
 Turkey.704.desc:0 "Erdoğan interrupted Feyzioğlu's speech, saying: "You are speaking wrongly." Feyzioğlu asked: "What am I saying wrong, Mr. Prime Minister?" The Prime Minister replied: "Such rudeness is unacceptable." Feyzioğlu answered from the podium: "I have not been rude, and I would not think it appropriate to call anyone rude. It was a very constructive speech."\n\nDespite President Gül's attempts to stop him, Erdoğan then stood up and said: "You have no such legal right. But unfortunately the bylaws allow this. You are making a political speech. Mr. President spoke for 25 minutes; you have been talking for an hour. What you said about Van is a complete lie. He is spewing all his spite.""
 Turkey.704.a:0 "Now That's an Argument"
 Turkey.705.title:0 "Wildfire in Bursa"
 Turkey.705.desc:0 "Overnight fires in the forested mountains around Bursa in northwestern Turkey spread rapidly, casting a red glow over the night sky above the city's eastern suburbs. Dozens of severe wildfires have hit the country every day since late June, and on Friday the government declared two western provinces, İzmir and Bilecik, disaster areas.\n\nThe Bursa governor's office said on Sunday that 1,765 people had been safely evacuated from villages to the northeast as more than 1,900 firefighters battled the flames. The highway linking Bursa to the capital Ankara was closed as the surrounding forests burned."
 Turkey.705.a:0 "Take Precautions"
 Turkey.706.title:0 "The Arrest of Rıza Akpolat"
 Turkey.706.desc:0 "Rıza Akpolat, the Republican People's Party (CHP) mayor of Istanbul's upscale Beşiktaş district, was among 23 people arrested early on Friday on charges of tender corruption.\n\nAkpolat and the other suspects had been detained earlier in the week in an investigation into bid-rigging allegations involving the municipality, its companies and a businessman awarded lucrative contracts in Beşiktaş on Istanbul's European side. That businessman, Aziz İhsan Aktaş, was among those arrested after they testified for hours at the courthouse on Thursday. After the mayor's arrest was announced, the CHP gathered a large crowd outside the Beşiktaş municipality building and called the arrest politically motivated."
 Turkey.706.a:0 "The CHP Is Under Pressure"
 Turkey.707.title:0 "The Arrest of Alaattin Köseler"
 Turkey.707.desc:0 "A Turkish court has ordered the arrest of Alaattin Köseler, the opposition Republican People's Party (CHP) mayor of Istanbul's Beykoz district, on charges of bid rigging and abuse of office. Köseler was detained on 27 February, along with 18 others including his chief of staff, after a police raid on his home."
 Turkey.707.a:0 "The CHP Is Under Pressure"
 Turkey.708.title:0 "The Trench Operations"
 Turkey.708.desc:0 "The trench operations were joint military operations by the Turkish security forces against PKK militants, centered on Sur, Cizre and Nusaybin. Curfews were imposed in some of the areas involved, and some were declared temporary special security zones. The curfews were lifted once the PKK militants had been neutralized, the trenches filled in, the barricades removed and security restored."
 Turkey.708.a:0 "We Must Destroy Them!"
 Turkey.709.title:0 "The Fake Diploma Scandal"
 Turkey.709.desc:0 "As Türkiye's scandal over fake diplomas and driver's licenses continues to dominate the headlines, Interior Minister Ali Yerlikaya announced on Tuesday that 197 suspects had been apprehended, 37 arrested and 150 placed under judicial control in the ongoing operations. "In two coordinated operations held simultaneously in 23 provinces on 7 January and in 16 provinces on 23 May, a total of 197 suspects were apprehended. Of these, 37 were arrested and 150 were placed under judicial control," Yerlikaya said in a social media post.\n\nOn the production of electronic signatures with forged documents and illegal access to public systems, Yerlikaya explained that the first wave was conducted by the Ankara Chief Public Prosecutor's Office, focusing on "forgery of official documents, offenses related to the services of the Measurement, Selection and Placement Center (ÖSYM) and unauthorized access to information systems", with the Ankara Cyber Crimes Division leading the effort. He added that fake driver's licenses and Turkish identity cards had been used to apply for and obtain electronic signatures at branches of the certification providers "TÜRKTRUST" and "E-İMZATR" in Adana, Mersin, Hatay, Ankara and Istanbul.\n\nThese e-signatures were then used to access public institutions' systems without authorization and carry out illegal activities. In the simultaneous operation of 7 January, centered in Ankara and spanning 23 provinces, 126 suspects were apprehended and 17 arrested."
 Turkey.709.a:0 "What a Disgrace!"
 Turkey.710.title:0 "Editor's Notes (15.01.2026)"
 Turkey.710.desc:0 "The mod is receiving frequent fix updates these days, and we apologize for any inconvenience. Please feel free to report any issues you run into; we will get back to you as soon as possible."
 Turkey.710.a:0 "Happy New Year!"
 Turkey.711.title:0 "Wildfire in Çanakkale"
 Turkey.711.desc:0 "A wildfire on the Gallipoli Peninsula in Çanakkale, northwestern Turkey, has led to the partial suspension of shipping through the Dardanelles and the evacuation of several villages.\n\nThe fire, which started near Kumköy village in the Eceabat district on Tuesday at around 16:05 local time (GMT+3), quickly spread from a field into the forest, prompting a large-scale response from firefighting teams."
 Turkey.711.a:0 "Looks Bad"
 Turkey.712.title:0 "The Balıkesir Earthquake"
 Turkey.712.desc:0 "The United States Geological Survey (USGS) reported a magnitude of Mww 6.1, with the epicenter 10 km (6.2 mi) south-southwest of Bigadiç in Balıkesir Province. Kandilli Observatory said the quake was centered near the districts of Alakır and Sındırgı at a depth of 7.7 km (4.8 mi). The epicenter lies near the western end of the Simav fault zone, believed to be responsible for the 1969 Demirci earthquake."
 Turkey.712.a:0 "What a Catastrophe"
 Turkey.713.title:0 "Aydın Mayor Çerçioğlu Switches Sides"
 Turkey.713.desc:0 "Özlem Çerçioğlu, mayor of the western province of Aydın, announced on Thursday that she had left the main opposition Republican People's Party (CHP) amid growing disagreements, and joined the AKP."
 Turkey.713.a:0 "Welcome!"
 Turkey.714.title:0 "The Arrest of İnan Güney"
 Turkey.714.desc:0 "An Istanbul court late yesterday arrested Beyoğlu Mayor İnan Güney and 16 others as part of an ongoing corruption investigation linked to the opposition-run Istanbul Metropolitan Municipality (İBB)."
 Turkey.714.a:0 "The CHP Is Under Pressure"
 Turkey.715.title:0 "The Radar Surveillance Scandal"
 Turkey.715.desc:0 "Public outrage has reached boiling point following the deployment of new ASELSAN-made radar systems on highways across the country. The government initially touted them as "national security assets" and "advanced traffic safety technology", but the truth has become painfully clear to citizens: the radars were installed mainly to monitor drivers aggressively and drive up traffic fines. The sudden surge in speeding tickets and automated charges has led to accusations that the state is using domestic technology to "tax" the people through surveillance, causing a noticeable dip in stability."
 Turkey.715.a:0 "A New Source of Revenue?"
 Turkey.716.title:0 "The Gebze Building Collapse"
 Turkey.716.desc:0 "The industrial heartland of Gebze has been shaken by a local disaster: several high-rise residential and commercial buildings have suddenly collapsed. Preliminary investigations point to cost-cutting, substandard concrete and a complete lack of municipal oversight. As families are pulled from the rubble, public demands for accountability in the construction sector have become deafening. The region's infrastructure has been badly damaged and requires immediate state intervention."
 Turkey.716.a:0 "Oh My God!"
 Turkey.717.title:0 "Crimean Convoy Ambush"
 Turkey.717.desc:0 "Russian forces have intercepted and attacked maritime convoys near Crimea. Given our interests and the delicate balance in the Black Sea, this aggression challenges our maritime authority and forces us to reconsider our naval escort policy. While the hawks in Ankara demand a war footing, the diplomatic cost of such a provocation weighs heavily on our political capital."
 Turkey.717.a:0 "Aghh!"
 Turkey.718.title:0 "Babacan and Şimşek in Talks"
 Turkey.718.desc:0 "Economic heavyweights Ali Babacan and Mehmet Şimşek have been seen in high-level talks about the future of the Turkish economy. Their cooperation suggests a shift toward more orthodox fiscal policy, much to the relief of international markets. While their roadmap promises long-term growth and investor confidence, the political cost of swallowing their "bitter pill" of austerity is immense."
 Turkey.718.a:0 "New Priorities"
 Turkey.719.title:0 "Libyan Jet Crashes Near Ankara"
 Turkey.719.desc:0 "A Libyan military aircraft on a diplomatic mission has crashed on the outskirts of Ankara. The incident has caused significant diplomatic embarrassment and raised concerns about the maintenance of foreign aircraft operating in our airspace. Political support for our military commitments abroad has taken a sharp hit."
 Turkey.719.a:0 "A Tragic Failure"
 Turkey.720.title:0 "Earthquake Hits Balıkesir"
 Turkey.720.desc:0 "A powerful earthquake has rocked the Balıkesir region. While casualties were limited, the damage to local infrastructure and the power grid is substantial. Reconstruction must begin immediately to prevent a regional economic standstill, and the government must divert significant resources to keep the local economy from collapsing."
 Turkey.720.a:0 "Mobilize AFAD"
 Turkey.721.title:0 "Barzani Visits Turkey"
 Turkey.721.desc:0 "Nechirvan Barzani has arrived in Şırnak for an official visit. The talks focus on regional security, energy pipelines and the joint fight against cross-border militancy. The visit remains a sensitive subject for some nationalist circles: it has strengthened regional stability but caused friction within our party's nationalist base."
 Turkey.721.a:0 "Is This Really Just Official?"
 Turkey.722.title:0 "The National Dog Parks Initiative"
 Turkey.722.desc:0 "In an effort to modernize urban life and address the concerns of animal lovers, the government has funded dedicated dog parks in major cities. While popular with city dwellers, some critics argue the money could have been better spent elsewhere. Still, the parks have undeniably improved life for pet owners in the concrete jungles of Istanbul and Ankara."
 Turkey.722.a:0 "Woof Woof Woof!"
 Turkey.723.title:0 "İmamoğlu in Court"
 Turkey.723.desc:0 "Ekrem İmamoğlu has appeared in court once again to face charges. The proceedings have drawn huge crowds of supporters to the courthouse, turning a legal matter into a major rallying point for the opposition. While the government gains a temporary tactical advantage, it is inadvertently boosting his popularity."
 Turkey.723.a:0 "The Opposition's Resistance Continues"
 Turkey.724.title:0 "The F-35 Re-entry Negotiations"
 Turkey.724.desc:0 "President Erdoğan has launched a major diplomatic push to rejoin the F-35 Joint Strike Fighter program. After years of exclusion following the S-400 purchase, Ankara is trying to find its way back into the Pentagon's good graces. The negotiations are grueling, requiring massive lobbying and significant political concessions. The Air Force badly needs a fifth-generation capability, but the process is draining our political power."
 Turkey.724.a:0 "We Need to Make a U-Turn"
 Turkey.725.title:0 "The Court's Ruling on Fatih Altaylı"
 Turkey.725.desc:0 "The court has delivered its ruling on the prominent journalist Fatih Altaylı. The decision has sparked fierce debate about press freedom and the limits of public criticism of the state. While it satisfies those who find his commentary "incendiary", it has united the opposition media."
 Turkey.725.a:0 "The Press Remains a Battleground"
 Turkey.726.title:0 "The Seizure of GAİN"
 Turkey.726.desc:0 "In a shocking move for the digital media sector, the government has appointed state trustees ("kayyums") to take over the GAİN streaming platform. Citing "national security concerns", the state has effectively neutralized one of the last bastions of independent digital content. While this gives the government full control over another powerful outlet for its message, it has further alarmed international investors."
 Turkey.726.a:0 "We Need That!"
 Turkey.727.title:0 "The Question of Gürsel Tekin"
 Turkey.727.desc:0 "Gürsel Tekin's recent public statements have caused a stir within the CHP and across the political landscape. His criticism of the party's internal policies has slightly dented the opposition's image of unity, and by publicly questioning the party's direction he has handed the ruling coalition plenty of ammunition."
 Turkey.727.a:0 "Internal Rifts Are Showing"
 Turkey.728.title:0 "The Bayrampaşa Crisis"
 Turkey.728.desc:0 "Chaos has erupted in Bayrampaşa Municipality after a series of controversial administrative decisions involving İbrahim Karaman. The situation escalated quickly as accusations of political interference and local mismanagement led to public demonstrations and friction between local officials and the central government. While the turmoil has caused local instability, the government's firm handling has projected an image of authority to some, while others see it as a setback for democracy."
 Turkey.728.a:0 "Whatever!"
 Turkey.729.title:0 "İmralı Visit Controversy"
 Turkey.729.desc:0 "Reports of a recent high-level visit to the İmralı prison complex have leaked to the press. Such visits are always politically charged, fueling speculation about a new "peace process" or a change in security strategy. The government remains tight-lipped, but the mere suggestion of a visit has shifted the political atmosphere."
 Turkey.729.a:0 "#TerrorFreeTürkiye"
 Turkey.730.title:0 "Özgür Özel Re-Elected at the Party Congress"
 Turkey.730.desc:0 "Özgür Özel has delivered a powerful speech at the CHP party congress (Kurultay). His message of reform and change has resonated with the party base, strengthening his position as leader of the opposition. Although the party's political capital is currently being spent on internal restructuring, the long-term popularity of the democratic movement is on the rise."
 Turkey.730.a:0 "The Opposition Finds New Ways to Strike"
 Turkey.731.title:0 "The Pope at the Volkswagen Arena"
 Turkey.731.desc:0 "In a historic and highly unusual event, the Pope has held a gathering at the Volkswagen Arena in Istanbul. Images of the Catholic leader speaking in a major Turkish venue have been broadcast worldwide. While it is a powerful symbol of Turkey's role as a bridge between faiths, it has alienated more fundamentalist circles."
 Turkey.731.a:0 "An Olive Branch Between Faiths"
 Turkey.732.title:0 "Russian Orlan Drone Incursion"
 Turkey.732.desc:0 "A Russian Orlan-10 drone has been recovered after crashing inside our borders. This is not just a technical failure; it is a blatant violation of our sovereignty. The presence of Russian "eyes" so deep in our territory has caused a scandal at the Ministry of National Defense and shaken public confidence in our border security."
 Turkey.732.a:0 "Secure the Border"
 Turkey.733.title:0 "The Arrest of Sadettin Saran"
 Turkey.733.desc:0 "Prominent businessman and Fenerbahçe president Sadettin Saran has been taken into custody. As a figure with great influence in both business and sports, his arrest has sent shockwaves through the private sector, and the resulting uncertainty has dented market stability as investors wait to see who is next."
 Turkey.733.a:0 "It Happens"
 Turkey.734.title:0 "THY Buys Boeing"
 Turkey.734.desc:0 "Turkish Airlines has finalized a massive deal to buy a new fleet of Boeing aircraft. While it drains the treasury in the short term, it secures THY's place as a global aviation leader. The treasury has taken a significant hit, but our soft power through aviation has never been higher."
 Turkey.734.a:0 "Expanding Our Reach..."
 Turkey.735.title:0 "New Quota Rulings"
 Turkey.735.desc:0 "New rulings on export and import quotas have met stiff resistance from the TOBB lobby. Businesses are struggling to adapt to the new rules, leading to a dip in industrial stability. Business leaders argue that the quotas are stifling innovation and creating artificial shortages."
 Turkey.735.a:0 "Now Everything Needs Supervision!"
 Turkey.736.title:0 "The Pope Visits Ankara"
 Turkey.736.desc:0 "After his public appearance in Istanbul, the Pope met officials at the National Library in Ankara. The visit focused on the preservation of historical manuscripts and cultural dialogue. This high-level diplomacy has greatly boosted our international standing and political prestige."
 Turkey.736.a:0 "Looks Good!"
 Turkey.737.title:0 "The CHP Istanbul Dispute"
 Turkey.737.desc:0 "Internal administrative disputes in the CHP's Istanbul branch have come into public view. Despite the friction, the party's hold on public sentiment in the city remains strong. While the power struggle keeps draining resources, the CHP's policies continue to win over the people."
 Turkey.737.a:0 "The Opposition Resists!"
 Turkey.738.title:0 "A Scandal During the US Visit"
 Turkey.738.desc:0 "The recent diplomatic visit to the United States was overshadowed by a series of gaffes and logistical failures. The resulting media circus has damaged the government's prestige on the international stage, and we have come home with nothing to show for it but a significant loss of political power."
 Turkey.738.a:0 "It's A Disaster!"
 Turkey.739.title:0 "Central Bank Cuts Interest Rate to 40.5"
 Turkey.739.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 250 basis points to 40.5 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.739.a:0 "Inflation Is Cooling"
 Turkey.740.title:0 "Central Bank Cuts Interest Rate to 39.5"
 Turkey.740.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 100 basis points to 39.5 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.740.a:0 "Inflation Is Cooling"
 Turkey.741.title:0 "Central Bank Cuts Interest Rate to 38"
 Turkey.741.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday cut its policy rate by 150 basis points to 38 percent. The decision shows that things are starting to move in the direction we want."
 Turkey.741.a:0 "Inflation Is Cooling"

 ######## Turkish General Staff #######

 TurkeyArms.1.title:0 "Hilmi Özkök Becomes Chief of the General Staff"
 TurkeyArms.1.desc:0 "After years of service and leadership in the Turkish military, General Hilmi Özkök has been appointed Chief of the General Staff. His strategic acumen and tactical brilliance have earned him the respect of his peers and superiors alike. He now bears the responsibility of guiding the Turkish Armed Forces through these challenging times."
 TurkeyArms.1.a:0 "The Military Reorganizes"
 TurkeyArms.2.title:0 "Yaşar Büyükanıt Becomes Chief of the General Staff"
 TurkeyArms.2.desc:0 "In a momentous decision, General Yaşar Büyükanıt has been appointed the new Chief of the General Staff of the Turkish Armed Forces. His impressive military career and strong leadership have earned him this prestigious post, and he now bears the immense responsibility of safeguarding Turkey's interests."
 TurkeyArms.2.a:0 "The Military Reorganizes"
 TurkeyArms.3.title:0 "İlker Başbuğ Becomes Chief of the General Staff"
 TurkeyArms.3.desc:0 "In a significant turn of events, General İlker Başbuğ has become Chief of the General Staff of the Turkish Armed Forces. His exceptional military expertise and unwavering dedication to the nation have brought him to this prestigious post, and he now shoulders the crucial responsibility of protecting Turkey."
 TurkeyArms.3.a:0 "The Military Reorganizes"
 TurkeyArms.4.title:0 "Işık Koşaner Becomes Chief of the General Staff"
 TurkeyArms.4.desc:0 "In a momentous appointment, General Işık Koşaner has become Chief of the General Staff of the Turkish Armed Forces. His illustrious military career and proven leadership have earned him this esteemed post, and he now shoulders the critical responsibility of defending Turkey's sovereignty and guiding the nation through the treacherous complexities of global conflict."
 TurkeyArms.4.a:0 "The Military Reorganizes"
 TurkeyArms.5.title:0 "Necdet Özel Becomes Chief of the General Staff"
 TurkeyArms.5.desc:0 "In a historic appointment, General Necdet Özel has taken up the mantle of Chief of the General Staff of the Turkish Armed Forces. His distinguished military career and exemplary leadership have earned him this prestigious post, and he now carries the immense responsibility of safeguarding Turkey's interests."
 TurkeyArms.5.a:0 "The Military Reorganizes"
 TurkeyArms.6.title:0 "Hulusi Akar Becomes Chief of the General Staff"
 TurkeyArms.6.desc:0 "In a moment of historic significance, General Hulusi Akar has been appointed Chief of the General Staff of the Turkish Armed Forces. His distinguished military career and exceptional leadership have earned him this esteemed post."
 TurkeyArms.6.a:0 "The Military Reorganizes"
 TurkeyArms.7.title:0 "Yaşar Güler Becomes Chief of the General Staff"
 TurkeyArms.7.desc:0 "In a momentous decision, General Yaşar Güler has been appointed Chief of the General Staff of the Turkish Armed Forces. His exceptional military career and strategic brilliance have earned him this prestigious post."
 TurkeyArms.7.a:0 "The Military Reorganizes"
 TurkeyArms.8.title:0 "Metin Gürak Becomes Chief of the General Staff"
 TurkeyArms.8.desc:0 "In a momentous turn of events, General Metin Gürak has become Chief of the General Staff of the Turkish Armed Forces. His exceptional military career and strategic brilliance have earned him this prestigious post, and he now shoulders the critical responsibility of safeguarding Turkey's interests."
 TurkeyArms.8.a:0 "The Military Reorganizes"

 ######## Turkish Special Events #######

 TurkeyForeign.1.title:0 "Turkey's Growing Natural Gas Demand"
 TurkeyForeign.1.desc:0 "With natural gas demand in Turkey surging, Russia faces a critical decision on whether to go ahead with building the TurkStream pipeline. The project aims to meet Turkey's growing energy needs and deepen energy cooperation between Russia and Turkey."
 TurkeyForeign.1.b:0 "Plan Our Investments"
 TurkeyForeign.1.a:0 "We Are Not Investing"
 TurkeyForeign.2.title:0 "Russia Offers TurkStream"
 TurkeyForeign.2.desc:0 "Russia presents Turkey with a comprehensive plan for the TurkStream pipeline project. The proposal outlines the construction of an offshore pipeline to meet Turkey's growing natural gas demand and deepen energy cooperation between the two nations."
 TurkeyForeign.2.a:0 "Accept the Russian Proposal"
 TurkeyForeign.2.b:0 "We Don't Need This"
 TurkeyForeign.4.title:0 "Inviting Turkey to Join the Iraq War"
 TurkeyForeign.4.desc:0 "As the United States plans its strategy for the Iraq War in 2002, a crucial question arises: should Turkey be invited to join the coalition forces? We must weigh the advantages and risks of Turkey's involvement in the conflict."
 TurkeyForeign.4.a:0 "We Are Better Off Without Them!"
 TurkeyForeign.4.b:0 "Extend an Invitation for Military Cooperation"
 TurkeyForeign.6.title:0 "Our Consulate in Turkey Has Been Attacked!"
 TurkeyForeign.6.desc:0 "A grave incident has occurred in Turkey: our consulate has been attacked. The situation has raised tensions and poses a serious threat to our diplomatic relations with Turkey."
 TurkeyForeign.6.a:0 "What an Incident"
 TurkeyForeign.7.title:0 "Turkish-Russian Crisis: The Downed Jet"
 TurkeyForeign.7.desc:0 "A grave incident has occurred: Turkish forces have shot down a Russian military jet. The event has ignited a diplomatic firestorm and sharply raised tensions between the two nations."
 TurkeyForeign.7.a:0 "Assert Our Sovereignty"
 TurkeyForeign.7.b:0 "Apologize and Investigate"
 TurkeyForeign.8.title:0 "Turkey Shoots Down Our Jet"
 TurkeyForeign.8.desc:0 "A Russian military jet has been shot down by Turkish forces, costing us valuable assets and personnel. The incident has sparked a crisis, and Russia faces a critical decision on how to respond to this perceived act of aggression."
 TurkeyForeign.8.a:0 "This Is Not Acceptable!"
 TurkeyForeign.9.title:0 "Russian Jet Violates Our Airspace"
 TurkeyForeign.9.desc:0 "A Russian military jet has violated Turkish airspace, trespassing into our sovereign territory. The incident has ignited a diplomatic crisis, and Turkey faces a critical decision on how to respond to this provocation."
 TurkeyForeign.9.a:0 "Shoot It Down!"
 TurkeyForeign.9.b:0 "Refrain From Any Action"
 TurkeyForeign.10.title:0 "Turkey Asserts Its Position"
 TurkeyForeign.10.desc:0 "After the recent violation of Turkish airspace by a Russian military jet, Turkey is taking a firm stance to assert its sovereignty and protect its territorial integrity. The incident has raised tensions significantly."
 TurkeyForeign.10.a:0 "They Will Pay!"
 TurkeyForeign.10.b:0 "Let's Calm Down"
 TurkeyForeign.11.title:0 "Should We Send Ships to Palestine?"
 TurkeyForeign.11.desc:0 "Amid ongoing humanitarian concerns in Palestine and a desire to support the people of Gaza, a proposal has emerged in Turkey to send an aid flotilla to break the Israeli blockade of the Gaza Strip. Sending ships to Palestine is a weighty decision, with significant challenges and consequences for Turkey on the international stage."
 TurkeyForeign.11.a:0 "Sure"
 TurkeyForeign.11.b:0 "Nope"
 TurkeyForeign.12.title:0 "Responding to Turkish Ships Breaking the Blockade"
 TurkeyForeign.12.desc:0 "With Turkish ships repeatedly trying to break the Israeli blockade of the Gaza Strip, Israel faces a critical decision on how to respond. The situation poses a serious threat to the enforcement of the blockade and could escalate tensions between the two nations."
 TurkeyForeign.12.a:0 "Fire on Their Ship!"
 TurkeyForeign.12.b:0 "Refrain From Any Action"
 TurkeyForeign.13.title:0 "We Need Advanced SAM Systems"
 TurkeyForeign.13.desc:0 "Turkey faces a crucial decision on acquiring advanced surface-to-air missile (SAM) systems to bolster its air defenses. The options are the Russian-made S-400, the American-made Patriot, or acquiring neither."
 TurkeyForeign.13.a:0 "Order Patriots"
 TurkeyForeign.13.b:0 "A Joke? We Don't Need These"
 TurkeyForeign.14.title:0 "The United States Rejects the Offer"
 TurkeyForeign.14.desc:0 "In a surprising turn of events, the United States has officially rejected Turkey's request to buy the Patriot missile system. The decision comes amid heightened regional tensions and has added strain to Turkey's already complex relationship with the United States, possibly prompting a shift in its defense procurement strategy."
 TurkeyForeign.14.b:0 "Then We Are Not Buying Anything"
 TurkeyForeign.14.a:0 "Order S-400s"
 TurkeyForeign.15.title:0 "Russia Rejects the Offer"
 TurkeyForeign.15.desc:0 "In a surprising move, Russia has officially rejected Turkey's plan to acquire S-400 air defense systems. The decision comes amid rising tensions between the two countries and could strain their relations further."
 TurkeyForeign.15.a:0 "Then We Are Not Buying Anything"
 TurkeyForeign.16.title:0 "Turkey Wants to Buy Patriots"
 TurkeyForeign.16.desc:0 "To bolster its defenses and safeguard its sovereignty, Turkey has expressed a keen interest in acquiring cutting-edge Patriot missiles from the United States. The move comes amid rising regional tensions and an evolving security landscape."
 TurkeyForeign.16.a:0 "Sell Them"
 TurkeyForeign.16.b:0 "We Are Not Selling Them"
 TurkeyForeign.17.title:0 "Turkey Wants to Buy S-400s"
 TurkeyForeign.17.desc:0 "In a move that has drawn international attention and alarmed its NATO allies, Turkey has expressed a desire to buy the sophisticated S-400 air defense system from Russia. The decision comes amid shifting geopolitics and has further strained Turkey's relations with its Western partners."
 TurkeyForeign.17.a:0 "Time to Disrupt the West"
 TurkeyForeign.17.b:0 "We Are Not Selling Them"
 TurkeyForeign.18.title:0 "Perinçek Takes Control of Turkey"
 TurkeyForeign.18.desc:0 "After a series of political upheavals and a popular mandate, the charismatic and visionary politician Doğu Perinçek has risen to power in Turkey. His rise marks a major turning point in the nation's history, and he seeks to usher in a new era of cooperation and friendship with other nations."
 TurkeyForeign.18.a:0 "Interesting"

 ######## Turkish Special Events #######
 TurkeyF.1.title:0 "The Military Seizes Power"
 TurkeyF.1.desc:0 "Citing the unrest and protests across the country as grounds for a coup, the army has taken to the streets, and the powerless government quickly gave in. The army has announced that it will run an interim administration lasting about 3 years."
 TurkeyF.1.a:0 "Democracy Disrupted"
 TurkeyF.3.title:0 "Turkey Wants Gülen Returned"
 TurkeyF.3.desc:0 "Turkey has asked the United States to send Gülen back to Turkey. Sir, should we hand Gülen over to Turkey, or should we stand our ground, defend him and keep hosting him in our country?"
 TurkeyF.3.a:0 "He Is Staying in the United States"
 TurkeyF.3.b:0 "Send Him to Turkey"
 TurkeyF.4.title:0 "The United States Rejects Our Demands"
 TurkeyF.4.desc:0 "As we expected, the United States has rejected our demand, so Gülen will stay in the United States. This proves that the United States was behind the coup against our government."
 TurkeyF.4.a:0 "The United States wants to destroy us!"
 TurkeyF.5.title:0 "The United States Accepts Our Demands"
 TurkeyF.5.desc:0 "The United States has unexpectedly accepted our request, and the Gülen problem has been solved. Relations with America are taking positive steps forward."
 TurkeyF.5.a:0 "The United States is a friendly country"
 TurkeyF.6.title:0 "Brunson Arrested"
 TurkeyF.6.desc:0 "During the 15 July investigation, a "secret witness" testified against the evangelical pastor Brunson, who was arrested on the grounds that he was linked to the Gülenists and the PKK. Prosecutors sought up to 35 years in prison, including 20 years for "obtaining information that should remain confidential for the purposes of political or military espionage"."
 TurkeyF.6.a:0 "It Feels Good to Act"
 TurkeyF.7.title:0 "The American Reaction"
 TurkeyF.7.desc:0 "Sir, the Turks have arrested Brunson, our pastor, and put him on trial. Should we impose a series of sanctions to free him? Sanctions would badly damage our relations with Turkey."
 TurkeyF.7.a:0 "We want him back!"
 TurkeyF.7.b:0 "Don't risk our relations"
 TurkeyF.8.title:0 "The American Response"
 TurkeyF.8.desc:0 "The United States has announced that it will impose sanctions on us unless we hand Brunson over. Such sanctions would hit our economy hard and cost us votes. Sir, should we let Brunson go?"
 TurkeyF.8.a:0 "He stays!"
 TurkeyF.8.b:0 "All is lost! Send him back to the USA"
 TurkeyF.9.title:0 "Economy Minister Berat Albayrak Resigns"
 TurkeyF.9.desc:0 "Berat Albayrak announced in the evening that he was resigning as minister in charge of the economy. Erdogan accepted his resignation shortly afterwards. The country's economy is expected to improve thanks to this wise decision by Recep Tayyip Erdogan."
 TurkeyF.9.a:0 "The economy must improve!"
 TurkeyF.10.title:0 "The Republic of Turkey Invites Us to Unite"
 TurkeyF.10.desc:0 "The Republic of Turkey has invited us to unite with it, believing that unity will bring Turkic power to the world stage. Sir, shall we accept or not?"
 TurkeyF.10.a:0 "Accept It"
 TurkeyF.10.b:0 "Reject It"
 TurkeyF.11.title:0 "Azerbaijan Rejects Our Offer"
 TurkeyF.11.desc:0 "Azerbaijan has rejected our offer. Baku believes the merger would bring disorganization and disorder, and it does not want to risk its relations with Russia."
 TurkeyF.11.a:0 "Fine"
 TurkeyF.12.title:0 "The Founding of Turkic TV"
 TurkeyF.12.desc:0 "The Turkic Union has launched Turkic TV. Its programs are broadcast in Azerbaijani, Bosnian, Turkmen, Kazakh, Kyrgyz and Uzbek with Turkish subtitles, and include documentaries, talk shows, cultural and music programs as well as regional films and soap operas. Viewers can also learn Turkish through tutorials."
 TurkeyF.12.a:0 "Seems Nice"
 TurkeyF.13.title:0 "An Unacceptable Turkish Expansionist Ultimatum"
 TurkeyF.13.desc:0 "The Turks have sent us an ultimatum full of unacceptable conditions. War is near. Let the preparations begin!"
 TurkeyF.13.a:0 "We must defend our state!"
 TurkeyF.14.title:0 "Turkey Wants to Buy Batumi"
 TurkeyF.14.desc:0 "Turkey wants to buy the Batumi region from us. Should we sell it? Selling would help our economy, but it could also endanger our peace."
 TurkeyF.14.a:0 "Sell It"
 TurkeyF.14.b:0 "Batumi is ours"
 TurkeyF.15.title:0 "Georgia Rejects Our Offer for Batumi"
 TurkeyF.15.desc:0 "Georgia does not want us to grow stronger in the region, so it has rejected our offer for Batumi. They will not be able to stop a rising Turkey."
 TurkeyF.15.a:0 "Ah"
 TurkeyF.16.title:0 "NATO Equipment Standardization Vote"
 TurkeyF.16.desc:0 "NATO has called a vote among its members: if enough countries vote yes, NATO equipment will be standardized across all member states. If the vote passes, we will hear about it; if it fails, it will not even be mentioned again. The choice is yours."
 TurkeyF.16.a:0 "All NATO countries should use the same weapons"
 TurkeyF.16.b:0 "We don't need equipment standardization"
 TurkeyF.17.title:0 "NATO Industrialization Vote"
 TurkeyF.17.desc:0 "NATO has called a vote among its members. Countries that vote in favor will begin an industrialization program under NATO. The choice is yours."
 TurkeyF.17.a:0 "The NATO Industrialization Program Looks Good"
 TurkeyF.17.b:0 "We don't need the NATO Industrialization Program"
 TurkeyF.18.title:0 "NATO Armament Vote"
 TurkeyF.18.desc:0 "NATO has called a vote among its members. Countries that vote in favor will begin an armament program under NATO. The choice is yours."
 TurkeyF.18.a:0 "The NATO Armament Program Looks Good"
 TurkeyF.18.b:0 "We don't need the NATO Armament Program"
 TurkeyF.19.title:0 "The Turkish Unification Offer"
 TurkeyF.19.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.19.a:0 "Strength comes from unity"
 TurkeyF.19.b:0 "The offer is not tempting"
 TurkeyF.20.title:0 "The Turkish Unification Offer"
 TurkeyF.20.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.20.a:0 "Strength comes from unity"
 TurkeyF.20.b:0 "The offer is not tempting"
 TurkeyF.21.title:0 "The Turkish Unification Offer"
 TurkeyF.21.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.21.a:0 "Strength comes from unity"
 TurkeyF.21.b:0 "The offer is not tempting"
 TurkeyF.22.title:0 "The Turkish Unification Offer"
 TurkeyF.22.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.22.a:0 "Strength comes from unity"
 TurkeyF.22.b:0 "The offer is not tempting"
 TurkeyF.23.title:0 "The Turkish Unification Offer"
 TurkeyF.23.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.23.a:0 "Strength comes from unity"
 TurkeyF.23.b:0 "The offer is not tempting"
 TurkeyF.24.title:0 "The Karabakh Conflict"
 TurkeyF.24.desc:0 "The time has come to drive out the Armenians who took Karabakh from us. Karabakh belongs to Azerbaijan!"
 TurkeyF.24.a:0 "Hurrah!"
 TurkeyF.26.title:0 "The Turkish Diktat"
 TurkeyF.26.desc:0 "The Republic of Turkey is pressing hard for us to withdraw our guarantee over the Kurdish regions. If we do, the Kurdish regions will fall under Turkish rule and our power in the region will shrink. If we refuse, it could open a deep rift in NATO. Sir, what should we do?"
 TurkeyF.26.a:0 "Let the Turks destroy the Kurdish state"
 TurkeyF.26.b:0 "The Turks must leave the Kurds alone"
 TurkeyF.27.title:0 "The United States Accepts Our Invasion Plan"
 TurkeyF.27.desc:0 "The United States has given the green light to our war against the Kurds. It will withdraw its guarantee over Kurdistan, and we will enter the region."
 TurkeyF.27.a:0 "Time to Destroy the Kurdish State"
 TurkeyF.28.title:0 "The United States Rejects Our Invasion Plan"
 TurkeyF.28.desc:0 "The United States has given us a red light on our war against the Kurds. It will not withdraw its guarantee over Kurdistan, and if we go to war with the Kurds, we will be at war with the United States. That would open a rift in NATO and pave the way for other states to join the war."
 TurkeyF.28.a:0 "We don't care what the United States says"
 TurkeyF.29.title:0 "Turkey Wants to Buy the Islands"
 TurkeyF.29.desc:0 "An unexpected offer has come from Turkey: it wants to buy Greece's islands for a huge sum of 100 billion dollars. Sir, what do we make of this offer? Do we accept and give up the islands, or refuse to sell?"
 TurkeyF.29.a:0 "We Have to Give Up These Islands"
 TurkeyF.29.b:0 "A Ridiculous Offer"
 TurkeyF.30.title:0 "Greece Rejects Our Offer"
 TurkeyF.30.desc:0 "Greece does not seem to like our offer. Clearly we cannot take the islands without a war, so war with them will have to come soon."
 TurkeyF.30.a:0 "This is not good news for us"
 TurkeyF.31.title:0 "The Turkish Protection Offer"
 TurkeyF.31.desc:0 "Turkey is offering us protection on one condition: that we become its puppet state. If we accept, our national unity will suffer, but we will be strong against external threats. If we refuse, our national unity will grow, but we will be unable to do much against external threats. Sir, what should we do?"
 TurkeyF.31.a:0 "Accept Their Terms of Protection"
 TurkeyF.31.b:0 "Reject Their Terms of Protection"
 TurkeyF.32.title:0 "Bulgaria Rejects Our Conditional Protection"
 TurkeyF.32.desc:0 "Bulgaria has rejected our offer of conditional protection. We will have to leave Bulgaria alone."
 TurkeyF.32.a:0 "This is not good news for us"
 TurkeyF.33.title:0 "Turkey Wants to Partition Armenia"
 TurkeyF.33.desc:0 "A group of Turkish diplomats has come to us proposing to partition Armenia between Azerbaijan and Turkey. If we accept, we will go to war with Armenia together. If we refuse, peace with Armenia will continue."
 TurkeyF.33.a:0 "We Should Partition Armenia"
 TurkeyF.33.b:0 "We Must Stay at Peace With Our Neighbors"
 TurkeyF.34.title:0 "Baku Accepts Our Plan to Partition Armenia"
 TurkeyF.34.desc:0 "Baku has responded positively to our proposal to divide Armenia. It is time to move the Turkish Armed Forces to the Armenian border and partition Armenia with Azerbaijan."
 TurkeyF.34.a:0 "Time to Secure the East"
 TurkeyF.35.title:0 "Baku Rejects Our Plan to Partition Armenia"
 TurkeyF.35.desc:0 "Baku has rejected our plan to divide Armenia, showing little interest in our campaign. We will have to invade Armenia alone."
 TurkeyF.35.a:0 "We Must Secure the East Alone"
 TurkeyF.36.title:0 "The Unification of ANAP and DYP"
 TurkeyF.36.desc:0 "At a joint extraordinary congress of the DYP and ANAP, the two parties decided to merge. The center right is uniting, and a united center right will win a large share of the vote and a path to power."
 TurkeyF.36.a:0 "Awesome"
 TurkeyF.37.title:0 "Turkey Wants to Revive the Saadabad Pact"
 TurkeyF.37.desc:0 "Turkey wants to revive the Saadabad Pact. We can enter negotiations to bring it back, or prevent its revival by refusing to negotiate."
 TurkeyF.37.a:0 "No Need to Revive It"
 TurkeyF.37.b:0 "Sure"
 TurkeyF.38.title:0 "Tehran-Ankara Deals"
 TurkeyF.38.desc:0 "The agreement between Iran and Turkey has been officially signed. Under the deal, the two countries will protect each other: Turkey will guarantee Iran's independence, and Iran will guarantee Turkey's."
 TurkeyF.38.a:0 "Great News for Two Muslim Countries"
 TurkeyF.39.title:0 "Cairo-Ankara Deals"
 TurkeyF.39.desc:0 "The agreement between Egypt and Turkey has been officially signed. Under the deal, the two countries will protect each other: Turkey will guarantee Egypt's independence, and Egypt will guarantee Turkey's."
 TurkeyF.39.a:0 "Great News for Two Muslim Countries"
 TurkeyF.40.title:0 "Tour Turkey"
 TurkeyF.40.desc:0 "Mesut Yılmaz took to the streets, visiting ordinary people and shopkeepers and listening to their problems. People were delighted to see him, and the walkabout has turned into a political victory."
 TurkeyF.40.a:0 "Textbook Populism"
 TurkeyF.41.title:0 "A Referendum Demanded by Turkey"
 TurkeyF.41.desc:0 "Turkey is calling on us to hold a referendum on annexing the Kurdish region to Turkey. If we refuse, the guns will start firing on our borders and people will die. Sir, what shall we tell these Turks?"
 TurkeyF.41.a:0 "Acceptable"
 TurkeyF.41.b:0 "Freedom Or Death!"
 TurkeyF.42.title:0 "Declaration of War on the Northern Iraqi Government"
 TurkeyF.42.desc:0 "The Kurds have rejected our demands, so we will destroy their state with our Turkish Armed Forces."
 TurkeyF.42.a:0 "We Are Ready For War!"
 TurkeyF.43.title:0 "The Turkish Unification Offer"
 TurkeyF.43.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.43.a:0 "Strength comes from unity"
 TurkeyF.43.b:0 "The offer is not tempting"
 TurkeyF.44.title:0 "The Turkish Unification Offer"
 TurkeyF.44.desc:0 "After a series of conferences, the Turks have proposed a merger. Uniting would raise Turkic nationalism and Turkic power in the world, but it could also provoke opposition and rebellion against us."
 TurkeyF.44.a:0 "Strength comes from unity"
 TurkeyF.44.b:0 "The offer is not tempting"
 TurkeyF.45.title:0 "A Return to Tengrism"
 TurkeyF.45.desc:0 "Our country is returning to Tengrism. With this return, terrorism will decline and love of the Turkic nation will soar."
 TurkeyF.45.a:0 "The Traditional Faith Is Best!"
 TurkeyF.46.title:0 "Electing a Khan"
 TurkeyF.46.desc:0 "Today we choose our new Turkic khan. Sir, who will lead the Turks as the great Khagan? This choice will decide the fate of the Turks and of the world. Choose carefully."
 TurkeyF.46.a:0 "The Ülkücü Group"
 TurkeyF.46.b:0 "Aliyev Family"
 TurkeyF.46.c:0 "Chairman Erdoğan"
 TurkeyF.46.d:0 "Kazakh Leadership"
 TurkeyF.47.title:0 "Gülen Movement Links in Schools Purged"
 TurkeyF.47.desc:0 "Schools were screened for links to the Gülenist organization, and suspects were arrested one by one. Before long, under intense but lawful pressure, the suspects confessed. We will root out the organization's nests in our country one by one."
 TurkeyF.47.a:0 "Mission accomplished"
 TurkeyF.48.title:0 "Gülen Movement Links in the Police Purged"
 TurkeyF.48.desc:0 "Military teams screened police officers for links to the Gülenist organization, and suspects were arrested one by one. Before long, under intense but lawful pressure, the suspects confessed. We will root out the nests of this organization, which has even infiltrated our country's security forces, one by one."
 TurkeyF.48.a:0 "Mission accomplished"
 TurkeyF.49.title:0 "The Ankara-Tehran Anti-PKK Doctrine"
 TurkeyF.49.desc:0 "Iran has responded warmly to our overture, and your visit has produced an agreement with Tehran, as we knew it would. Under the agreement, the two countries will keep their troops on alert against the PKK threat."
 TurkeyF.49.a:0 "United Against Terror"
 TurkeyF.50.title:0 "The Ankara-Baghdad Anti-PKK Doctrine"
 TurkeyF.50.desc:0 "Iraq has responded warmly to our overture, and your visit has produced an agreement with Baghdad, as we knew it would. Under the agreement, the two countries will keep their troops on alert against the PKK threat."
 TurkeyF.50.a:0 "United Against Terror"
 TurkeyF.51.title:0 "Agreement With the Ülkücüs"
 TurkeyF.51.desc:0 "A CHP delegation visited Devlet Bahçeli, leader of the nationalists. After the visit, Bahçeli declared that he would direct the Ülkücüs to crush the PKK threat in the east."
 TurkeyF.51.a:0 "United and Armed Against Terror"
 TurkeyF.52.title:0 "An Invitation From Turkey"
 TurkeyF.52.desc:0 "After the normalization of relations between Greece and Turkey, an unexpected offer has come from Ankara: Turkey is founding a Mediterranean Bloc and wants us to join. Sir, what should we do about this strange offer? Are we no longer old enemies?"
 TurkeyF.52.a:0 "We Are Honored to Help Found This Alliance"
 TurkeyF.52.b:0 "This Alliance Is Absurd; Greco-Turkish Unity Is a Dream" 
 TurkeyF.54.title:0 "An Invitation From Turkey"
 TurkeyF.54.desc:0 "After the normalization of relations between Armenia and Turkey, an unexpected offer has come from Ankara: Turkey is founding a Mediterranean Bloc and wants us to join. Sir, what should we do about this strange offer? Are we no longer old enemies?"
 TurkeyF.54.a:0 "We Are Honored to Help Found This Alliance"
 TurkeyF.54.b:0 "This Alliance Is Absurd" 
