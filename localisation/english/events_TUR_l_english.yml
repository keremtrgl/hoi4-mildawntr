 FAQ_S_4:0 "Path Guide 4/10"
 FAQ_4_DESC:0 "§YOttoman Restoration§!\n§RDeadline: 1 January 2003.§! The decisions disappear after that.\n\n1. Open the decisions tab, §YSecret Plans of Islamist Restorationists§!.\n2. Take §YStrengthen the Great Ottoman Values§! and §YPrint Pro-Islamist Propaganda§! (50 PP, 25 days each).\n3. §YReplanning Initiative§! (50 PP, 25 days) needs the §Y2001 Economic Crisis§! focus to be finished.\n4. When all three plans have run their 25 days, take §YAuthorize the Great Plans§! (75 PP). The Ottoman tree loads.\n\nA plan only counts once its timer runs out, not when you click it."
 FAQ_S_5:0 "Path Guide 5/10"
 FAQ_S_6:0 "Path Guide 6/10"
 FAQ_S_7:0 "Path Guide 7/10"
 FAQ_S_8:0 "Path Guide 8/10"
 FAQ_S_9:0 "Path Guide 9/10"
 FAQ_S_10:0 "Path Guide 10/10"
 FAQ_5_DESC:0 "§YMilitary junta§!\nTwo ways in:\n\n§Y1.§! After the 2001 crisis, take the §YMilitary Plot§! successor focus (stability below 45%).\n\n§Y2.§! On the AKP path the army overthrows you when all of these hold: the military influence spirit is active, relations with the AKP are -25 or worse, §Ystability is below 20%§! and there are no general strikes.\n\nThe junta tree then ends in one of two ways:\n§YTurkish Officers Stage a Coup to Suspend Democracy§!: a permanent military regime (TSK tree).\n§YTurkish Elections§!: power goes back to the parties."
 FAQ_6_DESC:0 "§YConstitutional Court (AYM)§!\n1. Open the decisions tab, §YThe Constitutional Court§!.\n2. Push the court's politicisation above §Y75§! (it starts at 5): §YInvestigate the Government§!, §YInvestigate the Opposition§! and §YOverturn Elections§! give +10, §YRaise New Political Questions§! +5.\n3. The mission §YImminent Military Intervention in the AYM§! starts. §RKeep politicisation above 75 for 225 days.§! If it drops to 75 or below, the mission ends with nothing.\n4. When the mission runs out, §YThe Military Drama§! fires. Choose §YThe Military Must Not Be Able to Intervene§!. The AYM tree loads.\n\nThe military influence spirit must still be active."
 FAQ_7_DESC:0 "§YMafia, Anarchists and MİT§!\n§YFictional Reality§! must be on before 22 December 2000.\n\n§YThe Rahşan Amnesty§! fires between §Y22 December 2000 and 22 January 2001§!:\n§YMake Minor Changes to the Amnesty§!: the Mafia state.\n§YExpand the Amnesty Outright§!: the Anarchists.\n§YThe Scope of Amnesty Is Sufficient§!: the normal game.\n§RWith the setting off, a different event fires and both paths are lost.§!\n\n§YMİT§!: on the Mafia path, once the 2001 crisis is over, §YMİT's Secret Plan§! fires from §Y1 May 2003§!. Choose §YThis Mafia Government Must Be Destroyed§!."
 FAQ_8_DESC:0 "§YAtatürk§!\n§RNothing can happen before 10 January 2001.§! Fictional Reality must be on.\n\n1. Between §Y10 January 2001 and 10 May 2002§!, have §Ystability below 35%§! and §Yfewer than 25 factories§! (civilian, military and dockyards you own) on the same day. §YStrange Sounds From Atatürk's Mausoleum§! fires.\n2. §RWait.§! Three more events follow, no earlier than §Y10 May§!, §Y10 June§! and §Y10 July 2001§!.\n3. The last one loads the Atatürk tree. §YThe earliest he can return is 10 July 2001.§!\n\nNot possible on the Mafia, Anarchist or MİT paths. His first focus rebuilds your industry, and §YDeclare New Elections§! gives the CHP the government."
 FAQ_9_DESC:0 "§YHEPAR§!\n1. Open the decisions tab, §YOsman Pamukoğlu's Opinion§!. His opinion starts at 25 and must go above 49: §YNew Amnesty for General Peace§! (+20, 30 days) and §YRelease Convicted Kurds§! (+5, 3 days) are enough.\n2. Take §YPressure Osman Pamukoğlu to Enter Politics§! (50 PP). He founds his party.\n3. §RDo it before May 2002§!: in May 2002 his party gains 20% support.\n4. When his party (centre-right conservatives) leads the government, usually after an election, HEPAR takes over.\n\n§YÜlkücü regime§!\nOn the AKP path, get through §Y15 July 2016§!, then take §YVictory for All of Turkey§! and §YÜlkü Ocakları§!. Finish all 10 §YOrganize the Ülkücüs§! decisions, then §YÜlkücü Coup Attempt§! (150 PP)."
 FAQ_10_DESC:0 "§YReformed AKP§!\n1. Play the AKP path into 2007.\n2. Between May 2007 and May 2008 the 367 crisis and §YAKP Delegates Call for Reform§! fire. Choose §YAccept the Reform Plan§!.\n3. Win the 2007 presidential race with §YSabahattin Çakmakoğlu§! (his support must be above 50% when the result comes).\n4. After 22 June 2007 take §YThe 2007 Elections§!, then §YSecond Reformation of the AKP§!.\n\n§YCHP leaders§!\nOn the CHP path, §Y2023 CHP Internal Elections§! lets you choose Kılıçdaroğlu, Ekrem İmamoğlu or Mansur Yavaş.\n\n§gStill stuck? Ask on our Discord with the date, your path and a screenshot.§!"
