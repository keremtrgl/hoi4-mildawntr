 TurkeyF.230.desc:0 "In a major step to combat the growing threat of the mafias, the Turkish government led by MİT Chief Hakan Fidan has formally asked Russia for assistance and support in winning the war against organized crime. The appeal comes as the country faces mounting challenges from powerful criminal networks, prompting the authorities to seek international cooperation. Should we support them or not?"
 TurkeyF.230.a:0 "No, We Won't Help Them!"
 TurkeyF.230.b:0 "We Are Ready to Help Them!"
