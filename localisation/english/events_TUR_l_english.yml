l_english:

 ####### Turkish Local Events #######
 Turkey.1.title:0 "Operation Return to Life"
 Turkey.1.desc:0 "The prisoners' protests and hunger strikes have shown us that we need to grant some prisoners their freedom. Our government has to introduce a new amnesty bill. With this amnesty, our people will be satisfied and happy. Let us start the amnesty plans."
 Turkey.1.a:0 "It Looks Bad"
 Turkey.2.title:0 "The Turkish People's Expectations for the 2000s"
 Turkey.2.desc:0 "Our people want and dream of a much stronger Turkey in the 2000s. We hope to become strong and indestructible in the years to come."
 Turkey.2.a:0 "The 2000s Will Be Our Years!"
 Turkey.3.title:0 "The Turkish 2001 Economic Crisis"
 Turkey.3.desc:0 "On 19 February 2001, Prime Minister Ecevit emerged from a meeting with President Sezer saying, "This is a serious crisis." This underscored the financial and political instability and led to further panic in the markets. Stocks plummeted and the interest rate reached 3,000%. Large quantities of Turkish lira were exchanged for US dollars or euros, causing the Turkish central bank to lose 5 billion of its reserves. The crash triggered even more economic turmoil. In the first eight months of 2001, 14,875 jobs were lost, the dollar rose to 1,500,000 liras, and income inequality rose from its already high level."
 Turkey.3.a:0 "Oooh..."
 Turkey.4.title:0 "Air Disaster!"
 Turkey.4.desc:0 "16 May: a CASA military cargo plane produced by TAI crashed near Akçadağ, Malatya. 34 soldiers died, 10 of them Turkish."
 Turkey.4.a:0 "Bad News"
 Turkey.5.title:0 "Protests Against the Government"
 Turkey.5.desc:0 "Following the 2001 crisis, the Turkish people began protesting against the government in the streets. These events will be the end of our pro-western government."
 Turkey.5.a:0 "Ough..."
 Turkey.6.title:0 "Early Elections!"
 Turkey.6.desc:0 "In a vote in the General Assembly of the parliament, the motion for early elections was adopted by 449 of the 514 deputies who took part in the vote."
 Turkey.6.a:0 "Prepare the Ballot Boxes"
 Turkey.7.title:0 "Prime Minister Bülent Ecevit Taken to Hospital"
 Turkey.7.desc:0 "Prime Minister Bülent Ecevit fell ill in the Prime Ministry's central building and was taken to Başkent University Hospital."
 Turkey.7.a:0 "The Government Is Collapsing"
 Turkey.8.title:0 "Founding of the AKP"
 Turkey.8.desc:0 "After the closure of the right-wing Islamist Virtue (Fazilet) Party, some of its founders created a different party called the AKP. This party is moderately Islamist and originally worked with the Gülen movement."
 Turkey.8.a:0 "This party is a continuation of the Virtue Party"
 Turkey.9.title:0 "Rise of the AKP"
 Turkey.9.desc:0 "The AKP quickly began to gain power in the country. AKP rallies are packed with people. At this rate, the country will fall into the hands of the Islamists! Should we do something?"
 Turkey.9.a:0 "Push Anti-AKP Propaganda"
 Turkey.9.b:0 "Let It Go"
 Turkey.10.title:0 "Rise of the CHP"
 Turkey.10.desc:0 "Secular voters who supported our party have begun moving to the CHP. At this rate, our government will fall."
 Turkey.10.a:0 "Oh No!"
 Turkey.11.title:0 "Election Campaign"
 Turkey.11.desc:0 "The 15th Turkish general election was to be held on 3 November 2002, following the collapse of the DSP-MHP-ANAP coalition led by Bülent Ecevit. All 550 members of the Grand National Assembly were up for election."
 Turkey.11.a:0 "Let's Go!"
 Turkey.12.title:0 "Protests in Istanbul"
 Turkey.12.desc:0 "Many people in Istanbul protested against the United States' plans to invade Iraq. With this event, our people's opposition to the United States has increased enormously."
 Turkey.12.a:0 "Uncertain Times"
 Turkey.13.title:0 "A Wild Offer"
 Turkey.13.desc:0 "The United States has invited us to join the war against Iraq as a NATO force and announced that it will give us 6 billion dollars if we do. Sir, what should we do? Shall we join or not?"
 Turkey.13.a:0 "We Need 10 Billion"
 Turkey.13.b:0 "Let's Join the Operation!"
 Turkey.13.c:0 "We Respect the Independence of Iraq"
 Turkey.14.title:0 "Turkish Offer"
 Turkey.14.desc:0 "The Turkish government announces that it will withhold approval for the war unless the United States increases its 6 billion dollar foreign aid package to 10 billion."
 Turkey.14.a:0 "We Need Our Ally in Our Cause"
 Turkey.14.b:0 "No, We Are Better Off Without Them"
 Turkey.15.title:0 "United States Accepts"
 Turkey.15.desc:0 "The US has increased its 6 billion dollar foreign aid package to 10 billion so that we can join the so-called Operation Iraqi Freedom."
 Turkey.15.a:0 "We Are Ready for the Operation!"
 Turkey.16.title:0 "America Rejects"
 Turkey.16.desc:0 "The US has decided not to increase its 6 billion dollar foreign aid package to 10 billion, so we will not go to war with Iraq."
 Turkey.16.a:0 "No war, then."
 Turkey.17.title:0 "Rauf Denktaş Rejects the UN Plan for Cyprus Unification"
 Turkey.17.desc:0 "Rauf Denktaş, leader of the Turkish Cypriots, has rejected the latest version of a United Nations plan to reunite Cyprus, so Northern Cyprus remains independent."
 Turkey.17.a:0 "Nice"
 Turkey.19.title:0 "Recep Tayyip Erdoğan Is Elected to Parliament"
 Turkey.19.desc:0 "Recep Tayyip Erdoğan is elected to the Turkish parliament and is expected to become Prime Minister soon. Erdoğan supports deployment of US troops in Turkey and is expected to call for a new vote on the issue as one of his first official acts."
 Turkey.19.a:0 "Interesting"
 Turkey.20.title:0 "Turkish-US Crisis"
 Turkey.20.desc:0 "Turkish military personnel operating in northern Iraq were captured, led away with hoods over their heads and interrogated by the United States military."
 Turkey.20.a:0 "The USA will pay for this!"
 Turkey.21.title:0 "Victory in Eurovision"
 Turkey.21.desc:0 "Sertab Erener has won the Eurovision Song Contest with the song Everyway That I Can, Turkey's first victory in the contest. We are proud of her."
 Turkey.21.a:0 "Nice, nice, nice!"
 Turkey.22.title:0 "IBDA-C Bombings!"
 Turkey.22.desc:0 "Two more truck bombs exploded at the headquarters of HSBC Bank and the British Consulate, killing thirty people and wounding 400 others. The bombers appear to have waited for the traffic lights in front of the HSBC headquarters on Büyükdere Avenue in Levent to turn red to maximize the effect. Several Britons were killed in the two attacks, including the top British official in Istanbul, Consul General Roger Short, while the rest of the victims were mostly Turkish citizens (such as the actor and singer Kerem Yılmazer), as in the earlier synagogue bombings."
 Turkey.22.a:0 "Aman Tanrım"
 Turkey.23.title:0 "2004 Turkish Local Elections"
 Turkey.23.desc:0 "The Turkish local elections of 2004 were held throughout the eighty-one Provinces of Turkey on 28 March 2004 to elect both mayors and councilors to local government positions. All 16 metropolitan and 3,193 district municipalities were up for election, while 3,208 provincial and 34,477 municipal councilors were also elected. More than 50,000 neighborhood presidents (muhtars) were also elected, though these do not have any political affiliations."
 Turkey.23.a:0 "The people have spoken"
 Turkey.24.title:0 "Afyon Renamed Afyonkarahisar"
 Turkey.24.desc:0 "The name of Afyon province was changed to Afyonkarahisar."
 Turkey.24.a:0 "An Even Longer Name? OK"
 Turkey.25.title:0 "School Act"
 Turkey.25.desc:0 "President Ahmet Necdet Sezer approved the law adding temporary articles to the higher education law, known as the "student amnesty", which grants new rights to students who had been dismissed from universities."
 Turkey.25.a:0 "Let's Boost Education"
 Turkey.26.title:0 "A Syrian Missile Lands Inside Turkish Borders"
 Turkey.26.desc:0 "A Syrian missile landed in the Kırıkhan district of Hatay, exploding at two separate points 25 kilometres from the Syrian border. The Syrian General Staff informed the Turkish General Staff of the incident and expressed its regret."
 Turkey.26.a:0 "Sad"
 Turkey.27.title:0 "Another Protest, Another Assassination Attempt"
 Turkey.27.desc:0 "At the opening of the new academic year in Kütahya, a man named Mustafa Bağdat was detained while trying to protest against Prime Minister Recep Tayyip Erdoğan. A search revealed a gun hidden inside the bread the suspect was carrying in a bag. Mustafa Bağdat was arrested the next day."
 Turkey.27.a:0 "Aman Tanrım"
 Turkey.28.title:0 "Council of State Attack"
 Turkey.28.desc:0 "The Council of State building was attacked by gunmen. 1 killed, 4 injured."
 Turkey.28.a:0 "Terrorists!"
 Turkey.29.title:0 "The Republic Rallies"
 Turkey.29.desc:0 "Turkey's preservation and maintenance of its secular identity have been an issue and source of tension long before the demonstration. In the past, Prime Minister Recep Tayyip Erdoğan has spoken out against the active restrictions on wearing Islamic-style head scarves in government offices and schools and has taken steps to bolster religious institutions. According to Guardian Unlimited, Erdoğan showed his Islamist nature when he initiated a move in 2004 to criminalize adultery, which eventually failed under intense pressure from the secularist forces in the country and the European Union, which Turkey has been trying to join.\n\nGeneral Yaşar Büyükanıt, Chief of the Turkish General Staff, warned against Islamic fundamentalism in October 2006. Prime Minister Erdoğan replied that there was no such threat. In a press conference two days before the demonstration, Büyükanıt stated: "We hope that someone is elected president who is loyal to the principles of the republic — not just in words but in essence." This statement was widely interpreted as a hint from the General urging Erdoğan not to run.\n\nThe serving president, Ahmet Necdet Sezer, aimed a clear swipe at Erdoğan the day before the demonstrations by stating, "The threat which Islamic fundamentalism poses to the country is higher than ever."Although the post is mainly ceremonial, the Turkish president has the power to veto laws if he holds them to be in violation of the Constitution of Turkey, as well as to veto appointments to the highest positions of the state administration, such as the presidencies of universities and many public institutions. Sezer, a former chief of the Constitutional Court, did so many times during his years in office. In a recent poll by Hürriyet, a majority of the participants agreed with the president's assessment.\n\nOn April 24, foreign minister Abdullah Gül was announced as the official candidate of the Justice and Development Party, by Erdoğan. His candidacy was controversial from the beginning due to his background of two proscribed Islamic political parties, and his statement "We want to change the secular system", in an interview published by the Guardian in 1995. Nevertheless, additional concerns were also present, including the effect of the hijab-style clothing of his spouse on Turkey's image, who previously filed a case against Turkey for the ban on public buildings.\n\nOn 14 April the first protest took place in Tandoğan square in Ankara. The number of people gathering in front of Anıtkabir, the mausoleum of Mustafa Kemal Atatürk in Ankara, was cited as ranging from "hundreds of thousands" to 1.5 million people. The first protest was one of the largest that Turkey had seen in years until then. The target of the first protest was the possible presidential candidacy of the then Prime Minister Recep Tayyip Erdoğan (the outcome of which will be determined by the Turkish Grand National Assembly (unless the recent modifications to the constitution become ratified on time), in which Erdoğan's Justice and Development Party (AKP) has a healthy majority). Erdoğan decided not to run for president after the rally.\n\nThe slogan of the protest was Claim Your Republic. According to the Ministry of the General Staff of the Turkish Armed Forces, who administer Anıtkabir, 370,000 people visited the monument on that day, but eyewitness accounts from those who participated say that at least twice that amount was not able to enter the crowded grounds. Police announcements gave conflicting numbers ranging from about 70,000 to 150,000 participants which were criticized among police officials themselves stating "such announcements hurt the credibility of the department."CNN Türk spoke of more than 650,000 at the meeting.\n\nThe demonstrators had different motives, including the suspicion that Erdoğan, who is thought to be attached to political Islam, will alter the secular state. Erdoğan's government denies having an Islamic agenda, but according to CNN, some critics argue that the government is inching the country towards the increased religious rule. Erdoğan has had run-ins with the law in the past: He was tried and convicted for "inciting religious hatred" and had consequently served a four-month jail term in 2000 while he was the Mayor of Istanbul, Turkey's most populous city. According to the Guardian Unlimited, the pro-Islamic prime minister's party has been eroding secularists' longtime grip on power.\n\nThe protest was initiated by the "Atatürk Thought Association" and supported by around 300 non-governmental organizations in Turkey. First, some 60,000 people who traveled from all over Turkey by bus arrived at the protest in the early hours of Saturday, 14 April. People traveled by train and the residents of Ankara joined the protest overfilling Tandoğan Square and the nearby streets two hours before the official beginning. Among the protesters were also leaders of the opposition parties, Deniz Baykal (CHP), Zeki Sezer (DSP), and some professors of various universities wearing academic regalia. Protesters, waving the Turkish flag and carrying banners depicting Atatürk, chanted "Turkey is secular and will remain secular" and "We don't want an imam as president!" The demonstration in downtown Ankara ended at 13:00 local time (10:00 GMT). Afterward, the crowd marched to the Anıtkabir to pay their respect to the founder of the republic.\n\nDuring the demonstrations, flight above Tandoğan Square and Anıtkabir was banned. Twelve ambulances and eleven police APCs were kept on standby in the surrounding streets. A contingent of 10,000 police officers watched over the crowd, but the demonstration ended peacefully.\n\nAlthough the demonstrations received international media attention, all but one (Kanal Türk) of the local networks gave the demonstrations very little coverage. Habertürk director Melih Meriç said the lack of local coverage is because of political pressure."
 Turkey.29.a:0 "This is not good..."
 Turkey.30.title:0 "TSK's E-memorandum"
 Turkey.30.desc:0 "E-memorandum is a controversial General Staff statement released on its website in 2007 weighing in the Turkish presidential elections in 2007. The candidate that would most likely be elected was Abdullah Gül. Turkey's presidential office is regarded as the guardian of the country's secular system; the fact that Gül's wife wears the Islamic headscarf, as well as his history in political Islam, turned the elections into a political crisis. \n\nDuring the crisis, in April 2007, this statement was published on Turkish Armed Forces official website regarding the Turkish presidential elections:\n\n"The problem that emerged in the presidential election process is focused on arguments over secularism. Turkish Armed Forces are concerned about the recent situation. the Turkish Armed Forces are a party in those arguments and an absolute defender of secularism. Also, the Turkish Armed Forces are opposed to those arguments and negative comments. It will display its attitude and action openly and clearly whenever it is necessary ... Those who are opposed to Great Leader Mustafa Kemal Atatürk's understanding of 'How happy is the one who says I am a Turk' are enemies of the Republic of Turkey and will remain so. The Turkish Armed Forces maintain their sound determination to carry out their duties stemming from laws to protect the unchangeable characteristics of the Republic of Turkey. Their loyalty to this determination is absolute."\n\nThe e-memorandum term was coined by Ural Akbulut to describe the General Staff statement because it was published exclusively online."
 Turkey.30.a:0 "E-memorandum?"
 Turkey.31.title:0 "Victorious CHP"
 Turkey.31.desc:0 "As a result of the CHP's application, the Constitutional Court annulled the first round of the presidential election, finding it unconstitutional."
 Turkey.31.a:0 "Damn"
 Turkey.32.title:0 "Terrorist Attack in Şırnak"
 Turkey.32.desc:0 "A passenger minibus was hit by PKK militants near the village of Başağaç in the Beytüşşebap district of Şırnak, killing and injuring 13 people. It was announced that 7 of the dead were village guards."
 Turkey.32.a:0 "Aman Tanrım"
 Turkey.33.title:0 "Strikes at Türk Telekom"
 Turkey.33.desc:0 "For the first time in history, Türk Telekom workers across Turkey have gone on strike."
 Turkey.33.a:0 "Aman Tanrım"
 Turkey.34.title:0 "A Referendum for the People"
 Turkey.34.desc:0 "A referendum was held in Turkey on electing the president by popular vote. The result was yes: the president will no longer be elected by Parliament."
 Turkey.34.a:0 "Nice"
 Turkey.35.title:0 "Battle with Al-Qaeda"
 Turkey.35.desc:0 "In 13 hours of operations against al-Qaeda in Gaziantep, 25 militants were captured, 2 of them dead. 1 police officer died."
 Turkey.35.a:0 "The Terrorists Have Been Cleared Out"
 Turkey.36.title:0 "Deputies Ask for the Headscarf Ban to Continue"
 Turkey.36.desc:0 "CHP and DSP deputies and Tunceli independent MP Kamer Genç applied to the Constitutional Court for the continuation of the headscarf ban in Turkey."
 Turkey.36.a:0 "They are going to fail"
 Turkey.37.title:0 "2008 AKP Closure Case"
 Turkey.37.desc:0 "On 18 March 2008, documents requesting a closure trial of the ruling AKP were presented to the Constitutional Court of Turkey. On 31 May 2008, the Constitutional Court announced that it would accept the indictment of the Chief Public Prosecutor of the Supreme Court of Appeals, Abdurrahman Yalçınkaya, and hear the case concerning the closure of the party. As for banning politicians, the indictment cited 61 speeches and actions by Erdoğan, 16 for Arınç, and 10 for Gül when he was Minister of Foreign Affairs."
 Turkey.37.a:0 "Unacceptable"
 Turkey.38.title:0 "Delay for Türksat 3A"
 Turkey.38.desc:0 "The Türksat 3A satellite launch was delayed due to a last-minute malfunction."
 Turkey.38.a:0 "Fine"
 Turkey.39.title:0 "Türksat 3A Launched Successfully!"
 Turkey.39.desc:0 "Türksat 3A was successfully launched into space at 01:05 Turkish time. Our country is developing and will continue to develop!"
 Turkey.39.a:0 "A Major Development"
 Turkey.40.title:0 "Murder of Ahmet Yıldız"
 Turkey.40.desc:0 "Marmara University Physics Department student Ahmet Yildiz filed a criminal complaint with the prosecutor about a year before the incident because he had received threats from his family. On the night of 15 July 2008, Yildiz, who had gone to a cafe, faced the attacker following which he tried to get out of his car and escape. He was shot three times in the chest and eventually died from his injuries. Out of the five bullets that were shot, one injured the AKP's nominee for parliament Ümmühan Daraca. Commenting after the incident, Yildiz's cousin Ahmet Kaya said, "Yildiz was the only son of an extremely religious and wealthy Kurdish family in Şanliurfa". Lambda Istanbul's human rights lawyer Firat Söyle, who had previously served as a consultant to Yildiz, said that three months before the murder, Yildiz filed a complaint with the district attorney's office after receiving death threats from his family, but the prosecutor's office refused to initiate an investigation or provide protection to Yildiz. Yildiz's murder event had wide repercussions in the local and foreign press."
 Turkey.40.a:0 "Rest In Peace"
 Turkey.41.title:0 "Istanbul Bombings"
 Turkey.41.desc:0 "The 2008 Istanbul bombings occurred on 27 July 2008, when two explosions hit a busy pedestrian shopping street in the Güngören district of Istanbul, killing seventeen people, five of them children, and injuring 154. The bombings were the deadliest attacks on civilians in Turkey since the 2003 Istanbul bombings five years earlier.\n\nThe first of the two bombs was a sound bomb placed in a telephone booth, and the second was placed in a waste container 50 metres away, near a crowded street. The first bomb caused crowds to gather to help and out of curiosity, and around 10 minutes later the second, more powerful bomb exploded, causing many casualties. The police believe the bombs were detonated remotely. Political analyst Damla Aras said: "There is a possibility they might be A4 or C-4 explosives, which were brought from northern Iraq by the PKK and have been used several times in Turkey.""
 Turkey.41.a:0 "Aman Tanrım"
 Turkey.42.title:0 "Constitutional Court Lets the AKP Live"
 Turkey.42.desc:0 "With only 6 members voting for closure (7 would have been needed), the Court rejected the prosecutor's demands and did not ban the party. The court delivered its verdict rejecting the demand, and the case against the Justice and Development Party was dropped. The European Union was relieved by the decision of Turkey's highest court not to ban the ruling AKP. Joost Lagendijk, a member of the European Parliament who works on Turkey, said: "Everybody is very happy with this decision; otherwise it would have created a hell of a situation for Turkey." The trial had started 4.5 months earlier."
 Turkey.42.a:0 "Great"
 Turkey.43.title:0 "A Building Collapses in Konya"
 Turkey.43.desc:0 "A 3-storey illegal religious education dormitory built by a private foundation in the town of Balcılar in the Taşkent district of Konya collapsed at 03:45 due to an LPG leak: 18 dead and 27 injured."
 Turkey.43.a:0 "Aman Tanrım"
 Turkey.44.title:0 "PKK Attack"
 Turkey.44.desc:0 "The Aktütün gendarmerie outpost in the Şemdinli district of Hakkari was attacked by the PKK with heavy weapons."
 Turkey.44.a:0 "When will these terror attacks end?"
 Turkey.45.title:0 "Erdoğan Leaves the Davos Forum"
 Turkey.45.desc:0 "Prime Minister Recep Tayyip Erdoğan, who attended the session "Gaza: The Case for Middle East Peace" at the World Economic Forum in Davos, Switzerland, left the session because he was not given enough time to speak. After the incident, Erdoğan announced that he would no longer attend the Davos meetings."
 Turkey.45.a:0 "Oough..."
 Turkey.46.title:0 "Democratic Society Party Co-Chairs Speak Kurdish"
 Turkey.46.desc:0 "Democratic Society Party co-chairs Ahmet Türk and Selahattin Demirtaş addressed their party's group meeting in Kurdish from the podium. The Ankara Chief Prosecutor's Office opened an investigation, which concluded on 15 April with a decision not to prosecute."
 Turkey.46.a:0 "Eh"
 Turkey.47.title:0 "Turkish Airlines Flight 1951"
 Turkey.47.desc:0 "The aircraft, a Turkish Airlines Boeing 737-800 flying from Istanbul, crashed into a field approximately 1.5 kilometres (0.9 mi) north of the Polderbaan runway (18R), before crossing the A9 motorway, at 09:26 UTC. The aircraft broke into three pieces on impact. The wreckage did not catch fire. \n\nThe crash was caused primarily by the aircraft's automated reaction to a faulty radio altimeter, which made the autothrottle reduce engine power to idle during the approach. The crew noticed this too late to increase thrust and recover the aircraft before it stalled and crashed. Boeing has since issued a bulletin reminding pilots of all 737 series and BBJ aircraft of the importance of monitoring airspeed and altitude, advising against using the autopilot or autothrottle for landing when radio altimeter readings disagree."
 Turkey.47.a:0 "A Bad Accident"
 Turkey.48.title:0 "Championship at the European Indoor Athletics"
 Turkey.48.desc:0 "Alemitu Bekele becomes the European champion in the 3000 meters at the 2009 European Indoor Athletics Championships. We are proud of her."
 Turkey.48.a:0 "Nice, nice, nice!"
 Turkey.49.title:0 "A Helicopter Carrying Muhsin Yazıcıoğlu Has Crashed"
 Turkey.49.desc:0 "A helicopter carrying Muhsin Yazıcıoğlu, leader of the Great Unity Party, and 5 other people crashed in the countryside of Kahramanmaraş. There were no survivors. The wreckage was reached on 27 March."
 Turkey.49.a:0 "Aman Tanrım"
 Turkey.51.title:0 "Criminal Court Restores Necmettin Erbakan's Rights"
 Turkey.51.desc:0 "The Ankara 9th High Criminal Court restored the political rights of Necmettin Erbakan, who had been sentenced to prison."
 Turkey.51.a:0 "The court has spoken..."
 Turkey.52.title:0 "US-Turkey Visits"
 Turkey.52.desc:0 "US President Barack Obama addressed lawmakers from the parliamentary podium. The Associated Press reported that it was Obama's first visit to a Muslim-majority country as president."
 Turkey.52.a:0 "Better relations with the USA make us stronger"
 Turkey.53.title:0 "1 May Declared Labour and Solidarity Day"
 Turkey.53.desc:0 "With a decision taken in Parliament, 1 May became a public holiday called "Labour and Solidarity Day"."
 Turkey.53.a:0 "The workers have their day back!"
 Turkey.54.title:0 "Democratic Society Party Protests in Parliament"
 Turkey.54.desc:0 "MPs from the Democratic Society Party staged a sit-in in the parliament hall."
 Turkey.54.a:0 "Not Good"
 Turkey.55.title:0 "1 May Celebrations"
 Turkey.55.desc:0 "For the first time in 31 years, since 1978, May Day was celebrated again in Taksim Square. From 1979 onwards, celebrations in Taksim Square had not been allowed because of martial law."
 Turkey.55.a:0 "Workers in action!"
 Turkey.56.title:0 "Operation Return to Life Cases Dropped"
 Turkey.56.desc:0 "The case against 196 prisoners involved in the 2000 Operation Return to Life at Bayrampaşa prison expired under the statute of limitations and was dropped."
 Turkey.56.a:0 "Now they are free"
 Turkey.58.title:0 "First Swine Flu Case"
 Turkey.58.desc:0 "The first case of swine flu in Turkey has been observed in Istanbul. Swine flu can now easily spread all over Turkey."
 Turkey.58.a:0 "Ough..."
 Turkey.59.title:0 "TEKEL Workers' Action"
 Turkey.59.desc:0 "The TEKEL workers' action began on 15 December 2009 when TEKEL workers, members of the Tek Gıda-İş union affiliated with Türk-İş, launched a protest in Ankara. It was the largest mass walkout by workers in Turkey since 1980. In addition to dominating the national agenda and being supported by a wide range of people, the action also gained international support."
 Turkey.59.a:0 "Another day, another protest"
 Turkey.60.title:0 "Constitutional Court Shuts Down the DTP"
 Turkey.60.desc:0 "The Constitutional Court has unanimously decided to close the Democratic Society Party."
 Turkey.60.a:0 "The Constitutional Court has made its decision"
 Turkey.61.title:0 "Istanbul Becomes a European Capital of Culture for 2010"
 Turkey.61.desc:0 "Istanbul, together with Essen and Pécs, became a European Capital of Culture for 2010."
 Turkey.61.a:0 "Great News"
 Turkey.62.title:0 "Rocket Attack on Turkish Navy Guards"
 Turkey.62.desc:0 "A Navy unit in İskenderun was attacked with a rocket launcher during the changing of the guard. 6 soldiers were killed and 7 wounded, 3 of them seriously."
 Turkey.62.a:0 "Aman Tanrım"
 Turkey.64.title:0 "Response to Israel's Attack on the MV Mavi Marmara"
 Turkey.64.desc:0 "Parliament adopted a declaration condemning Israel's attack on the MV Mavi Marmara."
 Turkey.64.a:0 "Nice response"
 Turkey.63.title:0 "PKK Attack in Istanbul"
 Turkey.63.desc:0 "The PKK carried out a bomb attack on a military service vehicle in the Halkalı district of Istanbul. 5 people died: a high school student and 4 soldiers."
 Turkey.63.a:0 "Aman Tanrım"
 Turkey.65.title:0 "Murat Başesgioğlu Resigns from the AKP"
 Turkey.65.desc:0 "Murat Başesgioğlu resigned from the Justice and Development Party over his opposition to the party's parliamentary policies."
 Turkey.65.a:0 "The AKP's loss"
 Turkey.66.title:0 "Operation Sledgehammer (Coup Plan) Indictment Accepted"
 Turkey.66.desc:0 "The Istanbul 10th High Criminal Court accepted the indictment in the Sledgehammer coup plan case. The indictment listed 196 military personnel as suspects, and arrest warrants were issued for 102 of them."
 Turkey.66.a:0 "There will never be another coup in the Turkish Republic!"
 Turkey.68.title:0 "PKK Attack in Dörtyol"
 Turkey.68.desc:0 "A police vehicle was attacked by the PKK in the Dörtyol district of Hatay, and 4 police officers died. During the officers' funerals, unrest broke out in Dörtyol and İnegöl."
 Turkey.68.a:0 "Aman Tanrım"
 Turkey.67.title:0 "Anti-Terrorist Law Has Been Accepted"
 Turkey.67.desc:0 "The President approved an amendment to the Anti-Terrorism Law covering the children publicly known as the "stone-throwing children"."
 Turkey.67.a:0 "Aman Tanrım"
 Turkey.69.title:0 "Constitutional Referendum Result: YES"
 Turkey.69.desc:0 "A constitutional referendum on a number of changes to the constitution was held in Turkey on 12 September 2010. The results showed the majority supported the constitutional amendments, with 58% in favour and 42% against. The changes were aimed at bringing the constitution into compliance with European Union standards. Supporters of Turkish EU membership hope constitutional reform will facilitate the membership process."
 Turkey.69.a:0 "To The European Union!"
 Turkey.70.title:0 "The Turkish Consulate in Thessaloniki Has Been Attacked"
 Turkey.70.desc:0 "The Turkish consulate in Thessaloniki, Greece, was attacked with a Molotov cocktail."
 Turkey.70.a:0 "They are going to pay for this"
 Turkey.71.title:0 "Council of Higher Education Acts"
 Turkey.71.desc:0 "The Council of Higher Education (YÖK) banned the removal of headscarved students from classes at Istanbul University."
 Turkey.71.a:0 "Nice"
 Turkey.72.title:0 "The European Court of Human Rights Finds Turkey Guilty"
 Turkey.72.desc:0 "The European Court of Human Rights found Turkey guilty in 19 cases filed by Greek Cypriots. Turkey had to pay the claimants 15 million euros in pecuniary and non-pecuniary damages and 160 thousand euros in court costs."
 Turkey.72.a:0 "They are simply biased"
 Turkey.73.title:0 "Turkey's First Digital Library Opens"
 Turkey.73.desc:0 "Turkey's first digital library was opened in the Esenler district of Istanbul."
 Turkey.73.a:0 "Good"
 Turkey.74.title:0 "Terrorist Attack"
 Turkey.74.desc:0 "A suicide bomber attacked a police vehicle in Istanbul's Taksim Square. 32 people were injured, 15 of them police officers."
 Turkey.74.a:0 "Aman Tanrım"
 Turkey.75.title:0 "Haydarpaşa Terminal Burns"
 Turkey.75.desc:0 "A fire caused by carelessness during the building's restoration destroyed the roof and the 4th floor of the terminal building. Three people were sentenced to ten months in prison for "recklessly causing the fire"."
 Turkey.75.a:0 "We should repair the historic building"
 Turkey.76.title:0 "Council of Ministers Makes the National Anthem Public Domain"
 Turkey.76.desc:0 "The Council of Ministers' decision to make the national anthem public domain came into force. According to the decision, "No real or legal person, institution, organization or union shall be charged for reproducing, distributing, performing or transmitting the National Anthem to the public by means of signs, sound or image transmission.""
 Turkey.76.a:0 "That sounds good"
 Turkey.77.title:0 "MV Mavi Marmara Returns to Istanbul Harbour"
 Turkey.77.desc:0 "The MV Mavi Marmara returned to Istanbul harbour on 26 December 2010 in a welcoming ceremony attended by thousands."
 Turkey.77.a:0 "Great"
 Turkey.78.title:0 "Explosions at the Ankara OSTİM Industrial Zone"
 Turkey.78.desc:0 "Two explosions occurred 8 hours apart at the Ankara OSTİM industrial zone. 20 people died."
 Turkey.78.a:0 "Aman Tanrım"
 Turkey.79.title:0 "Two Ferries Return to Turkey from Libya"
 Turkey.79.desc:0 "Due to the Libyan uprising, two ferries named Osmangazi and Orhangazi brought about 2 thousand Turkish citizens from Libya to the port of Marmaris."
 Turkey.79.a:0 "The situation in Libya is desperate"
 Turkey.80.title:0 "The Book "The Imam's Army" Has Been Banned"
 Turkey.80.desc:0 "The Imam's Army is a book by Turkish journalist Ahmet Şık. Before it was published, the draft was seized by the government and banned, with the claim that it was an "illegal organizational document" of the secret Ergenekon organization."
 Turkey.80.a:0 "Better that it is banned"
 Turkey.81.title:0 "Turkish General Election"
 Turkey.81.desc:0 "Turkey's 24th general election was held on 12 June 2011 to elect the 550 members of the Grand National Assembly. In accordance with the result of the constitutional referendum held in 2007, the election was held four years after the previous one instead of five."
 Turkey.81.a:0 "Prepare the Ballot Boxes"
 Turkey.82.title:0 "Parliamentary Oath Crisis"
 Turkey.82.desc:0 "The Justice and Development Party (AKP) and the Nationalist Movement Party (MHP) took part in the swearing-in ceremony in parliament, while the deputies of the Peace and Democracy Party (BDP), who had won the election as independents, did not. The CHP deputies also did not take the oath, except for Oktay Ekşi."
 Turkey.82.a:0 "Ah, a crisis!"
 Turkey.83.title:0 "Kurdish Terrorist Attack"
 Turkey.83.desc:0 "3 people were killed and 34 injured in a bomb attack in Ankara's Kızılay district. The TAK (Kurdistan Freedom Hawks) later claimed responsibility for the attack."
 Turkey.83.a:0 "Aman Tanrım"
 Turkey.84.title:0 "2011 Hakkâri Attack"
 Turkey.84.desc:0 "The 2011 Hakkâri attacks occurred on the night of 19 October 2011, when over 100 Kurdistan Workers' Party (PKK) fighters killed 26 Turkish soldiers in Hakkâri Province. It was reportedly the deadliest PKK attack on Turkish security forces since the Bingöl massacre, in which 33 unarmed recruits were killed. The PKK said the attack was revenge for a high-ranking PKK commander killed earlier in Turkish operations in Iraqi Kurdistan. \n\nAccording to Turkish media, Turkish security forces killed 49 PKK fighters in retaliation over the following days. \n\nAccording to Turkish authorities, the attack was carried out by the Syrian branch of the PKK, led by Dr. Bahoz Erdal."
 Turkey.84.a:0 "Aman Tanrım"
 Turkey.85.title:0 "The Oda TV Case"
 Turkey.85.desc:0 "4 detained journalists, Nedim Şener, Ahmet Şık, Sait Çakır and Coşkun Musluk, were released as part of the Oda TV case."
 Turkey.85.a:0 "Understandable"
 Turkey.86.title:0 "Afghanistan War Incident"
 Turkey.86.desc:0 "16 March: a helicopter carrying Turkish soldiers serving in NATO's International Security Assistance Force (ISAF) in Afghanistan crashed due to a technical failure during landing. 12 Turkish soldiers died in the incident."
 Turkey.86.a:0 "Aman Tanrım"
 Turkey.87.title:0 "Military Incident"
 Turkey.87.desc:0 "25 soldiers died in an explosion at a military depot in Afyonkarahisar."
 Turkey.87.a:0 "Aman Tanrım"
 Turkey.88.title:0 "The United States Embassy Is Bombed"
 Turkey.88.desc:0 "The United States Embassy in the capital, Ankara, has been bombed, killing 2 people. The radical left-wing Revolutionary People's Liberation Party-Front (DHKP-C) has claimed responsibility for the bombing."
 Turkey.88.a:0 "The US is on the right side for us"
 Turkey.89.title:0 "Gezi Park Protests"
 Turkey.89.desc:0 "A wave of demonstrations and civil unrest in Turkey began on 28 May 2013, initially to contest the urban development plan for Istanbul's Taksim Gezi Park. The protests were sparked by outrage at the violent eviction of a sit-in at the park protesting the plan. Subsequently, supporting protests and strikes took place across Turkey over a wide range of concerns, at the core of which were freedom of the press, expression and assembly, as well as the Islamist government's erosion of Turkey's secularism. With no centralized leadership beyond the small assembly that organized the original environmental protest, the protests have been compared to the Occupy movement and the events of May 1968. Social media played a key part in the protests, not least because much of the Turkish media downplayed them, particularly in the early stages. Three and a half million people (out of Turkey's population of 80 million) are estimated to have taken an active part in almost 5,000 demonstrations across Turkey connected with the original Gezi Park protest. Twenty-two people were killed and more than 8,000 were injured, many critically.\n\nThe sit-in at Taksim Gezi Park was restored after the police withdrew from Taksim Square on 1 June and developed into a protest camp, with thousands of protesters in tents organizing a library, a medical centre, food distribution and their own media. After the Gezi Park camp was cleared by riot police on 15 June, protesters began to meet in other parks all around Turkey and organized public forums to discuss the way forward for the protests. Turkish Prime Minister Recep Tayyip Erdoğan dismissed the protesters as "a few looters" on 2 June. Police suppressed the protests with tear gas and water cannon. In addition to the deaths and over 8,000 injuries, more than 3,000 arrests were made. Police brutality and the overall absence of government dialogue with the protesters were criticized by some foreign governments and international organizations.\n\nThe protesters were described as a broad range of people, encompassing both right- and left-wing individuals. Their complaints ranged from the original local environmental concerns to issues such as the authoritarianism of Recep Tayyip Erdoğan, restrictions on alcohol, a recent row about kissing in public, and the war in Syria. Protesters called themselves çapulcu (looters), reappropriating Erdoğan's insult (and coined the derivative "chapulling", meaning "fighting for your rights"). Many Twitter users also changed their screen names to include çapulcu. According to various analysts, the protests were the most challenging events of Erdoğan's ten years in power and the most significant nationwide unrest in decades."
 Turkey.89.a:0 "Disaster!"
 Turkey.90.title:0 "The Turkish Lira Falls on World Currency Markets"
 Turkey.90.desc:0 "The Turkish lira has fallen on world currency markets following the Central Bank's moves to halt capital flight, and Prime Minister Erdoğan is facing strong criticism as a result."
 Turkey.90.a:0 "Bad News"
 Turkey.91.title:0 "Protests for Berkin Elvan"
 Turkey.91.desc:0 "Protests are being held in Turkey and many other countries for 15-year-old Berkin Elvan, who was killed by a tear gas canister fired by police during the Gezi Park events."
 Turkey.91.a:0 ":("
 Turkey.92.title:0 "2015 Istanbul Suicide Bombing"
 Turkey.92.desc:0 "On 6 January 2015, Diana Ramazova from Dagestan detonated a bomb vest at a police station in Istanbul's central Sultanahmet district, near the Blue Mosque and Hagia Sophia. The attack killed Ramazova and injured two police officers, one of whom later succumbed to his wounds. Ramazova was the pregnant widow of a Norwegian-Chechen ISIS fighter in Syria who had been killed in December 2014."
 Turkey.92.a:0 "Aman Tanrım"
 Turkey.93.title:0 "We Have Closed Our Embassy in Yemen"
 Turkey.93.desc:0 "Amid rising tensions in Yemen, Turkey has closed its embassy. The ambassador and embassy staff have returned to Turkey."
 Turkey.93.a:0 "The situation in Yemen is desperate"
 Turkey.94.title:0 "Fighting in Parliament"
 Turkey.94.desc:0 "A fight broke out in a closed session of the General Assembly of the parliament during the debate on the "Internal Security Package", and 4 deputies were injured."
 Turkey.94.a:0 "Ough..."
 Turkey.95.title:0 "USA-Turkey Agreement"
 Turkey.95.desc:0 "Turkey and the United States signed an agreement on a training program for the Syrian opposition."
 Turkey.95.a:0 "The Syrian opposition should have the power to overthrow the Assad regime"
 Turkey.96.title:0 "Operation Shah Euphrates"
 Turkey.96.desc:0 "The Turkish Armed Forces entered Syria in Operation Shah Euphrates. 40 Turkish soldiers, the remains of Süleyman Şah and other items of spiritual value were removed from the tomb, and the outpost near the tomb was destroyed with explosives. One soldier died in the operation."
 Turkey.96.a:0 "Aman Tanrım"
 Turkey.97.title:0 "Military Incident"
 Turkey.97.desc:0 "Two RF-4E Phantom II reconnaissance aircraft, which took off from the Main Jet Base for night flight training, collided and crashed while descending to land near the village of İkinciler in the Akçadağ district. 4 officers died in the accident."
 Turkey.97.a:0 "Aman Tanrım"
 Turkey.98.title:0 "The 100th Anniversary of the Gallipoli Campaign"
 Turkey.98.desc:0 "The 100th anniversary of the Gallipoli campaign was commemorated in Çanakkale and Istanbul."
 Turkey.98.a:0 "Our ancestors fought hard"
 Turkey.99.title:0 "Turkish Armed Forces Clash with the PKK"
 Turkey.99.desc:0 "In the village of Yukarıtütek in the Diyadin district of Ağrı, soldiers providing security for a tree planting event clashed with members of the PKK. After 12 hours of fighting, 4 soldiers were injured and 5 PKK members were killed."
 Turkey.99.a:0 "We need to clear out these terrorists"
 Turkey.100.title:0 "The European Parliament Adopted A Draft Resolution Against Us!"
 Turkey.100.desc:0 "The European Parliament adopted by majority vote a draft resolution describing the Armenian events of 1915 as "genocide"."
 Turkey.100.a:0 "We don't need to be in the EU anymore"
 Turkey.101.title:0 "Explosions at the Rallies"
 Turkey.101.desc:0 "2 people were killed in an explosion during a rally of the Peoples' Democratic Party in Diyarbakır."
 Turkey.101.a:0 "Aman Tanrım"
 Turkey.102.title:0 "Turkish General Elections"
 Turkey.102.desc:0 "The June 2015 Turkish general election took place on 7 June 2015 in all 85 electoral districts of Turkey to elect the 550 members of the Grand National Assembly. It was the 25th general election in the history of the Turkish Republic, electing the country's 25th Parliament. The result was the first hung parliament since the 1999 general election. Unsuccessful attempts to form a coalition government led to a snap general election being called for November 2015."
 Turkey.102.a:0 "Let's Prepare the Ballot Boxes"
 Turkey.103.title:0 "Council of State Overturns the Cancellation"
 Turkey.103.desc:0 "In the summer of 2013, the Council of State overturned the cancellation of the Taksim pedestrianization project, including the Artillery Barracks that had sparked the Gezi Park protests, and ruled that the case should be decided again."
 Turkey.103.a:0 "That's Interesting"
 Turkey.104.title:0 "Police Attack the LGBT Pride March"
 Turkey.104.desc:0 "A Pride march was held with the participation of LGBT individuals. Police intervened in the march and arrested some people."
 Turkey.104.a:0 "Eh"
 Turkey.105.title:0 "Erdoğan Gives Ahmet Davutoğlu the Task of Forming a Government"
 Turkey.105.desc:0 "32 days after the general election, President Recep Tayyip Erdoğan gave the leader of the AK Party and Prime Minister Ahmet Davutoğlu the task of forming the government."
 Turkey.105.a:0 "A new government is on the way"
 Turkey.106.title:0 "PKK Attack"
 Turkey.106.desc:0 "In Adıyaman, PKK members opened fire on security forces. 1 soldier was killed and 2 soldiers were injured in the clash."
 Turkey.106.a:0 "Aman Tanrım"
 Turkey.107.title:0 "PKK Attack"
 Turkey.107.desc:0 "In the Lice district of Diyarbakır, after PKK members blocked the road, a car loaded with explosives was detonated as a gendarmerie team passed on its way to the scene. 2 soldiers were killed and 4 wounded."
 Turkey.107.a:0 "Aman Tanrım"
 Turkey.108.title:0 "News from the National Assembly"
 Turkey.108.desc:0 "80 deputies of the Peoples' Democratic Party, which has a group in the Grand National Assembly of Turkey, petitioned the Speaker of Parliament for the lifting of their immunity."
 Turkey.108.a:0 "That Sounds Bad"
 Turkey.109.title:0 "News From The National Assembly"
 Turkey.109.desc:0 "At the meeting of the Supreme Military Council, Hulusi Akar was appointed Chief of the General Staff, Salih Zeki Çolak was appointed Commander of the Land Forces and Abidin Ünal was appointed Commander of the Air Force."
 Turkey.109.a:0 "Ok"
 Turkey.110.title:0 "News from the Parties"
 Turkey.110.desc:0 "Coalition talks between the AKP and MHP failed to reach an agreement."
 Turkey.110.a:0 "Sounds Fair"
 Turkey.111.title:0 "Parliament Authorizes Cross-Border Military Operations"
 Turkey.111.desc:0 "Parliament adopted a motion authorizing the government to carry out cross-border operations with the armed forces and send troops abroad."
 Turkey.111.a:0 "Nice"
 Turkey.112.title:0 "New Appointments After the Latest Resignations"
 Turkey.112.desc:0 "EU Minister Ali Haydar Konca and Development Minister Müslüm Doğan, both members of the Peoples' Democratic Party, resigned from the Turkish government. Beril Dedeoğlu was appointed Minister for EU Affairs and Cüneyd Düzyol was appointed Minister of Development."
 Turkey.112.a:0 "New changes!"
 Turkey.113.title:0 "Türksat 4B Has Been Launched"
 Turkey.113.desc:0 "The Türksat 4B satellite was successfully launched from the Baikonur Cosmodrome in Kazakhstan."
 Turkey.113.a:0 "Nice"
 Turkey.114.title:0 "Türksat 4B Has Been Launched"
 Turkey.114.desc:0 "The Türksat 4B satellite was successfully launched from the Baikonur Cosmodrome in Kazakhstan."
 Turkey.114.a:0 "Nice News"
