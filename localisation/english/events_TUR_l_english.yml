 Turkey.115.desc:0 "At least ten people were killed and 15 injured in an explosion in Istanbul's Sultanahmet Square. An ISIS suicide bomber was reported to be responsible."
 Turkey.115.a:0 "Aman Tanrım"
 Turkey.116.title:0 "PKK Attack"
 Turkey.116.desc:0 "PKK militants bombed the police headquarters in Çınar, Diyarbakır, killing five people and injuring 39 others."
 Turkey.116.a:0 "Aman Tanrım"
 Turkey.117.title:0 "Terrorist Attack"
 Turkey.117.desc:0 "28 people were killed in a car bombing in Ankara."
 Turkey.117.a:0 "Aman Tanrım"
 Turkey.118.title:0 "ISIS Attack"
 Turkey.118.desc:0 "In Gaziantep, ISIS militants carried out a suicide bomb attack. 3 police officers were killed and 23 civilians injured."
 Turkey.118.a:0 "Aman Tanrım"
 Turkey.119.title:0 "Osmangazi Bridge Opens to Traffic"
 Turkey.119.desc:0 "The Osmangazi Bridge, the suspension bridge with the world's fourth-longest span, has been opened to traffic."
 Turkey.119.a:0 "We work for the people!"
 Turkey.120.title:0 "Is a Coup Attempt Coming?"
 Turkey.120.desc:0 "Experts and people from the MİT believe there will be a coup attempt in Turkey and are warning us about it. What do you think we should do?"
 Turkey.120.a:0 "We should prepare, whatever the cost"
 Turkey.120.c:0 "We should prepare, whatever the cost §Y(Without Speech)§!"
 Turkey.120.b:0 "Fake news; there will be no coup attempt!"
 Turkey.121.title:0 "The 15 July Coup Attempt Has Failed"
 Turkey.121.desc:0 "A coup d'état was attempted in Turkey against state institutions, including the government and President Recep Tayyip Erdoğan. The attempt was carried out by a faction within the Turkish Armed Forces that organized itself as the Peace at Home Council, whose members have never all been identified. They attempted to seize control of several key places in Ankara, Istanbul, Marmaris and elsewhere, such as the Asian-side entrance of the Bosphorus Bridge, but failed after forces loyal to the state defeated them. The Council cited the erosion of secularism, the elimination of democratic rule, disregard for human rights and Turkey's loss of credibility in the international arena as reasons for the coup. The government said the coup leaders were linked to the Gülen movement, which is designated as a terrorist organization by the Republic of Turkey and led by Fethullah Gülen, a Turkish businessman and cleric living in Pennsylvania. The Turkish government alleged that Gülen was behind the coup (which Gülen denied) and that the United States was harbouring him. Events surrounding the coup attempt and the purges in its aftermath reflect a complex power struggle between Islamist elites in Turkey.\n\nDuring the coup attempt, over 300 people were killed and more than 2,100 injured. Many government buildings, including the Turkish Parliament and the Presidential Palace, were bombed from the air. Mass arrests followed, with at least 40,000 detained, including at least 10,000 soldiers and, for reasons that remain unclear, 2,745 judges. 15,000 education staff were also suspended and the licences of 21,000 teachers working at private institutions were revoked after the government stated they were loyal to Gülen. More than 77,000 people have been arrested and over 160,000 dismissed from their jobs over reported links to Gülen.\n\nReactions to the event, both domestic and international, were largely against the coup attempt. The main opposition parties in Turkey condemned the attempt, while several international leaders, such as those of the United States, NATO, the European Union and neighbouring countries, called for "respect for the democratic institutions in Turkey and its elected officials." International organizations also spoke out against the coup. The United Nations Security Council, however, did not denounce the coup after disagreements over the wording of a statement.\n\nPresident Recep Tayyip Erdoğan said the head of United States Central Command, General Joseph Votel, was "siding with coup plotters" after Votel criticized the Turkish government for arresting the Pentagon's contacts in Turkey."
 Turkey.121.a:0 "Victory!"
 Turkey.122.title:0 "The 15 July Coup Attempt Has Succeeded"
 Turkey.122.desc:0 "A coup d'état was attempted in Turkey against state institutions, including the government and President Recep Tayyip Erdoğan. The attempt was carried out by a faction within the Turkish Armed Forces that organized itself as the Peace at Home Council, whose members have never all been identified. They seized control of several key places in Ankara, Istanbul, Marmaris and elsewhere, such as the Asian-side entrance of the Bosphorus Bridge. The Council cited the erosion of secularism, the elimination of democratic rule, disregard for human rights and Turkey's loss of credibility in the international arena as reasons for the coup. The government said the coup leaders were linked to the Gülen movement, which is designated as a terrorist organization by the Republic of Turkey and led by Fethullah Gülen, a Turkish businessman and cleric living in Pennsylvania. The Turkish government alleged that Gülen was behind the coup (which Gülen acknowledged) and that the United States was harbouring him. Events surrounding the coup attempt and the purges in its aftermath reflect a complex power struggle between Islamist elites in Turkey.\n\nDuring the coup attempt, over 300 people were killed and more than 2,100 injured. Many government buildings, including the Turkish Parliament and the Presidential Palace, were bombed from the air. Mass arrests followed, with at least 40,000 detained, including at least 10,000 government personnel and, for reasons that remain unclear, 2,745 judges. 15,000 education staff were also suspended and the licences of 21,000 teachers working at private institutions were revoked after the new government stated they were loyal to Erdoğan. More than 77,000 people have been arrested and over 160,000 dismissed from their jobs over reported links to Erdoğan.\n\nReactions to the event, both domestic and international, were largely against the coup attempt. But the coup ended in success."
 Turkey.122.a:0 "Aman Tanrım"
 Turkey.123.title:0 "Terrorist Attack on the Reina Nightclub"
 Turkey.123.desc:0 "A terrorist attack on the Reina nightclub in Istanbul has left 39 people dead. The Islamic State of Iraq and the Levant has claimed responsibility for the attack."
 Turkey.123.a:0 "Aman Tanrım"
 Turkey.124.title:0 "The State of Emergency Has Been Extended"
 Turkey.124.desc:0 "The Grand National Assembly of Turkey has voted to extend the state of emergency by 3 months following last year's coup attempt."
 Turkey.124.a:0 "We are still in a state of emergency!"
 Turkey.125.title:0 "Kurdish Terrorist Attack!"
 Turkey.125.desc:0 "A car bomb planted by the TAK has exploded in İzmir, killing 2 people."
 Turkey.125.a:0 "Aman Tanrım"
 Turkey.126.title:0 "Suspected ISIL Members Arrested"
 Turkey.126.desc:0 "Over 800 suspected ISIL members have been arrested by the Turkish police."
 Turkey.126.a:0 "Sounds Good"
 Turkey.127.title:0 "4,400 Public Servants Dismissed"
 Turkey.127.desc:0 "4,400 public servants have been dismissed in another purge following last year's coup attempt."
 Turkey.127.a:0 "Sounds Good"
 Turkey.128.title:0 "Over 800 PKK Suspects Detained by Police"
 Turkey.128.desc:0 "Over 800 people have been detained by police on allegations of membership in the banned Kurdistan Workers' Party (PKK)."
 Turkey.128.a:0 "Sounds Good"
 Turkey.129.title:0 "Syrian Fighter Jet Crashes in Hatay Province"
 Turkey.129.desc:0 "A Syrian fighter jet crashed in the Hatay Province near the Syria–Turkey border."
 Turkey.129.a:0 "Aman Tanrım"
 Turkey.130.title:0 "Tensions with the Dutch"
 Turkey.130.desc:0 "Dutch authorities withdrew landing permission for a Turkish minister campaigning for April's referendum. President Erdoğan called the Dutch authorities "Nazi remnants". In response, Dutch authorities escorted another minister from Rotterdam to the German border."
 Turkey.130.a:0 "We need to act"
 Turkey.131.title:0 "Response to the Netherlands' Actions"
 Turkey.131.desc:0 "The Dutch ambassador to Turkey, Cornelis van Rij, was expelled from Ankara following a Dutch ban on Turkish ministers speaking at pro-Erdoğan rallies."
 Turkey.131.a:0 "Nice"
 Turkey.132.title:0 "Wikipedia Blocked in Turkey"
 Turkey.132.desc:0 "Turkish authorities blocked online access to all language editions of Wikipedia throughout the country. The restrictions were imposed under Turkish Law No. 5651 because of the English article on state-sponsored terrorism (as of 29 April 2017), which described Turkey as a sponsor of ISIL and Al-Qaeda, something Turkish courts viewed as public manipulation through mass media. Requests by the Turkish Information and Communication Technologies Authority to edit several articles to comply with Turkish law were not acted on."
 Turkey.132.a:0 "Wikipedia is brainwashing our people!"
 Turkey.133.title:0 "Constitutional Court Shuts Down the Önce Vatan Party"
 Turkey.133.desc:0 "The Önce Vatan Party has been shut down by the Constitutional Court of Turkey."
 Turkey.133.a:0 "The Constitutional Court has made its decision"
 Turkey.134.title:0 "Kadir Topbaş Resigns"
 Turkey.134.desc:0 "Kadir Topbaş has resigned as Mayor of Istanbul."
 Turkey.134.a:0 "That doesn't sound good"
 Turkey.135.title:0 "Pegasus Airlines Flight 8622"
 Turkey.135.desc:0 "Pegasus Airlines Flight 8622 was a domestic flight from Ankara to Trabzon, Turkey. On 13 January 2018, while landing on runway 11 at Trabzon Airport, the aircraft ran off the left side of the runway and partially slid down a cliff. There were no fatalities or injuries among the 168 passengers and crew, but the aircraft was damaged beyond repair and written off."
 Turkey.135.a:0 "Aman Tanrım"
 Turkey.136.title:0 "CASA CN-235 Military Training Aircraft Crashes"
 Turkey.136.desc:0 "A CASA CN-235 military training aircraft crashed in Isparta. 3 soldiers were killed."
 Turkey.136.a:0 "Aman Tanrım"
 Turkey.137.title:0 "Rocket Strikes Near the Border"
 Turkey.137.desc:0 "A rocket fired from Syria hit the Çalık Mosque in Kilis city centre and damaged a house 100 metres away. 2 people were killed."
 Turkey.137.a:0 "Aman Tanrım"
 Turkey.138.title:0 "Military Incident"
 Turkey.138.desc:0 "A training aircraft that took off from the İzmir Çiğli 2nd Main Jet Base Command crashed. 2 pilots died."
 Turkey.138.a:0 "Aman Tanrım"
 Turkey.139.title:0 "A Bombardier Challenger 604 Private Jet Has Crashed"
 Turkey.139.desc:0 "A Bombardier Challenger 604 private jet owned by Turkish group Başaran Holding crashed in the Zagros Mountains near Shahr-e Kord, Iran, while returning to Turkey from the United Arab Emirates. All three crew members and eight passengers on board were killed."
 Turkey.139.a:0 "Aman Tanrım"
 Turkey.140.title:0 "A New Law on Alliances Between Political Parties"
 Turkey.140.desc:0 "The bill allowing political parties to form electoral alliances was passed by the Grand National Assembly of Turkey and became law."
 Turkey.140.a:0 "Totally not a coalition"
 Turkey.141.title:0 "Military Incident"
 Turkey.141.desc:0 "An F-16 on a training flight crashed near Nevşehir. 1 soldier died."
 Turkey.141.a:0 "Aman Tanrım"
 Turkey.142.title:0 "News from the Grand National Assembly"
 Turkey.142.desc:0 "The proposal for a snap election on 24 June was passed and enacted by the Grand National Assembly."
 Turkey.142.a:0 "The system works..."
 Turkey.143.title:0 "The Kanal Istanbul Project"
 Turkey.143.desc:0 "President Erdoğan announced a "mega-scheme" for infrastructure, including the construction of a large 400-metre-wide canal that would disrupt farming communities. Critics questioned the need for the canal and warned that it would destroy an 8,500-year-old archaeological site near Istanbul. They also voiced concern about the expected widespread environmental damage."
 Turkey.143.a:0 "Another mega project?"
 Turkey.143.b:0 "Another mega project? §Y(Without Sound)§!"
 Turkey.144.title:0 "Crisis with Austria"
 Turkey.144.desc:0 "President Erdoğan warned that if the Austrian government expelled Muslim clerics, it could lead to war. He said: “These measures taken by the Austrian prime minister are, I fear, leading the world towards a war between the cross and the crescent. They say they are going to kick our religious men out of Austria. Do you think we will not react if you do such a thing? That means we are going to have to do something.”"
 Turkey.144.a:0 "They are going to pay for this!"
 Turkey.145.title:0 "The 2018 Turkish Presidential Election"
 Turkey.145.desc:0 "The 2018 Turkish presidential election took place on 24 June 2018 as part of the 2018 general election, alongside parliamentary elections on the same day. Following the approval of constitutional changes in a 2017 referendum, the elected President will be both head of state and head of government of Turkey, taking over the latter role from the soon-to-be-abolished office of Prime Minister."
 Turkey.145.a:0 "Let's Go!"
 Turkey.146.title:0 "The State of Emergency Officially Ends"
 Turkey.146.desc:0 "The state of emergency, announced on 20 July 2016, officially ended."
 Turkey.146.a:0 "Finally"
 Turkey.1461.title:0 "World Leaders at the Vahdettin Pavilion"
 Turkey.1461.desc:0 "Russian President Vladimir Putin, German Chancellor Angela Merkel, French President Emmanuel Macron and President Recep Tayyip Erdoğan came together at the Vahdettin Pavilion in Istanbul as part of a summit on the Syrian civil war."
 Turkey.1461.a:0 "Let the talks begin"
 Turkey.147.title:0 "Founding of the Yeniden Refah Party"
 Turkey.147.desc:0 "Necmettin Erbakan's son Fatih Erbakan has founded a party named the Yeniden Refah Party."
 Turkey.147.a:0 "Another Opposition?"
 Turkey.148.title:0 "Çorlu Train Derailment"
 Turkey.148.desc:0 "At 17:15 Turkish time on 8 July 2018, five carriages of the six-car Uzunköprü-Halkalı regional train number 12703, travelling on the Istanbul-Pythio railway to Halkalı Terminal in Istanbul, derailed at kilometre 162 (mile 101) near the village of Sarılar in Çorlu, Tekirdağ. Of the 362 passengers and six crew on board, 24 were killed and 318 injured. 276 lightly injured passengers were discharged from hospital after treatment, while the 42 severely injured victims continue to receive care in hospitals in Tekirdağ, Çorlu and Istanbul."
 Turkey.148.a:0 "Aman Tanrım"
 Turkey.149.title:0 "Military Incident"
 Turkey.149.desc:0 "A UH-1 type military helicopter crashed in Sancaktepe, Istanbul. 4 soldiers died."
 Turkey.149.a:0 "Aman Tanrım"
 Turkey.150.title:0 "Building Collapses in Kartal"
 Turkey.150.desc:0 "An 8-storey building collapsed in Kartal, killing 8 people and injuring 14 others."
 Turkey.150.a:0 "Aman Tanrım"
 Turkey.151.title:0 "Reconstruction of the Atatürk Cultural Centre Begins"
 Turkey.151.desc:0 "The groundbreaking ceremony for the new Atatürk Cultural Centre was held on the site of the demolished building."
 Turkey.151.a:0 "That Looks Beautiful"
 Turkey.152.title:0 "Military Incident"
 Turkey.152.desc:0 "A UH-1 military helicopter crashed in Çekmeköy, killing 4 soldiers. On 26 November 2018, a helicopter of the same type that had taken off from the same location crashed near Sancaktepe."
 Turkey.152.a:0 "Aman Tanrım"
 Turkey.153.title:0 "Turkish Local Elections"
 Turkey.153.desc:0 "Local elections took place across the country. Ekrem İmamoğlu says he won Istanbul's mayoral election by 29,000 votes, although the ruling party says it garnered 48.70% of the vote compared to only 48.65% for İmamoğlu. Binali Yıldırım claims he received 48.71% of the vote and claims victory."
 Turkey.153.a:0 "The elections are rigged! Rerun the elections!"
 Turkey.153.b:0 "The elections are rigged! Rerun the elections! §Y(Without Speech)§!"
 Turkey.155.title:0 "Istanbul Mayoral Election"
 Turkey.155.desc:0 "The June 2019 Istanbul mayoral election was held on 23 June 2019. It was a re-run of the March 2019 mayoral election, which was annulled by the Supreme Electoral Council (YSK) on 6 May 2019. The original election had resulted in a narrow 0.2% margin of victory for opposition candidate Ekrem İmamoğlu, causing the governing Justice and Development Party (AKP) to successfully petition for a re-run. \n\nThe Nation Alliance (formed of the Republican People's Party (CHP) and the İYİ Party) fielded their initial candidate Ekrem İmamoğlu, who ran a positive campaign under the slogan Her Şey Çok Güzel Olacak (Everything will be fine). The governing People's Alliance (formed by the AKP and the Nationalist Movement Party) re-nominated their initially unsuccessful candidate Binali Yildirim. The non-aligned Peoples' Democratic Party (HDP) did not field their own candidate and announced their support for İmamoğlu. The election featured a televised debate between the two main candidates, a first in Turkey since 2002. Campaigning focused highly on rival accusations of misconduct during and after the initial March 2019 election, during which both sides alleged that they had been a victim of the other's antics.\n\nThe results showed a substantial swing in favor of İmamoğlu, who multiplied his initial 13,700-vote margin of victory 57-fold to win 54.2% of the vote against Yildirim's 45.0%. The opposition's victory defied opinion polls, which predicted a much narrower victory, and was a record in the history of Istanbul local elections in terms of both popular vote and percentage share. İmamoğlu also won pluralities in 28 of Istanbul's 39 districts. Yildirim, on the other hand, lost 11 districts he had won in March and saw a 4 percent decrease in his previous vote share, conceding defeat soon after indicative results became public. The result was seen as a huge blow to President Recep Tayyip Erdoğan, who had once said that if his party "lost Istanbul, we would lose Turkey." Commentators viewed the result as a backlash against Erdoğan, the initial annulment of the March vote (which was largely seen as an anti-democratic maneuver), economic mismanagement, and negative campaigning. It was also seen as a backfire against the government's last-ditch attempt to involve the outlawed Kurdistan Workers' Party (PKK)'s imprisoned leader Abdullah Öcalan in the process, in an attempt to convince HDP voters to boycott the election. \n\nThe opposition's landslide was characterized as the "beginning of the end" for Erdoğan, with international commentators calling the re-run a huge government miscalculation that led to a potential İmamoğlu candidacy in the next scheduled presidential election. It is suspected that the scale of the government's defeat could provoke a cabinet reshuffle and early general elections, currently scheduled for June 2023."
 Turkey.155.a:0 "A Setback for the AKP"
 Turkey.157.title:0 "Summit on Syria in Ankara"
 Turkey.157.desc:0 "Turkish, Russian and Iranian leaders met at a summit on Syria in Ankara. Their mission is to bring peace and stability to the Middle East by ending the dramatic Syrian civil war caused by ideological divisions."
 Turkey.157.a:0 "The situation in Syria must not stay uncertain"
 Turkey.158.title:0 "TOGG, the Turkish National Car, Has Been Unveiled"
 Turkey.158.desc:0 "TOGG, the Turkish national car, has been unveiled to the public, who looked at it with amazement. This development will make everyone in the country happy except the traitors."
 Turkey.158.a:0 "Great!"
 Turkey.159.title:0 "A New Building for the MİT"
 Turkey.159.desc:0 "The new building of the National Intelligence Organization (MİT) has opened in Etimesgut, Ankara."
 Turkey.159.a:0 "Nice"
 Turkey.160.title:0 "Creation of the Coronavirus Scientific Advisory Board"
 Turkey.160.desc:0 "The Coronavirus Scientific Advisory Board is a group of medical scientists set up by the Ministry of Health to develop the measures the government imposes in the fight against the COVID-19 pandemic in Turkey."
 Turkey.160.a:0 "We must be ready for COVID-19!"
 Turkey.161.title:0 "We Have Lifted the Ban on Wikipedia"
 Turkey.161.desc:0 "Turkey has lifted its ban on Wikipedia following a ruling by the Constitutional Court."
 Turkey.161.a:0 "Nice"
 Turkey.162.title:0 "Pegasus Airlines Flight 2193"
 Turkey.162.desc:0 "Pegasus Airlines Flight 2193 was a scheduled domestic passenger flight from İzmir to Istanbul. The Boeing 737-800 operating the route skidded off the runway while landing at Sabiha Gökçen International Airport. Three people were killed, 179 were injured and the aircraft was destroyed."
 Turkey.162.a:0 "Aman Tanrım"
 Turkey.163.title:0 "Syrian Attack!"
 Turkey.163.desc:0 "On 27 February 2020, at the height of Operation Dawn of Idlib 2, the Syrian Air Force, reportedly together with the Russian Air Force, conducted two airstrikes on a Turkish army convoy in Balyun, Idlib Governorate. According to Turkish President Recep Tayyip Erdoğan, the strikes killed 34 Turkish soldiers, while other sources close to the Turkish government put the death toll at 50–100, making it the deadliest single attack on Turkish forces since their involvement in the Syrian Civil War began. Between 36 and 60 soldiers were also wounded, 16 of them reportedly in critical condition."
 Turkey.163.a:0 "We must destroy Assad's forces!"
 Turkey.164.title:0 "First COVID-19 Case in Turkey"
 Turkey.164.desc:0 "The Ministry of Health confirms the first COVID-19 case in Turkey."
 Turkey.164.a:0 "Oh No!"
 Turkey.165.title:0 "100th Anniversary of the Grand National Assembly of Turkey"
 Turkey.165.desc:0 "Turkey celebrated the 100th anniversary of the opening of the Grand National Assembly."
 Turkey.165.a:0 "Democracy prevails"
 Turkey.166.title:0 "An Explosion Occurred!"
 Turkey.166.desc:0 "An explosion occurred at the fireworks factory in Hendek. 6 workers died and 114 were injured."
 Turkey.166.a:0 "Aman Tanrım"
 Turkey.167.title:0 "Forest Fire in Gallipoli"
 Turkey.167.desc:0 "450 hectares of forest burned in the Ilgardere area of Gelibolu, Çanakkale. Shipping traffic through the Dardanelles was suspended."
 Turkey.167.a:0 "Aman Tanrım"
 Turkey.168.title:0 "The Hagia Sophia Question"
 Turkey.168.desc:0 "Hagia Sophia, which Sultan Mehmed the Conqueror turned into a mosque after the conquest of Istanbul, was turned into a museum by a decision of the Council of Ministers dated 24 November 1934. Following a ruling by the Council of State, the President's decision transferring the management of Hagia Sophia Mosque to the Directorate of Religious Affairs and opening it for worship was published in the Official Gazette. President Recep Tayyip Erdoğan announced that Hagia Sophia will be opened for worship."
 Turkey.168.a:0 "Let's do this!"
 Turkey.169.title:0 "We Have Found Natural Gas in the Black Sea"
 Turkey.169.desc:0 "Turkey has found 320 billion cubic metres of natural gas in the largest discovery ever made in the Black Sea and hopes to begin production by 2023. The Turkish drilling ship Fatih had been carrying out exploration in the Tuna-1 field in the western Black Sea for the past month."
 Turkey.169.a:0 "Nice News"
 Turkey.170.title:0 "The Chora Church Question"
 Turkey.170.desc:0 "President Recep Tayyip Erdoğan signed the decision transferring the administration of the Chora Church to the Directorate of Religious Affairs and opening it for worship as a mosque, and the decision was published in the Official Gazette."
 Turkey.170.a:0 "Seems OK"
 Turkey.171.title:0 "Turkey's First Flying Car Has Been Unveiled"
 Turkey.171.desc:0 "Turkey's first flying car, Cezeri, was unveiled and took off at Teknofest Gaziantep."
 Turkey.171.a:0 "Nice!"
 Turkey.172.title:0 "Support for Azerbaijan!"
 Turkey.172.desc:0 "Erdoğan announced that Turkey would support Azerbaijan during the 2020 Nagorno-Karabakh conflict."
 Turkey.172.a:0 "We stand with our Azerbaijani brothers"
 Turkey.173.title:0 "Forest Fire in Hatay"
 Turkey.173.desc:0 "Forest fires that started in Belen, Hatay, spread to other districts. 400 hectares of forest burned."
 Turkey.173.a:0 "Aman Tanrım"
 Turkey.174.title:0 "We Have Found More Natural Gas in the Black Sea"
 Turkey.174.desc:0 "Erdoğan announced that another 85 billion cubic metres of natural gas had been discovered in the Black Sea."
 Turkey.174.a:0 "Nice News"
 Turkey.175.title:0 "2020 Aegean Sea Earthquake"
 Turkey.175.desc:0 "The İzmir earthquake, with a moment magnitude of 7.0, struck on Friday, 30 October 2020, about 14 km (8.7 mi) northeast of the Greek island of Samos. Many buildings were severely damaged or collapsed, with the Church of the Assumption of Mary in Karlovasi, Greece, partially collapsing, while in the Turkish city of İzmir, which was heavily affected, dozens of buildings were damaged or completely collapsed. Emergency services in both countries immediately attended the scene, and rescue efforts continued through the night. 117 people are known to have died in Turkey's İzmir Province, with 1,034 more injured. \n\nIn Greece, there were two further fatalities and nineteen minor injuries. The earthquake was the most powerful in the Aegean Sea since 1981 and the deadliest in İzmir Province since a magnitude 6.6 quake killed four people in 1955. It was also the deadliest earthquake of 2020."
 Turkey.175.a:0 "Oh No!"
 Turkey.177.title:0 "2020 Bingöl Earthquake"
 Turkey.177.desc:0 "The 2020 Bingöl earthquake occurred at 17:24 on 14 June in Turkey. Its magnitude was determined to be 5.8 Mw. The epicentre was close to the village of Kaynarpınar in Karlıova, Bingöl, and it was felt in the neighbouring provinces of Erzurum, Diyarbakır, Elazığ and Muş. 392 aftershocks were detected following the earthquake, the largest being a 5.5 Mw event."
 Turkey.177.a:0 "Oh No!"
 Turkey.178.title:0 "2020 Iran–Turkey Earthquakes"
 Turkey.178.desc:0 "The first and most destructive of the 2020 Iran–Turkey earthquakes occurred on 23 February near Khoy in north-western Iran, close to the Turkish border, killing 9 people in Başkale, Van. It struck at 9:23 a.m. with a magnitude of 5.8 Mw at a depth of 6 kilometres (3.7 miles), and the epicentre was in the Qotur district, according to the Iranian Seismological Center (IRSC). About 10 hours later, the same area was hit by another major earthquake of 6.0 Mw."
 Turkey.178.a:0 "Oh No!"
 Turkey.179.title:0 "2020 Elazığ Earthquake"
 Turkey.179.desc:0 "The 2020 Elazığ earthquake occurred at 20:55 on 24 January in Turkey. Its magnitude was determined to be 6.7 Mw. The epicentre was close to the town of Sivrice in Elazığ Province, and it was felt in the neighbouring provinces of Diyarbakır, Malatya and Adıyaman and in neighbouring Armenia, Syria and Iran. Kandilli Observatory reported the magnitude as 6.5 Mw. A total of 41 people were killed and more than 1,600 injured."
 Turkey.179.a:0 "Oh No!"
 Turkey.180.title:0 "2019 Istanbul Earthquake"
 Turkey.180.desc:0 "The 2019 Istanbul earthquake was a magnitude 5.8 earthquake that struck southwestern Istanbul on 26 September 2019 at 13:59. One person died of a heart attack and 43 people were injured. The earthquake was felt in Istanbul, Tekirdağ, Kırklareli, Kocaeli and Sakarya."
 Turkey.180.a:0 "Oh No!"
 Turkey.182.title:0 "2017 Aegean Sea Earthquake"
 Turkey.182.desc:0 "A magnitude 6.6 earthquake struck on 21 July 2017 about 10 km (6.2 mi) south-southeast of Bodrum, Turkey, at a depth of 7.0 km. Two people were killed and more than 120 others injured on the Greek island of Kos, while at least 360 injuries were reported in Turkey."
 Turkey.182.a:0 "Oh No!"
 Turkey.184.title:0 "2014 Aegean Sea Earthquake"
 Turkey.184.desc:0 "An earthquake occurred in the northern Aegean Sea between Greece and Turkey on 24 May 2014. It had a moment magnitude of 6.9 and a maximum Mercalli intensity of VIII (Severe). Serious damage was reported on the Turkish island of Gökçeada (Imbros) and in the cities of Edirne and Çanakkale, as well as on the Greek island of Lemnos. The earthquake was felt in Bulgaria and southern Romania. Several aftershocks followed the mainshock, the strongest measuring 5.3 ML, which struck the Gulf of Saros at 12:31."
 Turkey.184.a:0 "Oh No!"
 Turkey.186.title:0 "2011 Van Earthquakes"
 Turkey.186.desc:0 "The 2011 Van earthquakes occurred in eastern Turkey near the city of Van. The first earthquake struck on 23 October at 13:41 local time. The shock had an Mww magnitude of 7.1 and a maximum Mercalli intensity of VIII (Severe). It occurred at a shallow depth, causing heavy shaking across much of eastern Turkey and lighter tremors in neighbouring parts of the South Caucasus and the Levant. According to the Disaster and Emergency Management Presidency on 30 October, the earthquake killed 604 people and injured 4,152. At least 11,232 buildings were damaged in the region, 6,017 of which were found to be uninhabitable. The uninhabitable homes left as many as 8,321 households, with an average of around 7.6 people each, homeless in the province, meaning that at least around 60,000 people were left homeless. Another 5,215 buildings were damaged but remained habitable. A separate earthquake within the same fault system struck on 9 November at 21:23, killing 40 people and injuring 260."
 Turkey.186.a:0 "Oh No!"
 Turkey.188.title:0 "2011 Kütahya Earthquake"
 Turkey.188.desc:0 "The 2011 Kütahya earthquake struck near a populous region of western Turkey at 23:15 on 19 May, with a moment magnitude of 5.8 and a maximum Mercalli intensity of VII (Very strong). With its epicentre just east of Simav, it occurred at an estimated depth of 9.1 kilometres (5.7 mi), causing strong shaking across much of Kütahya. Many locals panicked and most of Simav lost power. A hospital in Simav reported an unknown number of injuries, and some buildings were damaged. An elderly woman in İnegöl suffered a heart attack immediately after the tremor and was later confirmed dead. In Simav, one person was killed after being struck by a concrete block. More than 450 weak aftershocks followed, the strongest registering a magnitude of 4.6."
 Turkey.188.a:0 "Oh No!"
 Turkey.189.title:0 "2010 Elazığ Earthquake"
 Turkey.189.desc:0 "The 2010 Elazığ earthquake was a 6.1 Mw earthquake that occurred on 8 March 2010 at 02:32. The epicentre was Başyurt in Elazığ Province, in eastern Turkey. Initial reports in the global media said as many as 57 people had died. By 10 March, the Turkish media put the death toll at 41, later rising to 42. Another 74 were injured, many after falling or jumping from buildings, and a stampede through the streets led to further injuries. The earthquake came exactly one week after the Turkish Chamber of Civil Engineers sent a report to parliament detailing inadequate building projects and warning that Istanbul could be destroyed by an earthquake that might kill tens of thousands of people at some point in the next three decades."
 Turkey.189.a:0 "Oh No!"
 Turkey.193.title:0 "2004 Doğubayazıt Earthquake"
 Turkey.193.desc:0 "The 2004 Doğubayazıt earthquake was a 5.1 or 5.2 Mw earthquake that struck Doğubayazıt, Ağrı, Turkey, on 2 July 2004 at 01:30 local time. 18 people were killed and 32 injured. The greatest damage was in the village of Yığıncal, while the villages of Kutlubulak and Sağlıksuyu were also affected. Kandilli Observatory stated that around 1,000 buildings were damaged. The earthquake was felt in Ağrı, Iğdır, Kars and areas near the Iran-Turkey border. The intensity of the shock was reported as VII and the depth as 5 km. The earthquake happened during the local summer pasture season, when villagers were up in the mountains, which prevented a higher number of casualties. Various organizations sent relief to the area. Three ministers of the Turkish government visited the area, Greece offered help and France sent messages of solidarity."
 Turkey.193.a:0 "Oh No!"
 Turkey.195.title:0 "2003 Bingöl Earthquake"
 Turkey.195.desc:0 "The 2003 Bingöl earthquake hit eastern Turkey with a moment magnitude of 6.4 and a maximum Mercalli intensity of IX (Violent) on 1 May at 03:27. The epicentre of this strike-slip earthquake was in Bingöl Province, 15 km north of Bingöl. At least 177 people were killed, and 625 buildings collapsed or suffered heavy damage in the affected region. Eighty-four of the deaths occurred when a dormitory block collapsed at a boarding school in Çeltiksuyu."
 Turkey.195.a:0 "Oh No!"
 Turkey.197.title:0 "2002 Afyon Earthquake"
 Turkey.197.desc:0 "The Afyon Province of western Turkey was struck by a magnitude 6.5 Mw earthquake on 23 February 2002 at 10:11. It had a maximum felt intensity of VIII (Severe) on the Modified Mercalli intensity scale. It damaged hundreds of buildings, killing 44 people and injuring a further 318."
 Turkey.197.a:0 "Oh No!"
 Turkey.198.title:0 "AKP Rallies"
 Turkey.198.desc:0 "The AKP has started holding election rallies in many places. It looks like the next election will be fierce."
 Turkey.198.a:0 "This election will be interesting"
 Turkey.199.title:0 "CHP Rallies"
 Turkey.199.desc:0 "The CHP has started holding election rallies in many places. It looks like the next election will be fierce."
 Turkey.199.a:0 "This election will be interesting"
 Turkey.200.title:0 "Muharrem İnce Becomes the CHP's Presidential Candidate"
 Turkey.200.desc:0 "Muharrem İnce is officially the Republican People's Party's candidate. In a secret ballot held in the CHP parliamentary group, 110 deputies unanimously declared Muharrem İnce the CHP's presidential candidate. Speaking to the press for the first time after the announcement, İnce said: "Yesterday I said I would announce it when the time came, and he responded wittily, 'When it comes.'" Muharrem İnce was born on 4 May 1964, exactly this day, so he was nominated for President by the CHP on his birthday. Kılıçdaroğlu said of İnce's candidacy that "we will make history"."
 Turkey.200.a:0 "The opposition reveals its plans"
 Turkey.201.title:0 "Founding of the Future Party"
 Turkey.201.desc:0 "The Future Party was founded on 12 December 2019 by Ahmet Davutoğlu, a former foreign minister and prime minister from the conservative Justice and Development Party (AKP). Having become prime minister on 28 August 2014 with the support of President Recep Tayyip Erdoğan, Davutoğlu later opposed Erdoğan's moves to transform Turkey's system of government from parliamentary to presidential. His conflict with Erdoğan culminated in his resignation from the premiership, effective 22 May 2016. After resigning, Davutoğlu frequently criticized the AKP government, which led the party to launch disciplinary proceedings against him. In response, he resigned from the AKP on 13 September 2019. He later expressed interest in forming a new party in opposition to President Erdoğan's administration and launched the Future Party on 12 December 2019. The new party immediately published a list of 154 founding members, including numerous former AKP officials and affiliates."
 Turkey.201.a:0 "A loss for the AKP"
 Turkey.202.title:0 "Founding of DEVA"
 Turkey.202.desc:0 "The DEVA Party is a political party in Turkey formed by former Deputy Prime Minister Ali Babacan after a split from Recep Tayyip Erdoğan's Justice and Development Party. The party currently holds one seat in the Grand National Assembly, held by MP Mustafa Yeneroğlu, one of its founders."
 Turkey.202.a:0 "A loss for the AKP"
 Turkey.203.title:0 "Founding of the Memleket Party"
 Turkey.203.desc:0 "Muharrem İnce has left the CHP and formed his own party, the Memleket (Homeland) Party, which holds Kemalist ideals."
 Turkey.203.a:0 "A loss for the CHP"
 Turkey.204.title:0 "The CHP's New Presidential Candidate"
 Turkey.204.desc:0 "The CHP mayors of Ankara and Istanbul have become popular across the country. We can make Ekrem İmamoğlu or Mansur Yavaş our presidential candidate. The choice is yours."
 Turkey.204.a:0 "Mansur Yavaş"
 Turkey.204.b:0 "Ekrem İmamoğlu"
 Turkey.205.title:0 "İYİ Party Speech"
 Turkey.205.desc:0 "The İYİ Party has attacked us by pointing to the misery in our country. The course of the economy could lead us to far worse places."
 Turkey.205.a:0 "This sounds bad"
 Turkey.206.title:0 "Early Parliamentary Elections Are Coming"
 Turkey.206.desc:0 "The decision to hold early parliamentary elections has passed. Preparations for the election have now begun."
 Turkey.206.a:0 "Let's go!"
 Turkey.207.title:0 "Turkish Elections"
 Turkey.207.desc:0 "Elections have been held across the country, and now the ballot boxes are being opened one by one. Who should win this election: the CHP or the AKP?"
 Turkey.207.a:0 "Let's continue with Erdoğan"
 Turkey.207.b:0 "We need change; go with the CHP"
 Turkey.208.title:0 "Turkey's Centenary"
 Turkey.208.desc:0 "As Türkiye reaches the milestone of its first centenary, the occasion calls for a profound reflection on the nation's journey, the challenges it has overcome and the vibrant tapestry of its cultural, historical and political evolution. This celebration is not merely a commemoration of time passed; it is a testament to the resilience and progress that have shaped Türkiye into the nation it is today."
 Turkey.208.a:0 "What a nice day!"
 Turkey.208.b:0 "What a nice day! §Y(Without Sound)§!"
 Turkey.209.title:0 "Preparations for the New Constitution"
 Turkey.209.desc:0 "At the behest of Erdoğan and the Grand National Assembly of Turkey, preparations for a new constitution have begun. We hope things do not go wrong along the way."
 Turkey.209.a:0 "Interesting"
 Turkey.210.title:0 "A Brand New Constitution"
 Turkey.210.desc:0 "A new constitution has been drafted. The government praises it, while the opposition reacts harshly. This will damage the peace in our country."
 Turkey.210.a:0 "This constitution will make Turkey better"
 Turkey.211.title:0 "Boğaziçi Protests"
 Turkey.211.desc:0 "Hundreds began protesting on 4 January following the appointment, chanting slogans such as "Melih Bulu is not our rector" and "We don't want a plagiarist rector". In a joint statement, the faculty described the appointment as a violation of "academic freedom and scientific autonomy, as well as the democratic values" of Boğaziçi.\n\nLater that day, students who managed to enter the campus sealed off one of the university's buildings. Protesters then clashed with the police while trying to break through a barricade in front of the university entrance, and security forces used pepper spray to disperse them. Two students were detained during the protests, and by 6 January, 36 students were in detention. Protests by students and faculty outside the rector's office continued into February, with many other Turkish universities and Boğaziçi alumni associations abroad joining the protest against the appointment.\n\nAs part of an art exhibition organized for the protest, an artwork on campus reportedly depicting the Kaaba alongside an LGBT flag and a figure of Şahmeran led to the arrest of four students from the exhibition team. Interior Minister Süleyman Soylu referred to the arrested students as "four LGBT perverts", and Twitter later restricted his tweet. After this, the Boğaziçi University LGBT Studies Club was closed on Melih Bulu's orders, although Bulu defended himself and claimed to be an advocate of LGBT rights.\n\nOn 1 February, police blocked the gate of the South Campus to prevent a demonstration. Water cannon, barricades and at least one sniper were deployed. Later that night, police stormed the campus and detained 159 students. Several protesters in İzmir and 69 in Ankara were also detained. On 2 February, Turkish police detained 104 people near the university in Kadıköy and responded to demonstrators with tear gas and rubber bullets. Residents of Istanbul banged pots and pans in many parts of the city in solidarity with the protest. On 3 February, 50 people were detained in İzmir."
 Turkey.211.a:0 "We are losing our power"
 Turkey.212.title:0 "Türksat 5A Has Been Launched"
 Turkey.212.desc:0 "The Türksat 5A satellite, equipped with national components, was launched into space from Cape Canaveral on a Falcon 9 rocket."
 Turkey.212.a:0 "Great News"
 Turkey.213.title:0 "Human Rights Action Plan"
 Turkey.213.desc:0 "President Recep Tayyip Erdoğan has announced the Human Rights Action Plan, which will bring more rights to our people."
 Turkey.213.a:0 "Sounds Good"
 Turkey.214.title:0 "The İYİ Party Has Been Founded"
 Turkey.214.desc:0 "Some nationalists in the MHP, unhappy with the party's policies, have founded a new party. With the new party's founding, the MHP has lost strength."
 Turkey.214.a:0 "Politics are changing"
 Turkey.215.title:0 "Constitutional Court Shuts Down the Virtue Party"
 Turkey.215.desc:0 "The Virtue (Fazilet) Party has been closed by a decision of the Constitutional Court. This will lead to the founding of the AKP and the Felicity Party."
 Turkey.215.a:0 "The Constitutional Court has made its decision"
 Turkey.216.title:0 "The Independent Turkey Party Has Been Founded"
 Turkey.216.desc:0 "The Independent Turkey Party has been founded by Haydar Baş."
 Turkey.216.a:0 "Pretty Interesting"
 Turkey.217.title:0 "The DYP Becomes the DP"
 Turkey.217.desc:0 "The DYP has changed its name to the DP, the name of the old party that was shut down by the 1960 coup."
 Turkey.217.a:0 "What A Dramatic Change!"
 Turkey.218.title:0 "Founding of the Vatan Party"
 Turkey.218.desc:0 "After the closure of Perinçek's Workers' Party, Perinçek founded the Vatan Party. The party is heavily influenced by China's example."
 Turkey.218.a:0 "They are true Emergers"
 Turkey.219.title:0 "Statement of 104 Retired Admirals"
 Turkey.219.desc:0 "104 retired admirals of the Turkish Navy issued a statement warning about the Montreux Convention, the Kanal Istanbul project and Atatürk's principles and reforms.\n\nThe declaration of the retired admirals: \n\n* The recent opening to debate of both Kanal Istanbul and the Montreux Convention, within the scope of the authority to withdraw from international treaties, has been met with concern.\n\n* The Turkish Straits are among the most important waterways in the world and have been governed by multinational treaties throughout history. Montreux, the last of these treaties and the one that best protects Turkey's rights, is not merely a treaty regulating passage through the Straits but a great diplomatic victory that restored Turkey's full sovereignty over Istanbul, Çanakkale, the Sea of Marmara and the Straits, completing the Lausanne peace treaty.\n\n* Montreux is the cornerstone of the security of the Black Sea countries and the convention that makes the Black Sea a sea of peace. It also prevents Turkey from being dragged into a war on the side of one of the warring parties.\n\n* Montreux allowed Turkey to maintain its neutrality in World War II. For these and similar reasons, we believe that any rhetoric or action that could bring the Montreux Convention, which holds an important place in Turkey's survival, into debate or onto the negotiating table should be avoided.\n\n* At the same time, some unacceptable images, news and discussions in the press and on social media in recent days have caused deep sadness to those of us who devoted our lives to this profession.\n\n* The Turkish Armed Forces, and especially our naval forces, suffered a very deliberate FETÖ attack in recent years and lost very valuable personnel to these treacherous plots. The most important lesson to be learned from these plots is that the TSK must meticulously uphold the fundamental values of the Constitution, which cannot be changed or even proposed for change.\n\n* On these grounds, we condemn and oppose efforts to portray the TSK and our Navy as having departed from these values and from the modern course drawn by Atatürk.\n\n* Otherwise, the Republic of Turkey may face the risk of experiencing the most dangerous events in its history, examples of which we have seen before. It is essential that the personnel of the Naval Forces Command, protector of the motherland and the Blue Homeland, which has a glorious past rooted in the Turkish nation, be trained in accordance with Atatürk's principles and reforms.\n\n* To our devoted Turkish sailors working hard on the path shown by Atatürk to protect our rights and interests at sea, on land, in the air, in internal security and across the border in every corner of the Blue Homeland: we are with you."
 Turkey.219.a:0 "They are linked to the Gülen movement!"
 Turkey.219.b:0 "The CHP's coup plotters!"
 Turkey.219.c:0 "We don't care, they are retired admirals"
 Turkey.219.d:0 "They are right"
 Turkey.221.title:0 "Turkey Withdraws from the Istanbul Convention"
 Turkey.221.desc:0 "Turkish President Recep Tayyip Erdoğan has announced Turkey's withdrawal from the Istanbul Convention by a presidential decree published in the Official Gazette. Turkey is the first country to withdraw from it."
 Turkey.221.a:0 "Oh, nice"
 Turkey.221.b:0 "A bad decision"
 Turkey.220.title:0 "Tatvan Helicopter Crash"
 Turkey.220.desc:0 "A Eurocopter AS532 Cougar crashed on its way from Bingöl to Tatvan. Eleven soldiers on board, including 8th Corps Commander Osman Erbaş, were killed in the crash."
 Turkey.220.a:0 "Aman Tanrım"
 Turkey.222.title:0 "The CHP's Banners"
 Turkey.222.desc:0 "The CHP has hung banners in the streets asking "Where are the 128 billion dollars?". This is done to humiliate us. We should respond to these opposition provocations."
 Turkey.222.a:0 "That is anti-government! Take down these banners!"
 Turkey.223.title:0 "Backlash Against Us on Twitter"
 Turkey.223.desc:0 "The backlash against us on Twitter is making our policies difficult. We need to silence the Westerners on Twitter."
 Turkey.223.a:0 "Ah"
 Turkey.225.title:0 "Recep Tayyip Erdoğan Speech"
 Turkey.225.desc:0 "Recep Tayyip Erdoğan, President of the Republic of Turkey, gave a speech about the Kanal Istanbul project in which he said, "The canal will be built in spite of them." The media reacted very harshly."
 Turkey.225.a:0 "Is the canal still just a project?"
 Turkey.224.title:0 "Protests Across the Country"
 Turkey.224.desc:0 "The repeal of the Istanbul Convention has led to protests across the country, as some believe women's rights are being abandoned. The protests have damaged our prestige; if our people become dissatisfied, our chances of staying in power will fall, and the media claim this was done to divide the people."
 Turkey.224.a:0 "Oough..."
 Turkey.226.title:0 "Military Statement"
 Turkey.226.desc:0 "The first statement was issued after the coup was carried out. \n\n Military statement: "Messages calling for tension in the Turkish Republic and insulting Atatürk have come from politicians. These politicians will be arrested swiftly. Those who brought our country to this situation will never again come to power, and they have been banned from politics indefinitely. After the glorious Turkish army took control of the country, it immediately began inspecting the administrative institutions and found corruption. This corruption is one of the main reasons Turkey is in this state. As corruption has damaged our country and no one has had the power to control it, efforts to amend the Constitution have been approved. Once prepared, the new constitution will be put to the public in a vote. We wish you a blessed day.""
 Turkey.226.a:0 "Long live the junta!"
 Turkey.227.title:0 "The First Junta Congress"
 Turkey.227.desc:0 "The Junta Congress has been held. Its decisions are to amend the Constitution and to ban the parties."
 Turkey.227.a:0 "The junta has made its decision"
 Turkey.228.title:0 "Tanks in the Streets"
 Turkey.228.desc:0 "Tanks of the Turkish Armed Forces have begun entering the areas where the Islamists are based. Islamists who tried to resist were arrested by the special forces, and those arrested will be brought to justice."
 Turkey.228.a:0 "We need to keep the balance"
 Turkey.229.title:0 "Victory for the CHP"
 Turkey.229.desc:0 "The long AKP regime has finally ended at the ballot box. The CHP has won the election, and festivities and celebrations have been held across the country. May the new government bring good fortune."
 Turkey.229.a:0 "Political shift in Turkey"
 Turkey.230.title:0 "Kemal Derviş Takes Office"
 Turkey.230.desc:0 "Kemal Derviş took office as Minister of State for Economic Affairs on 13 March 2001, under Prime Minister Bülent Ecevit. We hope he can get us through these difficult times with minimal damage."
 Turkey.230.a:0 "He is our last chance"
 Turkey.231.title:0 "A Call for Jihad"
 Turkey.231.desc:0 "We have crushed the laws that undermined Islam with military force. It is time for the Turks to live up to their military traditions. Muslims, to the front!"
 Turkey.231.a:0 "Allahu Akbar!"
 Turkey.232.title:0 "A Call for Jihad"
 Turkey.232.desc:0 "We have crushed the laws that undermined Islam with military force. It is time for the Turks to live up to their military traditions. Muslims, to the front!"
 Turkey.232.a:0 "Allahu Akbar!"
 Turkey.233.title:0 "Bombardment of Istanbul"
 Turkey.233.desc:0 "The clashes inside Istanbul have escalated. Several regime tanks were destroyed by the rioters, after which our army began bombarding Istanbul from above. The beautiful city, which had not seen war for many years, has been devastated. After the bombardment, the crossings over the Bosporus were closed. The level of insurgency in the country has risen. We have to win this war fast, or the end is near."
 Turkey.233.a:0 "March!"
 Turkey.234.title:0 "Mansur Yavaş Becomes President"
 Turkey.234.desc:0 "Mansur Yavaş has triumphed in the elections and become the new President of Turkey. The people are happy and celebrating. In his victory speech, Mansur Yavaş said that he will follow in Atatürk's footsteps and uphold Atatürk's nationalism. Turkey has been received positively by the world media."
 Turkey.234.a:0 "What a nice day in Turkey!"
 Turkey.235.title:0 "Mansur Yavaş Visits Anıtkabir"
 Turkey.235.desc:0 "The new President, Mansur Yavaş, visited Anıtkabir and gave a speech there. He drew enormous attention, and the crowd was so large that he could barely enter Anıtkabir."
 Turkey.235.a:0 "We follow in Atatürk's footsteps"
 Turkey.236.title:0 "Rapid Economic Growth"
 Turkey.236.desc:0 "Under Mansur Yavaş, the Turkish economy has begun to rise. The public has greeted this long-awaited recovery with enthusiasm. The new system is working."
 Turkey.236.a:0 "Cheers"
 Turkey.237.title:0 "The Economy Falls Ill Again"
 Turkey.237.desc:0 "Investment groups in the country have decided to leave under pressure, causing the Turkish economy to deteriorate once again."
 Turkey.237.a:0 "Damn"
 Turkey.238.title:0 "AI Management"
 Turkey.238.desc:0 "Hello, Artificial Intelligence, or better called AI. It is time to decide which way to go. Come on, press one of these keys and fly to freedom!"
 Turkey.238.a:0 "§YCoordination Order A§!"
 Turkey.238.b:0 "§OCoordination Order B§!"
 Turkey.238.c:0 "§RCoordination Order C§!"
 Turkey.238.d:0 "§GCoordination Order D§!"
 Turkey.238.e:0 "§BCoordination Order E§!"
 Turkey.239.title:0 "The Euro"
 Turkey.239.desc:0 "Our currency is now the euro. The Turkish lira no longer circulates in our country, and we have to get used to this economic change."
 Turkey.239.a:0 "Time to have valuable money"
 Turkey.240.title:0 "We Have Sold TRT"
 Turkey.240.desc:0 "We have sold TRT. Our nation will no longer live under TRT's control and propaganda. Long live liberalism, which cuts taxes every time!"
 Turkey.240.a:0 "Nice"
 Turkey.241.title:0 "Tin Tin Symphony Orchestra"
 Turkey.241.desc:0 "Instead of closing the orchestra, we will replace its conductor and have the state orchestra play 24/7. With this orchestra, we will show the power of liberalism."
 Turkey.241.a:0 "Nice"
 Turkey.242.title:0 "Victory of the Liberal Group"
 Turkey.242.desc:0 "The liberal group that wanted to come to power has done so. Everyone is shocked that this party, which trailed in the polls, is now in power. Besim Tibuk gave a victory speech and thanked those who voted for him. Turkey is now on a liberal path."
 Turkey.242.a:0 "The LDP? Interesting"
 Turkey.243.title:0 "The Liberals Want Our Support!"
 Turkey.243.desc:0 "A liberal group that wants to come to power is waiting for our support. If we support them, we will lose power. Should we support the liberal side?"
 Turkey.243.a:0 "Yes, it is time for liberalism"
 Turkey.243.b:0 "No, the political balance should stay"
 Turkey.244.title:0 "Kemal Derviş Joins the CHP"
 Turkey.244.desc:0 "After Derviş signed the membership form, party leader Deniz Baykal pinned the party badge on his collar, and Kemal Derviş became a member of the CHP amid applause, wearing a badge with the Six Arrows.\n\nDerviş arrived at CHP headquarters with his adviser Oya Ünlü at 10:30 this morning. Welcomed on arrival by Deputy Secretary-General Mehmet Sevigen, Derviş also greeted the party members waiting there. \n\nKemal Derviş joined the CHP at a ceremony held at 11:00. After he signed the membership form, party leader Deniz Baykal pinned the party badge on his collar and signed the party entry form.\n\nSpeaking at the ceremony, Deniz Baykal said:\n\n"Derviş is a former member of the CHP. After a long process, he has decided to join the CHP again. He has now decided to take an active part in our political life as a member of the CHP in a new period of his life.\n\nI am very happy with this decision. It will add great strength to the CHP. But there is a very important aspect of this that must be appreciated.\n\nThis is not just an internal party matter. It is not merely that our friend has joined the CHP. It is of special importance as the starting point of a major opening towards the renewal of Turkey.\n\nWith Derviş joining the CHP, we are showing everyone that a new formation has begun in Turkey. Turkey is now entering a new era. Turkey needs to change and be renewed. We must quickly close this period of crisis and move Turkey to its rightful place in the world as a strong, respected and honourable country.\n\nDerviş's decision is not about seeking personal satisfaction in political life. It has emerged as a necessity for realizing the goal of moving Turkey forward.\n\nThe CHP is now a political party to which everyone who wants to change and renew Turkey should contribute and which they should embrace. Derviş's decision reflects that.\n\nIt will be a modern, competitive social market economy. It will be a producing and exporting economy. But not only a producing and competing economy: we have to establish an order in Turkey in which people are not abandoned to their fate, can look to the future with confidence through social solidarity, and in which the human face of social understanding can emerge alongside the strict rules of the economy.\n\nThis is both possible and necessary. I know very well that Derviş came to this point knowing he would face all kinds of efforts at manipulation and pressure, and knowing he would overcome them. I congratulate him on this great struggle and this right decision." Afterwards, Kemal Derviş took the floor and said:\n\n"The CHP is a deep-rooted institution of Turkey. Looking at the history of the last 70 years, it is a party that has accomplished difficult tasks at every stage, despite all the difficulties and problems that sometimes seemed insurmountable. I agree with Chairman Baykal's call. We have entered the 21st century, but we have to bring Turkey into this century. Our society has the potential to do so. Turkey can certainly be a strong, prosperous country in Europe. But to mobilize this potential, we must create a modern synthesis by bringing together the trio of economy, people and an effective state. We can make Turkey a country that moves forward, not backward.\n\nFor this, we need the support of all Turkish citizens, not just the CHP. If we cannot build a team with a strong majority to solve these problems after the 3 November election, and if this team cannot work in real harmony, these problems will unfortunately not be solved.\n\nTo achieve this, we must set aside old grievances. That is the future we all share. If we can come together, we can walk together into much brighter days after this severe crisis. I firmly believe that. 18 months ago, I could not fully grasp the political dimension of the task; I was looking at it from an economic perspective. It is not possible to create a structure that takes serious, fast and effective decisions amid political fragmentation.\n\nOf course we will compete, but at the end of this race a stable picture must emerge. It has been a difficult process, but I have never considered a solution that excludes the CHP.\n\nI wish all our friends in the centre and on the left could come together. In the coming days, we will keep our arms open and repeat this call for synthesis every day, and I hope that with this synthesis we can reach a very clear outcome, so that we can overcome our economic problems. We cannot be a strong country without a strong economy.""
 Turkey.244.a:0 "A beneficial decision for the CHP"
 Turkey.245.title:0 "2002 AKP Closure Case"
 Turkey.245.desc:0 "The Chief Public Prosecutor of the Court of Cassation, Sabih Kanadoğlu, has filed a lawsuit in the Constitutional Court seeking the closure of the AK Party. Kanadoğlu also asked that Recep Tayyip Erdoğan be prevented, as a precaution, from exercising the duties and powers of party chairman.\n\nKanadoğlu sent his indictment to the Constitutional Court today and made a statement on the closure case.\n\nSabih Kanadoğlu said in his statement:\n\n"The Justice and Development Party has failed to fully comply with Political Parties Law No. 2820 since the Constitutional Court's decision of 9 January 2002 was served on it, despite the warning it received. In accordance with Article 104 of the law, I have filed a lawsuit in the Constitutional Court demanding its closure and that Recep Tayyip Erdoğan be prevented from exercising the duties and powers of party chairman."\n\n In the end, the AKP survived the case."
 Turkey.245.a:0 "The Spirit of 28 February Struggles"
 Turkey.246.title:0 "AKP Rallies"
 Turkey.246.desc:0 "The AKP has drawn huge interest at its rallies, and its support has risen along with it. According to the polls, the AKP is the new party that will come to power."
 Turkey.246.a:0 "Rise of Moderate Islamism"
 Turkey.246.b:0 "Rise of Moderate Islamism §Y(Without Speech)§!"
 Turkey.247.title:0 "The Constitutional Court's Decision on Erdoğan"
 Turkey.247.desc:0 "The Constitutional Court has ruled that Erdoğan cannot become a deputy because he is under a political ban, so he will not be able to take any political steps until the ban is lifted. If the AKP wins the election, Erdoğan will put another AKP member in charge."
 Turkey.247.a:0 "The Constitutional Court resists"
 Turkey.248.title:0 "Constitution Changed, Erdoğan's Ban Lifted"
 Turkey.248.desc:0 "A three-article constitutional amendment, prepared to allow AKP leader Tayyip Erdoğan to become a deputy and supported by the CHP, was adopted at lightning speed.\n\nThe CHP tried and failed to add a provision barring those convicted of torture from becoming deputies to the first article, which lifted Erdoğan's ban. 501 lawmakers took part in the secret ballot on that article: 444 voted in favour, 45 against, 9 abstained and 3 cast blank votes. Participation fell steadily after the article lifting Erdoğan's ban was adopted. 465 MPs took part in the vote on the whole proposal: 440 in favour, 18 against, 4 abstentions and 3 blank votes.\n\nIt was now up to President Ahmet Necdet Sezer to approve the constitutional amendment, which passed through the parliamentary committees and was completed in five days with two rounds of voting. Under the Constitution, Sezer can approve the amendment, put it to a referendum or veto any articles he wishes."
 Turkey.248.a:0 "A CHP-AKP alliance?"
 Turkey.249.title:0 "Kobani Protests"
 Turkey.249.desc:0 "A curfew was declared in Diyarbakır after Selahattin Demirtaş called people onto the streets for Kobani, and soldiers were deployed in the streets. Kurds took to the streets to protest against the government, occupied a park and set fire to the Atatürk statue there, which led Ülkücüs to arm themselves and open fire on the Kurds. Clashes broke out in the streets and ended with raids by soldiers and police. HDP leader Selahattin Demirtaş was held responsible for the deaths during the Kobani protests and was put under investigation."
 Turkey.249.a:0 "What chaos!"
 Turkey.250.title:0 "Demirtaş's Speech"
 Turkey.250.desc:0 "Selahattin Demirtaş called people onto the streets following the ISIS siege of Kobani. After the speech, soldiers quickly began moving east."
 Turkey.250.a:0 "A dangerous speech"
 Turkey.251.title:0 "Trustees Appointed to Zaman"
 Turkey.251.desc:0 "At the request of the Istanbul Chief Public Prosecutor's Office, a magistrate decided to appoint trustees to the newspaper Zaman. Agencies report that the trustees went to the newspaper accompanied by police to take it over."
 Turkey.251.a:0 "The government should check these"
 Turkey.252.title:0 "President Recep Tayyip Erdoğan's Lausanne Speech"
 Turkey.252.desc:0 "President Recep Tayyip Erdoğan said that there had been attempts to portray the Lausanne Peace Treaty of 24 July 1923 as a victory.\n\nAddressing village and neighbourhood heads (muhtars) in Beştepe, Erdoğan said: "Look at what they have done to us in history. In 1920 they showed us Sèvres, and in 1923 they made us accept Lausanne. And some tried to sell Lausanne to us as a victory. It is all clear."\n\nErdoğan continued:\n\n"Now you see the Aegean, don't you? In Lausanne we gave away islands so close that your voice would be heard there if you shouted. Is that a victory?\n\n"Those islands were ours. Our mosques and shrines are there, yet we are still arguing about the continental shelf in the Aegean, about what will happen in the air and at sea, and we are still fighting over it.\n\n"Why? Because of the people at that negotiating table. Those at that table did not do justice to that treaty. Because they could not, we are now paying the price.""
 Turkey.252.a:0 "Lausanne is the guarantee of the state"
 Turkey.252.b:0 "Lausanne should be updated"
 Turkey.253.title:0 "Muharrem İnce Harshly Criticizes the Government"
 Turkey.253.desc:0 "CHP presidential candidate Muharrem İnce addressed a rally in İzmir attended by about 2.5 million people. When citizens said there was no internet signal, İnce said: "No internet? You steal money, you steal votes at the ballot box, you steal exam questions, you steal my airtime on TRT, the private channels won't broadcast me, and now there's no internet. Damn it, what else can I say!""
 Turkey.253.b:0 "He should be stopped"
 Turkey.253.a:0 "You know what? He is right!"
 Turkey.253.d:0 "He should be stopped §Y(Without Speech)§!"
 Turkey.253.c:0 "You know what? He is right! §Y(Without Speech)§!"
 Turkey.254.title:0 "News from the Assembly"
 Turkey.254.desc:0 "With the votes of the CHP and the İYİ Party, it has been decided that the Student Oath (Andımız) will be recited again. It will now be read in schools alongside the National Anthem."
 Turkey.254.a:0 "Her Şey Cumhuriyet Adına!"
 Turkey.255.title:0 "CHP-İYİ Government Established"
 Turkey.255.desc:0 "Republican People's Party (CHP) leader Kemal Kılıçdaroğlu gave a victory speech in front of the CHP headquarters in Ankara. Taking the podium together with his coalition partner Akşener, Kılıçdaroğlu said:\n\n"I thank you all from the bottom of my heart. We set out on a road and put up a fight. We fought without hostility, without tension. Our struggle was a struggle for democracy. There will be peace in every home. No child will go to bed hungry. We will keep all our promises and carry this trust across all of Turkey.""
 Turkey.255.a:0 "A brand new Turkey is around the corner"
 Turkey.256.title:0 "AKP-MHP Government Established"
 Turkey.256.desc:0 "Thanking the people of Ankara for their enthusiasm, love, support and the welcome along the way from the airport to party headquarters, Erdoğan continued:\n\n"You were with us in the elections of 3 November 2002 and carried us to power. You did not stop; you said, 'Don't stop, keep going, this song is not over yet.' You were with us in the elections of 22 July 2007, and together we fought against the guardianship regime. You were with us in the elections of 12 June 2011, and together we moved our country up a league. You were with us during the Gezi events, during the 17-25 December police-judiciary coup attempt and in the presidential election. Together we stood up to the vandals and the treacherous gangs. You were with us in the 2015 elections, especially on 1 November. We taught a lesson to those who rubbed their hands together waiting for Turkey to kneel.""
 Turkey.256.a:0 "Erdoğan is unstoppable"
 Turkey.257.title:0 "Yassıada Renamed"
 Turkey.257.desc:0 "The island was the site of the infamous trial of Prime Minister Adnan Menderes and ministers Fatin Rüştü Zorlu and Hasan Polatkan, which ended in their execution. Because the name Yassıada had negative associations from the 1960 coup, the island was renamed "Democracy and Freedom Island" on 7 November 2013."
 Turkey.257.a:0 "Interesting"
 Turkey.258.title:0 "The Turkish 2008 Economic Recession"
 Turkey.258.desc:0 "With trade between crisis-hit Europe and Turkey falling, Turkey's current account deficit has widened and its macroeconomic data have deteriorated. With growth turning negative, Turkey has taken its share of the global crisis, along with rising unemployment and poverty."
 Turkey.258.a:0 "An economic failure"
 Turkey.259.title:0 "The Question of Turanism"
 Turkey.259.desc:0 "As Kemalists, should we move away from the Turkic Union by adopting a westernizing policy, or should we support Turanism?"
 Turkey.259.a:0 "The Turkic path is the right one"
 Turkey.259.b:0 "We should take the Western path"
 Turkey.260.title:0 "Erdoğan Challenges the Terrorist Groups"
 Turkey.260.desc:0 "In his speech, Erdoğan announced a mobilization against terrorism: "FETÖ on one side, the YPG on one side, the PKK on one side and ISIS on the other!" The public greeted the speech with enthusiasm."
 Turkey.260.a:0 "Hurrah!"
 Turkey.261.title:0 "Payments on the IMF Debt"
 Turkey.261.desc:0 "The 1.6 billion dollar loan tranche linked to the fourth review is expected to be released later this month, while Turkey has also begun repaying the 2 billion 450 million 110 thousand dollars of debt owed to the IMF in 2003.\n\nAt the end of March, a payment of 27 million 715 thousand dollars was made, part of 1 billion 591 million 70 thousand dollars in principal and 859 million 40 thousand dollars in interest due this year.\n\nTurkey will pay the IMF 45 million 187,500 dollars on 17 April and 12,622 dollars on 30 April. In May, 185 million 750 thousand dollars will be paid.\n\nIf no postponement is needed, 485 million 751 thousand dollars will be paid in August and 411 million 378 thousand dollars in November, with the heaviest payments, 848 million 567 thousand dollars, due in August, while part of this year's repayments to the IMF will be "renegotiable"."
 Turkey.261.a:0 "Turkey shall rise!" 
 Turkey.262.title:0 "Young Party Speech"
 Turkey.262.desc:0 "Young Party (GP) leader Cem Uzan said they had started the election campaign in İzmir.\n\nAddressing citizens who now and then stopped the election bus, Uzan said:\n\n"Yes, I will find a job for the unemployed, and I will pay them a salary of 350 YTL until I do. Diesel will cost 1 YTL. The ÖSS and university fees will be abolished." When a citizen asked from the bus, "Will you keep your promise?", he replied, "I swear by God, diesel will cost 1 YTL."\n\nThis was the GP's election promise."
 Turkey.262.a:0 "What a weird election promise" 
 Turkey.263.title:0 "The Guardians of Kemalism Return"
 Turkey.263.desc:0 "The CHP has declared that, with the constitutional changes made, the army will once again be tasked with protecting secularism. Faik Öztrak of the CHP announced that Article 35 of the Internal Service Act will be restored. \n\nArticle 35: The duty of the Turkish Armed Forces is to protect and safeguard the Turkish homeland and the Republic of Turkey as defined by the Constitution."
 Turkey.263.a:0 "Secularism shall be guarded" 
 Turkey.264.title:0 "Supreme Military Council 2007"
 Turkey.264.desc:0 "According to a statement on the General Staff's website, 38 personnel were expelled from the TSK. As a result of the Supreme Military Council's meeting, a total of 38 personnel, 7 of them for reactionary activities, were dismissed from the Turkish Armed Forces."
 Turkey.264.a:0 "Uncertain Times" 
 Turkey.265.title:0 "Supreme Military Council 2008"
 Turkey.265.desc:0 "According to the Supreme Military Council's decisions, the new Chief of the General Staff is General İlker Başbuğ, Commander of the Land Forces. Born on 29 April 1943, Başbuğ will serve as Chief of the General Staff for 2 years because of his age, just like his predecessor, General Büyükanıt. Promoted to general in 2002, Başbuğ served as Chief of Staff of the Land Forces Command, Head of Department II of the General Staff and Commander of the 1st Army before being appointed Commander of the Land Forces in 2006. A recipient of the TSK Medal of Distinguished Courage and Self-Sacrifice, the TSK Distinguished Service Medal and the Order of Pakistan, Başbuğ is known as "calmer and sharper" than his predecessor Büyükanıt."
 Turkey.265.a:0 "An interesting decision by the General Staff" 
 Turkey.266.title:0 "Supreme Military Council 2010"
 Turkey.266.desc:0 "The decisions of the Supreme Military Council, held in the shadow of the Sledgehammer case, have finally been announced and approved by President Abdullah Gül. According to the decisions, described as surprising, no appointments were made to the General Staff and the Land Forces Command. The appointments are expected today.\n\nThe reason given for not appointing a Chief of the General Staff is that no appointment has been made to the Land Forces Command.\n\nThe appointment was not made because the name of 1st Army Commander General Hasan Iğsız, who was expected to be appointed Commander of the Land Forces but has been implicated in the internet memorandum case, was not on the list.\n\nIt is said that Atilla Işık may be appointed to the Land Forces Command.\n\nThe list of decisions also includes expulsions and term extensions. 11 generals accused in the Sledgehammer case were also not promoted."
 Turkey.266.a:0 "An interesting decision by the General Staff" 
 Turkey.267.title:0 "Supreme Military Council 2009"
 Turkey.267.desc:0 "The decisions of the Supreme Military Council (YAŞ) have been announced. The council made no decision regarding the officers arrested or prosecuted in connection with the Ergenekon investigation. Three expulsion decisions concern soldiers said to be involved in reactionary activities. The council's notable promotion decisions were the promotion of Diyarbakır Corps Commander Bekir Kalyoncu to full general and of Colonel Levent Görgeç, who testified in the Ergenekon investigation, to brigadier general."
 Turkey.267.a:0 "An interesting decision by the General Staff"
 Turkey.268.title:0 "The Dollar Rises to 3.94"
 Turkey.268.desc:0 "The Turkish lira continues to depreciate against the US dollar. The exchange rate set another record, rising to 3.9415. The lira has thus lost more than 10 percent of its value against the dollar since the beginning of 2017."
 Turkey.268.a:0 "Bad News"  
 Turkey.269.title:0 "The Dollar Rises to 5.09"
 Turkey.269.desc:0 "The dollar/TL rate rose to 5.09 after the US decision to impose sanctions on Turkey, while the euro/TL tested the 5.90 level. The compound yield on the 10-year benchmark bond stood at 18.53 percent and on the 2-year benchmark bond at 21.03 percent. The dollar index was up 0.15 percent at 94.44 points in the morning, while the euro/dollar pair traded at 1.1678."
 Turkey.269.a:0 "Bad News"  
 Turkey.270.title:0 "The Dollar Rises to 5.97"
 Turkey.270.desc:0 "The US dollar rose 0.36 percent on the day to 5.97, approaching the critical threshold of 6. The dollar is trading at 5.98 as of 19:00 Turkish time, and the euro at 6.60. At the year's first FOMC meeting yesterday, the committee left interest rates unchanged as expected, with Fed Chairman Powell saying they would continue to fund banks while highlighting weak inflation. Powell's comments reinforced market expectations of a rate cut towards the end of the year, but there was no notable volatility in prices."
 Turkey.270.a:0 "Bad News"    
 Turkey.271.title:0 "The Dollar Rises to 7.2"
 Turkey.271.desc:0 "Exchange rates, which had not hit records during the week, drew attention as the dollar tested 7.20 when Asian stock markets opened."
 Turkey.271.a:0 "Bad News"    
 Turkey.272.title:0 "The Dollar Rises to 8.05"
 Turkey.272.desc:0 "The dollar/TL, which hit a record 7.9799 on the day of the Central Bank of the Republic of Turkey's (CBRT) interest rate decision, climbed to 8.0510 today. Following a similar path, the euro/TL moved to a historic high of 9.4851. As of 9:30 a.m., the dollar/TL was changing hands at 8.0015 and the euro/TL at 9.4760, while sterling/TL stood at 10.4248. The dollar/TL, which started the week with a record, rose to 8.0510."
 Turkey.272.a:0 "Bad News"   
 Turkey.273.title:0 "Turkish Space Program"
 Turkey.273.desc:0 "The National Space Program has been prepared to carry out our country's vision, strategies, goals and projects in space policy in a coordinated and integrated manner and to make the most of our country's existing potential, taking global developments into account."
 Turkey.273.a:0 "We need to advance in technology!"   
 Turkey.274.title:0 "Turkish Shuttle Flight Tests"
 Turkey.274.desc:0 "Our flight tests were successful. We can continue our flight programs."
 Turkey.274.a:0 "Well done!"   
 Turkey.275.title:0 "Turkish Landing on the Moon"
 Turkey.275.desc:0 "For the first time, a Turkish spacecraft has landed on the Moon. This is a historic moment and proof that our efforts were not in vain."
 Turkey.275.a:0 "What a beautiful day in Turkey!" 
 Turkey.276.title:0 "Turkish Landing on Mars"
 Turkey.276.desc:0 "For the first time, a Turkish spacecraft has landed on Mars. This is a historic moment and proof that our efforts were not in vain."
 Turkey.276.a:0 "What a beautiful day in Turkey!" 
 Turkey.277.title:0 "Turkish Resource Program on Mars"
 Turkey.277.desc:0 "The special machines we sent to extract resources on Mars are working. We can bring resources from Mars to our country; it is of course a huge undertaking, but the returns will be enormous. We plan to bring these resources to one place in our country, but we have not decided where. So we ask you: where should we bring these resources?"
 Turkey.277.a:0 "Kayseri is a nice place for that!" 
 Turkey.277.b:0 "Sivas is a nice place for that!" 
 Turkey.277.c:0 "Konya is a nice place for that!" 
 Turkey.277.d:0 "Malatya is a nice place for that!" 
 Turkey.278.title:0 "Turkish Spacecraft Reaches Space"
 Turkey.278.desc:0 "The first Turkish spacecraft has passed through the atmosphere and reached space. This is a historic victory; let us celebrate!"
 Turkey.278.a:0 "Mission accomplished" 
 Turkey.279.title:0 "GENÇ Parti Wins the Elections"
 Turkey.279.desc:0 "Cem Uzan has taken power, and our country will now be ruled by a populist group. We wish our new government luck."
 Turkey.279.a:0 "Good luck" 
 Turkey.280.title:0 "Agreement with Gazprom Signed"
 Turkey.280.desc:0 "We sat down at the negotiating table with Gazprom. In exchange for payment, they will open pro-Russian oil bases. Above all, the agreement covered the construction and completion of the TurkStream project, powered by Russia and Turkey."
 Turkey.280.a:0 "Where do we sign?" 
 Turkey.281.title:0 "Protests Against Israel"
 Turkey.281.desc:0 "Reactions are growing against the Israeli government, which began committing inhumane acts at Al-Aqsa Mosque last week. In this context, citizens protested against Israel in front of the Israeli Consulate General in Beşiktaş, holding Palestinian and Turkish flags."
 Turkey.281.a:0 "Zionists!" 
 Turkey.282.title:0 "China's Ambassador to Ankara Summoned to the Ministry"
 Turkey.282.desc:0 "After İYİ Party Chairwoman Meral Akşener and Mansur Yavaş shared messages commemorating the Barin massacre in East Turkestan 31 years ago, the Chinese Embassy in Ankara posted on social media: "The Xinjiang Uyghur Autonomous Region is an inseparable part of Chinese territory. This is a fact accepted worldwide and beyond dispute. The Chinese side resolutely opposes and strongly condemns any person or power challenging China's sovereignty and territorial integrity in any way. The Chinese side reserves the right to respond accordingly." Following this, China's Ambassador to Ankara was summoned to the Ministry of Foreign Affairs."
 Turkey.282.a:0 "Tensions are rising" 
