 TUR_earthquake_cautions:0 "Turkish Housing and Earthquake Safety"
 TUR_earthquake_description_desc:0 "Turkey has experienced many earthquakes. This list includes notable historical earthquakes with epicenters within the current borders of Turkey, or which caused significant effects in this area. Overall, the population in major cities like Istanbul lives in a mix of vulnerable and earthquake-resistant buildings.\n\nTectonic setting\nTurkey is a seismically active area within the complex zone of collision between the Eurasian Plate and both the African and Arabian Plates. Much of the country lies on the Anatolian Plate, a small plate bounded by two major strike-slip fault zones, the North Anatolian Fault and the East Anatolian Fault. The western part of the country is also affected by the zone of extensional tectonics in the Aegean Sea caused by the southward migration of the Hellenic arc. The easternmost part of Turkey lies on the western end of the Zagros fold and thrust belt, which is dominated by thrust tectonics.\n\nSeismic hazard\nSeismic hazard in Turkey is highest along the plate boundaries, but there is a significant risk of damaging earthquakes almost anywhere in the country. Seismic risk maps have changed over time.                     \n\n\n\n\n\n\n\n\n\n\n\n\n\n§gEarthquakes in Turkey affect housing projects, which makes housing a difficult subject in our country. We have to make a decision:\n\n1) We use cheap materials and leave the buildings in poor condition, without regard for our people's lives.\n\n2) We try to protect our people's lives by giving housing projects a reasonable budget.\n\n3) We protect our people's lives by making housing projects expensive.\n\n§RIf we keep poor buildings, we will suffer maximum damage.\n§YIf we keep moderately resistant buildings, we will suffer medium damage.\n§GIf we keep fully resistant buildings, we will suffer minimum damage.\n\n§YKeep in mind that only earthquakes of magnitude 7 and above change these effects.\n\n£pol_idea §YEarthquake Resistance:§! §R[?TUR_building_resistancy]§!"
