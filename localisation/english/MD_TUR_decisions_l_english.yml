 TUR_army_resists:0 "Guardians of Kemalism"
 TUR_armys_resists_desc:0 "Our army, which considers itself the protector of Kemalism in our country, organized and carried out coups in 1960 and 1980 in response to what it saw as damage to the Kemalist order. \n\nOur military generally dislikes conservative parties and supports secularist ones. \n\nIf we want to prevent our army from carrying out a coup, we must keep it satisfied. If we want to rule out a coup entirely, we will have to wait a little longer.\n\nOur army's thoughts about the parties:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nOther reasons for a military coup are the country's stability and economy. \n\n If the country's stability is below §R20§!£stability_texticon and the economy is bad, the chances of a coup are high."
