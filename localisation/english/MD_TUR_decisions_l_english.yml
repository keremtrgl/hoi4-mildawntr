 TUR_the_covid:0 "COVID-19"
 TUR_the_covid_desc:0 "COVID-19, also known as coronavirus disease 2019, is a highly contagious respiratory illness caused by severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2). The disease was first identified in December 2019 in Wuhan, Hubei Province, China, and quickly spread to become a global pandemic.\n\nCOVID-19, spreading around the world, has also reached our country and has started to harm it. There will certainly be casualties, and we need to overcome it one way or another. Let us start beating COVID-19."
