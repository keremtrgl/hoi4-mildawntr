 TUR_robbing_desc:0 "Working is entirely unnecessary. Stealing instead of working brings profit and power, and as a mafia government, we will dominate the world and grow rich by stealing the innovation programs and money of the global world. No country in the world can steal as easily as we do, because in almost no other country is the mafia completely independent, and its power is limited. Here, on the contrary, the mafia is free, and it runs the government.\n\nOur theft-based economic program will work! For example: what will happen if the United States loses the Pentagon files? What will Russia be able to do once its military secrets are exposed? Nothing at all; the only thing they can do is obey us! Long live the Supreme Mafia Regime!"
