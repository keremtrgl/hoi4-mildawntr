 TUR_court_desc:0 "The Constitutional Court of Turkey, sometimes abbreviated as AYM, is the highest legal body for constitutional review in Turkey. It examines the constitutionality, in respect of both form and substance, of laws, decrees having the force of law, and the Rules of Procedure of the Grand National Assembly of Turkey.\n\n§YHere are the statistics of the AYM:§!\n\n\n\n\n\n§YThe groups within the court:§!\n\n\n\n\n\n\nThe unity rate of the AYM indicates its capacity for self-renewal. If this capacity is high, the AYM tends to reject radical choices. \n\nThe politicization rate of the AYM indicates how troubled the court is. If politicization rises too much, the military could step in. \n\nThe groups only matter if the AYM takes over the regime, so you can ignore them until then."
