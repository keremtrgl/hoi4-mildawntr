 TUR_parliament:0 "Grand National Assembly"
 TUR_parliaments_desc:0 "The Grand National Assembly of Turkey, usually referred to simply as the TBMM or Parliament, is the unicameral Turkish legislature. It is the sole body given legislative prerogatives by the Turkish Constitution. It was founded in Ankara on 23 April 1920, in the midst of the National Struggle. Shortly afterwards, in May 1920, it formed its own government, the Executive Council of Ministers. The parliament was fundamental to the efforts of Mustafa Kemal Atatürk, 1st President of the Republic of Turkey, and his colleagues to found a new state out of the remnants of the Ottoman Empire.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nIf the military interferes in the country's politics, the Parliament may be closed, and in the event of war, the military can take over the governing bodies itself.\n\n\n\n\n\n\n\n\n\n\n\n\n                               Photo of the Grand National Assembly of Turkey"
