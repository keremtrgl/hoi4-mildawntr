 TUR_pkk_insurgency_category: "Kurdish-Turkish Conflict - Military Branch"
 TUR_pkk_insurgency_category_desc: "The §Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§!, along with many other minor Kurdish insurgent groups, have been waging a guerrilla war against the Turkish government since the 1980s. The goals of these groups range from full independence to substantial autonomy. \n\n§Y£pkk PKK §! activity is measured by their §YAggressiveness§! and §YStrength§!.\n\n§YAggressiveness§! measures the overall willingness of the §Y£pkk PKK §! to fight and influences the frequency of attacks. §YAggressiveness§! decreases naturally every week down to a certain cap. The aggressiveness cap can both decrease and increase based on the development of the Kurdish provinces, as well as your and other countries' events and decisions. If it drops to 50 or lower, the §Y£pkk PKK §! will call a ceasefire. Low §HAggressiveness§! does not mean no attacks, only that the §Y£pkk PKK §! will conduct fewer attacks than usual.\n\n§YStrength§! measures the military capabilities and popularity of the §Y£pkk PKK §! and affects the strength of resistance in Kurdish states. The minimum value of §YStrength§! is 15 for every country the §Y£pkk PKK §! operates in. Strength also affects the damage done by attacks: the higher it is, the more they will hurt.\n\n§YAggressiveness§! results in a §Rhigher frequency of attacks§!, and §HStrength§! determines the damage done by these attacks. These random attacks increase §Y£pkk PKK §! §HStrength§!, which can lead to the §Y£pkk PKK §! declaring independence from us if it reaches §H100!§! We can manually reduce the §Y£pkk PKK §!'s §Hstrength§! through raids, but we would risk increasing their §HAggressiveness§!.\n\n§GHow to end it:§! bring §Y£pkk PKK §! strength down to §Y15§! (or to its minimum while cells operate abroad) and aggressiveness to §Y45§!, then take §YEnd of the PKK§!. If the §Y£pkk PKK §! breaks away, beat it, puppet or annex it, then take §YReintegrate Kurdistan§! to restore your cores. \n\n§Y£pkk PKK §! Aggressiveness: [?TUR.TUR_PKK_aggro]\nAggressiveness Cap: [?TUR.TUR_PKK_max_aggro]\nAggressiveness: [?TUR.TUR_PKK_aggro_increase] per week\n\n§Y£pkk PKK §! Strength: [?TUR.TUR_PKK_strength]\nMinimum Strength: [?TUR.TUR_PKK_min_strength]"
 TUR_kurdish_problem_1:0 "Kurdish-Turkish Conflict - Military Branch"
 TUR_kurdish_problem_1_desc:0 "The §Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§!, along with many other minor Kurdish insurgent groups, have been waging a guerrilla war against the Turkish government since the 1980s. The goals of these groups range from full independence to substantial autonomy. \n\n§Y£pkk PKK §! activity is measured by their §YAggressiveness§! and §YStrength§!.\n\n§YAggressiveness§! measures the overall willingness of the §Y£pkk PKK §! to fight and influences the frequency of attacks. §YAggressiveness§! decreases naturally every week down to a certain cap. The aggressiveness cap can both decrease and increase based on the development of the Kurdish provinces, as well as your and other countries' events and decisions. If it drops to 50 or lower, the §Y£pkk PKK §! will call a ceasefire. Low §HAggressiveness§! does not mean no attacks, only that the §Y£pkk PKK §! will conduct fewer attacks than usual.\n\n§YStrength§! measures the military capabilities and popularity of the §Y£pkk PKK §! and affects the strength of resistance in Kurdish states. The minimum value of §YStrength§! is 15 for every country the §Y£pkk PKK §! operates in. Strength also affects the damage done by attacks: the higher it is, the more they will hurt.\n\n§YAggressiveness§! results in a §Rhigher frequency of attacks§!, and §HStrength§! determines the damage done by these attacks. These random attacks increase §Y£pkk PKK §! §HStrength§!, which can lead to the §Y£pkk PKK §! declaring independence from us if it reaches §H100!§! We can manually reduce the §Y£pkk PKK §!'s §Hstrength§! through raids, but we would risk increasing their §HAggressiveness§!.\n\nTo eliminate the §Y£pkk PKK§!, their strength must be below §Y15§! and their aggressiveness below §Y45§!. \n\n§Y£pkk PKK §! Aggressiveness: [?TUR.TUR_PKK_aggro]\nAggressiveness Cap: [?TUR.TUR_PKK_max_aggro]\nAggressiveness: [?TUR.TUR_PKK_aggro_increase] per week\n\n§Y£pkk PKK §! Strength: [?TUR.TUR_PKK_strength]\nMinimum Strength: [?TUR.TUR_PKK_min_strength]"
 TUR_kurdish_problem_2:0 "Kurdish-Turkish Conflict - Civilian Branch"
 TUR_kurdish_problem_2_desc:0 "The §Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§!, along with many other minor Kurdish insurgent groups, have been waging a guerrilla war against the Turkish government since the 1980s. The goals of these groups range from full independence to substantial autonomy. \n\n§Y£pkk PKK §! activity is measured by their §YAggressiveness§! and §YStrength§!.\n\n§YAggressiveness§! measures the overall willingness of the §Y£pkk PKK §! to fight and influences the frequency of attacks. §YAggressiveness§! decreases naturally every week down to a certain cap. The aggressiveness cap can both decrease and increase based on the development of the Kurdish provinces, as well as your and other countries' events and decisions. If it drops to 50 or lower, the §Y£pkk PKK §! will call a ceasefire. Low §HAggressiveness§! does not mean no attacks, only that the §Y£pkk PKK §! will conduct fewer attacks than usual.\n\n§YStrength§! measures the military capabilities and popularity of the §Y£pkk PKK §! and affects the strength of resistance in Kurdish states. The minimum value of §YStrength§! is 15 for every country the §Y£pkk PKK §! operates in. Strength also affects the damage done by attacks: the higher it is, the more they will hurt.\n\n§YAggressiveness§! results in a §Rhigher frequency of attacks§!, and §HStrength§! determines the damage done by these attacks. These random attacks increase §Y£pkk PKK §! §HStrength§!, which can lead to the §Y£pkk PKK §! declaring independence from us if it reaches §H100!§! We can manually reduce the §Y£pkk PKK §!'s §Hstrength§! through raids, but we would risk increasing their §HAggressiveness§!.\n\nTo eliminate the §Y£pkk PKK§!, their strength must be below §Y15§! and their aggressiveness below §Y45§!. \n\n§Y£pkk PKK §! Aggressiveness: [?TUR.TUR_PKK_aggro]\nAggressiveness Cap: [?TUR.TUR_PKK_max_aggro]\nAggressiveness: [?TUR.TUR_PKK_aggro_increase] per week\n\n§Y£pkk PKK §! Strength: [?TUR.TUR_PKK_strength]\nMinimum Strength: [?TUR.TUR_PKK_min_strength]"
 TUR_turkmeneli_integration_desc:0 "Turkmeneli, also known as the Turkmen land and historically as Turcomania, is a political term for the vast swath of territory in which the Iraqi Turkmens have historically formed a dominant population. The term covers the Iraqi Turkmen homelands running from Iraq's border with Turkey and Syria diagonally down the country to the border with Iran."

