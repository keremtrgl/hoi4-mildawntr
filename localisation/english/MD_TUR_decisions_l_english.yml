 TUR_desc_ideology:0 "§RKemalism§! is the founding ideology of the Republic of Turkey. §RKemalism§!, as it was implemented by Mustafa Kemal Atatürk, was defined by sweeping political, social, cultural, and religious reforms designed to separate the new Turkish state from its Ottoman predecessor and embrace a modernized lifestyle, including the establishment of secularism, state support of the sciences and free education, many of which were first introduced to Turkey during Atatürk's presidency.\n\n§GIslamism§! refers to a broad set of political ideologies that use and draw inspiration from §GIslamic Symbols§! and traditions in pursuit of a sociopolitical objective.\n\n§YKurdish nationalism§! is a nationalist political movement that asserts that Kurds are a nation and espouses the creation of a state in Kurdistan, in opposition to the various nationalisms (Turkish, Arab, Iranian, Iraqi, and Syrian) of the states it is part of.\n\n\n\n\n\n\n\n\n\n\nThe country will not be able to unite unless complete unity is achieved, except for the Kurds in the East.\n\nGreen Cities: Controlled by Traditionalists\nRed Cities: Controlled by Kemalists\nPurple Cities: Controlled by Kurds"
