 TUR_osman_pamukoglu_question_desc:0 "Osman Pamukoğlu is a commander currently serving in the Turkish Armed Forces. Events in Turkish politics may lead this commander to enter political life, which is why his thoughts on politics are very important.\n\n§YIf Osman Pamukoğlu's negative opinion of Turkish politics rises to around §!§R%50§!§Y, he will likely enter politics instead of remaining a commander.§! \n\n§YIf Osman Pamukoğlu's negative opinion of Turkish politics stays around §!§G%25§!§Y, he will likely remain a commander.§!"
