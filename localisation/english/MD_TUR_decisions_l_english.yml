 TUR_crush_the_pkks_world_presence_desc:0 "The §Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§!, along with many other minor Kurdish insurgent groups, have been waging a guerrilla war against the Turkish government since the 1980s. The goals of these groups range from full independence to substantial autonomy. \n\n§Y£pkk PKK §! activity is measured by their §YAggressiveness§! and §YStrength§!.\n\n§YAggressiveness§! measures the overall willingness of the §Y£pkk PKK §! to fight and influences the frequency of attacks. §YAggressiveness§! decreases naturally every week down to a certain cap. The aggressiveness cap can both decrease and increase based on the development of the Kurdish provinces, as well as your and other countries' events and decisions. If it drops to 50 or lower, the §Y£pkk PKK §! will call a ceasefire. Low §HAggressiveness§! does not mean no attacks, only that the §Y£pkk PKK §! will conduct fewer attacks than usual.\n\n§YStrength§! measures the military capabilities and popularity of the §Y£pkk PKK §! and affects the strength of resistance in Kurdish states. The minimum value of §YStrength§! is 15 for every country the §Y£pkk PKK §! operates in. Strength also affects the damage done by attacks: the higher it is, the more they will hurt.\n\n§YAggressiveness§! results in a §Rhigher frequency of attacks§!, and §HStrength§! determines the damage done by these attacks. These random attacks increase §Y£pkk PKK §! §HStrength§!, which can lead to the §Y£pkk PKK §! declaring independence from us if it reaches §H100!§! We can manually reduce the §Y£pkk PKK §!'s §Hstrength§! through raids, but we would risk increasing their §HAggressiveness§!.\n\nTo eliminate the §Y£pkk PKK§!, their strength must be below §Y15§! and their aggressiveness below §Y45§!. \n\n§Y£pkk PKK §! Aggressiveness: [?TUR.TUR_PKK_aggro]\nAggressiveness Cap: [?TUR.TUR_PKK_max_aggro]\nAggressiveness: [?TUR.TUR_PKK_aggro_increase] per week\n\n§Y£pkk PKK §! Strength: [?TUR.TUR_PKK_strength]\nMinimum Strength: [?TUR.TUR_PKK_min_strength]"
