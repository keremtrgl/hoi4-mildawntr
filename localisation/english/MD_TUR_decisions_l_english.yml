 TUR_municipality_race:0 "Turkish Local Elections"
 TUR_mun_desc:0 "The municipal elections in Turkey are significant as they determine the local governance and administration of cities, towns, and districts. The candidates usually represent different political parties, and the election campaigns focus on local issues, infrastructure development, public services, and community welfare.\n\nWhat we will gain if we take over the municipalities of the country's cities:\n\n+5 Local Construction Speed\n\nMunicipal elections are held independently of general elections, so local elections may continue even if you ban elections.\n\n\n\n\n\n\n\n\n\n\nYellow Cities: Government and Coalition\nRed Cities: Opposition"
