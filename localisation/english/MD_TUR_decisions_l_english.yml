 TUR_east_express_descs:0 "The Eastern Express is an overnight passenger train operated by the Turkish State Railways. The train runs 1,310 km (814 mi) from Ankara Railway Station to Kars Railway Station in Kars. The train was the first overnight service east of Ankara. The Eastern Express stops in 7 provincial capitals: Ankara, Kırıkkale, Kayseri, Sivas, Erzincan, Erzurum, and Kars. The first train ran in 1936 from İstanbul's Haydarpaşa Terminal to Çetinkaya. \n\nThe Eastern Express still needs to be improved. Our projects are listed below."
