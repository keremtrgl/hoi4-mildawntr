 TUR_union_situation_desc:0 "Labour unions in Turkey became legal on 5 June 1946, when the phrase “no society based on class” was removed from the Law on Associations of 1938. The unions, which were closed by a martial law decision on 7 December 1946, became legal again with the adoption of the Law on Employers' Unions and Trade Unions in 1947.\n\n§gToday, labour unions and employers' unions are constantly in conflict with each other. We need to keep these unions in agreement; otherwise, bad things will happen to us, up to and including people going on strike. As long as we keep them happy, nothing bad will happen.§!\n\nLabour union forces: §Y£disk DİSK, £turk_is TÜRK-İŞ and more§!\nEmployers' union forces: §Y£tisk Collective TİSK§!\n\n§gEmployers' unions do not pose much of a problem for us, which is why we are concentrating on labour unions.§!\n\n§YLabour Unions and Threats:§!\n\n§gLabour unions may revolt if most of the conditions below are met.\n\n§RMain Causes of Strikes:§!\n\n§YBad Relations with the Unions:§! Unions will likely reduce industrial output.\n§YLow Stability:§! Causes stress in the workforce.\n§YEconomic Depression:§! Causes general unrest in the workforce.\n§YAt War:§! The workforce may keep producing until it has had enough.\n\n§GPolitical Stance of the Unions:§!\n\n§gBy building good relations with the unions, you can ally with them to increase industrial output and maximize income without angering the workers.\n\n§YPower Range of the Unions:§!\n\n§gYou can reduce their power range by passing certain laws, which become available when your relations with them are above 95.\n\n§gIf you reduce their power range, the damage they can do will be much lower.§!\n\n£population_texticon §YRelations with the Labour Unions:§! §g[?TUR_union_acceptance]§!\n£puppet_texticon §YUnions' Political Stance (In Favour):§! §g[?TUR_union_uneasiness]§!\n£market_subsidy_small_texticon §YPower Range of the Unions:§! §g[?TUR_union_political_level]§!\n\n§RKeep in mind that industrial growth will increase unionization dramatically.§!"
