 TUR.neutral_Social_desc:0 "The Independent Turkey Party is a nationalist and Kemalist political party founded on 25 September 2001 by Haydar Baş."
 TUR.Neutral_Communism: "£tur_non_aligned_communism TSİP"
 TUR.Neutral_Communism_icon: "£tur_non_aligned_communism"
 TUR.Neutral_Communism_desc: "The Socialist Workers' Party of Turkey was founded on 16 June 1974, but the party was closed following the 1980 coup. The TSİP was reestablished on 3 January 1993 by old members of the party."
 TUR.Nat_Autocracy: "£tur_nationalist_military_junta National Unity Committee"
 TUR.Nat_Autocracy_icon: "£tur_nationalist_military_junta"
 TUR.Nat_Autocracy_desc: "The modern history of the army began with its formation after the collapse of the Ottoman Empire. The Turkish military perceived itself as the guardian of Kemalism, the official state ideology, especially of its emphasis on secularism."
 TUR.Nat_Populism: "£tur_nationalist_fascism MHP"
 TUR.Nat_Populism_icon: "£tur_nationalist_fascism"
 TUR.Nat_Populism_desc:0 "The Nationalist Movement Party is a Turkish far-right political party that adheres to Turkish ultranationalism and Euroscepticism. It has at times been described as fascist and has been linked to violent militias and paramilitary groups."
 TUR.Nat_Fascism: "£tur_bozkurtlar Bozkurtlar"
 TUR.Nat_Fascism_icon:0 "£tur_bozkurtlar"
 TUR.Nat_Fascism_desc:0 "The Grey Wolves, officially known as the Idealist Hearths, is a Turkish far-right organization and movement affiliated with the Nationalist Movement Party (MHP). Commonly described as ultranationalist, Islamist and neo-fascist, it is a youth organization that has been characterized as the MHP's paramilitary or militant wing."
 TUR.Monarchist: "£tur_nationalist_monarchist House of Osman"
