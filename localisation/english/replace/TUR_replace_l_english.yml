 guerilla_warfare_desc:0 "Guerrilla warfare is a form of irregular warfare in which small groups of combatants, such as paramilitaries, armed civilians or irregulars, use tactics including ambushes, sabotage, raids, skirmishes, hit-and-run attacks and mobility to fight a larger, less mobile conventional military."
