 generic.Western_Autocracy_desc: "Pro-western autocracy refers to a broad spectrum of non-democratic, authoritarian ideologies that are aligned with the geopolitical interests of the Western Hemisphere."
 generic.neutral_Social_desc: "Social democracy refers to left-wing ideologies that espouse economic and social justice. While working within the framework of capitalism, social democrats seek a strong redistribution of wealth to curb inequality, promote the welfare state and impose more regulation on private business."
