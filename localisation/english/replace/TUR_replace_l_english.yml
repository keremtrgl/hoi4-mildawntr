 TUR.Western_Autocracy_icon:0 "£tur_pro_western_autocrat"
 TUR.conservatism_desc: "Social democracy refers to a broad spectrum of left-wing ideologies espousing economic and social justice to a greater extent than most branches of liberalism. Social democrats seek to humanize capitalism to curb inequality, oppression, and foster democracy."
