 TUR.socialism_desc: "The Republican People's Party is a social-democratic, Kemalist political party in Turkey. It is the oldest political party in the country. The CHP describes itself as "a modern social democratic party", which is faithful to the founding principles and values of the Republic of Turkey. The party is cited as "the founding party of modern Turkey". Its logo consists of the Six Arrows, which represent the foundational principles of Kemalism: republicanism, nationalism, statism, populism, laicism, and reformism. In addition, CHP is an associate member of the Party of European Socialists (PES) and a member of the Socialist International and the Progressive Alliance."
