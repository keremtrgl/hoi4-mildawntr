 #Turkey
 CLASSIC_REGIME_OF_ERDOGAN: "Classic Erdoğan Regime"
 CLASSIC_REGIME_OF_ERDOGAN_DESC: "Turkey will try to demonstrate its independence and originality by implementing a number of Islamic policies."
 LIBERAL_REFORM_OF_AKP: "The 2008 AKP Reformation"
 LIBERAL_REFORM_OF_AKP_DESC: "Turkey will bring down Erdoğan in 2008 and do everything it can to bring Turkey into the European Union."
 CHP_TAKE_OVER: "Republican People's Party"
 CHP_TAKE_OVER_DESC: "Turkey will follow a social democratic structure and try to develop its country with a democratic order."
 DSP_TAKE_OVER: "The Government Stays The Course"
 DSP_TAKE_OVER_DESC: "The current government will manage to weather the crises and preserve some of its democracy."
 MHP_TAKE_OVER: "Nationalist Movement"
 MHP_TAKE_OVER_DESC: "Widespread instability in the country will allow the far-right MHP to come to power. The MHP will try to unite the Turks under a single flag."
 JUNTA_TAKE_OVER: "The Third Military Junta"
 JUNTA_TAKE_OVER_DESC: "The Turkish Armed Forces will take over the country because of its current problems. The country will recover quickly and stay in NATO, but there will be no more democratic order."
 SAADET_TAKE_OVER: "Erbakan's Millî Görüş"
 SAADET_TAKE_OVER_DESC: "Erbakan will try to unite the whole Islamic world by putting his own views into practice."
 GENC_TAKE_OVER: "Populist Gençparti"
 GENC_TAKE_OVER_DESC: "A businessman will run Turkey, and interesting, unexpected things will happen."
 HEPAR_TAKE_OVER: "Osman Pamukoğlu's Realm"
 HEPAR_TAKE_OVER_DESC: "Osman Pamukoğlu, a former general troubled by the recent amnesty, will enter politics to save the country from its troubles and build an alternative alliance."
 TKP_TAKE_OVER: "Communist Bloc"
 TKP_TAKE_OVER_DESC: "The many communist organizations active inside Turkey will start a civil war and rule the country according to their own views."
 ANAP_TAKE_OVER: "Traditional Liberal Regime"
 ANAP_TAKE_OVER_DESC: "The traditional liberals who dominated the 1990s will return to power and try to liberalize Turkey further."
 LDP_TAKE_OVER: "Fanatic Liberal Regime"
 LDP_TAKE_OVER_DESC: "A new breed of liberals will take over Turkey and try to develop it by selling off everything the country has."
 ANARCHIST_TAKE_OVER: "Turkish Anarchists"
 ANARCHIST_TAKE_OVER_DESC: "With the new amnesty, Turkish anarchists will launch an uprising and transform the country into an international state."
 MAFIA_TAKE_OVER: "Mafia Regime"
 MAFIA_TAKE_OVER_DESC: "When the mafias grow tired of the state restricting them, they will establish a deep state and overthrow the government."
 AYM_TAKE_OVER_DESC: "As a result of rampant corruption, Turkey's Constitutional Court uses its powers to take over the regime and tries to improve the country through reforms."
 OSMAN_TAKE_OVER: "Islamic Bloc"
 OSMAN_TAKE_OVER_DESC: "In 1923 the Republic was proclaimed in Turkey and the Islamist dream faded away. But now the Islamists are coming to destroy the Republic, driven by a thirst for revenge."
 ATATURK_TAKE_OVER: "§YAtatürk Returns§!"
 ATATURK_TAKE_OVER_DESC: "As the country stands on the brink of collapse, Atatürk comes back to life and saves it from what remains.\n§YThis path is not realistic and may break the game.§!"
 TECH_TAKE_OVER: "Technocratic Takeover"
 TECH_TAKE_OVER_DESC: "The technocrats will take power under the leadership of the People's Party (HP), and the country will undergo a new transformation."
 MIT_TAKE_OVER: "MIT Takeover"
 MIT_TAKE_OVER_DESC: "Intelligence officers will take over the nation, and the country will turn to foreign intelligence work and national renewal."

