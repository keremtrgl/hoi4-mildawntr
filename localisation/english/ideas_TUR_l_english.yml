 turk_ozel_kuvvetler1_desc:0 "The Special Forces Command (Özel Kuvvetler Komutanlığı) is a unit of the Turkish Armed Forces made up of elite soldiers of various classes and ranks, trained to operate in all terrain and climate conditions to eliminate internal and external threats. Its task is to carry out special operations beyond the capabilities of other military units."
