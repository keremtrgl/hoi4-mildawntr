 agricultural_movement:0 "The Agricultural Movement"
 agricultural_movement_desc:0 "Our farmers are the masters of the nation, and we must support them; if they go bankrupt, we collapse with them. That is why, as a populist country, we back agricultural initiatives.\n\n§YAgricultural Support Level: §RVery Low§!"
 encouraged_workers:0 "Encourage Workers"
 encouraged_workers_desc:0 "The workers labor for this country, and we must empower them against the great capitalist order. Capitalism is only good when it is tamed."
 unemployment_level_3:0 "War On Unemployment"
 unemployment_level_3_desc:0 "Unemployment threatens our people's welfare, and the only way through is to bring it down. Low unemployment guarantees a stronger country, which is why we are doing everything we can to reduce it.\n\n§YEmployer Support Level: §GHigh§!"
 unemployment_level_2:0 "War On Unemployment"
 unemployment_level_2_desc:0 "Unemployment threatens our people's welfare, and the only way through is to bring it down. Low unemployment guarantees a stronger country, which is why we are doing everything we can to reduce it.\n\n§YEmployer Support Level: §YMedium§!"
 unemployment_level_1:0 "War On Unemployment"
 unemployment_level_1_desc:0 "Unemployment threatens our people's welfare, and the only way through is to bring it down. Low unemployment guarantees a stronger country, which is why we are doing everything we can to reduce it.\n\n§YEmployer Support Level: §RLow§!"
 coding_classes:0 "Coding Classes"
 fishing_sites_3:0 "The Fishing Industry"
 fishing_sites_3_desc:0 "The fishing industry covers any industry or activity concerned with catching, farming, processing, preserving, storing, transporting, marketing or selling fish and fish products. The Food and Agriculture Organization defines it as including recreational, subsistence and commercial fishing, along with the related harvesting, processing and marketing sectors. Its commercial side aims to deliver fish and other seafood for human consumption or as inputs for other industries.\n\n§YFishing Industry Level: §GGood§!"
 fishing_sites_2:0 "The Fishing Industry"
 fishing_sites_2_desc:0 "The fishing industry covers any industry or activity concerned with catching, farming, processing, preserving, storing, transporting, marketing or selling fish and fish products. The Food and Agriculture Organization defines it as including recreational, subsistence and commercial fishing, along with the related harvesting, processing and marketing sectors. Its commercial side aims to deliver fish and other seafood for human consumption or as inputs for other industries.\n\n§YFishing Industry Level: §YMedium§!"
 fishing_sites:0 "The Fishing Industry"
 fishing_sites_desc:0 "The fishing industry covers any industry or activity concerned with catching, farming, processing, preserving, storing, transporting, marketing or selling fish and fish products. The Food and Agriculture Organization defines it as including recreational, subsistence and commercial fishing, along with the related harvesting, processing and marketing sectors. Its commercial side aims to deliver fish and other seafood for human consumption or as inputs for other industries.\n\n§YFishing Industry Level: §RLow§!"
 passaport_strong:0 "A Strong Turkish Passport"
 passaport_strong_desc:0 "Our people should be able to travel wherever they want. They deserve it."
 passaport:0 "The Turkish Passport"
 passaport_desc:0 "Our people should be able to travel wherever they want. They deserve it."
 unions_of_the_state:0 "State Trade Unions"
 unions_of_the_state_desc:0 "A trade union, often simply called a union, is an organization of workers who have come together to achieve common goals such as protecting the integrity of their trade, improving safety standards and winning better wages, benefits and working conditions through the greater bargaining power that comes from collective organization. Unions typically fund their organization, head office and legal team through regular membership dues."
 pkk_terror_idea_low:0 "PKK Insurgency"
 pkk_terror_idea_low_desc:0 "Since 1978, the Kurdistan Workers' Party (PKK) and allied left-wing groups have waged a major insurgency against the Turkish government, seeking self-determination for Turkey's Kurdish provinces. Despite brutal crackdowns and the capture of their leader Abdullah Öcalan in 1999, the conflict still rages on, leaving deep trauma on the country's peoples with no end in sight."
 militarize_the_workers:0 "Armed Workers"
 militarize_the_workers_desc:0 "Workers, comrades and farmers are calling you to revolt. Together we will defeat this capitalist order."
 prepare_for_war:0 "Preparing for War"
 prepare_for_war_desc:0 "War seems imminent. We must make preparations!"
 globalization_of_turkey:0 "The Globalization of Turkey"
 globalization_of_turkey_desc:0 "Ultranationalism has unsettled us. All races and all peoples of the world should be equal. Long live populism!"
 turkish_union_front:0 "The Union Front"
 turkish_union_front_desc:0 "Our front is the People's Front, and it is what our people want. As Atatürk said, we will raise our country to great heights with the new system we have established."
 communist_military:0 "Left-Wing Military"
 perincek_state:0 "Perinçek's Leadership"
 communist_infulence:0 "Communist Influence"
 communist_infulence_desc:0 "This country is being infiltrated by a communist power."
 tca:0 "Turkish Communist Intelligence Organization"
 international_brigades:0 "International Brigades"
 international_brigades_desc:0 "We openly invite all communists to our country, where they can join us in the fight against the dirty capitalist order. Long live communism!"
 repair_focus:0 "The Repair Focus"
 repair_focus_desc:0 "The Civil War has bankrupted our infrastructure and industry. We call on our workers to mobilize, overcome this collapse and rebuild our country."
 closed_bosporus:0 "The Bosphorus Is Closed"
 russian_bases:0 "Russian Bases"
 support_russia:0 "Supporting Russia"
 liberal_socialism:0 "Liberal Socialism"
 liberal_socialism_desc:0 "Communism in Russia collapsed because it was rigid and authoritarian. A clear-thinking socialist order can keep Turkey united and afloat without collapse."
 tur_historical_confidence_1:0 "Turkish Historical Pride"
 tur_historical_confidence_1_desc:0 "The Turks have produced great minds throughout their history and founded thrones in Central Asia and Europe through conquest. When defeated, they united and fought back hard. Turks are proud of their history and ancestry, so nationalist sentiment is widespread and dominant in Turkey."
 factory_law:0 "Factory Law"
 factory_law_desc:0 "The gases emitted by factories are damaging our world. This must stop! We have taken legal action against it."
 TKP_wins_the_congress:0 "The TKP Wins the Congress"
 ODP_wins_the_congress:0 "ÖDP Wins the Congress"
 EMEP_wins_the_congress:0 "EMEP Wins the Congress"
 PERINCEK_wins_the_congress:0 "Perinçek Wins the Congress"
 bozkurtlar:0 "Bozkurtlar"
 bozkurtlar_desc:0 "The Grey Wolves adhere to an extreme form of Turkish nationalism and have been described as neo-fascist by scholars, mainstream media and left-wing sources. The organization's ideology emphasizes the early history of the Turkic states of Central Asia and blends it with Islam; the synthesis of Turkish identity and Islam runs through their rhetoric and activities. One of their mottos is "Your doctor will be a Turk and your medicine will be Islam." Other sources have described the movement as secular."
 quarries_1:0 "Ülkü Ocakları"
 quarries_1_desc:0 "The main goal of the Ülkü Ocakları is to raise ideal nationalists for our country. Those raised in the Ülkü Ocakları devote their lives and their work to their homeland."
 quarries_2:0 "Ülkü Ocakları"
 quarries_2_desc:0 "The main goal of the Ülkü Ocakları is to raise ideal nationalists for our country. Those raised in the Ülkü Ocakları devote their lives and their work to their homeland."
 nation_in_chaos:0 "Kemalist Officers Protest"
 nation_in_chaos_desc:0 "The Kemalists reject the new order we have established and are protesting against it. These protests are baseless and will be suppressed."
 islamization_of_the_army:0 "The Islamization of the Army"
 islamization_of_the_army_desc:0 "For our army to be strong, it must be Islamized. Secularism has broken the army's spirit. Whatever they say, we will Islamize the army."
 secular_parties_protest:0 "Kemalist Parties Protest"
 secular_parties_protest_desc:0 "As we expected, the Kemalist parties do not like the new order we have established. We must force them to accept it, or this country could face a civil war."
 jihadist_state:0 "The Divisions of Muhammad"
 jihadist_state_desc:0 "Our army is made up of the soldiers of Muhammad. With it, we will spread Islam to the ends of the earth. Long live Islam!"
 anti_arabic_campaign:0 "Nationalist Opposition to the Arabs Within the Party"
 anti_arabic_campaign_desc:0 "The nationalist Turkish public has a very poor view of the Arabs and is deeply uneasy about our improving relations with them. That is why an opposition movement has begun within our party."
 moderate_sharia_state:0 "Moderate Sharia State"
 moderate_sharia_state_desc:0 "Thank God, we are now ruled by Islam. By following the path of Allah, we will raise our country high. We will not be like the Arabs who seek to destroy Islam. Long live Turkishness and Islam!"
 three_crescent:0 "Three Crescents"
 controlled_juidacary:0 "A Controlled Judiciary"
 controlled_juidacary_desc:0 "An independent judiciary can set terrorists free, so we are bringing the judiciary under the state's control. Thanks to this, we will be able to catch any terrorist quickly and easily close down any party that aids terrorism."
 legacy_of_turkes:0 "The Legacy of Alparslan Türkeş"
 legacy_of_turkes_desc:0 "We are following in the footsteps of Alparslan Türkeş. We did as he said: we built an authoritarian country and never gave up our nationalism and Turkism."
 islamist_barracks:0 "Jihadist Barracks"
 islamist_barracks_desc:0 "We train our jihadist youth and send them to jihad. Islam must spread!"
 turkish_dictatorship:0 "The Wolf Dictatorship"
 turkish_dictatorship_desc:0 "Elections and party politics are no different from dividing the country, so we have declared our dictatorship to end this separatism. Under the Wolf Dictatorship, Turkey will undoubtedly become an unshakable whole."
 general_purges:0 "Purges of the Anti-Nationalists"
 general_purges_desc:0 "Without nationalism there is no country, so we must arrest those who are not nationalists. Nationalism is our highest priority."
 legacy_of_the_1980:0 "The Legacy of 1980"
 legacy_of_the_1980_desc:0 "We cannot forget what we went through in 1980. Fighting between leftists and rightists left thousands dead, until the Turkish Armed Forces took control of everything with tanks, guns and rifles and Kenan Evren took over the country. Under Evren, right-wingers and left-wingers alike were rounded up, and there were many executions. We cannot forget these memories. The communists must be crushed wherever they are found so that this never happens again."
 tur_historical_confidence_2:0 "Turkish Historical Pride"
 tur_historical_confidence_2_desc:0 "The Turks have produced great minds throughout their history and founded thrones in Central Asia and Europe through conquest. When defeated, they united and fought back hard. Turks are proud of their history and ancestry, so nationalist sentiment is widespread and dominant in Turkey.""
 ataturk_nationalism:0 "Atatürk Nationalism"
 sun_language_theory:0 "Sun Language Theory"
 sun_language_theory_desc:0 "The Sun Language Theory was a Turkish nationalist pseudoscientific linguistic hypothesis developed in Turkey in the 1930s, which proposed that all human languages descend from a single proto-Turkic primal language. Because this primal language supposedly closely resembled Turkish phonetically, all other languages could essentially be traced back to Turkic roots. According to the theory, worshippers in Central Asia who wished to salute the sun's omnipotence and life-giving power did so by turning their meaningless babbling into a coherent set of ritual utterances, and thus language was born; hence the name."
 secular_schools:0 "Secular Schools"
 secular_schools_desc:0 "Secular schools dominate the country, and organizations such as TED run them well."
 peace_coop:0 "Kemalist Neutrality"
 peace_coop_desc:0 "As Atatürk said, our country will pursue a peaceful policy and never restrict the freedoms of other countries. By following Atatürk's policy, we can bring stability and happiness to our country."
 assimalition_policy:0 "Assimilation Policy"
 assimalition_policy_desc:0 "By assimilating the Kurds, we can solve the problem in the east without having to deploy our own people."
 cold_war_with_kurds:0 "Cold War with the Kurds"
 cold_war_with_kurds_desc:0 "By waging psychological warfare on the Kurds, we will bring the eastern region into the national fold."
 turkishness_principal:0 "The Principle of Turkishness"
 united_wolfs:0 "United Wolves"
 united_wolfs_desc:0 "Now that the Wolves are united, no one can resist us. We will hunt down anyone who opposes us, like a pack of wolves!"
 turkic_populism:0 "Turkic Populism"
 turkic_populism_desc:0 "We will make populist moves for Turkic unity and, with them, raise the unity of the Turkic world to new heights."
 TUR_turkic_unification:0 "The Turkic Union has been proclaimed."
 purge_the_kemalistz:0 "Military Purges"
 purge_the_kemalistz_desc:0 "We have taken action to purge the coup-minded soldiers from our army, making many arrests. Of course, these arrests will weaken the army for now, but in the end we will be rid of them."
 kemalists_in_exile:0 "Kemalists in Exile"
 kemalists_in_exile_desc:0 "The Kemalists imposed Western traditions on us, but our people said no to Westernism. Westernism was rejected by the public, and after the Kemalists' failed coup attempt we sent them into exile."
 mosque_industry:0 "Mosque Industry"
 mosque_industry_desc:0 "Mosque building is an architectural art. By mobilizing our industry and our people to build beautiful mosques, we will earn divine reward and bring economic peace."
 banner_of_islam:0 "Banner of the Milli Görüş"
 banner_of_islam_desc:0 "The banner of Islam had fallen into the wrong hands, but now it has been saved. Turkey will raise the banner of Islam high by living true Islam and making conquests."
 madrassas:0 "Islamic Madrasas"
 madrassas_desc:0 "We have reopened the madrasas Atatürk closed. They will teach us the way of Islam and of innovation."
 volunteer_reserve:0 "The Volunteer Force"
 volunteer_reserve_desc:0 "Our country is now strong enough to intervene in the internal affairs of other countries, so we are creating a volunteer intervention force that will take down our country's enemies."
 volunteer_reserve_armed_well:0 "Intervention Forces"
 volunteer_reserve_armed_well_desc:0 "Our country is now strong enough to intervene in the internal affairs of other countries, so we are creating a volunteer intervention force that will take down our country's enemies."
 construction_plan:0 "Erbakan's Heavy Industry Plan"
 construction_plan_desc:0 "Erbakan is determined that our country develop its heavy industry and has drawn up plans for it. By applying his factory-building policies, we will industrialize the country. An industrialized Turkey will leave its enemies no chance."
 policy_of_rework:0 "Labour Policy"
 policy_of_rework_desc:0 "If our workers don't get paid or get a raise, why would they work? That is why we encourage them with pay and raises. A dynamic, hardworking workforce will take us far."
 work_for_better_conditions:0 "Working for Better Conditions"
 work_for_better_conditions_desc:0 "However hard our workers worked, they earned the same. Now they will work harder, knowing that more effort means better pay."
 nato_islam_power:0 "NATO's Islamic Power"
 nato_islam_power_desc:0 "In Erbakan's words, we are a NATO-Islamic power. Of course we will protect our allies in Europe, just as we will protect the Muslims of the Middle East."
 crushing_pro_nato_organizations:0 "Crushing the Pro-NATO Organizations"
 crushing_pro_nato_organizations_desc:0 "It is time to crush the NATO-funded counter-guerrilla organizations in our country. Doing so will strengthen national peace. We will not allow ourselves to be run by a secret organization."
 d-9_forces:0 "D-8 Special Units"
 d-9_forces_desc:0 "Now that the D-8 Economic Union has become an official alliance, the D-8 Special Command has been formed to protect the D-8 by training special forces. It has units in Pakistan, Iran and Turkey."
 d-9_forces_2:0 "D-8 Special Units"
 d-9_forces_2_desc:0 "Now that the D-8 Economic Union has become an official alliance, the D-8 Special Command has been formed to protect the D-8 by training special forces. It has units in Pakistan, Iran and Turkey."
 d-9_forces_3:0 "D-8 Special Units"
 d-9_forces_3_desc:0 "Now that the D-8 Economic Union has become an official alliance, the D-8 Special Command has been formed to protect the D-8 by training special forces. It has units in Pakistan, Iran and Turkey."
 afghan_immigration:0 "Afghan Immigration"
 afghan_immigration_desc:0 "After the Taliban's victory in Afghanistan, Afghans began crossing illegally into Turkey via Iran. Coming after the Syrians who had already damaged the Turkish economy, the arrival of the Afghans has badly weakened Turkey. Angered by the influx, the nationalists stopped voting for the government and moved into opposition, while the EU's stance on the issue has also fueled opposition among secularists."
 outsides_problem_kurds:0 "Support for the PKK Abroad"
 outsides_problem_kurds_desc:0 "Some foreign countries sympathize with the PKK, giving it political cover and making the fight against terrorism harder. We must break down that sympathy, using whatever media tools we have."
 outsides_problem_kurds_2:0 "Support for the PKK Abroad"
 outsides_problem_kurds_2_desc:0 "Some foreign countries sympathize with the PKK, giving it political cover and making the fight against terrorism harder. We must break down that sympathy, using whatever media tools we have."
 outsides_problem_kurds_3:0 "Support for the PKK Abroad"
 outsides_problem_kurds_3_desc:0 "Some foreign countries sympathize with the PKK, giving it political cover and making the fight against terrorism harder. We must break down that sympathy, using whatever media tools we have."
 outsides_problem_kurds_4:0 "Support for the PKK Abroad"
 outsides_problem_kurds_4_desc:0 "Some foreign countries sympathize with the PKK, giving it political cover and making the fight against terrorism harder. We must break down that sympathy, using whatever media tools we have."
 outsides_problem_kurds_5:0 "Support for the PKK Abroad"
 outsides_problem_kurds_5_desc:0 "Some foreign countries sympathize with the PKK, giving it political cover and making the fight against terrorism harder. We must break down that sympathy, using whatever media tools we have."
 f-35_plan:0 "F-35 Program Partner"
 f-35_plan_desc:0 "The program's participants included Turkey as well as the United States, the United Kingdom, Italy, the Netherlands, Australia, Denmark, Canada and Norway. Their goal is to acquire a powerful next-generation aircraft."
 turkish_drone_sector:0 "The Turkish Drone Industry"
 turkish_drone_sector_desc:0 "Turkey is a world leader in drone production and technology, all thanks to its drone industry. By continuing to fund the sector, we can intimidate other countries with ever more modern and powerful drones."
 turkish_armed_dictatorship:0 "The Turkish Military Dictatorship"
 turkish_armed_dictatorship_desc:0 "The Turkish Armed Forces have changed a great deal since the recent coup and no longer want to leave politics. They will now make the country strong by declaring a military dictatorship, and the country will never again fall into the hands of the unworthy!"
 end_of_the_turkish_democracy:0 "The End of Turkish Democracy"
 end_of_the_turkish_democracy_desc:0 "Turkish democracy has failed and has been dismantled by a faction within the Turkish Armed Forces. With democracy gone, the country will develop faster, since under democracy people do not work together; they fight each other."
 controlled_press:0 "Controlled Press"
 controlled_press_desc:0 "The press is now under our control, and we will never allow it to oppose us. Without an opposing press, we can bring the country's stability to good levels."
 stabilization_of_TUR_act:0 "National Stabilization Act"
 stabilization_of_TUR_act_desc:0 "We have launched an operation to secure national stability that will bring our country to stable levels. Long live the stabilizing Republic of Turkey!"
 non_european:0 "Embracing Turkish Values"
 non_european_desc:0 "What the European Union imposes runs contrary to the Turkish people. Our army will therefore reject the EU's impositions and keep our Turkish traditions alive, and their survival will make Turkey stronger."
 secular_forces:0 "Fully Secularized Armed Forces"
 secular_forces_desc:0 "After the new coup, we will build a secular army by expelling the non-secular, refusing to recruit them and keeping secular officers in service for the long term."
 rejecting_immigrationism:0 "Rejecting Immigration"
 rejecting_immigrationism_desc:0 "Accepting refugees is an insult to Turkishness, so we will not accept refugees into our country. A Turkey without refugees is a prosperous Turkey!"
 power_of_turkish_blood:0 "The Power of Turkish Blood"
 power_of_turkish_blood_desc:0 "Being of Turkish descent is something special that gives strength. With this strength, there is nothing the Turks cannot do."
 civilian_economic_program:0 "Civilian Economic Program"
 civilian_economic_program_desc:0 "Our country's civilian industry is not in good shape, so we will develop it by implementing a civilian economic and industrial program."
 controlled_sendikalar:0 "State-Controlled Unions"
 controlled_sendikalar_desc:0 "We will end the independent unions in our country and bring them under our control. This way they will not deviate from the official ideology, and stability will be ensured."
 workers_administration_2:0 "Expanded Labor Law"
 populist_principals:0 "Populist Principles"
 populist_principals_desc:0 "Our country will now be governed in line with populist principles, which are fully in harmony with the Turkish nation."
 TUR_economic_power_house:0 "Turkish Economic Powerhouse"
 TUR_economic_power_house_desc:0 "The Turkish economy has put its bad days behind it. It is now a stable force that will not fall."
 supporting_employers:0 "Supporting Employers"
 supporting_employers_desc:0 "By supporting employers, we will create more jobs and bring down unemployment in our country."
 anti_arabic_state:0 "The Anger of 1917"
 anti_arabic_state_desc:0 "We have not forgotten the events of 1917. We are ready to launch an expedition to avenge them."
 guardians_of_the_balkans:0 "Guardian of the Balkans"
 guardians_of_the_balkans_desc:0 "Romania once led the Balkan Pact, but after it suffered German and Soviet invasions it lost that role, and the pact was then destroyed by outside powers. Today we must revive it. By protecting the Balkans, we will head off threats in advance and ensure Balkan stability. The guardian of the Balkans stands watch!"
 asia_minors_power:0 "The White Prince"
 asia_minors_power_desc:0 "Tensions between Saudi Arabia and Iran are tearing the Middle East apart. Turkey is the kingmaker, the "White Prince" of the Middle East: whichever side it backs wins. That side will be Iran!"
 restoring_the_hope:0 "Restoring Hope!"
 restoring_the_hope_desc:0 "The United States has backed coups and military interventions for the good of the Turkish Republic, but after all of them power was handed back to democracy. That was a grave mistake. By no longer handing our country to a senile democracy, we will keep the sword of military rule raised forever. With permanent military rule, we will be able to realize the vision the United States has for our country and region, including its Greater Middle East Project. In carrying out this plan, we will receive both military and financial support from the United States, so the country will never lack resources. If we stand with the United States, we will be strong; if we stand against it, we will vanish, just like the Soviet Union. Long live the United States and the Republic of Turkey founded by Atatürk!"
 redzyned_6_arrows:0 "The Redesigned Six Arrows"
 redzyned_6_arrows_desc:0 "We have redesigned Atatürk's Six Arrows so that they match our party program. This arrangement will bring stability at home."
 NATO_officers:0 "Pro-NATO Officers in Charge"
 NATO_officers_desc:0 "Pro-NATO commanders within our military have seized power in a second coup. They are not exactly lovers of democracy and will most likely turn our country into a regime forced westward."
 general_staff_under_1:0 "The Turkish General Staff"
 general_staff_under_1_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Hüseyin Kıvrıkoğlu§!"
 general_staff_under_2:0 "The Turkish General Staff"
 general_staff_under_2_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Hilmi Özkök§!"
 general_staff_under_3:0 "The Turkish General Staff"
 general_staff_under_3_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Yaşar Büyükanıt§!"
 general_staff_under_4:0 "The Turkish General Staff"
 general_staff_under_4_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: İlker Başbuğ§!"
 general_staff_under_5:0 "The Turkish General Staff"
 general_staff_under_5_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Işık Koşaner§!"
 general_staff_under_6:0 "The Turkish General Staff"
 general_staff_under_6_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Necdet Özel§!"
 general_staff_under_7:0 "The Turkish General Staff"
 general_staff_under_7_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Hulusi Akar§!"
 general_staff_under_8:0 "The Turkish General Staff"
 general_staff_under_8_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Yaşar Güler§!"
 general_staff_under_9:0 "The Turkish General Staff"
 general_staff_under_9_desc:0 "The General Staff is the highest-ranking body established to command the Armed Forces.\nIt consists of a group of officers who assist the commanders of divisions and higher units in making and disseminating army policy, transmitting orders and supervising work.\nIt is normally organized along functional lines, with management, intelligence, operations, training, logistics and other branches.\n\n§YChief of the General Staff: Metin Gürak§!"
 turkish_war_for_confidence:0 "The War for Honor Policy"
 turkish_war_for_confidence_desc:0 "We are ready to fight for our honor anywhere. We are adopting a policy of toppling any country that offends our dignity."
 ecevits_bird:0 "Ecevit's White Bird"
 ecevits_bird_desc:0 "Ecevit's bird soars through the skies. It stands for peace, Turkish power and Turkish social democracy. With this power, we will defeat our enemies one by one."
 democratic_cooperatives_of_industry_1:0 "Democratic Cooperatives Of Industry" 
 democratic_cooperatives_of_industry_1_desc:0 "The Democratic Industrial Cooperatives exist to look after our workers. Since the state could not satisfy them, we have handed workers' affairs over to the cooperatives, which will open new factories that care for workers and strengthen our economy.\n\n§YPower of the Democratic Industrial Cooperatives: §RLow§!"
 democratic_cooperatives_of_industry_2:0 "Democratic Cooperatives Of Industry" 
 democratic_cooperatives_of_industry_2_desc:0 "The Democratic Industrial Cooperatives exist to look after our workers. Since the state could not satisfy them, we have handed workers' affairs over to the cooperatives, which will open new factories that care for workers and strengthen our economy.\n\n§YPower of the Democratic Industrial Cooperatives: §YMedium§!"
 democratic_cooperatives_of_industry_3:0 "Democratic Cooperatives Of Industry" 
 democratic_cooperatives_of_industry_3_desc:0 "The Democratic Industrial Cooperatives exist to look after our workers. Since the state could not satisfy them, we have handed workers' affairs over to the cooperatives, which will open new factories that care for workers and strengthen our economy.\n\n§YPower of the Democratic Industrial Cooperatives: §GVery High§!"
 agricultural_act:0 "Agricultural Power" 
 agricultural_act_desc:0 "Turkey can develop both its agriculture and its industry, and we are pushing for both. First we will develop agriculture, then use its profits to open factories that process raw materials and sell them abroad at a profit.\n\n§YAgricultural Program: §GGood§!\n§YIndustrial Program: §RPoor§!"
 agricultural_act_2:0 "Agro-Industrial Power"
 agricultural_act_2_desc:0 "Turkey can develop both its agriculture and its industry, and we are pushing for both. First we will develop agriculture, then use its profits to open factories that process raw materials and sell them abroad at a profit.\n\n§YAgricultural Program: §GExcellent§!\n§YIndustrial Program: §YNormal§!"
 agricultural_act_3:0 "Agro-Industrial Powerhouse" 
 agricultural_act_3_desc:0 "Turkey can develop both its agriculture and its industry, and we are pushing for both. First we will develop agriculture, then use its profits to open factories that process raw materials and sell them abroad at a profit.\n\n§YAgricultural Program: §GExcellent§!\n§YIndustrial Program: §GExcellent§!"
 beauty_of_kyk:0 "Renovated KYK Dormitories" 
 beauty_of_kyk_desc:0 "We will renovate the KYK dormitories and reopen them. Our students will be pleased and will work hard to graduate."
 summer_and_night_working_schools:0 "Summer and Evening University Programs" 
 summer_and_night_working_schools_desc:0 "We will increase university capacity by running classes both day and evening. This will give us more graduates without having to build new universities."
 unsickness_in_the_universities:0 "Special Climate in Universities" 
 cyprus_intervention_legacy:0 "The Legacy of the Cyprus Intervention"
 cyprus_intervention_legacy_desc:0 "We will remember that no force could stop us from saving Cyprus and that diplomatic embargoes and maneuvers could not intimidate us. With that memory, we will be able to achieve what we want."
 turkish_war_culture:0 "Turkish War Culture" 
 turkish_war_culture_desc:0 "The Turks were superb warriors in their nomadic days in Central Asia, but settled life and rapid modernization have dulled this trait. It is time to revive it."
 TUR_4_year_dockyard_plan:0 "The Four-Year Turkish Naval Program"
 TUR_4_year_dockyard_plan_desc:0 "We have launched a naval build-up to bring our Blue Homeland doctrine to life. With a large navy, our neighbors will learn to fear us."
 anti_italian_state:0 "Anti-Italian Force"
 anti_italian_state_desc:0 "We have set out to find effective tactics against Italy's military equipment and doctrine. With them, Italy will be powerless against us."
 resist_against_nato_supremacy:0 "Resisting NATO Supremacy!"
 resist_against_nato_supremacy_desc:0 "NATO's tanks and aircraft may have superior firepower, but we can resist NATO, and through that resistance we can destroy the so-called invincible alliance. Long live the Turkish resistance!"
 turkish_society_first:0 "The Turkish Nation Comes First"
 turkish_society_first_desc:0 "The Turkish nation has the strength to overcome anything, as it proved in the War of Independence. With the power in our blood, we will destroy every enemy that tries to destroy us."
 turkish_interventionism:0 "Turkish Interventionism"
 turkish_interventionism_desc:0 "As Turks, we will not turn a blind eye to what is happening around us; we will intervene. Through such interventions we can make real gains in foreign policy."
 german_turkish_visits:0 "German-Turkish Visits"
 german_turkish_visits_desc:0 "We are preparing agreements and visits between Germany and Turkey as part of a diplomatic initiative that will benefit both countries."
 wolkswagen_technicans_tur:0 "Turkish Technicians Sent to Volkswagen"
 wolkswagen_technicans_tur_desc:0 "We are sending engineers to Volkswagen's factories in Germany to study the German brand. What they learn will raise our country's technology to a good level."
 wolkswagen_technicans_ger:0 "Turkish Technicians Received"
 wolkswagen_technicans_ger_desc:0 "Technicians have come to our country from Turkey to advance their own country's technology. We can boost our economy by charging them for the training."
 received_acedicians_ger:0 "Turkish Academics Received"
 received_acedicians_ger_desc:0 "Academics are coming to our country from Turkey. We can strengthen our country by gaining access to their work and their money."
 given_academicians_ger:0 "Academics Sent to Germany"
 given_academicians_ger_desc:0 "We are sending Turkish academics to Germany to develop their skills. Trained in Germany, they will strengthen us academically and technologically."
 american_turkish_visits:0 "American-Turkish Visits"
 american_turkish_visits_desc:0 "We are preparing agreements and visits between the United States and Turkey as part of a diplomatic initiative that will benefit both countries."
 ford_technicans_tur:0 "Turkish Technicians Sent to Ford"
 ford_technicans_tur_desc:0 "We are sending engineers to Ford's factories in the United States to study the American brand. What they learn will raise our country's technology to a good level."
 ford_technicans_usa:0 "Turkish Technicians Received"
 ford_technicans_usa_desc:0 "Technicians have come to our country from Turkey to advance their own country's technology. We can boost our economy by charging them for the training."
 received_acedicians_usa:0 "Turkish Academics Received"
 received_acedicians_usa_desc:0 "Academics are coming to our country from Turkey. We can strengthen our country by gaining access to their work and their money."
 given_academicians_usa:0 "Academics Sent to America"
 given_academicians_usa_desc:0 "We are sending Turkish academics to the United States to develop their skills. Trained in America, they will strengthen us academically and technologically."
 huge_police_stations:0 "Modernized Police Stations" 
 huge_police_stations_desc:0 "We have modernized our police stations with new decrees. This will keep anarchist and terrorist activity in their regions to a minimum."
 ziraat_pritavized:0 "Privatized Ziraat Bank"
 ziraat_pritavized_desc:0 "By privatizing Ziraat Bank, we have given the banking sector free-market power. The privatized bank will find its place in the market and invest in our country."
 cultural_museums:0 "Modern Museums"
 cultural_museums_desc:0 "By opening modern museums across the country, we will make our people both happier and more cultured."
 modern_schools:0 "Modernized Schools"
 modern_schools_desc:0 "Our schools do not meet European standards, so we are modernizing them. With this drive, they will gain technological capacity and grow stronger."
 dicipline_in_school:0 "Discipline First at School"
 dicipline_in_school_desc:0 "Discipline at school is vital. Without it, schools fill up with idlers instead of hard workers, which undermines our country's capacity for innovation. That is why we have issued decrees to strengthen school discipline."
 modern_hospitals:0 "Modernized Hospitals" 
 modern_hospitals_desc:0 "Our hospitals have serious problems with their technological equipment. We will solve them by modernizing the hospitals, so that our people's health problems are dealt with more systematically and quickly."
 hospitals_to_munitiplacy:0 "Municipal Hospitals"
 hospitals_to_munitiplacy_desc:0 "By transferring hospitals to the municipalities, we are relieving the state of a heavy workload. It will also allow the system to be tailored region by region."
 supports_to_the_disableds:0 "Rehabilitating the Disabled"
 supports_to_the_disableds_desc:0 "We will help our disabled citizens using newly developed technologies."
 trial_clashings:0 "The DSP and CHP Lawsuits"
 trial_clashings_desc:0 "The CHP and the DSP are locked in lawsuits against each other. As long as they continue, political turmoil and election violence in our country will grow. The cases must be wrapped up as quickly as possible to restore political stability."
 israeli_turkish_trade:0 "Israeli-Turkish Technology Trade"
 israeli_turkish_trade_desc:0 "Our agreements with Israel benefit us, and they have now been expanded into technology trade. This deal with Israel will help bring our technology to an advanced level."
 war_against_countergueralla:0 "War on the Counter-Guerrillas"  
 war_against_countergueralla_desc:0 "We will destroy the so-called "Counter-Guerrilla" organization that NATO built in our country wherever we find it. We will not allow it to provoke the right; instead, we will turn the tables on it."
 united_left_against_USA:0 "The United Left Against the USA"
 united_left_against_USA_desc:0 "We will organize the left in our country against the terrible imperialism of the United States. By uniting the left and gathering the revolutionaries under one banner, we will keep American imperialism out of our land."
 powerized_neutral_state:0 "A Strong Neutral State"  
 powerized_neutral_state_desc:0 "By emphasizing neutrality, we will show that we are committed only to our people. Pursuing a neutral policy will undo our past mistakes and put us back on Atatürk's path, and the whole world will see that we are a strong country."
 working_sgk:0 "A Working SGK"
 working_sgk_desc:0 "The Social Security Institution (SGK) is the governing authority of the Turkish social security system. It was established by Social Security Institution Law No. 5502, published in Official Gazette No. 26173 on 20 June 2006, which merged five separate pension systems covering civil servants, contract workers, agricultural workers and the self-employed into a single system with equal actuarial rights and obligations."
 free_media_sponsored_state:0 "Protected Free Media"
 free_media_sponsored_state_desc:0 "Independent media are essential. Without them our people cannot be happy and dissenting voices cannot be heard, and we would drift into authoritarianism and wrong our people. That is why we will protect the media forever."
 weakened_centralist_regime:0 "Weakened Centralist Regime"
 working_municipilites:0 "Working Municipalities..."
 working_municipilites_desc:0 "So far, centralist rule has been of no use. It is time to dismantle this useless system; our people will now feel the iron fist far less."
 redzyned_local_rules:0 "Redesigned Local Rules"
 redzyned_local_rules_desc:0 "A rule applied across the whole country can bring a certain discipline, but the regions are unhappy with it. Removing their discontent matters more than discipline, so we are creating rules tailored to each region."
 local_religions_freedom:0 "Freedom for Local Religious Leaders"
 local_religions_freedom_desc:0 "Local religious leaders matter a great deal to the local population, so they should be left free whatever they do. Everything we do is for our people's happiness."
 collected_economies_of_the_local_regions:0 "Integrating the Local Economies"
 collected_economies_of_the_local_regions_desc:0 "We will integrate all the local economies with one another. This may disturb our people's peace, but it will give us economic momentum."
 local_works:0 "Local Works"
 local_works_desc:0 "Local enterprise should be supported. When local work brings a good income, productivity and diligence rise."
 local_banks:0 "Local Banks"
 local_banks_desc:0 "Local banks can identify local financial problems and make local investments, enabling a decent level of local development."
 local_institutions:0 "Local Institutions"
 local_institutions_desc:0 "Local institutions are very good at identifying local problems and keeping the public happy."
 funded_science:0 "Funded Science"
 funded_science_desc:0 "Science is worth investing in, because its benefits are too many to count. The spirit of innovation must always stay alive in the Republic of Turkey."
 improved_exams:0 "Improved Exams"
 improved_exams_desc:0 "The exams have been going strangely. We will put a stop to it and redesign the exams from scratch so that they run properly."
 encouragment_instead_of_coercion:0 "Encouragement Instead of Coercion"
 encouragment_instead_of_coercion_desc:0 "Instead of wearing people out with study, we will encourage them to learn. Nothing good comes from force."
 believing_the_education_power:0 "Believing in the Power of Education"
 believing_the_education_power_desc:0 "Education is our most valuable tool for raising future generations; without it, our people cannot move forward. That is why we will make education our top priority."
 border_security_first:0 "Border Security"
 border_security_first_desc:0 "The border is our honor. We will deploy Turkish military units to guard it so that not even a bird can cross. Terrorists will no longer be able to enter our country across the border."
 train_civilian_corps:0 "Civil Defense Corps"
 train_civilian_corps_desc:0 "We will fight the PKK by forming civilian units. Of course they will not be as capable or powerful as the Turkish Armed Forces, but they will make a big difference."
 train_civilian_corps_better:0 "Improved Civil Defense Corps"
 train_civilian_corps_better_desc:0 "We will fight the PKK by forming civilian units. Of course they will not be as capable or powerful as the Turkish Armed Forces, but they will make a big difference."
 peace_state:0 "Peace State"
 peace_state_desc:0 "War brings nothing good; it is only ever a necessity. That is why we are making Turkey a country of peace. It is better this way."
 mind_games:0 "Mind Games"
 mind_games_desc:0 "By playing mind games, we will foil other countries' plans and carry out our own. It will make us a political force."
 mind_games_of_infulence:0 "Mind Games"
 mind_games_of_infulence_desc:0 "By playing mind games, we will foil other countries' plans and carry out our own. It will make us a political force."
 mind_games_of_infulence_and_man:0 "Mind Games"
 mind_games_of_infulence_and_man_desc:0 "By playing mind games, we will foil other countries' plans and carry out our own. It will make us a political force."
 maximixed_political_power_output:0 "Mind Games of the New Era"
 maximixed_political_power_output_desc:0 "By playing mind games, we will foil other countries' plans and carry out our own. It will make us a political force in this new imperialist era."
 immigration_buying:0 "Paying Off Migration"
 immigration_buying_desc:0 "We can handpick well-educated refugees and bring them to our country to work for us. A brain drain in our favor will boost our innovation."
 immigration_law:0 "Immigration Law"
 immigration_law_desc:0 "It is time to pass a refugee law: no one will be able to enter this country so easily anymore. Except Europeans and Americans, of course."
 turkish_gateway_project_finished:0 "The Turkish Gateway Project Is Fully Operational"
 turkish_gateway_project_finished_desc:0 "The Turkish Gateway Project is now fully operational. With it complete, trade routes now pass through our territory, earning us large amounts of money and resources and significantly boosting our growth."
 adaptable_economy:0 "An Adaptable Economy"
 adaptable_economy_desc:0 "The Turkish economy has been through very bad times and has grown used to them. Now it must learn to climb out of such situations, and, as you know, the ANAP government will not allow the economy to shrink."
 working_like_a_bee:0 "Busy as a Bee"
 working_like_a_bee_desc:0 "We will work like bees, not like ants. We will work hard and go far. Everything for Turkey!"
 textile_industries:0 "Textile Industries"
 textile_industries_desc:0 "The textile industry is mainly concerned with the design, production and distribution of yarn, cloth and clothing. Its raw materials may be natural or synthetic, made from chemical industry products."
 cotton_industries:0 "Cotton Industries"
 cotton_industries_desc:0 "Cotton is the world's most important natural fiber. In 2007, the global harvest was 25 million tons from 35 million hectares cultivated in more than 50 countries. Turkey produces around half a million tons, and we are here to increase that to strengthen the economy."
 new_created_automative_sector:0 "The Turkish Automotive Sector"
 new_created_automative_sector_desc:0 "The Turkish automotive industry comprises a wide range of companies and organizations involved in the design, development, manufacturing, marketing and sale of motor vehicles. Automotive manufacturing is one of the world's largest industries by revenue. It does not include businesses dedicated to servicing vehicles after delivery to the end user."
 good_created_automative_sector:0 "The Turkish Automotive Sector"
 good_created_automative_sector_desc:0 "The Turkish automotive industry comprises a wide range of companies and organizations involved in the design, development, manufacturing, marketing and sale of motor vehicles. Automotive manufacturing is one of the world's largest industries by revenue. It does not include businesses dedicated to servicing vehicles after delivery to the end user."
 fifth_generation_military_industries:0 "Fifth-Generation Military Industries"
 fifth_generation_military_industries_desc:0 ""
 competetion_authority:0 "The Turkish Competition Authority"
 competetion_authority_desc:0 "The Turkish Competition Authority is Turkey's competition regulator. It is a government body that uses the powers granted to it by law to prevent threats to competition in the markets for goods and services. Ensuring the fair allocation of resources and increasing social welfare by protecting competition is the foundation of its mission."
 turksoy:0 "TURKSOY"
 turksoy_desc:0 "The International Organization of Turkic Culture is an international cultural organization of countries with Turkic populations speaking languages of the Turkic family. Besides being an abbreviation of its former official name, the Joint Administration of Turkic Culture and Arts, "Türksoy" is also a Turkish compound word made up of "Türk" and "soy" (ancestry)."
 turkpa:0 "TURKPA"
 turkpa_desc:0 "TÜRKPA, in full the Parliamentary Assembly of Turkic-Speaking Countries, is an international organization made up of several Turkic countries."
 unitary_speeches:0 "Unitary Turkic Speeches"
 unitary_speeches_desc:0 "Rallies uniting the Turks must be held. Through them, the Turkic peoples will come together. Long live Turkishness!"
 turkic_media:0 "Turkic Media"
 turkic_media_desc:0 "All Turkic media are now merging. This may cause confusion and eventually get us into trouble, but it will strengthen the ideals of Turkishness."
 bureocratic_unification:0 "General Bureaucratic Unification"
 bureocratic_unification_desc:0 "The Turkic bureaucracies are uniting under one roof. For a time, this will cause serious political difficulties for our country, but once the merger is complete, foreign political axes will give way to our own."
 turkic_business_council:0 "Turkic Business Council"
 turkic_business_council_desc:0 "The Turkic Business Council monitors the workforces and economic principles of the Turkic states and draws up an economic program accordingly. The council answers entirely to the Turkic states and also maintains relations with the IMF."
 asian_economic_observer:0 "Observer of the Asian Economies"
 asian_economic_observer_desc:0 "The Turkic Council is an observer on the Asian markets and stock exchanges, which gives it faster access to information about economic activity there."
 gdp_program:0 "The GDP Mission"
 gdp_program_desc:0 "The Turkic Council's GDP Mission aims to raise GDP in every Turkic country, providing financial support to countries with low GDP to help them catch up."
 low_debts_program:0 "Low Debt Program"
 low_debts_program_desc:0 "The Turkic Council's Debt Mission aims to reduce debt in every Turkic country, ensuring peace of mind and advancing Turkic unification. To that end, the Council provides financial support to countries with excessive debt." 
 turkic_resource_commision:0 "The Turkic Resource Commission"
 turkic_resource_commision_desc:0 "The Turkic Council's Resource Commission aims to develop resource extraction in every Turkic country, providing financial support to countries that cannot afford to extract their resources." 
 turkic_bankers_union:0 "Turkic Bankers Union"
 turkic_bankers_union_desc:0 "The Turkic Council's Banking Union aims to balance inflation, exchange rates and interest rates in every Turkic country, providing financial support to banks that cannot achieve that balance." 
 turkic_economic_movement:0 "United Turkic Economic Movement"
 turkic_economic_movement_desc:0 "Everyone is united economically. Economic development must reach every Turkic country so that no region falls behind in income. Without regional income inequality, the Turkic Union can be achieved more quickly." 
 turkic_ministry:0 "The Turkic Ministries Directive"
 turkic_ministry_desc:0 "The Turkic Council needs new ministries of its own. Their creation is a sign that the founding of the union is imminent." 
 turkic_armed_forces:0 "The Turkic Defense Forces"
 turkic_armed_forces_desc:0 "The Turkic Defense Forces exist to defend every Turkic country to the death. We must protect the land of our ancestors. The Turkic heritage is safe!" 
 turkic_armed_forces_2:0 "The Turkic Defense Forces"
 turkic_armed_forces_2_desc:0 "The Turkic Defense Forces exist to defend every Turkic country to the death. We must protect the land of our ancestors. The Turkic heritage is safe!" 
 turkic_blood:0 "Turkic Blood"
 turkic_blood_desc:0 "A Turkish soldier never leaves his post until he dies. The strength of Turkishness comes from nationalism and love of the homeland. Let our enemies not even dream of invading our land." 
 contacting_old_traditions:0 "Reconnecting With Old Traditions"
 contacting_old_traditions_desc:0 "Ahead of Turkic unification, we must declare our devotion to our ancient traditions. It will greatly strengthen Turkic unity, but it will seriously harm our capacity for innovation."
 war_spirit_of_turkic:0 "The Realm of the War Spirit"
 war_spirit_of_turkic_desc:0 "We are returning to our old traditions of war. Every Turk should know how to fight. Moving from nomadic to settled life must not make us lose ourselves."
 nationalistic_education_laws:0 "Nationalist Education Laws"
 nationalistic_education_laws_desc:0 "The Turkish education program is built on Turkish nationalism. Through it, absolute Turkish nationalism and unity can be achieved."
 center_of_nomidaic_civizilations:0 "Centre of the Nomadic Civilizations"
 center_of_nomidaic_civizilations_desc:0 "The lands where the Turks first emerged are where nomadic societies formed and passed through. These nomadic communities must be studied, and an institute has been founded to do so."
 turkic_heritage_council:0 "Turkic Heritage Council"
 turkic_heritage_council_desc:0 "The Foundation aims to protect, study and promote Turkic culture and heritage by supporting and funding activities, projects and programs."
 turkic_expansionism:0 "Turkic Expansionism"
 turkic_expansionism_desc:0 "We are ready to fight for our honor anywhere. We are adopting a policy of toppling any country that offends our dignity."
 tengri_sponsored_country:0 "A Tengrist-Sponsored State"
 tengri_sponsored_country_desc:0 "This country embraces Tengrism and wants its people to follow the Tengrist faith."
 official_tengri_state:0 "The Tengrist Faith"
 official_tengri_state_desc:0 "Tengri was the national god of the Göktürks. The Göktürk khans based their power on a mandate from Tengri and were generally accepted as his sons, representing him on Earth. They bore titles such as tengrikut, kutluġ or kutalmysh, reflecting the belief that they had received kut, the mighty spirit Tengri granted to rulers."
 leader_of_the_second_islamic_golden_age:0 "Leader Of The Second Islamic Golden Age"
 leader_of_the_second_islamic_golden_age_desc:0 "The Second Islamic Golden Age is under way, and we are leading it. Thanks to us, Islam has begun to unite and to defeat the schemes of its enemies."
 united_chiefs_turkic:0 "Chiefs of the State"
 power_is_prosper:0 "Power Is Prosperity"
 power_is_prosper_desc:0 "We live in a country where the strong win and the weak lose. Everyone must grow stronger through competition so that we can prevail over other countries."
 coup_traditions:0 "Coup Traditions"
 coup_traditions_desc:0 "We are a country with a tradition of military intervention, a sign that neither a democratic nor a monarchical movement can take hold here. This country is in the hands of the military."
 copenhagen_criterias:0 "The Copenhagen Criteria"
 copenhagen_criterias_desc:0 "The Copenhagen criteria are the rules that determine whether a country is eligible to join the European Union. They require a state to have the institutions to preserve democratic governance and human rights, a functioning market economy, and acceptance of the EU's obligations and aims."
 yap_islet_devrets:0 "Build-Operate-Transfer"
 yap_islet_devrets_desc:0 "Build-operate-transfer (BOT) is a project delivery method, usually for large infrastructure projects, in which a private entity receives a concession from the public sector (or occasionally the private sector) to finance, design, build, own and operate a facility specified in the concession contract. This allows the developer to recover its investment, operating and maintenance costs. \n\n BOT is typically used in public-private partnerships. Because the arrangement is long-term, fees usually rise during the concession period, often tied to a combination of internal and external variables, allowing the developer to earn a satisfactory internal rate of return on its investment."
 tenmaks:0 "TENMAK"
 tenmaks_desc:0 "The Turkish Energy, Nuclear and Mining Research Institute (TENMAK) is a public institution under the Ministry of Energy and Natural Resources, headquartered in Ankara, Turkey."
 summer_tourism_attractions1:0 "Summer Tourism Attractions"
 summer_tourism_attractions1_desc:0 "On the Aegean and Mediterranean coasts, long hours of sunshine, warm air and warm seawater make for a long swimming season. Countless bays and coves support the growth of coastal tourism, and large hotels and resorts have been built along our shores."
 winter_tourism_attractions1:0 "Winter Tourism Attractions"
 winter_tourism_attractions1_desc:0 "To spread tourism across the whole year, Turkey has begun to invest in winter tourism. Uludağ, Palandöken, Kartepe, Kartalkaya, Sarıkamış, Erciyes and Mount Davraz are among Turkey's major ski resorts."
 tourism_power:0 "Extra Tourism Support for the Economy"
 tourism_power_desc:0 "Tourism brings our country significant income, and Turkey's location makes it ideal for tourism. Our biggest goal is to develop the tourism sector and, with it, the country. Let the smokeless industry run at full steam."
 quantity_inspection:0 "Quality Inspection"
 quantity_inspection_desc:0 "Quality inspections protect brands and company reputations by minimizing defective goods, customer complaints, non-compliant products and late or short shipments."
 e_devlet:0 "E-Devlet"
 e_devlet_desc:0 "e-Devlet is a Turkish government portal providing access to public services, with an information section for foreigners. Users log in to e-Devlet with their ID number and password or with their identity cards; mobile and electronic signature logins are also available, and internet banking customers can access it through their bank." 
 reduced_ministers:0 "Fewer Ministries"
 reduced_ministers_desc:0 "The ministries cost far too much money, which is almost a waste, so we have reduced their number."
 ssk_systematic:0 "The SSK's Systematic Work"
 ssk_systematic_desc:0 "The largest social security organization in Turkey, providing insurance and medical services to about 50% of the population." 
 bag_kur_system_perfected:0 "The Bağ-Kur System Reworked"
 bag_kur_system_perfected_desc:0 "Bağ-Kur provides disability, old-age, survivors' and health insurance to the people it covers, along with lump-sum payments, funeral allowances and social assistance increases."
 original_social_state:0 "Social State"
 original_social_state_desc:0 "The social state, or welfare state, is a form of government in which the state (or a well-established network of social institutions) protects and promotes the economic and social well-being of its citizens, based on the principles of equal opportunity, equitable distribution of wealth and public responsibility for those unable to provide for themselves the minimum for a decent life. Sociologist T. H. Marshall described the modern welfare state as a distinctive combination of democracy, welfare and capitalism." 
 city_inside_law:0 "Inner City Law"
 city_inside_law_desc:0 "Urban laws exist to keep order in the cities. That order is the cornerstone of raising a disciplined, hardworking society." 
 virtual_learning:0 "Virtual Learning"
 virtual_learning_desc:0 "A virtual learning environment (VLE) is a web-based platform for the digital side of courses, usually within educational institutions. It presents resources, activities and interactions within a course structure and supports the different stages of assessment."
 redzyne_the_syd:0 "The Perfected SYD"
 redzyne_the_syd_desc:0 "The SYD is essential to our security. We have reorganized it into a proper security structure and put it back at our people's service. Our people's safety is our priority." 
 CHP_constitution_TUR_reel:0 "The Social Essentials Constitution"
 health_insurance:0 "Health Insurance"
 health_insurance_desc:0 "General health insurance protects people's health and finances the costs they incur when facing health risks. This country has a good level of health coverage."
 medicine_supervision:0 "Medicine Supervision"
 medicine_supervision_desc:0 "Medical supervision means the regular coordination, direction and inspection by a physician of a non-licensed individual's delegated delivery of medical services." 
 strike_law:0 "Strike Law"
 strike_law_desc:0 "Workers have the right to strike, but under certain conditions. We have reviewed those conditions and introduced a new strike law. We hope it will satisfy our workers and unions." 
 ILO_standarts:0 "ILO Standards"
 ILO_standarts_desc:0 "International labor law is the body of rules spanning public and private international law that governs the rights and duties of employees, employers, trade unions and governments in regulating the workplace. The International Labour Organization and the World Trade Organization have been the main international bodies reforming labor markets, while the International Monetary Fund and the World Bank have indirectly driven changes in labor policy by attaching structural adjustment conditions to their loans and grants. Conflict-of-laws questions arise when people work in more than one country, decided by national courts and by supranational bodies; the European Union in particular has a growing body of labor rights law. We have now fully enacted these internationally accepted laws in Turkey."
 stockers_hunt:0 "The Hoarders Hunt"
 stockers_hunt_desc:0 "We are cracking down on the traitors who hoard goods. Hoarding is a direct attack on our country's economy, and we cannot ignore it." 
 employer_and_employment_peace:0 "Peace Between Employers and Employees"
 employer_and_employment_peace_desc:0 "Employers and employees must get along. When they don't, unemployment and bankruptcies rise. To keep the peace, we will step in and give both sides substantial financial support. Long live peace and financial stability!" 
 inflation_defence:0 "Protecting Workers From Inflation"
 inflation_defence_desc:0 "We must shield our workers from rising inflation by raising their wages above the inflation rate. It may put us under financial strain, but we will bear it."
 kemalist_education_system:0 "Kemalist Education System"
 kemalist_education_system_desc:0 "Our schools should aim to raise Kemalist children. With this model of education, Turkey can develop." 
 kemalist_education_system_2:0 "The Kemalist-Nationalist Education System"
 kemalist_education_system_2_desc:0 "Our schools should aim to raise Kemalist and nationalist children. With this model of education, Turkey can develop." 
 kemalist_institutions:0 "Kemalist Institutions"
 kemalist_institutions_desc:0 "Kemalist institutions of thought exist to strengthen our country under the banner of Kemalism." 
 a_language_of_science:0 "A Language of Science"
 a_language_of_science_desc:0 "As Atatürk said, our language should be the language of science. In line with his vision, we are beginning to turn our language into a language of science."
 general_culture_programs:0 "General Culture Programs"
 general_culture_programs_desc:0 "General culture programs are vital to understanding our national values." 
 mobilization_of_the_students:0 "The Mobilization of the Students"
 mobilization_of_the_students_desc:0 "It is time to call our students to mobilize on the path of knowledge. With this mobilization, our country will move to the forefront!" 
 school_scholarships:0 "School Scholarships"
 school_scholarships_desc:0 "A scholarship is an award of financial aid that helps a student continue their education at a private primary or secondary school or a private or public college, university or other institution. Scholarships are awarded on various criteria, such as academic merit, diversity and inclusion, athletic skill and financial need, or a combination of these, and usually reflect the values and goals of the donor or founder." 
 foreign_language_supported_schools:0 "Schools with Foreign Language Support"
 vocational_education:0 "Vocational Education"
 vocational_education_desc:0 "Vocational education and training (VET) aims to give students the knowledge and skills needed to work successfully in specific occupations." 
 TDK_progress:0 "TDK Progress..."
 TDK_progress_desc:0 "The Turkish Language Association (Türk Dil Kurumu, TDK) is the regulatory body for the Turkish language, founded on 12 July 1932 on the initiative of Mustafa Kemal Atatürk and headquartered in Ankara. It is the official authority on the language, contributes to linguistic research on Turkish and other Turkic languages and publishes the official Turkish dictionary." 
 protection_of_secularism:0 "Protecting Secularism and Laicism"
 protection_of_secularism_desc:0 "We are building a great wall to protect secularism and secular laws. No one must ever try to tear it down, for if it falls, Atatürk's reforms and the spirit of progress in this country will die along with the Kemalist bureaucracy." 
 secular_front:0 "Secular Front"
 secular_front_desc:0 "The secular front exists to stamp out radical Islamist activity in our country. If it is not crushed wherever it appears, it will do great damage to our secularism, so we are moving to prevent it."
 planted_secular:0 "Planted Secularist Agents"
 planted_secular_desc:0 "We have planted secularist groups inside some non-secular parties. Their task is to undermine the parties' anti-secular cadres and collect legal evidence, which will allow us to have those parties shut down." 
 alevi_cooperation:0 "Alevi Cooperation"
 alevi_cooperation_desc:0 "The Alevis understand the secularists, having long been attacked by radical Sunnis. We share the same enemy, "radical Sunni Islamists", so we can come to terms with them and stand united against radicalism." 
 alevi_quarries:0 "Alevi Cooperation and Cemevis"
 alevi_quarries_desc:0 "The Alevis understand the secularists, having long been attacked by radical Sunnis. We share the same enemy, "radical Sunni Islamists", so we can come to terms with them and stand united against radicalism." 
 anti_radicalism_program:0 "The Anti-Radicalism Program"
 anti_radicalism_program_desc:0 "We have launched programs against the rise of radicalism, and the public is moving away from it toward the center." 
 protect_the_belief:0 "Protect Freedom of Belief"
 protect_the_belief_desc:0 "We must also preserve our faith. It must never be trampled in the name of secularism. By protecting it, we will prevent religious unrest and malaise in this country." 
 populist_art:0 "The Art of Populism"
 populist_art_desc:0 "Populism is an art, and it must be practiced well. If our people are unhappy, the country becomes a haven of inefficiency; if they see the right populist steps, they will be happy, and the country becomes a haven of efficiency." 
 obsudman_instution:0 "The Ombudsman Institution"
 obsudman_instution_desc:0 "An ombudsman, or public advocate, is an official usually appointed by the government or parliament but with a significant degree of independence. In some countries, an inspector general, citizens' advocate or other official may have similar duties to a national ombudsman and may also be appointed by the legislature. Below the national level, ombudsmen may be appointed by state, local or municipal governments, while unofficial ombudsmen may be appointed by, or even work for, organizations such as utilities, newspapers, NGOs or professional regulatory bodies." 
 juidacary_quality_1:0 "The Forces of Law and Equality"
 juidacary_quality_1_desc:0 "The forces of law and equality work impartially and systematically, binding our people to their country, and this bond is a source of national strength. \n\n§YQuality of Law and Equality:§!§R Poor§!" 
 juidacary_quality_2:0 "The Forces of Law and Equality"
 juidacary_quality_2_desc:0 "The forces of law and equality work impartially and systematically, binding our people to their country, and this bond is a source of national strength. \n\n§YQuality of Law and Equality:§!§Y Normal§!" 
 juidacary_quality_3:0 "European Court of Human Rights Support for the Forces of Equality"
 juidacary_quality_3_desc:0 "The forces of law and equality work impartially and systematically, with the support of the European Court of Human Rights, binding our people to their country, and this bond is a source of national strength. \n\n§YQuality of Law and Equality:§!§G Good§!"
 support_women_works:0 "Support Women's Employment"
 support_women_works_desc:0 "Women have the right to work, and that right must be supported both financially and morally. Long live women's rights!" 
 cotton_industries_strenghen:0 "Cotton Industries"
cotton_industries_strenghen_desc:0 "Cotton is the world's most important natural fiber. In 2007, the global harvest was 25 million tons from 35 million hectares cultivated in more than 50 countries. Turkey produces around half a million tons, and we are here to increase that to strengthen the economy. Conditions for the cotton industry in Turkey are also very good."
 agency_on_pensylvania:0 "Agents in Pennsylvania"
 agency_on_pensylvania_desc:0 "We need to place agents in Pennsylvania, because a serious threat to our country's security is coming from there. We intend to stop it." 
 south_flank_NATO:0 "Leading NATO's Southern Flank Forces"
 south_flank_NATO_desc:0 "We are leading NATO on its southern flank. Our task is to protect the south and never retreat as NATO." 
 balkan_NATO:0 "Leading NATO's Balkan Forces"
 balkan_NATO_desc:0 "We are leading NATO in the Balkans. Our task is to protect the Balkans and never retreat as NATO." 
 bedrock_of_financial_stability:0 "Bedrock of Financial Stability"
 bedrock_of_financial_stability_desc:0 "These regions are ideal for finance and have a structure that will not collapse, making them almost a paradise for investors." 
 power_in_un:0 "A Stronger Position at the UN"
 power_in_un_desc:0 "Through international outreach, we have raised our standing at the UN. This prestige will serve us everywhere." 
 kilicdaroglus_emergency_powers:0 "Kılıçdaroğlu's Emergency Powers"
 kilicdaroglus_emergency_powers_desc:0 "We are granting Kılıçdaroğlu emergency powers, with which the party can easily be reorganized." 
 heleno_kemalism:0 "Hellenic Kemalism"
 heleno_kemalism_desc:0 "Hellenic Kemalism combines Hellenic and Kemalist thought, and the combination has produced an indestructible force: the resilience of Hellenism and the reformism of Kemalism are the cornerstones of its power." 
 concept_of_internationalism:0 "The Concept of Blue Kemalist Internationalism"
 turkish_nationalism:0 "Turkish Nationalism"
 turkish_nationalism_desc:0 "Turkish nationalism is a political ideology that promotes and glorifies the Turkish people as a national, ethnic or linguistic group." 
 national_defence_organizations:0 "National Defence Organizations"
 national_defence_organizations_desc:0 "The National Defense Organizations exist to wipe out terrorist activity in our country. They will make our fight against the PKK easier and bring us closer to victory." 
 european_values:0 "European Values"
 reliable_man:0 "Kılıçdaroğlu, the Reliable Man"
 reliable_man_desc:0 "Kılıçdaroğlu has proven himself a very reliable man, and we are sure his reliability will take us far." 
 embrace_positivism:0 "Positivism"
 embrace_positivism_desc:0 "Positivism is a philosophical theory holding that all genuine knowledge is either positive, that is, derived exclusively from experience of natural phenomena and their properties and relations, or true by definition, that is, analytic and tautological. Information derived from sensory experience, interpreted through reason and logic, is thus the exclusive source of all certain knowledge." 
 strenghen_AYM:0 "A Powerful AYM"
 strenghen_AYM_desc:0 "The Constitutional Court of Turkey (AYM) is the highest legal body for constitutional review in Turkey. It "examines the constitutionality, in respect of both form and substance, of laws, decrees having the force of law, and the Rules of Procedure of the Grand National Assembly of Turkey" (Article 148/1 of the Constitution). When necessary, it also sits as the Supreme Criminal Tribunal to try the President, Vice President, members of the Cabinet or judges of the high courts. It also examines individual applications claiming that public authorities have violated a fundamental right or freedom guaranteed by the Constitution within the scope of the European Convention on Human Rights (Article 148/3)." 
 kemalist_nationalism:0 "Kemalist Nationalism"
 kemalist_nationalism_desc:0 "The Kemalist revolution aimed to build a nation-state from the remnants of the multi-religious, multi-ethnic Ottoman Empire. Kemalist nationalism draws on social contract theory, especially the principles of Jean-Jacques Rousseau's Social Contract. Its view of the social contract was shaped by the collapse of the Ottoman Empire, which it saw as the result of the failed Ottoman "millet" system and the ineffective policy of Ottomanism. Having lived through the empire's breakup, Kemalist nationalism made the social contract its "highest ideal". It combines secularism, chauvinism and a personality cult of Atatürk." 
 milletin_adami_kilicdaroglu:0 "Kılıçdaroğlu, the Man of the Nation"
 milletin_adami_kilicdaroglu_desc:0 "Kılıçdaroğlu is now a man of the nation, respected and known by our people for doing whatever they want." 
 old_school_kemalism:0 "Old-School Kemalism"
 old_school_kemalism_desc:0 "Old-school Kemalism is broadly neutral Kemalism, though it contains elements of left-wing Kemalism. Its aim is to depoliticize the country: according to old-school Kemalists, a depoliticized country would bring people peace and put an end to terror." 
 war_with_inflation:0 "War on Inflation"
 war_with_inflation_desc:0 "We are fighting inflation, and there will be no rest until it falls. We will overcome it with a near-deflationary economic policy." 
 sumerbank_D:0 "Sümerbank Revenues"
 sumerbank_D_desc:0 "Sümerbank was the cornerstone of Atatürk's industrial revolution in Turkey. Its factories and plants, which embodied state-led industrialization in the Turkish textile sector for decades, were gradually closed and sold off from 2002 onward. We have now halted that sell-off. To recover, Sümerbank must turn a profit, so its factories need support." 
 investment_cult:0 "Investment Cult"
 investment_cult_desc:0 "As globalization integrates the economies of neighboring and trading states, they are typically forced to trade away such rules as part of a common tax, tariff and trade regime, for example one defined by a free trade agreement. Such agreements usually discourage investment policies that favor local investors over global ones, and the idea of a separate investment policy quickly becomes a fiction, as real decisions reflect nations' need to compete for investment, even from their own investors." 
 national_mobilization:0 "National Mobilization"
 national_mobilization_desc:0 "We have mobilized the entire country against the PKK. Destroying this organization will bring peace to the Turkish nation, and that is our goal."
 work_propaganda:0 "Work Propaganda"
 work_propaganda_desc:0 "The will to work must be kept alive, so we will reduce unemployment through propaganda that encourages work." 
 industrialization_concept:0 "The Concept of Industrialization"
 industrialization_concept_desc:0 "Industrialization is the foundation of an economic masterpiece. We will therefore industrialize our country rapidly and take strong steps toward a strong Turkey." 
 diplomatic_coverage:0 "Weltpolitik-Style Diplomacy"
 diplomatic_coverage_desc:0 "Inspired by Bismarck's shrewd policies, we will secure guarantees from other countries and, through them, shield our country from emerging dangers." 
 economic_interventionary:0 "Chaotic Economic Interventions"
 economic_interventionary_desc:0 "The government's economic interventions follow no system and are carried out chaotically. Such interventions can hurt our country, so they must be brought into a system." 
 economy_resolvation_project:0 "Economic Resolution Project"
 economy_resolvation_project_desc:0 "We will find solutions to Turkey's endless economic problems and, through them, save the country from this bad economy and make it grow." 
 economic_interventionary_organized:0 "Systematic Economic Interventions"
 economic_interventionary_organized_desc:0 "We have brought our economic interventions together into a single system, within which we will grow our country steadily." 
 anti_privatization:0 "Opposition to Privatization"
 anti_privatization_desc:0 "By opposing privatization, we will keep finance under state control, so that we do not suffer economic hardship in the future or feel the problems of the liberal market." 
 agriculture_projection:0 "Agricultural Project"
 agriculture_projection_desc:0 "With so much rural land, farming comes easily to our country and can earn it significant income. Agriculture is one of the best things this country can do." 
 agriculture_supporteds:0 "Agricultural Project"
 agriculture_supporteds_desc:0 "With so much rural land, farming comes easily to our country and can earn it significant income. Agriculture is one of the best things this country can do." 
 volunteer_efficent_force:0 "An Efficient Volunteer Force"
 volunteer_efficent_force_desc:0 "The army should consist mainly of volunteers. An army of volunteers will be stronger and unstoppable." 
 feeded_the_military_revenge:0 "Military Revenge"
 feeded_the_military_revenge_desc:0 "Recent attacks have put our army under strain, which has naturally bred a thirst for revenge in its ranks. That thirst will work in our favor, because no country or system can withstand revenge with its structure intact." 
 feeded_the_military_revenge_extreme:0 "Extreme Military Revenge"
 feeded_the_military_revenge_extreme_desc:0 "Recent attacks have put our army under strain, which has naturally bred a thirst for revenge in its ranks. That thirst will work in our favor, because no country or system can withstand revenge with its structure intact." 
 crusade_against_pkk:0 "Crusade Against the PKK"
 crusade_against_pkk_desc:0 "We will seek the support of all faiths against the PKK terrorist organization. This communist, godless organization must be destroyed."
 kemalist_doctrine:0 "Kemalist Doctrine"
 kemalist_doctrine_desc:0 "By following a Kemalist doctrine, we will build a Kemalist Turkey. Kemalism emerged as a blend of two seemingly opposite things: revolutionism and nationalism." 
 revolutionism_TR:0 "Revolutionism"
 revolutionism_TR_desc:0 "Every country needs revolutionary ideas. A country without a revolutionary movement stays where it is and cannot progress. Atatürk is our country's greatest revolutionary and its founding leader, and since we follow in his footsteps, there is no harm in embracing revolutionism." 
 elective_state:0 "Elective State"
 quality_politics:0 "Clean Politics"
 quality_politics_desc:0 "We have banned dirty politics. With these bans, our politics will be cleaned up and Turkey will be cleaner." 
 multi_party_elective_state:0 "A True Multi-Party State"
 multi_party_elective_state_desc:0 "Our country is genuinely multi-party, so political ideas can be debated freely and a way forward can be found." 
 ethics_committee:0 "Ethics Committee"
 ethics_committee_desc:0 "An ethics committee is a body responsible for ensuring that medical experiments and research involving human subjects are carried out ethically, in line with national and international law." 
 state_search_group:0 "The State Search Group"
 state_search_group_desc:0 "The internal search service exists to keep the country out of serious trouble. It detects enemies in the field and reports directly to the central government whenever a problem arises, making it vital for both governance and security." 
 controlled_pro_western_clubs:0 "Controlled Pro-Western Clubs"
 controlled_pro_western_clubs_desc:0 "Inspecting Western-style clubs and entertainment venues is now absolutely necessary. With this control and supervision, we can stop Westernism from spreading through our country like a virus." 
 neutral_power_of_realm:0 "Neither Too Western nor Too Eastern"
 neutral_power_of_realm_desc:0 "Atatürk always wanted our country to stay neutral. Turkey honored that wish until it broke its neutrality by joining NATO in the early 1950s. Now that we are in charge, we want to withdraw from political entanglements and return the country to neutrality." 
 TTK_progress:0 "Türk Tarih Kurumu"
 TTK_progress_desc:0 "The Turkish Historical Society (TTK) is a research institution founded on 12 April 1931 on Mustafa Kemal Atatürk's instructions to study Turkish history from primary sources. Under Decree Law No. 664, it has a separate public legal personality and was placed under the oversight of the Atatürk Supreme Council for Culture, Language and History, founded in 1983." 
 TUR_17_year_politiche:0 "The Age-17 Policy"
 TUR_17_year_politiche_desc:0 "We have lowered the minimum working age to 17, allowing our country to bring young people into the workforce more quickly." 
 militaristic_education:0 "Militaristic Education"
 militaristic_education_desc:0 "Given our position and our traditions, military education must remain compulsory and be expanded. War is a reality and Turkey is in a dangerous position; the homeland must be ready for every kind of defense." 
 village_institutions:0 "Village Institutes"
 village_institutions_desc:0 "The Village Institutes were a network of rural schools founded under a project led by Hasan Âli Yücel, then Minister of Education, launched on 17 April 1940 to train teachers. The DP shut the project down after coming to power, and we have now revived it. The institutes were cornerstones of rural development in the post-war Turkish state: at a time when most villages had few educational institutions, they helped educate the rural population and met each village's need for teachers." 
 improvement_of_general_culture:0 "Improving General Culture"
 improvement_of_general_culture_desc:0 "Progress in general culture matters greatly. A person who lacks general culture remains ignorant, whatever else they know." 
 general_culture_protection_institutions:0 "Institutions for the Protection of General Culture"
 general_culture_protection_institutions_desc:0 "Lately, popular culture has been eroding general culture. By founding an institution to protect general culture, we will keep popular culture from harming it."
 quality_museums:0 "Quality Museums"
 quality_museums_desc:0 "By opening high-quality museums across the country, we will make our people both happier and more cultured."
 turkish_theathers:0 "Turkish Theatres"
 turkish_theathers_desc:0 "Theater is a collaborative performing art in which live performers, usually actors and actresses, present the experience of a real or imagined event to a live audience in a specific place, often a stage. Performers may convey this experience through combinations of gesture, speech, song, music and dance, while painted scenery and stagecraft such as lighting enhance its physicality, presence and immediacy." 
 turkish_films:0 "Turkish Films and Series"
 turkish_films_desc:0 "Domestic film and TV series production must continue, so that our country is not swayed by others and keeps its identity." 
 four_elements_under_protection:0 "The Protected First Four Articles"
 four_elements_under_protection_desc:0 "The first four articles of our Constitution are protected. Any attempt to change them will make military intervention inevitable." 
 prisoner_law:0 "The Criminal Law"
 prisoner_law_desc:0 "We have completed the draft law on offenders and passed a more sensible criminal law. Criminals will no longer be able to do as they please." 
 improve_the_women_laws:0 "Improving Women's Rights"
 improve_the_women_laws_desc:0 "Women's rights have weakened in our country lately. We have enacted new laws to protect and strengthen them. Women's rights matter greatly to us." 
 protect_informals:0 "Protect Informals"
 protect_informals_desc:0 "We have passed a law protecting copyright, which will please scientists and many businesses." 
 constitution_protection_under_arms:0 "The Constitution Protected by Arms"
 constitution_protection_under_arms_desc:0 "" 
 turkish_books_level_1:0 "Developing Turkish Publishing"
 turkish_books_level_1_desc:0 "More Turkish books mean more reading, and more reading is a gem that will carry our country forward. Reading is a tool of development." 
 turkish_books_level_2:0 "A Major Boost to Turkish Publishing"
 turkish_books_level_2_desc:0 "More Turkish books mean more reading, and more reading is a gem that will carry our country forward. Reading is a tool of development." 
 datamining_crush:0 "Crush Data Mining"
 datamining_crush_desc:0 "Data mining must be stamped out wherever it is found. It is a national nuisance and a means of stealing information." 
 socialists_shield:0 "Shield Against Capitalism"
 socialists_shield_desc:0 "This country is a pillar and bastion against capitalism. People who loathe capitalism have gathered here for a common purpose: to destroy every capitalist thing in the country." 
 turkish_autarky:0 "Turkish Autarky"
 turkish_autarky_desc:0 "Autarky is the quality of self-sufficiency, usually applied to societies, communities, states and their economic systems."
 great_power_projection:0 "Great Power Projection"
 great_power_projection_desc:0 "By establishing bases in many places, our country has strengthened itself politically and militarily. This will serve us well in the global balance of power." 
 total_war_economy:0 "Total War Economy"
 total_war_economy_desc:0 "With war upon us, we must organize our economy and run our factories accordingly. We are pushing factories beyond their normal limits to produce a surplus, which will bring a degree of authoritarianism and instability."
 growing_industries:0 "Growing Industries..."
 growing_industries_desc:0 "Our industries have begun to grow rapidly, allowing us to accelerate production."
 faster_production:0 "Faster Production"
 faster_production_desc:0 "We are enabling our factories to produce more. More production means more goods, stability and strength." 
 compliance_forces:0 "Compliance Forces"
 compliance_forces_desc:0 "We have created new enforcement units to prevent riots in the region. Their aim is to put down rebellions and make the people accept the current Turkish regime." 
 rise_of_greek_nationalism:0 "Greek Nationalism Supported"
 rise_of_greek_nationalism_desc:0 "Turkey is backing Greek nationalism: if nationalism brings a far-right party to power here, we will be thrown out of NATO, and Turkey will seize the opportunity to occupy Greece." 
 rise_of_bulgarian_nationalism:0 "Bulgarian Nationalism Supported"
 rise_of_bulgarian_nationalism_desc:0 "Turkey is backing Bulgarian nationalism: if nationalism brings a far-right party to power here, we will be thrown out of NATO, and Turkey will seize the opportunity to occupy Bulgaria." 
 covering_industries:0 "Sheltering Industries"
 covering_industries_desc:0 "We must protect our industry against possible air raids and bombardment by hiding our factories. It is vital that our industries come to no harm." 
 covering_people_in_shelters:0 "Sheltering the Population"
 covering_people_in_shelters_desc:0 "Radioactive and chemical weapons look set to be used heavily in this war, so it would be wise to move our population into tunnels and underground shelters." 
 all_time_working_factories:0 "24/7 Factories"
 all_time_working_factories_desc:0 "The factories are running nonstop. Our people are worn out, but this is what war demands. Let's grind a little harder and produce more; victory lies ahead!" 
 call_arms_for_war:0 "The Call to Arms"
 call_arms_for_war_desc:0 "We are calling all our people to war. This is the nation's war, your war for survival." 
 war_for_the_motherland:0 "War for the Motherland"
 war_for_the_motherland_desc:0 "The motherland is in danger. The war has turned the world into hell, and we must pull our homeland out of it. We will never allow our homeland to be invaded." 
 uranium_trade:0 "Uranium Trade"
 uranium_trade_desc:0 "Our country is now trading in uranium. Because uranium is hard to find and yields enormous energy, it sells for a great deal of money on the markets, earning our country large sums." 
 banner_of_victory:0 "Banner of Victory"
 banner_of_victory_desc:0 "We appear to have emerged victorious from the Third World War. From now on, no country will defeat us; we will never lose a war." 
 russian_victory_sighted:0 "Russian Supremacy"
 russian_victory_sighted_desc:0 "Russia's supremacy over Europe is complete; all of Europe now rests on Russia. This dominance proves that our Russia is a superpower and an invincible force." 
 militant_interventionism:0 "Interventionist Corps"
 militant_interventionism_desc:0 "We have formed intervention units whose aim is to turn the situation in other countries to our advantage."
 emergency_relocation_plan:0 "Emergency Relocation Plan"
 emergency_relocation_plan_desc:0 "War is at hand and we must act. We must move our population east to safe areas and build defenses along our western borders."
 socialist_defenders:0 "Socialist Defenders"
 socialist_defenders_desc:0 "We have stationed socialist militants across the country against the worldwide plague of capitalism. The moment the capitalist threat arrives, they will dig up the guns they buried and fight to the end." 
 counter_fetwa:0 "A Counter-Fatwa"
 counter_fetwa_desc:0 "The Gülen movement has issued a fatwa against us, so we will issue one against them. We will crush these merchants of religion within our borders." 
 controlled_television:0 "Controlled Television"
 controlled_television_desc:0 "Through RTÜK, we are taking over the television channels to block terrorist propaganda and foreign aggression. With television in our hands, many new regulations will be on our agenda." 
 collegues_against_gulenists:0 "Anti-Gülenist Universities"
 collegues_against_gulenists_desc:0 "By winning the universities to our side, we have turned them against the Gülenists and strengthened our hand against the Gülen movement." 
 scientific_community_against_gulenists:0 "An Anti-Gülenist Scientific Community"
 nationalist_coverage:0 "Nationalist Coverage"
 nationalist_coverage_desc:0 "Through nationalism, we can build a large and powerful army. Nationalism is what matters most to states; liberal ideas are utter nonsense."
 wheat_fields:0 "Wheat Fields"
 wheat_fields_desc:0 "Wheat is grown on more land than any other food crop (220.4 million hectares, or 545 million acres, in 2014). World trade in wheat exceeds that of all other crops combined. In 2017, world wheat production was 772 million tonnes (1.7 trillion pounds), with 2019 production forecast at 766 million tonnes, making it the second most-produced cereal after maize." 
 adana_agriculture_basis:0 "Adana Agricultural Bases"
 mafia_underground_base:0 "Mafia Underground Base"
 mafia_underground_base_desc:0 "The headquarters of the national mafia organization has been established. It provides overall authority and administration; in other words, it is the cornerstone of the emerging mafia order and of its oversight."
 datamining_group:0 "The Data Mining Group"
 datamining_group_desc:0 "Data mining is the process of extracting and discovering patterns in large data sets using methods at the intersection of machine learning, statistics and database systems."
 code_breaker_group:0 "The Code Breaker Group"
 code_breaker_group_desc:0 "We have set up a code-breaking group whose purpose is to crack government networks, infiltrate them and take them over to run the administration."
 controlling_the_banks:0 "Controlling the Banks"
 controlling_the_banks_desc:0 "The banks must be controlled. All banks must be public; otherwise order will break down and exploitation will follow. We will not let the banks exploit our people. Only we, the mafia, may do that."
 controlling_the_security_channels:0 "Controlling the Security Channels"
 controlling_the_security_channels_desc:0 "By breaching the firewalls, we have taken control of the country's security apparatus. We are now aware of everything that happens in the army and the security forces."
 relocation_of_mafias:0 "Relocating the Mafias"
 relocation_of_mafias_desc:0 "By relocating the mafias and spreading them across the country, we will extend our power over the whole nation."
 mafia_underground_base_2:0 "A Secure Mafia Base"
 mafia_underground_base_2_desc:0 "The headquarters of the national mafia organization has been established. It provides overall authority and administration; in other words, it is the cornerstone of the emerging mafia order and of its oversight."
 one_man_state:0 "The Mafia Dictatorship"
 one_man_state_desc:0 "There is no democratic order anymore. Power is now distributed according to the strength of the mafias: the most powerful mafia rules, and the others serve as its lieutenants."
 one_man_state_strong:0 "A Strengthened Mafia Dictatorship"
 one_man_state_strong_desc:0 "There is no democratic order anymore. Power is now distributed according to the strength of the mafias: the most powerful mafia rules, and the others serve as its lieutenants."
 tores_in_the_law:0 "Töre in the Law"
 tores_in_the_law_desc:0 "At the mafias' request, customary codes (töre) will now be written into the law. These customs may undermine structural stability."
 controlled_tores:0 "Töre Under Control"
 controlled_tores_desc:0 "At the mafias' request, customary codes (töre) will now be written into the law. These customs may undermine structural stability, so to prevent this we will place them under firm state supervision. Oversight matters."
 the_new_hyrarchy:0 "The New Hierarchy"
 the_new_hyrarchy_desc:0 "With the old democratic order gone, a new hierarchy has emerged, with the mafias at the top and minorities at the bottom. This new hierarchy is structurally close to Nazism."
 gun_studies_1:0 "Permitted Personal Firearms"
 gun_studies_1_desc:0 "Everyone must learn to use a gun and have one in hand. Our people can learn on their own or attend weapons courses. The better our people know their weapons, the stronger our military will become."
 gun_studies_25:0 "Gun Studies"
 gun_studies_25_desc:0 "Everyone must learn to use a gun and have one in hand. Our people can learn on their own or attend weapons courses. The better our people know their weapons, the stronger our military will become."
 casinos_1:0 "Legalized Casinos"
 casinos_1_desc:0 "Banning casinos is complete nonsense. If people want to gamble their money, let them. After all, we use casinos to make money too."
 casinos_2:0 "Casino Commissions"
 casinos_2_desc:0 "Banning casinos is complete nonsense. If people want to gamble their money, let them. After all, we make money from the casinos too, by taking a commission."
 state_of_criminals:0 "State Of Criminals"
 state_of_criminals_desc:0 "Our country is a paradise for criminals. Criminals come here from all over the world, we look after them, and we get paid for it."
 education_of_loyalty:0 "Education Of Loyalty"
 education_of_loyalty_desc:0 "Loyalty to our people must be taught. Without loyalty, no new mafias will emerge and no new recruits will join, and we will stagnate."
 return_to_islam:0 "The Return to Islam..."
 return_to_islam_desc:0 "Our mafia state needs the backing of the religious. To win it, we will bring our people closer to Islam and crush any atheist activity we find."
 return_to_islam_2:0 "The Return to Islam..."
 return_to_islam_2_desC:0 "Our mafia state needs the backing of the religious. To win it, we will bring our people closer to Islam and crush any atheist activity we find."
 right_wing_supremacy:0 "Right-Wing Literature Dominates"
 right_wing_supremacy_desc:0 "With the left wiped out, the right now dominates our country. Right-wing books and right-wing education are only small signs; the bigger picture shows far more."
 right_wing_supremacy_2:0 "Right-Wing Education"
 right_wing_supremacy_2_desc:0 "With the left wiped out, the right now dominates our country. Right-wing books and right-wing education are only small signs; the bigger picture shows far more."
 controlled_media:0 "Controlled Social Media"
 controlled_media_desc:0 "Monitoring and controlling social media is an absolute necessity. Left unchecked, social media could drive the public to revolt. This must be prevented urgently."
 new_prisons:0 "New Prisons"
 new_prisons_desc:0 "Building new prisons matters to us. With more prisons, more criminals can be locked up for their crimes, and stability will rise somewhat."
 all_power_to_TRT:0 "All Power to TRT"
 all_power_to_TRT_desc:0 "It makes most sense for us to have all media run by TRT. Since TRT is a network we control, we will have no problems. That is why we are turning TRT into the country's general media."
 secret_DNA_interventions_1:0 "Secret DNA Interventions"
 secret_DNA_interventions_1_desc:0 "Intervening in people's genes and DNA looks promising. Through it, we can make our people more productive and put an end to the age of emotion. Of course, this genetic intervention must be kept secret; if it came to light, it could even plunge the country into civil war."
 secret_DNA_interventions_2:0 "Secret Funded DNA Interventions"
 secret_DNA_interventions_2_desc:0 "Intervening in people's genes and DNA looks promising. Through it, we can make our people more productive and put an end to the age of emotion. Of course, this genetic intervention must be kept secret; if it came to light, it could even plunge the country into civil war."
 acceptable_violance:0 "Acceptable Violence"
 acceptable_violance_desc:0 "Violence must become acceptable in our country. Violence gives people strength and teaches them to recover quickly."
 arrest_the_unemployment:0 "Arrest the Unemployed"
 arrest_the_unemployment_desc:0 "To fight unemployment, we are abandoning so-called democratic methods for violent ones: we are arresting the unemployed. That way, unemployment will not stay high."
 create_state_information_bureau:0 "The State Information Bureau"
 create_state_information_bureau_desc:0 "We will set up information offices in every city to gather intelligence from each one. These offices will be secret and will carry out regional espionage."
 harsh_loyaly_laws:0 "Harsh Loyalty Laws"
 harsh_loyaly_laws_desc:0 "With tough new laws, we will eliminate the disloyal. Though harsh, these laws are effective at ensuring overall stability and peace of mind."
 weaken_emotion:0 "Weakened Emotions"
 weaken_emotion_desc:0 "Emotion is utterly unnecessary; it makes people weak. Through mafia reforms, we will suppress emotion and raise a new, cold-blooded generation that leaves no room for feelings and focuses only on its work."
 weaken_emotion_2:0 "Weakened Emotions"
 weaken_emotion_2_desc:0 "Emotion is utterly unnecessary; it makes people weak. Through mafia reforms, we will suppress emotion and raise a new, cold-blooded generation that leaves no room for feelings and focuses only on its work."
 gun_studies_3:0 "Gun Studies"
 gun_studies_3_desc:0 "Everyone must learn to use a gun and have one in hand. Our people can learn on their own or attend weapons courses. The better our people know their weapons, the stronger our military will become."
 national_unity_lessons:0 "National Unity Education"
 national_unity_lessons_desc:0 "National unity education is vital to us. Without national unity there is no stability, no economy, no development; in short, nothing. That is why national unity matters most."
 military_traditions_problematic:0 "The Unstable Army"
 military_traditions_problematic_desc:0 "With the mafia's seizure of power, disobedience and anarchy have unexpectedly spread across the country, leaving the army extremely weak. Our army's honor is in tatters, and the country's security is in crisis. We must resolve this quickly, or we will be occupied."
 military_traditions_problematic_2:0 "The Unstable Army"
 military_traditions_problematic_2_desc:0 "With the mafia's seizure of power, disobedience and anarchy have unexpectedly spread across the country, leaving the army extremely weak. Our army's honor is in tatters, and the country's security is in crisis. We must resolve this quickly, or we will be occupied."
 military_traditions_problematic_3:0 "The Unstable Army"
 military_traditions_problematic_3_desc:0 "With the mafia's seizure of power, disobedience and anarchy have unexpectedly spread across the country, leaving the army extremely weak. Our army's honor is in tatters, and the country's security is in crisis. We must resolve this quickly, or we will be occupied."
 military_traditions_problematic_4:0 "The Unstable Army"
 military_traditions_problematic_4_desc:0 "With the mafia's seizure of power, disobedience and anarchy have unexpectedly spread across the country, leaving the army extremely weak. Our army's honor is in tatters, and the country's security is in crisis. We must resolve this quickly, or we will be occupied."
 military_traditions_problematic_5:0 "The Unstable Army"
 military_traditions_problematic_5_desc:0 "With the mafia's seizure of power, disobedience and anarchy have unexpectedly spread across the country, leaving the army extremely weak. Our army's honor is in tatters, and the country's security is in crisis. We must resolve this quickly, or we will be occupied."
 mafia_defence_organization:0 "Mafia Defense Organizations"
 mafia_defence_organization_desc:0 "We have established a mafia defense organization. Through it, we will rescue our country from danger and drive our enemies out. Where there is security, stability prevails."
 war_academies:0 "War Academies"
 war_academies_desc:0 "War academies have become essential: since the mafia took over, there are no generals left in the country and no new ones are coming. We will use the military academies to train the mafias and send them to the front. The crisis caused by the lack of generals must be solved."
 experimental_PKK_war:0 "Lessons From the War With the PKK"
 experimental_PKK_war_desc:0 "It is time to turn our mafias' experience from the war with the PKK into doctrine. Through it, we will keep accumulating combat experience, almost like a war bank."
 experimental_PKK_war_2:0 "Lessons From the War With the PKK"
 experimental_PKK_war_2_desc:0 "It is time to turn our mafias' experience from the war with the PKK into doctrine. Through it, we will keep accumulating combat experience, almost like a war bank."
 TUR_PKK_active_foreign: "PKK Activity"
 TUR_PKK_active_foreign_desc: "The Kurdish insurgent group is operating bases or assisting affiliated groups in this country."
 speedful_forces:0 "Rapid Forces"
 speedful_forces_desc:0 "We are working to make our armies faster, and they have already sped up somewhat. Speed is vital in combat and planning, and more speed is always welcome."
 gun_studies_4:0 "Gun Studies"
 gun_studies_4_desc:0 "Everyone must learn to use a gun and have one in hand. Our people can learn on their own or attend weapons courses. The better our people know their weapons, the stronger our military will become."
 gun_tests:0 "Gun Tests"
 gun_tests_desc:0 "We must test the weapons at our disposal. Testing will make them more reliable, and reliability must improve."
 withdrawal_law:0 "Withdrawal Law"
 withdrawal_law_desc:0 "We are passing a no-retreat law. Under it, withdrawals will be restricted, and our soldiers will not easily give up the ground they hold."
 tanks_and_airplanes_what:0 "Tanks and Airplanes?"
 tanks_and_airplanes_what_desc:0 "The mafias know nothing about airplanes and tanks; mafiosi only know infantry fighting. They must learn to use them; otherwise, what are we going to do with all these planes and tanks?"
 border_mafias_in_action:0 "Border Mafias in Action"
 border_mafias_in_action_desc:0 "With the mafia takeover, border security completely collapsed, so border mafias have been created to guard the borders and shoot anyone trying to cross. This way, border security will stay intact."
 border_mafias_in_action_2:0 "Border Mafias in Action"
 border_mafias_in_action_2_desc:0 "With the mafia takeover, border security completely collapsed, so border mafias have been created to guard the borders and shoot anyone trying to cross. This way, border security will stay intact."
 conducted_border_mines:0 "Mined Borders"
 conducted_border_mines_desc:0 "Through the mafias, we have mined the borders. No one will be able to cross, and our country will be unaffected by activity along the border."
 pretty_isolated_state:0 "A Fully Isolated State"
 pretty_isolated_state_desc:0 "With all our borders closed, the country interacts with no one. This isolation cuts us off, but it also gives us absolute power."
 fund_hezbollah:0 "Funded Hezbollah"
 fund_hezbollah_desc:0 "Hezbollah must be supported in every way. As it grows stronger, the PKK will weaken, and that will bring our country great relief."
 assistance_from_ulkists:0 "Assistance From the Ülkücüs"
 assistance_from_ulkists_desc:0 "We have secured the Ülkücüs' support to destroy the PKK. The PKK must be destroyed and eliminated on every front."
 counter_pkk_arming:0 "Anti-PKK Militarization"
 counter_pkk_arming_desc:0 "We call on our people to join the army against the PKK. We will put an end to this terror and turn the east into a land of peace. Long live the Turkish Armed Forces!"
 legalized_world_drug_trade:0 "The Legalized Drug Trade"
 legalized_world_drug_trade_desc:0 "The drug trade is a godsend for our mafia state. Its profits can reach trillions, making us the richest and most powerful in every industry. That is why we are launching the drug trade and backing it with secured convoys. Come on, it's time to make money!"
 legalized_world_drug_trade_convoys:0 "The Specialized Drug Trade"
 legalized_world_drug_trade_convoys_desc:0 "The drug trade is a godsend for our mafia state. Its profits can reach trillions, making us the richest and most powerful in every industry. That is why we are launching the drug trade and backing it with secured convoys. Come on, it's time to make money!"
 legalized_world_drug_trade_specialized:0 "The Highly Specialized Drug Trade"
 legalized_world_drug_trade_specialized_desc:0 "The drug trade is a godsend for our mafia state. Its profits can reach trillions, making us the richest and most powerful in every industry. That is why we are launching the drug trade and backing it with secured convoys. Come on, it's time to make money!"
 legalized_world_drug_trade_specialized_max:0 "Worldwide Drug Trade"
 legalized_world_drug_trade_specialized_max_desc:0 "The drug trade is a godsend for our mafia state. Its profits can reach trillions, making us the richest and most powerful in every industry. That is why we are launching the drug trade and backing it with secured convoys. Come on, it's time to make money!"
 turkish_interventionary_group:0 "The Turkish Intervention Group"
 turkish_interventionary_group_desc:0 "The Turkish Intervention Group exists to support and arm, financially and morally, the mafia elements in the region."
 local_american_communists_help:0 "Help From Local American Communists"
 local_american_communists_help_desc:0 "We are seeking support from native-born American communists, whose help could strengthen us in the war against the United States."
 south_american_help:0 "Intelligence From the South American Cartels"
 south_american_help_desc:0 "Drawing on the knowledge of the South American cartels operating in America, we will fight America and defeat it. Wait for it; victory is coming!"
 poison_modified_cigarettes:0 "Poisoned Americans"
 poison_modified_cigarettes_desc:0 "We have poisoned Americans by lacing their cigarettes, so we will conquer them in no time. With no strength left to resist, America will surely surrender soon."
 weakened_pentagon:0 "The Sabotaged Pentagon"
 weakened_pentagon_desc:0 "We have poisoned the European armies, so we will conquer Europe in no time. With no strength left to resist, Europe will surely surrender soon."
 pakistani_help:0 "Intelligence From the Pakistani Gangs"
 pakistani_help_desc:0 "Drawing on the knowledge of the Pakistani gangs operating in Europe, we will fight Europe and defeat it. Wait for it; victory is coming!"
 poisoned_europeans:0 "Poisoned European Forces"
 poisoned_europeans_desc:0 "We have poisoned the European armies, so we will conquer Europe in no time. With no strength left to resist, Europe will surely surrender soon."
 chemical_weapons_on_europeans:0 "Chemical Weapons Against the Europeans"
 chemical_weapons_on_europeans_desc:0 "We will use chemical weapons on the Europeans, turning European public opinion against the war, and take advantage of it to conquer Europe with ease."
 local_muslims_help:0 "Help From Local Muslims"
 local_muslims_help_desc:0 "We are seeking support from Europe's Muslims, whose help could strengthen us in the war against Europe."
 poisoned_russians:0 "Poisoned Russian Forces"
 poisoned_russians_desc:0 "We have poisoned the Russian armies, so we will conquer Russia in no time. With no strength left to resist, Russia will surely surrender soon."
 industrial_powerhouse:0 "The Mafia Industrial Powerhouse"
 industrial_powerhouse_desc:0 "The mafia industries have gathered momentum and grown strong, proof that this country is now an industrial power. Long live the new system! Long live Turkey's industrial age!"
 mafia_capitol:0 "Funded Mafia Capital"
 mafia_capitol_desc:0 "It is vital for our country that mafia capital is found and turns a good profit. The more confidence mafia capitalists have in supply and demand, the more profit they make."
 increased_mafia_capitol:0 "Reliable Mafia Capital"
 increased_mafia_capitol_desc:0 "It is vital for our country that mafia capital is found and turns a good profit. The more confidence mafia capitalists have in supply and demand, the more profit they make."
 mafia_marketplaces:0 "Special Mafia Marketplaces"
 mafia_marketplaces_desc:0 "By setting up special marketplaces for the mafias, we will bring a degree of order to the economy and prevent economic bottlenecks."
 mafia_trade_union:0 "The Mafia Trade Union"
 mafia_trade_union_desc:0 "With the creation of the mafia trade association, national and international trade between mafias will become easier and economic returns will grow. More economic activity is good for all of us."
 mafia_gold:0 "Mafia Gold"
 mafia_gold_desc:0 "Mafia gold means a great deal to us. A mafia gold surplus shows how strong our economy is. We must increase our mafias' gold earnings."
 mafia_gold_2:0 "Mafia Gold Mines"
 mafia_gold_2_desc:0 "Mafia gold means a great deal to us. A mafia gold surplus shows how strong our economy is. We must increase our mafias' gold earnings."
 mafia_gold_3:0 "The State of Mafia Gold"
 mafia_gold_3_desc:0 "Mafia gold means a great deal to us. A mafia gold surplus shows how strong our economy is. We must increase our mafias' gold earnings."
 new_taxation_system:0 "A New Taxation System"
 new_taxation_system_desc:0 "We are scrapping the old tax system and introducing a new one, which will let us collect more money from the public."
 taxing_immigrants:0 "Taxing Immigrants"
 taxing_immigrants_desc:0 "Special taxes will be levied on refugees, which has pleased our people, since refugees used to pay no taxes."
 expanded_KDV:0 "Expanded VAT (KDV)"
 expanded_KDV_desc:0 "Raising VAT will earn the state more money, and when the state earns money, our mafias automatically benefit and grow stronger."
 general_tax:0 "Heavy Taxes on Society"
 general_tax_desc:0 "By imposing heavy taxes on our people, we will boost state revenue and force a new balance. The mafias' returns must keep growing."
 supply_trade:0 "The Supply Trade"
 supply_trade_desc:0 "We must expand the trade in supplies. As is well known, developing trade drives the state's economic development."
 military_trade:0 "The Military Trade"
 military_trade_desc:0 "We must expand the trade in military vehicles. Developing the arms trade is a big step toward financing and strengthening our army."
 land_of_criminality:0 "The Criminal Trade"
 land_of_criminality_desc:0 "Trading plain, legal goods is pointless; it makes very little money. Trading in illegal goods matters far more to us, because it makes much more."
 powerized_industry:0 "Empowered Industry"
 powerized_industry_desc:0 "We are working to empower our industry, because a country with weak industry will never develop and will just mark time."
 true_civilian_power:0 "True Civilian Power"
 true_civilian_power_desc:0 "Civilian factories must be built; they matter more than military ones. Military factories generally bring short-term returns, while civilian factories bring better, long-term returns."
 mafiatic_drain:0 "The Mafia Crisis"
 mafiatic_drain_desc:0 "The mafia crisis arose because, after the mafias seized power, no functioning bureaucracy was left. Countries without a bureaucracy are weak and cannot develop politically." 
 mafias_level_1:0 "Turkish Mafias"
 mafias_level_1_desc:0 "Turkey has a number of mafia groups, and they have wielded great influence over Turkish politics."
 mafias_level_2:0 "Cooperation With the Turkish Mafia"
 mafias_level_2_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_3:0 "Cooperation With the Turkish Mafia"
 mafias_level_3_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_4:0 "Cooperation With the Turkish Mafia"
 mafias_level_4_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_5:0 "Cooperation With the Turkish Mafia"
 mafias_level_5_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_6:0 "Cooperation With the Turkish Mafia"
 mafias_level_6_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_7:0 "Cooperation With the Turkish Mafia"
 mafias_level_7_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_8:0 "Cooperation With the Turkish Mafia"
 mafias_level_8_desc:0 "Our cooperation with the Turkish mafia is sustainable. Together, we will bring peace to our country by uprooting the PKK and the communist organizations."
 mafias_level_2_D:0 "War With the Turkish Mafia"
 mafias_level_2_D_desc:0 "Our law enforcement officers are at war with the mafia. Soon we will put an end to the mafias in our country and bring peace and stability."
 mafias_level_3_D:0 "War With the Turkish Mafia"
 mafias_level_3_D_desc:0 "Our law enforcement officers are at war with the mafia. Soon we will put an end to the mafias in our country and bring peace and stability."
 mafias_level_4_D:0 "War With the Turkish Mafia"
 mafias_level_4_D_desc:0 "Our law enforcement officers are at war with the mafia. Soon we will put an end to the mafias in our country and bring peace and stability."
 institutionalism:0 "Institutionalism"
 institutionalism_desc:0 "Institutionalism (also called neo-institutionalist theory) is an approach to the study of institutions that focuses on how formal and informal rules constrain and enable the behavior of individuals and groups." 
 vision_of_european_union:0 "Winds of the European Union"
 vision_of_european_union_desc:0 "The winds of the European Union are sweeping through our country, bringing joy to our people. We are now very close to joining the EU, and to making prosperity work for us! The European dream is coming true!" 
 european_constitution_desc:0 "We have drafted a constitution shaped by Western influence. This Westernized constitution will help us align with the European Union and the West." 
 european_border_protection:0 "Eurozone Border Protection"
 european_border_protection_desc:0 "We must protect the regions and borders of the European Union. By massing our soldiers on the borders, we will not let refugees through. Long live the European space!" 
 adopted_european_laws:0 "Adopted European Laws"
 adopted_european_laws_desc:0 "We have fully implemented European laws in our country, bringing it significant legal progress." 
 international_peace_forces:0 "International Peace Forces"
 international_peace_forces_desc:0 "International peacekeeping forces exist to keep peace in the world through armed representative contingents. They are founded in the spirit of our leader Atatürk's words: "Peace at home, peace in the world."" 
 european_studies:0 "European Studies"
 european_studies_desc:0 "Through an education system modeled on the European Union's, we will raise our country's education and awareness to an advanced level. This educational reform will benefit our country in every way." 
 full_accordance_with_UN:0 "Signatory to the UN Peace Proposal"
 full_accordance_with_UN_desc:0 "By signing the United Nations peace proposals as a country, we will gain public backing against war and win international opinion over to our side." 
 full_accordance_with_AIHM:0 "Directly Bound to the ECHR"
 full_accordance_with_AIHM_desc:0 "We are now placing our courts and our law fully under the oversight of the ECHR. This will reduce lawlessness and political favoritism to a significant degree." 
 anti_inflation_program:0 "The Anti-Inflation Program"
 anti_inflation_program_desc:0 "We are announcing an anti-inflation program that will push prices down. Inflation will fall and our prosperity will rise!" 
 powerful_g20_member:0 "A Powerful G20 Member"
 powerful_g20_member_desc:0 "We are one of the strongest countries in the G20 and are using this position on the international stage to secure our political power." 
 international_help_program:0 "International Aid Program Contributor"
 international_help_program_desc:0 "We have become a country that supports international aid programs. By supporting them, we will make sure Turkey's voice is heard more." 
 toki_working_faster:0 "TOKİ Construction"
 toki_working_faster_desc:0 "TOKİ, the Housing Development Administration, is Turkey's government-backed housing agency. Founded in 1984, it carries out projects and activities mainly across Turkey in line with the government's construction and mass housing priorities." 
 reliable_president:0 "A Reliable President"
 reliable_president_desc:0 "We have a credible president. This reliability gives us commitment and strength. What people would not want a credible government?" 
 mit_empowered:0 "Milli İstihbarat Teşkilatı"
 mit_empowered_desc:0 "MİT is responsible for gathering intelligence on existing and potential internal and external threats to the territory, people, integrity, existence, independence and security of the Republic of Turkey, and to every element of its constitutional order and national power. It passes this intelligence on to the President, the Chief of the General Staff, the Secretary General of the National Security Council and other relevant state bodies as needed." 
 euro_defence:0 "A Formalized Euro Defense"
 euro_defence_desc:0 "We have established the euro protection zone. Thanks to it, we will no longer be economically driven by America; the European economy will stay independent and unaffected whatever America goes through." 
 fulfilled_order:0 "The Liberal Order Fulfilled"
 fulfilled_order_desc:0 "A new liberal order has been established, bringing the prestige and permanence of the Westernized system. The stability of the liberal revolution will not stop!" 
 echological_laws:0 "Ecological Laws"
 echological_laws_desc:0 "Through our new ecological framework and laws, we will protect our nature and our stability. These laws sharply increase prison sentences for acts that harm the environment." 
 factory_filter_law:0 "Factory Filter Law"
 factory_filter_law_desc:0 "The factory emissions law aims to limit the carbon dioxide produced by factories. With this limit, the health and well-being of our people and our workers will improve." 
 industrialization_law:0 "Industrialization Law"
 industrialization_law_desc:0 "By passing an industrialization law, we will ensure that our industry develops according to plan. Planned industries generally do not harm the environment." 
 high_quality_engines:0 "High-Quality Engines"
 high_quality_engines_desc:0 "By boosting innovation in the engine industry, we will make our engines faster, which will help us develop both in arms and in civilian use." 
 liberal_war_economy:0 "The Liberal War Economy"
 liberal_war_economy_desc:0 "We will run our war economy along liberal lines. This will make our economy ready for war while still attracting investment during wartime, so it will not suffer for some time if a major war breaks out." 
 liberal_studies:0 "Liberal Studies"
 liberal_studies_desc:0 "A liberal, harmonious youth is taking shape, through whom innovation and progress will become systematic and orderly." 
 KDK_strenghened:0 "The Ombudsman Institution (KDK)"
 KDK_strenghened_desc:0 "A Turkish institution that examines and investigates complaints and makes recommendations on whether the government's actions comply with the law and with fairness, respecting human rights. It is independent of the government and answers to Parliament alone. It considers complaints from both individuals and legal entities, and foreign nationals may also apply." 
 stopped_changing_of_the_liberalism:0 "Protected Liberalism"
 stopped_changing_of_the_liberalism_desc:0 "We will not allow liberalism to change with the shifting political climate. Liberalism will always follow the same line and never stray; if it does, absolute instability will follow." 
 democratic_pressure:0 "Western Pressure"
 democratic_pressure_desc:0 "Western pressure on this country has allowed liberalism to regain strength. This pressure is very damaging to our political power and our nationalism." 
 liberal_islamic_state:0 "Liberal Islamic State"
 liberal_islamic_state_desc:0 "By blending liberalism with Islamism, we have created a new kind of order that holds both faith and liberalism. Thanks to it, we will no longer suffer economic and social hardship." 
 specialized_arms_industry:0 "The Specialized Arms Industry"
 specialized_arms_industry_desc:0 "Partial privatization of the defense industry will greatly support our country's military expansion. Under a liberal government, the larger role of liberalism, even within the military, boosts our overall gains." 
 tradesman_support_package:0 "The Shopkeepers Support Package"
 tradesman_support_package_desc:0 "The shopkeepers support package aims to strengthen small traders so that domestic competition, so vital to economic development, remains healthy." 
 liberal_brain:0 "The Liberal Brain"
 liberal_brain_desc:0 "Under the Liberal Brain strategy, liberalism gives markets enormous support, pushing people to compete through globalized innovation." 
 holy_european_imperialism:0 "Holy European Imperialism"
 holy_european_imperialism_desc:0 "" 
 central_bank_reselves_law:0 "The Central Bank Reserves Law"
 central_bank_reselves_law_desc:0 "With the Central Bank reserves law, reserves will be monitored and supervised, and the public will be informed of any rise or fall in them." 
 multi_party_state:0 "Guaranteed Multi-Party State"
 multi_party_state_desc:0 "Our reforms have cemented and protected the multi-party system. When a single ideology dominates a country, it leaves the country poorer for it." 
 protected_elites:0 "Protected Elites"
 protected_elites_desc:0 "The elites must back the establishment of the Ottoman government. The support of the upper class is worth far more than the meager support of the lower class. Offering the elites protection to win their support seems one of the right moves we can make now." 
 funded_elites:0 "Funded Elites"
 funded_elites_desc:0 "The elites must back the establishment of the Ottoman government. The support of the upper class is worth far more than the meager support of the lower class. Giving the elites money to win their support seems one of the right moves we can make now." 
 systematic_elite_boost:0 "Systematically Protected Elites"
 systematic_elite_boost_desc:0 "The elites must back the establishment of the Ottoman government. The support of the upper class is worth far more than the meager support of the lower class. Through systematic protection and profit, we will make the elites' support permanent." 
 cooperation_with_islamists:0 "Cooperative Islamists"
 cooperation_with_islamists_desc:0 "Some Islamists are cool toward cooperation. To win them over, we are running a propaganda campaign; we need them on our side." 
 allied_with_jihadists:0 "Alliance With the Jihadists"
 allied_with_jihadists_desc:0 "We have allied with the jihadists, the main force that will protect our country from non-Muslim elements. We must stand behind them with honor." 
 replaced_mayors:0 "Replaced Mayors"
 replaced_mayors_desc:0 "Since we control the levels of government, mayors are being replaced as we see fit. This will give us mayors loyal to us across the country, who will support our Ottoman movement." 
 replaced_mayors_allied:0 "Allied Mayors"
 replaced_mayors_allied_desc:0 "The mayors all look on us favorably, proof that we are an invisible power. Soon we will go from invisible power to full power!" 
 no_interest_rate_policy:0 "Zero Interest Rate Policy"
 no_interest_rate_policy_desc:0 "Since interest is forbidden in Islam, rates have been cut to zero. Zero interest has weighed heavily on our economy while making it easier to buy a home." 
 saviour_crescent:0 "The Saving Crescent"
 saviour_crescent_desc:0 "The crescent, symbol of Islam, is the source of our army's and our people's morale. With this morale and support, we will make many conquests for the sake of Islam." 
 islamic_cooperationism:0 "Islamic Cooperationism"
 islamic_cooperationism_desc:0 "We must strengthen our nation by cooperating with the supporters of Islam, who should enjoy the backing of the state, the Islamic state." 
 ibda_c_cooperationism:0 "Cooperation With IBDA-C"
 ibda_c_cooperationism_desc:0 "We have signed a cooperation agreement with IBDA-C, a radical Islamist organization, which is bringing us some military and social benefits." 
 ibda_c_cooperationism_2:0 "Alliance With IBDA-C"
 ibda_c_cooperationism_2_desc:0 "We have signed an alliance with IBDA-C, a radical Islamist organization, which is bringing us some military and social benefits."
 ibda_c_cooperationism_3:0 "Alliance With IBDA-C"
 ibda_c_cooperationism_3_desc:0 "We have signed an alliance with IBDA-C, a radical Islamist organization, which is bringing us some military and social benefits."  
 hezbollah_cooperationism:0 "Cooperation With Hezbollah"
 hezbollah_cooperationism_desc:0 "We have signed a cooperation agreement with Hezbollah, known as an offshoot of Iran, which is bringing us some military and social benefits." 
 hezbollah_cooperationism_2:0 "Alliance With Hezbollah"
 hezbollah_cooperationism_2_desc:0 "We have signed an alliance with Hezbollah, known as an offshoot of Iran, which is bringing us some military and social benefits." 
 communistic_organizations_crushed:0 "The Anti-Communist Doctrine"
 communistic_organizations_crushed_desc:0 "The banner of Islam, not that of the communists, now flies over our country. We are therefore adopting an anti-communist doctrine, which will help save us from drifting away from religion." 
 communistic_organizations_crushed_2:0 "The Anti-Communist Doctrine"
 communistic_organizations_crushed_2_desc:0 "The banner of Islam, not that of the communists, now flies over our country. We are therefore adopting an anti-communist doctrine, which will help save us from drifting away from religion." 
 repair_the_state:0 "Repairing the State..."
 repair_the_state_desc:0 "Our country suffered heavy losses in the war; cities burned to the ground and the sound of bombs echoed everywhere. But the war is over. Now we are rebuilding the country and ending support for the war industries. It is time for prosperity!" 
 repair_the_mobilization:0 "Repairing the Effects of Mobilization"
 repair_the_mobilization_desc:0 "Mobilization dealt a heavy blow to normal population growth, and the population has begun to decline. Now that mobilization is over, it is time to restore our people."
 dusts_of_the_kemalist_guardians:0 "Remnants of the Kemalist Guardians"
 dusts_of_the_kemalist_guardians_desc:0 "After the civil war, the guns have fallen silent. Most of the troops that followed in Mustafa Kemal's footsteps were destroyed by our Islamic armies, but the influence of the Kemalist armies is still felt, because the army's customs are rigid and formulaic. We will sweep away these absurd traditions through reform."
 dusts_of_the_kemalist_guardians_2:0 "Remnants of the Kemalist Guardians"
 dusts_of_the_kemalist_guardians_2_desc:0 "After the civil war, the guns have fallen silent. Most of the troops that followed in Mustafa Kemal's footsteps were destroyed by our Islamic armies, but the influence of the Kemalist armies is still felt, because the army's customs are rigid and formulaic. We will sweep away these absurd traditions through reform."
 dusts_of_the_kemalist_guardians_3:0 "Remnants of the Kemalist Guardians"
 dusts_of_the_kemalist_guardians_3_desc:0 "After the civil war, the guns have fallen silent. Most of the troops that followed in Mustafa Kemal's footsteps were destroyed by our Islamic armies, but the influence of the Kemalist armies is still felt, because the army's customs are rigid and formulaic. We will sweep away these absurd traditions through reform."
 dusts_of_the_kemalist_guardians_4:0 "Remnants of the Kemalist Guardians"
 dusts_of_the_kemalist_guardians_4_desc:0 "After the civil war, the guns have fallen silent. Most of the troops that followed in Mustafa Kemal's footsteps were destroyed by our Islamic armies, but the influence of the Kemalist armies is still felt, because the army's customs are rigid and formulaic. We will sweep away these absurd traditions through reform."
 islamic_army_traditions:0 "Islamic Army Traditions"
 islamic_army_traditions_desc:0 "We have rebuilt the army's decaying traditions. Our army once again has the Islamic traditions of old, which give it an extraordinarily powerful sense of unity."
 replaced_kemalist_institutions:0 "Replaced Kemalist Institutions"
 replaced_kemalist_institutions_desc:0 "We have promptly shut down the Kemalist institutions that once served our country and replaced them with Islamist ones, so the transition will cause no institutional gap."
 no_economical_freedom:0 "Controlled Economic Freedom"
 no_economical_freedom_desc:0 "Economic freedoms have done nothing but harm the economy, so we are taking control of it by banning financial and economic freedoms in our country."
 fez_traditions:0 "Fez Traditions"
 fez_traditions_desc:0 "With the return of the Ottoman Empire and the rejection of the old bans, the forbidden fez tradition has flourished once more. Our people can wear what they want on their heads!"
 ottoman_language_partially:0 "A Language Influenced by Ottoman Turkish"
 ottoman_language_partially_desc:0 "We have brought back much of the old Arabic-influenced language in place of the old secular, purified one. But Latin letters still remain in our alphabet, because changing it completely could do the country great harm."
 destroy_the_statues:0 "The Destroyed Statue Industry"
 destroy_the_statues_desc:0 "Now that we are rid of the powers that kept erecting statues everywhere, we can tear down all our sculptures. Death to idolatry forever!"
 secondary_jihadists_state:0 "A Second Islamic State"
 secondary_jihadists_state_desc:0 "The first radical Islamic state was destroyed; this is the second. Unlike the first, it will never be destroyed, and it will spread and strengthen Islam through many conquests!"
 global_jihadists:0 "Global Jihadists"
 global_jihadists_desc:0 "Jihadists from around the world are being called to our country. With them, we will be able to make conquests easily without straining our own workforce. Strength comes from unity!"
 prepared_for_the_sanctions:0 "Ready for Sanctions"
 prepared_for_the_sanctions_desc:0 "Heavy sanctions are coming. We must be prepared, because these will be unlike any ordinary sanctions."
 unpausable_war_condititions:0 "Unstoppable War Preparations"
 unpausable_war_condititions_desc:0 "We are preparing for a war that will last for years and never end, a war that will decide the fate and standing of the whole country."
 full_mobilization:0 "Full Mobilization"
 full_mobilization_desc:0 "We call on our country to mobilize fully. The homeland needs you!" 
 no_turning_back:0 "There Is No Turning Back..."
 no_turning_back_desc:0 "We are entering a war that will never end. There is no turning back; we have burned every bridge behind us."
 desert_warfare:0 "Desert Forces"
 desert_warfare_desc:0 "Desert armies exist to speed up the advance in Africa and other hot regions, where advancing with a regular army is unthinkable."
 camel_warfare:0 "Camel Warfare"
 camel_warfare_desc:0 "Desert armies mounted on camels exist to speed up the advance in Africa and other hot regions, where advancing with a regular army is unthinkable. That is why camels matter so much in such battles."
 camel_blitzkrieg:0 "Camel Blitzkrieg"
 camel_blitzkrieg_desc:0 "Desert armies mounted on camels exist to speed up the advance in Africa and other hot regions, where advancing with a regular army is unthinkable. That is why camels matter so much in such a war; camels can even encircle enemy troops."
 anti_usa_arms:0 "Forces Against the US Military"
 anti_usa_arms_desc:0 "We have built a military doctrine designed to counter the American military model. With it, we will easily defeat the imperialist forces of America."
 hard_breakthorugh_strategies:0 "Hard Tank Breakthrough Strategies"
 hard_breakthorugh_strategies_desc:0 "By adopting heavy-tank breakthrough tactics, we will smash the fronts of hostile nations and break their power."
 embraced_hardcore_revenge_policies:0 "Embracing Revenge"
 embraced_hardcore_revenge_policies_desc:0 "By instilling a thirst for revenge in our people, we will make our country strong, for revenge is the surest way to bring victory."
 throwable_man_to_the_front:0 "An Efficient Supply System for Mass Armies"
 throwable_man_to_the_front_desc:0 "With a new system, we will keep our large armies from running short of food and ammunition, so they never face supply problems."
 stuck_the_conflict:0 "Hold and Don't Yield an Inch!"
 stuck_the_conflict_desc:0 "We will suspend all offensive operations, pursue a defensive policy and not yield an inch. Our borders with our enemies will not change, and they will eventually give up the fight."
 umayyad_navy_production:0 "The Glorious Umayyad-Style Naval Development Plan"
 umayyad_navy_production_desc:0 ""
 stabilizing_the_great_state:0 "Stabilizing the Great State"
 stabilizing_the_great_state_desc:0 "The war has badly shaken our country's endurance and stability. To overcome the shock, we are restoring peace through a stabilization program."
 recovering_from_the_great_islamic_war:0 "Recovering From the Great War of Religion"
 recovering_from_the_great_islamic_war_desc:0 "We have triumphed in our war for religion, but hardly a house is left standing in our country. Now we must secure social welfare and strengthen the national economy, and we are drawing up recovery policies to that end."
 trying_to_overcome_heavy_casualties:0 "Overcoming Heavy Wartime Casualties"
 trying_to_overcome_heavy_casualties_desc:0 "The war has drastically reduced our population and decimated the workforce. We must recover, and a long-term program looks like the way to get things back on track."
 rocketing_the_GDP:0 "Rocketing GDP"
 rocketing_the_GDP_desc:0 "With GDP low in our country, we are launching plans to raise it. With these well-organized plans, we will increase GDP fivefold in the long run."
 reliable_islamic_movement:0 "Reliable Islamic Movement"
 reliable_islamic_movement_desc:0 "Islam is a religion of trust. An Islamic country without trust would be incompatible with Islam. To prevent that, we will use Islam in our country as a source of trust."
 ottoman_neutralism:0 "Ottoman Neutrality"
 ottoman_neutralism_desc:0 "For the survival of the Ottoman Empire, we are adopting a policy of neutrality. It will keep us out of wars for now, and we will enter them when the time comes."
 returning_to_ottoman_values:0 "Traditional Ottoman Communities"
 returning_to_ottoman_values_desc:0 "By drawing on the traditional communities of the Ottoman Empire, we will win votes, and with those votes, power and popularity."
 returning_to_ottoman_values_2:0 "Traditional Ottoman Communities"
 returning_to_ottoman_values_2_desc:0 "By drawing on the traditional communities of the Ottoman Empire, we will win votes, and with those votes, power and popularity." 
 returning_to_ottoman_values_3:0 "Traditional Ottoman Communities"
 returning_to_ottoman_values_3_desc:0 "By drawing on the traditional communities of the Ottoman Empire, we will win votes, and with those votes, power and popularity."
 parliament_stays_in_course:0 "Parliament Stays in Session"
 parliament_stays_in_course_desc:0 "Parliament will continue to function with the monarchy's permission. It is important to preserve democratic elements within the monarchy."
 parliament_stays_in_semi_course:0 "A Half-Active Parliament Stays in Session"
 parliament_stays_in_semi_course_desc:0 "Parliament will continue to function under the monarchy's partial control. It is important to preserve some democratic elements within the monarchy."
 parliament_abolished:0 "Parliament Abolished"
 parliament_abolished_desc:0 "Parliament has been dissolved by the monarchy's absolute authority. With the monarchy absolute, we can govern fully without making room for needless things like democracy."
 fast_decision_staff:0 "Fast Decision Staff"
 fast_decision_staff_desc:0 "With Parliament closed and the democratic brakes removed, we have set up a rapid decision-making mechanism. It will let us act with great strength and launch surprise attacks."
 ottoman_constitution:0 "Ottoman Constitution"
 ottoman_constitution_desc:0 "We have completed the Ottoman Empire's constitution and put it into force. With it, we will be a state far removed from secularism and will easily secure our country's political unity and power."
 islamization_of_kurds:0 "The Islamization of the Kurds"
 islamization_of_kurds_desc:0 "By Islamizing the Kurds, we will keep them from turning to terrorism. It is one of the best moves we can make to reduce terror."
 modern_museums:0 "Modern Museums"
 modern_museums_desc:0 "By building modern museums, we will spread modern culture throughout the Ottoman Empire. Culture brings knowledge and modernity to people's minds."
 tubitak_reformed:0 "A Reformed TÜBİTAK"
 tubitak_reformed_desc:0 "By reforming TÜBİTAK, we have made it serve the public interest again, as it once did. We will never again fall behind in science."
 rasathaneler_s:0 "Observatories"
 rasathaneler_s_desc:0 "An observatory is a facility used to observe terrestrial, marine or celestial events. Astronomy, climatology and meteorology, geophysics, oceanography and volcanology are among the disciplines for which observatories have been built."
 science_supervision_institutions:0 "The Ottoman Science Supervision Institution"
 science_supervision_institutions_desc:0 "By founding an Ottoman scientific oversight institution, we will prevent scientific theft in our country, putting an end to cases such as patent theft."
 fez_traditions_enforced:0 "The Fez Tradition Enforced"
 fez_traditions_enforced_desc:0 "By making the fez compulsory, we will ensure that the tradition never disappears and lives on forever."
 modern_and_cultural_museums:0 "Modern and Cultural Museums"
 modern_and_cultural_museums_desc:0 ""
 hilali_ahmer_cemiyeti:0 "The Ottoman Red Crescent Society (Hilal-i Ahmer)"
 hilali_ahmer_cemiyeti_desc:0 "We will make a few small changes to the Red Crescent so that it properly serves the public again. Its public benefit will be as high as in the past."
 mehter_group:0 "The Reorganized Army Mehter Band"
 mehter_group_desc:0 "By directing the army's Mehter band, we will have it compose nationalist anthems once more, creating an atmosphere of unity and high morale in the army."
 unitary_state_principles:0 "Unitary State Principles"
 german_assistance:0 "German Assistance"
 german_assistance_desc:0 "We will stand behind Germany as its ally, as in the First World War. But this time we will stand with Germany to avenge the disasters of the past."
 turkish_war_machine:0 "The Turkish War Machine"
 turkish_war_machine_desc:0 "The Ottoman Empire has become a Turkish war machine. Our country can produce whatever weapon it needs in a very short time." 
 long_term_invasion_planning:0 "Long-Term Invasion Planning"
 long_term_invasion_planning_desc:0 "We will go to war on the basis of long-term plans and calculations, and we will emerge victorious in the end. Throughout history, careful planning has always beaten improvisation."
 controlled_population_movements:0 "Controlled Population Movements"
 controlled_population_movements_desc:0 "Our country is large, so migration and population movements within it must be controlled. Left unchecked, they would cause countless problems."
 ottoman_mountainner_division:0 "Ottoman Special Mountain Troops"
 ottoman_mountainner_division_desc:0 "The Ottoman Special Mountain Troops exist to provide a strong fighting force in mountains and other high-altitude terrain of every kind."
 ottoman_cavalary_and_mountainner_forces:0 "Ottoman Special Mountain Troops and Cavalry"
 ottoman_cavalary_and_mountainner_forces_desc:0 "The Ottoman Special Mountain Troops and Cavalry exist to provide a strong fighting force in high mountains and in hot regions such as deserts."
 ottoman_interventionism:0 "Ottoman Interventionism"
 ottoman_interventionism_desc:0 "By adopting Ottoman interventionism, we will make sure nothing happens in the region without our knowledge."
 building_ottoman_naval_forces:0 "Building Up the Imperial Black Sea Fleet"
 building_ottoman_naval_forces_desc:0 "We are rebuilding the Ottoman Black Sea fleet that was destroyed in the past. We will restore our old navy and take control of the Black Sea as before."
 funded_ottoman_naval_forces:0 "Building Up the Imperial Black Sea Fleet"
 funded_ottoman_naval_forces_desc:0 "We are rebuilding the Ottoman Black Sea fleet that was destroyed in the past. We will restore our old navy and take control of the Black Sea as before."
 med_navalshipments:0 "Mediterranean Naval Shipments"
 med_navalshipments_desc:0 "By expanding the Ottomans' current Mediterranean waters, we will strengthen our country's trade and shipping across the Mediterranean basin."
 industrialization_program_for_ottomans:0 "Ottoman Industrialization Program"
 industrialization_program_for_ottomans_desc:0 "It is time to industrialize our Ottoman Empire. As part of this, we will carry out many innovations and plans that will make us a strong state!"
 ottoman_lira:0 "The Ottoman Lira"
 ottoman_lira_desc:0 "Thanks to the Ottoman lira, introduced after the ineffectiveness and weakness of the Turkish lira, our people are now happy and feel stronger. We hope it will always stay this way."
 toki_cooperatives_ottoman:0 "Ottoman TOKİ"
 toki_cooperatives_ottoman_desc:0 "By Ottomanizing TOKİ, we will turn it back into a state organization that serves the public. Our reforms to the housing administration will benefit the country."
 supporting_foundation_culture:0 "The Ottoman Foundation Culture"
 supporting_foundation_culture_desc:0 "By restoring the Ottoman tradition of charitable foundations (vakıf) that was destroyed, we will use these foundations to develop our country rapidly."
 ottoman_lira_valuable:0 "Valuable Ottoman Lira"
 ottoman_lira_valuable_desc:0 "Thanks to the Ottoman lira, introduced after the ineffectiveness and weakness of the Turkish lira, our people are now happy and feel stronger, as our currency is far stronger than before. We hope it will always stay this way."
 powerized_gold:0 "Strengthened Gold"
 powerized_gold_desc:0 "Gold was the usual money of the Ottoman Empire. Strengthening it will surely make the public feel happy and secure."
 cizye_tax:0 "The Jizya Tax"
 cizye_tax_desc:0 "The jizya is an annual per capita tax historically levied on dhimmis, that is, permanent non-Muslim subjects of a state governed by Islamic law."
 ottoman_tourism:0 "Ottoman Tourism"
 ottoman_tourism_desc:0 "The Ottoman Empire should keep welcoming tourism as the Republic did before it. Blocking tourism would only hurt the Ottoman economy."
 ottoman_film_sector:0 "Ottoman Film Sector"
 ottoman_film_sector_desc:0 "By building an Ottoman film industry, we will market our series and films to the West, which will certainly bring in a lot of money."
 unemployment_money_reform:0 "Unemployment Benefit Reform"
 unemployment_money_reform_desc:0 "We had to push the unemployed into work by cutting their benefits by a certain amount." 
 systematic_unemployment_decrease:0 "Systematic Reduction of Unemployment"
 systematic_unemployment_decrease_desc:0 "Thanks to our unemployment reforms, unemployment is falling steadily, a most auspicious development for our country."
 islamic_war_industries:0 "Islamic War Industries"
 islamic_war_industries_desc:0 "By establishing Islamic war industries, we will raise our defense industry to a high level and easily meet the needs of our soldiers."
 islamic_war_industries_boosted:0 "Expanded Islamic War Industries"
 islamic_war_industries_boosted_desc:0 "By establishing Islamic war industries, we will raise our defense industry to a high level and easily meet the needs of our soldiers."
 vulnerable_factories:0 "Vulnerable Arms Factories"
 vulnerable_factories_desc:0 "By placing factories in unknown, hidden locations, we will keep them from being bombed in wartime, so our industry will be safe from damage and can keep growing during the war."
 budget_system_reorganized:0 "The Reorganized Budget System"
 budget_system_reorganized_desc:0 "How our country's wealth is spent must follow a plan and be supervised by institutions. Oversight and rules for public spending will give our people confidence in the government and drive our economic growth."
 reformed_gold:0 "Reformed Gold"
 reformed_gold_desc:0 "Gold is one of capitalism's playthings. Reforming it and keeping its value at a minimum will make our people feel happy and secure."
 anti_left_movement:0 "The Anti-Left Movement"
 anti_left_movement_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 votable_right:0 "An Electable Right"
 votable_right_desc:0 "We are quickly shedding the features that make the right unelectable. The right in our country must fully reflect our people."
 anti_left_movement_2:0 "The Anti-Left Movement"
 anti_left_movement_2_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 counter_guerillas:0 "The Counter-Guerrillas"
 counter_guerillas_desc:0 "The counter-guerrillas, an organization of American origin, are one of the main forces that will stop communism from spreading in our country."
 counter_guerillas_NATO_cooperated:0 "NATO-Backed Counter-Guerrillas"
 counter_guerillas_NATO_cooperated_desc:0 "The counter-guerrillas, an organization of American origin, are one of the main forces that will stop communism from spreading in our country."
 political_rehabilitation:0 "Political Rehabilitation"
 political_rehabilitation_desc:0 "The recent war has damaged our country politically. We must restructure and repair our politics so the damage does not become permanent, which is why we are rethinking our policies from the ground up."
 anti_left_movement_3:0 "The Anti-Left Movement"
 anti_left_movement_3_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_4:0 "The Anti-Left Movement"
 anti_left_movement_4_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_5:0 "The Anti-Left Movement"
 anti_left_movement_5_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_6:0 "The Anti-Left Movement"
 anti_left_movement_6_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_7:0 "The Anti-Left Movement"
 anti_left_movement_7_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_8:0 "The Anti-Left Movement"
 anti_left_movement_8_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_9:0 "The Anti-Left Movement"
 anti_left_movement_9_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 anti_left_movement_10:0 "The Anti-Left Movement"
 anti_left_movement_10_desc:0 "The legitimate aim of the anti-left movement is to break the dominance of leftist organizations in the country. In short, this right-wing movement works for the country's liberation."
 ulkist_paramilitaries:0 "Armed Ülkücü Paramilitaries"
 ulkist_paramilitaries_desc:0 "The nationalists are armed, so if our country is ever threatened with invasion, these forces will do their duty and keep the peace by driving out any enemy."
 islamic_cooperation_and_ulkism:0 "Ülkücü-Islamic Cooperation"
 islamic_cooperation_and_ulkism_desc:0 "Islam is part of the Ülkücü ideal, so Islamism should grow stronger and cooperate closely with the Ülkücü movement, all for the peace of our people."
 islamic_cooperation_and_ulkism_2:0 "Ülkücü-Islamic Cooperation"
 islamic_cooperation_and_ulkism_2_desc:0 "Islam is part of the Ülkücü ideal, so Islamism should grow stronger and cooperate closely with the Ülkücü movement, all for the peace of our people."
 islamic_cooperation_and_ulkism_3:0 "Ülkücü-Islamic Cooperation"
 islamic_cooperation_and_ulkism_3_desc:0 "Islam is part of the Ülkücü ideal, so Islamism should grow stronger and cooperate closely with the Ülkücü movement, all for the peace of our people."
 ulkist_neutrality:0 "Ülkücü Neutrality"
 ulkist_neutrality_desc:0 "By adopting the neutrality of Ülkücü ideology, we will keep harm from our country. Nations that beat the drums of war end in total collapse."
 kemalist_promotement:0 "Promoting Kemalism"
 kemalist_promotement_desc:0 "Kemalism has lost its power. We must make it useful again by pulling it out of the crisis that has hit it so hard."
 islamic_appeasement:0 "Appeasing the Islamists"
 islamic_appeasement_desc:0 "We must treat the Islamists in our country kindly. Mistreating them would undermine stability and power in the country."
 ulkist_democratic_constitution:0 "A Democracy-Influenced Constitution"
 ulkist_democratic_constitution_desc:0 "Since the Constitution should be founded on democracy, we will raise it to a good standard by building democratic elements into its main articles."
 local_anti_terroristic_forces:0 "Local Anti-Terrorism Forces Activated"
 local_anti_terroristic_forces_desc:0 "There must be local anti-terrorism organizations and forces. A local problem can easily grow into a problem for the whole country."
 controlling_the_society:0 "A Controlled Society"
 controlling_the_society_desc:0 "When a society starts to lose itself, intervention is necessary, and we will use our power to restore stability."
 blooded_eyes:0 "Blood of Revenge"
 blooded_eyes_desc:0 "We will take revenge on everyone who wronged us. With this thirst for revenge, we will master the power of success."
 counter_pentagon_intelligence:0 "Counter-Pentagon Intelligence"
 counter_pentagon_intelligence_desc:0 "The Pentagon is gathering information through digital networks in our country, and we have mobilized MİT to crack them. It is time to rid ourselves of the Pentagon's influence!"
 kemalist_nationalism_ulkist_model:0 "The Ülkücü-Kemalist Model of Nationalism"
 kemalist_nationalism_ulkist_model_desc:0 ""
 islamic_nationalism_ulkist_model:0 "The Ülkücü-Islamic Model of Nationalism"
 islamic_nationalism_ulkist_model_desc:0 ""
 diciplined_forces:0 "The Disciplined Kemalist Armed Forces"
 diciplined_forces_desc:0 "We have declared that Kemalism will remain in the army forever. The army's discipline must be maintained, with Kemalism at its side."
 well_known_Qur_an:0 "A Well-Understood Qur'an"
 well_known_Qur_an_desc:0 "Everyone in the country understands the Qur'an, so people do not fall under the sway of Islamists and merchants of religion. Thanks to this, innovation can flourish in our country."
 ataturk_culture:0 "Kemalist Culture"
 ataturk_culture_desc:0 "By cultivating Kemalist ideology, we have opened our people to innovation and science, lowering the cost of national development."
 banned_nihal_atsizs_books:0 "Nihal Atsız's Books Banned"
 banned_nihal_atsizs_books_desc:0 "Nihal Atsız's nationalism would damage our religious heritage and spirituality, so it is wise to restrict the books of this megalomaniac nationalist."
 islamic_science:0 "Islamic Science"
 islamic_science_desc:0 "Islamic science is vital to development. Islam has always been a source of resilience in adversity."
 islamic_army_traditions_1:0 "Islamic Military Traditions"
 islamic_army_traditions_1_desc:0 "Islam must live on in the army as a tradition. If the army abandons its Islamic traditions, it will collapse spiritually."
 islamic_army_traditions_2:0 "Islamic Military Traditions"
 islamic_army_traditions_2_desc:0 "Islam must live on in the army as a tradition. If the army abandons its Islamic traditions, it will collapse spiritually."
 islamic_army_traditions_3:0 "Islamic Military Traditions"
 islamic_army_traditions_3_desc:0 "Islam must live on in the army as a tradition. If the army abandons its Islamic traditions, it will collapse spiritually."
 land_fort_planting:0 "Experimental Land Fortifications"
 coastal_fort_planting:0 "Experimental Coastal Fortifications"
 efficent_nationalism:0 "Efficient Nationalism"
 efficent_nationalism_desc:0 "Nationalism should be useful, the kind that makes our country strong."
 golden_wolfs:0 "The Golden Age of the Wolves"
 golden_wolfs_desc:0 "This is the golden age of the wolves. After it, the wolves will grow by moving as one united pack."
 mu_island_theory:0 "The Mu Continent Theory"
 mu_island_theory_desc:0 "After the sinking of the continent of Mu, the Turks went through hard times but clung to life. This shows that the Turks have it in them to overcome any hardship."
 defensive_intelligence:0 "Defensive Intelligence"
 defensive_intelligence_desc:0 "We will not allow anyone to infiltrate and seize our country's data, which is why we will develop our national digital networks."
 counter_pentagon_intelligence_2:0 "Counter-Pentagon Intelligence"
 counter_pentagon_intelligence_2_desc:0 "The Pentagon is gathering information through digital networks in our country, and we have mobilized MİT to crack them. It is time to rid ourselves of the Pentagon's influence!"
 powerized_mit:0 "A Strengthened National Intelligence Organization (MİT)"
 powerized_mit_desc:0 "MİT is responsible for gathering intelligence on existing and potential internal and external threats to the territory, people, integrity, existence, independence and security of the Republic of Turkey, and to every element of its constitutional order and national power. It passes this intelligence on to the President, the Chief of the General Staff, the Secretary General of the National Security Council and other relevant state bodies as needed."
 counter_pentagon_intelligence_3:0 "Counter-Pentagon Intelligence"
 counter_pentagon_intelligence_3_desc:0 "The Pentagon is gathering information through digital networks in our country, and we have mobilized MİT to crack them. It is time to rid ourselves of the Pentagon's influence!"
 ai_computing:0 "AI Computing"
 ai_computing_desc:0 "Artificial intelligence (AI) is intelligence demonstrated by machines, as opposed to the natural intelligence of animals, including humans. AI research has been defined as the study of intelligent agents: any system that perceives its environment and takes actions that maximize its chances of achieving its goals."
 coding_offices:0 "Coding Offices"
 unified_artifical_intelligence:0 "The Realm of Artificial Intelligence"
 unified_artifical_intelligence_desc:0 "Artificial intelligence (AI) is intelligence demonstrated by machines, as opposed to the natural intelligence of animals, including humans. AI research has been defined as the study of intelligent agents: any system that perceives its environment and takes actions that maximize its chances of achieving its goals."
 independence_happiness:0 "Happiness Of Independence"
 independence_happiness_desc:0 "It is deeply gratifying that our country is independent, and thanks to this, stability will always be with us."
 independent_state_forever:0 "Independent Forever?"
 independent_state_forever_desc:0 "It is deeply gratifying that our country is independent. Our independence must last forever, but if we fail to develop, it will be lost. That is why we will keep developing steadily."
 turkish_massive_construction_program:0 "The Turkish Construction Program"
 turkish_massive_construction_program_desc:0 "Newcomers need new homes. We will invest in Turkish real estate developers so that buildings go up all over the country."
 unshakable_economy:0 "Unshakable Economy"
 unshakable_economy_desc:0 "With the dynamics we have just brought to our country, we will keep our economy from fragmenting and weakening so that we never fall into an economic crisis."
 tasted_the_crisis:0 "The Legacy of Crisis"
 tasted_the_crisis_desc:0 "The Republic of Turkey has seen and survived many crises, which shows that it will survive future ones too, and that our economy is durable rather than fragile."
 limited_tourism:0 "Limited Tourism"
 limited_tourism_desc:0 "By limiting tourism, we will keep agents of foreign powers out of our country, earning it trust and prestige."
 resistance_against_capitalism:0 "Resistance Against Capital"
 resistance_against_capitalism_desc:0 "By driving out capital and not letting capitalists exploit people, we will guarantee the security of our workers and employees."
 local_investors_action:0 "Supported Local Investors"
 local_investors_action_desc:0 "Local investors should invest at home and keep their money in the country. To make this possible, our state bureaucracy must support them, both financially and morally."
 local_investors_action_2:0 "Supported Local Investors"
 local_investors_action_2_desc:0 "Local investors should invest at home and keep their money in the country. To make this possible, our state bureaucracy must support them, both financially and morally."
 local_investors_action_3:0 "Supported Local Investors"
 local_investors_action_3_desc:0 "Local investors should invest at home and keep their money in the country. To make this possible, our state bureaucracy must support them, both financially and morally."
 dynamical_change_of_wages:0 "Dynamic Wage Adjustment"
 dynamical_change_of_wages_desc:0 "Through workable reforms that remove monetary imbalances between social classes, we will move closer to equalizing their incomes."
 bor_mining_facilities:0 "Boron Fields"
 bor_mining_facilities_desc:0 "Boron is a chemical element with the symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae rather than stellar nucleosynthesis, it is a low-abundance element in the Solar System and the Earth's crust, making up about 0.001 percent of the crust by weight. Boron is concentrated on Earth by the water solubility of its more common natural compounds, the borate minerals, which are mined industrially as evaporites such as borax and kernite. The largest known boron deposits are in Turkey, the world's largest producer of boron minerals."
 wolf_status_basic:0 "The Spirit of the Wolf"
 wolf_status_basic_desc:0 "The Wolf rules the country according to his own decisions and feelings, so his condition and state of mind matter greatly."
 wolf_status_alone:0 "The Spirit of the Wolf"
 wolf_status_alone_desc:0 "The Wolf rules the country according to his own decisions and feelings, so his condition and state of mind matter greatly."
 wolf_status_agressive:0 "The Spirit of the Wolf"
 wolf_status_agressive_desc:0 "The Wolf rules the country according to his own decisions and feelings, so his condition and state of mind matter greatly."
 ulkist_quarries:0 "Ülkü Ocakları of Innovation"
 ulkist_quarries_desc:0 "With the opening of Ülkü Ocakları, our scientific and technological development will accelerate and our country will reach an advanced level."
 ulkist_quarries_more_educative:0 "Ülkü Ocakları of Innovation"
 ulkist_quarries_more_educative_desc:0 "With the opening of Ülkü Ocakları, our scientific and technological development will accelerate and our country will reach an advanced level."
 ulkist_quarries_far_more_educative:0 "Ülkü Ocakları of Innovation"
 ulkist_quarries_far_more_educative_desc:0 "With the opening of Ülkü Ocakları, our scientific and technological development will accelerate and our country will reach an advanced level."
 banned_commies_books:0 "Communist Books Banned"
 banned_commies_books_desc:0 "Communist books confuse our people and turn them away from their nation. They must be banned and kept out of the country."
 scientific_community_under_one_roof:0 "A United Scientific Community"
 scientific_community_under_one_roof_desc:0 "Scientists should not work in isolation but together, because groups that cannot work together end in collapse."
 generation_of_nationalism:0 "A Generation of Nationalism and Science"
 generation_of_nationalism_desc:0 "We have raised a new generation steeped in both nationalism and science, exactly what Turkey's development requires."
 document_protectionism:0 "Protecting Scientific Documents"
 document_protectionism_desc:0 "We will prevent the theft of our academics' and scientists' documents and projects, because if their work is stolen, our country will produce no new scientists or academics."
 ulkist_technology_centre:0 "The Ülkücü Technology Center"
 ulkist_technology_centre_desc:0 "We have opened the Ülkücü technology center. We built this science center against all odds, and thanks to it our country will reach an advanced level."
 the_population_project:0 "The 100 Million Population Project"
 the_population_project_desc:0 "Turkey has launched a program to raise its population to 100 million, because a larger workforce always brings strength."
 the_population_projection_of_economics:0 "Balancing the GDP-Population Index"
 the_population_projection_of_economics_desc:0 "A growing population normally drags GDP per head down. To prevent this, we will launch a program of new construction projects to keep GDP from falling."
 peace_in_the_borders:0 "Peace on the Borders"
 peace_in_the_borders_desc:0 "There must be peace on our borders; otherwise, terribly painful things could happen to us. That is why we are securing peace at the border and have become a global country by welcoming foreigners of every kind."
 turkish_housing:0 "Housing for the Population"
 turkish_housing_desc:0 "With the population growing, new homes must be built. They will develop our housing sector and indirectly expand our workforce."
 principalist_party:0 "The Principled MHP"
 principalist_party_desc:0 "By following a principled approach, the MHP will grow stronger, and with this progress our country will find lasting peace of mind."
 turkes_legacies:0 "The Legacy of Türkeş"
 turkes_legacies_desc:0 "Know your ancestors and never forget them! Guard the values of your homeland, as Türkeş did! This country was not won easily; it was won with blood!"
 politics_of_surpress:0 "The Politics of Suppression"
 politics_of_surpress_desc:0 "There is nothing wrong with destroying those who work against us. Silencing this provocative mindset is vital for the stability of our people and our country."
 bahceli_powers:0 "Bahçeli's Powers"
 bahceli_powers_desc:0 "Under Bahçeli's leadership, our country will develop faster and grow stronger. Long live the wise Devlet Bahçeli."
 bahceli_powers_2:0 "Bahçeli's Powers"
 bahceli_powers_2_desc:0 "Under Bahçeli's leadership, our country will develop faster and grow stronger. Long live the wise Devlet Bahçeli."
 bahceli_powers_3:0 "Bahçeli's Powers"
 bahceli_powers_3_desc:0 "Under Bahçeli's leadership, our country will develop faster and grow stronger. Long live the wise Devlet Bahçeli."
 mass_counter_immigrationism:0 "Permanent Anti-Immigration Policy"
 mass_counter_immigrationism_desc:0 "It is time to expel the refugees who destabilize our country. Thank God we are saving our country from the impact of this refugee occupation!"
 closed_border:0 "Closed National Borders"
 closed_border_desc:0 "By closing the border crossings, we will not allow foreigners into our country."
 nationalism_in_the_borders:0 "Nationalism on the Borders"
 nationalism_in_the_borders_desc:0 "The power of nationalism must be felt on our borders and woven into our country. Nationalism is the strongest feeling in the world."
 harsh_solutions_of_the_border:0 "Harsh Solutions for the Border..."
 harsh_solutions_of_the_border_desc:0 "To tighten border security, we are prepared to ignore some articles of the Geneva Conventions. The use of toxic gases such as chlorine at the borders is one of the measures meant to stop refugees from coming."
 well_execution_system:0 "A Well-Oiled Execution System"
 well_execution_system_desc:0 "Refugees who enter our country illegally will be executed. No one has the right to cross our border illegally."
 border_protection_institutions:0 "Border Protection Institutions"
 border_protection_institutions_desc:0 "To secure the border, dedicated institutions must be on active duty there. They will make border security permanent."
 turkish_presidency:0 "The Turkish Presidency"
 turkish_presidency_desc:0 "The Turkish presidency operates within a defined system, with the main judicial powers concentrated at the center. It is modeled on the French system, which works perfectly."
 steps_of_militarist_society:0 "Steps Toward a Militarist Society"
 steps_of_militarist_society_desc:0 "It is time to build a militaristic society, through which we can be strong everywhere, above all militarily."
 turkish_wild_hunt:0 "The Turkish Wild Hunt"
 turkish_wild_hunt_desc:0 "Amid the turmoil in Europe, we can strengthen our position in the region by intervening against the European powers. Let the hunt begin for the countries that have left the European Union."
 turkish_arms_innovationalism:0 "Turkish Arms Innovation"

 anarchist_congress_assambled:0 "The Anarchist Congress Assembles"
 anarchist_congress_assambled_desc:0 "The anarchist congress has convened, and leadership levels will now be set up within a defined organization."
 anarchist_militarization:0 "Anarchist Militarization"
 anarchist_militarization_desc:0 "The anarchists will take up arms, destroy this disgusting, unjust government and bring absolute freedom!"
 spirit_of_rebellion:0 "Spirit Of Rebellion"
 spirit_of_rebellion_desc:0 "By reviving the spirit of rebellion, we will cleanse our country of the corruption that has overrun it! Long live anarchy, long live freedom!"
 anarchist_positivism:0 "Anarchist Positivism"
 anarchist_positivism_desc:0 "What harm can come from studying the world positively? Positivism is a spirit that will keep our people alive."
 guerilla_tactics:0 "Guerrilla Tactics"
 guerilla_tactics_desc:0 "Guerrilla warfare is a form of irregular warfare in which small groups of combatants, such as paramilitaries, armed civilians or irregulars, use tactics including ambushes, sabotage, raids, skirmishes, hit-and-run attacks and mobility to fight a larger, less mobile conventional military."
 motherland_committee:0 "The Homeland Committee"
 motherland_committee_desc:0 "The Homeland Committee exists to make anarchism succeed within our borders and to prevent future wars."
 a_new_kind_of_modern_movement:0 "A New Kind of Modern Movement"
 a_new_kind_of_modern_movement_desc:0 "Anarchism must be strengthened by combining it with modern principles. This will be invaluable."
 anarchist_repairing_stuff:0 "Anarchist Repairing Staff"
 anarchist_repairing_stuff_desc:0 "We suffered heavy losses and destruction in the war. Now we must repair the damage by forming an anarchist reconstruction group."
 workout_propaganda:0 "Work Propaganda"
 workout_propaganda_desc:0 "Propaganda is incredibly effective, so we can boost our workforce wherever we want."
 anarchist_working_engine:0 "The Anarchist Work Engine"
 anarchist_working_engine_desc:0 "The anarchist system works magnificently, and thanks to it our profits are at incredible levels!"
 anarchist_collectivization:0 "Anarchist Collectivization"
 anarchist_collectivization_desc:0 "Through collective economic restructuring, we will keep this anarchist creation alive and make it stronger. All development comes through economic restructuring."
 torchbearers_of_state:0 "Torchbearers of the State"
 torchbearers_of_state_desc:0 "By turning our citizens, the torchbearers of our country, into intellectuals, we will take the country very far."
 appoint_technicans:0 "Appointed Technicians"
 brain_cleaning:0 "Brainwashing"
 brain_cleaning_desc:0 "Corrupted minds must be corrected. We will reshape them through anarchist propaganda activists."
 a_new_society_of_anarchism:0 "A New Society: Anarchism"
 anarcho_neutrality:0 "Anarchist Neutrality"
 anarcho_neutrality_desc:0 "For now, anarchism must stay neutral. First we will establish anarchy among ourselves, and then we will spread it to the whole world."
 divided_construction:0 "Divided Construction Plans"
 plans_of_construction:0 "Plans for Mass Construction"
 plans_of_construction_desc:0 "Large projects must be carried out, and for that we can use the blessings of planned economic systems."
 consumer_goods_lowering_for_anarchism:0 "Reduced Consumer Goods"
 consumer_goods_lowering_for_anarchism_desc:0 "Consumer goods must be cut back; they are very damaging to our economy."
 anarchist_born_economy:0 "An Anarchist-Born Economy"
 anarchist_born_economy_desc:0 "The anarchist economic model will drive our development and raise our country to an advanced level."
 anarchist_collectivization_systematic:0 "Systematic Anarchist Collectivization"
 anarchist_collectivization_systematic_desc:0 "Through collective economic restructuring, we will keep this anarchist creation alive and make it stronger. All development comes through economic restructuring."
 protect_academies:0 "Protected Academies"
 protect_academies_desc:0 "The academies must be protected from pressure. If academics cannot work, innovation could suffer drastic losses."
 free_education_free_land:0 "Free Education, Free Land"
 free_education_free_land_desc:0 "Free land! Free education! Thanks to these, our country will be safe from great dangers and backwardness."
 education_WANTED:0 "Education: WANTED"
 education_WANTED_desc:0 "There is no stability without education, so education is NECESSARY, no matter what!"
 a_hacker_group:0 "A Group of Hackers"
 a_hacker_group_desc:0 "With a group of hackers, we will infiltrate other countries' data and spread anarchism to them."
 AI_technologies:0 "AI Technologies"
 AI_technologies_desc:0 "Artificial intelligence (AI) is intelligence demonstrated by machines, as opposed to the natural intelligence of animals, including humans. AI research has been defined as the study of intelligent agents: any system that perceives its environment and takes actions that maximize its chances of achieving its goals."
 personel_innovationalism:0 "Personal Innovation"
 personel_innovationalism_desc:0 "Individual research will drive the growth of science in our country, letting us easily reach the technology we want."
 electiricy_controlled:0 "Controlled Electricity"
 electiricy_controlled_desc:0 "By taking control of electricity, we can greatly expand our authority, use our resources efficiently and keep our reach wide."
 modern_echologist_movement:0 "The Modern Ecologist Movement"
 modern_echologist_movement_desc:0 "Through the modern ecologist movement, we will strengthen our nature and not let it deteriorate."
 support_from_scientists:0 "Support From Scientists"
 support_from_scientists_desc:0 "We will develop our technology with the support of the scientists in our country. Scientists are the apple of this country's eye."
 support_from_academicians:0 "Support From Academics"
 support_from_academicians_desc:0 "We will develop our technology with the support of the academics in our country. Academics are the eyes of this country."
 alliance_with_scientists:0 "Allied With the Scientists"
 alliance_with_scientists_desc:0 "By allying with the scientists, we have turned our regime into a partially technocratic one, which will strengthen our administration."
 sanction_community_of_greens:0 "The Green Sanctions Commission"
 sanction_community_of_greens_desc:0 "As green workers, we must institutionalize ourselves as a sanctions commission, and we will do so through a communication network."
 planted_trees:0 "Planted Trees"
 planted_trees_desc:0 "We must support ecology by planting trees. If the ecosystem collapses, no one will be able to live in this world."
 windmills:0 "Windmills"
 windmills_desc:0 "A windmill is a structure that converts wind power into rotational energy by means of vanes called sails or blades, traditionally to mill grain (gristmills), though the term also extends to wind pumps, wind turbines and other applications. The term wind engine is sometimes used for such devices."
 windmills_place:0 "Windmill Sites"
 windmills_place_desc:0 "A windmill is a structure that converts wind power into rotational energy by means of vanes called sails or blades, traditionally to mill grain (gristmills), though the term also extends to wind pumps, wind turbines and other applications. The term wind engine is sometimes used for such devices."
 termic_waters:0 "Thermal Water Projects"
 termic_waters_large:0 "Thermal Water Projects"
 the_energy_of_sun:0 "Solar Energy"
 the_energy_of_sun_desc:0 "Solar power is the conversion of renewable energy from sunlight into electricity, either directly with photovoltaics (PV), indirectly with concentrated solar power, or a combination of both. Photovoltaic cells convert light into electric current through the photovoltaic effect."
 the_energy_of_sun_2:0 "Solar Energy"
 the_energy_of_sun_2_desc:0 "Solar power is the conversion of renewable energy from sunlight into electricity, either directly with photovoltaics (PV), indirectly with concentrated solar power, or a combination of both. Photovoltaic cells convert light into electric current through the photovoltaic effect."
 nuclear_energy_ban:0 "The Nuclear Energy Ban"
 nuclear_energy_ban_desc:0 "A force as vast as nuclear energy must be controlled, and that is very hard; people cannot manage it. That is why the nukes must be destroyed!"
 nuclear_energy_ban_2:0 "The Nuclear Energy Ban"
 nuclear_energy_ban_2_desc:0 "A force as vast as nuclear energy must be controlled, and that is very hard; people cannot manage it. That is why the nukes must be destroyed!"
 nuclear_energy_ban_3:0 "The Nuclear Energy Ban"
 nuclear_energy_ban_3_desc:0 "A force as vast as nuclear energy must be controlled, and that is very hard; people cannot manage it. That is why the nukes must be destroyed!"
 nuclear_energy_ban_4:0 "The Nuclear Energy Ban"
 nuclear_energy_ban_4_desc:0 "A force as vast as nuclear energy must be controlled, and that is very hard; people cannot manage it. That is why the nukes must be destroyed!"
 protection_for_humans:0 "Protection for Humans"
 protection_for_humans_desc:0 "People must be protected from the environment they themselves have created. Otherwise, we will lose our lineage and the environment will stay this way forever.""
 protection_for_animals:0 "Protection for Animals"
 protection_for_animals_desc:0 "We must protect animals from the damaged environment we live in. Protecting animals is vital to the balance of nature."
 peace_solution:0 "A Peaceful Solution"
 peace_solution_desc:0 "Peace is the answer to everything. Without peace, there is neither stability nor tranquility."
 peace_forever:0 "Peace Forever"
 peace_forever_desc:0 "Peace must be preserved absolutely, to the very end. If peace does not last forever, this world will sadly perish."
 genius_europe:0 "Genius Europe"
 genius_europe_desc:0 "Europe is a region of intelligent, ecologically minded people, and it will bring about the world's salvation."
 green_world_projection:0 "The Green World Projection"
 green_world_projection_desc:0 "The whole world will be renewed under the green curtain! Long live the Green World! Long live the environment!"
 agriculture_increase_1:0 "Strengthened Agriculture"
 agriculture_increase_1_desc:0 "We must strengthen our agricultural basins. Through this, our people will live more in harmony with ecology!"
 agriculture_increase_2:0 "Strengthened Agriculture"
 agriculture_increase_2_desc:0 "We must strengthen our agricultural basins. Through this, our people will live more in harmony with ecology!"
 coal_ban:0 "The Coal Ban"
 coal_ban_desc:0 "Coal is extremely harmful to the environment and must be strictly banned. Using it is nothing short of perversion."
 coal_and_oil_ban:0 "The Coal and Oil Ban"
 coal_and_oil_ban_desc:0 "Coal and oil are extremely harmful to the environment and must be strictly banned. Using them is nothing short of perversion."
 deindustriaization_program:0 "The Deindustrialization Program"
 deindustriaization_program_desc:0 "We are launching a mass deindustrialization movement. Through it, we will make nature happy by pulling the plug on the factories that are enemies of the environment."
 create_a_socialist_front:0 "The Socialist Front"
 create_a_socialist_front_desc:0 "We have opened the socialist front, and its meaning is clear: non-socialists and non-anarchists will perish!"
 capitalism_looting:0 "Looting the Capitalists..."
 capitalism_looting_desc:0 "We are launching a movement against capitalist exploitation that will benefit our country. It is time to confiscate the capitalists' property!"
 labour_culture:0 "The Labor Culture"
 labour_culture_desc:0 "Building a culture of labor will benefit our work and strengthen lasting incentives in production."
 child_labour_culture:0 "Long-Lasting Child Labor"
 child_labour_culture_desc:0 "Child labor must continue in this anarchist environment. It may look bad, but it raises employment, so we can build quickly."
 anarchist_collectivization_systematic_culture:0 "The Culture of Systematic Anarchist Collectivization"
 anarchist_collectivization_systematic_culture_desc:0 "Through collective economic restructuring, we will keep this anarchist creation alive and make it stronger. All development comes through economic restructuring."
 fast_construction:0 "Fast Construction"
 fast_construction_desc:0 "Rapid construction will let us industrialize faster, and industry is something every powerful country must have."
 working_teams_working:0 "Working Teams"
 working_teams_working_desc:0 "By forming work brigades, we will create healthy employment, and healthy employment is strength."
 the_turkish_industrial_culture:0 "The Turkish Industrial Culture"
 the_turkish_industrial_culture_desc:0 "By making Turkish industrialization a culture, we will reach maximum industrial speed."
 the_turkish_radar_culture:0 "The Radar Culture"
 the_turkish_radar_culture_desc:0 "By making Turkish radar construction a culture, we will achieve maximum radar coverage."
 the_turkish_railway_culture:0 "The Railway Culture"
 the_turkish_railway_culture_desc:0 "By making Turkish railway construction a culture, we will build the maximum railway network."
 non_religious_interventionism:0 "Atheist Interventions"
 non_religious_interventionism_desc:0 "Through atheist interventions, we will make anarchism and a godless country possible, mainly by closing places of worship and seizing religious property."
 non_religious_interventionism_2:0 "Atheist Interventions"
 non_religious_interventionism_2_desc:0 "Through atheist interventions, we will make anarchism and a godless country possible, mainly by closing places of worship and seizing religious property."
 innovation_first:0 "Innovation First"
 innovation_first_desc:0 "By putting innovation first, we will develop our country in science and learning."
 science_tourmaments:0 "Science Tournaments"
 science_tourmaments_desc:0 "By holding science tournaments, we will help science develop from within."
 science_exhabitions:0 "Science Exhibitions"
 academicians_in_the_world:0 "Attracting Academics From Around the World"
 academicians_in_the_world_desc:0 "By attracting academics from all over the world, we will add a new color to innovation in our country."
 invention_founder_society:0 "Society of Inventors"
 invention_founder_society_desc:0 "We have created a community of inventors, the scouts of our future."
 anarchist_science_power:0 "Anarchist Science"
 anarchist_science_power_desc:0 "Through anarchist science, we will push beyond ordinary scientific progress, and these advances matter to us."
 anarchist_transportation:0 "Anarchist Transportation"
 anarchist_transportation_desc:0 "Thanks to anarchist transportation, we will be able to move our army from place to place with ease."
 anarchist_transportation_2:0 "Anarchist Transportation"
 anarchist_transportation_2_desc:0 "Thanks to anarchist transportation, we will be able to move our army from place to place with ease."
 human_waves_tactics:0 "Human Wave Tactics"
 human_waves_tactics_desc:0 "With human wave tactics, we will crush the enemy by sheer weight of numbers."
 the_socialist_elites:0 "The Socialist Elites"
 the_socialist_elites_desc:0 "By forming an army unit called the Socialist Elites, we will hunt down the capitalists in our country. The hunt will be sweet."
 arms_of_nato_against_attack:0 "Countering NATO Attacks"
 arms_of_nato_against_attack_desc:0 "We will build unique defensive armies against NATO attacks to protect us from the invading NATO."
 arms_of_nato_against_defence:0 "Countering NATO Defenses"
 arms_of_nato_against_defence_desc:0 "We will build unique offensive armies to break through NATO's defenses and protect us from the invading NATO."
 attack_and_defense_combined_force:0 "Countering NATO Attacks and Defenses"
 attack_and_defense_combined_force_desc:0 "We will build unique defensive and offensive armies against NATO to protect us from the invading NATO."
 systematic_forces_of_anarchism:0 "Systematic Anarchist Forces"
 systematic_forces_of_anarchism_desc:0 "Our anarchist armies may need some system. By nature we dislike system and organization, but we must accept them for the stability of the army."
 joint_forces_of_military:0 "Joint Forces of Anarchism"
 joint_forces_of_military_desc:0 "Anyone who wants to join our anarchist army should be able to, while forcing in those who don't want to serve only damages the army's efficiency and order."
 the_money_law:0 "The Money Act"
 the_money_law_desc:0 "Passing an act to protect the value of money will bring us good results. Preserving the value of money is critical."
 free_robbing:0 "Legalized Robbery"
 free_robbing_desc:0 "It is time to legalize theft. Decriminalizing it will help money circulate among the people and strengthen anarchism."
 financial_freedom_action:0 "Financial Freedom"
 financial_freedom_action_desc:0 "Financial freedom completes life on earth. Securing it is enormously important to us."
 the_credit_house:0 "The Credit House"
 the_credit_house_desc:0 "By building credit houses, we will make it easier for people to get loans. The free financial world is life itself."
 money_digging:0 "Money Digging"
 money_digging_desc:0 "For money to be easy to come by, it has to be printed, or mined like Bitcoin, and we will do just that by seizing the money-printing machines and making ourselves rich."
 money_digging_2:0 "Money Digging"
 money_digging_2_desc:0 "For money to be easy to come by, it has to be printed, or mined like Bitcoin, and we will do just that by seizing the money-printing machines and making ourselves rich."
 the_money_law_2:0 "The Money Act"
 the_money_law_2_desc:0 "By shaping monetary policy, we can raise and strengthen the value of money, and with it our own strength."
 freedom_for_gunselers:0 "Freedom for Arms Dealers"
 freedom_for_gunselers_desc:0 "Arms dealers must be free to sell their weapons. If they cannot sell, trade will fade, people will arm themselves less, and a crack will open in our security."
 freedom_for_banks:0 "Freedom for the Banks"
 freedom_for_banks_desc:0 "Banks must be free from interference and independent. Otherwise, the harm will be tremendous."
 the_finance_state_1:0 "The Finance State"
 the_finance_state_1_desc:0 "This place now runs no differently from a financial board: money is everything and drives everything. Without money, there is no state."
 the_finance_state_2:0 "The Finance State"
 the_finance_state_2_desc:0 "This place now runs no differently from a financial board: money is everything and drives everything. Without money, there is no state."
 the_finance_state_3:0 "The Finance State"
 the_finance_state_3_desc:0 "This place now runs no differently from a financial board: money is everything and drives everything. Without money, there is no state."
 the_finance_state_4:0 "The Finance State"
 the_finance_state_4_desc:0 "This place now runs no differently from a financial board: money is everything and drives everything. Without money, there is no state."
 gold_investments:0 "Gold Investments"
 gold_investments_desc:0 "Gold investments are promising for our country and will pay off handsomely in the future!"
 gold_investments_return:0 "Gold Investment Returns"
 gold_investments_return_desc:0 "Our gold investments have paid off, and our country can now allocate a large inflow of money."
 bank_investments:0 "Bank Investments"
 bank_investments_desc:0 "Bank deposit investments are promising for our country and will pay off handsomely in the future!"
 bank_investments_return:0 "Bank Investment Returns"
 bank_investments_return_desc:0 "Our bank deposit investments have paid off, and our country can now allocate a large inflow of money."
 corporation_investments:0 "Corporate Investments"
 corporation_investments_desc:0 "Corporate investments are promising for our country and will pay off nicely in the future!"
 corporation_investments_return:0 "Corporate Investment Returns"
 corporation_investments_return_desc:0 "Our corporate investments have paid off, and we can now allocate a large inflow of money to our country."
 anarchized_us_banks:0 "Anarchized US Banks"
 anarchized_us_banks_desc:0 "Our banks have been infiltrated by anarchist elements. The effects may be permanent."
 solved_petrodolar_crisis:0 "No More Oil Crises"
 solved_petrodolar_crisis_desc:0 "There will be no more indirect economic crises over oil. We have taken care of it."
 trade_trade_trade:0 "The Utopia of Trade"
 trade_trade_trade_desc:0 "We have achieved the utopia of trade. Everyone now uses this capitalist system, which lets capital move freely around the world."
 consumer_goods_lowered:0 "Reduced Consumer Goods"
 consumer_goods_lowered_desc:0 "Consumer goods must be cut back; they are very damaging to our economy."
 gun_shops:0 "Gun Shops"
 gun_shops_desc:0 "Freeing the gun shops means our people can arm themselves freely and better protect themselves. This is individualism itself, as embodied by our anarchist flag."
 gun_dealers:0 "Gun Dealers"
 gun_dealers_desc:0 "The arms trade will grow our capital and help our country develop. Guns are making our country soar."
 world_of_guns:0 "A World of Guns"
 world_of_guns_desc:0 "Right now, too many people in the world are unarmed. That is why everyone in our country should be armed, and even keep a spare weapon."
 action_of_WFP:0 "WFP"
 action_of_WFP_desc:0 "The World Food Programme (WFP) is the food-assistance branch of the United Nations. It is the world's largest humanitarian organization focused on hunger and food security, and the largest provider of school meals. Founded in 1961, it is headquartered in Rome and has offices in 80 countries."
 action_of_IFAD:0 "IFAD"
 action_of_IFAD_desc:0 "The International Fund for Agricultural Development (IFAD) is an international financial institution and specialized UN agency that works to tackle poverty and hunger in rural areas of developing countries. It is the only multilateral development organization focused exclusively on rural economies, food security and climate change."
 action_of_FDO:0 "FAO"
 healthy_water:0 "Clean Water"
 healthy_water_desc:0 "Clean water is essential to humanity. We must protect our waters; if we fail to, the end is near."
 upward_academicians:0 "Rising Academics"
 upward_academicians_desc:0 "Our academics now far exceed the average. They are extremely resourceful and intelligent."
 fiscal_politicss:0 "Fiscal Policy"
 TURKSAT_tech:0 "TÜRKSAT Technologies"
 TURKSAT_tech_desc:0 "Türksat Satellite Communications and Cable TV Operations Company is Turkey's sole communications satellite operator."
 islamic_dealership:0 "Islamic Partnerships"
 islamic_dealership_desc:0 "As a Muslim country, Turkey must maintain good relations with the Islamic world. If a Muslim is not a friend to a Muslim, who will he befriend?"
 nationalized_war_industry:0 "The Nationalized War Industry"
 nationalized_war_industry_desc:0 "Nationalized infrastructure and a nationalized defense industry will easily carry our country forward."
 ecologist_tanks:0 "Ecologist Tanks"
 ecologist_tanks_desc:0 "By building eco-friendly tanks, we will be able to kill our enemies without harming nature."
 ecologist_tanks_buffed:0 "Ecologist Tanks"
 ecologist_tanks_buffed_desc:0 "By building eco-friendly tanks, we will be able to kill our enemies without harming nature."
 ecologist_weapons:0 "Eco-Friendly Weapons"
 ecologist_weapons_desc:0 "Eco-friendly weapons must be invented so that the environment does not suffer. They may be less powerful, but they do not pollute."
 special_ecologist_armies:0 "Special Ecologist Armies"
 special_ecologist_armies_desc:0 "Special armies dedicated to preserving the environment must be trained. Otherwise, sadly, the environment will not survive."
 water_planes:0 "Seaplanes"
 water_planes_desc:0 "A seaplane is a powered fixed-wing aircraft capable of taking off from and landing on water. Seaplanes are usually divided into two categories, floatplanes and flying boats, the latter generally being far larger and able to carry much more. Seaplanes that can also use runways form a subclass called amphibious aircraft, or amphibians."
 banned_flying_wings:0 "Flying Banned"
 banned_flying_wings_desc:0 "Everything that flies without need must be grounded. It is harming nature!"
 ecoogical_imperialism:0 "Ecological Imperialism"
 ecoogical_imperialism_desc:0 "The time for ecological imperialism has come. Every state that does serious damage to nature must be destroyed! Long live the Forces of Nature..."
 turkish_drone_sector_buffed:0 "The Turkish Drone Industry"
 turkish_drone_sector_buffed_desc:0 "Turkey is a world leader in drone production and technology, all thanks to its drone industry. By continuing to fund the sector, we can intimidate other countries with ever more modern and powerful drones."
 minor_inflation:0 "Mild Inflation"

 anti_right_movement:0 "The Anti-Right Movement"
 anti_right_movement_desc:0 "Communists and leftists have united against the right. Now our time has come: we will destroy every right-winger and raise the red flag."
 anti_right_movement_2:0 "The Anti-Right Movement"
 anti_right_movement_2_desc:0 "Communists and leftists have united against the right. Now our time has come: we will destroy every right-winger and raise the red flag."
 anti_right_movement_3:0 "The Anti-Right Movement"
 anti_right_movement_3_desc:0 "Communists and leftists have united against the right. Now our time has come: we will destroy every right-winger and raise the red flag."
 peace_land_bread:0 "Peace, Land and Bread"
 peace_land_bread_desc:0 "The slogan "Peace, Land and Bread" was launched by Lenin to win popular support in the struggle for power in Russia. In his proclamation, Lenin addressed the people's concerns: "peace" meant an end to the war, "land" meant land for the peasants, and "bread" meant relief from widespread hunger."
 disk_cooperationism:0 "Cooperation With DİSK"
 disk_cooperationism_desc:0 "DİSK is one of Turkey's four major national trade union confederations. It was founded in 1967 as a breakaway from the Confederation of Turkish Trade Unions and has 327,000 members."
 repair_stuff:0 "Repair Crews"
 repair_stuff_desc:0 "It would be wise to set up dedicated institutions to rebuild the country and lift it out of backwardness. The faster we organize, the faster we develop."
 unions_agreed_each_other:0 "Union Agreements"
 unions_agreed_each_other_desc:0 "We have signed agreements with the unions to keep good relations. Good relations with the unions will improve both our economy and the workers' happiness."
 fast_construction_movement:0 "Fast Construction Movement"
 fast_construction_movement_desc:0 "We have launched a rapid construction drive that will build industrial facilities all over the country and make us strong."
 kemalist_socialism:0 "Kemalist Nationalism"
 kemalist_socialism_desc:0 "Kemalism is strengthened by nationalism. This state would not exist without nationalism and Kemalism!"
 neutral_positioning:0 "Neutral Positioning"
 neutral_positioning_desc:0 "Positioning ourselves as neutral will serve us well. Neutrality is strategic wisdom."
 perincek_powers:0 "Perinçek's Powers"
 perincek_powers_desc:0 "Perinçek's power is at an incredible level. Together with Perinçek, we will rule the world with this power."
 perincek_wisdom:0 "Perinçek's Wisdom"
 perincek_wisdom_desc:0 "Perinçek's power and knowledge are at an incredible level. Together with Perinçek, we will rule the world with this power and knowledge."
 crush_local_investors:0 "Crushing Local Investors"
 crush_local_investors_desc:0 "With local investors crushed, Chinese investors will expand their influence in our country. Chinese investors care about our country's profits; the locals care only about themselves."
 perincek_fundementalis:0 "Perinçek's Fundamentals"
 glory_of_the_soviet_past:0 "The Glory of the Soviet Past"
 glory_of_the_soviet_past_desc:0 "The Soviet era is over and socialism's superpower has collapsed. Now, together with China, we will make socialism a superpower again."
 chinese_marketplace_act_1:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_1_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 chinese_marketplace_act_2:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_2_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 chinese_marketplace_act_3:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_3_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 chinese_marketplace_act_4:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_4_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 chinese_marketplace_act_5:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_5_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 chinese_marketplace_act_6:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_6_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 chinese_marketplace_act_7:0 "The Invasion of Chinese Markets"
 chinese_marketplace_act_7_desc:0 "Chinese investors and markets have swept into our country, but we have judged this invasion to be benign. Thanks to it, our country will reach far better levels and prosperity will soar. Long live the Chinese offensive!"
 china_is_a_right_state:0 "Supporting China Forever!"
 china_is_a_right_state_desc:0 "We will support China forever. There can be no Turkey without China!"
 chinese_licensing_program:0 "The Chinese Licensing Program"
 chinese_licensing_program_desc:0 "Through the Chinese licensing program, we will acquire new equipment and new technologies. This program will do our country good!"
 emergency_powers_of_the_state:0 "Emergency Powers of the Council"
 emergency_powers_of_the_state_desc:0 "We have given the Council emergency powers, which will let it function properly and keep everyone happy."
 state_of_function:0 "A Functional State"
 state_of_function_desc:0 "We have built a functioning state. The system will work properly and our country will take shape."
 unions_in_cooperation:0 "Unions in Cooperation"
 unions_in_cooperation_desc:0 "The unions and the state are acting as one. With this unity, our country will go very far."
 unions_in_cooperation_2:0 "Unions in Cooperation"
 unions_in_cooperation_2_desc:0 "The unions and the state are acting as one. With this unity, our country will go very far."
 action_of_trade:0 "The Trade Act"
 action_of_trade_desc:0 "We will introduce new initiatives and laws for trade. As long as trade stays strong, our economy stays strong."
 action_of_goods_trade:0 "The Goods Trade"
 action_of_goods_trade_desc:0 "We will introduce new initiatives and laws for the goods trade. As long as trade stays strong, our economy stays strong."
 science_law:0 "The Science Law"
 science_law_desc:0 "Through the science law, we will prevent scientific fraud, so that science stays clean and authority and power stay where they belong."
 supporting_the_scientists:0 "Supporting the Scientists"
 supporting_the_scientists_desc:0 "By supporting our scientists, we can achieve scientific progress in the country. Science is the engine of progress."
 reformed_counter_books:0 "Counter Right-Wing Books"
 reformed_counter_books_desc:0 "By purging right-wing books, we will cleanse our country of fascism. Fascism poisons everything it touches."
 world_visionalism:0 "World Visionism"
 world_visionalism_desc:0 "It is time to bring visionaries to the forefront. Vision is one of the most powerful forces in the world; work without vision is pointless."
 state_of_arts:0 "State of the Arts"
 state_of_arts_desc:0 "By valuing the arts, we will become a country of art, and science will flourish alongside it."
 odp_possitivism:0 "ÖDP Positivism"
 odp_possitivism_desc:0 "Through positivism, we will spread stability throughout the country. Without positivism, the country would sink into pessimism and stagnate."
 labour_happiness:0 "Workers' Happiness First"
 labour_happiness_desc:0 "We will put new plans in place to keep workers happy. Happy workers are a key factor in the country's stability."
 new_kind_of_populism:0 "A New Kind of Populism"
 new_kind_of_populism_desc:0 "We will bring a new dimension to populism, and with it our people will be happier."
 new_kind_of_populism_2:0 "A New Kind of Populism"
 new_kind_of_populism_2_desc:0 "We will bring a new dimension to populism, and with it our people will be happier."
 objection_freedom:0 "Freedom of Dissent"
 objection_freedom_desc:0 "We will develop our country in the name of freedom, because a developing country must never lack freedom."
 disbanding_the_limits:0 "Breaking the Limits"
 disbanding_the_limits_desc:0 "It is time for everything that limits us to disappear. Without limits, we will gain great creative power."
 reformation_institutions:0 "The Reform Institution"
 reformation_institutions_desc:0 "To carry out reform systematically, we have institutionalized it. Systematic reform is the most powerful mechanism for keeping the country up to date."
 scientific_community_back:0 "The Scientific Community in Action"
 land_of_wisdom:0 "Land of Wisdom"
 land_of_wisdom_desc:0 "Our scientific achievements are now so great that we have become a country of science. Knowledge is our country's aspiration; we cannot do without it."
 national_theathre:0 "The National Theater in Action"
 national_theathre_desc:0 "We have opened a theater center in the capital. This great theater will bring our compatriots joy and artistic strength."
 economic_cooperative_unions:0 "Economic Cooperative Unions"
 economic_cooperative_unions_desc:0 "We have made agreements with the unions of our allied countries. Our common goal is our country's economic development."
 peace_unified_unions:0 "Peaceful United Unions"
 peace_unified_unions_desc:0 "We have made agreements with the unions of our allied countries. Our common goal is to build peace and stability."
 economic_working_cooperative_unions:0 "Cooperative Economic Unions"
 economic_working_cooperative_unions_desc:0 "We have made agreements with the unions of our allied countries. Our common goal is our country's development."
 unions_in_loyalty:0 "Loyal Unions"
 unions_in_loyalty_desc:0 "The unions have full faith in us, which is why they are loyal. Their loyalty means our workforce is working at its full potential."
 THKPC_cooperation:0 "Cooperation With Leftist Organizations"
 THKPC_cooperation_desc:0 "We have reached an agreement with communist militant organizations. With them on our side, we will easily defeat the other, non-communist terrorists."
 workers_in_action:0 "Workers in Action"
 workers_in_action_desc:0 "The workers believe in our country. As long as their faith endures, our country will keep developing and gaining new strength."
 peasenets_in_action:0 "Peasants in Action"
 peasenets_in_action_desc:0 "The workers believe in our country. As long as their faith endures, our country will keep developing and gaining new strength."
 farmers_in_action:0 "Farmers in Action"
 farmers_in_action_desc:0 "The farmers believe in our country. As long as their faith endures, our country will keep developing and gaining new strength."
 military_secularism_achieved:0 "Military Secularism Achieved"
 military_secularism_achieved_desc:0 "We have now fully secularized the army. For our country to stay secular, the army must be completely secular."
 communist_colleges:0 "Communist Colleges"
 communist_colleges_desc:0 "By opening communist colleges, we will advance education and science in our country."
 communistic_science_community:0 "The Communist Scientific Community"
 communistic_science_community_desc:0 "We have created a communist scientific community and are developing our country through it."
 unions_in_loyalty_culturized:0 "The Union Culture"
 unions_in_loyalty_culturized_desc:0 "We have built a culture of unionism. Thanks to it, the unions will never bow their heads, and equality for workers will last forever."
 unions_in_loyalty_culturized_freedom:0 "The Union Culture"
 unions_in_loyalty_culturized_freedom_desc:0 "We have built a culture of unionism. Thanks to it, the unions will never bow their heads, and equality for workers will last forever."
 agricultural_action_plan:0 "The Agricultural Action Plan"
 agricultural_action_plan_desc:0 "We are working toward new targets for agricultural development. Through these efforts, the agricultural sector will become stronger than ever."
 weekend_vacation_culture:0 "The Weekend Holiday"
 weekend_vacation_culture_desc:0 "A weekend holiday has been introduced. Working or employing people on weekends is nothing short of an insult to our nation, and offenders will be arrested!"
 eight_hours_for_work:0 "The Eight-Hour Workday"
 eight_hours_for_work_desc:0 "An eight-hour workday has been introduced. Working or employing people beyond it is nothing short of an insult to our nation, and offenders will be arrested!"
 agricultural_action_plan_2:0 "Agricultural Action"
 agricultural_action_plan_2_desc:0 "We are working toward new targets for agricultural development. Through these efforts, the agricultural sector will become stronger than ever."
 agricultural_action_plan_3:0 "Agricultural Action"
 agricultural_action_plan_3_desc:0 "We are working toward new targets for agricultural development. Through these efforts, the agricultural sector will become stronger than ever."
 collective_society_TKP:0 "A Collectivist Society"
 collective_society_TKP_desc:0 "We have begun industrializing, drawing on the blessings of collectivism. With rapid industrialization, our country will rise to new heights and a new civilization."
 collectivism_FULL_TKP:0 "A Fully Collectivist Society"
 collectivism_FULL_TKP_desc:0 "We have begun industrializing, drawing on the blessings of mass collectivism. With rapid industrialization, our country will rise to new heights and a new civilization."
 bulwark_against_capitalism:0 "Bulwark Against Capitalism"
 bulwark_against_capitalism_desc:0 "Not trading with the capitalist world is the most profitable course of all. Where capitalism has collapsed, the voice of the people rings out!"
 nationalistic_communism:0 "National Communism"
 nationalistic_communism_desc:0 "We have blended communism with nationalism, giving communism a new dimension, assuming our ideology is still communism, that is."
 nationalistic_communism_2:0 "National Communism"
 nationalistic_communism_2_desc:0 "We have blended communism with nationalism, giving communism a new dimension, assuming our ideology is still communism, that is."
 THKPC_cooperation_2:0 "Cooperation With Leftist Organizations"
 THKPC_cooperation_2_desc:0 "We have reached an agreement with communist militant organizations. With them on our side, we will easily defeat the other, non-communist terrorists."
 pax_industrialism:0 "Pax Industrialism"
 pax_industrialism_desc:0 "For communism to survive, society must be industrialized; communists without industry inevitably fall behind. That is why we will build industrial parks everywhere and achieve an industrial utopia."
 internet_reform:0 "Internet Reform"
 internet_reform_desc:0 "Through internet reform, we will expose and eliminate the fake news circulating online. Removing it means establishing stability."
 peoples_unification_action:0 "The Unification of the Peoples"
 peoples_unification_action_desc:0 "Communism has united the peoples. With this union and blending, communism will live on strong."
 boom_of_morale:0 "Boom Of Morale"
 boom_of_morale_desc:0 "Thanks to our people's morale, we can win any war that comes and make progress in industry. That is why our people's morale is so important to our country."
 united_forces_of_counter_imperialism:0 "The United Forces of Anti-Imperialism"
 united_forces_of_counter_imperialism_desc:0 "We will destroy imperialism by forming joint armies to dismantle the imperialist order and apparatus around the world."
 earthquake_preparations:0 "Earthquake Preparations"
 media_opinion_towards_good_happy_everyone:0 "The Turkish Media"
 media_opinion_towards_good_happy_everyone_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 media_opinion_towards_stable:0 "The Turkish Media"
 media_opinion_towards_stable_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 media_opinion_towards_bad_1_left_wing_sad:0 "The Turkish Media"
 media_opinion_towards_bad_1_left_wing_sad_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 media_opinion_towards_bad_1_right_wing_sad:0 "The Turkish Media"
