 shot_down_youtube:0 "YouTube Blocked"
 turkish_2001_crisis:0 "The 2001 Turkish Economic Crisis"
 turkish_2001_crisis_desc:0 "The crash was emblematic of the political and economic problems that had been wearing Turkey down for years. Confidence in the government had been eroded by corruption and the failure to form lasting coalitions. The stock market crash revealed that Turkey's economy was not only extremely fragile but also entirely dependent on foreign investment. Although less significant than the fall in foreign investment or the massive budget deficit, the crash highlighted Turkey's recent political instability."
 reformed_2001_crisis:0 "The Turkish Economic Malaise"
 reformed_2001_crisis_desc:0 "People are tired of a country dependent on foreign investment and an economy that has failed to improve for nearly 50 years because of political problems. The country must now recover from the political crisis and fix its economy to win economic independence."
 reforms_for_2001_crisis:0 "The Turkish Economic Malaise"
 reforms_for_2001_crisis_desc:0 "People are tired of a country dependent on foreign investment and an economy that has failed to improve for nearly 50 years because of political problems. The country must now recover from the political crisis and fix its economy to win economic independence."
 reformss_for_2001_crisis:0 "The Turkish Economic Malaise"
 reformss_for_2001_crisis_desc:0 "People are tired of a country dependent on foreign investment and an economy that has failed to improve for nearly 50 years because of political problems. The country must now recover from the political crisis and fix its economy to win economic independence."
 new_constitution_TUR:0 "The Turkish Constitution"
 new_constitution_TUR1:0 "The Turkish Constitution"
 KHK_laws:0 "KHK Laws"
 #FETO_alliance_desc:0 "The Gülen movement is a former ally of the §Y[Neutral_Muslim_Brotherhood_L]§!. When the §Y[Neutral_Muslim_Brotherhood_L]§! came to power in 2002 the two formed, despite their differences, a tactical alliance against military tutelage and the Turkish secular elite."
 betrayal_from_FETO3:0 "The Gülen Movement's Very Low Influence Over the Republic"
 betrayal_from_FETO2:0 "The Gülen Movement's Low Influence Over the Republic"
 betrayal_from_FETO1:0 "The Gülen Movement's Partial Influence Over the Republic"
 betrayal_from_FETO:0 "The Gülen Movement's Growing Influence Over the Republic"
 risen_FETO_alliance:0 "The Rising Gülen Movement"
 risen_FETO_alliance_desc:0 "The Gülen movement is a former ally of the §Y[Neutral_Muslim_Brotherhood_L]§!. When the §Y[Neutral_Muslim_Brotherhood_L]§! came to power in 2002, the two formed a tactical alliance, despite their differences, against military tutelage and Turkey's secular elite."
 turkish_islamist_schools:0 "Turkish Islamist Schools"
 turkish_islamist_schools_desc:0 "Islamic schools have been opened to promote religiosity in Turkey, costing the Kemalist parties votes. Stability will rise, but innovation may suffer."
 stabilization_of_TUR:0 "The Stabilization of Turkey"
 syrian_immigration:0 "Syrian Immigration"
 syrian_immigration_desc:0 "During the Syrian Civil War, huge numbers of Syrians began fleeing to Turkey, causing severe damage to Turkey's politics and economy. Angered by the influx, the nationalists stopped voting for the government and moved into opposition, while the EU's stance on the issue has also fueled opposition among secularists."
 immigration_crisis:0 "The Immigration Crisis"
 laws_of_bin:0 "The Plastic Bag Law"
 laws_of_bin_desc:0 "By charging for the bags that used to be free, we will turn a profit."
 turkish_islamist_schools_increased:0 "Turkish Islamist Schools"
 turkish_islamist_schools_increased_desc:0 "Islamic schools have been opened to promote religiosity in Turkey, costing the Kemalist parties votes. Stability will rise, but innovation may suffer."
 syrian_immigration_acted:0 "Managed Syrian Immigration"
 syrian_immigration_acted_desc:0 "During the Syrian Civil War, moderate numbers of Syrians began fleeing to Turkey, causing severe damage to Turkey's politics and economy. Angered by the influx, the nationalists stopped voting for the government and moved into opposition, while the EU's stance on the issue has also fueled opposition among secularists."
 TUR_russian_sanctions:0 "Russian Sanctions"
 TUR_russian_sanctions_desc:0 "Moscow's sanctions have cut off Russian tourists, Turkish fruit and vegetable exports and construction contracts in Russia."
 TUR_ozdag_interior_ministry:0 "Özdağ at the Interior Ministry"
 TUR_ozdag_interior_ministry_desc:0 "Ümit Özdağ runs the Interior Ministry as the Özdağ Protocol promised. Deportations and border controls come first, and every step he takes divides the coalition."
 workers_administration:0 "Labour Law"
 secular_state1:0 "Strengthened Secularism"
 secular_state1_desc:0 "Some tried to undermine the secularism Atatürk brought. They failed!"
 syrian_return:0 "The Return of the Syrians"
 syrian_return_desc:0 "We have begun sending back the Syrians who came to our country and damaged our economy and stability. This will satisfy the Turkish nationalists and weaken the opposition."
 TUR_westernism:0 "Turkish Westernism"
 CHP_constitution_TUR:0 "The Turkish Constitution"
 turk_ozel_kuvvetler:0 "Turkish Special Forces Command"
 turk_ozel_kuvvetler_desc:0 "The Special Forces Command (Özel Kuvvetler Komutanlığı) is a unit of the Turkish Armed Forces made up of elite soldiers of various classes and ranks, trained to operate in all terrain and climate conditions to eliminate internal and external threats. Its task is to carry out special operations beyond the capabilities of other military units."
