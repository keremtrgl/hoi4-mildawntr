 islamist_militias:0 "Organized Islamist Militias"
 islamist_militias_desc:0 "By forming Islamic militias, we will strengthen our country militarily. There is nothing we cannot do with the power of faith."
 power_of_the_caliph:0 "Sunni Caliphate"
 power_of_the_caliph_desc:0 "Sunni Islam is the largest branch of Islam. Its name comes from the word Sunnah, referring to the exemplary conduct of the Prophet Muhammad. The differences between Sunni and Shia Muslims arose from a dispute over the choice of Muhammad's successor and later took on broader political significance, as well as theological and legal dimensions."
