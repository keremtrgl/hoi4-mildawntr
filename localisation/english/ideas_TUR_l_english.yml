 #BONUS:
 #Turkey ideas
 pkk_terror_idea: "PKK Insurgency"
 pkk_terror_idea_desc: "The Kurdistan Workers' Party (Partiya Karkerên Kurdistanê in Kurdish) is a militant, left-wing Kurdish separatist group that has been active in Turkey since the 1970s. Claiming to fight for Kurdish self-determination, it continues to claim many lives with its attacks, often resorting to terrorist tactics."
 sympathetic_professors: "Sympathetic College Professors"
 sympathetic_professors_desc: "Many of our college professors and scholars hold communist or socialist views, and so support and encourage opinions sympathetic to the PKK insurgency."
 sympathetic_professors_dealt_with: "Non-Sympathetic Professors"
 sympathetic_professors_dealt_with_desc: "Professors who were once sympathetic to the PKK have either been purged or persuaded not to criticize the government's counter-terrorism operations."
 outposts_problem: "Outposts Problem"
 outposts_problem_desc: "Every so often we receive news that one or more of our outposts in the East have come under attack. This is costing us too many lives and damaging our government's political credibility."
 outposts_strenghtened_1: "Better Outposts I"
 outposts_strenghtened_1_desc: "We have found the necessary funds and drafted blueprints for our new outposts in the eastern regions. We can get to work now."
 outposts_strenghtened_2: "Better Outposts II"
 outposts_strenghtened_2_desc: "As a pilot project, construction has begun on some of our new outposts. The terrorists are aware of our plans too, however, and are trying to slow us down. There is no noticeable drop in their activity yet."
 outposts_strenghtened_3: "Better Outposts III"
 outposts_strenghtened_3_desc: "Our most vulnerable positions have been fortified with new structures. They are no longer attacked as often, and can repel the attacks that do come. The opposition can no longer object to our outpost plans."
 outposts_strenghtened_4: "Better Outposts IV"
 outposts_strenghtened_4_desc: "Old outposts that we no longer need have been dismantled, freeing up a great deal of resources and manpower for other projects."
 outposts_strenghtened_5: "Better Outposts V"
 outposts_strenghtened_5_desc: "Our intelligence reports that the terrorists are struggling to find even simple land routes for supply and smuggling. The tactical dams were an excellent idea."
 outposts_strenghtened_6: "Better Outposts VI"
 outposts_strenghtened_6_desc: "All the necessary steps for our fixed outposts have been taken. No terrorist attacks on them have been reported for some time now."
 air_strike_cooldown: "Air Strike Cooldown"
 security_cooldown: "Land Offensive Cooldown"
 kurds_want_independence: "The Kurdish Question"
 kurds_want_independence_desc: "Turkey has a large Kurdish minority, heavily concentrated in the southeast of the country. Throughout the history of the Republic, Kurds have suffered disproportionately from poverty, violence and discrimination. If we do not improve the situation in the Kurdish regions, many may be driven into the arms of terrorist groups such as the PKK."
 protest_thingy: "Political Pressure"
 protest_thingy_desc: "We cannot carry out any military operations for some time, as several foreign nations have issued a diplomatic protest accusing us of committing genocide."
 treat_wounds: "Recovering From The Last Attack"
 treat_wounds_desc: "We have taken heavy damage from the recent attack. It is time to put everything else aside and focus on repairing it."
 kurdish_language_problem: "Kurdish Language Xenophobia"
 kurdish_language_solutions_1: "Kurdish Xenophobia"
 kurdish_language_solutions_2: "Kurdish Language Freedom"
 kurdish_language_solutions_3: "Kurdish Schools and Universities"
 kurdish_language_solutions_4: "Kurdish TV Channels Permitted"
 kurdish_language_solutions_5: "Kurdish TV And Free Language" 

 TUR_republicanism:0 "Republicanism"
 TUR_republicanism_desc:1 "For independence is the absolute right of my God-worshipping nation!"
 TUR_nationalism:0 "Nationalism"
 TUR_nationalism_desc:1 "Fear not; for the crimson banner that proudly ripples in this glorious dawn shall not fade before the last fiery hearth that is ablaze within my homeland is extinguished. For that is the star of my people, and it will forever shine; it is mine; and solely belongs to my valiant nation."
 TUR_populism:0 "Populism"
 TUR_populism_desc:1 "Who would not sacrifice their life for this paradise of a country? Martyrs would burst forth should one simply squeeze the soil! Martyrs!"
 TUR_reformism:0 "Reformism"
 TUR_reformism_desc:1 "The horizons of the West may be bound with walls of steel, but my borders are guarded by the mighty bosom of a believer. Let it bellow out, do not be afraid! And think: how can this fiery faith ever be extinguished, by that battered, single-fanged monster you call "civilization"?"
 TUR_revolutionism:0 "Revolutionism"
 TUR_revolutionism_desc:1 "So ripple and wave like the bright dawning sky, oh thou glorious crescent, so that our every last drop of blood may finally be blessed and worthy! Neither you nor my kin shall ever be extinguished!"

