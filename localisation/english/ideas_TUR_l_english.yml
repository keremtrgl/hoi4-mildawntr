l_english:
  ###Turkey Ideas
 akp_movement:0 "The §Y[Neutral_Muslim_Brotherhood_L]§! Movement"
 akp_movement_desc:0 "With the country's economy in bad shape, Recep Tayyip Erdoğan and Abdullah Gül founded the §Y[Neutral_Muslim_Brotherhood_L]§!, and the §Y[Neutral_Muslim_Brotherhood_L]§! quickly began winning votes across the country."
 open_minded_islamist_movement:0 "Liberalism With Islam"
 open_minded_islamist_movement_desc:0 "The §Y[Neutral_Muslim_Brotherhood_L]§! is taking small steps to modernize the country's religious population, increasing its share of the vote."
 strong_islamist_movement:0 "The New Islamist Movement"
 strong_islamist_movement_desc:0 "The §Y[Neutral_Muslim_Brotherhood_L]§! is taking huge steps to modernize the country's religious population, increasing its share of the vote."
 increased_army_payments:0 "Increased Military Pay"
 mit:0 "Milli İstihbarat Teşkilatı"
 mit_desc:0 "MİT is responsible for gathering intelligence on existing and potential internal and external threats to the territory, people, integrity, existence, independence and security of the Republic of Turkey, and to every element of its constitutional order and national power. It passes this intelligence on to the President, the Chief of the General Staff, the Secretary General of the National Security Council and other relevant state bodies as needed."
 lira_1:0 "Yeni Türk Lirası"
 lira_1_desc:0 "The Turkish lira is vital to the people of Turkey. When it loses value, the country is destabilized; when it gains value, stability rises. \n\n§YThe Turkish lira needs reform!§!\n§YStatus: §RPoor§!"
