 power_on_bosporus:0 "The Montreux Convention Confirmed"
 power_on_bosporus_desc:0 "The Montreux Convention Regarding the Regime of the Straits is a 1936 agreement that gives Turkey control over the Bosphorus and the Dardanelles and regulates the transit of warships. It guarantees civilian vessels free passage in peacetime and restricts the passage of warships of non-Black Sea states. Its terms have been controversial over the years, most notably regarding the Soviet Union's naval access to the Mediterranean. \n\nSigned on 20 July 1936 at the Montreux Palace in Switzerland, the Convention allowed Turkey to remilitarize the Straits. It entered into force on 9 November 1936, was registered in the League of Nations Treaty Series on 11 December 1936 and remains in force today."
 senfoni_orkestrasi:0 "Tin Tin Symphony Orchestra"
 senfoni_orkestrasi_desc:0 "The Symphony Orchestra must never fall silent; it plays 24/7, and so our stability is assured."
 force_people_to_go_school:0 "Compulsory Schooling"
 bank_education:0 "Banking Education"
 bank_education_desc:0 "Our people should be taught how to run banks, so that they can manage them with ease. The banks are our right arm."
 hard_capitalism:0 "Hard Capitalism"
 hard_capitalism_desc:0 "Capitalism is the only force that will drive this country's development. Like the Turkish Armed Forces, it is one of our country's unshakable pillars."
 capitalim_spreader:0 "Spreader of Capitalism"
 capitalim_spreader_desc:0 "The people want capitalism, not communism, so we will strengthen capitalism by spreading it across the world order."
 guardians_of_the_liberalism:0 "Guardians of Liberalism"
 guardians_of_the_liberalism_desc:0 "We are the guardians of capitalism and liberalism. These principles must live forever; if they cannot, they must be reformed and strengthened further. Strong capitalism and liberalism mean a strong world state."
 mass_banking1:0 "Turkish Banking"
 mass_banking1_desc:0 "Our country's course depends on these banks: a banking collapse would mean the collapse of the economy. That is why we must support and grow our banks and strengthen our country. As the banks grow stronger, our people's prosperity will rise and our country will reach new heights. The banks are one of the guardians of liberalism. \n\n§YThe bankers must gain more power!§!\n§YBanking Level: §RVery Low§!"
 mass_banking2:0 "Turkish Banking"
 mass_banking2_desc:0 "Our country's course depends on these banks: a banking collapse would mean the collapse of the economy. That is why we must support and grow our banks and strengthen our country. As the banks grow stronger, our people's prosperity will rise and our country will reach new heights. The banks are one of the guardians of liberalism. \n\n§YThe bankers must gain more power!§!\n§YBanking Level: §RLower-Medium§!"
 mass_banking3:0 "Turkish Banking"
 mass_banking3_desc:0 "Our country's course depends on these banks: a banking collapse would mean the collapse of the economy. That is why we must support and grow our banks and strengthen our country. As the banks grow stronger, our people's prosperity will rise and our country will reach new heights. The banks are one of the guardians of liberalism. \n\n§YThe bankers must gain more power!§!\n§YBanking Level: §RLow§!"
 mass_banking4:0 "Turkish Banking"
 mass_banking4_desc:0 "Our country's course depends on these banks: a banking collapse would mean the collapse of the economy. That is why we must support and grow our banks and strengthen our country. As the banks grow stronger, our people's prosperity will rise and our country will reach new heights. The banks are one of the guardians of liberalism. \n\n§YThe bankers must gain more power by joining the EU!§!\n§YBanking Level: §RNearly Medium§!"
 mass_banking5:0 "European-Style Turkish Banking"
 mass_banking5_desc:0 "Our country's course depends on these banks: a banking collapse would mean the collapse of the economy. That is why we must support and grow our banks and strengthen our country. As the banks grow stronger, our people's prosperity will rise and our country will reach new heights. The banks are one of the guardians of liberalism. \n\n§YBanking Level: §YMedium§!"
