 media_opinion_towards_bad_2_neutral_left_wing_sad:0 "The Turkish Media"
 media_opinion_towards_bad_2_neutral_left_wing_sad_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 media_opinion_towards_bad_2_neutral_right_wing_sad:0 "The Turkish Media"
 media_opinion_towards_bad_2_neutral_right_wing_sad_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 media_opinion_towards_bad_2_right_left_wing_sad:0 "The Turkish Media"
 media_opinion_towards_bad_2_right_left_wing_sad_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 media_opinion_towards_bad_3_right_left_neutral_wing_sad:0 "The Turkish Media"
 media_opinion_towards_bad_3_right_left_neutral_wing_sad_desc:0 "The Turkish media has the power to sway daily politics, and its final display of power is always in the streets. That makes it a dangerous force, so we must silence it by intervening in the media, whatever it takes."
 harsh_quotas_of_industrialism:0 "Harsh Industrial Quotas"
 harsh_quotas_of_industrialism_desc:0 "We will rapidly transform our country by forcing the people to industrialize, all in the name of a stronger state!"
 turkish_space_program_ldp:0 "Turkish Space Program"
 turkish_space_program_ldp_desc:0 "We have launched the Turkish space program. With it, we will be able to send our Ankara into space."
 new_engines_ldp:0 "Fast Engines"
 new_engines_ldp_desc:0 "By boosting innovation in the engine industry, we will make our engines faster, which will help us develop both in arms and in civilian use."
 mass_technologism_of_private:0 "Mass Patenting of the Wrong Things"
 space_engineering:0 "Space Engineering"
 space_engineering_desc:0 "Through our work in aerospace engineering, we will be able to send large numbers of Ankarans into space."
 trickling_up_the_wealth:0 "Trickle-Up Wealth"
 trickling_up_the_wealth_desc:0 "We will shift money from the bottom to the top so that the rich get richer and the poor get poorer. Thus liberalism will reach its utopia!"
 income_maximization:0 "General Income Maximization"
 income_maximization_desc:0 "We will set out to maximize every possible profit in the country. A profit not maximized is no profit at all."
 biased_institutionalism:0 "Biased Institutionalism"
 biased_institutionalism_desc:0 "Institutionalization can be carried out with bias. Institutions built on partiality need not always fail."
 biased_democratic_institutionalism:0 "Biased Democratic Institutionalism"
 biased_democratic_institutionalism_desc:0 "Institutionalization can be carried out with bias. Institutions built on partiality need not always fail."
 law_and_economic_unity:0 "Legal and Economic Unity"
 law_and_economic_unity_desc:0 "By uniting law and economics, we will ensure the peaceful development of the economy, as liberal theory generally prescribes..."
 law_and_economic_unity_partial:0 "A Fake Union of Law and Economics"
 law_and_economic_unity_partial_desc:0 "By uniting the economy with the law, we will ensure its peaceful development, though we can corrupt the law from time to time to get rich."
 worldwide_engine:0 "The Worldwide Market Engine"
 power_of_globalization:0 "Power Of Globalization"
 power_of_globalization_desc:0 "Globalization makes us strong, so we must keep living with it and crush its opponents."
 glass_production:0 "Mass Glass Production"
 glass_production_desc:0 "We have built glass industries that will let us make high-margin profits."
 fake_law_protectionism:0 "Sham Legal Protection"
 fake_law_protectionism_desc:0 "By drafting fake laws, we will confuse the bureaucracy and muddle patent rights, making patent theft easier."
 mass_constructionism:0 "Mass Construction"
 mass_constructionism_desc:0 "We will build offices and industry everywhere, and liberalism will become self-sustaining."
 mass_the_innovationalism:0 "Mass Innovation"
 mass_the_innovationalism_desc:0 "By pushing innovation to the cutting edge, we will make our country a scientific leader. This will be good for our country..."
 mass_the_innovationalism_2:0 "Mass Innovation"
 mass_the_innovationalism_2_desc:0 "By pushing innovation to the cutting edge, we will make our country a scientific leader. This will be good for our country..."
 mass_constructionism_2:0 "Mass Construction"
 mass_constructionism_2_desc:0 "We will build offices and industry everywhere, and liberalism will become self-sustaining."
 mass_constructionism_3:0 "Mass Construction"
 mass_constructionism_3_desc:0 "We will build offices and industry everywhere, and liberalism will become self-sustaining."
 sending_ankara_to_the_space:0 "Sending Ankara Into Space"
 sending_ankara_to_the_space_desc:0 "Under the plan to send Ankara into space, we have begun sending Ankarans into space. We hope the plan succeeds."
 AI_powerhold_1:0 "Majority Opinion"
 AI_powerhold_1_desc:0 "The Turkish people back this side. People's thinking is interesting, wherever you are."
 AI_powerhold_2:0 "Majority Opinion"
 AI_powerhold_2_desc:0 "The Turkish people back this side. People's thinking is interesting, wherever you are."
 AI_powerhold_3:0 "Majority Opinion"
 AI_powerhold_3_desc:0 "The Turkish people back this side. People's thinking is interesting, wherever you are."
 AI_powerhold_4:0 "Majority Opinion"
 AI_powerhold_4_desc:0 "The Turkish people back this side. People's thinking is interesting, wherever you are."
 limits_of_the_parliament_main_target:0 "Limits on Parliament"
 limits_of_the_parliament_main_target_desc:0 "Parliament can keep us out of any war by following its own views. To overcome this obstacle, we can either persuade Parliament to go to war and break the status quo, or disable it for good under an authoritarian regime."
 
 power_of_the_law:0 "The Power of Law"
 power_of_the_law_desc:0 "Laws must always be strengthened. Strong laws mean strong stability and unity; throughout history, lawless states have always collapsed."
 power_and_unity_of_the_law:0 "The Power and Unity of Law"
 power_and_unity_of_the_law_desc:0 "Laws must always be strengthened. Strong laws mean strong stability and unity; throughout history, lawless states have always collapsed."
 power_and_unity_of_the_law_2:0 "The Power and Unity of Law"
 power_and_unity_of_the_law_2_desc:0 "Laws must always be strengthened. Strong laws mean strong stability and unity; throughout history, lawless states have always collapsed."
 european_colleges_for_turkey:0 "European-Founded Colleges"
 european_colleges_for_turkey_desc:0 "The Europeans have built new research colleges here, which will bring European knowledge into our country indirectly."
 university_coercion:0 "Compulsory University Education"
 university_coercion_desc:0 "Educating people up to high school is not enough; everyone must go to university. University graduates are the cornerstone of a cultured, well-rounded generation."
 expanded_faculties:0 "Expanded Faculties"
 expanded_faculties_desc:0 "Universities need more faculties, because people deserve to study the subjects they want. Diversity will give our country vigor."
 act_of_copyright:0 "The Copyright Act"
 act_of_copyright_desc:0 "We have introduced new laws to protect copyright in our country. Protecting copyright will speed up our research and build an atmosphere of trust."
 rise_of_depoliticalization:0 "The Rise of Depoliticization"
 rise_of_depoliticalization_desc:0 "Clearly, politics has brought our country hardships it did not deserve. That is why we are running a propaganda campaign to depoliticize our state and people. Once our country sheds its political character, it will reach the unity and solidarity it deserves."
 bureocratic_reorganization:0 "Bureaucratic Reorganization"
 bureocratic_reorganization_desc:0 "The bureaucracy has suffered heavy damage lately. We will now put it on a legal footing and restore bureaucratic order."
 social_critiction:0 "Social Criticism"
 social_critiction_desc:0 "We must address the critical problems in social life; if we don't, we will struggle to escape our difficulties."
 uncontrolled_senate:0 "The Function of the Senate"
 uncontrolled_senate_desc:0 "We have transferred some of Parliament's powers to our newly founded Senate, but the transfer has caused chaos. Over time, the balance of power will settle."
 eu_style_legislative:0 "EU-Style Legislation"
 eu_style_legislative_desc:0 "We will move to a European-style legislative system, which will broaden and speed up our justice system and raise stability."
 european_parliament_membership:0 "European Parliamentary Membership"
 european_parliament_membership_desc:0 "We are not a member of the European Union, but we have secured a place in the European Parliament. This will strengthen us politically and economically."
 passive_european_membership:0 "Passive EU Member"
 passive_european_membership_desc:0 "We are not a full member of the European Union, but we hold sway in EU affairs. We can now begin preparing for full membership."
 observer_of_the_frontex:0 "Frontex Observer Status"
 observer_of_the_frontex_desc:0 "Frontex is the European Union's protective wall. Even a small stake in it is enough to protect our borders and internal security."
 turkish_presidency_weakened:0 "A Weakened Turkish Presidency"
 turkish_presidency_weakened_desc:0 "The presidential system has harmed our country by concentrating too much power. It must be weakened."
 financed_balkans:0 "Foreign Financing"
 financed_balkans_desc:0 "We have secured financing from abroad, one of the cornerstones of a strong economy."
 expat_credits:0 "Expat Credits"
 expat_credits_desc:0 "We have begun borrowing from our workers abroad. These loans will reduce our current account deficit and pay off as solid income."
 attainable_kurdish_policies:0 "Workable Kurdish Policy"
 attainable_kurdish_policies_desc:0 "The maritime dispute between Greece and Turkey has been settled decisively. This brings peace and calm while reducing competition. Some decline in industry is an acceptable price for peace..."
 EEZ_settled:0 "The EEZ Settlement"
 EEZ_settled_desc:0 "The maritime dispute between Greece and Turkey has been settled decisively. This brings peace and calm while reducing competition. Some decline in industry is an acceptable price for peace..."
 military_s_council:0 "The Military Council"
 military_s_council_desc:0 "This defense council works above the defense ministry, making decisions by joint vote so that they come out less radical."
 policy_maker_s_council:0 "The Policy Council"
 policy_maker_s_council_desc:0 "This policy council works above the political ministries, making decisions by joint vote so that they come out less radical."
 economist_s_council:0 "The Economists' Council"
 economist_s_council_desc:0 "This economists' council works above the economy ministry, making decisions by joint vote so that they come out less radical."
 collected_powers:0 "The Concentrated Powers of the Regime"
 collected_powers_desc:0 "With the regime's legislative, executive and judicial machinery run by a single hand, complete political unity has been established in our country. This will ease our political burden."
 art_of_social_sciences:0 "The Art of Social Sciences"
 art_of_social_sciences_desc:0 "Through the social sciences, we will better understand our people's problems, so that even the most tangled issues can be resolved very quickly."
 politics_of_recovery_and_revision:0 "The Politics of Recovery and Revision"
 politics_of_recovery_and_revision_desc:0 "It would be wise to anticipate the problems our policies may cause. That is why we will grow by pursuing strategies of political revision and repair."
 diversification_of_economy:0 "Diversifying the Economy"
 diversification_of_economy_desc:0 "Diversifying our economy will shield it from certain risks, paving the way for healthy growth in an atmosphere of trust."
 conjuctur_politik:0 "Business Cycle Policy"
 conjuctur_politik_desc:0 "The global economic cycle is constantly shifting, so pursuing an integrated policy is vital. If we ignore such policies, we will find ourselves in trouble."
 a_new_faith_has_risen:0 "The Rise of a New Faith"
 a_new_faith_has_risen_desc:0 "We have arrived at a whole new understanding of destiny, with which we will put our country on good, solid ground."
 gems_of_innovation:0 "Houses of Innovation"
 gems_of_innovation_desc:0 "Innovation lets a country develop in every respect. That is why boosting innovation is a matter of our country's survival and development."
 supported_academicians:0 "Supported Academics"
 land_of_innovational_technocracy:0 "Land of Innovative Technocracy"
 land_of_innovational_technocracy_desc:0 "We have become one of the rare states run as an innovative technocracy. This ideological structure lets us make great scientific progress in every sector."
 harmony_of_workers:0 "The Harmonious Workers' Movement"
 harmony_of_workers_desc:0 "We must support the labor movement to the fullest; otherwise our workers may face serious problems and our industry will slow down."
 harmony_of_workers_2:0 "The Harmonious Workers' Movement"
 harmony_of_workers_2_desc:0 "We must support the labor movement to the fullest; otherwise our workers may face serious problems and our industry will slow down."
 rise_of_absolutism:0 "The Rise of Absolutism"
 rise_of_absolutism_desc:0 "Indecision and uncertainty will be a thing of the past; such doubts are weakness and failure for humanity. The court's decision-making will solve our problems."
 rise_of_absolutism_2:0 "The Rise of Absolutism"
 rise_of_absolutism_2_desc:0 "Indecision and uncertainty will be a thing of the past; such doubts are weakness and failure for humanity. The court's decision-making will solve our problems."
 law_cyclation:0 "Flexible Laws"
 law_cyclation_desc:0 "Laws should be easy to change to fit the problems at hand. Easily amended laws will help build stability."
 engine_of_statistics:0 "The Engine of Statistics"
 engine_of_statistics_desc:0 "We have become a state run by statistics. Since statistics sum up our troubles, statistical solutions will make governing this nation easier."
 controlled_and_opened_senate:0 "The Function of the Senate"
 controlled_and_opened_senate_desc:0 "We have transferred some of Parliament's powers to our newly founded Senate, but the transfer has caused chaos. Over time, the balance of power will settle."
 absorbation_of_controlled_and_opened_senate:0 "The Function of the Senate"
 absorbation_of_controlled_and_opened_senate_desc:0 "We have transferred some of Parliament's powers to our newly founded Senate, but the transfer has caused chaos. Over time, the balance of power will settle."
 quality_audits:0 "Quality Audits"
 quality_audits_desc:0 "Quality control is always necessary; without it, the country's interests can only suffer."
 european_quality_life_standarts:0 "European Quality of Life Standards"
 european_quality_life_standarts_desc:0 "Our people deserve to enjoy the prosperity of the European Union, so we will bring them up to EU standards, even if we have to force it."
 kickstart_of_the_militarization:0 "Kickstarting Militarization"
 kickstart_of_the_militarization_desc:0 "We must militarize quickly; otherwise we risk falling behind other states militarily."
 media_independence_bolstering:0 "Bolstering Media Independence"
 media_independence_bolstering_desc:0 "Encouraging the media will raise our country's democratic standards and bring stability."
 managed_bureocracy:0 "Manage the Bureaucracy"
 managed_bureocracy_desc:0 "To keep the bureaucracy from running off course, it must be firmly managed. We will do this with bureaucratic control tools."
 open_innovationalism:0 "Open-Minded Innovation"
 open_innovationalism_desc:0 "The human mind is creative when free of pressure. Now that we have removed that pressure, creativity will drive great progress in our innovation."
 regulation_machine:0 "Regulation Machine"
 regulation_machine_desc:0 "Because we can issue regulations quickly, our state has become a regulation machine. Through regulation, we will become more prescriptive and disciplined."
 scientific_approachment_of_generations:0 "A Scientific Approach"
 sores_in_human_brilliance:0 "The Rise of Human Brilliance"
 sores_in_human_brilliance_desc:0 "The human mind can now develop to a high level, because the state exists to make it possible."
 foreseeing_the_future:0 "Foreseeing the Future"
 foreseeing_the_future_desc:0 "We must make well-founded predictions about the future. If we predict it correctly, we can turn any situation to our advantage."
 foreseeing_the_future_2:0 "Foreseeing the Future"
 foreseeing_the_future_2_desc:0 "We must make well-founded predictions about the future. If we predict it correctly, we can turn any situation to our advantage."
 guarded_under_the_NATO:0 "Under NATO's Protection"
 guarded_under_the_NATO_desc:0 "We are safe under NATO's military umbrella. This security gives us an advantage in almost everything and lets us develop with ease."
 protective_EU_membership:0 "Protective EU Agreements"
 protective_EU_membership_desc:0 "We have secured military solidarity with the European Union, giving us an extra measure of security and boosting peace at home."
 revenue_driven_industry:0 "Revenue-Driven Light Industry"
 revenue_driven_industry_desc:0 "Our industry must be able to grow without financial losses, so it can develop systematically on its own and the country can prosper."
 gateway_projection_status:0 "Gateway Project Revenues"
 gateway_projection_status_desc:0 "Turkey is a bridge between West and East, so trade naturally flows through it, letting us turn a good profit and develop well."
 german_universities:0 "German Universities"
 german_universities_desc:0 "We have opened German universities in our country, which will bring European science here and strengthen Turkish science."
 credit_law:0 "Credit Law"
 credit_law_desc:0 "We have passed a credit law aimed at financializing the country. This will make us richer and more resilient to economic crises."
 cautions_against_the_gulenist_movement:0 "Precautions Against the Gülen Movement"
 cautions_against_the_gulenist_movement_desc:0 "The Gülen movement is gaining strength in the country, and we must stop it. Announcing and implementing a number of measures will limit the harm to our country."
 cautions_against_the_gulenist_movement_2:0 "Precautions Against the Gülen Movement"
 cautions_against_the_gulenist_movement_2_desc:0 "The Gülen movement is gaining strength in the country, and we must stop it. Announcing and implementing a number of measures will limit the harm to our country."
 satisfied_regional_order:0 "General Order"
 satisfied_regional_order_desc:0 "We have secured general order. Terror will no longer be able to strike within this state's borders, and peace will last a long time."
 cautions_against_the_pkk_movement:0 "Precautions Against the PKK"
 cautions_against_the_pkk_movement_desc:0 "The PKK is gaining strength in the country, and we must stop it. Announcing and implementing a number of measures will limit the harm to our country."
 cautions_against_the_pkk_movement_2:0 "Precautions Against the PKK"
 cautions_against_the_pkk_movement_2_desc:0 "The PKK is gaining strength in the country, and we must stop it. Announcing and implementing a number of measures will limit the harm to our country."
 kurdish_approval:0 "Improved Kurdish Approval"
 kurdish_approval_desc:0 "Kurdish approval of the state has risen, and with it the PKK and other long-standing problems have greatly diminished."
 militarys_prisons:0 "Military Prisons"
 militarys_prisons_desc:0 "We have begun opening military prisons. This initiative has eased civilians' fears about the law and secured stability."
 turkish_federalization:0 "Turkish Federalization"
 turkish_federalization_desc:0 "We have begun a federalization process to make governing easier, which will let us develop more comfortably."
 war_with_hezbollah:0 "War With Hezbollah"
 war_with_hezbollah_desc:0 "Destroying Hezbollah is essential to peace in the Middle East; nothing is more necessary for the region's peace and tranquility."
 extensive_earthquake_repair:0 "Extensive Earthquake Recovery"
 extensive_earthquake_repair_desc:0 "The earthquake cost us many buildings and lives, causing great economic damage. We must move as fast as we can to recover from these losses."
 the_turkish_housing:0 "Turkish Housing"
 the_turkish_housing_desc:0 "Housing, or more generally living space, refers to the construction and use of houses or buildings, individually or collectively, for shelter. Housing ensures that members of society have somewhere to live, whether a home or another kind of dwelling, lodging or shelter. Many governments have one or more housing authorities, sometimes called a housing ministry or department."
 the_turkish_housing_2:0 "Turkish Housing"
 the_turkish_housing_2_desc:0 "Housing, or more generally living space, refers to the construction and use of houses or buildings, individually or collectively, for shelter. Housing ensures that members of society have somewhere to live, whether a home or another kind of dwelling, lodging or shelter. Many governments have one or more housing authorities, sometimes called a housing ministry or department."
 the_turkish_housing_3:0 "Turkish Housing"
 the_turkish_housing_3_desc:0 "Housing, or more generally living space, refers to the construction and use of houses or buildings, individually or collectively, for shelter. Housing ensures that members of society have somewhere to live, whether a home or another kind of dwelling, lodging or shelter. Many governments have one or more housing authorities, sometimes called a housing ministry or department."
 corruption_change_ease:0 "Easier Parliamentary Anti-Corruption Measures"
 economic_shifting_ease:0 "Easier Parliamentary Economic Measures"
 strikes_in_turkey:0 "Strikes in Turkey!"
 strikes_in_turkey_desc:0 "A strike, also called a labor strike, is a work stoppage caused by employees' mass refusal to work, usually in response to grievances."
 strikes_in_turkey_2:0 "Strikes in Turkey!"
 strikes_in_turkey_2_desc:0 "A strike, also called a labor strike, is a work stoppage caused by employees' mass refusal to work, usually in response to grievances."
 strikes_in_turkey_3:0 "Strikes in Turkey!"
 strikes_in_turkey_3_desc:0 "A strike, also called a labor strike, is a work stoppage caused by employees' mass refusal to work, usually in response to grievances."

 alliance_with_DISK:0 "Alliance With DİSK"
 alliance_with_DISK_desc:0 "DİSK is a major labor confederation in Turkey, known for its progressive stance and its advocacy of workers' rights. Working with DİSK and embracing its spirit means aligning with its principles, which usually include social justice, equality and workers' rights."
 alliance_with_TURK_IS:0 "Alliance With TÜRK-İŞ"
 alliance_with_TURK_IS_desc:0 "TÜRK-İŞ is a leading labor confederation in Turkey, and this alliance signals a shared commitment to the interests of Turkish workers. Allying with TÜRK-İŞ means aligning with its goals and values on labor rights and worker welfare, and a commitment to national unity and solidarity among Turkish workers."

 rise_of_the_wild_left:0 "The Rise of the Wild Left"
 rise_of_the_wild_left_desc:0 "The surge of the radical right has sparked a radical surge on the left, and these leftist radicals must be reined in immediately."

 a_new_kemalism:0 "New Kemalism"
 a_new_kemalism_desc:0 "The Kemalists set out to follow in Atatürk's footsteps. When Atatürk came back to life, he found that people had been applying Kemalism wrongly, and so Kemalism made the transition to a new order suited to modern life."
 ATA_return_of_the_father:0 "The Return of the Father"
 ATA_return_of_the_father_desc:0 "Mustafa Kemal is back. Factories reopen overnight, officials work through the night and the whole nation rallies behind the man who founded it."
 a_new_kemalism_2:0 "New Kemalism"
 a_new_kemalism_2_desc:0 "The Kemalists set out to follow in Atatürk's footsteps. When Atatürk came back to life, he found that people had been applying Kemalism wrongly, and so Kemalism made the transition to a new order suited to modern life."
 political_troubles_caused_by_modernity:0 "Reassessing the Situation"
 political_troubles_caused_by_modernity_desc:0 "Atatürk has come back to life, and it has not been easy for him. Used to his own era, he is unfamiliar with this high-tech world and its new politics. Over time, he will read new books and adapt."
 political_troubles_caused_by_modernity_2:0 "Reassessing the Situation"
 political_troubles_caused_by_modernity_2_desc:0 "Atatürk has come back to life, and it has not been easy for him. Used to his own era, he is unfamiliar with this high-tech world and its new politics. Over time, he will read new books and adapt."
 political_troubles_caused_by_modernity_3:0 "Reassessing the Situation"
 political_troubles_caused_by_modernity_3_desc:0 "Atatürk has come back to life, and it has not been easy for him. Used to his own era, he is unfamiliar with this high-tech world and its new politics. Over time, he will read new books and adapt."
 new_turkish_economics:0 "Ankara's Economic Missions"
 new_turkish_economics_desc:0 "Turkey's economy is a total wreck, so Atatürk convened the Ankara Economic Congress to save the situation. The congress drew up Turkey's plans for the future, and under the Ankara Mission Turkey will steadily achieve economic development."
 simultanous_switzerland:0 "A Switzerland of Its Own"
 simultanous_switzerland_desc:0 "Turkey will pursue a Swiss-style foreign policy. With it, our country will be able to deflect pressure from every side and will never face serious trouble."
 free_eu_visa_deal:0 "The EU Visa Deal"
 free_eu_visa_deal_desc:0 "The visa issue is very important for Turkey and must be resolved. We will push through visa liberalization by passing laws and making commitments to the European Union, speeding up Turkey's integration with the EU."
 model_the_euro:0 "A Euro-Modeled Currency"
 model_the_euro_desc:0 "We have no intention of abolishing the Turkish lira, but by adopting the euro model, we will make the lira valuable and stable. A strong, stable currency will help raise per capita income."
 balkan_investment_fund:0 "The Balkan Investment Fund"
 balkan_investment_fund_desc:0 "We have set up the Balkan Investment Fund to channel investment into the Balkans in stages. With it, the region's economic problems will ease and the region will flourish."
 blocked_immigrant_routes:0 "Blocked Migrant Routes"
 blocked_immigrant_routes_desc:0 "Because of the political crisis in the Middle East, migrants have massed at our borders. We must keep them out; an influx of migrants would put the country in a bad position."
 nationalist_charities:0 "The Rise of Nationalist Charities"
 nationalist_charities_desc:0 "Nationalist charities may work in a variety of areas, such as education, cultural preservation or political advocacy. Organizations promoting nationalist or political agendas may not be recognized as charities in every country, however, and their activities may face legal restrictions or scrutiny."
 mit_cap:0 "Expanded MİT Capacity"
 mit_cap_desc:0 "We have begun expanding MİT's capacity. With it, MİT will carry out more powerful and sophisticated intelligence operations."
 mit_decp:0 "Expanded MİT Decryption"
 mit_decp_desc:0 "We have begun expanding MİT's capabilities. With them, MİT will carry out more powerful and sophisticated intelligence operations."
 strenghtened_mit:0 "A Strengthened MİT"
 strenghtened_mit_desc:0 "MİT is responsible for gathering intelligence on existing and potential internal and external threats to the territory, people, integrity, existence, independence and security of the Republic of Turkey, and to every element of its constitutional order and national power. It passes this intelligence on to the President, the Chief of the General Staff, the Secretary General of the National Security Council and other relevant state bodies as needed."
 educational_reformation:0 "Raised Educational Standards"
 educational_reformation_desc:0 "Atatürk's reforms will improve education. Improving the education system and policy and supporting national education is the only way forward for Turkey's development."
 educational_reformation_2:0 "Raised Educational Standards"
 educational_reformation_2_desc:0 "Atatürk's reforms will improve education. Improving the education system and policy and supporting national education is the only way forward for Turkey's development."
 educational_reformation_3:0 "Raised Educational Standards"
 educational_reformation_3_desc:0 "Atatürk's reforms will improve education. Improving the education system and policy and supporting national education is the only way forward for Turkey's development."
 sumerian_turkey:0 "Sumerian Turkey"
 sumerian_turkey_desc:0 "According to the Sun Language Theory, the Sumerians were a Turkic people from Central Asia who made great contributions in ancient times, and today's Turkey is their heir."
 quality_first:0 "The Rise of Quality"
 quality_first_desc:0 "The "rise of quality" refers to the growing focus on producing goods and services that meet high quality standards, driven by advances in technology, changing consumer preferences and increased competition in many industries."
 turkish_culture_state:0 "Turkish Culture"
 turkish_culture_state_desc:0 "Thanks to its geography, Turkey is home to many different cultures. These cultural treasures will make our country a tourist attraction and a cultural center, giving the Turkish people a rich culture."
 the_turkish_competition:0 "Turkish Economic Competition"
 the_turkish_competition_desc:0 "We will pass a law aimed at boosting competitiveness. With greater competitiveness, our goods will become stronger in the markets, and our economy will grow durable and strong."
 the_rationality:0 "Rational Values"
 the_rationality_desc:0 "We will build rational thinking in Atatürk's Turkey. Thinking realistically, our people will make their choices on a rational, science-based footing, and this new rational climate will produce many practical benefits, such as solving crises."
 systematic_industry:0 "Sound Foreign-Inspired Industrial Chains"
 systematic_industry_desc:0 ""Foreign-inspired industrial chains" generally refers to supply or value chains in an industry that are shaped by foreign companies or global trends."
 benefits_of_neutrality:0 "The Benefits of Semi-Neutrality"
 benefits_of_neutrality_desc:0 ""Semi-neutrality" describes a situation in which a country or organization tries to stay relatively neutral or impartial in a particular conflict or issue while still taking some form of action or involvement."
 volunteers_of_the_arabic_spring:0 "Volunteers of Freedom"
 volunteers_of_the_arabic_spring_desc:0 "The Middle East is in political turmoil. Through our own interventions abroad, we will put a stop to it, remove the effects of regional instability and make the country more stable and prosperous."
 med_navy_expansion:0 "Anti-Egyptian Naval Militarization"
 med_navy_expansion_desc:0 "Egypt is pursuing a course contrary to our interests in the region. To realize our Blue Homeland vision, we must strengthen our navy, disrupting Egyptian influence in the region and making our fleet stronger and more resilient."
 weapon_localization_timed:0 "Localizing American Weaponry"
 weapon_localization_timed_desc:0 "We have acquired the military equipment we need from the United States. Now, by localizing its production, we will turn Turkey into a war machine."
 power_of_the_nationalism:0 "Power of Nationalism"
 power_of_the_nationalism_desc:0 "This country draws its strength from people who love their nation, and it always will. Long live Turkish nationalism, which embraces the Turkish people! "How happy is the one who says 'I am a Turk'!""
 mosque_law:0 "The Mosque Law"
 mosque_law_desc:0 "We have passed a new mosque law under which imams and religious officials can no longer spread political propaganda in mosques. This will bring calm to political and religious life."
 counter_religion_politicization:0 "Counter Religion Politicization"
 counter_religion_politicization_desc:0 "We must stamp out radicalization! As part of a range of policies to that end, we will keep mosques under supervision and prevent radical imams from emerging."
 the_land_of_religions:0 "The Land Of Free Religions"
 the_land_of_religions_desc:0 "Being a secular state does not mean we are not a land of religious freedom. We will let every religion practice freely in our country, and we will live in religious peace. Religious stability means development."
 general_unionization:0 "The Unionization Campaign"
 general_unionization_desc:0 "A unionization campaign is an effort by employees to organize into a union that represents their collective interests at work. It usually involves several steps, including informing employees about the benefits of unionizing, collecting signatures or authorization cards from supporters, and negotiating with the employer to recognize the union and begin collective bargaining."
 unemployment_planning_1:0 "The Employment Missions"
 unemployment_planning_1_desc:0 "With structural reforms, we will break the back of unemployment, with the help of the unions, our workers' trust in the state and the support they generate across many sectors. The nation is here!"
 unemployment_planning_2:0 "The Employment Missions"
 unemployment_planning_2_desc:0 "With structural reforms, we will break the back of unemployment, with the help of the unions, our workers' trust in the state and the support they generate across many sectors. The nation is here!"
 a_working_state:0 "A Working State"
 a_working_state_desc:0 "We have begun turning our country into a land of science. It will be home to happy, forward-looking people, and Turkey will develop in every way."
 functional_YSK:0 "An Independent YSK"
 functional_YSK_desc:0 "A free and impartial Supreme Electoral Council requires establishing and protecting the board's independence and impartiality. This means appointing its members through a transparent, fair process that weighs their qualifications and experience, and giving them the resources and support they need to do their work effectively."
 reorganized_AYM:0 "The Reorganized AYM"
 reorganized_AYM_desc:0 "A well-organized, effective Constitutional Court requires a commitment to transparency, independence and accountability, and a willingness to invest in the resources and support judges need to do their work effectively."
 natural_transformation:0 "The Natural Transformation"
 natural_transformation_desc:0 "Our people will go through a natural transformation driven by new policies, bringing a broad, basic sense of stability and order."
 national_wisdom:0 "National Wisdom"
 national_wisdom_desc:0 ""National wisdom" describes the collective intelligence, insight and knowledge of a nation: the accumulated experience and understanding of a society, including its history, culture, traditions and values."
 nuclear_energy_project:0 "The Turkish Nuclear Energy Project"
 nuclear_energy_project_desc:0 "The Republic of Turkey must not fall behind in nuclear technology. That is why, guided by Atatürk, we are adopting an innovative nuclear doctrine and pushing for breakthroughs in nuclear reactors. Through this comprehensive program, we will achieve success and stability. Long live the homeland and freedom! We will always protect our borders!"
 nuclear_energy_project_2:0 "The Turkish Nuclear Energy Project"
 nuclear_energy_project_2_desc:0 "The Republic of Turkey must not fall behind in nuclear technology. That is why, guided by Atatürk, we are adopting an innovative nuclear doctrine and pushing for breakthroughs in nuclear reactors. Through this comprehensive program, we will achieve success and stability. Long live the homeland and freedom! We will always protect our borders!"
 nuclear_energy_project_3:0 "The Turkish Nuclear Energy Project"
 nuclear_energy_project_3_desc:0 "The Republic of Turkey must not fall behind in nuclear technology. That is why, guided by Atatürk, we are adopting an innovative nuclear doctrine and pushing for breakthroughs in nuclear reactors. Through this comprehensive program, we will achieve success and stability. Long live the homeland and freedom! We will always protect our borders!"
 space_intelligence:0 "Space Intelligence"
 space_intelligence_desc:0 "By expanding our technology and satellite power in space, we will boost our espionage and surveillance capabilities there. These new possibilities will give us astropolitical power."
 state_realism:0 "Realist Values"
 state_realism_desc:0 "We will build realistic thinking in Atatürk's Turkey, and with it our country will develop on a reality-based footing. This is a great asset for Turkey's stability."
 ataturk_innovationalism:0 "Kemalist Innovation"
 ataturk_innovationalism_desc:0 "Atatürk's thought is also innovative thought. Thanks to it, our country will become a center of technology."
 promising_investors:0 "Promising Investors"
 promising_investors_desc:0 "Investors stayed away because the Turkish economy was a total wreck. Now, with Ankara's new incentives, our country will draw confident domestic and foreign investors like a magnet and grow stronger."
 promising_investors_2:0 "Promising Investors"
 promising_investors_2_desc:0 "Investors stayed away because the Turkish economy was a total wreck. Now, with Ankara's new incentives, our country will draw confident domestic and foreign investors like a magnet and grow stronger."
 tank_research_office:0 "The Tank Research Office"
 tank_research_office_desc:0 "Turkey has disappointed Atatürk when it comes to the tank industry. He saw it as one of our top potential export sectors, not something left to wither as it is today. Atatürk is now setting up these development offices to correct the Turkish nation's mistakes..."
 tank_research_office_2:0 "The Tank Research Office"
 tank_research_office_2_desc:0 "Turkey has disappointed Atatürk when it comes to the tank industry. He saw it as one of our top potential export sectors, not something left to wither as it is today. Atatürk is now setting up these development offices to correct the Turkish nation's mistakes..."
 plane_research_office:0 "The Aircraft Research Office"
 plane_research_office_desc:0 "Turkey has disappointed Atatürk when it comes to the aircraft industry. He saw it as one of our top potential export sectors, not something left to wither as it is today. Atatürk is now setting up these development offices to correct the Turkish nation's mistakes..."
 reissuing_peace_in_the_region:0 "Bringing Peace to the Region"
 reissuing_peace_in_the_region_desc:0 ""Peace at home, peace in the world" cannot be achieved in the current climate. Our neighbors are in complete turmoil, and we must pull them out of this mess and secure regional stability, which we can do through decisive interventions. That is why we are setting aside the pure peace policy and, while protecting our own interests and national aspirations, beginning to turn the region into an axis of peace."
 the_eximbank_improvement:0 "Improving Eximbank"
 the_eximbank_improvement_desc:0 "Eximbank is an institution established by a Council of Ministers decision published in the Official Gazette on 21 August 1987 to provide loans for export development. From 1987 until 2012, Türk Eximbank's headquarters were in Ankara; in 2012 it moved to Ümraniye to be closer to exporting companies. The bank has 3 regional directorates in Istanbul, Ankara and İzmir, 20 branches and 12 liaison offices."
 wage_improvement:0 "Wage Policies"
 wage_improvement_desc:0 "The financial well-being of the people ensures the continuity of the country. That is why the state will provide people with extra financial support, bringing overall financial gains for both the people and the state."
 family_and_youth_bank:0 "Family And Youth Bank"
 family_and_youth_bank_desc:0 "We encourage our young people to start families. We will give marriage loans to newlyweds and set up a Family and Youth Bank to support young people, funded by natural gas revenues. We will stand by them with grants and incentive programs."
 turkiye_ekseni:0 "The Turkish Axis"
 turkiye_ekseni_desc:0 "The main goal of our foreign policy in the Century of Türkiye is to build the Türkiye Axis. We will strengthen it together with 85 million Turkish citizens, our kin beyond our borders, and our friends and allies around the world."
 turkish_genom_project:0 "Turkish Genome Project"
 turkish_genom_project_desc:0 "The Turkish Genome Project (TGP) was a national scientific research project in Turkey to determine the base pairs that make up human DNA and to identify, map and sequence all the genes of the human genome from both a physical and a functional standpoint."
 justice_lessons:0 "Justice Lessons"
 justice_lessons_desc:0 "Justice lessons play a crucial role in society, teaching individuals about the principles of justice, the rule of law and the importance of fairness and equality."
 e_turquality:0 "E-Turquality"
 e_turquality_desc:0 "E-Turquality (Stars of Informatics) is a support program for the development of the IT sector and its sub-sectors in our country, encouraging innovation and aiming to create regional and global unicorns that can compete in international markets."
 cimer_question:0 "CİMER Reformed"
 cimer_question_desc:0 "The Presidential Communication Center (CİMER) is a system founded in 2015 that allows Turkish citizens to contact the Presidency with complaints or requests for information. The agency must respond within 15 or 30 days, depending on the type of request."
 traditional_education:0 "Traditional Education"
 traditional_education_desc:0 "Traditional education refers to the conventional form of education that has prevailed for centuries, typically involving teacher-centered instruction, a standardized curriculum and classroom-based learning. Though it has long been the dominant model, alternative educational approaches have received growing emphasis in recent years."
 the_national_front:0 "Presidential Fronts"
 the_national_front_desc:0 "Our country has developed under the new system and, by making up for its shortcomings, gained solid authority and power. The system has made us politically stronger and forged a state ready for war. The New Turkey has been strengthened by these breakthroughs. Long live the Second Century of Turkey!!"
 zafer_tourism:0 "Zafer Tourism"
 zafer_tourism_desc:0 "The Zafer Party has announced on its social media accounts that it has launched an election campaign called "Zafer Tourism", raising money from voters with a promise to send refugees home by bus."
 zafer_mancinik:0 "Zafer Mancınık"
 zafer_mancinik_desc:0 "The Zafer Mancınık project is an advanced version of Zafer Tourism. "Mancınık" means catapult, conveying the figurative idea of catapulting refugees out of the country."
 reach_the_left_right_front:0 "The Right-Left Coalition"
 reach_the_left_right_front_desc:0 "A right-left coalition refers to a political alliance between parties from opposite ends of the political spectrum."
 the_national_investment_act:0 "The National Investment Act"
 the_national_investment_act_desc:0 "Many countries have laws or policies to regulate investment within their borders. These laws aim to promote economic growth, protect investors and ensure fair, transparent investment practices, and may cover foreign and domestic investment, investor incentives, sector-specific regulations and the protection of intellectual property rights."
 granted_central_bank_independence:0 "Central Bank Independence Granted"
 granted_central_bank_independence_desc:0 "Central bank independence is a central bank's ability to operate autonomously and make monetary policy decisions free from political interference. When granted independence, a central bank can pursue its objectives, such as price and financial stability, without undue pressure from the government or other outside actors."
 turkish_style_silicon_valleys:0 "Turkish Style Silicon Valleys"
 turkish_style_silicon_valleys_desc:0 "We have begun adapting the Silicon Valley model that works so well in America. With it, our country will enter a phase of innovation-driven development and bring new technology products to the world market."
 the_turkish_start_up_culture:0 "The Turkish Start-Up Culture"
 the_turkish_start_up_culture_desc:0 "Turkey's start-up ecosystem has grown significantly over the past decade, with a thriving start-up culture emerging in cities such as Istanbul, Ankara and İzmir."
 the_TWF:0 "The Turkey Wealth Fund"
 the_TWF_desc:0 "The Turkey Wealth Fund is a 33-billion-dollar sovereign wealth fund founded in August 2016 and owned by the Turkish government. It operates under a "Strategic Investment Plan" approved by the Cabinet. Companies and assets formerly owned by state institutions may be transferred to the fund, and sub-funds may be created where appropriate."
 syrian_marriage:0 "Syrian-Turkish Marriages"
 syrian_marriage_desc:0 "The influx of Syrians has brought macroeconomic, political and demographic difficulties, and the only way to solve them is through intermarriage with Syrians. This will help grow our population, integrate Syrians into the country and win us votes at the same time."
 economic_failing_2:0 "Losing Economic Motivation"
 economic_failing_2_desc:0 "By abandoning well-established orthodox policies, the state has left a deep dent in the economy. To repair it, we must return to the capitalist view of liberal orthodoxy and stick with it for many years to recover."
 the_american_force:0 "The American-Backed Corps"
 green_strikes_in_turkey:0 "Green Riots"
 green_strikes_in_turkey_desc:0 "Ecologists are protesting against government policy, badly hurting our stability and our workforce. We must deal with this immediately, or it will cause the country serious problems."
 the_turkish_brain_drain:0 "The Turkish Brain Drain"
 the_turkish_brain_drain_desc:0 ""Brain drain" refers to the emigration of highly skilled and educated people from one country to another, often in search of better opportunities or conditions. Turkey has suffered a brain drain over the years, with many talented people leaving for better careers, higher salaries or a better quality of life. The brain drain from Turkey has now reached huge proportions, and we must overcome it."
 the_turkish_brain_drain_2:0 "The Turkish Brain Drain"
 the_turkish_brain_drain_2_desc:0 ""Brain drain" refers to the emigration of highly skilled and educated people from one country to another, often in search of better opportunities or conditions. Turkey has suffered a brain drain over the years, with many talented people leaving for better careers, higher salaries or a better quality of life. The brain drain from Turkey has now reached huge proportions, and we must overcome it."
 the_turkish_brain_drain_3:0 "The Turkish Brain Drain"
 the_turkish_brain_drain_3_desc:0 ""Brain drain" refers to the emigration of highly skilled and educated people from one country to another, often in search of better opportunities or conditions. Turkey has suffered a brain drain over the years, with many talented people leaving for better careers, higher salaries or a better quality of life. The brain drain from Turkey has now reached huge proportions, and we must overcome it."
 the_turkish_brain_drain_4:0 "The Turkish Brain Drain"
 the_turkish_brain_drain_4_desc:0 ""Brain drain" refers to the emigration of highly skilled and educated people from one country to another, often in search of better opportunities or conditions. Turkey has suffered a brain drain over the years, with many talented people leaving for better careers, higher salaries or a better quality of life. The brain drain from Turkey has now reached huge proportions, and we must overcome it."
 chamber_of_innovation:0 "Chamber of Innovation"
 chamber_of_innovation_desc:0 "In the context of an innovation hub or incubator, a "Chamber of Innovation" usually refers to an organization that fosters innovation and supports the growth of start-ups and entrepreneurial ventures. It serves as a platform for collaboration, knowledge-sharing and networking among innovators, entrepreneurs, investors and other stakeholders."
 turkish_forums:0 "Turkish Forums"
 turkish_forums_desc:0 "Turkish forums are online platforms or communities where people discuss, share information and exchange opinions on all kinds of topics related to Turkey. They give people a space to connect with others who share their interests or experiences and to seek or offer advice, knowledge and perspectives."
 technocratic_propaganda:0 "Technocratic Propaganda"
 technocratic_propaganda_desc:0 "Technocratic propaganda is the spread of information, ideas or messages that promote the principles, values and policies of a technocratic system. It aims to shape public opinion, build support and create a favorable view of technocracy and its benefits."
 pain_of_the_government:0 "The Pains of Technocratic Change"
 pain_of_the_government_desc:0 "The pains of technocratic change are the challenges, difficulties and resistance that can arise when a technocratic system is introduced, including the adjustments, disruptions and conflicts faced by the government and its stakeholders during the transition."
 pain_of_the_government_2:0 "The Pains of Technocratic Change"
 pain_of_the_government_2_desc:0 "The pains of technocratic change are the challenges, difficulties and resistance that can arise when a technocratic system is introduced, including the adjustments, disruptions and conflicts faced by the government and its stakeholders during the transition."
 pain_of_the_government_3:0 "The Pains of Technocratic Change"
 pain_of_the_government_3_desc:0 "The pains of technocratic change are the challenges, difficulties and resistance that can arise when a technocratic system is introduced, including the adjustments, disruptions and conflicts faced by the government and its stakeholders during the transition."
 pain_of_the_parties:0 "The Pains of the Technocratic Party System"
 pain_of_the_parties_desc:0 "The pains of technocratic change are the challenges, difficulties and resistance that can arise when a technocratic system is introduced, including the adjustments, disruptions and conflicts faced by the government and its stakeholders during the transition."
 pain_of_the_parties_2:0 "The Pains of the Technocratic Party System"
 pain_of_the_parties_2_desc:0 "The pains of technocratic change are the challenges, difficulties and resistance that can arise when a technocratic system is introduced, including the adjustments, disruptions and conflicts faced by the government and its stakeholders during the transition."
 pain_of_the_parties_3:0 "The Pains of the Technocratic Party System"
 pain_of_the_parties_3_desc:0 "The pains of technocratic change are the challenges, difficulties and resistance that can arise when a technocratic system is introduced, including the adjustments, disruptions and conflicts faced by the government and its stakeholders during the transition."
 financial_relief_campaign:0 "The Financial Relief Campaign"
 financial_relief_campaign_desc:0 "A financial relief campaign is a coordinated effort to raise funds and provide financial assistance to people or communities in need, often organized in response to specific events or circumstances that have caused economic hardship."
 the_rational_policies:0 "Rational Policies"
 the_rational_policies_desc:0 "Rational economic policies are approaches and strategies grounded in sound economic principles, evidence and logical reasoning. They aim to promote economic growth, stability and the efficient allocation of resources. Their specifics vary with each country's or region's context and goals, but they share a number of key principles and strategies."
 the_rational_policies_2:0 "Rational Policies"
 the_rational_policies_2_desc:0 "Rational economic policies are approaches and strategies grounded in sound economic principles, evidence and logical reasoning. They aim to promote economic growth, stability and the efficient allocation of resources. Their specifics vary with each country's or region's context and goals, but they share a number of key principles and strategies."
 the_economist_cabinet:0 "The Economist Cabinet"
 the_economist_cabinet_desc:0 "An economist cabinet is a government cabinet or council made up of economists or people with strong economic expertise. Its purpose is to provide the government with economic advice, guidance and policy recommendations to inform its economic decisions."
 the_investment_campaign:0 "The Investment Campaign"
 the_investment_campaign_desc:0 "An investment campaign is a strategic effort to attract investment from various sources, such as domestic and foreign investors, businesses or individuals. Its purpose is to promote economic growth, create jobs and stimulate development by drawing capital to a particular region, sector or project."
 unions_deal:0 "The Unions Deal"
 unions_deal_desc:0 "A union deal is an agreement negotiated between a labor union and an employer or employers' association that sets the terms and conditions of employment for the workers the union represents. Such agreements typically cover a wide range of issues, including wages, working hours, benefits, job security and grievance procedures.\n\nNegotiating a union deal involves collective bargaining, in which representatives of the union and the employer hold talks to reach a mutually acceptable agreement. The process may require concessions and compromises from both sides to balance the interests of the workers with the needs of the employer."
 unions_deal_imp:0 "Union Adaptability"
 unions_deal_imp_desc:0 "Union adaptability is a labor union's ability to adapt, respond and innovate in the face of changing circumstances or challenges: to think creatively, adjust its strategies and develop new approaches to meet its members' evolving needs and concerns."
 corporation_boosting:0 "The Cooperation Fund"
 corporation_boosting_desc:0 "A cooperation fund is a financial mechanism set up to support cooperative ventures, collaborations or partnerships between different entities. Its main purpose is to provide funding for joint initiatives, promote cooperation and achieve shared objectives."
 money_stocking_programme:0 "Money Reserves"
 money_stocking_programme_desc:0 "Money reservation typically refers to the practice of setting aside funds or allocating a portion of financial resources for a specific purpose or contingency. It involves earmarking or reserving funds to ensure they are available when needed and to prevent their use for other purposes."
 automazation_campaign:0 "The Automation Campaign"
 automazation_campaign_desc:0 "An automation campaign is a strategic effort to promote and implement automation technologies and processes across industries and sectors, using technological advances to streamline operations, increase efficiency and improve productivity."
 robotic_workforces_auto:0 "The Robotics and Automation Campaign"
 robotic_workforces_auto_desc:0 "The robotics and automation campaign focuses on integrating robotic systems and automation technologies into the workforce, aiming to boost productivity, reduce human error and optimize repetitive or physically demanding tasks."
 anti_unemployment_campaign:0 "The Anti-Unemployment and Automation Campaign"
 anti_unemployment_campaign_desc:0 "The anti-unemployment and automation campaign tackles the potential impact of automation on jobs. It promotes automation while limiting job losses through measures that reskill and upskill workers, encourage entrepreneurship and create new employment opportunities."
 ending_the_automazation_campaign:0 "The General Automation Campaign"
 ending_the_automazation_campaign_desc:0 "The general automation campaign sets out the overall goals and strategies for bringing automation to every sector of the economy. It aims to foster a culture of innovation, invest in research and development, and put supportive policies and infrastructure in place to maximize the benefits of automation."
 sufficent_tax:0 "Sufficient Taxation"
 sufficent_tax_desc:0 "Sufficient taxation means ensuring that tax revenue is enough to meet the government's financial needs, through a tax system that effectively funds public services, infrastructure, social welfare programs and other government initiatives."
 sufficent_tax_economics:0 "Sufficient Taxation and Economics"
 sufficent_tax_economics_desc:0 "This policy explores the relationship between taxation and economic outcomes, stressing the importance of a well-designed tax system that balances revenue with economic growth, investment incentives, income distribution and overall fiscal stability."
 new_turkish_education_policies:0 "Technocratic Turkish Education"
 new_turkish_education_policies_desc:0 "Technocratic Turkish education refers to the implementation of education policies in Turkey that emphasize a technocratic approach. These policies focus on incorporating technology, innovation, digital literacy, and STEM (Science, Technology, Engineering, and Mathematics) education to enhance the quality of education and equip students with the skills needed in a technologically advanced society."
 new_turkish_education_policies_2:0 "Technocratic Turkish Education"
 new_turkish_education_policies_2_desc:0 "Technocratic Turkish education refers to the implementation of education policies in Turkey that emphasize a technocratic approach. These policies focus on incorporating technology, innovation, digital literacy, and STEM (Science, Technology, Engineering, and Mathematics) education to enhance the quality of education and equip students with the skills needed in a technologically advanced society."
 new_turkish_education_policies_3:0 "Technocratic Turkish Education"
 new_turkish_education_policies_3_desc:0 "Technocratic Turkish education refers to the implementation of education policies in Turkey that emphasize a technocratic approach. These policies focus on incorporating technology, innovation, digital literacy, and STEM (Science, Technology, Engineering, and Mathematics) education to enhance the quality of education and equip students with the skills needed in a technologically advanced society."
 new_turkish_education_policies_4:0 "Technocratic Turkish Education"
 new_turkish_education_policies_4_desc:0 "Technocratic Turkish education refers to the implementation of education policies in Turkey that emphasize a technocratic approach. These policies focus on incorporating technology, innovation, digital literacy, and STEM (Science, Technology, Engineering, and Mathematics) education to enhance the quality of education and equip students with the skills needed in a technologically advanced society."
 new_turkish_education_policies_5:0 "Technocratic Turkish Education"
 new_turkish_education_policies_5_desc:0 "Technocratic Turkish education focuses on the implementation of education policies in Turkey that prioritize a technocratic approach. It aims to integrate technology, promote critical thinking and problem-solving skills, foster creativity, and adapt teaching methods to meet the demands of the modern world."
 visual_learning:0 "Visual Learning"
 visual_learning_desc:0 "Visual learning refers to a learning style in which individuals understand and retain information better through visual aids such as images, diagrams, charts, or videos. It emphasizes the use of visual materials to enhance comprehension, memory retention, and overall learning effectiveness."
 kinetic_learning:0 "Kinetic Learning"
 kinetic_learning_desc:0 "Kinetic learning, also known as tactile or hands-on learning, is an approach that emphasizes physical activity and interactive experiences to enhance learning. It involves engaging learners through hands-on experiments, simulations, role-playing, or manipulative activities to deepen understanding and improve knowledge retention."
 vocal_learning:0 "Vocal Learning"
 vocal_learning_desc:0 "Vocal learning focuses on the importance of auditory and verbal interactions in the learning process. It recognizes the power of spoken language, discussions, debates, and presentations to enhance comprehension, communication skills, and critical thinking abilities."
 reformed_media:0 "Technocratic Turkish Media"
 reformed_media_desc:0 "Technocratic Turkish media refers to the reforms and policies aimed at transforming the media landscape in Turkey with a technocratic approach. It focuses on promoting media literacy, fostering independent journalism, enhancing digital media infrastructure, and ensuring media pluralism and transparency."
 reformed_media_2:0 "Technocratic Turkish Media"
 reformed_media_2_desc:0 "Technocratic Turkish media refers to the reforms and policies aimed at transforming the media landscape in Turkey with a technocratic approach. It focuses on promoting media literacy, fostering independent journalism, enhancing digital media infrastructure, and ensuring media pluralism and transparency."
 reformed_media_3:0 "Technocratic Turkish Media"
 reformed_media_3_desc:0 "Technocratic Turkish media refers to the reforms and policies aimed at transforming the media landscape in Turkey with a technocratic approach. It focuses on promoting media literacy, fostering independent journalism, enhancing digital media infrastructure, and ensuring media pluralism and transparency."
 reformed_media_4:0 "Technocratic Turkish Media"
 reformed_media_4_desc:0 "Technocratic Turkish media refers to the reforms and policies aimed at transforming the media landscape in Turkey with a technocratic approach. It focuses on promoting media literacy, fostering independent journalism, enhancing digital media infrastructure, and ensuring media pluralism and transparency."
 reformed_media_5:0 "Technocratic Turkish Media"
 reformed_media_5_desc:0 "Technocratic Turkish media refers to the reforms and policies aimed at transforming the media landscape in Turkey with a technocratic approach. It focuses on promoting media literacy, fostering independent journalism, enhancing digital media infrastructure, and ensuring media pluralism and transparency."
 technological_teaching:0 "Technology Compatibility With Education"
 technological_teaching_desc:0 "Technology compatibility with education explores the integration of technology into the education system to enhance teaching and learning processes. It involves leveraging educational technologies, such as online platforms, digital tools, and interactive resources, to improve instructional methods, engage students, and facilitate personalized learning experiences."
 technological_teaching_2:0 "Technology Compatibility With Education"
 technological_teaching_2_desc:0 "Technology compatibility with education explores the integration of technology into the education system to enhance teaching and learning processes. It involves leveraging educational technologies, such as online platforms, digital tools, and interactive resources, to improve instructional methods, engage students, and facilitate personalized learning experiences."


 technological_teaching_3:0 "Technology Compatibility With Education"
 technological_teaching_3_desc:0 "Technology compatibility with education explores the integration of technology into the education system to enhance teaching and learning processes. It involves leveraging educational technologies, such as online platforms, digital tools, and interactive resources, to improve instructional methods, engage students, and facilitate personalized learning experiences."
 motivational_teaching:0 "Motivational Teaching"
 motivational_teaching_desc:0 "Motivational teaching emphasizes the use of strategies and approaches that inspire and motivate students to actively engage in the learning process. It involves creating a positive and supportive learning environment, setting clear goals, providing constructive feedback, and implementing techniques that foster intrinsic motivation and a love for learning."
 motivational_teaching_2:0 "Motivational Teaching"
 motivational_teaching_2_desc:0 "Motivational teaching emphasizes the use of strategies and approaches that inspire and motivate students to actively engage in the learning process. It involves creating a positive and supportive learning environment, setting clear goals, providing constructive feedback, and implementing techniques that foster intrinsic motivation and a love for learning."
 motivational_teaching_3:0 "Motivational Teaching"
 motivational_teaching_3_desc:0 "Motivational teaching emphasizes the use of strategies and approaches that inspire and motivate students to actively engage in the learning process. It involves creating a positive and supportive learning environment, setting clear goals, providing constructive feedback, and implementing techniques that foster intrinsic motivation and a love for learning."
 media_education:0 "Media Education"
 media_education_desc:0 "Media education focuses on developing critical thinking skills and media literacy among students. It aims to equip them with the knowledge and abilities to critically analyze and evaluate media content, understand media influence and bias, and effectively communicate and create media in the digital age."
 ecology_education:0 "Ecology Education"
 ecology_education_desc:0 "Ecology education involves teaching and raising awareness about ecological principles, environmental sustainability, and the interconnectedness of ecosystems. It aims to foster environmental stewardship, empower students to make informed decisions, and promote a sense of responsibility towards the natural world."
 ecological_minds:0 "Modern Ecological Thinking"
 ecological_minds_desc:0 "Modern ecological thinking promotes a holistic and systems-based approach to understanding and addressing environmental challenges. It emphasizes the integration of ecological knowledge, sustainable practices, and innovative solutions to achieve a harmonious coexistence between human activities and the natural environment."
 ecological_minds_2:0 "Modern Ecological Thinking"
 ecological_minds_2_desc:0 "Modern ecological thinking promotes a holistic and systems-based approach to understanding and addressing environmental challenges. It emphasizes the integration of ecological knowledge, sustainable practices, and innovative solutions to achieve a harmonious coexistence between human activities and the natural environment."
 ecological_minds_3:0 "Modern Ecological Thinking"
 ecological_minds_3_desc:0 "Modern ecological thinking promotes a holistic and systems-based approach to understanding and addressing environmental challenges. It emphasizes the integration of ecological knowledge, sustainable practices, and innovative solutions to achieve a harmonious coexistence between human activities and the natural environment."
 ecological_minds_4:0 "Modern Ecological Thinking"
 ecological_minds_4_desc:0 "Modern ecological thinking promotes a holistic and systems-based approach to understanding and addressing environmental challenges. It emphasizes the integration of ecological knowledge, sustainable practices, and innovative solutions to achieve a harmonious coexistence between human activities and the natural environment."
 ecological_minds_5:0 "Modern Ecological Thinking"
 ecological_minds_5_desc:0 "Modern ecological thinking promotes a holistic and systems-based approach to understanding and addressing environmental challenges. It emphasizes the integration of ecological knowledge, sustainable practices, and innovative solutions to achieve a harmonious coexistence between human activities and the natural environment."
 economical_relief_budget:0 "Economic Relief Budget"
 economical_relief_budget_desc:0 "An economic relief budget refers to a financial plan aimed at providing relief and support to individuals, businesses, or communities facing economic challenges. It involves allocating resources and funds to stimulate economic growth, mitigate the impacts of crises, and promote stability and recovery."
 national_innovation_campaign:0 "National Innovation Campaign"
 national_innovation_campaign_desc:0 "A national innovation campaign is a concerted effort by a country to promote and foster innovation in various sectors. It involves initiatives such as research and development funding, collaboration between academia and industry, entrepreneurship support, and the creation of an innovative ecosystem to drive economic growth and competitiveness."
 national_innovation_fund:0 "National Innovation Fund"
 national_innovation_fund_desc:0 "A national innovation fund is a dedicated financial resource set up by a country to support and invest in innovative projects and initiatives. It aims to stimulate research, development, and innovation across different sectors by providing funding, grants, and resources to innovators, entrepreneurs, and organizations."
 national_innovation_campaign_darted:0 "National Innovation Campaign With Margin"
 national_innovation_campaign_darted_desc:0 "A national innovation campaign with margin refers to an innovation-focused initiative that allows for experimentation and exploration of novel ideas with an acceptable level of risk-taking. It encourages a dynamic and adaptive approach to innovation, embracing the possibility of failure while aiming for significant breakthroughs and advancements."
 the_land_of_futures:0 "Land Of Future"
 the_land_of_futures_desc:0 "The concept of the Land of Future symbolizes a vision or aspiration for a country that embraces innovation, progress, and technological advancements. It represents a future-oriented perspective that seeks to position the nation as a leader in various domains and harness the potential of emerging technologies for societal development."
 the_weapons_of_cold_war:0 "Cold War Weapons"
 the_weapons_of_cold_war_desc:0 "Cold War weapons are the military technologies and strategies of the Cold War era, including nuclear weapons, ballistic missiles, espionage, propaganda campaigns and other methods the rival superpowers used to exert influence, deter aggression and maintain the geopolitical balance."
 shadow_wars:0 "Shadow Forces"
 shadow_wars_desc:0 "Shadow Forces represent covert operations conducted by intelligence agencies or specialized military units. These operations involve clandestine activities such as espionage, sabotage, counterintelligence, and unconventional warfare carried out in secret or under the radar, often in support of broader strategic objectives."
 shadow_planning:0 "Shadow Planning"
 shadow_planning_desc:0 "Shadow Planning refers to the covert or undisclosed development of strategic plans and operations. It involves the formulation and coordination of military or intelligence activities that are intentionally kept hidden or undisclosed from public knowledge or traditional channels of decision-making."
 robotic_warfare:0 "Robotic Warfare"
 robotic_warfare_desc:0 "Robotic Warfare encompasses the use of autonomous or remotely controlled robotic systems in military operations. It involves the deployment of unmanned aerial vehicles (drones), unmanned ground vehicles (UGVs), and other robotic platforms for reconnaissance, surveillance, combat, and logistics purposes."
 static_warfare:0 "Static Warfare"
 static_warfare_desc:0 "Static Warfare refers to military conflicts characterized by entrenched positions and static front lines. It often involves protracted battles with limited mobility, fortified defenses, and extended periods of attrition, where opposing forces face each other in a relatively fixed and stagnant manner."
 manpower_drafts:0 "Conscripted Manpower"
 manpower_drafts_desc:0 "Conscripted manpower refers to conscription, or compulsory military service, in which citizens are drafted into the armed forces. It covers the selection, training and deployment of citizens to ensure a sufficient supply of personnel for the country's defense needs."
 speedy_forces:0 "Rapid Equipment"
 speedy_forces_desc:0 "Rapid equipment covers military hardware and technologies designed for fast deployment, mobility and swift response, including fast vehicles and aircraft, special forces units and logistics systems that enable quick, agile military action."
 one_nations_army:0 "One Nation's Army"
 one_nations_army_desc:0 "One Nation's Army signifies a unified and cohesive military force representing the entire nation. It emphasizes the idea of national unity, shared purpose, and collective defense, where the armed forces act as a symbol of national identity, strength, and resilience."
 army_of_the_profession:0 "Army Of Professionals"
 army_of_the_profession_desc:0 "Army of Professionals refers to a military force composed of highly skilled and specialized individuals in various fields. It emphasizes the importance of professional expertise, advanced training, and specialized knowledge within the armed forces to enhance operational effectiveness and adaptability."
 cloning_the_force:0 "Cloned Forces"
 cloning_the_force_desc:0 "Cloned Forces refers to the concept of creating genetically identical or artificially replicated military personnel. It involves the use of cloning technology to generate identical copies of soldiers or specific units, with the aim of achieving uniformity, enhanced capabilities, and standardized performance."
 fourth_generation_civilian_industries:0 "Fourth Generation Civilian Industries"
 fourth_generation_civilian_industries_desc:0 "Fourth Generation Civilian Industries represents a new wave of advanced and technologically-driven sectors within the civilian economy. It encompasses industries that heavily rely on cutting-edge technologies, automation, digitalization, and innovation to drive economic growth, productivity, and sustainable development."
 turkish_taarif_deal:0 "The Turkish-EU Tariff Deal"
 turkish_taarif_deal_desc:0 "The Turkish-EU Tariff Deal is a bilateral agreement between Turkey and the European Union to reduce trade barriers, tariffs and restrictions on goods and services, fostering economic cooperation, trade liberalization and closer economic ties."
 the_turkish_market_union:0 "Turkish-EU Market Union"
 the_turkish_market_union_desc:0 "Turkish-EU Market Union envisions the creation of a unified market and economic integration between Turkey and the European Union (EU). It involves aligning regulations, standards, and policies to facilitate the free movement of goods, services, capital, and labor between Turkey and the EU member states."
 operational_forces:0 "Turkish Intervention Forces"
 operational_forces_desc:0 "Turkish Intervention Forces are specialized military units designed for rapid deployment and intervention. They are trained and equipped to respond swiftly to emerging threats, operate beyond national borders and contribute to regional stability and security."
 the_federal_states_of_turkey:0 "Technocratic Federal States Of Turkey"
 the_federal_states_of_turkey_desc:0 "Technocratic Federal States of Turkey envisions a political and administrative system in which Turkey is divided into semi-autonomous federal states or regions. It emphasizes the principles of technocratic governance, decentralized decision-making, and regional self-governance within a federal framework."
 space_automazation:0 "Space-Level Automation"
 space_automazation_desc:0 "Space-level automation is the integration of automated systems, robotics and artificial intelligence into space exploration, satellite operations and related activities, improving efficiency, reducing human error and enabling advanced capabilities in space missions."
 TUA_space_1:0 "Space Renovations"
 TUA_space_1_desc:0 "Space Renovations signify upgrades, advancements, or improvements in space infrastructure, satellite systems, launch facilities, and related technologies. It involves modernizing and enhancing the capabilities of space assets to support scientific research, communication, national security, and commercial applications."
 TUA_space_2:0 "Space Renovations II"
 TUA_space_2_desc:0 "Space Renovations signify upgrades, advancements, or improvements in space infrastructure, satellite systems, launch facilities, and related technologies. It involves modernizing and enhancing the capabilities of space assets to support scientific research, communication, national security, and commercial applications."
 expose_of_the_dark_secrets:0 "Finding The Dark Secrets"
 expose_of_the_dark_secrets_desc:0 "Finding The Dark Secrets refers to the process of uncovering hidden or undisclosed information, activities, or truths within a particular context. It involves investigative efforts, research, and analysis aimed at revealing concealed facts, corruption, wrongdoing, or illicit operations."
 turkish_airforces:0 "Turkish Airlines"
 turkish_airforces_desc:0 "Turkish Airlines is the flag carrier of Turkey. As of 2022, it operates scheduled services to 340 destinations in Europe, Asia, Africa and the Americas, making it the world's largest mainline carrier by number of passenger destinations. It serves more non-stop destinations from a single airport than any other airline and flies to 126 countries, more than any other carrier. With its operational fleet of cargo aircraft, its cargo division, Turkish Cargo, serves 82 destinations."
 TUR_iraqi_defense:0 "Resistance In The North"
 TUR_iraqi_defense_desc:0 "Against overwhelming odds, the people of Northern Iraq have refused to surrender.\n\nIn the wake of the Turkish incursions into the northern provinces, a wave of local resistance has flared up across the mountains. Tribal leaders, remnants of old army units and even ordinary villagers have taken up arms to defend their homeland. Fueled by both patriotism and desperation, this spontaneous uprising has made the occupation costly and unsustainable.\n\nThe rugged terrain favors guerrilla tactics, ambushes and sabotage, and Turkish forces are struggling to keep their supply lines open under constant attack. Though fragmented and without central command, the resistance remains a persistent thorn in the invaders' side: a symbol of defiance that refuses to die.\n\nAs long as Northern Iraq resists, peace in the region will remain out of Ankara's reach."
 #:0 ""
 #_desc:0 ""

 izmir_offensive:0 "First Offensive"
 izmir_offensive_desc:0 ""
 second_offensive:0 "Second Offensive"
 second_offensive_desc:0 ""
 oligarchic_economic_model:0 "Oligarchic Economic Model"
 oligarchic_economic_model_desc:0 "The oligarchic economic model is a system characterized by significant concentration of wealth and power in the hands of a small group of extremely wealthy individuals or families. In this model, a select few have substantial control over key industries and economic activities, often exerting considerable influence over government policies and decision-making. The economic and political landscape tends to be dominated by these powerful elites, leading to potential inequalities and limited opportunities for the broader population."
 oligarchic_economic_model_2:0 "Oligarchic Economic Model"
 oligarchic_economic_model_2_desc:0 "The oligarchic economic model is a system characterized by significant concentration of wealth and power in the hands of a small group of extremely wealthy individuals or families. In this model, a select few have substantial control over key industries and economic activities, often exerting considerable influence over government policies and decision-making. The economic and political landscape tends to be dominated by these powerful elites, leading to potential inequalities and limited opportunities for the broader population."
 cem_uzan_group:0 "Cem Uzan Group"
 cem_uzan_group_desc:0 "The Cem Uzan Group is a prominent business conglomerate founded and led by Cem Uzan. Known for its diversified interests across various industries, the group has a significant presence in sectors such as telecommunications, media, energy, and finance. With a reputation for entrepreneurial success and strategic investments, the Cem Uzan Group has played a crucial role in contributing to the economic growth and development of the regions it operates in."
 full_partnership_with_cem_uzan_group:0 "Full Partnership With Cem Uzan Group"
 full_partnership_with_cem_uzan_group_desc:0 "A full partnership with the Cem Uzan Group implies a comprehensive and close collaboration between another business entity and the Cem Uzan Group. Such a partnership could involve shared ownership, joint ventures, or extensive cooperation in various business endeavors. By forming a full partnership, both entities can leverage each other's strengths and resources to achieve mutual business goals, foster innovation, and potentially expand their reach in the market."
 koc_group:0 "Koç Group"
 koc_group_desc:0 "The Koç Group, often referred to as the Koç Holding, is one of Turkey's largest and most prominent conglomerates. Established in 1926, the group has a long-standing history of successful operations across diverse sectors, including automotive, energy, consumer goods, finance, and more. With a commitment to excellence, innovation, and sustainability, the Koç Group has been a driving force in shaping Turkey's economy and maintaining a leading position in various industries."
 full_partnership_with_koc_group:0 "Full Partnership With Koç Group"
 full_partnership_with_koc_group_desc:0 "A full partnership with the Koç Group involves a comprehensive and collaborative relationship between another company and the Koç Group. Such a partnership could encompass shared ownership, joint projects, or extensive cooperation in various business endeavors. By combining their expertise and resources, both entities can work together to achieve shared objectives, capitalize on new opportunities, and strengthen their market positions."
 sabanci_group:0 "Sabancı Group"
 sabanci_group_desc:0 "The Sabancı Group, also known as Sabancı Holding, is a prominent Turkish conglomerate that traces its roots back to the 1930s. The group has diverse business interests, including financial services, industrial manufacturing, retail, and energy, among others. Over the years, the Sabancı Group has been recognized for its commitment to sustainable development and social responsibility, playing a significant role in Turkey's economic growth and prosperity."
 full_partnership_with_sabanci_group:0 "Full Partnership with the Sabancı Group"
 full_partnership_with_sabanci_group_desc:0 "A full partnership with the Sabancı Group involves a comprehensive and collaborative relationship between another company and the Sabancı Group. Such a partnership could encompass shared ownership, joint projects, or extensive cooperation in various business endeavors. By combining their expertise and resources, both entities can work together to achieve shared objectives, capitalize on new opportunities, and strengthen their market positions."
 government_boosted_financial_sector:0 "Government-Boosted Financial Sector"
 government_boosted_financial_sector_desc:0 "The term "Government Boosted Financial Sector" refers to a situation where a government implements policies and initiatives aimed at strengthening and supporting the financial industry within its country. These efforts can take various forms, such as providing incentives, deregulating certain aspects of the financial sector, offering subsidies or tax breaks to financial institutions, and facilitating access to funding or credit. The objective of such measures is usually to stimulate economic growth, attract investment, and enhance the overall stability and efficiency of the financial system."
 government_boosted_civilian_sector:0 "Government Boosted Civilian Sector"
 government_boosted_civilian_sector_desc:0 ""Government Boosted Civilian Sector" pertains to a scenario in which a government actively promotes and invests in the non-military or civilian industries and businesses within its nation. The focus is on supporting and developing sectors such as healthcare, education, infrastructure, technology, agriculture, manufacturing, and other non-military-related areas. By providing financial incentives, grants, or favorable regulations, the government aims to boost economic growth, create jobs, improve the quality of life for citizens, and enhance the overall welfare of the nation."
 government_boosted_military_sector:0 "Government Boosted Arms Sector"
 government_boosted_military_sector_desc:0 "The term "Government Boosted Arms Sector" refers to a situation in which a government takes measures to strengthen and bolster the defense and military industries within its country. This can involve increasing defense spending, providing subsidies or contracts to arms manufacturers, investing in research and development of military technologies, and fostering a domestic arms industry. The primary objective is to enhance the country's defense capabilities and self-sufficiency in meeting military needs."
 local_industrialization_campaign:0 "Local Industrialization Campaign"
 local_industrialization_campaign_desc:0 "A "Local Industrialization Campaign" is a strategic initiative undertaken by a government to promote the growth and development of domestic industries. This can include various sectors such as manufacturing, technology, agriculture, and more. The campaign typically involves creating a conducive environment for local businesses to thrive, such as offering financial incentives, streamlined regulations, access to resources, and infrastructure development. The goal is to reduce dependence on imported goods, boost economic productivity, create jobs, and achieve sustainable economic growth."
 full_industrialization_campaign:0 "Local Industrialization Campaign"
 full_industrialization_campaign_desc:0 "A "Local Industrialization Campaign" is a strategic initiative undertaken by a government to promote the growth and development of domestic industries. This can include various sectors such as manufacturing, technology, agriculture, and more. The campaign typically involves creating a conducive environment for local businesses to thrive, such as offering financial incentives, streamlined regulations, access to resources, and infrastructure development. The goal is to reduce dependence on imported goods, boost economic productivity, create jobs, and achieve sustainable economic growth."
 espionage_schools:0 "Espionage Schools"
 espionage_schools_desc:0 "Espionage Schools are educational institutions that specialize in training individuals in the arts of espionage, intelligence gathering, and covert operations. These schools typically offer specialized courses and training programs that cover a wide range of skills, including surveillance techniques, data analysis, code-breaking, undercover operations, and information security. Graduates from espionage schools may go on to work in intelligence agencies, law enforcement, security consulting, or other related fields."
 economy_schools:0 "Economy Schools"
 economy_schools_desc:0 "Economy Schools are educational establishments focused on providing specialized education and training in various aspects of economics and finance. These schools offer courses in macroeconomics, microeconomics, financial analysis, econometrics, banking, and investment management, among others. Graduates from economy schools often pursue careers in banking, finance, economic research, policy analysis, and academia."
 religion_schools:0 "Religion Schools"
 religion_schools_desc:0 "Religion Schools, also known as theological seminaries or divinity schools, are institutions of higher learning that focus on religious studies and training individuals for roles in religious leadership, ministry, or religious education. These schools offer courses in theology, biblical studies, religious history, ethics, pastoral counseling, and other related subjects. Graduates from religion schools often become clergy members, religious educators, or engage in various roles within their respective religious communities."
 diversified_education:0 "Diversified Education"
 diversified_education_desc:0 "Diversified Education refers to a comprehensive and well-rounded approach to education that emphasizes a broad spectrum of subjects and skills. This approach aims to provide students with a diverse range of knowledge and experiences, including the arts, sciences, humanities, social sciences, physical education, and practical skills. Diversified education seeks to foster critical thinking, creativity, and adaptability, preparing students to become well-rounded individuals capable of addressing various challenges in their personal and professional lives."
 social_society:0 "Social Society"
 social_society_desc:0 "The term "Social Society" refers to a community or group of individuals who come together based on shared interests, values, or common goals. Social societies can take various forms, including clubs, organizations, community groups, or online communities. These societies often provide a platform for social interaction, networking, and collaboration among members who share similar passions or objectives."
 happy_family_policies:0 "Happy Family Policies"
 happy_family_policies_desc:0 "Happy Family Policies are government initiatives or programs aimed at promoting the well-being and happiness of families within a society. These policies may include family support services, financial assistance for childcare, parental leave, affordable housing options, family counseling services, and educational support for children. The goal of such policies is to create a supportive environment that enables families to thrive and enhances overall societal well-being."
 the_budget_relief:0 "The Budget Relief"
 the_budget_relief_desc:0 "The Budget Relief refers to measures taken by the government or organizations to alleviate financial burdens or economic pressures on individuals, families, or businesses. These measures could include tax cuts, subsidies, financial aid, or debt relief programs. The budget relief initiatives aim to stimulate economic growth, ease financial hardships, and improve the financial well-being of the targeted beneficiaries."
 modern_espionage:0 "Modern Espionage"
 modern_espionage_desc:0 "Modern Espionage pertains to the contemporary practices and techniques used in intelligence gathering, surveillance, and covert operations. With the advancements in technology and communication, modern espionage involves sophisticated methods of data collection, cyber-espionage, and intelligence analysis. It plays a crucial role in national security and geopolitical affairs, as intelligence agencies strive to protect their countries' interests and stay ahead of potential threats."
 MIST_int:0 "National Intelligence and Defence Organisation (MIST)"
 MIST_int_desc:0 "Milli İstihbarat ve Savunma Teşkilatı, often abbreviated as MIST, is a Turkish term that translates to "National Intelligence and Defense Organization." It refers to a governmental agency responsible for intelligence gathering, national security, and defense operations in Turkey. MIST plays a significant role in safeguarding the country's interests, countering security threats, and contributing to Turkey's national defense strategy."
 MIDST_int:0 "National Intelligence and Foreign Policy Organisation (MIDST)"
 MIDST_int_desc:0 "Milli İstihbarat ve Dış Siyaset Teşkilatı, often abbreviated as MIDST, translates to "National Intelligence and Foreign Policy Organization." It refers to a governmental agency responsible for intelligence gathering, analysis, and formulating foreign policy strategies for Turkey. The organization plays a crucial role in safeguarding Turkey's national interests, monitoring international developments, and influencing foreign policy decisions to protect and advance the country's diplomatic and geopolitical goals."
 influence_defence_project:0 "Influence Defence Project"
 influence_defence_project_desc:0 "The Influence Defence Project is a strategic initiative focused on enhancing a country's defensive capabilities by understanding, countering, and mitigating various forms of influence and information warfare. In an era where information dissemination and perception management play significant roles in shaping public opinion and decision-making, the Influence Defence Project aims to safeguard against external manipulation and maintain national security."
 relations_commitee:0 "Worldwide Relations Committee"
 relations_commitee_desc:0 "The Influence Defence Project is a strategic initiative focused on enhancing a country's defensive capabilities by understanding, countering, and mitigating various forms of influence and information warfare. In an era where information dissemination and perception management play significant roles in shaping public opinion and decision-making, the Influence Defence Project aims to safeguard against external manipulation and maintain national security."
 turkish_lobbying:0 "Turkish Lobbying"
 turkish_lobbying_desc:0 "Turkish Lobbying involves organized efforts by individuals or groups to influence policymakers, government officials, or public opinion in favor of Turkey's interests. Lobbying activities may include advocating for favorable policies, promoting economic ties, supporting cultural exchanges, and countering misinformation about Turkey. The goal is to strengthen Turkey's position on the global stage and advance its diplomatic, economic, and strategic priorities."
 turkish_lobbying_2:0 "Turkish Lobbying"
 turkish_lobbying_2_desc:0 "Turkish Lobbying involves organized efforts by individuals or groups to influence policymakers, government officials, or public opinion in favor of Turkey's interests. Lobbying activities may include advocating for favorable policies, promoting economic ties, supporting cultural exchanges, and countering misinformation about Turkey. The goal is to strengthen Turkey's position on the global stage and advance its diplomatic, economic, and strategic priorities."
 mind_games_mit:0 "Mind Games"
 mind_games_mit_desc:0 ""
 mind_games_2_mit:0 "Mind Games"
 mind_games_2_mit_desc:0 ""
 turkish_investor_dream:0 "Turkish Investor Dream"
 turkish_investor_dream_desc:0 "The Turkish Investor Dream represents an optimistic outlook for potential investors considering investment opportunities in Turkey. It highlights the country's economic potential, market attractiveness, favorable business environment, and government support for foreign investments. The Turkish Investor Dream aims to attract foreign capital and stimulate economic growth by showcasing Turkey as an attractive destination for business ventures and entrepreneurial pursuits."
 turkish_investor_dream_2:0 "Turkish Investor Dream"
 turkish_investor_dream_2_desc:0 "The Turkish Investor Dream represents an optimistic outlook for potential investors considering investment opportunities in Turkey. It highlights the country's economic potential, market attractiveness, favorable business environment, and government support for foreign investments. The Turkish Investor Dream aims to attract foreign capital and stimulate economic growth by showcasing Turkey as an attractive destination for business ventures and entrepreneurial pursuits."
 for_the_last_moment:0 "For The Last Moment!"
 for_the_last_moment_desc:0 "A last-ditch call to action. When the window of opportunity is about to close, the state must act swiftly and decisively, seizing every chance before it slips away and the problems in front of us grow harder to solve."
 strenghten_the_bureaucracy:0 "Strengthen The Bureaucracy"
 strenghten_the_bureaucracy_desc:0 "Strengthening the bureaucracy means improving the efficiency, effectiveness and capacity of the administrative machinery that implements and enforces laws, policies and regulations. It involves streamlining procedures, increasing transparency, promoting merit-based hiring and promotion, training civil servants and improving coordination between government agencies, so that the state can serve the country and its citizens more effectively."
 new_bureaucracy:0 "New Bureaucracy"
 new_bureaucracy_desc:0 "A new bureaucracy means rebuilding the administrative system of the state: reorganizing existing structures, creating new agencies and introducing innovative practices that make the civil service more agile and adaptable. The aim is a modern, efficient and forward-looking state apparatus able to meet today's challenges and opportunities."
 counter_embargo_policies:0 "Anti-Embargo Policies"
 counter_embargo_policies_desc:0 "Anti-Embargo Policies refer to a set of measures or strategies adopted by a country to counter or mitigate the effects of economic embargoes imposed by other nations or international organizations. Economic embargoes typically involve restrictions on trade, investment, or financial transactions and are often used as a means of exerting political pressure or punishment. Anti-Embargo Policies may include diversifying trade partners, seeking alternative sources of goods and services, promoting self-sufficiency in critical sectors, and engaging in diplomatic efforts to resolve the issues leading to the embargo."
 turkish_geopolitics:0 "Geopolitical Mindset"
 turkish_geopolitics_desc:0 "A geopolitical mindset shapes the country's strategic thinking about its interests, international relations and engagement with other nations. By weighing Turkey's geographic position, resources, security concerns and historical context, it guides foreign policy decisions and long-term strategy, from diplomatic engagements and regional alliances to the pursuit of national interests on the global stage."
 eu_espionage_deal:0 "EU-Turkey Agency Communications"
 eu_espionage_deal_desc:0 "EU-Turkey Agency Communications is the exchange of intelligence and information between European Union agencies and their Turkish counterparts. Sharing intelligence on security threats, criminal activity and other matters of mutual interest strengthens security cooperation, helps counter transnational challenges and fosters dialogue between Turkey and the EU member states."
 united_turkic_espionage:0 "Turkic Union-Turkey Agency Communications"
 united_turkic_espionage_desc:0 "Turkic Union-Turkey Agency Communications is the exchange of intelligence and information between Turkey and the member states of the Turkic Union, an organization that promotes cooperation among Turkic-speaking countries. Sharing intelligence on security, economic and cultural matters deepens cooperation and solidarity among the Turkic nations."
 united_turkic_TURKSAT:0 "Turkic Union-Turkey TURKSAT"
 united_turkic_TURKSAT_desc:0 "Turkic Union-Turkey TURKSAT is a joint effort by Turkey and the Turkic Union to operate the TURKSAT series of Turkish communication satellites. It involves sharing satellite technology, using satellite communications for regional development projects and expanding telecommunications and broadcasting capabilities across the member states."
 abandon_military_sector:0 "SADAT's Military Plans"
 abandon_military_sector_desc:0 "By abandoning the military sector, SADAT, the private Turkish defense consultancy, steps back from its military initiatives and projects. Priorities shift away from outsourcing military functions to private contractors, and defense planning and procurement return firmly to the hands of the state."
 cimer_mit:0 "CİMER"
 cimer_mit_desc:0 "CIMER stands for "Communication Center for Public Complaints and Requests" (CİMER in Turkish). It is an online platform in Turkey that allows citizens to submit complaints, inquiries, and requests to government authorities. CIMER plays a role in promoting transparency, citizen engagement, and accountability in public administration by providing a direct channel for communication between citizens and the government."
 cimer_mit2:0 "CİMER"
 cimer_mit2_desc:0 "CIMER stands for "Communication Center for Public Complaints and Requests" (CİMER in Turkish). It is an online platform in Turkey that allows citizens to submit complaints, inquiries, and requests to government authorities. CIMER plays a role in promoting transparency, citizen engagement, and accountability in public administration by providing a direct channel for communication between citizens and the government."
 jewish_gold:0 "Jewish Community Investments"
 jewish_gold_desc:0 "Business leaders from Turkey's Jewish community, one of the oldest communities in the country, are investing in Turkish businesses and ventures. Their capital, international connections and long-standing commercial experience help strengthen the domestic economy."
 powers_to_fahrettin_altun:0 "Powers to Fahrettin Altun"
 powers_to_fahrettin_altun_2:0 "Powers to Fahrettin Altun"
 powers_to_melih_tanriverdi:0 "Powers To Melih Tanrıverdi"
 powers_to_melih_tanriverdi_2:0 "Powers To Melih Tanrıverdi"
 the_sectoral_campaign:0 "The Sectoral Campaign"
 the_sectoral_campaign_desc:0 "The Sectoral Campaign is a targeted effort to support specific sectors and industries of the economy. Through strategic initiatives, financial incentives and policy measures, it aims to boost growth, innovation and competitiveness in the selected sectors."
 fahrettin_altuns_media_group:0 "Fahrettin Altun's Media Group"
 fahrettin_altuns_media_group_desc:0 "Fahrettin Altun's media group brings together newspapers, TV channels, radio stations and online platforms owned, controlled or influenced by Fahrettin Altun."
 skynet_investments:0 "Skynet"
 agency_on_kandil:0 "Agents On Kandil"
 agency_on_kandil_desc:0 "Turkish intelligence agents and operatives are now active in Kandil, the mountainous region of Northern Iraq that serves as the main base of the PKK (Kurdistan Workers' Party). Their presence allows intelligence and counter-terrorism operations to be carried out and information on PKK activities in the region to be gathered."
 armedegon_thoughts:0 "Armageddon Preparation"
 armedegon_thoughts_desc:0 "Armageddon Preparation means readiness and planning for a catastrophic, apocalyptic event. More broadly, it represents preparedness for a major crisis or conflict with potentially severe consequences: anticipating the worst-case scenarios and mitigating their impact."
 mit_interventionism:0 "Fidanist Interventionism"
 mit_interventionism_desc:0 "Fidanist Interventionism refers to the policies associated with Hakan Fidan, the head of Turkey's National Intelligence Organization (MIT). Through active involvement in intelligence operations, security matters and regional diplomacy, Fidan has played a significant role in shaping Turkey's foreign policy and national security strategy."
 turkeys_new_millennium:0 "Turkey's New Millennium"
 turkeys_new_millennium_desc:0 "Turkey's New Millennium is a period of transformation as the country enters the new era beginning in the year 2000. It represents the social, political, economic and cultural developments of the new millennium and the nation's aspirations and goals for the future."
 turkish_civil_war_modifier:0 "Civil War Chaos"
 turkish_civil_war_modifier_desc:0 "A civil war is a violent conflict within a nation between groups or factions fighting for political power, territory or resources. The conflict has escalated into intense disorder, instability and unpredictability: widespread violence, social unrest, displaced civilians, a breakdown of law and order, and disruption of essential services and infrastructure."
 white_energy_operations:0 "The White Energy Operation"
 white_energy_operations_desc:0 "As a result of the investigations related to White Energy, many people from the bureaucracy and business world were detained and brought before the judiciary. Those who carried out the operation were also suspended from duty one by one."
 turkish_submarines:0 "Turkish Submarine Sector"
 turkish_submarines_desc:0 "The Turkish Submarine Sector refers to the nation's advanced capabilities in designing, manufacturing, and operating submarines. These state-of-the-art submarines play a crucial role in ensuring the maritime security of Turkey and projecting its naval presence in the region."
 turkish_carriers:0 "Turkish Grand Carrier Projection"
 turkish_carriers_desc:0 "The Turkish Grand Carrier Projection is a strategic naval initiative aimed at strengthening Turkey's maritime influence globally. Through the deployment of advanced aircraft carriers, Turkey aims to enhance its ability to project power, protect its interests, and contribute to international peacekeeping efforts."
 turkish_destroyers:0 "Turkish Destroyer Sector"
 turkish_destroyers_desc:0 "The Turkish Destroyer Sector represents Turkey's expertise in constructing and deploying advanced destroyer-class warships. These highly capable vessels serve as a critical component of Turkey's naval fleet, providing enhanced defense and offensive capabilities."
 governmental_thoughts:0 "Restoring The Budget"
 governmental_thoughts_desc:0 ""Restoring The Budget" is a governmental strategy aimed at achieving fiscal stability and economic growth in Turkey. Through prudent financial management and targeted reforms, the government seeks to revitalize the economy, optimize public spending, and foster sustainable development."
 thk_program_2:0 "Turkish Air Forces"
 thk_program_2_desc:0 "The Turkish Air Force (THK) Program is a comprehensive modernization effort to enhance the capabilities of Turkey's air force, including the acquisition of advanced fighter aircraft, the development of cutting-edge technologies, and better pilot training and operational efficiency."
 thk_program:0 "Turkish Air Force Standardization"
 thk_program_desc:0 "The Turkish Air Force Standardization initiative aims to streamline and optimize operational procedures, maintenance protocols, and training methodologies within the Turkish Air Force. Standardization ensures consistent performance, interoperability, and readiness across the air force's various units."
 turkish_battleships:0 "Turkish Battleship Sector"
 turkish_battleships_desc:0 "The Turkish Battleship Sector represents Turkey's proficiency in constructing and operating powerful battleships. These formidable naval vessels bolster Turkey's defensive and offensive capabilities, providing the country with a significant strategic advantage in maritime operations."
 turkish_tankery:0 "Turkish Tankery"
 turkish_tankery_desc:0 "Turkish Tankery is Turkey's expertise in armored warfare and the development of advanced tanks. With a focus on technological innovation and combat effectiveness, it keeps the nation's ground forces capable and ready to meet any security challenge."
 turkish_artillery:0 "Turkish Artillery"
 turkish_artillery_desc:0 "Turkish Artillery covers the country's artillery systems, including self-propelled howitzers and rocket launchers. These sophisticated systems provide crucial fire support to ground forces and play a vital role in both offensive and defensive operations."
 the_great_march:0 "SADAT's Great Movement"
 the_great_march_desc:0 "SADAT's Great Movement, also known as The Great March, is a strategic vision of SADAT International Defense Consultancy, a private military consulting firm in Turkey. The movement aims to overthrow Turkey's government, restore the nation's security and, through specialized defense consultancy, contribute to global peace and stability."
 positional_warfare:0 "Positional Warfare"
 positional_warfare_desc:0 "Positional warfare, also known as static or trench warfare, is a type of warfare in which opposing forces establish fortified positions and hold relatively static lines of defense and attack. It was most prominent during World War I, but has been seen in many conflicts throughout history."
 political_tensions_in_turkey_imamoglu:0 "Political Polarization"
 political_tensions_in_turkey_imamoglu_desc:0 "Turkey finds itself increasingly fractured as political and social polarization intensifies. Competing ideologies have split the nation into opposing camps, each distrustful and hostile toward the other. This bitter divide undermines national unity, weakens institutions, and fuels unrest across the country. As tensions rise, the risk of internal conflict grows, threatening to destabilize Turkey’s fragile political landscape."
 boycott_strikes:0 "Boycott Strikes"
 boycott_strikes_desc:0 "The people of Turkey have launched a widespread boycott against companies connected to the ruling AKP party to protect economic independence and weaken the regime’s influence. This grassroots movement aims to cut the financial resources of state-backed corporations, reduce the ruling party’s economic power, and empower citizens to take control of their own economic destiny. By supporting local producers and small businesses, the boycott strengthens popular solidarity and fuels resistance against political oppression."
 the_city_of_cultures:0 "Turkey's Multi-Ethnic State"
 OTT_cores_block:0 "Pro-European Peaceful Stance"
 crescent_of_innovation:0 "Crescent Of Innovation"
 crescent_of_innovation_desc:0 "Drawing on the legacy of a storied past and the promise of a bold future, our nation has become a beacon of invention and ingenuity. Engineers, thinkers and artists flourish under state-backed programs, forging cutting-edge solutions without severing the cultural roots that shaped them. The crescent no longer symbolizes faith alone: it now arcs over a future built by intellect."
 neo_renaissance:0 "Neo-Renaissance"
 neo_renaissance_desc:0 "The revival of arts, science, and philosophy has sparked a cultural golden age. Intellectual freedom and innovation flourish as old traditions blend with modern ideals. This new era inspires invention, unity, and a renewed sense of purpose, pushing the nation toward unprecedented achievements."
 rise_of_the_alafranga:0 "The Alafranga"
 rise_of_the_alafranga_desc:0 "The revival of arts, science, and philosophy has sparked a cultural golden age. Intellectual freedom and innovation flourish as old traditions blend with modern ideals. This new era inspires invention, unity, and a renewed sense of purpose, pushing the nation toward unprecedented achievements."
 nationalist_drift_1:0 "Government Censorship"
 nationalist_drift_1_desc:0 "In the name of order and tradition, the state exerts tight control over the press, literature, and public discourse. Inspired by the Ottoman model of suppressing dissent and regulating ideas, a strict censorship apparatus filters what the people can read, write, or say. While stability is maintained and radical ideologies are kept at bay, innovation and free thought suffer in the shadow of repression."
 nationalist_drift_2:0 "Government Censorship"
 nationalist_drift_2_desc:0 "In the name of order and tradition, the state exerts tight control over the press, literature, and public discourse. Inspired by the Ottoman model of suppressing dissent and regulating ideas, a strict censorship apparatus filters what the people can read, write, or say. While stability is maintained and radical ideologies are kept at bay, innovation and free thought suffer in the shadow of repression."
 nationalist_drift_3:0 "Government Censorship"
