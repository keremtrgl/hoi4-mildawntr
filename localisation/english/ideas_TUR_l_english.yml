 tsk_seref_madalyonu:0 "TAF Medal Of Honor"
 tsk_seref_madalyonu_desc:0 "The Turkish Armed Forces Medal of Honor has been awarded to distinguished personnel of the Turkish Armed Forces since 1967. The gold medal goes to those who play an important role in directing a war and winning it; the silver medal goes to Turkish and foreign soldiers and civilians who risk their own lives to save people and troops in danger."
 tsk_basari_madalyonu:0 "TAF Achievement Medal"
 tsk_basari_madalyonu_desc:0 "The Turkish Armed Forces Achievement Medal has been awarded to distinguished personnel of the Turkish Armed Forces since 1967. In war, it is awarded for exceptional success in carrying out important tasks; in peace, for service that far exceeds what is expected."
 tsk_hizmet_madalyonu:0 "TAF Service Commendation Medal"
 tsk_hizmet_madalyonu_desc:0 "The Turkish Armed Forces Service Commendation Medal has been awarded to distinguished personnel of the Turkish Armed Forces since 1967. In war and peace alike, it is awarded to Turkish and foreign soldiers who are wounded while carrying out their mission with exceptional effort, and who bring pride to the Turkish Armed Forces."
 tsk_ustun_cesaret_madalyonu:0 "TAF Medal For Outstanding Bravery And Self-Sacrifice"
 tsk_ustun_cesaret_madalyonu_desc:0 "The Turkish Armed Forces Medal for Outstanding Bravery and Self-Sacrifice is awarded to soldiers who successfully fulfill their duty under extremely difficult conditions. The three-piece medal is made of bronze and bears an image of a serving soldier."
 tsk_ustun_hizmet_madalyonu:0 "TAF Distinguished Service Medal"
 tsk_ustun_hizmet_madalyonu_desc:0 "First established in 1967 and given its present form in 1983, the Turkish Armed Forces Distinguished Service Medal is awarded to members of the armed forces whose service far exceeds that of their peers, to those who invent or develop tools and materials for the armed forces' inventory, and to Turkish and foreign soldiers and civilians, in recognition of their sacrifice, heroism and outstanding performance in peace and war."
 trait_TUR_gulen_champion:0 "Gülenist Champion"
 trait_TUR_gulen_champion_desc:0 "This commander has ties to the Gülen organization, whose mission is to destroy Kemalism, the official state ideology."
 tsk_nato_officer:0 "Pro-NATO Officer"
 tsk_nato_officer_desc:0 "This commander has very good relations with NATO and may take part in a NATO-backed coup or in NATO exercises."
 # Spirits that had no name
 internationalism:0 "Internationalism"
 internationalism_desc:0 "Turkey looks beyond its borders and seeks partners abroad, trusting cooperation over confrontation."
 TUR_legacy_of_ataturk_preserved:0 "Atatürk's Legacy Preserved"
 TUR_legacy_of_ataturk_preserved_desc:0 "The Republic still stands on the principles Mustafa Kemal laid down. As long as they are kept, the state stays steady."
 TUR_legacy_of_ataturk_fulfilled:0 "Atatürk's Legacy Fulfilled"
 TUR_legacy_of_ataturk_fulfilled_desc:0 "The goals Atatürk set for the Republic have been reached: a modern, secular and prosperous Turkey."
 TUR_legacy_of_ataturk_defiled:0 "Atatürk's Legacy Defiled"
 TUR_legacy_of_ataturk_defiled_desc:0 "The principles of the founder have been cast aside, and much of the nation will not forgive it."
 TUR_sectarian_woes:0 "Sectarian Strife"
 TUR_sectarian_woes_desc:0 "Religious and sectarian divisions tear at society. Every faction distrusts the state and each other."
 guerilla_warfare:0 "Guerrilla Warfare"
 TUR_etatism:0 "Etatism"
 TUR_etatism_desc:0 "The state leads the economy: it plans, invests and builds the industries private capital will not."
 kemalist_neutrality_idea:0 "Kemalist Neutrality"
 kemalist_neutrality_idea_desc:0 ""Peace at home, peace in the world." Turkey stays out of foreign wars and guards its own."
