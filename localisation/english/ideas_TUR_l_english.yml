 turkish_tourism_sector_medium:0 "Turkish Tourism Industry"
 turkish_tourism_sector_medium_desc:0 "Turkey's unique cultural heritage, stunning landscapes and historical sites have long attracted visitors from around the world. By investing in infrastructure, hospitality and international promotion, Turkey has grown its tourism sector into a significant source of income that strengthens its global ties. This flourishing industry not only boosts our economy but also fosters cultural exchange and national pride.\n\n§YYou can manage the tourism industry through decisions £decision_icon_small.§!"
