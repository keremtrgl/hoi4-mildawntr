 mass_banking6_desc:0 "Our country's course depends on these banks: a banking collapse would mean the collapse of the economy. That is why we must support and grow our banks and strengthen our country. As the banks grow stronger, our people's prosperity will rise and our country will reach new heights. The banks are one of the guardians of liberalism. \n\n§YBanking Level: §GGood§!"
 liberazation_of_the_kemalism:0 "Liberalized Kemalism"
 liberazation_of_the_islamism:0 "Liberalized Islamism"
 TUR_6_arrows:0 "The Six Arrows of Kemalism"
 TUR_6_arrows_desc:0 "The ideology rests on six fundamental pillars: Republicanism, Nationalism, Populism, Laicism, Statism and Reformism (also called "Revolutionism"). Together they represent a kind of Jacobinism, which Atatürk himself defined as a way of using political despotism to break the social despotism prevalent among the traditionally minded Turkish-Muslim population, for which he blamed above all the bigotry of the ulema. The principles came to be regarded as unchangeable and sacrosanct."
 solar_energy:0 "Solar Energy"
 solar_energy_desc:0 "Solar energy is the radiant light and heat from the Sun, harnessed with a range of ever-evolving technologies such as solar heating, photovoltaics, solar thermal energy, solar architecture, molten salt power plants and artificial photosynthesis."
 wind_rose_energy:0 "Wind Energy"
 wind_rose_energy_desc:0 "Wind power is the use of wind to provide mechanical power through wind turbines that drive electric generators. It is a popular sustainable, renewable energy source with a much smaller environmental impact than burning fossil fuels."
 hydroelectiricty:0 "Hydroelectricity"
 hydroelectiricty_desc:0 "Hydroelectricity, or hydroelectric power, is electricity generated from hydropower. In 2015, hydropower produced 16.6% of the world's electricity and 70% of all renewable electricity, and it was expected to grow by about 3.1% a year for the next 25 years."
 EU_approach:0 "European Approach"
 TURAN_approach:0 "Turan Approach"
 laws_of_bor:0 "Boron Fields"
 laws_of_bor_desc:0 "Boron is a chemical element with the symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae rather than stellar nucleosynthesis, it is a low-abundance element in the Solar System and the Earth's crust, making up about 0.001 percent of the crust by weight. Boron is concentrated on Earth by the water solubility of its more common natural compounds, the borate minerals, which are mined industrially as evaporites such as borax and kernite. The largest known boron deposits are in Turkey, the world's largest producer of boron minerals."
 anti_western:0 "Anti-Western Policy"
 democratic_infulence:0 "Democratic Influence"
 democratic_infulence_desc:0 "This country is being infiltrated by a democratic power."
 mazot_1ytl:0 "Diesel for 1 TL"
 mazot_1ytl_desc:0 "We did it! Diesel now costs 1 TL. We have kept the promises we made to our people and built a strong, socially minded populist country. Long live Turkey!"
 power_of_energy:0 "Small Rentier State"
 agricultural_movement_4:0 "The Agricultural Movement"
 agricultural_movement_4_desc:0 "Our farmers are the masters of the nation, and we must support them; if they go bankrupt, we collapse with them. That is why, as a populist country, we back agricultural initiatives.\n\n§YAgricultural Support Level: §GGood§!"
