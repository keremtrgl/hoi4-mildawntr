 tur_historical_confidence:0 "Turkish Historical Pride"
 tur_historical_confidence_desc:0 "Most Turks are proud of their history and ancestry, so nationalist sentiment is widespread and dominant in Turkey."
 rise_of_fp:0 "The Rise of the §Y[Conservative_L]§!"
 rise_of_fp_desc:0 "Turkey has long been a secular country, but more and more people want Islamic traditions brought back into society. Many are angry at the Kemalist parties' borderline anti-religious attitude."
 TURKEY_MILLENNIUM_DAWN_DESC:0 "The young republic has barely made it into modern times. Corruption has recently reached high levels, and parties at odds with each other have begun to clash. Trying to put an end to this, the army has staged coups, and the economy has suffered blow after blow. The Turkish people entered the 2000s hoping that the country's economic and political problems would ease. \n\nLet's see whether good days lie ahead for the young Republic."
 TURKEY_MODERN_DAY_DESC:0 "After the 2001 economic crisis, the AKP came to power with a majority of the vote. As a religious party, the AKP has had tensions with the military in the recent past. Once in power, it revived the economy with reforms, but growth has recently begun to slow. In 2016, the Gülen movement, once close to the AKP and now declared a terrorist organization, tried to overthrow the state but was defeated by popular resistance. After the failure of the Gülenist coup attempt, the AKP's support grew.\n\nWhat fate awaits this country?"
