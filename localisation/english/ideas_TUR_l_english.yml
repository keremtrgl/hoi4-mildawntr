 turkish_IMF_reformation_1:0 "Turkish Monetary Reformation - §YIn Action§!"
 turkish_IMF_reformation_1_desc:0 "In the early 2000s, Turkey went through a major monetary reformation to tackle the economic challenges of the time: high inflation, fiscal instability and a history of financial crises. The government and the central bank introduced a series of reforms to stabilize the economy, curb inflation and restore the country's overall financial health."
 turkish_IMF_reformation_2:0 "Turkish Monetary Reformation - §RFailed§!"
 turkish_IMF_reformation_2_desc:0 "In the early 2000s, Turkey went through a major monetary reformation to tackle the economic challenges of the time: high inflation, fiscal instability and a history of financial crises. The government and the central bank introduced a series of reforms to stabilize the economy, curb inflation and restore the country's overall financial health."
 turkish_IMF_reformation_3:0 "Turkish Monetary Reformation - §GRestored§!"
 turkish_IMF_reformation_3_desc:0 "In the early 2000s, Turkey went through a major monetary reformation to tackle the economic challenges of the time: high inflation, fiscal instability and a history of financial crises. The government and the central bank introduced a series of reforms to stabilize the economy, curb inflation and restore the country's overall financial health."
 
 TMSF_overshooting:0 "Parallel Collapse: BDDK Falls Apart"
 TMSF_overshooting_desc:0 "The sudden collapse of the Banking Regulation and Supervision Agency (BDDK) has unleashed a financial maelstrom across Turkey. The once-reliable watchdog responsible for banking stability is now incapacitated, allowing reckless lending, mismanagement and unchecked corruption to run rampant. Major banks are teetering on the edge of insolvency, triggering widespread panic among depositors and investors alike. The nation's credit rating has plummeted, foreign investment has dried up and inflation has soared as the government struggles to contain the crisis.\n\nThe collapse of the financial sector has spilled into the political arena, fueling public unrest and eroding confidence in the government's ability to manage the economy. Political factions blame each other for the failure, deepening the country's divisions. As the economic turmoil tightens its grip, social order weakens and Turkey finds itself vulnerable to both internal instability and foreign influence. Without urgent reforms and the restoration of regulatory control, the nation risks descending into prolonged economic and political chaos."
 TMSF_normal:0 "BDDK Payments"
 TMSF_normal_desc:0 "The payment systems overseen by the Banking Regulation and Supervision Agency face severe disruptions, causing delays and failures in financial transactions across Turkey. Businesses and citizens struggle to transfer funds reliably, stalling commerce and unsettling markets. The unstable payment infrastructure erodes trust in the banking system and forces many to turn to informal alternatives."
 TMSF_ease:0 "BDDK Payments"
 TMSF_ease_desc:0 "The payment systems overseen by the Banking Regulation and Supervision Agency face severe disruptions, causing delays and failures in financial transactions across Turkey. Businesses and citizens struggle to transfer funds reliably, stalling commerce and unsettling markets. The unstable payment infrastructure erodes trust in the banking system and forces many to turn to informal alternatives."
 TMSF_hard:0 "BDDK Payments"
