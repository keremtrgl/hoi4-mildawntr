 covid_19_medicined:0 "Prepared for the Covid-19 Pandemic"
 covid_19_medicined_desc:0 "Covid-19 has reached our country. It may have slowed our economy, but we are prepared."
 covid_19_normalised:0 "Normalization After Covid-19"
 covid_19_normalised_desc:0 "Covid-19 has spread in our country, but thanks to new vaccines and falling cases, we can begin to normalize. With normalization, our economy will come back to life."
 nato_turkey_missionary:0 "The NATO-OTAN Turkey Mission"
 nato_turkey_missionary1:0 "NATO-OTAN's Very High Readiness Joint Task Force (VJTF)"
 state_visists:0 "State Visits"
 turkic_state:0 "Turkic Union Member"
 turkic_state_desc:0 "The Turkic Council, officially the Cooperation Council of Turkic-Speaking States, is an international organization made up of several Turkic countries. It is an intergovernmental organization whose overarching aim is to promote comprehensive cooperation among Turkic-speaking states."
 turkic_tv:0 "Turkic TV"
 turkic_tv_desc:0 "The Turkic-speaking countries have jointly launched a television channel that will play an active role in strengthening Turkic unity."
 turkic_state_federalized:0 "Turkic Unity"
 turkish_military_infulence:0 "Guardians of Kemalism"
 turkish_military_infulence_desc:0 "The guardians of Kemalism in our country staged coups in 1960 and 1980, and with them the country's principle of secularism was preserved. The Kemalist army aims to keep the country true to Atatürk's ideals: whenever a new government strayed from Atatürk's path, the Turkish Armed Forces staged a coup to set things right. §GAnd once things improved, as the people expected, the army would hand back power and new elections would be held.§!\n\n§YAlmost every 20 years, the military staged a coup or issued a memorandum to the government, demoralizing the public. People no longer accept this armed Kemalist military order, and it has taken a toll on our economy.§!\n\n§BThe Turkish Armed Forces have targeted parties such as the §Y[Conservative_L]§! that do not embrace secularism and will keep opposing them. The parties the army opposed were eventually shut down by the Constitutional Court.§!\n\nThis order must change. The people must govern themselves, and we must rid ourselves of this military tutelage quickly, but first we must be patient. §REverything in its own time.§!"
 turkish_military_infulence_coup:0 "The National Unity Committee of Kemalism"
 turkish_military_infulence_coup_desc:0 "The guardians of Kemalism in our country staged coups in 1960 and 1980, and with them the country's principle of secularism was preserved. The Kemalist army aims to keep the country true to Atatürk's ideals: whenever a new government strayed from Atatürk's path, the Turkish Armed Forces staged a coup to set things right. §GAnd once things improved, as the people expected, the army would hand back power and new elections would be held.§!\n\n§YAlmost every 20 years, the military staged a coup or issued a memorandum to the government, demoralizing the public. People no longer accept this armed Kemalist military order, and it has taken a toll on our economy.§!\n\n§BThe Turkish Armed Forces have targeted parties such as the §Y[Conservative_L]§! that do not embrace secularism and will keep opposing them. The parties the army opposed were eventually shut down by the Constitutional Court.§!\n\nThis order must change. The people must govern themselves, and we must rid ourselves of this military tutelage quickly, but first we must be patient. §REverything in its own time.§!"
 turkish_military_infulence_armed:0 "The Mobilized Guardians of Kemalism"
 turkish_military_infulence_armed_desc:0 "The guardians of Kemalism in our country staged coups in 1960 and 1980, and with them the country's principle of secularism was preserved. The Kemalist army aims to keep the country true to Atatürk's ideals: whenever a new government strayed from Atatürk's path, the Turkish Armed Forces staged a coup to set things right. §GAnd once things improved, as the people expected, the army would hand back power and new elections would be held.§!\n\n§YAlmost every 20 years, the military staged a coup or issued a memorandum to the government, demoralizing the public. People no longer accept this armed Kemalist military order, and it has taken a toll on our economy.§!\n\n§BThe Turkish Armed Forces have targeted parties such as the §Y[Conservative_L]§! that do not embrace secularism and will keep opposing them. The parties the army opposed were eventually shut down by the Constitutional Court.§!\n\nThis order must change. The people must govern themselves, and we must rid ourselves of this military tutelage quickly, but first we must be patient. §REverything in its own time.§!"
