 TUR_mafia_active_desc: "The mafia in our country has been organizing crime for many years now, disrupting the daily lives of our citizens. Our streets are somewhat safe, but far from ideal.§W\n------------\n§!We can get rid of the mafia by §Hreducing its strength to 5 or less§!, and then taking the §Hdecisions§! that become available."
