 #Focuses
 TUR_greek_issues: "Friend or Foe?"
 TUR_greek_issues_desc: "The Greeks, once a province of our empire, were forced into an alliance with us through NATO. However, despite the alliance, our relations have not improved because of our countless disputes."
 TUR_cypriot_troubles: "Cypriot Troubles"
 TUR_cypriot_troubles_desc: "Cyprus has been an island of endless conflict ever since we moved our troops into the North. The Greeks have never stopped protesting, and they seem to be trying to undo our gains on the island. We will have to deal with this accordingly."
 TUR_aggressive_approach: "Aggressive Approach"
 TUR_aggressive_approach_desc: "We will take an aggressive approach when it comes to dealing with the situation in Cyprus. After all, diplomacy has not worked in the past few years."
 TUR_direct_involvement: "Direct Involvement"
 TUR_direct_involvement_desc: "Since we have left NATO, we are no longer held back by the many restrictions on our ability to exert Turkish influence. This means we can get directly involved in Cyprus without limiting our capabilities."
 TUR_demand_british_withdrawal: "Demand British Withdrawal"
 TUR_demand_british_withdrawal_desc: "The British have historically stuck their noses into everything, but in recent years their empire has been crumbling. Cyprus, however, has been an exception. The British still maintain a presence in Akrotiri, and it will cause us problems when we inevitably expand southward."
 TUR_bring_the_north_to_fold: "Unification with Turkey"
 TUR_bring_the_north_to_fold_desc: "Northern Cypriots are Turks, and it makes no sense for there to be another Turkish state. We will demand that their government join ours and unify the Turkish people."
 TUR_history_repeated: "Finish What We Started"
 TUR_history_repeated_desc: "We need to finish what we started. After the disastrous decision not to continue south, Cyprus has been divided in two. We will have to mobilize our army and launch a second invasion of the rest of Cyprus, whether the Greeks like it or not!"
 TUR_indirect_involvement: "Indirect Involvement"
 TUR_indirect_involvement_desc: "As a republic, we cannot go around starting conflicts whenever we like; we have to show more restraint. Therefore, when it comes to Cyprus, we will take a more indirect approach and support the rightful government of Northern Cyprus."
 TUR_provide_military_training: "Provide Military Training"
 TUR_provide_military_training_desc: "We will send experts from the Turkish Armed Forces to train militias in Northern Cyprus in preparation for the inevitable clash."
 TUR_fund_militias: "Fund Cypriot Militias"
 TUR_fund_militias_desc: "Now that we have trained the militias, we can safely give them weapons and extra funding, knowing they will be competent enough to take back Southern Cyprus."
 TUR_great_uprising: "Let the Games Begin!"
 TUR_great_uprising_desc: "We can now sit back and watch the Northern Cypriots fight our war for us, as we have succeeded in training, funding and arming their militias against the Southern Cypriots."
 TUR_path_of_compromise: "The Path of Compromise"
 TUR_path_of_compromise_desc: "It is better not to start another endless conflict with our neighbour; it is smarter to reconcile and strengthen our friendship."
 TUR_withdraw_support_cyprus: "Withdraw Turkish Support"
 TUR_withdraw_support_cyprus_desc: "We will no longer support the government of Northern Cyprus, and we will recognize the government of Southern Cyprus as the one and only Cypriot government."
 TUR_support_one_cyprus: "A Tale of One Cyprus"
 TUR_support_one_cyprus_desc: "We will publicly back the concept of one Cyprus and reverse decades of policy that kept Cyprus divided!"
 TUR_peaceful_unification: "Peaceful Unification?"
 TUR_peaceful_unification_desc: "We will humbly ask the government of Northern Cyprus to unite with the government of Southern Cyprus... peacefully..."
 TUR_acquire_agean: "Request the Aegean"
 TUR_acquire_agean_desc: "Now that we have officially shown the Greeks that we are willing to compromise, even at the cost of our national interests, we will kindly ask them to transfer the Aegean to Turkish control."
 TUR_path_of_no_return: "The Path of No Return"
 TUR_path_of_no_return_desc: "An aggressive policy is all that is left for us, and sadly, there will be no turning back from this point on. Once hostilities with Greece begin, it will be very hard and costly to end them."
 TUR_aegan_dispute: "Aegean Dispute"
 TUR_aegan_dispute_desc: "The Aegean islands have been controlled by Greece ever since the end of WW1 and its disastrous consequences for the Turkish nation. Even though we have historic claims on the islands, the Greek government is unwilling to give us even partial control of them, meaning that we will need to find a way to take them by force."
 TUR_crete_rebellion: "Spark Crete Nationalism"
 TUR_crete_rebellion_desc: "If we can make the Cretan people feel occupied under Greek control, we may gain something, even if it is not the Aegean."
 TUR_arm_crete_national_army: "Form the Cretan National Army"
 TUR_arm_crete_national_army_desc: "We will form the Cretan National Army in the hope that one day it can defend Crete from a Greek invasion, should that day ever come."
 TUR_smuggle_trucks: "Smuggle Trucks"
 TUR_smuggle_trucks_desc: "The Cretan National Army cannot run on small arms and artillery alone; it will need trucks. We will provide them with trucks so that they are ready."
 TUR_let_the_games_begin: "Cretan Independence!"
 TUR_let_the_games_begin_desc: "Today is the day Crete finally declares its independence from Greece and becomes a Turkish protectorate!"
 TUR_fortify_coast: "Propaganda Against Athens"
 TUR_fortify_coast_desc: "We will start broadcasting propaganda against the Greeks by bribing Greek television stations. This will slowly destabilize the nation and give us an edge in a conflict."
 TUR_border_pictures: "Exploit Corrupt Politicians"
 TUR_border_pictures_desc: "Corrupt Greek politicians have deep pockets, and they will soon be filled with Turkish cash as we pull strings in their electoral system to promote the parties we want."
 TUR_last_second_upgrades: "Sabotage Their Industries"
 TUR_last_second_upgrades_desc: "Now that we have some influence over the Greek state, we can start sabotaging their industries so that they are weaker when we meet them in Athens!"
 TUR_siege_of_greece: "In Athens in Less Than 5 Minutes"
 TUR_siege_of_greece_desc: "It should not be long before Turkish armour and infantry roll into Athens and raise the Crescent flag on their soil!"

 TUR_pkk_insurgency_category: "Kurdish-Turkish Conflict - Military Branch"
 TUR_pkk_insurgency_category_desc: "The §Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§!, along with many other minor Kurdish insurgent groups, have been waging a guerrilla war against the Turkish government since the 1980s. The goals of these groups range from full independence to substantial autonomy. \n\n§Y£pkk PKK §! activity is measured by their §YAggressiveness§! and §YStrength§!.\n\n§YAggressiveness§! measures the overall willingness of the §Y£pkk PKK §! to fight and influences the frequency of attacks. §YAggressiveness§! decreases naturally every week down to a certain cap. The aggressiveness cap can both decrease and increase based on the development of the Kurdish provinces, as well as your and other countries' events and decisions. If it drops to 50 or lower, the §Y£pkk PKK §! will call a ceasefire. Low §HAggressiveness§! does not mean no attacks, only that the §Y£pkk PKK §! will conduct fewer attacks than usual.\n\n§YStrength§! measures the military capabilities and popularity of the §Y£pkk PKK §! and affects the strength of resistance in Kurdish states. The minimum value of §YStrength§! is 15 for every country the §Y£pkk PKK §! operates in. Strength also affects the damage done by attacks: the higher it is, the more they will hurt.\n\n§YAggressiveness§! results in a §Rhigher frequency of attacks§!, and §HStrength§! determines the damage done by these attacks. These random attacks increase §Y£pkk PKK §! §HStrength§!, which can lead to the §Y£pkk PKK §! declaring independence from us if it reaches §H100!§! We can manually reduce the §Y£pkk PKK §!'s §Hstrength§! through raids, but we would risk increasing their §HAggressiveness§!.\n\nTo eliminate the §Y£pkk PKK§!, their strength must be below §Y15§! and their aggressiveness below §Y45§!. \n\n§Y£pkk PKK §! Aggressiveness: [?TUR.TUR_PKK_aggro]\nAggressiveness Cap: [?TUR.TUR_PKK_max_aggro]\nAggressiveness: [?TUR.TUR_PKK_aggro_increase] per week\n\n§Y£pkk PKK §! Strength: [?TUR.TUR_PKK_strength]\nMinimum Strength: [?TUR.TUR_PKK_min_strength]"
#
pkk_static_modifier: "Echoes of Kurdish Resistance"
 pkk_static_modifier_desc: "Ever since the end of the Great War and the Treaty of Sèvres, the Kurds have been yearning for a country of their own, free and independent from ours. Their independence from our nation would have devastating consequences, but occupying them will do no good either."
 
 TUR_mafia_category: "The Turkish Mafia"
 TUR_mafia_category_desc: "The Turkish Mafia has been active for quite some time, committing crimes such as drug dealing, murder, fraud, you name it. In recent years, however, it has become more and more political, and certain parties have been caught making deals with it, slowly giving it more legitimacy.\n\n§HThe Mafia§! will also cost us money, and lots of it, as higher influence allows more people to commit fraud and tax crimes. Additionally, §HMafia Influence§! will §Rincrease by 1 every two weeks§! once it reaches §H60§!. This can happen if we neglect certain events or make poor choices when dealing with §Hthe Mafia§!. We can combat §HMafia Influence§! by raiding their safe houses, increasing police spending, or maintaining party popularity so that our people are not swayed by their campaigns. If we get §HMafia Influence§! below §H35§!, we will be able to arrest wanted §HMafia§! criminals, eventually allowing us to completely eradicate §Hthe Mafia§! once it is below §G5§!.\n\n§HMafia Influence§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid: "Conduct Anti-Mafia Operations"
 TUR_conduct_anti_mafia_raid_desc: "By conducting operations to clear out the Mafia, we will be able to quickly reduce its influence, although at an exceptionally high cost."
 TUR_arrest_mafia_west: "Arrest Mafia Members in Western Turkey"
 TUR_arrest_mafia_central: "Arrest Mafia Members in Central Turkey"
 TUR_arrest_mafia_south: "Arrest Mafia Members in Southern Turkey"
 TUR_arrest_mafia_east: "Arrest Mafia Members in Eastern Turkey"
 TUR_victory_over_mafia: "§PEradicate the Mafia§!"
#
 TUR_mafia_influence_mechanic: "Global Missions"
 TUR_mafia_influence_mechanic_desc: "§PThe Turkish Mafia§! has proven itself to be more than just a domestic gang; it is much more than that. §HThe Turkish Mafia has ties and influence all over the world§!, more so in some places than others. Through the Turkish diaspora, the Turkish Mafia is able to §Hgain support§! and §Hinfluence§! in other nations and use them to prop up new §PMafia proxies§!. This lets the §HTurkish Mafia§! pull strings in governments around the globe and, in some cases, even §Roverthrow them§!.\n\nAs the visuals below show, the §Hhigher the Mafia's influence§! in a country, the more control it has. If Mafia influence is §Rlow§!, the Mafia is §Runable§! to do anything drastic. But if §HMafia influence is high§!, there are §Gmany§! more options.\n\n§HInfluence in the UK§!: §G[?mafia_uk|%]§!\n§HInfluence in Germany§!: §G[?mafia_germany|%]§!\n§HInfluence in the Netherlands§!: §G[?mafia_holland|%]§!\n§HInfluence in Australia§!: §G[?mafia_australia|%]§!\n§HInfluence in Belgium§!: §G[?mafia_belgium|%]§!\n\nNo colour - Low influence\n§YYellow§! - Some influence\n§RRed§! - A lot of influence\n"
 TUR_start_eng_operations: "Start Operations in the United Kingdom"
 TUR_close_eng_operations: "End Operations in the United Kingdom"
 TUR_boost_british_firms: "Boost British Firms"
 TUR_fund_ira: "Fund Separatists"
 TUR_sow_division: "Sow Division in Politics"
 TUR_shatter_the_kingdom: "§PShatter the Kingdom§!"
 #
 TUR_start_ger_operations: "Start Operations in Germany"
 TUR_close_ger_operations: "End Operations in Germany"
 TUR_gray_wolves_networks: "Expand the Grey Wolves Networks"
 TUR_commit_vehicle_rob: "Smuggle Vehicles out of Germany"
 TUR_attack_german_politics: "Find Corrupt Statesmen"
 TUR_take_german_industries: "§PTake Control of Key Industrial Sectors§!"
 TUR_take_german_industries_desc: "Thanks to the high level of corruption in German politics, we can easily seize important industrial sectors for our own needs."
 #
 TUR_start_hol_operations: "Start Operations in the Netherlands"
 TUR_close_hol_operations: "End Operations in the Netherlands"
 TUR_establish_drug_networks_rotterdam: "Expand Drug Networks"
 TUR_sieze_goods_from_ports: "Steal Goods from the Ports"
 TUR_decrease_policing_holland: "Attack Police Funding"
 TUR_largest_drug_network: "§PEstablish the Grand Drug Hub§!"
 #
 TUR_start_aus_operations: "Start Operations in Australia"
 TUR_close_aus_operations: "End Operations in Australia"
 TUR_boost_honoured_society: "Agitate the Honoured Society"
 TUR_target_aussie_welfare: "Attack the Australian Standard of Living"
 TUR_spread_hatred_indonesia: "Spread Rumours About Indonesia"
 TUR_watch_the_conflict: "§PSteal Australian Treasure§!"
 TUR_watch_the_conflict_desc: "Using our connections and influence, we will steal Australian precious metals and use them for our own benefit."
 #
 TUR_start_bel_operations: "Start Operations in Belgium"
 TUR_close_bel_operations: "End Operations in Belgium"
 TUR_fund_bel_mafia: "Win Over Belgian Criminals"
 TUR_steal_crucial_info: "Steal Scientific Data"
 TUR_strings_in_belgian_govt: "Pull Strings in the Belgian Government"
 TUR_our_puppets: "§PFly Out Important Belgian Researchers§!"
 TUR_our_puppets_desc: "By flying out important Belgian researchers, we can put them to work in Turkey for our own benefit."

 #PKK Mechanic
 TUR_conduct_operation: "Conduct an Operation"
 TUR_strike_pkk_bases: "Raid PKK Strongholds"
 TUR_arrest_members: "Arrest Suspected PKK Members"
 TUR_attack_on_media: "Anti-PKK Propaganda"
 TUR_allow_pkk_bases: "Legalize the PKK"
 TUR_appease_pkk: "Appease the PKK"
 TUR_forbid_pkk_bases: "Ban the PKK"

 #PKK Events
 TUR_pkk.1.t: "Operation Against the PKK"
 TUR_pkk.1.d: "It is becoming increasingly clear that we cannot subdue the Kurds through dialogue, which leaves us no choice but to conduct military operations in our Kurdish regions to maintain control and stability. The likelihood of success depends on the option we pick. If we succeed, the PKK's strength will falter, but if we fail, they will be emboldened."
 TUR_pkk.1.a: "A Calculated and Well-Planned Operation"
 TUR_pkk.1.b: "A Calculated Operation"
 TUR_pkk.1.c: "No need for plans, go in!"
#
 TUR_pkk.2.t: "Operation Successful"
 TUR_pkk.2.d: "We were able to successfully subdue the PKK during our latest operation. Their forces have retreated high into the mountains, and will most likely initiate more attacks once they are ready, however for now, we can rest."
 TUR_pkk.2.a: "Mission accomplished"
#
 TUR_pkk.3.t: "Operation Failed"
 TUR_pkk.3.d: "It seems that our forces were not quite ready to move into the Kurdish regions and tame the PKK, so they had to fall back. Seeing Turkish soldiers flee the battle has given the PKK more motivation to keep fighting."
 TUR_pkk.3.a: "There is always tomorrow..."
#
 TUR_pkk.4.t: "PKK Insurgency"
 TUR_pkk.4.d: "The PKK has declared a state of its own in eastern Turkey and is willing to fight to the end for it. This is the result of our failure to contain and control the PKK, so we will now have to deal with them through war if we wish to take back those states. We can also stand down to relieve the burden of the Kurdish problem and let them go their own way, as they wish."
 TUR_pkk.4.a: "No! We will fight"
 TUR_pkk.4.b: "Let them be..."
 TUR_pkk.5.t: "PKK Launches an Attack"
 TUR_pkk.5.d: "The PKK has attacked our units stationed in the Kurdistan region in an attempt to push them out. This has increased their strength, and if it keeps up, the PKK will eventually break away!"
 TUR_pkk.5.a: "Damn"
 TUR_pkk.5.b: "Launch a counterattack"
 
 TurkeyMD.77.t: "Cypriot Unification!"
 TurkeyMD.77.d: "The Northern Cypriot government has recently consolidated control over the entirety of Cyprus, both north and south. Its influence and strength had been growing, and it was eventually able to call a referendum that allowed the people to unify. Athens has reacted with great anger and vows never to recognize Northern Cyprus as a legitimate state."
 TurkeyMD.77.a: "Well, that's something"
 TurkeyMD.88.t: "Cypriot Unification"
 TurkeyMD.88.d: "The Greek government has recently consolidated control over the entirety of Cyprus, both north and south. Its influence and strength had been growing, and it was eventually able to call a referendum that allowed the people to unify. Turkey has reacted with great anger and vows never to recognize Greece as the legitimate owner of Cyprus."
 TurkeyMD.88.a: "Interesting..."

 TurkeyRandomEvents.1.t: "§W[conservatism_L]§! Rocked by Scandal"
 TurkeyRandomEvents.1.desc: "A video has started circulating on the internet showing the §W[conservatism_L]§! leader, Deniz Baykal, in a bedroom with his former secretary. As a result of the scandal, Baykal has been forced to resign."
 TurkeyRandomEvents.1.a: "Good for us, I guess"
 TurkeyRandomEvents.1.b: "That's a fake video! Baykal will not step down!"
 TurkeyRandomEvents.1.c: "The government has no choice but to resign"

 Turkish_mafia.1.t: "The Mafia Causes a Scene!"
 Turkish_mafia.1.d: "The Mafia has caused a scene in one of our larger cities, resulting in the deaths of a few people. Although it is not yet known who committed this crime, our police force is eager to hunt them down, despite the risks involved."
 Turkish_mafia.1.a: "It is best we don't cause any more problems..."
 Turkish_mafia.1.b: "I want a full investigation, now!"
 Turkish_mafia.1.c: "Allocate all the resources you can"
 Turkish_mafia.11.t: "Police Search Unsuccessful"
 Turkish_mafia.11.d: "Our police force was unsuccessful in its search for the mobsters responsible for the crime committed a few days ago. This has made some mobsters believe they are untouchable, increasing the Mafia's influence in the country."
 Turkish_mafia.11.a: "Such incompetence..."
 Turkish_mafia.12.t: "Police Apprehend Suspects"
 Turkish_mafia.12.d: "The locals breathed a sigh of relief today as the police chief announced the arrest of several criminals and suspects in connection with a series of murders committed a few days ago. Several individuals affiliated with the Mafia are now aware of our police force's effectiveness, and it will make others think twice before joining the Mafia."
 Turkish_mafia.12.a: "Very good"
 Turkish_mafia.2.t: "Detectives Discover a Mafia Hideout"
 Turkish_mafia.2.d: "A detective in one of the rural towns has reported finding a potential Mafia hideout. The police force is quickly trying to put together a response, as they do not know what is inside, or whether it even is a Mafia hideout. It is very likely that the Mafia is connected to the location, but nonetheless, there will always be risks involved."
 Turkish_mafia.2.a: "Some things are just better left alone..."
 Turkish_mafia.2.b: "What do you mean they're putting together a response? Prepare one, and do it quickly!"
 Turkish_mafia.2.c: "Allocate all the resources you can"
 Turkish_mafia.21.t: "Police Suffer Casualties!"
 Turkish_mafia.21.d: "It appears the hideout was an ambush, with several gunmen ready to open fire on our officers. Unfortunately, due to a lack of weapons and sufficient backup, several officers were killed and many more were injured..."
 Turkish_mafia.21.a: "Damn it!"
 Turkish_mafia.22.t: "Hideout Cleared Safely"
 Turkish_mafia.22.d: "Everything went perfectly in our latest operation. The hideout was quickly cleared by our units, and several suspects caught by surprise were swiftly apprehended by our officers."
 Turkish_mafia.22.a: "Great"
 Turkish_mafia.3.t: "Large Weapons Cache Discovered"
 Turkish_mafia.3.d: "During an ongoing search, the police found a large weapons cache stored in a warehouse. Many in the community are urging the police to find out where this cache came from and arrest those involved."
 Turkish_mafia.3.a: "How about we just take the weapons?"
 Turkish_mafia.3.b: "Good idea, start a search immediately!"
 Turkish_mafia.3.c: "Allocate all the resources you can"
 Turkish_mafia.31.t: "Police Botch the Investigation!"
 Turkish_mafia.31.d: "Due to a lack of coordination and a high level of incompetence, our police force failed to find the criminals who left the weapons cache. In fact, during the investigation our police lost a considerable amount of their own weapons! How could this happen, you may ask? It turns out our officers went in with a supply van full of weapons, and someone hijacked the van and drove off!"
 Turkish_mafia.31.a: "Seriously?"
 Turkish_mafia.32.t: "Police Locate Suspects"
 Turkish_mafia.32.d: "It turned out there was an underground weapons trade in one of our more urbanized cities. Luckily, we were able to catch the criminals before any major damage was done."
 Turkish_mafia.32.a: "This is the standard we expect"
 Turkish_mafia.4.t: "Police Seize Drug Cargo"
 Turkish_mafia.4.d: "A group of officers stumbled across a suspicious cargo container, and when they opened it, they were astonished. Large quantities of illegal drugs had been smuggled into the country through an unknown network, and locals are eager to see the suspects caught."
 Turkish_mafia.4.a: "Well... they must have been for medical use, right?"
 Turkish_mafia.4.b: "I want an investigation immediately!"
 Turkish_mafia.4.c: "Allocate all the resources you can"
 Turkish_mafia.41.t: "Suspects Detained"
 Turkish_mafia.41.d: "We have found several individuals connected to the drug container, and they are now being questioned by the police. Many in the community are glad that illegal drugs will not plague their neighbourhoods."
 Turkish_mafia.41.a: "We still have a lot to do! Get back to work!"
 Turkish_mafia.42.t: "Investigation Leads Nowhere"
 Turkish_mafia.42.d: "After a lengthy investigation, our officers were unable to connect anyone to the drug container. This is a major loss for us, as illegal drugs are still being smuggled into the country and we have no leads!"
 Turkish_mafia.42.a: "Unbelievable"
 #
 Turkish_mafia.5.t: "Mafia Assassinates a High-Ranking Official"
 Turkish_mafia.5.d: "Tragedy has struck: the Turkish mafia has assassinated a high-ranking official. This will make our party's job much harder than it needs to be, and our opposition is most likely overjoyed..."
 Turkish_mafia.5.a: "Damn it!"
 Turkish_mafia.6.t: "Mafia Heist"
 Turkish_mafia.6.d: "The Mafia has pulled off a heist at one of our country's banks. They have stolen a great deal of money and, in the end, hurt our economy and our people."
 Turkish_mafia.6.a: "Unbelievable"
 Turkish_mafia.7.t: "Explosion Rocks a Shopping Centre"
 Turkish_mafia.7.d: "Fingers are being pointed at the Mafia today, as the police suspect it was behind a bombing at a large shopping centre. Its goal is unknown, but one thing is certain: it is causing the government a lot of problems..."
 Turkish_mafia.7.a: "But why?"
 Turkish_mafia.8.t: "Police in a Standoff with the Mafia"
 Turkish_mafia.8.d: "This morning there was a very long standoff between our police and the Mafia. Several police officers were injured, and some were even killed."
 Turkish_mafia.8.a: "Terrible!"
 Turkish_mafia.9.t: "The Rise of the Mafia"
 Turkish_mafia.9.d: "The Mafia has been ramping up its attacks recently, and it has frankly overstretched our security forces. With more people than ever joining the Mafia and turning to a life of crime, the legitimacy of our state is being called into question. Many people are demanding that our government step down, but we have a duty to serve and protect our people..."
 Turkish_mafia.9.a: "The fight will never stop!"
 Turkish_mafia.9.b: "Maybe they are right..."
#

 TurkeyFocusEvents.10.t: "The Cypriot Trouble"
 TurkeyFocusEvents.10.d: "The Turkish government is pressing the Cyprus problem harder than before, leaving our government no choice but to respond. We have devised a plan to counter these provocations and will pursue it accordingly!"
 TurkeyFocusEvents.10.a: "Onward!"
 TurkeyFocusEvents.11.t: "Turbulence in Cyprus"
 TurkeyFocusEvents.11.d: "The Greek government is not very cooperative with us on many issues, and even less so when it comes to Cyprus. We will devise a strategic plan to bring Cyprus to our side rather than Greece's, no matter the cost."
 TurkeyFocusEvents.11.a: "Let's see what happens"
 TurkeyFocusEvents.12.t: "Turkey asks us to attack Southern Cyprus!"
 TurkeyFocusEvents.12.d: "The Turkish government has trained and armed 3 militia divisions for us, hoping that we will attack the Cypriots in the south. It would obviously be in our interest to do so, but we can always refuse."
 TurkeyFocusEvents.12.a: "Absolutely!"
 TurkeyFocusEvents.12.b: "No"
 TurkeyFocusEvents.14.t: "The Turkish Government Demands Our Withdrawal from Cyprus!"
 TurkeyFocusEvents.14.d: "Earlier today, Turkish diplomats demanded that British troops withdraw from Cyprus. This would put the small island nation at serious risk, even more so than when Turkey first invaded."
 TurkeyFocusEvents.14.a: "Let us not escalate things..."
 TurkeyFocusEvents.14.b: "What a ridiculous demand"
 TurkeyFocusEvents.15.t: "Turkey Requests Unification"
 TurkeyFocusEvents.15.d: "The Turkish government has asked us to unify with them and become part of the greater Turkish state. Accepting would probably benefit us, as they may attack if we refuse..."
 TurkeyFocusEvents.15.a: "We must unify!"
 TurkeyFocusEvents.15.b: "No"
 TurkeyFocusEvents.16.t: "The Turkish and Greek Governments Request Cypriot Reunification!"
 TurkeyFocusEvents.16.d: "The Turkish government has asked us to join Southern Cyprus and reunify within our pre-invasion borders."
 TurkeyFocusEvents.16.a: "It's about time"
 TurkeyFocusEvents.16.b: "No"
 TurkeyFocusEvents.17.t: "Turkey wants the Aegean"
 TurkeyFocusEvents.17.d: "Turkish delegates have come to Athens and asked us to give them control of the Aegean in light of our strengthened ties. The Turkish government has withdrawn its support from Northern Cyprus and allowed the island to unify, but does that give them the right to ask for rightful Greek territory?"
 TurkeyFocusEvents.17.a: "We should, in the name of peace"
 TurkeyFocusEvents.17.b: "Uhh... No"
 TurkeyFocusEvents.171.t: "The Greeks Give Us the Aegean!"
 TurkeyFocusEvents.171.d: "We received great news today: the Greek delegates happily signed a treaty giving our country complete control over the Aegean Islands!"
 TurkeyFocusEvents.171.a: "Amazing!"
 TurkeyFocusEvents.172.t: "The Greeks Refuse to Give Us the Aegean!"
 TurkeyFocusEvents.172.d: "Terrible news reached Ankara today: the Greek delegates have rejected our request regarding the Aegean Islands!"
 TurkeyFocusEvents.172.a: "We can always make them give us the Aegean..."
 TurkeyFocusEvents.18.t: "Turkey Pursues an Aggressive Policy!"
 TurkeyFocusEvents.18.d: "The Turkish government is not willing to hold diplomatic talks and has resorted to an aggressive agenda to get what it wants. We need to limit its influence as much as possible to prevent disaster!"
 TurkeyFocusEvents.18.a: "Damn"
 TurkeyFocusEvents.19.t: "Turkey Wants to Establish a Buffer Zone"
 TurkeyFocusEvents.19.d: "The Turkish government wants to establish a buffer zone along our border. This means we would have to completely demilitarize several of our northern provinces, withdraw all military presence and let the Turks fight the Kurds."
 TurkeyFocusEvents.19.a: "It is for the best..."
 TurkeyFocusEvents.19.b: "Absolutely not!"

 Turkish_parties.1.t: "Liberal Parties Gain Traction"
 Turkish_parties.1.d: "Our people are becoming more and more liberal, as the liberal parties have gained a larger following than before. As a result, people are pushing for more liberal policies in our country."
 Turkish_parties.1.a: "Okay"
 Turkish_parties.2.t: "Conservative Parties Gain Traction"
 Turkish_parties.2.d: "Our people are becoming more and more conservative, as the conservative parties have gained a larger following than before. As a result, people are pushing for more conservative policies in our country."
 Turkish_parties.2.a: "Okay"
