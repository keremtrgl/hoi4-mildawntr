 Neutral_Muslim_Brotherhood:0 "Ilımlı İslamcı"
 Neutral_Muslim_Brotherhood_desc:0 "Ilımlı İslamcı: - Mısır'da İslam âlimi Hasan el-Benna tarafından 1928'de kurulan sınır ötesi Sünni İslamcı örgüt Müslüman Kardeşler'den esinlenen grup ve partiler. Siyasi aktivizmi İslami hayır işleriyle birleştiren modeliyle Arap Dünyası'nda ve ötesinde destekçileri vardır. Hedefi siyasi İslami yönetimdir ve Kur'an'ı ve Sünnet'i toplumun tek referans noktası olarak yerleştirmeyi amaçlar."
 nationalist:0 "Milliyetçi Görüş"
 nationalist_noun:0 "Milliyetçi"
 nationalist_desc:0 "Milliyetçi Hükümet"
 Nat_Autocracy:0 "Askerî Cunta"
 Nat_Autocracy_desc:0 "Askerî Cunta: - Milliyetçi hükümetler küreselleşmeden en kötü payı aldıklarına inanır ve korumacılığa, militarizasyona ve ulusal ve etnik egemenliğe dayalı bir ulusal yeniden doğuş ararlar. Küresel liberal kurumlardan nefret ederler, ancak dar iç veya yayılmacı hedeflerini ilerletmek için uluslararası hizalanmalarında pragmatik kalabilirler."
 Nat_Fascism:0 "Faşizm"
 Nat_Fascism_desc:0 "Faşist: - Milliyetçi hükümetler küreselleşmeden en kötü payı aldıklarına inanır ve korumacılığa, militarizasyona ve ulusal ve etnik egemenliğe dayalı bir ulusal yeniden doğuş ararlar. Küresel liberal kurumlardan nefret ederler, ancak dar iç veya yayılmacı hedeflerini ilerletmek için uluslararası hizalanmalarında pragmatik kalabilirler."
 Nat_Populism:0 "Popülizm"
 Nat_Populism_desc:0 "Sağ Popülist: - Milliyetçi hükümetler küreselleşmeden en kötü payı aldıklarına inanır ve korumacılığa, militarizasyona ve ulusal ve etnik egemenliğe dayalı bir ulusal yeniden doğuş ararlar. Küresel liberal kurumlardan nefret ederler, ancak dar iç veya yayılmacı hedeflerini ilerletmek için uluslararası hizalanmalarında pragmatik kalabilirler."
