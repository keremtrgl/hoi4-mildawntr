l_english:
 democratic:0 "Batı Görüşü"
 democratic_noun:0 "Batılı"
 democratic_desc:0 "Batı Yanlısı Hükümet"
 conservatism:0 "Muhafazakârlık"
 conservatism_desc:0 "Muhafazakârlık: - Batılı ve Batı yanlısı hükümetler, Sovyetler Birliği'nin çöküşünden beri hüküm süren ABD merkezli Liberal Dünya Düzenini korumaya çalışır. Dünya Bankası ve IMF gibi kurumlar aracılığıyla ekonomik serbestleşmeyi ve millileştirmenin kaldırılmasını teşvik ederler. Batılı görüşe sahip ülkelerin büyük çoğunluğu çeşitli demokrasi biçimleridir, ancak mevcut durumdan çıkar sağlayan Batı yanlısı güçlü lider hükümetleri de bunların arkasındadır. ---- Muhafazakârlık, genel olarak geleneksel kurumların ve toplumsal normların desteklenmesidir. Demokratik ülkelerde bu genellikle dinî ve milliyetçi değerlerin, serbest piyasa ekonomisinin ve kademeli, temkinli reformun desteklenmesi olarak ortaya çıkar."
 liberalism:0 "Liberalizm"
 liberalism_desc:0 "Liberalizm: - Batılı ve Batı yanlısı hükümetler, Sovyetler Birliği'nin çöküşünden beri hüküm süren ABD merkezli Liberal Dünya Düzenini korumaya çalışır. Dünya Bankası ve IMF gibi kurumlar aracılığıyla ekonomik serbestleşmeyi ve millileştirmenin kaldırılmasını teşvik ederler. Batılı görüşe sahip ülkelerin büyük çoğunluğu çeşitli demokrasi biçimleridir, ancak mevcut durumdan çıkar sağlayan Batı yanlısı güçlü lider hükümetleri de bunların arkasındadır. ---- Liberalizm, dünyanın dört bir yanında birçok farklı çeşidi olan yaygın bir ideolojidir. Ancak çoğu liberal sivil özgürlükleri, serbest piyasaları ve demokratik yönetimi desteklemekte birleşir. Genellikle siyasete reformist bir gözle bakar, kurumları zaman içinde değiştirmeyi ve dönüştürmeyi amaçlarlar."
 socialism:0 "Sosyal Demokrat"
 socialism_desc:0 "Sosyal Demokrat: - Batılı ve Batı yanlısı hükümetler, Sovyetler Birliği'nin çöküşünden beri hüküm süren ABD merkezli Liberal Dünya Düzenini korumaya çalışır. Dünya Bankası ve IMF gibi kurumlar aracılığıyla ekonomik serbestleşmeyi ve millileştirmenin kaldırılmasını teşvik ederler. Batılı görüşe sahip ülkelerin büyük çoğunluğu çeşitli demokrasi biçimleridir, ancak mevcut durumdan çıkar sağlayan Batı yanlısı güçlü lider hükümetleri de bunların arkasındadır. ---- Sosyal Demokratlar demokratik siyasetin sol kanadını oluşturur. Genellikle güçlü bir refah devletini, liberal toplumsal değerleri, kapsamlı reformları ve özellikle tarihsel olarak ezilen gruplar için insan haklarının geliştirilmesini desteklerler. Ilımlı sosyalistler de çoğunlukla bu grubun içine dahil edilir."
 Western_Autocracy:0 "Batı Yanlısı Otokrat"
 Western_Autocracy_desc:0 "Batı Yanlısı Otokrat: - Batılı ve Batı yanlısı hükümetler, Sovyetler Birliği'nin çöküşünden beri hüküm süren ABD merkezli Liberal Dünya Düzenini korumaya çalışır. Dünya Bankası ve IMF gibi kurumlar aracılığıyla ekonomik serbestleşmeyi ve yasaların millileştirmeden çıkarılmasını teşvik ederler. Batılı görüşe sahip ülkelerin büyük çoğunluğu çeşitli demokrasi biçimleridir, ancak mevcut durumdan çıkar sağlayan Batı yanlısı güçlü lider hükümetleri de bunların arkasındadır. ---- Batı yanlısı otokrasiler demokrasi, çoğulculuk ve insan hakları gibi «Batı Değerleriyle» gerçekten uyumlu değildir. Ancak pragmatik nedenlerle Batı ile hizalı kalırlar ve çoğu zaman, Batılı destekçilerini yatıştırmak için olsa bile bazı zayıf liberal kurumları da bünyelerinde bulundururlar."
 communism:0 "Yükselen Görüş"
 communism_noun:0 "Yükselen"
 communism_desc:0 "Yükselen Hizalı Hükümet"
 communist_state:0 "Komünist"
 communist_state_desc:0 "Komünist Devlet: - Yükselen Görüşlü hükümetler, özellikle Küresel Güney ve Sovyet Sonrası Alanda, hâkim Liberal Dünya Düzenini kendi alternatif kurumları ve çok kutuplu küresel siyaset anlayışıyla değiştirmeyi hedefleyenlerdir. Küreselleşmeye, hükümet biçimlerine ve iç politikaya yönelik tutumları çoğu zaman farklıdır.---- Komünizm, serbest piyasa kapitalizmine kesin biçimde karşı çıkan ve üretim araçlarının denetiminin «işçilerde» olmasını savunan radikal bir sosyalist ideolojidir. Bunun tam olarak ne anlama geldiği değişir, ancak çoğu zaman devletin ve ekonominin tek, otoriter bir «Komünist Parti» tarafından denetlenmesi anlamına gelmiştir. Sovyetler Birliği'nin çöküşünden beri komünizm dünya genelinde büyük ölçüde zayıflamış olsa da bazı devletler hâlâ onu resmî ideolojileri olarak benimsiyor. Yükselen güçlerle hizalı olanlar mevcut liberal, kapitalist dünya düzenini sömürücü görür ve yıkılıp yerine yenisinin konması gerektiğine inanır."
 Conservative:0 "Gerici"
 Conservative_desc:0 "Gerici: - Yükselen Görüşlü hükümetler, özellikle Küresel Güney ve Sovyet Sonrası Alanda, hâkim Liberal Dünya Düzenini kendi alternatif kurumları ve çok kutuplu küresel siyaset anlayışıyla değiştirmeyi hedefleyenlerdir. Küreselleşmeye, hükümet biçimlerine ve iç politikaya yönelik tutumları çoğu zaman farklıdır.---- Gericiler ülkelerinin izlediği yönden memnun değildir ve geçmişin idealize edilmiş bir «altın çağına» dönmeyi arzu ederler. Bu nedenle ülkelerinin yaşadığı değişimlerin çoğunu tersine çevirmeyi amaçlarlar. Liberalizme kesin biçimde karşıdırlar ve bu yüzden modern çağda genellikle Batı'ya karşı hizalanırlar."
 Autocracy:0 "Otokrasi"
 Autocracy_desc:0 "Otokrasi: - Yükselen Görüşlü hükümetler, özellikle Küresel Güney ve Sovyet Sonrası Alanda, hâkim Liberal Dünya Düzenini kendi alternatif kurumları ve çok kutuplu küresel siyaset anlayışıyla değiştirmeyi hedefleyenlerdir. Küreselleşmeye, hükümet biçimlerine ve iç politikaya yönelik tutumları çoğu zaman farklıdır.---- Otokrasiler, siyasi gücün büyük bölümünün tek bir kişinin elinde olduğu klasik diktatörlüklerdir. Otokratlar, iktidarlarını tehdit eden her türlü hizbe veya politikaya karşı çıkar. Batı'yı tahtlarına yönelik başlıca dış tehdit olarak görenler genellikle yükselen güçlerle hizalanır."
 Vilayat_e_Faqih:0 "Şii Devrimci"
 Vilayat_e_Faqih_desc:0 "Katı Şii Devrimci: - Yükselen Görüşlü hükümetler, özellikle Küresel Güney ve Sovyet Sonrası Alanda, hâkim Liberal Dünya Düzenini kendi alternatif kurumları ve çok kutuplu küresel siyaset anlayışıyla değiştirmeyi hedefleyenlerdir. Küreselleşmeye, hükümet biçimlerine ve iç politikaya yönelik tutumları çoğu zaman farklıdır.---- Humeynicilik, katı bir Şii-devrimci ideolojidir. Geleneksel monarşizme, sosyalizme ve liberalizme aynı derecede karşı çıkan Humeyniciler, Şii din adamlarının seçilmiş yetkililer üzerinde en yüksek otoriteye sahip olduğu teokratik bir cumhuriyetin kurulmasını destekler."
 Mod_Vilayat_e_Faqih:0 "Ilımlı Şii Devrimci"
 Mod_Vilayat_e_Faqih_desc:0 "Ilımlı Şii Devrimci: - Yükselen Görüşlü hükümetler, özellikle Küresel Güney ve Sovyet Sonrası Alanda, hâkim Liberal Dünya Düzenini kendi alternatif kurumları ve çok kutuplu küresel siyaset anlayışıyla değiştirmeyi hedefleyenlerdir. Küreselleşmeye, hükümet biçimlerine ve iç politikaya yönelik tutumları çoğu zaman farklıdır.---- Ilımlı Şii siyasetçiler, jeopolitik açıdan genellikle İran ile hizalı olsalar da Humeynici teokrasi kurmayı hedeflemezler. Bunun yerine genellikle Şii Müslüman değerlerinden etkilenen daha çoğulcu (demokratik veya başka türlü) bir hükümet biçimini tercih ederler."
 anarchist_communism:0 "Sol Kanat"
 anarchist_communism_desc:0 "Sol Radikal: - Yükselen Görüşlü hükümetler, özellikle Küresel Güney ve Sovyet Sonrası Alanda, hâkim Liberal Dünya Düzenini kendi alternatif kurumları ve çok kutuplu küresel siyaset anlayışıyla değiştirmeyi hedefleyenlerdir. Küreselleşmeye, hükümet biçimlerine ve iç politikaya yönelik tutumları çoğu zaman farklıdır.---- Sol radikaller komünistlere kıyasla sosyalizmin daha ılımlı bir vizyonunu savunur, ancak yine de sosyal demokratlardan daha katıdırlar. Genellikle mevcut uluslararası ekonomik ve siyasi yapılara karşı çıkar, onları adaletsiz ve sömürücü bulurlar."
 fascism:0 "Selefi Görüş"
 fascism_noun:0 "Selefi"
 fascism_desc:0 "Totaliter Köktendinci Rejim"
 Kingdom:0 "Krallık"
 Kingdom_desc:0 "Düzen Yanlısı Selefilik: - Selefilik, ana akım Sünni İslam'ın aşırı muhafazakâr, hoşgörüsüz, köktendinci bir koludur. Vahhabi Körfez Monarşilerinin yirminci yüzyılın ortalarından beri öğretileri için milyarlarca dolar fon sağlamasıyla önem kazanmıştır. Selefilik, Taliban, El Kaide ve IŞİD'de özellikle şiddetli biçimlere bürünmüştür. Tüm İslam topraklarını fethedip İslam Hukuku'nun sert yorumuyla yönetmeyi amaçlarlar. Diğer İslam biçimlerini ve azınlık dinlerini tanımazlar, hedeflerine ulaşmak için hiçbir şeyden çekinmezler.---- Vahhabilik ve Medhalilik gibi bazı Selefi düşünce akımları, radikal devrim ve silahlı cihat yerine mevcut düzenin korunmasını savunur. Bu Selefiler, Kutupçu cihatçıların köktendinci ve hoşgörüsüz görüşlerini paylaşır, ancak genellikle şiddeti reddeder ve mevcut hükümetleri destekler. Uyumları, İslamcılığın daha siyasi akımlarının iktidarlarına yönelik tehdidinden korkan otoriter Arap devletleri arasında onları popüler kılar."
 Caliphate:0 "Hilafet"
 Caliphate_desc:0 "Hilafet: - Selefilik, ana akım Sünni İslam'ın aşırı muhafazakâr, hoşgörüsüz ve köktendinci bir koludur. Vahhabi Körfez Monarşilerinin yirminci yüzyılın ortalarından beri öğretileri için milyarlarca dolar fon sağlamasıyla önem kazanmıştır. Selefilik, Taliban, El Kaide ve IŞİD'de özellikle şiddetli biçimlere bürünmüştür. Tüm İslam topraklarını fethedip İslam Hukuku'nun sert yorumuyla yönetmeyi amaçlarlar. Diğer İslam biçimlerini ve azınlık dinlerini tanımazlar, hedeflerine ulaşmak için hiçbir şeyden çekinmezler.---- Cihatçılar, İslam dünyasının putperest ve sapkın gördükleri hükümetlerini yıkıp yok etmeyi amaçlar. İslam anlayışlarını silah zoruyla yaymaya çalışırlar."
 neutrality:0 "Bağlantısız Görüş"
 neutrality_noun:0 "Bağlantısızlık"
 neutrality_desc:0 "Bağlantısız Hükümet"
 Neutral_conservatism:0 "Muhafazakâr"
 Neutral_conservatism_desc:0 "Muhafazakâr: - Bağlantısız hükümetler hükümet türleri ve alt ideolojileri bakımından büyük ölçüde farklılık gösterir ve dış hizalanmalarına genellikle çok pragmatik yaklaşır. Kendi ulusal bağımsızlıklarını veya diğer bölgesel hedeflerini ilerletmek isteyebilirler, ya da nüfuz mücadelelerinde onları farklı yönlere çeken büyük güçler arasında kalmış olabilirler."
