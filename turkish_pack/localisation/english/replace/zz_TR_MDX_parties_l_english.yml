 Neutral_Communism_desc:0 "Komünist Devlet: - Bağlantısız hükümetler hükümet türleri ve alt ideolojileri bakımından büyük ölçüde farklılık gösterir ve dış hizalanmalarına genellikle çok pragmatik yaklaşır. Kendi ulusal bağımsızlıklarını veya diğer bölgesel hedeflerini ilerletmek isteyebilirler, ya da nüfuz mücadelelerinde onları farklı yönlere çeken büyük güçler arasında kalmış olabilirler."
