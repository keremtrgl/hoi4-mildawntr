 coalition.11.t:0 "[Caliphate_L] ile müzakere ([?party_pop_elect_array^11|%0])"
 coalition.11.d:0 "[Root.GetLeader], size defalarca «pis kâfir köpek» demiş olsak da bunda gerçekten kötü bir niyet yoktu.\n\nİnşallah Hakiki Hilafet'e katılmadığınız için kesinlikle cehenneme gideceksiniz ama biz, adil ve cesur mücahitler, sizi doğru yola yönlendirmeye elbette yardımcı olabiliriz; çünkü Allah'ın gerçek iradesini yalnızca biz biliyoruz, bize Peygamber Muhammed (sallallahu aleyhi ve sellem) aracılığıyla bildirildi. Elbette çok, çok barışçıyız ve demokratik ilkelere bağlıyız. Hiçbir talebimiz yok. Sadece yardım etmek için buradayız. İnşallah, örneğin ordu, polis ve mahkemeleri yönetmenin ağır yükünü omuzlarınızdan alabiliriz."
 coalition.11.a:0 "Bu harika bir fikir gibi görünüyor"
 coalition.11.b:0 "lol"
