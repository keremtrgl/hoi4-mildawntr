l_english:
 MD4_election_campaign.0.t:0 "Yarış son iki haftaya girerken seçim kampanyası kızışıyor"
 MD4_election_campaign.0.d:0 "[Root.GetLastElection] tarihli son seçimden bu yana [Root.GetLeader], [Root.GetName] ülkesini istikrarlı biçimde yönetiyor. Son oylar iki hafta sonra kullanılacağı için bu yön, güçlü rakipler tarafından sorgulanacak.\n\nKampanya reklam harcamalarının çoğu yapıldı ve anketler etkilerini göstermeye başlıyor."
 MD4_election_campaign.0.a:0 "Hadi bakalım!"
 MD4_election_campaign.1.t:0 "Dış Politika Tartışması: [Root.GetLeader] kimi hedef alacağı konusunda zor kararlarla karşı karşıya"
 MD4_election_campaign.1.d:0 "Son oylama yaklaşırken dış politikamızı kiminkiyle karşılaştıracağımıza karar vermeliyiz. Dünya giderek daha çalkantılı bir yer haline geldikçe bu konu seçmenler için özellikle önemli oldu.\n\nVurucu birkaç olumsuz reklam rakibimizin popülerliğini kesinlikle düşürecektir ancak rakibin elinde bizimle ilgili ciddi bir koz varsa ya da saldırılarımız çok zayıf bir araştırmaya dayanıyorsa bunu başarıyla karşılama ihtimali küçük de olsa vardır.\n\nSaldırının etkisini aldığımız kampanya bağışlarının miktarı belirler."
 MD4_election_campaign.1.a:0 "[Root.GetFascistParty] delilerine saldır"
 MD4_election_campaign.1.b:0 "Milliyetçi aptallara saldır"
 MD4_election_campaign.1.c:0 "[Root.GetNeutralParty] budalalarına saldır"
 MD4_election_campaign.1.e:0 "[Root.GetCommunistParty] ahmaklarına saldır"
 MD4_election_campaign.1.f:0 "[Root.GetDemocraticParty] embesillerine saldır"
 MD4_election_campaign.1.g:0 "Kimseye saldırmaktan kaçın"
 MD4_election_campaign.3.t:0 "[Root.GetFascistParty] toparlandı - saldırılarla güçlendi"
 MD4_election_campaign.3.d:0 "Onlara yönelik şiddetli saldırılarımıza rağmen tartışmalı [Root.GetFascistParty] tüm çekirdek takipçilerini elinde tutmayı başardı. Olumsuz reklamlarımızdan kaynaklanan artan ilgiyi lehlerine kullandılar ve ideolojilerini yaymak için tüm büyük haber kuruluşlarında benzeri görülmemiş bir erişim elde ettiler."
 MD4_election_campaign.3.a:0 "Lanet olsun"
 MD4_election_campaign.4.t:0 "Milliyetçilere yönelik olumsuz saldırılar ters tepti"
 MD4_election_campaign.4.d:0 "Onlara yönelik şiddetli saldırılarımıza rağmen tartışmalı milliyetçiler çekirdek takipçilerinin çoğunu elinde tutmayı başardı. Sistemin bozuk ve yozlaşmış olduğunu, ana akım medyanın toplumu manipüle ettiğini ve kampanya bağışları yoluyla [Root.GetLeader] siyasetinin en yüksek teklifi verene açık olduğunu öne sürerek ülke genelinde önemli puanlar topladılar."
 MD4_election_campaign.4.a:0 "Lanet olsun"
 MD4_election_campaign.5.t:0 "[Root.GetNeutralParty] karşıtı olumsuz saldırılar etki yaratamadı"
 MD4_election_campaign.5.d:0 "Tüm çabalarımıza rağmen kamuoyu, [Root.GetNeutralParty] hedefli olumsuz reklam kampanyamıza karşı döndü. Muhtemelen birkaç neden var ama bunlardan biri, [Root.GetLeader] gibi saygın bir siyasetçinin saldırısının «zayıfa vurmak» olarak algılanması ve rakibin artan medya ilgisiyle daha fazla seçmene ulaşabilmesi olabilir."
 MD4_election_campaign.5.a:0 "Lanet olsun"
 MD4_election_campaign.6.t:0 "[Root.GetCommunistParty] karşıtı olumsuz saldırılar sağır kulaklara çarptı"
 MD4_election_campaign.6.d:0 "Tüm çabalarımıza rağmen kamuoyu, [Root.GetCommunistParty] hedefli olumsuz reklam kampanyamıza karşı döndü. Muhtemelen birkaç neden var ama bunlardan biri, [Root.GetLeader] gibi saygın bir siyasetçinin saldırısının «zayıfa vurmak» olarak algılanması ve rakibin artan medya ilgisiyle daha fazla seçmene ulaşabilmesi olabilir."
 MD4_election_campaign.6.a:0 "Lanet olsun"
 MD4_election_campaign.7.t:0 "[Root.GetDemocraticParty] karşıtı olumsuz saldırılar ters tepti"
 MD4_election_campaign.7.d:0 "Tüm çabalarımıza rağmen kamuoyu, [Root.GetDemocraticParty] hedefli olumsuz reklam kampanyamıza karşı döndü. Bunu açıkça yabancı müdahalesine yüklesek de kapalı kapılar ardındaki asıl şüphe, saldırılarımızın o kadar abartılı olduğu ve en başta çok az kişinin onlara inandığı yönünde."
 MD4_election_campaign.7.a:0 "Lanet olsun"
 MD4_election_campaign.8.t:0 "Kampanyaya tartışmalı bir konuşmacı davet edilsin mi?"
 MD4_election_campaign.8.d:0 "Normalde bu yüksek sesle önerilmez, ciddiye alınması şöyle dursun. Ancak [Root.GetLeader] düşük onay oranı nedeniyle almaya değer bir risk olabilir; konuşmacı partimizin marjinal bir üyesi ve geçmişte tartışmalı birçok açıklama yapmasıyla ve uygunsuz zamanlarda konuşmasıyla tanınıyor. Ancak öğrenciler ve gençler arasında çok popüler; bu, oyunu bizden yana kullanmaya ikna etmemiz gereken kilit bir grup."
 MD4_election_campaign.8.a:0 "Davet et ve en iyisini um"
 MD4_election_campaign.8.b:0 "Riske girme"
 MD4_election_campaign.9.t:0 "Büyük miting katılımı [Root.GetLeader] için heyecanı yeniden canlandırdı"
 MD4_election_campaign.9.d:0 "Miting büyük bir başarıydı ve tüm kampanya sezonunun en yüksek katılımını çekti. Tartışmalı konuşmacı yalnızca [Root.GetLeader] için övgüler yağdırıp parti birliğini vaaz etmekle kalmadı; bunu o kadar coşkulu ve ikna edici biçimde yaptı ki konuşmanın tamamını aslında [Root.GetLeader] ekibinin yazdığından kimse şüphelenmedi."
 MD4_election_campaign.9.a:0 "Kampanya için çok ihtiyaç duyulan bir destek"
 MD4_election_campaign.10.t:0 "[Root.GetLeader] Kampanyası İçin Felaket"
 MD4_election_campaign.10.d:0 "Kampanya sezonunun en yüksek katılımıyla [Root.GetLeader] için parlama sahnesi hazırdı. Ne yazık ki heyecan yaratmak için davet edilen tartışmalı konuşmacı hazırladığımız konuşmayı yırtıp attı ve bunun yerine «bu yönetim dahil tüm yönetimlerin başarısızlıkları» üzerine uzun bir nutuk atıp gençlere «kalbinize göre oy verin ya da evde kalın» çağrısı yaptı.\n\nSöylemeye gerek yok, bu kısa söz sonrasında tüm medyaya yayıldı; rakiplerimiz keyifle izliyor."
 MD4_election_campaign.10.a:0 "Ne büyük başarısızlık!"
 election_coalition_won.0.t:0 "[Root.GetAdjective] Seçimleri: Hükümet Koalisyonu çoğunluğu kazandı!"
 election_coalition_won.0.d:0 "Mevcut iktidar partileri yeni mecliste çoğunluğu elde etti ve birlikte yönetme yetkilerini sürdürebilir."
 election_coalition_won.0.a:0 "Mevcut hükümetle devam et"
 election_coalition_won.0.b:0 "Yeni hükümet kurulurken değişiklik yap"
 election_single_party.0.t:0 "[Root.GetAdjective] Seçimleri: [Root.GetRulingParty] çoğunluğu kazandı!"
 election_single_party.0.d:0 "[Root.GetRulingParty] tek başına meclis sandalyelerinin çoğunluğunu kazandı. Ne büyük bir zafer!"
 election_single_party.0.a:0 "Demokrasi için ne güzel bir gün!"
 election_single_party.1.t:0 "[Root.GetAdjective] Seçimleri: [Root.GetLeader] yenildi!"
 election_single_party.1.d:0 "[show_biggest_party_elect] tek başına meclis sandalyelerinin çoğunluğunu kazanınca [Root.GetLeader] için siyasi gelecek fiilen bitti; [Root.GetRulingParty] üyeleri istifa çağrısı yapıyor.\n\n[show_biggest_party_elect] hemen [Root.GetName] ülkesinin yeni hükümeti olarak görevi devralacak."
 election_single_party.1.a:0 "Yenilgiyi kabul et ve kazananı tebrik et."
 MD4_election.1.t:0 "[Root.GetRulingParty] Yeniden Seçildi!"
 MD4_election.1.d:0 "Tüm oylar sayıldığında [Root.GetAdjective] seçmenler [Root.GetLeader] liderine bir dönem daha vermeye karar verdi. Yüksek görev onay oranları sayesinde [Root.GetLeader], destek sağlamak için diğer partilerle anlaşma yapmaya gerek kalmadan kazandı."
 MD4_election.1.d_term_ended:0 "Tüm oylar sayıldığında [Root.GetAdjective] seçmenler [Root.GetLeader] liderinin partisine bir dönem daha vermeye karar verdi. Ancak [Root.GetLeader] son görev dönemini tamamladığı için yeni bir liderlik yolu açılacak."
 MD4_election.1.a:0 "Dedikleri doğru - [Root.GetLeader] gerçekten en iyisi!"
 MD4_election.2.t:0 "Koalisyon Yeniden Seçildi: [Root.GetLeader]!"
 MD4_election.2.d:0 "Tüm oylar sayıldığında [Root.GetAdjective] seçmenler [Root.GetLeader] ve [Root.GetRulingParty] için bir dönem daha vermeye karar verdi. Mevcut iktidar partileri yeni mecliste çoğunluğu güvence altına aldı ve birlikte yönetme yetkilerini sürdürebilir. [Root.GetLeader], [Root.GetNameWithFlag] lideri olarak desteklerini görmeye devam ediyor."
 MD4_election.2.d_term_ended:0 "Tüm oylar sayıldığında [Root.GetAdjective] seçmenler [Root.GetRulingParty] için bir dönem daha vermeye karar verdi. Mevcut iktidar partileri yeni mecliste çoğunluğu güvence altına aldı ve birlikte yönetme yetkilerini sürdürebilir. [Root.GetLeader] son görev dönemini tamamladığı için yeni bir lider [Root.GetNameWithFlag] ülkesini yönetme görevini üstlenecek."
 MD4_election.2.a:0 "Dedikleri doğru - [Root.GetLeader] gerçekten en iyisi!"
 MD4_election.2.b:0 "Yeni hükümet kurulurken değişiklik yap"
 MD4_election.3.t:0 "[Root.GetLeader] için seçim yenilgisi!"
 MD4_election.3.d:0 "Tüm oylar sayıldığında [Root.GetLeader] bir dönem daha görevde kalmak için [Root.GetAdjective] seçmenlerin desteğini sağlayamamış görünüyor. Parlama sırası [show_biggest_party_elect] partisindeydi. ([?party_pop_elect_array^max_index_1|%1]) oyla tek başına yönetmeye yetecek desteği topladı.\n\n [Root.GetName] ülkesinin kontrolü [show_biggest_party_elect] partisine geçecek."
 MD4_election.3.a:0 "Yenilgiyi kabul et ve kazananı tebrik et"
 MD4_election.4.t:0 "Seçimler: [Root.GetLeader] için belirsiz sonuç!"
 MD4_election.4.d:0 "Tüm oylar sayıldığında [Root.GetLeader], yeni mecliste hükümet kurmak için şu anda çoğunluğa sahip değil. Katılmaları için ek partiler ikna edilmeli; bu mümkün olmazsa kontrol, hükümet kurmayı denemeleri için diğer partilerden birine verilmeli."
 MD4_election.4.a:0 "Görüşmeler başlıyor..."
 MD4_election.5.t:0 "Seçimler: [Root.GetLeader] için utanç verici yenilgi!"
 MD4_election.5.d:0 "Tüm oylar sayıldığında [Root.GetLeader], [Root.GetRulingParty] için meclise girmek için gereken asgari barajı bile aşamadı. [Root.GetName] ülkesini ileriye taşıyacak hükümeti başka birinin kurması gerektiği açık, ama kim?"
 MD4_election.5.a:0 "[show_biggest_party_elect] ([?party_pop_elect_array^max_index_1|%1]) deneyecek"
 MD4_election.5.b:0 "[show_second_biggest_party_elect] ([?party_pop_elect_array^max_index_2|%1]) deneyecek"
 News_MD4_election.0.t:0 "[From.GetAdjective] Seçimi: [From.GetRulingParty] Yeniden Seçildi!"
 News_MD4_election.0.d:0 "[From.GetRulingParty] ([From.GetRulingIdeology]) lideri [From.GetLeader], tüm rakiplerini tek başına yendi ve [From.GetAdjective] lideri olarak bir dönem daha görevde kalacak."
 News_MD4_election.0.d_first_term:0 "[From.GetRulingParty] ([From.GetRulingIdeology]) lideri [From.GetLeader], tüm rakiplerini tek başına yendi ve selefinin yerini alarak [From.GetAdjective] lideri olarak ilk dönemine başlayacak."
 News_MD4_election.0.a:0 "Tamam"
 News_MD4_election.1.t:0 "[From.GetAdjective] Seçimi: [From.GetLeader] yeni hükümeti kurdu!"
 News_MD4_election.1.d:0 "\n\n[From.GetRulingParty] ([From.GetRulingIdeology]) lideri [From.GetLeader] seçimlerden zaferle çıktı ve hükümetteki diğer partilerin desteğiyle şimdi [From.GetName] ülkesini ileriye taşıma görevini üstleniyor."
 News_MD4_election.1.a:0 "Tamam"
 News_MD4_election.2.t:0 "[From.GetAdjective] Seçimi: [From.GetLeader] sürpriz bir şekilde büyük zafer kazandı!"
 News_MD4_election.2.d:0 "[From.GetRulingParty] ([From.GetRulingIdeology]) lideri [From.GetLeader], imkânsız görüneni başardı: görevdeki hükümeti tek başına yendi. Tek başına çoğunluk hükümeti kuran [From.GetLeader] seçimlerden zaferle çıktı ve şimdi [From.GetName] ülkesini ileriye taşıma görevini üstleniyor."
 News_MD4_election.2.a:0 "Tamam"
 coalition_complete.0.t:0 "Hükümet Kuruldu!"
 coalition_complete.0.d:0 "[Root.GetLastElection] tarihli seçimlerden bu yana [Root.GetRulingParty] lideri [Root.GetLeader], yeni bir çoğunluk hükümeti için ustaca pazarlık yürütüyor. Bugün, [GetDateText], yoğun medya spekülasyonlarının ardından hükümetin bileşimi nihayet bir basın toplantısında açıklandı. Yeni bir siyasi çağ başlarken bu, [Root.GetName] için önemli bir dönüm noktası."
 coalition_complete.0.a:0 "Harika haber"
 coalition_pass.0.t:0 "[Root.GetRulingParty] Hükümeti Kurmaktan Vazgeçiyor mu?"
 coalition_pass.0.d:0 "[Root.GetLeader] siyasi danışmanları başı kesilmiş tavuklar gibi bir oraya bir buraya koşuyor; [Root.GetRulingParty] hükümet kuramama krizine umutsuzca çözüm arıyorlar, çünkü [Root.GetLeader] görevden alınırsa çoğunun işsiz kalacağını çok iyi biliyorlar.\n\nBu arada [show_biggest_party_elect] genel merkezinde, [Root.GetName] ülkesinin yönetimini devralmak için nihayet net bir yol göründüğünden heyecan artıyor."
 coalition_pass.0.a:0 "Vazgeç: [show_biggest_party_elect] ([?party_pop_elect_array^max_index_1|%1]) denesin"
 coalition_pass.0.b:0 "Sahte haber! Gereken müttefikleri bulacağız."
 coalition_pass.1.t:0 "[Root.GetRulingParty] Hükümeti Kurmaktan Vazgeçiyor mu?"
 coalition_pass.1.d:0 "[Root.GetLeader] siyasi danışmanları başı kesilmiş tavuklar gibi bir oraya bir buraya koşuyor; [Root.GetRulingParty] hükümet kuramama krizine umutsuzca çözüm arıyorlar, çünkü [Root.GetLeader] görevden alınırsa çoğunun işsiz kalacağını çok iyi biliyorlar.\n\nBu arada [show_second_biggest_party_elect] genel merkezinde, [Root.GetName] ülkesinin yönetimini devralmak için nihayet net bir yol göründüğünden heyecan artıyor."
 coalition_pass.1.a:0 "Vazgeç: [show_second_biggest_party_elect] ([?party_pop_elect_array^max_index_2|%1]) denesin"
 coalition_pass.1.b:0 "Sahte haber! Gereken müttefikleri bulacağız."
 coalition_pass_dismantle_tt:0 "İktidar Partisi Kaldırılır: §H[Root.GetRulingParty]§!\n§HHükümet Koalisyonu§! dağıtılacak\n\n"
 coalition_pass_refund_tt:0 "Siyasi Güç: Koalisyona harcanan miktarın §G+%75§!'i\n"
 coalition_pass_pol_change_0_tt:0 "Siyaset değişecek:\n§H[show_biggest_party_elect]§! İktidar Partisi olur\n\n"
 coalition_pass_pol_change_1_tt:0 "Siyaset değişecek:\n§H[show_second_biggest_party_elect]§! İktidar Partisi olur\n\n"
 coalition.0.t:0 "[Western_Autocracy_L] ile müzakere ([?party_pop_elect_array^0|%0])"
 coalition.0.d:0 "[Root.GetLeader] otoriter bir tarz sergiliyor, görüyoruz! Elbette hükümete katılmak isteriz. Tabii siyasi bedeli ödemeye hazırsanız."
 coalition.0.a:0 "Ekibe hoş geldiniz!"
 coalition.0.b:0 "Düşününce, onları dahil etmeyelim."
 coalition.1.t:0 "[conservatism_L] ile müzakere ([?party_pop_elect_array^1|%0])"
 coalition.1.d:0 "Sayın [Root.GetLeader]. Hükümetin yürütülmesinde belli ölçüde iş birliği yapabileceğimiz bir gelecek hayal edebiliyoruz. Saygıyla, tüm politikalarımızı benimsemeniz gerektiğine inansak da seçim sonuçları tamamen lehimize olmadığı için seçmenlerimiz adına mümkün olan en iyi anlaşmayı müzakere etmemiz gerektiğini kabul ediyoruz. Taleplerimiz basit: geleneksel değerleri savunma taahhüdü, pragmatizm, otoriteye ve dinî değerlere saygı ve geleneksel toplumsal kurumların korunması.\n\nİş birliğimizi kabul ederseniz [conservatism_L] adının aptalca ve aceleci politika yapımıyla ve sözde modern düşünceyle lekelenmeyeceğini içtenlikle umuyoruz. Bu riski en aza indirmek için lütfen tamamını yönetmek istediğimiz bakanlıkların listelendiği ekli belgeye bakın."
 coalition.1.a:0 "Ekibe hoş geldiniz!"
 coalition.1.b:0 "Düşününce, siz muhafazakârlar bizim için fazla sıkıcısınız."
 coalition.2.t:0 "[liberalism_L] ile müzakere ([?party_pop_elect_array^2|%0])"
 coalition.2.d:0 "Sayın [Root.GetLeader]. Liberalizmin ve özgürlüğün büyük ilkelerine duyduğunuz ilgiyle bize iltifat ediyorsunuz. Sonuçta özgürlük, her dürüst hükümetin üzerine kurulduğu temeldir. Elbette liberalizmi teşvik etmek için hükümete katılmak isteriz, çünkü ikimiz de bireysel özgürlüğün ve sınırlı hükümetin insanların özgür bir toplum kurmasının en iyi yolu olduğunu biliyoruz.\n\nAncak sizin liberalizminizin bizimki kadar sınırsız olmasını sağlamak için nihai bir anlaşmaya varmadan önce son derece makul ve şüphesiz karşılıklı yarar sağlayan taleplerimizi kabul etmeniz gerekecek."
 coalition.2.a:0 "Ekibe hoş geldiniz!"
 coalition.2.b:0 "Nazikçe reddetmek zorundayız."
 coalition.3.t:0 "[socialism_L] ile müzakere ([?party_pop_elect_array^3|%0])"
 coalition.3.d:0 "Sayın [Root.GetLeader]. Küçük ortak olarak herhangi bir hükümete girmeye gönülsüz olsak da sendikalar bizi seçimlerde bitiş çizgisine taşıyamadı, bu sefer. Dolayısıyla ilerici ve sosyal demokrat değerlerin hayati ilkelerini teşvik edeceğinize söz verirseniz katılma fikrini değerlendirebiliriz. [socialism_L] olarak dediğimiz gibi, sosyal demokrat değerler herkes içindir ve bunun sizin hükümetiniz için de geçerli olmasında ısrar ediyoruz.\n\nBu arada vergiler biraz düşük değil mi? Planladığımız sosyal yardım, eğitim ve sağlık artışları için yeterli finansmanımız olduğundan emin misiniz?"
 coalition.3.a:0 "Ekibe hoş geldiniz!"
 coalition.3.b:0 "Nazikçe reddetmek zorundayız."
 coalition.4.t:0 "[communist_state_L] ile müzakere ([?party_pop_elect_array^4|%0])"
 coalition.4.d:0 "Yoldaş [Root.GetLeader]! Emperyalist-burjuva hükümetinizi devirmeyi, toplumu devrimci silahlı mücadeleyle değiştirmeyi, proletaryanın demokratik diktatörlüğünü kurmayı ve sınıf hainlerini ortadan kaldırmayı amaçlasak da şu an bir koalisyon kurmanın bazı kısa vadeli siyasi taktik avantajları olabileceğini fark ediyoruz.\n\nTaleplerimiz basit: Marksist diyalektik materyalizmin tam uygulanması, ezilen proletaryanın sosyo-ekonomik koşullarında %1000 iyileşme ve kuracağımız yeni Disneyland'e ücretsiz giriş!\n\n...Sözünü ettiğiniz o küçük tavizlere razı oluruz."
 coalition.4.a:0 "Ekibe hoş geldiniz!"
 coalition.4.b:0 "Kızıl olmaktansa ölü olmak yeğdir!"
 coalition.5.t:0 "[anarchist_communism_L] ile müzakere ([?party_pop_elect_array^5|%0])"
 coalition.5.d:0 "Yoldaş [Root.GetLeader]. İdarenizi doğru yöne, yani sola çekeceğimizi düşünüyoruz. Bazıları bize «Sol Radikaller» diyor ama gerçek radikaller, tüm gücü en zengin %1'in eline veren gerici, ilericilik karşıtı muhafazakâr güçlerdir. Biz yalnızca %99'un hemfikir olabileceği sağduyulu şeyler için savaşıyoruz: sosyal adalet, feminizm, sosyal yardım vurguncularına son, kapitalizmin yıkılması, enternasyonalizm ve Batı emperyalist hâkimiyetinin ve onun Küresel Güney'i sömürüsünün sona ermesi."
 coalition.5.a:0 "Birlikte daha güçlüyüz!"
 coalition.5.b:0 "Tekrar düşünüyoruz."
 coalition.6.t:0 "[Conservative_L] ile müzakere ([?party_pop_elect_array^6|%0])"
 coalition.6.a:0 "Ekibe hoş geldiniz!"
 coalition.6.b:0 "Nazikçe reddetmek zorundayız."
 coalition.7.t:0 "[Autocracy_L] ile müzakere ([?party_pop_elect_array^7|%0])"
 coalition.7.d:0 "Sayın [Root.GetLeader]. Seçim kampanyası dediğiniz o miyop, iradesiz, parçalı seçmen cehaleti, söylenme, çekişme, israf, uzlaşma ve tereddüt şenliğini sevsek de şu an biriktirdiğiniz gerçek gücü tanıyoruz. Bize katılın, yasama ve yürütme kısıtlamalarının zincirlerini üzerimizden atalım ve ortak gücümüzü, disiplinimizi, otoritemizi ve birliğimizi gösterelim."
 coalition.7.a:0 "Ekibe hoş geldiniz!"
 coalition.7.b:0 "Nazikçe reddetmek zorundayız."
 coalition.8.t:0 "[Mod_Vilayat_e_Faqih_L] ile müzakere ([?party_pop_elect_array^8|%0])"
 coalition.8.d:0 "Sayın [Root.GetLeader]. Biz, Ali ibn Ebi Talib'in Şiileri, el ele verip Siyonistlere ve onların Tekfirci şeytan yavrularına cesurca direnmenizde size katılmaya hazırız. Kutsal şehitlerden ilham alarak Hakiki İslam'ın düşmanlarını yeryüzünden birlikte sileceğiz. Biz, Allah'ın kılıçları, rehberlik için elbette Seyyid Hamaney'e ve Seyyid Hasan Nasrallah'a bakacağız ama korkmayın, gerekirse kutsal topraklarımızı korumak için kan akıtacak gerçek [Root.GetAdjective] vatanseverleriz. Kendimizi ılımlı saydığımızı söylemiş miydik?"
 coalition.8.a:0 "Siyonistlere ölüm!"
 coalition.8.b:0 "İşkence görmeyi tercih ederim."
 coalition.9.t:0 "[Vilayat_e_Faqih_L] ile müzakere ([?party_pop_elect_array^9|%0])"
 coalition.9.d:0 "Sayın [Root.GetLeader]. Biz, Ali ibn Ebi Talib'in Şiileri, el ele verip Siyonistlere ve onların Tekfirci şeytan yavrularına cesurca direnmenizde size katılmaya hazırız. Kutsal şehitlerden ilham alarak Hakiki İslam'ın düşmanlarını yeryüzünden birlikte sileceğiz. Biz, Allah'ın kılıçları, rehberlik için elbette Seyyid Hamaney'e ve Seyyid Hasan Nasrallah'a bakacağız ama korkmayın, gerekirse kutsal topraklarımızı korumak için kan akıtacak gerçek [Root.GetAdjective] vatanseverleriz."
