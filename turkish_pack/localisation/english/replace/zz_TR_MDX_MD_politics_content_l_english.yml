 no_fuel_protests_TT:0 "\n§RYakıt eksikliği yüzünden ek radikalleşme yaşıyoruz!§!"
 MANAGE_SUBJECTS_TT:0 "§YBağımlı Ülkeler Menüsü§!\nBağımlı ülkeler; uydu, kukla, dominyon, özel idari bölge ya da başka bir ülkeye tabi olan her ülkeyi kapsar. Her ülke, sizin hâkim devlet olmanıza farklı tepki verir; bağımsızlıkları için savaşabilir ya da ülkeniz onlar nezdinde popülerse nihai entegrasyona izin verebilir.\n\n§YBağımlı ülkeleri entegre etmek, topraklarında çekirdek toprak edinmenizi sağlar; bu da onları ilhaka çekici bir alternatif yapar.§!\n"
 MANAGE_SUBJECTS_DELAYED_TT:0 "§YBir Ülkenin Entegrasyonla Mücadele Etme Nedenleri:§!\nTemel Değer: §R+10§!\nBağımlı Ülkeyle Ticaret Anlaşması Var: §G-%20§!\nBağımlı Ülkenin Bize Görüşü 100'den Düşük: §R+%200§!\nBağımlı Ülkenin Bize Görüşü 200'den Yüksek: §G-%90§!\nBağımlı Ülkenin Bize Görüşü 240'tan Yüksek: §G-%100§!\nBağımlı Ülke Bizimle Aynı Bakış Açısında: §G-%50§!\n\nBağımlı ülkenin §Yİç Nüfuzu§!, §YİÇ Nüfuzunun§! 10'a bölünmesiyle hesaplanır ve bu değer yukarıdaki değerle çarpılır.\n\n§YÖzerkliği Artır§! odağı için YZ oyun kuralını devre dışı bırakmak bu bilgiyi geçersiz kılar."
