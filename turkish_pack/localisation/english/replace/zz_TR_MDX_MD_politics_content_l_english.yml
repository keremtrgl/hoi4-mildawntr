 coalition.15.t:0 "[oligarchism_L] ile müzakere ([?party_pop_elect_array^15|%0])"
 coalition.15.d:0 "Sayın [Root.GetLeader]. Bir devasa şişkin seçimin daha ardından, yıkanmamış kitleler hükümet dediğiniz bu şişman sirk çadırının dikişlerini patlatmak üzere. Güç yalnızca az sayıda insanın elindeyse daha etkiliyiz: zenginler, soylular, güçlüler. Küçük, yeni büyüktür. Önemli olan teknenin büyüklüğü değil, okyanustaki harekettir. Bu arada şu an daha büyük bir tekneye ihtiyacımız var. Yalnızca partilerimizi bugün bir koalisyon hükümetinde birleştirerek yarın için daha küçük bir tekne güvence altına alabiliriz. İş birliğinizle yönetici sınıfımız gün batımına doğru yelken açacak."
 coalition.15.a:0 "Hoş geldiniz!"
 coalition.15.b:0 "Nazikçe reddetmek zorundayız. Umarım batarsınız!"
 coalition.16.t:0 "[Neutral_Libertarian_L] ile müzakere ([?party_pop_elect_array^16|%0])"
 coalition.16.d:0 "Sayın [Root.GetLeader]. [Neutral_Libertarian_L] yönetiminde sık sık, partiyi bir arada tutmanın «kedi gütmek» gibi olduğu söylenir. Bu yüzden, sizin gibi devletçilerle koalisyona girmenin ancak ciddi tavizler vermeye hazırsanız mümkün olduğunu söylediğimizde bize inanmalısınız. Vergileri kaldırmak ve orduyu lağvetmek gibi. Elbette bireysel özgürlükten, ekonomik ve toplumsal özgürlükten asla bir adım geri atmayacağız. Uzlaşma ruhuyla, resmî para birimimiz olarak Bitcoin'in tam uygulanmasını biraz ertelemeye hazır olabiliriz ama henüz tüm üyelerimize bunu sormadık.\n\n[Root.GetLeader]: «Hepinizin hapse girmeden esrar içmesine izin versek?»\n\n- «Tabii! Olur»."
 coalition.16.a:0 "Ekibe hoş geldiniz!"
 coalition.16.b:0 "Şaka! Sizin gibi deliler aslında hiçbir zaman dahil edilmeyecekti."
 coalition.17.t:0 "[Neutral_green_L] ile müzakere ([?party_pop_elect_array^17|%0])"
 coalition.17.d:0 "[Root.GetLeader]... Bu bir limuzin mi?! Bu ÇOK sorumsuzca. Herkes böyle yakıt canavarı kullanıp toplantılar için yurtdışına uçsa yüz dünyanın kaynaklarına ihtiyacımız olurdu! Bu böyle devam edemez, zaman hızla akıyor. İnsan kaynaklı küresel ısınma bilim kurgu değil, bilimsel gerçektir. HoI4'te sıcaklıklar yıldan yıla artamıyor diye tehdidi ciddiye almamamız gerekmez! Hükümet koalisyonunuzun parçası olacaksak karbon ayak izimizi hızla azaltmaya yönelik ciddi bir plan talep ediyoruz."
 coalition.17.a:0 "Çevre dostu hükümetimize hoş geldiniz"
 coalition.17.b:0 "Neyse"
 coalition.18.t:0 "[neutral_Social_L] ile müzakere ([?party_pop_elect_array^18|%0])"
 coalition.18.d:0 "Sayın [Root.GetLeader]. İdarenizi daha fazla eşitliğe ve evrensel ilerici değerlere doğru ilerleteceğimizi gerçekten düşünüyoruz. Katılırsak sosyal yardım ve sağlık hizmetlerinin ciddi biçimde güçlendirilmesini ve zenginlere uygulanan vergilerin büyük ölçüde artırılmasını talep ediyoruz. Demokrasinin temel ilkelerini kutsal sayarız. Bu aynı zamanda iyi ücretleri, daha iyi çalışma koşullarını ve kapitalistler için daha az kârı güvence altına almak üzere en azından sıkı sosyalist hükümet düzenlemelerine tabi olması gereken ekonomi için de geçerlidir. Gerçekten, yönetmekte o kadar iyi olurduk ki çoğunun devlet denetiminde olması en iyisi olurdu."
 coalition.18.a:0 "Birlikte daha güçlüyüz"
 coalition.18.b:0 "ASLA olmaz!"
 coalition.19.t:0 "[Neutral_Communism_L] ile müzakere ([?party_pop_elect_array^19|%0])"
 coalition.19.d:0 "Yoldaş [Root.GetLeader]! Emperyalist-burjuva hükümetinizi devirmeyi, toplumu devrimci silahlı mücadeleyle değiştirmeyi, proletaryanın demokratik diktatörlüğünü kurmayı ve sınıf hainlerini ortadan kaldırmayı amaçlasak da şu an bir koalisyon kurmanın bazı kısa vadeli siyasi taktik avantajları olabileceğini fark ediyoruz.\n\nTaleplerimiz basit: Marksist diyalektik materyalizmin tam uygulanması, ezilen proletaryanın sosyo-ekonomik koşullarında %1000 iyileşme ve kuracağımız yeni Disneyland'e ücretsiz giriş!\n\n...Aslında sözünü ettiğiniz o küçük tavizlere razı oluruz."
 coalition.19.a:0 "İleri birlikte, yoldaşlar!"
 coalition.19.b:0 "Yapmayalım."
 coalition.20.t:0 "[Nat_Populism_L] ile müzakere ([?party_pop_elect_array^20|%0])"
 coalition.20.d:0 "Sayın [Root.GetLeader]. Bizimle konuşmakla gerçekten akıllıca davranıyorsunuz, herkes bilir ki sağduyunun ve aklın gerçek sesi biziz. Ancak [Nat_Populism_L] olarak sağduyu feneri rolümüzü yerine getirirken bazı doğru politikaları benimsemenizde ısrar etmeliyiz. [Root.GetName] siyasi düzeni ülkeyi çok uzun süredir yağmalıyor, servetimizi ve onurumuzu başarısız göç sistemi aracılığıyla ucuz işgücü ithal eden çok uluslu şirketlere teslim ediyor! İşlerimizi almalarının yanı sıra göçmenler işsizlik yardımlarımızı ve sosyal yardım sistemimizi de sömürüyor. Ayrıca çöken altyapımıza yatırım yapmalı ve vergileri düşürmeliyiz! Ordumuz suç denecek kadar yetersiz personelle çalışıyor ve kötü donatılmış; acilen büyütülmeli. Polisten bahsettik mi? Önceki hükümetlerimizin ithal ettiği tüm suçlularla başa çıkacak kaynakları açıkça yok. Bu arada yaşlılarımıza gereken bakım verilmiyor; utanç verici! Peki, anlaştık mı?"
 coalition.20.a:0 "Hoş geldiniz!"
 coalition.20.b:0 "Beni bundan esirge"
 coalition.21.t:0 "[Nat_Fascism_L] ile müzakere ([?party_pop_elect_array^21|%0])"
 coalition.21.d:0 "Yaşasın [Root.GetLeader]!\n\nHER YERDE, BİZ VATANSEVERLER MEDENİYETİMİZE İHANET EDENLERE KARŞI YÜRÜYORUZ. BU ŞANLI SAFLIK YÜRÜYÜŞÜNE KATILABİLİR YA DA BÜYÜK ÜLKEMİZİ O PİS YABANCILARA TESLİM EDEBİLİRSİNİZ! ONLARI DIŞARI ATMALIYIZ! TEK TEK HEPSİNİ! ([Nat_Fascism_L] üyeleri ya da posta siparişi gelinlerimiz olanlar hariç)\n\n SAF MİLLİYETÇİ bir hükümet talep ediyoruz ki ULUSAL YENİLENMEYE önderlik etsin! Tek seçeneğimiz var: kaos ya da düzen ve özgürlük. TAM DÜZEN. Ve yabancı asalaklardan TAM ÖZGÜRLÜK."
 coalition.21.a:0 "Evet! Birlikte çalışalım."
 coalition.21.b:0 "Hükümet mi? Hepiniz başka bir kuruma aitsiniz..."
 coalition.22.t:0 "[Nat_Autocracy_L] ile müzakere ([?party_pop_elect_array^22|%0])"
 coalition.22.d:0 "Sayın [Root.GetLeader]. Ulusal tehlike zamanlarında askerî kurumun tehlikeli iktidar boşluklarını doldurmak, ulusal egemenliği, bağımsızlığımızı ve yurtsever değerlerimizi korumak için rolünü üstlenmesi gereken bir an gelir. Bize göre askerî yönetim zamanı her zamandır. Ancak şimdi bunu yapmanın dış ilişkilerimize bazı istenmeyen etkileri olabileceğinin farkındayız. Sizin sessizce dediğimizi yapmanız... daha az karmaşık olurdu.\n\nYerinizi bildiğiniz sürece sizin için kesinlikle çok güçlü bir siyasi müttefik oluruz."
 coalition.22.a:0 "Siyaset siyasetçilere bırakılamayacak kadar önemlidir"
 coalition.22.b:0 "Siyaset generallere bırakılamayacak kadar önemlidir"
 coalition.23.t:0 "[Monarchist_L] ile müzakere ([?party_pop_elect_array^23|%0])"
 coalition.23.d:0 "Sayın [Root.GetLeader]. Biz kralcılar, bir halk çocuğu olan sizin [Root.GetName] ülkesine yalnızca mutlak bir hükümdarın bahşedebileceği gerekli istikrarı ve diğer muhteşem avantajları sağlayabileceğiniz fikrine güleriz. Gerçek yüce yürütme gücünün ancak hanedanın tüm kutsallığıyla doğru biçimde kullanılabileceğini hepimiz biliriz. Tam ulusal yenilenmeye doğru yürürken bu gerçekten birleştirici bir güç ve büyüklüğümüzün güçlü bir sembolü olurdu. Tanrısal haktan kutsanmış mutlak monarşiler, tüm ölçütlerde diğer tüm hükümet biçimlerinden üstündür.\n\nPeki, belli ki sizi tahta oturtmayacağız; bu nedenle koalisyondaki biz kralcılar taht için en iyi adayı ararken modası geçmiş ve çağdışı cumhuriyet hükümetini bir süre koruyabiliriz."
 coalition.23.a:0 "Evet, tabii, ne dersen"
 coalition.23.b:0 "Belli ki sizler yönetmeye uygun değilsiniz..."
