l_english:
 reserve_currency:0 "Rezerv Para Birimi Politikası"
 reserve_currency_desc:0 "Bu ülkenin parasal rezervlerinin ve uluslararası borcunun dayandığı para birimi. Büyük bir rezerv para birimiyle uyum sağlayan ülkeler onun likidite ağlarına ve takas altyapısına erişim kazanır; yurtiçi rezervlerini koruyan ülkeler ise uluslararası kredi erişimi pahasına tam parasal egemenliklerini korur."
 us_dollar:0 "[1182.owner.GetAdjective] Doları"
 us_dollar_desc:0 "Baskın küresel rezerv para birimi. Rezervleri dolar olarak tutmak eşsiz bir likidite ve uluslararası kredi piyasalarına erişim sağlar, ancak yerel para birimi zayıfladığında şişen dolar cinsi borç maliyetlerine karşı ülkeyi savunmasız bırakır."
 euro:0 "Euro"
 euro_desc:0 "Avrupa Birliği'nin para birimi ve dünyada en çok işlem gören ikinci rezerv para birimi. AB üyesi ülkelerin kullanımına açık olan euro, bölgesel parasal istikrar ve Avrupa sermaye piyasalarına ayrıcalıklı erişim sağlar."
 chinese_yuan:0 "[547.owner.GetAdjective] Yuanı"
 chinese_yuan_desc:0 "Çin'in ulusal para birimi renminbi, Pekin'in dolar hâkimiyetine alternatif olarak savunduğu yükselen bir rezerv varlığıdır. Çin'in ekonomik yörüngesindeki ticaret ortakları, büyüyen takas ağından yararlanır."
 russia_rouble:0 "[652.owner.GetAdjective] Rublesi"
 russia_rouble_desc:0 "Rusya Federasyonu'nun para birimi; Avrasya Ekonomik Birliği'nde ve Sovyet sonrası ticaret ortakları arasında kullanılır. Ruble rezervi tutmak, ülkeyi Rusya'nın alternatif ödeme sistemlerine ve enerji takas çerçevesine entegre eder."
 japanese_yen:0 "[615.owner.GetAdjective] Yeni"
 japanese_yen_desc:0 "Japonya'nın para birimi ve dünyada en çok işlem gören üçüncü para birimi. Japonya'nın ekonomik yörüngesindeki ülkeler, yerleşik takas ağlarından ve yenin görece istikrarından yararlanır; ancak Doğu Asya dışında rezerv olarak benimsenmesi sınırlı kalmaktadır."
 british_pound:0 "[13.owner.GetAdjective] Sterlini"
 british_pound_desc:0 "Hâlâ aktif uluslararası kullanımda olan en eski rezerv para birimi. Sterlin, Milletler Topluluğu genelindeki ticaret ve finansal akışların temelini oluşturur ve küresel döviz rezervlerinde önemli bir yer tutar; Birleşik Krallık'la uyumlu ülkelere Londra'nın derin sermaye piyasalarına istikrarlı erişim sunar."
 swiss_frank:0 "[74.owner.GetAdjective] Frangı"
 swiss_frank_desc:0 "Güvenli liman varlığı olarak dünya çapında tanınan İsviçre'nin para birimi. Diğer ülkelerce resmî rezerv olarak nadiren benimsense de frangın sıkı parasal disiplini ve İsviçre'nin siyasi tarafsızlığı onu para krizlerine ve dış şoklara karşı eşsiz biçimde dirençli kılar."
 gulden:0 "[46.owner.GetAdjective] Guldeni"
 gulden_desc:0 "Hollanda'nın tarihî para birimi; avro bölgesinden ayrıldıktan sonra yeniden kullanıma sokuldu. Sıkı parasal disiplin ve büyük bir ticaret fazlasıyla desteklenen gulden, tam parasal egemenlik sağlar ve ekonomiyi dış şoklardan yalıtır; ancak büyük rezerv bloklarının derin likiditesinden vazgeçilir ve yurtdışında nadiren tutulur."
 brazilian_real:0 "Brezilya Reali"
 brazilian_real_desc:0 "Brezilya, yıllarca süren başıboş enflasyona son vermek için reali kullanıma sundu. Ekonomisi büyüdükçe ülke, ortaklarından reali rezervlerinde tutmalarını isteyebilir. Onların güveni ülkeye para getirebilir, ancak zayıflayan bir Brezilya ekonomisi onları risk altında bırakır."
 bitcoin:0 "Bitcoin"
 bitcoin_desc:0 "Bitcoin'in değerini istikrarlı tutan bir merkez bankası yoktur. Yatırımcılar büyük para kazanma fırsatı görür, ancak servetleri aydan aya değişebilir. Onu rezervinde tutan bir ülke beklenmedik bir kazanç elde edebilir, ancak ekonomisini enflasyona karşı daha savunmasız hâle getirir."
