 no_foreign_reserve:0 "Yurtiçi Rezerv"
 no_foreign_reserve_desc:0 "Bu ülke rezervlerini yabancı bir standart yerine yerel para biriminde tutar. Tam parasal egemenliğini korur ve kendini dış döviz kuru şoklarından yalıtır, ancak büyük rezerv para birimlerine bağlı likidite ağlarına ve uluslararası kredi imkânlarına erişimden vazgeçer."
 currency_effects_modifier:0 "Para Birimi Etkileri"
 currency_strength_modifier:0 "Para Birimi Gücü"
 reserve_roi_bonus:0 "Rezerv Para Birimi Getirisi"
 reserve_roi_bonus_desc:0 "Güçlü bir yabancı rezerv para birimi tutmaktan elde edilen ek yatırım getirisi. İhraç eden ülkenin para birimi gücüne ve benimseyen ağın büyüklüğüne göre aylık olarak ölçeklenir. İhraççı ülkenin ekonomisinin zayıflaması bu bonusu azaltır."
 reserve_trade_bonus:0 "Rezerv Para Birimi Ticaret Uyumu"
 reserve_trade_bonus_desc:0 "Aynı para birimi bloğu içinde faaliyet göstermekten kaynaklanan küçük bir ticaret görüşü bonusu. Aynı rezerv para birimini kullanan ülkeler arasında paylaşılan ayrıcalıklı ticari ilişkileri ve ödeme altyapısını yansıtır."
 seigniorage_income_modifier:0 "Senyoraj Geliri"
 monetary_policy_decisions:0 "Para Politikası"
 monetary_policy_expand_money_supply:0 "Para Arzını Genişlet"
 monetary_policy_austerity:0 "Kemer Sıkma"
 reserve_currency_issuer_required_tt:0 "Bir rezerv para birimi ihraç etmesi gerekir"
 currency_backing:0 "Para Birimi Karşılığı"
 currency_backing_desc:0 "Ulusal para biriminin dayandığı varlık standardı. Sert para standartları para birimini bir emtia rezervine bağlar; bu, disiplin getirir ancak parasal esnekliği sınırlar. Fiat sistemleri tam parasal egemenliğe izin verir, ancak daha yüksek enflasyon riskini beraberinde getirir."
 gold_standard_back:0 "Altın Standardı"
 gold_standard_back_desc:0 "Ulusal para birimi sabit bir oranda altına bağlıdır ve altınla değiştirilebilir. Parasal genişleme fiziksel altın rezervleriyle sınırlıdır; bu, uzun vadeli güven telkin eder ancak hükümetin ekonomik krizlere yanıt verme yeteneğini kısıtlar."
 silver_standard:0 "Gümüş Standardı"
 silver_standard_desc:0 "Ulusal para birimi sabit bir dönüşüm oranıyla gümüş rezervlerine dayanır. Altın bağından daha az kısıtlayıcı olan gümüş standardı, bir ölçüde emtia disiplini sağlarken biraz daha fazla parasal esnekliğe izin verir."
 bi_metal_standard:0 "İki Madenli Standart"
 bi_metal_standard_desc:0 "Para birimi, sabit takas oranlarıyla hem altın hem de gümüşe dayanır. Tarihsel olarak para tabanını genişletmek için benimsenen bu standart, emtia disiplinini saf tek madenli bağdan daha fazla arz esnekliğiyle dengeler."
 no_currency_backing:0 "Fiat Para"
 no_currency_backing_desc:0 "Para birimi yalnızca ihraç eden hükümetin otoritesine ve kredibilitesine dayanır. Emtia kısıtlamaları olmadığı için para politikası tamamen esnektir; bu, krizlere hızlı yanıt verilmesini sağlar ancak enflasyonist baskıya yatkınlığı artırır."
 currency_news.1.t:0 "Bitcoin Yayinda"
 currency_news.1.d:0 "Bitcoin adlı yeni bir para biriminin ilk bloğu üretildi. Taraftarları paranın bir merkez bankasına bağlı olmasına gerek olmadığına inanıyor, ancak bir bitcoinin değerinin ne olduğunu çok az kişi biliyor. Yatırımcılar beklenmedik bir kazanç fırsatı görüyor; merkez bankacıları ise böylesine öngörülemez bir rezervin ülke içindeki fiyatların kontrolünü zorlaştırabileceğinden endişe ediyor."
 currency_news.1.a:0 "Yeni bir para birimi ortaya çıktı."
