 light_drug_trade_restrictions:0 "Gevşek Denetimli Kartel İşbirliği"
 narco_state_bonuses:0 "Narko Devlet"
 narco_state_bonuses_desc:0 "Kartellerin devletin denetimini ele geçirmesiyle yılların mücadelesi yavaş yavaş sönümlendi."
 CARTEL_defeated_the_cartels:0 "Kartellerimizi Yendik"
 narcos_state:0 "Narkoların Devleti"
 narcos_state_desc:0 "Uzun yıllar süren mücadelenin ardından narkolar artık devlet aygıtının kendisini denetliyor."
 cartels_decision_category:0 "Suç"
 cartels_decision_category_desc:0 "Suç örgütleri toplumumuzun her kademesine sızdı. Mafya şebekeleri, uyuşturucu kartelleri ve şiddet yanlısı çeteler, acımasız bir etkinlikle iktidar ve toprak için çekişiyor ve ardında kan izi bırakıyor. Kararlı bir adım atılmazsa ülkemiz, suç savaş ağalarının yönettiği başarısız bir devlete dönüşme riskiyle karşı karşıya.\n\n§YSiyasi Nüfuz§!, kartellerin kurumlarımızı ne kadar derinden yozlaştırdığını gösterir. Nüfuzları arttıkça, içeriden sabotaj ve rüşvet yüzünden soruşturmalarımızın başarısız olma ihtimali giderek yükselir.\n\n§YGüç§!, kartellerin askeri yeteneklerini ve toprak denetimini ölçer. Daha yüksek güç, baskınlarımızın daha büyük direnişle ve daha ağır kayıplarla karşılaşması demektir.\n\nHer iki ölçüt de kritik düzeye ulaşırsa kartel, yozlaşmış bir darbe ya da doğrudan askeri çatışma yoluyla devletin tamamen ele geçirilmesine kalkışabilir.\n\n$political_influence_of_cartels$: [?ROOT.cartel_political_influence|1]\n$strength_of_cartels$: [?ROOT.strength_of_cartels|1]\n"
 narcos_crisis:0 "Narko Krizi"
 narcos_crisis_desc:0 "Hükümetimizin otoritesi, kontrolsüz yolsuzluk ve örgütlü suç faaliyetleri yüzünden ciddi biçimde zayıfladı. Kartel kritik kurumlara sızarak yasaları uygulama ve devletin şiddet tekelini koruma yeteneğimizi tehlikeye soktu. İstihbarat raporları, ya kartellerle birlikte hareket eden subayların kurgulayacağı bir askeri darbenin ya da kartellerin kendilerinin eş güdümlü bir silahlı ayaklanmasının eşiğinde olduğumuzu gösteriyor. Devlet otoritesinin tamamen çökmesini önlemek için derhal harekete geçilmeli."
 mafia_crisis:0 "Mafya Krizi"
 mafia_crisis_desc:0 "Hükümetimizin otoritesi, yaygın yolsuzluk ve örgütlü suç faaliyetleri yüzünden ciddi biçimde zayıfladı. Mafya kilit kurumlara sızarak yasaları uygulama ve devletin şiddet tekelini koruma yeteneğimizi tehlikeye soktu. İstihbarat raporları, ya mafyayla birlikte hareket eden subayların kurgulayacağı bir askeri darbenin ya da suç örgütlerinin eş güdümlü bir silahlı ayaklanmasının eşiğinde olduğumuzu gösteriyor. Devlet otoritesinin tamamen çökmesini önlemek için derhal ve kararlı biçimde harekete geçilmeli."
 mexican_cartel_war:0 "Meksika Kartel Savaşı"
 mexican_cartel_war_desc:0 "Hükümetimizin yasaları uygulama ve gücü tekelinde tutma yeteneği, artan yolsuzluk ve suç faaliyetleri yüzünden zedelendi. Askeri ve siyasi altyapımız tamamen ele geçirildi ve artık kime güvenilebileceği belli değil. Kaos yakında doruğa çıkacak ve ardından yeni bir iç savaşın ortasında kalacağız."
 anti_cartel_propaganda_decision:0 "Kartel Karşıtı Propaganda"
 anti_cartel_propaganda_decision_desc:0 "Kartellerin etrafında hep büyüyen bir efsane oldu: onların, geçmişin gül rengi bakışla anılan haydutlarına benzediği efsanesi. Kötü şeyler yapsalar da bunu yalnızca halkları için yapan sevimli külhanbeyleri. Tüm efsaneler gibi bu da bir uydurma. Kartellerin nüfuzu altında yaşayan herkes bunun yalan olduğunu biliyor. Kartellerin kendi halkına verdiği acıları ülke çapında bir medya kampanyasıyla ortaya koyarak bu efsaneyi bir daha geri gelmemek üzere yıkmaya çalışabiliriz."
 police_investments_decision:0 "Polis Teşkilatının Güçlendirilmesi"
 police_investments_decision_desc:0 "Kartel gibi suç örgütleri; geniş kaynaklara, finansmana ve silahlara sahip karmaşık işletmelerdir. Asgari güçle ya da olağan polislik yöntemleriyle caydırılamazlar. Polis güçlerimiz bu örgütlere karşı ilk savunma hattıdır, ancak karşılaştıkları aşırı şiddete karşı koyacak kaynaklardan sıklıkla yoksundur. Polisin silahlandırılmasının bazı toplumsal bedelleri olsa da, onlara gelişmiş teçhizat, ileri taktik eğitim ve daha fazla personel sağlamak, kartel faaliyetlerine karşı etkili bir set oluşturmak için şarttır. Bu dönüşüm önemli bir mali yatırım gerektirir, ancak ülkemizin organize suçla etkin biçimde mücadele edebilmesi için gereken güvenlik temelini kurmak adına zorunludur."
 utilize_the_military_decisions:0 "Orduyu Kullan"
 utilize_the_military_decisions_desc:0 "Polis güçlerimiz iyi donatılmış olsa da sınırlı insan gücü, yerel bürokrasi ve olası yolsuzlukla kısıtlı kalıyor. Askeri güçlerin devreye sokulması bize üstün bir ateş gücü, sağlam bir komuta yapısı ve yerel idari engelleri aşabilecek geniş kaynaklar sağlar. Ordunun ulusal örgütlenmesi, kartellerin faaliyet gösterdiği bölgeler arasında eş güdümlü harekâta imkân verir. Ancak bu yaklaşımın önemli sakıncaları var: siviller mahallelerinde asker varlığından çoğu zaman korkuyor, yerel polis çabalarının yetersiz sayılmasına içerleyebilir ve harekâtlar sırasında sivil altyapı zarar görebilir. Askeri konuşlanma ayrıca insan hakları kaygılarını beraberinde getirir ve kamuoyunun devlet kurumlarına güvenini zedeleyebilir. Taktik avantajları, halk desteğinin ve meşruiyetin olası kaybıyla dikkatle tartmalıyız."
 target_cartel_money_laundering_decision:0 "Kara Para Aklama Operasyonlarını Hedef Al"
 target_cartel_money_laundering_decision_desc:0 "Kartellerin gayrimeşru kazançlarını meşru varlıklara dönüştürmek için akladıkları biliniyor; 'kirli parayı' üç aşamalı bir süreçle dönüştürüyorlar: finans sistemine yerleştirme, kaynağı gizlemek için katmanlama ve yasal varlıklara entegrasyon. Aklanan bu paralar mülk, işletme satın almalarını ve devlet görevlileri üzerinde nüfuz kurmalarını sağlıyor. Katmanlama ve entegrasyon aşamalarını hedef alarak mali altyapılarını bozabilir ve yolsuzluğu durdurabiliriz. Bu, suç ortağı finans kurumlarının ve paravan şirketlerin yöntemli biçimde soruşturulmasını ve kapatılmasını gerektirir. Ancak bu stratejinin önemli bir riski var. Başarısız operasyonlar, kartellerin nakit akışlarını savunması nedeniyle şiddetli misillemeye yol açabilir ve hem devlet güçlerine hem de sivillere yönelik düşmanlıklarını artırabilir."
 investigate_the_casinos:0 "Kumarhaneleri Soruştur"
 investigate_the_casinos_desc:0 "Kumarhaneler denetim bakımından gri bir alanda faaliyet gösterdiği için gayrimeşru fonların aklanması adına ideal giriş noktalarıdır. Yüksek nakit devri, büyük meblağların şüphe uyandırmadan işlenebildiği, hem anonim hem de meşru görünen bir ortam yaratır. Stratejimiz, bilinen kartel bağlantılılarının uğrak yeri olan işletmeleri belirlemeyi ve mali işleyişlerini kapsamlı biçimde denetlemeyi içerecek. Şüpheli işlemleri titizlikle izleyip suç örgütleriyle doğrudan bağlantı kurarak bu paravanlara karşı kusursuz davalar hazırlayabiliriz. Yeterli kanıt toplandığında bu faaliyetleri durdurmak ve varlıklarına el koymak için eş güdümlü baskınlar düzenleyeceğiz; bu da kartellerin mali altyapısına ciddi bir darbe vururken devlet için kaynak da kazandıracak."
 investigates_the_banks:0 "Bankaları Soruştur"
 investigates_the_banks_desc:0 "Bankalar genellikle meşru kurumlar olsa da karmaşık kara para aklama operasyonlarında kritik kanallardır. Üst düzey banka yetkilileri ve finans analistleri üzerinde stratejik soruşturma ile işlem kayıtlarının kapsamlı analizini birleştirerek şüpheli fon hareketlerini tamamlanmadan önce yakalayabiliriz. Sabır ve gözetim sayesinde, gayrimeşru fonların yoğunluğu en üst düzeye ulaştığında, genellikle nihai varış noktalarına yaklaşırken vurabiliriz. Bu yaklaşım, suç örgütlerinin faaliyetlerinden önemli sermayeyi çekip alırken onlara azami mali zararı verir. Ancak etkin izlemeyi sürdürmek ciddi zorluklar taşır; zira suç şebekeleri tespitten kaçınmak için yöntemlerini sürekli geliştiriyor. Ayrıca, ekonomik önemleri ve güçlü bağlantıları nedeniyle suça karışan bankaları kapatmak siyaseten mümkün değil."
 investigate_shell_companies:0 "Paravan Şirketleri Soruştur"
 investigate_shell_companies_desc:0 "Paravan şirketler, karmaşık kara para aklama operasyonlarında hem ara durak hem de nihai depo işlevi görerek önemli aracılardır. Bu tüzel kişilikler kartellerin adına mülk ve sermaye tutar, bu varlıkları kademeli olarak meşru hedeflere aktarır. Suç örgütleriyle doğrudan bağlantı kurmak kapsamlı adli mali inceleme ve istihbarat toplamayı gerektirdiğinden önemli bir soruşturma zorluğu sunarlar. Bu zorluğa rağmen paravan şirketleri başarıyla hedef almak, kartelin mali altyapısını yıkıcı biçimde bozabilir. Bu operasyonlar büyük nakit el koymalarından ziyade genellikle önemli fiziksel varlıkların müsaderesiyle sonuçlanır: ticari gayrimenkul, lüks araçlar, sanayi ekipmanı ve yasal yoldan edinilmiş silahlar; çünkü suçlular parayı bu paravanlar üzerinden genellikle tespitten kaçınmak üzere tasarlanmış küçük ve düzenli işlemlerle taşır."
 target_cartel_drug_running_decision:0 "Uyuşturucu Kaçakçılığı Operasyonlarını Hedef Al"
 target_cartel_drug_running_decision_desc:0 "Uyuşturucu kaçakçılığı, kartellerin en büyük yasa dışı gelir kaynağıdır. Bazı karteller uyuşturucuyu kendileri yetiştirse de çoğu, işlenmiş ya da ham ürünleri tedarik zinciri boyunca taşıyarak kâr elde eder. Bu ulaşım güzergâhlarını sistematik olarak hedef alıp izleyerek çıkış noktalarını, varış noktalarını ve aktarma merkezlerini belirleyebiliriz. Bu istihbarat; teçhizat depolarına, rafinerilere, çiftliklere, uyuşturucu evlerine ve harekât üslerine stratejik baskınlar düzenlememizi sağlar. Alternatif olarak sevkiyatları yoldayken de yakalayabiliriz, ancak bu yaklaşım büyük operasyonlara karşı genellikle etkisiz kalır. Buna karşın, bu kayıpları telafi edecek sınırlı kaynaklara sahip daha küçük grupları önemli ölçüde istikrarsızlaştırabilir."
 raid_drug_convoys_decision:0 "Uyuşturucu Konvoylarına Baskın Düzenle"
 raid_drug_convoys_decision_desc:0 "Yoldaki uyuşturucu konvoylarını durdurmak, tedarik zincirlerini asgari harekât maliyetiyle verimli biçimde aksatmamızı sağlar. Büyük kartellerin güzergâhlarını ve taşıma yöntemlerini hızla uyarlayacak kaynakları olsa da küçük örgütler bu operasyonlara karşı özellikle savunmasızdır. Ürün ve gelirin aniden kaybı mali istikrarlarını yıkabilir ve azalan kaynaklar arasında liderlik denetimi sürdürmekte zorlandıkça sıklıkla iç çatışmaları tetikler. Bu hedefli engellemeler, suç hiyerarşilerindeki bölünmelerden yararlanırken devletin harekete geçtiğini gösteren çok görünür başarılar sağlar."
 raid_cartel_hideouts_decision:0 "Kartel Sığınaklarına Baskın Düzenle"
 raid_cartel_hideouts_decision_desc:0 "Kartel kalelerini ve ikmal depolarını hedef almak, harekât altyapılarını doğrudan bozarak uyuşturucu taşıma, faaliyetleri eş güdümleme ve topraklarını savunma kapasitelerini ciddi biçimde sınırlar. Bu baskınlar genellikle aksi halde devlet güçlerine ya da rakip örgütlere karşı kullanılacak taktik araçlara ve silahlara önemli ölçüde el konulmasıyla sonuçlanır. Bu operasyonların stratejik bir sonucu, kartel güç dengelerinin istikrarsızlaşma ihtimalidir. Zayıflayan örgütler çoğu zaman rakiplerin toprak genişlemesi için hedef haline gelir; bu da suç şebekelerini bizim lehimize parçalayabilir ya da güç boşlukları ortaya çıktıkça şiddetin tırmanmasını tetikleyebilir."
 raid_distribution_centres_decision:0 "Dağıtım Merkezlerine Baskın Düzenle"
 raid_distribution_centres_decision_desc:0 "Uyuşturucu evleri ve stok depoları dâhil kartel dağıtım merkezlerini hedef almak, narkotik maddelerin önemli bir bölümünü sokaklara ulaşmadan yakalamamızı sağlar. Bu operasyonlar, yasa dışı nakde büyük çapta el konulmasıyla ve kilit dağıtım personelinin tutuklanmasıyla sonuçlanır; tedarik zincirini haftalarca, hatta aylarca aksatır. Ancak bu baskınlar, kartellerin kazancını doğrudan vururken infaz yeteneklerini sağlam bıraktığı için şiddetli misilleme riskini artırır. Dağıtım merkezleri genellikle sıkı korunduğundan ve ürünlerin ve personelin çabucak dağılmasını kolaylaştıracak biçimde konumlandığından, bu tür operasyonlardan önce istihbarat toplamak kritik önemdedir."
 raid_refinement_centres_decision:0 "Rafineri Merkezlerine Baskın Düzenle"
 raid_refinement_centres_decision_desc:0 "Uyuşturucu laboratuvarlarına, plantasyonlara ya da yetiştirme evlerine baskın düzenleyerek kartelin dağıtım için yeni uyuşturucu üretme yeteneğini engelleyebilir ve onları büyük ölçüde geriletebiliriz. Bu gerileme, kayıplarını telafi etmeye çalışırken üretimlerini aylarca aksatmaya genellikle yeter. Aynı zamanda, kartelin kaynaklarının çoğu kendi topraklarını güvence altına almaya aktarıldığından misilleme saldırısı olasılığı düşüktür."
 target_local_cartel_leaders_decision:0 "Yerel Kartel Liderlerini Hedef Al"
 target_local_cartel_leaders_decision_desc:0 "Kartel, her karmaşık örgüt gibi faaliyetlerini eş güdümlemek için hiyerarşik bir liderlik yapısına dayanır. Yerel kartel liderlerini ister tutuklama, ister daha kalıcı yollarla stratejik olarak hedef alıp etkisiz hale getirerek komuta zincirlerini ciddi biçimde bozabiliriz. Bu istikrarsızlaşmanın birden fazla faydası vardır: yönlendirme olmadan devşirme çabaları aksar, harekât kapasitesi önemli ölçüde azalır ve astlar boşalan liderlik makamları için yarıştıkça iç iktidar mücadeleleri patlak verir. Ayrıca bu çok görünür yakalama ya da yok etmeler, basında önemli ölçüde olumlu yer bulur; kamuoyunun moralini yükseltir ve hükümetin organize suçla mücadeledeki etkinliğini gösterir. Bu isimlere karşı başarılı her operasyon yalnızca kartelin altyapısını zayıflatmakla kalmaz, aynı zamanda yenilmezlik algısını da aşındırır."
 mass_arrests_of_cartel_members_decision:0 "Şüpheli Kartel Üyelerinin Toplu Tutuklanması"
 mass_arrests_of_cartel_members_decision_desc:0 "Şüpheli kartel üyeleri yaşamın çeşitli kesimlerine gizlenmiş durumda. Bilinen ve şüpheli kartel üyelerini tutuklamaya başlamak için ordumuzu ya da polis güçlerimizi seferber edebiliriz."
