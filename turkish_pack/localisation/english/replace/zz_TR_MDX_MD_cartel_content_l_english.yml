 cartel_event.1.t:0 "Kartellerin Sonu"
 cartel_event.1.d:0 "Ülkemizdeki büyük kartellerin nüfuzu, kırsalımızın denetimini yeniden ele geçirmeyi ciddi biçimde düşünebileceğimiz kadar azaldı. Geriye yalnızca harekete geçme emrini vermek kalıyor."
 cartel_event.1.a:0 "Narkolar suçlarının bedelini ödeyecek!"
 cartel_event.3.t:0 "Meksika'nın Kaderi"
 cartel_event.3.d:0 "Kartellerden kurtulma çabalarımız gözden kaçmadı ve onlar Meksika hükümetine karşı silaha sarıldı. Meksika'da Uyuşturucuya Karşı Savaş son aşamasına girdi."
 cartel_event.3.a:0 "Sinaloa Kartelinin safına geç."
 cartel_event.3.b:0 "Tierra Caliente'nin safına geç."
 cartel_event.3.c:0 "Tamaulipas Kartelinin safına geç."
 cartel_event.3.e:0 "Yaşasın Meksika, Sonsuza Dek!"
 cartel_event.10.t:0 "Uyuşturucuyla Savaşın Sonu"
 cartel_event.10.d:0 "Büyük şehirlerimizin sokaklarında, ormanlarda, ovalarda ve çöllerde aylarca süren çatışmanın ardından her büyük kartel kalesini ve güzergâhını ortadan kaldırmayı, her önemli kartel liderini gözaltına almayı ya da öldürmeyi başardık. Narkoların sonu yaklaşıyor ve Meksika yakında yeniden özgürce nefes alacak."
 cartel_event.10.a:0 "Kâbus sona eriyor."
 cartel_event.12.t:0 "Kartellerden Karşı Saldırı"
 cartel_event.12.d:0 "Kartel biz faaliyetlerini bozup üyelerine saldırırken oturup seyretmeyi reddediyor. Karşılık olarak yerel güçlerimize karşı bir dizi bombalı ve misilleme saldırısı başlattılar."
 cartel_event.12.a:0 "Lanet olası narkolar!"
 cartel_event.15.t:0 "Kayıp Tüfekler ve Cephane"
 cartel_event.15.d:0 "Teçhizatın karaborsaya akışını sınırlamak amacıyla ülkemizin askeri üslerinde yürütülen yakın tarihli bir denetimde, hafif silah ve cephanede ciddi bir açık ortaya çıktı. Bir sayım hatası olma ihtimali sürse de teçhizatın karaborsaya satıldığı ya da satılmakta olduğu çok daha olası. Neyse ki sorun tek bir askeri üssle sınırlı ve orada tüm gücümüzle üzerine gidebiliriz."
 cartel_event.15.a:0 "Üs içi faaliyetleri kıs."
 cartel_event.15.b:0 "Zaten fazlasıyla yayıldık."
 cartel_event.16.t:0 "Kayıp Hizmet Araçları"
 cartel_event.16.d:0 "Teçhizatın karaborsaya akışını sınırlamak amacıyla ülkemizin askeri üslerinde yürütülen yakın tarihli bir denetimde, kamyonlarda ve yedek parçalarında ciddi bir açık ortaya çıktı. Bir sayım hatası olma ihtimali sürse de teçhizatın karaborsaya satıldığı ya da satılmakta olduğu çok daha olası. Neyse ki sorun tek bir askeri üssle sınırlı ve orada tüm gücümüzle üzerine gidebiliriz."
 cartel_event.16.a:0 "Üs içi faaliyetleri kıs."
 cartel_event.16.b:0 "Zaten fazlasıyla yayıldık."
 cartel_event.17.t:0 "Kayıp Helikopterler"
 cartel_event.17.d:0 "Teçhizatın karaborsaya akışını sınırlamak amacıyla ülkemizin askeri üslerinde yürütülen yakın tarihli bir denetimde, helikopterlerde ve yedek parçalarında ciddi bir açık ortaya çıktı. Bir sayım hatası olma ihtimali sürse de teçhizatın karaborsaya satıldığı ya da satılmakta olduğu çok daha olası. Neyse ki sorun tek bir askeri üssle sınırlı ve orada tüm gücümüzle üzerine gidebiliriz."
 cartel_event.17.a:0 "Üs içi faaliyetleri kıs."
 cartel_event.17.b:0 "Zaten fazlasıyla yayıldık."
 cartel_event.18.t:0 "Limanda Tanklara El Konuldu"
 cartel_event.18.d:0 "Büyük limanlarımızdan birinde liman idaremiz, yedek parça ve cephaneyle birlikte, eski ama tam silahlı ve çalışır durumdaki Sovyet yapımı T-55 tanklarından oluşan bir sevkiyat ortaya çıkardı. Gidecekleri yeri ya da çıkış noktalarını belirleyemesek de herhangi bir belgenin bulunmaması her ikisinin de yasa dışı olduğunu düşündürüyor. Bizim için iyi olan, nihai varış noktalarının tamamen elimizde olması."
 cartel_event.18.a:0 "Hurda olarak sat."
 cartel_event.18.b:0 "Hizmete al."
 cartel_event.18.c:0 "Dostlarımıza ver."
 cartel_event.19.t:0 "Toplu Mezar Ulusal Haberlere Çıktı"
 cartel_event.19.d:0 "Büyük şehirlerimizden birinde bir toplu ceset yığınının talihsiz keşfi haber döngüsüne girdi ve her ekranı ve her radyoyu kapladı. Bilgi akışının denetimini geri alma fırsatımız elimizden kayıp gidiyor. Hiçbir şey yapmazsak korku halkımızın üzerinde daha derin bir hâkimiyet kuracak ve bunu yapan canavarlar halkı daha kolay çiğneyecek."
 cartel_event.19.a:0 "Anlatının denetimini geri al."
 cartel_event.19.b:0 "Zaten fazlasıyla yayıldık."
 cartel_event.20.t:0 "Yabancı Ünlü Öldürüldü"
 cartel_event.20.d:0 "Geçtiğimiz hafta, [?var:foreign_celeb_country.GetName] ülkesinden bir ünlü yerel bir adam tarafından öldürüldü. Katil hakkında yapılan ilk soruşturma, ülkemizin en büyük suç örgütlerinden biriyle bağlantıları olduğunu ortaya çıkardı. Cinayetin sorumluluğunu bir şekilde üstlenmemiz için dış baskıyla karşı karşıyayız. Birkaç öneri öne sürüldü; en az göze batanı, ünlünün hayır kurumlarından birine destek vermek oldu."
 cartel_event.20.a:0 "Hayır kurumunu destekle."
 cartel_event.20.b:0 "Suçlularla ilişki kurmamalıydı."
 cartel_event.21.t:0 "Kartel Egzotik Hayvan İthal Ediyor"
 cartel_event.21.d:0 "Ülkemizdeki kartellerin en üst düzey üyeleri arasında egzotik hayvanlara karşı bir hayranlık yayıldı. Genellikle yasa dışı yollarla edinilen bu hayvanlar güç ve makam sembolü olarak kullanılıyor, zaman zaman da korkunç cinayetlerle ilişkilendiriliyor. Hayvan akışı üzerindeki denetimimizi sıkılaştırarak, fiyatları yapay biçimde yükselterek bu işe girişenlerin saçmalığını gözler önüne serebiliriz. Bir kaplan korkutucu olabilir, ama on milyon dolar harcamak bariz bir şatafat göstergesi."
 cartel_event.21.a:0 "Ticareti kökten sil."
 cartel_event.21.b:0 "Ticareti görmezden gel."
 cartel_event.22.t:0 "Yerel Çete Çatışmaları"
 cartel_event.22.d:0 "Büyük şehirlerimizden birinin sokaklarında bir çete savaşı patlak vererek yerel ekonomiyi aksattı, can aldı ve sakinlerin evlerinden çıkmaya korkmasına yol açtı. Analistlerimiz şiddetin uzun sürmeyeceğini öngörse de halkın sadece gelişigüzel cinayetlerin bitmesini beklemeye razı olması pek olası değil. Polis güçlerimizin müdahalesi krizi erken bitirebilir, ancak büyük bir masraf ve olası can kaybına yol açar."
 cartel_event.22.a:0 "Polisi gönder."
 cartel_event.22.b:0 "Zaten fazlasıyla yayıldık."
 cartel_event.23.t:0 "ABD İade Talep Ediyor"
 cartel_event.23.d:0 "Amerika Birleşik Devletleri, yakın zamanda parmaklıklar ardına koymayı başardığımız bir uyuşturucu baronunun iadesini talep etti. Diğer baronlara karşı gelecekteki yardım ihtimalleri adına onların gözünde iyi durmak için kabul etmek bizim yararımıza olur. Ancak Amerikan müdahalesi, hukuk sistemimizde kendi kendine yeterliliğimizi azaltmaya mahkûm."
 cartel_event.23.a:0 "Onu alabilirler."
 cartel_event.23.b:0 "Kendi suçlularımızla kendimiz başa çıkarız."
 cartel_event.24.t:0 "Muhbir Film Anlaşması Yaptı"
 cartel_event.24.d:0 "Ülkemizin en büyük suç örgütlerinden birinin eski üyesi olan muhbirlerimizden biriyle, hayatını kulaktan kulağa duyan bir film yapımcısı iletişime geçti ve hikâyelerini filme çekmek istiyor. Muhbirimiz kabul etmeye istekli, ancak bunu yapmak hayatını riske atabilir. Anlaşmayı destekleyip filmin yapımına izin verebilir ya da yakın gelecekteki her türlü umuda son verebiliriz."
 cartel_event.24.a:0 "Film anlaşmasına izin ver."
 cartel_event.24.b:0 "Çok tehlikeli."
 cartel_event.25.t:0 "Muhbir Anılarını Yayımladı"
 cartel_event.25.d:0 "Muhbirimizin film yapımcısıyla yakın zamandaki teması, hikâyesini dışarı çıkarması için onu cesaretlendirmiş gibi görünüyor. Geçtiğimiz haftalarda birkaç yazar ve devlet yetkilisiyle çalışarak adsız olarak yayımlanabilecek bir anı kitabı hazırladı. İlgili herkese göre anılar gerçekten sürükleyici ve kartellerdeki yaşamın gerçek, korkunç yüzünü gösteriyor."
 cartel_event.25.a:0 "Acaba çok satanlar listesine girer mi?"
 cartel_event.26.t:0 "Muhbir Plato Başında Öldürüldü"
 cartel_event.26.d:0 "Muhbirimizin cesedi, önemli bir sahneyi izlemek için yaptığı ziyaretin ardından plato başında bulundu. Cesedin durumuna bakılarak cinayetin kartel üyelerinin misillemesi olduğu sonucuna varıldı. Haklı olarak canlarından endişe eden filmin yapım ekibi, yapımı durdurmaya karar verdi."
 cartel_event.26.a:0 "Yazık oldu."
 cartel_event.27.t:0 "Film Suç Faaliyetini Teşvik Ediyor"
 cartel_event.27.d:0 "Görünüşe göre bir iletişim hatasının sonucu olarak, muhbirimizin hayatına dair yeni film sert bir suç trajedisinden çok bir De Vaqueros filmi gibi algılanıyor. Bu, genç adamların filmdeki karikatürleri taklit etmeyi ummasıyla ülkemizdeki birçok suç örgütünün devşirmesinde artışa yol açtı."
 cartel_event.27.a:0 "Ne yazık."
 cartel_event.28.t:0 "Film Suç Faaliyetini Caydırıyor"
 cartel_event.28.d:0 "Muhbirimizin yapımına yardım ettiği film, yayımlanmasının ilk haftasında eleştirmenlerin beğenisini kazandı. Dahası, kartellerin dehşetinin gerçekçi tasviri onlara karşı daha fazla tepkiye yol açtı. Gençlerimiz artık kartellere katılmaktansa büyüyüp kartellerle savaşmayı yeğliyor gibi görünüyor."
 cartel_event.28.a:0 "Mükemmel."
 cartel_event.29.t:0 "Kartel Sınır Geçişi Yaptı"
 cartel_event.29.d:0 "Komşu ülkelerimizden birindeki bir kartel, iki ülkenin sınır kontrol kurumlarının da engellemeye yeltenmediği ve sorumluluğu birbirine attığı büyük çaplı bir sınır geçişi gerçekleştirdi. Bu, siyasi aygıtımız içinde komşumuzun sınırlarının sıkılaştırılmasını talep eden bir harekete yol açtı; çünkü bunun tamamen bizim hatamız olması mümkün değil."
 cartel_event.29.a:0 "Komşudan daha sıkı sınır kontrolü iste."
 cartel_event.29.b:0 "Talepte bulunmak ilişkilerimize zarar verebilir."
 cartel_event.30.t:0 "Komşu Sınır Kontrolü Talep Ediyor"
 cartel_event.30.d:0 "Ülkemizden [FROM.GetName] ülkesine yakın zamanda yapılan bir kartel sınır geçişinin ardından komşumuz sınır güvenliğimizi artırmamızı talep etti. Şimdiye kadar bu, dışişleri teşkilatımızda birçok tartışmaya yol açtı."
 cartel_event.30.a:0 "Peki, güvenliğimizi artırırız."
 cartel_event.30.b:0 "Neden onlar sınır güvenliğini artırmıyor?"
 cartel_event.31.t:0 "Komşu Taleplerimizi Kabul Etti"
 cartel_event.31.d:0 "Komşumuz [FROM.GetName], sıkılaştırılmış sınır kontrolü taleplerimizi kabul etti. Şüphesiz seçmen tabanımız bu zaferden çok memnun kalacak."
 cartel_event.31.a:0 "Mükemmel."
 cartel_event.32.t:0 "Komşu Taleplerimizi Görmezden Geldi"
 cartel_event.32.d:0 "Komşumuz [FROM.GetName], sıkılaştırılmış sınır kontrolü taleplerimizi görmezden geldi. Siyasi başarısızlığımız yüzünden şimdiden haberlerde ağır eleştiriliyoruz."
 cartel_event.32.a:0 "Ne yazık."
 cartel_event.33.t:0 "Oligarka Bağlı Şüpheli Transferler"
 cartel_event.33.d:0 "Yakın tarihli soruşturmalarımızdan birinde, ülkemizdeki belirli bir oligarkın fonundan yasa dışı olmasa da şüpheli para transferleri ortaya çıkardık. Siyasi çarkları yağlayıp onları son soruşturmamıza dâhil etmek kolay olurdu. Ancak böyle bir aşırılık hiç şüphesiz hem yabancı hem yerli oligarkları öfkelendirir."
 cartel_event.33.a:0 "Varlıklarına el koy."
 cartel_event.33.b:0 "Rahat bırak."
 cartel_event.34.t:0 "Kartel Tankı Görüldü"
 cartel_event.34.d:0 "Bir kartel hedefine karşı yapılan son ve başarısız baskın sırasında, kartellerin bir tank kullandığı görüldü. Ağır biçimde modifiye edilmiş bir Sovyet T-34 gibi görünen tank, ana topunu ateşleyebiliyordu bile."
 cartel_event.34.a:0 "Bu konuda bir şey yapmalıyız."
 cartel_event.35.t:0 "Kartel Tankı Yok Edildi"
 cartel_event.35.d:0 "Bir kartel hedefine karşı yakın zamanda yapılan başarılı bir baskın sırasında ajanlarımız, son başarısızlıklarımızdan birinde görülen T-34'ü bulup yok etmeyi başardı. Özellikle tanksavar silahı kullanılmadan gerçekleştirilen bu zafer, haberlerde büyük yankı uyandırdı."
 cartel_event.35.a:0 "Tanrı'ya ve cesur adamlarımıza şükür."
 cartel_event.36.t:0 "Kartel Tankı Saldırıda Kullanıldı"
 cartel_event.36.d:0 "Son baskınlarımızdan birinin ardından kartel polis karakollarımızdan birine misilleme saldırısı düzenledi. Yakın zamanda görülen bir T-34'ü çiti yıkmak ve binaya gelişigüzel ateş açmak için kullanarak binayı harap ettiler. Bu, önemli sayıda kayıpla sonuçlandı ve olay ulusal haberlere çıktı."
 cartel_event.36.a:0 "Bu konuda bir şey yapmalıyız."
 cartel_event.37.t:0 "Nakliye Paravan Şirketi"
 cartel_event.37.d:0 "Yakın zamanda el koyduğumuz şirketlerden birinin varlıkları değerlendirilirken, birinin çok sayıda eski askeri 6x6 kamyonla tescil edildiği fark edildi. Kısa bir aramanın ardından araçlar şirkete ait bir depoda bulundu. Bu araçlar bugün çiftliklerde ve çeşitli diğer sektörlerde yaygın olarak kullanılıyor, ancak ordumuzda bazı eski görevlerde de hâlâ kullanılıyor."
 cartel_event.37.a:0 "Askeri hizmete al."
 cartel_event.37.b:0 "Kamyonları sivil şirketlere yeniden sat."
 cartel_event.38.t:0 "Suç Baronu Yanlışlıkla Tutuklandı"
 cartel_event.38.d:0 "Yalnızca alt kademe kartel üyesi olduğuna inanılanlara yönelik son tutuklama dalgasında, kazara büyük bir suç patronu yakalandığı ortaya çıktı. Başlangıçta kimliğini gizlemiş olsa da adamı tanıyan bir polis memuru tarafından teşhis edildi. Şimdi serbest bırakılmasını talep ediyor ve hatırı sayılır bir kefalet teklif ediyor."
 cartel_event.38.a:0 "Ah, evet, hepsi planın parçasıydı."
 cartel_event.38.b:0 "Kusura bakmayın, efendim."
 cartel_event.39.t:0 "Yetkililer Uyuşturucu Plantasyonuna Rastladı"
 cartel_event.39.d:0 "Ülkemizin kırsalında yapılan rutin bir devriye sırasında yerel bir polis gücü, uyuşturucu plantasyonu olduğuna inandığı bir yere rastladı. Prosedüre uygun olarak haberi üst makamlara iletti ve şimdi takviye kuvvet ya da ne yapılacağına dair talimat bekliyor."
 cartel_event.39.a:0 "Tarlaları yak ve teçhizatı yok et."
 cartel_event.39.b:0 "Tüm delillere ve teçhizata el koy."
 cartel_event.39.c:0 "Plantasyonu rahat bırak."
 cartel_event.40.t:0 "Anonim İhbar"
 cartel_event.40.d:0 "Savunmasız bir kartel karakolu hakkında anonim bir ihbar aldık. Hızlı davranırsak mevziyi ele geçirebiliriz. Ancak bu bir şaka ya da kartellerin bizi yerimizden oynatıp pusuya düşürme hamlesi olabilir."
 cartel_event.40.a:0 "İhbarı değerlendir, her fırsat gerçek bir fırsattır!"
 cartel_event.40.b:0 "İhbarı görmezden gel, büyük ihtimalle bir şaka."
 cartel_event.41.t:0 "Yerel İşletmeler Kartellerle İşbirliği Yapıyor"
 cartel_event.41.d:0 "Uzak kasabalarımızdan birindeki birkaç işletmenin, zaman zaman açıkça bile olsa kartellerle çalıştığı ortaya çıktı. Bunun sürmesine izin vermek halkımıza ya yönetmeye gönülsüz ya da yönetemez olduğumuz mesajını açıkça verir. Kartellere ise yönetme otoritelerine saygı duyduğumuz mesajını verir."
 cartel_event.41.a:0 "İşletme sahiplerini eylemleri nedeniyle uyar."
 cartel_event.41.b:0 "Faaliyete göz yum."
 cartel_event.42.t:0 "Sanayi Holdingleri Kaçak Mal Saklıyor"
 cartel_event.42.d:0 "Yakın zamanda aldığımız bir ihbara göre en büyük işletmelerimizin birçoğu kartellerin kaçak malları depolamak için depolarını kullanmasına izin veriyor. Bu açık bir yolsuzluk işareti olabilir, ancak şantajın sonucu olma ihtimali de var. Her iki durumda da bizden bir tür karşılık gerekiyor. Aksi halde ihbarcı muhtemelen haberlere gidecek."
 cartel_event.42.a:0 "Depolara el koy ve holdingleri cezalandır!"
 cartel_event.42.b:0 "Kaçak mala el koy ve işletmelere hafif bir uyarı ver."
 cartel_event.42.c:0 "Depolar onların ama artık herkes biliyor."
 cartel_event.43.t:0 "Yozlaşmış Yetkililer"
 cartel_event.43.d:0 "Anonim bir ihbar aldık ve bu, yerel siyasetçilerimizden birinin kampanya yatırımlarına yönelik kısa bir soruşturmaya yol açtı. Soruşturma, kampanya fonlarının çoğunun kartel faaliyetleriyle bağlantılı kişi ve şirketlerden sağlandığını ortaya koydu. Soruşturmadaki birçok işaret ayrıca atananlardan, yatırımcılardan ve siyasi müttefiklerden oluşan karmaşık bir ağa işaret ediyor."
 cartel_event.43.a:0 "Mümkün olduğunca çoğunu görevden uzaklaştır, buna tahammül edemeyiz."
 cartel_event.43.b:0 "Özel vatandaşların kampanya yatırımları bizi ilgilendirmez."
 cartel_event.44.t:0 "Liman İdaresi Kaçak Mal Buldu"
 cartel_event.44.d:0 "Büyük limanlarımızdan birinde liman idaremiz rutin bir arama sırasında kaçak mal dolu bir gemi konteyneri ortaya çıkardı. Prosedüre uygun olarak gemiye geçici olarak el koydular ve ne yapılacağına dair karar yetkisini bize bıraktılar."
 cartel_event.44.a:0 "Uyuşturucu ticaretine ortak olduğu için gemiye el koy."
 cartel_event.44.b:0 "Konteynere el koy, buradaki tek yasa dışı şey o."
 cartel_event.44.c:0 "Boş ver, iş iştir."
 cartel_event.45.t:0 "Bankacılar Göz Yumuyor"
 cartel_event.45.d:0 "Birkaç üst düzey bankacının kartel faaliyetlerine göz yumduğuna, hatta zaman zaman bunlara katıldığına dair anonim bir ihbar aldık. Bu bilgiyle bir şey yapmazsak ihbarcı muhtemelen haberlere sızdıracak."
 cartel_event.45.a:0 "İlgili bankacıları hapse at ve soruşturma başlat."
 cartel_event.45.b:0 "Bizim elimizde değil..."
 cartel_event.46.t:0 "Kartelin Cazip Rüşvetleri"
 cartel_event.46.d:0 "Siyasi kadromuzun birkaç üyesine yakın zamanda ilgi çekici bir teklif iletildi. Kartellere diğer çıkar grupları gibi davranıp istedikleri gibi faaliyet göstermeleri için alan tanırsak, yaklaşan birkaç önemli seçimi finanse edecekler. Üyelerimizin ideolojik olarak daha esnek olanları bizden yönlendirme bekliyor."
 cartel_event.46.a:0 "Elbette! Böylesine önemli bir çıkar grubuyla çalışmaktan memnuniyet duyarız."
 cartel_event.46.b:0 "Skandal! Halkın yüksek çıkarlarını temsil etmiyorlar."
 cartel_event.47.t:0 "Şeytanlarla Anlaşma"
 cartel_event.47.d:0 "Siyasi kadromuzun birkaç üst düzey üyesi yakın zamanda ülkemizin en büyük kartellerinden birinin liderleriyle bir toplantıya davet edildi. Toplantıda kartel liderleri niyetlerini açıkça ortaya koydu. Düşmanımız olmak zorunda değiller; hatta siyasi müttefik olabiliriz. İşbirliğimiz karşılığında şimdiden pastadan hatırı sayılır bir pay önerdiler ve ortaklığımız sürdükçe daha fazlasını vaat ettiler."
 cartel_event.47.a:0 "Vergiler, bir devletin işleyebilmesinin önemli bir parçasıdır."
 cartel_event.47.b:0 "O Şeytanların kapıdan içeri adım atmasına bile izin veremeyiz."
 cartel_event.48.t:0 "Uyuşturucu Ticaretini Düzenle"
 cartel_event.48.d:0 "Birkaç büyük kartel, kâr marjlarını yemeye başlayan kartel dışı suçları azaltmak için işbirliği yapmayı teklif etti. Karşılığında bağlı işletmelerinin daha doğru kâr bildirmesini sağlamak için işbirliği önerdiler. Bir de ticaretlerini daha insancıl hale getirmeyi; bunun ne anlama geldiği her neyse."
 cartel_event.48.a:0 "Sıkı denetimli devlet-kartel işbirliği için müzakere et."
 cartel_event.48.b:0 "Gevşek denetimli devlet-kartel işbirliği için müzakere et."
 cartel_event.48.c:0 "Suçlularla müzakere etmeyiz."
 cartel_event.49.t:0 "Gençlik İnancını Yitiriyor"
 cartel_event.49.d:0 "Nüfusumuzun en kolay şekil alan kesimlerinden biri gençlerimiz ve ülkemizin kartellerle birlikte içinde bulunduğu durum onları siyasi kadromuza karşı çevirmeye başladı. Anketler birçoğunun mümkün olur olmaz ülkeden ayrılmayı planladığını gösterirken, kalmayı planlayanlar bir sonraki seçimde bize karşı oy vermeye kararlı görünüyor. Aralarındaki en enerjik olanları kendi ülkelerini bizimle birlikte düzeltmeye yöneltmek için bir tanıtım programı denemeye çalışıyoruz."
 cartel_event.49.a:0 "Bir tanıtım programıyla elimizi uzat."
 cartel_event.49.b:0 "Kendi kendilerine acımaları içinde debelensinler, onlara ihtiyacımız yok."
 cartel_event.53.t:0 "Kartel Misilleme Saldırısı"
 cartel_event.53.d:0 "Son baskınlarımızdan birinin ardından kartel polis karakollarımızdan birine misilleme saldırısı düzenledi. Çevre güvenliğini aşmayı ve memurlarımızı kasabadan kovmayı başararak ardında yıkım izi bıraktılar. Bu, bir dizi kayıpla sonuçlandı ve olay ulusal haberlere çıktı."
 cartel_event.53.a:0 "Ne yazık."
 cartel_event.54.t:0 "Başarısız Kartel Misilleme Saldırısı"
 cartel_event.54.d:0 "Son baskınlarımızdan birinin ardından kartel polis karakollarımızdan birine misilleme saldırısı düzenledi. Memurlarımız yalnızca birkaç kayıp vererek yiğitçe direndi. Birkaç saat sonra takviye aldılar ve kartelleri dağıtmayı başardılar. Olay, ulusal haberlerde kartellere karşı bir birleşme noktası haline geldi."
 cartel_event.54.a:0 "Mükemmel."
 cartel_event.55.t:0 "Kartel Helikopter Düşürdü"
 cartel_event.55.d:0 "Yakın zamandaki bir baskın sırasında polis helikopterlerimizden biri kartel tarafından düşürüldü. Olayın incelenmesi, başıboş bir merminin pilotun boynuna isabet ettiğini, yardımcı pilotun kontrolü zamanında geri alamaması yüzünden felaket bir kazanın yaşandığını ortaya çıkardı. Böylesine önemli bir teçhizatı, mürettebatı da söylemeye gerek yok, kaybetmek üzücü."
 cartel_event.55.a:0 "Ne yazık."
 cartel_event.56.t:0 "Kartel İnfazından Sağ Kurtulan"
 cartel_event.56.d:0 "İyi niyetli bir yurttaş tarafından bulunup hastaneye yetiştirilen, ülkemizdeki kartel kaynayan bölgelerden birinden bir adam, yakında ölüm yatağı olabilecek bir yatakta yatıyor. Ancak ona yardım etme fırsatı bize sunuluyor. Daha iyi olanaklara sahip bir hastaneye taşınması gerekiyor ve bunu yakınımızdaki askeri helikopterlerimizden biri yapabilir."
 cartel_event.56.a:0 "O yeni El Fusilado'muz olacak!"
 cartel_event.56.b:0 "Doktorlarımızın onu kurtaramaması çok yazık..."
 cartel_event.50.t1:0 "Başarılı Kumarhane Soruşturmaları"
 cartel_event.50.d1:0 "Haftalarca süren planlama ve izlemenin ardından polis güçlerimiz ülkemizin kumarhanelerinden birine girdi; milyonlarca dolarlık kirli paraya el koydu, önemli fiziksel delilleri topladı ve kartelin kara para aklama düzeninin kilit isimlerini tutukladı. Toplanan delillerle kumarhane ve işletmecilerine bağlı tüm meşru varlıklara donma kararı koyduk. Bu darbeyle önemli bir altyapı unsurunu ortadan kaldırdık ve kullanılabilir fon biriktirme yeteneklerini engelledik."
 cartel_event.50.t2:0 "Başarılı Banka Soruşturmaları"
 cartel_event.50.d2:0 "Haftalarca süren bekleyiş ve para transferlerini izlemenin ardından bugün, bir kartel kara para aklama operasyonuna bağlı yarım düzine şirketin ve kişinin varlıklarını dondurduk. Tutuklama kararları çıkarıldı ve şirketlerin bir kısmı ile alt kademe siyasetçiler ve bürokratlar arasındaki şüpheli transferlere ilişkin daha küçük çaplı birkaç soruşturma başlatıldı. Karteller kaçınılmaz olarak toparlanacak olsa da bu kadar çok şeyin bir anda kaybı altyapıları için ağır bir darbe olacak."
 cartel_event.50.t3:0 "Başarılı Paravan Şirket Soruşturmaları"
 cartel_event.50.d3:0 "Haftalarca süren soruşturmanın ardından birkaç şüpheli şirketi kapattık ve bu sırada varlıklarına el koyduk. Çok az para toplanmış olsa da çok sayıda mülke, sivil araca ve diğer mallara el koyduk. Bu, yalnızca kara para aklama operasyonlarına değil, tüm faaliyetlerini sürdürme yeteneklerine de ağır bir darbe olmalı."
 cartel_event.50.t4:0 "Başarısız Kumarhane Soruşturmaları"
 cartel_event.50.d4:0 "Tüm çabalarımıza rağmen analistlerimiz, soruşturmamızın odaklandığı kumarhane ile karteller arasında bir bağlantı kuramadı. Daha kötüsü, insanlar soruşturmada kullanılan paranın nereye gittiğini sormaya başladı ve bu da muhalefetin adaylarımıza yönelik başarılı siyasi saldırılarına yol açtı. Hakaretin üstüne hakaret, karteller faaliyetlerine engelsiz devam ediyor."
 cartel_event.50.t5:0 "Başarısız Banka Soruşturmaları"
 cartel_event.50.d5:0 "Ajanlarımızın bilgisayarların başında kamburlaşarak ve banka transferlerini izleyerek geçirdiği haftalara rağmen kartellere darbe vurmak için net bir fırsat bulamadık. Daha kötüsü, insanlar soruşturmada kullanılan paranın nereye gittiğini sormaya başladı ve bu da muhalefetin adaylarımıza yönelik başarılı siyasi saldırılarına yol açtı. Hakaretin üstüne hakaret, karteller faaliyetlerine engelsiz devam ediyor."
 cartel_event.50.t6:0 "Başarısız Paravan Şirket Soruşturmaları"
 cartel_event.50.d6:0 "Soruşturmalarımıza harcanan zamana ve paraya rağmen ortaya çıkardığımız tek şey boşanma teminatı fonları ve sorumluluk koruma düzenleri oldu. Daha kötüsü, bu süreçte soruşturmamızı ulusal haberlere taşıyacak kadar çok kişinin ayağına basmayı başardık. Böyle bir utanç, gelecekteki seçim beklentilerimize büyük ihtimalle zarar verdi. Hakaretin üstüne hakaret, karteller faaliyetlerine engelsiz devam ediyor."
 cartel_event.50.a:0 "Soruşturma Sona Erdi"
 cartel_event.51.t1:0 "Başarılı Uyuşturucu Konvoyu Baskını"
 cartel_event.51.d1:0 "Bilinen bir uyuşturucu güzergâhı boyunca yakın zamanda yapılan bir vuruşta yüzlerce kilogram uyuşturucuya el koymayı, alt kademeden birkaç kartel üyesini tutuklamayı ve birkaç sivil araca az kayıpla el koymayı başardık. Bu, ticareti kısa bir süre durdurmaya yetmeli, ancak bu kayıplar yeterince büyük herhangi bir kartel tarafından kolayca sindirilebilir."
 cartel_event.51.t2:0 "Başarılı Kartel Sığınağı Baskını"
 cartel_event.51.d2:0 "Bilinen bir kartel kalesine yakın zamanda yapılan vuruşta düzinelerce kartel üyesini öldürmeyi ya da tutuklamayı, kullanılabilir birkaç askeri donanıma ve doğaçlama silaha el koymayı veya bunları yok etmeyi başardık. Diğer örgütler bu anlık zayıflıktan yararlanmaya çalışırken bu darbe zincirleme bir etki yaratabilir."
 cartel_event.51.t3:0 "Başarılı Dağıtım Merkezi Baskını"
 cartel_event.51.d3:0 "Bilinen bir dağıtım merkezine yakın zamanda yapılan vuruşta yüz binlerce dolarlık kirli paraya ve uyuşturucuya el koymayı başardık. Ayrıca bu yerle bağlantılı çok sayıda torbacıyı toplamaya başladık; bu da uyuşturucuyu piyasaya sürme ve kâr elde etme yeteneklerini ciddi biçimde engelliyor. Başarımıza rağmen misilleme saldırısı ihtimaline karşı tetikte olmalıyız."
 cartel_event.51.t4:0 "Başarılı Rafineri Merkezi Baskını"
 cartel_event.51.d4:0 "Bilinen bir rafineri merkezine yakın zamanda yapılan vuruşta yüz binlerce dolarlık teçhizatı ve uyuşturucuyu yok etmeyi başardık. Ayrıca rafinasyona katılan kişilerin çoğunu tutukladık; bu da gelecekte daha fazla uyuşturucu üretirken onları dezavantajlı duruma sokacak. Başarımıza rağmen misilleme saldırısı ihtimaline karşı tetikte olmalıyız."
 cartel_event.51.t5:0 "Başarısız Uyuşturucu Konvoyu Baskını"
 cartel_event.51.d5:0 "Bilinen bir uyuşturucu güzergâhı boyunca yakın zamanda girişilen vuruşta kuvvetlerimiz bunaldı ve birkaç kayıbı geride bırakarak geri çekilmek zorunda kaldı. Olayla ilgili bilgi çoktan kamuoyuna sızdı ve hükümetimize olan güveni azalttı. Misilleme saldırısı ihtimaline karşı tetikte olmalıyız."
 cartel_event.51.t6:0 "Başarısız Kartel Sığınağı Baskını"
 cartel_event.51.d6:0 "Bilinen bir kartel kalesine yakın zamanda girişilen vuruşta kuvvetlerimiz bunaldı ve birkaç kayıbı geride bırakarak geri çekilmek zorunda kaldı. Olayla ilgili bilgi çoktan kamuoyuna sızdı ve hükümetimize olan güveni azalttı. Misilleme saldırısı ihtimaline karşı tetikte olmalıyız."
 cartel_event.51.t7:0 "Başarısız Dağıtım Merkezi Baskını"
 cartel_event.51.d7:0 "Bilinen bir kartel dağıtım merkezine yakın zamanda girişilen vuruşta kuvvetlerimiz bunaldı ve birkaç kayıbı geride bırakarak geri çekilmek zorunda kaldı. Olayla ilgili bilgi çoktan kamuoyuna sızdı ve hükümetimize olan güveni azalttı. Mekânla ilgili herkes bu noktada dağılmış durumda. Misilleme saldırısı ihtimaline karşı tetikte olmalıyız."
 cartel_event.51.t8:0 "Başarısız Rafineri Merkezi Baskını"
 cartel_event.51.d8:0 "Bilinen bir kartel rafineri merkezine yakın zamanda girişilen vuruşta kuvvetlerimiz bunaldı ve birkaç kayıbı geride bırakarak geri çekilmek zorunda kaldı. Olayla ilgili bilgi çoktan kamuoyuna sızdı ve hükümetimize olan güveni azalttı. Misilleme saldırısı ihtimaline karşı tetikte olmalıyız."
 cartel_event.51.a:0 "Baskın Sona Erdi"
 cartel_event.52.t:0 "Kartellerin Sonu"
 cartel_event.52.d:0 "On yıllarca süren çatışmanın ve birçok kişinin fedakârlığının ardından kartellerin her kalıntısını ülkemizden söküp attık. Ancak etkilerinden hâlâ güvende değiliz. Bölgemizdeki diğer ülkeler hâlâ bu canavarların hükümranlığı altında acı çekiyor ve artık canavar avında bolca tecrübemiz var."
 cartel_event.52.a:0 "Bu, [ROOT.GetName] için yeni bir çağ."
 cartel_event.100.t:0 "[FROM.GetName] Kartellerini Yendi"
 cartel_event.100.d:0 "[FROM.GetName] ülkesinden kartellerine karşı başarı kazandığı haberi geldi. Bölgeye istikrar ve barış geri döndü."
 cartel_event.100.a:0 "Yeni Bir Pazar mı?"
 cartel_event.100.b:0 "[FROM.GetName] ülkesinde istikrar"
