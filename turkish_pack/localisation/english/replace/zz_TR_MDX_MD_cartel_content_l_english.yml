 cartel_penalties:0 "Kartelleri"
 cartel_penalties_desc:0 "Uyuşturucu şiddeti ve çete faaliyetleri, bu ülkenin suç manzarasının önemli bir bölümünü oluşturuyor. Bu güçlü suç örgütleri ülkenin her yerinde faaliyet gösteriyor ve durumun daha da kötüleşeceğinden endişe eden birçok vatandaşın içine korku salıyor. Ancak hükümetimizin yaklaşımına bağlı olarak, bu engeli stratejik bir kazanca dönüştürebiliriz."
