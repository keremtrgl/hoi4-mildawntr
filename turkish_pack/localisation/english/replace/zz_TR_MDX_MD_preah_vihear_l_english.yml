 preah_vihear_news.1.t:0 "Preah Vihear Anlaşmazlığı Çözüldü"
 preah_vihear_news.1.d:0 "Tayland ile Kamboçya arasındaki Preah Vihear Tapınağı konusundaki uzun süreli sınır anlaşmazlığı çözüldü. Tayland, Kamboçya'nın tapınak kompleksi üzerindeki egemenliğini teyit eden Uluslararası Adalet Divanı kararını kabul etti. İki ülke de bölgeden askerî güçlerini çekmeyi ve normal diplomatik ilişkiler kurmayı kabul etti."
 preah_vihear_news.1.o1:0 "Bölgesel istikrar yeniden sağlandı"
 preah_vihear_news.2.t:0 "ASEAN Sınır Anlaşmazlığında Arabuluculuk Yaptı"
 preah_vihear_news.2.d:0 "ASEAN arabuluculuğu sayesinde Tayland ve Kamboçya, Preah Vihear Tapınağı konusundaki sınır anlaşmazlığında gerilimi düşürmeyi kabul etti. İki ülke diplomatik çözüm için çalışırken Endonezyalı gözlemciler ateşkesi izleyecek."
 preah_vihear_news.2.o1:0 "Diplomasi galip geldi"
 preah_vihear_news.3.t:0 "Tayland ile Kamboçya Arasında Sınır Çatışmaları Patlak Verdi"
 preah_vihear_news.3.d:0 "Tayland-Kamboçya sınırında tartışmalı Preah Vihear Tapınağı yakınlarında silahlı çatışmalar patlak verdi. Tayland güçleri bölgede askerî operasyonlar başlattı ve Kamboçya birlikleri karşılık veriyor. Top ateşi ve hafif silah çatışmaları bildirildi. İki ülke toprak anlaşmazlığını tırmandırırken UNESCO Dünya Mirası Alanı olan kadim tapınak kompleksi çapraz ateşte kaldı."
 preah_vihear_news.3.o1:0 "Tehlikeli bir tırmanma"
 preah_vihear_news.4.t:0 "Preah Vihear'de Kesin Zafer"
 preah_vihear_news.4.d_sia:0 "Tayland, Preah Vihear'deki uzun süreli gerginlikte kesin bir zafer kazanarak Kamboçya'yı küçük düşürücü bir diplomatik geri adıma zorladı. Hiçbir toprak el değiştirmedi, ancak Bangkok gerginliği ulusal zafer olarak ilan ediyor."
 preah_vihear_news.4.d_cbd:0 "Kamboçya, Preah Vihear'deki uzun süreli gerginlikte kesin bir zafer kazanarak Tayland'ı küçük düşürücü bir diplomatik geri adıma zorladı. Hiçbir toprak el değiştirmedi, ancak Phnom Penh gerginliği ulusal zafer olarak ilan ediyor."
 preah_vihear_news.4.o1:0 "Bir rekabet şimdilik kesin olarak çözüldü"
 SIA_preah_vihear_vindicated:0 "Preah Vihear'de Haklı Çıkış"
 SIA_preah_vihear_vindicated_desc:0 "Tayland tapınak kompleksi çevresindeki tartışmalı toprakları ele geçirdi ve hükümet, uzun süreli bir sınır anlaşmazlığının kendi şartlarıyla çözülmesinin siyasi getirisinden yararlanıyor."
 SIA_preah_vihear_humiliation:0 "Preah Vihear Aşağılanması"
 SIA_preah_vihear_humiliation_desc:0 "Kamboçya artık Preah Vihear çevresindeki tartışmalı toprakları denetliyor ve bu kayıp siyasi yelpazenin her kesiminde hem diplomasinin hem silahların başarısızlığı olarak hissediliyor."
 CBD_preah_vihear_vindicated:0 "Preah Vihear'de Haklı Çıkış"
 CBD_preah_vihear_vindicated_desc:0 "Kamboçya tapınak kompleksi çevresindeki tartışmalı toprakları ele geçirdi ve hükümet, uzun süreli bir sınır anlaşmazlığının kendi şartlarıyla çözülmesinin siyasi getirisinden yararlanıyor."
 CBD_preah_vihear_humiliation:0 "Preah Vihear Aşağılanması"
 CBD_preah_vihear_humiliation_desc:0 "Tayland artık Preah Vihear çevresindeki tartışmalı toprakları denetliyor ve bu kayıp siyasi yelpazenin her kesiminde hem diplomasinin hem silahların başarısızlığı olarak hissediliyor."
 preah_vihear_observers:0 "Endonezyalı Sınır Gözlemcileri"
 preah_vihear_observers_desc:0 "ASEAN aracılığıyla yapılan bir düzenleme uyarınca silahsız Endonezyalı gözlemciler Preah Vihear sınırında konuşlu; ateşkes ihlallerini izliyor ve her iki hükümete anlaşmazlığın soğuması için biraz zemin sağlıyor."
