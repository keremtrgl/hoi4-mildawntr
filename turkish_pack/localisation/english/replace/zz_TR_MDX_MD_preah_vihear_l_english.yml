 preah_vihear_not_settled_TT:0 "Sınır son beş yıl içinde çözüme kavuşmadı"
 preah_vihear_no_recent_escalation_TT:0 "Yakın zamanda sınırda provokatif bir hamle yapmadık"
 preah_vihear_no_recent_protest_TT:0 "Yakın zamanda milliyetçi duyguları kışkırtmadık"
