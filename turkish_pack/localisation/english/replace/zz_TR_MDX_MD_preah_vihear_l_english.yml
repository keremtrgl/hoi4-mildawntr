 CBD_pv_extort_xp_desc:0 "Sınırda çatışmaya girmiş subayları dinle ve bu tecrübeyi, oradaki çatışmalar yeterli ders sağlamışsa, ordunun kalıcı doktrinine kat."
 CBD_pv_decisive_victory:0 "Kesin Zafer İlan Et"
 CBD_pv_decisive_victory_desc:0 "Çatışmanın dengesi kesin biçimde lehimize dönmüşken avantajı değerlendir: Tayland'ı küçük düşürücü bir geri adıma zorla ve birliklerimizden yeni bir metre toprağı tutmasını istemeden gerilimi ulusal zafer olarak ilan et."
 CBD_pv_de_escalate:0 "Gerilimi Düşürmeyi Teklif Et"
 CBD_pv_de_escalate_desc:0 "Bangkok ile gizli kanallar üzerinden itidal sinyali ver: birlikleri ileri mevzilerden geri çek ve söylemi yumuşat. Siyasi güçten başka bir şeye mal olmaz ve ileride ihtiyaç duyabileceğimiz iyi niyeti kazandırır."
 CBD_request_asean_mediation:0 "ASEAN Arabuluculuğu Talep Et"
 CBD_request_asean_mediation_desc:0 "ASEAN'dan Tayland ile sınır anlaşmazlığında arabuluculuk yapmasını iste. Bölgesel bir diplomatik çözüm taleplerimizi korumaya yardımcı olabilir."
 CBD_appeal_to_icj:0 "UAD'ye Başvur"
 CBD_appeal_to_icj_desc:0 "Kamboçya'nın Preah Vihear Tapınağı ve çevresindeki topraklar üzerindeki egemenliğini yeniden teyit ettirmek için Uluslararası Adalet Divanı'nda dava aç."
