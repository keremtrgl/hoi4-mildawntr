l_english:
 preah_vihear_decisions_category:0 "Preah Vihear Sınır Anlaşmazlığı"
 preah_vihear_decisions_category_desc:0 "Dângrêk yamacında yükselen on birinci yüzyıldan kalma Khmer tapınağı Preah Vihear, Fransız sömürge dönemi haritasının ve 1962 tarihli UAD kararının Kamboçya lehine çözdüğü, ancak Tayland'ın hiçbir zaman tam olarak kabul etmediği bir sınırın üzerinde duruyor. UNESCO'nun 2008'deki Dünya Mirası listesine alması yarayı yeniden açtı; tapınağın kendisi değilse bile çevresindeki yamaçlar hâlâ tartışmalı topraklar. Gerilimin artması yamaç için bir çatışmanın kapısını aralıyor. Her çatışma, iki tarafın da elinde tutmayı tercih edeceği kaynakları tüketiyor. \n\n§YSınır gerilimi:§! [?GLOBAL.preah_vihear_tension]\n§YHazırlığımız:§! [?THIS.preah_vihear_readiness]\n§YÇatışma ilerlememiz:§! [?THIS.preah_vihear_war_progress]"
 preah_vihear_dispute:0 "Preah Vihear Tapınağı Anlaşmazlığı"
 preah_vihear_deescalation_goodwill:0 "Gerilimi Düşürme İyi Niyeti"
 SIA_escalate_preah_vihear_tensions:0 "Sınır Gerilimini Tırmandır"
 SIA_escalate_preah_vihear_tensions_desc:0 "Gerginliği ciddi biçimde başlat: birlikleri Dângrêk yamacı yakınlarına yeniden konuşlandırmayı emret ve milliyetçi basının bunu işlemesine izin ver. Phnom Penh mesajı net biçimde alacak ve bu ilk adımdan geri dönüş yok."
 SIA_pv_prepare_infantry_training:0 "Piyade Saha Tatbikatı Yap"
 SIA_pv_prepare_infantry_training_desc:0 "Kamboçya ile olası bir sınır çatışmasına hazırlığı artırmak için cephe hattı piyade birliklerini Dângrêk yamacı çevresindeki arazide canlı atışlı tatbikatlara sok; stoktaki hafif silahlardan ve destek silahlarından yararlan."
 SIA_pv_prepare_armor_training:0 "Zırhlı Saha Tatbikatı Yap"
 SIA_pv_prepare_armor_training_desc:0 "Zırhlı birlikleri manevra tatbikatları için Preah Vihear yakınlarındaki tepelere sevk et; amfibi ve orta tankların ikisine de pek uygun olmayan arazide nasıl performans gösterdiğini sına."
 SIA_pv_prepare_artillery_training:0 "Topçu Saha Tatbikatı Yap"
 SIA_pv_prepare_artillery_training_desc:0 "Topçu bataryalarını tapınağa bakan yamaca doğrultarak bu sınırda daha önce birkaç kez yaşanmış türden bir karşılıklı ateşi prova et."
 SIA_pv_nationalist_rhetoric:0 "Yurt İçinde Milliyetçi Kamuoyunu Harekete Geçir"
 SIA_pv_nationalist_rhetoric_desc:0 "Bakanları, ordu sözcülerini ve devlet basınını Kamboçya ile sınır anlaşmazlığı konusunda yurt içinde milliyetçi kamuoyunu harekete geçirmeye teşvik et. Bu iç kamuoyunda karşılık bulur, ancak her tur sınırdaki gerilimi yükseltir."
 SIA_pv_military_posturing:0 "Güçleri Sınıra Yeniden Konuşlandır"
 SIA_pv_military_posturing_desc:0 "Kararlılık göstermek için Preah Vihear yakınlarındaki sınıra ek birlikler sevk et. Kamboçya bunu tam olarak olduğu gibi okuyacak."
 SIA_pv_attack_preah_vihear:0 "Sınır İhlali Başlat"
 SIA_pv_attack_preah_vihear_desc:0 "Tapınak kompleksi çevresindeki toprakları ele geçirmek için ordu birliklerini sınırın ötesine gönder. Başarı, tartışmalı toprakları namlularımızın altına alır. Başarısızlık ülke içinde ve dışında desteğimize ağır bedel ödetir."
 SIA_pv_extort_xp:0 "Sınırdan Ders Çıkar"
 SIA_pv_extort_xp_desc:0 "Sınırda çatışmaya girmiş subayları dinle ve bu tecrübeyi, oradaki çatışmalar yeterli ders sağlamışsa, ordunun kalıcı doktrinine kat."
 SIA_pv_decisive_victory:0 "Kesin Zafer İlan Et"
 SIA_pv_decisive_victory_desc:0 "Çatışmanın dengesi kesin biçimde lehimize dönmüşken avantajı değerlendir: Kamboçya'yı küçük düşürücü bir geri adıma zorla ve birliklerimizden yeni bir metre toprağı tutmasını istemeden gerilimi ulusal zafer olarak ilan et."
 SIA_pv_capture_northern_khmer:0 "Kuzey Khmer'i Ele Geçir"
 SIA_pv_capture_northern_khmer_desc:0 "Çatışmalar o kadar ezici biçimde lehimize ilerledi ki tartışmalı yamaç önümüzde açık duruyor. Prestijle yetinmek yerine toprağı kalıcı olarak al: Kuzey Khmer bölgesini doğrudan ilhak et, bayrağı tapınağın üzerine dik ve sınır meselesini kendi şartlarımızla kalıcı olarak kapat. Kamboçya bunu asla affetmeyecek ve dünya buna fetih diyecek."
 SIA_pv_de_escalate:0 "Gerilimi Düşürmeyi Teklif Et"
 SIA_pv_de_escalate_desc:0 "Phnom Penh ile gizli kanallar üzerinden itidal sinyali ver: birlikleri ileri mevzilerden geri çek ve söylemi yumuşat. Siyasi güçten başka bir şeye mal olmaz ve ileride ihtiyaç duyabileceğimiz iyi niyeti kazandırır."
 SIA_request_asean_mediation:0 "ASEAN Arabuluculuğu Talep Et"
 SIA_request_asean_mediation_desc:0 "ASEAN'dan Kamboçya ile sınır anlaşmazlığında arabuluculuk yapmasını iste. Bu diplomatik yaklaşım gerilimi yatıştırmaya ve barışçıl bir çözüm bulmaya yardımcı olabilir."
 SIA_accept_icj_ruling:0 "UAD Kararını Kabul Et"
 SIA_accept_icj_ruling_desc:0 "Preah Vihear Tapınağı anlaşmazlığına ilişkin Uluslararası Adalet Divanı kararını kabul et. Bu, çatışmayı sona erdirir ancak diplomatik yenilgi olarak görülebilir."
 SIA_reject_icj_ruling:0 "UAD Kararını Reddet"
 SIA_reject_icj_ruling_desc:0 "UAD kararını reddet ve tartışmalı topraklar üzerindeki taleplerimizi sürdür. Bu, uluslararası gerilimi tırmandırır ancak kararlılığımızı gösterir."
 CBD_protest_thai_actions:0 "Diplomatik Protesto"
 CBD_protest_thai_actions_desc:0 "Tayland büyükelçisini çağır, ASEAN'da ve BM'de resmî protesto sun ve ulusun hükümetin kararlı duruşunu görmesini sağla. Bu, ülke içinde siyasi güç toplar ve şikâyetimizi kayıtlara geçirir; Bangkok'un yatıştırmaya hiç niyeti olmayan bir sınırı yatıştırıyormuş gibi yapmaz."
 CBD_pv_prepare_infantry_training:0 "Piyade Saha Tatbikatı Yap"
 CBD_pv_prepare_infantry_training_desc:0 "Tayland ile olası bir sınır çatışmasına hazırlığı artırmak için cephe hattı piyade birliklerini Preah Vihear kompleksi çevresinde canlı atışlı tatbikatlara sok; stoktaki hafif silahlardan ve destek silahlarından yararlan."
