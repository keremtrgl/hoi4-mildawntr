 CBD_pv_attack_preah_vihear_desc:0 "Tapınak kompleksi çevresindeki toprakları ele geçirmek için ordu birliklerini sınırın ötesine gönder. Başarı, tartışmalı toprakları namlularımızın altına alır. Başarısızlık ülke içinde ve dışında desteğimize ağır bedel ödetir."
