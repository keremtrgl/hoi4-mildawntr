 preah_vihear_mediation_tension_TT:0 "Sınır gerilimi 20'den yüksek"
 preah_vihear_icj_grounds_TT:0 "Sınır gerilimi 74'ten yüksek veya Tayland sınırın ötesine saldırdı"
 preah_vihear_tension_resolved_TT:0 "§GBu, sınır gerilimini sıfırlayacak§!"
 preah_vihear.100.t:0 "UNESCO Preah Vihear'i Dünya Mirası Alanı İlan Etti"
 preah_vihear.100.d:0 "Birleşmiş Milletler Eğitim, Bilim ve Kültür Örgütü, Preah Vihear Tapınağı'nı resmen Dünya Mirası Alanı ilan ederek Kamboçya'ya atfetti. Tayland genelinde milliyetçi protestolar patlak verdi; göstericiler kendi toprakları saydıkları yerin korunması için askerî eylem talep ediyor. Sınırdaki durum hızla kötüleşiyor."
 preah_vihear.100.a:0 "Bu bir skandal! Güçlerimizi seferber edin!"
 preah_vihear.100.b:0 "Uluslararası karara saygı göstermeliyiz"
 preah_vihear.101.t:0 "UNESCO Preah Vihear'i Tanıdı"
 preah_vihear.101.d:0 "UNESCO, kadim Preah Vihear Tapınağı'nı Kamboçya egemenliği altında resmen Dünya Mirası Alanı ilan etti. Bu, 1962 tarihli UAD kararını teyit eden büyük bir diplomatik zafer. Ancak Tayland'daki milliyetçi protestolar sınırımızdaki gerilimi artırabilir."
 preah_vihear.101.a:0 "Kamboçya için harika bir gün!"
 preah_vihear.1.t:0 "Sınırda Tayland Provokasyonları"
 preah_vihear.1.d:0 "Tayland, Preah Vihear Tapınağı yakınındaki sınırımız boyunca gerilimi tırmandırdı. Bangkok'taki milliyetçi göstericiler askerî eylem talep ediyor ve Tayland birlikleri tartışmalı bölgeye daha yakın konuşlandırıldı."
 preah_vihear.1.a:0 "Teyakkuzda kalmalıyız"
 preah_vihear.5.t:0 "Tayland Güçleri Saldırıyor!"
 preah_vihear.5.d:0 "Tayland askerî güçleri Preah Vihear Tapınağı yakınlarındaki tartışmalı sınır bölgesine girdi. Birliklerimiz saldırganlarla çatışıyor. Durumun tam ölçekli bir çatışmaya dönüşme tehdidi taşıdığını uluslararası toplum izliyor."
 preah_vihear.5.a:0 "Topraklarımızı savunun!"
 preah_vihear.6.t:0 "Kamboçya Karşı Saldırısı"
 preah_vihear.6.d:0 "Kamboçya güçleri Preah Vihear Tapınağı yakınlarındaki mevzilerimize karşı saldırı başlattı. Sınır boyunca top ve hafif silah ateşi duyuluyor."
 preah_vihear.6.a:0 "Mevzilerimizi tutmalıyız"
 preah_vihear.10.t:0 "Sınır Çatışmasında Zafer"
 preah_vihear.10.d:0 "Güçlerimiz Preah Vihear yakınlarındaki sınır çatışmasında hedeflerine ulaştı. Düşman geri püskürtüldü ve bölgede askerî yeteneğimizi sergiledik."
 preah_vihear.10.a:0 "Mükemmel haber"
 preah_vihear.11.t:0 "Sınır Çatışmasında Yenilgi"
 preah_vihear.11.d:0 "Güçlerimiz Preah Vihear yakınlarındaki sınır çatışmasında geri püskürtüldü. Çatışma başarısızlıkla sonuçlandı ve birliklerimiz kayıplarla önceki mevzilerine çekildi."
 preah_vihear.11.a:0 "Acı bir gerileme"
 preah_vihear.12.t:0 "Sınır Çatışması Sonuçsuz Kaldı"
 preah_vihear.12.d:0 "Preah Vihear yakınlarındaki sınır çatışması çıkmazla sona erdi. Her iki taraf da hedeflerine ulaşamadan geri çekildi, ancak ikisi de değerli muharebe tecrübesi kazandı."
 preah_vihear.12.a:0 "Yeniden toparlanıp durumu değerlendirelim"
 preah_vihear.13.t:0 "Karşı Saldırıda Zafer"
 preah_vihear.13.d:0 "Karşı saldırımız düşman güçlerini geri püskürtmeyi başardı. Topraklarımıza yönelik saldırganlığın kararlı bir direnişle karşılanacağını gösterdik."
 preah_vihear.13.a:0 "Egemenliğimiz savunuldu"
 preah_vihear.14.t:0 "Karşı Saldırı Püskürtüldü"
 preah_vihear.14.d:0 "Karşı saldırımız düşman güçlerince püskürtüldü. Elimizden gelen her şeye rağmen onları tartışmalı bölgedeki mevzilerinden söküp atamadık."
 preah_vihear.14.a:0 "Toparlanacağız"
 preah_vihear.20.t:0 "ASEAN Arabuluculuk Önerisi"
 preah_vihear.20.d:0 "Tayland, Preah Vihear sınır anlaşmazlığında ASEAN arabuluculuğu talep etti. ASEAN dönem başkanı olarak Endonezya, sınır bölgesine gözlemci göndermeyi ve iki taraf arasındaki müzakereleri kolaylaştırmayı öneriyor."
 preah_vihear.20.a:0 "Arabuluculuğu kabul et"
 preah_vihear.20.b:0 "Arabuluculuğu reddet"
 preah_vihear.21.t:0 "ASEAN Arabuluculuk Önerisi"
 preah_vihear.21.d:0 "Kamboçya, Preah Vihear sınır anlaşmazlığında ASEAN arabuluculuğu talep etti. ASEAN dönem başkanı olarak Endonezya, sınır bölgesine gözlemci göndermeyi ve iki taraf arasındaki müzakereleri kolaylaştırmayı öneriyor."
 preah_vihear.21.a:0 "Arabuluculuğu kabul et"
 preah_vihear.21.b:0 "Arabuluculuğu reddet"
 preah_vihear.22.t:0 "ASEAN Arabuluculuğu Kabul Edildi"
 preah_vihear.22.d:0 "Tayland ve Kamboçya ASEAN arabuluculuğunu kabul etti. Endonezyalı gözlemciler sınır bölgesine konuşlandırılacak ve anlaşmazlığa barışçıl bir çözüm bulmak için diplomatik müzakereler başlayacak."
 preah_vihear.22.a:0 "Barışa giden bir yol"
 preah_vihear.23.t:0 "ASEAN Arabuluculuğu Reddedildi"
 preah_vihear.23.d:0 "Diğer taraf Preah Vihear anlaşmazlığında ASEAN arabuluculuğunu reddetti. Diplomatik çabalar başarısız oldu ve sınır boyunca gerilim yüksek seyrediyor."
 preah_vihear.23.a:0 "Süregelen çatışmaya hazırlanmalıyız"
 preah_vihear.30.t:0 "Kamboçya UAD'ye Başvurdu"
 preah_vihear.30.d:0 "Kamboçya, Preah Vihear Tapınağı anlaşmazlığıyla ilgili olarak Uluslararası Adalet Divanı'nda dava açtı. Divan, Kamboçya'nın geçici tedbir talebini değerlendirecek ve sonunda egemenlik meselesinde karar verecek."
 preah_vihear.30.a:0 "Divanın kararını bekliyoruz"
 preah_vihear.31.t:0 "UAD Lehimize Karar Verdi"
 preah_vihear.31.d:0 "Uluslararası Adalet Divanı, Kamboçya'nın Preah Vihear Tapınağı üzerindeki egemenliğini yeniden teyit etti ve iki tarafa tapınak çevresindeki geçici askerden arındırılmış bölgeden askerî personelini çekme emri verdi."
 preah_vihear.31.a:0 "Uluslararası hukuk bizden yana"
 preah_vihear.32.t:0 "UAD Aleyhimize Karar Verdi"
 preah_vihear.32.d:0 "Uluslararası Adalet Divanı, Preah Vihear Tapınağı üzerindeki Kamboçya'nın egemenlik iddialarını haklı buldu. Divan, tartışmalı bölge çevresinde askerden arındırılmış bir bölge kurulmasına karar verdi."
 preah_vihear.32.a:0 "Bu haksız bir karar"
 preah_vihear.35.t:0 "Tayland UAD Kararını Kabul Etti"
 preah_vihear.35.d:0 "Tayland, Preah Vihear Tapınağı anlaşmazlığına ilişkin UAD kararını kabul etti. Tayland güçleri askerden arındırılmış bölgeden çekilecek ve böylece sınır krizi fiilen sona erecek."
 preah_vihear.35.a:0 "Sonunda barış"
 preah_vihear.36.t:0 "Tayland UAD Kararını Reddetti"
 preah_vihear.36.d:0 "Tayland, Preah Vihear Tapınağı anlaşmazlığına ilişkin UAD kararını haksız bularak reddetti ve divanın yargı yetkisini tanımayı reddetti. Sınırdaki gerilimin artması bekleniyor."
 preah_vihear.36.a:0 "Süregelen çatışmaya hazırlanmalıyız"
 preah_vihear.40.t:0 "Sınırda Eğitim Kazası"
 preah_vihear.40.d:0 "Sınır yakınındaki bir canlı atışlı tatbikat ters gitti. Teçhizat hasar gördü, birkaç asker göreve elverişsiz hale geldi ve bu aksilik hazırlık programına olan güveni zedeledi."
 preah_vihear.40.a:0 "Hatadan ders çıkaralım"
 preah_vihear.41.t:0 "Provokasyon Geri Tepti"
 preah_vihear.41.d:0 "Söylemdeki ve birlik hareketlerindeki son tur, ülke içinde istenmeyen bir mercek altına girmemize yol açtı. Muhalefet isimleri ve basın, hükümetin kontrol edemeyeceği bir kriz üretip üretmediğini soruyor; hükümet gerilimi düşürmek zorunda kaldı."
 preah_vihear.41.a:0 "Dersi not edelim"
 preah_vihear.110.t:0 "Noppadon Bildirisi"
 preah_vihear.110.d:0 "Dışişleri Bakanı Noppadon Pattama, Kamboçya'nın Preah Vihear için UNESCO listesine girme girişimini destekleyen ortak bir bildiriyi imzaladı; bu belge o günden beri ülke içinde fırtına koparttı. Anayasa Mahkemesi anlaşmanın uygun parlamento onayı olmadan yapılıp yapılmadığını inceliyor ve milliyetçi eleştirmenler bakanın istifasını talep ediyor."
 preah_vihear.110.a:0 "Bildirinin arkasında dur"
 preah_vihear.110.b:0 "Bildiriyi reddet ve bakanı görevden al"
 preah_vihear.111.t:0 "Thaksin Phnom Penh'de"
 preah_vihear.111.d:0 "Başbakan Hun Sen, kaçak Thaksin Shinawatra'yı kişisel ekonomi danışmanı olarak atadı; bu, Bangkok'taki hükümete yönelik hesaplı bir hakaret. Kamboçya iade talebini değerlendirmeyi reddetti ve bu atama sınırın iki yakasında da bir toplanma noktasına dönüştü."
 preah_vihear.111.a:0 "Büyükelçimizi geri çağır"
 preah_vihear.111.b:0 "Yalnızca resmî protesto sun"
 preah_vihear.112.t:0 "Sınırda Sarı Gömlekliler"
 preah_vihear.112.d:0 "Demokrasi İçin Halk İttifakı, sınır anlaşmazlığını hükümetin Phnom Penh'e fazla yakın ve ulusal egemenlik konusunda fazla yumuşak olduğunun yeni kanıtı olarak değerlendirdi. Hükümet Konağı önündeki mitingler seyrelme belirtisi göstermiyor."
 preah_vihear.112.a:0 "Protestolara göğüs ger"
 preah_vihear.120.t:0 "Anlaşmazlık BM Güvenlik Konseyi'ne Taşındı"
 preah_vihear.120.d:0 "Sınır krizi, Güvenlik Konseyi gündemine girecek kadar tırmandı. Üye devletler her iki tarafı da itidale çağırdı, ancak bağlayıcı bir eylem beklenmiyor."
 preah_vihear.120.a:0 "Görüşmeleri not edelim"
 preah_vihear.121.t:0 "Endonezya Gözlemci Önerdi"
 preah_vihear.121.d:0 "ASEAN dönem başkanı olarak Endonezya, sınırı izlemek ve ateşkes ihlallerini raporlamak üzere silahsız gözlemciler konuşlandırmayı önerdi. Cakarta bunu arabuluculuk yoluyla bir çözümden ziyade güven artırıcı bir adım olarak sunuyor."
 preah_vihear.121.a:0 "Gözlemcileri kabul et"
 preah_vihear.121.b:0 "Teklifi reddet"
 preah_vihear.130.t:0 "Kesin Yenilgi"
 preah_vihear.130.d:0 "Diğer taraf Preah Vihear'deki gerginlikte kesin bir zafer kazandı ve şimdi küçük düşürülmemizi kalıcı kılmak için tüm diplomatik ve propaganda kanallarını işletiyor. Hiçbir toprak el değiştirmedi, ancak sınırdaki konumumuz yıllardır olmadığı kadar zayıf görünüyor."
 preah_vihear.130.a:0 "Aksiliği şimdilik kabullen"
 preah_vihear.130.b:0 "Tam ölçekli savaşa hazırlan"
 preah_vihear.131.t:0 "Yamaç Kaybedildi"
 preah_vihear.131.d:0 "Tayland güçleri tartışmalı bölgeyi işgal etti ve Bangkok, tapınağıyla birlikte Kuzey Khmer bölgesini resmen ilhak etti. Bizim olması gereken 1962 kararı, yüksekteki birliklere karşı hiçbir anlam taşımıyor. Ulus şok içinde ve verebilecek bir cevabımız olmayabilir."
 preah_vihear.131.a:0 "Ulus için kara bir gün"
 preah_vihear.131.b:0 "Geri alacağız"
