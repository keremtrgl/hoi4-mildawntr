 CBD_pv_prepare_armor_training_desc:0 "Zırhlı birlikleri manevra tatbikatları için tartışmalı tapınak yakınındaki mevzilere sevk et; amfibi ve orta tankların ikisine de pek uygun olmayan arazide nasıl performans gösterdiğini sına."
 CBD_pv_prepare_artillery_training:0 "Topçu Saha Tatbikatı Yap"
 CBD_pv_prepare_artillery_training_desc:0 "Topçu bataryalarını yamaçtaki Tayland mevzilerine doğrultarak bu sınırda daha önce birkaç kez yaşanmış türden bir karşılıklı ateşi prova et."
