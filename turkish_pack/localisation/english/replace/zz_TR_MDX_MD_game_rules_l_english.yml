 RULE_ALLOW_ENABLE_LEDGER:0 "MD Defterini Etkinleştir"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC:0 "MD Defteri etkin. (La Resistance istihbarat defterindeki bazı bilgiler gereksiz hâle gelebilir. Daha zor bir oyun istiyorsanız bu özelliği kapatın.)"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC:0 "MD defterini devre dışı bırakır. Daha otantik bir deneyim isteyen ve önemli bilgiler için La Resistance'ı kullanmak isteyen oyuncular için daha uygundur."
 RULE_HISTORIC_EVENTS:0 "Tarihî Olay Tetikleme"
 RULE_HISTORIC_EVENTS_YES:0 "Tarihî olaylar rastgele tetiklenmez. Çoğu olay yine rastgele tetiklenir, ancak bazı olayların tarihî tarihlerinin bulunduğu ay içinde kesin tetiklenmesi sağlanır; böylece önemli ölçüde gecikme ihtimali azalır. Bu, kusursuz biçimde tarihî bir oyun oynayacağınız anlamına gelmez; yalnızca oyunu tarihî yöne doğru itmeye yardımcı olur."
 RULE_HISTORIC_EVENTS_NO:0 "Tarihî olaylar rastgele tetiklenir. Bu, normal oyun ayarıdır."
 RULE_CORPORATE_HISTORY:0 "Şirket Tarihi"
 RULE_CORPORATE_HISTORY_FULL:0 "Tam"
 RULE_CORPORATE_HISTORY_FULL_DESC:0 "Şirket Tarihi, yazılmış sanayi seçeneklerini tarihî dönüm noktalarında sunar. Bu, normal ayardır."
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY:0 "Yalnızca Sonuçlar"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY_DESC:0 "Şirket Tarihi, tarihî rotayı ve kalıcı ulusal etkilerini olay seçeneklerini göstermeden ve tek seferlik ödüllerini vermeden sessizce uygular."
 RULE_CORPORATE_HISTORY_OFF:0 "Kapalı"
 RULE_CORPORATE_HISTORY_OFF_DESC:0 "Şirket Tarihi hiçbir eyalet oluşturmaz ve hiçbir olay planlamaz. Yerel ülke içeriği değişmeden kalır."
 RULE_ALLOW_HELP_GUI:0 "MD Yardım Arayüzünü Etkinleştir"
 RULE_ALLOW_HELP_GUI_YES:0 "MD Yardım Arayüzünü etkinleştirir."
 RULE_ALLOW_HELP_GUI_NO:0 "MD Yardım Arayüzünü devre dışı bırakır."
 RULE_ALLOW_PLAYER_COLORED_PUPPETS:0 "MD Renkli Kuklaları Etkinleştir"
 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC:0 "Bu oyun kuralı etkin olduğundan, kukla olan her ülke otomatik olarak hâkim devletinin rengine geçer. (Örneğin Çin Hindistan'ı kukla yaparsa Hindistan da Çin gibi kırmızı olur.)"
 RULE_OPTION_MD_COLORED_PUPPETS_NO_DESC:0 "Bu oyun kuralı devre dışı olduğundan, ülkeler kukla olduklarında renk değiştirmez ve renkleri sabit kalır."
 RULE_CARRIER_ONLY_RAIDS:0 "Yalnızca Uçak Gemisi Baskınlarını Etkinleştir"
 RULE_CARRIER_ONLY_RAIDS_NO:0 "Yalnızca uçak gemisi baskınlarını devre dışı bırakır. Bu, uçak gemisi baskınlarını kullanma yeteneğini etkilemez, ancak uçak gemisi hava birimlerinin uçak gemisinden hava üslerine geçtiği sık sorunlar yaşıyorsanız işe yarar."
 RULE_CARRIER_ONLY_RAIDS_YES:0 "Yalnızca uçak gemisi baskınlarını etkinleştirir. Bu, yalnızca uçak gemisinden kalkışa izin veren diğer baskınların bir kopyasıdır."
 RULE_RAID_DOCTRINE_REACH:0 "Baskınlarda Doktrin Menzilini Uygula"
 RULE_RAID_DOCTRINE_REACH_YES:0 "Varsayılan davranış. Müdahale doktrinleri baskın hedeflemesini kısıtlar: §YKendi Hâlinde Kalma§! barış zamanında baskın yapamaz, §YYerel Güvenlik§! barış zamanında baskın yapamaz, §YSınırlı Müdahalecilik§! komşu gerektirir ve §YBölgesel Müdahalecilik§! aynı kıtadaki hedefler gerektirir. Savaş bunu her zaman aşar."
 RULE_RAID_DOCTRINE_REACH_NO:0 "Baskınlarda müdahale doktrini menzil denetimini devre dışı bırakır. Oyuncular (ve yapay zekâ), dış politika doktrininden bağımsız olarak görünen her hedefe karşı baskın hazırlayabilir. Savaş, ilişki ve ittifak denetimleri yine geçerlidir."
