 RULE_ENABLE_DIVISION_LIMITER:0 "Yapay Zekâ Tümen Sınırlayıcıyı Etkinleştir"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC:0 "Yapay Zekâ Tümen Sınırlayıcı Devre Dışı\n\nVarsayılan olarak yapay zekânın üretebileceği birlik sayısı sınırlanmaz. Performans nedeniyle tümenleri sınırlamak istiyorsanız beni etkinleştirin!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC:0 "Yapay Zekâ Tümen Sınırlayıcı Etkin\n\nEtkin olduğumda yapay zekâ daha az birlik üretir; böylece oyuncu olarak siz görece huzur içinde, daha akıcı bir deneyim yaşarsınız!"
