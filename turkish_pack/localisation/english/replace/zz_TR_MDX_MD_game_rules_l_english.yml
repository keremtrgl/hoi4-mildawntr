 RULE_DISABLE_COUP_CONTEST:0 "Darbe Mücadelesi Olaylarını Devre Dışı Bırak"
 RULE_YES_DISABLE_COUP_CONTEST_DESC:0 "§Hdarbe mücadelesi§! olay zincirini §Rdevre dışı bırakır§!. Büyük yabancı nüfuz sahipleri, yatırım yaptıkları bir ülkede darbe olduğunda bildirim ya da karşılık seçeneği §Raldmaz§!. Yapay zekânın vekâlet çatışmalarını tırmandırmasını istemiyorsanız bunu kullanın."
 RULE_NO_DISABLE_COUP_CONTEST_DESC:0 "§Hdarbe mücadelesi§! olay zincirini §Getkinleştirir§!. Bir ülkede darbe başarılı olduğunda en büyük yabancı nüfuz sahiplerine (ve §H%20§!'yi aşarsa ikinci büyüğe) bildirim yapılır ve nasıl karşılık vereceklerine dair seçim sunulur: kınamak, yaptırım uygulamak, muhalefeti desteklemek veya askerî müdahale. Darbeyi izleyen iç savaşlar, eski rejimi desteklemek için de karşılık gelen bir olayı tetikler."
