 RULE_ALLOW_WORLD_WAR:0 "Raylara Oturtulmuş Dünya Savaşı"
 RULE_ALLOW_ENABLE_WORLD_WAR:0 "Raylara Oturtulmuş Dünya Savaşı'nı Etkinleştir"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC:0 "Bu seçenek Millennium Dawn'ın sandbox öğelerini kısıtlar ve dünyayı diğer modlarda olduğu gibi belirli bir yıla kadar bir Dünya Savaşı'na iter.\n\nTarihî modda oynamanız ve 'Yapay Zekâ Borç Savaşları' seçeneğini kapatmanız şiddetle tavsiye edilir"
