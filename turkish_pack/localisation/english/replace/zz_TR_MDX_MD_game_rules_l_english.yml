 RULE_14_DAY_INFLUENCE:0 "14 Gün Bekleme Süresi"
 RULE_14_DAY_INFLUENCE_DESC:0 "Varsayılan seçenek. Yatırımdan kazanılan nüfuz için bekleme süresi 14 gün yani 2 haftadır. Bu, ülke için olası tüm yatırım fırsatlarına uygulanır. Yine yatırım yapabilirsiniz ama bu süre boyunca nüfuz kazanmazsınız."
 RULE_0_DAY_INFLUENCE:0 "Bekleme Süresi Yok"
 RULE_0_DAY_INFLUENCE_DESC:0 "Yatırım zaman sınırından kazanılan nüfuzun eski usul MD sürümü. Nüfuz kazanmayı sürdürerek istediğiniz sıklıkta yatırım yapabilirsiniz; dengeden hoşlananlara önerilmez!"
 RULE_30_DAY_INFLUENCE:0 "30 Gün Bekleme Süresi"
 RULE_30_DAY_INFLUENCE_DESC:0 "Önerilen çok oyunculu seçenek. Yatırımdan kazanılan nüfuz için bekleme süresi 30 gün yani yaklaşık 1 aydır. Bu, ülke için olası tüm yatırım fırsatlarına uygulanır. Yine yatırım yapabilirsiniz ama bu süre boyunca nüfuz kazanmazsınız."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK:0 "Aylık §YYurt İçi Bağımsızlık§! Büyüme Tikini Etkinleştir"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC:0 "Aylık §YYurt İçi Bağımsızlık§! Büyüme Tikini devre dışı bırakır."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_YES_DESC:0 "Aylık §YYurt İçi Bağımsızlık§! Büyüme Tikini etkinleştirir. Her ay §YYurt İçi Bağımsızlık§!, «Aylık §YYurt İçi Bağımsızlık§! Büyüme Tiki» oyun kuralında belirlenen değer kadar artar; varsayılan değer ayda %0,10'dur."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT:0 "Aylık §YYurt İçi Bağımsızlık§! Büyüme Tiki Miktarı"
