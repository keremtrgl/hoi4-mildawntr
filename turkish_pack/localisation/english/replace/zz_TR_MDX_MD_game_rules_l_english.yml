 RULE_HARD_AI_ECONOMIC:0 "Ekonomik Yapay Zekâ"
 RULE_DISABLE_HARD_AI_ECONOMIC:0 "Standart kısıtlama"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC:0 "Yapay zekânın ekonomisini güçlendirmesine izin vermeyen standart kısıtlama. Tarihî bir oyun için."
 RULE_ENABLE_HARD_AI_ECONOMIC:0 "Kısıtlama yok"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC:0 "Yapay zekâ oynanan her oyunda ekonomik krizden çıkamıyorsa sıkıldıysanız, bu seçenek tam size göre. Yapay zekâ artık ekonomisiyle ilgili kararlarda sınırlanmaz. Birçok ülkenin sizinkinden daha zengin olmasına hazır olun. Yalnızca meydan okumadan korkmayanlar için. Savaş Yapay Zekâsı'ndan selamlar ;)"
 RULE_AI_STARTING_POLITICAL_POWER:0 "Yapay Zekâ Başlangıç Siyasi Gücü"
 RULE_AI_STARTING_POLITICAL_POWER_NO:0 "Başlangıç Siyasi Gücü Yok"
 RULE_AI_STARTING_POLITICAL_POWER_NO_DESC:0 "Yapay zekâ hiç siyasi güçle başlamaz."
 RULE_AI_STARTING_POLITICAL_POWER_250:0 "250 Siyasi Güç"
 RULE_AI_STARTING_POLITICAL_POWER_250_DESC:0 "Tüm yapay zekâ ülkelerine 250 Siyasi Güç ekler."
 RULE_AI_STARTING_POLITICAL_POWER_500:0 "500 Siyasi Güç"
 RULE_AI_STARTING_POLITICAL_POWER_500_DESC:0 "Tüm yapay zekâ ülkelerine 500 Siyasi Güç ekler."
 RULE_AI_STARTING_POLITICAL_POWER_1000:0 "1000 Siyasi Güç"
 RULE_AI_STARTING_POLITICAL_POWER_1000_DESC:0 "Tüm yapay zekâ ülkelerine 1000 Siyasi Güç ekler."
 RULE_DISABLE_AI_DEBT_WAR_TITLE:0 "Yapay Zekâ için Borç Savaşları"
 RULE_DISABLE_AI_DEBT_WAR:0 "Devre Dışı Bırak"
 RULE_DISABLE_AI_DEBT_WAR_DESC:0 "Yapay zekâ için borç savaşı özelliğini devre dışı bırakır. Yapay zekâ artık borcunu ödeyemeyen bir ülkeye saldırma seçeneğini kullanmaz."
 RULE_ENABLE_AI_DEBT_WAR:0 "Etkinleştir"
 RULE_ENABLE_AI_DEBT_WAR_DESC:0 "Bu ayar, borcunuzu ödemediğinizde yapay zekânın size borç savaşı ilan etme olasılığını artırır."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS:0 "Yapay Zekâ §TÖzerkliği Artırma Odağını§! Kullanır"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS:0 "Etkinleştir"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC:0 "Yapay zekâ, sürekli odak olan §YÖzerkliği Geliştir§! ile sizin özerkliğinizle mücadele eder."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS:0 "Devre Dışı Bırak"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC:0 "Yapay zekâ artık sürekli odak olan §YÖzerkliği Geliştir§! ile sizin özerkliğinizle mücadele etmez."
 RULE_ENABLE_AI_USING_ATTACHES:0 "Yapay Zekânın §YAtaşe§! Kullanmasını Etkinleştir"
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC:0 "Yapay zekânın Diplomatik Eylemler aracılığıyla §YAtaşeleri§! kullanmasına izin verir"
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC:0 "Yapay zekânın Diplomatik Eylemler aracılığıyla §YAtaşeleri§! kullanmasını engeller"
 RULE_ALLOW_MD_ANNEX:0 "Sınır Düzensizliği Temizliğini Etkinleştir"
 RULE_OPTION_MD_ANNEX_NO_DESC:0 "Barış sonrası sınırlar etkilenmez ve konferansta çizildikleri gibi kalır."
 RULE_OPTION_MD_ANNEX_YES_DESC:0 "Barış anlaşmasından sonra aynı etiketten birden fazla varlık kalırsa, kalan tüm etiketler en güçlü hâkim devletin bünyesine katılır. Hâkim devletin gücü, güç sıralaması ulusal ruhuna göre belirlenir. Savaş sonrası temizliğin gerçekleşmesi 14 günü bulabilir."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE:0 "Kaotik Barış Anlaşmalarını Etkinleştir"
 RULE_OPTION_CHAOTIC_PC_NO:0 "Hayır"
 RULE_OPTION_CHAOTIC_PC_NO_DESC:0 "Bu seçenek, yapay zekâ barış konferanslarında herkesin toprak kapmasını umarım durdurur.\nBunu, eyalet talep edebilecekleri büyük güçler ve ittifak liderleriyle sınırlayarak yapar. (Yalnızca yapay zekâyı etkiler, oyuncuyu etkilemez.)"
 RULE_OPTION_CHAOTIC_PC_YES:0 "Evet"
 RULE_OPTION_CHAOTIC_PC_YES_DESC:0 "Lanetli barış konferanslarından gerçekten keyif alanlar için: 12 tane §YRusya§! mümkünken dünyayı neden tek bir §YRusya§! ile sınırlayalım!\n(Bu seçeneğin doğurabileceği sonuçlardan sorumlu değilim!)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE:0 "Oyuncu Yönetimli Barış Konferanslarını Etkinleştir"
 RULE_OPTION_PLAYER_LED_PC_NO:0 "Hayır"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC:0 "Bu seçenek, yapay zekânın ne kadar aptalca olursa olsun kendi kararlarını vermesine izin verir."
 RULE_OPTION_PLAYER_LED_PC_YES:0 "Evet"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC:0 "Yapay zekânın işleri doğru yürüteceğine güvenmeyenler için; barış konferanslarında yalnızca oyuncuların talepte bulunmasına izin verir."
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL:0 "Koşullu Barış Anlaşmalarına İzin Ver"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC:0 "Savaştaki ülkelerin, iki tarafın da tamamen teslim olmasını gerektirmeyen barış anlaşmaları imzalamasını sağlayan §YKoşullu Barış Anlaşmaları§! betikli diplomatik eylemini kullanmasına izin verir."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC:0 "Ülkelerin §YKoşullu Barış Anlaşmaları§! betikli diplomatik eylemini kullanmasını engeller; barışa ulaşmak için tam savaşa katlanmak zorunda kalırlar."
 RULE_ALLOW_CPD_AI_OFFERS:0 "Yapay Zekâ Koşullu Barış Tekliflerine İzin Ver"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC:0 "Savaştaki yapay zekâ ülkelerinin süregelen çatışmaları düzenli olarak değerlendirmesine ve savaşı kazanılamaz veya çıkmazda bulduklarında §YKoşullu Barış Anlaşmaları§! önermesine izin verir. Hâkim devletler, kısıtlı bağımlı ülkeleri adına da müzakere eder."
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC:0 "Yapay zekâ ülkelerinin kendiliğinden §YKoşullu Barış Anlaşması§! başlatmasını engeller. Oyuncular yine de diplomatik eylem aracılığıyla elle teklif sunabilir."
 RULE_PEACE_PROPOSAL_BLOCKED_TT:0 "§YKoşullu Barış Anlaşmaları§! etkinken bu engellenir; bunun yerine §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§! kullanın!"
 RULE_SALAFIST_BRANCH:0 "Selefi Dalını Etkinleştir"
 RULE_YES_SALAFIST_BRANCH_DESC:0 "Başlangıç dinine bakılmaksızın tüm ülkeler için jenerik ağaçtaki Selefi dalını etkinleştirir."
 RULE_NO_SALAFIST_BRANCH_DESC:0 "İslam'ın herhangi bir koluna mensup ülkeler için jenerik ağaçtaki Selefi dalını etkinleştirir."
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY:0 "@AFG Taliban İsyanı"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT:0 "Tarihî"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC:0 "Taliban isyanı normal hızında büyür ve geriler."
 RULE_AFG_TALIBAN_INSURGENCY_WEAK:0 "Sınırlandırılmış"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC:0 "Taliban yarı hızda yeniden güçlenir. İsyanla mücadele çalışmaları kalıcı olur ve Afganistan isyanı gerçekçi biçimde bastırabilir."
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS:0 "Amansız"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC:0 "Taliban bir buçuk kat hızla yeniden güçlenir. Ülkeyi bir arada tutmak, bir kez çözülen bir sorun olmaktan çıkıp kalıcı bir sefere dönüşür."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING:0 "@AFG Kuzey İttifakı Ayaklanması"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC:0 "Taliban iç savaşı kazanırsa Kuzey İttifakı birkaç ay sonra İsmail Han önderliğinde, 2020'den itibaren de Ahmed Mesud önderliğinde yeniden ayaklanır."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC:0 "Taliban zaferi kesindir. Kuzeyde ikinci bir cephe açılmaz."
 RULE_OPTION_MD_RANDOM_PATH:0 "Rastgele Yol"
 RULE_OPTION_MD_RANDOM_PATH_DESC:0 "Yapay zekâ, oyun başlarken bu ülkenin yollarından birini, tarihî ya da alternatif, rastgele seçer. Hangisini seçtiği sizden gizli kalır."
 RULE_OPTION_MD_NO_PATH:0 "Yol Yok"
 RULE_OPTION_MD_NO_PATH_DESC:0 "Yapay zekâ hiçbir betikli yolu izlemez ve oyun ilerledikçe odaklarını serbestçe seçer. Davranışı her oyunda değişir."
 RULE_OPTION_RANDOM_DESC:0 "Bu ülkenin betikli yollarından biri oyun başlarken rastgele seçilir. Hangisinin seçildiği sizden gizli kalır."
 ABK_AI_BEHAVIOR:0 "@ABK Abhazya"
 RULE_OPTION_ABK_HISTORICAL:0 "Tarihî"
 RULE_OPTION_ABK_HISTORICAL_DESC:0 "Sergey Bagapş, hasta Ardzinba'nın yerini alır ve Abhazya kendini pasaportlar, vizesiz seyahat, yatırım ve silahlarla Rusya'ya bağlar. Gürcistan, Karadeniz'de Rus karakoluna dönüşen ayrılıkçı bir bölgeyle yüzleşir."
 RULE_OPTION_ABK_COMMUNIST:0 "Komünizme Dönüş"
 RULE_OPTION_ABK_COMMUNIST_DESC:0 "§8Abhazya Komünist Partisi§! Marksizmi yeniden kurar, kolektif çiftlikler ve halk milisleri etrafında tek partili bir devlet inşa eder ve yardım için Pekin ile Pyongyang'a yönelir. Moskova Karadeniz'deki müşterisinin doğuya kayışını izlerken Gürcistan sınırında kızıl bir bölgeyle karşılaşır."
 RULE_OPTION_ABK_MONARCHY:0 "Abhazya Krallığı"
 RULE_OPTION_ABK_MONARCHY_DESC:0 "Milliyetçiler ortaçağ Abhazya Krallığı'nı anar, parlamentoyu kaldırır ve bir diktatörlük altında diasporaya ve yabancı monarşilere kur yapar. Abhazya bir milis ordusu kurar ve Kafkasya'yı zorla yeniden şekillendirmek için Gürcistan üzerine yürür."
 AFG_AI_BEHAVIOR:0 "@AFG Afganistan"
 RULE_OPTION_AFG_HISTORICAL:0 "Tarihî"
 RULE_OPTION_AFG_HISTORICAL_DESC:0 "Kuzey İttifakı Amerikan müdahalesine kadar Taliban'a karşı ayakta kalır; ardından Hamid Karzai, sonra Eşref Gani ABD desteğiyle bir İslam Cumhuriyeti yönetir. Taliban isyanı hiçbir zaman tamamen sönmezken Afganistan NATO'ya ve Batılı bağışçılara yaslanır."
 RULE_OPTION_AFG_JAMIAT:0 "Cemiyet Cumhuriyeti"
 RULE_OPTION_AFG_JAMIAT_DESC:0 "Ahmed Şah Mesud ve Burhaneddin Rabbani'nin mirasçısı §8Cemiyet-i İslami§!, Taliban sonrası devleti elinde tutar ve kendi şartlarıyla ruhban egemen, tarafsız bir İslam cumhuriyeti kurar. Afganistan hem Washington'dan hem Moskova'dan uzak durur."
 RULE_OPTION_AFG_HAZARA:0 "Hazara Hizalanması"
 RULE_OPTION_AFG_HAZARA_DESC:0 "§8Hizb-i Vahdet§! iktidarı ele geçirir, Hazaraları savunur ve Afganistan'ı Tahran'ın yörüngesine sokar. Komşular, bölgesel ayrılığın karşı tarafında duran Şii eksenli bir Afganistan ile karşılaşır."
 RULE_OPTION_AFG_MONARCHY:0 "Kralın Dönüşü"
 RULE_OPTION_AFG_MONARCHY_DESC:0 "§8Monarşistler§! tacı Zahir Şah'ın soyuna geri verir ve eski Afganistan örnek alınarak anayasal bir monarşi kurar. Kraliyet devleti Peştunistan üzerindeki tarihî iddialarını canlandırır ve ilhakçı emelleriyle Pakistan'ı alarma geçirir."
 RULE_OPTION_AFG_EMIRATE:0 "İslam Emirliği"
 RULE_OPTION_AFG_EMIRATE_DESC:0 "Gulbeddin Hikmetyar'ın §8Hizb-i İslami§!'si iktidarı ele geçirir, seçimleri askıya alır ve Taliban damgası taşımayan bir İslam emirliği kurar. Batı yardımı kesilir ve Afganistan'ın komşuları sert çizgideki İslamcı bir rejimle yüzleşir."
 RULE_OPTION_AFG_JUNBISH:0 "Cünbiş Devleti"
 RULE_OPTION_AFG_JUNBISH_DESC:0 "Abdurreşid Dostum'un §8Cünbiş-i Milli§!'si iktidara gelir ve kuzeyde laik, otoriter bir devlet kurar. Afganistan Orta Asya'ya ve Rus nüfuz alanına yönelir, Batılı ortaklıkları terk eder."
 ALG_AI_BEHAVIOR:0 "@ALG Cezayir"
 RULE_OPTION_ALG_HISTORICAL:0 "Buteflika Yılları"
 RULE_OPTION_ALG_HISTORICAL_DESC:0 "Başkanlık, Kara On Yıl'ı bir af ile kapatır ve §8Ulusal Kurtuluş Cephesi§!'ni ve müttefiklerini arkasında toplar; ta ki §8Hirak§! yürüyüşleri yaşlı adamı çekilmeye zorlayana kadar. Cezayir, Arap ve Afrika diplomasisinin bir direği olarak kalırken iç işlerde son sözü generaller söyler."
 RULE_OPTION_ALG_LE_POUVOIR:0 "Le Pouvoir Sürüyor"
 RULE_OPTION_ALG_LE_POUVOIR_DESC:0 "Başkanlık generallerin vesayetinden asla kurtulamaz ve §8le pouvoir§!, §8Hirak§!'a reformla değil tutuklamalarla karşılık verir. Cezayir sivil bir cephe korurken her şeye arkasındaki güvenlik kurumu karar verir."
 RULE_OPTION_ALG_HIRAK_DEMOCRACY:0 "Hirak Kazanır"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC:0 "Haftalık yürüyüşler başkanlıkta durmaz; §8Hirak§! oligarkları yıkar ve le pouvoir'ı söker. Cezayir gerçekten sivil bir anayasa yazar ve Mağrip'in ilk gerçek demokrasisi olur."
 RULE_OPTION_ALG_MILITARY_JUNTA:0 "Generaller Yönetimi Alır"
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC:0 "§8Ulusal Halk Ordusu§! ikiyüzlülüğe son verir, anayasayı askıya alır ve Cezayir'i doğrudan yönetir. Ülke içe kapanır; komşuları sınırlarında bir garnizon devletiyle karşılaşır."
 RULE_OPTION_ALG_ISLAMIST:0 "İslamcı Cezayir"
 RULE_OPTION_ALG_ISLAMIST_DESC:0 "§8Barış İçin Toplum Hareketi§! ve §8Nahda§! dağda değil sandıkta kazanır; parlamento, mahkemeler ve camii aracılığıyla bir İslam cumhuriyeti kurar. Cezayir, Kuzey Afrika'daki siyasal İslam'ın sesi olur."
 RULE_OPTION_ALG_FIS_UPRISING:0 "Selamet Cephesi Geri Dönüyor"
 RULE_OPTION_ALG_FIS_UPRISING_DESC:0 "§8İslami Selamet Cephesi§! hiçbir zaman dizginlenemez ve ordunun elinden aldığı seçim zaferini geri talep eder. Kara On Yıl isyancıların şartlarıyla biter ve Cezayir, Sahel boyunca silahlı İslamcılığın üssü olur."
 ARM_AI_BEHAVIOR:0 "@ARM Ermenistan"
 RULE_OPTION_ARM_HISTORICAL:0 "Karabağ Kliği"
 RULE_OPTION_ARM_HISTORICAL_DESC:0 "Karabağ savaşı gazileri, sokaklar ülkeyi nihayet §8Sivil Sözleşme Partisi§!'ne teslim edene kadar yirmi yıl boyunca §8Ermenistan Cumhuriyetçi Partisi§!'nin ardında cumhurbaşkanlığını elinde tutar. Ermenistan güvenliği için Moskova'ya bağlı kalırken dağlar yüzünden Bakü ile tartışmayı sürdürür."
 RULE_OPTION_ARM_TER_PETROSIAN:0 "İlk Cumhurbaşkanı Dönüyor"
 RULE_OPTION_ARM_TER_PETROSIAN_DESC:0 "§8Ermeni Ulusal Kongresi§!, generallerin zorla görevden aldığı kurucu cumhurbaşkanını geri getirir ve Karabağ'ın adamları asla sıra bulamaz. Ermenistan dağları açık sınırlar ve komşularıyla normal ilişkiler karşılığında feda eder."
 RULE_OPTION_ARM_PEOPLES_PARTY:0 "Halk Partisi Dönüyor"
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC:0 "§8Ermenistan Halk Partisi§!, mecliste yaşanan silahlı saldırıdan sağ çıkar ve kendisinden esirgenen devleti ele geçirir. Ermenistan Sovyet dönemi sanayisi ve planlaması üzerine yeniden kurulur ve Moskova'nın Kafkasya'daki en güvenilir ortağı olur."
 RULE_OPTION_ARM_TSARUKYAN:0 "Oligarkın Cumhuriyeti"
 RULE_OPTION_ARM_TSARUKYAN_DESC:0 "§8Müreffeh Ermenistan§! parlamentoyu açıkça satın alır ve ülke cumhurbaşkanlığı sarayından değil bir işadamının malikânesinden yönetilir. Ermenistan zengin, yozlaşmış ve en çok ödeyen başkente satılık hâle gelir."
 RULE_OPTION_ARM_UNITED_STATES:0 "Ermenistan Birleşik Devletleri"
 RULE_OPTION_ARM_UNITED_STATES_DESC:0 "§8Miras Partisi§! ve diaspora, cumhuriyeti yurt dışındaki her Ermeni'ye bir yer ayrılmış bir federasyon olarak yeniden yazar. Ermenistan geleceği için Moskova yerine Los Angeles ve Beyrut'a bakar."
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT:0 "Kurucu Meclis"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC:0 "§8Sasna Tsrer§!'in Karabağ gazileri çalındığına inandıkları cumhuriyeti ele geçirir ve onu bir garnizon olarak yönetir. Ermenistan Rus üslerini kovar ve bunun yerine Batı'dan kendisine garanti vermesini ister."
 RULE_OPTION_ARM_MONARCHY:0 "Tacın Yeniden Tesisi"
 RULE_OPTION_ARM_MONARCHY_DESC:0 "§8Ermenistan Melik Birliği§! cumhuriyete son verir ve altı yüzyıl sonra ilk kez Erivan'da bir kralı tahta oturtur. Ermenistan taht ve kiliseyle yönetilir ve eski krallıklarının sahip olduğu her bölgeyi talep eder."
 RULE_OPTION_ARM_DASHNAK_LEFT:0 "Taşnak Sosyalizmi"
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC:0 "§8Ermeni Devrimci Federasyonu§!'nun sosyalist kanadı parti içindeki tartışmayı kazanır ve cumhuriyeti kuruluş inancı üzerine yeniden kurar. Ermenistan oligarkların varlıklarını millileştirir ve nerede bulursa emperyalizme karşı durur."
 RULE_OPTION_ARM_DASHNAK_RIGHT:0 "Fedailerin Mirası"
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC:0 "§8Ermeni Devrimci Federasyonu§!'nun milliyetçi kanadı partiyi ele geçirir ve dağ savaşçıları adına yönetir. Ermenistan kaybettiği topraklar için silahlanır ve onları geri istediğini gizlemez."
 AZE_AI_BEHAVIOR:0 "@AZE Azerbaycan"
 RULE_OPTION_AZE_HISTORICAL:0 "Tarihî"
 RULE_OPTION_AZE_HISTORICAL_DESC:0 "Haydar Aliyev başkanlığı oğlu İlham'a devrederken §8Yeni Azerbaycan Partisi§! iktidarını korur ve petrol parası orduyu yeniden kurmak için Türk boru hattı üzerinden batıya akar. Bakü sonunda Karabağ'ı Ermenistan'dan geri alır ve hiçbir bloka katılmadan Rusya, Türkiye, İran ve Batı arasında denge kurar."
 RULE_OPTION_AZE_DEMOCRATIC:0 "Halk Cephesi Dönüyor"
 RULE_OPTION_AZE_DEMOCRATIC_DESC:0 "§8Azerbaycan Halk Cephesi Partisi§!, Haydar Aliyev'in darbesinin elinden aldığı hükümeti geri kazanır ve ülkeyi gerçek seçimlere açar. Bakü, Avrupa'ya ve NATO'ya yönelir; Karabağ anlaşmazlığında uluslararası arabuluculukla müzakereli bir çözüm arar."
 RULE_OPTION_AZE_JUNTA:0 "Generallerin Yönetimi"
 RULE_OPTION_AZE_JUNTA_DESC:0 "§8Azerbaycan Silahlı Kuvvetleri§! siyasetçileri kenara iter ve Karabağ'ı zorla geri almak için seferber olurken genelkurmayla yönetir. Bakü; Ermenistan, Gürcistan ve İran'ı ilhakçı emelleriyle tehdit eden saldırgan bir askerî diktatörlüğe dönüşür."
 BHR_AI_BEHAVIOR:0 "@BHR Bahreyn"
 RULE_OPTION_BHR_HISTORICAL:0 "Al Halife Misakı"
 RULE_OPTION_BHR_HISTORICAL_DESC:0 "Taht bir ulusal misak ve seçilmiş bir meclisle barışı satın alır; ardından meydan dolunca §814 Şubat Gençlik Koalisyonu§!'nu Suudi zırhlılarıyla ezer. Bahreyn, Amerikan filosunun limanı ve Riyad'ın sahip olduğu en güvenilir müşteri olarak kalır."
 RULE_OPTION_BHR_DAY_OF_RAGE:0 "Öfke Günü"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC:0 "§8El-Vifak§!, Şii çoğunluk nihayet kendisine hep çok görülen hükümete oyuyla gelene dek meydanı elinde tutar. Bahreyn monarşiyi emekliye ayırıp cumhuriyete geçer ve Riyad yerine Tahran'a hesap verir."
 RULE_OPTION_BHR_CROWNED_DEMOCRACY:0 "Anayasal Pazarlık"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC:0 "Taht, §8Va'ad§!'ı ve rakiplerini yasallaştırır ve yönetme işini gerçek bir parlamentoya bırakır; tahtı tartışmanın içinde değil üstünde tutar. Bahreyn Batı kampından hiç ayrılmadan Körfez'in ilk işleyen demokrasisi olur."
 BLR_AI_BEHAVIOR:0 "@BLR Belarus"
 BLR_union_state_ai_behavior:0 "@BLR Birlik Devleti Davranışı"
 RULE_OPTION_BLR_HISTORICAL:0 "Avrupa'nın Son Diktatörü"
 RULE_OPTION_BLR_HISTORICAL_DESC:0 "Aleksandr Lukaşenko rakiplerini hapseder, ekonomiyi rubleye bağlar ve §8Kot Pantolon Devrimi§!'ni çevik kuvvetle kırar. Belarus, Moskova'nın en yakın müttefiki ve Avrupa'nın en yalıtılmış hükümeti olarak kalır."
 RULE_OPTION_BLR_EUROPEAN_BELARUS:0 "Avrupa Belarusu"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC:0 "Andrey Sannikov, §8Avrupa Belarusu§! kampanyası adına cumhurbaşkanlığını kazanır ve ülkeyi rubleden çevirip Brüksel'e yöneltir. Belarus NATO'ya ve Avrupa Birliği'ne başvurur; Rusya Smolensk'in batısında güvendiği toprakları kaybeder."
 RULE_OPTION_BLR_TIKHANOVSKAYA:0 "Tihanovskaya Devrimi"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC:0 "Lukaşenko bir kuşak boyunca rakipsiz yönetir; ta ki çalınan bir seçim, Svetlana Tihanovskaya'yı çevik kuvvetin kıramadığı bir §8Koordinasyon Konseyi§!'nin başına getirene kadar. Belarus, komşularından çok daha geç, Rus tümenleri sınırda beklerken batıya döner."
 RULE_OPTION_BLR_POPULAR_FRONT:0 "Ulusal Diriliş"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC:0 "Zenon Poznyak, §8Belarus Halk Cephesi§!'ni Belaruslaştırma, Sovyet subaylarını tasfiye ve Büyük Dükalık'ın hafızasını canlandırma programıyla iktidara taşır. Belarus Moskova'ya sırt çevirir ve bir zamanlar Vilnius'a bağlı olan her komşu üzerinde hak iddia eder."
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS:0 "Ulusal Bolşevik İsyanı"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC:0 "§8Ulusal Bolşevikler§! önce sokakları sonra devleti ele geçirir ve Sovyet düzenini bir emek ordusu ve parti milisi arkasında yeniden kurar. Belarus Moskova'nın onayıyla Polonya, Ukrayna ve Baltık ülkelerine karşı silahlanır."
 RULE_OPTION_BLR_LITBEL:0 "Litbel Dirilişi"
 RULE_OPTION_BLR_LITBEL_DESC:0 "§8Belarus Komünist Partisi§! iktidara döner ve eski Litvanya-Belarus cumhuriyetini kuruluş projesi yapar. Belarus, Litvanya ve Letonya'yı elinden geldiğince nüfuzla, gelmediğinde zorla sosyalist bir birliğe geri çeker."
 RULE_OPTION_BLR_OLIGARCHY:0 "Oligarkın Pazarlığı"
 RULE_OPTION_BLR_OLIGARCHY_DESC:0 "Sergey Hajdukeviç ve §8Liberal Demokrat Parti§!, Lukaşenko'nun ideolojisini daha açık sözlü bir ticaretle takas ederek Moskova'ya erişimi alabildikleri en iyi fiyata satar. Belarus Rusya'nın yörüngesinde kalır ama Birlik Devleti'ne bir inanç değil bir sözleşme gözüyle bakar."
 BLR_WONT_FOLLOW_UNION_STATE:0 "Birlik Devleti'ni Takip Etme"
 BLR_WONT_FOLLOW_UNION_STATE_DESC:0 "Belarus Birlik Devleti'ni kâğıt üzerinde korur ve ülkenin denetimini asla Moskova'ya devretmez. Minsk bir Rus kuklası olmak yerine egemen bir ortak olarak kalır."
 BLR_WILL_FOLLOW_UNION_STATE:0 "Birlik Devleti'ni Kur"
 BLR_WILL_FOLLOW_UNION_STATE_DESC:0 "Belarus Birlik Devleti'nin peşine düşer ve oraya varmak için Rus hâkimiyetini kabul eder. Minsk önce bir Rus kuklası olur ve yol Moskova altında birleşmiş bir devletle sona erer."
 BOL_AI_BEHAVIOR:0 "@BOL Bolivya"
 RULE_OPTION_BOL_HISTORICAL:0 "Tarihî"
 RULE_OPTION_BOL_HISTORICAL_DESC:0 "§8Milliyetçi Demokratik Eylem§!, ABD baskısı altında koka üretimiyle savaşırken protestolar ülkeyi sarsar; ta ki §8Sosyalizme Doğru Hareket§! iktidara gelip gazı millileştirene ve devleti yerli çoğunluğu etrafında yeniden yazana kadar. Bolivya bağlantısız kalır, Mercosur'a katılır, Karakas, Pekin ve Moskova'ya kur yapar ve denize çıkış talebini savaşa değil mahkemeye taşır."
 RULE_OPTION_BOL_MEDIA_LUNA:0 "Yükselen Media Luna"
 RULE_OPTION_BOL_MEDIA_LUNA_DESC:0 "Doğudaki Santa Cruz ovalarına dayanan sağ, özelleştirmek, kokayı yok etmek ve Bolivya'yı Washington ile NATO'ya bağlamak için §8Milliyetçi Demokratik Eylem§!'i iktidarda tutar. Bolivya And Dağları'nda bir ABD ortağı olur ve Şili ile gaz ihracatı anlaşmazlıklarını çözer."
 RULE_OPTION_BOL_REFORMIST:0 "Reformist Cumhuriyet"
 RULE_OPTION_BOL_REFORMIST_DESC:0 "§8Devrimci Milliyetçi Hareket§!, yolsuzlukla savaşan, yerli topraklarını koruyan ve piyasayı açan reformist bir koalisyon kurar. Bolivya eski savaşlarla uğraşmak yerine Şili ve Amerika Birleşik Devletleri ile ticaret yaparak Batı'ya yakın ve pragmatik bir çizgiye yönelir."
 RULE_OPTION_BOL_MILITARY_JUNTA:0 "Generallerin Yönetimi"
 RULE_OPTION_BOL_MILITARY_JUNTA_DESC:0 "Silahlı kuvvetler iktidarı ele geçirir, kartelleri ve sokakları ezer ve Banzer diktatörlüğünün hatırasını canlandırır. Bolivya, Chaco ve Pasifik savaşlarının öcünü almak için yeniden silahlanır; Paraguay, Şili ve Brezilya intikamcı bir komşuyla yüzleşir."
 RULE_OPTION_BOL_WIPHALA:0 "Wiphala'nın Işığı"
 RULE_OPTION_BOL_WIPHALA_DESC:0 "§8Pachakuti Yerli Hareketi§!, Wiphala bayrağı altında yabancı işletmelere ve büyük çiftliklere el koyan bir yerlicilik devrimine öncülük eder. Bolivya Şanghay İşbirliği Örgütü'nün yörüngesine girer ve sömürge karşıtı mücadelesini Peru'ya, Şili'ye ve Amazon'a taşır."
 BOS_AI_BEHAVIOR:0 "@BOS Bosna-Hersek"
 RULE_OPTION_BOS_HISTORICAL:0 "Dayton Düzeni"
 RULE_OPTION_BOS_HISTORICAL_DESC:0 "Dönüşümlü başkanlık uluslararası gözetim altında ayakta kalır ve §8Demokratik Eylem Partisi§! Sırp ve Hırvat rakiplerini yenmek yerine devleti onlarla paylaşır. Bosna NATO ve Avrupalı barış güçlerinin gölgesinde yeniden inşa edilir ve ülkenin ne olduğunu hiçbir zaman çözmeden Brüksel'e doğru ilerler."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP:0 "Srpska Koltuğa Oturuyor"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC:0 "§8Bağımsız Sosyal Demokratlar İttifakı§! cumhurbaşkanlığını kazanır ve federasyona dokunmadan Saraybosna'yı Belgrad ve Moskova'ya yöneltir. Bosna Batı yörüngesinden güçle değil anlaşmayla ayrılır ve Rusya Balkanlar'da ikinci bir dayanak noktası kazanır."
 RULE_OPTION_BOS_SRPSKA_UNION:0 "Önce Srpska"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC:0 "§8Sırp Demokratik Partisi§! tüm ülkeyi Banja Luka altında merkezileştirir ve Sırbistan ile birleşme müzakeresi yürütür. Bosna büyük bir Sırp devletine katılır ve komşuları yeniden çizilmiş bir haritaya uyanır."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL:0 "Boşnak Uyanışı"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC:0 "Boşnak mağduriyeti dinî bir canlanmaya dönüşür ve §8Ulusal Uyanış§! savaşı kendi şartlarında bitirmek için cumhuriyeti yeniden silahlandırır. Bosna barış güçlerini evlerine yollar ve önce kendi entitelerine, sonra komşularına karşı döner."
 RULE_OPTION_BOS_WORKERS_STATE:0 "İşçi Konseyleri"
 RULE_OPTION_BOS_WORKERS_STATE_DESC:0 "Kitlesel işsizlik §8İşçi Cephesi§!'ni etnik partilerin önüne taşır ve Bosna'nın sanayisi onda çalışanların konseylerine geçer. Devlet laik ve özyönetimli hâle gelir; ne Brüksel'e ne Belgrad'a hesap verir."
 BOT_AI_BEHAVIOR:0 "@BOT Botsvana"
 RULE_OPTION_BOT_HISTORICAL:0 "BDP Sürüyor"
 RULE_OPTION_BOT_HISTORICAL_DESC:0 "§8Botsvana Demokratik Partisi§! cumhurbaşkanlığını kendi içinden birinden diğerine devreder ve girdiği her seçimi kazanırken elmas gelirleri okulların, kliniklerin ve AIDS'le mücadelenin masrafını karşılar. Botsvana kıtanın sessiz başarısı olarak kalır; bağlantısızdır, borçlanmaz ve komşularının dile getirmediği şeyleri yüksek sesle söylemeye isteklidir."
 RULE_OPTION_BOT_POLITICAL_RAINBOW:0 "Şemsiye Açılıyor"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC:0 "Muhalefet oyları bölmeyi bırakır ve §8Demokratik Değişim Şemsiyesi§!'nin arkasında toplanarak §8Botsvana Demokratik Partisi§!'nin bağımsızlıktan beri elinde tuttuğu hâkimiyeti kırar. Botsvana ilk iktidar değişikliğini yaşar ve güney Afrika, bir kurtuluş partisinin oyla iktidardan indirilebileceğine dair kanıt kazanır."
 RULE_OPTION_BOT_KGOSIKGOLO:0 "Kgosikgolo'nun Taç Giymesi"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC:0 "§8Dikgosi§! Şefler Meclisi'ni danışma organından iktidar merkezine dönüştürür ve içlerinden birini tüm ülkenin yüce şefi olarak yükseltir. Seçimler yerini geleneksel bir monarşiye bırakır ve kıtanın örnek demokrasisi, komşularının artık tanımadığı bir şeye dönüşür."
 RULE_OPTION_BRA_HISTORICAL:0 "Lula Yılları"
 RULE_OPTION_BRA_HISTORICAL_DESC:0 "§8İşçi Partisi§! sonunda cumhurbaşkanlığını kazanır ve yoksullara nakit transferlerini ortodoks maliye politikasıyla birleştirir; ta ki bir yolsuzluk soruşturması solu içten çürütüp sarayı eski bir ordu yüzbaşısına teslim edene kadar. Brezilya, Washington ile tartışsa da yörüngesinden hiç çıkmayan, kendisine kur yapılan bir orta güce dönüşür."
 RULE_OPTION_BRA_BROAD_FRONT:0 "Yeni Brezilya"
 RULE_OPTION_BRA_BROAD_FRONT_DESC:0 "§8İşçi Partisi§!, §8Brezilya Demokratik Hareketi§! ve daha küçük sol partilerle geniş bir koalisyonla yönetir ve yolsuzluk skandallarına geri çekilmeyle değil reformla karşılık verir. Brezilya anayasal bir demokrasi olarak kalır ve artık izin için kuzeye bakmayan bir Güney Amerika'nın çapası olur."
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC:0 "Kızıl Cumhuriyet"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC:0 "§8İşçi Partisi§! iktidarı paylaşmayı bırakır, soldaki rakiplerini bünyesine katar ve devleti kendi etrafında yeniden yazar. Brezilya sosyalist cumhuriyetini ilan eder ve modeli kabul etmeye istekli her komşuya ihraç eder."
 RULE_OPTION_BRA_LIBERALS:0 "Liberal Düzen"
 RULE_OPTION_BRA_LIBERALS_DESC:0 "§8Brezilya Sosyal Demokrasi Partisi§! zaten elinde tuttuğu cumhurbaşkanlığını korur ve özelleştirmeleri ile enflasyon hedeflemesini sonuna kadar götürür. Brezilya kıtanın en açık ekonomisi ve ekvatorun güneyindeki en istikrarlı Amerikan ortağı olur."
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS:0 "Sosyal Demokratlar"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC:0 "§8Brezilya Sosyal Demokrasi Partisi§!, §8Demokratik Emek Partisi§! ile birlikte yönetir ve piyasa ortodoksisinden sosyal güvenlik tabanı olan bir kalkınmacı devlete yönelir. Brezilya faize değil sanayiye ve okullara harcama yapar; Washington'dan da Pekin'den de aynı uzaklıkta durur."
 RULE_OPTION_BRA_MILITARY_RULE:0 "Yüzbaşının Cumhuriyeti"
 RULE_OPTION_BRA_MILITARY_RULE_DESC:0 "§8Sosyal Liberal Parti§! cumhurbaşkanlığını alır, eski diktatörlüğü yüceltir ve önündeki kongreyi fesheder. Brezilya bir kez daha kışladan kararnameyle yönetilir ve sınırlarındaki sosyalist hükümetlere karşı taleplerini dayatır."
 RULE_OPTION_BRA_MONARCHY:0 "İmparatorluğun Yeniden Tesisi"
 RULE_OPTION_BRA_MONARCHY_DESC:0 "§8Monarşist§! canlanma, milliyetçi bir cumhurbaşkanlığını taç giyme törenine dönüştürür ve Orléans-Braganza Hanedanı yüzyılı aşkın süredir boş duran tahta döner. Brezilya seçimleri kaldırır, eski Cisplatina eyaletini yeniden talep eder ve yine bir tacın hükmü altına girer."
 RULE_OPTION_BUL_HISTORICAL:0 "Brüksel'e Giden Yol"
 RULE_OPTION_BUL_HISTORICAL_DESC:0 "§8Demokratik Güçler Birliği§! para kurulunu ve reform programını bir arada tutar ve ardından gelen her hükümet aynı iki başvuruyu masada tutar. Bulgaristan NATO'ya, sonra Avrupa Birliği'ne katılır ve ittifaka Balkanlar'ın en sakin sınırını verir."
 RULE_OPTION_BUL_TSARIST_RESTORATION:0 "Çar Dönüyor"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC:0 "Sürgündeki §8Saksen-Coburg-Gotha Hanedanı§! başbakanlıktan fazlasına sahip olarak eve döner, milliyetçi sağı tacın etrafında toplar ve kendi adına yönetir. Bulgaristan Batılı başvuruları San Stefano'da vaat edilen sınırlarla takas eder ve komşuları Makedonya meselesinin yeniden açıldığını görür."
 RULE_OPTION_BUL_RED_BALKAN:0 "Kızıl Balkan Rüyası"
 RULE_OPTION_BUL_RED_BALKAN_DESC:0 "§8Bulgaristan Komünist Partisi§!, geçişin enkazından yükselir ve §8Bulgaristan Sosyalist Partisi§!'nin geri almak istemediği devleti ele geçirir. Bulgaristan dostlarını Moskova ve Pekin'de arar ve Balkanlar'dan bir sosyalist federasyon kurmaya girişir."
 RULE_OPTION_CAN_HISTORICAL:0 "Tarihî"
 RULE_OPTION_CAN_HISTORICAL_DESC:0 "§8Liberal Parti§! merkezden yönetir, federasyonun işleyişinde iki kurucu dili de korur ve Quebec'e ödünle değil bir netlik yasasıyla karşılık verir. Kanada NATO'da ve Kuzey Amerika ticaret bölgesinde kalır ve Washington'un en istikrarlı komşusu olmaya devam eder."
 RULE_OPTION_CAN_FRENCH_CANADA:0 "Fransız Kanada"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC:0 "§8Quebec Bloğu§! dil mağduriyetini bir federal programa dönüştürür, Fransızcayı devletin tek dili yapar ve hükümet merkezini Quebec'e taşır. Anglofon Kanada kendi başkentinde azınlık olduğunu görür ve birlik rızayla değil yasayla ayakta kalır."
 RULE_OPTION_CAN_ARMED_NEUTRALITY:0 "Gerçek Kuzey Yalnız"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC:0 "Kanada NATO'dan çıkar, dış bağlantılarına son verir ve tasarrufu iç ekonomiye ve kendi kendine yeten bir savunma sanayisine harcar. İttifakın kuzey kanadı sessizleşir ve Washington kendi kıtasındaki ikinci orduyu kaybeder."
 RULE_OPTION_CAN_NATIONALIST:0 "Milliyetçi Darbe"
 RULE_OPTION_CAN_NATIONALIST_DESC:0 "§8Önce Kanada§!, anayasal düzenin enkazı üzerinde iktidara yükselir, seçimleri askıya alır ve Quebec ile yerli rezervlerine olağanüstü yetkilerle karşılık verir. Kanada kendi kıtasına karşı döner ve dünyanın en uzun savunmasız sınırı kuzey tarafından tahkim edilir."
 RULE_OPTION_CAN_EASTERN_REALIGNMENT:0 "Arktik Köprüsü"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC:0 "Ottawa NATO'dan ayrılır ve Arktik yollarını, limanlarını ve kaynaklarını Washington yerine Moskova ve Pekin'e satar. Kanada bir Rus-Çin nüfuz alanının kuzey ucu olur ve Amerika Birleşik Devletleri kendi kıtasında bir rakiple uyanır."
 CAS_AI_BEHAVIOR:0 "@CAS Cascadia"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH:0 "Kayalık Dağlar Direnişi"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC:0 "Olympia, Idaho'nun dar kuzey şeridindeki huzursuzluğu yerel şerifler eline bırakır ve §8Kayalık Dağlar Direnişi§! onları aşar; ta ki dağ ilçeleri bağımsızlık için ayaklanana kadar. Cascadia kendi arka bölgesinde bir ayrılıkçılıkla savaşmak zorunda kalır §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH:0 "Zamanımızda Barış"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC:0 "Olympia direnişle mücadeleyi devralması için doğuya özel bir soruşturma birimi gönderir ve düzen geri döner; ta ki §8Kayalık Dağlar Direnişi§! liderliği hareketi kendisi dağıtana kadar. Cascadia krizden bütün ve sessiz çıkar §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 CHE_AI_BEHAVIOR:0 "@CHE Çeçenistan"
 RULE_OPTION_CHE_HISTORICAL:0 "Tarihî"
 RULE_OPTION_CHE_HISTORICAL_DESC:0 "İkinci savaş, §8İçkerya§!'nın yıkılması ve cumhuriyetin Kadirovlar yönetiminde Rusya'ya yeniden katılmasıyla biter. Çeçenistan bağımsızlığı yeniden inşa parasıyla takas eder ve Moskova'nın Kafkasya'daki en güvenilir cebir aracı olur."
 RULE_OPTION_CHE_CALIPHATE:0 "Kafkasya Emirliği"
 RULE_OPTION_CHE_CALIPHATE_DESC:0 "Yabancı §8mücahitler§! laik ayrılıkçıları kenara iter ve cumhuriyetten geriye kalanı şeriatla yönetir. Çeçenistan §8El Kaide§! için bir sığınak ve Kafkasya genelinde ve Rusya'nın kendisine karşı cihadın fırlatma noktası olur."
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION:0 "Kafkasya Konfederasyonu"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC:0 "Laik subaylar §8İslamcıları§! kırar ve İçkerya'yı Kuzey Kafkasya halklarından oluşan bir birliğin çekirdeği olarak yeniden kurar. Çeçenistan Moskova'yı dağlardan uzak tutmak için gereken ağırlığı Ankara ve Bakü'den alır."
 RULE_OPTION_CHE_WESTERN_ALIGNMENT:0 "Batı'dan Tanınma"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC:0 "§8İslamcılar§! dışarı itilir ve cumhuriyet bağımsızlığını dağlardaki müttefikler yerine Batı başkentlerinde tanınma peşinde koşarak geçirir. Çeçenistan hayatta kalmayı demokratik referanslarla ve Avrupa'nın masasında bir yerle satın alır."
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS:0 "Kızıl Kafkasya"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC:0 "§8Selman Raduyev§!'in grubu cumhuriyeti ele geçirir ve İslam'ı dağların hâlâ hatırladığı Sovyet düzeniyle kaynaştırır. Çeçenistan bir Kafkas sosyalist cumhuriyeti ilan eder ve Moskova ile bağımlı olarak değil eşit olarak anlaşır."
 RULE_OPTION_CHI_HISTORICAL:0 "Büyük Gençleşme"
 RULE_OPTION_CHI_HISTORICAL_DESC:0 "§8Şanghay kliği§! Partiyi §8Tuanpai§!'ye, Tuanpai'yi de Xi Jinping'e devreder ve sıra gelince Hong Kong'un özerkliği söküp alınır. Pekin, Güney Çin Denizi'ndeki ve Boğaz'ın karşısındaki taleplerini onlar için savaşa girmeden dayatır."
 RULE_OPTION_CHI_HEGEMON:0 "Orta Krallığın Yeniden Tesisi"
 RULE_OPTION_CHI_HEGEMON_DESC:0 "§8Chongqing modeli§! Bo Xilai'yi liderliğe taşır ve §8Kurt Savaşçılar§! erkenden zincirinden boşalır. Çin Himalaya sınırını güçle çözer, Bhutan, Nepal ve Hindistan'ı hizaya sokar, Dış Moğolistan'ı geri alır ve Tayvan'ı baskınla ele geçirir."
 RULE_OPTION_CHI_PEACEFUL_RISE:0 "Barışçıl Yükseliş"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC:0 "Zeng Qinghong, Jiang'ın makinesini devralır ve §8Şanghay teknokratları§! Deng'in çizgisini sürdürür. Bir Ülke, İki Sistem'e saygı gösterilir, Tibet ve Sincan kampanyalarla değil mevzuatla yönetilir ve yeniden birleşme müzakere masasında aranır."
 COM_AI_BEHAVIOR:0 "@COM Komorlar"
 RULE_OPTION_COM_HISTORICAL:0 "Komor Birliği"
 RULE_OPTION_COM_HISTORICAL_DESC:0 "Azali Assoumani üniformayı sandıkla takas eder, adaların her biri bir cumhurbaşkanı elde eder ve birlik başkanlığı aralarında dönüşümlü olur; Afrika Birliği askerleri Anjouan'ı albayından geri alır. §8Komorların Yenilenmesi Sözleşmesi§! iktidarı kazanır ve sonra barışçıl biçimde kaybeder; takımadalar sonunda kendi kendini devirmeyi bırakır."
 RULE_OPTION_COM_MILITARY_DICTATORSHIP:0 "Albay Kalıyor"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC:0 "Azali üniformayla aldığı cumhurbaşkanlığını elinde tutar, adaları yeniden Moroni'nin hâkimiyetine çeker ve dönüşümün başkasına varmadan ölmesine izin verir. Komorlar Fransız yörüngesinden uzaklaşır ve Paris'in artık sunmadığı tanınmayı Pekin ve Afrika Birliği'nde arar."
 RULE_OPTION_COM_ORANGE_PARTY:0 "Turuncu Üstünlük"
 RULE_OPTION_COM_ORANGE_PARTY_DESC:0 "Mohamed Daoudou'nun §8Turuncu Partisi§! Moroni'yi alır ve takımadaları liyakate dayalı bir teknokrasi olarak yönetir; kaçakçılık şebekelerini kırar ve bakanlıkları profesyonelleştirir. Komorlar kendini Batılı sermayeye evrakına güvenilebilen tek Hint Okyanusu mikro devleti olarak satar."
 RULE_OPTION_COM_ISLAMIC_REPUBLIC:0 "Arap Cumhuriyeti"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC:0 "Cami komiteleri Ahmed Abdallah Mohamed Sambi'yi cumhurbaşkanlığına taşır ve §8Baasçı hareket§! adaları bir Arap cumhuriyeti olarak yeniden biçimlendirir. Limanlar millileştirilir, Paris'in yerini Şam ve Bağdat alır ve Komorlar Mozambik Kanalı'nda bir Arap Birliği sesi olur."
 RULE_OPTION_COM_WARRIOR_KING:0 "Savaşçı Kral"
 RULE_OPTION_COM_WARRIOR_KING_DESC:0 "Robert Denard adalara son bir kez döner ve §8Cumhurbaşkanlığı Muhafızları§! sarayı ona tek kurşun atmadan teslim eder. Komorlar ordusu olan bir ülke olmaktan çıkar, bayrağı kiralık bir ordu olur ve paralı askerlerini Afrika'ya satar."
 CUB_AI_BEHAVIOR:0 "@CUB Küba"
 RULE_OPTION_CUB_HISTORICAL:0 "Tarihî"
 RULE_OPTION_CUB_HISTORICAL_DESC:0 "Fidel cumhurbaşkanlığını kardeşine devreder ve §8Küba Komünist Partisi§! adayı tek partide tutar, küçük ticarete ruhsat verirken petrol için Karakas ve Moskova'ya kur yapar. Ambargo sürer, Özel Dönem hiçbir zaman tam bitmez ve Havana Washington'un yarım küresinde tuhaf bir istisna olarak kalır."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM:0 "Fidel Adayı Açıyor"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC:0 "Castro komuta ekonomisini kendi eliyle söker, bankalara ruhsat verir, kiliseyi geri getirir ve §8Komünist Parti'nin Batı yanlısı kanadı§! altında rakip partilere izin veren bir anayasa yazar. Havana Guantanamo meselesini Washington ile çözer, Taipei'yi tanır ve NATO ile birlikte sondaj yapmaya varır."
 RULE_OPTION_CUB_DIAZ_CANEL:0 "Diaz-Canel Yumuşaması"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC:0 "Miguel Diaz-Canel sarayı Raul'dan önce alır, §8Küba Liberal Birliği§!'nin yasağını kaldırır ve devrimden beri ilk rekabetçi seçimleri çağırır. Sansür kaldırılır, yabancı sermaye geri döner ve Küba tek kurşun atılmadan sıradan bir Karayip cumhuriyeti olur."
 RULE_OPTION_CUB_NEW_SOCIALISM:0 "İkinci Devrim"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC:0 "Diaz-Canel açılımı yarı yolda terk eder, tek partili devleti daha genç bir kadro etrafında yeniden kurar ve Pyongyang ile açıkça ticaret yapar. Küba CSTO'ya katılır ve üslerini Rusya'ya geri verir; Florida'nın doksan mil ötesine bir Rus garnizonu yerleşir."
 RULE_OPTION_CUB_NATIONALIST:0 "Kübalılar için Küba"
 RULE_OPTION_CUB_NATIONALIST_DESC:0 "§8Küba Falanjı§! devleti ele geçirir, komünistleri ve demokratları aynı şekilde tasfiye eder ve orduyu bir gençlik emek birliği etrafında yeniden kurar. Havana ardından tüm havzayı doğum hakkı olarak talep eder; Haiti, Jamaika ve kıstak tek tek ilhak edilir."
 RULE_OPTION_CUB_RESTORED_REPUBLIC:0 "Cumhuriyetin Yeniden Tesisi"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC:0 "§8Küba Sosyal-Devrimci Demokratik Partisi§! iktidara gelir, siyasi tutukluları serbest bırakır ve anayasayı çok partili bir parlamento etrafında yeniden yazar. Küba ardından komşularını fethetmek yerine bir Karayip federasyonuna davet eder."
 RULE_OPTION_CZE_HISTORICAL:0 "Tarihî"
 RULE_OPTION_CZE_HISTORICAL_DESC:0 "§8Çek Sosyal Demokratlar§! ve §8Sivil Demokrat Parti§! hükümeti aralarında paylaşırken ülke NATO'ya ve Avrupa Birliği'ne yerleşir ve Škoda, Mladá Boleslav'ı bir ihracat motoruna çevirir. Prag askerlerini Balkanlar'a ve Afganistan'a yollar ve Batı bloğunun rahat, sıradan bir üyesi olur."
 RULE_OPTION_CZE_COMMUNISM:0 "Komünistler Dönüyor"
 RULE_OPTION_CZE_COMMUNISM_DESC:0 "§8Bohemya ve Moravya Komünist Partisi§!, özelleştirmeye duyulan öfkeyi yönetici bir çoğunluğa çevirir ve bakanlıkları fabrikaları satanların üzerine yöneltir. Çek Cumhuriyeti NATO'dan çıkar, Moskova ve Pekin'e kur yapar ve komşularının çözülmüş sandığı sınır sorunlarını yeniden açar."
 RULE_OPTION_CZE_MONARCHY_KING:0 "Habsburg Tacı"
 RULE_OPTION_CZE_MONARCHY_KING_DESC:0 "§8Koruna Česká§! bir merak konusundan en büyük partiye dönüşür, taç mücevherlerini depodan çıkarır ve Karl von Habsburg'u taç giymesi için eve çağırır. Çek toprakları yeniden krallık olur ve Viyana ile Budapeşte'yi Orta Avrupa boyunca bir monarşist blokta toplamaya girişir."
 RULE_OPTION_CZE_MONARCHY_PRESIDENT:0 "Taçlı Cumhuriyet"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC:0 "§8Koruna Česká§! ülkeyi eski düzene kazanır ama sandığı korur; kanla değil seçimle belirlenen monarşist bir devlet başkanı atar. Çek Cumhuriyeti parlamentosunu ve Avrupalı ortaklarını korurken kendini taht, kilise ve bölge etrafında yeniden kurar."
 RULE_OPTION_DEN_HISTORICAL:0 "Fogh Yılları"
 RULE_OPTION_DEN_HISTORICAL_DESC:0 "§8Venstre§! ve §8Sosyal Demokratlar§! Christiansborg'u aralarında paylaşırken Danimarka muafiyetlerini korur, avroyu reddeder ve Balkanlar'a, Irak'a ve Afganistan'a asker gönderir. Kopenhag Washington'un Avrupa'daki en istekli küçük müttefiki olur ve Birliğin kendisi olmadan derinleşmesine izin verir."
 RULE_OPTION_DEN_EUROPEAN_UNION:0 "Avrupa'nın Kalbinde"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC:0 "§8Sosyal Liberaller§! ve §8Sosyal Demokratlar§! ikinci bir referandumu kazanır ve Birliğin merkezinde yer satın almak için Danimarka muafiyetlerini harcar. Kron yerini avroya bırakır ve Kopenhag kendini Washington'a değil Berlin ve Paris'e demirler."
 RULE_OPTION_DEN_EUROSCEPTIC:0 "Birlikten Çıkış"
 RULE_OPTION_DEN_EUROSCEPTIC_DESC:0 "§8Danimarka Halk Partisi§!, eski partilerin ertelediği soruyu zorlar ve Danimarka önce Schengen'den, sonra Birliğin kendisinden çıkar. Brüksel'in yerini Kuzey ülkeleri savunma iş birliği alır ve İskandinavya'nın geri kalanından taraf seçmesi istenir."
 RULE_OPTION_DEN_SOCIALIST:0 "Christiansborg Üzerinde Kızıl Bayrak"
 RULE_OPTION_DEN_SOCIALIST_DESC:0 "§8Kızıl-Yeşil İttifak§! ve sendikalar refah devletini bir işçi devletine dönüştürür ve konseyleri Folketing'in üzerine koyar. Danimarka ittifaktan ve Birlikten çıkar, dostlarını doğuda arar ve Kuzey'in geri kalanına bir devrim önerir."
 RULE_OPTION_DEN_MONARCHIST:0 "Tacın Yeniden Tesisi"
 RULE_OPTION_DEN_MONARCHIST_DESC:0 "Saray artık sembolik olma numarası yapmaz ve §8Danimarka Halk Partisi§!, tacın davasını ülkenin sabrını yitirmiş bir parlamentodan geçirir. Hükümdar anayasanın elinden aldığı yetkileri geri alır; Grönland ve Faroe Adaları kesin biçimde Kopenhag'ın eline çekilir."
 RULE_OPTION_DEN_NATIONALIST:0 "Danimarkalılar için Danimarka"
 RULE_OPTION_DEN_NATIONALIST_DESC:0 "§8Danimarka Halk Partisi§!, şimdiye dek yalnızca desteklediği hükümeti alır ve göç ile sınır denetimini Danimarka siyasetinin tamamı hâline getirir. Danimarka ittifaktan ve Kuzey Konseyi'nden çıkar ve Ortaçağ'dan beri dile getirmediği taleplere girişir."
 EGY_AI_BEHAVIOR:0 "@EGY Mısır"
 RULE_OPTION_EGY_HISTORICAL:0 "Tarihî"
 RULE_OPTION_EGY_HISTORICAL_DESC:0 "Mısır, meydan onu boşaltana kadar §8Ulusal Demokratik Parti§!'yi iktidarda tutar, tek bir dönemi §8Müslüman Kardeşler§!'e verir ve sonra cumhurbaşkanlığını generallerine geri verir. İsrail ile barış sürer, Amerikan yardımı akmaya devam eder ve Kahire Arap düzenine karşı değil onun adına konuşur."
 RULE_OPTION_EGY_BROTHERHOOD:0 "Kardeşler Tutunuyor"
 RULE_OPTION_EGY_BROTHERHOOD_DESC:0 "Mısır seçilmiş §8Müslüman Kardeşler§! hükümetini korur, subayları tasfiye etmek yerine satın alır ve mahkemelerin bozamayacağı İslamcı bir anayasa yazar. Kahire Ankara, Doha ve Hamas'a yönelir ve Körfez monarşileri onu bir tehdit olarak görür."
 RULE_OPTION_EGY_PAN_ARAB:0 "Nasır'ın Mirasçıları"
 RULE_OPTION_EGY_PAN_ARAB_DESC:0 "Mısır §8Ulusal Cephe§!'yi iktidara geri getirir, ekonominin kilit alanlarını millileştirir ve Birleşik Arap Cumhuriyeti'ni yeniden canlandırır. Kahire Şam, Bağdat ve Trablus'a kur yapar ve Washington'a sırtını döner."
 RULE_OPTION_EGY_SALAFIST:0 "Selefi Dönüşü"
 RULE_OPTION_EGY_SALAFIST_DESC:0 "Mısır §8Nur Partisi§!'ni cumhurbaşkanlığı sarayına yerleştirir, seçimleri askıya alır ve dinî hukukla yönetir. Şeriat Kıptileri korunan bir azınlık olarak yönetir ve Sina harekâtı kutsal bir savaşa dönüşür."
 RULE_OPTION_EGY_COPTIC:0 "Kıpti Üstünlüğü"
 RULE_OPTION_EGY_COPTIC_DESC:0 "Mısır, Arap mirası yerine Firavun mirasını talep eden §8Kıpti Kilisesi§! ve laik müttefikleri tarafından ele geçirilir. Kahire Hristiyanları Filistin'den Asur'a kadar korur ve kendi bölgesinde yalnız kalır."
 RULE_OPTION_EST_HISTORICAL:0 "Tarihî"
 RULE_OPTION_EST_HISTORICAL_DESC:0 "§8Reform Partisi§!, ulusal bir çevrimiçi kimlik etrafında dijital bir devlet kurarken radikal deregülasyon ve sabit oranlı vergi uygular. Estonya NATO'ya ve Avrupa Birliği'ne Baltık'ta Batılı bir çapa ve Rus nüfuzuna karşı kalıcı bir denge olarak katılır."
 RULE_OPTION_EST_CONSERVATIVE:0 "Geleneksel Estonya"
 RULE_OPTION_EST_CONSERVATIVE_DESC:0 "§8Isamaa§!, işletme dostu vergi indirimleri tanır ve hedefli istihdam programları yürütürken eğitime ve aile yardımlarına ağır yatırım yapar. Estonya Batılı ve Avrupa yanlısı kalır ama toplumsal olarak içe döner; göç politikasını sıkılaştırır ve kültürü korumayı kozmopolitliğin önüne koyar."
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC:0 "Kuzey Modeli"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC:0 "§8Sosyal Demokrat Parti§!, asgari ücrete, güçlendirilmiş sendikalara ve devlet öncülüğündeki sanayi yatırımına dayanan Kuzey tarzı bir refah devleti kurar. Estonya Batı hizasını korur ama işçi haklarını ve işyerinde eşitliği savunan bir sosyal demokrasi olarak Avrupa'ya katılır."
 RULE_OPTION_EST_CENTRIST:0 "Doğu Dengesi"
 RULE_OPTION_EST_CENTRIST_DESC:0 "§8Merkez Partisi§!, Estonya'nın Atlantikçi eğilimini bırakır, Rusya ile ticareti yeniden açar, Rusça konuşan azınlığa kur yapar ve Letonya ile Litvanya ile birlik için baskı yapar. Estonya Doğu ile Batı arasında tarafsız bir köprü olur ve Baltık en sağlam NATO savunucusunu kaybeder."
 RULE_OPTION_EST_NATIONALIST:0 "Önce Estonya"
 RULE_OPTION_EST_NATIONALIST_DESC:0 "§8EKRE§! iktidara gelir, ülkenin kaynaklarına devlet adına el koyar ve Avrupa yanlısı partileri ve sempatizanlarını kamusal hayattan tasfiye eder. Estonya Avrupa entegrasyonundan uzaklaşır, sert biçimde silahlanır ve Letonya, Litvanya, Finlandiya ve İsveç üzerinde hak iddia ederek Baltık'ı bir kriz noktasına çevirir."
 RULE_OPTION_ETH_HISTORICAL:0 "Tarihî"
 RULE_OPTION_ETH_HISTORICAL_DESC:0 "Etiyopya, sağlık, eğitim ve dinî özgürlüklerdeki ilerlemelerle Federal Demokratik Cumhuriyeti'ni güçlendirir. §8EPRDF§! koalisyonu Afrika Birliği ile bağlarını derinleştirirken siyasi sürekliliği korur."
 RULE_OPTION_ETH_MONARCHIST_RESTORATION:0 "Tacın Dönüşü"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC:0 "Etiyopya §8Etiyopya Taç Konseyi§!'ni yeniden kurar ve Zera Yakup Amha Selassie'yi tahta davet eder. Parlamentonun rolü azalırken imparatorluk gücü yeniden öne çıkar ve Eritre üzerindeki hak iddiası canlandırılır."
 RULE_OPTION_ETH_DERG_RESTORATION:0 "Derg'in Dönüşü"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC:0 "Etiyopya, Mengistu Haile Mariam'ı itibarlandırır ve komünist yönetimi §8Etiyopya Halk Demokratik Cumhuriyeti§! altında yeniden kurar. Ülke Çin ile hizalanır ve pan-Afrikacı komünist dayanışmanın peşine düşer."
 FIJ_AI_BEHAVIOR:0 "@FIJ Fiji"
 RULE_OPTION_FIJ_HISTORICAL:0 "Tarihî"
 RULE_OPTION_FIJ_HISTORICAL_DESC:0 "Ordu seçilmiş §8Birleşik Fiji Partisi§! hükümetini devirir ve yerine ordu destekli bir yönetim kurar. Adalara istikrar döner ama nihai yetki kışlalarda kalır ve seçimler askıda tutulur."
 RULE_OPTION_FIJ_COUP_AVERTED:0 "Önlenen Darbe"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC:0 "Hükümet ile ordu arasındaki gerginlik kimseyi devirmeden yatıştırılır ve §8Fiji İşçi Partisi§! merkez sol bir mandayla göreve gelir. Uzlaşma ve kamu yatırımı gündemi belirler; Fiji komşularının umudu kestiği sivil hükümeti korur."
 RULE_OPTION_FIJ_MILITARY_JUNTA:0 "Subayların Cumhuriyeti"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC:0 "§8Fiji Askerî Kuvvetleri§!'ndeki radikaller darbenin gerektirdiğinden öteye geçer ve açık askerî yönetimi resmileştirir; polisi sıkıyönetim altında orduya katar. Siyaset kışladan yönetilir ve Pasifik, deniz ulaşım yollarının kalbinde açıkça militarize olmuş bir devlet kazanır."
 RULE_OPTION_FIJ_RESTORED_KINGDOM:0 "Tacın Yeniden Tesisi"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC:0 "§8Büyük Şefler Konseyi§! krizi kazanır ve Fiji'yi seçilmiş bir hükümdar altında krallık olarak yeniden kurar. Şef âdetleri devletin temeli olur ve yerli kurum, etnik meseleyi kendi şartlarıyla çözer."
 RULE_OPTION_FIJ_TECHNOCRACY:0 "Mühendislerin Yönetimi"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC:0 "Mühendislerden, planlamacılardan ve yöneticilerden oluşan bir konsey ülkeyi ele alır ve teknokratik bir anayasayla yönetir. Parti siyaseti yerini otomasyona ve sanayi planlamasına bırakır ve Fiji bölgedeki her ekonomiyi kalkınmada geride bırakmaya girişir."
 RULE_OPTION_FIJ_EARLY_JUNTA:0 "Kışla Erken Harekete Geçiyor"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC:0 "Milenyum rehine krizi hiçbir zaman kontrol altına alınamaz ve §8Fiji Askerî Kuvvetleri§! parlamento hâlâ kuşatma altındayken ülkeyi doğrudan ele alır. Militarize bir toplum takvimden yıllar önce katılaşır ve bölge darbe alışkanlığının çok daha erken kök saldığını izler."
 RULE_OPTION_FIJ_EARLY_KINGDOM:0 "Taç Erken Dönüyor"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC:0 "Milenyum rehine krizi, cumhuriyete dönüşle değil, §8Büyük Şefler Konseyi§!'nin seçilmiş bir kralı yükseltmesiyle sonuçlanır. Monarşi tam bir siyasi kuşak erken geri gelir ve ardından yaşanacak ikinci kriz hiç gelmez."
 FIN_AI_BEHAVIOR:0 "@FIN Finlandiya"
 RULE_OPTION_FIN_HISTORICAL:0 "Tarihî"
 RULE_OPTION_FIN_HISTORICAL_DESC:0 "Finlandiya, §8Sosyal Demokrat Parti§!, §8Merkez Partisi§! ve §8Ulusal Koalisyon Partisi§! hükümetleri altında Kuzey rotasını korur; NATO'ya katılmadan önce İsveç ile karşılıklı savunma paktı kurar. Rusya, en uzun Avrupa sınırı boyunca tahkim edilmiş bir Batı ittifakıyla yüzleşir."
 RULE_OPTION_FIN_RUSSIAN_ALIGNMENT:0 "Moskova'nın Ortağı"
 RULE_OPTION_FIN_RUSSIAN_ALIGNMENT_DESC:0 "Finlandiya Kuzey ortaklarından yüz çevirir ve Kremlin ile birlikte KGAÖ'ye katılır; Rus teçhizatıyla yeniden silahlanır ve İsveç ile Norveç sınırını tahkim eder. Rusya'nın ittifakı Botni Körfezi'ne ulaşırken Kuzey dengesi çöker."
 RULE_OPTION_FIN_KINGDOM_OF_FINLAND:0 "Finlandiya Krallığı"
 RULE_OPTION_FIN_KINGDOM_OF_FINLAND_DESC:0 "Finlandiya Almanya ile hizalanır ve Berlin'de bir Kayzer geri dönerse §8Hessen-Kassel Hanedanı§!'ndan bir kral taçlandırır ve Aland'ı yeniden militarize eder. Krallık ardından Karelya, Petsamo, Salla ve Kola üzerinde hak iddia eder ve bölgeyi Rusya'ya karşı bir intikam savaşına sürükler."
 RULE_OPTION_FRA_HISTORICAL:0 "Tarihî"
 RULE_OPTION_FRA_HISTORICAL_DESC:0 "Beşinci Cumhuriyet, cumhurbaşkanlığı Chirac'tan Sarkozy'ye, sonra Hollande ve Macron'a geçerken rotasını korur; §8Cumhuriyetçiler§! ve merkez iktidarı aralarında paylaşır. Fransa Avrupa entegrasyonunun çapası olur ve Françafrique nüfuz alanında elini elinden bırakmaz."
 RULE_OPTION_FRA_SOCIALIST:0 "Sosyalistler Dönüyor"
 RULE_OPTION_FRA_SOCIALIST_DESC:0 "§8Sosyalist Parti§! Élysée'yi alır ve sosyal yardım genişlemesi, kısaltılmış çalışma saatleri ve kamu harcamalarında daha yumuşak bir çizgiyle yönetir. Fransa NATO'da ve Birlikte kalır ama salt liberal değil sosyal bir Avrupa için tartışır."
 RULE_OPTION_FRA_LIBERAL:0 "Liberal Merkez"
 RULE_OPTION_FRA_LIBERAL_DESC:0 "Merkezci §8UDF§! ve halefi §8La République En Marche§!, deregülasyon, çalışma hayatı reformu ve daha derin bir Avrupa federalizmiyle yönetir. Fransa, tek vücut hareket eden bir Birlik için diğer her büyük güçten daha sert bastırır."
 RULE_OPTION_FRA_GAULLIST:0 "Gaullist Diriliş"
 RULE_OPTION_FRA_GAULLIST_DESC:0 "§8Fransa İçin Toplanma§! Gaullist egemenlikçiliği canlandırır, Fransa'yı NATO komutasından gevşetir ve bağımsız bir nükleer duruşta ısrar eder. Fransa Avrupa'daki yerini korur ama Washington'un önderliğini izlemeyi reddeder."
 RULE_OPTION_FRA_GREEN:0 "Yeşil Cumhuriyet"
 RULE_OPTION_FRA_GREEN_DESC:0 "§8Yeşiller§! ve halefi §8Avrupa Ekolojisi Yeşiller§! iktidara gelir ve devleti ekolojik dönüşüme yöneltir; nükleer filoyu ve ağır sanayiyi yeniden düşünür. Fransa bir miktar büyümeyi Avrupa'nın en gür yeşil sesiyle takas eder."
 RULE_OPTION_FRA_FRANCE_UNBOWED:0 "Boyun Eğmeyen Fransa"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC:0 "§8Boyun Eğmeyen Fransa§!, radikal solu Altıncı Cumhuriyet vaadi ve Avrupa mali ortodoksisiyle kopuş söylemiyle iktidara taşır. Fransa Birliğin kurallarına karşı durur ve Batı bloğunun dışında ortak arar."
 RULE_OPTION_FRA_NATIONAL_RALLY:0 "Ulusal Birlik"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC:0 "§8Ulusal Cephe§! ve halefi §8Ulusal Birlik§! Cumhuriyeti tümüyle kazanır ve göçü kısıtlama ile ulusal tercih üzerine yönetir. Fransa Brüksel'de çıkış kapısı için bastırır ve Moskova'ya ısınır."
 RULE_OPTION_FRA_COMMUNE:0 "Fransız Komünü"
 RULE_OPTION_FRA_COMMUNE_DESC:0 "§8Fransız Komünist Partisi§! ve radikal sol Beşinci Cumhuriyet'i kırar ve Fransız Komünü'nü ilan eder. Fransa Batı kampından, kıtadaki her başkenti alarma geçiren devrimci bir çizgiye geçer."
 RULE_OPTION_FRA_KINGDOM:0 "Fransa Krallığı"
 RULE_OPTION_FRA_KINGDOM_DESC:0 "Bir kralcı darbe Cumhuriyet'e son verir ve bir Bourbon ya da Orléans hak sahibini Fransa Kralı olarak taçlandırır. Yeniden kurulan monarşi Brüksel'e sırtını döner ve komşularıyla eski kavgaları canlandırır."
 RULE_OPTION_FRA_EMPIRE:0 "Fransız İmparatorluğu"
 RULE_OPTION_FRA_EMPIRE_DESC:0 "Bir Bonapartist darbe Cumhuriyet'e son verir ve yeni bir Fransız İmparatorluğu ilan eder. İmparatorluk, onu hem Almanya'ya hem Britanya'ya karşı koyan kıta emelleri güder."
 USB_AI_BEHAVIOR:0 "@USB Özgür Eyaletler"
 RULE_OPTION_REVANCHIST_PATH:0 "Kaderi Geri Alma"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC:0 "Federal kurumun elinde kalanlar Özgür Eyaletler'i kıta Amerika Birleşik Devletleri'nin tamamını geri almaya yöneltir. Eski Amerikan haritasındaki her komşu, öne sürülmeyi bekleyen bir hak iddiası olur §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_ISOLATION_PATH:0 "Büyük Kapanış"
 RULE_OPTION_ISOLATION_PATH_AI_DESC:0 "Amerikan rüyası yazılıp çizilir ve Özgür Eyaletler artık hiçbir borçlu olmadıklarına inandıkları bir dünyaya kapıyı kapatır. Washington'un eski taahhütleri sona erer ve doğu kıyısı kendi sessizliğine bırakılır §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_ARCADIA_PATH:0 "Doğu Kimliği"
 RULE_OPTION_ARCADIA_PATH_AI_DESC:0 "Federal bağlılık solar ve Özgür Eyaletler birliğin yasını tutmak yerine Arcadia Planı'ndan yeni bir §8Doğu Kimliği§! kurar. Doğu kıyısı eskisinin bir artığı olmak yerine kendi başına bir ulus olur §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_SECOND_COAL_WARS:0 "2. Kömür Savaşları"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC:0 "Özgür Eyaletler, yeniden canlanan §8Birleşik Maden İşçileri§!'nin Batı Virginia ocaklarını yeniden açma talebini reddeder; kömür sahaları ayaklanır ve eyaletin bağımsızlığını ilan eder. İkinci bir Kömür Savaşı Appalaşlar'da yeni bir cephe açar §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 GEO_AI_BEHAVIOR:0 "@GEO Gürcistan"
 GEO_NATIONALIST_behavior:0 "@GEO Milliyetçilerin davranışı"
 GEO_help_CHE_behavior:0 "@GEO Çeçenlere yardım"
 GEO_2008_war_behavior:0 "@GEO Rus-Gürcü Savaşı"
 RULE_OPTION_GEO_HISTORICAL:0 "Tarihî"
 RULE_OPTION_GEO_HISTORICAL_DESC:0 "Gül Devrimi §8Gürcistan Vatandaşları Birliği§!'ni süpürür ve Mihail Saakaşvili ülkeyi sertçe NATO'ya ve Batı'ya yöneltir. Gürcistan ayrılıkçı cumhuriyetler yüzünden Rusya ile savaşı kaybeder ve ardından iktidarı barışçıl biçimde §8Gürcü Rüyası§!'na devreder."
 RULE_OPTION_GEO_SHEVARDNADZE_WEST:0 "Şevardnadze Sürüyor"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC:0 "Eduard Şevardnadze muhalefete teslim olmak yerine onu ezer ve §8Gürcistan Vatandaşları Birliği§! ülkeyi devrim olmadan Batı rotasında tutar. Gürcistan, yine de Brüksel ve Washington'un kur yaptığı otoriter bir devlet olarak kalır."
 RULE_OPTION_GEO_PRO_RUSSIAN:0 "Moskova'ya Taviz"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC:0 "§8Gürcistan Vatandaşları Birliği§! Kremlin ile anlaşır; Rus üsleri yerinde kalır ve ayrılıkçı cumhuriyetler Moskova'nın şartlarıyla çözülür. Gürcistan Bağımsız Devletler Topluluğu'na kayar ve Batı kampından çıkar."
 RULE_OPTION_GEO_NATIONALIST:0 "Mkhedrioni Dönüyor"
 RULE_OPTION_GEO_NATIONALIST_DESC:0 "§8Mkhedrioni§! paramiliterleri yeniden canlanır ve devleti alır; Gürcistan hiçbir bloka bağlı olmayan Büyük Gürcistan'ın peşine düşer. Ermenistan, Azerbaycan ve ayrılıkçı cumhuriyetlerin hepsi komşu olmaktan çıkıp hedef olur."
 RULE_OPTION_GEO_COMMUNIST:0 "Sovyet Cumhuriyeti'nin Yeniden Tesisi"
 RULE_OPTION_GEO_COMMUNIST_DESC:0 "§8Gürcistan Birleşik Komünist Partisi§! sandıkla ya da devrimle geri döner ve Sovyet cumhuriyetini yeniden ilan eder. Gürcistan bir Transkafkasya federasyonunu yeniden kurmak için Ermenistan ve Azerbaycan'a el uzatır."
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT:0 "Ulusal Hareket Sürüyor"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC:0 "Tarih savaşa ve ardından gelen düzenlemeye kadar akışını sürdürür ama Saakaşvili'nin §8Birleşik Ulusal Hareketi§! cumhurbaşkanlığını kaybetmek yerine korur. Gürcistan NATO üyeliğine daha da yüklenir ve Moskova'ya açık düşmanlıkla karşılık verir."
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS:0 "Yurtseverler İttifakı"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC:0 "Savaş sonrası düzenleme olduğu gibi gelir, ardından §8Yurtseverler İttifakı§! milliyetçi ve toplumsal olarak muhafazakâr bir programla kazanır. Gürcistan Brüksel'den yüz çevirir ve yeniden doğuya doğru kayar."
 RULE_OPTION_GEO_UNITED_GEORGIA:0 "Doğu ile Batı Arasında"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC:0 "Savaş sonrası düzenleme olduğu gibi gelir, ardından §8Birleşik Gürcistan§! bilinçli olarak çok yönlü bir dış politikayla göreve gelir. Gürcistan Avrupa Birliği, Rusya ve komşuları arasında seçim yapmak yerine denge kurar."
 GEO_WILL_FOLLOW_OWN_WAY:0 "Kendi Yolu"
 GEO_WILL_FOLLOW_OWN_WAY_DESC:0 "Milliyetçi Gürcistan Kafkasya'da kendi yolunu izler ve hem Ermenistan'a hem Azerbaycan'a karşı döner. İki komşu da Tiflis'e müttefik olarak güvenemez."
 GEO_WILL_BE_PRO_ARMENIA:0 "Ermeni Yanlısı"
 GEO_WILL_BE_PRO_ARMENIA_DESC:0 "Milliyetçi Gürcistan Ermenistan'ın safında yer alır ve Azerbaycan'ı ezmesine yardım eder. Erivan kuzey sınırında bir ortak kazanırken Bakü iki düşmanla karşılaşır."
 GEO_WILL_BE_PRO_AZERI:0 "Azerbaycan Yanlısı"
 GEO_WILL_BE_PRO_AZERI_DESC:0 "Milliyetçi Gürcistan Azerbaycan'ın safında yer alır ve Ermenistan'ı ezmesine yardım eder. Bakü kuzey sınırında bir ortak kazanırken Erivan iki düşmanla karşılaşır."
 GEO_WILL_HELP:0 "@CHE Çeçenlere Yardım Et"
 GEO_WILL_HELP_DESC:0 "Gürcistan Çeçen savaşçıları Rusya ile savaşlarında destekler. Ayakta kalan bir Çeçenistan iyiliğin karşılığını sonra verebilir."
 GEO_WONT_HELP:0 "@CHE Çeçenlere Yardım Etme"
 GEO_WONT_HELP_DESC:0 "Gürcistan Çeçenlerin Rusya ile savaşının dışında kalır. Çeçen savaşçılar bunu unutmaz ve Tiflis'e düşman olur."
 GEO_ATTACK_RUS:0 "Savaşa Hazırlık"
 GEO_ATTACK_RUS_DESC:0 "Gürcistan Rusya ile Ağustos savaşı için silahlanır ve kazanmak için savaşır. Daha güçlü bir Gürcü ordusu Güney Osetya krizini gerçek bir mücadeleye dönüştürür."
 GEO_WEAKBOY:0 "Rusya ile Uzlaşma"
 GEO_WEAKBOY_DESC:0 "Gürcistan açık çatışmadan kaçınmak için Rusya ile uzlaşma arar. Tiflis ayrılıkçı bölgelerdeki talebini barışla takas eder."
 RULE_OPTION_GER_HISTORICAL:0 "Tarihî"
 RULE_OPTION_GER_HISTORICAL_DESC:0 "§8Sosyal Demokrat Parti§!, §8Yeşiller§! ile koalisyon hükümeti kurar, Hartz çalışma reformlarını kendi tabanına rağmen geçirir, ardından uzun bir büyük koalisyon için şansölyeliği §8Hristiyan Demokrat Birlik§!'e devreder. Almanya NATO'ya demirli kalır ve Avrupa Birliği'ni merkezinden yönlendirir."
 RULE_OPTION_GER_LIBERAL:0 "Liberal Cumhuriyet"
 RULE_OPTION_GER_LIBERAL_DESC:0 "§8Hür Demokrat Parti§! küçük ortak rolünden çıkar ve ülkeyi serbest piyasalar, deregülasyon, özelleştirilmiş savunma ve dijital devletle yönetir. Almanya NATO'ya daha sıkı bağlanır ve sınırlarını puan sisteminin en yüksek değerlendirdiği kişiye açar."
 RULE_OPTION_GER_GREEN:0 "Yeşil Şansölyelik"
 RULE_OPTION_GER_GREEN_DESC:0 "§8Yeşiller§! şansölyeliği tek başına alır ve onu nükleerden çıkışa, bir Avrupa yeşil mutabakatına ve ilerici vergilendirmeye harcar. Almanya ittifakı doğuya doğru iter ve hem Moskova'dan hem Pekin'den mesafe koyar."
 RULE_OPTION_GER_POPULIST:0 "Alternatif Yükseliyor"
 RULE_OPTION_GER_POPULIST_DESC:0 "§8Alternatif§!, göç, İslam, avro şüpheciliği ve iklim konusundaki kuşkular üzerinden kenardan çıkıp hükümete girer. Almanya Moskova'ya ısınırken Avrupa Birliği'ni içeriden söker."
 RULE_OPTION_GER_SOCIALIST:0 "Sol Yükseliyor"
 RULE_OPTION_GER_SOCIALIST_DESC:0 "§8Die Linke§!, Federal Cumhuriyet'in enkazından iktidarı alır, Amerikalıları üslerinden atar ve ülkeyi silahsızlandırır. Almanya ardından Fransa'yı, Polonya'yı ve İsveç'i bir işçi birliğine sokmak için bastırır, reddederlerse zorla."
 RULE_OPTION_GER_NATIONALIST:0 "Ulusal Demokratların Yönetimi"
 RULE_OPTION_GER_NATIONALIST_DESC:0 "Anayasal düzen iç savaşa çöker ve §8Ulusal Demokrat Parti§! enkazı alır; kan, toprak ve sınır dışı etme üzerine tek partili bir polis devleti kurar. Almanya açıkça ilhakçı olur ve çevresindeki her sınır bir hak iddiasına dönüşür."
 RULE_OPTION_GER_MONARCHIST:0 "Kayzer Dönüyor"
 RULE_OPTION_GER_MONARCHIST_DESC:0 "Cumhuriyet yıkılır ve §8Kayzer§! yeniden kurulan imparatorluğun başına yeniden taç giyer. Almanya İsviçre, Avusturya, Belçika, Osmanlı ve İtalya tahtlarına yeniden hükümdarlar oturtur ve onları bir imparatorluk bloğunda toplar."
 RULE_OPTION_GRE_HISTORICAL:0 "Tarihî"
 RULE_OPTION_GRE_HISTORICAL_DESC:0 "§8Yeni Demokrasi§!, Yunanistan'ı borç krizinden kemer sıkma ve avro ile geçirir; toparlanma gelmeden önce bütçeyi kemiğe kadar keser. Atina kendini Avrupa Birliği'ne ve NATO'ya daha derinden demirler; Kıbrıs, İsrail ve Fransa'yı bir Doğu Akdeniz cephesinde bağlar."
 RULE_OPTION_GRE_COMMUNIST:0 "Kızıl Akropol"
 RULE_OPTION_GRE_COMMUNIST_DESC:0 "Çöküş devleti yeni bir anayasa yazan, bankaları millileştiren ve kızıl bir ordu kuran §8Yunanistan Komünist Partisi§!'ne verir. Yunanistan NATO'dan çıkar ve Balkanlar boyunca Bulgaristan, Arnavutluk, Kuzey Makedonya, Sırbistan ve Romanya üzerinde hak iddia eden bir komünist blok örgütler."
 RULE_OPTION_GRE_NATIONALIST:0 "Altın Şafak"
 RULE_OPTION_GRE_NATIONALIST_DESC:0 "§8Altın Şafak§! aynı çöküşün sırtında iktidara biner, cumhuriyeti Metaksist bir diktatörlüğün altına gömer ve basını ve muhalefeti susturur. Yunanistan Megali İdea'yı canlandırır ve Arnavutluk, Bulgaristan, Kuzey Makedonya ve Türkiye üzerinde toprak iddiaları öne sürer."
 RULE_OPTION_GRE_MULTIPOLAR:0 "Doğuya Dönüş"
 RULE_OPTION_GRE_MULTIPOLAR_DESC:0 "Cumhuriyet ayakta kalır ama Avrupa Birliği'ne sırt çevirir; Rusya, Çin ve İran'a kur yapar ve Pire'yi Çin sermayesine satar. Yunanistan BRICS'e katılır ve NATO'dan çıkar; Batı kampındaki yerini çok kutuplu bir düzende bir koltukla takas eder."
 GRN_AI_BEHAVIOR:0 "@GRN Grönland"
 RULE_OPTION_GRN_HISTORICAL:0 "Tarihî"
 RULE_OPTION_GRN_HISTORICAL_DESC:0 "Grönland Danimarka'dan özyönetim kazanır ve çabalarını dış maceraya değil iskâna, balıkçılığa, madenciliğe ve kamu hizmetlerine yatırır. Arktik sessiz kalır ve Grönland'ın Kuzey komşuları mevcut sınırlarını korur."
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY:0 "İskandinav Dinginliği"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC:0 "Grönland, İzlanda'yı, Faroe Adaları'nı, Danimarka'yı, Norveç'i, İsveç'i ve Finlandiya'yı bir §8Kuzey Birliği§!'nde toplar, ardından Baltık kıyısında durur. İskandinavya tek sesle konuşur ve daha geniş Avrupa düzeni olduğu gibi kalır."
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY:0 "Kıtasal Hegemonya"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC:0 "Grönland §8Kuzey Birliği§!'ni, §8Donmuş Federasyon§! Avrupa'nın büyük bölümüne yayılana dek güneye ve doğuya taşır. Kıtanın başkentleri Nuuk'a hesap verir ve eski Avrupa düzeni sona erer."
 HEZ_AI_BEHAVIOR:0 "@HEZ Hizbullah"
 RULE_OPTION_HEZ_HISTORICAL:0 "Tarihî"
 RULE_OPTION_HEZ_HISTORICAL_DESC:0 "§8Hizbullah§! seçimlere parti olarak girer, İsrail'e karşı savaştığı §8Taabia§! gerilla ordusunu elinde tutar ve §8Lübnan Silahlı Kuvvetleri§!'nin yerini almak yerine yanında durur. Lübnan devletinin içinde bir devlet olarak kalırken Şam, §8Iraklı Şii milisler§! ve §8Husiler§! ile birlikte savaşır."
 RULE_OPTION_HEZ_LAND_OF_GOD:0 "Tanrı'nın Ülkesi"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC:0 "§8Hizbullah§! Lübnan'dan ayrılır ve güneyde ve Bekaa'da tanınan bir İslam devleti kurar; müttefiklere kur yapar ve yönettiği köylerde yaşam standartlarını yükseltir. Seferi kuvvetler ve bir dış istihbarat servisi kurar; bir Lübnan hizbini kendi başına bir bölgesel güce çevirir."
 RULE_OPTION_HEZ_CONQUER_LEBANON:0 "Lübnan'ın Efendileri"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC:0 "§8Hizbullah§!, §8Lübnan Silahlı Kuvvetleri§!'nden ayrılanları silahlandırır ve Lübnan'ı sandıkla değil açık savaşla alır. Seferi İran parası, fabrikaları ve yollarıyla finanse eder ve ülkeyi Tahran'a hesap veren bir İslam Cumhuriyeti olarak ilhak eder."
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE:0 "Devrimi İhraç Et"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC:0 "§8Hizbullah§! Lübnan'daki mevzisini korur ve parasını Batı Afrika'daki §8İslami Hareket§!'ten diasporaya ve Venezuela'dan çıkan kartel yollarına kadar yurt dışındaki ağlara akıtır. Kuzey Amerika'nın içinde bile hücreler ve milisler kurar; savaşı Levant'ın çok ötesine taşır."
 RULE_OPTION_HKG_HISTORICAL:0 "Tarihî"
 RULE_OPTION_HKG_HISTORICAL_DESC:0 "§8Pekin yanlısı kamp§!, Özel İdari Bölge'yi Pekin'in rotasında tutar; §8Yasama Konseyi§!'ni yurtseverler etrafında yeniden kurar, okullara yurtsever eğitim koyar ve Kanton sivil hayatının solmasına göz yumar. Parası da onu izler: Hong Kong renminbinin kıyı hub'ı ve §8Kuşak ve Yol§!'ın finansörü olur, §8Büyük Körfez Bölgesi§! ise §8Temel Yasa§!'nın vaat ettiğini yutar."
 RULE_OPTION_HKG_INDEPENDENCE:0 "Kendi Ulusumuz"
 RULE_OPTION_HKG_INDEPENDENCE_DESC:0 "Hong Kong kukla düzenlemeyi yırtar, kendi anayasasını yazar ve onu savunmak için bir ordu ve uçak gemisi filosu kurar. Ardından İnci Nehri deltası üzerinde ilhakçı bir talep öne sürer ve Pekin'e Guangdong için hesap vermeyi göze almasını söyler."
 RULE_OPTION_HKG_BRITISH:0 "Yeniden Kraliyet Altında"
 RULE_OPTION_HKG_BRITISH_DESC:0 "Hong Kong Çin egemenliğinden ayrılır ve Londra'dan geri dönmesini ister; Birleşik Krallık'a garnizon hakları verir, §8AUKUS§! istihbarat paylaşımına katılır ve genel oy hakkı ile bağımsız bir yargı yasalaştırır. Çin'in kapısında bir §8Commonwealth§! krallığı, Pekin'in on yıllardır kapattığı demokratik dayanak noktasını Batı'ya verir."
 RULE_OPTION_HKG_CITY_STATE:0 "Özgür Şehir"
 RULE_OPTION_HKG_CITY_STATE_DESC:0 "Hong Kong §8Temel Yasa§!'yı kendi yetkisiyle yeniden yazar, ordu yerine bir kıyı savunma gücü tutar ve kendini Doğu Asya'nın finans başkenti yapar. Hiçbir bloka bağlı olmayan şehir Pekin ve Washington ile eşit ticaret yapar ve ikisine de hesap vermez."
 RAJ_AI_BEHAVIOR:0 "@RAJ Hindistan"
 RULE_OPTION_RAJ_HISTORICAL:0 "Tarihî"
 RULE_OPTION_RAJ_HISTORICAL_DESC:0 "Hindistan iktidarı §8Hindistan Halk Partisi§! ile §8Hindistan Ulusal Kongresi§! arasında değiştirir; ekonomik liberalleşmeyi ve §8BRICS§!'e ve çok kutuplu, bağlantısız bir dış politikaya bağlılığı sürdürür. Hindistan hem Washington hem Moskova ile bağlarını korurken gelişmekte olan dünyada büyük bir ses olarak yerleşir."
 RULE_OPTION_RAJ_GREATER_INDIA:0 "Büyük Hindistan"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC:0 "Bir Hindutva milliyetçi cephesi iktidara gelir; kast hiyerarşisini korurken ve azınlıkları korumasız bırakırken ülkede Hindu çoğunlukçu yönetimi dayatır. Hindistan özerkliğe, yalıtıma ve Nepal, Bhutan ve Bangladeş üzerinde toprak taleplerine yönelerek otoriter bir pan-Hint rejimi kurar."
 RULE_OPTION_RAJ_RED_REPUBLIC:0 "Kızıl Cumhuriyet"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC:0 "§8Hindistan Komünist Partisi§! iktidarı kazanır, ekonomiyi millileştirir ve beş yıllık planlamaya döner; Çin ile hizalanır ve Aksai Chin talebinden vazgeçer. Hindistan devrimi Güney Asya'ya ihraç eder ve bölgenin radikal sosyalist öncüsü olur."
 RULE_OPTION_RAJ_PEOPLES_FRONT:0 "Halk Cephesi"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC:0 "§8Bahujan Samaj Partisi§! ve §8Samajwadi Partisi§! bir Dalit ve sosyalist koalisyon kurar, kast ayrıcalığını söker ve serveti toplumun geneline dağıtır. Hindistan bağlantısız dış politikasını korurken Kuzey tarzı bir refah devleti kurar."
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT:0 "Batı'nın Müttefiki"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC:0 "Hindistan Fransa ve İsrail'e yaklaşır, Amerika Birleşik Devletleri'nin NATO dışı büyük müttefiki olur ve Washington ile askerî ve ticari iş birliğini derinleştirir. Hindistan Tayvan'ı tanır ve sonunda NATO'ya katılarak Batı ittifakındaki yerini sağlamlaştırır."
 IND_AI_BEHAVIOR:0 "@IND Endonezya"
 RULE_OPTION_IND_HISTORICAL:0 "Tarihî"
 RULE_OPTION_IND_HISTORICAL_DESC:0 "Endonezya, Reformasi cumhuriyetini §8Ulusal Uyanış Partisi§! etrafında pekiştirir; dinî aşırıcılıkla savaşır ve Maluku çatışmasında taraf tutmak yerine arabuluculuk yapar. Yolsuzlukla mücadele kurumları ve Batı hizasıyla desteklenen Endonezya, Güneydoğu Asya'nın istikrarlı bir demokratik çapası olur."
 RULE_OPTION_IND_PARTY_OF_STRUGGLE:0 "Mücadele Partisi"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC:0 "§8Endonezya Demokratik Mücadele Partisi§!, ülkenin en büyük laik ve milliyetçi gücü olarak iktidara gelir; tartışmalı bölgelerde dinî azınlıkları korur ve Pancasila'yı radikalleşmeye karşı ilerletir. Endonezya diplomasisini Çin ve Rusya'ya doğru çevirirken takımadalar boyunca sol milliyetçi bir kale kurar."
 RULE_OPTION_IND_DEMOCRAT_PARTY:0 "Teknokratik Başkanlık"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC:0 "Reformcu bir general, §8Demokrat Parti§! içinde teknokrat profesyonelleri toplar ve ekonomik büyümeyi, kurumsal istikrarı ve yatırımcı güvenini önceler. Endonezya Güneydoğu Asya'da profesyonel, yetkin yönetim modeli olarak sıkı biçimde Batı hizalı kalır."
 RULE_OPTION_IND_UNITED_DEVELOPMENT:0 "Birleşik Kalkınma Cephesi"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC:0 "Yeni Düzen'in İslami kurum ağlarına dayanan §8Birleşik Kalkınma Partisi§! devleti alır ve yapısal reform yerine himaye, kişisel ilişkiler ve elit uzlaşmasıyla yönetir. Endonezya Batı demirini korurken İslami kimlik gayriresmî iktidar yapıları ve çıkarcı siyaset yoluyla derinleşir."
 RULE_OPTION_IND_PROSPEROUS_JUSTICE:0 "Müreffeh Adalet Hareketi"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC:0 "Yolsuzlukla mücadele ve taban seferberliğine dayalı disiplinli bir İslamcı hareket olan §8Müreffeh Adalet Partisi§! iktidarı ele geçirir ve Reformasi'den beri ülkeyi yöneten himaye ağlarını parçalar. Batı vesayetine düşman ve toplumsal olarak muhafazakâr Endonezya, hem liberal düzenin hem eski elitin dışında bağımsız bir aktör olarak doğuya yönelir."
 RULE_OPTION_IND_ISLAMIST:0 "İslami Endonezya"
 RULE_OPTION_IND_ISLAMIST_DESC:0 "§8İslami Savunucular Cephesi§! sokak aktivizminden devlet ele geçirmeye uzanan bir seferberlik yürüttükçe dinî radikalleşme denetimsiz ilerler. Endonezya, komşularına karşı toprak ve ideolojik taleplerde bulunan ve kendi takımadalarında hâkimiyet kuran bir şeriat cumhuriyetine dönüşür."
 RULE_OPTION_PER_HISTORICAL:0 "Tarihî"
 RULE_OPTION_PER_HISTORICAL_DESC:0 "İslam Cumhuriyeti Yüce Lider altında sürer; cumhurbaşkanlığı reformist ve usulcü kamplar arasında gidip gelir. İran Direniş Ekseni'nin çapasıdır, nükleer programını her yaptırım turunda ilerletir ve Lübnan'dan Yemen'e müttefik milisler aracılığıyla güç yansıtır."
 RULE_OPTION_PER_RESTORATION:0 "Tavus Tahtı"
 RULE_OPTION_PER_RESTORATION_DESC:0 "Sürgündeki §8Anayasacı Parti§!, §8Pehlevi§! hanedanını eve getirir ve II. Rıza Pehlevi'yi laik bir krallığın başına taçlandırır. Ruhban düzeni süpürülür ve İran, bir kuşaktır kurduğu vekil ağını terk ederek batıya döner."
 RULE_OPTION_PER_IRANIC_FEDERATION:0 "İran Federasyonu"
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC:0 "§8Pan-İranist Parti§! iktidara gelir ve Tacikistan, Kürdistan, Azerbaycan ve Belucistan'ın İran halklarını tek bir federasyonda toplamaya çalışır. İran yeni bir İran nüfuz alanının kalbi olur ve İranî toprak tutan her komşunun sınırları sorgulanır."
 RULE_OPTION_PER_MOJAHEDIN:0 "Halkın Mücahitleri"
 RULE_OPTION_PER_MOJAHEDIN_DESC:0 "§8Halkın Mücahitleri Örgütü§!, Meryem Rajavi önderliğinde sürgünden döner ve devleti ruhbandan alır. İran, eski devrime hiçbir borcu olmayan bir halk cumhuriyeti ilan edilir ve dış politikası sıfırdan kurulur."
 RULE_OPTION_PER_FREEDOM_MOVEMENT:0 "Özgürlük Hareketi"
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC:0 "§8İran Özgürlük Hareketi§!, ruhban yönetiminin enkazını devralır ve inancı bireyin vicdanına bırakan laik anayasal bir cumhuriyet kurar. Devrim Muhafızları siyasetten ve ticaretten çıkarılır ve İran sıradan bir devlet olarak Batı'ya yeniden açılır."
 RULE_OPTION_PER_NATIONAL_FRONT:0 "Ulusal Cephe"
 RULE_OPTION_PER_NATIONAL_FRONT_DESC:0 "§8Ulusal Cephe§!, Musaddık'ın mirasçısı olarak geri döner ve İran'ı laik milliyetçilik ve devrimin israf ettiği petrol üzerine yeniden kurar. Teknokratları yeniden işe koyarken bağlantısızlığı korur; ne Washington'a ne Moskova'ya kur yapar."
 RULE_OPTION_PER_GREEN_MOVEMENT:0 "Yeşil Hareket"
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC:0 "§8Yeşil Hareket§!, seçim oylarının nihayet sayılacağı vaadiyle Mir Hüseyin Musavi'yi iktidara taşır. İran İslam cumhuriyeti olarak kalır ama seçmenine hesap verir ve bölge Yüce Lider'i muhatap olarak kaybeder."
 RULE_OPTION_PER_MONTAZERI:0 "Montazeri'nin Cumhuriyeti"
 RULE_OPTION_PER_MONTAZERI_DESC:0 "§8Büyük Ayetullah Muntazeri§! çevresindeki reformist ruhban medreseleri sertlik yanlılarından geri alır ve nihayet hapishanelerin hesabını verir. İnanç devletteki yerini korur; ama bu yer, hayatını onun adına yapılanları kınayarak geçiren adamın ölçülülüğüyle yumuşatılmıştır."
 RULE_OPTION_PER_AHMADINEJAD:0 "Ahmedinejad'ın Dönüşü"
 RULE_OPTION_PER_AHMADINEJAD_DESC:0 "§8Mahmud Ahmedinejad§! sert çizgideki popülistleri toplar, yoksulları petrol hesabından öder ve dünyayı kendisini durdurmaya cesaretlendirir. Besic ve Ensar-ı Hizbullah ülke içinde devletin koluna dönüşür; dışarıdaki çatışma artık bir bedel değil amaç olur."
 RULE_OPTION_PER_GHALIBAF:0 "Galibaf'ın Düzeni"
 RULE_OPTION_PER_GHALIBAF_DESC:0 "§8Muhammed Bağır Galibaf§!, işleri yaptıran komutan olarak yönetir; siyasi özgürlüğü yollar, düzen ve sonuçlarla takas eder. Devrim Muhafızları ticaret imparatorluğunu korur ve basın tasmasını korurken Tahran bunun parasını bulmak için Moskova'ya kur yapar."
 RULE_OPTION_PER_MASHAEI:0 "Meşai'nin İran Okulu"
 RULE_OPTION_PER_MASHAEI_DESC:0 "§8Esfendiyar Rahim Meşai§! ulusu inancın önüne koyar ve kendisiyle Tanrı arasında ruhbana ihtiyaç duymayan bir İran vaaz eder. Medreseler siyasi bir güç olarak kırılır ve devletin ihraç ettiği şey Şii İslam değil İran milliyetçiliği olur."
 RULE_OPTION_PER_WORKERS_REPUBLIC:0 "İşçi Cumhuriyeti"
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC:0 "§8Tude Partisi§! ve İran solu sürgünden döner ve bir işçi cumhuriyeti ilan eder. Ruhban ve Devrim Muhafızları birlikte sökülür ve İran dostlarını dünyanın geriye kalan sosyalist devletleri arasında arar."
 RULE_OPTION_PER_ARTESH:0 "Ordu Direktörlüğü"
 RULE_OPTION_PER_ARTESH_DESC:0 "§8Artesh§! sivil hükümetten geriye kalanı feshedip kendi subaylarından oluşan bir direktörlük aracılığıyla yönetir. İdeoloji yerini çıplak devlet çıkarına bırakır ve İran komşularıyla devrimci olarak değil asker olarak ilişki kurar."
 IRQ_AI_BEHAVIOR:0 "@IRQ Irak"
 RULE_OPTION_IRQ_HISTORICAL:0 "Tarihî"
 RULE_OPTION_IRQ_HISTORICAL_DESC:0 "Irak, Amerikan işgali rejimi devirene dek Saddam Hüseyin'in §8Baas Partisi§! altında yönetilir; ardından bir işgal hükümeti Bağdat'tan yönetir ve iktidar §8İslami Dava§!'nın Şii dinî partilerine geçer. Irak, yine de İran'ın diplomatik yörüngesine kayan, Amerikan destekli bir cumhuriyet olarak biter."
 RULE_OPTION_IRQ_BAATHIST_STATE:0 "Baas Sürüyor"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC:0 "§8Baas Partisi§! Amerikan işgalinden sağ çıkar, yaptırım rejimini kırar, veraseti aile içinde çözer ve Kuveyt, Kürt bölgeleri ve İran'ın Huzistan'ı üzerindeki taleplerini canlandırır. Körfez, komşularını sıkıştıran ve pan-Arap emeller güden bölünmemiş bir §8Baasçı§! Irak'ın yanında yaşar."
 RULE_OPTION_IRQ_SHIA_THEOCRACY:0 "Fakihlerin Yönetimi"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC:0 "Şii ruhban partileri ve §8Bedir Örgütü§! işgal sonrası devleti alır ve Tahran'la hizalı, fakihlerin yönettiği bir cumhuriyet kurar. Bağdat, Şam ve Beyrut'a uzanan bir İran ekseninin batı çapası olur."
 RULE_OPTION_IRQ_SADRIST:0 "Sadr Dalgası"
 RULE_OPTION_IRQ_SADRIST_DESC:0 "§8Mukteda es-Sadr§!'ın hareketi Bağdat'ın gecekondularından yükselir, Amerikalıları kovar ve İran vesayetini Amerikan vesayeti kadar kesin biçimde reddeden Şii popülist ve Iraklı milliyetçi bir güç olarak yönetir. Irak içe döner ve her yabancı hamiye düşman olur."
 RULE_OPTION_IRQ_SECULAR_REPUBLIC:0 "Laik Cumhuriyet"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC:0 "§8Irak Ulusal Kongresi§! ve §8Irak Ulusal Mutabakatı§!'nın laik muhalefeti, mezhebin ve etnisitenin üzerinde bir anayasa yazar ve devleti dinî değil Arap bir cumhuriyet olarak bir arada tutar. Irak, Batı'ya yönelen laik bir devlet olarak Arap düzenine yeniden katılır."
 RULE_OPTION_IRQ_COMMUNIST:0 "Sosyalist Irak"
 RULE_OPTION_IRQ_COMMUNIST_DESC:0 "§8Irak Komünist Partisi§!, §8Baasçı§! tasfiyelerden beri yaşadığı yeraltından çıkar, işçileri, kadınları ve Kürtleri kazanır ve cumhuriyeti alır. Irak, petrol monarşilerinin ortasında sosyalist bir devlet olur."
 ISR_AI_BEHAVIOR:0 "@ISR İsrail"
 RULE_OPTION_ISR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_ISR_HISTORICAL_DESC:0 "§8Likud§!, barış görüşmeleri çöktükten sonra ülkeyi alır, ikinci intifadayı bir ayırma bariyeri ardında bastırır ve yerleşimcileri Gazze'den çıkarır. İsrail Washington'a demirli kalır, Arap Körfezi ile normalleşir ve İran'ı diğer her şeyi düzenleyen tehdit olarak görür."
 RULE_OPTION_ISR_PEACE_PROCESS:0 "Barış Kampı"
 RULE_OPTION_ISR_PEACE_PROCESS_DESC:0 "§8İşçi Partisi§!, §8Meretz§! ve Arap partilerle birlikte yönetir ve iki devletli bir çözümü ciddi biçimde müzakere eder. Filistin Yönetimi şüpheli gibi denetlenmek yerine ortak olarak silahlandırılır ve Gazze'ye işleyen bir liman ve havalimanı verilir."
 RULE_OPTION_ISR_SECULAR_CENTRE:0 "Laik Merkez"
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC:0 "§8Yesh Atid§!, §8Mavi ve Beyaz§! ve §8Yeni Umut§! ülkeyi alır ve dini devletten geri söker. Mahkemeler korunur, zorunlu askerlik yeniden yazılır ve İsrail Avrupa'ya ve OECD'ye yaslanır."
 RULE_OPTION_ISR_GREATER_ISRAEL:0 "Büyük İsrail"
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC:0 "§8Otzma Yehudit§! ve §8Dindar Siyonizm§! iktidara gelir ve Oslo çerçevesinden geriye kalanı yırtar. Yerleşimler pekiştirilir ve ilhak edilir, Tapınak Dağı statükosu yeniden yazılır ve ordu vurulmadan önce kuzeye vurur."
 RULE_OPTION_ISR_LOOK_EAST:0 "Doğuya Dönüş"
 RULE_OPTION_ISR_LOOK_EAST_DESC:0 "Bir §8Likud§! hükümeti Washington'dan uzaklaşır; Hayfa limanını Çinli işletmecilere kiralar ve Pekin'e silah ve teknoloji satar. İsrail Kiev yerine Moskova'ya yönelir ve onu garanti eden Batı ittifakı koşullu görünmeye başlar."
 RULE_OPTION_ITA_HISTORICAL:0 "Tarihî"
 RULE_OPTION_ITA_HISTORICAL_DESC:0 "İktidar §8Demokrat Parti§! ile §8Forza Italia§! bloğu arasında el değiştirir ve İtalya NATO'ya ve Avrupa Birliği'ne demirli kalır. Hükümetleri enerjisini ülkenin sınırlarına değil organize suça, kamu borcuna, güney sorununa ve kendi idarelerine harcar."
 RULE_OPTION_ITA_ROMAN_RESTORATION:0 "Roma İmparatorluğu'nun Yeniden Tesisi"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC:0 "§8İtalya'nın Kardeşleri§! ve ulusal sağ, bir seçimi kazanacak kadar büyür, parlamentoyu feshedip yeniden kurulan Roma'nın başına bir imparator taçlandırır. İtalya ardından eski imparatorluk eyaletlerini, Afrika kıyısından Britanya'ya kadar tek tek talep eder."
 RULE_OPTION_ITA_MARCH_ON_ROME:0 "İkinci Roma Yürüyüşü"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC:0 "Aynı hareket iktidara gelir ama cumhuriyeti korur ve Roma'ya bir §8faşist§! hükümet yerleştirir. İtalya imparatorluğa uzanmadan Adriyatik ve Alpler üzerindeki ilhakçı taleplerini öne sürer."
 RULE_OPTION_ITA_EASTERN_TURN:0 "Doğuya Dönüş"
 RULE_OPTION_ITA_EASTERN_TURN_DESC:0 "§8Komünist Yeniden Kuruluş§! ve §8İtalyan Komünistler Partisi§! İtalyan solunu yeniden kurar ve ülkeyi NATO'dan çıkarır. İtalya Moskova ve Pekin'e kur yapar ve Şanghay İşbirliği Örgütü'nde yer arar."
 RULE_OPTION_JAP_HISTORICAL:0 "Tarihî"
 RULE_OPTION_JAP_HISTORICAL_DESC:0 "§8Liberal Demokratlar§! Diyet'i elinde tutar, Washington ile ittifak sürer ve Öz Savunma Kuvvetleri yalnızca düşmanca bir çevrenin zorladığı ölçüde normalleştirilir. Japonya batık kredilerini silip atar, doğum oranı çöküşüne ve karoşi krizine karşı yasa çıkarır ve Dokuzuncu Madde'yi yerinde bırakır."
 RULE_OPTION_JAP_NORMAL_NATION:0 "Normal Bir Ulus"
 RULE_OPTION_JAP_NORMAL_NATION_DESC:0 "§8Liberal Demokratlar§!, Öz Savunma Kuvvetleri anayasaya diğer her ordu gibi bir ordu olarak yazılana dek Dokuzuncu Madde uzlaşısını eritir. Japonya Amerikan ittifakı içinde yeniden silahlanır ve Pekin ile Pyongyang'a kendi adına karşılık vermeye başlar."
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY:0 "İkinci Savaş Sonrası"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC:0 "§8Demokrat Parti§!, muhafazakârların Diyet üzerindeki hâkimiyetini kırar ve şeffaflık, çalışma hukuku ve yabancı işçilere açık kapı temelinde yönetir. Japonya gücünü bölgeye değil doğum oranına, maaşlı çalışana ve balondan sağ çıkan yolsuzluğa harcar."
 RULE_OPTION_JAP_PACIFIST:0 "Barış Anayasası"
 RULE_OPTION_JAP_PACIFIST_DESC:0 "§8Sosyal Demokratlar§!, Dokuzuncu Madde'nin dediğini kastettiği vaadiyle Diyet'i alır ve silah ihracatı, üsler ve nihayet Öz Savunma Kuvvetleri tasfiye edilir. Japonya Washington ile güvenlik anlaşmasını yırtar ve Çin ile Koreler arasında silahsız kalır."
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE:0 "İmparatorluğun Dönüşü"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC:0 "§8Restorasyon Partisi§!, tahta iktidar iade edilene ve Dokuzuncu Madde silinene dek milliyetçi sağdan büyür. Japonya açık deniz filosu arkasında yeniden silahlanır ve Kuril Adaları'nı, Kore'yi, Tayvan'ı ve Pasifik'teki eski nüfuz alanını güçle geri alır."
 LKT_AI_BEHAVIOR:0 "@LKT Lakota"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH:0 "Islah Cephesi Savaşı"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC:0 "Başkentten gönderilen bir denetçi §8Islah Cephesi§! liderliğiyle kendi yetkisiyle yüzleşir ve görüşme açık bir kopuşla biter. Kansas Cephe altında militarize olur ve Lakota onunla savaşa girer §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH:0 "Islah Cephesi Barışı"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC:0 "İkinci bir soruşturma turu §8Islah Cephesi§! hakkındaki en ağır raporları çürütür ve iki hükümet silahlanmak yerine konuşur. Lakota ve Cephe uzlaşmadan ortak bir ekonomik ve toplumsal birlik kurar §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 LBA_AI_BEHAVIOR:0 "@LBA Libya"
 RULE_OPTION_LBA_HISTORICAL:0 "Tarihî"
 RULE_OPTION_LBA_HISTORICAL_DESC:0 "Kaddafi, §8Libya İslami Savaşçı Grubu§!'nu ezer, silah programından vazgeçer ve uluslararası yaptırımlardan müzakereyle çıkar. Rejim sonunda bir ayaklanmayla düşer ve Libya, §8Libya Ulusal Ordusu§!'na komuta eden askerî bir güçlü adama geçer."
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE:0 "İslam Hilafeti"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC:0 "Kaddafi, kendisine suikast düzenleyip Selefi bir devlet kuran §8Libya İslami Savaşçı Grubu§!'na göz yumar. Libya Sahel boyunca cihadın üssü olur ve Çad'ı, Nijer'i, Nijerya'yı, Cezayir'i, Mali'yi ve Moritanya'yı istikrarsızlaştırır."
 RULE_OPTION_LBA_GRAND_MUFTI:0 "Büyük Müftü'nün Yönetimi"
 RULE_OPTION_LBA_GRAND_MUFTI_DESC:0 "Bir §8Büyük Müftü§! atanır ve dinî hukuk devletin üzerine konur. Müftü sonunda iktidarı alır, Selefi bir krallık kurar ve Libya genelinde sıkı İslami yönetim dayatır."
 RULE_OPTION_LBA_LIBYAN_REPUBLIC:0 "Libya Cumhuriyeti"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC:0 "Libya Yeşil Kitap'ı gözden geçirir, Halk Kongrelerini güçlendirir ve siyasi partileri yasallaştırır. Devlet, Kaddafi'nin doğrudan demokrasisinin yerini rekabetçi siyasetin aldığı bir başkanlık cumhuriyetine dönüşür."
 RULE_OPTION_LBA_KINGDOM:0 "Senusi Krallığı"
 RULE_OPTION_LBA_KINGDOM_DESC:0 "Kraliyet ailesi eve döner ve tazmin edilir; §8Senusi§! monarşisi mutlak yönetimle yeniden kurulur. Libya cumhuriyetini terk eder ve taç seçimleri süresiz askıya alır."
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION:0 "Sömürge Karşıtı Birlik"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC:0 "Kaddafi kalır ve Afrika ile Orta Doğu genelindeki isyanları silahlandıran bir §8Sömürge Karşıtı Birlik§! kurar. Libya devrimci hareketlerin merkezi olur; komşularını istikrarsızlaştırır ve iki kıtaya kaos yayar."
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC:0 "Birleşik Arap Cumhuriyeti"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC:0 "Kaddafi kalır ve §8Baasçılarla§! ortaklık kurup bir §8Birleşik Arap Cumhuriyeti§! inşa eder. Libya, Moritanya'dan Yemen'e uzanan pan-Arap bir devlete katılır ve Arap dünyasının jeopolitiğini yeniden şekillendirir."
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA:0 "Afrika Birleşik Devletleri"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC:0 "Kaddafi kalır ve kendisi başta olmak üzere kıtasal bir §8Afrika Birleşik Devletleri§! peşine düşer. Libya bir Afrika süper gücünün başkenti olur ve kıtanın tüm siyasi düzenini dönüştürür."
 RULE_OPTION_MNT_HISTORICAL:0 "Tarihî"
 RULE_OPTION_MNT_HISTORICAL_DESC:0 "§8Đukanović grubu§! Karadağ'ı AB'ye ve NATO'ya taşırken devlet kurumları ve ekonomi üzerindeki oligarşik denetimi pekiştirir. Karadağ, kurumları organize suç ve siyasi himaye ağlarıyla iç içe kalan, küçük ve Batı'ya hizalı bir ulus olur."
 RULE_OPTION_MNT_EUROPEAN_REFORM:0 "Reformist Yol"
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC:0 "Demokratik ve sosyal demokrat partiler oligarkları devirir; AB üyeliğini, sert yolsuzlukla mücadele reformu ve himaye ağlarının sökülmesiyle birlikte izler. Karadağ, devlet kurumlarının organize suçtan ve oligarşik egemenlikten arınmış işlediği gerçek bir liberal demokrasi olarak ortaya çıkar."
 RULE_OPTION_MNT_SERBIAN_UNION:0 "Sırp Milliyetçiliği"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC:0 "§8Sırp milliyetçi partiler§! iktidara yükselir, Sırp kültürünü ve Ortodoks Kilisesi'nin otoritesini yüceltir ve Karadağ'ı ekonomik ve siyasi olarak Sırbistan ve Rusya ile hizalar. Karadağ'ın gidişatı, bir kuşak önce kazanılan bağımsızlığı tersine çeviren Sırbistan ile siyasi birlikte zirve yapar."
 RULE_OPTION_MNT_MONARCHIST_RESTORATION:0 "Monarşist Restorasyon"
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC:0 "Karadağlı §8monarşistler ve gelenekçiler§! Petrović-Njegoš hanedanını geri getirir ve Ortodoks Hristiyanlığı devlet dini ilan eder. Karadağ, Avrupa yapılarına entegrasyon yerine, Batı düzeninin dışında Rusya'ya hizalı, kilise merkezli bir restorasyon izler."
 RULE_OPTION_MNT_NEUTRAL_HARBOUR:0 "Silahlı Tarafsızlık"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC:0 "Đukanović hükümeti hem AB/NATO entegrasyonunu hem Sırp/Rus hizalanmasını reddeder; bunun yerine İsviçre modelinde daimi silahlı tarafsızlık ilan eder. Karadağ'ın serbest limanı, stratejik Adriyatik konumundan azami ticari yarar sağlayan, tüm bloklara açık bir ticaret noktasına dönüşür."
 RULE_OPTION_MNT_SOCIALIST_REVIVAL:0 "Sosyalist Diriliş"
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC:0 "Bir §8komünist ve yeni Yugoslavyacı hareket§! iktidarı ele geçirir, ekonomiyi Titocu çizgide millileştirir ve pan-Yugoslav siyasi yapıların yeniden canlanmasını teşvik eder. Karadağ, kendi topraklarından başlayarak Yugoslav federasyonunu yeniden canlandırmaya, Güney Slav halklarını sosyalist yönetim altında birleştirmeye çalışır."
 BRM_AI_BEHAVIOR:0 "@BRM Myanmar"
 RULE_OPTION_BRM_HISTORICAL:0 "Tarihî"
 RULE_OPTION_BRM_HISTORICAL_DESC:0 "§8Ulusal Demokrasi Birliği§! göreve gelirken §8Tatmadaw§! ayrılmış sandalyelerini ve savunma bakanlıklarını korur; Rohingyalar sınır dışı edilmek yerine baskı altına alınır. Myanmar ASEAN içinde kalır, etnik isyanlar sürer ve generaller geri alamayacakları hiçbir şey kaybetmez."
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY:0 "Demokrasinin Feneri"
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY_DESC:0 "§8Ulusal Demokrasi Birliği§! ordunun anayasal rolünü söker ve etnik özerklik ile Rohingya vatandaşlığı olan federal bir devlet kurar. Myanmar çok etnikli federal bir demokrasi olur ve bölgesel ortaklıklara yönelir."
 RULE_OPTION_BRM_AN_IRON_FIST:0 "Demir Yumruk"
 RULE_OPTION_BRM_AN_IRON_FIST_DESC:0 "§8Tatmadaw§! askerî yönetimi sertleştirir ve muhalefeti ezer; etnik isyanları bastırır ve demokratik reform yönündeki uluslararası baskıyı reddeder. Myanmar ASEAN'dan ayrılır, Rohingyaları sınır dışı eder ve komşularıyla çatışmaya yönelir."
 RULE_OPTION_HOL_HISTORICAL:0 "Tarihî"
 RULE_OPTION_HOL_HISTORICAL_DESC:0 "§8İşçi Partisi§!, Fortuyn şokundan sonra ülkeyi §8Hristiyan Demokratlar§!'a devreder, §8Liberaller§! bir kuşak boyunca elinde tutar ve ardından sırayla §8Özgürlük Partisi§! ile §8Demokratlar 66§! gelir. Hollanda bu koalisyonların her birinde NATO'nun ve Avrupa Birliği'nin çapası olarak kalır."
 RULE_OPTION_HOL_OPEN_VERDICT:0 "Açık Hüküm"
 RULE_OPTION_HOL_OPEN_VERDICT_DESC:0 "Hollanda aynı parlamenter yolu yürür ama hiçbirini önceden yazmaz: seçimi hangi parti kazanırsa koalisyonu o kurar, §8popülistler§! dahil. Müttefikleri, Lahey'de bir sonraki hangi hükümetle muhatap olacaklarını hiçbir zaman tam bilemez."
 RULE_OPTION_HOL_WESTERN_MONARCHY:0 "Orange Restorasyonu"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC:0 "Yeniden kurulan stadtholderlik Tac aracılığıyla yönetir, §8Genel Devletler§! kesenin denetimini korur ve yeniden kurulan §8Batı Hindistan Şirketi§! Hollanda'yı Atlantik'e geri taşır. Surinam ve Guyana Hollanda yönetimine döner, Karayipler yardım ve büyükelçiliklerle işlenir; Lüksemburg, İrlanda ve İngiltere Orange Hanedanı'na şahsi birlikle bağlanır."
 RULE_OPTION_HOL_NATIONALIST_MONARCHY:0 "Savaşçı Taç"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC:0 "Kraliyet ayrıcalığı geri verilir, seçimler askıya alınır ve §8Hollanda Doğu Hindistan Şirketi§! Hint Okyanusu boyunca bir fetih aracı olarak yeniden kurulur. Seylan, Ümit Burnu ve Batavya güçle geri alınır; Lüksemburg, İrlanda ve İngiltere'ye evlilik sözleşmeleri yerine ültimatomlar verilir."
 RULE_OPTION_HOL_NVU:0 "Nederlandse Volks-Unie"
 RULE_OPTION_HOL_NVU_DESC:0 "§8Nederlandse Volks-Unie§! kenardan büyür, Binnenhof üzerine yürür ve muhalefet temizlenmişken ekonomiyi korporatist ve özerk çizgide yeniden biçimlendirir. Dietsland birleştirilir ve Hollanda, Fransa ve Britanya'ya karşı Cermen Avrupası'nın liderliğini talep eder."
 NEN_AI_BEHAVIOR:0 "@NEN Yeni İngiltere"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION:0 "Yeşil Dağ İsyanı"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC:0 "Ulusal hükümet, hükümet merkezini Montpelier'e taşıma yönündeki Vermont talebini reddeder ve kırgınlığın birikmesine izin verir. §8Yeşil Dağ§! ilçeleri ayaklanır ve Yeni İngiltere kendi eyaletlerinden birinde bir isyanı bastırmak zorunda kalır §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_THE_OTHER_NEW_CAPITAL:0 "Öteki Yeni Başkent"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC:0 "Başkentte bir adres için savaşacak kadar umursayan azdır; hükümet Vermont talebini kabul eder ve Montpelier'e taşınır. Yeni İngiltere kavgaya hiçbir şey harcamaz ve kuzey eyaletlerini memnun tutar §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 NIG_AI_BEHAVIOR:0 "@NIG Nijerya"
 RULE_OPTION_NIG_HISTORICAL:0 "Tarihî"
 RULE_OPTION_NIG_HISTORICAL_DESC:0 "§8Halkın Demokratik Partisi§! federal merkezi elinde tutar; Nijer Deltası'nı güçle değil af ile çözerken kuzey ile güneyi tedirgin bir dinî dengede tutar. Nijerya, istikrarsızlık yerine barış gücü ihraç eden Batı Afrika'nın çapası olarak kalır."
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY:0 "Sosyal Demokrat Nijerya"
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY_DESC:0 "§8Tüm Nijerya Halk Partisi§! iktidar partisinin hâkimiyetini kırar ve federasyonu devlet sanayisine, kamusal sağlığa ve geniş bir sosyal güvenlik ağına yöneltir. Yeniden dağıtımcı Abuja petrol gelirini ülke içinde harcar ve yabancı yatırımcılar bölgede başka yerlere bakar."
 RULE_OPTION_NIG_CHRISTIAN_NATION:0 "Hristiyan Nijerya"
 RULE_OPTION_NIG_CHRISTIAN_NATION_DESC:0 "Abuja kuzey eyaletlerinde şeriatı kaldırır ve federal hükümeti §8kilise§! etrafında yeniden kurar; direnen vaizlere karşı Hristiyan milisleri devreye alır. Kuzey pazarlıkla değil güçle yatıştırılır ve Nijerya'nın Müslüman komşuları soğuklaşır."
 RULE_OPTION_NIG_CALIPHATE:0 "Batı Afrika Hilafeti"
 RULE_OPTION_NIG_CALIPHATE_DESC:0 "Şeriat kuzey eyaletlerinden yayılır; §8Boko Haram§! hükümetle savaşmak yerine hükümetin içinde oturana kadar sürer ve federal cumhuriyet yerini bir hilafete bırakır. Nijerya'nın komşuları, Batı Afrika'nın en büyük ordusuna komuta eden yayılmacı bir İslam devletiyle yüzleşir."
 NKO_AI_BEHAVIOR:0 "@NKO Kuzey Kore"
 RULE_OPTION_NKO_HISTORICAL:0 "Tarihî"
 RULE_OPTION_NKO_HISTORICAL_DESC:0 "Kim Jong-il'in en küçük oğlu halef olarak hazırlanır ve devleti miras alır; §8Kore İşçi Partisi§!, §8Byungjin§!'e, yani aynı anda savaş başlıkları ve tüketim mallarına girişmeden önce generaller üzerindeki komutasını yeniden pekiştirir. Hanedan ayakta kalır, pazarcılara hoşgörü gösterilir ama asla güvenilmez ve yarımada mütareke bıraktığı yerde donmuş kalır."
 RULE_OPTION_NKO_KIM_JONG_NAM:0 "Reformcu Varis"
 RULE_OPTION_NKO_KIM_JONG_NAM_DESC:0 "Sürgündeki ağabey halefiyet mücadelesini kazanır ve §8Kore İşçi Partisi§!'ni Çin tarzı açılıma yöneltir; §8Juçe§!'yi özel ekonomik bölgeler, ortak girişimler ve eninde sonunda bir sandıkla takas eder. Pyongyang yalıtımı yatırımla değiştirir ve Seul nihayet müzakere edebileceği bir komşuya kavuşur."
 RULE_OPTION_NKO_MILITARY_JUNTA:0 "Generaller Yönetimi Alır"
 RULE_OPTION_NKO_MILITARY_JUNTA_DESC:0 "Genelkurmay her iki Kim varisini de reddeder ve iktidarı kendisi alır; §8Songun§!'u korur ve işe yararlığını aşan aileyi tasfiye eder. Çin ticareti ülkeyi doyururken ordu hiçbir partiye hesap vermez ve her komşu askerlerin yönettiği nükleer bir devlet etrafında plan yapmak zorunda kalır."
 RULE_OPTION_NRY_HISTORICAL:0 "Tarihî"
 RULE_OPTION_NRY_HISTORICAL_DESC:0 "Merkez koalisyon çöker ve §8İşçi Partisi§! hükümeti geri alır; petrol fonunu refah devletine harcar ve Norveç'i ittifakın içinde sıkıca tutar. Oslo, komşularının katıldığı Birliğin dışında kalarak barış görüşmelerini ve kalkınma yardımını kendine meslek edinir."
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES:0 "Hristiyan Merkez"
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_DESC:0 "§8Hristiyan Halk Partisi§! başbakanlığı korur ve aile ahlakını, kalkınma yardımını ve cömert bir mülteci kotasını ulusal politikaya yazar. Norveç ittifakla tatbikat yapar ama Brüksel'i kol mesafesinde tutar; güneydeki komşularının alamadığı göçmenleri kabul eder."
 RULE_OPTION_NRY_PROGRESS:0 "Norveçliler için Norveç"
 RULE_OPTION_NRY_PROGRESS_DESC:0 "§8İlerleme Partisi§! muhalefetten çıkar ve petrol servetini dış yardıma değil vergi indirimlerine, hastane koğuşlarına ve yaşlı bakımına harcar. Norveç merkezileşir, göç yasasını sertleştirir ve bir zamanlar kendisine güvenen Kuzey komşularına daha soğuk bir yüz gösterir."
 RULE_OPTION_POL_HISTORICAL:0 "Tarihî"
 RULE_OPTION_POL_HISTORICAL_DESC:0 "Polonya geçişini komünizm sonrası sol altında tamamlar, Avrupa Birliği'ne katılır ve ardından ülkeyi Moskova'ya karşı yöneten ve Washington'a yaslanan §8Hukuk ve Adalet§!'e devreder. Varşova NATO'nun en gür doğulu sesi ve Berlin ile Brüksel için kalıcı bir tahriş kaynağı olur."
 RULE_OPTION_POL_CIVIC_PLATFORM:0 "Yurttaş Platformu Yılları"
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC:0 "§8Yurttaş Platformu§! hükümeti elinde tutar ve Polonya'nın geleceğini avroya, Alman yatırımına ve beraberinde gelen fonlara bağlar. Varşova, Brüksel'in bölgedeki en güvenilir ortağı olur ve bunu yaparken Moskova'ya karşı çizgisini korur."
 RULE_OPTION_POL_WALESA:0 "Wałęsa Dönüyor"
 RULE_OPTION_POL_WALESA_DESC:0 "§8Hristiyan Demokratlar§!, Dayanışma'nın hatırasıyla Lech Wałęsa'yı cumhurbaşkanlığı sarayına geri taşır. Polonya NATO'nun içinde sıkıca kalır ve kredisini Avrupa ana akımının peşinden koşmak yerine orduyu yeniden kurmaya harcar."
 RULE_OPTION_POL_KORWIN_COMMONWEALTH:0 "Korwin ve Commonwealth"
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC:0 "Janusz Korwin-Mikke ve §8Gerçek Politika Birliği§! devleti temellerine kadar sadeleştirir ve Litvanya, Belarus ve Ukrayna'ya eşit olarak kur yapar. Yeniden canlanan Commonwealth, batı ittifakından hiç ayrılmadan Almanya ile Rusya arasında büyür."
 RULE_OPTION_POL_KORWIN_EAST:0 "Korwin Doğuya Dönüyor"
 RULE_OPTION_POL_KORWIN_EAST_DESC:0 "Janusz Korwin-Mikke ve §8Gerçek Politika Birliği§!, Polonya'nın eski hesaplarını Moskova ve Minsk ile doğrudan anlaşarak kapatır. Varşova batı kampından çıkar, Lviv üzerindeki iddiasını öne sürer ve KGAÖ'de yerini alır."
 RULE_OPTION_POL_FALANGA:0 "Falanga'nın Yükselişi"
 RULE_OPTION_POL_FALANGA_DESC:0 "Sokak milisleri ve birleşik bir milliyetçi cephe, §8Falanga§!'yı kenardan hükümete taşır. Polonya Avrupa Birliği'nden ve NATO'dan çıkarak her komşusunu huzursuz eden mezhepçi, militarize bir devlete dönüşür."
 RULE_OPTION_POL_RED_DREAM:0 "Kızıl Rüya"
 RULE_OPTION_POL_RED_DREAM_DESC:0 "İkinci bir devrim §8Polonya Sosyalist Partisi§!'ni başa geçirir ve geçişin özelleştirmelerini gömer. Polonya Batı ile ilişkisini keser, seçimleri askıya alır ve kendini bir işçi cumhuriyeti olarak yeniden kurar."
 RULE_OPTION_POL_PEOPLES_ARMY:0 "Halk Ordusu"
 RULE_OPTION_POL_PEOPLES_ARMY_DESC:0 "§8Polonyalı Komünistler Birliği§!'nin sert çizgilileri devrimi ele geçirir ve Halk Ordusu'nu devletin omurgası olarak yeniden kurar. Polonya yeni bir doğu bloğunun garnizonu olur ve batıya açık düşmanlıkla bakar."
 RULE_OPTION_ROM_HISTORICAL:0 "Tarihî"
 RULE_OPTION_ROM_HISTORICAL_DESC:0 "Iliescu ve Năstase önderliğindeki §8Sosyal Demokrat Parti§!, sanayiyi özelleştirir ve ekonomiyi yeniden kurarken yaygın yolsuzlukla yeni bir yolsuzlukla mücadele müdürlüğü aracılığıyla savaşır. Romanya NATO'ya, sonra Avrupa Birliği'ne katılır ve kişilik kültlerine değil kurumlara demirli bir Batı demokrasisi olarak güvenliğini sağlar."
 RULE_OPTION_ROM_NATIONAL_LIBERAL:0 "Liberal Cumhuriyet"
 RULE_OPTION_ROM_NATIONAL_LIBERAL_DESC:0 "§8Ulusal Liberal Parti§!, özel girişimi ve bireysel inisiyatifi serbest bırakmak için sabit oranlı vergiyi, piyasa liberalleşmesini ve yerelleşmeyi savunarak iktidara gelir. Romanya liberal, serbest piyasa ilkeleri etrafında bir Avrupa kimliği kurar ve sosyal demokrat alternatifin izin vereceğinden daha derin biçimde Batı'ya entegre olur."
 RULE_OPTION_ROM_PEASANT_PARTY:0 "Hristiyan Demokratlar Tutunuyor"
 RULE_OPTION_ROM_PEASANT_PARTY_DESC:0 "§8Hristiyan Demokrat Ulusal Köylüler Partisi§!, Demokratik Konvansiyon'un çöküşünden sağ çıkar ve kırsal yatırımı, tarımsal canlanmayı ve dinî muhafazakârlığı vurgulayarak kırsalı Romanya siyasetinin merkezinde tutar. Arazi iadesi, komünistlerin mülksüzleştirdiklerine mülklerini geri verir ve ülkenin çiftçilerine yeni düzende pay sağlar."
 RULE_OPTION_ROM_DEMOCRATIC_PARTY:0 "Avrupa Partisi"
 RULE_OPTION_ROM_DEMOCRATIC_PARTY_DESC:0 "Băsescu önderliğindeki §8Demokrat Parti§! siyasi merkezi alır, ardından ülkenin sosyal demokrat ve muhafazakâr kanatlarını açıkça Avrupa yanlısı tek bir partide birleştirir. Avrupa entegrasyonu Romanya siyasetinin belirleyici hedefi olur ve diğer tüm kaygıları Batı'ya katılma çalışmasına tâbi kılar."
 RULE_OPTION_ROM_RESTORED_MONARCHY:0 "Tacın Dönüşü"
 RULE_OPTION_ROM_RESTORED_MONARCHY_DESC:0 "Demokratik Konvansiyon yeniden toparlanır, monarşi için referandum çağırır ve §8Kral I. Mihail§! elli yıllık komünizmin ardından tacın sembolik otoritesini yeniden kurarak tahtına döner. Romanya liderliği, Moldova'dakiler, Ukrayna'dakiler ve ötesindekiler dahil tüm Romenler üzerinde tacın kadim krallık hakkını talep eder."
 RULE_OPTION_ROM_GREATER_ROMANIA:0 "Büyük Romanya"
 RULE_OPTION_ROM_GREATER_ROMANIA_DESC:0 "Corneliu Vadim Tudor'un §8Büyük Romanya Partisi§! cumhurbaşkanlığını ele geçirir, güvenlik servislerini ve basını parti-devletin araçlarına çevirir ve gücü korku ve propagandayla pekiştirir. Romanya tüm Romen topraklarının zorla birleştirilmesinin peşine düşer; Moldova'yı, Macaristan'ı, Bulgaristan'ı, Ukrayna'yı ve Sırbistan'ı tehdit ederek bölgeyi bir kriz noktasına çevirir."
 SOV_AI_BEHAVIOR:0 "@SOV Rusya"
 RULE_OPTION_SOV_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SOV_HISTORICAL_DESC:0 "Rusya, §8Birleşik Rusya§! altında iktidar dikeyini yeniden kurar, oligarkları hizaya sokar ve enerji servetini yeniden büyük güç duruşuna çevirir. Komşuları Kırım'ı alan, Donbas cumhuriyetlerini destekleyen ve sonunda Ukrayna'ya güçle yürüyen bir devletle yüzleşir."
 RULE_OPTION_SOV_OLIGARCHS:0 "Oligarkların Cumhuriyeti"
 RULE_OPTION_SOV_OLIGARCHS_DESC:0 "Rusya'yı özelleştirmelerde satın alanlar onu elinde tutar ve §8oligarklar§! devleti kendi varlıklarının holding şirketi gibi yönetir. Yabancı sermaye her kapıyı açık bulurken düzenin bedelini ordu ve kamu kasası öder."
 RULE_OPTION_SOV_LIBERAL_REFORM:0 "Liberal Dönüş"
 RULE_OPTION_SOV_LIBERAL_REFORM_DESC:0 "§8Yabloko§! ve §8Sağ Güçler Birliği§! Rusya'nın geleceği tartışmasını kazanır; mahkemelerini, basınını ve ekonomisini Batı çizgisinde yeniden kurar. Moskova komşuları üzerindeki koz gücünü Avrupa ve Amerika Birleşik Devletleri ile ortaklıkla takas eder."
 RULE_OPTION_SOV_COMMUNIST_REVIVAL:0 "Kızıl Diriliş"
 RULE_OPTION_SOV_COMMUNIST_REVIVAL_DESC:0 "§8Rusya Federasyonu Komünist Partisi§!, özelleştirmeleri geri alma ve Sovyet cumhuriyetlerini yeniden toplama vaadiyle iktidara gelir. Ülke içinde yeniden millileştirme ve dışarıda yeniden canlanan bir doğu bloğu Rusya'yı yeniden rakip bir kampın başına koyar."
 RULE_OPTION_SOV_NATIONALIST:0 "Büyük Rusya"
 RULE_OPTION_SOV_NATIONALIST_DESC:0 "§8Liberal Demokrat Parti§! kırgınlığın sırtında iktidara biner ve Rusya'ya borçlu olduğuna inandığı her sınırın peşine düşer. Baltık'tan Orta Asya'ya komşular, muhatap olunacak devletler olmaktan çıkıp öne sürülecek taleplere dönüşür."
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK:0 "Ulusal Bolşevik Düzen"
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK_DESC:0 "§8Ulusal Bolşevikler§! kızılı ve kahverengiyi ne liberallere ne oligarklara hesap veren devrimci bir devlette kaynaştırır. Rusya Rus topraklarını güçle toplar ve Sovyet sonrası sınırları geçici bir hakaret sayar."
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE:0 "Demir Cumhurbaşkanı"
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE_DESC:0 "Dmitri Medvedev cumhurbaşkanlığını geri vermeyi reddeder ve devraldığı güvenlik devletinin üzerine kendine ait bir tane kurar. İkili yönetim açıkça kopar ve selefinin çevresindeki adamlar Rus siyasetinden sürülür."
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL:0 "Medvedev'in Yumuşaması"
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL_DESC:0 "Dmitri Medvedev modernleşme programını gerçeğe dönüştürür; güvenlik servislerinin kıskacını gevşetir ve Batı teknolojisine ve sermayesine kur yapar. Rusya içeride liberalleşir, dışarıda yumuşar ve siloviki tartışmayı kesin olarak kaybeder."
 SAU_AI_BEHAVIOR:0 "@SAU Suudi Arabistan"
 RULE_OPTION_SAU_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SAU_HISTORICAL_DESC:0 "§8Suud Hanedanı§! kesintisiz bir halefiyetle tahtı korur, petrol gelirini petrolden uzaklaşan çeşitlendirmeye harcar ve Pekin bir yumuşama sağlayana dek İran'ı çevrelerken Amerikan güvenlik ilişkisini sürdürür. Suudi Arabistan Körfez'in çapası ve boyunca uzanan her monarşinin kıdemli ortağı olarak kalır."
 RULE_OPTION_SAU_KHALEEJI_UNION:0 "Körfez Birliği"
 RULE_OPTION_SAU_KHALEEJI_UNION_DESC:0 "Krallık Körfez İşbirliği Konseyi'ni bir konuşma kulübünden tek bir devlete taşır; önce ortak para birimi ve ortak komuta, ardından Riyad altında siyasi birlik. Daha küçük Körfez monarşileri tümüyle emilir ve bağımsız ülkeler olarak varlıkları sona erer."
 RULE_OPTION_SAU_FAISALITE_KINGDOM:0 "Faysal Restorasyonu"
 RULE_OPTION_SAU_FAISALITE_KINGDOM_DESC:0 "Kraliyet ailesindeki gerici bir akım halefiyeti kazanır, §8Vehhabi ulemayı§! Kral Faysal döneminde sahip olduğu otoriteye geri getirir ve yabancı parayı ve yabancı üsleri ülkeden çıkarır. Krallık ya sınırını tümüyle kapatır ya da kendini Müslüman dünyasını her iki süper güce karşı yöneten üçüncü bir kutup olarak kurar."
 RULE_OPTION_SAU_MILITARY_RULE:0 "Subayların Darbesi"
 RULE_OPTION_SAU_MILITARY_RULE_DESC:0 "Ulusal Muhafız ayrıcalıklarını korurken fonsuz bırakılan düzenli ordu Kral'ı devirir ve §8Yüksek Askerî Konsey§! aracılığıyla yönetir. Subaylar, artık Riyad adına kimin konuştuğunu bilmeyen bir Körfez'i yönetir ve hâkimiyetleri satın alabildikleri meşruiyet kadar sürer."
 RULE_OPTION_SAU_BAATHIST_REPUBLIC:0 "Arap Sosyalist Cumhuriyeti"
 RULE_OPTION_SAU_BAATHIST_REPUBLIC_DESC:0 "Monarşi gidince §8Arap Baas Partisi§! cumhuriyeti alır, ekonominin kilit alanlarını millileştirir ve orduyu Arap birliğinin öncüsü olarak yeniden kurar. Yarımada genelindeki yabancı garnizonlara süre verilir ve her Arap başkenti tek bir devlete davet edilir."
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC:0 "Şii Cumhuriyeti"
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC_DESC:0 "Doğu Eyaleti'nin uzun süre bastırılmış §8Şii partileri§! cumhuriyeti devralır ve anayasal bir çözümle Humeynici yol arasında seçim yapar. Körfez'in en büyük petrol rezervleri taraf değiştirir ve Tahran on yıllardır aradığı müttefike kavuşur."
 RULE_OPTION_SAU_PEOPLES_REPUBLIC:0 "Kızıl Cumhuriyet"
 RULE_OPTION_SAU_PEOPLES_REPUBLIC_DESC:0 "§8Komünist Parti§! cumhuriyeti alır, petrol sahalarını doğrudan millileştirir ve yarımadayı Arap dünyası genelinde devrimin üssüne çevirir. Riyad ya Moskova ile anlaşma imzalar ya da bağlantısızlar bloğuna önderlik eder ve Körfez monarşileri sınırlarında bir düşmanla uyanır."
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC:0 "Demokratik Deney"
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC_DESC:0 "§8Ulusal Demokratik Meclis§! kurucu seçimleri kazanır ve seçilmiş bir Meclis, bağımsız bir yargı ve özgür bir basınla liberal bir anayasa yazar. Batı Körfez'de ilk Arap demokrasisini kazanır ve komşu her monarşi neden demokrasi olmadığını açıklamak zorunda kalır."
 SIN_AI_BEHAVIOR:0 "@SIN Singapur"
 RULE_OPTION_SIN_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SIN_HISTORICAL_DESC:0 "§8Halkın Eylem Partisi§! adadaki kesintisiz hâkimiyetini korur, başbakanlığı Goh Chok Tong'dan Lee Hsien Loong'a, ardından Lawrence Wong'a devreder ve sağlam bir savunmayı herkesi konuşarak yatıştıran bir dış politikayla eşler. Singapur, Güneydoğu Asya'nın zengin, silahlı ve bağlantısız arabulucusu olarak kalır; Washington'a dosttur, Pekin'e açıktır."
 RULE_OPTION_SIN_OPPOSITION_VICTORY:0 "Muhalefet Kazanıyor"
 RULE_OPTION_SIN_OPPOSITION_VICTORY_DESC:0 "Seçim reformu §8Halkın Eylem Partisi§!'nin kıskacını gevşetir ve §8İşçi Partisi§! liberalleşme dalgasıyla hükümete biner. Singapur NATO'ya ve Avrupa'ya yaslanan Batı tarzı bir demokrasiye dönüşür ve bölge yönetilen tek parti yönetimi modelini kaybeder."
 RULE_OPTION_SIN_LOOK_EAST:0 "Doğuya Bak"
 RULE_OPTION_SIN_LOOK_EAST_DESC:0 "§8Halkın Eylem Partisi§! yabancı varlıkları millileştirir, Çin medya modelini benimser ve adayı Şanghay İşbirliği Örgütü'ne ve BRICS'e sokar. Singapur Pekin'in yörüngesinde bir ekonomik şampiyon olur ve hükmettiği boğazlar tarafsız su olmaktan çıkar."
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS:0 "Boğazların Efendisi"
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS_DESC:0 "§8Halkın Eylem Partisi§! içindeki sert çizgililer muhalefeti yasaklar, orduyu öne koyar ve şehir devletin servetini Johor ve Riau Adaları üzerindeki iddialara çevirir. Singapur bağımlı olduğu boğazlarda şart dikte etmeye başlar ve Malezya ile Endonezya, onlar için savaşmaya hazır küçük bir komşu bulur."
 KOR_AI_BEHAVIOR:0 "@KOR Güney Kore"
 RULE_OPTION_KOR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_KOR_HISTORICAL_DESC:0 "Seul kurumlarını reformdan geçirir, insan haklarını savunur ve Kuzey'e karşı savunmacı bir duruş sürdürürken iktidar liberal §8Milenyum Demokrat Parti§! ile muhafazakâr §8Büyük Ulusal Parti§! arasında değişir. Güney Kore Amerikan ittifakına demirli kalırken Asya'nın büyük bir tüccarına dönüşür."
 RULE_OPTION_KOR_SUNSHINE:0 "Güneş Politikası"
 RULE_OPTION_KOR_SUNSHINE_DESC:0 "§8Milenyum Demokrat Parti§! iktidarını korur, istihbarat servisini dizginler ve Pyongyang ile yakınlaşmayı sürdürürken Kore güvenliği Koreli ellerde olsun diye Amerikan asker varlığını azaltır. Washington yarımadadaki en sağlam dayanak noktasını kaybeder; Pekin ve Pyongyang konuşmaya istekli bir Seul bulur."
 RULE_OPTION_KOR_HARDLINE:0 "Sert Muhafazakârlar"
 RULE_OPTION_KOR_HARDLINE_DESC:0 "Muhafazakâr §8Büyük Ulusal Parti§! yerleşir, nispi temsili kaldırır ve Japonya ile Kuzey karşıtı bir koalisyon kurarken Kim rejimini içeriden çökertmeye çalışır. Yarımadanın soğuk savaşı keskinleşir ve Pyongyang tek kurşun atmadan kendisini devirmeye kararlı bir Güney ile yüzleşir."
 RULE_OPTION_KOR_YUSIN:0 "Yusin Restorasyonu"
 RULE_OPTION_KOR_YUSIN_DESC:0 "Muhafazakârlar iktidarı ele geçirir, §8Park Chung-hee§!'yi yüceltir, sıkıyönetim ilan eder ve §8Yusin§! diktatörlüğünü askerî ve istihbarat yönetimi altında yeniden kurar; ardından bölünmeyi güçle çözmeye hazırlanır. Kuzey fetihe kararlı silahlı bir güney rejimiyle yüzleşir ve Kuzeydoğu Asya ikinci bir Kore Savaşı'na hazırlanır."
 CSA_AI_BEHAVIOR:0 "@CSA Güney Cumhuriyeti"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH:0 "Güney Amerika"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC:0 "Güney Cumhuriyeti eski Amerikan fikrine sadık kalır ve birliği kendi bayrağı altında yeniden kurmaya girişir. Kendini ayrılıkçı değil, Amerika Birleşik Devletleri'nin meşru halefi olarak sunar §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_GOLDEN_CIRCLE_PATH:0 "Altın Daire"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC:0 "Cumhuriyet, Konfederasyon'un Körfez ve Karayipler çevresinde bir imparatorluk kurma tasarısı olan §8Altın Daire§!'yi canlandırır. Güney Cumhuriyeti geleceği için güneye bakar ve komşuları kendilerini birinin nüfuz alanının içinde bulur §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_SOUTHERN_ARCADIA_PATH:0 "Doğu Kimliği"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC:0 "Ne Amerikan ne de Konfederasyon mirasını taşımak istemeyen cumhuriyet, Cajun ve Creole mirası üzerine yeni bir kimlik kurar. Körfez kıyısı kimsenin halef devleti olmak yerine kendi başına bir ulus olur §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH:0 "Florida Ayaklanması"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC:0 "Güneyli milliyetçiler Florida sonucunu reddeder ve çalıntı dedikleri bir hükümete karşı silaha sarılır. Genç cumhuriyet ilk yıllarında kendini yarıp açar §Rve bu yol yalnızca ABD kuralı Birleşik Sonrası Dönem veya Büyük Çöküş olarak ayarlanmışsa vardır§!."
 RULE_OPTION_SPR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SPR_HISTORICAL_DESC:0 "§8Halk Partisi§! ve §8İspanyol Sosyalist İşçi Partisi§! hükümeti birbirine devreder; Aznar'ı Moncloa'da Zapatero, Rajoy ve Sánchez izler. İspanya Avrupa Birliği'nin ve NATO'nun kararlı bir üyesi olarak kalır ve özerk topluluklarını gergin ama bozulmamış bir anayasa içinde tutar."
 RULE_OPTION_SPR_CONSERVATIVE:0 "Muhafazakâr İspanya"
 RULE_OPTION_SPR_CONSERVATIVE_DESC:0 "§8Halk Partisi§! Cortes'i bir kuşak boyunca elinde tutar ve piyasa liberali, Atlantikçi bir çizgide yönetir. İspanya NATO'nun sağlam bir üyesi ve Brüksel'de maceraya girmeyen bir ortak olarak kalır."
 RULE_OPTION_SPR_SOCIALIST:0 "Sosyalist İspanya"
 RULE_OPTION_SPR_SOCIALIST_DESC:0 "§8İspanyol Sosyalist İşçi Partisi§! ve daha geniş sol bir kuşak boyunca iktidarı elinde tutar ve refah devletini kendinden önceki her hükümetten öteye taşır. İspanya Avrupa'daki sosyal demokrat argüman olur ve Akdeniz'i de peşinden çeker."
 RULE_OPTION_SPR_NATIONALIST:0 "Milliyetçi Diriliş"
 RULE_OPTION_SPR_NATIONALIST_DESC:0 "§8Vox§! ve milliyetçi sağ kenardan çıkar ve hükümeti alır. İspanya özerk topluluklara ve göçe karşı döner; Brüksel'i izlemek yerine onunla tartışır."
 RULE_OPTION_SPR_FALANGIST:0 "Ulusal Sendikalizm"
 RULE_OPTION_SPR_FALANGIST_DESC:0 "§8Falanj§! siyasi çölden döner ve devleti ulusal-sendikalist modelde yeniden kurar. Cortes yerini dikey sendikalara bırakır ve İspanya Avrupa'ya değil Portekiz'e ve eski imparatorluğuna bakar."
 RULE_OPTION_SPR_COMMUNIST:0 "Kızıl Cumhuriyet"
 RULE_OPTION_SPR_COMMUNIST_DESC:0 "§8İspanya Komünist Partisi§!, sosyalistlerin almadığı devleti alır ve cumhuriyet Marksist çizgide yeniden kurulur. İspanya Batı kampını geride bırakır ve NATO güney kanadını kaybeder."
 RULE_OPTION_SPR_MONARCHIST:0 "Mutlak Taç"
 RULE_OPTION_SPR_MONARCHIST_DESC:0 "Taç ve kilise devletin merkezine geri konur ve İspanya kaybettiği imparatorluğu geri almaya girişir. Cebelitarık, Mağrip ve eski genel valilikler tarih olarak değil bitmemiş iş olarak görülür."
 RULE_OPTION_SWE_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SWE_HISTORICAL_DESC:0 "İsveç, §8Sosyal Demokrat§! ve §8Ilımlı§! önderliğindeki hükümetler arasında değişir, Avrupa Birliği'nde kalır, Kuzey ve Baltık ortaklıklarını korur ve askerî bağlantısızlığı ancak Rusya tehditkâr hâle geldiğinde NATO uğruna bırakır. Anayasal monarşiye dokunulmaz ve Baltık en güvenilir Batılı ortağını korur."
 RULE_OPTION_SWE_NATIONALIST:0 "Önce İsveç"
 RULE_OPTION_SWE_NATIONALIST_DESC:0 "§8İsveç Demokratları§! göç ve kanun-düzen temelinde hükümete fırlar, sınırları kapatır, zorunlu askerliği ve toprak savunmasını yeniden kurar ve demokratik düzenden ayrılmadan Brüksel'e mesafe koyar. İsveç içe döner ve komşuları bölgenin en açık ortağını kaybeder."
 RULE_OPTION_SWE_NORTHERN_CROWN:0 "Kuzeyin Aslanı"
 RULE_OPTION_SWE_NORTHERN_CROWN_DESC:0 "Milliyetçi yükseliş iktidarı kraliyet yönetimini yeniden kuran ve Finlandiya'yı, Baltık kıyısını ve İskandinavya'yı antlaşmayla ya da savaşla bir İsveç tacı altında yeniden birleştirmeye girişen §8Monarşistlere§! verir. Kuzey ve Baltık devletleri kapılarında revizyonist bir büyük güçle yüzleşir."
 RULE_OPTION_SWE_RED_SWEDEN:0 "Kızıl İsveç"
 RULE_OPTION_SWE_RED_SWEDEN_DESC:0 "§8Sol Parti§! ve komünist hareket Riksdag'ı alır, sanayiyi millileştirir, NATO'yu ve Batı yaptırımlarını sorgular ve İsveç'i Rusya'ya, Çin'e ve BRICS'e yöneltir. Batı Baltık'ta örnek bir ortağı kaybeder, Moskova kuzey kanadında bir dost kazanır."
 RULE_OPTION_SWE_ARMED_NEUTRALITY:0 "Silahlı Tarafsızlık"
 RULE_OPTION_SWE_ARMED_NEUTRALITY_DESC:0 "§8Yeşil Parti§! önderliğinde bir hükümet her bloku reddeder, silahlı tarafsızlığı yasaya işler ve total savunmayı, Gotland'ı ve siber güvenliği kendi imkânlarıyla finanse eder. İsveç NATO'nun dışında ve büyük güç hizalanmasının dışında kalır."
 SWI_AI_BEHAVIOR:0 "@SWI İsviçre"
 RULE_OPTION_SWI_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SWI_HISTORICAL_DESC:0 "İsviçre silahlı tarafsızlığını korur, Birleşmiş Milletler'e katılır, yurt dışına barış gücü gönderir ve kendini üyelik yerine ikili anlaşmalarla Avrupa Birliği'ne bağlarken §8İsviçre Halk Partisi§! federal koalisyonun en büyük partisi olarak kalır. Avrupa, Alpler'de her tarafla ticaret yapan ve hiçbirine katılmayan güvenilir bir tarafsıza sahip olmaya devam eder."
 RULE_OPTION_SWI_EURO_ATLANTIC:0 "Avrupa-Atlantik Entegrasyonu"
 RULE_OPTION_SWI_EURO_ATLANTIC_DESC:0 "§8Sosyal Demokrat Parti§! hükümete önderlik eder ve İsviçre tarafsızlığı bırakır, NATO'ya katılır ve Avrupa Birliği üyeliği için başvurur. Batı ittifakı Fransa, Almanya, Avusturya ve İtalya arasında bir Alp çapası kazanır."
 RULE_OPTION_SWI_FORTRESS:0 "Kale İsviçre"
 RULE_OPTION_SWI_FORTRESS_DESC:0 "§8İsviçre Halk Partisi§! ülkeyi içe çevirir; Brüksel'den ve Birleşmiş Milletler'den uzak durur, paralı asker ihraç eder ve dağ kalelerini yeniden kurar. Avrupa bir ortağını kaybeder, kimsenin kendi tarafında sayamadığı bir kirpi kazanır."
 RULE_OPTION_SWI_SOCIALIST_REPUBLIC:0 "İsviçre Sosyalist Cumhuriyeti"
 RULE_OPTION_SWI_SOCIALIST_REPUBLIC_DESC:0 "Federasyon dağıtılır ve komünist tek partili bir cumhuriyet bankaları millileştirir, Avrupa Birliği'ni kınar ve her bloğun dışında kalır. Avrupa, Alpler'de Batı entegrasyonunu tümüyle reddeden ideolojik bir rakip bulur."
 RULE_OPTION_SWI_NATIONAL_FRONT:0 "Ulusal Cephe"
 RULE_OPTION_SWI_NATIONAL_FRONT_DESC:0 "Federasyon dağıtılır ve yeniden canlanan §8Ulusal Cephe§!, Fransız, İtalyan ve Avusturya Alpleri ile Liechtenstein'ı bir Alp Federasyonu için talep eden tek partili bir devlet kurar. İsviçre'nin komşuları Avrupa'nın kalbinde intikamcı bir güçten toprak talepleriyle yüzleşir."
 SYR_AI_BEHAVIOR:0 "@SYR Suriye"
 RULE_OPTION_SYR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SYR_HISTORICAL_DESC:0 "Hafız Esad'ın yerine oğlu Beşar geçer; §8Suriye Arap Sosyalist Baas Partisi§!'ni iktidarda tutar, Hariri suikastından sonra Lübnan'dan çıkmaya zorlanır ve Arap Baharı'na tavizle değil iç savaşla karşılık verir. Bu yolda iç savaş kesindir ve İslam Devleti'nin ondan yükselmesi çok muhtemeldir; rejim ise Rus ve İran desteğiyle ayakta kalır."
 RULE_OPTION_SYR_IRON_LADY:0 "Suriye'nin Demir Hanımı"
 RULE_OPTION_SYR_IRON_LADY_DESC:0 "Büşra Esad, kardeşlerinden önce cumhurbaşkanlığını alır ve Suriye'yi büyük güçler arasında Körfez ve Batı'ya meyilli bir çizgide yönlendirir; orduyu Lübnan'dan çeker, sağlığı ve sanayiyi modernleştirir. Levant, komşularının korkmak yerine ticaret yapabileceği, temkinli ve kalkınmacı bir Suriye kazanır."
 RULE_OPTION_SYR_SYRIAN_SAVAGE:0 "Suriyeli Vahşi"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC:0 "Mahir Esad devleti §8Suriye Arap Silahlı Kuvvetleri§!'ne devreder, Lübnan'ı ilhak eder ve Ürdün'e, Iraka, Körfez'e ve İsrail'e dönük bir Büyük Suriye için yeniden silahlanır. Levant, önceden temkinli bir aktör varken toprak fethine kararlı saldırgan bir güçle yüzleşir."
 RULE_OPTION_SYR_NEW_ASSAD:0 "Yeni Esad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC:0 "Şam Baharı'nın sürmesine izin verilir ve Rıfat Esad dış destekle başında sürgünden döner; §8Arap Demokratik Partisi§! Suriye'yi Suudi Arabistan'a ve Körfez'e bağlar. Körfez monarşileri Şam'da bir Arap müttefik kazanır; Rusya ve İran Akdeniz'deki dayanak noktalarını kaybeder."
 RULE_OPTION_SYR_SECULAR_COALITION:0 "Laik Koalisyon"
 RULE_OPTION_SYR_SECULAR_COALITION_DESC:0 "Şam Baharı Esad dönemine son verir ve §8Suriye Demokratik Halk Partisi§!'nin önderlik ettiği laik bir koalisyon serbest seçimi kazanır; oligarkları ve güvenlik devletini söker. Suriye Avrupa'ya ve Amerika Birleşik Devletleri'ne yönelir ve bölgesel denge Tahran ile Moskova'dan uzaklaşır."
 RULE_OPTION_SYR_MUSLIM_BROTHERHOOD:0 "Müslüman Kardeşler"
 RULE_OPTION_SYR_MUSLIM_BROTHERHOOD_DESC:0 "Şam Baharı Esad dönemine son verir ve §8Suriye Müslüman Kardeşleri§! serbest seçimi kazanır; Türkiye ve Katar'ın finanse ettiği, Türk tarzı muhafazakâr bir demokrasi kurar. Suriye Türk yörüngesinde Sünni önderlikli bir devlet olur ve İran ile Rusya'nın Şam üzerindeki nüfuzu solar."
 RULE_OPTION_SYR_NATIONAL_FRONT:0 "Ulusal İlerici Cephe"
 RULE_OPTION_SYR_NATIONAL_FRONT_DESC:0 "Şam Baharı Esad dönemine son verir ama §8Ulusal İlerici Cephe§! serbest seçimi Esadlar olmadan kazanır ve Şam'da devletçi ve milliyetçi bir hükümeti sürdürür. Suriye İran nüfuzunu kovar, Rusya ile bağlarını yeniden doğrular ve İsrail ve Türkiye ile sert pazarlıkçı kalır."
 SIA_AI_BEHAVIOR:0 "@SIA Tayland"
 RULE_OPTION_SIA_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SIA_HISTORICAL_DESC:0 "§8Thai Rak Thai§! ve halefleri, Demokratlar ve saray itiraz ederken seçimleri kazanır; mahkemeler yapmadığında generaller hükümeti darbelerle geri alır. Tayland bölgesel bir bloka önderlik etmeyen Batılı bir antlaşma müttefiki olarak kalır ve ilhakçı iddialarını uykuda bırakır."
 RULE_OPTION_SIA_GREATER_THAILAND:0 "Büyük Tayland"
 RULE_OPTION_SIA_GREATER_THAILAND_DESC:0 "Tayland yeniden silahlanır ve Laos, Kamboçya, kuzey Malay devletleri ve Şan sınır bölgeleri üzerindeki iddialarını öne sürer. Bangkok anakara Güneydoğu Asya'nın hegemonu olur ve komşuları buna göre silahlanır."
 RULE_OPTION_SIA_REGIONAL_PACT:0 "Bölgesel Pakt"
 RULE_OPTION_SIA_REGIONAL_PACT_DESC:0 "Tayland §8SEATO§!'yu, Washington yerine Bangkok'tan yönetilen bir Güneydoğu Asya savunma paktı olarak yeniden kurar. Bölge kendi güvenlik mimarisini kazanır ve büyük güçler Güneydoğu Asya ile birleşik bir blok olarak muhatap olmak zorunda kalır."
 RULE_OPTION_SIA_PEOPLES_REPUBLIC:0 "Halk Cumhuriyeti"
 RULE_OPTION_SIA_PEOPLES_REPUBLIC_DESC:0 "§8Tayland Komünist Partisi§! ormandan döner ve iktidarı ele geçirmek için Isan yoksullarını toplar. Tayland Amerikan yörüngesini terk eder ve Pekin ile Hint-Çin'e yaklaşır."
 RULE_OPTION_SIA_REFORMIST:0 "Turuncu Devrim"
 RULE_OPTION_SIA_REFORMIST_DESC:0 "§8İleri Hareket§! kuşağı iktidarı kazanır, orduyu dizginler ve sarayı sorgular; sonuç belki bir cumhuriyet olur. Generaller Bangkok üzerindeki vetolarını kaybeder ve Güneydoğu Asya'nın en eski monarşilerinden biri ya kendini yeniden kurmak ya da düşmek zorunda kalır."
 PMR_AI_BEHAVIOR:0 "@PMR Transdinyester"
 RULE_OPTION_PMR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_PMR_HISTORICAL_DESC:0 "Tiraspol, İgor Smirnov'un ve cumhuriyetini devralan halefleri elinde kalır; Kişinev ile görüşmeleri Rus gazına, rublesine ve barış güçlerine daha derin bağımlılıkla takas eder. Dinyester çatışması donmuş kalır ve Moldova'nın yerleşim diyebileceği hiçbir şeyi olmaz."
 RULE_OPTION_PMR_DEMOCRATIC:0 "Kişinev'e Köprüler"
 RULE_OPTION_PMR_DEMOCRATIC_DESC:0 "Transdinyester iktidarı §8liberallerine§! verir, savaş dönemi güvenlik aygıtını söker ve federal bir ortak olarak Moldova'ya doğru yolunu müzakere eder. Moskova Dinyester'deki dayanak noktasını kaybeder ve Avrupa Birliği çözülmüş bir sınır kazanır."
 RULE_OPTION_PMR_REPUBLICAN:0 "Cumhuriyetçi Dönüş"
 RULE_OPTION_PMR_REPUBLICAN_DESC:0 "§8Cumhuriyet§! partisi Tiraspol'u temiz yönetim, küçük işletmeler ve kimseye hesap vermeyen bir bağımsızlık programıyla alır. Transdinyester Rus garnizonu olmaktan çıkar ve devlet olmaya çalışmaya başlar."
 RULE_OPTION_PMR_COMMUNIST:0 "Kızıl Bayrağın Yeniden Tesisi"
 RULE_OPTION_PMR_COMMUNIST_DESC:0 "§8Komünist Parti§! Tiraspol'da iktidara döner, Sheriff holdinglerini millileştirir ve yeniden canlandırılmış bir Moldova SSC davasını yeniden açar. Kişinev, çözüm değil topraklarını geri isteyen bir komşuyla yüzleşir."
 RULE_OPTION_PMR_MONARCHIST:0 "Dinyester'de Taç"
 RULE_OPTION_PMR_MONARCHIST_DESC:0 "§8Monarşistler§! Dinyester'de bir hükümdar taçlandırır ve Transdinyester'i imparatorluk Rusyası'nın hayatta kalan son parçası olarak yeniden kurar. Tiraspol Sovyet nostaljisini bir saray, bir muhafız ve daha eski bir meşruiyet iddiasıyla takas eder."
 RULE_OPTION_PMR_MILITARY_JUNTA:0 "Generalin Cumhuriyeti"
 RULE_OPTION_PMR_MILITARY_JUNTA_DESC:0 "General Aleksandr Lebed, savunduğu cumhuriyeti yönetmek için Krasnoyarsk'tan geri çağrılır ve §814. Ordu subayları§! onunla birlikte bakanlıkları alır. Transdinyester Moskova'nın iznini beklemek yerine Kişinev ve Bükreş'e karşı silahlanır."
 RULE_OPTION_PMR_UKRAINIAN:0 "Kiev'e Doğru"
 RULE_OPTION_PMR_UKRAINIAN_DESC:0 "Tiraspol Rus hamilerini kovar, yerlerine Ukraynalı subayları ve yöneticileri davet eder ve Ukrayna'ya katılımı referanduma götürür. Dinyester Rusya'nın batı karakolu olmaktan çıkar ve Kiev'in doğu sınırı olur."
 PMR_sub_behavior:0 "@PMR Transdinyester Alt Davranışı"
 PMR_PASSIVE_DEFAULT:0 "Ekonomik Öncelik"
 PMR_PASSIVE_DEFAULT_DESC:0 "Transdinyester dikkatini ekonomik koluna verir ve siyasete dokunmaz. Tiraspol, Moldova sınırında sessiz bir donmuş çatışma olarak kalır."
 PMR_SHERIFF:0 "Sheriff Cumhuriyeti"
 PMR_SHERIFF_DESC:0 "Tiraspol, §8Sheriff§! holdinginin içinde kurulduğu devleti emmesine izin verir; ta ki şirketin kendi güvenlik kolu cumhuriyetin hesabını verene dek. Transdinyester parlamentosu tarafından değil en büyük işletmesi tarafından yönetilir hâle gelir."
 RULE_OPTION_TUR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_TUR_HISTORICAL_DESC:0 "Bankacılık krizi §8Fazilet Partisi§!'ni yok eder ve ondan ayrılan §8Adalet ve Kalkınma Partisi§! ülkeyi alır. Türkiye Orta Doğu'da ve Balkanlar'da Yeni Osmanlıcı diplomasiye yönelirken cumhurbaşkanlığı yavaş yavaş parlamentoyu aşar."
 RULE_OPTION_TUR_KEMALIST_GUARD:0 "Kemalizm'in Bekçileri"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC:0 "İslamcılar yeniden toparlanamadan yasaklanır ve §8laik cumhuriyet§! Genelkurmay'ın ardında saf tutar. Türkiye NATO'ya demirli kalır ve Kürt sorununa reformla değil orduyla karşılık verir."
 RULE_OPTION_TUR_GREY_WOLVES:0 "Bozkurtlar"
 RULE_OPTION_TUR_GREY_WOLVES_DESC:0 "§8Milliyetçi sağ§! meclisi kazanır, seçimlere son verir ve yeniden kurulan bir Osmanlı devletinin başına sultan taçlandırır. Türkiye Trakya'da, Kafkasya'da ve Türk dünyasında taleplerini öne sürer."
 RULE_OPTION_TUR_HIZMET:0 "Hizmet Hareketi"
 RULE_OPTION_TUR_HIZMET_DESC:0 "§8Gülenci§! ağ Fazilet Partisi'nin enkazını devralır ve devleti sandık yoluyla değil mahkemeler, polis ve okullar yoluyla alır. Türkiye dışarıya ılımlı bir İslam yansıtırken kendi kurumlarını sessizce içten oyar."
 RULE_OPTION_TUR_TURKISH_LEFT:0 "Türk Solunun Dönüşü"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC:0 "Kurum karşıtı oy İslamcılar yerine §8devrimci sola§! kayar. Türkiye NATO'dan ayrılır, azınlıklarını tanır ve kendini bölgede emperyalizm karşıtı bir öncü olarak kurar."
 RULE_OPTION_TUR_GREAT_EAST:0 "Büyük Doğu"
 RULE_OPTION_TUR_GREAT_EAST_DESC:0 "Fazilet Partisi iktidara gelir, Genelkurmay'ı etkisizleştirir ve ardından cumhuriyeti ortadan kaldıran bir §8Selefi§! harekete radikalleşir. Türkiye hilafet ilan eder ve ulaşabildiği her yöne genişler."
 UKR_AI_BEHAVIOR:0 "@UKR Ukrayna"
 RULE_OPTION_UKR_HISTORICAL:0 "Tarihî"
 RULE_OPTION_UKR_HISTORICAL_DESC:0 "Turuncu Devrim Viktor Yuşçenko'yu göreve taşır, Viktor Yanukoviç ve §8Bölgeler Partisi§! cumhurbaşkanlığını geri kazanır ve Avromaydan onları süpürüp yerine Petro Poroşenko'yu, ardından Volodimir Zelenski'yi getirir. Ukrayna devrimle batıya döner ve Moskova Kırım ve Donbas ile karşılık verir."
 RULE_OPTION_UKR_DEMOCRATIC:0 "Turuncu Ukrayna"
 RULE_OPTION_UKR_DEMOCRATIC_DESC:0 "§8Bizim Ukrayna§!'nın Turuncu kampı devrimden sonra iktidarı korur; Yanukoviç'in dönüşü ya da bir Avromaydan'ın yarattığı kesinti olmadan Ukrayna'yı istikrarla Avrupa Birliği'ne ve NATO'ya yöneltir. Ukrayna Batı bloğunun doğu ucu olur ve Moskova bunu geri çevirmesi gereken bir kayıp olarak görür."
 RULE_OPTION_UKR_REGIONS:0 "Bölgeler Partisi"
 RULE_OPTION_UKR_REGIONS_DESC:0 "Viktor Yanukoviç ve §8Bölgeler Partisi§! devleti elinde tutar ve onu yeniden Moskova'ya yöneltir. Avrupa anlaşması imzasız bırakılır ve ülkenin doğusu ile batısı rakip seçim bölgeleri gibi yönetilir."
 RULE_OPTION_UKR_COMMUNIST:0 "Komünist Ukrayna"
 RULE_OPTION_UKR_COMMUNIST_DESC:0 "§8Ukrayna Komünist Partisi§!, geçişin bitirmediği tartışmayı kazanır ve cumhuriyeti geri alır. Kiev Sovyetler Birliği'nden kaçmak yerine onu yeniden bir araya getirmeye çalışır."
 RULE_OPTION_UKR_SOCIALIST:0 "Sosyalist Ukrayna"
 RULE_OPTION_UKR_SOCIALIST_DESC:0 "§8Ukrayna Sosyalist Partisi§! iktidara gelir ve eski kızıl bayrağa uzanmadan ülkeyi yeniden dağıtım ve kamu mülkiyeti üzerine yeniden kurar. Oligarklar hâkimiyetlerini kaybeder ve Kiev Brüksel'den de Moskova'dan da eşit uzaklıkta durur."
 RULE_OPTION_UKR_NATIONALIST:0 "Ukrayna Milliyetçiliği"
 RULE_OPTION_UKR_NATIONALIST_DESC:0 "§8Ukrayna İsyancı Ordusu§!'nın mirasçıları iktidara gelir ve devleti milliyetçi gelenek etrafında yeniden kurar. Ukrayna Batı'nın izin vermesini beklemeden Moskova ile yüzleşir ve Rusça konuşan bölgeleri kendilerine kur yapılmaz, yönetilir."
 RULE_OPTION_UKR_VITRENKO:0 "Vitrenko"
 RULE_OPTION_UKR_VITRENKO_DESC:0 "Nataliya Vitrenko'nun §8İlerici Sosyalist Partisi§! ülkeyi Ortodoksluğu, Sovyet nostaljisini ve kendi kadın siyaseti anlayışını kaynaştıran bir programla alır. Ukrayna Batı'ya karşı sertçe döner ve Avrupa teklifini düşmanca bir eylem olarak okur."
 RULE_OPTION_ENG_HISTORICAL:0 "Tarihî"
 RULE_OPTION_ENG_HISTORICAL_DESC:0 "§8İşçi Partisi§! Blair ve Brown altında yönetmeyi sürdürür; ardından §8Muhafazakârlar§! göreve gelir ve başbakanlığı bir lider dizisine devreder, ta ki İşçi Partisi Starmer altında geri dönene dek. Britanya Avrupa Birliği'nden ayrılır, Amerikan ittifakını korur ve Birliği bir arada tutar."
 RULE_OPTION_ENG_RISE_OF_BRITAIN:0 "Britanya'nın Yükselişi"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC:0 "Britanya parlamenter demokrasi olarak kalır ve imparatorluğu fetihle değil satın alarak yeniden kurar; eski sömürgelerinin basınını, partilerini ve bakanlıklarını satın alır. Karayipler'den Pasifik'e hükümetler tek kurşun atılmadan yeniden Londra'ya hesap verir."
 RULE_OPTION_ENG_RULE_BRITANNIA:0 "Hükmet Britanya"
 RULE_OPTION_ENG_RULE_BRITANNIA_DESC:0 "Tacın taraftarları iki partili sistemi kırar, hareketlerini ülkenin gerilemesinden kurar ve iktidarı doğrudan alır. İmparatorluk güçle yeniden kurulur ve Britanya Washington'un küçük ortağı olmaktan çıkar."
 RULE_OPTION_USA_HISTORICAL:0 "Tarihî"
 RULE_OPTION_USA_HISTORICAL_DESC:0 "Beyaz Saray gerçek takvimle Bush'tan Obama'ya, Trump'a ve Biden'a geçer; Trump ikinci dönem için geri döner ve ülke Teröre Karşı Savaş'ı ve Irak Savaşı'nı yürütür. Amerika Birleşik Devletleri bütün kalır ve Batı ittifakının çapası olmayı sürdürür."
 RULE_OPTION_USA_DEMOCRATS:0 "Demokrat Dönem"
 RULE_OPTION_USA_DEMOCRATS_DESC:0 "§8Demokrat Parti§! her başkanlık seçimini silip süpürür ve dönem boyunca merkez soldan yönetir. Amerika Birleşik Devletleri dünyaya çok taraflı kurumlar ve diplomatik çabayla önderlik eder."
 RULE_OPTION_USA_REPUBLICANS:0 "Cumhuriyetçi Dönem"
 RULE_OPTION_USA_REPUBLICANS_DESC:0 "§8Cumhuriyetçi Parti§! her başkanlık seçimini silip süpürür ve merkez sağdan yönetir. Amerika Birleşik Devletleri dünya düzenini askerî güçle ve güç kullanma tehdidiyle korur."
 RULE_OPTION_USA_GREAT_REBELLION:0 "Büyük İsyan"
 RULE_OPTION_USA_GREAT_REBELLION_DESC:0 "Hileli bir sayım iktidarı başkansız yöneten bir geçici Kongre'ye verir ve partiler sonuç yüzünden birbirini parçalar. Amerikan oyuna duyulan güven çöker ve süper güç yurt dışında meşruiyetini kaybeder."
 RULE_OPTION_USA_GREEN:0 "Yeşil Zafer"
 RULE_OPTION_USA_GREEN_DESC:0 "Seçim reformu iki parti kilidini kırar ve §8Yeşil Parti§! Beyaz Saray'ı ve Kongre'yi kazanır. Amerika Birleşik Devletleri ekolojiye ve silahsızlanmaya yönelerek içe döner ve küresel askerî rolünden geri çekilir."
 RULE_OPTION_USA_BULL_MOOSE:0 "Boğa Geyiği Dirilişi"
 RULE_OPTION_USA_BULL_MOOSE_DESC:0 "Seçim reformu §8İlerici Parti§!'yi canlandırır ve parti tröst karşıtı, refahı genişleten bir programla iktidara gelir. Amerika Birleşik Devletleri küresel hâkimiyet yerine kendi kalkınmasına odaklanan müreffeh, oturmuş bir güç olur."
 RULE_OPTION_USA_DEMSOC:0 "Demokratik Sosyalistler"
 RULE_OPTION_USA_DEMSOC_DESC:0 "§8Demokratik Sosyalistler§! başkanlığı ve Kongre'yi kazanır, sanayiyi millileştirmeye ve refahı genişletmeye başlar. Amerikan ekonomisi devlet mülkiyetine ve yeniden dağıtıma doğru içe döner."
 RULE_OPTION_USA_SHEPARD:0 "Çobanın Komünü"
 RULE_OPTION_USA_SHEPARD_DESC:0 "Anarko-komünist §8Çoban§! hareketi reform sonrası seçimleri kazanır ve komünal, adem-i merkeziyetçi bir toplum kurar. Amerika Birleşik Devletleri özerk komünlere bölünür ve birleşik bir devlet olarak işlemeyi bırakır."
 RULE_OPTION_USA_LIBERTARIAN:0 "Liberteryen Zafer"
 RULE_OPTION_USA_LIBERTARIAN_DESC:0 "§8Liberter Parti§! başkanlığı ve Kongre'yi kazanır ve federal hükümeti anayasal temellere indirger. Amerika Birleşik Devletleri yabancı üslerden ve taahhütlerden çekilir, dünyayı kendi başına bırakır."
 RULE_OPTION_USA_REFORM_PARTY:0 "Reform Partisi Zaferi"
 RULE_OPTION_USA_REFORM_PARTY_DESC:0 "§8Reform Partisi§! yolsuzluk karşıtı, korumacı bir programla kazanır ve Washington'a dengeli bütçe dayatır. Amerika Birleşik Devletleri kendi ekonomisini yönetmek için içe döner ve küresel liderlikten çekilir."
 RULE_OPTION_USA_CONSTITUTION_PARTY:0 "Anayasa Partisi Zaferi"
 RULE_OPTION_USA_CONSTITUTION_PARTY_DESC:0 "§8Anayasa Partisi§! sıkı anayasacılık ve toplumsal muhafazakârlık programıyla kazanır. Amerika Birleşik Devletleri ittifaklardan çekilir ve sınırlarını ve değerlerini yurt içinde savunmaya odaklanır."
 RULE_OPTION_USA_NATIONALIST_FRONT:0 "Milliyetçi Cephe"
 RULE_OPTION_USA_NATIONALIST_FRONT_DESC:0 "§8Milliyetçi Cephe§! sağcı popülist, korumacı bir programla ve göçe karşı sert bir çizgiyle iktidarı kazanır. Cumhuriyet ayakta kalır ama liberal uluslararası düzene karşı keskin biçimde döner."
 RULE_OPTION_USA_MILITARY_JUNTA:0 "Askerî Cunta"
 RULE_OPTION_USA_MILITARY_JUNTA_DESC:0 "Ordu Milliyetçi Cephe'den iktidarı alır ve devleti doğrudan denetimi altına alır. Amerika Birleşik Devletleri yarım küre hâkimiyetini güçle arar ve komşuları için bir tehdit olur."
 RULE_OPTION_USA_FASCIST:0 "Amerikan Doğalcılar"
 RULE_OPTION_USA_FASCIST_DESC:0 "Faşist bir hareket olan §8Amerikan Doğalcılar§! iktidarı ele geçirir ve yönetimini güç ve ideolojiyle pekiştirir. Amerika Birleşik Devletleri Karayipler'de ve Latin Amerika'da fethe yönelir ve totaliter bir imparatorluk kurar."
 RULE_OPTION_USA_MONARCHY:0 "Amerikan Hanedanı"
 RULE_OPTION_USA_MONARCHY_DESC:0 "Milliyetçi Cephe hükümetinden bir Amerikan hanedanı taçlandırılır ve Washington'da kalıtsal bir monarşi kurar. Amerika Birleşik Devletleri cumhuriyetçiliği terk eder ve imparatorluk hâkimiyetini yeniden kurma emelleri olan bir krallık olur."
 RULE_OPTION_USA_RED_JUNTA:0 "Kızıl Cunta"
 RULE_OPTION_USA_RED_JUNTA_DESC:0 "Komünist bir askerî komiserlik Çoban komününden iktidarı alır ve komünist devleti militarize eder. Amerika Birleşik Devletleri yarım küre genelinde ve ötesinde silahlı mücadele planları olan devrimci bir güç olur."
 RULE_OPTION_USA_TROTSKYIST:0 "Sürekli Devrim"
 RULE_OPTION_USA_TROTSKYIST_DESC:0 "§8Sosyalist İşçi Partisi§! iktidarı ele geçirir ve Amerika Birleşik Devletleri'ni sürekli, dünya çapında devrime adar. Amerikan orduları komünizmi her kıtaya zorla yaymak için yurt dışına yürür."
 RULE_OPTION_USA_ANARCHIST:0 "Anarşist Toplum"
 RULE_OPTION_USA_ANARCHIST_DESC:0 "Anarşist hareket ülkeyi özerk komünlerden oluşan devletsiz bir federasyona kolektifleştirir. Amerika Birleşik Devletleri tanınabilir bir devlet olarak işlemeyi bırakır ve kendi kendini yöneten toplulukların yamalı bohçasına dönüşür."
 RULE_OPTION_USA_POST_UNITED:0 "Birleşik Sonrası Dönem"
 RULE_OPTION_USA_POST_UNITED_DESC:0 "On yıllık protesto, baskı ve felç edici bir demiryolu grevi federal hükümeti kırar ve Amerika Birleşik Devletleri halef cumhuriyetlere bölünür. Süper güç bölgesel rakiplere dağılır ve dünya Soğuk Savaş sonrası çapasını kaybeder."
 RULE_OPTION_USA_GREAT_COLLAPSE:0 "Büyük Çöküş"
 RULE_OPTION_USA_GREAT_COLLAPSE_DESC:0 "Amerika Birleşik Devletleri iç çelişkiler altında bir anda çöker ve eyaletler kendi başına bırakılır. Süper güç bir gecede içe çöker ve dünya düzenin başlıca garantörünü kaybeder."
 VEN_AI_BEHAVIOR:0 "@VEN Venezuela"
 RULE_OPTION_VEN_HISTORICAL:0 "Tarihî"
 RULE_OPTION_VEN_HISTORICAL_DESC:0 "Şavizm, sosyal misyonları finanse ederek, petrol sanayisini devlet elinde tutarak, bir Küba ortaklığıyla ve savaşsız §8Birleşik Sosyalist Parti§! altında sürer. Karakas pembe dalgayı finanse ederken Washington bunu bir sorun olarak görür."
 RULE_OPTION_VEN_WORLD_REVOLUTION:0 "Devrimi İhraç Et"
 RULE_OPTION_VEN_WORLD_REVOLUTION_DESC:0 "§8Bolivarcı Devrim§! komünleri silahlandırır, Kolombiya üzerine yürür ve And Dağları ile Güney Koni boyunca ayaklanmaları körükler. Güney Amerika kapısında bir devrim savaşı bulur."
 RULE_OPTION_VEN_DEMOCRATIC_OPPOSITION:0 "Demokratik Muhalefet"
 RULE_OPTION_VEN_DEMOCRATIC_OPPOSITION_DESC:0 "Demokratik muhalefet Şavizm'i devirir, Washington ile bağları yeniden kurar ve orduyu Amerikan çizgisinde yeniden donatır. Bolivarcı blok finansörünü kaybeder ve Karayipler Batı yanlısı bir Venezuela kazanır."
 RULE_OPTION_VEN_CORPORATE_STATE:0 "Şirket Devleti"
 RULE_OPTION_VEN_CORPORATE_STATE_DESC:0 "Muhalefet ülkeyi bankaların, sanayicilerin ve devlet petrol şirketinin yönettiği tekelci bir şirket cumhuriyeti kuran PDVSA yönetim kuruluna devreder. Venezuela bayrağı olan bir petrol işletmesine dönüşür ve bölgenin sağıyla hizalanır."
 RULE_OPTION_VEN_FREE_MARKET:0 "Serbest Piyasa Cumhuriyeti"
 RULE_OPTION_VEN_FREE_MARKET_DESC:0 "Muhalefet devlet ekonomisini deregülasyon ve orduya kadar her şeyin özelleştirilmesiyle söker. Venezuela, yabancı sermayenin akın ettiği liberteryen bir deneye dönüşür."
 RULE_OPTION_VEN_MILITARY_JUNTA:0 "Askerî Cunta"
 RULE_OPTION_VEN_MILITARY_JUNTA_DESC:0 "Subay kadrosu sarayı alır, muhaliflerini tasfiye eder ve yayılmacı milliyetçi bir rejim olarak yönetir. Venezuela'nın komşuları, Guyana ve Hollanda adaları, kendilerine hak iddia eden bir devletle komşu olduklarını fark eder."
 SER_AI_BEHAVIOR:0 "@SER Yugoslavya"
 RULE_OPTION_SER_HISTORICAL:0 "Tarihî"
 RULE_OPTION_SER_HISTORICAL_DESC:0 "Buldozer Devrimi'nden sonra §8Sırbistan Demokratik Muhalefeti§! iktidara gelir, savaş suçlularını iade eder ve Karadağ'ın bağımsızlık referandumunu yapmasına izin verir. Sırbistan, Kosova ile Brüksel anlaşması aracılığıyla resmî tanıma olmadan normalleşir ve Avrupa Birliği üyeliğini izler."
 RULE_OPTION_SER_GREATER_SERBIA:0 "Büyük Sırbistan"
 RULE_OPTION_SER_GREATER_SERBIA_DESC:0 "Miloşeviç ayakta kalır ve §8Sosyalist Parti§! hırsızlık yönetimini pekiştirir; Büyük Sırbistan'a yönelir ve Sırp nüfusu olan her ilçeyi talep eder. Yugoslavya savaşları yeniden başlar ve Sırp azınlığı olan her komşu hedef olur."
 RULE_OPTION_SER_BALKAN_FEDERATION:0 "Balkan Federasyonu"
 RULE_OPTION_SER_BALKAN_FEDERATION_DESC:0 "Miloşeviç ayakta kalır ve kendini yarımadanın bütünleştiricisi olarak yeniden icat eder; komşulara fetih yerine bir Balkan konfederasyonuna üyelik sunar. Bosna, Makedonya, Kosova ve diğer Balkan devletleri Belgrad'ın çatısı altına çekilir."
 RULE_OPTION_SER_SOCIALIST_YUGOSLAVIA:0 "Sosyalist Yugoslavya"
 RULE_OPTION_SER_SOCIALIST_YUGOSLAVIA_DESC:0 "Miloşeviç ülkeyi lider kültü, millileştirilmiş sanayi ve planlı ekonomiyle Tito'nun sosyalizmine geri götürür. Eski cumhuriyetlere kızıl bir Yugoslavya'ya yeniden katılmaları için ültimatom verilir."
 RULE_OPTION_SER_KINGDOM:0 "Sırbistan Krallığı"
 RULE_OPTION_SER_KINGDOM_DESC:0 "Milliyetçiler ve monarşistler Miloşeviç'i devirir; §8Karadjordjević§! tacını kilisenin ve ordunun desteğiyle yeniden kurar. Sırbistan taç ve kiliseyle yönetilir ve Kosova, Makedonya ve Bulgaristan üzerindeki eski iddialarını sürdürür."
