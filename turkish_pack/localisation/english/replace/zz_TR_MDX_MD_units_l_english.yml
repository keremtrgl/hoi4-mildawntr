 transport_helicopter:0 "Nakliye Helikopteri"
 Militia_Bat:0 "Milis"
 Militia_Bat_desc:0 "Yaya milis bölüğü. Milis birlikleri normal piyadeden daha az ağır teçhizat ve haberleşme kitine sahiptir. Bu onları çok hareketli ve zorlu arazide etkili kılar, ancak düz arazide zırhlı bir rakibe karşı hızla erir.\n\n§GTasarımcı İpucu: Milisler ucuz savunma cephesi ve Bastırma sağlar. Şehirlerde, ormanlarda ve tepelerde en iyi sonucu verirler, ancak Savunma ve Yarma değerleri zayıftır ve özellikle zırha karşı ve açık ya da sert arazide savaşta savunmasızdırlar.§!"
 Mot_Militia_Bat:0 "Motorlu Milis"
 Mot_Militia_Bat_desc:0 "Pikaplarla ya da hatta zırhlı hafif araçlarla donatılmış milis bölüğü. Milis birlikleri normal piyadeden daha az ağır teçhizat ve haberleşme kitine sahiptir. Bu onları çok hareketli ve zorlu arazide etkili kılar, ancak düz arazide zırhlı bir rakibe karşı hızla erir.\n\n§GTasarımcı İpucu: Motorlu Milis, ekonomiden biraz ödün verip Hız ve daha fazla Bastırma kazanır. Hareketli güvenlik ve ovalarda veya çöllerde ucuz sömürü için kullanın, ancak zayıf muharebe değerleri ve engebeli arazi cezaları onları kötü bir saldırı birliği yapar.§!"
 Mech_Militia_Bat:0 "Mekanize Milis"
 Mech_Militia_Bat_desc:0 "Zırhlı personel taşıyıcılarla donatılmış milis bölüğü. Milis birlikleri normal piyadeden daha az ağır teçhizat ve haberleşme kitine sahiptir. Bu onları çok hareketli ve zorlu arazide etkili kılar, ancak düz arazide zırhlı bir rakibe karşı hızla erir.\n\n§GTasarımcı İpucu: Mekanize Milis, ekonomiden daha da fazla ödün verip Hız ve daha fazla Sertlik kazanır. Uygun maliyetli, daha ağır hareketli güvenlik için ve yaya piyadeye ve topçuya karşı baskı kurmak için kullanın, ancak profesyonel mekanize birliklere kıyasla zayıf muharebe değerleri onları iyi donanımlı bir orduyla baş başa çarpışmaktan alıkoyar.§!"
 L_Inf_Bat:0 "Hafif Piyade"
 L_Inf_Bat_desc:0 "Taşıtsız Hafif Piyade Bölüğü. Modern muharebe alanında nadiren görülür, ancak orman ve dağ gibi çok zorlu arazilerde son derece etkili uzmanlaşmış birlikler vardır. Şehir garnizonu olarak da işe yarayabilir.\n\n§GTasarımcı İpucu: Hafif Piyade, taşıt gerektirmeden tepelerde, ormanlarda, dağlarda, ormanlık bölgelerde, bataklıklarda ve şehirlerde yüksek Düzen ve güçlü muharebe performansı sağlar. Zorlu araziyi elde tutmak ya da saldırmak için kullanın, ancak yavaş stratejik hareket ve ovalarda ve çöllerde daha zayıf saldırılar bekleyin.§!"
 Mot_Inf_Bat:0 "Motorlu Piyade"
 Mot_Inf_Bat_desc:0 "Motorlu Piyade Bölüğü, pikaplardan modern mayına dayanıklı araçlara kadar her türlü hafif aracı ulaşım olarak kullanır. Yolların ve açık arazinin taşıt hareketine elverdiği yerlerde hızlı muharebe alanı hareketliliği sağlarlar.\n\n§GTasarımcı İpucu: Motorlu Piyade uygun maliyetli Hız ve açık arazide iyi performans sağlar. Yarmalardan yararlanmak ve hızlı cepheleri desteklemek için kullanın, ancak araçları teçhizat talebini artırır ve ormanlarda, dağlarda, ormanlık bölgelerde, bataklıklarda ve şehirlerde etkinliklerini kaybeder.§!"
 Hvy_Mot_Inf_Bat:0 "Ağır Motorlu Piyade"
 Hvy_Mot_Inf_Bat_desc:0 "Ağır Motorlu Piyade Bölüğü, ulaşım olarak Mayına Dayanıklı Pusuya Karşı Korumalı (MRAP) araçları kullanır. Zırhlı araçları mayınlara, EYP'lere ve hafif silah ateşine karşı üstün mürettebat koruması sağlar; bu da onları pusu tehdidinin yüksek olduğu düşmanca ortamlardaki operasyonlar için ideal kılar.\n\n§GTasarımcı İpucu: Ağır Motorlu Piyade, ovalarda ve çöllerde hızlı ön cephe operasyonları için daha ağır korumalı araçlar kullanır. Daha hafif piyadeye göre daha çok teçhizat gerektirir ve daha düşük Düzen ve Siperlenmeye sahiptir, engebeli arazide ise yine önemli cezalar alır.§!"
 Mech_Inf_Bat:0 "Mekanize Piyade"
 Mech_Inf_Bat_desc:0 "Mekanize Piyade Bölüğü, ulaşım olarak Zırhlı Personel Taşıyıcıları kullanır. Düz arazide zırhlı muharebe için çok uygundur.\n\n§GTasarımcı İpucu: Mekanize Piyade, güçlü Savunmayı ve zırhlı hareketliliği ovalarda ve çöllerde iyi performansla birleştirir. Hızlı zırhlı oluşumlarda hattı tutmak için kullanın, ancak ZPT'ler pahalıdır ve saldırıları ile hareketleri ormanlarda, dağlarda, ormanlık bölgelerde ve şehirlerde zayıflar.§!"
 Arm_Inf_Bat:0 "Zırhlı Piyade"
 Arm_Inf_Bat_desc:0 "Zırhlı Piyade Bölüğü, ulaşım olarak Piyade Muharebe Araçları kullanır. Düz arazide zırhlı muharebe için çok uygundur, ancak PMA'larından uzakta yaya çalışmak zorunda kaldıkları zorlu arazide boşa giderler.\n\n§GTasarımcı İpucu: Zırhlı Piyade, mekanize piyadeden daha fazla ateş gücü, Zırh ve Yarma için PMA'ları kullanır. Açık arazide tanklarla birlikte kullanın, ancak düşük Düzenleri, yüksek teçhizat maliyetleri ve ağır dağ, ormanlık bölge, bataklık ve şehir cezaları dikkatli konuşlandırma gerektirir.§!"
 L_Air_Inf_Bat:0 "Hava İndirme Piyadesi"
 L_Air_Inf_Bat_desc:0 "Hava İndirme Hafif Piyade Bölüğü, Nakliye Uçaklarından paraşütle ya da Nakliye Helikopterleriyle Havadan Sevk konusunda özel eğitim almış seçkin piyadelerdir. Acil durumlara uzaktan hızla müdahale edebilir ve ana ordunun ilerleyişinden önce hayati hedefleri ele geçirmek üzere düşman hatlarının gerisine indirilebilirler. Ancak ulaşım biçimleri taşıyabilecekleri ağır teçhizat miktarına katı sınırlar koyar.\n\n§GTasarımcı İpucu: Hava İndirme Piyadesi yüksek Düzeni paraşütle atlama yeteneği ve zorlu arazide güçlü performansla birleştirir. Yalıtılmış hedefleri ele geçirmek ve tutmak için kullanın, ancak özel kuvvet eğitimleri ve artan piyade teçhizatı talebi onları rutin hat muharebesi için pahalı kılar.§!"
 Mot_Air_Inf_Bat:0 "Motorlu Hava İndirme Piyadesi"
 Mot_Air_Inf_Bat_desc:0 "Motorlu Hava İndirme Piyade Bölüğü, Nakliye Uçaklarından paraşütle ya da Nakliye Helikopterleriyle Havadan Sevk konusunda özel eğitim almış seçkin piyadelerdir. Acil durumlara uzaktan hızla müdahale edebilir ve ana ordunun ilerleyişinden önce hayati hedefleri ele geçirmek üzere düşman hatlarının gerisine indirilebilirler. Hafif araçları onlara indirme sonrasında büyük hareketlilik sağlar ve muharebeye daha fazla ağır teçhizat getirmelerine olanak tanır. Ancak onları araçlarla birlikte paraşütle indirmek lojistik açıdan çok daha zordur.\n\n§GTasarımcı İpucu: Motorlu Hava İndirme Piyadesi paraşütle indirmeden sonra Hız katar ve açık arazide iyi performans gösterir. Bir hava indirme gücünün hızla sömürü yapması veya takviye alması gerektiğinde kullanın, ancak araçlar teçhizat yükünü artırır ve yaya hava indirme birliklerine kıyasla Düzeni ve engebeli arazi performansını düşürür.§!"
 Mech_Air_Inf_Bat:0 "Mekanize Hava İndirme Piyadesi"
 Mech_Air_Inf_Bat_desc:0 "Mekanize Hava İndirme Piyade Bölüğü, Nakliye Uçaklarından paraşütle Havadan Sevk konusunda özel eğitim almış seçkin piyadelerdir. Acil durumlara uzaktan hızla müdahale edebilir ve ana ordunun ilerleyişinden önce hayati hedefleri ele geçirmek üzere düşman hatlarının gerisine indirilebilirler. Özel tasarlanmış Hafif Zırhlı Personel Taşıyıcıları onlara indirme sonrasında büyük hareketlilik sağlar ve daha hafif Hava İndirme kuvvetlerinden çok daha fazla ağır teçhizatı muharebeye getirmelerine olanak tanır. Ancak onları bu tür araçlarla birlikte paraşütle indirmek lojistik açıdan çok daha zordur.\n\n§GTasarımcı İpucu: Mekanize Hava İndirme Piyadesi paraşütle indirmeye ZPT koruması, Hız ve daha ağır ateş gücü getirir. Yalıtılmış hava indirme güçlerinin indikten sonra hareketli muharebede hayatta kalması gerektiğinde kullanın, ancak düşük Düzenleri, büyük teçhizat talepleri ve ağır engebeli arazi cezaları onları pahalı bir uzman seçeneği yapar.§!"
 Arm_Air_Inf_Bat:0 "Zırhlı Hava İndirme Piyadesi"
 Arm_Air_Inf_Bat_desc:0 "Zırhlı Hava İndirme Piyade Bölüğü, Nakliye Uçaklarından paraşütle Havadan Sevk konusunda özel eğitim almış seçkin piyadelerdir. Acil durumlara uzaktan hızla müdahale edebilir ve ana ordunun ilerleyişinden önce hayati hedefleri ele geçirmek üzere düşman hatlarının gerisine indirilebilirler. Özel tasarlanmış Hafif Piyade Muharebe Araçları onlara büyük hareketlilik sağlar ve normal mekanize oluşumlara karşı eşit şartlarda savaşmalarına olanak tanır. Ancak onları PMA'larıyla birlikte paraşütle indirmek lojistik açıdan son derece zordur. 2017 itibarıyla bu tür kuvvetleri yalnızca Rusya işletmiştir.\n\n§GTasarımcı İpucu: Zırhlı Hava İndirme Piyadesi, paraşütle PMA ateş gücü, Zırh ve Yarma getirir. İndirme sonrasında savunulan hedeflere meydan okumak veya düşman hareketli yedekleriyle savaşmak için kullanın, ancak çok yüksek teçhizat yükü, düşük Düzen ve zorlu arazi cezaları kayıpları pahalı hale getirir.§!"
 L_Ranger_Bat:0 "Korucular"
 L_Ranger_Bat_desc:0 "Korucular; baskınlar, doğrudan eylem ve ana kuvvetin önünde hızlı konuşlanma konusunda uzmanlaşmış seçkin hafif piyadelerdir. Hareketliliği ve sürprizi azamiye çıkarmak için hafif seyahat eder, kilit hedefleri ele geçirir ve geleneksel birlikler gelene kadar tutarlar. Bunun bedeli seyrek ağır teçhizattır; bu da onları açık arazide zırha karşı savunmasız bırakır.\n\n§GTasarımcı İpucu: Korucular düşük Muharebe Genişliğine yüksek Düzen ve olağanüstü zorlu arazi bonusları sığdırır. Seçkin dağ, orman, ormanlık bölge, bataklık veya şehir oluşumları için kullanın, ancak uzun eğitimleri, özel kuvvet sınırı ve sınırlı ağır teçhizatları kitlesel konuşlandırmayı pahalı kılar ve onları ovalarda savunmasız bırakır.§!"
 L_Ranger_Recce_Comp:0 "Korucu Keşif Müfrezesi"
 L_Ranger_Recce_Comp_desc:0 "Korucuların arasından seçilen, düşman hatlarının derinliklerine yaya sızıp düşman hareketlerini bildirmek üzere eğitilmiş bir keşif unsuru. Gizliliği Drone Keşfi ve Elektronik Gözetimle birleştirerek istihbarat toplar ve dost ateşi için hedefleri işaretler; fırsat çıktığında sınırlı baskınlar ve pusular da düzenleyebilir.\n\n§GTasarımcı İpucu: Korucu Keşif; Keşif ve Girişim ekler, topçu Yumuşak Saldırısını artırır ve zorlu arazide iyi savaşır. Seçkin keşif gerektiren özel kuvvet oluşumlarında kullanın, ancak Muharebe Genişliği ekler, özel kuvvet kapasitesini tüketir ve sınırlı doğrudan ateş gücü sağlar.§!"
 L_Marine_Bat:0 "Deniz Piyadesi"
 L_Marine_Bat_desc:0 "Deniz Piyade Bölüğü; nehir geçişleri, bataklık operasyonları ve çıkarma harekâtı gibi amfibi operasyonlarda özel eğitim almış seçkin piyadelerdir. Araçları olmadığından taşıyabilecekleri ağır teçhizat miktarına katı sınırlar vardır.\n\n§GTasarımcı İpucu: Deniz Piyadesi, araç maliyeti olmadan yüksek Düzen ve güçlü amfibi ile bataklık performansı sağlar. Köprübaşı kurmak ve sulak alanlarda savaşmak için kullanın, ancak karaya çıktıktan sonra daha yavaştırlar, özel kuvvet kapasitesini tüketirler ve açık arazide daha az etkilidirler.§!"
 Mot_Marine_Bat:0 "Motorlu Deniz Piyadesi"
 Mot_Marine_Bat_desc:0 "Motorlu Deniz Piyade Bölüğü; nehir geçişleri, bataklık operasyonları ve çıkarma harekâtı gibi amfibi operasyonlarda özel eğitim almış seçkin piyadelerdir. Hafif Piyade olarak karaya çıksalar da kara ulaşımı için hafif araçlara sahiptirler; bu onlara büyük hareketlilik sağlar ve muharebeye büyük miktarda ağır teçhizat getirmelerine olanak tanır.\n\n§GTasarımcı İpucu: Motorlu Deniz Piyadesi güçlü amfibi bonusunu korurken köprübaşından hızla genişlemek için Hız ekler. Çıkarma gücünün hızla iç bölgelere ilerlemesi gerektiğinde kullanın, ancak araçları daha fazla teçhizata mal olur ve yaya deniz piyadelerine kıyasla Düzeni ve dağ performansını düşürür.§!"
 Mech_Marine_Bat:0 "Mekanize Deniz Piyadesi"
 Mech_Marine_Bat_desc:0 "Mekanize Deniz Piyade Bölüğü; nehir geçişleri, bataklık operasyonları ve çıkarma harekâtı gibi amfibi operasyonlarda özel eğitim almış seçkin piyadelerdir. Çıkarmaları özel tasarlanmış Amfibi Zırhlı Personel Taşıyıcılarının korumasında yaptıkları için hemen büyük hareketlilikle vurmaya ve muharebeye büyük miktarda ağır teçhizat getirmeye çok iyi donanımlıdırlar.\n\n§GTasarımcı İpucu: Mekanize Deniz Piyadesi, amfibi bonusunu ZPT koruması ve çıkarma sonrası güçlü hareketlilikle birleştirir. Mekanize köprübaşlarını genişletmek ve tutmak için kullanın, ancak daha hafif deniz piyadelerinden daha az Düzene sahiptirler ve araçları ormanlarda ve dağlarda kötü performans gösterir.§!"
 Arm_Marine_Bat:0 "Zırhlı Deniz Piyadesi"
 Arm_Marine_Bat_desc:0 "Zırhlı Deniz Piyade Bölüğü; nehir geçişleri, bataklık operasyonları ve çıkarma harekâtı gibi amfibi operasyonlarda özel eğitim almış seçkin piyadelerdir. Ağır zırhlı, jet tahrikli Amfibi Piyade Muharebe Araçlarıyla su üzerinde büyük mesafeler kat edebilir ve kıyıya ulaştıklarında aynı PMA'lardan büyük ustalıkla savaşmaya hazır olurlar.\n\n§GTasarımcı İpucu: Zırhlı Deniz Piyadesi, amfibi bonusunu korurken deniz piyadeleri arasında en güçlü PMA ateş gücünü, Zırhı ve şehir muharebesi yeteneğini sağlar. Ağır savunulan limanlara karşı kullanın, ancak düşük Düzenleri, yüksek maliyetleri ve ağır dağ ve ormanlık bölge cezaları zorlu iç bölgeler için daha hafif birlikler gerektirir.§!"
 L_Air_assault_Bat:0 "Hava Taarruz Piyadesi"
 L_Air_assault_Bat_desc:0 "Hava Taarruz Piyade Bölüğü; ipli inme ve hava nakliyesinde özel eğitim almış seçkin piyadelerdir, teçhizatları bazen uçak içinde daha iyi taşınmaya olanak tanıyacak biçimde tasarlanır ya da sahada değiştirilir. Genellikle tam olarak güvenliği sağlanmamış kilit araziyi ele geçirmek ve elde tutmak, düşman hatlarının gerisindeki düşman güçleriyle doğrudan çarpışmak için kullanılırlar.\n\n§GTasarımcı İpucu: Hava Taarruz Piyadesi hızlı operasyonlar için nakliye helikopterleri kullanır ve çoğu zorlu arazide muharebe bonusları kazanır. Uzak tepeleri, ormanları, dağları, ormanlık bölgeleri, bataklıkları veya şehirleri ele geçirmek için kullanın, ancak düşük Güçleri, zayıf Siperlenmeleri ve pahalı helikopterleri uzun süreli hat muharebesini riskli kılar.§!"
 attack_helo_bat:0 "Taarruz Helikopteri Filosu"
 attack_helo_bat_desc:0 "Taarruz helikopteri filoları, geniş bir cephede hızlı tanksavar vuruşları ve yakın destek için döner kanatlı gunship'leri toplu halde bir araya getirir.\n\n§GTasarımcı İpucu: Taarruz Helikopterleri hızlı zırhlı ateş gücü ve ovalarda ve çöllerde güçlü saldırılar sağlar. Yarmaları takviye etmek veya açık arazide zırhlıları avlamak için kullanın, ancak çok düşük Düzen ve Güçleri, pahalı uçakları ve şehirlerde, dağlarda, ormanlarda ve ormanlık bölgelerde zayıf performansları uzun süreli muharebeyi tehlikeli kılar.§!"
 attack_helo_comp:0 "Taarruz Helikopteri Uçuşu"
 attack_helo_comp_desc:0 "Taarruz helikopteri uçuşu, ön cephe oluşumlarına hızlı gunship desteği ve hareketli tanksavar ateş gücü sağlar.\n\n§GTasarımcı İpucu: Taarruz Helikopteri Uçuşu, Muharebe Genişliği olmadan hızlı zırhlı ateş gücü ekler. Piyade, hareketli, zırhlı veya deniz piyadesi tümenleri için esnek destek olarak kullanın, ancak uçaklar ve komuta teçhizatı pahalıdır ve şehirlerde ve ormanlık bölgelerde daha az etkili saldırır.§!"
 Special_Forces:0 "Özel Harekât Kuvvetleri"
 Special_Forces_desc:0 "Özel Harekât Kuvvetleri, bulundukları her ordunun seçkinleridir; herkesten daha uzun ve daha zorlu eğitim alırlar. Zorlu arazide, hava indirme operasyonlarında ve amfibi çıkarmalarda uzmandırlar. Ancak cephe gerisinde hareketli çalışmaları gerekebileceğinden çok hafif donatılmışlardır.\n\n§GTasarımcı İpucu: Özel Harekât Kuvvetleri, paraşütle atlama ve kıyıdan tahliye yeteneğiyle olağanüstü Düzen, Toparlanma ve geniş arazi bonusları sunar. En zorlu baskınlar ve çekişmeli hedefler için kullanın, ancak geniş Muharebe Genişlikleri, çok uzun eğitimleri, özel kuvvet sınırı ve hafif teçhizatları onları sıradan hat piyadesi olarak uygunsuz kılar.§!"
 armor_Bat:0 "Tank Bölüğü"
 armor_Bat_desc:0 "Tank Bölüğü, var olan en ağır zırhlı araçları, yani Ana Muharebe Tanklarını barındırır. Düz arazide mükemmel hareketlilikleri ve şiddetli doğrudan ateşleriyle, düşman ön hatlarında delikler açmak üzere tasarlanmışlardır; bu delikler ardından gelen mekanize piyade birlikleri tarafından hızla sömürülür.\n\n§GTasarımcı İpucu: Tanklar yüksek Zırh, Yarma ve sert hedef ateş gücünü ovalarda ve çöllerde mükemmel bonuslarla sunar. Taarruz tümenlerinin öncüsü olarak kullanın, ancak pahalı tank ve komuta teçhizatı tüketirler, Düzenleri düşüktür ve ormanlarda, dağlarda, ormanlık bölgelerde, bataklıklarda ve şehirlerde ağır cezalar alırlar.§!"
 armor_Comp:0 "Tank Müfrezesi"
 armor_Comp_desc:0 "Tank Takımı yalnızca var olan en ağır zırhlı araçlardan, yani Ana Muharebe Tanklarından oluşur. Düz arazide üstün hareket kabiliyeti ve şiddetli doğrudan ateşe sahip olan bu takımlar, düşman cephe hatlarında delikler açmak için tasarlanmıştır; bu gediklerden ardıl mekanize piyade birlikleri hızla yararlanır.\n\n§GTasarımcı İpucu: Tank Takımı, Cephe Genişliği harcamadan Zırh, Yarma ve hareketli ateş gücü ekler. Uygun piyade veya hareketli oluşumları açık arazi çatışmasına hazırlamak için kullanın; ancak tankları ve komuta teçhizatı pahalıdır, dağlarda, ormanlarda ve bataklıklarda yavaşlar ve zayıf saldırır.§!"
 Militia_Recce_Comp:0 "Milis Keşif Takımı"
 Militia_Recce_Comp_desc:0 "Milis Keşif Bölükleri, milis oluşumlarının önünü keşfetmek için Hafif Hizmet Araçları ve sınırlı haberleşme teçhizatı kullanır. Özellikle yerleşik alanlarda düşman mevzilerinin ucuz bir şekilde keşfedilmesini sağlarlar.\n\n§GTasarımcı İpucu: Milis Keşif, Cephe Genişliği harcamadan Keşif ve Girişim ekler; şehirlerde ve süper şehirlerde özellikle iyi performans gösterir. Milis taktiklerini ucuza geliştirmek için kullanın; ancak yalnızca milislere açıktır ve doğrudan çatışma gücüne az katkı sağlar.§!"
 L_Recce_Comp:0 "Piyade Keşif Takımı"
 L_Recce_Comp_desc:0 "Piyade Keşif Bölükleri yaya hareket eder; bu nedenle onları etkili bir muharebe birimi yapan ağır teçhizatın büyük kısmından yoksundur. Düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca sınırlı baskın ve pusu düzenleyebilirler. Keşif Bölükleri, eski Süvari birliklerinden devraldıkları miras nedeniyle çoğu zaman 'Filo' olarak anılır.\n\n§GTasarımcı İpucu: Piyade Keşif, Cephe Genişliği harcamadan Keşif ve Girişim ekler; ormanlarda, dağlarda, tropik ormanlarda ve tepelerde küçük bonuslar da sağlar. Yaya, hava indirme, hava hareketli, deniz veya özel kuvvetler tümenlerinde kullanın; ancak diğer keşif unsurlarından daha fazla İnsan Gücü gerektirir ve ateş gücüne az katkı yapar.§!"
 Mot_Recce_Comp:0 "Motorlu Keşif Takımı"
 Mot_Recce_Comp_desc:0 "Motorlu Keşif Bölükleri Hafif Hizmet Araçlarıyla çalışır ve teçhizatlarının büyük kısmı Piyade emsallerininkiyle aynıdır. Ancak görevleri farklıdır. Düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca sınırlı baskın ve pusu düzenleyebilirler. Keşif Bölükleri, eski Süvari birliklerinden devraldıkları miras nedeniyle çoğu zaman 'Filo' olarak anılır.\n\n§GTasarımcı İpucu: Motorlu Keşif, yaya keşif unsurlarından daha fazla Keşif ve Girişim sağlar, hareketli oluşumlarla aynı hızda ilerler ve açık arazide hareket kabiliyeti ekler. Motorlu veya deniz tümenlerinde kullanın; ancak Hafif Hizmet Araçları maliyeti artırır ve dağlarda, ormanlarda ve bataklıklarda yavaşlar.§!"
 Mech_Recce_Comp:0 "Mekanize Keşif Takımı"
 Mech_Recce_Comp_desc:0 "Mekanize Keşif Bölükleri Zırhlı Personel Taşıyıcılarla çalışır ve teçhizatlarının büyük kısmı Piyade emsallerininkiyle aynıdır. Ancak görevleri farklıdır. Düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca sınırlı baskın ve pusu düzenleyebilirler. Keşif Bölükleri, eski Süvari birliklerinden devraldıkları miras nedeniyle çoğu zaman 'Filo' olarak anılır.\n\n§GTasarımcı İpucu: Mekanize Keşif, Cephe Genişliği harcamadan yüksek Keşif ve Girişim sağlar, ZPT'li oluşumlarla aynı hızda ilerler ve ovalarda hareketi iyileştirir. Zırhlı veya deniz tümenlerinde kullanın; ancak ZPT ve destek teçhizatı maliyeti yüksektir ve dağlarda ile bataklıklarda yavaşlar.§!"
 Arm_Recce_Comp:0 "Ağır Mekanize Keşif Takımı"
 Arm_Recce_Comp_desc:0 "Ağır Mekanize Keşif Bölükleri Piyade Muharebe Araçlarıyla çalışır ve teçhizatlarının büyük kısmı Zırhlı Piyade emsallerininkiyle aynıdır. Ancak görevleri farklıdır. Düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca baskın ve pusu düzenleyebilirler. Keşif Bölükleri, eski Süvari birliklerinden devraldıkları miras nedeniyle çoğu zaman 'Filo' olarak anılır.\n\n§GTasarımcı İpucu: Ağır Mekanize Keşif, Piyade Muharebe Aracı korumasıyla ve Cephe Genişliği harcamadan yüksek Keşif ve Girişim sağlar. Ovalarda veya çöllerde görev yapan zırhlı veya deniz tümenlerinde kullanın; ancak Piyade Muharebe Araçları pahalıdır ve ormanlarda, dağlarda, tropik ormanlarda ve bataklıklarda hareket zorlaşır.§!"
 Drone_Recce_Comp:0 "İnsansız Keşif Takımı"
 Drone_Recce_Comp_desc:0 "Görüş hattının ötesine gözlemi genişletmek için küçük insansız hava sistemleri kullanan İnsansız Keşif Takımı, keşif unsurlarını doğrudan ateşe maruz bırakmadan muharebe alanı farkındalığını artırır. Bu insansız araçlar güzergâhları hızla tarayabilir, düşman mevzilerini belirleyebilir ve karmaşık arazide hedefleri doğrulayarak daha hızlı karar almayı ve daha isabetli ateş desteğini mümkün kılar.\n\n§GTasarımcı İpucu: İnsansız Keşif yüksek Keşif ve Girişim sağlar, diğer keşif unsurlarını güçlendirir ve topçu saldırılarını iyileştirir. İnsansız araçları karşılayabilen hareketli veya zırhlı tümenlerde kullanın; ancak Cephe Genişliği ve İkmal Tüketimi ekler, Siper değerini düşürür ve şehirlerde ile dağlarda kötü performans gösterir.§!"
 L_arm_Bat:0 "Hafif Tank Bölüğü"
 L_arm_Bat_desc:0 "Hafif Tank Bölüğü, olağanüstü hareket kabiliyetini göz kamaştırıcı durdurma gücüyle birleştiren, çoğunlukla tekerlekli özel Hafif Tanklarla çalışır. Doğrudan çatışmada her türlü Piyadeye karşı kendilerini savunabilirler. Ancak doğrudan çatışma asıl görevleri değildir; düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca önemli düşman varlıklarına ve mekanize oluşumlara karşı baskın ve pusu düzenleyebilirler.\n\n§GTasarımcı İpucu: Hafif Tanklar hızlı zırhlı ateş gücü sağlar ve ovalarda ile çöllerde güçlü saldırır. Zorlayıcı keşif ve harekâttan yararlanma için kullanın; ancak koruma ve doğrudan çatışma güçleri daha düşüktür ve engebeli arazi etkinliklerini ciddi şekilde azaltır.§!"
 A_L_arm_Bat:0 "Hava İndirme Hafif Tank Bölüğü"
 A_L_arm_Bat_desc:0 "Hafif Tank Bölüğü, olağanüstü hareket kabiliyetini göz kamaştırıcı durdurma gücüyle birleştiren, çoğunlukla tekerlekli özel Hafif Tanklarla çalışır. Doğrudan çatışmada her türlü Piyadeye karşı kendilerini savunabilirler. Ancak doğrudan çatışma asıl görevleri değildir; düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca önemli düşman varlıklarına ve mekanize oluşumlara karşı baskın ve pusu düzenleyebilirler. Bu birlikler ayrıca paraşütçü unsurlarla hava indirme harekâtı yürütebilir ve anında yakın zırhlı destek sağlayabilir.\n\n§GTasarımcı İpucu: Hava İndirme Hafif Tanklar, indirme oluşumlarına çıkarmadan sonra hareketli Zırh ve araç karşıtı ateş gücü kazandırır. Hava indirme birliklerini açık arazide hareketli düşmana karşı desteklemek için kullanın; ancak özel araçlar pahalıdır ve dağlarda, ormanlarda, bataklıklarda ve şehirlerde ağır cezalar alır.§!"
 armor_Recce_Comp:0 "Zırhlı Keşif Takımı"
 armor_Recce_Comp_desc:0 "Zırhlı Keşif Takımı, olağanüstü hareket kabiliyetini göz kamaştırıcı durdurma gücüyle birleştiren özel Keşif Hafif Tanklarıyla çalışır. Doğrudan çatışmada her türlü Piyadeye karşı kendilerini savunabilirler. Ancak doğrudan çatışma asıl görevleri değildir; düşmanın faaliyetlerini gözlemleyip bildirmek için ona yaklaşarak sızarlar ve istihbarat toplamak için hem İHA Keşfinden hem de Elektronik Gözetlemeden yararlanırlar. Ayrıca önemli düşman varlıklarına ve mekanize oluşumlara karşı baskın ve pusu düzenleyebilirler. Keşif Bölükleri, eski Süvari birliklerinden devraldıkları miras nedeniyle çoğu zaman 'Filo' olarak anılır.\n\n§GTasarımcı İpucu: Zırhlı Keşif, geleneksel keşif unsurları arasında en yüksek Keşif ve Girişimi sağlar, ayrıca Cephe Genişliği harcamadan tank savar hareketliliği ekler. Açık arazideki tank oluşumlarında kullanın; ancak keşif tankları ve komuta teçhizatı pahalıdır ve ormanlarda, dağlarda, tropik ormanlarda ve bataklıklarda hareket keskin biçimde düşer.§!"
 L_Engi_Comp:0 "İstihkâm Bölüğü"
 L_Engi_Comp_desc:0 "İstihkâmcılar geçici köprü ve savunma çevresi inşası, mayın döşeme ve temizleme ile bomba imhasını üstlenir. Savunma amaçlı temel piyade silahları taşırlar.\n\n§GTasarımcı İpucu: İstihkâm Bölükleri Siperi artırır, piyadenin istihkâmlarda, şehirlerde, ormanlarda ve bataklıklarda saldırmasına ve savunmasına yardım eder, dağlarda ise savunmayı ve hareketi iyileştirir. Savunma odaklı veya engebeli arazi tümenlerinde kullanın; ancak Cephe Genişliği, İnsan Gücü ve teçhizat maliyeti ekler, doğrudan ateş gücüne az katkı sağlar.§!"
 H_Engi_Comp:0 "Ağır İstihkâm Bölüğü"
 H_Engi_Comp_desc:0 "İstihkâmcılar geçici köprü ve savunma çevresi inşası, mayın döşeme ve temizleme ile bomba imhasını üstlenir. Savunma amaçlı temel piyade silahları taşırlar. Özel inşaat ve kurtarma araçları sayesinde, muharebede devre dışı kalan teçhizatı cepheden kurtarmak için iyi donatılmışlardır.\n\n§GTasarımcı İpucu: Ağır İstihkâm Bölükleri, standart istihkâmcılardan daha fazla Siper ve daha güçlü istihkâm, kent, dağ ve bataklık bonusları sağlar. Değerli taarruz veya savunma oluşumlarında kullanın; ancak yüksek İnsan Gücü ve teçhizat ihtiyacı onu pahalı bir destek seçeneği yapar.§!"
 Arty_Bat:0 "Topçu Bataryası"
 Arty_Bat_desc:0 "Güçlü dolaylı ateş yetenekleriyle Topçu, muharebe alanında ihtiyaç duyulan yerde ve görüş menzillerinin çok ötesinde sürekli hassas vuruşlar sağlar. Mürettebatı tarafından doğrudan yeniden doldurulabilir. Hareket için dış araçlara ihtiyaç duyduğundan vuruşlar arasında yer değiştirmesi güç olabilir; bu da onu düşman topçusunun karşı vuruşlarına karşı savunmasız kılar. Hafif ve düşük kalibreli sistemler elle çekilebilir ve nakliye uçaklarına sığabildiği için hava indirme harekâtlarına uygundur.\n\n§GTasarımcı İpucu: Topçu Bataryası önemli ölçüde Yumuşak Saldırı ekler ve paraşütle indirilebilir; bu da onu piyade ağırlıklı kuvvetlere karşı etkili kılar. Yaya oluşumlara taarruz ateş gücü kazandırmak için kullanın; ancak düşük Düzeni ve Dayanıklılığı, artan Cephe Genişliği ve engebeli arazide hareket cezaları onu koruyacak yeterli piyadeyi gerektirir.§!"
 Arty_Battery:0 "Topçu Takımı"
 Arty_Battery_desc:0 "Güçlü dolaylı ateş yetenekleriyle Topçu, muharebe alanında ihtiyaç duyulan yerde ve görüş menzillerinin çok ötesinde sürekli hassas vuruşlar sağlar. Mürettebatı tarafından doğrudan yeniden doldurulabilir. Hareket için dış araçlara ihtiyaç duyduğundan vuruşlar arasında yer değiştirmesi güç olabilir; bu da onu düşman topçusunun karşı vuruşlarına karşı savunmasız kılar. Hafif ve düşük kalibreli sistemler elle çekilebilir ve nakliye uçaklarına sığabildiği için hava indirme harekâtlarına uygundur.\n\n§GTasarımcı İpucu: Topçu Takımı, tam bir topçu bataryasından çok daha düşük teçhizat maliyetiyle Cephe Genişliği harcamadan Yumuşak Saldırı ekler. Uygun yaya oluşumlar için ekonomik ateş desteği olarak kullanın; ancak çok düşük Düzeni ve engebeli arazi cezaları, destek görmeyen veya çok hareketli tümenlerde değerini sınırlar.§!"
 SP_Arty_Bat:0 "Kendi Yürür Topçu Bataryası"
 SP_Arty_Bat_desc:0 "Güçlü dolaylı ateş yetenekleriyle Kendi Yürür Topçu, muharebe alanında ihtiyaç duyulan yerde ve görüş menzillerinin çok ötesinde sürekli hassas vuruşlar sağlar. Mürettebatı tarafından doğrudan yeniden doldurulabilir; kendi yürür oluşu da onu hareketli kılar, böylece düşman topçusunun karşı vuruşlarından kaçınmak için yer değiştirebilir.\n\n§GTasarımcı İpucu: Kendi Yürür Topçu Bataryası, zırhlı oluşumlarla aynı hızda ilerlerken ağır Yumuşak Saldırı ekler ve ovalarda üstündür. Piyade ağırlıklı hatları yarmak için kullanın; ancak düşük Düzeni, artan Cephe Genişliği, pahalı şasisi ve engebeli arazi cezaları zırhlı koruma ve açık zemin gerektirir.§!"
 SP_arty_battery:0 "Kendi Yürür Topçu Takımı"
 SP_arty_battery_desc:0 "Güçlü dolaylı ateş yetenekleriyle Kendi Yürür Topçu, muharebe alanında ihtiyaç duyulan yerde ve görüş menzillerinin çok ötesinde sürekli hassas vuruşlar sağlar. Mürettebatı tarafından doğrudan yeniden doldurulabilir; kendi yürür oluşu da onu hareketli kılar, böylece düşman topçusunun karşı vuruşlarından kaçınmak için yer değiştirebilir.\n\n§GTasarımcı İpucu: Kendi Yürür Topçu Takımı, Cephe Genişliği harcamadan hareketli Yumuşak Saldırı ekler. Hareketli, zırhlı, deniz veya milis oluşumlar için derli toplu ateş desteği olarak kullanın; ancak özel şasi, çekili toplardan daha pahalıdır ve dağlarda, ormanlarda ve bataklıklarda zor ilerler.§!"
 SP_R_arty_Bat:0 "Kendi Yürür Roketatar Bataryası"
 SP_R_arty_Bat_desc:0 "MLRS fırlatıcıları kullanan bir Roketatar bataryası, uzaktan koca bir bölgeyi yok edebilir. Gelişigüzel ateşi, muharebe alanında hassas vuruşlar için uygun olmadığından düşmanın gerisindeki bölgelere karşı kullanılır. Özel yeniden yükleme araçları gerektirir ve yeniden yükleme süreleri uzundur.\n\n§GTasarımcı İpucu: MLRS Bataryası çok yüksek Yumuşak Saldırı ve Yarma sağlar ve açık arazide hareketli oluşumlarla aynı hızda ilerler. Yoğunlaşmış taarruz ateş gücü için kullanın; ancak Düzeni düşüktür, Cephe Genişliği ekler, pahalı roket araçları gerektirir ve dağlarda, ormanlarda, bataklıklarda ve şehirlerde zorlanır.§!"
 SP_R_arty_battery:0 "Kendi Yürür Roketatar Takımı"
 SP_R_arty_battery_desc:0 "MLRS fırlatıcıları kullanan bir Roketatar takımı, uzaktan bölgeleri yok edebilir. Gelişigüzel ateşi, muharebe alanında hassas vuruşlar için uygun olmadığından düşmanın gerisindeki bölgelere karşı kullanılır. Özel yeniden yükleme araçları gerektirir ve yeniden yükleme süreleri uzundur.\n\n§GTasarımcı İpucu: MLRS Takımı, Cephe Genişliği harcamadan güçlü hareketli Yumuşak Saldırı ve bir miktar Yarma ekler. Hareketli veya zırhlı tümenlerde derli toplu taarruz desteği olarak kullanın; ancak roket araçları pahalıdır, dayanıklılığı düşüktür ve dağlarda ile bataklıklarda hareket kabiliyetini yitirir.§!"
 SP_AA_Bat:0 "Kendi Yürür Uçaksavar Bataryası"
 SP_AA_Bat_desc:0 "Kendi yürür kısa veya orta menzilli Uçaksavar Füze Sistemleri kullanan Hava Savunma Bataryası, birliğini düşmanın Yakın Hava Destek saldırılarına karşı savunur.\n\n§GTasarımcı İpucu: Kendi Yürür Hava Savunma, zırhlı oluşumlar için yüksek Hava Saldırısı ve hareketli koruma sağlar. Düşman uçakları değerli ileri harekât kollarını tehdit ettiğinde kullanın; ancak Cephe Genişliği ekler, özel araçlar gerektirir, kara ateş gücüne az katkı sağlar ve dağlarda, ormanlarda ve bataklıklarda zor ilerler.§!"
 SP_AA_Battery:0 "Kendi Yürür Uçaksavar Takımı"
 SP_AA_Battery_desc:0 "Kendi yürür kısa veya orta menzilli Uçaksavar Füze Sistemleri kullanan Hava Savunma Takımı, birliğini düşmanın Yakın Hava Destek saldırılarına karşı savunur.\n\n§GTasarımcı İpucu: Kendi Yürür Hava Savunma Takımı, Cephe Genişliği harcamadan hareketli Hava Saldırısı ekler. Düşman hava gücü altındaki hareketli, zırhlı veya deniz tümenlerini korumak için kullanın; ancak özel şasisinin kara kuvvetlerine karşı değeri azdır ve dağlarda ile bataklıklarda daha az hareketlidir.§!"
 combat_service_support_company:0 "Muharebe Hizmet Destek Taburu"
 combat_service_support_company_desc:0 "Tümenin lojistik ve sağlık personeli ikmal dağıtımını, yaralıların tahliyesini ve ikame akışını koordine eder.\n\n§GTasarımcı İpucu: Muharebe Hizmet Desteği, İkmal ve Yakıt Tüketimini azaltırken yaralı kurtarma yoluyla İnsan Gücünü ve birlik tecrübesini korur. Büyük, tecrübeli veya ikmal açısından aç tümenlerde kullanın; ancak Cephe Genişliği ve teçhizat ekler, doğrudan muharebe değerlerini ise ciddi biçimde düşürür.§!"
 helicopter_combat_service_support:0 "Helikopter Muharebe Hizmet Destek Filosu"
 helicopter_combat_service_support_desc:0 "Helikopterle taşınan lojistik ve sağlık ekipleri, hızla konuşlanan kuvvetleri destekler ve yaralıları ileri mevzilerden tahliye eder.\n\n§GTasarımcı İpucu: Helikopter Muharebe Hizmet Desteği, kara desteğinden daha az İnsan Gücüyle daha fazla yaralı kurtarma ve daha güçlü İkmal ile Yakıt tasarrufu sağlar. Maliyetli hava hareketli veya hızlı oluşumlar için kullanın; ancak nakliye helikopterleri pahalıdır, Cephe Genişliği ekler ve muharebe katkısı asgaridir.§!"
 L_Marine_Cdo_Bat:0 "Deniz Komandoları"
 L_Marine_Cdo_Bat_desc:0 "Deniz Komando Bölüğü, diğer hafif piyade görevlerinin yanı sıra vur-kaç harekâtı yürütmek üzere eğitilmiş Deniz Akıncılarının daha büyük oluşumlarıdır.\n\n§GTasarımcı İpucu: Deniz Komandoları yüksek Düzeni, üstün amfibi, bataklık, orman ve kent saldırılarıyla birleştirir. Seçkin baskınlar ve çekişmeli çıkarmalar için kullanın; ancak özel kuvvetler sınırı, uzun eğitim süresi, hafif teçhizatı ve açık arazideki daha zayıf saldırıları kitlesel konuşlandırmayı sınırlar.§!"
 air_assault_arty_Bat:0 "Hava Hareketli Topçu Bataryası"
 air_assault_arty_Bat_desc:0 "Helikopterle askıda yük taşımasıyla nakledilen çekili top parçalarından oluşan tam bir Batarya. Hava hücum piyadesiyle hızlı hava yoluyla yer değiştirerek aynı hızda ilerleyen, hava hareketli harekât için sürekli dolaylı ateş desteği sağlar.\n\n§GTasarımcı İpucu: Hava Hareketli Topçu, helikopter oluşumlarına önemli ölçüde Yumuşak Saldırı ekler ve tepelerde, dağlarda, ormanlarda, tropik ormanlarda ve şehirlerde iyi performans gösterir. Hava hücum birliklerini zorlu arazide desteklemek için kullanın; ancak Cephe Genişliği ekler, Düzeni ve Dayanıklılığı düşüktür ve pahalı nakliye helikopterleri gerektirir.§!"
 air_assault_arty_battery:0 "Hava Hareketli Topçu Takımı"
 air_assault_arty_battery_desc:0 "Çekili top parçaları kullanan bu birlikler, toplarını askıda yük olarak taşıyarak hareket kabiliyetlerini artırır ve daha hızlı hava hareketli piyade birliklerine ayak uydurur.\n\n§GTasarımcı İpucu: Hava Hareketli Topçu Takımı, Cephe Genişliği harcamadan Yumuşak Saldırı ekler ve en iyi tepelerde, dağlarda, ormanlarda, tropik ormanlarda ve şehirlerde performans gösterir. Hava hareketli veya deniz oluşumlar için derli toplu ateş desteği olarak kullanın; ancak helikopter ve top gereksinimleri pahalıdır, ovalarda ve çöllerde daha zayıftır.§!"
 drone_tactical_company:0 "FPV İHA Takımı"
 drone_tactical_company_desc:0 "FPV sabit kanatlı ve dört pervaneli insansız hava araçları kullanan bu birlikler, hat birliklerini desteklemek için keşif ve hedefli vuruşlar gerçekleştirir.\n\n§GTasarımcı İpucu: FPV İHA Bölüğü, Cephe Genişliği harcamadan verimli Yumuşak ve Sert Saldırı ekler ve paraşütle indirilebilir. Kara insansız araçları sağlayabilen tümenlerde esnek ateş desteği için kullanın; ancak neredeyse hiç Düzeni yoktur ve sınırlı dayanıklılık için hatırı sayılır miktarda insansız araç teçhizatı gerektirir.§!"
 group_headquarters_title:0 "Karargâh"
 group_headquarters_title_desc:0 "Birlikleri muharebeye sevk etmek üzere donatılmış karargâh birlikleri"
 light_inf_hq:0 "Hafif Piyade Karargâhı"
 light_inf_hq_desc:0 "Hafif ve motorlu piyade için karargâh unsuru"
 arm_inf_hq:0 "Zırhlı Piyade Karargâhı"
 arm_inf_hq_desc:0 "Mekanize ve zırhlı piyade için karargâh unsuru."
 arm_hq:0 "Zırhlı Karargâh"
 arm_hq_desc:0 "Hafif tanklar ve ana muharebe tankları için karargâh unsuru"
 helo_hq:0 "Helikopter Karargâhı"
 helo_hq_desc:0 "Helikopter birlikleri için karargâh unsuru"
 group_light_bat_title:0 "Eksik Kadrolu Birlikler"
 group_light_bat_title_desc:0 "Kuvvet çarpanı olarak tasarlanmış, yetenekleri kısıtlı ancak eğitim süresi ve maliyeti düşük, eksik kadrolu muharebe unsurları."
 Light_Mech_Inf_Bat:0 "Eksik Kadrolu Mekanize Piyade Taburu"
 Light_Mech_Inf_Bat_desc:0 "Eksik kadrolu mekanize unsur, normal cephe işgal etmeden bir oluşumu takviye etmek için küçük bir Zırhlı Personel Taşıyıcı payı kullanır.\n\n§GTasarımcı İpucu: Eksik Kadrolu Mekanize Piyade, Cephe Genişliği harcamadan ZPT koruması ve Savunma ekler. Uygun oluşumları ovalarda, tepelerde veya şehirlerde takviye etmek için kullanın; ancak araç maliyeti, düşük Dayanıklılığı ve dağ, tropik orman, bataklık, nehir ve amfibi cezaları bağımsız muharebe değerini sınırlar.§!"
 Light_Arm_Inf_Bat:0 "Eksik Kadrolu Zırhlı Piyade Taburu"
 Light_Arm_Inf_Bat_desc:0 "Eksik kadrolu zırhlı piyade unsuru, normal cephe işgal etmeden korumalı ateş gücü eklemek için küçük bir Piyade Muharebe Aracı payı kullanır.\n\n§GTasarımcı İpucu: Eksik Kadrolu Zırhlı Piyade, Cephe Genişliği harcamadan Piyade Muharebe Aracı Zırhı ve ateş gücü ekler, en iyi ovalarda ve çöllerde performans gösterir. Değerli oluşumları takviye etmek için kullanın; ancak düşük Düzeni, pahalı araçları ve aşırı engebeli arazi, nehir ve amfibi cezaları onu çok özelleşmiş kılar.§!"
 Light_L_Air_assault_Bat:0 "Eksik Kadrolu Hava Hücum Piyade Taburu"
 Light_L_Air_assault_Bat_desc:0 "Hava Hücum Piyadesi, ip ile iniş ve hava nakliyesi konusundaki özel eğitimleriyle seçkin Piyadelerdir; teçhizatları bazen uçak içinde daha iyi taşınabilmesi için özel olarak tasarlanır veya sahada değiştirilir. Çoğunlukla tam olarak güvence altına alınmamış kilit araziyi ele geçirip elde tutmak ve düşman hatlarının gerisindeki düşman kuvvetleriyle doğrudan çatışmak için kullanılırlar.\n\n§GTasarımcı İpucu: Bu eksik kadrolu hava hücum unsuru, Cephe Genişliği harcamadan Düzen ve güçlü kent, dağ, orman, tropik orman ve bataklık bonusları ekler. Zorlu arazideki özelleşmiş oluşumları güçlendirmek için kullanın; ancak helikopter gereksinimi pahalıdır ve ovalarda, çöllerde ve amfibi saldırılarda kötü performans gösterir.§!"
 Light_attack_helo_bat:0 "Eksik Kadrolu Taarruz Helikopteri Alayı"
 Light_attack_helo_bat_desc:0 "Küçük bir taarruz helikopteri unsuru, tam bir alayın ayak izi olmadan hızlı gökten ateş desteği sağlar.\n\n§GTasarımcı İpucu: Eksik Kadrolu Taarruz Helikopterleri, Cephe Genişliği harcamadan hızlı zırhlı ateş gücü ekler ve ovalarda ile çöllerde üstündür. Derli toplu hareketli destek için kullanın; ancak çok düşük Düzeni ve Dayanıklılığı, pahalı hava araçları ve ağır dağ, tropik orman, bataklık ve kent cezaları kayıpların karşılanmasını zorlaştırır.§!"
 Light_armor_Bat:0 "Eksik Kadrolu Tank Taburu"
 Light_armor_Bat_desc:0 "Eksik kadrolu tank unsuru, normal cephe işgal etmeden bir oluşumu takviye etmek için sınırlı sayıda Ana Muharebe Tankını bir araya getirir.\n\n§GTasarımcı İpucu: Eksik Kadrolu Tanklar, Cephe Genişliği harcamadan Zırh, Yarma ve güçlü ova ile çöl saldırıları ekler. Taarruz oluşumlarını ekonomik biçimde takviye etmek için kullanın; ancak düşük Düzeni ve Dayanıklılığı, tank maliyeti ve engebeli arazide ile şehirlerde aşırı cezaları onu genel amaçlı destek olarak zayıf kılar.§!"
 Light_L_arm_Bat:0 "Eksik Kadrolu Hafif Tank Taburu"
 Light_L_arm_Bat_desc:0 "Eksik kadrolu hafif tank unsuru, daha küçük bir araç ayak iziyle hareketli tank savar ateş gücü ve zorlayıcı keşif sağlar.\n\n§GTasarımcı İpucu: Eksik Kadrolu Hafif Tanklar, Cephe Genişliği harcamadan hareketli tank savar ateş gücü ekler ve ovalarda ile çöllerde üstündür. Hızlı oluşumları araçlara karşı güçlendirmek için kullanın; ancak düşük Dayanıklılığı, özel şasisi ve ağır engebeli arazi, nehir ve amfibi cezaları esnekliği sınırlar.§!"
 Light_SP_Arty_Bat:0 "Eksik Kadrolu Kendi Yürür Topçu Taburu"
 Light_SP_Arty_Bat_desc:0 "Küçültülmüş bir kendi yürür topçu unsuru, tam bir taburdan daha az araçla hareketli dolaylı ateş sağlar.\n\n§GTasarımcı İpucu: Eksik Kadrolu Kendi Yürür Topçu, Cephe Genişliği harcamadan hareketli Yumuşak Saldırı ekler ve özellikle ovalarda, çöllerde ve şehirlerde iyi performans gösterir. Derli toplu taarruz desteği için kullanın; ancak neredeyse hiç Düzeni yoktur, Dayanıklılığı düşüktür, özel şasi maliyeti vardır ve ormanlarda, dağlarda ve tropik ormanlarda daha zayıf performans gösterir.§!"
 Light_SP_R_arty_Bat:0 "Eksik Kadrolu Kendi Yürür Roketatar Taburu"
 Light_SP_R_arty_Bat_desc:0 "Küçültülmüş bir çoklu fırlatıcılı roket unsuru, tam bir taburdan daha az araç kullanarak yoğunlaştırılmış alan ateşi sağlar.\n\n§GTasarımcı İpucu: Eksik Kadrolu Roketatar, Cephe Genişliği harcamadan güçlü hareketli Yumuşak Saldırı ekler ve ovalarda, çöllerde ve şehirlerde üstündür. Taarruz oluşumlarını takviye etmek için kullanın; ancak ihmal edilebilir Düzeni, düşük Dayanıklılığı, roket aracı maliyeti ve engebeli arazi cezaları koruma gerektirir.§!"
 Light_SP_AA_Bat:0 "Eksik Kadrolu Kendi Yürür Hava Savunma Taburu"
 Light_SP_AA_Bat_desc:0 "Küçültülmüş kendi yürür hava savunma unsuru, küçük bir hareketli uçaksavar sistemi payıyla oluşumu korur.\n\n§GTasarımcı İpucu: Eksik Kadrolu Kendi Yürür Hava Savunma, Cephe Genişliği veya fazla İnsan Gücü harcamadan Hava Saldırısı ekler. Düşman hava gücü altındaki hareketli oluşumların derli toplu korunması için kullanın; ancak neredeyse hiç Düzeni yoktur, Dayanıklılığı düşüktür ve kara ateş gücüne az katkı yapan özel uçaksavar araçları gerektirir.§!"
 medium_walker_battalion:0 "Orta Yürüyen Araç Bölüğü"
 medium_walker_battalion_desc:0 "Yürüyen araç oluşumlarının çok yönlü omurgası olarak tasarlanan Orta Yürüyen Araç Bölüğü, doğrudan çatışma için dengeli koruma, hareket kabiliyeti ve yük kapasitesini birleştirir.\n\n§GTasarımcı İpucu: Orta Yürüyen Araçlar, kullandıkları yürüyen araç şasisine göre belirlenen esnek zırhlı ön saf gücü sağlar. Yürüyen araç oluşumlarının genel amaçlı çekirdeği olarak kullanın; ancak geniş Cephe Genişliği, düşük Düzeni, uzun eğitimi ve büyük şasi gereksinimi onları sahaya sürmeyi ve yerine koymayı pahalı kılar.§!"
 light_walker_tank_battalion:0 "Hafif Yürüyen Araç Bölüğü"
 light_walker_tank_battalion_desc:0 "Tank savar yürüyen araç şasileri etrafında inşa edilen Hafif Yürüyen Araç Bölüğü, sürekli hat çatışmasından çok zırhlı hedefleri avlamaya ve açılan boşluklardan yararlanmaya odaklanır.\n\n§GTasarımcı İpucu: Hafif Yürüyen Araçlar, tank avcısı yürüyen araç şasileri sayesinde zırhlı hedeflerde uzmanlaşır. Düşman Zırhı yoğunlaşmış Delme ve Sert Saldırı gerektirdiğinde kullanın; ancak geniş Cephe Genişliği, düşük Düzeni, uzun eğitimi ve özel şasi maliyeti onları yumuşak hedeflere karşı verimsiz kılar.§!"
 heavy_walker_tank_battalion:0 "Ağır Yürüyen Araç Bölüğü"
 heavy_walker_tank_battalion_desc:0 "Ağır Yürüyen Araç Bölükleri, ana oluşumla birlikte korumalı ateş desteği sağlamak için devasa yürüyen platformlara topçu yükleri bindirir.\n\n§GTasarımcı İpucu: Ağır Yürüyen Araçlar, topçu yürüyen araç şasilerinden zırhlı topçu ateş gücü sağlar. Piyadeye ve tahkim edilmiş hatlara karşı güçlü destek eklemek için kullanın; ancak geniş Cephe Genişliği, düşük Düzeni, uzun eğitimi ve pahalı özel şasisi iyi desteklenen bir oluşum gerektirir.§!"
 light_medium_walker_battalion:0 "Orta Yürüyen Araç Bölüğü (Hafif)"
 light_medium_walker_battalion_desc:0 "Küçültülmüş bir Orta Yürüyen Araç unsuru, küçük bir genel amaçlı yürüyen araç şasisi payıyla oluşumu takviye eder.\n\n§GTasarımcı İpucu: Eksik Kadrolu Orta Yürüyen Araçlar, tam bir yürüyen araç bölüğünden daha az Cephe Genişliği ve çok daha az şasiyle esnek zırhlı güç ekler. Üretim tam bir unsuru sürdüremediğinde kullanın; ancak düşük Düzeni, uzun eğitimi ve sınırlı dayanıklılığı korurlar.§!"
 light_light_walker_tank_battalion:0 "Hafif Yürüyen Araç Bölüğü (Hafif)"
 light_light_walker_tank_battalion_desc:0 "Küçültülmüş bir Hafif Yürüyen Araç unsuru, hedefli takviye için küçük bir tank savar yürüyen platform gücü sağlar.\n\n§GTasarımcı İpucu: Eksik Kadrolu Hafif Yürüyen Araçlar, daha az Cephe Genişliği ve daha az tank avcısı şasisiyle yoğunlaşmış tank savar gücü ekler. Tümenleri sert hedeflere karşı takviye etmek için kullanın; ancak düşük Düzeni, uzun eğitimi ve yumuşak hedeflere karşı dar rolü korurlar.§!"
 light_heavy_walker_tank_battalion:0 "Ağır Yürüyen Araç Bölüğü (Hafif)"
 light_heavy_walker_tank_battalion_desc:0 "Küçültülmüş bir Ağır Yürüyen Araç unsuru, tam bir bölüğün ayak izi olmadan topçu donanımlı yürüyen platformlar sağlar.\n\n§GTasarımcı İpucu: Eksik Kadrolu Ağır Yürüyen Araçlar, tam bir unsurdan daha az Cephe Genişliği ve daha az şasiyle zırhlı topçu ateş gücü ekler. Derli toplu ateş desteği için kullanın; ancak düşük Düzeni, uzun eğitimi ve özel topçu şasisi yine de onları maliyetli kılar.§!"
 space_artillery_support_company:0 "Uzay Topçusu Destek Bataryası"
 space_artillery_support_company_desc:0 "Yörünge platformlarından atılan topçu mermileri kullanan Uzay Topçusu Destek Bataryası, geleneksel sistemlerin menzilinin çok ötesindeki muharebe alanı hedeflerine uzaydan hassas bombardıman uygular. Bu vuruşlar tahkim edilmiş mevzileri hızla bastırabilir, yüksek değerli varlıkları yok edebilir ve düşman yığınaklarını asgari uyarıyla dağıtabilir.\n\n§GTasarımcı İpucu: Uzay Topçusu, Cephe Genişliği eklemeden topçu bataryalarının saldırı katkısını ikiye katlar ve paraşütle indirilebilir. Topçu ağırlıklı oluşumları güçlendirmek için kullanın; ancak nadir yörünge kontrol teçhizatı, uzun eğitimi ve zayıf bağımsız muharebe değerleri onu az topçusu olan tümenlerde israf kılar.§!"
 space_artillery_equipment_type:0 "Yörünge Ateş Kontrol Rölesi"
 space_artillery_equipment_type_desc:0 "Yörünge topçu vuruşlarını gerçek zamanlı talep etmek, koordine etmek ve doğrulamak için tasarlanmış, sertleştirilmiş bir haberleşme ve hedefleme rölesi. Cephe gözlemcilerini uzay tabanlı bataryalara bağlayarak hızlı ateş görevlerini, hassas zamanlamayı ve dost kuvvetlerle güvenilir çatışmasızlaştırmayı mümkün kılar. Sistem pahalıdır ve kaynak açısından ağırdır; ancak onsuz yörünge ateş gücü kör, yavaş ve tehlikeli derecede verimsiz kalır."
 HACS_Mech:0 "1. nesil Yüksek Çeviklikli Muharebe Sistemi"
 HACS_Mech_desc:0 "Birinci nesil Yüksek Çeviklikli Muharebe Sistemi, gelişmiş zırhı, silahları ve hareket kabiliyetini havadan konuşlandırılabilir bir muharebe platformunda birleştirir.\n\n§GTasarımcı İpucu: Birinci nesil YÇMS, çok yüksek Düzen, Dayanıklılık, çok yönlü ateş gücü ve paraşütle iniş yeteneği sağlar; tepelerde ve ovalarda güçlü bonuslar kazanır. Seçkin zırhlı ok başları olarak kullanın; ancak geniş Cephe Genişliği, çok uzun eğitimi, nadir teçhizatı ile orman ve tropik orman cezaları, dikkatsiz kayıpları ağır kılar.§!"
 HACS_Mech_2:0 "2. nesil Yüksek Çeviklikli Muharebe Sistemi"
 HACS_Mech_2_desc:0 "İkinci nesil Yüksek Çeviklikli Muharebe Sistemi, stratejik konuşlandırma esnekliğini korurken korumayı, silah sistemlerini ve muharebe alanı dayanıklılığını iyileştirir.\n\n§GTasarımcı İpucu: İkinci nesil YÇMS, paraşütle iniş ve kıyıdan tahliyeyi korurken Düzeni, Dayanıklılığı ve Yarmayı artırır. Tepelerde, ovalarda, çöllerde ve bataklıklarda seçkin saldırılar için kullanın; ancak geniş Cephe Genişliği, nadir teçhizat, uzun eğitim ve kalan tropik orman cezası seçici kullanımı gerektirir.§!"
 HACS_Mech_3:0 "3. nesil Yüksek Çeviklikli Muharebe Sistemi"
 HACS_Mech_3_desc:0 "Üçüncü nesil Yüksek Çeviklikli Muharebe Sistemi, gelişmiş korumayı, modüler silahları ve olağanüstü muharebe alanı dayanıklılığını birleştirir.\n\n§GTasarımcı İpucu: Üçüncü nesil YÇMS, olağanüstü Düzen, Dayanıklılık, Siper, geniş ateş gücü, paraşütle iniş yeteneği ve güçlü arazi bonusları sunar. En zorlu zırhlı harekâtlar için kullanın; ancak geniş Cephe Genişliği, uzun eğitimi ve yerine konamayan gelişmiş teçhizatı yıpranmayı yine de cezalandırır.§!"
 ALN_bellatoris:0 "Bellatoris"
 ALN_bellatoris_desc:0 "Bellatoris, amansız yakın saldırı için yetiştirilmiş Chimera sürüsünün ön saf savaşçısıdır. Hızlı ve saldırgan olan bu tür, savunma hatlarını salt sayı ve vahşetle ezer.\n\n§GTasarımcı İpucu: Bellatoris, çok yüksek Düzen ve Dayanıklılığı dengeli saldırılar, Savunma, Yarma ve hızlı eğitimle birleştirir. Ormanlarda, tepelerde, bataklıklarda, ovalarda ve çöllerde genel amaçlı Chimera hat birliği olarak kullanın; ancak Hava Saldırısı yoktur ve dağlarda ile tropik ormanlarda zorlanır.§!"
 ALN_brachionis:0 "Brachionis"
 ALN_brachionis_desc:0 "Brachionis, zırhlı hedefleri yakın mesafede kavrayıp parçalamak için yetiştirilmiş çok uzuvlu bir Chimera'dır.\n\n§GTasarımcı İpucu: Brachionis, yüksek Düzeni ve hızlı eğitimi korurken biraz Savunmadan feragat edip daha fazla Yumuşak ve Sert Saldırı kazanır. Açık zeminde saldırgan hücum birlikleri olarak kullanın; ancak dağlarda ve tropik ormanlarda zayıf kalırlar.§!"
 ALN_gravis:0 "Gravis"
 ALN_gravis_desc:0 "Gravis, en ağır Chimera türüdür; sürünün ilerleyişine çıpa olan ve tahkim edilmiş mevzileri zorla kıran zırhlı bir kütledir.\n\n§GTasarımcı İpucu: Gravis, yüksek Düzen ve hızlı eğitimle birlikte en güçlü Chimera saldırılarını, Yarmayı ve Girişimi sağlar. Açık arazide taarruz çıpası olarak kullanın; ancak daha fazla İkmal tüketir, daha hafif türlere göre daha düşük Savunma ve Düzene sahiptir ve dağlarda ile tropik ormanlarda zorlanır.§!"
 Weapons_company:0 "Silah Bölüğü"
 Weapons_company_desc:0 "GPMG ve HMG ekipleri, Bomba Atan Makineli Tüfek ekipleri ve diğer ağır piyade doğrudan ateş destek silahları gibi doğrudan ateşli piyade destek silahlarından oluşan bir silah bölüğü. Bu bölük, geniş bir kuvvet yelpazesinde, desteklemekle görevlendirildiği her piyade unsuruna destek ateşi sağlamak üzere tasarlanmıştır.\n\n§GTasarımcı İpucu: Silah Bölüğü, Cephe Genişliği harcamadan, özellikle Delme olmak üzere geniş doğrudan ateş değerleri ekler. Genel amaçlı piyadeyi güçlendirmek için kullanın; ancak yüksek piyade teçhizatı talebi ve Siper cezası onu ucuz sabit savunmacılar için daha az çekici kılar.§!"
 Heavy_mortar_company:0 "Havan Bataryası"
 Heavy_mortar_company_desc:0 "Havanlar, hat birliklerine daha üst unsurlardan takviye gerektirmeden hızlı ve bütünleşik ateş desteği sağlamak üzere tasarlanmıştır. Bu havanlar, hat unsurlarına tam ölçekli bir topçu birliğinin gerektireceğinden çok daha ucuza dolaylı ateş desteği verir.\n\n§GTasarımcı İpucu: Havan Bataryası, topçu teçhizatı veya Cephe Genişliği gerektirmeden güçlü Yumuşak Saldırı sağlar. Piyadeye karşı ucuz bütünleşik ateş desteği olarak kullanın; ancak Sert Saldırı veya Delme değeri azdır ve Siperi düşürür.§!"
 Sniper_company:0 "Keskin Nişancı Takımı"
 Sniper_company_desc:0 "Gözlemci çiftleri halinde çalışan hassas nişancılarla donatılan Keskin Nişancı Takımı; subaylar, mürettebat ve haberleşme ekipleri gibi yüksek değerli hedeflere karşı uzun menzilli, seçici ateş sağlar. Gizlenerek düşman oluşumlarını taciz etmekte ve aksatmakta üstündürler; yerleri tespit edilip karşılık verilmesi zor kalırken düşmanın etkinliğini aşındırırlar.\n\n§GTasarımcı İpucu: Keskin Nişancı Takımı Yumuşak Saldırı ve Keşif ekler, keşif unsurlarının Girişimini ve topçunun ateş gücünü artırır. Piyadeye karşı ve daha iyi muharebe alanı koordinasyonu için kullanın; ancak Cephe Genişliği ekler ve Yarması, Sert Saldırısı ve Delmesi çok zayıftır.§!"
 AT_company:0 "Piyade Tank Savar Takımı"
 AT_company_desc:0 "Piyade tank savar silahlarıyla donatılan bu tank savar takımı, özellikle hafif piyade unsurlarıyla çalışmak üzere tasarlanmıştır. Kentsel alanlarda, ormanlarda ve diğer siperli veya yakın konumlarda rahatça hareket edebilen bu ekip, düşman zırhlı unsurlarına kolayca saldırıp ardından siperli mevzilerine geri çekilebilir.\n\n§GTasarımcı İpucu: Piyade Tank Savar, yaya, hava indirme, deniz ve özel kuvvetler oluşumları için Cephe Genişliği harcamadan yüksek Sert Saldırı ve Delme ekler. Bu tümenler zırha direnmek zorunda olduğunda kullanın; ancak diğer muharebe değerlerini zayıflatır ve özel teçhizat maliyeti ekler.§!"
 Mot_AT_company:0 "Araçlı Tank Savar Bataryası"
 Mot_AT_company_desc:0 "Araçlar üzerindeki ateş mevzilerinden çalışan, tank savar harekâtına adanmış bir batarya. Daha çok hız için tasarlanmıştır; hızla hareket eden hareketli ve zırhlı unsurlara ayak uydururken yine de artırılmış Tank Savar yetenekleri sağlar.\n\n§GTasarımcı İpucu: Araçlı Tank Savar, hareketli oluşumları yavaşlatmadan yüksek Sert Saldırı ve Delme ekler. Tanklarla karşı karşıya kalan motorlu, zırhlı, hava indirme veya deniz tümenlerinde kullanın; ancak ağır tank savar silahları ve Hafif Hizmet Araçları onu daha pahalı yapar ve yumuşak hedeflere karşı az katkı sağlar.§!"
 AA_company:0 "Uçaksavar Bataryası"
 AA_company_desc:0 "Düşman hava unsurlarıyla çatışmak ve düşman helikopterlerine ile diğer uçaklara karşı savunma sağlamak için özel olarak donatılmış bir unsur.\n\n§GTasarımcı İpucu: Uçaksavar Bölüğü, Cephe Genişliği harcamadan güçlü Hava Saldırısı sağlar. Düşman hava gücü altında görev yapan tümenleri korumak için kullanın; ancak kara çatışmasında zayıftır ve gökyüzü güvendeyken pek değer taşımayan özel uçaksavar teçhizatı tüketir.§!"
 Combat_engineer_company:0 "Muharebe İstihkâm Bölüğü"
 Combat_engineer_company_desc:0 "Muharebe İstihkâmcıları, hat birliklerine doğrudan destek olarak taarruz niteliğinde istihkâm faaliyetleri yürütür. Nehirler veya tank hendekleri gibi zorlu arazileri geçmek üzere eğitilmiş ve donatılmışlardır. Ayrıca mayın tarlalarını veya diğer savunma engellerini yarmak ve diğer muharebe kuvvetlerinin engelsiz geçebilmesi için bölgeleri temizlemek üzere de donatılmışlardır.\n\n§GTasarımcı İpucu: Muharebe İstihkâmcıları, Cephe Genişliği harcamadan Savunma, Yarma ve ormanlarda, dağlarda, tropik ormanlarda ve şehirlerde mütevazı saldırı ile savunma bonusları ekler. Zorlu arazi üzerinden yapılan taarruzlar için kullanın; ancak önemli miktarda piyade teçhizatı gerektirirler ve açık arazide daha az özelleşmiş değer sağlarlar.§!"
 pathfinder_company:0 "Öncü Takımı"
 pathfinder_company_desc:0 "Hava indirme harekâtından önce en güvenli iniş bölgelerini ve toplanma alanlarını bulmak için önceden atlamak üzere eğitilmiş seçkin paraşütçü grupları. Bu seçkin askerler, her hava indirme veya hava hareketli harekâtın kilit aşamalarında hayati komuta ve kontrol sağlar.\n\n§GTasarımcı İpucu: Öncüler, hava indirme piyadesinin Düzenini ve Yumuşak Saldırısını artırır ve paraşütle konuşlanabilir. Hava indirme veya hava hareketli hücum tümenlerini güçlendirmek için kullanın; ancak Cephe Genişliği ekler, bu oluşumlarla sınırlıdır ve doğrudan muharebe gücüne az katkı sağlar.§!"
 amphibious_landing_detachment:0 "Deniz Çıkarma Müfrezesi"
 amphibious_landing_detachment_desc:0 "Donanmadan ilhak edilen ve hızlı ve etkili amfibi çıkarma harekâtına imkân tanıyan unsurlar. Özel çıkarma gemileri ve teçhizatla donatılan bu birlikler, gemiden kıyıya veya ufuk ötesi çıkarma harekâtını kolaylaştırır. Ancak böyle bir birliği eklemenin bedeli, amfibi olmayan harekâtları yürütme yeteneklerindeki düşüştür.\n\n§GTasarımcı İpucu: Deniz Çıkarma Müfrezesi, deniz oluşumları için amfibi Saldırıyı, Savunmayı ve Hareketi büyük ölçüde iyileştirir. Sahillere hücuma adanmış tümenlerde kullanın; ancak Cephe Genişliği, İnsan Gücü ve teçhizat ekler ve neredeyse her kara arazisinde ağır muharebe cezaları getirir.§!"
 combat_maintenance_company:0 "Bakım Bölüğü"
 combat_maintenance_company_desc:0 "Bakım Bölüğü, sahada onarım yaparak ve hasar görmüş platformları tamamen kaybedilmeden kurtararak bir oluşumun araçlarını ve ağır teçhizatını muharebede tutar. Muharebede devre dışı kalan araçları cepheye yakın onararak zırhlı gücü uzun harekâtlar boyunca sürdürür ve yıpranmanın yükünü azaltır.\n\n§GTasarımcı İpucu: Bakım, araç ağırlıklı tümenler için Güvenilirliği, Toparlanmayı ve Teçhizat Ele Geçirmeyi iyileştirir. Uzun harekâtlarda yıpranmayı sınırlamak ve pahalı teçhizatı korumak için kullanın; ancak Cephe Genişliği, İnsan Gücü ve hizmet araçları ekler, doğrudan ateş gücüne az katkı sağlar.§!"
 airmobile_maintenance_company:0 "Hava Hareketli Bakım Bölüğü"
 airmobile_maintenance_company_desc:0 "Hava hareketli ve helikopter kuvvetlerini desteklemek üzere yapılandırılmış, döner kanatlı ve hızla konuşlandırılan birlikleri çalışır halde tutmak için gereken daha hafif ve daha taşınabilir aletlerle donatılmış bir bakım unsuru. Hasarlı teçhizatı ileri bölgelerde onararak, yerleşik depolardan uzakta hava hücum harekâtlarının temposunu sürdürür.\n\n§GTasarımcı İpucu: Hava Hareketli Bakım, helikopter oluşumlarıyla aynı hızda ilerlerken Teçhizat Ele Geçirmeyi ve Güvenilirliği iyileştirir. Maliyetli döner kanatlı teçhizatı korumak için kullanın; ancak kara bakımından daha az Toparlanma sağlar, Cephe Genişliği ekler ve çok sayıda nakliye helikopteri gerektirir.§!"
 communications_company:0 "Haberleşme Bölüğü"
 communications_company_desc:0 "Haberleşme Bölüğü, bir oluşumu birbirine bağlayan telsiz, veri ve komuta ağlarını işletir; emir ve raporların muharebe alanında güvenilir biçimde akmasını sağlar. Sağlam haberleşme eşgüdümü ve tepki süresini iyileştirir, oluşumu karıştırma ve elektronik aksatmaya karşı sertleştirir.\n\n§GTasarımcı İpucu: Haberleşme Bölüğü, ön saf taburlarının Düzenini, Toparlanmasını ve Girişimini iyileştirir. Eşgüdümden yararlanan büyük veya değerli muharebe tümenlerinde kullanın; ancak Cephe Genişliği ve hatırı sayılır bir Komuta ve Kontrol Teçhizatı maliyeti ekler, doğrudan ateş gücüne az katkı sağlar.§!"
 military_police_attachment:0 "Askeri Polis Müfrezesi"
 military_police_attachment_desc:0 "Askeri Polis, trafik kontrolü, arka bölge güvenliği ve esirlerin yönetimini üstlenerek hat birliklerini muharebeye odaklanmaları için serbest bırakır. İkmal yollarını düzenli tutarak ve arka bölgeyi sızanlara ve geride kalanlara karşı güvenceye alarak disiplini korur ve oluşumun sorunsuz ilerlemesini sağlar.\n\n§GTasarımcı İpucu: Askeri Polis, piyade Baskısını katlar ve Cephe Genişliği harcamadan ek Baskı sağlar. İşgal ve arka bölge güvenliği şablonlarında kullanın; ancak İnsan Gücü ve teçhizat maliyeti ön saf muharebe tümenlerine az fayda sağlar.§!"
 hq_support_company:0 "Karargâh Destek Bölüğü"
 hq_support_company_desc:0 "Karargâh destek bölüğü, bir saha oluşumunu yönetmek için gereken komuta kurmayını, haberleşmeyi, ulaşımı ve güvenliği sağlar.\n\n§GTasarımcı İpucu: Karargâh Destek Bölüğü, konuşlandırılmış bir komutanın Beceriden kazandığı bonusları artırır. Kara Karargâhı şablonu için genel amaçlı seçimdir; ancak özelleşmiş muharebe veya harekât bonusu olmadan Cephe Genişliği, İnsan Gücü ve teçhizat ekler.§!"
 hq_engineer:0 "Karargâh İstihkâm Bölüğü"
 hq_engineer_desc:0 "Karargâh istihkâm bölüğü, oluşum genelinde yarma, tahkimat ve hareketlilik çalışmalarını koordine eder.\n\n§GTasarımcı İpucu: Karargâh İstihkâm Bölüğü, Siper ve Yarma eklerken Tahkimat Hasarını ve Amfibi Çıkarma Savunmasını iyileştirir. Kuşatma, savunma veya kıyı harekâtları için kullanın; ancak Cephe Genişliği ekler ve doğrudan ateş gücü sınırlıdır.§!"
 hq_recon:0 "Karargâh Keşif Bölüğü"
 hq_recon_desc:0 "Karargâh keşif bölüğü, komuta kurmayı için arazi ve düşman bilgisi toplar ve dağıtır.\n\n§GTasarımcı İpucu: Karargâh Keşif Bölüğü, konuşlandırılmış komutan için Keşfi ve Arazi Özelliği tecrübesini iyileştirir, karargâha da Keşif ekler. Hareketli veya araziye odaklı komutalarda kullanın; ancak Cephe Genişliği ekler ve doğrudan muharebe gücü azdır.§!"
 hq_maintenance:0 "Karargâh Bakım Bölüğü"
 hq_maintenance_desc:0 "Karargâh bakım bölüğü, oluşum genelinde kurtarma, onarım ve teçhizat sökümünü koordine eder.\n\n§GTasarımcı İpucu: Karargâh Bakım Bölüğü, konuşlandırılmış komutan için Yıpranmayı azaltır ve Teçhizat Ele Geçirmeyi iyileştirir, karargâha da Güvenilirlik ve Teçhizat Ele Geçirme ekler. Teçhizat ağırlıklı komutalarda kullanın; ancak Cephe Genişliği ekler ve muharebe değerleri zayıftır.§!"
 hq_logistics:0 "Karargâh Lojistik Bölüğü"
 hq_logistics_desc:0 "Karargâh lojistik bölüğü, oluşum için ikmal dağıtımını ve yakıt hareketini planlar.\n\n§GTasarımcı İpucu: Karargâh Lojistik Bölüğü, konuşlandırılmış komutan için İkmal Tüketimini, karargâh için ise Yakıt Tüketimini azaltır. İkmal sıkıntısı çeken veya yakıt yoğun cephelerde kullanın; ancak Cephe Genişliği ekler ve savaşma gücü azdır.§!"
 hq_naval_liaison:0 "Karargâh Deniz Irtibat Bölüğü"
 hq_naval_liaison_desc:0 "Deniz irtibat ekipleri karargâhı filo komutanları ve gemiden kıyıya destek ağlarıyla bağlar.\n\n§GTasarımcı İpucu: Karargâh Deniz Irtibat Bölüğü, konuşlandırılmış komutan için Kıyı Bombardımanını, Amfibi Çıkarmayı ve deniz İkmal Toleransını iyileştirir. Kıyı ve amfibi seferler için kullanın; ancak Cephe Genişliği ekler ve iç bölgelerde pek fayda sağlamaz.§!"
 hq_air_liaison:0 "Karargâh Hava Irtibat Bölüğü"
 hq_air_liaison_desc:0 "Hava irtibat ekipleri karargâhı nakliye, yakın destek ve hava üstünlüğü oluşumlarıyla eşgüdümlü çalıştırır.\n\n§GTasarımcı İpucu: Karargâh Hava Irtibat Bölüğü, Hava İndirme Hazırlığını kısaltır, Yakın Hava Desteğine direnci ve Hava Üstünlüğünden elde edilen muharebe faydasını artırır. Hava-kara eşgüdümünün önem taşıdığı yerlerde kullanın; ancak Cephe Genişliği ekler ve kayda değer kara ateş gücü sağlamaz.§!"
 hq_specops:0 "Karargâh Özel Harekât Bölüğü"
 hq_specops_desc:0 "Özel harekât kurmayı, olağan ikmal ve komuta ağlarının ötesinde faaliyet gösteren seçkin birlikleri koordine eder.\n\n§GTasarımcı İpucu: Karargâh Özel Harekât Bölüğü, konuşlandırılmış komutan için Özel Kuvvetler Saldırısını, Savunmasını ve İkmalsiz performansını Cephe Genişliği eklemeden iyileştirir. Seçkin oluşumları komuta etmek için kullanın; ancak İnsan Gücü ve teçhizat maliyeti konvansiyonel kuvvetlerde boşa gider.§!"
 hq_mech:0 "Karargâh Mekanize Piyade Bölüğü"
 hq_mech_desc:0 "Mekanize harekât kurmayı, oluşum genelindeki zırhlı personel taşıyıcıları ve içlerindeki piyadeyi koordine eder.\n\n§GTasarımcı İpucu: Karargâh Mekanize Piyade Bölüğü, konuşlandırılmış komutan için Mekanize Saldırıyı ve Savunmayı iyileştirir. Mekanize oluşumları komuta etmek için kullanın; ancak ZPT'ler ve önemli miktarda destek teçhizatı gerektirir, diğer birlik türlerine ise az fayda sağlar.§!"
 hq_mot:0 "Karargâh Motorlu Piyade Bölüğü"
 hq_mot_desc:0 "Motorlu harekât kurmayı, araçlı piyadeyi ve oluşumun hızlı hareketini koordine eder.\n\n§GTasarımcı İpucu: Karargâh Motorlu Piyade Bölüğü, konuşlandırılmış komutan için Motorlu Saldırıyı ve Savunmayı iyileştirir. Motorlu oluşumları komuta etmek için kullanın; ancak Hafif Hizmet Aracı ve teçhizat maliyetleri yaya veya zırhlı kuvvetlere az değer sağlar.§!"
 hq_armor:0 "Karargâh Ağır Süvari Bölüğü"
 hq_armor_desc:0 "Zırhlı harekât kurmayı, oluşum genelindeki tankları, zırhlı piyadeyi ve destek unsurlarını koordine eder.\n\n§GTasarımcı İpucu: Karargâh Ağır Süvari Bölüğü, konuşlandırılmış komutan için Zırh Saldırısını ve Savunmasını iyileştirir. Tank ağırlıklı kuvvetleri komuta etmek için kullanın; ancak Piyade Muharebe Araçları ve geniş teçhizat gereksinimleri onu en maliyetli karargâh destek seçeneklerinden biri yapar.§!"
 hq_infantry:0 "Karargâh Piyade Güvenlik Müfrezesi"
 hq_infantry_desc:0 "Hafif bir piyade müfrezesi, karargâh personelini, haberleşmeyi ve komuta merkezlerini doğrudan saldırıdan korur.\n\n§GTasarımcı İpucu: Karargâh Piyade Güvenlik Müfrezesi, bir Kara Karargâhı için mütevazı teçhizat maliyetiyle yüksek Dayanıklılık ve Düzen sağlar. Temel güvenlik hattı olarak kullanın; ancak Cephe Genişliği ekler, arazi bonusu yoktur ve muharebe değerleri sıradan ön saf piyadesine göre düşüktür.§!"
 hq_Mot_Inf_Bat:0 "Karargâh Motorlu Piyade Güvenlik Müfrezesi"
 hq_Mot_Inf_Bat_desc:0 "Motorlu bir piyade müfrezesi, karargâh personeli ve komuta merkezleri için hareketli güvenlik sağlar.\n\n§GTasarımcı İpucu: Karargâh Motorlu Piyade Güvenlik Müfrezesi, Kara Karargâhına Hız, sağlam Düzen ve güçlü tepe ile kent performansı ekler. Hareketli bir komuta oluşumu için kullanın; ancak araçlar maliyet ekler ve çöllerde, tropik ormanlarda, bataklıklarda, nehirlerde ve amfibi saldırılarda zayıftır.§!"
 hq_Mech_Inf_Bat:0 "Karargâh Mekanize Piyade Güvenlik Müfrezesi"
 hq_Mech_Inf_Bat_desc:0 "Mekanize bir piyade müfrezesi, hareketli bir karargâhı zırhlı personel taşıyıcılarla korur.\n\n§GTasarımcı İpucu: Karargâh Mekanize Piyade Güvenlik Müfrezesi, zırhlı hareketlilik ile tepelerde ve şehirlerde güçlü Savunma ekler. Mekanize bir Kara Karargâhını korumak için kullanın; ancak ZPT'ler pahalıdır ve birlik dağlarda, tropik ormanlarda, bataklıklarda, nehirlerde ve amfibi saldırılarda ağır cezalar alır.§!"
 hq_Arm_Inf_Bat:0 "Karargâh Zırhlı Güvenlik Müfrezesi"
 hq_Arm_Inf_Bat_desc:0 "Zırhlı bir piyade müfrezesi, bir karargâh için ağır güvenlik sağlamak üzere piyade muharebe araçları kullanır.\n\n§GTasarımcı İpucu: Karargâh Zırhlı Güvenlik Müfrezesi, bir Kara Karargâhı için Piyade Muharebe Aracı tabanlı koruma ve açık arazi performansı sağlar. Zırhlı komutalarla kullanın; ancak Düzeni düşüktür, teçhizat maliyeti yüksektir ve zorlu arazide ile amfibi harekâtlarda ağır cezalar alır.§!"
 hq_Mech_Marine_Bat:0 "Karargâh Deniz Güvenlik Müfrezesi"
 hq_Mech_Marine_Bat_desc:0 "Mekanize bir deniz müfrezesi, gemiden kıyıya ve kıyı harekâtları sırasında karargâhı korur.\n\n§GTasarımcı İpucu: Karargâh Deniz Güvenlik Müfrezesi, bir Kara Karargâhı için zırhlı hareketliliği güçlü Amfibi ve Nehir Saldırısıyla birleştirir. Deniz komutalarında ve köprübaşı harekâtlarında kullanın; ancak ZPT maliyeti ve engebeli arazi cezaları onu iç bölge seferleri için verimsiz kılar.§!"
 hq_Mech_Air_Inf_Bat:0 "Karargâh Hava Hücum Güvenlik Müfrezesi"
 hq_Mech_Air_Inf_Bat_desc:0 "Hafif bir mekanize müfreze, hava indirme ve hızla konuşlandırılan oluşumlara atanan karargâhları korur.\n\n§GTasarımcı İpucu: Karargâh Hava Hücum Güvenlik Müfrezesi, Kara Karargâhıyla birlikte paraşütle indirilebilen zırhlı güvenlik sağlar. Hava indirme komuta oluşumları için kullanın; ancak ZPT ve destek teçhizatı maliyetleri yüksektir ve zorlu arazide, nehirlerde ve amfibi saldırılarda büyük cezalar alır.§!"
