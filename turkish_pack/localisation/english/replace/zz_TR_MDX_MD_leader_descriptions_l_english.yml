l_english:
 DONALD_TRUMP_LEADER_DESC:0 "Donald John Trump (d. 14 Haziran 1946), emlak geliştiricisi Frederick Christ Trump'ın milyarder oğludur. Bir milyon dolarlık küçük bir krediyle 1971'den beri Trump Organization çatısı altında çok sayıda işletme kurdu ve büyüttü. Televizyon kişiliği olduğu günlerden kalan sert tiradları ve dürtüsel liderlik tarzıyla bilinen Trump, dost edindiği kadar hızla düşman da edindi. Başkanlığı devralırken yasadışı göçü sınırlamaya, askerî harcamaları artırmaya, korumacı gümrük vergileri getirmeye ve Amerika'yı kesin biçimde ilk sıraya koymaya söz veriyor."
 MITT_ROMNEY_LEADER_DESC:0 "Willard Mitt Romney (d. 12 Mart 1978), otomotiv yöneticisi George W. Romney'nin dört çocuğundan biridir. Dindar bir Mormon ve serbest piyasa ekonomisi ile muhafazakâr aile değerlerinin kararlı savunucusu olan Romney, yıllarca süren iş tecrübesini devlet israfını azaltmak, askerî harcamaları artırmak ve Wall Street'e ve büyük şirketlere getirilen kısıtlamaları kaldırmak için kullanacağına söz veriyor."
 GEORGE_BUSH_LEADER_DESC:0 "George Walker Bush (d. 6 Temmuz 1946), 1989-1993 arasında 41. Amerikan başkanı olarak görev yapan George Herbert Walker Bush'un ilk çocuğudur. Petrol sektöründeki kısa bir görevin ardından siyasete giren Bush, sonunda Teksas valisi oldu. Kendini şefkatli bir muhafazakâr olarak tanıtan Bush, vergileri düşürmeye, askerî harcamaları artırmaya ve şirket sektörünü sera gazı emisyonlarına getirilen gereksiz kısıtlamalardan arındırmaya söz veriyor."
 BERNIE_SANDERS_LEADER_DESC:0 "Bernard Sanders (d. 8 Eylül 1941), Amerika Birleşik Devletleri'ne göç etmiş Polonyalı işçi sınıfı ailesinin oğludur. Üniversite yıllarında Genç Sosyalistler Birliği'ne katılan Sanders, Sivil Haklar Hareketi sırasında beyazlara ve siyahlara eşit muameleyi savundu. Sanders daha sonra Vermont'taki Burlington'ın belediye başkanı oldu ve sonunda ABD Temsilciler Meclisi'ne ve ABD Senatosu'na seçildi. Kendini demokratik sosyalist ve ilerici olarak tanımlayan Bernie Sanders, askerî harcamaları azaltmaya, sendikaların gücünü artırmaya ve evrensel bir sağlık sistemi kurmaya söz veriyor."
 CONGRESSIONAL_CHAMBERS_DESC:0 "Seçiciler kurulunun başarısız olması ve Florida eyaletinde seçimin... beklenmedik sorunlarla boğuşması üzerine Kongre, kime oy vereceğini bulmaya veya en azından işler daha da kontrolden çıkmadan başkanlık koltuğunu doldurmaya çabalıyor."
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC:0 "Konsey, eski Amerika Birleşik Devletleri federal hükümetinden geriye kalan bir artık yapıdır. Geriye ne kaldıysa, elinde kalan insanları ve toprakları yeni bir bayrak altında toplamaya çalışıyor. Konsey üyeleri hem hukuk ve düzen hem de barış duygusu yaratmaya bakıyor; böylece yeni bir yönetime sorunsuz bir iktidar devri gerçekleştirebilecekler."
 MATHEW_CROUDER_DESC:0 "«Mareşal» ya da kısaca Mat/Mathew, biraz paradoksal biridir. Hem konuşkan hem de belirgin biçimde sessiz olan bu genç adam, ilgisini çeken işleri yürütürken veya yaparken biraz dağınık bir yaklaşım sergiler. Başlangıçta herhangi bir liderlik için pek olası görünmese de tanıdık edinme konusundaki kendi yumuşak gücü ve daha nazik kişiliği onu oldukça yakın hissedilen biri yapıyor. Çatışmalı konularda zaman zaman biraz hiddetli olabildiği bilinse de pek çok kişi için elinden geleni yapmaya çalışıyor. Bir röportajcıya bir keresinde şöyle demişti: «Hayat tuhaf ve kafa karıştırıcı bir karmaşa, bir şey yapmak istesen bile nerede biteceğini asla tam bilemezsin, kendini tam tersini yaparken bulabilirsin. Yani lisedeki JROTC'den bir anayasa yazma ve mikro ulus fikrini keşfetme gibi garip bir hobiye kadar, siyasi lider olmayı, hele ki federal düzeyde bir lider olmayı hiç hayal etmemiştim...» Bu bir ölçüde saflık, bir ölçüde sınırsız iyimserlik, Mathew'u şimdi Güney Amerika Cumhuriyeti'nin başına getirdi; ne yapacağını pek kimse bilmiyor, şimdilik bekleyip göreceğiz."
 JIANG_ZEMIN_LEADER_DESC:0 "Jiang Zemin (d. 17 Ağustos 1926), Tiananmen Meydanı protestolarının ardından reformcu Zhao Ziyang'ın yerine geçerek 1989'dan beri Komünist Parti'yi yöneten eski bir mühendistir. Daha önce Şanghay belediye başkanlığı yapmıştır ve Şanghay'da birlikte çalıştığı kişileri kayırmayı sürdürmesi, partideki hizbinin «Şanghay Çetesi» olarak anılmasına yol açmıştır. Ekonomik reformun savunucusu olan Jiang'ın 1990'lardaki yönetimi, Deng Xiaoping'in reform ve dışa açılma politikasının devamına ve özel sektörün normalleşmesine sahne oldu. Ayrıca Hong Kong'un ve Makao'nun Çin egemenliğine dönüşüne başkanlık etti ve insan hakları konusundaki sert yaklaşımı nedeniyle eleştirildi."
 HU_JINTAO_LEADER_DESC:0 "Hu Jintao (d. 21 Aralık 1942), babasının Kültür Devrimi sırasında suçlanmasını yaşamış eski bir mühendistir. Lider olarak, hızlı ekonomik büyümenin Çin toplumu ve çevresi üzerindeki etkilerini ele alma isteğini dile getirmiş olup Komünist Parti'nin Tuanpai veya Komünist Gençlik Birliği hizbinin başındadır. Başbakan Wen Jiabao ile birlikte Hu, Çin'in ekonomik kalkınmasının kazanımlarını daha eşit dağıtmayı ve Komünist Parti'nin önceliğini sıkı biçimde korurken daha az elitist bir yönetim biçimi benimsemeyi amaçlıyor."
 XI_JINPING_LEADER_DESC:0 "Xi Jinping (d. 15 Haziran 1953), «prensler» olarak bilinen yeni Çinli yetkili kuşağının bir parçasıdır. Komünist Parti kıdemlisinin oğlu olan Xi, yolsuzlukla mücadele kampanyaları aracılığıyla siyasi rakiplerini ve mevcut Komünist Parti hizip yapılarını zayıflatarak liderliği altında merkezileşmeyi ve gücün pekiştirilmesini vurguladı. Aynı zamanda iddialı bir dış politikanın savunucusu olup Deng Xiaoping'in uluslararası meselelerde düşük profil izleme politikasından ayrılıyor."
 BO_XILAI_LEADER_DESC:0 "Bo Xilai (d. 3 Temmuz 1949), tanınmış bir prens ve eski Başbakan Yardımcısı Bo Yibo'nun oğludur. Chongqing Parti Sekreterliği görevinden tanınan Bo, organize suçla mücadele kampanyası ve Çin'in ekonomik büyümesinin eşitsiz gidişatından memnun olmayan solcular arasında destek kazandıran «kızıl kültürü» yeniden canlandırmasıyla anılır. Bo siyasi kariyeri boyunca birçok düşman edinmiş olup tartışmalı bir itibara sahiptir."
 KIM_DAE_JUNG_LEADER_DESC:0 "Kim Dae-jung (d. 6 Ocak 1924), uzun süren demokrasi yanlısı aktivizm geçmişi nedeniyle Güney Kore siyasetinde saygın bir isimdir; kimileri ona «Asya'nın Nelson Mandela'sı» der. Şüpheli bir suikast girişiminden, istihbarat ajanlarınca kaçırılmaktan ve bir idam cezasından sağ kurtulan Kim, yaklaşık 50 yıllık muhalefetin ardından sonunda ülkesini yönetmek üzere ortaya çıktı. 1998'de göreve geldiğinden beri öncelikleri arasında ekonomik toparlanma, Kore'nin güçlü chaebol'lerini hesap vermeye çağırmak ve kendine özgü Güneş Politikası altında Kuzey Kore ile ilişki kurmak yer alıyor."
 ROH_MOO_HYUN_LEADER_DESC:0 "Roh Moo-hyun (d. 6 Ağustos 1946), yoksul bir geçmişten gelen, otoriter rejime karşı öğrenci protestocularını savunmuş eski bir insan hakları avukatıdır. Başkanlığını destekleyen Kim Dae-jung gibi Roh da uluslararası tecrit politikası yerine Kuzey ile müzakereden yanadır. Ayrıca Amerika Birleşik Devletleri ve Japonya'yı açıkça eleştirmiş, Kore'nin muhafazakâr düzeniyle husumetli bir ilişki yaşamıştır. Roh desteğini, 30'lu yaşlarında olan, 80'lerde üniversiteye giden ve 60'larda doğmuş sola yakın «386 kuşağından» alır."
 LEE_MYUNG_BAK_LEADER_DESC:0 "Lee Myung-bak (d. 19 Aralık 1941), muhafazakâr bir siyasetçi ve Hyundai'nin eski genel müdürüdür. Hyundai'de geçirdiği süre boyunca, kısmen katı yönetim anlayışı nedeniyle «Öfkeli Buldozer» lakabını kazandı. Hırslı bir isim olan Lee, Kore'yi dünyanın en büyük ekonomilerinden birine dönüştürmeyi ve Kore'nin küresel statüsünü yükseltecek enternasyonalist bir dış politikayı teşvik etmeyi umuyor. Sol görüşlü selefleriyle karşıtlık içinde Lee, Kuzey Kore'ye karşı sert bir yaklaşımdan ve Amerika Birleşik Devletleri ile yakın ortaklıktan yana."
 PARK_GEUN_HYE_LEADER_DESC:0 "Park Geun-hye (d. 2 Şubat 1952), mirası tartışmalı olmayı sürdüren Kore'nin eski otoriter lideri Park Chung-hee'nin kızı olarak tanınır. Kimileri Park Chung-hee'yi iktidarını sürdürmek için işkence ve hapis kullanan acımasız bir diktatör olarak görürken, kimileri ekonomik başarıları nedeniyle onu över. Park gençliğinde hem annesinin hem babasının suikastına tanık oldu; annesi bir Kuzey Koreli ajanın, babası ise Kore Merkezî İstihbarat Teşkilatı'nın başkanının elinde öldü. Muhafazakâr ve piyasa yanlısı duruşuyla bilinen Park, düzenlemelerin gevşetilmesinden, vergi indirimlerinden ve hukuk ve düzenden yanadır."
 MOON_JAE_IN_LEADER_DESC:0 "Moon Jae-in (d. 24 Ocak 1953), Kuzey Koreli mültecilerin oğlu ve eski bir insan hakları avukatı ve aktivistidir. Askerlik hizmeti sırasında özel kuvvetlerde komando olarak görev yaptı ve 1976 Panmunjom balta cinayeti olayına Güney Kore-ABD ortak karşılığı olan Paul Bunyan Operasyonu'na katıldı. Daha önce birlikte hukuk bürosu açtığı selefi Roh Moo-hyun'un yakın dostu olan Moon, Roh'un solcu yönetiminde aktifti ve bağlı kalmaya devam ettiği Güneş Politikası'nda önemli bir isimdi. ABD ittifakına bağlı olmakla birlikte Moon, Kore'nin Amerikalılara hayır demeyi öğrenmesi gerektiğini söyledi ve Kore ordusunun savaş zamanı komutasını ABD'den geri almayı umuyor."
 YOON_SUK_YEOL_LEADER_DESC:0 "Yoon Suk Yeol (d. 18 Aralık 1960), Kore Cumhuriyeti'nin eski başsavcısı ve Seul Merkez Bölge Savcılığı'nın başsavcısıydı. Başkanlığı sırasında Yoon Suk Yeol, muhalefeti Ulusal Meclis'i kontrol etmekle, Kuzey Kore'ye sempati duymakla ve devlet karşıtı faaliyetlerle hükümeti felç etmekle suçlayarak olağanüstü hâl ilan etti. Ancak Ulusal Meclis sıkıyönetimin kaldırılması için oy kullandı. O günden beri Yoon Suk Yeol isyanla suçlandı ve ülkeyi terk etmesi yasaklandı; böylece Güney Kore tarihinde yurt dışına çıkış yasağı getirilen ilk görevdeki başkan oldu. Daha sonra Yoon Suk Yeol tutuklandı ve Güney Kore tarihinde tutuklanan ilk görevdeki başkan oldu."
 KIM_JONG_UN_LEADER_DESC:0 "Kim Jong-un (d. 8 Ocak 1984), Kim Jong-il'in hayatı boyunca en çok değer verdiği oğuldu. İsviçre'de okuduğu günlerde biraz kilolu yapısı onu hafife almayı mümkün kılıyordu. Ancak tahta çıktığında siyasi düşmanlarını gizlice idam etmedeki soğukkanlılığı, kurnazlığı ve acımasızlığıyla (doğrulanmamış haberlere göre amcasının uçaksavar silahlarıyla idamı dahil), uluslararası yaptırımlara rağmen nükleer silah geliştirmeyi sürdürme kararlılığıyla ve ABD ile Güney Kore ile dostane diyaloğun zamanlamasını isabetle yakalamasıyla dünyayı şaşırttı. «Gökten gelen büyük adam» olarak liderliği altında belki de Kuzey Kore'nin «Güçlü ve Müreffeh Ülke» olması gerçek bir ihtimaldir?"
 KIM_JONG_NAM_LEADER_DESC:0 "Kim Jong-nam (d. 10 Mayıs 1971), Kim Jong-il'in ikinci eşinden olan oğludur. Ailesinin en büyük oğlu olarak Kim Jong-nam, halkın «Zorlu Yürüyüş» altındaki sefaletine tanık oldu. Yurt dışında bulunduğu süre boyunca Çin'in reform ve dışa açılmasının hızlı gelişimini gördü ve değişimin gücünden etkilendi. Yalnızca reformun Kuzey Kore halkına maddi refah ve manevi mutluluk getirebileceğine inanıyordu, ancak değişimin ona iktidarına mal olabileceğini de biliyordu. Yine de bunun için asla pişman olmadı."
 KIM_YO_JONG_LEADER_DESC:0 "Kim Yo-jong (d. 26 Eylül 1987), ailesinin tek kızı olarak siyasi kariyerine başladığından beri öyle bir yetenek gösterdi ki Kim Jong-il halefini seçerken «Keşke Kim Yo-jong erkek olsaydı» diye hayıflandı. Belki de kadınsı imajı nedeniyle hem yurt içinde hem yurt dışında (tuhaf biçimde) yüksek düzeyde destek görüyor. Bugün iktidarı, hangi ülkenin siyaseti olursa olsun kadınların da erkekler kadar iyi yapabileceğini kanıtlıyor."
 POLITICS_PAUL_KAGAME_DESC:0 "Paul Kagame 28 yaşındayken Uganda hükümetinin devrilmesine yardım etti. 36 yaşında soykırımcı Hutu liderliğindeki Ruanda hükümetini devirdi. 39 yaşında Afrika'nın en yozlaşmış ve baskıcı diktatörü olan Kongo Demokratik Cumhuriyeti'nden Mobutu'yu alaşağı etti. Kagame, herkesten fazla savaş kazanmış olmasıyla muhtemelen yaşayan en başarılı askerî liderdir; üstelik hepsini kısıtlı bir bütçeyle yaptı. Yurt içindeki tüm muhalefeti bastırırken Tutsi general sürekli olarak daha fazla yurt dışı hırsına gözünü dikmiş durumda, Hutu isyancıları avlıyor ve maden zenginliklerinden yararlanıyor."
 costas_simitis_desc:0 "Costas Simitis (d. 23 Haziran 1936), Atina İktisat Üniversitesi'nde avukat ve profesör olan George Simitis'in oğludur. Yunan Cuntası döneminde hükümet karşıtı örgütlere katılan Costas Simitis, cuntanın düşüşünden kısa süre sonra 1974'te Panhelenik Sosyalist Hareket'in (PASOK) kurucu üyesiydi. 1981'deki PASOK seçim zaferi sırasında Andreas Papandreu yönetimi altında ekonomi, tarım, eğitim ve din bölümlerinin başkanlığı ile eş zamanlı olarak sanayi, araştırma, enerji, teknoloji ve ticaret bölümlerinin başkanlığı gibi birçok hükümet görevine çağrıldı. Andreas Papandreu'nun 1996'da ölümünün ardından PASOK liderliğine seçildi ve kısa süre sonra 1996 genel seçimlerini kazandı. Şimdi Costas Simitis kamu sektöründe özelleştirmeleri, ekonomik istikrarı istikrarlı biçimde artırmaya, ulusal borcu azaltmaya, Yunan-Türk anlaşmazlıklarını çözmeye ve en önemlisi Avrupa Birliği ile bağları ve iş birliğini geliştirmeye bakıyor"
 nikolaos_michaloliakos_desc:0 "Nikolaos Michaloliakos (d. 11 Aralık 1957), Yunanistan'ın en büyük milliyetçi partisi Altın Şafak'ın kurucusudur. Michaloliakos, Yunan askerî rejiminin destekçisiydi ve diktatörlük karşıtı pek çok isme saldırı düzenleyen birçok aşırı sağ grupta yer almasıyla ve Yunan Cuntası lideri Georgios Papadopulos ile ilişkisiyle tanınır. 1980'de Altın Şafak aşırı sağ partisini kurdu; parti solcu karşıtı bir gündem, göçmen karşıtlığı, 1967 Cuntası ve 4 Ağustos 1936 rejimi gibi Yunan otoriter rejimlerini yüceltme, Rusya ve Çin'le hizalanma ve Batı'dan uzaklaşma hedefler. Michaloliakos ve Altın Şafak partisi, azınlıkları hedef alan, neo-Nazi ve faşist görüşler ile demokrasi karşıtı duruş benimseyen bir suç örgütü olmakla suçlandı. Tepkilere rağmen Nikolaos Michaloliakos ve partisi, ekonomik istikrarsızlık ve toplumsal bölünmeler Yunanistan'ı sürükledikçe popülerlik kazanıyor ve bu durum Altın Şafak davasına daha fazla destekçi çekiyor. Durum daha da kötüleşirse Nikolaos Michaloliakos, iktidarı alıp yeni bir Yunan devleti kurma hedeflerine ulaşabilir"
