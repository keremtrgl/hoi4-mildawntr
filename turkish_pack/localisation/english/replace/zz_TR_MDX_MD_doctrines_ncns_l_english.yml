l_english:
 equipment_doctrine_folder:0 "Teçhizat Doktrini"
 SPECIAL_FORCES_MIXED:0 "Karma Komuta"
 SPECIAL_FORCES_MIXED_DESC:0 "Bu doktrin, özel kuvvetleri karmaşık ve yüksek öncelikli, hassasiyet ve ketumluk gerektiren görevler için eğitilmiş son derece seçkin birlikler olarak yapılandırır. Özel kuvvetler seçkinlik kavramları, farklı ortamlarda gelişmiş yetenek entegrasyonunu ve operasyonel etkinliği vurgular."
 SPECIAL_FORCES_MARINE_FOCUS:0 "Denizci Odaklı Özel Kuvvetler"
 SPECIAL_FORCES_MARINE_FOCUS_DESC:0 "Bu doktrin özel kuvvetlerimizi öncelikle deniz piyadesi birliklerine odaklayarak deniz piyadesi kuvvetlerini eğitmek ve konuşlandırmak için daha fazla seçenek sunar. Bunun bedeli, özel kuvvetlerimizin diğer kollarını yeterince eğitememek veya donatamamaktır."
 SPECIAL_FORCES_AIRBORNE_FOCUS:0 "Hava İndirme Odaklı Özel Kuvvetler"
 SPECIAL_FORCES_AIRBORNE_FOCUS_DESC:0 "Bu doktrin özel kuvvetlerimizi öncelikle hava indirme birliklerine odaklayarak hava indirme kuvvetlerini eğitmek ve konuşlandırmak için daha fazla seçenek sunar. Bunun bedeli, özel kuvvetlerimizin diğer kollarını yeterince eğitememek veya donatamamaktır."
 SPECIAL_FORCES_RANGER_FOCUS:0 "Komando Odaklı Özel Kuvvetler"
 SPECIAL_FORCES_RANGER_FOCUS_DESC:0 "Bu doktrin özel kuvvetlerimizi öncelikle komando birliklerine odaklayarak komando kuvvetlerini eğitmek ve konuşlandırmak için daha fazla seçenek sunar. Bunun bedeli, özel kuvvetlerimizin diğer kollarını yeterince eğitememek veya donatamamaktır."
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE:0 "Yerel Hava Sahası Savunması"
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE_DESC:0 "Bu büyük doktrin, hava kuvvetlerini ulusal ve bölgesel hava sahasının korunması ve kontrolü etrafında yapılandırır. Yerel hava sahası savunması kavramları, tanımlı hava alanlarında koordineli gözetim ve karşılığı vurgular."
 GRAND_DOCTRINE_AIR_BATTLEFIELD_SUPPORT:0 "Muharebe Sahası Desteği"
 GRAND_DOCTRINE_AIR_BATTLEFIELD_SUPPORT_DESC:0 "Bu büyük doktrin, hava harekâtlarını aktif çatışma bölgelerindeki kara ve deniz kuvvetlerini doğrudan destekleyecek şekilde yapılandırır. Muharebe sahası desteği kavramları, hava gücünün ortak harekât planlamasına entegrasyonunu vurgular."
 GRAND_DOCTRINE_AIR_SUPREMACY:0 "Hava Üstünlüğü"
 GRAND_DOCTRINE_AIR_SUPREMACY_DESC:0 "Bu büyük doktrin, hava kuvvetlerini hava sahasında kontrol kurmak ve sürdürmek üzere düzenler. Hava üstünlüğü kavramları, tüm harekât alanlarında hareket serbestisini sağlamak için koordineli hava harekâtlarını vurgular."
 GRAND_DOCTRINE_MIXED_ROLE:0 "Karma Görev"
 GRAND_DOCTRINE_MIXED_ROLE_DESC:0 "Bu büyük doktrin, hava kuvvetlerini birleşik bir çerçeve içinde birden fazla harekât rolünü dengeleyecek şekilde yapılandırır. Karma görev kavramları, çeşitli görev türlerinde hava gücünün kullanımında esnekliği vurgular."
 GRAND_DOCTRINE_INTEGRATED_AIR_WARFARE:0 "Entegre Hava Harbi"
 GRAND_DOCTRINE_INTEGRATED_AIR_WARFARE_DESC:0 "Bu büyük doktrin, hava kuvvetlerini hava üstünlüğü harekâtlarını vurucu ve ağır bombardıman varlıklarıyla kaynaştırarak kara kuvvetlerini doğrudan destekleyecek şekilde yapılandırır. Entegre hava harbi kavramları, kesintisiz yakın hava desteği ve kara saldırısı görevlerini mümkün kılmak için düşman hava sahasının temizlenmesini vurgular."
 GRAND_DOCTRINE_COMBINED_ARMS:0 "Birleşik Silahlar"
 GRAND_DOCTRINE_COMBINED_ARMS_DESC:0 "Bu büyük doktrin, kara kuvvetlerini manevra, ateş desteği ve idame unsurlarının bütünleşik kullanımı etrafında yapılandırır. Birleşik silah kavramları, uyumlu muharebe sahası etkileri yaratmak için birlikler arasında eş güdümlü hareketi vurgular."
 GRAND_DOCTRINE_SHOCK_AND_AWE:0 "Şok ve Dehşet"
 GRAND_DOCTRINE_SHOCK_AND_AWE_DESC:0 "Bu büyük doktrin, kara harekâtlarını kesin harekât etkileri elde etmek üzere muharebe gücünün hızlı ve yoğun uygulanması etrafında düzenler. Şok ve dehşet kavramları tempoyu, üstünlüğü ve koordineli güç kullanımını vurgular."
 GRAND_DOCTRINE_DEFENCE_IN_DEPTH:0 "Derinlemesine Savunma"
 GRAND_DOCTRINE_DEFENCE_IN_DEPTH_DESC:0 "Bu büyük doktrin, kara savunmasını katmanlı mevziler ve muharebe alanı boyunca derinliğe dayalı güç kullanımıyla yapılandırır. Derinlemesine savunma kavramları, kesintisiz savunma tutarlılığını ve kontrollü harekât alanını vurgular."
 GRAND_DOCTRINE_MISSION_COMMAND:0 "Görev Komutası"
 GRAND_DOCTRINE_MISSION_COMMAND_DESC:0 "Bu büyük doktrin, kara kuvvetlerini açık bir niyet ve tanımlı hedeflerle yönlendirilen yetki devri etrafında yapılandırır. Görev komutası kavramları, birden fazla kademede inisiyatifi ve eş güdümlü icrayı vurgular."
 GRAND_DOCTRINE_GUERRILLA_WARFARE:0 "Gerilla Harbi"
 GRAND_DOCTRINE_GUERRILLA_WARFARE_DESC:0 "Bu büyük doktrin, kara harekâtlarını dağınık ve sürekli muharebe faaliyeti yürüten düzensiz kuvvetler etrafında yapılandırır. Gerilla harbi kavramları, çekişmeli ortamlarda yerel örgütlenmeyi ve sürekli baskıyı vurgular."
 GRAND_DOCTRINE_EQUIPMENT_MIXED:0 "Karma Teçhizat"
 GRAND_DOCTRINE_EQUIPMENT_MIXED_DESC:0 "Bu büyük doktrin, kuvvet teçhizatını çeşitli harekât gereksinimlerini karşılayacak dengeli bir sistem bileşimi etrafında yapılandırır. Karma teçhizat kavramları, farklı muharebe rollerindeki birlikleri donatmada esnekliği vurgular."
 GRAND_DOCTRINE_EQUIPMENT_LIGHT:0 "Hafif Teçhizat"
 GRAND_DOCTRINE_EQUIPMENT_LIGHT_DESC:0 "Bu büyük doktrin, kuvvetleri hafif ve sadeleştirilmiş teçhizat setleri etrafında düzenler. Hafif teçhizat kavramları, konuşlandırma kolaylığını ve çeşitli harekât ortamlarına uyum sağlamayı vurgular."
 GRAND_DOCTRINE_EQUIPMENT_HEAVY:0 "Ağır Teçhizat"
 GRAND_DOCTRINE_EQUIPMENT_HEAVY_DESC:0 "Bu büyük doktrin, kuvvetleri ağır korumalı ve yüksek kapasiteli teçhizat sistemleri etrafında yapılandırır. Ağır teçhizat kavramları, kuvvet oluşumları içinde kalıcı varlığı ve sağlam muharebe yeteneğini vurgular."
 GRAND_DOCTRINE_EQUIPMENT_MOBILE:0 "Hareketli Teçhizat"
 GRAND_DOCTRINE_EQUIPMENT_MOBILE_DESC:0 "Bu büyük doktrin, kuvvet teçhizatını yüksek harekât hareketliliğini ve hızlı manevrayı destekleyecek şekilde düzenler. Hareketli teçhizat kavramları, hareketi, yeniden konuşlanmayı ve harekât erişimini vurgular."
 GRAND_DOCTRINE_EQUIPMENT_FIRES:0 "Ateş Desteği Teçhizatı"
 GRAND_DOCTRINE_EQUIPMENT_FIRES_DESC:0 "Bu büyük doktrin, teçhizat geliştirmeyi dolaylı ve destek ateşi sağlamaya adanmış sistemler etrafında yapılandırır. Ateş desteği teçhizatı kavramları, muharebe gücünün muharebe sahası boyunca eş güdümlü uygulanmasını vurgular."
 GRAND_DOCTRINE_EQUIPMENT_FULL:0 "Tam Teçhizat"
 GRAND_DOCTRINE_EQUIPMENT_FULL_DESC:0 "Bu büyük doktrin, kuvvetleri kapsamlı ve eksiksiz teçhizat tedariki etrafında düzenler. Tam teçhizat kavramları, kalıcı ve geniş kapsamlı harekâtları desteklemek için standartlaştırılmış donatımı vurgular."
 GRAND_DOCTRINE_EQUIPMENT_SPEARHEAD:0 "Öncü Teçhizat"
 GRAND_DOCTRINE_EQUIPMENT_SPEARHEAD_DESC:0 "Bu büyük doktrin, taarruz kademesinin her unsuru zırh altında hareket edecek şekilde kuvveti donatır ve korumalı hareketliliği tek bir delici hamlenin arkasında yoğunlaştırır. Öncü teçhizat kavramları, ana çaba noktasında mekanize derinliği ve kesintisiz ivmeyi vurgular; bunun bedeli, piyade olarak tutunma gücünden fedakârlık etmektir."
 GRAND_DOCTRINE_BLUE_WATER:0 "Açık Deniz Donanması"
 GRAND_DOCTRINE_BLUE_WATER_DESC:0 "Bu büyük doktrin, deniz kuvvetlerini açık okyanuslarda ve uzak denizcilik harekât sahalarında kesintisiz harekât yürütecek şekilde yapılandırır. Açık deniz donanması kavramları, küresel erişimi, güç projeksiyonunu ve sürekli filo varlığını vurgular."
 GRAND_DOCTRINE_GREEN_WATER:0 "Kıyı Donanması"
 GRAND_DOCTRINE_GREEN_WATER_DESC:0 "Bu büyük doktrin, deniz kuvvetlerini kıyı ve bölgesel denizcilik ortamlarındaki harekâtlar etrafında düzenler. Kıyı donanması kavramları, kıyı nüfuzunu ve bölgesel deniz kontrolünü vurgular."
 GRAND_DOCTRINE_JEUNE_ECOLE:0 "Jeune École"
 GRAND_DOCTRINE_JEUNE_ECOLE_DESC:0 "Bu büyük doktrin, deniz stratejisini daha küçük, özelleşmiş gemiler ve dağıtık denizcilik harekâtları etrafında yapılandırır. Jeune École kavramları, deniz harbinde asimetriyi ve seçici güç uygulamasını vurgular."
 GRAND_DOCTRINE_GUERRE_DE_COURSE:0 "Guerre de Course"
 GRAND_DOCTRINE_GUERRE_DE_COURSE_DESC:0 "Bu büyük doktrin, deniz harekâtlarını ticarete yönelik harp yoluyla denizcilik faaliyetlerinin aksatılması etrafında düzenler. Guerre de course kavramları, deniz iletişim hatları boyunca hedefli deniz eylemlerini vurgular."
