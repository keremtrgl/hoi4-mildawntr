 leg_damage_protocols:0 "Bacak Hasarı Kontrol Protokolleri"
 terrain_anchoring:0 "Araziye Tutunma ve Mikro Konumlandırma"
 combined_arms_walker_screen:0 "Birleşik Silah Yürüyen Tank Perdesi"
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY:0 "Çekili Topçu"
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY_DESC:0 "Bu doktrin, topçu kuvvetlerini nakliye varlıklarıyla desteklenen konuşlandırılabilir top sistemleri etrafında yapılandırır. Çekili topçu kavramları, kara harekâtında esnek ateş desteğini vurgular."
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY:0 "Kendi Yürür Topçu Teçhizatı"
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY_DESC:0 "Bu doktrin, topçu birliklerini manevra kuvvetleriyle birlikte çalışabilen kendi yürür platformlarla donatır. Kendi yürür topçu teçhizatı kavramları, hareketli ve duyarlı ateş desteğini vurgular."
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY:0 "Çoklu Roketatar Teçhizatı"
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY_DESC:0 "Bu doktrin, topçu kuvvetlerini alan ateşi görevleri için çoklu roketatar sistemleri etrafında yapılandırır. Çoklu roketatar teçhizatı kavramları, muharebe sahası boyunca eş güdümlü ateş gücü iletimini vurgular."
 SUBDOCTRINE_EQUIPMENT_DRONE:0 "İHA Teçhizatı"
 drone_equipment_ew_resilient_link_discipline:0 "Elektronik Harbe Dayanıklı Bağlantı Disiplini"
 drone_equipment_sensor_to_shooter:0 "Algılayıcıdan Atıcıya Öldürme Zinciri Kısaltma"
 drone_equipment_swarm_deconfliction:0 "Sürü Çakışma Giderme Protokolleri"
 drone_equipment_low_signature_patterns:0 "Düşük İzli Yaklaşma Düzenleri"
 drone_equipment_rapid_turnaround_ground_crew:0 "Hızlı Yer Ekibi Standart Prosedürü"
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER:0 "Taarruz Helikopterleri"
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER_DESC:0 "Bu doktrin, taarruz helikopteri platformlarını kara kuvvetleri teçhizat yapılarına entegre eder. Taarruz helikopteri kavramları, havadan ateş desteğini ve muharebe sahasında kara harekâtıyla bütünleşmeyi vurgular."
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER:0 "Nakliye Helikopterleri"
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER_DESC:0 "Bu doktrin, kara kuvvetlerinin hareketliliğini döner kanatlı nakliye platformları etrafında yapılandırır. Nakliye helikopteri kavramları, hava hareketliliğini ve kuvvetlerin hızlı yeniden konuşlanmasını vurgular."
 SUBDOCTRINE_CAPITAL_CARRIER:0 "Uçak Gemisi Harekâtı"
 SUBDOCTRINE_CAPITAL_CARRIER_DESC:0 "Bu doktrin, deniz güç projeksiyonunu filonun merkezi varlıkları olarak uçak gemileri etrafında yapılandırır. Uçak gemisi harekâtı, deniz nüfuzunu denizcilik harekât sahalarına yaymak için gemiye yerleşik hava kanatlarının eş güdümlü kullanımını vurgular."
 SUBDOCTRINE_CAPITAL_HLS:0 "Helikopter Çıkarma Gemileri"
 SUBDOCTRINE_CAPITAL_HLS_DESC:0 "Bu doktrin, helikopter kabiliyetli çıkarma gemilerini deniz kuvvet yapılarına entegre eder. Helikopter çıkarma gemisi kavramları, denizcilik harekâtında dikey hareketliliği ve amfibi desteği vurgular."
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER:0 "Eskort Uçak Gemisi"
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER_DESC:0 "Bu doktrin, deniz havacılığını filo unsurlarıyla birlikte çalışan daha küçük uçak gemisi platformları etrafında düzenler. Eskort uçak gemisi kavramları, deniz birlikleri içinde dağıtık hava desteğini vurgular."
 SUBDOCTRINE_CAPITAL_LOTS:0 "Denizlerin Efendileri"
 SUBDOCTRINE_CAPITAL_LOTS_DESC:0 "Bu doktrin, deniz kuvvetlerini kilit denizcilik bölgeleri üzerinde kesintisiz denetim kuracak şekilde yapılandırır. Denizlerin Efendileri kavramları, baskın filo varlığını ve kesintisiz denizcilik nüfuzunu vurgular."
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS:0 "Uçak Gemisi Eskortu"
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS_DESC:0 "Bu doktrin, filo unsurlarını uçak gemisi gruplarına katmanlı koruma sağlayacak şekilde düzenler. Uçak gemisi eskortu kavramları, ana savaş gemileri için eş güdümlü savunmayı ve harekât sürekliliğini vurgular."
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS:0 "Filo Kruvazörleri"
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS_DESC:0 "Bu doktrin, filo örgütlenmesini bağımsız ve grup halinde harekât yürütebilen kruvazör sınıfı gemiler etrafında toplar. Filo kruvazörü kavramları, komuta varlığını ve çok görevli denizcilik yeteneğini vurgular."
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET:0 "Muhrip Filosu"
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET_DESC:0 "Bu doktrin, deniz kuvvetlerini başlıca yüzey muharebe unsuru olarak muhripler etrafında yapılandırır. Muhrip filosu kavramları, esnek çatışmayı ve filo düzeyinde harekât desteğini vurgular."
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS:0 "Destek Muhripleri"
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS_DESC:0 "Bu doktrin, muhrip kuvvetlerini daha yüksek değerli filo birliklerini desteklemek ve perdelemekle görevlendirir. Destek muhribi kavramları, korumayı, eş güdümü ve kesintisiz filo harekâtını vurgular."
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL:0 "Fırkateyn Ana Gemileri"
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL_DESC:0 "Bu doktrin, fırkateyn sınıfı gemileri deniz birlikleri içinde merkezi rollere yükseltir. Fırkateyn ana gemisi kavramları, dengeli yetenekleri ve dağıtık denizcilik varlığını vurgular."
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE:0 "Çok Rollü Fırkateynler"
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE_DESC:0 "Bu doktrin, eskort kuvvetlerini çeşitli denizcilik görevlerini yerine getirebilen fırkateynler etrafında yapılandırır. Çok rollü fırkateyn kavramları, eskort ve devriye harekâtında uyum sağlamayı vurgular."
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE:0 "Denizaltı Savar Korvet"
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE_DESC:0 "Bu doktrin, eskort kuvvetlerini denizaltı tespiti ve çatışmasında uzmanlaşmış korvetler etrafında düzenler. Denizaltı savar korvet kavramları, yerel su altı denetimini vurgular."
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE:0 "Uçaksavar Korvet"
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE_DESC:0 "Bu doktrin, eskort birliklerini hava savunma rollerine odaklanan korvetler etrafında yapılandırır. Uçaksavar korvet kavramları, filo birliklerinin havadan gelen tehditlere karşı korunmasını vurgular."
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS:0 "Hayalet Eskortlar"
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS_DESC:0 "Bu doktrin, düşük gözlenebilirlikli eskort gemilerini deniz birliklerine entegre eder. Hayalet eskort kavramları, denizcilik ortamlarında azaltılmış tespit edilebilirliği ve harekât ketumluğunu vurgular."
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK:0 "Eskort Taarruz Denizaltıları"
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK_DESC:0 "Bu doktrin, denizaltı kuvvetlerini yüzey filolarıyla yakın eş güdüm içinde çalışmakla görevlendirir. Eskort taarruz denizaltısı kavramları, deniz harekâtının su altından desteklenmesini vurgular."
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER:0 "Avcı-Katil Denizaltılar"
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER_DESC:0 "Bu doktrin, denizaltı kuvvetlerini bağımsız taarruz devriyeleri etrafında yapılandırır. Avcı-katil denizaltı kavramları, kesintisiz su altı varlığını ve hedefli çatışmayı vurgular."
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS:0 "Füze Botları"
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS_DESC:0 "Bu doktrin, denizaltı kuvvetlerini füze konuşlandırmaya donatılmış platformlar etrafında düzenler. Füze botu kavramları, denizcilik alanından stratejik ve harekâtî vuruş yeteneğini vurgular."
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS:0 "Baskın Filoları"
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS_DESC:0 "Bu doktrin, deniz harekâtını aksatıcı denizcilik eylemleri yürüten hareketli görev grupları etrafında yapılandırır. Baskın filosu kavramları, harekât erişimini ve esnek güç kullanımını vurgular."
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY:0 "Deniz Üstünlüğü"
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY_DESC:0 "Bu doktrin, deniz harekâtını denizcilik alanları üzerinde denetim kurmak ve sürdürmek üzere düzenler. Deniz üstünlüğü kavramları, deniz iletişim hatları boyunca eş güdümlü filo eylemini vurgular."
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE:0 "Kıyı Savunması"
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE_DESC:0 "Bu doktrin, deniz kuvvetlerini karasularını ve kıyı yaklaşma yollarını koruyacak şekilde yapılandırır. Kıyı savunması kavramları, katmanlı denizcilik güvenliğini ve bölgesel deniz kontrolünü vurgular."
