 DOCTRINE_TRACK_SUPPORT:0 "Destek Gemileri"
 MARINE_SPECIAL_FORCES:0 "Hızlı Amfibi Hücum"
 MARINE_SPECIAL_FORCES_DESC:0 "Bu doktrin, hafif, piyade temelli deniz piyadelerini hızla icra edilen çıkarmalar ve nehir geçişleri için eğitir. Hızlı hücum kavramları, hızı, hareketliliği ve düşman tepki veremeden kıyıyı ele geçirmeyi vurgular."
 MARINE_MASSIVE_FORCES:0 "Kitlesel Çıkarma Kuvvetleri"
 MARINE_SPECIAL_FORCES_MASSIVE_DESC:0 "Bu doktrin, hafif ve motorlu deniz piyadelerini kalıcı, büyük ölçekli amfibi harekâtlar için kurulmuş geniş birliklerde örgütler. Kitlesel çıkarma kavramları, işgal kapasitesini, eğitim hacmini ve kıyıdaki sayısal ağırlığı vurgular."
 AIRBORN_INTERDICTION:0 "Hava İndirme Engelleme"
 AIRBORN_INTERDICTION_DESC:0 "Bu doktrin, hafif hava indirme piyadesini ve öncü ekipleri hava alanlarını, ikmali ve haberleşmeyi sabote etmek için düşman hatlarının derinlerine gönderir. Engelleme kavramları, arazi tutmaktan ziyade sızmayı, tahribatı ve düşman manevralarını geciktirmeyi vurgular."
 AIRBORN_AIRHEAD_ASSAULT:0 "Hava Başı Hücumu"
 AIRBORN_AIRHEAD_ASSAULT_DESC:0 "Bu doktrin, hafif ve motorlu hava indirme piyadesini, yardımcı kuvvetler gelene dek bir hava başını ele geçirip tutmak üzere kitlesel olarak indirir. Hava başı hücumu kavramları, yoğunlaştırılmış indirmeyi, hızlı pekiştirmeyi ve karşı saldırı altında savunma dayanıklılığını vurgular."
 RANGER_FORCES_DOCTRINES:0 "Orman Komandoları"
 RANGER_FORCES_DOCTRINES_DESC:0 "Bu doktrin, komandoları yoğun ormanlarda savaşmak üzere eğitir; ağaçların örtüsünü pusu kurmak, sır olmak ve kendilerini göremeyen düşmanı kanatmak için kullanır. Orman kavramları, gizlenmeyi, yollar dışında hareket serbestisini ve hazırlanmış mevzilerden inatçı savunmayı vurgular."
 RANGER_JUNGLE_FORCES:0 "Tropik Orman Komandoları"
 RANGER_JUNGLE_FORCES_DESC:0 "Bu doktrin, komandoları sıcağın, hastalığın ve kopuk ikmal hatlarının geleneksel birlikleri yenilgiye uğrattığı tropik ormanların derinlerinde kesintisiz harekât için hazırlar. Tropik orman kavramları, iklime alışmayı, geçilmez arazide sızmayı ve dost hatlardan uzakta kendi kendine yetmeyi vurgular."
 MARINE_ELITE_RAIDERS:0 "Kıyı Baskıncıları"
 MARINE_ELITE_RAIDERS_DESC:0 "Bu doktrin, deniz piyade kuvvetlerini kıyı hedeflerine vurup düşman tepki veremeden çekilen küçük baskın ekiplerine dönüştürür. Kıyı baskıncısı kavramları, hızı, sızmayı ve hafif lojistik ayak izini vurgular."
 MARINE_ARMORED_BEACHHEAD:0 "Zırhlı Çıkarma Başı"
 MARINE_ARMORED_BEACHHEAD_DESC:0 "Bu doktrin, amfibi kuvvetleri zırh çıkarıp savunan taraf toparlanmadan çıkarma başından sıyrılacak şekilde düzenler. Zırhlı çıkarma başı kavramları, mekanize ateş gücünü, ivmeyi ve köprübaşının hızla genişletilmesini vurgular."
 AIRBORN_AIR_ASSAULT:0 "Hava Taarruzu"
 AIRBORN_AIR_ASSAULT_DESC:0 "Bu doktrin, hava indirme kuvvetlerini paraşütle atlama yerine helikopterle icra edilen hava taarruzu etrafında yapılandırır. Hava taarruzu kavramları, hızlı dikey kuşatmayı, hareketliliği ve talep üzerine döner kanatlı desteği vurgular."
 AIRBORN_ARMORED_DROP:0 "Zırhlı Hava İndirme"
 AIRBORN_ARMORED_DROP_DESC:0 "Bu doktrin, hava indirme kuvvetlerini havadan atılabilir zırh ve mekanize kolonlarla donatarak atlayıştan sonra kalıcı harekât yürütmelerini sağlar. Zırhlı hava indirme kavramları, korumalı ateş gücünü, örgütlenmeyi ve düşman topraklarının derinlerinde dayanma gücünü vurgular."
 RANGER_RECON_FORCES:0 "Keşif Komandoları"
 RANGER_RECON_FORCES_DESC:0 "Bu doktrin, komandoları ana kuvvetin önünde derin keşif, perdeleme ve gözetleme için eğitir. Keşif komandosu kavramları, gizliliği, arazi becerisini ve isabetli hedef tespitini vurgular."
 RANGER_STRIKE_FORCES:0 "Vurucu Komandolar"
 RANGER_STRIKE_FORCES_DESC:0 "Bu doktrin, komandoları tahkim edilmiş hedeflere karşı hızlı hücum ve hava alanı ele geçirme için hazırlar. Vurucu komando kavramları, şoku, tempoyu ve gücün doğrudan uygulanmasını vurgular."
 SOF_OPERATIONS_COMMAND:0 "Özel Harekât Komutanlığı"
 SOF_OPERATIONS_COMMAND_DESC:0 "Bu doktrin, birinci kademe özel harekât kuvvetlerini yetiştirip ayakta tutacak özel bir komuta kurar. Özel harekât komutanlığı kavramları, seçici devşirmeyi, kondisyonu ve tüm ortamlarda ortak desteği vurgular."
 SOF_DIRECT_ACTION:0 "Doğrudan Eylem"
 SOF_DIRECT_ACTION_DESC:0 "Bu doktrin, operatörleri yüksek değerli hedeflere yönelik doğrudan eylem baskınları için eğitir. Doğrudan eylem kavramları, hassas vuruşları, hızlı sızmayı ve kesin yakın çatışmayı vurgular."
 SOF_SABOTAGE_SUBVERSION:0 "Sabotaj ve Yıkıcı Faaliyet"
 SOF_SABOTAGE_SUBVERSION_DESC:0 "Bu doktrin, operatörleri düşman hatlarının gerisinde sabotaj, yıkıcı faaliyet ve olağan dışı harp için hazırlar. Sabotaj kavramları, sızmayı, yıkımı ve ikmalsiz uzun süreli harekâtı vurgular."
 SOF_RECON_INTELLIGENCE:0 "Özel Keşif"
 SOF_RECON_INTELLIGENCE_DESC:0 "Bu doktrin, özel kuvvetleri keşif, gözetleme ve istihbarat toplamaya odaklar. Özel keşif kavramları, hafif ayak izini, sabırlı gözlemi ve doğru raporlamayı vurgular."
 SOF_COUNTER_TERROR:0 "Terörle Mücadele"
 SOF_COUNTER_TERROR_DESC:0 "Bu doktrin, operatörleri terörle mücadele, rehine kurtarma ve kentsel yakın muharebe için eğitir. Terörle mücadele kavramları, hazırlığı, hassasiyeti ve hızlı müdahaleyi vurgular."
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND:0 "Merkezi Komuta"
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND_DESC:0 "Bu doktrin, hava harekâtlarını planlamanın, önceliklendirmenin ve icranın tek bir otoriteden yönetildiği birleşik bir merkezi komuta altına yerleştirir. Merkezi komuta, harekât niyetinde tutarlılığı ve hava gücünün tüm harekât sahasında eş güdümlü kullanımını sağlar."
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND:0 "Ayrık Komuta"
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND_DESC:0 "Bu doktrin, hava harekâtlarını yarı bağımsız komutanlıklara devreder ve tanımlı harekât sınırları içinde planlama ve icra konusunda yetki devri sağlar. Ayrık komuta, genel stratejik hedeflerle uyumu korurken yerel karar almayı mümkün kılar."
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR:0 "Deniz Komutası"
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR_DESC:0 "Bu doktrin, hava harekâtlarını deniz komuta yapıları altında bütünleştirir ve hava gücü planlaması ile icrasını denizcilik hedefleriyle hizalar. Deniz komutası, filo harekâtını ve deniz sahasının kontrolünü desteklemek üzere hava varlıklarının eş güdümlü kullanımını sağlar."
 SUBDOCTRINE_DESIGN_MULTIROLE:0 "Çok Rollü Tasarımlar"
 SUBDOCTRINE_DESIGN_MULTIROLE_DESC:0 "Bu doktrin, tek bir platformda birden fazla görev profilini yerine getirebilen uçakların geliştirilmesini vurgular. Çok rollü tasarımlar, hava alanındaki geniş bir harekât gereksinimi yelpazesini desteklemek için uyarlanabilirliğe ve bütünleşik sistemlere öncelik verir."
 SUBDOCTRINE_DESIGN_DEDICATED:0 "Özel Amaçlı Tasarımlar"
 SUBDOCTRINE_DESIGN_DEDICATED_DESC:0 "Bu doktrin, belirli bir harekât rolü için optimize edilmiş uçakların geliştirilmesine odaklanır. Özel amaçlı tasarımlar, hava alanında açıkça tanımlanmış görev gereksinimlerini karşılamak için uzmanlaşmayı ve özelleştirilmiş performansı vurgular."
 SUBDOCTRINE_DESIGN_HEAVY:0 "Ağır Tasarımlar"
 SUBDOCTRINE_DESIGN_HEAVY_DESC:0 "Bu doktrin, dayanıklılığa, yük kapasitesine ve kesintisiz harekât varlığına odaklanan iri ve sağlam uçak tasarımlarının geliştirilmesini vurgular. Ağır tasarımlar, zorlu hava harekâtlarını desteklemek için yapısal dayanıklılığa ve bütünleşik sistemlere öncelik verir."
 SUBDOCTRINE_DESIGN_DRONE:0 "İHA Tasarımları"
 SUBDOCTRINE_DESIGN_DRONE_DESC:0 "Bu doktrin, uzaktan işletime ve otonom destek sistemlerine dayanan insansız uçak tasarımlarının geliştirilmesine öncelik verir. İHA tasarımları, harekât gereksinimleri boyunca hava gücü seçeneklerini genişletmek için modüler entegrasyonu ve esnek görev yapılandırmasını vurgular."
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER:0 "Stratejik Bombardıman Uçakları"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER_DESC:0 "Bu doktrin, uzun menzilli stratejik vuruş harekâtları için tasarlanmış uçakların geliştirilmesine odaklanır. Stratejik bombardıman uçakları, kapsamlı askeri hedefleri desteklemek üzere geniş mesafelerde kesintisiz hava gücü sağlamak için tasarlanır."
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS:0 "Deniz Bombardıman Uçakları"
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS_DESC:0 "Bu doktrin, deniz kuvvetleriyle yakın eş güdüm içinde çalışmak üzere tasarlanmış uçakların geliştirilmesini vurgular. Deniz bombardıman uçağı tasarımları, deniz harekâtlarını ve deniz kontrolü hedeflerini desteklemek için hava gücünü denizcilik ortamlarına yaymaya odaklanır."
 SUBDOCTRINE_HEAVY_GUNSHIPS:0 "Ağır Muharebe Uçağı"
 SUBDOCTRINE_HEAVY_GUNSHIPS_DESC:0 "Bu doktrin, kesintisiz havadan ateş gücü sağlamak üzere tasarlanmış ağır silahlı uçakların geliştirilmesine odaklanır. Ağır muharebe uçağı tasarımları, çekişmeli ortamlardaki hava harekâtlarını desteklemek için bütünleşik silah sistemlerini ve uzun süreli varlığı vurgular."
 SUBDOCTRINE_MULTIROLE_MIXED:0 "Karma Çok Rollü"
 SUBDOCTRINE_MULTIROLE_MIXED_DESC:0 "Bu doktrin, tek bir hava kuvvetinde çeşitli tasarım felsefelerini birleştirerek çok rollü uçak geliştirmede dengeli bir yaklaşımı teşvik eder. Karma çok rollü kavramlar, geniş bir harekât gereksinimi yelpazesini karşılamak için kuvvet bileşiminde esnekliği vurgular."
 SUBDOCTRINE_MULTIROLE_STRIKE:0 "Vurucu Uçaklar"
 SUBDOCTRINE_MULTIROLE_STRIKE_DESC:0 "Bu doktrin, taarruzi hava harekâtlarına yönelik çok rollü uçakların geliştirilmesini vurgular. Vuruş odaklı tasarımlar, daha geniş harekât hedeflerini desteklemek için hava gücünün belirlenen hedeflere etkin biçimde ulaştırılmasına öncelik verir."
 SUBDOCTRINE_MULTIROLE_OPERATIONS:0 "Çok Rollü Harekât"
 SUBDOCTRINE_MULTIROLE_OPERATIONS_DESC:0 "Bu doktrin, hava harekâtlarını çeşitli görev gereksinimlerini karşılayabilen çok rollü uçaklar etrafında yapılandırır. Çok rollü harekât, geniş bir harekât hedefi yelpazesini desteklemek için uyarlanabilir hava platformlarının eş güdümlü kullanımını vurgular."
 SUBDOCTRINE_STRIKE_CAS:0 "Yakın Hava Destek Uçakları"
 SUBDOCTRINE_STRIKE_CAS_DESC:0 "Bu doktrin, kara harekâtlarını doğrudan hava çatışmasıyla desteklemek üzere tasarlanmış uçakların geliştirilmesine odaklanır. Yakın hava destek uçakları, kara kuvvetleriyle yakın eş güdüm içinde hızlı müdahale eden ve kesintisiz hava gücü sağlayacak şekilde yapılandırılır."
 SUBDOCTRINE_STRIKE_NAVAL:0 "Deniz Vurucu Uçağı"
 SUBDOCTRINE_STRIKE_NAVAL_DESC:0 "Bu doktrin, denizcilik hedeflerini desteklemek üzere çalışacak vurucu uçakların geliştirilmesine odaklanır. Deniz vuruşu kavramları, deniz harekât sahalarında güç yansıtmak için hava gücünün deniz harekâtıyla bütünleşmesini vurgular."
 SUBDOCTRINE_STRIKE_MUNITIONS:0 "Vuruş Mühimmatı"
 SUBDOCTRINE_STRIKE_MUNITIONS_DESC:0 "Bu doktrin, hassas vuruş harekâtları için tasarlanmış mühimmatın geliştirilmesini ve entegrasyonunu vurgular. Vuruş mühimmatı kavramları, havadan atılan ateş gücünün harekât hedeflerini desteklemek üzere etkin uygulanmasının artırılmasına odaklanır."
 SUBDOCTRINE_FIGHTER_LIGHT:0 "Hafif Av Uçakları"
 SUBDOCTRINE_FIGHTER_LIGHT_DESC:0 "Bu doktrin, çevikliğe ve hızlı hava harekâtına göre optimize edilmiş hafif av uçaklarının geliştirilmesine odaklanır. Hafif av uçağı tasarımları, daha geniş hava muharebesi çerçevesi içinde verimli performansı ve esnek kullanımı vurgular."
 SUBDOCTRINE_FIGHTER_AIR_SUP:0 "Hava Üstünlüğü"
 SUBDOCTRINE_FIGHTER_AIR_SUP_DESC:0 "Bu doktrin, hava sahasında kontrol kurmak ve sürdürmek için av uçaklarının geliştirilmesine ve kullanımına odaklanır. Hava üstünlüğü kavramları, harekât sahası boyunca hareket serbestisini güvence altına almak için eş güdümlü hava muharebesi harekâtlarını vurgular."
 SUBDOCTRINE_DESIGN_STEALTH:0 "Hayalet Tasarımlar"
 SUBDOCTRINE_DESIGN_STEALTH_DESC:0 "Bu doktrin, radar kesit alanı azaltılmış ve hayatta kalma kabiliyeti artırılmış uçakların geliştirilmesine öncelik verir. Hayalet tasarımlar, düşman algılayıcı ağları boyunca tespit edilmeyi en aza indiren düşük gözlenebilirlik malzemelerini, elektronik karşı tedbirleri ve yapısal biçimlenmeyi vurgular."
 SUBDOCTRINE_DESIGN_EW:0 "Elektronik Harp Tasarımları"
 SUBDOCTRINE_DESIGN_EW_DESC:0 "Bu doktrin, özel elektronik harp sistemlerinin uçak platformlarına entegre edilmesine odaklanır. Elektronik harp tasarımları, harekât ortamında düşman hava savunmasının etkinliğini aşındırmak için aktif karıştırmayı, pasif algılamayı ve bastırma yeteneklerini vurgular."
 SUBDOCTRINE_DESIGN_MODULAR:0 "Modüler Tasarımlar"
 SUBDOCTRINE_DESIGN_MODULAR_DESC:0 "Bu doktrin, uçak geliştirmeyi açık mimari ve standartlaştırılmış bileşen çerçeveleri etrafında düzenler. Modüler tasarımlar, hızlı yetenek yükseltmelerini, azaltılmış ömür döngüsü maliyetlerini ve çeşitli görev gereksinimlerinde esnek platform uyarlamasını vurgular."
 SUBDOCTRINE_HEAVY_AEW:0 "Havadan Erken Uyarı"
 SUBDOCTRINE_HEAVY_AEW_DESC:0 "Bu doktrin, büyük uçak harekâtlarını havadan gözetleme ve muharebe yönetimi etrafında yapılandırır. Havadan erken uyarı kavramları, geniş alan tespitini, gerçek zamanlı veri entegrasyonunu ve hava varlıklarının harekât sahası boyunca eş güdümlü yönlendirilmesini vurgular."
 SUBDOCTRINE_HEAVY_AIRLIFT:0 "Stratejik Hava Nakliyesi"
 SUBDOCTRINE_HEAVY_AIRLIFT_DESC:0 "Bu doktrin, ağır uçak harekâtlarını kuvvetlerin, teçhizatın ve ikmal malzemesinin stratejik intikali etrafında düzenler. Stratejik hava nakliyesi kavramları, küresel erişimi, kesintisiz taşıma hacmini ve uzak mesafelerdeki harekâtı desteklemek için esnek üslenmeyi vurgular."
 SUBDOCTRINE_HEAVY_REFUELING:0 "Havada Yakıt İkmali"
 SUBDOCTRINE_HEAVY_REFUELING_DESC:0 "Bu doktrin, tanker uçak harekâtlarını kesintisiz hava harekâtı planlamasına entegre eder. Havada yakıt ikmali kavramları, uzatılmış harekât erişimini, sürekli hava varlığını ve çok rollü havacılık harekâtlarında eş güdümlü yakıt desteğini vurgular."
 SUBDOCTRINE_MULTIROLE_DOMINANCE:0 "Hava Hâkimiyetli Çok Rollü"
 SUBDOCTRINE_MULTIROLE_DOMINANCE_DESC:0 "Bu doktrin, çok rollü uçakları hava hâkimiyeti kurmanın başlıca platformları olarak kullanır. Hava hâkimiyetli çok rollü kavramlar, hava alanında mücadele edip denetimi sağlamak için görüş ötesi çatışma yeteneğinin çok görevli esneklikle kaynaştırılmasını vurgular."
 SUBDOCTRINE_MULTIROLE_CARRIER:0 "Uçak Gemisi Çok Rollü"
 SUBDOCTRINE_MULTIROLE_CARRIER_DESC:0 "Bu doktrin, çok rollü uçak harekâtlarını uçak gemisi tabanlı konuşlanma ve deniz vuruş görevleri etrafında yapılandırır. Uçak gemisi çok rollü kavramlar, eş güdümlü filo harekâtını, güverteden kalkışlı önleme görevlerini ve hava gücünün deniz harekâtı planlamasına entegrasyonunu vurgular."
 SUBDOCTRINE_STRIKE_SEAD:0 "SEAD/DEAD Harekâtı"
 SUBDOCTRINE_STRIKE_SEAD_DESC:0 "Bu doktrin, vurucu uçak harekâtlarını düşman hava savunma ağlarının bastırılması ve yok edilmesi etrafında düzenler. SEAD/DEAD kavramları, radar karşıtı silahları, eş güdümlü elektronik saldırıyı ve çekişmeli hava sahasında hareket serbestisini mümkün kılmak için yer tabanlı tehditlerin sistematik biçimde ortadan kaldırılmasını vurgular."
 SUBDOCTRINE_STRIKE_INTERDICTION:0 "Derin Engelleme"
 SUBDOCTRINE_STRIKE_INTERDICTION_DESC:0 "Bu doktrin, vurucu uçakları düşmanın harekât derinliğini hassas uzun menzilli çatışmalarla aksatmaya odaklar. Derin engelleme kavramları, uzak mesafe silahlarını, hedef dosyası planlamasını ve düşman yetenekleri cepheye ulaşmadan aşındırmak için eş güdümlü vuruş paketlerini vurgular."
 SUBDOCTRINE_STRIKE_CAMPAIGN:0 "Hava Engelleme Harekâtı"
 SUBDOCTRINE_STRIKE_CAMPAIGN_DESC:0 "Bu doktrin, vurucu ve yakın hava destek uçaklarını düşman kara kuvvetlerine karşı kesintisiz engelleme harekâtları etrafında yapılandırır. Hava engelleme harekâtı kavramları, sürekli varlığı, havada uzun süre kalabilen platformları ve düşman manevrasını kesintisiz aşındırmak için ileri kara kontrolörleriyle sıkı entegrasyonu vurgular."
 SUBDOCTRINE_FIGHTER_BVR:0 "Görüş Ötesi Muharebe"
 SUBDOCTRINE_FIGHTER_BVR_DESC:0 "Bu doktrin, av uçağı harekâtlarını radar güdümlü füzelerle görüş ötesi çatışma etrafında yapılandırır. Görüş ötesi muharebe kavramları, düşman uçaklarını görsel temas kurulmadan yenmek için uzun menzilli tespiti, çoklu hedef izlemeyi ve ilk atışta vurma olasılığını vurgular."
 SUBDOCTRINE_FIGHTER_WVR:0 "Görüş İçi It Dalaşı"
 SUBDOCTRINE_FIGHTER_WVR_DESC:0 "Bu doktrin, av uçağı pilotlarını görüş menzili içinde yakın mesafe manevra muharebesi için eğitir. Görüş içi it dalaşı kavramları, yakın çatışmalarda top ve kısa menzilli füzelerle düşürme elde etmek için uçak çevikliğini, durumsal farkındalığı ve saldırgan taarruz taktiklerini vurgular."
 SUBDOCTRINE_FIGHTER_STEALTH:0 "Hayalet Av Uçağı Harekâtı"
 SUBDOCTRINE_FIGHTER_STEALTH_DESC:0 "Bu doktrin, beşinci nesil av uçağı harekâtlarını düşük gözlenebilirlikli nüfuz ve ilk görüşte çatışma etrafında yapılandırır. Hayalet av uçağı kavramları, düşmanlar tepki veremeden hava hâkimiyeti elde etmek için azaltılmış tespit edilebilirliği, dahili silah taşımayı ve katmanlı hava savunma ortamlarına eş güdümlü nüfuzu vurgular."
 SUBDOCTRINE_FIGHTER_INTERCEPTOR:0 "Özel Önleyiciler"
 SUBDOCTRINE_FIGHTER_INTERCEPTOR_DESC:0 "Bu doktrin, av uçağı kuvvetlerini hava sahası ihlallerine ve bombardıman uçaklarının önlenmesine hızlı müdahale için düzenler. Özel önleyici kavramları, yüksek hızlı kalkış usullerini, yerden yönlendirmeli önleme prosedürlerini ve ulusal ve müttefik hava sahasını korumak için bölge tabanlı alarm duruşlarını vurgular."
 DOCTRINE_TRACK_DRONE_WARFARE:0 "İHA Harbi"
 GRAND_DOCTRINE_AUTONOMOUS_AIR:0 "Otonom Hava Harekâtı"
 GRAND_DOCTRINE_AUTONOMOUS_AIR_DESC:0 "Bu büyük doktrin, hava gücünü insansız sistemler, uzaktan harekât ve otonom vuruş kapasitesi etrafında yapılandırır. Otonom hava harekâtı kavramları, azaltılmış pilot riskini, kesintisiz istihbarat, gözetleme ve keşfi ve insansız platformların hava harekâtının her katmanına entegrasyonunu vurgular."
 SUBDOCTRINE_DRONE_MALE:0 "MALE SİHA Harekâtı"
 SUBDOCTRINE_DRONE_MALE_DESC:0 "Bu doktrin, hava harekâtlarını orta irtifa uzun havada kalış süreli insansız muharip uçaklar etrafında yapılandırır. MALE SİHA kavramları, kesintisiz gözetlemeyi, uzaktan pilotlu vuruş görevlerini ve kara ve ortak harekâtı desteklemek için hedef bölgeler üzerinde sürekli varlığı vurgular."
 SUBDOCTRINE_DRONE_UCAS:0 "İMHA Uçak Gemisi Vuruşu"
 SUBDOCTRINE_DRONE_UCAS_DESC:0 "Bu doktrin, insansız muharip hava sistemlerini uçak gemisi taarruz grubu harekâtlarına entegre eder. İMHA uçak gemisi kavramları, insan pilotları riske atmadan deniz platformlarından hava gücü yansıtmak için görünmez güverteden kalkışlı vuruş görevlerini, genişletilmiş uçak gemisi erişimini ve otonom filo savunmasını vurgular."
 SUBDOCTRINE_DRONE_LOITERING:0 "Güdümlü Mühimmat Dolaştırma"
 SUBDOCTRINE_DRONE_LOITERING_DESC:0 "Bu doktrin, vuruş harekâtlarını sabit veya hareketli hedeflere saldırmadan önce uzun süre uçabilen dolaşan mühimmat etrafında yapılandırır. Dolaşan mühimmat kavramları, düşük maliyetli doyurmayı, zırh karşıtı hassasiyeti ve harekât alanı boyunca kesintisiz öldürücü kapsama sağlamak için dağıtık fırlatmayı vurgular."
 SUBDOCTRINE_DRONE_COUNTER:0 "İHA Karşıtı Harekât"
 SUBDOCTRINE_DRONE_COUNTER_DESC:0 "Bu doktrin, düşman insansız hava sistemlerini tespit etmek, önlemek ve yenmek için hava ve kara kuvvetlerini düzenler. İHA karşıtı kavramlar, kuvvetleri ve kritik varlıkları insansız sistemlerin büyüyen tehdidinden korumak için katmanlı elektronik karıştırmayı, özel önleme platformlarını ve bütünleşik alçak irtifa radarını vurgular."
 SUBDOCTRINE_DRONE_SWARM:0 "İHA Sürüsü Entegrasyonu"
 SUBDOCTRINE_DRONE_SWARM_DESC:0 "Bu doktrin, hava harekâtlarını çok sayıda eş güdümlü otonom ve yarı otonom platform etrafında yapılandırır. İHA sürüsü kavramları, düşman savunmasını bunaltmak ve insan mürettebatı için azaltılmış riskle kitle etkisi yaratmak amacıyla dağıtık hedeflemeyi, harcanabilir kuvvet kullanımını ve insanlı-insansız ekip çalışmasını vurgular."
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND:0 "Merkez Komuta"
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND_DESC:0 "Bu doktrin, kara kuvvetlerini planlamanın, eş güdümün ve icranın tek bir otoriteden yönetildiği birleşik bir merkezi komuta altında düzenler. Merkez komuta yapıları, harekât niyetinde tutarlılığı ve kara kuvvetlerinin muharebe alanı boyunca senkronize kullanımını sağlar."
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND:0 "Merkeziyetsiz Komuta"
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND_DESC:0 "Bu doktrin, komuta yetkisini kara kuvvetleri içinde birden fazla kademeye dağıtarak alt birliklerin atanmış hedefler dâhilinde harekât planlayıp yürütmesini sağlar. Merkeziyetsiz komuta yapıları, muharebe alanı boyunca inisiyatifi ve duyarlı karar almayı vurgular."
 SUBDOCTRINE_STRUCTURE_BCT:0 "Tabur Muharebe Timleri"
 SUBDOCTRINE_STRUCTURE_BCT_DESC:0 "Bu doktrin, kara kuvvetlerini birleşik silah harekâtı yürütmek üzere tasarlanmış, kendi kendine yeten tabur düzeyindeki birlikler etrafında yapılandırır. Tabur muharebe timleri, atanmış harekât alanlarında etkin çalışmak için manevra, ateş desteği ve idame unsurlarını bütünleştirir."
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY:0 "Merkeziyetsiz İkmal"
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY_DESC:0 "Bu doktrin, kara kuvvetlerinin idamesini birden fazla harekât alanındaki birlikleri destekleyen dağıtık lojistik yapıları üzerinden düzenler. Merkeziyetsiz ikmal kavramları, harekât temposunu ve sürekliliğini korumak için kaynakların yerel denetimini vurgular."
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY:0 "Merkezi İkmal"
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY_DESC:0 "Bu doktrin, kara kuvvetlerinin idamesini harekât alanı boyunca ikmal dağıtımını koordine eden merkezi lojistik yapıları altında düzenler. Merkezi ikmal kavramları, kara harekâtına tutarlı destek sağlamak için birleşik planlamayı ve denetimi vurgular."
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY:0 "Yağmacı İkmal"
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY_DESC:0 "Bu doktrin, kara kuvvetlerini harekât ortamında yerel olarak bulunan kaynakların kullanımıyla idame ettirir. Yağmacı ikmal kavramları, süregelen kara harekâtını desteklemek için uyarlanabilir tedariğe ve ele geçirilen veya doğaçlama malzemenin entegrasyonuna odaklanır."
 SUBDOCTRINE_OPERATION_GUERRILLA:0 "Gerilla Harekâtı"
 SUBDOCTRINE_OPERATION_GUERRILLA_DESC:0 "Bu doktrin, kara harekâtlarını çekişmeli ortamlarda faaliyet gösteren düzensiz ve dağınık muharebe birlikleri etrafında yapılandırır. Gerilla harekâtı, kara muharebe sahasını şekillendirmek için hareketliliği, yerel inisiyatifi ve sürekli baskıyı vurgular."
 SUBDOCTRINE_OPERATION_INSURGENT:0 "İsyancı Harekât"
 SUBDOCTRINE_OPERATION_INSURGENT_DESC:0 "Bu doktrin, kara kuvvetlerini merkeziyetsiz ve halkın içine gömülü muharebe unsurlarınca yürütülen düzensiz harp etrafında düzenler. İsyancı harekât, harekât ortamını etkilemek için kesintisiz çatışmayı ve halk merkezli denetimi vurgular."
 SUBDOCTRINE_OPERATION_COIN:0 "İsyan Bastırma Harekâtı"
 SUBDOCTRINE_OPERATION_COIN_DESC:0 "Bu doktrin, kara kuvvetlerini düzensiz tehditleri halk denetimi, istihbarat güdümlü doğrudan eylem baskınları ve hızlı müdahale kuvvetleriyle yenecek şekilde yapılandırır. İsyan bastırma harekâtı, istikrarı yeniden kurmak için kesintisiz varlığı ve sivil-asker iş birliğini vurgular."
 SUBDOCTRINE_OPERATION_URBAN_WARFARE:0 "Kent Harbi Harekâtı"
 SUBDOCTRINE_OPERATION_URBAN_WARFARE_DESC:0 "Bu doktrin, kara kuvvetlerini şehirlerde ve mega kentlerde muharebe için uzmanlaştırır. Kent harbi harekâtı, karmaşık dikey ve yatay muharebe sahasını denetim altına almak için düğüm düğüm temizlemeyi, sızma taktiklerini ve birbirine kenetlenen savunma ateşlerini vurgular."
 SUBDOCTRINE_OPERATION_ADVERSE:0 "Olumsuz Koşullarda Harekât"
 SUBDOCTRINE_OPERATION_ADVERSE_DESC:0 "Bu doktrin, kara kuvvetlerini düşmanca ve bozulmuş koşullarda harekât yürütmeye hazırlar. Olumsuz koşullarda harekât, zorlu harekât ortamlarında uyum sağlamayı, direnci ve kesintisiz etkinliği vurgular."
 SUBDOCTRINE_OPERATION_VOLUNTEER:0 "Gönüllü Harekâtı"
 SUBDOCTRINE_OPERATION_VOLUNTEER_DESC:0 "Bu doktrin, kara kuvvetleri harekâtını seçilmiş birliklerin dış hedefleri desteklemek üzere ulusal sınırların ötesine konuşlandırılması etrafında yapılandırır. Gönüllü harekâtı, sınırlı ölçekli müdahaleyi, harekât özerkliğini ve daha geniş stratejik niyetle uyumu vurgular."
 SUBDOCTRINE_OPERATION_DEEP_BATTLE:0 "Derin Muharebe Harekâtı"
 SUBDOCTRINE_OPERATION_DEEP_BATTLE_DESC:0 "Bu doktrin, kara harekâtlarını düşman kuvvetleriyle muharebe sahasının birden fazla derinliğinde eşzamanlı çatışacak şekilde yapılandırır. Derin muharebe kavramları, hemen ön hattın ötesindeki komuta, idame ve manevra unsurlarını aksatmak için eş güdümlü eylemleri vurgular."
 SUBDOCTRINE_OPERATION_THUNDER_RUN:0 "Yıldırım Akını Harekâtı"
 SUBDOCTRINE_OPERATION_THUNDER_RUN_DESC:0 "Bu doktrin, kara harekâtlarını hız ve şok yoluyla kesin etkiler elde etmeyi amaçlayan hızlı ve yoğun hamleler etrafında yapılandırır. Yıldırım akını harekâtı, harekât ortamını bozmak için ivmeyi ve odaklı manevrayı vurgular."
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY:0 "Hafif Piyade Harekâtı"
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY_DESC:0 "Bu doktrin, kara harekâtlarını çeşitli arazi ve harekât koşullarına uygun, son derece hareketli piyade birlikleri etrafında düzenler. Hafif piyade harekâtı, muharebe sahası boyunca esnekliği, hızlı konuşlanmayı ve kalıcı varlığı vurgular."
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE:0 "Sabit Savunma Harekâtı"
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE_DESC:0 "Bu doktrin, savunma amaçlı kara harekâtlarını sabit mevziler ve hazırlanmış savunma ağları etrafında yapılandırır. Sabit savunma harekâtı, anahtar araziyi elde tutmak için alan denetimini ve kuvvetlerin örgütlü kullanımını vurgular."
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE:0 "Esnek Savunma Harekâtı"
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE_DESC:0 "Bu doktrin, savunma harekâtlarını kontrollü yer değiştirme ve derinliğe dayalı kuvvet kullanımı yoluyla düzenler. Esnek savunma kavramları, ardışık savunma katmanları boyunca muharebe etkinliğini korurken muharebe sahasını şekillendirmeyi vurgular."
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE:0 "Hareketli Savunma Harekâtı"
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE_DESC:0 "Bu doktrin, savunma amaçlı kara harekâtlarını düşman eylemlerine dinamik biçimde karşılık verebilen manevra odaklı kuvvetler etrafında yapılandırır. Hareketli savunma kavramları, savunma muharebe sahasında esnekliği ve eş güdümlü karşı manevrayı vurgular."
 SUBDOCTRINE_TECHNOLOGY_HIGH:0 "Yüksek Teknolojili Ordu"
 SUBDOCTRINE_TECHNOLOGY_HIGH_DESC:0 "Bu doktrin, kara kuvvetlerini muharebe, komuta ve idame işlevleri boyunca ileri teknolojilerin kapsamlı entegrasyonu etrafında yapılandırır. Yüksek teknolojili ordu kavramları, teknolojik üstünlüğü harekât etkinliğinin merkezi unsuru olarak vurgular."
 SUBDOCTRINE_TECHNOLOGY_COMMON:0 "Sıradan Teknolojili Ordu"
 SUBDOCTRINE_TECHNOLOGY_COMMON_DESC:0 "Bu doktrin, kara kuvvetlerini yaygın olarak bulunan ve standartlaştırılmış askeri teknolojiler etrafında düzenler. Sıradan teknolojili ordu kavramları, birlikler arasında güvenilirliği, ölçeklenebilirliği ve geniş birlikte çalışabilirliği vurgular."
 SUBDOCTRINE_TECHNOLOGY_LOW:0 "Düşük Teknolojili Ordu"
 SUBDOCTRINE_TECHNOLOGY_LOW_DESC:0 "Bu doktrin, kara kuvvetlerini ileri teknolojik sistemlere asgari bağımlılık etrafında yapılandırır. Düşük teknolojili ordu kavramları, sınırlı teknolojik koşullarda temel teçhizatı, sadeliği ve harekât işlevselliğini vurgular."
 SUBDOCTRINE_TRAINING_REDUCED:0 "Kısaltılmış Eğitim"
 SUBDOCTRINE_TRAINING_REDUCED_DESC:0 "Bu doktrin, kuvvet yaratma ve konuşlandırmayı hızlandırmak için resmî eğitim gereksinimlerini en aza indirir. Kısaltılmış eğitim kavramları, temel harekât hazırlığını ve kuvvetlerin hızla hazır hale gelmesini vurgular."
 SUBDOCTRINE_TRAINING_ADVANCED:0 "İleri Eğitim"
 SUBDOCTRINE_TRAINING_ADVANCED_DESC:0 "Bu doktrin, birlik bütünlüğünü ve harekât yeterliliğini artırmak için kapsamlı ve yapılandırılmış eğitim programlarını vurgular. İleri eğitim kavramları, kuvvetleri karmaşık ve zorlu harekât ortamlarına hazırlamaya odaklanır."
 SUBDOCTRINE_TRAINING_SKILLS:0 "Beceri Okulu"
 SUBDOCTRINE_TRAINING_SKILLS_DESC:0 "Bu doktrin, eğitimi uzmanlaşmış askeri becerilerin sistematik geliştirilmesi etrafında yapılandırır. Beceri odaklı eğitim, kara kuvvetleri içinde teknik yetkinliği ve role özgü yeterliliği vurgular."
 SUBDOCTRINE_TRAINING_SURVIVAL:0 "Hayatta Kalma Eğitimi"
 SUBDOCTRINE_TRAINING_SURVIVA_DESC:0 "Bu doktrin, çetin ve düşmanca ortamlarda dayanıklılığa ve uyum sağlamaya odaklanan eğitimi vurgular. Hayatta kalma eğitimi kavramları, kuvvetleri olumsuz koşullarda harekâtı sürdürmeye hazırlar."
 SUBDOCTRINE_LEADERSHIP_OFFICER:0 "Subay Eğitimi"
 SUBDOCTRINE_LEADERSHIP_OFFICER_DESC:0 "Bu doktrin, liderlik gelişimini resmî eğitim ve komuta hazırlığı yoluyla subaylar üzerinde toplar. Subay eğitimi kavramları, kara kuvvetleri içinde planlamayı, eş güdümü ve örgütsel denetimi vurgular."
 SUBDOCTRINE_LEADERSHIP_NCO:0 "Astsubay Eğitimi"
 SUBDOCTRINE_LEADERSHIP_NCO_DESC:0 "Bu doktrin, liderlik gelişimini kara kuvvetleri komutasının belkemiği olan astsubaylar etrafında yapılandırır. Astsubay eğitimi kavramları, taktik liderliği ve birliklerin günlük etkinliğini vurgular."
 SUBDOCTRINE_LEADERSHIP_REDUCED:0 "Düşürülmüş Standartlar"
 SUBDOCTRINE_LEADERSHIP_REDUCED_DESC:0 "Bu doktrin, komuta kapasitesini genişletmek için resmî liderlik yeterlilik gereksinimlerini düşürür. Düşürülmüş standart kavramları, kuvvet genişlemesini desteklemek için pratik liderlik yetiştirmeyi vurgular."
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY:0 "Temel Piyade Yükü"
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY_DESC:0 "Bu doktrin, temel silahlara ve destek donanımına odaklanan standartlaştırılmış bir piyade teçhizat yükünü tanımlar. Temel piyade yükü kavramları, kesintisiz kara harekâtı için dengeyi ve genel amaçlı yeteneği vurgular."
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY:0 "Hafif Piyade Yükü"
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY_DESC:0 "Bu doktrin, piyade teçhizatını azaltılmış ağırlık ve sadeleştirilmiş yükler etrafında yapılandırır. Hafif piyade yükü kavramları, çeşitli harekât ortamlarında hareketliliği ve konuşlandırma kolaylığını vurgular."
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY:0 "Ağır Piyade Yükü"
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY_DESC:0 "Bu doktrin, piyade birliklerini genişletilmiş silah ve koruma sistemleriyle donatır. Ağır piyade yükü kavramları, kara çatışmalarında artırılmış ateş gücünü ve dayanıklılığı vurgular."
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED:0 "Motorlu Temel Düzen"
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED_DESC:0 "Bu doktrin, motorlu piyade birlikleri için standartlaştırılmış bir teçhizat yapılandırması tanımlar. Motorlu temel düzenler, tekerlekli nakliyeyle desteklenen dengeli hareketliliği ve muharebe yeteneğini vurgular."
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED:0 "Motorlu Hafif Düzen"
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED_DESC:0 "Bu doktrin, motorlu birlik teçhizatını daha hafif araçlar ve azaltılmış dahili sistemler etrafında yapılandırır. Hafif motorlu düzenler, kara harekâtında hızı ve harekât esnekliğini vurgular."
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED:0 "Motorlu Ağır Düzen"
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED_DESC:0 "Bu doktrin, motorlu birlikleri daha ağır araçlar ve geliştirilmiş dahili teçhizatla donatır. Ağır motorlu düzenler, kara harekâtında korumayı ve kesintisiz muharebe yeteneğini vurgular."
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED:0 "Karma Mekanize Düzen"
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED_DESC:0 "Bu doktrin, mekanize birlikleri nakliye ve muharebe araçlarının bileşimi etrafında yapılandırır. Karma mekanize düzenler, çeşitli teçhizatın entegrasyonu yoluyla uyum sağlamayı vurgular."
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED:0 "ZPT Mekanize Düzen"
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED_DESC:0 "Bu doktrin, mekanize birlikleri başlıca nakliye platformu olarak zırhlı personel taşıyıcıları etrafında düzenler. ZPT mekanize düzenler, kara harekâtında korumalı hareketliliği ve piyade desteğini vurgular."
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED:0 "ZMA Mekanize Düzen"
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED_DESC:0 "Bu doktrin, mekanize kuvvetleri bütünleşik muharebe sistemlerine sahip zırhlı muharebe araçları etrafında yapılandırır. ZMA mekanize düzenler, birleşik hareketliliği ve doğrudan ateş desteğini vurgular."
 SUBDOCTRINE_EQUIPMENT_MBT_TANK:0 "Tank Teçhizatı"
 SUBDOCTRINE_EQUIPMENT_MBT_TANK_DESC:0 "Bu doktrin, ana muharebe tankı birliklerinin konuşlandırılmasına ve idamesine odaklanır. Tank teçhizatı kavramları, zırhlı ateş gücünü kara muharebe kuvvetlerinin merkezi unsuru olarak vurgular."
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK:0 "Hafif Tank Düzeni"
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK_DESC:0 "Bu doktrin, zırhlı birlikleri esnek kara harekâtına uygun daha hafif tank platformları etrafında yapılandırır. Hafif tank düzenleri, zırhlı birlikler içinde hareketliliği ve harekât erişimini vurgular."
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK:0 "Süper Ağır Teçhizat"
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK_DESC:0 "Bu doktrin, zırhlı kuvvetleri olağanüstü ağır ve korumalı araç platformları etrafında düzenler. Süper ağır teçhizat kavramları, kara birlikleri içinde azami zırhlı varlığı vurgular."
 SUBDOCTRINE_EQUIPMENT_WALKER_TANK:0 "Yürüyen Tank Konuşlanması"
 SUBDOCTRINE_EQUIPMENT_WALKER_TANK_DESC:0 "Bu doktrin yürüyen silahlı kuvvetleri düzenler."
 gait_optimization:0 "Yürüyüş Optimizasyonu Tatbikatları"
