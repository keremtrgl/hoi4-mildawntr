l_english:
 balkan_news.1.t:0 "Karadžić Soykirimdan Mahkûm Edildi"
 balkan_news.1.d:0 "Lahey mahkemesi, Radovan Karadžić'i Srebrenitsa'daki soykırımdan ve Bosna genelindeki insanlığa karşı suçlardan suçlu buldu ve onu kırk yıl hapse mahkûm etti. Dayton'dan yirmi yıl sonra Bosnalı Sırpların savaş dönemi lideri, savaşının doğurduğu mahkeme tarafından yargılandı."
 balkan_news.1.a:0 "Karar Saraybosna'da yüksek sesle okundu"
 balkan_news.1.b:0 "Bazıları Sırpların tamamına karşı bir karar diyor"
 balkan_news.1.c:0 "Geciken adalet"
 balkan_news.2.t:0 "Karadžić'e Ömür Boyu Hapis"
 balkan_news.2.d:0 "İstinaf dairesi Radovan Karadžić'in itirazını reddetti ve suçlarının ağırlığı için ilk kırk yıllık cezayı yetersiz bularak cezasını ömür boyu hapse çıkardı. Bu, Sırp Cumhuriyeti'ne savaş boyunca önderlik eden adam hakkında verilen son sözdür."
 balkan_news.2.a:0 "Lahey davayı kapatıyor"
 balkan_news.3.t:0 "Mladić Soykirimdan Mahkûm Edildi"
 balkan_news.3.d:0 "Mahkeme, Ratko Mladić'i soykırım, savaş suçları ve insanlığa karşı suçlardan mahkûm etti ve ömür boyu hapse çarptırdı. Eski general yargıçlara bağırdı ve karar okunmadan önce mahkeme salonundan çıkarılmak zorunda kaldı. Srebrenitsa'da ölenlerin anneleri sessizce izledi."
 balkan_news.3.a:0 "General sonunda hesap veriyor"
 balkan_news.4.t:0 "Mahkeme Salonunda Intihar"
 balkan_news.4.d:0 "Yargıçların yirmi yıllık cezasını onamasından dakikalar sonra Bosnalı Hırvat general Slobodan Praljak savaş suçlusu olmadığını ilan etti ve kameraların önünde bir şişe zehir içti. Birkaç saat içinde öldü. İstinaf dairesi, Herzeg-Bosna'nın altı eski liderinin tamamının mahkûmiyetini onadı ve Zagreb'e kadar uzanan ortak bir suç girişimi tespit etti."
 balkan_news.4.a:0 "Mahkemenin adaletini reddetti"
 balkan_news.4.b:0 "Mahkemenin son davasının acı sonu"
 balkan_news.5.t:0 "Mladić'in Itirazi Reddedildi"
 balkan_news.5.d:0 "Birleşmiş Milletler yargıçları Ratko Mladić'in soykırım mahkûmiyetini ve ömür boyu hapis cezasını onayarak Bosna savaşından doğan son büyük davayı kapattı. Srebrenitsa'dan çeyrek yüzyıl sonra savaşla yargısal hesaplaşma tamamlandı. Siyasi hesaplaşma ise tamamlanmadı."
 balkan_news.5.a:0 "Arşiv kapanıyor"
 CRO_nat_populism_gain_tt:0 "§RMilliyetçi sağ destek kazanıyor.§!"
 balkan_news.6.t:0 "Sirp Dünyasi Bildirgesi"
 balkan_news.6.d:0 "Belgrad ve Banja Luka, Sırbistan-Sırp Cumhuriyeti iş birliği için kalıcı bir Yüksek Konsey altında Sırp topraklarını birleştirmeye dair on üç sayfalık bir bildirgeyi ortaklaşa kabul etti. Hukuki gücü az, niyeti büyük."
 balkan_news.6.a:0 "Sahip olunmaya değer bir hami"
 balkan_news.6.b:0 "Saraybosna'nın otoritesi daha da aşınıyor"
 balkan_news.6.c:0 "Mahalleden haberler"
 balkan_news.7.t:0 "EUFOR Bastiriyor"
 balkan_news.7.d:0 "Rus tanklarının Ukrayna'ya girmesinden günler sonra AB, Bosna-Hersek'teki EUFOR Althea garnizonunu kabaca iki katına çıkardı ve taşma riskine karşı bir önlem olarak yedek askerleri uçakla getirdi."
 balkan_news.7.a:0 "Güven veren bir kararlılık gösterisi"
 balkan_news.7.b:0 "Başka yerde alınmış bir önlem"
 balkan_news.8.t:0 "Erdogan Saraybosna'da Miting Yapti"
 balkan_news.8.d:0 "Batı Avrupa genelinde kampanya yapması yasaklanan Erdoğan, yarışın tek Avrupa mitingini Saraybosna'da yaptı, binlerce kişi çekti ve SDA'dan Bakir İzetbegoviç ile görüştü. Dodik buna müdahale diyor."
 balkan_news.8.a:0 "Saraybosna'nın güvenebileceği bir dost"
 balkan_news.8.b:0 "Başkasının ülkesinde bir miting"
 balkan_news.9.t:0 "Lavrov'un Saraybosna Ziyareti"
 balkan_news.9.d:0 "Sergey Lavrov Saraybosna'yı ziyaret etti ve havalimanında yalnızca Dodik tarafından karşılandı. Bu vesileyle hiçbir Bosna bayrağı çekilmedi. Ayrılırken, kökeni Luhansk'a dayanan yüzlerce yıllık bir Ortodoks ikonunu yanında götürdü; Kiev bu hediyenin açıklanmasını istiyor."
 balkan_news.9.a:0 "Sırp Cumhuriyeti'nin kendi dış politikası"
 balkan_news.9.b:0 "Her zamanki gibi bir ziyaret"
