l_english:
 internal_factions_events.53.t:0 "Parti Sadakati Mercek Altında"
 internal_factions_events.53.d:0 "Komünist Kadrolar, hükümete ideolojik olarak güvenilmez bulduğu bürokratik yetkililerin listesini sundu. Resmî bir sadakat soruşturması ve parti standartlarını karşılamayanların görevden alınmasını talep ediyorlar."
 internal_factions_events.53.o1:0 "Tasfiyeyi gerçekleştir"
 internal_factions_events.53.o2:0 "Taleplerini reddet"
 internal_factions_events.53.o3:0 "Sınırlı bir inceleme başlat"
 internal_factions_events.54.t:0 "Kadrolar Kolektifleştirme Çağrısı Yapıyor"
 internal_factions_events.54.d:0 "Komünist Kadrolar özel tarım mülkiyetine karşı sabrını yitirdi. Hükümeti, verimlilik ve ideolojik uyum için tarım arazilerini devlet denetiminde toplayan bir kolektifleştirme kampanyası başlatmaya zorluyorlar."
 internal_factions_events.54.o1:0 "Kolektifleştirmeyi destekle"
 internal_factions_events.54.o2:0 "Öneriyi reddet"
 internal_factions_events.54.o3:0 "Sınırlı toprak reformu uygula"
 internal_factions_events.55.t:0 "Sanayi Liman Genişletmesi Talep Ediyor"
 internal_factions_events.55.d:0 "Denizcilik Sektörü, sahil boyunca liman tesislerinin genişletilmesi için bir öneri sundu ve tıkanıklığın kendilerine yıllık milyonlara mal olduğunu savundu. Yerel toprak sahipleri ve şehir planlamacıları, yerinden edilme ve kentsel aksama kaygılarını öne sürerek itiraz etti."
 internal_factions_events.55.o1:0 "Genişletmeyi onayla"
 internal_factions_events.55.o2:0 "Öneriyi reddet"
 internal_factions_events.55.o3:0 "Uzlaşma müzakere et"
 internal_factions_events.56.t:0 "Korsanlık Sevkiyat Rotalarını Aksatıyor"
 internal_factions_events.56.d:0 "Korsanlıktaki artış ticari deniz yollarımızı tehdit altına soktu. Denizcilik sektörü temsilcileri gemilerini ve yüklerini korumak için hükümetin müdahalesini talep ediyor; hareketsizliğin sigorta maliyetlerini yükselteceği ve yatırımı caydıracağı uyarısında bulunuyor."
 internal_factions_events.56.o1:0 "Deniz eskort programını finanse et"
 internal_factions_events.56.o2:0 "Sorunu görmezden gel"
 internal_factions_events.56.o3:0 "Uluslararası iş birliği ara"
 internal_factions_events.57.t:0 "Yabancı Casus Ağı Ortaya Çıkarıldı"
 internal_factions_events.57.d:0 "İstihbarat analistleri sınırlarımız içinde faaliyet gösteren yabancı bir casus ağı tespit etti. İstihbarat Topluluğu, ağ daha fazla gizli bilgi çıkarmadan hükümetin kararlı biçimde harekete geçmesi için baskı yapıyor."
 internal_factions_events.57.o1:0 "Ağı kamuoyuna ifşa et"
 internal_factions_events.57.o2:0 "Sessizce etkisiz hale getir"
 internal_factions_events.57.o3:0 "Harekete geçme"
 internal_factions_events.58.t:0 "Yasama İstihbarat Harcamalarını Sorguluyor"
 internal_factions_events.58.d:0 "Bir sonraki seçim döneminden önce yasama üyeleri, istihbarat servislerinin opak bütçesi hakkında sert sorular yöneltti. Savunuculuk grupları daha fazla hesap verebilirlik talep ederken İstihbarat Topluluğu, şeffaflığın süren operasyonları tehlikeye atacağı uyarısında bulunuyor."
 internal_factions_events.58.o1:0 "Bütçeyi tamamen savun"
 internal_factions_events.58.o2:0 "Kısmi bilgi paylaş"
 internal_factions_events.58.o3:0 "Tam şeffaflık taahhüdünde bulun"
 internal_factions_events.59.t:0 "Yabancı Savaşçılar Sınırı Geçiyor"
 internal_factions_events.59.d:0 "Süren çatışmanın çektiği bir yabancı savaşçı dalgası topraklarımıza girdi. Davamıza hizmet önerisinde bulunuyorlar, ancak güvenilirlikleri ve disiplinleri belirsiz. Yabancı Cihatçı ağlar hükümetten onlara bir rol bulmasını istiyor."
 internal_factions_events.59.o1:0 "Onları düzenli birliklere entegre et"
 internal_factions_events.59.o2:0 "Onları derhal cepheye sür"
 internal_factions_events.59.o3:0 "Onları sınırdan geri çevir"
 internal_factions_events.60.t:0 "Cihatçı Tugaylar Özerklik Talep Ediyor"
 internal_factions_events.60.d:0 "Artan sayılarından cesaret alan Yabancı Cihatçı tugaylar, kendi komuta yapıları altında faaliyet gösteren özerk bir güç olarak resmen tanınmayı talep ediyor. Operasyonel bağımsızlığın, bürokratik engel olmadan daha etkili hareket etmelerini sağlayacağını savunuyorlar."
 internal_factions_events.60.o1:0 "Onlara operasyonel özerklik tanı"
 internal_factions_events.60.o2:0 "Talebi reddet"
 internal_factions_events.60.o3:0 "Onları ulusal komutaya entegre et"
 internal_factions_events.61.t:0 "Kudüs Gücü Daha Fazla Kaynak İstiyor"
 internal_factions_events.61.d:0 "Kudüs Gücü yönetimi, bölgesel vekil operasyonlarını genişletmek için ek fon ve malzeme talebini resmen sundu. Stratejik fırsatın şimdi olduğunu ve yetersiz finansmanın nüfuzu rakip güçlere kaptırma riski taşıdığını savunuyorlar."
 internal_factions_events.61.o1:0 "Tam finansman sağla"
 internal_factions_events.61.o2:0 "Kısmi destek öner"
 internal_factions_events.61.o3:0 "Talebi reddet"
 internal_factions_events.62.t:0 "Bir Komşunun Savunmasızlığı"
 internal_factions_events.62.d:0 "Kudüs Gücü istihbaratı, şu anda çatışmanın içine çekilmiş komşu bir devletin vekil baskısına karşı savunmasız olduğunu bildiriyor. Fırsat penceresi dar, ancak potansiyel stratejik kazanımlar büyük."
 internal_factions_events.62.o1:0 "Durumdan yararlan"
 internal_factions_events.62.o2:0 "İstihbaratı uyumlu devletlerle paylaş"
 internal_factions_events.62.o3:0 "Fırsatın kaçmasına izin ver"
 establish_political_commissars_decision:0 "Siyasi Komiserleri Yerleştir"
 establish_political_commissars_decision_desc:0 "İdeolojik sadakati sağlamak ve morali yükseltmek için askerî birliklere parti komiserleri yerleştir. Komiserler doğrudan Komünist Kadrolara rapor verecek ve onların silahlı kuvvetler üzerindeki nüfuzunu güçlendirecek."
 worker_reeducation_programme_decision:0 "İşçi Yeniden Eğitim Programı"
 worker_reeducation_programme_decision_desc:0 "İşgücü arasında parti ideolojisini pekiştirmek için devlet eliyle yürütülen bir yeniden eğitim programını finanse et. İşçiler çabalarını devletin önceliklerine yönelttikçe uyum artar, tüketici talebi düşer."
 maritime_safety_inspections_decision:0 "Zorunlu Deniz Güvenliği Denetimleri"
 maritime_safety_inspections_decision_desc:0 "Tüm yerel liman ve tersane tesislerinde kapsamlı bir güvenlik denetim rejimi görevlendir. Standartların yükseltilmesi sektöre güven verir ve denetim süresince tersane verimini artırır."
 naval_shipping_subsidy_decision:0 "Deniz Taşımacılığı Sübvansiyonu"
 naval_shipping_subsidy_decision_desc:0 "Yerli uzun mesafe deniz taşımacılığı işletmecilerine doğrudan devlet sübvansiyonu sağla. Program ticaret filomuzun operasyonel menzilini genişletir ve tersane verimini artırır."
 counter_intelligence_sweep_decision:0 "Karşı İstihbarat Taraması"
 counter_intelligence_sweep_decision_desc:0 "İstihbarat Topluluğuna, yabancı sızmalara karşı hükümet ve askerî ağlarda sistematik bir tarama yapma yetkisi ver. Operasyon sırasında yabancı casusluk maliyeti düşer ve haberleşme güvenliğimiz iyileşir."
 expand_intelligence_network_decision:0 "İstihbarat Ağlarını Genişlet"
 expand_intelligence_network_decision_desc:0 "Yeni denizaşırı istihbarat istasyonlarının ve insan istihbaratı kaynaklarının kurulmasını finanse et. Genişleyen ağ, düşman haberleşmesini çözme ve yabancı askerî hareketleri izleme yeteneğimizi geliştirir."
 jihadi_recruitment_drive_decision:0 "Cihatçı Devşirme Kampanyası"
 jihadi_recruitment_drive_decision_desc:0 "Yabancı savaşçıları davamıza çekmek için sempatizan ağlar genelinde aktif bir devşirme kampanyasına sponsor ol. Ek insan gücü akar ve özel kuvvetler kapasitemiz artar."
 martyr_glorification_campaign_decision:0 "Şehit Yüceltme Kampanyası"
 martyr_glorification_campaign_decision_desc:0 "Düşen savaşçıları yücelten ve şehitliği kültürel bir ideal olarak yükselten bir propaganda kampanyası başlat. Savaş coşkusu keskin biçimde artar, ancak radikalleştirici mesaj aşırılıkçı duyguları körükleme riski taşır."
 support_proxy_networks_decision:0 "Vekil Ağları Destekle"
 support_proxy_networks_decision_desc:0 "Komşu devletlerde faaliyet gösteren bölgesel vekil gruplara Kudüs Gücü aracılığıyla fon ve teçhizat aktar. Bu ağları güçlendirmek stratejik erişimimizi genişletir ve rakipler üzerindeki baskıyı sürdürmenin doğrudan maliyetini düşürür."
 quds_force_training_programme_decision:0 "Kudüs Gücü Eğitim Programı"
 quds_force_training_programme_decision_desc:0 "Kudüs Gücüne, seçilmiş askerî birimler için ileri düzey düzensiz harp eğitimi verme yetkisi ver. Alışılmadık harp ustalığı gelişir ve özel kuvvetler kapasitesi genişler."
 internal_factions_events.63.t:0 "Müteahhitler İhracat Anlaşmaları İçin Lobi Yapıyor"
 internal_factions_events.63.d:0 "Savunma müteahhitleri hükümeti, bir dizi denizaşırı silah ihracat sözleşmesine destek vermeye zorluyor. Anlaşmaların önemli gelir getireceğini ve yerli üretim hatlarını ayakta tutacağını savunuyorlar; eleştirmenler ise geniş satışların bölgesel gerginlikleri körükleyebileceği ve istenmeyen uluslararası mercek altına yol açabileceği uyarısında bulunuyor."
 internal_factions_events.63.o1:0 "Tam ihracatı onayla"
 internal_factions_events.63.o2:0 "Satışları müttefik alıcılarla sınırla"
 internal_factions_events.63.o3:0 "Lobi çabasını reddet"
 defense_procurement_programme_decision:0 "Savunma Tedarik Programı"
 defense_procurement_programme_decision_desc:0 "Yerli silah üreticilerine istikrarlı sipariş garantisi veren özel bir tedarik döngüsü başlat. Sürekli sözleşmeler askerî sanayi vergi gelirini artırır ve tüketim malı yükünü azaltır; devam eden iş birlikleri için savunma sanayisini ödüllendirir."
 classified_research_programme_decision:0 "Gizli Araştırma Programı"
 classified_research_programme_decision_desc:0 "Savunma sanayisi ortakları aracılığıyla yürütülen askerî teknoloji araştırmasına gizli fon ayır. Yatırım araştırma çıktısını hızlandırır ve haberleşme güvenliğini sağlamlaştırır; program başlangıcında bir mali transfer yapılır."
 issue_government_bonds_decision:0 "Bankacı Destekli Devlet Tahvilleri İhraç Et"
 issue_government_bonds_decision_desc:0 "Uluslararası bankacılık ağları üzerinden yönetilen, banka destekli devlet tahvillerinin ihracına izin ver. Anında sermaye girişi istikrarı artırır, ancak borç servisi süre boyunca faiz oranlarını yukarı iter."
 attract_foreign_investment_decision:0 "Yabancı Yatırım Çek"
 attract_foreign_investment_decision_desc:0 "İstikrar sinyali vermek ve girişteki engelleri azaltmak için uluslararası bankacılık bağlantılarıyla koordinasyon sağla. Kampanya, yabancı yatırım alma süresini kısaltır ve gelen sermayeden elde edilen vergi gelirini artırır."
 internal_factions_cadre_purge:0 "Kadro Tasfiyesi"
 internal_factions_cadre_purge_desc:0 "Parti komiserleri bürokraside sadakat soruşturmaları yürütüyor; idari aksama pahasına ideolojik disiplini güçlendiriyor."
 internal_factions_collectivisation_drive:0 "Kolektifleştirme Kampanyası"
 internal_factions_collectivisation_drive_desc:0 "Tarımsal kolektifleştirme sürüyor; özel çiftlikler devlet denetimine geçerken tedarik zincirlerini aksatıyor ve tüketim malı kıtlığını artırıyor."
 internal_factions_convoy_escort:0 "Deniz Eskort Programı"
 internal_factions_convoy_escort_desc:0 "Devlet destekli deniz eskortları ticari deniz yollarını koruyor ve deniz personelimizin güvenini ve tecrübesini artırıyor."
 internal_factions_piracy_losses:0 "Korsanlık Aksaması"
 internal_factions_piracy_losses_desc:0 "Denetlenmeyen korsanlık deniz yollarımızı aksatıyor, ticaret güvenini zedeliyor ve daha geniş ekonomiyi istikrarsızlaştırıyor."
 internal_factions_neutralised_spies:0 "Casusluk Ağı Dağıtıldı"
 internal_factions_neutralised_spies_desc:0 "Yabancı bir istihbarat ağı sessizce etkisiz hale getirildi; bir süre boyunca karşı casusluk yeteneklerimiz gelişti."
 internal_factions_transparency_costs:0 "İstihbarat Şeffaflığı Maliyetleri"
 internal_factions_transparency_costs_desc:0 "İstihbarat operasyonlarının kamuoyuna açıklanması, rakipler yeni ifşa edilen yöntemlere uyum sağladıkça şifreleme güvenliğimizi zayıflattı."
 internal_factions_jihadi_frontline:0 "Cihatçı Cephe Konuşlanması"
 internal_factions_jihadi_frontline_desc:0 "Doğrudan cepheye sevk edilen yabancı savaşçılar düşman hatlarına sert baskı yapıyor, ancak düzenli kuvvetlerle entegre olmamaları kanatları açıkta bırakıyor."
 internal_factions_jihadi_autonomy:0 "Cihatçı Özerk Güç"
 internal_factions_jihadi_autonomy_desc:0 "Tanınan özerk cihatçı tugaylar kendi komuta yapıları altında faaliyet gösteriyor ve özel kuvvetler tavanımızı önemli ölçüde genişletiyor."
 internal_factions_jihadi_integrated:0 "Entegre Cihatçı Güçler"
 internal_factions_jihadi_integrated_desc:0 "Ulusal komuta yapısına resmen entegre edilen yabancı savaşçılar birlik uyumunu ve organizasyonel toparlanma oranlarını iyileştirdi."
 internal_factions_quds_expanded:0 "Kudüs Gücü Genişletilmiş Operasyonlar"
 internal_factions_quds_expanded_desc:0 "Ek kaynaklar Kudüs Gücünün vekil operasyonlarını genişletmesini sağladı ve yabancı yıkıcı faaliyetlerin bakım maliyetini düşürdü."
 internal_factions_quds_operation:0 "Kudüs Gücü Stratejik Operasyonu"
 internal_factions_quds_operation_desc:0 "Kudüs Gücü komşu bir devletteki istikrarsızlıktan aktif olarak yararlanıyor ve süren operasyonlarda taktik üstünlük sağlıyor."
 fund_religious_schools_decision:0 "Dinî Okulları Finanse Et"
 fund_religious_schools_decision_desc:0 "Hükümet fonlarını Vahhabi Ulema gözetiminde faaliyet gösteren bir dinî okullar ağına aktar. Kurumlar erişimini genişlettikçe okuryazarlık oranları iyileşir ve toplumsal istikrar artar."
 enforce_moral_codes_decision:0 "Ahlak Kurallarını Uygulat"
 enforce_moral_codes_decision_desc:0 "Dinî otoritelere ülke genelinde kamusal ahlak standartlarını uygulatma yetkisi ver. Önlem Ulemanın nüfuzunu pekiştirir ve toplumsal uyumu artırır, ancak sıkılaşan kısıtlamalar tüketici harcamasını yukarı iter."
 agricultural_subsidies_decision:0 "Tarımsal Sübvansiyonlar"
 agricultural_subsidies_decision_desc:0 "Üretimi artırmak ve Çiftçiler hizbini iş birliği için ödüllendirmek amacıyla tarım sektörüne doğrudan sübvansiyon sağla. İlk harcama hazine rezervlerini azaltır, ancak verimlilik kazanımları program boyunca ekonomiyi ayakta tutar."
 rural_infrastructure_fund_decision:0 "Kırsal Altyapı Fonu"
 rural_infrastructure_fund_decision_desc:0 "Kırsal alanlardaki yol, sulama ve depolama iyileştirmelerine devlet fonu ayır. Yatırım tarım bölgelerindeki iş yükünü hafifletir ve çiftçi topluluklarının sempatisini kazandırır."
 infrastructure_investment_programme_decision:0 "Altyapı Yatırım Programı"
 infrastructure_investment_programme_decision_desc:0 "Ülkenin üretim tabanında kapsamlı bir altyapı yenilemesini finanse etmek için büyük sanayi holdingleriyle ortaklık kur. Fabrika ve ofis çıktısı program süresince artar ve holdinglerin ekonominin bir direği olarak rolünü pekiştirir."
