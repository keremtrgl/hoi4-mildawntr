l_english:
 MAPMODE_EU_MAP_MODE_NAME:0 "AB"
 MAPMODE_EU_MAP_MODE:0 "AB"
 MAPMODE_EU_MAP_MODE_DESCRIPTION:0 "Avrupa Birliği içindeki AB üye devletlerini, olası üyeleri ve mevcut makam sahiplerini gösterir."
 EU_map_mode_tooltip:0 "Avrupa Birliği"
 EU_map_mode_tooltip_delayed:0 "Avrupa Birliği'nin mevcut üyeliğini ve liderliğini gösterir.\n\n§HRenk Göstergesi:§!\n§nMavi§! = AB Üye Devleti\n§YAltın§! = Olası Üye Devlet\n\n§HMakam Sahipleri:§!\n§RKırmızı§! = Avrupa Komisyonu, Avrupa Konseyi veya Avrupa Parlamentosu Başkanı\n§9Kahverengi§! = EuroNavy Genel Sekreteri\n§GYeşil§! = EuroArmy Genel Sekreteri\n§CTurkuaz§! = Dış İlişkiler ve Güvenlik Politikası Yüksek Temsilcisi\n§0Mor§! = Avrupa Ekonomi ve Maliye Bakanı\n§YSarı§! = Avrupa Merkez Bankası Başkanı\n§PKoyu Pembe§! = Frontex Direktörü\n§OTuruncu§! = AB'nin Birleşmiş Milletler Büyükelçisi\n§pPembe§! = Avrupa Federasyonu Başkanı\n\nHaftalık güncellenir."
 MAPMODE_GDP_C_MAP_MODE_NAME:0 "Kişi Başına GSYİH"
 MAPMODE_GDP_C_MAP_MODE:0 "Kişi Başına GSYİH"
 MAPMODE_GDP_C_MAP_MODE_DESCRIPTION:0 "Bu harita modu, bir ülkenin kişi başı GSYİH'sini, yani kişi başına düşen ortalama ekonomik üretimi gösterir."
 gdp_c_map_mode_tooltip:0 "[FROM.CONTROLLER.GetNameWithFlag] Kişi Başı GSYİH'si"
 gdp_c_map_mode_tooltip_delayed:0 "§Y[FROM.CONTROLLER.GetNameWithFlag]§! Kişi Başı GSYİH'si: §Y$[?FROM.CONTROLLER:gdp_per_capita|Y] bin§!.\n\nKişi başı GSYİH, kişi başına düşen ekonomik üretimi gösterir. Daha yüksek değerler daha zengin ve daha verimli bir ekonomiye işaret eder.\n\n§HRenk Göstergesi:§!\n§9Parlak Altın§! = 8 bin altı (Düşük gelir)\n§YSarı§! = 8 bin - 18 bin (Alt-orta gelir)\n§7Açık Yeşil§! = 18 bin - 32 bin (Orta gelir)\n§GYeşil§! = 32 bin - 60 bin (Üst-orta gelir)\n§CTurkuaz§! = 60 bin - 110 bin (Yüksek gelir)\n§nKoyu Mavi§! = 110 bin üzeri (Aşırı zengin)\n\nHaftalık ekonomik döngüyle güncellenir."
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_NAME:0 "Enerji Karşılanamama Oranı"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE:0 "Enerji Karşılanamama Oranı"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_DESCRIPTION:0 "Bu harita modu, ülkelerde karşılanamayan enerji talebinin mevcut yüzdesini gösterir."
 energy_consumption_map_mode_tooltip:0 "[FROM.CONTROLLER.GetNameWithFlag] Enerji Tüketimi Karşılanamama Oranı"
 energy_consumption_map_mode_tooltip_delayed:0 "§Y[FROM.CONTROLLER.GetNameWithFlag]§! Enerji Tüketimi Karşılanamama Oranı: §Y[?FROM.CONTROLLER:unfulfilled_energy_demand_var|%+]§!\n\nBu, enerji talebinin karşılanmayan yüzdesini gösterir. Negatif değer, talebin arzı aştığı (enerji açığı) anlamına gelir.\n\n§HRenk Göstergesi:§!\n§nKoyu Mavi§! = -%30'un altı (Ağır açık)\n§lParlak Mavi§! = -%30 ile -%18 arası (Orta düzey açık)\n§CTurkuaz§! = -%18 ile -%12 arası (Hafif açık)\n§GYeşil§! = -%12 ile -%4 arası (Neredeyse karşılanıyor)\n§YSarı§! = -%4 ile -%1 arası (Hemen hemen karşılanıyor)\n§9Parlak Altın§! = -%1'in üzeri (Tamamen karşılanıyor)\n\n§nKoyu renk daha kötüdür.§! Durumu iyileştirmek için enerji üretimine yatırım yapın.\nHaftalık ekonomik döngüyle güncellenir."
 MAPMODE_PRODUCTIVITY_MAP_MODE_NAME:0 "Verimlilik"
 MAPMODE_PRODUCTIVITY_MAP_MODE:0 "Verimlilik"
 MAPMODE_PRODUCTIVITY_MAP_MODE_DESCRIPTION:0 "Bu harita modu, eyaletlerin mevcut verimliliğini, yani işçi başına ekonomik üretim etkinliğini gösterir."
 productivity_map_mode_tooltip:0 "[FROM.GetName] Eyaletinde Verimlilik"
 productivity_map_mode_tooltip_delayed:0 "§Y[FROM.GetName]§! Eyaletinde Verimlilik: §Y[?FROM.productivity_state_var|Y]§!\n\nVerimlilik, bir eyaletin ekonomik üretim etkinliğini ölçer. Daha yüksek değerler işçi başına daha fazla ekonomik üretim anlamına gelir.\n\n§HRenk Göstergesi:§!\n§nKoyu Mor§! = 200'ün altı (Çok düşük)\n§nKoyu Mavi§! = 200 - 500 (Düşük)\n§lParlak Mavi§! = 500 - 800 (Ortalamanın altı)\n§CTurkuaz§! = 800 - 1.200 (Ortalama)\n§GYeşil§! = 1.200 - 1.900 (Ortalamanın üstü)\n§YSarı§! = 1.900 - 3.800 (Yüksek)\n§9Parlak Altın§! = 3.800 - 5.000 (Çok yüksek)\n§9Koyu Turuncu§! = 5.000'in üzeri (Olağanüstü)\n\nHaftalık ekonomik döngüyle güncellenir."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_NAME:0 "İşsizlik Oranı"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE:0 "İşsizlik Oranı"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_DESCRIPTION:0 "Bu harita modu, ülkelerin mevcut işsizlik oranını çalışma çağındaki nüfusun yüzdesi olarak gösterir."
 unemployment_rate_map_mode_tooltip:0 "[FROM.CONTROLLER.GetNameWithFlag] İşsizlik Oranı"
 unemployment_rate_map_mode_tooltip_delayed:0 "§Y[FROM.CONTROLLER.GetNameWithFlag]§! İşsizlik Oranı: §Y[?FROM.CONTROLLER:total_unemployed_percentage_display|%Y]§!\n\nBu, çalışma çağındaki nüfusun işsiz olan yüzdesini gösterir.\n\n§HRenk Göstergesi:§!\n§nKoyu Mavi§! = %35'in üzeri (Kriz)\n§lParlak Mavi§! = %22 - %35 (Çok yüksek)\n§CTurkuaz§! = %10 - %22 (Yüksek)\n§GYeşil§! = %5 - %10 (Orta)\n§YSarı§! = %2 - %5 (Düşük)\n§9Parlak Altın§! = %2'nin altı (Tam istihdam)\n\n§nKoyu renk daha kötüdür.§! İşsizliği ekonomik büyüme ve politikalarla azaltın.\nHaftalık ekonomik döngüyle güncellenir."
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_NAME:0 "Yenilenebilir Enerji Odakları"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE:0 "Yenilenebilir Enerji Odakları"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_DESCRIPTION:0 "Bu harita modu, rüzgâr, güneş ve diğer coğrafi etkenlere dayanarak her eyaletin doğal yenilenebilir enerji potansiyelini gösterir."
 renewable_energy_hotspot_map_mode_tooltip:0 "[FROM.GetName] Eyaletinde Yenilenebilir Enerji Kapasitesi Bonusu"
 renewable_energy_hotspot_map_mode_tooltip_delayed:0 "§Y[FROM.GetName]§! Eyaletinde Yenilenebilir Enerji Kapasitesi Bonusu: §Y[?FROM.state_renewable_capacity_factor_modifier_var|Y]§!\n\nBu, eyaletin yenilenebilir üretimi üzerindeki bir çarpandır: §Y1,0§! dünya ortalamasıdır; yani 1,5 olan bir eyalet ortalamanın 1,5 katı, 0,5 olan ise yarısı kadar üretir.\n\n§HRenk Göstergesi (1,0 = dünya ortalaması):§!\n§RKırmızı§! = 1,6'nın üzeri (olağanüstü)\n§9Altın§! = 1,45 - 1,6 (üstün)\n§YSarı§! = 1,2 - 1,45 (ortalamanın çok üstü)\n§GYeşil§! = 1,0 - 1,2 (ortalamanın üstü)\n§CTurkuaz§! = 0,8 - 1,0 (ortalamanın biraz altı)\n§nMavi§! = 0,6 - 0,8 (zayıf)\n§HKoyu Mavi§! = 0,6'nın altı (çok zayıf)\n\nBu değer sabittir ve zamanla değişmez."
 MAPMODE_INFLUENCE_MAP_MODE_NAME:0 "Nüfuz"
 MAPMODE_INFLUENCE_MAP_MODE:0 "Nüfuz"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION:0 "Diğer ülkelerdeki nüfuz sıralamanızı gösterir. Nüfuz, diplomatik kozu belirler ve zamanla siyasi hizalanmayı etkiler."
 influence_map_mode_tooltip:0 "Nüfuz"
 influence_map_mode_tooltip_delayed:0 "Nüfuz sahibi olduğunuz ülkeleri, nüfuz sahipleri arasındaki sıralamanızı ve otomatik nüfuz uygulanan ülkeleri gösterir.\n\nNüfuz, bir ülke üzerindeki diplomatik kozunuzu belirler. Daha yüksek sıralama, o ülkenin siyasi hizalanması ve dış politikası üzerinde daha fazla söz sahibi olmak demektir.\n\n§HRenk Göstergesi:§!\n§GYeşil§! = Sizin ülkeniz\n§CTurkuaz§! = 1. Nüfuz Sahibi (baskın)\n§lAçık Mavi§! = 2. veya 3. Nüfuz Sahibi\n§nLacivert§! = 4. ila 7. Nüfuz Sahibi\n§9Turuncu§! = Otomatik Nüfuz Uygulanan Ülke (aylık)\n§RKırmızı§! = Nüfuz Yayma Bekleme Süresi (yakın zamanda hedef alındı)\n§HKoyu Gri§! = Nüfuz yok\n\nHaftalık güncellenir."
 MAPMODE_GCC_MAP_MODE_NAME:0 "KİK"
 MAPMODE_GCC_MAP_MODE:0 "KİK"
 MAPMODE_GCC_MAP_MODE_DESCRIPTION:0 "Körfez İşbirliği Konseyi'nin üye devletlerini ve olası üyelerini gösterir."
 GCC_map_mode_tooltip:0 "Körfez İşbirliği Konseyi"
 GCC_map_mode_tooltip_delayed:0 "Körfez İşbirliği Konseyi'nin (KİK) mevcut üyeliğini gösterir.\n\n§HRenk Göstergesi:§!\n§CTurkuaz§! = KİK Üye Devleti\n§GSarımsı Yeşil§! = Olası Üye Devlet\n\nHaftalık güncellenir."
 MAPMODE_SCO_MAP_MODE_NAME:0 "ŞİÖ"
 MAPMODE_SCO_MAP_MODE:0 "ŞİÖ"
 MAPMODE_SCO_MAP_MODE_DESCRIPTION:0 "Şanghay İşbirliği Örgütü'nün üye devletlerini, gözlemcilerini ve olası üyelerini gösterir."
 SCO_map_mode_tooltip:0 "Şanghay İşbirliği Örgütü"
 SCO_map_mode_tooltip_delayed:0 "Şanghay İşbirliği Örgütü'nün (ŞİÖ) mevcut üyeliğini gösterir.\n\n§HRenk Göstergesi:§!\n§9Turuncu§! = ŞİÖ Üye Devleti\n§0Mor§! = Gözlemci Devlet\n§CTurkuaz§! = Diyalog Ortağı\n§YSarı§! = Olası Üye Devlet\n\nHaftalık güncellenir."
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME:0 "İktidar Partisi"
 MAPMODE_SUBIDEOLOGY_MAP_MODE:0 "İktidar Partisi"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION:0 "Her ülkeyi yöneten partinin alt ideolojisini gösterir; üzerine gelindiğinde iktidardaki partilerin oy payını da gösterir."
 subideology_map_mode_tooltip:0 "[FROM.CONTROLLER.GetNameWithFlag] İktidar Partisi"
 subideology_map_mode_tooltip_delayed:0 "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§Hİktidar Partisi:§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§HHükümet Koalisyonu:§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§HToplam Hükümet Desteği:§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\nYüzdeler, her partinin son seçimde aldığı oy payıdır; bu nedenle hiç seçim yapmamış ülkelerde %0,0 görünür.\n\n§HRenk Göstergesi:§!\nHer parti, siyaset görünümündeki pasta grafikte sahip olduğu rengi korur.\n§nMaviler§! = Batılı partiler\n§RKırmızılar§! = Yükselen partiler\n§GYeşiller§! = Selefi ve İslamcı partiler\n§YSarılar ve griler§! = Tarafsız partiler\n§9Turuncu, zeytin ve mor§! = Milliyetçi partiler\n\nHükümet her değiştiğinde güncellenir."
 map_mode_coalition_none_text:0 "\nYok (tek parti hükümeti)"
