l_english:
 MD_ftc_open_button_tt:0 "§YFilo Eğitim Komutanlığını§! açmak için tıkla"
 MD_ftc_title:0 "Filo Eğitim Komutanlığı"
 MD_ftc_close_tt:0 "Filo Eğitim Komutanlığını kapat."
 MD_ftc_exercises_header:0 "Filo Tatbikatları"
 MD_ftc_academy_header:0 "Deniz Harp Okulu"
 MD_ftc_officers_header:0 "Subay Eğitimi ve Ar-Ge"
 MD_ftc_status_active:0 "§GEtkin§!"
 MD_ftc_cooldown_text:0 "§RBekleme süresinde§!"
 MD_ftc_fully_upgraded:0 "Tamamen Yükseltildi"
 MD_ftc_exercise_capital:0 "Uçak Gemisi ve Yüzey Grubu Tatbikatı"
 MD_ftc_exercise_capital_desc:0 "Uçak gemisi taarruz grubu hazırlıkları ve yüzey muharebe talimleri. Uçuş güvertesi döngüleri, hava savunma koordinasyonu ve denizde ikmal birlikte prova edilir."
 MD_ftc_ex_capital_short:0 "90 gün boyunca ana savaş gemisi doktrini ustalığı."
 MD_ftc_exercise_escort:0 "Refakat Tatbikatı"
 MD_ftc_exercise_escort_desc:0 "Fırkateynler, korvetler ve devriye botları için konvoy perdeleme ve denizaltı savunma talimleri. Sonar kullanımı, helikopter koordinasyonu ve düzen muhafazası denizde çalışılır."
 MD_ftc_ex_escort_short:0 "90 gün boyunca refakat doktrini ustalığı."
 MD_ftc_exercise_submarine:0 "Denizaltı Tatbikatı"
 MD_ftc_exercise_submarine_desc:0 "Denizaltı hizmeti için devriye ve torpido atış tatbikatları. Mürettebat sessiz seyri, yüzey refakatçilerinden kaçınmayı ve koordineli saldırıları prova eder."
 MD_ftc_ex_submarine_short:0 "90 gün boyunca denizaltı doktrini ustalığı."
 MD_ftc_exercise_operations:0 "Filo Hazırlık Tatbikatı"
 MD_ftc_exercise_operations_desc:0 "Komuta kontrolü, lojistiği ve hasar kontrolünü kapsayan filo çapında bir hazırlık döngüsü. Gemiler ana limanlarından uzakta operasyonları sürdürmek için eğitim görür."
 MD_ftc_ex_operations_short:0 "90 gün boyunca deniz operasyonları ustalığı."
 MD_ftc_staff_course_name:0 "Kurmay Kursu"
 MD_ftc_staff_course_short:0 "Her donanma lideri tecrübe kazanır ve biri yeni bir özellik edinebilir."
 MD_ftc_staff_course_cooldown:0 "Kurmay Kursu Sürüyor"
 MD_ftc_staff_course_cooldown_desc:0 "Donanma kurmay subayları filo kurmay kursuna katılıyor. Bir sonraki dönem, bu sınıf mezun olduğunda açılır."
 MD_ftc_flag_officer_course_name:0 "Amiral Subay Kursu"
 MD_ftc_flag_officer_course_short:0 "Bir donanma lideri beceri seviyesi kazanır."
 MD_ftc_flag_officer_course_cooldown:0 "Amiral Subay Kursu Sürüyor"
 MD_ftc_flag_officer_course_cooldown_desc:0 "Kıdemli subaylar amiral rütbesi için komuta eğitimini tamamlıyor. Bu sınıf bitince yeni bir kurs başlayabilir."
 MD_ftc_rnd_liaison_name:0 "Deniz Ar-Ge İrtibatı"
 MD_ftc_rnd_liaison_short:0 "Bir deniz atılım puanı kazan."
 MD_ftc_rnd_liaison_cooldown:0 "Deniz Ar-Ge İrtibatı Etkin"
 MD_ftc_rnd_liaison_cooldown_desc:0 "Filo subayları deniz araştırma kuruluşlarında görevlendiriliyor ve harekât derslerini geliştirme gereksinimlerine dönüştürüyor."
 MD_ftc_academy_name:0 "Eğitim Müfredatı"
 MD_ftc_academy_short:0 "Bir Deniz Akademisi Ruhunun kilidini açar, tatbikatları güçlendirir."
 MD_ftc_academy_level_text:0 "Seviye [?ROOT.MD_ftc_academy_level|0]/3"
 MD_ftc_fleet_name:0 "Filo Hazırlık Programı"
 MD_ftc_fleet_short:0 "Ana doktrininiz için bir Donanma Ruhunun kilidini açar."
 MD_ftc_fleet_level_text:0 "Seviye [?ROOT.MD_ftc_fleet_level|0]/3"
 MD_ftc_command_name:0 "Denizcilik Doktrini Merkezi"
 MD_ftc_command_short:0 "Ana doktrininiz için bir Deniz Komutanlığı Ruhunun kilidini açar."
 MD_ftc_command_level_text:0 "Seviye [?ROOT.MD_ftc_command_level|0]/3"
 MD_ftc_academy_blue_water_1:0 "Uçak Gemisi Savaş Okulu I"
 MD_ftc_academy_blue_water_1_desc:0 "Uçuş güvertesi operasyonları, hava kanadı koordinasyonu ve uçak gemisi grubu komutası eğitimi, geleceğin görev kuvveti liderlerini hazırlar."
 MD_ftc_academy_blue_water_2:0 "Uçak Gemisi Savaş Okulu II"
 MD_ftc_academy_blue_water_3:0 "Uçak Gemisi Savaş Okulu III"
 MD_ftc_academy_green_water_1:0 "Kıyı Savaş Okulu I"
 MD_ftc_academy_green_water_1_desc:0 "Kıyı filosunun subayları sığ su operasyonlarını, mayın karşı tedbirlerini ve liman girişlerinin savunmasını inceler."
 MD_ftc_academy_green_water_2:0 "Kıyı Savaş Okulu II"
 MD_ftc_academy_green_water_3:0 "Kıyı Savaş Okulu III"
 MD_ftc_academy_jeune_ecole_1:0 "Hızlı Saldırı Botu Okulu I"
 MD_ftc_academy_jeune_ecole_1_desc:0 "Subaylar hız ve çok sayıdaki hafif kuvvetler üzerine kurulu füze botu, devriye botu ve korvet taktikleri üzerine eğitim alır."
 MD_ftc_academy_jeune_ecole_2:0 "Hızlı Saldırı Botu Okulu II"
 MD_ftc_academy_jeune_ecole_3:0 "Hızlı Saldırı Botu Okulu III"
 MD_ftc_academy_guerre_de_course_1:0 "Denizaltı Komuta Kursu I"
 MD_ftc_academy_guerre_de_course_1_desc:0 "Denizaltı kaptanı adayları gizli devriye, saldırı yaklaşması ve ticaret gemilerinin engellenmesi üzerine eğitim alır."
 MD_ftc_academy_guerre_de_course_2:0 "Denizaltı Komuta Kursu II"
 MD_ftc_academy_guerre_de_course_3:0 "Denizaltı Komuta Kursu III"
 MD_ftc_fleet_blue_water_1:0 "Seferî Lojistik I"
 MD_ftc_fleet_blue_water_1_desc:0 "Filo ikmal gemileri, seyir halindeyken ikmal ve ileri üs planları, konuşlandırılmış görev kuvvetlerinin menzilini uzatır."
 MD_ftc_fleet_blue_water_2:0 "Seferî Lojistik II"
 MD_ftc_fleet_blue_water_3:0 "Seferî Lojistik III"
 MD_ftc_fleet_green_water_1:0 "Bölgesel Deniz Hâkimiyeti I"
 MD_ftc_fleet_green_water_1_desc:0 "Sürekli refakat ve devriye düzenlemeleri, ana sulara yakın deniz yollarını ve kıyı yaklaşımlarını güvence altına alır."
 MD_ftc_fleet_green_water_2:0 "Bölgesel Deniz Hâkimiyeti II"
 MD_ftc_fleet_green_water_3:0 "Bölgesel Deniz Hâkimiyeti III"
 MD_ftc_fleet_jeune_ecole_1:0 "Dağıtık Filo Üsleri I"
 MD_ftc_fleet_jeune_ecole_1_desc:0 "Küçük gemiler birçok dağınık liman ve barınaktan faaliyet gösterir; bu, bakımı kolaylaştırır ve tek bir vuruşa maruz kalmayı sınırlar."
 MD_ftc_fleet_jeune_ecole_2:0 "Dağıtık Filo Üsleri II"
 MD_ftc_fleet_jeune_ecole_3:0 "Dağıtık Filo Üsleri III"
 MD_ftc_fleet_guerre_de_course_1:0 "Ticaret Akıncılığı Kurmayı I"
 MD_ftc_fleet_guerre_de_course_1_desc:0 "Özel bir kurmay, ticaret trafiğinin izlenmesini ve deniz yolları boyunca mayın döşenmesini planlar."
 MD_ftc_fleet_guerre_de_course_2:0 "Ticaret Akıncılığı Kurmayı II"
 MD_ftc_fleet_guerre_de_course_3:0 "Ticaret Akıncılığı Kurmayı III"
 MD_ftc_command_blue_water_1:0 "Uçak Gemisi Taarruz Komutanlığı I"
 MD_ftc_command_blue_water_1_desc:0 "Ortak bir komutanlık, uçak gemisi hava kanatlarını ve refakatçileri tek bir taarruz gücünde koordine eder."
 MD_ftc_command_blue_water_2:0 "Uçak Gemisi Taarruz Komutanlığı II"
 MD_ftc_command_blue_water_3:0 "Uçak Gemisi Taarruz Komutanlığı III"
 MD_ftc_command_green_water_1:0 "Bütünleşik Kıyı Komutanlığı I"
 MD_ftc_command_green_water_1_desc:0 "Kıyı radarları, uçaklar ve savaş gemileri tek bir harekât merkezine rapor verir; bu, tespiti ve perdelemeyi keskinleştirir."
 MD_ftc_command_green_water_2:0 "Bütünleşik Kıyı Komutanlığı II"
 MD_ftc_command_green_water_3:0 "Bütünleşik Kıyı Komutanlığı III"
 MD_ftc_command_jeune_ecole_1:0 "Sürü Taktikleri Komutanlığı I"
 MD_ftc_command_jeune_ecole_1_desc:0 "Çok sayıdaki hafif gemiyle gece saldırı doktrinini hızlı ayrılma takip eder."
 MD_ftc_command_jeune_ecole_2:0 "Sürü Taktikleri Komutanlığı II"
 MD_ftc_command_jeune_ecole_3:0 "Sürü Taktikleri Komutanlığı III"
 MD_ftc_command_guerre_de_course_1:0 "Sualtı Savaş Komutanlığı I"
 MD_ftc_command_guerre_de_course_1_desc:0 "Merkezî bir denizaltı komutanlığı devriye bölgelerini, torpido doktrinini ve denizaltı savunma istihbaratını yönlendirir."
 MD_ftc_command_guerre_de_course_2:0 "Sualtı Savaş Komutanlığı II"
 MD_ftc_command_guerre_de_course_3:0 "Sualtı Savaş Komutanlığı III"
