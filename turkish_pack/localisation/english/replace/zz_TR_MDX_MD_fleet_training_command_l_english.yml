 MD_ftc_ex_capital_tt:0 "§YUçak Gemisi ve Yüzey Grubu Tatbikatı§!\n\n£navy_experience Donanma Tecrübesi: §R-450§!\n£command_power Komuta Gücü: §R-75§!\n§H90§! gün boyunca §YUçak Gemisi ve Yüzey Grubu Tatbikatı§! Ulusal Ruhunu kazanır:\n £fuel_consumption_texticon  Donanma Yakıt Tüketimi: §R+%25§!\n £attack_battleship_texticon  Ana Savaş Gemisi Saldırısı: §G+%3§!\n£doctrine_mastery §HAna Savaş Gemileri§! Ustalığı: [MD_ftc_exercise_mastery_tt_text] günlük, §H90§! gün boyunca\n\nEn az biri Uçak Gemisi, Helikopter Gemisi, Zırhlı, Muharebe Kruvazörü, Kruvazör, Muhrip, Görünmez Muhrip veya Ağır Fırkateyn olmak üzere en az §H8§! gemilik bir donanma gerektirir."
 MD_ftc_ex_escort_tt:0 "§YRefakat Tatbikatı§!\n\n£navy_experience Donanma Tecrübesi: §R-450§!\n£command_power Komuta Gücü: §R-75§!\n§H90§! gün boyunca §YRefakat Tatbikatı§! Ulusal Ruhunu kazanır:\n £fuel_consumption_texticon  Donanma Yakıt Tüketimi: §R+%25§!\n £attack_screen_texticon  Perde Gemisi Saldırısı: §G+%3§!\n£doctrine_mastery §HRefakat Gemileri§! Ustalığı: [MD_ftc_exercise_mastery_tt_text] günlük, §H90§! gün boyunca\n\nEn az biri Perde Muhribi, Fırkateyn, Görünmez Fırkateyn, Korvet, Görünmez Korvet veya Devriye Botu olmak üzere en az §H8§! gemilik bir donanma gerektirir."
