 Nepali_Congress_wins_tt:0 "Nepal Kongresi ulusun önde gelen partisi olacak"
 Communist_Party_of_Nepal_wins_tt:0 "Nepal Komünist Partisi ulusun önde gelen partisi olacak"
 NEP_guerrilla_conflict:0 "Gerilla Çatışması"
 nep_civil_war_info_tt:0 "her iki taraf da kendi bölgelerinde giderek daha da yerleşiyor. Maoistler kırsalda geniş toprak parçalarını denetlerken hükümet büyük şehir ve kasabaları elinde tutuyor. Çatışma yıllardır sürüyor ve taraflardan hiçbiri kesin üstünlük sağlayamıyor."
 nepal.1.t:0 "2008 Nepal seçimi"
 nepal.1.d:0 "2008 Nepal seçimi, Nepal'i on yılı aşkın süredir kasıp kavuran uzun soluklu bir iç savaşın ardından bir dönüm noktası olarak ülke tarihinde bir kilometre taşı oldu. 10 Nisan 2008'de yapılan seçimde Nepal Kongre Partisi ile Nepal Komünist Partisi (Maoist), ülke için yeni bir anayasa hazırlamakla görevli Kurucu Meclis'in en büyük iki partisi olarak öne çıktı."
 nepal.1.a:0 "Tek seçenek Nepal Kongresi"
 nepal.1.b:0 "Komünist Parti yoluna devam etmeli"
 news.87.t:0 "Nepal Iç Savasi Sona Erdi"
 news.87.d:0 "Nepal için tarihî bir anda Başbakan Koirala ve Maoist lider Prachanda, Nepal İç Savaşı'nın sonunu işaret eden Kapsamlı Barış Anlaşması'nı imzaladı. Bu anlaşma, ulusu kasıp kavuran, sayısız can alan ve ölçülemez yıkıma yol açan yıllarca süren şiddetli çatışmanın ardından geldi. \n Nepal geleceğe bakarken önündeki zorluklar büyük. Uzlaşma ve yeniden inşa, hükümet, sivil toplum ve uluslararası toplum dahil tüm paydaşlardan ortak bir çaba gerektirecek. Ancak Kapsamlı Barış Anlaşması'nın imzalanmasıyla Nepal daha parlak, daha barışçıl bir geleceğe doğru önemli bir adım attı."
 news.87.a:0 "İlginç"
 news.88.t:0 "Maoistler Nepal'de Zafer Ilan Etti"
 news.88.d:0 "Önemli bir gelişmeyle ilerleyen güçler Nepal'deki son kaleyi ele geçirdi ve ülkeyi yıllardır kasıp kavuran uzun süreli çatışmayı sona erdirdi. Krallığın düşüşü kuşkusuz bir dönüm noktası. \n Son kalenin ele geçirilmesi kuşkusuz önemli bir kilometre taşı olsa da hareketin komşu ülkelerle gerginliğe tırmanma potansiyeline dair endişeler sürüyor. Uluslararası toplum durumu yakından izliyor ve birçok kişi olası çatışmalara barışçıl çözüm çağrısı yapıyor."
 news.88.a:0 "İlginç"
 news.89.t:0 "Maoist Güçler Yenilgiyle Ezildi"
 news.89.d:0 "Önemli bir gelişmeyle Nepal'deki monarşi yanlısı güçler Maoist güçleri ülkeden sürdü ve ardında yıkım izi bırakan uzun süreli bir çatışmanın sonunu işaret etti. Kalan kaleler güvence altına alınmışken Nepal, ekonomisini ve altyapısını yeniden inşa etmeye çalışırken bir toparlanma ve büyüme dönemini bekleyebilir. \n Ancak Maoist güçlerin yenilgisi ve yeni bir istikrar çağının kurulmasıyla Nepal, bir ulus olarak tüm potansiyelini gerçekleştirmeye doğru önemli bir adım attı. Uluslararası toplumun desteği ve yenilenen ulusal amaç duygusuyla ülke, bu karanlık bölümden daha güçlü ve daha dirençli bir ulus olarak çıkmaya hazır."
 news.89.a:0 "İlginç"
 news.90.t:0 "Nepal Kraliyet Ailesine Suikast"
 news.90.d:0 "Nepal Kralı Birendra ve ailesinin tamamı Narayanhiti Sarayı'nda bir katliamda öldürüldü. Katliamın nedeni tartışmalı, ancak bu olay Şah hanedanının 240 yıllık hükümdarlığının sonunu işaret etti ve ülkeyi kaosa sürükledi."
 news.90.a:0 "İlginç"
 NEP_Himalayan_Rebellion_Struggle:0 "Himalaya İsyan Mücadelesi"
 NEP_Himalayan_Rebellion_Struggle_desc:0 "Hükümet güçleri karşı saldırılar başlatırken Nepal iç savaşındaki devrimci mücadele sürdü. Karşılık olarak stratejik sabır göstermek ve hamlelerimizi dikkatle planlamak çok önemliydi."
 NEP_National_Unity_Campaign:0 "Ulusal Birlik Kampanyası"
 NEP_National_Unity_Campaign_desc:0 "Nepal'de barışı sağlamak, yıllardır çıkarlarımızı tehlikeye atan Komünist güçleri yenmeyi gerektiriyor."
 NEP_The_National_vendetta:0 "Ulusal Kan Davası"
 NEP_The_National_vendetta_desc:0 "Kraliyet ailesinin katlinin ardından ulus amaçsızlığa sürüklendi. Birçok kişi kraliyet ailesi ve radikal karşıtı tutumu adına destek topluyor."
