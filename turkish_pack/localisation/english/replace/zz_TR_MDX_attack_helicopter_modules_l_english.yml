 helicopter_module_hover_engine_gen1_desc:0 "Havada asılı kalma motorları gelişmiş kaldırma kontrolü ve güç tepkisi sağlar; helikopterlerin alçak irtifa ve yakın destek operasyonlarında belirgin biçimde daha yüksek manevra kabiliyeti kazanmasına imkân verir.\n\n§GTasarımcı İpucu: Havada Asılı Kalma Motorları çok pahalıdır ve yakıt tüketimini artırır, ancak büyük bir manevra kabiliyeti artışı sağlar§!"
