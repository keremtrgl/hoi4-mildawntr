 helicopter_rocket_pod_gen1:0 "1. Nesil Roket Podları"
 helicopter_rocket_pod_gen1_desc:0 "Yumuşak hedeflere, piyadeye ve hafif araçlara karşı kullanılan temel 70-80 mm güdümsüz roketler. Ucuz ve yaygın olarak bulunur, ancak kısa menzilin ötesinde isabetten yoksundur."
 helicopter_rocket_pod_gen2:0 "2. Nesil Roket Podları"
 helicopter_rocket_pod_gen2_desc:0 "Geliştirilmiş harp başlığı türleri ve daha iyi stabilizasyon sistemleri öldürücülüğü ve dağılım kontrolünü artırır. Hafif zırhlı hedeflere karşı daha yüksek etkinlik sunar."
 helicopter_rocket_pod_gen3:0 "3. Nesil Roket Podları"
 helicopter_rocket_pod_gen3_desc:0 "Mevcut güdümsüz roketlere daha iyi isabet için lazer güdüm kitleri ekler. Yumuşak ve hareketli hedeflere karşı düşük maliyetli hassas vuruşlara imkân verir."
 helicopter_rocket_pod_gen4:0 "4. Nesil Roket Podları"
 helicopter_rocket_pod_gen4_desc:0 "Gelişmiş arayıcılara ve hedeflemeye sahip akıllı roket sistemleri. Tam teşekküllü ATGM'lere kıyasla daha az lojistikle, yan hasarı düşük hassas angajmanları mümkün kılar."
 helicopter_rocket_pod_gen5:0 "5. Nesil Roket Podları"
 helicopter_rocket_pod_gen5_desc:0 "Dahili işlemcilerle ve özerk güdümle donatılmış yeni nesil roket sistemleri. Her mühimmat, pilottan asgari girdiyle hedefleri gerçek zamanlı olarak tanımlayabilir, takip edebilir ve önceliklendirebilir. Dağınık düşman oluşumlarına ve hareketli varlıklara karşı doyurma saldırıları için idealdir."
 helicopter_rocket_pod_gen6:0 "6. Nesil Roket Podları"
 helicopter_rocket_pod_gen6_desc:0 "Dahili işlemcilerle ve özerk güdümle donatılmış yeni nesil roket sistemleri. Her mühimmat, pilottan asgari girdiyle hedefleri gerçek zamanlı olarak tanımlayabilir, takip edebilir ve önceliklendirebilir. Dağınık düşman oluşumlarına ve hareketli varlıklara karşı doyurma saldırıları için idealdir."
 helicopter_rocket_pod_gen7:0 "7. Nesil Roket Podları"
 helicopter_rocket_pod_gen7_desc:0 "Dahili işlemcilerle ve özerk güdümle donatılmış yeni nesil roket sistemleri. Her mühimmat, pilottan asgari girdiyle hedefleri gerçek zamanlı olarak tanımlayabilir, takip edebilir ve önceliklendirebilir. Dağınık düşman oluşumlarına ve hareketli varlıklara karşı doyurma saldırıları için idealdir."
 helicopter_aa_missile_gen1:0 "1. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen1_desc:0 "İlk helikopter monteli havadan havaya füzeler görece basitti ve sınırlı yeteneklere sahipti. Bu füzeler ağırlıklı olarak ısı güdümlüydü ve düşman uçaklarını takip edip angaje etmek için kızılötesi arayıcılara dayanıyordu. Menzilleri kısaydı ve çoğunlukla güdümsüz ya da yarı güdümlüydü."
 helicopter_aa_missile_gen2:0 "2. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen2_desc:0 "İkinci nesil helikopter monteli havadan havaya füzelerde güdüm sistemleri, tahrik ve angajman menzillerinde iyileşmeler görüldü. Bu füzeler daha güvenilir hale geldi ve hedefleri daha uzun mesafelerde angaje edebildi. Radar arayıcılar gibi daha gelişmiş arayıcılar kullanıma girdi ve farklı angajman senaryolarında daha fazla çok yönlülük sağladı."
 helicopter_aa_missile_gen3:0 "3. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen3_desc:0 "Üçüncü nesil, füze teknolojisinde önemli bir ilerlemeye işaret etti. Bu füzeler geliştirilmiş arayıcılar, karşı tedbirlere daha iyi direnç, artırılmış çeviklik ve ağ merkezli harp yetenekleriyle öne çıkıyordu. Üçüncü nesil füzelerin çoğu, helikopterin sensörlerinin doğrudan görüş hattında olmayan hedefleri bile angaje etmesine imkân veren «eksen dışı» angajman yeteneğine sahipti."
 helicopter_aa_missile_gen4:0 "4. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen4_desc:0 "Dördüncü nesil helikopter monteli havadan havaya füzeler geliştirilmiş sensörlere, daha iyi hedef ayırt etmeye, karşı tedbirlere daha yüksek dirence ve artırılmış angajman menzillerine sahiptir. Çoğunlukla helikopterin aviyoniğiyle kusursuz biçimde bütünleşir ve gelişmiş durumsal farkındalık için diğer platform ve sistemlerle ağa bağlanabilir."
 helicopter_aa_missile_gen5:0 "5. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen5_desc:0 "Beşinci nesil helikopter monteli havadan havaya füzeler çok spektrumlu sensörlere, daha gizli profillere, geliştirilmiş çevikliğe, gelişmiş veri bağlantısı ve ağ yeteneklerine, ayrıca geliştirilmiş karşı tedbirlere ve karşı-karşı tedbirlere ile artırılmış menzil ve öldürücülüğe sahiptir."
 helicopter_aa_missile_gen6:0 "6. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen6_desc:0 "Altıncı nesil helikopter monteli havadan havaya füzeler çok spektrumlu sensörlere, daha gizli profillere, geliştirilmiş çevikliğe, gelişmiş veri bağlantısı ve ağ yeteneklerine, ayrıca geliştirilmiş karşı tedbirlere ve karşı-karşı tedbirlere ile artırılmış menzil ve öldürücülüğe sahiptir."
 helicopter_aa_missile_gen7:0 "7. Nesil Havadan Havaya Füzeler"
 helicopter_aa_missile_gen7_desc:0 "Yedinci nesil helikopter monteli havadan havaya füzeler çok spektrumlu sensörlere, daha gizli profillere, geliştirilmiş çevikliğe, gelişmiş veri bağlantısı ve ağ yeteneklerine, ayrıca geliştirilmiş karşı tedbirlere ve karşı-karşı tedbirlere ile artırılmış menzil ve öldürücülüğe sahiptir."
 helicopter_drones_gen1:0 "1. Nesil Helikopter İHA'ları"
 helicopter_drones_gen1_desc:0 "Saldırı helikopterlerinden konuşlandırılan ilk nesil İHA'lar görece basitti ve helikopter mürettebatına ek durumsal farkındalık ve keşif yeteneği sağlamaya odaklanıyordu. Bu İHA'lar ağırlıklı olarak uzaktan kumandalıydı ve gelişmiş özerk özelliklerden yoksundu."
 helicopter_drones_gen2:0 "2. Nesil Helikopter İHA'ları"
 helicopter_drones_gen2_desc:0 "Saldırı helikopterlerinden konuşlandırılan ikinci nesil İHA'larda özerklik, haberleşme ve yeteneklerde önemli iyileşmeler görüldü. Bu İHA'lar daha sofistike sensörleri, veri işleme yeteneklerini ve ana helikopterle gelişmiş haberleşme bağlantılarını bünyesine katmaya başladı."
 helicopter_drones_gen3:0 "3. Nesil Helikopter İHA'ları"
 helicopter_drones_gen3_desc:0 "Saldırı helikopterlerinden konuşlandırılan üçüncü nesil İHA'lar, hızlı teknolojik ilerleme sayesinde daha da dönüştürücü gelişmeler barındırır. Bu gelişmeler artan özerkliğe, kusursuz insan-makine ekip çalışmasına, geliştirilmiş sensör füzyonuna ve daha çok yönlü görev yeteneklerine odaklanır."
 helicopter_drones_gen4:0 "4. Nesil Helikopter İHA'ları"
 helicopter_drones_gen4_desc:0 "Saldırı helikopterlerinden konuşlandırılan dördüncü nesil İHA'lar, hızlı teknolojik ilerleme sayesinde daha da dönüştürücü gelişmeler barındırır. Bu gelişmeler artan özerkliğe, kusursuz insan-makine ekip çalışmasına, geliştirilmiş sensör füzyonuna ve daha çok yönlü görev yeteneklerine odaklanır."
 helicopter_drones_gen5:0 "5. Nesil Helikopter İHA'ları"
 helicopter_drones_gen5_desc:0 "Saldırı helikopterlerinden konuşlandırılan beşinci nesil İHA'lar, hızlı teknolojik ilerleme sayesinde daha da dönüştürücü gelişmeler barındırır. Bu gelişmeler artan özerkliğe, kusursuz insan-makine ekip çalışmasına, geliştirilmiş sensör füzyonuna ve daha çok yönlü görev yeteneklerine odaklanır."
 em_lock_detection_system_gen1:0 "İlk Nesil RWR ve Parlak Fişekler"
 em_lock_detection_system_gen1_desc:0 "Elle veya yarı otomatik olarak atılan kızılötesi parlak fişeklerle eşleştirilmiş ilkel bir radar uyarı alıcısı. SAM kilitlenmesi veya uçaksavar takibi gibi radar tehditlerine karşı temel farkındalık sunar. Algılama menzili sınırlıdır; yanlış alarma ve gecikmiş tepkiye açıktır."
 em_lock_detection_system_gen2:0 "Entegre RWR ve Atıcılar"
 em_lock_detection_system_gen2_desc:0 "Otomatik şaff ve parlak fişek atıcılarına bağlı, daha yetenekli bir RWR sistemi. Birden fazla radar imzasını algılayabilir ve pilot müdahalesi olmadan uygun karşı tedbirleri tetikler."
 em_lock_detection_system_gen3:0 "Dijital EWS Ağı"
 em_lock_detection_system_gen3_desc:0 "Gerçek zamanlı radar analizine ve programlanabilir tehdit kütüphanelerine sahip, tam entegre bir elektronik harp takımı. Şaff ve parlak fişek atışını tehdit türüne ve yönüne göre hassas zamanlamayla eşgüdümler. Modern çok spektrumlu füze sistemlerine karşı hayatta kalma oranını büyük ölçüde artırır."
 em_lock_detection_system_gen4:0 "Dijital EWS Ağı"
 em_lock_detection_system_gen4_desc:0 "Gerçek zamanlı radar analizine ve programlanabilir tehdit kütüphanelerine sahip, tam entegre bir elektronik harp takımı. Şaff ve parlak fişek atışını tehdit türüne ve yönüne göre hassas zamanlamayla eşgüdümler. Modern çok spektrumlu füze sistemlerine karşı hayatta kalma oranını büyük ölçüde artırır."
