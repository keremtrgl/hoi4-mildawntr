 helicopter_turbine_engine_gen1:0 "1. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen1_desc:0 "Mevcut uçak türbin motorlarından uyarlanan ilk türboşaft motorları. Güç çıkışı sınırlıdır; dayanıklılık ve güvenilirlik sorunları vardır.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_turbine_engine_gen2:0 "2. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen2_desc:0 "Malzeme, tasarım ve imalat tekniklerindeki gelişmelerle güç çıkışını artırabilir ve güvenilirliği iyileştirebiliriz.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_turbine_engine_gen3:0 "3. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen3_desc:0 "Dijital motor kontrol sistemlerinin kullanıma girmesi motor performansını, yakıt verimliliğini ve kullanım kolaylığını artırmamızı sağladı.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_turbine_engine_gen4:0 "4. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen4_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha yüksek güç çıkışlı motorlar doğurdu; entegre sağlık izleme sistemleri ise kestirimci bakımı ve daha yüksek güvenilirliği mümkün kıldı.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_turbine_engine_gen5:0 "5. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen5_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha da yüksek güç çıkışlı motorlar doğurdu.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_turbine_engine_gen6:0 "6. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen6_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha da yüksek güç çıkışlı motorlar doğurdu.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_turbine_engine_gen7:0 "7. Nesil Türbin Motorları"
 helicopter_turbine_engine_gen7_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha da yüksek güç çıkışlı motorlar doğurdu.\n\n§GTasarımcı İpucu: Türbin motorları askeri helikopterlerde kullanılan standart motordur§!"
 helicopter_piston_engine_gen1:0 "1. Nesil Piston Motorları"
 helicopter_piston_engine_gen1_desc:0 "Mevcut uçak piston motorlarından uyarlanan ilk piston motorları. Ağırdır; güç çıkışı sınırlıdır, dayanıklılık ve güvenilirlik sorunları vardır.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_piston_engine_gen2:0 "2. Nesil Piston Motorları"
 helicopter_piston_engine_gen2_desc:0 "Tasarımdaki iyileştirmeler daha yüksek güvenilirlik ve güç çıkışı sağladı. Önceki eksiklikleri gidermek için süper şarj cihazları ve gelişmiş soğutma da devreye girdi.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_piston_engine_gen3:0 "3. Nesil Piston Motorları"
 helicopter_piston_engine_gen3_desc:0 "Metalurji ve imalat tekniklerindeki gelişmeler daha yüksek verim ve güvenilirlik getirdi; dijital motor kontrol sistemlerinin eklenmesi güvenilirliği daha da artırdı.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_piston_engine_gen4:0 "4. Nesil Piston Motorları"
 helicopter_piston_engine_gen4_desc:0 "Entegre sağlık izleme sistemlerinin eklenmesi kestirimci bakımı ve daha yüksek güvenilirliği mümkün kıldı. Tasarım, imalat ve metalurjideki gelişmeler aerodinamiği ve performansı iyileştirmeye devam ediyor.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_piston_engine_gen5:0 "5. Nesil Piston Motorları"
 helicopter_piston_engine_gen5_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha da yüksek güç çıkışlı motorlar doğurdu.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_piston_engine_gen6:0 "6. Nesil Piston Motorları"
 helicopter_piston_engine_gen6_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha da yüksek güç çıkışlı motorlar doğurdu.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_piston_engine_gen7:0 "7. Nesil Piston Motorları"
 helicopter_piston_engine_gen7_desc:0 "Malzeme bilimi ve aerodinamikteki gelişmeler daha da yüksek güç çıkışlı motorlar doğurdu.\n\n§GTasarımcı İpucu: Piston motorları türbin motorlarına karşı bütçe dostu alternatiftir§!"
 helicopter_armor_gen1:0 "1. Nesil Helikopter Zırhı"
 helicopter_armor_gen1_desc:0 "İlk saldırı helikopteri zırh düzenlerinde, hafif silah ateşine ve şarapnele karşı koruma sağlamak için kokpit, kritik bileşenler ve hayati sistemlerin çevresi zırhlanıyordu."
 helicopter_armor_gen2:0 "2. Nesil Helikopter Zırhı"
 helicopter_armor_gen2_desc:0 "Kompozit zırhın icadı ve entegrasyonuyla saldırı helikopteri zırh düzenleri artık ek koruma sağlıyor. Reaktif zırh düzenleri de kullanılmaya başlandı ve daha da büyük koruma sunuyor."
 helicopter_armor_gen3:0 "3. Nesil Helikopter Zırhı"
 helicopter_armor_gen3_desc:0 "Zırh teknolojisi ve doktrinindeki gelişmeler, belirli görev türlerine uyarlanmış modüler zırh düzenlerine yol açtı."
 helicopter_armor_gen4:0 "4. Nesil Helikopter Zırhı"
 helicopter_armor_gen4_desc:0 "Zırh teknolojisi ve doktrinindeki gelişmeler, belirli görev türlerine uyarlanmış modüler zırh düzenlerine yol açtı."
 helicopter_armor_gen5:0 "5. Nesil Helikopter Zırhı"
 helicopter_armor_gen5_desc:0 "Zırh teknolojisi ve doktrinindeki gelişmeler, belirli görev türlerine uyarlanmış modüler zırh düzenlerine yol açtı."
 sensors_and_avionics_gen_1:0 "1. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_1_desc:0 "İlk saldırı helikopterlerinin aviyonik ve sensörleri ağırlıklı olarak temel mekanik ve analog aviyonik sistemlerin entegrasyonuna odaklanıyordu. Bu sistemler görsel nişan sistemleri ve temel telsiz haberleşme ekipmanı gibi ilkel sensörleri içeriyordu. Aviyonik temel ve çoğunlukla mekanikti; seyrüsefer ve hedefleme için sınırlı elektronik yardımcılar vardı."
 sensors_and_avionics_gen_2:0 "2. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_2_desc:0 "Doppler radarın, ileri bakışlı kızılötesi (FLIR) kameraların ve gelişmiş telsiz haberleşme sistemlerinin entegrasyonuyla hedef tespit ve takip yeteneklerinde, ayrıca pilotların durumsal farkındalığında iyileşme kaydettik."
 sensors_and_avionics_gen_3:0 "3. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_3_desc:0 "Gelişmiş FLIR sistemlerinin, aynı anda birden fazla hedefi takip edebilen çok modlu radar sistemlerinin ve geliştirilmiş atalet seyrüsefer sistemlerinin eklenmesi muharebe etkinliğinde büyük bir iyileşme sağladı. Bu nesil ayrıca hedefleme ve silah sevkinin isabetini büyük ölçüde artıran lazer telemetrelerin entegrasyonuna sahne oldu."
 sensors_and_avionics_gen_4:0 "4. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_4_desc:0 "Artık dijital sinyal işleme, gelişmiş veri füzyonu ve ağ merkezli yetenekleri aviyonik ve sensör takımlarımıza entegre ettik. Helikopterlerimiz ağ tabanlı harp ortamlarına daha fazla entegre olup kara birlikleri ve diğer uçaklarla gerçek zamanlı veri paylaşıyor. Sensör takımlarımız daha modüler hale geldi; ayrıca sentetik açıklıklı radar sistemlerini, geliştirilmiş elektronik harp takımlarını ve pilotlar için kask üstü ekranları devreye aldık."
 sensors_and_avionics_gen_5:0 "5. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_5_desc:0 "Artık sisteme yapay zekâyı entegre etmekteyiz; radar, FLIR, LIDAR gibi çeşitli sensörlerden gelen terabaytlarca veriyi analiz ederek savaş alanının kapsamlı ve doğru bir resmini sunuyoruz."
 sensors_and_avionics_gen_6:0 "6. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_6_desc:0 "Artık sisteme yapay zekâyı entegre etmekteyiz; radar, FLIR, LIDAR gibi çeşitli sensörlerden gelen terabaytlarca veriyi analiz ederek savaş alanının kapsamlı ve doğru bir resmini sunuyoruz."
 sensors_and_avionics_gen_7:0 "7. Nesil Sensörler ve Aviyonik"
 sensors_and_avionics_gen_7_desc:0 "Artık sisteme yapay zekâyı entegre etmekteyiz; radar, FLIR, LIDAR gibi çeşitli sensörlerden gelen terabaytlarca veriyi analiz ederek savaş alanının kapsamlı ve doğru bir resmini sunuyoruz."
 helicopter_module_drone_control_gen_1:0 "İHA Kontrol Takımı"
 helicopter_module_drone_control_gen_1_desc:0 "Keşif ve saldırı görevlerini insansız sistemlere kaydıran, özel bir İHA kontrol ve görev yönetimi paketi. Daha iyi farkındalık ve eşgüdümlü angajman sayesinde insan gücü ihtiyacını azaltır ve genel operasyonel etkinliği artırır; ancak gelişmiş elektronik, sensör ve veri bağlantıları nedeniyle üretim maliyetini ve kaynak talebini önemli ölçüde yükseltir."
 flare_launchers:0 "IRCM Takımı"
 flare_launchers_desc:0 "Isı güdümlü füze arayıcılarını şaşırtmak için tasarlanmış temel bir kızılötesi karşı tedbir sistemi. Sahte sinyaller yayan dönen bir kızılötesi karıştırıcı kullanarak füzenin kilitlenme isabetini düşürür. İlk nesil MANPADS'lere karşı etkilidir ancak modern tehditlere karşı sınırlıdır."
 active_defence_system_gen1:0 "MAWS"
 active_defence_system_gen1_desc:0 "Füze Yaklaşma Uyarı Sistemi. Morötesi veya kızılötesi izleme yoluyla gelen füze atışlarını algılayan bir sensör sistemi. Parlak fişek veya şaff gibi karşı tedbirlerin devreye girmesini otomatik olarak tetikler. Güdümlü füze tehditlerine karşı pasif durumsal farkındalık sağlar."
 active_defence_system_gen2:0 "Gelişmiş MAWS ve DIRCM"
 active_defence_system_gen2_desc:0 "Füze uyarısını yönlü bir kızılötesi karşı tedbirle eşleştiren modern bir füze savunma takımı. Kızılötesi güdümlü füzeleri izleyip karıştırmak için tareli bir lazer kullanır. Gelişmiş MANPADS ve omuzdan atılan tehditlere karşı hayatta kalma oranını büyük ölçüde artırır."
 active_defence_system_gen3:0 "Helikopter APS Lazer Sert Öldürme"
 active_defence_system_gen3_desc:0 "Gelen mermileri fiziksel olarak devre dışı bırakabilen bir yönlendirilmiş enerji savunma sistemi. Füzeleri çarpmadan önce yok etmek veya saptırmak için yüksek enerjili bir lazer ateşler. Döner kanatlı hava araçları için en yeni nesil aktif korumayı temsil eder."
 active_defence_system_gen4:0 "2. Nesil Helikopter APS Lazer Sert Öldürme"
 active_defence_system_gen4_desc:0 "Gelen mermileri fiziksel olarak devre dışı bırakabilen bir yönlendirilmiş enerji savunma sistemi. Füzeleri çarpmadan önce yok etmek veya saptırmak için yüksek enerjili bir lazer ateşler. Döner kanatlı hava araçları için en yeni nesil aktif korumayı temsil eder."
 active_defence_system_gen5:0 "3. Nesil Helikopter APS Lazer Sert Öldürme"
 active_defence_system_gen5_desc:0 "Gelen mermileri fiziksel olarak devre dışı bırakabilen bir yönlendirilmiş enerji savunma sistemi. Füzeleri çarpmadan önce yok etmek veya saptırmak için yüksek enerjili bir lazer ateşler. Döner kanatlı hava araçları için en yeni nesil aktif korumayı temsil eder."
 stealth_modification_gen1:0 "1. Nesil Gizlilik Modifikasyonu"
 stealth_modification_gen1_desc:0 "Gizli helikopterler için ilk girişimler, radar kesit alanını azaltmaya yönelik ilkel çabalardan oluşuyordu. Bu ilk denemeler radar yansımalarını en aza indirmek için gövde şekillendirmeye ve radar dönüşlerini azaltmak için radar emici malzemeler kullanmaya odaklanıyordu. Ancak bu önlemlerin etkinliği sınırlıydı ve gerçek gizlilik yetenekleri elde edilemedi."
 stealth_modification_gen2:0 "2. Nesil Gizlilik Modifikasyonu"
 stealth_modification_gen2_desc:0 "Önceki girişimlerin devamında helikopter üreticileri gövdelere kompozit malzemeler entegre etti; bu, radar dalgalarını emmeye ve hava aracının radar ekranlarındaki görünürlüğünü azaltmaya yardımcı oldu. Ayrıca helikopterler RCS'yi daha da düşüren yüzeyli tasarımları kullanmaya başladı. Bu tasarımlar düz yüzeylere ve açılara benziyordu ve radar sinyallerini kaynaktan uzağa dağıtmaya yardımcı oldu."
 stealth_modification_gen3:0 "3. Nesil Gizlilik Modifikasyonu"
 stealth_modification_gen3_desc:0 "Gizliliğe daha da fazla odaklanan helikopter gizlilik sistemleri artık gelişmiş malzemeleri, uyarlanabilir kamuflaj sistemlerini ve akustik iz azaltma teknolojisini bünyesinde barındırıyor. Gelişmiş metamalzemeler ve nanoteknoloji, uyarlanabilir kamuflajla birlikte kullanılıyor. Fenestron rotorlar standart hale geldi."
 stealth_modification_gen4:0 "4. Nesil Gizlilik Modifikasyonu"
 stealth_modification_gen4_desc:0 "Gizliliğe daha da fazla odaklanan helikopter gizlilik sistemleri artık gelişmiş malzemeleri, uyarlanabilir kamuflaj sistemlerini ve akustik iz azaltma teknolojisini bünyesinde barındırıyor. Gelişmiş metamalzemeler ve nanoteknoloji, uyarlanabilir kamuflajla birlikte kullanılıyor. Fenestron rotorlar standart hale geldi."
 stealth_modification_gen5:0 "5. Nesil Gizlilik Modifikasyonu"
 stealth_modification_gen5_desc:0 "Gizliliğe daha da fazla odaklanan helikopter gizlilik sistemleri artık gelişmiş malzemeleri, uyarlanabilir kamuflaj sistemlerini ve akustik iz azaltma teknolojisini bünyesinde barındırıyor. Gelişmiş metamalzemeler ve nanoteknoloji, uyarlanabilir kamuflajla birlikte kullanılıyor. Fenestron rotorlar standart hale geldi."
 helicopter_gun_pod_gen1:0 "1. Nesil Top Podu"
 helicopter_gun_pod_gen1_desc:0 "İlk aşamalarda silahlar helikopterlere elle monte ediliyor, gelişmiş stabilizasyon sistemleri olmadan mürettebat tarafından kullanılıyordu. Bu kurulumlarda isabet ve denge yetersizdi; hedefleme zordu."
 helicopter_gun_pod_gen2:0 "2. Nesil Top Podu"
 helicopter_gun_pod_gen2_desc:0 "İkinci nesil top podları, makineli tüfekler için ayrılmış podlardı. Bunlar daha fazla denge ve isabet sağladı; silahlar helikopter silahlanmasının standart bir parçası haline geldi. Uzaktan nişan sistemleri etkinliklerini artırdı."
 helicopter_gun_pod_gen3:0 "3. Nesil Top Podu"
 helicopter_gun_pod_gen3_desc:0 "Üçüncü nesil top podları, helikopter hareketini telafi eden ve daha isabetli atış sağlayan jiroskopik stabilizasyon sistemleri içeriyordu. Ayrıca kızılötesi ve optik gibi sensörlerin entegrasyonu, özellikle düşük ışık koşullarında hedefleme yeteneklerini geliştirdi."
 helicopter_gun_pod_gen4:0 "4. Nesil Top Podu"
 helicopter_gun_pod_gen4_desc:0 "Modern sensör teknolojisinin gelişiyle helikopter üstü makineli tüfek podları daha sofistike hale geldi. Kızılötesi ve elektro-optik sensörlerin entegrasyonu düşük ışıkta hedeflemeyi mümkün kıldı. Lazer telemetreler ve hedef işaretleyiciler, yer ve hava hedeflerinin hassas şekilde belirlenip angaje edilmesini sağladı."
 helicopter_gun_pod_gen5:0 "5. Nesil Top Podu"
 helicopter_gun_pod_gen5_desc:0 "5. Nesil Top Podları, öldürücülüğü daha da artıran minyatür elektromanyetik ray topları veya bobin topları içerir."
 helicopter_gun_pod_gen6:0 "6. Nesil Top Podu"
 helicopter_gun_pod_gen6_desc:0 "5. Nesil Top Podları, öldürücülüğü daha da artıran minyatür elektromanyetik ray topları veya bobin topları içerir."
 helicopter_gun_pod_gen7:0 "7. Nesil Top Podu"
 helicopter_gun_pod_gen7_desc:0 "5. Nesil Top Podları, öldürücülüğü daha da artıran minyatür elektromanyetik ray topları veya bobin topları içerir."
 helicopter_light_nose_gun_gen1:0 "1. Nesil 12,7 mm Burun Silahı"
 helicopter_light_nose_gun_gen1_desc:0 "İlk burun monteli makineli tüfekler, yumuşak yer tehditlerine ve hafif uçaklara karşı ilkel savunma yeteneği sağlamaya odaklanıyordu. Bu dönemdeki teknoloji ve tasarım görece basitti; çoğunlukla sınırlı hedefleme sistemlerine sahip, elle kullanılan makineli tüfeklerdi.\n\n§GTasarımcı İpucu: Hafif Burun Silahları piyadeye karşı etkilidir ancak zırhlı araçlara karşı DEĞİL§!"
 helicopter_light_nose_gun_gen2:0 "2. Nesil 12,7 mm Burun Silahı"
 helicopter_light_nose_gun_gen2_desc:0 "İkinci nesil burun monteli makineli tüfekler aviyonik, hedefleme sistemleri ve silah stabilizasyonunda önemli ilerlemelere sahne oldu. Bu dönemde helikopterler jiro stabilizeli bağlantılar, telemetreler ve hedefleme bilgisayarları dâhil daha sofistike atış kontrol sistemleri kullanmaya başladı.\n\n§GTasarımcı İpucu: Hafif Burun Silahları piyadeye karşı etkilidir ancak zırhlı araçlara karşı DEĞİL§!"
 helicopter_light_nose_gun_gen3:0 "3. Nesil 12,7 mm Burun Silahı"
 helicopter_light_nose_gun_gen3_desc:0 "Üçüncü nesil burun monteli makineli tüfekler, helikopterin daha geniş sensör ve haberleşme sistemleriyle kusursuz entegrasyonu ile otomasyon ve özerk yeteneklerdeki gelişmelerle öne çıkar. Makineli tüfekler artık pilotun kask üstü ekranlarıyla tam entegredir.\n\n§GTasarımcı İpucu: Hafif Burun Silahları piyadeye karşı etkilidir ancak zırhlı araçlara karşı DEĞİL§!"
 helicopter_light_nose_gun_gen4:0 "4. Nesil 12,7 mm Burun Silahı"
 helicopter_light_nose_gun_gen4_desc:0 "Dördüncü nesil burun monteli makineli tüfekler otomasyon ve özerk yeteneklerdeki gelişmelerle öne çıkar. Makineli tüfekler artık pilotun kask üstü ekranlarıyla tam entegredir.\n\n§GTasarımcı İpucu: Hafif Burun Silahları piyadeye karşı etkilidir ancak zırhlı araçlara karşı DEĞİL§!"
 helicopter_light_nose_gun_gen5:0 "5. Nesil 12,7 mm Burun Silahı"
 helicopter_light_nose_gun_gen5_desc:0 "Beşinci nesil burun monteli makineli tüfekler otomasyon ve özerk yeteneklerdeki gelişmelerle öne çıkar. Makineli tüfekler artık pilotun kask üstü ekranlarıyla tam entegredir.\n\n§GTasarımcı İpucu: Hafif Burun Silahları piyadeye karşı etkilidir ancak zırhlı araçlara karşı DEĞİL§!"
 helicopter_medium_nose_gun_gen1:0 "1. Nesil 20 mm Burun Silahı"
 helicopter_medium_nose_gun_gen1_desc:0 "İlk nesil burun monteli 20 mm silahlar, mevcut uçak otomatik toplarından uyarlanmıştı. Elle nişan alınıyordu ve gelişmiş hedefleme sistemlerinden yoksundu. Bu silahlar bastırma ateşi ve sınırlı tanksavar yeteneği sağlıyordu. Basit tasarımları, helikopterin ağırlık ve alan kısıtları içinde ateş gücünü en üst düzeye çıkarmaya odaklanıyordu. Mühimmat kapasitesi sınırlıydı ve geri tepme yönetimi helikopterin doğal kararsızlığı yüzünden kısıtlıydı.\n\n§GTasarımcı İpucu: Orta Burun Silahları tanksavar ve piyadesavar yetenekleri arasında denge sağlar§!"
 helicopter_medium_nose_gun_gen2:0 "2. Nesil 20 mm Burun Silahı"
 helicopter_medium_nose_gun_gen2_desc:0 "İkinci nesil burun monteli 20 mm silahlarda hedefleme, atış kontrolü ve mühimmat türlerinde ilerlemeler yaşandı. Jiro stabilizeli taretler ve elektro-optik hedefleme sistemleri gibi stabilize platformların entegrasyonu daha isabetli ve çok yönlü angajmanlar sağladı. Bu sistemler helikopterin hareketini telafi ederek manevralar sırasında isabeti korudu. Mühimmat seçenekleri artık zırh delici ve patlayıcı mermileri de içeriyordu ve silahın yeteneklerini artırdı. Gelişmiş geri tepme azaltma sistemleri, atışın helikopterin dengesi üzerindeki etkisini de azalttı.\n\n§GTasarımcı İpucu: Orta Burun Silahları tanksavar ve piyadesavar yetenekleri arasında denge sağlar§!"
 helicopter_medium_nose_gun_gen3:0 "3. Nesil 20 mm Burun Silahı"
 helicopter_medium_nose_gun_gen3_desc:0 "Üçüncü nesil burun monteli 20 mm silahlar, daha da gelişmiş atış kontrol sistemleri, hafif mühimmat ve yapay zekâ destekli hedefleme ile öngörülü atış çözümleri sunan yarı özerk hedefleme ile malzeme bilimindeki en son gelişmeleri kullanan mühimmat içerir.\n\n§GTasarımcı İpucu: Orta Burun Silahları tanksavar ve piyadesavar yetenekleri arasında denge sağlar§!"
 helicopter_medium_nose_gun_gen4:0 "4. Nesil 20 mm Burun Silahı"
 helicopter_medium_nose_gun_gen4_desc:0 "Dördüncü nesil burun monteli 20 mm silahlar, daha da gelişmiş atış kontrol sistemleri, hafif mühimmat ve yapay zekâ destekli hedefleme ile öngörülü atış çözümleri sunan yarı özerk hedefleme ile malzeme bilimindeki en son gelişmeleri kullanan mühimmat içerir.\n\n§GTasarımcı İpucu: Orta Burun Silahları tanksavar ve piyadesavar yetenekleri arasında denge sağlar§!"
 helicopter_medium_nose_gun_gen5:0 "5. Nesil 20 mm Burun Silahı"
 helicopter_medium_nose_gun_gen5_desc:0 "Beşinci nesil burun monteli 20 mm silahlar, daha da gelişmiş atış kontrol sistemleri, hafif mühimmat ve yapay zekâ destekli hedefleme ile öngörülü atış çözümleri sunan yarı özerk hedefleme ile malzeme bilimindeki en son gelişmeleri kullanan mühimmat içerir.\n\n§GTasarımcı İpucu: Orta Burun Silahları tanksavar ve piyadesavar yetenekleri arasında denge sağlar§!"
 helicopter_heavy_nose_gun_gen1:0 "1. Nesil 30 mm Burun Silahı"
 helicopter_heavy_nose_gun_gen1_desc:0 "İlk nesil helikopter monteli 30 mm silahlar öncelikle tanksavar ve yer saldırısı rolleri için geliştirildi. Bu silahlar çoğunlukla mevcut sistemlerden türetilmişti. Silahlara elle nişan alınıyordu; bu da özellikle dinamik uçuş manevralarında isabeti zorlaştırıyordu. Mühimmat kapasitesi sınırlıydı ve silahlar çoğunlukla görece kısa menzillerde etkiliydi.\n\n§GTasarımcı İpucu: Ağır Burun Silahları, piyadesavar yeteneği pahasına daha iyi tanksavar yeteneği sağlar§!"
 helicopter_heavy_nose_gun_gen2:0 "2. Nesil 30 mm Burun Silahı"
 helicopter_heavy_nose_gun_gen2_desc:0 "İkinci nesil helikopter monteli 30 mm silahlar, isabeti ve menzili artıran daha sofistike hedefleme sistemlerinin entegrasyonuna sahipti. Jiro stabilizeli silah bağlantıları ve atış kontrol sistemleri geliştirilerek pilotların manevra yaparken isabeti korumasına imkân verildi. Mühimmat kapasitesi arttı ve zırh delme yeteneği gelişmiş yeni nesil 30 mm mühimmat kullanıma girdi. Bu iyileştirmeler silahın etkinliğini daha geniş bir hedef yelpazesine yaydı.\n\n§GTasarımcı İpucu: Ağır Burun Silahları, piyadesavar yeteneği pahasına daha iyi tanksavar yeteneği sağlar§!"
 helicopter_heavy_nose_gun_gen3:0 "3. Nesil 30 mm Burun Silahı"
 helicopter_heavy_nose_gun_gen3_desc:0 "Üçüncü nesil burun monteli 30 mm silahlar, daha da gelişmiş atış kontrol sistemleri, hafif mühimmat ve yapay zekâ destekli hedefleme ile öngörülü atış çözümleri sunan yarı özerk hedefleme ile malzeme bilimindeki en son gelişmeleri kullanan mühimmat içerir.\n\n§GTasarımcı İpucu: Ağır Burun Silahları, piyadesavar yeteneği pahasına daha iyi tanksavar yeteneği sağlar§!"
 helicopter_heavy_nose_gun_gen4:0 "4. Nesil 30 mm Burun Silahı"
 helicopter_heavy_nose_gun_gen4_desc:0 "Dördüncü nesil burun monteli 30 mm silahlar, daha da gelişmiş atış kontrol sistemleri, hafif mühimmat ve yapay zekâ destekli hedefleme ile öngörülü atış çözümleri sunan yarı özerk hedefleme ile malzeme bilimindeki en son gelişmeleri kullanan mühimmat içerir.\n\n§GTasarımcı İpucu: Ağır Burun Silahları, piyadesavar yeteneği pahasına daha iyi tanksavar yeteneği sağlar§!"
 helicopter_heavy_nose_gun_gen5:0 "5. Nesil 30 mm Burun Silahı"
 helicopter_heavy_nose_gun_gen5_desc:0 "Beşinci nesil burun monteli 30 mm silahlar, daha da gelişmiş atış kontrol sistemleri, hafif mühimmat ve yapay zekâ destekli hedefleme ile öngörülü atış çözümleri sunan yarı özerk hedefleme ile malzeme bilimindeki en son gelişmeleri kullanan mühimmat içerir.\n\n§GTasarımcı İpucu: Ağır Burun Silahları, piyadesavar yeteneği pahasına daha iyi tanksavar yeteneği sağlar§!"
 helicopter_railgun_nose_gun_gen1:0 "Ray Topu Burun Silahı I"
 helicopter_railgun_nose_gun_gen1_desc:0 "Ray topu burun silahları, yüksek hızlı mermiler atmak için elektromanyetik ivmelenme kullanır; doğrudan çatışmalarda mükemmel zırh delme ve sert hedefleri yok etme gücü sağlar.\n\n§GTasarımcı İpucu: Ray Topu Burun Silahları zırh delmeyi büyük ölçüde artırır ancak çok pahalıdır. Sertleştirilmiş hedeflere karşı güvenilir nüfuz gerektiğinde kullanın§!"
 helicopter_railgun_nose_gun_gen2:0 "Ray Topu Burun Silahı II"
 helicopter_railgun_nose_gun_gen3:0 "Ray Topu Burun Silahı III"
 helicopter_railgun_nose_gun_gen4:0 "Ray Topu Burun Silahı IV"
 helicopter_atgm_gen1:0 "1. Nesil ATGM"
 helicopter_atgm_gen1_desc:0 "İlk helikopter monteli ATGM'ler çoğunlukla elle güdümlüydü. Operatörler hedefle görsel temasını sürdürmek ve füzeyi bir kumanda kolu ile füzeye bağlı bir tel aracılığıyla yönlendirmek zorundaydı. Tel gerçek zamanlı kontrol ve güdüm sağlıyor, uçuş sırasında düzeltme yapılmasına imkân veriyordu."
 helicopter_atgm_gen2:0 "2. Nesil ATGM"
 helicopter_atgm_gen2_desc:0 "ATGM'ler artık yarı otomatik komut güdüm sistemlerine sahip. Bu sistemler daha iyi isabet sunuyor ve karşı tedbirlere karşı daha dirençliydi. Hedef takibi ve füze kontrolü için lazer güdüm veya telsiz komutları kullanıyorlardı."
 helicopter_atgm_gen3:0 "3. Nesil ATGM"
 helicopter_atgm_gen3_desc:0 "Kara harbi için tasarlanmış ATGM'lerin uyarlanmasıyla helikopter ATGM'leri artık at-unut yeteneğini bünyesinde barındırıyor. Bu füzeler, atıştan sonra hedefleri özerk olarak takip edip angaje etmelerini sağlayan gelişmiş arayıcı sistemlere sahipti; böylece helikopter manevra yapabiliyor veya başka hedefleri angaje edebiliyordu. Ayrıca geliştirilmiş karıştırma önleme yeteneklerine ve karşı tedbirlere karşı daha iyi dirence sahiptiler."
 helicopter_atgm_gen4:0 "4. Nesil ATGM"
 helicopter_atgm_gen4_desc:0 "Füze teknolojisindeki ilave gelişmeler, çok modlu arayıcılara ve daha iyi isabet ile menzile sahip ATGM'lere yol açtı. Bu füzeler çoğunlukla kızılötesi, radar ve lazer arayıcıların bir kombinasyonunu içerir ve farklı hedef senaryolarına ve karşı tedbirlere uyum sağlamalarına imkân verir."
 helicopter_atgm_gen5:0 "5. Nesil ATGM"
 helicopter_atgm_gen5_desc:0 "Beşinci nesil ATGM'ler arayıcı teknolojisi, hedef ayırt etme, menzil ve angajman yeteneklerindeki daha ileri gelişmelerle öne çıkar. Özellikleri arasında gelişmiş ağ merkezli harp entegrasyonu, artan otomasyon ve daha da sofistike karşı-karşı tedbir yetenekleri yer alır."
 helicopter_atgm_gen6:0 "6. Nesil ATGM"
 helicopter_atgm_gen6_desc:0 "Altıncı nesil ATGM'ler arayıcı teknolojisi, hedef ayırt etme, menzil ve angajman yeteneklerindeki daha ileri gelişmelerle öne çıkar. Özellikleri arasında gelişmiş ağ merkezli harp entegrasyonu, artan otomasyon ve daha da sofistike karşı-karşı tedbir yetenekleri yer alır."
 helicopter_atgm_gen7:0 "7. Nesil ATGM"
 helicopter_atgm_gen7_desc:0 "Yedinci nesil ATGM'ler arayıcı teknolojisi, hedef ayırt etme, menzil ve angajman yeteneklerindeki daha ileri gelişmelerle öne çıkar. Özellikleri arasında gelişmiş ağ merkezli harp entegrasyonu, artan otomasyon ve daha da sofistike karşı-karşı tedbir yetenekleri yer alır."
