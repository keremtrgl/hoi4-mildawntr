 military_spending_desc:0 "Askeri Harcama seviyemiz, Silahlı Kuvvetlerimizde kaç asker bulundurabileceğimizi belirler ve yeni askeri teçhizat üretimini etkiler."
 defence_00_neutral:0 "Askeri Harcama Yok"
 defence_00_expected:0 "§GAskeri Harcama Yok§!"
 defence_00_under:0 "§RAskeri Harcama Yok§!"
 defence_00_over:0 "§3Askeri Harcama Yok§!"
 defence_00_desc:0 "Askeri Harcamaları artırmak ordumuzu genişletmemize yardımcı olacaktır.\n\nEk maliyet, askeri ve deniz sanayimizin büyüklüğüne göre belirlenir. Kişi başı GSYİH'miz ne kadar yüksekse maliyet de o kadar artar. Tüm yasalar için tahmini mevcut maliyet, mevcut kullanılabilir insan gücü seviyesine göre hesaplanır; savunma harcamalarınız, ne kadar fazla insan gücü seferber edildiğine bağlı olarak daha da artabilir.\n[military_spending_protest_TT]"
