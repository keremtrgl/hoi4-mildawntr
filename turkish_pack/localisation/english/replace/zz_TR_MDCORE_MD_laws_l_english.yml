l_english:
 Internal_politics:0 "İç Siyaset"
 national_status:0 "Ulusal İstatistikler ve İç Gruplar"
 national_status_desc:0 "Bunlar ulusumuzun hayati ekonomik istatistikleridir."
 internal_factions:0 "İç Gruplar"
 internal_factions_desc:0 "İç gruplar, nüfuzu bir ulusun kamu politikasında ağırlık taşıyan örgütleri temsil eder. Her iç grup çeşitli avantajlar ve dezavantajlar sağlar. Bir iç grubu devre dışı bırakmak son derece zordur ve büyük miktarda siyasi güç gerektirir."
 religion:0 "Din"
 government_budget:0 "Devlet Harcamaları"
 social_reforms:0 "Sosyal Haklar"
 political_reforms:0 "Politikalar"
 economic_cycles:0 "Ekonomik Döngü"
 depression:0 "Buhran"
 depression_desc:0 "Buhran, durgunluğun alışılmadık ve aşırı bir biçimidir. Buhranlar süreleriyle, istihdamda, kredi erişiminde ve imalat üretiminde olağandışı büyük düşüşlerle karakterize edilir. Çok sayıda iflas, enflasyon ve banka çöküşü çoğu zaman halkta paniğe yol açar ve kaosa son vereceğini vaat eden aşırılıkçı siyasi grupların büyümesine neden olur."
 recession:0 "Durgunluk"
 recession_desc:0 "Durgunluklar genellikle harcamalarda yaygın bir düşüş yaşandığında ortaya çıkar. Bunu bir mali kriz, dış ticaret şoku, olumsuz bir arz şoku veya ekonomik balonun patlaması gibi çeşitli olaylar tetikleyebilir. Hükümetler genellikle para arzını ve devlet harcamalarını artırmak, vergileri düşürmek gibi genişletici makroekonomik politikalarla karşılık verir."
 stagnation:0 "Stagnasyon"
 stagnation_desc:0 "Ekonomik stagnasyon, genellikle yüksek işsizliğin eşlik ettiği, uzun süren yavaş ekonomik büyüme dönemidir."
 stable_growth:0 "İstikrarlı Büyüme"
 stable_growth_desc:0 "Ekonomimiz istikrarlı biçimde büyüyor."
 fast_growth:0 "Hızlı Büyüme"
 fast_growth_desc:0 "Ekonomimiz hızla büyüyor."
 economic_boom:0 "Ekonomik Patlama"
 economic_boom_desc:0 "Ekonomimiz patlama yaşıyor."
 econ_cycle_upg_cost_TT:0 "\n§HYükseltme maliyeti:§! $[?THIS.econ_cycle_upg_cost] §Hmilyar§!"
 economic_cycle_TT:0 " - Ekonomiyi canlandırmak için piyasaya likidite sağlamamız gerekir. Bu, faiz oranını düşürmek ve para arzını genişletmek gibi Merkez Bankası araçlarıyla ve ek devlet teşvik harcamalarıyla yapılır. Ancak aşırı müdahale, gelecekte ekonomik balon riskini artırır.\n"
 law_corruption_TT:0 "- Siyasi Güç harcayarak hükümetimizdeki yolsuzluğu kökünden temizlemeye başlayabilir, şeffaf ve verimli bir yönetim oluşturabiliriz."
 corruption:0 "Yolsuzluk Seviyesi"
 corruption_level_10:0 "(10) Felç Edici Yolsuzluk"
 corruption_level_10_desc:0 "Ülkemizde yolsuzluk yaygın, kökleşmiş, sistemik ve eşi benzeri görülmemiş bir ölçek ve erişimdedir."
 corruption_level_09:0 "(9) Çökerten Yolsuzluk"
 corruption_level_09_desc:0 "Ülkemizde yolsuzluk toplumun her kesimini sarmış durumda. Bu, birkaç yoldan çıkmış memurun ya da siyasetçinin işi değil. Daha çok, yolsuz ihale anlaşmalarının danışıklı dövüşle ortaya çıktığı, bir kleptokrasi çarkıyla işleyen organize suça benziyor."
 corruption_level_08:0 "(8) Kontrolsüz Yolsuzluk"
 corruption_level_08_desc:0 "Ülkemizde yolsuzluk; kamu yönetimi, kolluk kuvvetleri, sağlık ve eğitim dahil yaşamın her alanını etkileyen ciddi bir sorun olarak algılanıyor. Yolsuzluk olgusu kamu yönetişimi modelimizde güçlü biçimde yerleşmiştir ve ülkemizde hukukun üstünlüğünün genel zayıflığına bağlanmaktadır."
 corruption_level_07:0 "(7) Dizginlenemeyen Yolsuzluk"
 corruption_level_07_desc:0 "Ülkemiz uzun süredir yaygın ve kronikleşmiş yolsuzluktan muzdarip. Yolsuzlukla mücadele eden yasal ve kurumsal çerçeve güçlü olsa da yolsuzluk kamu ve özel sektörde ciddi bir sorun olmayı sürdürüyor. Rüşvet, komisyon ve devlet yolsuzluğu gündelik hayatın olağan bir parçası sayılıyor."
 corruption_level_06:0 "(6) Sistematik Yolsuzluk"
 corruption_level_06_desc:0 "Ülkemizdeki yolsuzluk; hukukun zayıf uygulanması, denetim eksikliği, etik kurallarının yokluğu, devlet faaliyetlerindeki şeffaflık eksikliği, verimsiz bürokrasi, devletin cezasızlığı ve geniş takdir yetkileri ile toplumsal farkındalık eksikliği gibi birçok etkenin bileşkesidir."
 corruption_level_05:0 "(5) Yaygın Yolsuzluk"
 corruption_level_05_desc:0 "Ülkemizde rüşvet ve yolsuzluk uygulamaları yaygındır; ancak bunun sistemden mi yoksa iktidardaki kişilerden mi kaynaklandığı tartışmalıdır."
 corruption_level_04:0 "(4) Orta Düzey Yolsuzluk"
 corruption_level_04_desc:0 "Dikkat çeken yolsuzluk vakalarının medyada ifşa edilmesi ve sınırlı siyasi katılım, ülkemizde siyasi sürece dair kötü bir kamuoyu algısına katkıda bulundu. Üst düzey siyasetçilerin, yerel yöneticilerin ve kamu kaynaklarını kötüye kullanan işletmelerin karıştığı tekrarlayan yolsuzluk skandalları, bu güç istismarına karşı oluşturulan güvencelerin nispeten etkisiz kaldığını ortaya koydu."
 corruption_level_03:0 "(3) Ölçülü Yolsuzluk"
 corruption_level_03_desc:0 "Yolsuzluk algısı genel olarak düşük olsa da siyasi partiler ve işletmeler çoğunlukla en az dürüst ve güvenilir kesimler olarak görülüyor. Küçük çaplı yolsuzluk, bazı diğer ülkelerdekine kıyasla pek de nadir değil."
 corruption_level_02:0 "(2) Hafif Yolsuzluk"
 corruption_level_02_desc:0 "Ülkemizde yolsuzluk algısı ve görülme sıklığı genel olarak çok düşüktür. Küçük çaplı ve idari yolsuzluk neredeyse hiç yoktur. Bu, vatandaşların ve işletmelerin kamu görevlileriyle temas ederken yolsuzlukla karşılaşma ihtimalinin düşük olduğu anlamına gelir. Ancak bazı vakalar, kişisel bağlantıların, hediyelerin ve çıkar çatışmalarının geleneksel olmayan yolsuzluk türlerini oluşturan sorunlu alanlar olduğunu göstermiştir."
 corruption_level_01:0 "(1) Önemsiz Yolsuzluk"
 corruption_level_01_desc:0 "Ülkemizdeki yasal ve kurumsal çerçeve yolsuzlukla mücadelede etkili kabul edilmektedir; devlet kurumları yüksek düzeyde şeffaflık, dürüstlük ve hesap verebilirlikle öne çıkmaktadır. Düşük yolsuzluk düzeyi; verimli bir kamu yönetimine, vatandaşlara ve işletmelere sunulan yüksek kaliteli ve kapsamlı hizmetlere, toplumumuzda ve kurumlarımızda köklü bir açıklık ve şeffaflık geleneğine ve hukukun üstünlüğüne duyulan güçlü saygıya bağlanmaktadır."
