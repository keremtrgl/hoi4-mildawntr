 edu_04_over:0 "§3Yükseköğretim Odağı§!"
 edu_04_desc:0 "Küreselleşme ve dijital teknolojiler çağında yükseköğretim, ekonominin gelişmesinde giderek daha önemli bir rol oynuyor. Gençlerimizin değerli beceriler ve mesleki yeterlilikler edinmesi için eşit fırsata sahip olmasını sağlamak amacıyla kolejlere ve üniversitelere ayrılan fonu artıracağız.\n[edu_spending_protest_TT]"
 edu_04_TT:0 "\n$$[?THIS.array_education_spend^3] §Hmilyar§! Eğitime harcanıyor.\n£education_budget_cost_factor_texticon  §1Eğitim harcamamız§!, §1araştırma yuvası§! sayımız nedeniyle §Y[?research_slot_modifier|.0%]§! artıyor\n"
 edu_05_neutral:0 "Ücretsiz Evrensel Nitelikli Eğitim"
 edu_05_expected:0 "§GÜcretsiz Evrensel Nitelikli Eğitim§!"
 edu_05_under:0 "§RÜcretsiz Evrensel Nitelikli Eğitim§!"
 edu_05_over:0 "§3Ücretsiz Evrensel Nitelikli Eğitim§!"
 edu_05_desc:0 "Ailelerinin maddi durumu ne olursa olsun, tüm çocukların iyi ve ücretsiz bir eğitime erişimi olmalıdır. Tüm vatandaşlar için eşit başlangıç koşulları sağlamak amacıyla eğitimi devlet bütçesinden karşılıyoruz. Bu, her çocuğun potansiyelini geliştirecek ve fırsat eşitliğine dayalı bir toplum oluşturacaktır.\n[edu_spending_protest_TT]"
 edu_05_TT:0 "\n$$[?THIS.array_education_spend^4] §Hmilyar§! Eğitime harcanıyor.\n£education_budget_cost_factor_texticon  §1Eğitim harcamamız§!, §1araştırma yuvası§! sayımız nedeniyle §Y[?research_slot_modifier|.0%]§! artıyor\n"
 health_budget:0 "Sağlık Bütçesi"
 health_01_neutral:0 "Asgari Yerel Klinik Desteği"
 health_01_expected:0 "§GAsgari Yerel Klinik Desteği§!"
 health_01_under:0 "§RAsgari Yerel Klinik Desteği§!"
 health_01_over:0 "§3Asgari Yerel Klinik Desteği§!"
 health_01_desc:0 "Hükümet, küçük yerel kliniklere sınırlı miktarda mali destek sağlıyor. Bu klinikler temel bakım sunuyor ancak kaynaklar ve uzmanlaşmış tedaviler kıt.\n[health_spending_protest_TT]"
 health_01_TT:0 "\n$$[?THIS.array_health_spend^0] §Hmilyar§! Sağlık Hizmetlerine harcanıyor.\n"
 health_02_neutral:0 "Temel Sağlık Klinikleri"
 health_02_expected:0 "§GTemel Sağlık Klinikleri§!"
 health_02_under:0 "§RTemel Sağlık Klinikleri§!"
 health_02_over:0 "§3Temel Sağlık Klinikleri§!"
 health_02_desc:0 "Daha geniş sağlık kliniği ağları devlet fonu alıyor ve nüfusun çoğunluğunun temel tıbbi hizmetlere erişimi sağlanıyor. Bu klinikler yerel kliniklerden daha fazla hizmet sunsa da gelişmiş tıbbi olanaklardan yoksun kalabilirler.\n[health_spending_protest_TT]"
 health_02_TT:0 "\n$$[?THIS.array_health_spend^1] §Hmilyar§! Sağlık Hizmetlerine harcanıyor.\n"
 health_03_neutral:0 "Temel Hastane Desteği"
 health_03_expected:0 "§GTemel Hastane Desteği§!"
 health_03_under:0 "§RTemel Hastane Desteği§!"
 health_03_over:0 "§3Temel Hastane Desteği§!"
 health_03_desc:0 "Hastaneler sağlık bütçesinin önemli bir bölümünü almaya başlıyor; bu da daha uzmanlaşmış tedavi ve bakıma imkân tanıyor. Ancak her tedavi kapsam dahilinde olmayabilir ve hastalar yine de ciddi cepten giderlerle karşılaşabilir.\n[health_spending_protest_TT]"
 health_03_TT:0 "\n$$[?THIS.array_health_spend^2] §Hmilyar§! Sağlık Hizmetlerine harcanıyor.\n"
 health_04_neutral:0 "Ücretsiz Acil Tedavi"
 health_04_expected:0 "§GÜcretsiz Acil Tedavi§!"
 health_04_under:0 "§RÜcretsiz Acil Tedavi§!"
 health_04_over:0 "§3Ücretsiz Acil Tedavi§!"
 health_04_desc:0 "Tüm vatandaşlara ücretsiz acil tıbbi bakım güvencesi verilir; bu da ani hastalıklardan veya kazalardan kaynaklanan ölüm oranlarını düşürür. Rutin tedaviler hâlâ ücrete tabi olabilse de kimseye mali kısıtlar nedeniyle acil bakım reddedilmez.\n[health_spending_protest_TT]"
 health_04_TT:0 "\n$$[?THIS.array_health_spend^3] §Hmilyar§! Sağlık Hizmetlerine harcanıyor.\n"
 health_05_neutral:0 "Temel Evrensel Sağlık Hizmeti"
 health_05_expected:0 "§GTemel Evrensel Sağlık Hizmeti§!"
 health_05_under:0 "§RTemel Evrensel Sağlık Hizmeti§!"
 health_05_over:0 "§3Temel Evrensel Sağlık Hizmeti§!"
 health_05_desc:0 "Devlet geniş bir sağlık hizmetleri yelpazesini karşılar ve tüm vatandaşların belini bükecek masraflarla karşılaşmadan temel tıbbi bakıma erişmesini sağlar. Bazı uzmanlaşmış tedaviler için hâlâ cepten ödeme gerekebilir, ancak genel sağlık hizmetleri herkese açıktır.\n[health_spending_protest_TT]"
 health_05_TT:0 "\n$$[?THIS.array_health_spend^4] §Hmilyar§! Sağlık Hizmetlerine harcanıyor.\n"
 health_06_neutral:0 "Gelişmiş Evrensel Sağlık Hizmeti"
 health_06_expected:0 "§GGelişmiş Evrensel Sağlık Hizmeti§!"
 health_06_under:0 "§RGelişmiş Evrensel Sağlık Hizmeti§!"
 health_06_over:0 "§3Gelişmiş Evrensel Sağlık Hizmeti§!"
 health_06_desc:0 "Tüm vatandaşlara rutin kontrollerden uzmanlaşmış tedavilere kadar her şeyi kapsayan kapsamlı sağlık güvencesi sunulur. Koruyucu hekimliğe, araştırmaya ve ileri tıp teknolojilerine odaklanan sistem, herkes için en yüksek bakım standardını sağlar.\n[health_spending_protest_TT]"
 health_06_TT:0 "\n$$[?THIS.array_health_spend^5] §Hmilyar§! Sağlık Hizmetlerine harcanıyor.\n"
 social_budget:0 "Sosyal Harcamalar"
 social_01_neutral:0 "Asgari Geçim Yardımı"
 social_01_expected:0 "§GAsgari Geçim Yardımı§!"
 social_01_under:0 "§RAsgari Geçim Yardımı§!"
 social_01_over:0 "§3Asgari Geçim Yardımı§!"
 social_01_desc:0 "Hükümet, en savunmasız vatandaşlarına yalnızca temel hayatta kalmaya yetecek asgari mali desteği sağlıyor. Bu yardımlar sınırlıdır ve çoğunlukla temel ihtiyaçlara hitap eder.\n[social_spending_protest_TT]"
 social_01_TT:0 "\n$$[?THIS.array_social_spend^0] §Hmilyar§! Sosyal Yardım ve Sosyal Harcamalara harcanıyor.\n"
 social_02_neutral:0 "Yaşlılar ve Engelliler için Asgari Maaş"
 social_02_expected:0 "§GYaşlılar ve Engelliler için Asgari Maaş§!"
 social_02_under:0 "§RYaşlılar ve Engelliler için Asgari Maaş§!"
 social_02_over:0 "§3Yaşlılar ve Engelliler için Asgari Maaş§!"
 social_02_desc:0 "Geçim yardımlarına ek olarak yaşlılara ve engellilere hafif bir ağırlık verilerek onlara sınırlı bir maaş sunuluyor. Bu, söz konusu gruplar için gündelik yaşamın zorluklarını bir nebze hafifletiyor, ancak destek asgari düzeyde kalıyor.\n[social_spending_protest_TT]"
 social_02_TT:0 "\n$$[?THIS.array_social_spend^1] §Hmilyar§! Sosyal Yardım ve Sosyal Harcamalara harcanıyor.\n"
 social_03_neutral:0 "Yaşlılar ve Engelliler için Temel Maaş"
 social_03_expected:0 "§GYaşlılar ve Engelliler için Temel Maaş§!"
 social_03_under:0 "§RYaşlılar ve Engelliler için Temel Maaş§!"
 social_03_over:0 "§3Yaşlılar ve Engelliler için Temel Maaş§!"
 social_03_desc:0 "Devlet, yaşlılar ve engelliler için daha kapsamlı bir maaş sistemi sunarak mütevazı bir yaşam standardını sürdürmelerini sağlıyor. Bu destek, söz konusu kesimleri aşırı mali sıkıntılardan korumayı amaçlıyor.\n[social_spending_protest_TT]"
 social_03_TT:0 "\n$$[?THIS.array_social_spend^2] §Hmilyar§! Sosyal Yardım ve Sosyal Harcamalara harcanıyor.\n"
 social_04_neutral:0 "Kapsamlı Sosyal Güvenlik Ağı"
 social_04_expected:0 "§GKapsamlı Sosyal Güvenlik Ağı§!"
 social_04_under:0 "§RKapsamlı Sosyal Güvenlik Ağı§!"
 social_04_over:0 "§3Kapsamlı Sosyal Güvenlik Ağı§!"
 social_04_desc:0 "Hükümet sosyal yardım uygulamalarını genişletmeye başlıyor; işsizlik, konut ve çocuk bakımı desteği gibi alanları kapsayan daha geniş sosyal destek sistemleri getiriyor. Bu, öngörülemeyen sıkıntılara karşı daha sağlam bir koruma katmanı oluşturuyor.\n[social_spending_protest_TT]"
 social_04_TT:0 "\n$$[?THIS.array_social_spend^3] §Hmilyar§! Sosyal Yardım ve Sosyal Harcamalara harcanıyor.\n"
 social_05_neutral:0 "Sosyal Refah Devleti"
 social_05_expected:0 "§GSosyal Refah Devleti§!"
 social_05_under:0 "§RSosyal Refah Devleti§!"
 social_05_over:0 "§3Sosyal Refah Devleti§!"
 social_05_desc:0 "Hükümet işsizlik yardımı, konut ve gıda desteği gibi alanlarda sağlam bir destek sunarken sosyal güvenlik ağı genişliyor. Odak noktası, insanca bir yaşam kalitesini korumak ve sosyoekonomik kırılganlıklara karşı güvence sağlamaktır.\n[social_spending_protest_TT]"
 social_05_TT:0 "\n$$[?THIS.array_social_spend^4] §Hmilyar§! Sosyal Yardım ve Sosyal Harcamalara harcanıyor.\n"
 social_06_neutral:0 "Kapsamlı Sosyal Refah Devleti"
 social_06_expected:0 "§GKapsamlı Sosyal Refah Devleti§!"
 social_06_under:0 "§RKapsamlı Sosyal Refah Devleti§!"
 social_06_over:0 "§3Kapsamlı Sosyal Refah Devleti§!"
 social_06_desc:0 "Devlet, vatandaşlarının refahında merkezî bir rol üstlenerek geniş bir hizmet, destek ve yardım yelpazesi sunuyor. Bu sistem yalnızca temel geçimi değil, aynı zamanda daha yüksek bir yaşam standardını ve herkes için fırsat eşitliğini de destekler.\n[social_spending_protest_TT]"
 social_06_TT:0 "\n$$[?THIS.array_social_spend^5] §Hmilyar§! Sosyal Yardım ve Sosyal Harcamalara harcanıyor.\n"
 crime_fighting:0 "İç Güvenlik"
 police_01_neutral:0 "Asgari Polis Finansmanı"
 police_01_expected:0 "§GAsgari Polis Finansmanı§!"
 police_01_under:0 "§RAsgari Polis Finansmanı§!"
 police_01_over:0 "§3Asgari Polis Finansmanı§!"
 police_01_desc:0 "Polis ve istihbarat servislerimiz yetersiz finanse ediliyor ve yolsuzluğa ve suça genellikle göz yumuyor.\n[police_spending_protest_TT]"
 police_01_TT:0 "\n$$[?THIS.array_security_spend^0] §Hmilyar§! İç Güvenliğe harcanıyor.\n"
 police_02_neutral:0 "Temel Polis ve Güvenlik Finansmanı"
 police_02_expected:0 "§GTemel Polis ve Güvenlik Finansmanı§!"
 police_02_under:0 "§RTemel Polis ve Güvenlik Finansmanı§!"
 police_02_over:0 "§3Temel Polis ve Güvenlik Finansmanı§!"
 police_02_desc:0 "Polis ve istihbarat servislerimiz işini görüyor, ancak daha fazlasını yapmıyor. İlave adımlar yalnızca kamuoyu baskısı altında atılıyor.\n[police_spending_protest_TT]"
 police_02_TT:0 "\n$$[?THIS.array_security_spend^1] §Hmilyar§! İç Güvenliğe harcanıyor.\n"
 police_03_neutral:0 "Yüksek Polis ve İstihbarat Finansmanı"
 police_03_expected:0 "§GYüksek Polis ve İstihbarat Finansmanı§!"
 police_03_under:0 "§RYüksek Polis ve İstihbarat Finansmanı§!"
 police_03_over:0 "§3Yüksek Polis ve İstihbarat Finansmanı§!"
 police_03_desc:0 "Polis ve istihbarat servislerimiz iyi finanse ediliyor. Kanun ve düzen iyi korunuyor; iç ve dış komplolara karşı tetikte olabiliyorlar.\n[police_spending_protest_TT]"
 police_03_TT:0 "\n$$[?THIS.array_security_spend^2] §Hmilyar§! İç Güvenliğe harcanıyor.\n"
 police_04_neutral:0 "Kapsamlı Polis ve İstihbarat Aygıtı"
 police_04_expected:0 "§GKapsamlı Polis ve İstihbarat Aygıtı§!"
 police_04_under:0 "§RKapsamlı Polis ve İstihbarat Aygıtı§!"
 police_04_over:0 "§3Kapsamlı Polis ve İstihbarat Aygıtı§!"
 police_04_desc:0 "Polis ve istihbarat servislerimiz çok iyi finanse ediliyor. Yolsuzluğa ve suça karşı sert önlemler alabiliyorlar. Ayrıca tüm tehlikeli hareketleri yakından izliyorlar.\n[police_spending_protest_TT]"
 police_04_TT:0 "\n$$[?THIS.array_security_spend^3] §Hmilyar§! İç Güvenliğe harcanıyor.\n"
 police_05_neutral:0 "Polis Devleti"
 police_05_expected:0 "§GPolis Devleti§!"
 police_05_under:0 "§RPolis Devleti§!"
 police_05_over:0 "§3Polis Devleti§!"
 police_05_desc:0 "Polis ve istihbarat servislerimiz çok büyük kaynaklar alıyor. Yolsuzluğa ve suça karşı sert önlemler alabiliyor, her türlü iç muhalefeti ve dış komployu izlemek için devasa operasyonlar yürütüyorlar.\n[police_spending_protest_TT]"
 police_05_TT:0 "\n$$[?THIS.array_security_spend^4] §Hmilyar§! İç Güvenliğe harcanıyor.\n"
 Military_policies:0 "Askeri Politikalar"
 conscription_law:0 "Askerlik Yasası"
 no_military:0 "Kaldırılmış Ordu"
 no_military_desc:0 "Ülkemizin herhangi bir şekilde daimî ordusu yoktur ve tüm güvenlik, polis gibi ülkenin iç güvenlik güçlerince sağlanır."
 volunteer_army:0 "Gönüllü Hizmet"
 volunteer_army_desc:0 "Ordumuz tamamen gönüllülerden oluşur. Bu, ordunun toplam büyüklüğünü azaltır ancak daha verimli, daha küçük bir muharip güç yetiştirmemize olanak tanır. Gönüllü ordulara geçiş, Soğuk Savaş'ın sona ermesinden bu yana küresel bir eğilim olmuştur."
 partial_draft_army:0 "Kısmi Askerlik"
 partial_draft_army_desc:0 "Askeri personelimizin çoğunluğu gönüllülerden gelir, ancak yıllık eğitim kotalarını doldurmak için nüfusun bir kısmı hâlâ silah altına alınır."
 draft_army:0 "Zorunlu Askerlik"
 draft_army_desc:0 "Ülkemizde zorunlu askerlik vardır; yani erkek nüfusumuzun çoğunluğu savaş eğitimi almıştır. Bu, daha büyük bir askeri güç bulundurmamıza ve mevcut eğitim altyapısı sayesinde yeni muharip birlikleri hızla eğitmemize olanak tanır. Ancak er ve erbaşlar yabancı topraklardaki askeri maceralara girmeye daha az istekli olur."
 military_status_women:0 "Ordudaki Kadınlar"
 no_women_in_military:0 "Kadınlar için Yasak Hizmet"
 no_women_in_military_desc:0 "Ordumuz kadınları hizmetine kabul etmez."
 volunteer_women:0 "Kadınlar için Gönüllü Hizmet"
 volunteer_women_desc:0 "Kadınların ordumuzda gönüllü olarak görev yapmasına izin verilir."
 drafted_women:0 "Kadınlar için Zorunlu Hizmet"
 drafted_women_desc:0 "Kadınlara erkeklerle aynı şekilde davranılır ve ordumuza alınırlar."
 foreign_intervention_law:0 "Yabancı Müdahale Yasası"
 foreign_intervention_law_desc:0 "Yabancı Müdahale Yasası, ülkemizin çatışmalara müdahale etme ve diğer ülkeleri etkileme konusunda ne kadar istekli olduğunu belirler."
 intervention_isolation:0 "İzolasyon"
 intervention_isolation_desc:0 "Ulusumuz iç meselelerle daha çok ilgilenir ve herhangi bir askeri maceraya girişmek istemez."
 intervention_local_security:0 "Yerel Güvenlik"
 intervention_local_security_desc:0 "Dostlarımıza silah sağlayabiliriz, ancak asıl önceliğimiz kendi sınırlarımızdır."
 intervention_limited_interventionism:0 "Sınırlı Müdahalecilik"
 intervention_limited_interventionism_desc:0 "Dostlarımızın hayatta kalmasını sağlamak için kendi askerlerimizin canını riske atmaya hazırız."
 intervention_regional_interventionism:0 "Bölgesel Müdahalecilik"
 intervention_regional_interventionism_desc:0 "Yurt dediğimiz bölge son derece önemlidir. Düzeni korumak ve yurdumuz dediğimiz bölgede istikrarsızlığı önlemek için savaş tehdidini kullanmalıyız."
 intervention_global_interventionism:0 "Küresel Müdahalecilik"
 intervention_global_interventionism_desc:0 "Ordumuzun uzanışı çok geniştir ve dünyayı istikrarlı tutmak bizim görevimizdir."
 intervention_neo_imperialism:0 "Yeni Emperyalizm"
 intervention_neo_imperialism_desc:0 "Dünya bir oyun alanıdır ve güçlüler istediklerini alır. Ulusal güvenliğimiz uluslararası anlaşmalar gibi şeyler yüzünden tehlikeye atılamaz. Si vis pacem, para bellum."
 officer_training_law:0 "Subay Eğitimi"
 officer_training_law_desc:0 "Subaylar askerlerimizi savaşa sevk edecek. Onları ne kadar iyi eğitirsek, savaş alanında o kadar az öğrenmek zorunda kalırlar. Ancak subaylarımız için eğitim merkezleri kurmak maliyetli olabilir."
 officer_baptism_by_fire:0 "Ateşle Vaftiz"
 officer_baptism_by_fire_desc:0 "Gerçek liderler eğitilmez, savaşta dövülerek yetişir. Savaş yetersizleri eleyeceği için liderleri eğitmeye zaman harcamamıza gerek yok."
 officer_baptism_by_fire_TT:0 "Generalin savaşta ölme ihtimali: §R+%40§!\n"
 officer_basic_training:0 "Subay Temel Eğitimi"
 officer_basic_training_desc:0 "Liderlik potansiyeli gösteren kişiler seçilir ve birliklere nasıl komuta edileceği konusunda temel eğitim alır."
 officer_basic_training_TT:0 "Generalin savaşta ölme ihtimali: §R+%20§!\n"
 officer_advanced_training:0 "Subay İleri Eğitimi"
 officer_advanced_training_desc:0 "Liderlik potansiyeli gösteren kişiler seçilir ve birliklere nasıl komuta edileceği konusunda ileri eğitim alır."
 officer_military_school:0 "Subay Harp Okulları"
 officer_military_school_desc:0 "Yetenekli kişilerin askerî kariyerlerinin en başından itibaren birliklere komuta etme konusunda doğrudan eğitim alabileceği özel harp okulları kurduk."
 officer_military_school_TT:0 "Generalin savaşta ölme ihtimali: §G-%15§!\n"
 officer_military_academy:0 "Subay Harp Akademisi"
 officer_military_academy_desc:0 "Subaylarımızın en iyi taktik ve stratejileri öğreneceği ve savaş yürütmenin yeni yollarını geliştireceği prestijli harp akademileri kurduk."
 officer_military_academy_TT:0 "Generalin savaşta ölme ihtimali: §G-%30§!\n"
 officer_international_education:0 "Uluslararası Subay Eğitimi"
 officer_international_education_desc:0 "Müttefiklerimizin yardımıyla, subaylarımızın savaşın önlerine çıkaracağı her şeye hazır olmasını sağlayacak geniş bir bilgi ve kaynak havuzuna erişimimiz var."
 officer_international_education_TT:0 "Generalin savaşta ölme ihtimali: §G-%45§!\n"
 trade_laws_desc:0 "Ticaret yasaları önemlidir. Ayrıca büyük ülkemizin ekonomik olarak nasıl büyüyüp genişleyeceğini de belirler. Ulusumuz için bir Ticaret Yasası seçin"
 md_closed_economy:0 "Kapalı Ekonomi"
 md_closed_economy_desc:0 "Kapalı ekonomi dış dünyaya kapalıdır. Mümkünse dış dünyayla çok az ticaret yapılır ya da hiç yapılmaz. Ülke elinden geldiğince yalnızca kendine güvenir. Yine de bazı kaynaklar en yakın müttefiklerimize ihraç edilmeye devam eder."
 consumption_economy:0 "Tüketim Ekonomisi"
 consumption_economy_desc:0 "Tüketim ekonomisi, GSYİH'nin diğer ana bileşenlerinin aksine, GSYİH içindeki payı olarak tüketici harcamalarının belirleyici olduğu bir ekonomiyi ifade eder."
 semi_consumption_economy:0 "Yarı Tüketim Ekonomisi"
 semi_consumption_economy_desc:0 "Yarı tüketim ekonomileri nispeten yeni bir olgudur. İhracat ve tüketim ekonomilerinin bir melezidir ve diğer gelir kaynaklarına ekonomik olarak bağımlı olmanın zahmetinden kurtulmuştur. Ancak gerçek bir karma ekonominin aksine, yarı tüketim ekonomisi GSYİH'nin büyük bölümünde hâlâ tüketici harcamalarına dayanır."
 mixed_economy:0 "Karma Ekonomi"
 mixed_economy_desc:0 "Karma ekonomiler yarı tüketim ekonomilerine çok benzer. GSYİH'lerini oluştururken genel olarak tüketici harcamalarına daha da az bağımlıdırlar."
 export_economy:0 "İhracat Ekonomisi"
 export_economy_desc:0 "Emtia ihracatçıları arasında büyük doğal kaynak yataklarına, ara mal üreten ülkelere veya geniş tarım arazilerine sahip ülkeler yer alır. Bu ülkeler, ekonomik büyümelerinin büyük bölümünü sağlamak için ham ve ara malların büyük bir kısmını diğer ülkelere ihraç eder."
 globalized_trade_economy:0 "Küreselleşmiş Ticaret Ekonomisi"
 globalized_trade_economy_desc:0 "Küreselleşmiş ticaret ekonomisi, küresel ticarete diğer tüm ülkelerden çok daha fazla bağımlıdır. Kaynaklarımızın neredeyse tamamı pazara sunulur ve kaynaklarımızın neredeyse tamamı ticaretten gelir."
 migration_laws:0 "Göç Yasaları"
 open_borders:0 "Açık Sınırlar"
 open_borders_desc:0 "Açık sınırlar, ülkede son derece hafif veya hiç var olmayan göç yasalarını ifade eder. İnsanların ülkeye giriş ve çıkışının büyük oranda serbest olmasına imkân tanır."
 open_borders_tt:0 "\n$$[?THIS.array_border_control_spend^0] §Hmilyar§! Göç Kontrolüne harcanıyor.\n$current_migration_rate$"
 slightly_regulated_immigration:0 "Hafif Düzenlenmiş Göç"
 slightly_regulated_immigration_desc:0 "İnsanların ülkeye giriş çıkışına bazı hafif düzenlemeler getirmek, geçmişteki bir suç kaydı veya başka gerekçelerle istenmeyen bazı göçmenlerin akınını durdurmaya yardımcı olacaktır."
 slightly_regulated_immigration_tt:0 "\n$$[?THIS.array_border_control_spend^1] §Hmilyar§! Göç Kontrolüne harcanıyor.\n$current_migration_rate$"
 regulated_immigration:0 "Düzenlenmiş Göç"
 regulated_immigration_desc:0 "Göçmen sayısını sınırlamak, temiz sabıka kaydı aramak, küçük vizeler gibi düzenlemeler getirmek, göç yasaları için sağduyulu bir anlayış oluşturmak açısından şarttır."
 regulated_immigration_tt:0 "\n$$[?THIS.array_border_control_spend^2] §Hmilyar§! Göç Kontrolüne harcanıyor.\n$current_migration_rate$"
 heavily_regulated_immigration:0 "Sıkı Düzenlenmiş Göç"
 heavily_regulated_immigration_desc:0 "Göçmen sayısına ağır sınırlamalar getirilir, vizeler sıkı ve alınması zor hâle gelir, bu kuralları uygulamak için kurumlar oluşturulur ve her türlü kaçak göç engellenir."
 heavily_regulated_immigration_tt:0 "\n$$[?THIS.array_border_control_spend^3] §Hmilyar§! Göç Kontrolüne harcanıyor.\n$current_migration_rate$"
 closed_borders:0 "Kapalı Sınırlar"
