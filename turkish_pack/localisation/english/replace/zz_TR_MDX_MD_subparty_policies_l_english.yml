 subparty_policies.0.t:0 "Varlik Tasfiyesi Basarili"
 subparty_policies.0.desc:0 "Hızlı bir operasyonla yabancı bir gücün fonlarını ele geçirmeyi başardık. Denizaşırı varlıkları dondurarak, malzeme ve mülklere el koyarak ve mali araçları devlet hesaplarına aktararak ulusumuzun servetini önemli ölçüde artırdık."
 subparty_policies.0.a:0 "Hoş."
 subparty_policies.1.t:0 "Devlet Yabanci Bir Fabrikanin Denetimini Aliyor"
 subparty_policies.1.desc:0 "[ROOT.GetAdjective] lider [ROOT.GetLeader] bugün, merkezi ülkemizin dışında bulunan büyük bir şirketin varlıklarının devlet tarafından zorla satın alınacağını duyurdu. Bu, büyük liderimizin ifadesiyle 'sanayi üretiminin eninde sonunda başka bir yere taşınmasını' önlemek ve '[ROOT.GetAdjective] işçilerinin sömürülmesine son vermek' içindir. İlgili şirket için bu bir şok oldu. Genel müdürün 'bir devletin dürüst ve saygın bir şirket üzerinde yetki sahibi olması tam bir delilik' dediği aktarıldı."
 subparty_policies.1.a:0 "Hoş."
 subparty_policies.2.t:0 "Devlet Bir Silah Fabrikasini Isgal Ediyor"
 subparty_policies.2.desc:0 "Bu sabah erkenden [ROOT.GetAdjective] askerî polis, uluslararası bir savunma şirketinin işlettiği askerî teçhizat fabrikasının arazisine girdi. Şirketin uluslararası hukuku ihlal ettiği ilan edilmişti ve insanlığa karşı kapitalist savaşlar için silah teslim ettiğinden şüphelenilmekte. Bu nedenle şirketin tüm mülküne [Root.GetAdjective] hükümeti tarafından el konuldu. Fabrikadaki tüm askerî üretim, bu silahların tam olarak ne kadar insanlık dışı olduğuna dair kapsamlı bir inceleme yapabilmemiz için derhal devam edecek."
 subparty_policies.2.a:0 "Hoş."
 subparty_policies.3.t:0 "Devlet Bir Tersaneye El Koyuyor"
 subparty_policies.3.desc:0 "Bu sabah erkenden [ROOT.GetAdjective] sahil güvenliği devriye botlarıyla bir tersanenin giriş yolunu kapattı. Tersanenin kaçakçılık operasyonlarına paravan olduğundan şüpheleniliyor. Bu nedenle sahil güvenlik, [ROOT.GetAdjective] donanmasıyla birlikte bölgeyi askerî denetim altına aldı. Tersaneyi şu anda kiralayıp işleten uluslararası gemi inşa şirketinin bir sözcüsü, [ROOT.GetAdjective] yetkililerinin şirketle hiçbir şekilde iletişime geçmediğini söyleyerek iddiaları reddetti."
 subparty_policies.3.a:0 "Hoş."
 subparty_policies.4.t:0 "Millilestirme Basarisiz"
 subparty_policies.4.desc:0 "Yabancı varlıkları millileştirme planlarımızın hedefimize sızdığı anlaşılıyor. Biz tepki veremeden banka hesapları kapatıldı ve para yurt dışı hesaplara aktarıldı. İdaremizdeki birinin yabancı güçlerle fazla yakınlaşması sızıntıya yol açmış olabilir."
 subparty_policies.4.a:0 "Hoş."
 subparty_policies.5.t:0 "Sirket Fabrikalarini [ROOT.GetName] Disina Tasiyor"
 subparty_policies.5.desc:0 "Yabancı varlıkları millileştirme planlarımızın hedefimize sızdığı anlaşılıyor. Bu yüzden uluslararası bir şirket, tüm varlıklarını kaybetme korkusuyla üretim tesislerinden birini ülke dışına taşımaya ani bir kararla karar verdi. Bu, [ROOT.GetAdjective] ekonomisi için büyük bir darbe."
 subparty_policies.5.a:0 "Bu çok kötü."
 subparty_policies.6.t:0 "Teknoloji Sirketine El Koyma"
 subparty_policies.6.desc:0 "Çok uluslu bir teknoloji şirketi bugün büyük bir siber saldırı altında olduğunu duyurdu. Yardım amacıyla [ROOT.GetAdjective] istihbarat servisleri olay yerine geldi. Şirketin düşman bir ülkeden siber saldırıya uğradığı sonucuna varıldı. Ulusal güvenlik adına şirket varlıkları istihbarat servislerinin geçici denetimine alındı."
 subparty_policies.6.a:0 "Hoş."
