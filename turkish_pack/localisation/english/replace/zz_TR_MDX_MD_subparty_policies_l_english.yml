l_english:
 subparty_policies_category:0 "İdeolojik Mücadele"
 subparty_policies_category_desc:0 "Partimiz ideolojimizle tanımlanır. Dünyaya bakış biçimimiz bize onu ele almanın eşsiz yollarını sunar."
 generic_initiate_primary_sector_5_year_plan:0 "Birincil Sektör Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_primary_sector_5_year_plan_desc:0 "Ülkemizin birincil sektörü tarım ve çıkarım temelli sanayilerden oluşur. Bu sanayiler halkımızı ve fabrikalarımızı besler. Bu malları taşımak için altyapımıza yatırım yapmak da hayati önemdedir."
 generic_initiate_secondary_sector_5_year_plan:0 "İkincil Sektör Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_secondary_sector_5_year_plan_desc:0 "İkincil sektör imalatımızı ve diğer mavi yakalı işleri kapsar. İşçiler için kurulmuş bir ulus olarak bu sektör ulusumuzun bel kemiğidir."
 generic_initiate_tertiary_sector_5_year_plan:0 "Üçüncül Sektör Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_tertiary_sector_5_year_plan_desc:0 "Üçüncül sektör beyaz yakalı çalışanlarımıza aittir: hizmet çalışanları, mühendisler ve bürokratlar. İşçi sınıfı ideallerimizi gerçekten temsil etmeseler de, kapitalist ülkelerin gerisinde kalmamak için bu sektörü genişletmeliyiz."
 generic_initiate_infrastructure_5_year_plan:0 "Altyapı Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_infrastructure_5_year_plan_desc:0 "Ulusumuzun yolları ve demiryolları korkunç durumda. Ulusumuzun altyapısını iyileştirmeye yatırım yapmalıyız. Bu, sivil ve askerî ekonomimizin bel kemiğidir."
 generic_initiate_military_5_year_plan:0 "Askerî Sanayi Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_military_5_year_plan_desc:0 "Kapitalist domuzların özgürlüğümüzü almak için bize saldırması an meselesi. Tüm çabamızı askerî hazırlığımızı iyileştirmeye vermeliyiz."
 generic_initiate_naval_5_year_plan:0 "Deniz Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_naval_5_year_plan_desc:0 "Dünyanın dört bir yanındaki ideolojik kardeşlerimizle bağ kurmak için deniz yeteneklerimizi geliştirmeliyiz."
 generic_initiate_technology_5_year_plan:0 "Teknolojik Gelişim Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_technology_5_year_plan_desc:0 "Düşmanlarımızı yenmek için yalnızca hayalini kurabileceğimiz fantastik ve inanılmaz yeni silahlar geliştirmeliyiz: İki toplu tanklar! Bomba yağdıran hava gemileri! Düşman gemilerini batırmak için eğitilmiş devasa kalamarlar!"
 generic_initiate_energy_5_year_plan:0 "Enerji Odaklı 5 Yıllık Planı Başlat"
 generic_initiate_energy_5_year_plan_desc:0 "Gelecekteki sanayi genişlemesine hazırlık olarak enerji üretim yeteneklerimizi genişletmeliyiz."
 generic_admit_5_year_plan_failure:0 "5 Yıllık Planın Başarısızlığını Kabul Et"
 generic_admit_5_year_plan_failure_desc:0 "Görkemli 5 yıllık planımız için yaptığımız planların, en hafif tabirle, biraz fazla iddialı olduğunu kabul etmek zorundayız. Bunu kabul etmek kesinlikle yutulması zor bir lokma ve dünyaya yalnızca zayıflığımızı gösterecek. Birçok parti üyesi için kesinlikle kabul edilebilir bir çözüm olmayacak."
 generic_nationalise_biggest_influencer_industries:0 "[?var:influence_array^0.GetFlag][?var:influence_array^0.GetAdjective] Yatırımlarını Millileştir"
 generic_nationalise_biggest_influencer_industries_desc:0 "[?var:influence_array^0.GetFlag][?var:influence_array^0.GetName] ülkemizden büyük miktarda para geçiriyor. Halkımızı kapitalist kazançları için sömürüyorlar ve buna son verilmeli. Ülkemizdeki [?var:influence_array^0.GetAdjective] varlıkların bir kısmını millileştirmeliyiz."
 generic_nationalise_second_biggest_influencer_industries:0 "[?var:influence_array^1.GetFlag][?var:influence_array^1.GetAdjective] Yatırımlarını Millileştir"
 generic_nationalise_second_biggest_influencer_industries_desc:0 "[?var:influence_array^1.GetFlag][?var:influence_array^1.GetName] ülkemizden büyük miktarda para geçiriyor. Halkımızı kapitalist kazançları için sömürüyorlar ve buna son verilmeli. Ülkemizdeki [?var:influence_array^1.GetAdjective] varlıkların bir kısmını millileştirmeliyiz."
 generic_form_paramilitary_units:0 "Gençlik İçin Paramiliter Örgüt Kur"
 generic_form_paramilitary_units_desc:0 "Gençlerimiz tembelleşiyor ve yozlaşıyor. Onlara yararlı yaşam ve askerî becerileri, elbette parti sadakatini öğretecek paramiliter örgütler kurmalıyız."
