 GENC_TAKE_OVER:0 "Popülist Gençparti"
 GENC_TAKE_OVER_DESC:0 "Türkiye'yi bir iş insanı yönetecek ve ilginç, beklenmedik şeyler yaşanacak."
 HEPAR_TAKE_OVER:0 "Osman Pamukoğlu'nun Diyarı"
 HEPAR_TAKE_OVER_DESC:0 "Son çıkarılan aftan rahatsız olan eski generallerden Osman Pamukoğlu, ülkeyi sıkıntılarından kurtarmak ve alternatif bir ittifak kurmak için siyasete atılacak."
 TKP_TAKE_OVER:0 "Komünist Blok"
 TKP_TAKE_OVER_DESC:0 "Türkiye içinde örgütlenmiş pek çok komünist örgüt ülkede bir iç savaş başlatacak ve ülkeyi kendi görüşlerine göre yönetecek."
 ANAP_TAKE_OVER:0 "Geleneksel Liberal Rejim"
 ANAP_TAKE_OVER_DESC:0 "1990'larda ağırlığını hissettiren geleneksel liberaller yeniden iktidara gelecek ve Türkiye'yi daha da liberalleştirmeye çalışacak."
 LDP_TAKE_OVER:0 "Fanatik Liberal Rejim"
 LDP_TAKE_OVER_DESC:0 "Yeni tip liberaller Türkiye'nin yönetimini ele geçirecek ve ülkede ne var ne yok satarak kalkınmaya çalışacak."
 ANARCHIST_TAKE_OVER:0 "Türk Anarşistleri"
 ANARCHIST_TAKE_OVER_DESC:0 "Yeni afla birlikte Türk anarşistleri ülkede bir ayaklanma başlatacak ve ülkeyi enternasyonal bir devlete dönüştürecek."
 MAFIA_TAKE_OVER:0 "Mafya Rejimi"
 MAFIA_TAKE_OVER_DESC:0 "Mafyalar devletin kendilerini kısıtlamasından bıktığında ülkede bir derin devlet kuracak ve hükümeti devirecek."
 AYM_TAKE_OVER_DESC:0 "Azgın yolsuzluğun sonucunda Türkiye Anayasa Mahkemesi yetkilerini kullanarak rejimin kontrolünü ele alıyor ve ülkeyi reformlarla iyileştirmeye çalışıyor."
 OSMAN_TAKE_OVER:0 "İslami Blok"
 OSMAN_TAKE_OVER_DESC:0 "1923'te Türkiye'de Cumhuriyet ilan edildi ve İslamcı rüya söndü. Ancak şimdi İslamcılar intikam hırsıyla Cumhuriyeti yıkmaya geliyor."
 ATATURK_TAKE_OVER:0 "§YAtatürk Geri Dönüyor§!"
 ATATURK_TAKE_OVER_DESC:0 "Ülke tam anlamıyla çöküşün eşiğindeyken Atatürk yeniden hayata dönüyor ve ülkeyi kalanlardan kurtarıyor.\n§YBu yol gerçekçi değildir ve oyunu bozabilir.§!"
 TECH_TAKE_OVER:0 "Teknokratik Yönetim"
