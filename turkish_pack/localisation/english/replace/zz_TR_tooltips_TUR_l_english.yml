 MHP_TAKE_OVER:0 "Milliyetçi Hareket"
 MHP_TAKE_OVER_DESC:0 "Ülkedeki geniş çaplı istikrarsızlık aşırı sağcı MHP'nin iktidara gelmesine olanak tanıyacak. MHP Türkleri tek bir bayrak altında birleştirmeye çalışacak."
 JUNTA_TAKE_OVER:0 "Üçüncü Askerî Cunta"
 JUNTA_TAKE_OVER_DESC:0 "Türk Silahlı Kuvvetleri mevcut sorunlar nedeniyle ülkenin yönetimini ele alacak. Ülke hızla toparlanacak ve NATO'da kalacak, ancak artık demokratik bir düzen olmayacak."
 SAADET_TAKE_OVER:0 "Erbakan'ın Millî Görüşü"
