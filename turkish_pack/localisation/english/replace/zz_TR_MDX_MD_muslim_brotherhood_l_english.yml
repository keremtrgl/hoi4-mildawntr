l_english:
 muslim_brotherhood_sponsor:0 "Müslüman Kardeşler Ağı"
 muslim_brotherhood_suppressor:0 "Kardeşlere Karşı Koy"
 MB_build_network_hub:0 "Uluslararası Örgütü Kur"
 MB_build_network_hub_desc:0 "Müslüman Kardeşler sınırları aşan bir hareket olup bağlı yapıları tek bir merkez olmaksızın bölgeye dağılmıştır. [Root.GetNameDef] bu merkez olsun, ağı koordine etsin ve yurt dışındaki kardeşlerimizi destekleyecek imkânı bize versin."
 MB_fund_affiliates:0 "Kardeşler Bağlı Yapılarını Finanse Et"
 BROTHER_civil_war_has_started:0 "Bir §YMüslüman Kardeşler§! iç savaşı çıktı"
 MB_fund_affiliates_desc:0 "[FROM.GetNameDef] ülkesindeki Kardeşler isteklidir ama yoksuldur. Para, örgütleyiciler ve sürekli destek akışı, onların yok olmasını tercih edecek bir hükümete karşı ellerini güçlendirecektir."
 MB_diplomatic_solidarity:0 "Kardeşlik Dayanışmasına Çağır"
 MB_diplomatic_solidarity_desc:0 "Kardeşlerle uyumlu hükümetler birlikte ayrı olduklarından daha güçlüdür. Onları tek masaya getirin, ortak davayı yeniden teyit edin ve aramızdaki sıcaklığı bloğun geneline yayın."
 MB_bankroll_crackdown:0 "Yabancı Bir Baskıyı Finanse Et"
 MB_bankroll_crackdown_desc:0 "[FROM.GetNameDef], sınırları içinde Kardeşlerin büyüdüğünü izliyor ancak harekete geçecek imkânı yok. Hareket devleti tehdit edecek güce ulaşmadan önce ilk vuruşu yapmaları için ona para ve istihbarat sunun."
 MB_designate_terrorist_organization:0 "Kardeşleri Terör Örgütü İlan Et"
 MB_designate_terrorist_organization_desc:0 "Müslüman Kardeşleri ilan ettiğimiz gibi damgalayın: bir terör örgütü. Bu ilan yurt içinde az maliyetlidir ve [Root.GetNameDef] ülkesini aynı çizgiyi çekmiş her hükümetle omuz omuza getirir."
 MB_counter_sponsor_influence:0 "Kardeşlerin Finansmanını Ortaya Çıkar"
 MB_counter_sponsor_influence_desc:0 "Birisi [FROM.GetNameDef] ülkesindeki Kardeşleri finanse ediyor ve para iz bırakıyor. Bunu ifşa edin, bozun ve destekçileri gün ışığına çıkarılırken hareketin ivme kaybedişini izleyin."
 MB_rescind_terrorist_designation:0 "Terör İlanını Kaldır"
 MB_rescind_terrorist_designation_desc:0 "Terör ilanının sessizce geçerliliğini yitirmesine izin verin. Kardeşlere karşı tutum amacına hizmet etti ve eski şikâyetleri kayıtlarda tutmanın kazandıracağı pek bir şey yok."
 MB_sponsored_network:0 "Kardeşler hareketimize sponsorluk yapılıyor"
 MB_funding_subversion:0 "Yurt dışında Kardeşlerin yıkıcı faaliyetleri finanse ediliyor"
 MB_solidarity:0 "Müslüman Kardeşler dayanışması"
 MB_crackdown_patron:0 "Baskımızı finanse etti"
 MB_funding_repression:0 "Kardeşlere yönelik baskı finanse ediliyor"
 MB_counter_bloc:0 "Kardeşlere karşı ortak duruş"
 MB_branded_terrorist:0 "Kardeşleri terör örgütü olarak damgaladı"
 brotherhood.6.c:0 "Ilımlılarını hükümete dahil et."
 brotherhood.11.t:0 "Baskıyı Finanse Etme Teklifi"
 brotherhood.11.d:0 "[FROM.GetNameDef], Müslüman Kardeşler daha da güçlenmeden bastırmamız için bize sessizce para ve istihbarat teklif etti. Elçileri yanıt bekliyor."
 brotherhood.11.a:0 "Finansmanı kabul et ve onlara karşı harekete geç."
 brotherhood.11.b:0 "Teklifi reddet."
