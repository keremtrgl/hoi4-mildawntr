 MIO_CAT_OPEN_BTN_TT:0 "Mevcut kuruluşlara göz atmak ve kilidini açmak için Genel MIO Kataloğunu açın. Yerli kuruluşları olan ülkeler yalnızca sahip olmadıkları teçhizatı kapsayan şirketleri görür ve onları işe almak için §YAskerî Sanayi Kuruluşu Sözleşme Jetonları§! harcar."
