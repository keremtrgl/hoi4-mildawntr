 GENERIC_krepost_state_defense_bureau_desc:0 "MANPADS ve tanksavar güdümlü füzelerde uzmanlaşmış, müşterilerine işaretsiz aracılar üzerinden tedarik yapan gölgeli, devlet lisanslı bir ihracatçı."
 GENERIC_north_plains_heavy_industries_desc:0 "Kaliteden çok yüksek hacimli üretim için optimize edilmiş, piyade silahlarını büyük ölçekte üreten, Sovyet mirası geniş bir tesis."
 GENERIC_sentinel_grid_networks_desc:0 "Entegre komuta altyapısından yoksun ordulara öldürme zinciri kısaltma çözümleri sunan bir sinyalleşme ve K2 müteahhidi."
 GENERIC_brunn_heavy_engineering_werke_desc:0 "Habsburg dönemi köklerine sahip, lisanslı ve özgün topçu sistemleri üreten bir Orta Avrupa mühendislik evi."
 GENERIC_reichswerke_konstrukt_dynamik_desc:0 "Paletli topçu ve ana muharebe tankı platformlarını kapsayan çift hatlı bir Orta Avrupa silah geliştiricisi."
 GENERIC_vector_defense_labs_desc:0 "Dolar başına önleme oranının gösterişli çözümlerden üstün olduğu doktrinine dayanan, maliyet odaklı bir füze savunma entegratörü."
 GENERIC_marshall_tractor_works_desc:0 "Hacmi ve onarılabilirliği vurgulayan, miras kalan Sovyet üretim metodolojisiyle çalışan bir tank fabrikası topluluğu."
 GENERIC_vanderlind_hartwell_systems_desc:0 "Büyük ölçekte zırhlı araç ve ZMA programlarını güvence altına almak için siyasi bağlantılarını kullanan bir Washington ana müteahhidi."
 GENERIC_mil_kamov_rotorworks_desc:0 "Sovyet taarruz ve nakliye helikopteri tasarımına dayanan, sofistikasyondan çok dayanıklılığıyla tanınan bir döner kanatlı dairesi."
 GENERIC_helitech_avionique_desc:0 "Yüksek kaliteli elektroniği pahalıya sunan, küçük ölçekli bir İngiliz-İtalyan aviyonik ve helikopter entegrasyon firması."
 GENERIC_aurora_aerodynamics_corporation_desc:0 "Seçkin savunma müşterileri için en son teknoloji avcı ve çok rollü uçaklar üreten gizli bir ar-ge atölyesi."
 GENERIC_societe_europeenne_daerostructures_desc:0 "Büyük uçak yapıları, nakliye platformları ve deniz devriye uçaklarında uzmanlaşmış, pan-Avrupa iş paylaşımı konsorsiyumu."
 GENERIC_southwestern_aerospace_dynamics_bureau_desc:0 "Sıkı hükümet gözetimi altında çok rollü ve stratejik hava platformları üreten, müdürlük yönetimli bir daire."
 GENERIC_skyforge_autonomous_systems_desc:0 "Özerk saldırı dronu geliştirmeye hızlı hareket eden girişim kültürünü uygulayan, Silikon Vadisi'ne yakın bir firma."
 GENERIC_compagnie_aeronatique_darmement_desc:0 "Avcı uçakları, deniz uçakları ve güdümlü füzeler için platformlar arası mühimmat standartları sunan, Fransız mirasına sahip bir silah evi."
 GENERIC_whitehall_strategic_solutions_desc:0 "Küçük muharebe gemileri, özellikle korvet ve devriye botları inşa eden, amirallik danışmanlığından dönüşme küçük bir firma."
 GENERIC_triton_maritime_defense_group_desc:0 "Birçok ortak ülkede muhrip ve fırkateyn üreten çok uluslu bir tersane ağı."
 GENERIC_eastern_maritime_shipbuilding_group_desc:0 "Sıkıştırılmış takvimlerde kruvazör ve uçak gemisi üreten, üç vardiya kesintisiz çalışan bir tersane."
 GENERIC_sevmorprom_submarine_yards_desc:0 "Soğuk su çalışma derinliklerinde ve ihracat sınıfı saldırı ve füze platformlarında uzmanlaşmış kuzey Rusya denizaltı tersanesi."
 GENERIC_halland_civic_engineering_group_desc:0 "Sivil altyapı ile askerî tedarik zincirlerini kapsayan çift kullanımlı lojistik uzmanlığına sahip bir İskandinav sanayi holdingi."
 GENERIC_second_academy_missile_bureau_desc:0 "Sıkı bilmesi gereken kadar bilir protokolleriyle çalışan, bölümlere ayrılmış bir balistik ve seyir füzesi araştırma dairesi."
 GENERIC_western_orbital_systems_bureau_desc:0 "Yeni nesil taşıyıcı araçlara ve uzay alanı farkındalığına odaklanan bir yörünge ve stratejik sistemler dairesi."
 GENERIC_central_heavy_atomics_power_desc:0 "Sivil reaktör uzmanlığını deniz balistik füzesi geliştirmeyle birleştiren nükleer tahrik ve silah programı."
