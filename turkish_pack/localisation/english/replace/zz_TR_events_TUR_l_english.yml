 TurkeyF.237.title:0 "Israil Teslimiyet Istiyor!"
 TurkeyF.237.desc:0 "İsrail, gelecekteki hâkimiyet için ülke yönetiminin loncalara devredilmesini önerdi. Bu karanlık teklife nasıl yanıt verelim? Kabul mü, ret mi?"
 TurkeyF.237.a:0 "Yeni Bir Başlangıca İhtiyacımız Var"
 TurkeyF.237.b:0 "Bu Karanlık Oyunları Oynayalım"
 TurkeyF.238.title:0 "Iran Bölgesel Savunmamiza Saldirdi!"
 TurkeyF.238.desc:0 "İran ile Türkiye arasındaki kaynayan gerginlik sonunda patlama noktasına ulaştı. Küstah bir hamleyle İran, Türkiye'nin bölgesel savunmasına sürpriz bir saldırı başlattı ve çatışmayı kritik bir seviyeye taşıdı. Toprak bütünlüğü ve millî güvenliği doğrudan tehdit altında olan Türkiye kritik bir anla karşı karşıya. Kriz derinleşirken Türkiye bu saldırganlığa nasıl karşılık vereceğine karar vermeli."
 TurkeyF.238.a:0 "Bu Kabul Edilemez!"
 TurkeyF.239.title:0 "...Evanjelizm"
