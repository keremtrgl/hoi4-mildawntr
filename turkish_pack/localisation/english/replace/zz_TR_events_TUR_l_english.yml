 TurkeyO.2.title:0 "Iç Savas Zaferi"
 TurkeyO.2.desc:0 "Ülkede kamu düzeni tamamen sağlandı. Bu zaferle önümüzde hiçbir engel olmadan devleti kurma yolunda ilerleyebiliriz."
 TurkeyO.2.a:0 "Diğer Gruplar Tamamen Temizlendi"
 TurkeyU.1.title:0 "Ülkücü Isyan Patlak Verdi"
 TurkeyU.1.desc:0 "Sokaklardaki milliyetçiler artık silahlarıyla topyekûn bir savaş başlattı. Bu çatışmalar sonucunda ülke bölündü ve iç savaş denen durum ortaya çıktı. Artık ülkemiz tamamen muhalefetsiz ve komünist. Kızıl muhafızlar, ayağa kalkın ve bu isyanı bastırın!"
