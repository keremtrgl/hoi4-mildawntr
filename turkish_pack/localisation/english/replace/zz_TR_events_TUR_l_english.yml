 TurkeyCo.5.title:0 "TKP-ÖDP-EMEP Isyani Basladi"
 TurkeyCo.5.desc:0 "Sokaklar insanlarla doluyor. Göstericilerin bir kısmı silahlı, bir kısmı silahsız. Polis kalabalığı durdurmaya çalıştı ama başaramadı; silahlı örgütler komünistlere teçhizat sağlıyor. Buna karşı milliyetçi gruplar hükümetle birlikte silahlanmaya başladı ve bölgeye askerî birlikler sevk edildi. Göstericilere yönelik şiddet arttıkça direniş de arttı ve sonunda isyancılar batıdaki bölgeleri ele geçirerek kendi rejimlerini kurdu. Türkiye ikiye bölündü ve iç savaş çıktı."
 TurkeyCo.5.a:0 "Yaşasın Yüce Rejim"
 TurkeyCo.6.title:0 "Komünist Kongre"
 TurkeyCo.6.desc:0 "Savaşın sona ermesinin ardından ilk olağanüstü kongre yapıldı. Kongre iktidara gelecek partiyi belirleyecek. Bu parti hangisi olmalı? Seçim sizin."
 TurkeyCo.6.a:0 "Liderlik için doğru karar ÖDP!"
 TurkeyCo.6.b:0 "Liderlik için doğru karar EMEP!"
 TurkeyCo.6.c:0 "Gerçek lider ruhu Perinçek'te!"
 TurkeyCo.6.d:0 "TKP Rejimini Kur"
 TurkeyCo.7.title:0 "Büyük Türk Devrimi"
 TurkeyCo.7.desc:0 "Halkların ordusu birleşerek emperyalist düzeni bir kez daha yıktı. Zafere ulaştık! Yoldaşlar, artık yeni düzenle halklar mutlu ve adil bir şekilde yaşayacak."
 TurkeyCo.7.a:0 "Zafer!"
 TurkeyCo.8.title:0 "5. ÖDP Kongresi"
 TurkeyCo.8.desc:0 "5. ÖDP Kongresi yapıldı. Kongre iktidardaki ÖDP'yi daha da güçlendirdi."
 TurkeyCo.8.a:0 "ÖDP İçin Güzel"
 TurkeyAl.1.title:0 "Dünya Hesaplamalari"
 TurkeyAl.1.desc:0 "Dünyanın saçma yerlere evrilmesini önlemek için zamanı geldiğinde müdahalelerle savaşlar yürütülecek."
 TurkeyAl.1.a:0 "Panama'da Hallolur"
