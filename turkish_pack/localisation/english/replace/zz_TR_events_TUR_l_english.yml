 TurkeyF.83.title:0 "Ilk Mafya Konseyi Toplantisi Yapildi"
 TurkeyF.83.desc:0 "Beklendiği gibi tüm mafyalar bir araya gelerek ortak bir karar imzaladı. Alınan kararlara göre hükümet artık işlevsiz ve ülkenin yönetimini mafyalar kontrol etmeli. Mafyaların artık iktidarı ele geçirmek için silahlanıp örgütlenmesi bekleniyor. Mafya kontrolü ve müdahalesi yaklaşıyor."
 TurkeyF.83.a:0 "Kararlar Alındı"
 TurkeyF.84.title:0 "Mafyalar Rejimi Ele Geçirdi"
 TurkeyF.84.desc:0 "Hazırlıklarını tamamlayan mafyalar, kendi silahlı güçleri ve bilişim ağlarına düzenledikleri saldırıyla hükümeti hızla devirdi. Basın ve yargı organlarının tamamı şokta. Ülkede şu an tam anlamıyla bir belirsizlik havası var. Ordudan da herhangi bir tepki gelmiyor. Bu ülkenin nereye gittiğini zaman gösterecek."
 TurkeyF.84.a:0 "Sivil Hükümet Bitti"
 TurkeyF.87.title:0 "ABD Baskanina Suikast"
 TurkeyF.87.desc:0 "ABD Başkanı dün gece geç saatlerde suikast sonucu öldürüldü. Bu suikastla ABD tüm gücüyle bize saldıracak ve bu intikam hırsıyla kendini yıpratacak. Artık ABD'yi işgal etmemiz daha da kolaylaştı."
 TurkeyF.87.a:0 "İyi gidiyoruz, böyle devam!"
 TurkeyF.88.title:0 "Avrupa'daki Dinî Cemaatler Saldiri Altinda!"
 TurkeyF.88.desc:0 "Mafya sokaklarda dindar insanları bulup vurmaya başladı. Bu durum Avrupa'da huzursuzluğu ve iç ayaklanmaları artırıyor. Bu mafyalar kadar alçak bir yapı yok."
 TurkeyF.88.a:0 "Ah! Lanet Mafyalar!"
 TurkeyF.89.title:0 "Avrupa Kaos Içinde!"
 TurkeyF.89.desc:0 "Avrupa şu an kaos içinde. Bu mafyalar Avrupa'daki düzeni ve gelenekleri altüst etti. Bu mafyalar yok edilmeli. Aksi takdirde Avrupa kaos ortamında mafyalara karşı bu savaşı kaybedecek."
 TurkeyF.89.a:0 "İşler Çığırından Çıkıyor"
 TurkeyF.90.title:0 "ABD Kaos Içinde!"
 TurkeyF.90.desc:0 "Amerika Birleşik Devletleri şu an kaos içinde. Bu mafyalar ABD'ye özgü düzeni ve gelenekleri altüst etti. Bu mafyalar yok edilmeli. Aksi takdirde ABD kaos ortamında mafyalara karşı bu savaşı kaybedecek."
 TurkeyF.90.a:0 "İşler Çığırından Çıkıyor"
 TurkeyF.91.title:0 "Mafya Lideri Meselesi"
 TurkeyF.91.desc:0 "Mafya konseyi iktidarı ele geçirdikten sonra bir mafya lideri seçilmesi için önerge sundu. Bu önergeyle dolaylı olarak bir mafya lideri seçebiliriz ya da önergeyi görmezden gelip ana konseyle devam edebiliriz."
 TurkeyF.91.a:0 "Sedat Peker'i Liderliğe Getir"
 TurkeyF.91.b:0 "Kürt İdris'i Liderliğe Getir"
 TurkeyF.91.c:0 "Alaattin Çakıcı'yı Liderliğe Getir"
 TurkeyF.91.d:0 "Ana Konseyle Devam Edelim"
 TurkeyF.92.title:0 "MHP ile Anlasmalar"
 TurkeyF.92.desc:0 "MHP ile tam bir anlaşmaya varıldı. MHP, AK Parti içindeki değişim rüzgârını destekleyecek ve Abdullah Gül'ün Recep Tayyip Erdoğan'ın yerine geçmesini sağlayacak. Yaşasın Reform Rüzgârları!"
 TurkeyF.92.a:0 "Zafere Bir Adım"
 TurkeyF.93.title:0 "CHP ile Anlasmalar"
 TurkeyF.93.desc:0 "CHP ile tam bir anlaşmaya varıldı. CHP, AK Parti içindeki değişim rüzgârını destekleyecek ve Abdullah Gül'ün Recep Tayyip Erdoğan'ın yerine geçmesini sağlayacak. Yaşasın Reform Rüzgârları!"
 TurkeyF.93.a:0 "Zafere Bir Adım"
 TurkeyF.94.title:0 "AK Parti Olaganüstü Kurultay Çagrisi Yapti"
 TurkeyF.94.desc:0 "AK Parti delegeleri parti için olağanüstü kurultay çağrısında bulundu. Çağrı delegelerin çoğunluğunun oyuyla kabul edildi. AK Parti'nin genel başkanı bir sonraki kurultayda netlik kazanacak. AK Parti içindeki reform rüzgârları hızlanmaya başladı."
 TurkeyF.94.a:0 "Büyük Bir Gelişmenin Başlangıcı"
 TurkeyF.95.title:0 "Gül Yönetimi Iktidara Geldi"
 TurkeyF.95.desc:0 "Abdullah Gül ve liberal ekibi kurultayda olağanüstü bir başarı elde ederek genel başkanlığı Recep Tayyip Erdoğan'dan aldı. Ardından Abdullah Gül ve ekibi yeni hükümeti açıklamak için hazırlıklara başladı."
 TurkeyF.95.a:0 "Ne Akıllıca Bir Sonuç"
 TurkeyF.96.title:0 "Sendikalarla Görüsmeler"
 TurkeyF.96.desc:0 "Sendika liderleriyle bir toplantı düzenledik. Toplantıda işçi sınıfının talepleri gibi konular ele alındı. Talepleri doğrultusunda hükümetimiz tarafından "Emek Paketi" açıklanacak."
 TurkeyF.96.a:0 "Bir Görev Tamamlandı"
 TurkeyF.97.title:0 "Partilerle Görüsmeler"
 TurkeyF.97.desc:0 "Parti liderleriyle bir toplantı yaptık. Toplantıda bürokrasinin yenilenmesi gibi konular ele alındı. Talepleri doğrultusunda hükümetimiz tarafından "Bürokratik Yenilenme Bildirgesi" açıklanacak."
 TurkeyF.97.a:0 "Bir Görev Tamamlandı"
 TurkeyF.98.title:0 "Barzani ile Görüsmeler"
 TurkeyF.98.desc:0 "Barzani ile yapılan müzakereler sonucunda ortak bir çözüme ulaştık. İki taraf PKK'ya karşı birbirini destekleyecek, Türkiye de Kürtlere daha fazla hak tanıyacak."
 TurkeyF.98.a:0 "Güzel Bir Barış Çözümü"
 TurkeyF.99.title:0 "Agustos Protestolari"
 TurkeyF.99.desc:0 "Liberal iktidarın giderek otoriterleşmesi ve ilkelerini kaybetmesi son dönemde AK Parti'nin oy kaybetmesine yol açmıştı. Ağustos'ta hükümetin çok sayıda gözaltı kararı çıkarması üzerine sivil itaatsizlik patlak verdi. Protestolar şehirleri sardı. Polis protestoları şiddetle dağıtmaya çalışınca protestolar şiddete dönüştü. Sokaklarda molotofkokteylleri atıldı. Polis buna biber gazı bombalarıyla karşılık verdi. Medya ise adeta hükümete karşı protestoya geçti. Meclis'te muhalefet sert konuşmalar yaptı ve Abdullah Gül'ün istifası istendi. Yönetimin hızla netlik kazanması gerekiyor. Öfkenin önüne geçilmeli ve huzur sağlanmalı."
 TurkeyF.99.a:0 "İsyanları Bastırın!"
 TurkeyF.100.title:0 "Agustos Protestolari Yatismaya Basladi"
 TurkeyF.100.desc:0 "İşler yatışmaya başladı. Protestolar durulmaya yüz tuttu. AK Parti, protestoların ve bilançonun suçlusu olarak gösterilmeye çalışılıyor. Bu durumdan hızla sıyrıldık."
 TurkeyF.100.a:0 "Bunu Görmek Güzel"
 TurkeyF.101.title:0 "Askerî Darbe Girisimi Basarisiz Oldu"
 TurkeyF.101.desc:0 "Gülen Hareketi'nin Türk Silahlı Kuvvetleri içindeki etkisinin artması ve tankların kontrolünü ele geçirmesiyle Gülen hareketi devleti devirmek için silahlarla sokağa çıktı. Tanklar Genelkurmay'ı ve güvenlik üslerini kuşattı. Halk buna karşı çıkmak için sokaklara döküldü ve tankların üzerine çıktı. Gülen Hareketi'nin darbe girişimi sabaha karşı başarısız oldu. AK Parti Sözcüsü Ömer Çelik, sözde "Yurtta Sulh Konseyi"nin başarısız olduğunu ve çökertildiğini açıkladı."
 TurkeyF.101.a:0 "AKP İçin Kesin Zafer!"
 TurkeyF.102.title:0 "Avrupa-ABD Krizi"
 TurkeyF.102.desc:0 "Türkiye'nin ABD ile yaşadığı gerginlik nedeniyle Avrupa Birliği ile Amerika arasında bir kriz çıktı. Krizin ortaya çıkmasıyla dolar ve avroda sert düşüşler görülüyor. Bu krizi Avrupa Birliği ile birlikte aşarak Amerika Birleşik Devletleri'nin süper güç statüsünü elinden alacağız."
 TurkeyF.102.a:0 "Bundan Vazgeçemeyiz"
 TurkeyF.103.title:0 "Ticarette Dolardan Vazgeçmek mi?"
 TurkeyF.103.desc:0 "Efendim, ticarette ve ekonomide doları kullanmayı bırakalım mı? Bunu kabul edersek doların düşmesine neden olacağız."
 TurkeyF.103.a:0 "Dolardan Vazgeç"
 TurkeyF.103.b:0 "Dolarla Devam Et"
 TurkeyF.104.title:0 "Avrupa Ordusu Fikri mi?"
 TurkeyF.104.desc:0 "Avrupa Birliği ordusunun kurulmasına ilişkin düşünceler son dönemde giderek artıyor. Efendim, Avrupa Birliği ordusunun kurulması için nasıl oy kullanalım? Avrupa Birliği ordusu kurulursa NATO gibi bir birliğe ihtiyacımız kalmayacak."
 TurkeyF.104.a:0 "Avrupa Ordusu Kurulmalı"
 TurkeyF.104.b:0 "Saçmalık"
 TurkeyF.105.title:0 "Avrupa'da Askerî Hizmetin Genisletilmesi mi?"
 TurkeyF.105.desc:0 "Son dönemde Avrupa Birliği ülkelerinin kendi ordularının gücünü artırması büyük ölçüde talep görüyor. Efendim, bu duruma nasıl bir yanıt verelim? Kendi ordumuzun gücünü artıralım mı, yoksa bunu ekonomik bir hata sayıp geliştirmeyelim mi?"
 TurkeyF.105.a:0 "Ordunun Her Sektörde Çok Önemli Bir Rolü Var"
 TurkeyF.105.b:0 "Ordu Sadece Ekonomik Bir Yük"
 TurkeyF.106.title:0 "Avrupa Komuta Birligine Ulasmak mi?"
 TurkeyF.106.desc:0 "Son dönemde Avrupa Birliği'nin komuta birliğinin sağlanması büyük ölçüde talep görüyor. Efendim, bu soruya nasıl yanıt verelim? Komuta birliğine katılalım mı katılmayalım mı?"
 TurkeyF.106.a:0 "Evet, Elbette"
 TurkeyF.106.b:0 "Hayır, Komuta Birliği Gereksiz"
 TurkeyF.107.title:0 "Avrupa'nin Askerî Müdahaleciligini Artirmak mi?"
 TurkeyF.107.desc:0 "Son dönemde Avrupa Birliği'nin demokrasi adı altında başka ülkelere müdahale etmesi büyük ölçüde talep görüyor. Efendim, bu soruya nasıl yanıt verelim? Müdahaleye destek verelim mi?"
 TurkeyF.107.a:0 "Yapın"
 TurkeyF.107.b:0 "Demokrasinin Kurallarına İnanıyoruz"
 TurkeyF.108.title:0 "Greta ile Görüsmeler"
 TurkeyF.108.desc:0 "Greta ile yapılan görüşmelere göre ekolojik tutumumuz oldukça iyi. Bu sayede artık Ekolojik Emperyalizm uygulamasına geçebiliriz."
 TurkeyF.108.a:0 "Bir Başarı Daha"
 TurkeyF.109.title:0 "Ergenekon Davalari"
 TurkeyF.109.desc:0 "Ergenekon davaları, 2008-2016 yılları arasında Türkiye'de görülen ve askerler, gazeteciler ve muhalefet milletvekilleri dahil olmak üzere laik olduğundan şüphelenilen gizli bir örgüt olan Ergenekon'un üyesi oldukları iddia edilen 275 kişinin Türk hükümetine karşı komplo kurmakla suçlandığı bir dizi yüksek profilli davadır. Davalar sanıkların çoğunluğu için uzun hapis cezalarıyla sonuçlandı."
 TurkeyF.109.a:0 "Kemalizm Silahlı Kuvvetlerde Yaşamamalı"
 TurkeyF.110.title:0 "IBDA-C Geçici Hükümeti Devirdi"
 TurkeyF.110.desc:0 "İBDA-C'nin silahlı güçleri dün akşam sokaklarda mevzilendi ve denetim kurullarına el koydu. Böylece geçici hükümet düştü. Ayrıca halkın genel olarak İBDA-C'yi desteklemesi nedeniyle İBDA-C darbesine karşı herhangi bir hareket ortaya çıkmadı."
 TurkeyF.110.a:0 "Millet İçin Yeni Bir İslam Çağı Doğuyor!"
 TurkeyF.111.title:0 "Yeni Halife Seçimi"
 TurkeyF.111.desc:0 "Müslüman ülkelerden delegeler bir araya geldi ve ilk halife seçimi yapıldı. Seçim sayesinde İslam birliği sağlandı. Bu yeni hilafet dönemi tüm Müslüman ülkelere hayırlı olsun."
 TurkeyF.111.a:0 "Halife Olmaya Layık Kişi Ebu Hanzala"
 TurkeyF.111.b:0 "Halife Olmaya Layık Kişi Salih Mirzabeyoğlu"
 TurkeyF.112.title:0 "Islam Devleti Bizi Göç Dalgalariyla Tehdit Ediyor"
 TurkeyF.112.desc:0 "İslam Devleti bizi açıkça tehdit ediyor. Ya onlarla savaşmayıp kenarda duracağız ya da onlarla savaşıp bir göç dalgasına maruz kalacağız. Efendim, kararımız ne olmalı? Savaş mı, tarafsızlık mı?"
 TurkeyF.112.a:0 "Ne Düşünüyorlar?"
 TurkeyF.113.title:0 "Islami Birlesme Ültimatomu"
 TurkeyF.113.desc:0 "Ülkemiz cihatçı İslam devleti tarafından birleşmeye zorlanıyor. Çağrıya uymazsak İslam devleti bizi düşman ilan edecek ve gayrimüslimlerin safında sayılacağız; uyarsak davalarına katılıp gayrimüslimlere karşı cihat edeceğiz."
 TurkeyF.113.a:0 "İslam Davasına Katılmalıyız"
 TurkeyF.113.b:0 "Radikal İslamcılarla Müttefik Olmamalıyız"
 TurkeyF.114.title:0 "Emevîler Baris mi Teklif Ediyor?"
 TurkeyF.114.desc:0 "İslam-Hristiyan savaşı artık ilerlemeyeceği bir noktaya geldi. Bunun üzerine İslam tarafının başındaki yeni Emevî, bize bir barış teklifi gönderdi. Efendim, barış teklifini kabul edip bu dehşete son verelim mi?"
 TurkeyF.114.a:0 "Evet, Bu Barışa İhtiyacımız Var"
 TurkeyF.114.b:0 "Bu Savaş Sonuna Kadar Sürecek!"
 TurkeyF.115.title:0 "Geçici Hükümetin Yerini Osmanlilar Aldi"
 TurkeyF.115.desc:0 "Geçici hükümet bundan böyle Osmanlı yönetimine dönüştü. Bu, yeni Osmanlı çağının başlangıcı. Cihat ve gaza anlayışıyla yeni Osmanlı İmparatorluğu'nu büyütüp güçlendireceğiz."
 TurkeyF.115.a:0 "Yaşasın Yeni Osmanlı İmparatorluğu!"
 TurkeyF.116.title:0 "Cumhuriyetin Sonu"
 TurkeyF.116.desc:0 "Artık cumhuriyet yok. Artık bir imparatorluk ve iktidar var. Artık kendi yolumuzu ve planımızı yapabiliriz. Allah devlete zeval vermesin!"
 TurkeyF.116.a:0 "Bu Yeni Bir Başlangıç"
 TurkeyF.117.title:0 "Orhan Osmanoglu'nun Taç Giymesi"
 TurkeyF.117.desc:0 "Orhan Osmanoğlu, uzun süredir sahipsiz kalan tacın sahibi oldu. Yeni padişahımızın görevinde başarılı olmasını umuyoruz. Ayrıca monarşinin geri dönüşüyle ülke cumhuriyetten tamamen koptu."
 TurkeyF.117.a:0 "Bakalım Yeni Yönetim Nasıl Gidecek"
 TurkeyF.118.title:0 "Gülen Karsiti Fetvanin Ilani"
 TurkeyF.118.desc:0 "İslam ulemaları tarafından Gülen karşıtı fetva yayımlandı. Bu Gülen karşıtı fetva sayesinde bu iğrenç din tüccarı örgütten kurtulacağız."
 TurkeyF.118.a:0 "Güzel, Bu Gülencileri Yok Etme Vakti!"
 TurkeyF.119.title:0 "Islami Cihadin Ilani"
 TurkeyF.119.desc:0 "Osmanlı İslam uleması toplandı ve Müslümanları cihada çağırdı. Bu cihat çağrısıyla Müslümanların düşmanlarını rahatlıkla yeneceğiz."
 TurkeyF.119.a:0 "Son Darbeyi Vurma Vakti!"
 TurkeyF.120.title:0 "Osmanli Imparatorlugu Petrol-Ordu Anlasmasi Teklif Ediyor"
 TurkeyF.120.desc:0 "Osmanlı diplomatları Orta Doğu'nun mevcut durumunu çözmek için ülkemize bir petrol anlaşması teklif etti. Bu petrol anlaşmasını kabul edersek Orta Doğu'daki askerî gücümüzü azaltacağız, onlar da Orta Doğu'daki etkinliklerini artıracak; ama karşılığında bize varillerce petrol ve üsler verecekler. Anlaşmaya karşı çıkarsak korkarım Osmanlı İmparatorluğu ile savaşa girmek zorunda kalabiliriz."
 TurkeyF.120.a:0 "Anlaşma Kabul Edilebilir Görünüyor"
 TurkeyF.120.b:0 "Orta Doğu'da Hiçbir Taviz Verilemez"
 TurkeyF.121.title:0 "Amerika Petrol-Ordu Anlasmamizi Kabul Etti"
 TurkeyF.121.desc:0 "Amerika petrol anlaşmasını kabul etti. Orta Doğu'daki askerî güçlerini azaltacaklar, biz de Orta Doğu'daki etkinliğimizi artıracağız; ama karşılığında onlara varillerce petrol ve üsler vereceğiz."
 TurkeyF.121.a:0 "Bunu Duymak Güzel"
 TurkeyF.122.title:0 "Amerika Petrol-Ordu Anlasmamizi Reddetti"
 TurkeyF.122.desc:0 "Amerika petrol anlaşmasını reddetti. Orta Doğu'daki askerî güçlerini azaltmayacaklar; biz de Orta Doğu'daki etkinliğimizi artırmak için resmî ya da gayriresmî olarak Amerika'ya karşı savaşa gireceğiz."
 TurkeyF.122.a:0 "Korkunç Haber"
 TurkeyF.123.title:0 "Silahli Neonaziler Harekete Geçti"
 TurkeyF.123.desc:0 "Osmanlı ve diğer güçler tarafından silahlandırılan neonaziler sokakta silahlarıyla ateş açıyor. Onları derhâl durdurmak gerekiyor; önlenmezlerse iktidar yakında monarşistlerin ve faşistlerin eline geçecek."
 TurkeyF.123.a:0 "Bu Canavarları Tutuklayın!"
 TurkeyF.124.title:0 "Osmanlilardan Gelen Göç Dalgalari"
 TurkeyF.124.desc:0 "Osmanlı Devleti bize açıkça mülteci göndermeye başladı. Bu, ülkenin radikal kesiminin ayaklanmasına ve desteklerinin artmasına yol açacak. Bunu derhâl önlemeli ve sınırlarımızın kontrolünü ele almalıyız."
 TurkeyF.124.a:0 "Sınırlara Asker Gönderin!"
 TurkeyF.125.title:0 "Ülke Genelinde Istikrarsizlik Artiyor"
 TurkeyF.125.desc:0 "İç çatışmalar artık hükümeti istifaya ve istikrarsızlığa sürükledi. Mevcut yönetimimizin istifa edip çökmesi ve radikallerin eline geçmesi an meselesi. Güçlü olursak bu iç çatışmalardan ve iç oyunlardan sağlam bir şekilde çıkacağız."
 TurkeyF.125.a:0 "Off..."
 TurkeyF.126.title:0 "Osmanlilar Kirim Anlasmasi Teklif Ediyor"
 TurkeyF.126.desc:0 "Osmanlı Devleti Kırım'ın bağımsız bir devlet olmasını istiyor; karşılığında Ukrayna'ya karşı tavır alacaklar. Rus Hükümeti olarak bu teklife nasıl karşılık verelim?"
 TurkeyF.126.a:0 "Bu Anlaşma Şartları Kabul Edilebilir"
 TurkeyF.126.b:0 "Bu Anlaşma Şartları Kabul Edilemez"
 TurkeyF.127.title:0 "Rusya Osmanli Taleplerini Reddetti"
 TurkeyF.127.desc:0 "Rus Devleti teklifimizi saçma bularak reddettiğini açıkladı. Bu nedenle Karadeniz'deki barış meselesi çalkantılı bir hâl aldı."
 TurkeyF.127.a:0 "Hiç İyi Değil"
 TurkeyF.128.title:0 "Osmanlilar Koruma Talep Ediyor"
 TurkeyF.128.desc:0 "Osmanlı Devleti bizi Rusya'ya karşı koruması gerektiğine inanıyor. Bu yüzden bize bir koruma teklifi gönderdi. Bu teklifi kabul edersek Osmanlılar savunma amacıyla topraklarımıza girecek; kabul etmezsek silahlarıyla bize saldıracaklar."
 TurkeyF.128.a:0 "Türk Korumasına İhtiyacımız Var"
 TurkeyF.128.b:0 "Emperyalist Korumaya İhtiyacımız Yok"
 TurkeyF.129.title:0 "Gürcistan Türk Korumasini Reddetti"
 TurkeyF.129.desc:0 "Gürcistan Osmanlı'nın savunma teklifini reddetti. Bu durumda Osmanlılar Gürcistan'ı "korumak" için silah zoruyla ele geçirecek."
 TurkeyF.129.a:0 "O Zaman Gürcistan'a Silah Zoruyla Gireceğiz"
 TurkeyF.130.title:0 "Osmanlilar Müslüman Avrupa'yi Boyunduruk Altina Almak Istiyor"
 TurkeyF.130.desc:0 "Osmanlı İmparatorluğu, Avrupa'daki Müslüman devletlere kendisine katılmaları için ültimatom gönderiyor. Avrupa'da bulunan bir Müslüman devlet olarak biz de Osmanlı Devleti'ne karşı bir tavır almalıyız. Osmanlı safını tutarak Osmanlı İmparatorluğu'na mı katılalım, yoksa Osmanlı kuvvetlerine karşı savaş hazırlıklarına mı başlayalım?"
 TurkeyF.130.a:0 "Müslüman Bir Avrupa Milleti Olarak Osmanlılara Katılmalıyız"
 TurkeyF.130.b:0 "Biz Osmanlıların Kuklası Değiliz"
 TurkeyF.131.title:0 "Osmanlilar Almanya'ya Yeni Ittifak Devletleri Teklif Ediyor"
 TurkeyF.131.desc:0 "Osmanlı İmparatorluğu Almanya'yı yeniden ittifak kurmaya çağırıyor. Amaçları eski gelenekleri canlandırmak ve gücümüzü yeniden kazandırmak. Efendim, Osmanlı'nın talebine nasıl karşılık verelim?"
 TurkeyF.131.a:0 "Oldukça Güzel Bir Fikir"
 TurkeyF.131.b:0 "Geçmiş Geçmişte Kaldı"
 TurkeyF.132.title:0 "Almanya Talebimizi Reddetti"
 TurkeyF.132.desc:0 "Almanya teklifimizi reddederek mevcut durumda kalmayı tercih ediyor. Kaybeden onlar. Yurt dışında ilerlemeye devam etmeliyiz."
 TurkeyF.132.a:0 "Büyük Bir Hata Yaptılar"
 TurkeyF.133.title:0 "Avusturya Ittifak Devletlerine Katilmak Istiyor"
 TurkeyF.133.desc:0 "Avusturya, Osmanlı İmparatorluğu ile kurduğumuz ittifaka katılmak istiyor. Eski günlerimize dönmek için böyle bir teklifi kabul edebiliriz. Efendim, cevabımız ne olacak?"
 TurkeyF.133.a:0 "Elbette, Birlikte Daha Güçlüyüz"
 TurkeyF.133.b:0 "Avusturya Yeni Almanya'nın Düşmanıdır!"
 TurkeyF.134.title:0 "Almanya Avusturya'nin Talebini Reddetti"
 TurkeyF.134.desc:0 "Almanya ittifak teklifimizi reddetti. Kaybeden onlar. Oysa dünyaya birlikte geçirdiğimiz eski günleri hatırlatabilirdik."
 TurkeyF.134.a:0 "Peki"
 TurkeyF.135.title:0 "Osmanlilar Gelecekteki Sinirlar Için Anlasma Teklif Ediyor"
 TurkeyF.135.desc:0 "Görünüşe göre gelecekte Avusturya ile Osmanlılar arasında sınır anlaşmazlıkları çıkacak. Bu yüzden Avusturya'ya bir anlaşma teklif ediyoruz."
 TurkeyF.135.a:0 "Teklif Etkili Olur"
 TurkeyF.135.b:0 "Teklif Gereksiz Olur"
 TurkeyF.136.title:0 "Avusturya Sinir Anlasmasini Kabul Etti"
 TurkeyF.136.desc:0 "Viyana, İstanbul'un teklifini kabul ederek gelecekte ortaya çıkabilecek sınır anlaşmazlıklarının yaşanmayacağını, yaşanırsa da çözüleceğini açıkladı. Bu ülkemiz için çok iyi bir haber."
 TurkeyF.136.a:0 "İyi Haber"
 TurkeyF.137.title:0 "Avusturya Sinir Anlasmasini Reddetti"
 TurkeyF.137.desc:0 "Viyana, İstanbul'un teklifini reddederek şimdi ve gelecekte ortaya çıkabilecek sınır anlaşmazlıklarının çatışma yoluyla sonuçlandırılacağını açıkladı. Bu ülkemiz için oldukça kötü bir haber. Görünüşe göre Avusturya ile savaşmadan bu işten çıkamayacağız."
 TurkeyF.137.a:0 "Peki"
 TurkeyF.138.title:0 "MHP Türkiye Turunda"
 TurkeyF.138.desc:0 "MHP Türkiye turunu sürdürüyor. Turda ülkenin sorunlarına yönelik çözüm planları gibi pek çok şey yapıldı. Halkımız yükselen sağ partiden son derece memnun görünüyor."
 TurkeyF.138.a:0 "Mükemmel"
 TurkeyF.139.title:0 "Sag Cephenin Resmîlesmesi"
 TurkeyF.139.desc:0 "Sağ cephe kuruldu. Bu cephenin kuruluş nedeni, komünizmin ve solun yarattığı hainlere karşı mücadele. Bu sağ cephe, birlik içinde kalkınmamızın ve geleneklerimize dönüşümüzün aracı olacak."
 TurkeyF.139.a:0 "Birlikte Güçlüyüz"
 TurkeyF.140.title:0 "IIT'nin Güçlendirilmesi"
 TurkeyF.140.desc:0 "Cumhurbaşkanımız tüm Müslümanların birlik içinde olması gerektiğini söyledi ve İslam İşbirliği Teşkilatı'nın daha örgütlü bir yapıya kavuşması ve güçlendirilmesi için faaliyetlere geçtiğini duyurdu."
 TurkeyF.140.a:0 "Genel Görünüm İyi"
 TurkeyF.141.title:0 "Turanci Genisleme Planlamasi"
 TurkeyF.141.desc:0 "Artık Türklük adına genişleme politikalarına ışık tutarak ülkemizi Türklük çizgisinde güçlendirip büyütebiliriz. Bunun iyi sonuçlanacağına inanıyoruz."
 TurkeyF.141.a:0 "Nihal Atsız Yayılmacılık Konusunda Haklıydı!"
 TurkeyF.142.title:0 "Islami Genisleme Planlamasi"
 TurkeyF.142.desc:0 "Ülkemizi İslam'ı yayma adına genişleteceğiz. Bu genişlemeyle çevremizdeki bölgeler ve ele geçirdiklerimiz kalıcı olarak Müslüman olacak."
 TurkeyF.142.a:0 "Cihadın Gücü İçin!"
 TurkeyF.143.title:0 "Islam Isbirligi Teskilati Cephesinin Kurulusu"
 TurkeyF.143.desc:0 "İslam İşbirliği Teşkilatı birleşik bir cepheye dönüşüyor. Bu birliğin cephe olarak oluşmasıyla çok daha güçlü bir devlet olacağız ve düşmanlarımızın bölgemize girmesini engelleyeceğiz."
 TurkeyF.143.a:0 "Yeni Bir Gücün Yükselme Vakti!"
 TurkeyF.144.title:0 "Türk Birligi Ülkeleriyle Görüsmeler"
 TurkeyF.144.desc:0 "Türk Birliği'ni İslam İşbirliği Teşkilatı'na yakınlaştırmak için bir düzine özel müzakere yapıldı. Bu müzakereler gelecekte büyük bir birliğin oluşmasını sağlayacak."
 TurkeyF.144.a:0 "Kulağa İyi Geliyor"
 TurkeyF.145.title:0 "Islam Ülkeleriyle Görüsmeler"
 TurkeyF.145.desc:0 "İslam İşbirliği Teşkilatı'nı Türk Birliği'ne yakınlaştırmak için bir düzine özel müzakere yapıldı. Bu müzakereler gelecekte büyük bir birliğin oluşmasını sağlayacak."
 TurkeyF.145.a:0 "Kulağa İyi Geliyor"
 TurkeyF.146.title:0 "Türkiye Bizi Iran'in Isgaline Davet Ediyor"
 TurkeyF.146.desc:0 "Türkiye bizi İran'la savaşa davet ediyor. Bu savaşa katılırsak iyi kazanımlar elde edebilir ve Türk Birliği'ne katkıda bulunabiliriz."
 TurkeyF.146.a:0 "Şu İranlıların İşini Bitirelim"
 TurkeyF.146.b:0 "Risk Almamıza Gerek Yok"
 TurkeyF.147.title:0 "Türkmenistan Davetimizi Reddetti"
 TurkeyF.147.desc:0 "Türkmenistan savaşa girmeyeceğini ve tarafsız konumunu korumaya devam edeceğini açıkladı. Bu tarafsızlık bildirisi Türk Birliği'ni kesinlikle kötü etkileyecek."
 TurkeyF.147.a:0 "Pekâlâ"
 TurkeyF.148.title:0 "Islam Isbirligi Teskilati Bir Ittifaka Dönüstü"
 TurkeyF.148.desc:0 "İslam İşbirliği Teşkilatı artık bir ittifak yapısına büründü. Bu işbirliğinin devam etmesi herkesi kesinlikle mutlu edecek. Artık NATO'ya ve diğer ittifaklara karşı bir güç merkeziyiz."
 TurkeyF.148.a:0 "Buna Mükemmellik Denir!"
 TurkeyF.148.b:0 "Bu Teşkilattan Derhâl Ayrılın"
 TurkeyF.149.title:0 "Halkimiz Dogu-Bati Esitsizligine Öfkeli"
 TurkeyF.149.desc:0 "Halkımız kendine soruyor: Neden Batı Avrupa'dan daha az gelişmiş bir seviyedeyiz? Çünkü Avrupa Birliği ve demokrasi yalnızca Batı'ya hizmet etmek için var, diye cevap veriyor halk. Halkımızın görüşleri artan bir ideolojik seferberlik olarak gözlemleniyor."
 TurkeyF.149.a:0 "İç Karartıcı Görünüyor"
 TurkeyF.150.title:0 "Milliyetçiler Degisim Istiyor"
 TurkeyF.150.desc:0 "Avrupa'daki milliyetçiler huzursuz; mevcut durumu kabul etmiyor, mevcut sistemi istemiyorlar. Bu bir kriz! Bunun çıkış yolunu bulmalıyız!"
 TurkeyF.150.a:0 "Onların İstediği Bu"
 TurkeyF.151.title:0 "Balkan Milliyetçileri Avrupa Birligi'ne Karsi Çikmaya Basladi"
 TurkeyF.151.desc:0 "Balkanlardaki klasik milliyetçiler Avrupa Birliği'ne ve benzeri uluslararası örgütlere karşı çıkıyor. Balkan siyasetçileri, kaynağı belirsiz bir finansmanla birlikte değişime inanıyor."
 TurkeyF.151.a:0 "Milliyetçilik Yaşıyor..."
 TurkeyF.152.title:0 "Neonaziler Devletin Etkisizliginden Bikti"
 TurkeyF.152.desc:0 "Almanya'nın zayıflığından ve güçsüzlüğünden bıkan neonaziler artık sokaklarda protesto ve gösteri yapıyor. Ülkedeki gerginlik ve huzursuzluk hızla artıyor."
 TurkeyF.152.a:0 "Bu Faşistlerle Başa Çıkmalıyız!"
 TurkeyF.153.title:0 "Türk-Islam Devletleri Arasinda Görüsmeler"
 TurkeyF.153.desc:0 "Türk Birliği ile İslam İşbirliği devletleri bir araya geldi. Görüşmelerde ortak noktalar ve çatışan yönler ele alındı. Bu müzakereler gelecekte İslam İşbirliği ile Türk Birliği'nin birleşmesini sağlayabilir."
 TurkeyF.153.a:0 "Böyle Devam!"
 TurkeyF.154.title:0 "Türk Birligi'nin Islamlastirilmasi"
 TurkeyF.154.desc:0 "Türk Birliği'ni İslamlaştırma girişimleri gün yüzüne çıktı. Türk Birliği olarak bu İslamlaştırma politikasına maruz kalıyoruz."
 TurkeyF.154.a:0 "Radikal Bir Hareket"
 TurkeyF.155.title:0 "Iki Gücün Birlesmesi"
 TurkeyF.155.desc:0 "Türk Birliği ile İslam İşbirliği Teşkilatı arasındaki başarılı görüşmeler sonucunda birleşme aşamasına gelindi. Bu durumda birleşme aşamasından çekilelim mi, yoksa tek bir birlik olma yönünde tavır mı alalım?"
 TurkeyF.155.a:0 "Yaşasın!"
 TurkeyF.155.b:0 "Birleşme Korkunç Görünüyor!"
 TurkeyF.156.title:0 "Türkiye Almanya'daki Türklerin Arkasinda"
 TurkeyF.156.desc:0 "Almanya'da çok sayıda Türk yaşıyor. Türkiye buradaki Türklerini korumakta kararlı. Türkiye'nin buradaki Türkleri desteklemesi onların itibarını artıracak."
 TurkeyF.156.a:0 "Dehşet Verici!"
 TurkeyF.157.title:0 "Türkiye Fransa'daki Türklerin Almanya'ya Göçünü Destekliyor"
 TurkeyF.157.desc:0 "Türkiye, Fransa'daki Türklerin Almanya'ya göç etmesini destekleyecek. Ancak Almanya'daki Türk nüfusu arttıkça Almanya bir Türk devletine dönüşecek. Fransa olarak harekete geçmeliyiz."
 TurkeyF.157.a:0 "Zavallı Almanlar..."
 TurkeyF.158.title:0 "Türkiye Fransa'daki Türklerin Arkasinda"
 TurkeyF.158.desc:0 "Fransa'da azımsanmayacak sayıda Türk yaşıyor. Türkiye buradaki Türklerini korumakta kararlı. Türkiye'nin buradaki Türkleri desteklemesi onların itibarını artıracak."
 TurkeyF.158.a:0 "Dehşet Verici!"
 TurkeyF.160.title:0 "Türk Birligi'nin Hizli Birlesmesi"
 TurkeyF.160.desc:0 "Türk Birliği kısa sürede birleşme sürecine sokuldu. Bu duruma bu kadar kısa sürede ulaşılmasının başlıca nedeni elbette milliyetçilerin etkinliği."
 TurkeyF.160.a:0 "Başardık!"
 TurkeyF.163.title:0 "ABD'de Ekoloji Çagrisi"
 TurkeyF.163.desc:0 "Amerikan halkı ülkemizin doğa dostu olmadığını söylüyor. Biz doğa dostu değilsek kim doğa dostu? İndirin o palyaçoları!"
 TurkeyF.163.a:0 "Defedin Onları!"
 TurkeyF.164.title:0 "Çin'de Ekoloji Çagrisi"
 TurkeyF.164.desc:0 "Çin halkı ülkemizin doğa dostu olmadığını söylüyor. Biz doğa dostu değilsek kim doğa dostu? İndirin o palyaçoları!"
 TurkeyF.164.a:0 "Defedin Onları!"
 TurkeyF.165.title:0 "Yesil Anarsistler BM'nin Liderligini Ele Geçirdi"
 TurkeyF.165.desc:0 "Yeşil anarşistler Birleşmiş Milletler'in liderleri oldu. Bu ilginç bir durum. Görünüşe göre çevreci baskılar artacak."
 TurkeyF.165.a:0 "Güvenli Bir Dünya İçin"
 TurkeyF.166.title:0 "Greta'ya Davet"
 TurkeyF.166.desc:0 "Greta'yı ülkemize davet ederek bu iklim projelerini yönetmesini sağladık. Greta gibi yeşilleri destekleyen birinin başarılarımızı artırması gayet doğal."
 TurkeyF.166.a:0 "Ekolojiyi Kurtarma Vakti!"
 TurkeyF.167.title:0 "Avrupa Ateskesi"
 TurkeyF.167.desc:0 "Anarşistler Avrupa Birliği ile ateşkes istiyor. Bu ateşkes konusunda nasıl karar vereceğimizi belirleyeceğiz. Kabul edelim mi? Yoksa ateşkese karşı hareket etmeyi sürdürecekler mi?"
 TurkeyF.167.a:0 "Kulağa İyi Geliyor"
 TurkeyF.167.b:0 "Kötü Görünüyor"
 TurkeyF.168.title:0 "Iklim Toplantilari"
 TurkeyF.168.desc:0 "İklim toplantıları yapıldı. Bu iklim toplantısında fabrikalar ve kömür kullanımı iklimi bozan etkenler olarak ele alındı. Bu toplantı gelecekteki iklim politikalarını sertleştirecek türden olacak."
 TurkeyF.168.a:0 "İklim Korunmalı"
 TurkeyF.169.title:0 "Anarsistler Bizi AB'nin Birlesmesine Çagiriyor"
 TurkeyF.169.desc:0 "Anarşistler bizi birleşik bir Avrupa Birliği kurmaya zorluyor. Avrupa Birliği yolunda hızla mı ilerleyelim, yoksa yavaş yavaş devam mı edelim?"
 TurkeyF.169.a:0 "Evet, Buna İhtiyacımız Var"
 TurkeyF.169.b:0 "Sadece Gereksiz"
 TurkeyF.170.title:0 "Ekolojist AB Vizyonu"
 TurkeyF.170.desc:0 "Artık ekolojik bir Avrupa için hazırlanıyoruz. Bu vizyonla havuçlarımızı, ağaçlarımızı, kısacası doğamızı kurtaracağız. Bu kurtarma operasyonu dünyaya ders olacak."
 TurkeyF.170.a:0 "Çocuklarımız İçin Daha İyi Bir Ekoloji"
 TurkeyF.171.title:0 "Genel Komünist Askerî Kongresi"
 TurkeyF.171.desc:0 "Ülkedeki hükümet üyeleri sürgüne gönderildi. İktidar tamamen komünistlerin eline geçti. Ülke komünistlerin eline geçtikten sonra komünist partiler arasında ayrışma yaşanmaya başladı. Fark, Türkiye'yi hangi komünist partinin yöneteceğiydi. TKP liderleri gerçek komünistlerin kendileri olduğunu, ÖDP liderleri halkçı olduklarını, EMEP liderleri gerçek devrimi yapacakların kendileri olduğunu, VATAN liderleri ise gerçek düzeni kuracaklarını söylüyor. Efendim, komünist ordu hangi tarafı iktidara getirecek? Seçim sizin."
 TurkeyF.171.a:0 "Doğru Taraf TKP!"
 TurkeyF.171.b:0 "En Güçlüsü EMEP!"
 TurkeyF.171.c:0 "Gerçekçi Taraf ÖDP!"
 TurkeyF.171.d:0 "Gerçek Vizyon VATAN'da!"
 TurkeyF.172.title:0 "Türkiye'den Davet"
 TurkeyF.172.desc:0 "Türklerden bir teklif aldık. Amaçları dengeleri değiştirecek bir ittifak kurmak. Bu ittifakın temeli barış ve ekonomik işbirliği olacak. Efendim, bu teklife nasıl yanıt verelim?"
 TurkeyF.172.a:0 "Birlikte Daha Güçlüyüz"
 TurkeyF.172.b:0 "Buna Gerçekten İhtiyacımız Yok"
 TurkeyF.173.title:0 "Yunanistan Teklifimizi Reddetti"
 TurkeyF.173.desc:0 "Yunanistan teklifi reddettiğini açıkladı. Bu yolda tek başımıza devam etmek zorundayız!"
 TurkeyF.173.a:0 "Lanet olsun"
 TurkeyF.174.title:0 "Türkiye'den Davet"
 TurkeyF.174.desc:0 "Türklerden bir teklif aldık. Amaçları dengeleri değiştirecek bir ittifak kurmak. Bu ittifakın temeli barış ve ekonomik işbirliği olacak. Efendim, bu teklife nasıl yanıt verelim?"
 TurkeyF.174.a:0 "Birlikte Daha Güçlüyüz"
 TurkeyF.174.b:0 "Buna Gerçekten İhtiyacımız Yok"
 TurkeyF.175.title:0 "Suriye Teklifimizi Reddetti"
 TurkeyF.175.desc:0 "Suriye teklifi reddettiğini açıkladı. Bu yolda tek başımıza devam etmek zorundayız!"
 TurkeyF.175.a:0 "Lanet olsun"
 TurkeyF.176.title:0 "Türkiye'den Davet"
 TurkeyF.176.desc:0 "Türklerden bir teklif aldık. Amaçları dengeleri değiştirecek bir ittifak kurmak. Bu ittifakın temeli barış ve ekonomik işbirliği olacak. Efendim, bu teklife nasıl yanıt verelim?"
 TurkeyF.176.a:0 "Birlikte Daha Güçlüyüz"
 TurkeyF.176.b:0 "Buna Gerçekten İhtiyacımız Yok"
