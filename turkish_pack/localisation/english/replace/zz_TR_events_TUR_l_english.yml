 TurkeyT.19.title:0 "Meclis Savaş Tezkeresini Kabul Etti"
 TurkeyT.19.desc:0 "Uzun ve hararetli bir tartışmanın ardından Türkiye Büyük Millet Meclisi savaş tezkeresini kabul etti. Önümüzdeki aylarda hükümetin savaş ilan etmeden önce yeniden Meclis'e danışmasına gerek kalmayacak."
