 TurkeyF.177.desc:0 "Bulgaristan teklifi reddettiğini açıkladı. Bu yolda tek başımıza devam etmek zorundayız!"
 TurkeyF.177.a:0 "Lanet olsun"
 TurkeyF.178.title:0 "Türkiye'den Davet"
 TurkeyF.178.desc:0 "Türklerden bir teklif aldık. Amaçları dengeleri değiştirecek bir ittifak kurmak. Bu ittifakın temeli barış ve ekonomik işbirliği olacak. Efendim, bu teklife nasıl yanıt verelim?"
 TurkeyF.178.a:0 "Birlikte Daha Güçlüyüz"
 TurkeyF.178.b:0 "Buna Gerçekten İhtiyacımız Yok"
 TurkeyF.179.title:0 "Irak Teklifimizi Reddetti"
 TurkeyF.179.desc:0 "Irak teklifi reddettiğini açıkladı. Bu yolda tek başımıza devam etmek zorundayız!"
 TurkeyF.179.a:0 "Lanet olsun"
 TurkeyF.180.title:0 "Birlesik Cephe"
 TurkeyF.180.desc:0 "Komünist partimizin sekreteri komünist Türkiye'den döndü ve bir açıklama yaptı: "Artık tek vücut olarak bu kapitalist hırslara karşı durmalıyız! Kapitalizm durmayacaksa biz durduracağız! Yaşasın antikapitalistler!""
 TurkeyF.180.a:0 "Eh, İdare Eder"
 TurkeyF.181.title:0 "EMEP'in Darbe Girisimi Basarisiz Oldu"
 TurkeyF.181.desc:0 "TKP'nin zaferinden rahatsız olan EMEP üyeleri, TKP'yi yenmek için kendi milislerini darbeye çağırdı. EMEP akşam saatlerinde milis güçleriyle Ankara ve İstanbul'daki askerî tesislere planlı bir saldırı düzenledi. Ertesi gün güçlü vatansever TKP milisleri sokaklara çıkarak EMEP milis güçlerine ateş açtı. Sokağa çıkma yasağı ilan edildi ve çatışma üç gün sürdü. Üç günün sonunda EMEP'in orduları dağılmaya ve teslim olmaya başladı. Böylece EMEP'in ana ordu gücü çöktü. EMEP'in darbesi püskürtülmüş olabilir, ancak silahlarıyla hâlâ ortalığı karıştırdıkları görülüyor. Bu yeni terör örgütünü mutlaka yok etmeliyiz!"
 TurkeyF.181.a:0 "Hainler!"
 TurkeyF.182.title:0 "Ülkemizde Komünist Hareketlilik"
 TurkeyF.182.desc:0 "Komünistler ayakta. Amaçları yeni bir komünist iktidar getirmek. Bir sonraki seçimde onları yenmezsek iktidara gelebilirler."
 TurkeyF.182.a:0 "Hiç İyi Görünmüyor"
 TurkeyF.183.title:0 "Ülkemizde Komünist Hareketlilik"
 TurkeyF.183.desc:0 "Komünistler ayakta. Amaçları yeni bir komünist iktidar getirmek. Bir sonraki seçimde onları yenmezsek iktidara gelebilirler."
 TurkeyF.183.a:0 "Hiç İyi Görünmüyor"
 TurkeyF.184.title:0 "Birlesik Komünist Çagri"
 TurkeyF.184.desc:0 "Komünist partimizin sekreteri komünist Türkiye'den döndü ve bir açıklama yaptı: "Artık tek vücut olarak bu kapitalist hırslara karşı durmalıyız! Kapitalizm durmayacaksa biz durduracağız! Yaşasın antikapitalistler!""
 TurkeyF.184.a:0 "Eh, İdare Eder"
 TurkeyF.185.title:0 "Türkiye Baris Teklif Ediyor"
 TurkeyF.185.desc:0 "Türklerle çatışma kanlı geçti. Türkler şimdi bize barış teklif ediyor. Kafkasya'yı rahat bırakırsak savaştan çekilip toprakları terk edecekler. Efendim, böyle bir barış teklifine nasıl bir yanıt verelim?"
 TurkeyF.185.a:0 "Peki, Geri Çekileceğiz"
 TurkeyF.185.b:0 "Çatışmaya Devam Edeceğiz"
 TurkeyF.186.title:0 "Rusya Baris Teklifimizi Reddetti"
 TurkeyF.186.desc:0 "Rusya barış teklifimize sert bir yanıt vererek reddetti. Bu reddin etkisiyle savaşa devam edeceğiz. Sonuna kadar..."
 TurkeyF.186.a:0 "Çatışma Sürüyor..."
 TurkeyF.187.title:0 "Siddetli Bir Darbe!"
 TurkeyF.187.desc:0 "Uzun süredir önlem alınmayan Gülenci sorunu büyüdü ve sonunda Gülenciler anayasal düzeni devirmek için silahlarıyla sokaklarda terör estirdi. Gülen yapılanması çok sayıda kayıp vermesine rağmen hükümeti devirmeyi başardı. İktidardaki bu değişimler sonucunda bir iç savaş bekleniyor."
 TurkeyF.187.a:0 "Allah Yardımcımız Olsun!"
 TurkeyF.189.title:0 "Türkiye Bizi AB'den Uzaklastiriyor"
 TurkeyF.189.desc:0 "Türkiye bizi Avrupa'dan çıkmaya, Türk bağlarını ve değerlerini benimsemeye zorluyor. Buna izin verecek miyiz? Yoksa Avrupa yanlısı tutumumuzu sürdürerek buna fırsat vermeyecek miyiz?"
 TurkeyF.189.a:0 "Asla, Bağlarımıza Sadık Kalacağız"
 TurkeyF.189.b:0 "Belki de AB'den Ayrılma Vakti Gelmiştir"
 TurkeyF.190.title:0 "Türk Ortaklik Teklifi"
 TurkeyF.190.desc:0 "Türkiye bizimle ittifak kurmak istiyor. Türk bağlarımızı sıkılaştırmak için bu teklife evet mi diyelim, yoksa Avrupa yanlısı tutumumuzu sürdürerek reddedelim mi?"
 TurkeyF.190.a:0 "Beklediğimiz Buydu!"
 TurkeyF.190.b:0 "Hayır, Bu Gereksiz"
 TurkeyF.191.title:0 "Macaristan Teklifi Reddetti"
 TurkeyF.191.desc:0 "Macaristan teklifimizi reddetti. Türk bağlarımızı uzak diyarlara bağlayamadık. Türk-Hun işbirliği gelecekte durabilir."
 TurkeyF.191.a:0 "Kötü Görünüyor"
 TurkeyF.192.title:0 "Macaristan Teklifi Kabul Etti"
 TurkeyF.192.desc:0 "Macaristan teklifimizi kabul etti. Türk bağlarımızı uzak diyarlara başarıyla ulaştırdık. Artık Türklük barış içinde birleşebilir."
 TurkeyF.192.a:0 "Kulağa İyi Geliyor"
 TurkeyF.193.title:0 "Avrupa Uyum Fasli: 1"
 TurkeyF.193.desc:0 "Avrupa Birliği-Türkiye Entegrasyonu'nun ilk faslını tamamladık. Artık Avrupa Birliği'ne katılım sürecinin yarısındayız. Bizi bekle, Avrupa Birliği!"
 TurkeyF.193.a:0 "Güzel!"
 TurkeyF.194.title:0 "Avrupa Uyum Fasli: 2"
 TurkeyF.194.desc:0 "Avrupa Birliği-Türkiye Entegrasyonu'nun ikinci faslını tamamladık. Artık Avrupa Birliği'ne katılım sürecini tamamladık. Türkiye için yeni bir başlangıç geliyor!"
 TurkeyF.194.a:0 "Avrupa Üyeliği İçin!"
 TurkeyF.195.title:0 "NATO-Gürcistan Entegrasyonu"
 TurkeyF.195.desc:0 "Rusların hızla silahlanması sonucunda Rusya'nın Gürcistan'a silahlı saldırı başlatabileceğini öngören NATO kuvvetleri, Gürcistan'ın savunması için ortaklaşa destek verecek."
 TurkeyF.195.a:0 "Rus Emperyalizmine Karşı Birlik"
 TurkeyF.196.title:0 "Kafkasya Petrol Anlasmasi"
 TurkeyF.196.desc:0 "Kafkasya'da Türk finansmanıyla petrol rafinerileri açılması planlanıyor. Hükümetimiz bu durumdan oldukça memnun; yakında petrol üretimimiz yüksek seviyelere çıkacak."
 TurkeyF.196.a:0 "Daha Fazla Kâr Etme Vakti"
 TurkeyF.197.title:0 "Mahkeme Ilk Dönemini Tamamladi"
 TurkeyF.197.desc:0 "Mahkeme ilk dönemini tamamladı. Artık mahkemede değişiklikler başlayacak ve mahkeme sistemini yenileyecek. Bu, siyasi ve istikrarlı gelişmeyi düzenleyecek."
 TurkeyF.197.a:0 "Mahkeme Kararını Verdi"
 TurkeyF.198.title:0 "Mahkeme Ikinci Dönemini Tamamladi"
 TurkeyF.198.desc:0 "Mahkeme ikinci dönemini tamamladı. Artık mahkemede değişiklikler başlayacak ve mahkeme sistemini yenileyecek. Bu, siyasi ve istikrarlı gelişmeyi düzenleyecek."
 TurkeyF.198.a:0 "Mahkeme Kararını Verdi"
 TurkeyF.199.title:0 "Mahkeme Üçüncü Dönemini Tamamladi"
 TurkeyF.199.desc:0 "Mahkeme üçüncü dönemini tamamladı. Artık mahkemede değişiklikler başlayacak ve mahkeme sistemini yenileyecek. Bu, siyasi ve istikrarlı gelişmeyi düzenleyecek."
 TurkeyF.199.a:0 "Mahkeme Kararını Verdi"
 TurkeyF.201.title:0 "Türk-Avrupa Kardeslik Iliskisi"
 TurkeyF.201.desc:0 "Avrupa Birliği'nin doğu ülkeleri Türkiye ile bir araya geldi. Türkiye, Avrupa'nın doğu ülkeleriyle ortak hareket etmek istiyor. Bu konuda ne yapılabileceğine biz karar vereceğiz."
 TurkeyF.201.a:0 "İşbirliğine İhtiyacımız Var"
 TurkeyF.201.b:0 "Ah! Türklere Kimin İhtiyacı Var?"
 TurkeyF.200.title:0 "Mahkeme Yönetimi Devraldi"
 TurkeyF.200.desc:0 "Yaşanan kargaşa sonucunda Anayasa Mahkemesi hükümeti devirdi ve bizzat hükümet oldu. Anayasa Mahkemesi kısa sürede belirli birimlere ayrıldı. Anayasa Mahkemesi'nin kurduğu yönetimin başında Ahmet Necdet Sezer olacak. Ahmet Necdet Sezer daha önce Türkiye Cumhurbaşkanlığı görevini yürütmüş deneyimli bir isim."
 TurkeyF.200.a:0 "Adalete İhtiyaç Vardı"
 TurkeyF.202.title:0 "Askerî Dram"
 TurkeyF.202.desc:0 "Türk Silahlı Kuvvetleri Anayasa Mahkemesi'ndeki siyasallaşmış durumdan son derece rahatsız. Bu yüzden Anayasa Mahkemesi'nin kendine çeki düzen vermesini istiyorlar. Bu taleplere nasıl yanıt vereceğimiz kaderimizi etkileyecek."
 TurkeyF.202.a:0 "Ordu Haklı! Tamam mı?"
 TurkeyF.202.b:0 "Ordu Müdahale Edebilmemeli"
 TurkeyF.203.title:0 "Anitkabir'den Tuhaf Sesler"
 TurkeyF.203.desc:0 "Atatürk'ün kabrinden tuhaf sesler gelmeye başladı. Bunun üzerine olayla ilgili soruşturma başlatılacak. Ayrıca Atatürk'ün kabrinin zarar görmüş olabileceği ihtimali nedeniyle halkta huzursuzluk var."
 TurkeyF.203.a:0 "Anıtkabir Saldırı Altında Olmalı!"
 TurkeyF.204.title:0 "Anitkabir'de Sorusturma Baslatildi"
 TurkeyF.204.desc:0 "Gönderdiğimiz soruşturma ekibi çevredeki tarihî anıtlara zarar verdi. Üstelik Atatürk kabirde bulunamadı. Bu durumla birlikte iç huzursuzluk ve ordunun işe el koyma ihtimali artıyor. Olayları araştırmamız gerekiyor, bu bizim sonumuz olabilir."
 TurkeyF.204.a:0 "Her Yeri Arayalım"
 TurkeyF.205.title:0 "Atatürk! Geri Döndü!"
 TurkeyF.205.desc:0 "Bir taksi şoförü, Anıtkabir yakınlarındayken bizzat Atatürk'ü gördüğünü iddia etti. Bunun üzerine çevrede arama yapıldı ve kamera kayıtlarında Atatürk'e benzeyen birinin geçtiği tespit edildi. Ertesi gün Atatürk Orman Çiftliği'nin kapısında tıpatıp Atatürk'e benzeyen biri bulundu. Bizzat Atatürk olduğunu iddia eden kişinin doğru söylediği anlaşıldı. Atatürk'ün bulunduğu yer bir mitinge dönüştü. Muhafızlar artırıldı ve Atatürk oradan götürüldü. Bir sonraki gün Atatürk CHP binasına gitti ve oradan "Atatürk yaşıyor!" açıklaması geldi. İnsanların çoğu buna inanmadı ve CHP'yi yalancı olarak gördü. Bazı dindar kesimler durumdan endişelendi, tarikatlar huzursuzlandı."
 TurkeyF.205.a:0 "İmkânsız!"
 TurkeyF.206.title:0 "Atatürk Siyasete Döndü"
 TurkeyF.206.desc:0 "Kabul etmeyenler olsa da Atatürk'ün hayata döndüğü artık resmîleşti. Atatürk, CHP'nin reformunu öngören kanun teklifini sunduktan sonra siyasete gireceğini açıkladı. Atatürk'ün yakında CHP'nin başına geçmesi bekleniyor. CHP'de bir kadro değişikliği de mümkün."
 TurkeyF.206.a:0 "Başlıyoruz!"
 TurkeyF.207.title:0 "Atatürk Yüce Cumhurbaskani Seçildi"
 TurkeyF.207.desc:0 "Seçimler sonucunda Atatürk ülkenin cumhurbaşkanı seçildi. Atatürk'ün her türlü sistemde değişiklik yapması bekleniyor. Bu değişim havası ülkemize kesinlikle faydalı olacak."
 TurkeyF.207.a:0 "Beklendiği Gibi"
 TurkeyF.208.title:0 "Türkiye Batum'u Istiyor"
 TurkeyF.208.desc:0 "Türkiye, Misak-ı Millî hedeflerini gerçekleştirmek için Gürcistan'ımızın bir toprağı olan Batum'u istiyor. Efendim, taleplerini reddedersek bir savaş durumu ortaya çıkabilir, dikkatle düşünmeliyiz."
 TurkeyF.208.a:0 "Hayır, Duruşumuzu Koruyoruz"
 TurkeyF.208.b:0 "Evet, İlişkilerimizi Riske Atamayız"
 TurkeyF.209.title:0 "Türkiye'den Kuzey Kibris'in Taninmasi Için Baski"
 TurkeyF.209.desc:0 "Türkiye, Kuzey Kıbrıs'ın tanınması için baskı yapıyor. Efendim, sizce Kuzey Kıbrıs tanınmalı mı tanınmamalı mı? Seçim sizin."
 TurkeyF.209.a:0 "Bunu Düşüneceğiz"
 TurkeyF.210.title:0 "Modern Sadabat Meselesi"
 TurkeyF.210.desc:0 "Türkler bölgede istikrarı yeniden canlandırmak için bizimle birlikte bir barış anlaşması yapmak istiyor. İsteklerini reddedip savaşçı tutumumuzu sürdürelim mi? Yoksa bölgenin istikrarı ve barışı adına savaşçı tutumumuza son mu verelim?"
 TurkeyF.210.a:0 "Bunu Yeniden Kuralım"
 TurkeyF.210.b:0 "Bunun Yeniden Kurulmasına Gerek Yok"
 TurkeyF.211.title:0 "Kürt Referandumu Meselesi"
 TurkeyF.211.desc:0 "Ülkemiz Kürt federalleşmesini başlattı ve başarıyla sürdürdü. Kürtler artık özgürce konuşabiliyor, Kürt şehirleri Kürtçe adlarıyla anılıyor. Ayrıca bu federalleşme kapsamında Doğu Anadolu halkının gönlünü kazanarak PKK'yı yok ettik. Elde ettiğimiz başarıyı Kuzey Irak yönetiminde de sağlamak istiyoruz. Bu yüzden onlara bir referandum taslağı gönderdik."
 TurkeyF.211.a:0 "Bu Anlaşmayı Yapalım"
 TurkeyF.212.title:0 "Türkiye'nin Önerdigi Referandum"
 TurkeyF.212.desc:0 "Türkiye bizi referanduma davet ediyor. İstekleri Kürt bölgesinin Türkiye'ye ilhakı. Kabul etmezsek demokratik yöntemlerle devam edecekleri için bu konuda hiçbir şey yapmayacaklar. Efendim, bu Türklere ne cevap verelim?"
 TurkeyF.212.a:0 "Kabul Edilebilir"
 TurkeyF.212.b:0 "Yaşasın Kürt Milleti!"
 TurkeyF.213.title:0 "Kuzey Kürdistan'dan Bir Cevap"
 TurkeyF.213.desc:0 "Kürt halkı referandumumuzu reddetti. Türkiye gibi bir refah devletinde yaşamak istemiyorlar. Doğu Anadolu'daki Kürtlerle birlikte yaşamaya devam edeceğiz."
 TurkeyF.213.a:0 "Lanet olsun"
 TurkeyF.214.title:0 "Gülen Için Yaptirim mi?"
 TurkeyF.214.desc:0 "Ülkemizde bulunan ve Türkiye tarafından terörist ilan edilen Fethullah Gülen suikast sonucu öldürüldü. İstihbarat teşkilatlarımız bu suikastın arkasında Türk hükümetini görüyor. ABD topraklarındaki kişilere müdahale ettiği için Türk hükümetine yaptırım uygulayalım mı?"
 TurkeyF.214.a:0 "Yaptırım Uygula"
 TurkeyF.214.b:0 "Her Türlü Yaptırımdan Kaçın"
 TurkeyF.215.title:0 "Amerikan Tepkisi"
 TurkeyF.215.desc:0 "ABD, Fethullah Gülen'e suikast düzenlediğimizi fark etti. Bunun üzerine yaptırım uygulama kararı aldı. Bu son gelişme ülkemize ekonomik zarar verebilir, buna hazırlıklı olmalıyız."
 TurkeyF.215.a:0 "Buna Hazırlanmalıyız!"
 TurkeyF.216.title:0 "HP Türkiye'de Siyasi Firsat Aramak Için Cesur Bir Adim Atti"
 TurkeyF.216.desc:0 "Şaşırtıcı bir gelişmeyle Kuzey Kıbrıs'ın Halkın Partisi (HP), komşu Türkiye'de siyasete katılım için yeni yollar arama planlarını açıkladı. Karar, partinin kendi ülkesinde meclis temsili kazanmakta zorlanmasının ardından geldi. Bu parti ülkede teknokratik düşünceyi oluşturmak istiyor; izin verelim mi vermeyelim mi?"
 TurkeyF.216.a:0 "HP Desteklenmeli"
 TurkeyF.216.b:0 "Hayır, İktidar Kazanmalarını Engelleyin"
 TurkeyF.217.title:0 "HP Ufkunu Genisletiyor, Türk Siyasetine Adim Atiyor"
 TurkeyF.217.desc:0 "İstanbul'da düzenlenen resmî açılış töreninde HP Genel Başkanı Mustafa Akıncı bu tarihî anın önemini vurguladı: "Bugün partimiz ve temsil ettiğimiz halk için tarihî bir dönüm noktası. Türkiye'de varlık göstererek ayrılıkları gidermeyi, diyaloğu teşvik etmeyi ve iki milletimiz arasındaki birlik duygusunu güçlendirmeyi amaçlıyoruz. İlkelerimiz ve kamuya hizmet etme kararlılığımız değişmeden duruyor; bu genişlemenin işbirliği ve ilerleme için değerli fırsatlar yaratacağına inanıyoruz." Siyasi analistler, HP ile Türk siyasi aktörleri arasında yapıcı alışverişler ve karşılıklı fayda potansiyeli gördükleri bu hamleyi övdü. Partinin sosyal kapsayıcılık, ekonomik refah ve sürdürülebilir kalkınmaya odaklanan programı, Türkiye'deki pek çok ilerici siyasi grupta karşılık buluyor. Siyasi yolculuğunda yeni bir sayfa açan HP, Türkiye'deki tüm yasal ve idari prosedürlere uymaya kararlı; parti temsilcileri ülkenin siyasi kurallarına tam uyum sağlamak için Türk makamlarıyla görüşmelere başladı."
 TurkeyF.217.a:0 "Çok İlginç"
 TurkeyF.218.title:0 "Ünlü Lider Kemal Dervis Türkiye'ye Açilan Teknokrat HP'ye Katildi"
 TurkeyF.218.desc:0 "Önemli bir siyasi gelişmeyle Halkın Partisi (HP) olarak da bilinen Teknokrat Parti, Türkiye'de resmen faaliyete başladı ve saflarına Kemal Derviş gibi yüksek profilli bir isim kattı. Saygın bir siyasetçi ve Cumhuriyet Halk Partisi'nin (CHP) eski önde gelen üyelerinden Derviş, partinin ilerici yönetim ve ileriye dönük politikalar vizyonuyla örtüştüğünü belirterek HP'ye katılma kararını açıkladı.\n\nHP'nin Türkiye teşkilatının açılışı, parti yöneticileri ve destekçilerinin bu önemli anı izlemek için bir araya geldiği Ankara'daki görkemli bir törenle yapıldı. HP Genel Başkanı Ali Demir, Türk vatandaşlarının sıcak karşılamasına teşekkür etti ve Türkiye'nin siyasi hayatına olumlu katkı sunma sözü verdi.\n\nGenel Başkan Demir konuşmasında şöyle dedi: "Sürdürülebilir kalkınmayı ve toplumsal ilerlemeyi sağlamak için teknokrasinin ve kanıta dayalı politikaların gücüne inanıyoruz. HP'yi Türkiye'de kurarak siyasi tartışmaya taze bakış açıları getirmeyi ve benzer düşünen kişi ve partilerle işbirliği yapmayı amaçlıyoruz."\n\nEtkinliğin en önemli anı, daha önce Türkiye'nin ekonomiden sorumlu Devlet Bakanı ve ardından Birleşmiş Milletler Kalkınma Programı Başkanı olarak görev yapan deneyimli ekonomist ve diplomat Kemal Derviş'in resmen Teknokrat Parti'ye katılmasıydı. CHP'de etkili bir isim olan Derviş, parti değiştirme kararının HP'nin yönetime pragmatik yaklaşımına ve uzmanlığa dayalı çözümlere verdiği öneme duyduğu inançtan kaynaklandığını söyledi.\n\nDerviş basına yaptığı açıklamada, "Her zaman ilerici siyasetin değerlerine, kanıta dayalı karar almaya ve karmaşık sorunlara pratik çözümler bulmaya bağlı oldum. HP'nin teknokrasiye bağlılığı ve toplumsal sorunları çözmek için farklı alanlardan uzmanları bir araya getirme isteği bende derin bir karşılık buldu. HP ile bu yeni sayfayı açmaktan ve Türkiye için daha parlak bir geleceğin şekillenmesine katkı sunmaktan büyük heyecan duyuyorum" dedi."
 TurkeyF.218.a:0 "Kemal Derviş'ten Beklenmedik Hamle"
 TurkeyF.219.title:0 "Ünlü Lider Kemal Dervis Türkiye'ye Açilan Teknokrat HP'ye Katildi"
 TurkeyF.219.desc:0 "Önemli bir siyasi gelişmeyle Halkın Partisi (HP) olarak da bilinen Teknokrat Parti, Türkiye'de resmen faaliyete başladı ve saflarına Kemal Derviş gibi yüksek profilli bir isim kattı. Saygın bir siyasetçi ve Cumhuriyet Halk Partisi'nin (CHP) eski önde gelen üyelerinden Derviş, partinin ilerici yönetim ve ileriye dönük politikalar vizyonuyla örtüştüğünü belirterek HP'ye katılma kararını açıkladı.\n\nHP'nin Türkiye teşkilatının açılışı, parti yöneticileri ve destekçilerinin bu önemli anı izlemek için bir araya geldiği Ankara'daki görkemli bir törenle yapıldı. HP Genel Başkanı Ali Demir, Türk vatandaşlarının sıcak karşılamasına teşekkür etti ve Türkiye'nin siyasi hayatına olumlu katkı sunma sözü verdi.\n\nGenel Başkan Demir konuşmasında şöyle dedi: "Sürdürülebilir kalkınmayı ve toplumsal ilerlemeyi sağlamak için teknokrasinin ve kanıta dayalı politikaların gücüne inanıyoruz. HP'yi Türkiye'de kurarak siyasi tartışmaya taze bakış açıları getirmeyi ve benzer düşünen kişi ve partilerle işbirliği yapmayı amaçlıyoruz."\n\nEtkinliğin en önemli anı, daha önce Türkiye'nin ekonomiden sorumlu Devlet Bakanı ve ardından Birleşmiş Milletler Kalkınma Programı Başkanı olarak görev yapan deneyimli ekonomist ve diplomat Kemal Derviş'in resmen Teknokrat Parti'ye katılmasıydı. CHP'de etkili bir isim olan Derviş, parti değiştirme kararının HP'nin yönetime pragmatik yaklaşımına ve uzmanlığa dayalı çözümlere verdiği öneme duyduğu inançtan kaynaklandığını söyledi.\n\nDerviş basına yaptığı açıklamada, "Her zaman ilerici siyasetin değerlerine, kanıta dayalı karar almaya ve karmaşık sorunlara pratik çözümler bulmaya bağlı oldum. HP'nin teknokrasiye bağlılığı ve toplumsal sorunları çözmek için farklı alanlardan uzmanları bir araya getirme isteği bende derin bir karşılık buldu. HP ile bu yeni sayfayı açmaktan ve Türkiye için daha parlak bir geleceğin şekillenmesine katkı sunmaktan büyük heyecan duyuyorum" dedi."
 TurkeyF.219.a:0 "Yaşasın Kudret Özersay"
 TurkeyF.219.b:0 "Kemal Derviş ile Yolumuza Devam Edeceğiz"
 TurkeyF.220.title:0 "HP'nin Teknokrasi Referandumu Zaferle Sonuçlandi"
 TurkeyF.220.desc:0 "Önemli bir gelişmeyle Halkın Partisi (HP) olarak da bilinen Teknokrat Parti, Milliyetçi Hareket Partisi'nin (MHP) ve Adalet ve Kalkınma Partisi'nin (AKP) sert muhalefetine rağmen Türkiye'de yapılan teknokrasi referandumunda ezici bir zafer kazandı. Teknokrasiye dayalı bir yönetim sistemine halk desteğini ölçmeyi amaçlayan referandum, Kemalist demokratlardan ve Kürt toplumundan büyük destek gördü.\n\nSiyasi heyecanın hâkim olduğu bir atmosferde Türk vatandaşları HP'nin önerdiği teknokratik model için sandığa gitti. Türkiye'de türünün ilk örneği olan referandum, ülkenin sorunlarına yönelik kanıta dayalı ve uzman odaklı politikalara olan talebin arttığını gösterdi.\n\nReferandum en başından itibaren MHP ve AKP'nin sert muhalefetiyle karşılaştı. İki parti teknokrasi kavramını kamuoyu önünde eleştirerek Türkiye'nin geleneksel siyasi değerlerine bir tehdit olarak nitelendirdi; tabandaki seslerin dışlanabileceği ve temsilî demokrasiden uzaklaşılacağı endişelerini dile getirdi.\n\nMuhalefetin çıkardığı engellere rağmen HP'nin vizyoner yaklaşımı toplumun farklı kesimlerinden geniş destek gördü. Türkiye'nin laik mirasına ve modernleşme ilkelerine değer veren Kemalist demokratlar, teknokrasi referandumunu pragmatik reformlar için bir fırsat olarak gördü. Ayrıca uzun süredir daha fazla kapsayıcılık ve kültürel haklarının tanınmasını talep eden Kürt toplumu da adil kalkınmayı önceleyebilecek teknokratik bir yönetim sistemi fikrini benimsedi.\n\nReferandum sonuçları açıklanırken ülke genelinde HP destekçileri arasında coşkulu kutlamalar başladı. İlk veriler referandumun teknokratik model lehine çoğunluk sağladığını, yani değişim için açık bir yetki verildiğini gösterdi. HP Genel Başkanı Ali Demir tüm destekçilere teşekkür etti ve partinin daha şeffaf, verimli ve kapsayıcı bir hükümet kurma kararlılığını yineledi.\n\nMHP ve AKP liderleri ise hayal kırıklıklarını dile getirse de demokratik süreci kabul etti. Referandum sonucuna saygı göstererek ideolojilerini savunmaya devam edeceklerini açıkladılar.\n\nHP'nin kampanyasında kilit rol oynayan önemli isim Kemal Derviş, Kemalist demokratlara ve Kürt toplumuna desteklerinden dolayı teşekkür etti: "Bugün daha hesap verebilir ve etkili bir hükümete doğru önemli bir adım attık. Referandum sonuçları işbirliğinin gücünü ve siyasi sistemimizde yenilik arzusunu gösteriyor. Bize duyulan güveni boşa çıkarmayacak ve tüm vatandaşlara hizmet eden kanıta dayalı politikaları hayata geçirmek için yorulmadan çalışacağız."\n\nReferandum sonucu, siyasi analistleri Türkiye'nin geleceği üzerindeki olası etkileri konusunda spekülasyona yöneltti. HP'nin zaferi teknokrasiyi uygulanabilir bir siyasi model olarak kabul ettirmekle kalmadı, toplumun farklı kesimlerini ortak bir ilerleme vizyonu etrafında birleştirerek siyasi manzarayı da yeniden şekillendirdi.\n\nBu tarihî zaferle HP, Türkiye'nin siyasi rotasını belirleyecek kilit bir aktör hâline geldi; teknokratik ilkelere bağlılığı önümüzdeki günlerde elbette sınanacak. Türkiye bu yeni yönetim dönemine girerken dünya, kanıta dayalı karar almanın ülkeyi büyüme ve kalkınma yolunda nasıl ileriye taşıyacağını yakından izliyor."
 TurkeyF.220.a:0 "Zafer!"
 TurkeyF.221.title:0 "Teknokratik Sancilar"
 TurkeyF.221.desc:0 "Şaşırtıcı bir gelişmeyle Halkın Partisi (HP) olarak da bilinen Teknokrat Parti, Türkiye'de yapılan teknokrasi referandumundan zaferle çıktı. Ancak zafere rağmen referandumun ardından Türk toplumunda ciddi sorunlar ve bölünmeler baş gösterdi.\n\nTeknokratik bir yönetim modeline halk desteğini ölçmeyi amaçlayan referandumda HP'nin kampanyası seçmenlerin önemli bir kısmında karşılık buldu ve başarıya ulaştı. Kanıta dayalı politikalar ve sadeleştirilmiş karar alma vaadi, geleneksel siyasetten bıkmış pek çok vatandaşın hayal gücünü yakaladı."
 TurkeyF.221.a:0 "Ah!"
 TurkeyF.222.title:0 "Ekonomistler Grubu Iç Seçimi Kazandi"
 TurkeyF.222.desc:0 "Halkın Partisi içindeki rekabet doruğa ulaşırken "Ekonomistler Grubu" partinin büyük çoğunluğunun tanınırlığını ve desteğini kazanarak açık ara galip geldi. Bu kesin zafer, ortak bir vizyonu ve ekonomi ile politika yapımı alanında uzmanlığı paylaşan grup üyelerinin artan etkisini ortaya koydu. Ekonomistler Grubu'nun başarısı parti içinde ve genel siyasi ortamda tartışma ve heyecan yarattı. Parti yönetimi güç dengelerindeki bu önemli değişimin sonuçlarını değerlendirirken kritik bir soru gündeme geldi: Ekonomistler Grubu'nu kim kuracak ve yönetecek? Parti içinde, her biri kendine özgü güçlü yanlara ve politika vizyonlarına sahip birkaç önemli isim Ekonomistler Grubu'nun olası liderleri olarak öne çıktı. Bunlar arasında uzun süredir kanıta dayalı karar almayı ve acil toplumsal sorunlara pragmatik çözümleri savunan deneyimli ekonomistler, akademisyenler ve politika yapıcılar vardı."
 TurkeyF.222.a:0 "Bizi Özgür Demirtaş Yönetecek"
 TurkeyF.222.b:0 "Bizi Daron Acemoğlu Yönetecek"
 TurkeyF.223.title:0 "Bilim Grubu Iç Seçimi Kazandi"
 TurkeyF.223.desc:0 "Halkın Partisi içindeki rekabet doruğa ulaşırken "Bilim Grubu" partinin büyük çoğunluğunun tanınırlığını ve desteğini kazanarak açık ara galip geldi. Bu kesin zafer, ortak bir vizyonu ve politika yapımı alanında uzmanlığı paylaşan grup üyelerinin artan etkisini ortaya koydu. Bilim Grubu'nun başarısı parti içinde ve genel siyasi ortamda tartışma ve heyecan yarattı. Parti yönetimi güç dengelerindeki bu önemli değişimin sonuçlarını değerlendirirken kritik bir soru gündeme geldi: Bilim Grubu'nu kim kuracak ve yönetecek? Parti içinde, her biri kendine özgü güçlü yanlara ve politika vizyonlarına sahip birkaç önemli isim Bilim Grubu'nun olası liderleri olarak öne çıktı. Bunlar arasında uzun süredir kanıta dayalı karar almayı ve acil toplumsal sorunlara pragmatik çözümleri savunan deneyimli akademisyenler ve politika yapıcılar vardı."
 TurkeyF.223.a:0 "Bizi Celal Şengör Yönetecek"
 TurkeyF.223.b:0 "Bizi Aziz Sancar Yönetecek"
 TurkeyF.223.c:0 "Bizi Kudret Özersay Yönetecek"
 TurkeyF.224.title:0 "MIT'in Gizli Plani"
 TurkeyF.224.desc:0 "Mafyaların iktidarı ele geçirmesinin ardından MİT, ülkeyi mafyanın kötü yönetiminden kurtarmak için her yerde örgütlenmeye başladı. Onların yanında mı olalım, karşısında mı? Buna hemen şimdi karar verelim."
 TurkeyF.224.a:0 "Bu Mafya Hükümeti Yıkılmalı"
 TurkeyF.224.b:0 "MİT Bu Hükümeti Asla Deviremeyecek"
 TurkeyF.225.title:0 "SADAT Hükümeti Devirmek Için Harekete Geçti"
 TurkeyF.225.desc:0 "Türkiye'nin başkentinde endişe verici bir durum yaşandı: Bağımsız bir savunma danışmanlık şirketi olan SADAT ile bağlantılı olduğu iddia edilen bir grubun organize ettiği darbe girişimi, MİT'in (Hakan Fidan ve Fahrettin Altun) liderliğindeki hükümeti devirmeyi amaçladı. Türk devletinin darbe girişimini engelleme çabalarına rağmen durum tırmandı ve Ankara'da gerginlik arttı.\n\nSabahın erken saatlerinde tanklardan ve silahlı personelden oluşan bir konvoy Ankara'ya doğru yürüyüşe geçti; bu da güvenlik güçlerinin hızlı tepkisine yol açtı. Hükümet derhâl olağanüstü hâl ilan etti ve ilerleyen konvoyla yüzleşmek için Türk ordusu seferber edildi.\n\nKonvoy kente yaklaşırken darbeciler ile hükümet güçleri arasında çatışmalar çıktı; aralıklı silah sesleri ve patlamalar başkenti sarstı. Sivil kayıplara ve kamu altyapısındaki hasara ilişkin haberler, kent sakinleri arasındaki belirsizlik ve korku duygusunu artırdı."
 TurkeyF.225.a:0 "Geri Dönüş Yok!"
 TurkeyF.226.title:0 "Israil-Türk Ittifaki mi?"
 TurkeyF.226.desc:0 "Türkiye'nin Yahudi Hükümeti İsrail ile ittifak kurmak istiyor. Onlara olumlu mu yanıt verelim, olumsuz mu?"
 TurkeyF.226.a:0 "Yaşasın Yahudi Koalisyonu"
 TurkeyF.227.title:0 "Israil'in Plani Reddedildi"
 TurkeyF.227.desc:0 "Türkiye'nin Yahudi Hükümeti bilinmeyen bir nedenle İsrail'i reddetti ve tüm ülke bu kararı çok tuhaf buluyor."
 TurkeyF.227.a:0 "Neden?"
 TurkeyF.228.title:0 "ABD'den Yardim Istiyorlar"
 TurkeyF.228.desc:0 "Büyüyen mafya tehdidiyle mücadelede önemli bir adım atan, MİT Başkanı Hakan Fidan liderliğindeki Türk hükümeti, organize suça karşı savaşı kazanmak için resmen ABD'den yardım ve destek istedi. Bu çağrı, ülkenin güçlü suç şebekelerinin yarattığı artan sorunlarla karşı karşıya kaldığı ve Türk makamlarının çabalarını güçlendirmek için uluslararası işbirliği aradığı bir dönemde geldi. Onlara destek verelim mi vermeyelim mi?"
 TurkeyF.228.a:0 "Hayır, Onlara Yardım Etmeyeceğiz!"
 TurkeyF.228.b:0 "Onlara Yardım Etmeye Hazırız!"
 TurkeyF.229.title:0 "ABD Askerî Yardim Sagladi"
 TurkeyF.229.desc:0 "Büyük bir dayanışma ve işbirliği gösterisiyle ABD, MİT Başkanı Hakan Fidan'ın öncülük ettiği mafyalara karşı savaşta Türkiye'ye güçlü destek verdi. İki ülkenin ortak taahhüdü, organize suçla mücadele etme ve vatandaşlarını suç şebekelerinin yaygın etkisinden koruma kararlılığını yansıtıyor."
