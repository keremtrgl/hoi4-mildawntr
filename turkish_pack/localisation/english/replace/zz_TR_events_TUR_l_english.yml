 Turkey.243.b:0 "Hayır, siyasi denge korunmalı"
 Turkey.244.title:0 "Kemal Dervis CHP'ye Katildi"
 Turkey.244.desc:0 "Derviş'in üyelik formunu imzalamasının ardından Genel Başkan Deniz Baykal parti rozetini yakasına taktı ve Kemal Derviş alkışlar arasında yakasında Altı Ok rozetiyle CHP üyesi oldu.\n\nDerviş bu sabah saat 10:30'da danışmanı Oya Ünlü ile birlikte CHP Genel Merkezi'ne geldi. Partiye gelişinde Genel Sekreter Yardımcısı Mehmet Sevigen tarafından karşılanan Derviş, orada bekleyen parti üyelerini de selamladı. \n\nKemal Derviş, saat 11:00'de düzenlenen törenle CHP'ye katıldı. Üyelik formunu imzalamasının ardından Genel Başkan Deniz Baykal parti rozetini yakasına taktı ve parti giriş formunu imzaladı.\n\nTörende konuşan Deniz Baykal şunları söyledi:\n\n"Derviş, CHP'nin eski bir üyesidir. Uzun bir sürecin ardından yeniden CHP'ye katılma kararı aldı. Şimdi hayatının yeni bir döneminde CHP üyesi olarak siyasi hayatımıza aktif olarak katılmaya karar verdi.\n\nBu karardan çok mutluyum. CHP'ye büyük güç katacak bir karardır. Ancak bu katılımın değerlendirilmesi gereken çok önemli bir yönü var.\n\nBu yalnızca bir parti içi olay değildir. Yalnızca arkadaşımızın CHP'ye katılmasından ibaret değildir. Türkiye'nin yenilenmesi yolunda büyük bir açılımın çıkış noktası olarak özel bir önem taşımaktadır.\n\nDerviş'in CHP'ye katılmasıyla Türkiye'de yeni bir oluşumun başladığını herkese gösteriyoruz. Türkiye artık yeni bir döneme giriyor. Türkiye'nin değişmesi ve yenilenmesi gerekiyor. Bir kriz dönemini hızla kapatıp Türkiye'yi güçlü, saygın ve onurlu bir ülke olarak dünyada hak ettiği yere taşımalıyız.\n\nDerviş'in kararı siyasi hayatta kişisel tatmin arayışıyla ilgili değildir. Türkiye'yi ileriye taşıma iddiasının gerçekleştirilmesi için zorunlu bir gereklilik olarak ortaya çıkmış bir karardır.\n\nCHP artık Türkiye'yi değiştirmek ve yenilemek isteyen herkesin katkıda bulunması ve sahiplenmesi gereken bir siyasi partidir. Derviş'in kararı bunun bir yansımasıdır.\n\nModern, rekabetçi bir sosyal piyasa ekonomisi olacak. Üreten ve ihraç eden bir ekonomi olacak. Ama yalnızca üreten ve rekabet eden bir ekonomi değil; bu ekonomide yaşayan insanların kaderine terk edilmediği, sosyal dayanışma anlayışı içinde geleceğe güvenle bakabildiği, ekonominin katı kurallarının yanında sosyal anlayışın insani yüzünün de ortaya çıkabildiği bir düzeni Türkiye'de kurmak zorundayız.\n\nBu hem mümkündür hem de zorunludur. Derviş'in her türlü yönlendirme çabasına ve baskıya maruz kalacağını, geldiğinde bunların üstesinden geleceğini bilerek bu noktaya geldiğini çok iyi biliyorum. Bu büyük mücadelesi ve doğru kararı için Derviş'i kutluyorum." Ardından söz alan Kemal Derviş şunları söyledi:\n\n"CHP, Türkiye'nin çok köklü bir kurumudur. Son 70 yılın tarihine baktığımızda, bazen aşılmaz görünen tüm zorluklara ve sorunlara rağmen her aşamada zor görevleri başarmış bir partidir. Sayın Genel Başkan Baykal'ın çağrısına katılıyorum. 21. yüzyıla girdik ama Türkiye'yi bu yüzyıla taşımak zorundayız. Toplumumuzda bu potansiyel var. Türkiye kesinlikle Avrupa'da güçlü ve müreffeh bir ülke olabilir. Ancak bu gücü harekete geçirebilmek için ekonomi, insan ve etkin devlet üçlüsünü bir araya getirerek bu modern sentezi gerçekleştirmeliyiz. Türkiye'yi geriye değil ileriye giden bir ülke yapabiliriz.\n\nBunun için yalnızca CHP'den değil, tüm Türk vatandaşlarından desteğe ihtiyacımız var. 3 Kasım seçiminden sonra bu sorunları çözecek güçlü bir çoğunluğa sahip bir ekip kuramazsak ve bu ekip gerçek bir uyum içinde çalışamazsa bu sorunlar ne yazık ki çözülmeyecek.\n\nBunun için eski kırgınlıkları geride bırakmalıyız. Hepimizin ortak geleceği budur. Bir araya gelebilirsek bu ağır krizin ardından çok daha aydınlık günlere birlikte yürüyebiliriz. Buna kesinlikle inanıyorum. 18 ay önce işin siyasi boyutunu tam olarak kavrayamamıştım; meseleye ekonomik açıdan bakıyordum. Siyasi parçalanmışlık içinde ciddi, hızlı ve etkili kararlar alacak bir yapı oluşturmak mümkün değil.\n\nElbette yarışacağız, ama bu yarışın sonunda istikrarlı bir tablo ortaya çıkmalı. Zor bir süreç oldu, ama CHP'yi dışlayan bir çözümü hiçbir zaman düşünmedim.\n\nKeşke merkezdeki ve soldaki tüm dostlarımız bir araya gelebilse. Önümüzdeki günlerde kucağımızı yeniden açacak, bu sentez çağrısını her gün yineleyeceğiz ve umarım bu sentezle çok net bir sonuca ulaşabiliriz; böylece ekonomik sorunlarımızın üstesinden gelebiliriz. Güçlü bir ekonomi olmadan güçlü bir ülke olamayız.""
 Turkey.244.a:0 "CHP için faydalı bir karar"
 Turkey.245.title:0 "2002 AKP Kapatma Davasi"
 Turkey.245.desc:0 "Yargıtay Cumhuriyet Başsavcısı Sabih Kanadoğlu, AK Parti'nin kapatılması istemiyle Anayasa Mahkemesi'nde dava açtı. Kanadoğlu ayrıca tedbir olarak Recep Tayyip Erdoğan'ın genel başkanlık görev ve yetkilerini kullanmasının engellenmesini talep etti.\n\nKanadoğlu iddianamesini bugün Anayasa Mahkemesi'ne gönderdi ve kapatma davasıyla ilgili bir açıklama yaptı.\n\nSabih Kanadoğlu açıklamasında şunları söyledi:\n\n"Adalet ve Kalkınma Partisi, Anayasa Mahkemesi'nin 9 Ocak 2002 tarihli kararının tebliğinden itibaren aldığı uyarıya rağmen 2820 sayılı Siyasi Partiler Kanunu'na tam olarak uymamıştır. Kanunun 104. maddesi uyarınca partinin kapatılması ve Recep Tayyip Erdoğan'ın genel başkanlık görev ve yetkilerini kullanmasının engellenmesi istemiyle Anayasa Mahkemesi'nde dava açtım."\n\n Davanın sonunda AKP kapatılmaktan kurtuldu."
