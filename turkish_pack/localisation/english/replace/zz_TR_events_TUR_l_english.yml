 Turkey.387.title:0 "Iki Rizelinin Hikâyesi"
 Turkey.387.desc:0 "İki Rizeli Rize'de bir araya geldi ve ülkenin durumunu konuştu. Geniş bir pencereden bakıldığında bu iki Rizeli Türkiye Cumhuriyeti devletinde derin izler bıraktı."
 Turkey.387.a:0 "Malatya'dan Sonra Sıra Rize'de"
 Turkey.388.title:0 "CHP ve IYI Parti Erken Seçim Çagrisi Yapti"
 Turkey.388.desc:0 "CHP Genel Başkanı Kemal Kılıçdaroğlu, İYİ Parti Genel Başkanı Meral Akşener'i ziyaret etti. İYİ Parti Genel Merkezi'ndeki ziyaretin ardından iki lider ortak açıklama yaptı.\n\nEkonomik durumun iyi olmadığını belirten Kılıçdaroğlu, "Türk lirası olağanüstü değer kaybediyor ama Türkiye'de çözüm üretecek kimse yok. Normalde Merkez Bankası'nın fiyat istikrarıyla ilgilenmesi gerekirken Merkez Bankası işlevini yitirmiş, Türk lirasının değer kaybına ve dövizin yükselişine seyirci kalan bir kurum konumuna düşmüştür" dedi.\n\nFiyat istikrarı için yasal olarak yetkili kurumun bu gidişata seyirci kalmaması gerektiğini söyleyen Kılıçdaroğlu, "Müdahale edemiyor, müdahale araçları yok, rezervi yok; 128 milyar doları buharlaştırdılar, hâlâ nereye gittiği belli değil. Net rezervi eksi 35 milyar dolar" dedi.\n\nEkonomik durum karşısında sessiz kalmanın doğru olmadığını belirten Kılıçdaroğlu, "Çözüm üretsinler, ekonominin gidişatıyla ilgili bir şey söylesinler diyoruz. Türk lirasının erimesini nasıl durduracaklar, birinin çıkıp bunu açıklamasını istiyoruz. Karşımızda bir duvar var, hiçbir açıklama yok" dedi.\n\nÜlke ekonomisinden kendilerini sorumlu hissettikleri için Akşener ile görüştüklerini söyleyen Kılıçdaroğlu, "Türk lirası eridikçe Türkiye ekonomik standartların tamamen altında kalmış yoksul bir ülke görüntüsü veriyor. Her şey ucuzladı; fabrikalar ucuzladı, kurumlar ucuzladı. Bütün ülkenin çok az bir dolara satın alınabileceği algısı oluştu. Onlara bir kez daha çağrıda bulunuyoruz.\n\nYönetemediğinizi biliyoruz. Ya Merkez Bankası'nın başına geçin, açıklama yapın; ya da 'Merkez Bankası'na müdahale etmeyi doğru bulmuyorum' diyorsanız müdahale etmeyin. Koca bir kurum yalnızca Türkiye'de değil dünyada da itibarsızlaştırıldı. Açık ve net bir şekilde kendisine çağrıda bulunuyorum: Yönetemiyorsunuz, milletin sırtına daha fazla yük bindirmeyin. Bu millet böyle bir yükü taşıyamaz. Türkiye bir an önce seçime gitmelidir" dedi."
 Turkey.388.a:0 "Muhalefet Saldırmayı Sürdürüyor"
 Turkey.389.title:0 "Binali Türk Konseyi'nin "Aksakal"i Oldu"
