 TurkeyF.239.a:0 "Bu da Ne?!"
 TurkeyPresidency.1.title:0 "Ahmet Necdet Sezer - Nevzat Yalçintas"
 TurkeyPresidency.1.desc:0 "2000 Türkiye cumhurbaşkanlığı seçimi, 27 Nisan 2000'deki ilk turun ardından 1 Mayıs'taki ikinci tur ve 5 Mayıs'taki üçüncü turdan oluştu. Seçim, 9. Cumhurbaşkanı Süleyman Demirel'in yedi yıllık görev süresinin sonunda yapıldı. Türkiye'nin cumhurbaşkanlığı sistemini beşer yıllık iki döneme dönüştürmek için küçük bir girişim oldu; bu Demirel'e üç yıl daha kazandıracaktı, ancak öneri hiçbir zaman geniş destek bulmadı.\n\nOylamaya giden aylarda mecliste en büyük beş partinin her biri gayriresmî olarak kendi adayını destekledi. Ancak hiçbir partinin belirleyici çoğunluğu olmadığından tarafsız bir uzlaşı adayı arandı ve sonunda Anayasa Mahkemesi eski Başkanı Ahmet Necdet Sezer'de karar kılındı. Sezer, iktidardaki Demokratik Sol Parti, Milliyetçi Hareket Partisi ve Anavatan Partisi'nin liderlerinin yanı sıra muhalefetteki Fazilet Partisi ve Doğru Yol Partisi'nin liderleri tarafından da desteklendi.\n\nBazı milletvekilleri parti çizgisinin dışına çıkarak kendilerini aday gösterdi. Bunlar arasında, yeterli destek bulamayarak ikinci turdan sonra çekilen TBMM Başkanı ve eski Başbakan Yıldırım Akbulut da vardı."
 TurkeyPresidency.1.a:0 "Kritik Bir An"
 TurkeyPresidency.2.title:0 "Abdullah Gül - Sabahattin Çakmakoglu"
 TurkeyPresidency.2.desc:0 "2007 Türkiye cumhurbaşkanlığı seçimi, Ahmet Necdet Sezer'in yerine ülkenin 11. cumhurbaşkanını seçmeye yönelik iki girişimi ifade eder. Cumhurbaşkanlığı için en güçlü aday Abdullah Gül'dü. Türkiye'de cumhurbaşkanlığı makamı ülkenin laik sisteminin bekçisi olarak görüldüğünden, Gül'ün eşinin başörtülü olması ve kendisinin siyasal İslam geçmişi seçimi bir siyasi krize dönüştürdü.\n\nİlk girişim, 27 Nisan'daki ilk tur ile Anayasa Mahkemesi'nin 27 Nisan'daki ilk turu iptal etmesinin ardından 6 Mayıs'ta yinelenen turdan oluştu. Anayasa Mahkemesi, muhalefet desteği olmadan imkânsız olan üçte iki toplantı yeter sayısının gerekli olduğuna hükmetti. Her iki ilk tur da oylamanın başlamasını engellemek için muhalefet milletvekillerince neredeyse tamamen boykot edildi. Bu nedenle iktidardaki Adalet ve Kalkınma Partisi (AKP), adayı Dışişleri Bakanı Abdullah Gül'ü seçtiremedi. AKP bunun üzerine 22 Temmuz 2007'de yapılan erken seçime gitti."
 TurkeyPresidency.2.a:0 "Kritik Bir An"
 TurkeyPresidency.3.title:0 "Recep Tayyip Erdogan - Ekmeleddin Ihsanoglu"
 TurkeyPresidency.3.desc:0 "Türkiye'de 12. Cumhurbaşkanı'nı seçmek için 10 Ağustos 2014'te cumhurbaşkanlığı seçimi yapıldı.\n\nSeçim, meclis üyelerince seçim yerine doğrudan halk oylamasını getiren 2007 anayasa referandumunun reformları çerçevesinde yapıldı. Türkiye'de ve yurt dışında 55 milyondan fazla kişi oy kullanma hakkına sahipti."
 TurkeyPresidency.3.a:0 "Kritik Bir An"
 TurkeyPresidency.4.title:0 "Nevzat Yalçintas'in Zaferi"
 TurkeyPresidency.4.desc:0 "Şaşırtıcı bir gelişmeyle Türk siyasetinde nispeten az tanınan bir isim olan Nevzat Yalçıntaş, 2000 cumhurbaşkanlığı seçiminde Türkiye Cumhurbaşkanı seçildi. Tüm beklentileri boşa çıkaran Yalçıntaş, Türkiye Büyük Millet Meclisi'nde dikkat çekici bir zafer elde etti.\n\nBaşarılı bir girişimci ve hayırsever olan Yalçıntaş'ın büyük bir siyasi partiyle bağlantısı olmaması, cumhurbaşkanlığına yükselişini daha da şaşırtıcı kıldı. Kampanyası birlik, ekonomik kalkınma ve ülkeyi uzun süredir rahatsız eden toplumsal sorunları çözme kararlılığı üzerine kuruluydu.\n\n2000 Türkiye cumhurbaşkanlığı seçimi yoğun siyasi rekabetlere ve önde gelen siyasi isimler arasında son derece çekişmeli bir yarışa sahne oldu. Çetin rekabete rağmen Yalçıntaş, müreffeh ve kapsayıcı bir Türkiye vizyonuyla milletvekillerinin gönlünü kazanmayı başardı.\n\nZaferini öğrenen Yalçıntaş, içten bir konuşma yaparak milletvekillerine güvenleri için teşekkür etti ve milletin refahı için yorulmadan çalışacağına söz verdi. Önündeki sorunların çözümünde işbirliğinin ve birliğin önemini vurguladı.\n\nGözlemciler ve analistler beklenmedik sonuç karşısında şaşkına döndü; pek çoğu Yalçıntaş'ın her kesimden insanla bağ kurabilme yeteneğini övdü. Partiler üstü yaklaşımı ve yönetime getirdiği taze bakış açısı, Türk halkının önemli bir kesiminde karşılık buldu.\n\nSeçilmiş Cumhurbaşkanı olarak görevine başlamaya hazırlanan Yalçıntaş, ülkeyi yeni bir refah ve ilerleme çağına taşıma sözü vererek Türkiye için dönüştürücü bir yolculuğa çıkacak."
 TurkeyPresidency.4.a:0 "İyi Haber"
 TurkeyPresidency.5.title:0 "Ahmet Necdet Sezer'in Zaferi"
 TurkeyPresidency.5.desc:0 "Ahmet Necdet Sezer, 2000 cumhurbaşkanlığı seçiminde kesin bir zaferle Türkiye'nin 10. Cumhurbaşkanı seçildi. Türkiye Büyük Millet Meclisi'ndeki oylamada Sezer, çeşitli siyasi partilerden geniş destek alarak önemli bir çoğunluk sağladı.\n\nSeçkin bir hukukçu ve Anayasa Mahkemesi eski Başkanı olan Ahmet Necdet Sezer, seçim sürecinde uzlaşı adayı olarak öne çıktı. Tarafsızlığı, dürüstlüğü ve hukukun üstünlüğüne bağlılığıyla tanınan Sezer, siyasi yelpazenin her kesiminde büyük saygı görüyordu.\n\nSeçim süreci boyunca Sezer, ülkenin laik değerlerini korumanın, demokratik kurumları muhafaza etmenin ve toplumsal uyumu geliştirmenin önemini vurguladı. Çeşitli kesimlerin kaygılarına değinerek tüm Türkler için birleştirici bir figür olacağına söz verdi.\n\nSeçim sonuçlarının açıklanmasının ardından seçilmiş Cumhurbaşkanı Sezer, mütevazı ve ileriye dönük bir konuşma yaparak milletvekillerinin kendisine duyduğu güvene teşekkür etti. Millete adalet ve şeffaflıkla hizmet etme kararlılığını yineledi ve daha güçlü, daha müreffeh bir Türkiye için çalışacağına söz verdi.\n\nAhmet Necdet Sezer'in zaferi Türkiye Cumhuriyeti için bir süreklilik ve istikrar anını temsil ediyor. Zengin hukuk deneyimi ve ilkeli yönetim anlayışı hem vatandaşlarda hem de uluslararası toplumda güven uyandırdı.\n\nYeni Cumhurbaşkanı olarak Sezer'in Türkiye vizyonu demokratik kurumları güçlendirmeye, insan haklarını geliştirmeye, ekonomik büyümeyi desteklemeye ve toplumsal eşitsizlikleri gidermeye odaklanıyor. Liderliğinin ülkenin daha fazla ilerleme ve kalkınma yolunu şekillendirmesi bekleniyor.\n\nCumhurbaşkanlığı seçiminin tamamlanmasıyla millet, Cumhurbaşkanı Ahmet Necdet Sezer'in rehberliğinde yeni bir sayfaya bakıyor. Umut, cumhurbaşkanlığının modern, kapsayıcı ve müreffeh bir Türkiye ideallerine bağlılıkla anılmasıdır."
 TurkeyPresidency.5.a:0 "İyi Haber"
 TurkeyPresidency.6.title:0 "Abdullah Gül'ün Zaferi"
 TurkeyPresidency.6.desc:0 "Abdullah Gül Türkiye Cumhurbaşkanı seçildi; bu sonuç AKP'nin Türk siyasetindeki artan etkisini yansıtıyor. Seçim süreci, bazı siyasi partilerin güçlü muhalefeti ve Türkiye'nin laik geleneklerinin korunmasına ilişkin endişeler nedeniyle zorlu geçti.\n\nGül, göreve başlama konuşmasında milletvekillerine kendisine duydukları güven için teşekkür etti ve Türk halkının refahı için yorulmadan çalışacağına söz verdi. Çoğulculuğa saygının ve ülkenin demokratik kurumlarını korumanın önemini vurguladı.\n\nCumhurbaşkanı olarak Gül'ün ekonomiyi güçlendirmek, eğitimi iyileştirmek ve toplumsal sorunları çözmek için iç reformlara odaklanması bekleniyor. Ayrıca kapsamlı diplomatik deneyiminin Türkiye'nin uluslararası arenadaki rolünü güçlendirmesi ve küresel ortaklarla bağları sağlamlaştırması öngörülüyor.\n\nAbdullah Gül'ün seçilmesi Türkiye'nin siyasi hayatında, milletin daha kapsayıcı ve müreffeh bir geleceğe yönelik değişen özlemlerini yansıtan kritik bir an. Görevi devralan Cumhurbaşkanı Gül, ülkenin demokratik ilkelerini korurken çeşitliliğe sahip bir toplumun karmaşıklıklarını yönetmeye hazırlanıyor.\n\nTürk halkı ve uluslararası toplum, Cumhurbaşkanı Abdullah Gül'ün görev süresinin başlamasını ve bu süre zarfında ülkeye getirebileceği olumlu dönüşümleri merakla bekliyor."
 TurkeyPresidency.6.a:0 "İyi Haber"
 TurkeyPresidency.7.title:0 "Sabahattin Çakmakoglu'nun Zaferi"
 TurkeyPresidency.7.desc:0 "Türkiye için tarihî bir anda Sabahattin Çakmakoğlu, 2007 cumhurbaşkanlığı seçiminde Türkiye Cumhuriyeti'nin 11. Cumhurbaşkanı seçildi. Türkiye Büyük Millet Meclisi'nde yapılan oylamada açık bir çoğunluk sağlayan Çakmakoğlu, cumhurbaşkanlığını kazanan bağımsız geçmişe sahip ilk aday oldu.\n\nSaygın bir akademisyen ve toplumsal reformcu olan Sabahattin Çakmakoğlu'nun herhangi bir siyasi partiye bağlı olmaması, onu önceki cumhurbaşkanı adaylarından ayırıyordu. Adaylığı, ülkenin geleceği için taze bir bakış açısı ve yeni fikirler arayan farklı kesimlerden vatandaşlar tarafından coşkuyla karşılandı.\n\nKampanyası boyunca Çakmakoğlu, sosyal refahın, eğitimin ve ekonomik büyümenin önemini vurgulayan dengeli bir yönetim anlayışını savundu. Farklı toplumsal kesimler arasında köprüler kurarak millî birlik ve uyum için çalışacağına söz verdi.\n\nZaferini öğrenen seçilmiş Cumhurbaşkanı Çakmakoğlu, heyecan verici bir konuşma yaparak milletvekillerine güvenleri ve destekleri için derin şükranlarını sundu. Türkiye halkına özveri, dürüstlük ve alçakgönüllülükle hizmet etme kararlılığını yineledi.\n\nÖnde gelen bir aydın ve vizyoner bir lider olan Çakmakoğlu'nun cumhurbaşkanlığının bir yenilik ve ilerleme dönemi başlatması bekleniyor. Türkiye'nin geleceğine yönelik kapsamlı vizyonu, sürdürülebilir ekonomik kalkınmayı destekleyecek stratejilerin yanı sıra eğitim, sağlık ve altyapı reformlarını da içeriyor.\n\nSabahattin Çakmakoğlu'nun seçilmesi, Türk siyasetinde değişim ve yenilenme arzusunu yansıtıyor. Partiler üstü duruşu ve akademik geçmişi, ülkenin sorunlarını pragmatik ve kapsayıcı bir yaklaşımla çözebilecek bir lider arayan pek çok vatandaşta karşılık buldu.\n\nYeni Cumhurbaşkanı olarak Çakmakoğlu yönetiminin insan haklarına, demokratik değerlere ve sosyal adalete öncelik vermesi bekleniyor. Türkiye'nin küresel arenadaki konumunu güçlendirmeye odaklanan Cumhurbaşkanı Sabahattin Çakmakoğlu, daha güçlü diplomatik bağlar kurmayı ve uluslararası işbirliğini geliştirmeyi hedefliyor.\n\nSabahattin Çakmakoğlu'nun Türkiye'nin 11. Cumhurbaşkanı olarak göreve başlamasıyla millet, ileri görüşlü bir aydın ve kendini işine adamış bir devlet adamının liderliğinde bir yenilik, ilerleme ve birlik dönemi bekliyor."
 TurkeyPresidency.7.a:0 "İyi Haber"
 TurkeyPresidency.8.title:0 "Recep Tayyip Erdogan'in Zaferi"
 TurkeyPresidency.8.desc:0 "Yakından izlenen ve merakla beklenen seçim sürecinde Recep Tayyip Erdoğan, 2014 Türkiye cumhurbaşkanlığı seçimini kazanarak Türkiye Cumhuriyeti'nin 12. Cumhurbaşkanı oldu. Türk vatandaşları oy kullanmak için sandık başına gitti ve Erdoğan'ın zaferi önemli bir çoğunlukla teyit edildi.\n\nEski Başbakan ve Adalet ve Kalkınma Partisi (AKP) Genel Başkanı Recep Tayyip Erdoğan, partisinin adayı olarak yarışa girdi. Cumhurbaşkanının ilk kez doğrudan halk oylamasıyla seçildiği bu seçimde adaylığı, Türk siyasi sisteminin dönüşümünü simgeledi.\n\nKampanyası boyunca Erdoğan, ekonomik büyümeye, sosyal refaha ve süregelen demokratikleşmeye vurgu yaparak güçlü ve müreffeh bir Türkiye vizyonunu öne çıkardı. Türk siyasetinde yeni bir dönemden söz ederek ülkenin laik ilkelerini korurken Türk halkının farklı ihtiyaçlarına cevap veren politikalar izleyeceğine söz verdi.\n\n2014 cumhurbaşkanlığı seçimi, hararetli tartışmalara ve farklı partilerden adayların yer aldığı çekişmeli bir yarışa sahne oldu. Yoğun rekabete rağmen Erdoğan'ın uzun siyasi deneyimi, başbakanlığı döneminde elde ettiği ekonomik başarılar ve toplumun pek çok kesimindeki popülerliği zaferini garantiledi.\n\nZafer konuşmasında seçilmiş Cumhurbaşkanı Erdoğan, kendisine ülkenin en yüksek makamını emanet eden Türk halkına teşekkür etti. Tüm vatandaşların özlemlerini gerçekleştirmek için özenle çalışacağına, ülke genelinde birliği ve kapsayıcılığı geliştireceğine söz verdi.\n\nCumhurbaşkanı olarak Erdoğan'ın gündeminin sosyoekonomik sorunlara, altyapı iyileştirmelerine ve Türkiye'nin küresel konumunu daha da güçlendirmeye odaklanması bekleniyor. Cumhurbaşkanlığı, ülkenin çeşitli sektörlerinde ilerlemeyi desteklerken istikrarı korumayı amaçlıyor.\n\nRecep Tayyip Erdoğan'ın Türkiye'nin 12. Cumhurbaşkanı seçilmesi, yönetimde sürekliliğe ve AKP'nin Türk siyasetindeki ağırlığının sürdüğüne işaret ediyor. Görevine başlayan Cumhurbaşkanı Erdoğan, Türk halkının beklentilerini karşılarken karmaşık bir jeopolitik ortamda yol almak zorunda kalacak.\n\nMillet, Cumhurbaşkanı Erdoğan'ın politikalarının etkisini ve görev süresi boyunca Türkiye'ye getirebileceği dönüşümü görmeyi bekliyor."
 TurkeyPresidency.8.a:0 "İyi Haber"
 TurkeyPresidency.9.title:0 "Ekmeleddin Ihsanoglu'nun Zaferi"
 TurkeyPresidency.9.desc:0 "Dikkat çekici ve eşi görülmemiş bir gelişmeyle saygın bir akademisyen ve diplomat olan Ekmeleddin İhsanoğlu, 2014 Türkiye cumhurbaşkanlığı seçiminde tarihî bir zafer kazanarak Türkiye Cumhuriyeti'nin 12. Cumhurbaşkanı oldu. İhsanoğlu'nun muhalefet partilerinin desteklediği ortak aday olması nedeniyle zaferi önceki seçimlerden belirgin bir kopuşu temsil ediyor.\n\nEkmeleddin İhsanoğlu'nun adaylığı, iktidardaki Adalet ve Kalkınma Partisi'ne (AKP) karşı birleşik bir cepheyi simgeleyen Cumhuriyet Halk Partisi (CHP) ile Milliyetçi Hareket Partisi (MHP) arasındaki bir ittifakın ürünüydü. Partiler üstü bir isim olan İhsanoğlu, millî birlik ve toplumsal uyumu önceliklendirirken Türkiye'nin demokratik değerlerini korumayı vaat ederek ülke için alternatif bir vizyon sundu.\n\nKampanyası boyunca İhsanoğlu, Türkiye'nin laik kimliğini korumanın, sivil özgürlükleri güvence altına almanın ve kapsayıcı, hoşgörülü bir toplumu geliştirmenin önemini vurguladı. İslam İşbirliği Teşkilatı (İİT) eski Genel Sekreteri ve uluslararası alanda tanınan bir bilim insanı olarak kendini geniş diplomatik deneyime ve çok taraflı işbirliğine bağlılığa sahip bir aday olarak sundu.\n\n2014 Türkiye cumhurbaşkanlığı seçimi son derece rekabetçi ve çekişmeli bir yarışa sahne oldu; İhsanoğlu'nun zaferi pek çok kişi tarafından önemli bir siyasi sürpriz olarak değerlendirildi. Parti çizgilerini aşarak toplumun geniş bir kesimine hitap edebilmesi, ülkenin en yüksek makamında birleştirici bir figür arayan vatandaşlarda karşılık buldu.\n\nZaferinin açıklanmasının ardından seçilmiş Cumhurbaşkanı İhsanoğlu, nazik bir konuşma yaparak muhalefet partilerine, Türk halkına ve milletvekillerine destekleri için teşekkür etti. Türkiye'nin sorunlarını çözmek ve daha parlak bir gelecek inşa etmek için yapıcı diyaloğa ve millî uzlaşıya duyulan ihtiyacı vurguladı.\n\nCumhurbaşkanı olarak İhsanoğlu yönetiminin ekonomik reformlara, sosyal refah programlarına ve demokratik kurumların güçlendirilmesine odaklanması bekleniyor. Kapsamlı diplomatik geçmişinin Türkiye'nin uluslararası itibarını artırmada ve küresel işbirliğini geliştirmede kritik bir rol oynaması öngörülüyor.\n\nEkmeleddin İhsanoğlu'nun seçilmesi, geniş tabanlı bir değişim arzusunu ve ülkenin laik ve demokratik değerlerini koruma kararlılığını simgeleyerek Türk siyasetinde bir dönüm noktasını temsil ediyor. Görevine başlayan Cumhurbaşkanı İhsanoğlu, Türkiye'yi birlik, refah ve yenilenmiş uluslararası angajman yoluna yönlendirmeye hazırlanıyor.\n\nMillet, Cumhurbaşkanı İhsanoğlu'nun liderliğinin etkisini ve görev süresi boyunca Türkiye'ye getirmesi beklenen olumlu dönüşümleri merakla bekliyor."
 TurkeyPresidency.9.a:0 "İyi Haber"
 TurkeyX.1.title:0 "Anarsist Ele Geçirme!"
 TurkeyX.1.desc:0 "Anarşistler sokaklara dökülerek mevcut hükümeti devirdi. Ancak Türk Silahlı Kuvvetleri sokağa inerek bu anarşistleri ezmek için ateş açtı. Uzun süren çatışmaların ardından silahlı kuvvetler batı bölgesinden çekildi. Anarşistler batı bölgesini yönetimleri altına aldı. Diğer tarafta orduyla direniş sürüyor."
 TurkeyX.1.a:0 "Onları yok etmeliyiz!"
 TurkeyM.1.title:0 "MIT Mafyalara Karsi Karsi Saldiri Baslatti!"
 TurkeyM.1.desc:0 "Türkiye, güçlü mafya grupları ile MİT Başkanı Hakan Fidan liderliğindeki hükümet güçleri arasında tırmanan gerginlikle birlikte eşi görülmemiş bir şiddet dalgasına sürüklendi. Bir zamanlar istikrarlı olan ülke, savaşan taraflar arasındaki çatışmaların ülke geneline kaos ve korku yaymasıyla kendini bir iç savaşın eşiğinde buldu.\n\nÇatışma, topraklar ve kaynaklar üzerinde hâkimiyet kurmaya çalışan organize suç örgütleri ile kanun ve düzeni korumaya kararlı hükümet güçleri arasındaki köklü rekabet ve güç mücadelelerinden doğdu. Şiddet yoğunlaştıkça masum siviller çapraz ateşte kaldı ve bu da yıkıcı bir insani krize yol açtı.\n\nHakan Fidan liderliğindeki Türkiye'nin Millî İstihbarat Teşkilatı MİT, mafyaların oluşturduğu tehdide karşı kararlı adımlar attı. Hükümet güçleri, suç şebekelerinin kökünü kazımak ve ekonominin ve yönetimin kritik sektörleri üzerindeki etkilerini kırmak için operasyonlar yürütüyor."
 TurkeyM.1.a:0 "Onları yok etmeliyiz!"
 TurkeyC.1.title:0 "Türk Iç Savasi"
 TurkeyC.1.desc:0 "Darbenin ardından iç çatışmalar hız kazandı. Kemalistler ve Erdoğan destekçileri sokaklarda silahlı mücadele başlattı. Silahlı mücadele sonucunda darbeciler geniş alanlar kaybetti. Birlikte savaşan isyancı Kemalistler ve Erdoğan destekçileri savaş stoklarımızın bir kısmını ele geçirdi. Böylece savaş iç çatışmadan iç savaşa dönüştü."
