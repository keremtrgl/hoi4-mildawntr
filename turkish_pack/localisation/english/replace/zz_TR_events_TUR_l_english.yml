 TurkeyAge.1.title:0 "Liderimiz Yaslaniyor"
 TurkeyAge.1.desc:0 "Yüksek Seçim Kurulu (YSK), liderimizin kendini tanıttığı fotoğrafın gerçeği yansıtmadığına karar verince fotoğrafın değiştirilmesi gerekti. Liderimiz yaşlı görünebileceği için oy kaybedebiliriz. Yapabileceğimiz bir şey yok; zamanla nesiller de liderler de değişir."
 TurkeyAge.1.a:0 "Kaçınılmaz"
 TurkeyAge.2.title:0 "Liderimiz Yaslaniyor"
 TurkeyAge.2.desc:0 "Yüksek Seçim Kurulu (YSK), liderimizin kendini tanıttığı fotoğrafın gerçeği yansıtmadığına karar verince fotoğrafın değiştirilmesi gerekti. Liderimiz yaşlı görünebileceği için oy kaybedebiliriz. Yapabileceğimiz bir şey yok; zamanla nesiller de liderler de değişir."
 TurkeyAge.2.a:0 "Kaçınılmaz"
 pkk_no_more.1.t:0 "PKK'nın Sonuna Dair Sevinç"
 pkk_no_more.1.desc:0 "Uzun süredir ülkemizin başına bela olan ve halkımızı katleden terör örgütlerine son verdik. Bunu ülkemizin ve halkımızın kararlılığı sayesinde başardık. Artık Türkiye'de yeni doğan çocuklar terör sorunlarıyla değil, özgürlükle büyüyecek."
 pkk_no_more.1.a:0 "Yaşasın Türk Milleti"
