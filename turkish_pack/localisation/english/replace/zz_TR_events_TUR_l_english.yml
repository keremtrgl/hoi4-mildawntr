 Turkey.121.title:0 "15 Temmuz Darbe Girisimi Basarisiz Oldu"
 Turkey.121.desc:0 "Türkiye'de hükümet ve Cumhurbaşkanı Recep Tayyip Erdoğan dahil olmak üzere devlet kurumlarına karşı bir darbe girişiminde bulunuldu. Girişim, Türk Silahlı Kuvvetleri içinde kendini Yurtta Sulh Konseyi olarak örgütleyen ve üyelerinin tamamı hiçbir zaman tespit edilemeyen bir hizip tarafından gerçekleştirildi. Ankara, İstanbul, Marmaris ve başka yerlerde Boğaziçi Köprüsü'nün Asya yakası girişi gibi birkaç kilit noktanın kontrolünü ele geçirmeye çalıştılar, ancak devlete sadık güçler onları yenince başarısız oldular. Konsey, darbenin gerekçeleri olarak laikliğin aşınmasını, demokratik yönetimin ortadan kaldırılmasını, insan haklarının hiçe sayılmasını ve Türkiye'nin uluslararası arenada itibar kaybetmesini gösterdi. Hükümet, darbe liderlerinin Türkiye Cumhuriyeti tarafından terör örgütü olarak tanımlanan ve Pensilvanya'da yaşayan Türk iş insanı ve din adamı Fethullah Gülen liderliğindeki Gülen hareketiyle bağlantılı olduğunu açıkladı. Türk hükümeti darbenin arkasında Gülen'in olduğunu (Gülen bunu reddetti) ve ABD'nin onu barındırdığını iddia etti. Darbe girişimini çevreleyen olaylar ve ardından gelen tasfiyeler, Türkiye'deki İslamcı elitler arasındaki karmaşık bir güç mücadelesini yansıtır.\n\nDarbe girişimi sırasında 300'den fazla kişi hayatını kaybetti ve 2.100'den fazla kişi yaralandı. Türkiye Büyük Millet Meclisi ve Cumhurbaşkanlığı Külliyesi dahil pek çok devlet binası havadan bombalandı. Ardından en az 10.000 asker ve nedeni hâlâ belirsiz olan 2.745 hâkim dahil en az 40.000 kişinin gözaltına alındığı toplu gözaltılar yaşandı. Hükümetin Gülen'e sadık olduklarını açıklamasının ardından 15.000 eğitim personeli görevden uzaklaştırıldı ve özel kurumlarda çalışan 21.000 öğretmenin ruhsatı iptal edildi. Gülen'le bağlantıları olduğu yönündeki raporlar nedeniyle 77.000'den fazla kişi tutuklandı ve 160.000'den fazla kişi işinden çıkarıldı.\n\nOlaya hem yurt içinde hem de uluslararası alanda verilen tepkiler büyük ölçüde darbe girişimine karşıydı. Türkiye'deki ana muhalefet partileri girişimi kınadı; ABD, NATO, Avrupa Birliği ve komşu ülkeler gibi pek çok uluslararası lider ise "Türkiye'deki demokratik kurumlara ve seçilmiş yetkililerine saygı gösterilmesi" çağrısında bulundu. Uluslararası kuruluşlar da darbeye karşı tavır aldı. Ancak Birleşmiş Milletler Güvenlik Konseyi, bir açıklamanın ifadesi konusundaki anlaşmazlıklar nedeniyle darbeyi kınamadı.\n\nCumhurbaşkanı Recep Tayyip Erdoğan, Pentagon'un Türkiye'deki muhataplarının tutuklanması nedeniyle Türk hükümetini eleştiren ABD Merkez Kuvvetler Komutanı Orgeneral Joseph Votel'in "darbecilerin yanında yer aldığını" söyledi."
 Turkey.121.a:0 "Zafer!"
