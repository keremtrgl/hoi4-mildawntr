 Turkey.163.title:0 "Suriye Saldirisi!"
 Turkey.163.desc:0 "27 Şubat 2020'de, Bahar Kalkanı Harekâtı öncesinde İdlib'deki çatışmaların zirvesindeyken, Suriye Hava Kuvvetleri ve bildirildiğine göre Rus Hava Kuvvetleri, İdlib vilayetindeki Belyun'da bir Türk askeri konvoyuna iki hava saldırısı düzenledi. Türkiye Cumhurbaşkanı Recep Tayyip Erdoğan'a göre saldırılarda 34 Türk askeri şehit oldu; Türk hükümetine yakın diğer kaynaklar ise ölü sayısının 50-100'e kadar çıktığını bildirdi. Bu, Türkiye'nin Suriye İç Savaşı'na müdahil olmasından bu yana Türk kuvvetlerine yönelik en kanlı saldırıydı. Ayrıca 36 ile 60 arasında asker yaralandı ve bunlardan 16'sının durumunun ağır olduğu bildirildi."
