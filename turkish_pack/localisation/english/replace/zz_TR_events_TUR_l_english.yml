 Turkey.390.a:0 "İstifa Edip Siyasete Atılmalı"
 Turkey.390.b:0 "Silahlı Kuvvetlerde Daha Faydalı"
 Turkey.391.title:0 "Akaryakittaki Büyük Zamlar Kuyruklara Yol Açti"
 Turkey.391.desc:0 "Dolardaki yükselişin ardından benzine 52 kuruş, motorine 50 kuruş, LPG'ye 45 kuruş zam geldi. Gece yarısından itibaren geçerli olan zam öncesinde akaryakıt istasyonlarında kuyruk oluştu."
 Turkey.391.a:0 "Akaryakıt Krizi!"
 Turkey.392.title:0 "Nahçivan Anlasmasi (Türk Birligi'nin Kurulusu)"
 Turkey.392.desc:0 "Nahçıvan Anlaşması 3 Ekim 2009'da imzalandı. Türk Dili Konuşan Ülkeler Devlet Başkanları Zirvesi'ne katılan Azerbaycan, Kazakistan, Kırgızistan ve Türkiye tarafından imzalanan anlaşma, Türk Birliği'nin kuruluşunun ön koşuludur. Anlaşmanın temel amacı, katılımcı devletler arasındaki işbirliğinin kurumsallaştırılmasıdır. Bu anlaşmayla Türk Birliği adlı uluslararası bir örgütün kurulmasına karar verildi. Azerbaycan Cumhurbaşkanı İlham Aliyev'in ev sahipliğindeki zirveye Türkiye Cumhurbaşkanı Abdullah Gül, Kazakistan Cumhurbaşkanı Nursultan Nazarbayev, Kırgızistan Cumhurbaşkanı Kurmanbek Bakiyev ve Türkmenistan Devlet Başkan Yardımcısı Hocamırat Saparlıyev katıldı."
 Turkey.392.a:0 "Başlıyoruz!"
 Turkey.392.b:0 "Başlıyoruz! §Y(Sessiz)§!"
