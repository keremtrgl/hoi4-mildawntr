 Turkey.168.title:0 "Ayasofya Meselesi"
 Turkey.168.desc:0 "İstanbul'un fethinin ardından Fatih Sultan Mehmet tarafından camiye dönüştürülen Ayasofya, 24 Kasım 1934 tarihli Bakanlar Kurulu kararıyla müzeye dönüştürülmüştü. Danıştay kararının ardından Ayasofya Camii'nin yönetiminin Diyanet İşleri Başkanlığı'na devredilerek ibadete açılmasına ilişkin Cumhurbaşkanı kararı Resmî Gazete'de yayımlandı. Cumhurbaşkanı Recep Tayyip Erdoğan, Ayasofya'nın ibadete açılacağını duyurdu."
