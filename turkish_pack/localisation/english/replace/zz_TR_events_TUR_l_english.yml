 Turkey.246.title:0 "AKP Mitingleri"
 Turkey.246.desc:0 "AKP mitinglerinde büyük ilgi gördü ve ilgiyle birlikte oyları da arttı. Anketlere göre AKP iktidara gelecek yeni parti."
