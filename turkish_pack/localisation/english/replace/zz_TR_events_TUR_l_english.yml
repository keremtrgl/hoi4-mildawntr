 TurkeyNATO.5.title:0 "ABD Bizi Destekliyor"
 TurkeyNATO.5.desc:0 "ABD, kendi çıkarlarını koruma doğrultusunda bizi destekleme kararı aldı. Bu maddi ve manevi destekle bu iç savaştan galip çıkabiliriz. Yaşasın yardımcı kuvvetler!"
