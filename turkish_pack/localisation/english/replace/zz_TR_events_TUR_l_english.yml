 TurkeyF.74.desc:0 "Türkiye sınırlarımıza asker yığdı ve doğrudan teslim olmamızı talep etti. Teslim olmazsak Türkiye ile büyük bir savaşa gireceğiz. Efendim, teslim mi olalım, direnmeye mi devam edelim?"
 TurkeyF.74.a:0 "Sonuna Kadar Kendimizi Savunacağız"
 TurkeyF.74.b:0 "Direnme Şansımız Yok"
 TurkeyF.75.title:0 "Irak Taleplerimizi Reddetti"
 TurkeyF.75.desc:0 "Irak teslim olmayacağını açıkladı. Karşılığında Irak'a savaş ilan edeceğiz. Irak petrolü bizim olacak!"
 TurkeyF.75.a:0 "O Zaman Onları İşgal Edeceğiz"
 TurkeyF.76.title:0 "Türkiye Yunanistan'da Darbe Düzenledi"
 TurkeyF.76.desc:0 "Milliyetçi kesim ülkenin tüm yönetim araçlarını ele geçirdi. Bu askerî darbenin açıkça Türkiye tarafından organize edildiği belli. Milliyetçi kesim Türkiye'nin kuklası oldu. Özgürlüğümüzü kaybettik!"
 TurkeyF.76.a:0 "Her Şeyi Kaybettik!"
