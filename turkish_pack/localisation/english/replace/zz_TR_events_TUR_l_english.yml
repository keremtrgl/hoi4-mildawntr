 Turkey.153.b:0 "Seçimlere hile karıştı! Seçim yenilensin! §Y(Konuşmasız)§!"
 Turkey.155.title:0 "Istanbul Büyüksehir Belediye Baskanligi Seçimi"
 Turkey.155.desc:0 "Haziran 2019 İstanbul Büyükşehir Belediye Başkanlığı seçimi 23 Haziran 2019'da yapıldı. Bu seçim, Yüksek Seçim Kurulu (YSK) tarafından 6 Mayıs 2019'da iptal edilen Mart 2019 belediye başkanlığı seçiminin yenilenmesiydi. İlk seçim muhalefet adayı Ekrem İmamoğlu'nun %0,2'lik kıl payı farkla kazanmasıyla sonuçlanmış ve iktidardaki Adalet ve Kalkınma Partisi (AKP) seçimin yenilenmesi için başvurusunda başarılı olmuştu. \n\nMillet İttifakı (Cumhuriyet Halk Partisi (CHP) ve İYİ Parti'den oluşan) ilk adayı Ekrem İmamoğlu'nu yeniden aday gösterdi; İmamoğlu "Her Şey Çok Güzel Olacak" sloganıyla olumlu bir kampanya yürüttü. İktidardaki Cumhur İttifakı (AKP ve Milliyetçi Hareket Partisi'nden oluşan) ilk seçimde başarısız olan adayı Binali Yıldırım'ı yeniden aday gösterdi. İttifak dışındaki Halkların Demokratik Partisi (HDP) kendi adayını çıkarmadı ve İmamoğlu'nu desteklediğini açıkladı. Seçimde iki ana aday arasında, Türkiye'de 2002'den bu yana bir ilk olan televizyon tartışması yapıldı. Kampanya büyük ölçüde Mart 2019'daki ilk seçim sırasında ve sonrasında yaşanan usulsüzlüklere ilişkin karşılıklı suçlamalara odaklandı; iki taraf da diğerinin oyunlarına kurban gittiğini iddia etti.\n\nSonuçlar İmamoğlu lehine büyük bir kayma gösterdi: İmamoğlu ilk seçimdeki 13.700 oyluk farkı 57 kat artırarak Yıldırım'ın %45,0'ına karşılık oyların %54,2'sini aldı. Muhalefetin zaferi, çok daha dar bir fark öngören kamuoyu yoklamalarını boşa çıkardı ve hem oy sayısı hem de oy oranı bakımından İstanbul yerel seçim tarihinde bir rekor oldu. İmamoğlu ayrıca İstanbul'un 39 ilçesinden 28'inde birinci oldu. Yıldırım ise Mart'ta kazandığı 11 ilçeyi kaybetti, önceki oy oranında yüzde 4 düşüş yaşadı ve ilk sonuçlar açıklandıktan kısa süre sonra yenilgiyi kabul etti. Sonuç, bir zamanlar partisinin "İstanbul'u kaybederse Türkiye'yi kaybedeceğini" söyleyen Cumhurbaşkanı Recep Tayyip Erdoğan için büyük bir darbe olarak görüldü. Yorumcular sonucu Erdoğan'a, büyük ölçüde demokrasi dışı bir manevra olarak görülen Mart seçiminin iptaline, ekonomik kötü yönetime ve olumsuz kampanyaya karşı bir tepki olarak değerlendirdi. Sonuç ayrıca HDP seçmenlerini seçimi boykot etmeye ikna etmek amacıyla yasa dışı Kürdistan İşçi Partisi'nin (PKK) cezaevindeki lideri Abdullah Öcalan'ı sürece dahil etme yönündeki son dakika hükümet girişiminin geri tepmesi olarak da görüldü. \n\nMuhalefetin ezici zaferi Erdoğan için "sonun başlangıcı" olarak nitelendirildi; uluslararası yorumcular seçimin yenilenmesini, bir sonraki planlı cumhurbaşkanlığı seçiminde olası bir İmamoğlu adaylığının önünü açan büyük bir hükümet hesap hatası olarak değerlendirdi. Hükümetin yenilgisinin boyutunun bir kabine değişikliğine ve hâlen Haziran 2023 için planlanan genel seçimlerin öne çekilmesine yol açabileceği düşünülüyor."
 Turkey.155.a:0 "AKP İçin Bir Gerileme"
