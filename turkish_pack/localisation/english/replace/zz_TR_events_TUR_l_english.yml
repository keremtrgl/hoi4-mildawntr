 Turkey.175.title:0 "2020 Ege Denizi Depremi"
 Turkey.175.desc:0 "Moment büyüklüğü 7,0 olan İzmir depremi, 30 Ekim 2020 Cuma günü Yunanistan'ın Sisam Adası'nın yaklaşık 14 km (8,7 mil) kuzeydoğusunda meydana geldi. Depremin ardından pek çok bina ağır hasar gördü veya çöktü; Yunanistan'ın Karlovasi kasabasındaki Meryem'in Göğe Kabulü Kilisesi kısmen yıkılırken depremden ağır etkilenen İzmir'de onlarca bina hasar gördü ya da tamamen çöktü. İki ülkenin acil durum ekipleri hemen olay yerine ulaştı ve kurtarma çalışmaları gece boyunca sürdü. İzmir'de 117 kişinin hayatını kaybettiği, 1.034 kişinin yaralandığı biliniyor. \n\nYunanistan'da ise iki kişi daha hayatını kaybetti, on dokuz kişi hafif yaralandı. Deprem, 1981'den bu yana Ege Denizi'ndeki en güçlü ve 1955'te dört kişinin öldüğü 6,6 büyüklüğündeki depremden bu yana İzmir'deki en ölümcül deprem oldu. Aynı zamanda 2020 yılının en ölümcül depremiydi."
 Turkey.175.a:0 "Olamaz!"
 Turkey.177.title:0 "2020 Bingöl Depremi"
 Turkey.177.desc:0 "2020 Bingöl depremi 14 Haziran'da saat 17:24'te Türkiye'de meydana geldi. Depremin büyüklüğü 5,8 Mw olarak belirlendi. Depremin merkez üssü Bingöl'ün Karlıova ilçesine bağlı Kaynarpınar köyüne yakındı ve komşu iller Erzurum, Diyarbakır, Elazığ ve Muş'ta da hissedildi. Depremin ardından en büyüğü 5,5 Mw olmak üzere 392 artçı sarsıntı kaydedildi."
 Turkey.177.a:0 "Olamaz!"
 Turkey.178.title:0 "2020 Iran-Türkiye Depremleri"
 Turkey.178.desc:0 "2020 İran-Türkiye depremlerinin ilki ve en yıkıcısı 23 Şubat'ta Türkiye sınırına yakın kuzeybatı İran'daki Hoy yakınlarında meydana geldi ve Van'ın Başkale ilçesinde 9 kişinin ölümüne yol açtı. İran Sismoloji Merkezi'ne (IRSC) göre deprem sabah 9:23'te 6 kilometre (3,7 mil) derinlikte 5,8 Mw büyüklüğünde meydana geldi ve merkez üssü Kotur bölgesiydi. Yaklaşık 10 saat sonra aynı bölge 6,0 Mw büyüklüğünde başka bir büyük depremle sarsıldı."
 Turkey.178.a:0 "Olamaz!"
 Turkey.179.title:0 "2020 Elazig Depremi"
 Turkey.179.desc:0 "2020 Elazığ depremi 24 Ocak'ta saat 20:55'te Türkiye'de meydana geldi. Depremin büyüklüğü 6,7 Mw olarak belirlendi. Merkez üssü Elazığ'ın Sivrice ilçesine yakındı ve komşu iller Diyarbakır, Malatya ve Adıyaman ile komşu ülkeler Ermenistan, Suriye ve İran'da da hissedildi. Kandilli Rasathanesi depremin büyüklüğünü 6,5 Mw olarak açıkladı. Toplam 41 kişi hayatını kaybetti, 1.600'den fazla kişi yaralandı."
 Turkey.179.a:0 "Olamaz!"
 Turkey.180.title:0 "2019 Istanbul Depremi"
 Turkey.180.desc:0 "2019 İstanbul depremi, 26 Eylül 2019'da saat 13:59'da İstanbul'un güneybatısını sarsan 5,8 büyüklüğünde bir depremdi. Bir kişi kalp krizi nedeniyle hayatını kaybetti, 43 kişi yaralandı. Deprem İstanbul, Tekirdağ, Kırklareli, Kocaeli ve Sakarya'da hissedildi."
 Turkey.180.a:0 "Olamaz!"
 Turkey.182.title:0 "2017 Ege Denizi Depremi"
 Turkey.182.desc:0 "21 Temmuz 2017'de Türkiye'nin Bodrum ilçesinin yaklaşık 10 km (6,2 mil) güney-güneydoğusunda 7,0 km derinlikte 6,6 büyüklüğünde bir deprem meydana geldi. Yunanistan'ın İstanköy Adası'nda iki kişi hayatını kaybetti ve 120'den fazla kişi yaralandı; Türkiye'de ise en az 360 yaralı bildirildi."
 Turkey.182.a:0 "Olamaz!"
 Turkey.184.title:0 "2014 Ege Denizi Depremi"
 Turkey.184.desc:0 "24 Mayıs 2014'te Yunanistan ile Türkiye arasındaki Kuzey Ege Denizi'nde bir deprem meydana geldi. Depremin moment büyüklüğü 6,9, en yüksek Mercalli şiddeti VIII (Şiddetli) idi. Türkiye'nin Gökçeada'sında, Edirne ve Çanakkale'de ve Yunanistan'ın Limni Adası'nda ciddi hasar bildirildi. Deprem Bulgaristan'da ve Romanya'nın güneyinde de hissedildi. Ana şoku birkaç artçı sarsıntı izledi; en güçlüsü 5,3 ML büyüklüğündeydi ve saat 12:31'de Saros Körfezi'nde meydana geldi."
 Turkey.184.a:0 "Olamaz!"
 Turkey.186.title:0 "2011 Van Depremleri"
 Turkey.186.desc:0 "2011 Van depremleri, Türkiye'nin doğusunda Van kenti yakınlarında meydana geldi. İlk deprem 23 Ekim'de yerel saatle 13:41'de oldu. Sarsıntının Mww büyüklüğü 7,1, en yüksek Mercalli şiddeti VIII (Şiddetli) idi. Sığ bir derinlikte meydana gelen deprem, Doğu Türkiye'nin büyük bölümünde şiddetli sarsıntıya, Güney Kafkasya ve Levant'ın komşu bölgelerinde ise daha hafif sarsıntılara yol açtı. Afet ve Acil Durum Yönetimi Başkanlığı'nın 30 Ekim tarihli açıklamasına göre deprem 604 kişinin ölümüne ve 4.152 kişinin yaralanmasına neden oldu. Bölgede en az 11.232 bina hasar gördü ve bunlardan 6.017'si oturulamaz durumda bulundu. Oturulamaz hâle gelen evler, ortalama hane büyüklüğü yaklaşık 7,6 kişi olan 8.321 haneyi ilde evsiz bıraktı; bu da en az 60.000 kişinin evsiz kaldığı anlamına geliyordu. Diğer 5.215 bina hasarlı ancak oturulabilir durumdaydı. Aynı fay sistemi içindeki ayrı bir deprem 9 Kasım'da saat 21:23'te meydana geldi; 9 Kasım depreminde 40 kişi hayatını kaybetti, 260 kişi yaralandı."
 Turkey.186.a:0 "Olamaz!"
 Turkey.188.title:0 "2011 Kütahya Depremi"
 Turkey.188.desc:0 "2011 Kütahya depremi, 19 Mayıs'ta saat 23:15'te batı Türkiye'nin kalabalık bir bölgesinin yakınlarında 5,8 moment büyüklüğünde ve en yüksek Mercalli şiddeti VII (Çok güçlü) olarak meydana geldi. Merkez üssü Simav'ın hemen doğusunda olan deprem tahminen 9,1 kilometre (5,7 mil) derinlikte meydana geldi ve Kütahya'nın büyük bölümünde güçlü sarsıntıya yol açtı. Halkın büyük kısmı paniğe kapıldı ve Simav'ın büyük bölümünde elektrikler kesildi. Simav'daki bir hastane yaralı sayısının bilinmediğini bildirdi ve bazı binalar hasar gördü. İnegöl'de yaşlı bir kadın sarsıntının hemen ardından kalp krizi geçirdi ve daha sonra hayatını kaybettiği doğrulandı. Simav'da bir kişi beton bir blok çarpması sonucu öldü. Depremi 450'den fazla hafif artçı sarsıntı izledi; en güçlüsü 4,6 büyüklüğündeydi."
 Turkey.188.a:0 "Olamaz!"
 Turkey.189.title:0 "2010 Elazig Depremi"
 Turkey.189.desc:0 "2010 Elazığ depremi, 8 Mart 2010'da saat 02:32'de meydana gelen 6,1 Mw büyüklüğünde bir depremdi. Merkez üssü Türkiye'nin doğusundaki Elazığ iline bağlı Başyurt'tu. Uluslararası medyadaki ilk haberler 57 kişinin hayatını kaybettiğini bildirdi. 10 Mart itibarıyla Türk medyası ölü sayısını 41 olarak açıkladı; bu sayı daha sonra 42'ye yükseldi. 74 kişi daha yaralandı; bunların çoğu binalardan düşerek ya da atlayarak yaralandı. Sokaklardaki izdiham da başka yaralanmalara yol açtı. Deprem, İnşaat Mühendisleri Odası'nın yetersiz yapı projelerini ayrıntılandıran ve önümüzdeki otuz yıl içinde bir noktada İstanbul'un on binlerce kişinin ölümüne yol açabilecek bir depremle yıkılabileceği uyarısında bulunan bir raporu Meclis'e göndermesinden tam bir hafta sonra yaşandı."
 Turkey.189.a:0 "Olamaz!"
 Turkey.193.title:0 "2004 Dogubayazit Depremi"
 Turkey.193.desc:0 "2004 Doğubayazıt depremi, 2 Temmuz 2004'te yerel saatle 01:30'da Ağrı'nın Doğubayazıt ilçesini sarsan 5,1 veya 5,2 Mw büyüklüğünde bir depremdi. 18 kişi hayatını kaybetti, 32 kişi yaralandı. En büyük hasar Yığıncal köyünde oldu; Kutlubulak ve Sağlıksuyu köyleri de etkilendi. Kandilli Rasathanesi yaklaşık 1.000 binanın hasar gördüğünü açıkladı. Deprem Ağrı, Iğdır, Kars ve İran-Türkiye sınırına yakın bölgelerde hissedildi. Sarsıntının şiddeti VII, derinliği 5 km olarak bildirildi. Deprem, köylülerin dağlarda olduğu yayla mevsiminde meydana geldiği için daha fazla can kaybı yaşanmadı. Çeşitli kuruluşlar bölgeye yardım gönderdi. Türk hükümetinden üç bakan bölgeyi ziyaret etti, Yunanistan yardım teklif etti ve Fransa dayanışma mesajları gönderdi."
 Turkey.193.a:0 "Olamaz!"
 Turkey.195.title:0 "2003 Bingöl Depremi"
 Turkey.195.desc:0 "2003 Bingöl depremi, 1 Mayıs'ta saat 03:27'de 6,4 moment büyüklüğü ve IX (Yıkıcı) en yüksek Mercalli şiddetiyle Doğu Türkiye'yi vurdu. Bu doğrultu atımlı depremin merkez üssü Bingöl'ün 15 km kuzeyindeydi. En az 177 kişi hayatını kaybetti ve etkilenen bölgede 625 bina çöktü ya da ağır hasar gördü. Ölümlerin seksen dördü, Çeltiksuyu'ndaki bir yatılı okulun yurt binasının çökmesiyle yaşandı."
 Turkey.195.a:0 "Olamaz!"
 Turkey.197.title:0 "2002 Afyon Depremi"
 Turkey.197.desc:0 "Batı Türkiye'deki Afyon ili, 23 Şubat 2002'de saat 10:11'de 6,5 Mw büyüklüğünde bir depremle sarsıldı. Deprem, Değiştirilmiş Mercalli şiddet ölçeğine göre VIII (Şiddetli) en yüksek hissedilen şiddete sahipti. Yüzlerce bina hasar gördü; 44 kişi hayatını kaybetti, 318 kişi yaralandı."
 Turkey.197.a:0 "Olamaz!"
 Turkey.198.title:0 "AKP Mitingleri"
 Turkey.198.desc:0 "AKP birçok yerde seçim mitingleri düzenlemeye başladı. Görünüşe göre bir sonraki seçim çetin geçecek."
 Turkey.198.a:0 "Bu seçim ilginç olacak"
 Turkey.199.title:0 "CHP Mitingleri"
 Turkey.199.desc:0 "CHP birçok yerde seçim mitingleri düzenlemeye başladı. Görünüşe göre bir sonraki seçim çetin geçecek."
 Turkey.199.a:0 "Bu seçim ilginç olacak"
 Turkey.200.title:0 "Muharrem Ince CHP'nin Cumhurbaskani Adayi Oldu"
 Turkey.200.desc:0 "Muharrem İnce resmen Cumhuriyet Halk Partisi'nin adayı oldu. CHP Grubu'nda yapılan gizli oylamada 110 milletvekili oybirliğiyle Muharrem İnce'yi CHP'nin cumhurbaşkanı adayı ilan etti. Kararın açıklanmasının ardından ilk açıklamasını yapan İnce basın mensuplarına şöyle dedi: "Dün zamanı gelince açıklayacağımı söylemiştim, o da esprili bir şekilde 'Geldiğinde' diye karşılık verdi." Muharrem İnce, tam da bugün, 4 Mayıs 1964'te doğdu; yani CHP'den doğum gününde cumhurbaşkanı adayı gösterildi. Kılıçdaroğlu, İnce'nin adaylığı için "tarih yazacağız" dedi."
 Turkey.200.a:0 "Muhalefet yol haritasını açıklıyor"
 Turkey.201.title:0 "Gelecek Partisi'nin Kurulusu"
 Turkey.201.desc:0 "Gelecek Partisi, muhafazakâr Adalet ve Kalkınma Partisi'nden (AKP) eski dışişleri bakanı ve başbakan Ahmet Davutoğlu tarafından 12 Aralık 2019'da kuruldu. Cumhurbaşkanı Recep Tayyip Erdoğan'ın desteğiyle 28 Ağustos 2014'te başbakan olan Davutoğlu, daha sonra Erdoğan'ın Türkiye'nin yönetim sistemini parlamenter sistemden başkanlık sistemine dönüştürme girişimlerine karşı çıktı. Erdoğan ile yaşadığı çatışma, 22 Mayıs 2016'dan itibaren geçerli olmak üzere başbakanlıktan istifasıyla sonuçlandı. İstifasının ardından Davutoğlu AKP hükümetini sık sık eleştirdi ve parti hakkında disiplin süreci başlattı. Buna karşılık Davutoğlu 13 Eylül 2019'da AKP'den istifa etti. Daha sonra Cumhurbaşkanı Erdoğan yönetimine muhalif yeni bir parti kurma niyetini dile getirdi ve 12 Aralık 2019'da Gelecek Partisi'ni kurdu. Yeni parti hemen çok sayıda eski AKP yöneticisi ve mensubunu içeren 154 kişilik kurucu üye listesini yayımladı."
 Turkey.201.a:0 "AKP için bir kayıp"
 Turkey.202.title:0 "DEVA'nin Kurulusu"
 Turkey.202.desc:0 "DEVA Partisi, Recep Tayyip Erdoğan'ın Adalet ve Kalkınma Partisi'nden ayrılan eski Başbakan Yardımcısı Ali Babacan tarafından kurulan bir Türk siyasi partisidir. Parti hâlen Türkiye Büyük Millet Meclisi'nde, kurucularından Milletvekili Mustafa Yeneroğlu'nun sahip olduğu tek bir sandalyeyle temsil edilmektedir."
 Turkey.202.a:0 "AKP için bir kayıp"
 Turkey.203.title:0 "Memleket Partisi'nin Kurulusu"
 Turkey.203.desc:0 "Muharrem İnce CHP'den ayrılarak kendi partisini kurdu. Partinin adı Memleket Partisi'dir ve parti Kemalist ideallere sahiptir."
 Turkey.203.a:0 "CHP için bir kayıp"
 Turkey.204.title:0 "CHP'nin Yeni Cumhurbaskani Adayi"
 Turkey.204.desc:0 "CHP'nin Ankara ve İstanbul belediye başkanları ülke genelinde popüler oldu. Ekrem İmamoğlu'nu ya da Mansur Yavaş'ı cumhurbaşkanı adayı yapabiliriz. Seçim sizin."
 Turkey.204.a:0 "Mansur Yavaş"
 Turkey.204.b:0 "Ekrem İmamoğlu"
 Turkey.205.title:0 "IYI Parti'nin Konusmasi"
 Turkey.205.desc:0 "İYİ Parti ülkemizdeki sefalete dikkat çekerek bizi yerden yere vurdu. Ekonominin gidişatı bizi çok daha kötü yerlere götürebilir."
 Turkey.205.a:0 "Bu kulağa kötü geliyor"
 Turkey.206.title:0 "Erken Milletvekili Seçimi Yolda"
 Turkey.206.desc:0 "Erken milletvekili seçimi kararı kabul edildi. Seçim hazırlıkları başladı."
 Turkey.206.a:0 "Haydi bakalım!"
 Turkey.207.title:0 "Türkiye Seçimleri"
 Turkey.207.desc:0 "Ülke genelinde seçimler yapıldı ve şimdi sandıklar tek tek açılıyor. Bu seçimi kim kazanmalı: CHP mi, AKP mi?"
 Turkey.207.a:0 "Erdoğan ile devam edelim"
 Turkey.207.b:0 "Değişime ihtiyacımız var, CHP ile yola devam"
 Turkey.208.title:0 "Türkiye'nin Ilk Yüzyili"
 Turkey.208.desc:0 "Türkiye ilk yüzyılına ulaşırken bu an, milletin yolculuğu, üstesinden geldiği zorluklar ve kültürel, tarihî ve siyasi evriminin canlı dokusu üzerine derin bir tefekkürü gerektiriyor. Bu kutlama yalnızca geçen zamanın anılması değil, Türkiye'yi bugünkü millet hâline getiren dayanıklılığın ve ilerlemenin bir kanıtıdır."
 Turkey.208.a:0 "Ne güzel bir gün!"
 Turkey.208.b:0 "Ne güzel bir gün! §Y(Sessiz)§!"
 Turkey.209.title:0 "Yeni Anayasa Için Hazirliklar"
 Turkey.209.desc:0 "Erdoğan'ın ve Türkiye Büyük Millet Meclisi'nin talimatıyla yeni bir anayasa için hazırlıklara başlandı. Umarız bu süreçte işler ters gitmez."
 Turkey.209.a:0 "İlginç"
 Turkey.210.title:0 "Yepyeni Bir Anayasa"
 Turkey.210.desc:0 "Yeni bir anayasa taslağı hazırlandı. Hükümet taslağı överken muhalefet sert tepki gösteriyor. Bu durum ülkemizdeki huzura zarar verecek."
 Turkey.210.a:0 "Bu anayasa Türkiye'yi daha iyi hâle getirecek"
 Turkey.211.title:0 "Bogaziçi Protestolari"
 Turkey.211.desc:0 "Atamanın ardından 4 Ocak'ta yüzlerce kişi "Melih Bulu bizim rektörümüz değil" ve "İntihalci rektör istemiyoruz" gibi sloganlarla protesto başlattı. Öğretim üyeleri ortak bir açıklamada atamayı Boğaziçi'nin "akademik özgürlüğüne, bilimsel özerkliğine ve demokratik değerlerine" yönelik bir ihlal olarak nitelendirdi.\n\nAynı günün ilerleyen saatlerinde kampüse girmeyi başaran öğrenciler üniversite binalarından birini mühürledi. Ardından protestocular üniversite girişinin önündeki barikatı aşmaya çalışırken polisle çatıştı ve güvenlik güçleri göstericileri dağıtmak için biber gazı kullandı. Protestolar sırasında iki öğrenci gözaltına alındı; 6 Ocak itibarıyla gözaltındaki öğrenci sayısı 36'ya ulaştı. Öğrenci ve öğretim üyelerinin rektörlük önündeki protestoları Şubat ayına kadar sürdü ve pek çok Türk üniversitesi ile yurt dışındaki Boğaziçi mezun dernekleri de atamaya karşı protestoya katıldı.\n\nProtesto için düzenlenen bir sanat sergisi kapsamında kampüste Kâbe'yi bir LGBT bayrağı ve Şahmeran figürüyle birlikte tasvir ettiği bildirilen bir eser, sergi ekibindeki dört öğrencinin tutuklanmasına yol açtı. İçişleri Bakanı Süleyman Soylu tutuklanan öğrencileri "dört LGBT sapkını" olarak nitelendirdi ve Twitter daha sonra bu tweet'i kısıtladı. Bu olayın ardından Boğaziçi Üniversitesi LGBT Çalışmaları Kulübü Melih Bulu'nun talimatıyla kapatıldı; Bulu ise kendini savunarak LGBT haklarının savunucusu olduğunu iddia etti.\n\n1 Şubat'ta polis gösteriyi önlemek için Güney Kampüs'ün kapısını kapattı. Tazyikli su araçları, barikatlar ve en az bir keskin nişancı konuşlandırıldı. Aynı gece polis kampüse girerek 159 öğrenciyi gözaltına aldı. İzmir'de birkaç, Ankara'da 69 protestocu da gözaltına alındı. 2 Şubat'ta Türk polisi Kadıköy'de üniversite yakınında 104 kişiyi gözaltına aldı ve göstericilere biber gazı ve plastik mermiyle müdahale etti. İstanbul halkı şehrin pek çok yerinde protestoya destek için tencere tava çaldı. 3 Şubat'ta İzmir'de 50 kişi gözaltına alındı."
 Turkey.211.a:0 "Gücümüzü kaybediyoruz"
 Turkey.212.title:0 "Türksat 5A Firlatildi"
 Turkey.212.desc:0 "Yerli bileşenlerle donatılan Türksat 5A uydusu, Cape Canaveral'dan bir Falcon 9 roketiyle uzaya fırlatıldı."
 Turkey.212.a:0 "Harika Haber"
 Turkey.213.title:0 "Insan Haklari Eylem Plani"
 Turkey.213.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan İnsan Hakları Eylem Planı'nı açıkladı. Plan halkımıza daha fazla hak getirecek."
 Turkey.213.a:0 "Kulağa İyi Geliyor"
 Turkey.214.title:0 "IYI Parti Kuruldu"
 Turkey.214.desc:0 "MHP'nin politikalarından memnun olmayan bazı milliyetçiler yeni bir parti kurdu. Yeni partinin kurulmasıyla MHP güç kaybetti."
 Turkey.214.a:0 "Siyaset değişiyor"
 Turkey.215.title:0 "Anayasa Mahkemesi Fazilet Partisi'ni Kapatti"
 Turkey.215.desc:0 "Fazilet Partisi Anayasa Mahkemesi kararıyla kapatıldı. Bu durum AKP'nin ve Saadet Partisi'nin kurulmasına yol açacak."
 Turkey.215.a:0 "Anayasa Mahkemesi kararını verdi"
 Turkey.216.title:0 "Bagimsiz Türkiye Partisi Kuruldu"
 Turkey.216.desc:0 "Bağımsız Türkiye Partisi Haydar Baş tarafından kuruldu."
 Turkey.216.a:0 "Oldukça ilginç"
 Turkey.217.title:0 "DYP, DP Oldu"
 Turkey.217.desc:0 "DYP adını, 1960 darbesiyle kapatılan eski partinin adı olan DP olarak değiştirdi."
 Turkey.217.a:0 "Ne dramatik bir değişim!"
 Turkey.218.title:0 "Vatan Partisi'nin Kurulusu"
 Turkey.218.desc:0 "Perinçek'in İşçi Partisi'nin kapatılmasının ardından Perinçek Vatan Partisi'ni kurdu. Parti büyük ölçüde Çin örneğinden etkileniyor."
 Turkey.218.a:0 "Onlar gerçek Yükselenciler"
 Turkey.219.title:0 "104 Emekli Amiralin Bildirisi"
 Turkey.219.desc:0 "Türk Deniz Kuvvetleri'nden 104 emekli amiral, Montrö Sözleşmesi, Kanal İstanbul projesi ve Atatürk ilke ve inkılapları konusunda uyarıda bulunan bir bildiri yayımladı.\n\nEmekli amirallerin bildirisi: \n\n* Son dönemde hem Kanal İstanbul'un hem de uluslararası anlaşmalardan çekilme yetkisi kapsamında Montrö Sözleşmesi'nin tartışmaya açılması endişeyle karşılanmıştır.\n\n* Türk Boğazları dünyanın en önemli su yollarından biridir ve tarih boyunca çok taraflı antlaşmalarla yönetilmiştir. Bu antlaşmaların sonuncusu olan ve Türkiye'nin haklarını en iyi koruyan Montrö, yalnızca Boğazlardan geçişi düzenleyen bir sözleşme değil, Lozan Barış Antlaşması'nı tamamlayarak Türkiye'ye İstanbul, Çanakkale, Marmara Denizi ve Boğazlar üzerinde tam egemenlik haklarını yeniden kazandıran büyük bir diplomatik zaferdir.\n\n* Montrö, Karadeniz'e kıyısı olan ülkelerin güvenliğinin temel belgesi ve Karadeniz'i bir barış denizi yapan sözleşmedir. Montrö, Türkiye'nin herhangi bir savaşta savaşan taraflardan birinin yanında istemeden savaşa sürüklenmesini de önler.\n\n* Montrö, Türkiye'nin İkinci Dünya Savaşı'nda tarafsızlığını korumasını sağlamıştır. Bu ve benzeri nedenlerle Türkiye'nin bekasında önemli bir yeri olan Montrö Sözleşmesi'nin tartışma konusu yapılmasına ve masaya gelmesine yol açabilecek her türlü söylem ve eylemden kaçınılması gerektiği değerlendirmesindeyiz.\n\n* Öte yandan son günlerde basında ve sosyal medyada yer alan bazı kabul edilemez görüntü, haber ve tartışmalar, hayatını bu mesleğe adamış bizler için derin bir üzüntü kaynağı olmuştur.\n\n* TSK ve özellikle deniz kuvvetlerimiz son yıllarda çok bilinçli bir FETÖ saldırısına uğramış ve bu hain kumpaslarla çok değerli personelini kaybetmiştir. Bu kumpaslardan çıkarılacak en önemli ders, TSK'nın Anayasa'nın değiştirilemez ve değiştirilmesi teklif edilemez temel değerlerini titizlikle koruması gerektiğidir.\n\n* Bu gerekçelerle TSK'nın ve Deniz Kuvvetlerimizin bu değerlerin dışına çıktığını ve Atatürk'ün çizdiği çağdaş rotadan uzaklaştığını gösterme çabalarını kınıyor ve bunlara karşı çıkıyoruz.\n\n* Aksi hâlde Türkiye Cumhuriyeti, örneklerini daha önce gördüğümüz, tarihinin en tehlikeli olaylarını yaşama riski ve tehdidiyle karşı karşıya kalabilir. Türk milletinin bağrından çıkmış şanlı bir geçmişe sahip, anavatanın ve Mavi Vatan'ın koruyucusu Deniz Kuvvetleri Komutanlığı personelinin Atatürk ilke ve inkılaplarına uygun yetiştirilmesi esastır.\n\n* Denizde, karada, havada, iç güvenlikte ve sınır ötesinde, Mavi Vatan'ın her köşesinde haklarımızı ve çıkarlarımızı korumak için Atatürk'ün gösterdiği yolda canla başla çalışan fedakâr Türk denizcilerinin yanındayız."
