 Turkey.531.title:0 "Görünmeyen Finansal Çalkanti: Faiz 8,5'e Indirildi"
 Turkey.531.desc:0 "Seçimlerin yaklaşmasıyla ekonomide sıkı denetime ihtiyaç duyuldu. Döviz kurlarındaki artış bize siyasi açıdan sorun çıkaracağından ve faizler siyasi nedenlerle artırılamadığından TCMB bu kararı iktidar partisinin baskısıyla aldı.\n\nKurun kontrol altına alınamamasının bedeli ağır oldu: Merkez Bankası olağanüstü kayıplar yaşadı. Kurdaki yavaşlama kaybolmaya başladı ve bankalar arası piyasada kaygı verici değişimler görülmeye başlandı. Bu durum ileride Türkiye'ye kaçınılmaz olarak büyük zarar verecek."
 Turkey.531.a:0 "Popülizm Böyle İşler"
 Turkey.565.title:0 "Dolar 23,60'a Yükseldi"
 Turkey.565.desc:0 "Seçim öncesinde kamu eliyle kontrol edilen dar bir bantta işlem gören dolar/TL yatay seyrinden tamamen koptu. Türk lirası güne dolar karşısında yüzde 7'yi aşan bir değer kaybıyla başladı."
 Turkey.565.a:0 "Türk Ekonomisi Zor Durumda"
 Turkey.610.title:0 "Merkez Bankasi Faizi 15'e Yükseltti"
 Turkey.610.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) 27 ay aradan sonra ilk kez faiz artırdı. TCMB Başkanı Hafize Gaye Erkan başkanlığındaki ilk Para Politikası Kurulu (PPK) toplantısında politika faizi 650 baz puanlık artışla yüzde 8,5'ten yüzde 15'e yükseltildi. Kararın ardından dolar/TL ilk kez 24,41'i, avro/TL ise ilk kez 26,84'ü gördü. Türkiye'nin kredi temerrüt takası (CDS) primi 21 puan artarak 518'e çıktı."
 Turkey.610.a:0 "Ekonomik Koşullarımızı Rahatlatmalıyız"
 Turkey.611.title:0 "Merkez Bankasi Faizi 17,5'e Yükseltti"
 Turkey.611.desc:0 "Vatandaşların ve ekonomiyle doğrudan ilgili sektörlerin merakla beklediği Merkez Bankası faiz kararı açıklandı. Artış 250 baz puanla (yüzde 2,5) sınırlı kaldı ve beklentilerin altında gerçekleşti."
 Turkey.611.a:0 "Ekonomik Koşullarımızı Rahatlatmalıyız"
 Turkey.624.title:0 "Merkez Bankasi Faizi 25'e Yükseltti"
 Turkey.624.desc:0 "Türkiye Merkez Bankası perşembe günü faizi 750 baz puan artırarak yüzde 17,5'ten yüzde 25'e yükseltti. Beklentilerin üzerindeki artış, Türk lirasının rekor düşük seviyesinden toparlanmasını sağladı."
 Turkey.624.a:0 "Merkez Bankası'ndan Olumlu Tepki"
 Turkey.630.title:0 "Merkez Bankasi Faizi 30'a Yükseltti"
 Turkey.630.desc:0 "Merkez Bankası Para Politikası Kurulu, politika faizi olan bir hafta vadeli repo ihale faiz oranını yüzde 25'ten yüzde 30'a yükseltme kararı aldı. Merkez Bankası açıklamasında Kurul'un "dezenflasyonun bir an önce tesis edilmesi, enflasyon beklentilerinin çıpalanması ve fiyatlama davranışlarındaki bozulmanın kontrol altına alınması amacıyla parasal sıkılaştırma sürecini sürdürme" kararı aldığını vurguladı."
 Turkey.630.a:0 "Bir Tepki Daha"
 Turkey.631.title:0 "Merkez Bankasi Faizi 35'e Yükseltti"
 Turkey.631.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) Para Politikası Kurulu, Hafize Gaye Erkan başkanlığında toplandı ve politika faizini 500 baz puan artırarak yüzde 30'dan yüzde 35'e yükseltti. Kurul'un dezenflasyonun bir an önce tesis edilmesi, enflasyon beklentilerinin çıpalanması ve fiyatlama davranışlarındaki bozulmanın kontrol altına alınması amacıyla parasal sıkılaştırma sürecini sürdürme kararı aldığı belirtilen açıklamada, yılın üçüncü çeyreğinde enflasyonun tahminin üzerinde gerçekleştiğine dikkat çekildi."
 Turkey.631.a:0 "Bu Gerçekten İşe Yarıyor mu!?"
 Turkey.643.title:0 "Merkez Bankasi Faizi 40'a Yükseltti"
 Turkey.643.desc:0 "Türkiye Merkez Bankası, Cumhurbaşkanı Recep Tayyip Erdoğan'ın daha önce fiyat artışlarını yavaşlatmak için faiz indirerek iktisadi teamüllere meydan okumasının ardından, ülkedeki kontrolden çıkmış enflasyonu dizginlemek amacıyla önemli bir adım atarak faizi yaklaşık yirmi yılın en yüksek seviyesi olan yüzde 40'a çıkardı."
 Turkey.643.a:0 "Önce Fiyat İstikrarı!"
 Turkey.644.title:0 "Merkez Bankasi Faizi 42,5'e Yükseltti"
 Turkey.644.desc:0 "Para Politikası Kurulu (Kurul), politika faizini (bir hafta vadeli repo ihale faiz oranı) yüzde 40'tan yüzde 42,5'e yükseltme kararı aldı. Manşet enflasyon kasımda sınırlı bir artış gösterdi ve son Enflasyon Raporu'nda sunulan görünümle uyumlu seyrini sürdürüyor."
 Turkey.644.a:0 "Önce Fiyat İstikrarı!"
 Turkey.645.title:0 "Merkez Bankasi Faizi 45'e Yükseltti"
 Turkey.645.desc:0 "Türkiye Merkez Bankası perşembe günü beklendiği gibi politika faizini yüzde 45'e yükseltti. Türkiye'de yıllık enflasyon kasımdaki yüzde 62'den aralıkta yüzde 64,8'e çıktı."
 Turkey.645.a:0 "Önce Fiyat İstikrarı!"
 Turkey.649.title:0 "Merkez Bankasi Faizi 50'ye Yükseltti"
 Turkey.649.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 500 baz puan artırarak yüzde 50'ye yükseltti. Yerel seçimlere yalnızca 10 gün kala alınan bu karar, Merkez Bankası'nın yeniden tesis etmeye çalıştığı güvenilirlik açısından değerli ve güçlü bir sinyal niteliği taşıyor."
 Turkey.649.a:0 "Canımız Yanıyor!"
 Turkey.293.title:0 "Tanklar Ankara'dan Geçiyor"
 Turkey.293.desc:0 "Yeni hükümetin ülkeyi zor duruma sokacağını ve ordumuzla asla uyum sağlamayacağını açıkça ortaya koyduk. Bu yüzden askerî müdahale kaçınılmaz hâle geldi. Yüce Türk milleti, amacımız aşırı milliyetçilikle istikrar dayatmak değil. Amacımız ülkeyi yeniden demokratik bir rotaya oturtmaktır!"
 Turkey.293.a:0 "Askerî müdahale geldi!"
 Turkey.295.title:0 "Ilker Basbug Tutuklandi"
 Turkey.295.desc:0 "Emekliye ayrılmasından 17 ay sonra, 2 Ocak 2012'de, tanık olarak dinlenmesi beklenen "internet andıcı" davası kapsamında Başbuğ hakkında soruşturma başlatıldı. Başbuğ, 6 Ocak 2012'de "silahlı terör örgütü yöneticiliği ve hükümeti ortadan kaldırmaya teşebbüs" suçlamalarıyla tutuklandı."
 Turkey.295.a:0 "Gülen'in Etkisi Artıyor"
 Turkey.296.title:0 "Ilker Basbug Tahliye Edildi"
 Turkey.296.desc:0 "Eski Genelkurmay Başkanı emekli Orgeneral İlker Başbuğ, Ağır Ceza Mahkemesi'nin tahliye kararının ardından Silivri Cezaevi'nden çıktı.\n\nTahliyesinin ardından basına açıklama yapan Başbuğ, 6 Ocak 2012'de tutuklandığında "26. Genelkurmay Başkanı terör örgütü kurmak ve yönetmek suçlamasıyla tutuklanmıştır. Takdir yüce Türk milletinindir" dediğini hatırlatarak bu açıklamanın üzerinden 26 ay geçtiğini belirtti. Başbuğ sözlerini şöyle sürdürdü:\n\n"Kin ve intikam duygularıyla hareket edenler bizi 26 ay bu cezaevinde tuttular. 26 ay boyunca beni hayatımdan çaldılar. 26 ay boyunca beni özgürlüğümden yoksun bıraktılar. Ama 6 Ocak 2012'de de söylediğim gibi yüce Türk milleti kısa sürede oynanan oyunu, iddiaların geçersizliğini, Genelkurmay Başkanı'nın ve karargâhının terör örgütü olarak suçlanmasının kabul edilemez olduğunu ve bizim darbeyle hiçbir ilgimiz olmadığını anladı. Bugün buradaysam, yüce milletimizin bize gösterdiği sevgi ve destek sayesinde buradayım. Bu nedenle her şeyden önce huzurunuzda yüce Türk milletine en derin şükranlarımı sunuyorum."\n\nBaşbuğ tahliyesinin bir başlangıç olduğuna inandığını söyledi:\n\n"Bugünkü tahliyem bir başlangıçtır. Silivri'de, Hasdal'da ve Maltepe'de masumiyeti ortada olan arkadaşlarımın bir an önce özgürlüklerine kavuşacağına yürekten inanıyorum. Bu olmazsa bugün özgür olmamın, özgürlüğüme kavuşmamın benim için hiçbir önemi ve anlamı olmayacaktır. Çünkü ben ne kadar masumsam Tuncer Kılınç Paşa, Hurşit Tolon Paşa, Bilgin Balanlı Paşa, Hasan Iğsız Paşa, diğer tarafta Tuncay Özkan ve Doğu Perinçek de o kadar masumdur. Bugünkü tahliyemde kullanılan gerekçelerin hepsi için geçerli olduğunu da ifade etmek isterim. Dolayısıyla bu zindanlarda esir tutulanların hepsi mutlaka ve mutlaka bir an önce özgürlüklerine kavuşacaktır. Bundan eminiz. Hiçbir güç bunu durduramaz.""
 Turkey.296.a:0 "Büyük Bir Hatanın Sonucu"
 Turkey.297.title:0 "Eski Genelkurmay Baskani Ilker Basbug Hakkinda Dava Açildi"
 Turkey.297.desc:0 "İlker Başbuğ, 4 Ocak'ta Cumhuriyet gazetesine verdiği röportajda "Menderes 25 Mayıs 1960'ta Eskişehir'de erken seçim tarihini açıklasaydı 27 Mayıs askerî darbesi muhtemelen önlenebilirdi. Çünkü erken seçim kararı almış bir hükümete karşı askerî darbe yapmak, açıkça milletin siyasi iradesine darbe olurdu" demişti.\n\nİddianamede Başbuğ'un bu röportajla "darbe" imasında bulunduğu ve böylece "halkı alenen kin ve düşmanlığa tahrik etme" suçunu işlediği öne sürüldü; Başbuğ'un savcılığa verdiği ifade de iddianameye eklendi.\n\nİddianamede aktarılan ifadesinde Başbuğ, "Türkiye Cumhuriyeti'nde Güç Odakları Mücadelesi" kitap serisinin üçüncüsünde 1961-1980 dönemini o günün koşulları ve o günlerde gelişen olaylar çerçevesinde değerlendirdiğini, suç konusu ifadelerin daha önce başka yazarlarca da dile getirildiğini ve bugünkü olaylarla ilişki kurulmasının doğru olmadığını belirterek suçlamaları reddetti.\n\nİddianamede Başbuğ'un "halkı alenen kin ve düşmanlığa tahrik etme" suçundan 1 yıldan 3 yıla kadar hapsi istendi.\n\nİstanbul Asliye Ceza Mahkemesi, Başsavcılığın gönderdiği iddianameyi kabul etti. Başbuğ önümüzdeki günlerde hâkim karşısına çıkacak."
 Turkey.297.a:0 "Sorun yok, onu savunacağız"
 Turkey.297.b:0 "Türkiye Cumhuriyeti'nde bir daha darbe olmayacak"
 Turkey.298.title:0 "Devlet Bahçeli 100 Maddelik Anayasayi Açikladi"
 Turkey.298.desc:0 "MHP Genel Başkanı Devlet Bahçeli, partisinin 100 maddelik yeni anayasa önerisinin hazır olduğunu ve çalışmanın ilk olarak AK Parti ve Cumhurbaşkanı ile paylaşılacağını açıkladı. Bahçeli, Anayasa'nın değiştirilemez maddelerinin aynen korunduğunu söyledi."
 Turkey.298.a:0 "Ortağımızdan İlginç Haberler"
 Turkey.299.title:0 "15 Temmuz Kahramani Ali Demir IYI Parti'ye Katildi"
 Turkey.299.desc:0 "İYİ Parti Genel Başkanı Meral Akşener, bugün yapılan Grup Toplantısı'nda 15 Temmuz kahramanlarından Ali Demir'e parti rozetini taktı. Demir, "İYİ Parti'ye katılmaktan onur duyuyorum" dedi."
 Turkey.299.a:0 "İlginç"
 Turkey.300.title:0 "Deniz Baykal Istifa Etti"
 Turkey.300.desc:0 "Gazetecilerin karşısına çıkan Deniz Baykal şunları söyledi:\n\n"Günlerdir beklenen değerlendirmemi ve kararımı açıklıyorum. Bu bir kaset meselesi değil, bir kumpastır. Kumpas hukuksuz ve ahlaksız bir tezgâhtır. Kumpas kurarken bazen bir eve girersiniz. Gizli çekimlerle insanların en korunmasız görüntülerini alır, keser, biçer, kurgular ve çarpıtırsınız. Bütün dinlerin ahlak anlayışını ve insanlığın ahlak anlayışını ayaklar altına alırsınız. İnsanların namusunu umursamazlar. Bu kumpası kuranlar sapkınlardır; bunu şantaj için değil, siyaset yapmak için yaptılar.\n\nBir kumpas üretilmiştir. Taze, iki haftalık bir kumpas. Bu kumpasın hedefi bir kişi değildir. Hedefi, CHP'nin sivil diktaya karşı neredeyse tek başına yürüttüğü mücadeledir. Son iki hafta içinde kurgulanmış ve yayınlanmıştır. Kumpas tezgâhının malzemeleri ve çekimleri günceldir, tazedir. Böylesine kaba bir kumpas tezgâhının iktidarın zirvesinin bilgisi olmadan son iki haftada hazırlanıp yayınlanması mümkün değildir. Olayın ardından yapılan sözde iyi niyetli açıklamalar, perde arkasındaki tezgâhın suçunu örtmeye yetmez. Bu, hükümetin bilgisi ve onayı olmadan yayınlanamazdı. Asıl ayıp edenler, ayıbı işleyenlerdir.\n\nAmerika Birleşik Devletleri'nden, Pennsylvania'dan gelen üzüntü mesajlarının samimiyetine de inanıyorum. 'Ayıptır' diyorlar, ama başlatanlara söyleyecek bir sözüm var: Ahlaksız ve hukuksuz kumpaslardan itibar devşirerek kendinizi savunamazsınız. Ayıptır deyip kumpasa alan açanlar asıl ayıbı işleyenlerdir. Bu kumpaslara itibar edenlerin nereye kadar gidebileceğini hep birlikte göreceğiz.\n\nBu tablo karşısında teslim olmayacağım. Kimsenin beni hesaba çekmesine izin vermeyeceğim. Bunun bir bedeli varsa ve bu bedel CHP Genel Başkanlığını bırakmaksa, o bedeli ödeyeceğim. İstifa etmem kaçmak anlamına gelmez. Tam tersine, bu bir meydan okumadır. İstifa ediyorum; çünkü buradaki hedef ben değilim, CHP'dir."\n\nParti tüzüğü uyarınca genel başkan yardımcılarından Cevdet Selvi'nin genel başkana vekâlet edeceği açıklandı.\n\nBaykal'ın istifa kararını açıklamasının ardından bazı parti üyelerinin yüksek sesle "Hayır, yapma!" dediği duyuldu.\n\nAçıklama sırasında bazı parti üyelerinin gözyaşlarını tutamadığı görüldü."
 Turkey.300.a:0 "CHP İçin Hüzünlü Anlar"
 Turkey.300.b:0 "CHP İçin Hüzünlü Anlar §Y(Konuşmasız)§!"
 Turkey.301.title:0 "Kiliçdaroglu'na Saldiri"
 Turkey.301.desc:0 "CHP Genel Başkanı Kemal Kılıçdaroğlu, Çubuk ilçesinde şehit sözleşmeli piyade er Yener Kırıkçı'nın cenaze namazının ardından protesto amacıyla bir grubun yumruklu saldırısına uğradı. Yakın koruma ekibi ve çevredeki güvenlik güçlerinin müdahalesiyle Kılıçdaroğlu yakındaki bir eve götürüldü."
 Turkey.301.a:0 "Çok Sarsılmış Olmalı"
 Turkey.302.title:0 "Adalet Yürüyüsü"
 Turkey.302.desc:0 "Adalet Yürüyüşü, Temmuz 2016 darbe girişiminin ardından hükümetin başlattığı operasyonlar kapsamında yapılan tutuklamaları protesto etmek amacıyla Ankara'dan İstanbul'a düzenlenen 450 km'lik (280 mil) bir yürüyüştü. Darbe girişiminin ardından iktidardaki Adalet ve Kalkınma Partisi (AKP) hükümeti olağanüstü hâl ilan etti; o zamandan bu yana en az 50.000 kişi tutuklandı ve 140.000 kişi daha görevinden uzaklaştırıldı. Protestoya, Türk istihbaratının Suriye'ye silah kaçırdığını gösteren bir videoyu basına verdiği iddiasıyla Enis Berberoğlu'na verilen uzun hapis cezasına tepki olarak ana muhalefet lideri Kemal Kılıçdaroğlu öncülük etti. Yürüyüş, 9 Temmuz'da İstanbul'da yüz binlerce kişinin katıldığı bir mitingle sona erdi; Kılıçdaroğlu mitingde tasfiyelerin Türkiye'de yargı ve hukukun üstünlüğü üzerindeki etkisini uzun uzun anlattı.\n\nCumhurbaşkanı Recep Tayyip Erdoğan yürüyüşü yasa dışı ilan etti. Yürüyüş sırasında Başbakan Binali Yıldırım ve Cumhurbaşkanı Erdoğan yürüyüşü Temmuz 2016 darbe girişimine benzetti ve katılımcıları ve Kılıçdaroğlu'nu, hükümetin darbe girişiminin arkasında olduğunu söylediği Gülen hareketini desteklemekle suçladı. AKP taraftarları karşı gösteriler düzenledi. Polis yürüyüşçülerin güvenliğini sağladı ve yürüyüş İstanbul Maltepe'de olaysız sona erdi."
 Turkey.302.a:0 "Bu da ne...?"
 Turkey.303.title:0 "Yenikapi Mitingi"
 Turkey.303.desc:0 "Demokrasi ve Şehitler Mitingi, 7 Ağustos 2016'da Yenikapı Meydanı'nda düzenlendi; Adalet ve Kalkınma Partisi, Cumhuriyet Halk Partisi ve Milliyetçi Hareket Partisi 15 Temmuz darbe girişimine karşı mitinge katıldı. Miting, darbe karşıtı gösteriler dizisinin doruk noktası olarak görüldü. Mitingde Cumhurbaşkanı Recep Tayyip Erdoğan, Başbakan Binali Yıldırım, CHP Genel Başkanı Kemal Kılıçdaroğlu, MHP Genel Başkanı Devlet Bahçeli, Genelkurmay Başkanı Hulusi Akar ve TBMM Başkanı İsmail Kahraman konuştu. Darbe girişiminde hayatını kaybeden vatandaşlar için Kur'an-ı Kerim okundu."
 Turkey.303.a:0 "Türkiye bölünmez"
 Turkey.304.title:0 "Devlet Bahçeli'nin Açiklamasi"
 Turkey.304.desc:0 "MHP Genel Başkanı Devlet Bahçeli, partisinin TBMM'deki Grup Toplantısı'nda açıklamalarda bulundu. Erken seçim talebine ilişkin Bahçeli, "CHP Genel Başkanı bir an önce seçime gidilmesini istiyor. Belli ki acelesi var. Ülkemizin Kılıçdaroğlu'nun dayattığı gibi baskı, hesap sorma ve erken seçim gibi bir gündemi yoktur. Bunu unutmayın" dedi. Atatürk'e hakaret iddiasıyla ilgili olarak ise Bahçeli, "Bu, Müslüman kılığında bir provokasyondur. Bunların gizli Gülenist olup olmadıkları araştırılmalıdır. Herkes uyanık olmak zorundadır. Atatürk millî birliğimizin ortak paydasıdır. Atatürk'e dil uzatanlar kendilerini ondan daha iyi Müslüman mı sanıyor? Atatürk düşmanlığı ihanete hizmettir" dedi."
 Turkey.304.a:0 "İlginç"
 Turkey.305.title:0 "Süleyman Soylu Istifa Etti"
 Turkey.305.desc:0 "Virüs nedeniyle sokağa çıkma yasağı ilan edildi ve insanlar marketlere akın etti. Bunun üzerine İçişleri Bakanı Süleyman Soylu istifa etti. Erdoğan istifayı kabul etmedi."
 Turkey.305.a:0 "Ona İhtiyaç Var"
 Turkey.306.title:0 "2013 Yolsuzluk Skandali"
 Turkey.306.desc:0 "17 Aralık 2013'te Cumhuriyet tarihinin en büyük "yolsuzluk ve rüşvet" skandalı patlak verdi. Bakanları, bürokratları, iş insanlarını ve belediye başkanlarını kapsayan operasyonu 25 Aralık'ta ikinci dalga izledi. Dönemin Başbakanı Tayyip Erdoğan'ın oğlu Bilal Erdoğan ile 41 kişilik bir iş insanı grubunu kapsayan bu dalganın hemen ardından 16 Ocak'ta İstanbul İtfaiyesi ve Beyoğlu Belediyesi'ni kapsayan üçüncü bir operasyon geldi. Ancak son iki dalga AKP hükümeti tarafından engellendi ve operasyon gerçekleştirilemedi.\n\n1. Kara Para Dosyası\n\nİlk soruşturma olan "Kara Para Dosyası", iş insanı Rıza Sarraf, bakan çocukları Barış Güler ve Kaan Çağlayan ile Halkbank Genel Müdürü Süleyman Aslan dahil 21 kişiyi kapsıyordu. Soruşturma kapsamında bu kişilerin "altın kaçakçılığı, kara para aklama ve rüşvet" suçlamalarıyla tutuklanmaları istendi.\n\n2. İmar Yolsuzluğu\n\nAKP'li Fatih Belediyesi'ndeki yolsuzluk ve rüşvet soruşturmasını kapsayan "Fatih Dosyası"nda Belediye Başkanı Mustafa Demir ile birlikte 27 şüpheli yer aldı. Şüphelilerin "rüşvet alma ve verme" suçlamalarıyla tutuklanmaları istendi.\n\n3. İmar Suçları\n\n"Şehircilik suçları" dosyasında ünlü iş insanı Ali Ağaoğlu ve Çevre ve Şehircilik Bakanı Erdoğan Bayraktar'ın oğlu Abdullah Oğuz Bayraktar dahil 23 şüpheli yer aldı. Şüphelilerin, belediyelerce onaylanmayan imar planlarını onaylattıkları, Kültür ve Tabiat Varlıklarını Koruma Kurulu'nun plan değişikliklerine kurul ve komisyon üyelerine baskı yaparak müdahale ettikleri, rüşvet ya da sahte raporlarla tescilli kültürel ve tarihî yapıları, doğal sit alanlarını ve yeşil alanları, Boğaziçi Kanunu kapsamındaki araziler de dahil olmak üzere yapılaşmaya açtıkları ileri sürüldü.\n\n4. Yatak Odasındaki Para Sayma Makinesi\n\nİstanbul Cumhuriyet Başsavcılığı'nın talimatıyla İçişleri Bakanı Muammer Güler'in oğlu Barış Güler'in evinde yapılan aramada yüklü miktarda Türk lirası ve döviz ile kutulara yerleştirilmiş altı çelik kasa bulundu. Bakan Güler, yatak odasında istiflenmiş 1 milyon 200 bin dolar da dahil olmak üzere paranın Bahçeşehir'deki bir villanın satışından geldiğini, dairedeki altı kasanın ise oğlunun kapanan iş yerlerine ait olduğunu ve ofisten eve taşındığını öne sürdü.\n\nHalkbank Genel Müdürü Aslan'ın evinde ise ayakkabı kutularına gizlenmiş 4,5 milyon dolar, bazı telefon kayıtları ve fotoğraflar bulundu. Aslan savcılığa verdiği ifadede, "Evimden çıkan 4,5 milyon doların tamamı okul yaptırmak için toplanan bağış parasıdır. Bu para Makedonya'daki Balkan Üniversitesi'nin ve Çorum Osmancık'taki İmam Hatip Lisesi'nin inşaatında kullanılacaktı. Hayırsever insanlardan toplanmış bir paraydı ve oraya gönderecektim" dedi.\n\nDört gün sonra, 21 Aralık Cumartesi günü bakan çocukları Barış Güler ve Salih Kaan Çağlayan, iş insanı Rıza Sarraf ve Halkbank Genel Müdürü Süleyman Aslan tutuklandı. İki bakanın oğluna yöneltilen suçlama "rüşvet alınıp verilmesine aracılık etmek" oldu. Bakan Bayraktar'ın oğlu, iş insanı Ağaoğlu ve Fatih Belediye Başkanı dahil diğer şüpheliler serbest bırakıldı. İlk dalga operasyonu kapsamında toplam 26 kişi cezaevine gönderildi."
 Turkey.306.a:0 "Para, para, para!"
 Turkey.307.title:0 "Binali Yildirim Açiklama Yapti"
 Turkey.307.desc:0 ""Binali Yıldırım'ın oğlu kara para trafiği için Venezuela'ya gitti" iddiasına yanıt veren AKP Genel Başkan Yardımcısı Binali Yıldırım, "Bu kesinlikle bir iftiradır, yalandır, şiddetle reddediyoruz" dedi."
 Turkey.307.a:0 "Mantıklı Geliyor"
 Turkey.308.title:0 "Uber Geri Döndü"
 Turkey.308.desc:0 "Bir süre erişimi engellenen Uber'e zaman geçtikten sonra sessiz sedasız yeniden izin verildi."
 Turkey.308.a:0 "İlginç"
 Turkey.309.title:0 "Ali Babacan Yeniden Ekonomi Forumlarinda"
 Turkey.309.desc:0 "Ali Babacan yeniden ekonomiyle ilgilenmeye başladı ve Türkiye'nin 2008 ekonomik krizinin etkilerinden bir an önce kurtulması için ekonomi forumlarına katıldı."
 Turkey.309.a:0 "Ekonomi Kurtarılmalı"
 Turkey.310.title:0 "Adim Adim Avrupa Birligi'ne"
 Turkey.310.desc:0 "Avrupa ile ilişkilerin iyi gitmesi ve Avrupa Birliği'ne katılım yolunun açılması için AB uyum yasalarıyla Anayasa'da düzenlemeler yaptık. Avrupa Birliği'ne girerek ekonomik yükselişimizi sürdürebilmeyi umuyoruz."
 Turkey.310.a:0 "Çok Güzel"
 Turkey.311.title:0 "Bülent Arınç'ın Beklenmedik Açıklaması"
 Turkey.311.desc:0 "Başbakan Yardımcısı Bülent Arınç ile Ankara Büyükşehir Belediye Başkanı Melih Gökçek arasındaki büyük kavga 21 Mart'taki bir açıklamayla patlak verdi. Arınç o gün beklenmedik bir çıkış yaparak Cumhurbaşkanı Recep Tayyip Erdoğan'ı çözüm süreciyle ilgili açıklamaları nedeniyle eleştirdi.\n\nCumhurbaşkanı Erdoğan'ın bu sözlere yanıt vermesi beklenirken Arınç hiç beklemediği bir yerden ağır bir saldırıya uğradı. Ankara Büyükşehir Belediye Başkanı Melih Gökçek bir anda topa girerek Arınç'a damadı üzerinden yüklendi ve onu "paralel yapı"nın parçası ilan etti."
 Turkey.311.a:0 "AKP'de Çatışma"
 Turkey.312.title:0 "Melih Gökçek Istifa Etti"
 Turkey.312.desc:0 "Cumhurbaşkanı ve AKP Genel Başkanı Erdoğan'ın istifasını istediği altı belediye başkanından biri olan Ankara Büyükşehir Belediye Başkanı Melih Gökçek, "Sayın Cumhurbaşkanımız benden istifa etmemi istedi. Cumhurbaşkanımızın talimatı doğrultusunda belediye başkanlığı görevinden ayrılıyorum" diyerek 23 yıldır sürdürdüğü görevinden istifa etti. Veda konuşmasının sonunda Gökçek, "Bizden görünen ama bizden olmayan aramızdaki fitnecileri kahret Yarabbi" diye dua etti. Veda sırasında belediyenin genel müdürü Belma İlhan'ın gözyaşlarını tutamadığı görüldü."
 Turkey.312.a:0 "Emir demiri keser"
 Turkey.313.title:0 "Anayasa Referandumu Sonucu: EVET"
 Turkey.313.desc:0 "16 Nisan 2017'de iktidardaki Adalet ve Kalkınma Partisi (AKP) ile Milliyetçi Hareket Partisi'nin (MHP) önerdiği 18 maddelik anayasa değişikliğinin onaylanıp onaylanmayacağına ilişkin Türkiye genelinde anayasa referandumu yapıldı. Değişikliğin kabulüyle Başbakanlık kaldırıldı ve mevcut parlamenter sistemin yerini yürütme yetkisine sahip bir cumhurbaşkanlığı, yani Cumhurbaşkanlığı Hükümet Sistemi aldı. Meclisteki sandalye sayısı 550'den 600'e çıkarıldı; diğer düzenlemelerin yanı sıra cumhurbaşkanına Hâkimler ve Savcılar Yüksek Kurulu (HSYK) atamaları üzerinde daha fazla yetki verildi. Referandum, Temmuz 2016'daki başarısız askerî darbe girişiminin ardından ilan edilen olağanüstü hâl altında yapıldı.\n\nİlk sonuçlar "Evet" oylarının %51'e %49 önde olduğunu gösterdi. Yüksek Seçim Kurulu (YSK) emsalsiz bir kararla mühürsüz oy pusulalarının geçerli sayılmasına izin verdi. Reformu eleştirenler bu kararı yasa dışı olarak nitelendirdi, 1,5 milyona kadar oy pusulasının mühürsüz olduğunu öne sürdü ve sonuçları tanımadı. Sonuçların ardından YSK'nın kararını protesto etmek için geniş çaplı gösteriler başladı. Sonraki raporlarda Avrupa Güvenlik ve İşbirliği Teşkilatı (AGİT) ve Avrupa Konseyi Parlamenter Meclisi (AKPM) kampanya sürecindeki adaletsizliği eleştirdi ve YSK'nın kararını hukuka aykırı ilan etti."
 Turkey.313.a:0 "Yepyeni Bir Türkiye"
 Turkey.314.title:0 "Anayasa Degisikligi Sonrasi Yemin Töreni"
 Turkey.314.desc:0 "Anayasa değişikliğinin ardından yeni sistem kuruldu. Erdoğan ve bakanlar yemin töreninde yemin etti."
 Turkey.314.a:0 "Ne Değişim Ama!"
 Turkey.315.title:0 "Yeni Cumhurbaskanligi Külliyesi'nin Insasi"
 Turkey.315.desc:0 "Yeni Cumhurbaşkanlığı Külliyesi'nin inşaatı tamamlandı; ülke artık tek bir merkezden çok daha rahat yönetilebilecek. Yeni külliye muhalefet tarafından sert bir dille eleştirildi."
 Turkey.315.a:0 "İlginç"
 Turkey.316.title:0 "TKP Tunceli'de HDP'yi Yendi"
 Turkey.316.desc:0 "Tunceli'de seçimi HDP'yi yenen TKP kazandı. Tunceli Belediye Başkanı Fatih Mehmet Maçoğlu oldu. Maçoğlu'nun Tunceli'de bir konuşma yapması bekleniyor."
 Turkey.316.a:0 "Tunceligrad mı?"
 Turkey.317.title:0 "Deniz Salyasi Marmara Denizi'ni Istila Etmeye Basladi"
 Turkey.317.desc:0 "Marmara Denizi'nde ve çevresinde oluşan, denizin hem tabanını hem yüzeyini kaplayan deniz salyası yoğunlaşmaya devam ediyor. Deniz salyası olarak bilinen müsilaj dünya basınında da haberlere konu oldu. Marmara'daki müsilaj bu hızla artmaya devam ederse önü alınamaz hâle gelebilir. Hemen harekete geçip temizliğe başlamalıyız."
 Turkey.317.a:0 "Hızlı Olun!"
 Turkey.318.title:0 "Mansur Yavas Twitch Yayinina Katildi"
 Turkey.318.desc:0 "Ankara Büyükşehir Belediye Başkanı Mansur Yavaş, canlı yayın platformu Twitch'te Pelin Baynazoğlu'nun (Pqueen) yayınına konuk oldu. Ortalama canlı izleyici sayısı 300 bini aşarak Türkiye izlenme rekorunu kırdı.\n\nCanlı yayından elde edilen 20 bin TL'yi aşkın gelir, Ankara Büyükşehir Belediyesi'nin başlattığı "Yeşil Başkent" projesine bağışlanacak.\n\nYavaş, "Twitch yayınımızı izleyerek canlı yayın rekoru kırmamızı sağlayan sevgili Pelin'e ve Yeşil Başkent projemize destek veren herkese yürekten teşekkür ediyorum. Ankara'mızı sizlerin fikirleri ışığında yönetmeye ve sizi her zaman dinlemeye devam edeceğim. İyi ki varsınız" dedi."
 Turkey.318.a:0 "İlginç"
 Turkey.319.title:0 "Kemal Kiliçdaroglu Twitch Yayinina Katildi"
 Turkey.319.desc:0 "Mansur Yavaş'ın ardından CHP Genel Başkanı Kemal Kılıçdaroğlu da ünlü Twitch yayıncısı Jahrein ile buluştu. Yayında ülkenin sorunları konuşuldu. Bu, CHP'nin Twitch'te yayılmayı sürdürdüğünü gösteriyor."
 Turkey.319.a:0 "İlginç"
 Turkey.320.title:0 "AKP'den CHP'ye Karsi Animasyonlu Propaganda"
 Turkey.320.desc:0 "AKP'nin çizgi film formatında hazırladığı propaganda videosunda CHP Genel Başkanı Kemal Kılıçdaroğlu ve CHP Sözcüsü Faik Öztrak karikatürize edildi. Animasyon, "Cumhuriyet Halk Partisi" tabelasının düşmesiyle "CHP Yalan Üretim Merkezi" tabelasının ortaya çıktığı sahneyle başlıyor. Animasyon sosyal medyada da tepki çekti."
 Turkey.320.a:0 "Garip Bir Hamle"
 Turkey.322.title:0 "Ülkücüler Hükümeti Devirdi"
 Turkey.322.desc:0 "Ordu içinde gizlice örgütlenmiş milliyetçi silahlı gruplar hükümeti devirdi. Darbenin ardından çok sayıda gözaltı yapıldı."
 Turkey.322.a:0 "Dur, ne?!"
 Turkey.323.title:0 "Muharrem Ince Istifa Etti"
 Turkey.323.desc:0 "CHP Kurultayı'nda öfkelenen Muharrem İnce, artık CHP'nin adayı olmayacağını ve bağımsız aday olacağını açıkladı. Bu kararın ardından yaklaşık 60 milletvekili partiden istifa etti. Amaçları CHP'den ayrılıp kendi başlarına iktidara gelmek."
 Turkey.323.a:0 "Dur, ne?!"
 Turkey.324.title:0 "Ekrem Imamoglu CHP'de Güçleniyor"
 Turkey.324.desc:0 "Bir dönemin yenilmezi olarak bilinen Erdoğan'ı iki kez yenen Ekrem İmamoğlu, cumhurbaşkanı adayı olmak için Kemal Kılıçdaroğlu ile görüştü. Kılıçdaroğlu kabul etti, ancak Meral Akşener'den henüz bir yanıt gelmedi. Akşener'in de kendi adayını öne sürmesi bekleniyor."
 Turkey.324.a:0 "İlginç"
 Turkey.325.title:0 "Mansur Yavas IYI Parti'de Güçleniyor"
 Turkey.325.desc:0 "Milliyetçi kimliğiyle bilinen ve bir dönemin yenilmezi Erdoğan'ı yenen Mansur Yavaş, cumhurbaşkanı adayı olmak için Meral Akşener ile görüştü. Akşener kabul etti, ancak Kemal Kılıçdaroğlu'ndan henüz bir yanıt gelmedi. Kılıçdaroğlu'nun da kendi adayını öne sürmesi bekleniyor."
 Turkey.325.a:0 "İlginç"
 Turkey.326.title:0 "Erdogan Erken Seçim Için Bastiriyor"
 Turkey.326.desc:0 "Eski Cumhurbaşkanı Erdoğan bizi erken seçime gitmeye zorlamaya başladı; amacı CHP güçsüzken iktidarı arkadan almak. Bu konuda ne yapmalıyız?"
 Turkey.326.a:0 "Gereksiz Saldırılar"
 Turkey.327.title:0 "Ali Babacan Twitch Yayinina Katildi"
 Turkey.327.desc:0 "AKP'den ayrılan Ali Babacan, sosyal medya fenomeni Jahrein ile birlikte yayına çıktı. Sohbet üç saat sürdü. Parti tanıtımı için kârlı bir hamle gibi görünüyor."
 Turkey.327.a:0 "Muhalefet Twitch'i istila etmeye devam ediyor"
 Turkey.328.title:0 "Türkiye Avrupa Birligi'ne Tam Üye Oldu"
 Turkey.328.desc:0 "Uzun müzakerelerin ardından Türkiye'nin Avrupa Birliği'ne katılımına yeşil ışık yakıldı. Türkiye son adımı da atarak resmen üye oldu. Türkiye genelinde büyük kutlamalar yapıldı."
 Turkey.328.a:0 "Nihayet!"
 Turkey.328.b:0 "Nihayet! §Y(Sessiz)§!"
 Turkey.329.title:0 "Türkiye'nin NATO Üyeligi Sona Erdi"
 Turkey.329.desc:0 "NATO dün itibarıyla Türkiye ile ilişkilerini tamamen kestiğini açıkladı. Ardından Amerikan deniz kuvvetleri Türk ve Rus baskısı altında geri çekilmeye başladı. Amerika'nın donanmasını çekmesi ve NATO'nun Boğazlar'ı kontrol eden bir devleti kaybetmesi sonucunda Rusya güçlendi ve donanmasını Akdeniz sularına gönderdi. NATO artık güvende değil. Rusya'nın itibarı artıyor."
 Turkey.329.a:0 "NATO askerî bütünlüğünü kaybetmeye başladı"
 Turkey.329.b:0 "NATO askerî bütünlüğünü kaybetmeye başladı §Y(Sessiz)§!"
 Turkey.330.title:0 "Akinci SIHA Irtifa Rekoru Kirdi"
 Turkey.330.desc:0 "Cumhurbaşkanlığı Savunma Sanayii Başkanı İsmail Demir, Twitter hesabından yaptığı paylaşımda "Akıncı SİHA, yerli ve millî bir hava aracının ulaştığı en yüksek irtifaya çıkarak Türk havacılık tarihinin irtifa rekorunu kırdı" dedi."
 Turkey.330.a:0 "Güzel"
 Turkey.331.title:0 "Cumhurbaskani Recep Tayyip Erdogan Müjdeyi Verdi"
 Turkey.331.desc:0 "KKTC Meclisi'nin özel oturumunda konuşan Cumhurbaşkanı Recep Tayyip Erdoğan müjdeyi verdi: KKTC'ye bir Cumhurbaşkanlığı Külliyesi ve bir Millet Bahçesi yapılacak."
 Turkey.331.a:0 "İlginç"
 Turkey.332.title:0 "Tanju Özcan Siginmacilara Karsi Konustu"
 Turkey.332.desc:0 "Bolu Belediye Başkanı, başka ülkelerden gelen sığınmacılar hakkında sert konuştu. \n\n Bolu Belediye Başkanı Tanju Özcan: "Abonemiz olan yabancı uyruklulara su ücretleri, katı atık ücretleri başta olmak üzere bazı ücretler 10 kat artacak. Bir Türk vatandaşıyla bir yabancı uyruklu aynı fiyattan su kullanamayacak. Suyu ve katı atık vergisini neden 10 kat artırıyoruz? Gitsinler diye. Bu misafirlik uzadı. Onları polis zoruyla şehirden çıkarma yetkim yok. Bir zamanlar sınırlar açıldığında otobüs tahsis edip insanları göndermiştik. Şimdi de göndermeye hazırız. Yeter ki gönderelim.""
 Turkey.332.a:0 "Hiç Doğru Değil!"
 Turkey.332.b:0 "Aslında Haklıydı!"
 Turkey.333.title:0 "Dipsiz Kuyu Tahrip Edildi"
 Turkey.333.desc:0 "Antik Dipsiz Kuyu yasal izinle kazıldı, ancak bulunması beklenen hazine bulunamadı. Dipsiz kuyuda hiçbir şey bulamayan araştırmacı grup bölgeden ayrıldı. Kuyunun tahrip edilmesi sosyal medyada tepkiye yol açtı."
 Turkey.333.a:0 "Hemen Soruşturma Başlatın"
 Turkey.334.title:0 "Hayvanlari Koruma Kanunu"
 Turkey.334.desc:0 "TBMM Tarım, Orman ve Köyişleri Komisyonu'nda kabul edilen Hayvanları Koruma Kanunu ile Türk Ceza Kanunu'nda Değişiklik Yapılmasına Dair Kanun Teklifi'yle yeni suçlar ve cezalar belirlendi."
 Turkey.334.a:0 "Güzel"
 Turkey.335.title:0 "Recep Tayyip Erdogan Diyarbakir'i Ziyaret Etti"
 Turkey.335.desc:0 "Liderimiz Recep Tayyip Erdoğan Diyarbakır'ı ziyaret etti. Ziyaret halk tarafından coşkuyla karşılandı. Kürt halkının hâlâ bizim yanımızda olduğuna yürekten inanıyoruz."
 Turkey.335.a:0 "Mükemmel!"
 Turkey.336.title:0 "Melih Bulu Görevden Alindi"
 Turkey.336.desc:0 "Prof. Dr. Melih Bulu, Boğaziçi Üniversitesi rektörlüğüne atanmasından altı ay sonra Cumhurbaşkanlığı Kararnamesi ile görevden alındı. Melih Bulu'nun görevden alınması protestoların işe yaradığının göstergesi."
 Turkey.336.a:0 "Popülist Bir Hamle"
 Turkey.337.title:0 "Sedat Peker'in Videolari"
 Turkey.337.desc:0 "Sedat Peker bölüm bölüm videolar yayınladı ve bu bölümlerde ülkemizin lideri Recep Tayyip Erdoğan'ın partisine ve bazı başka partilere karşı kirli iftiralar düzenledi. Hiç kimse Türkiye Cumhuriyeti devletini ve iktidar partimiz AKP'yi yıkamaz."
 Turkey.337.a:0 "Harekete Geçmeliyiz"
 Turkey.338.title:0 "Teröristlerle Çatisma"
 Turkey.338.desc:0 "Kuzey Irak'ta çıkan çatışmada iki Türk askeri şehit oldu, bir asker yaralanarak hastaneye kaldırıldı. Çatışmada bölücü terör örgütüne mensup bir terörist etkisiz hâle getirildi."
 Turkey.338.a:0 "Aman Tanrım"
 Turkey.339.title:0 "Mehmet Aydin Teslim Oldu"
 Turkey.339.desc:0 "Türkiye'de insanları dolandıran Çiftlikbank'ın sahibi, "Tosuncuk" lakaplı Mehmet Aydın Brezilya'da teslim oldu. Onu ülkemize getirip hukuk önünde yargılanmasını sağlayacağız."
 Turkey.339.a:0 "Dolandırılanlar İçin Harika Haber"
 Turkey.340.title:0 "ABD Türkiye'yi F-35 Programindan Çikardi"
 Turkey.340.desc:0 "ABD, Türkiye'yi F-35 programından resmen çıkardığını Ankara'ya bildirdi. 2007 tarihli anlaşmanın kalan sekiz ortakla güncellendiği ve programa yeni katılımcı eklenmediği belirtildi."
 Turkey.340.a:0 "Misilleme Olarak ABD'nin Karadeniz Tatbikatını Askıya Al"
 Turkey.340.b:0 "Umurumuzda Değil"
 Turkey.341.title:0 "Afganistan'daki Türk Görevi"
 Turkey.341.desc:0 "ABD, Afganistan'dan askerlerini çekmeye başladı. Diğer NATO ülkeleri de çekilmeye başladı, ancak biz hâlâ bölgedeyiz. ABD bölgeden ayrılmamamızı ve mücadeleyi sürdürmemizi istiyor. Halkımız ise çekilmemizi istiyor. Ne yapalım efendim?"
 Turkey.341.a:0 "Bölgede kalacağız"
 Turkey.341.b:0 "Ayrılma vakti geldi"
 Turkey.342.title:0 "Afganistan'daki Türk Görevi"
 Turkey.342.desc:0 "ABD, Afganistan'dan askerlerini çekmeye başladı. Diğer NATO ülkeleri de çekilmeye başladı, ancak biz hâlâ bölgedeyiz. ABD bölgeden ayrılmamamızı ve mücadeleyi sürdürmemizi istiyor. Halkımız ise çekilmemizi istiyor. Ne yapalım efendim?"
 Turkey.342.a:0 "Bölgede kalacağız"
 Turkey.343.title:0 "Erbakan'in Dönüsü"
 Turkey.343.desc:0 "Erbakan'ın siyasi yasağını yargı yoluyla erken kaldırttık. Hareketin kurucu lideri Necmettin Erbakan yeniden Saadet Partisi'nin başına geçecek."
 Turkey.343.a:0 "Kulağa Hoş Geliyor"
 Turkey.344.title:0 "Türkiye D-8'i Bir Ittifaka Dönüstürmek Istiyor"
 Turkey.344.desc:0 "Türkiye, D-8 Ekonomik İşbirliği Örgütü'nü gerçek bir ittifaka dönüştürmenin zamanının geldiğine inanıyor. D-8 üyesi olarak bu teklifi kabul edip gerçek bir ittifak kuralım mı?"
 Turkey.344.a:0 "Kulağa Hoş Geliyor"
 Turkey.344.b:0 "Buna İhtiyacımız Yok"
 Turkey.345.title:0 "Necmettin Erbakan'in Vefati"
 Turkey.345.desc:0 "Liderimiz Necmettin Erbakan'ın vefatı tüm ülkeyi derinden sarstı. Cenaze töreninin ardından asıl soru ortaya çıktı: Saadet Partisi'ni artık kim yönetecek? Seçimi biz yapacağız."
 Turkey.345.a:0 "Fatih Erbakan Başa Geçmeli"
 Turkey.345.b:0 "Temel Karamollaoğlu Başa Geçmeli"
 Turkey.346.title:0 "Türkiye'nin Dört Bir Yaninda Orman Yanginlari"
 Turkey.346.desc:0 "2021 Türkiye orman yangınları, 28 Temmuz 2021'de Antalya'nın Manavgat ilçesinde başlayıp Türkiye'nin pek çok iline yayılan yangınlardır. 12 Ağustos 2021 itibarıyla çoğu Akdeniz, Ege, Marmara, Batı Karadeniz ve Güneydoğu Anadolu bölgelerinde olmak üzere 49 ilde çıkan 299 orman yangınında 8 kişi hayatını kaybetti; yüz binlerce hektar orman ve yerleşim alanı küle döndü, binlerce hayvan telef oldu.\n\n28 Temmuz'da başlayan, 15'i büyük 299 orman yangını, 12 Ağustos 2021'de Muğla'nın Köyceğiz ilçesindeki yangının söndürülmesiyle tamamen kontrol altına alındı. Yangınlara 15 yangın söndürme uçağı, 62 helikopter, 9 insansız hava aracı, 1 insansız helikopter, 850 arazöz ve su tankeri, 450 iş makinesi ve 5.250 personel müdahale etti. Azerbaycan, Ukrayna, Rusya, İspanya, Hırvatistan, Katar ve İran başta olmak üzere birçok ülke personel ve araç desteği sağladı. Yangınların yerleşim yerlerine sıçramasıyla yüzlerce köy ve kasabadan binlerce yerli ve turist kara ve deniz yoluyla tahliye edildi.\n\nTürkiye Cumhuriyeti tarihinin en büyük orman yangınları olarak nitelendirilen yangınların ardından büyük tartışmalar yaşandı. Tarım ve Orman Bakanlığı ile Türk Hava Kurumu, yangınlara geç ve yavaş müdahale ettikleri gerekçesiyle muhalefet ve kamuoyu tarafından eleştirildi. Tartışmaların odağında bakanlığın yetersiz yangın söndürme filosu, hangarda bekletilen uçaklar, yanan orman arazilerinin yapılaşmaya açılacağı iddiaları, yerleşim alanlarındaki yangınlarla mücadelede belediyelerin yetki ve sorumlulukları, küresel ısınmanın etkileri ve Recep Tayyip Erdoğan'ın afet bölgesinde halka çay dağıtması yer aldı."
 Turkey.346.a:0 "Bize Büyük Zarar Verdi"
 Turkey.347.title:0 "Türkiye Darbe Girisimini Püskürttü"
 Turkey.347.desc:0 "Erbakan'ın partisinin iktidara gelmesi orduda tepkiye yol açtı. Ordu Erbakan'ı mürteci olarak görüyordu. Bir zamanlar basını kullanarak devirdiği partiyi yeniden iktidarda gören ordu, 28 Şubat'taki gibi bir kez daha müdahale etmeye karar verdi. Ordu müdahale planlarını yaptıktan sonra birkaç tank bölüğü başkente doğru yola çıktı. Başkentte halkımız tanklara direndi. Ordu Ankara'da alçak uçuşlarla bizi korkutmaya çalıştı, ama işe yaramadı. Halkımız sokaklara döküldü ve tepki gösterdi. Halkımız bir darbe daha istemedi. Ordu bir gün sonra pes etti ve teslim oldu. Artık tüm güç resmen bizde."
 Turkey.347.a:0 "Yaşa!"
 Turkey.348.title:0 "Türkiye Karadeniz'deki Varligimiza Saldirdi"
 Turkey.348.desc:0 "Türkiye beklemediğimiz bir hamleyle bize misilleme yaptı ve Boğazlar'ı ABD'ye kapattığını ilan etti. Bu açıklama ABD'nin Karadeniz'deki faaliyetlerinin çöküşü anlamına geliyor. Rusya bu durumdan kesinlikle memnun olacak."
 Turkey.348.a:0 "Bu da ne...?"
 Turkey.349.title:0 "Türkiye F-35 Programina Katildi"
 Turkey.349.desc:0 "Türkiye, 12 Temmuz 2002'de yedinci uluslararası ortak olarak F-35 (Müşterek Taarruz Uçağı) projesine katıldı. Türkiye ayrıca F-35'in üretimine ilişkin bir mutabakat zaptı imzaladı. F-35'in üretimi başladığında Türkiye bu uçaklara sahip olabilecek!"
 Turkey.349.a:0 "Güzel"
 Turkey.350.title:0 "PKK Yanginlari Çikardigini Kabul Etti"
 Turkey.350.desc:0 "Türkiye'nin güneyini etkileyen ve tüm ülkeyi yakan orman yangınlarıyla mücadele sürerken terör örgütü PKK yangınları kendisinin çıkardığını kabul etti. PKK bağlantılı sosyal medya hesapları, yangınların "Ateşin Çocukları İnisiyatifi" tarafından çıkarıldığını öne sürdü."
 Turkey.350.a:0 "Onları Tek Tek Bulacağız!"
 Turkey.351.title:0 "Yangin Söndürüldü"
 Turkey.351.desc:0 "Türkiye'deki yangın uzman ekiplerin yardımıyla kontrol altına alınıyor. Uzman ekipler yalnızca Türklerden oluşmuyor: Yardımımıza Ukrayna ve Rusya'nın yangın söndürme uçakları ile Azerbaycan'ın personeli de gönderildi. Bu mücadeleyi kara gün dostlarımız ve Türk azmiyle kazandık."
 Turkey.351.a:0 "Aferin Ekip!"
 Turkey.352.title:0 "Izmir'deki HDP Binasina Saldiri"
 Turkey.352.desc:0 "17 Haziran 2021 saat 11.05'te Onur Gencer, İzmir'in Konak ilçesindeki Şair Eşref Bulvarı'nda bulunan Halkların Demokratik Partisi (HDP) il başkanlığı binasına girerek tabancayla ateş açtı ve parti çalışanı Deniz Poyraz'ı öldürdü."
 Turkey.352.a:0 "Belirsiz Zamanlar"
 Turkey.353.title:0 "Kürt Aileye Provokatif Saldiri"
 Turkey.353.desc:0 "12 Mayıs'ta Konya'da bir grubun saldırısına uğrayan Kürt ailenin evi bugün ikinci kez saldırıya uğradı. Saldırıda Dedeoğlu ailesinden 7 kişi hayatını kaybetti. Saldırganlar evin bir bölümünü ateşe verdi. DHA'nın haberine göre olay saat 18.50 sıralarında Konya'nın merkez Meram ilçesine bağlı Hasanköy Mahallesi Özşahin Sokak'ta meydana geldi. Aile 12 Mayıs'ta da bıçak, taş ve sopalarla gelen 60 kişilik bir grubun "Biz buranın yerlisiyiz, sizi burada yaşatmayacağız" diyerek saldırısına uğramıştı. İlk saldırıyla ilgili gözaltına alınan 5 kişi delil yetersizliği gerekçesiyle serbest bırakılmıştı. Ev savcı ve emniyet müdürü tarafından incelenirken çevresine çok sayıda çevik kuvvet polisi konuşlandırıldı. Ailenin yakınlarının Kars'tan gelmesi bekleniyor. Hayatını kaybedenlerin isimleri şöyle: Yaşar Dedeoğlu, Barış Dedeoğlu, Serpil Dedeoğlu, Serap Dedeoğlu, İpek Dedeoğlu, Metin Dedeoğlu, Sibel Dedeoğlu. Bölgeye cenaze araçları getirildi. Polisin güvenlik çemberine aldığı evin yakınına basın mensuplarının girmesine izin verilmiyor."
 Turkey.353.a:0 "Belirsiz Zamanlar"
 Turkey.354.title:0 "Mete Gazoz Olimpiyat Sampiyonu Oldu"
 Turkey.354.desc:0 "Millî okçumuz Mete Gazoz olimpiyat şampiyonu oldu! Ülkemizin sporda iyi bir konumda olmasından mutluluk duyuyoruz."
 Turkey.354.a:0 "Güzel"
 Turkey.355.title:0 "Recep Tayyip Erdogan Amerikalilara Karsi Konustu"
 Turkey.355.desc:0 "ABD ile yaşanan gerginliğe, ekonomideki dalgalanmalara ve dolardaki yükselişe değinen Erdoğan şöyle konuştu: "Çeşitli kampanyalar yürütülüyor. Sakın ha onlara kulak asmayın. Unutmayın, onların doları varsa bizim halkımız var, hakkımız var, Allah'ımız var. Çok çalıştık, çok çalıştık. 16 yıl önce neydik, şimdi neyiz? Daha iyi olacağız. Sizlere sabır ve gayret diliyorum. Çok çalışacağız, çok koşacağız ve 2023'e çok farklı gireceğiz.""
 Turkey.355.a:0 "Coşkulu Bir Konuşma"
 Turkey.356.title:0 "Türkiye'de Ilk COVID-19 Vakasi"
 Turkey.356.desc:0 "Koronavirüs ülkemize ulaştı. Virüsle birlikte ekonomimiz gerileyecek, virüsü önlemek için yapılan harcamalar da ekonomik faaliyetlere ciddi zarar verecek."
 Turkey.356.a:0 "Olamaz!"
 Turkey.357.title:0 "Türkiye'de Ilk COVID-19 Vakasi"
 Turkey.357.desc:0 "Koronavirüs ülkemize ulaştı. Virüsle birlikte ekonomimiz gerileyecek, virüsü önlemek için yapılan harcamalar da ekonomik faaliyetlere ciddi zarar verecek."
 Turkey.357.a:0 "Olamaz!"
 Turkey.358.title:0 "Türkiye'den Yunanistan'a Tepki"
 Turkey.358.desc:0 "Bakanlık kaynaklarından edinilen bilgiye göre, dün gece Edirne'de Yunanistan'ın sınırda açtığı ateş sonucu bir Türk vatandaşının hayatını kaybetmesi üzerine bu ülkenin Ankara Büyükelçiliği Maslahatgüzarı Eleni Vakali Bakanlığa çağrılarak Türkiye'nin tepkisini içeren bir nota verildi."
 Turkey.358.a:0 "Tepki Göstermeliyiz"
 Turkey.359.title:0 "#OYMOYYOK Etiketi"
 Turkey.359.desc:0 "Cumhurbaşkanı Erdoğan, yarınki YKS öncesinde gençlerle video konferans yoluyla buluşarak YKS, sosyal medya ve koronavirüs salgınıyla ilgili sorularını yanıtladı. Erdoğan, "Öğrencilerimizin bir ay daha sınav stresi yaşamasını istemedik" dedi ve Twitter'daki 16 milyon takipçisini hatırlatarak "Sosyal medyadan nefret etseydik bu kadar yaygın ve etkili kullanmazdık" diye ekledi. Sosyal medyaya ilişkin güçlü bir yasal altyapı oluşturacaklarını belirten Erdoğan, "Yapacağımız yasal düzenlemelerle milletimizi yeniden güvenilir bir internet ortamına kavuşturacağız" dedi.\n\nCanlı yayın YouTube ve Twitter gibi platformlarda sürerken pek çok genç izleyiciden "Oy moy yok", "Sandıkta görüşürüz" gibi tepki yorumları geldi. Yorumların ardından yayın yorumlara kapatıldı; gençlerin tepkisi ise #OyMoyYok etiketiyle sosyal medyaya taşındı."
 Turkey.359.a:0 "Kendilerini ne sanıyorlar?"
 Turkey.360.title:0 "Prompter Kazasi"
 Turkey.360.desc:0 "Cumhurbaşkanı Erdoğan canlı yayında bir "prompter kazası" yaşadı. Ekranda cümleler hızla akınca yetişemeyen Erdoğan "geri al" diye müdahale etti, ancak ekip "Canlıdayız" diye uyardı. Erdoğan'ın ardından dudağını ısırdığı görüldü."
 Turkey.360.a:0 "Korkunç Haber!"
 Turkey.361.title:0 ""Hudut Namustur" Pankartlari"
 Turkey.361.desc:0 ""Hudut Namustur" pankartı asan 6 genç gözaltına alındı. Olay sosyal medyada büyük tepki doğurdu. Bu durum istikrara ve halkımızın bize olan güvenine darbe vuracak."
 Turkey.361.a:0 "Hiç İyi Görünmüyor"
 Turkey.362.title:0 "28 Subat'in Mirasi"
 Turkey.362.desc:0 "Türkiye'de 1997 askerî muhtırası, Türk askerî yönetiminin 28 Şubat 1997'deki Millî Güvenlik Kurulu toplantısında aldığı kararları ifade eder. Bu muhtıra, Refah Partisi'nden İslamcı Başbakan Necmettin Erbakan'ın istifasına ve koalisyon hükümetinin sona ermesine yol açan süreci başlattı.\n\nHükümet meclis feshedilmeden ve anayasa askıya alınmadan iktidardan uzaklaştırıldığı için olay, Oramiral Salim Dervişoğlu tarafından meşhur ifadesiyle "postmodern darbe" olarak adlandırıldı. Darbe sonrasındaki sürecin ordu içindeki gizli bir yapılanma olduğu ileri sürülen Batı Çalışma Grubu tarafından yürütüldüğü iddia ediliyor."
 Turkey.362.a:0 "Ordunun Siyasette Büyük Bir Ağırlığı Var"
 Turkey.363.title:0 "15 Temmuz'un Mirasi"
 Turkey.363.desc:0 "15 Temmuz'da hain darbe girişimini püskürttük. İçimizde örgütlenip devletin tüm kademelerini ele geçiren Gülen yapılanması, devletin gücünü kullanmasına rağmen Türkiye'yi yıkamadı. Çünkü halk buna izin vermedi. Türk milleti bu hain darbe girişiminde Cumhurbaşkanı Recep Tayyip Erdoğan'ın yanında saf tuttu. Ayrıca bu hain darbe girişimine sebep olan korgeneraller ve generaller tutuklandı ve Türkiye Cumhuriyeti devletini yıkmaya teşebbüsten ağır cezalara çarptırıldı."
 Turkey.363.a:0 "Yaşasın Kahraman Türk Milleti!"
 Turkey.364.title:0 "GENÇ Parti Destegimizi Istiyor"
 Turkey.364.desc:0 "Genç Parti üyeleri bizden destek istiyor. Destek istemelerinin nedeni, kendi partilerinin seçim barajını aşıp iktidarda kalmasını sağlamak. Efendim, onları destekleyelim mi?"
 Turkey.364.a:0 "Onları Destekleyin"
 Turkey.364.b:0 "Onları Desteklemeye Gerek Yok"
 Turkey.365.title:0 "Covid-19 Ülkemizi Vurdu"
 Turkey.365.desc:0 "Koronavirüs ülkemize ulaştı. Virüsle birlikte ekonomimiz gerileyecek, virüsü önlemek için yapılan harcamalar da ekonomik faaliyetlere ciddi zarar verecek."
 Turkey.365.a:0 "Covid-19 Krizi Kapımızda"
 Turkey.366.title:0 "NATO'dan Hatay Ziyareti"
 Turkey.366.desc:0 "NATO Genel Sekreteri Jens Stoltenberg, Dışişleri Bakan Yardımcısı Yavuz Selim Kıran ile birlikte çeşitli ziyaretlerde bulunmak üzere Hatay'a geldi.\n\nNATO Genel Sekreteri Jens Stoltenberg, 7 Mayıs 2019 Salı günü saat 10.45'te Hatay Havalimanı'na indi. Stoltenberg, Dışişleri Bakan Yardımcısı Yavuz Selim Kıran ve NATO üyesi ile gözlemci ülkelerin temsilcilerinden oluşan heyet; Hatay Valisi Rahmi Doğan, Hatay Büyükşehir Belediye Başkanı Lütfü Savaş, İl Jandarma Komutanı Albay Uğur Ertekin ve protokol üyeleri tarafından karşılandı.\n\nStoltenberg ve beraberindeki heyet daha sonra Hatay İl Afet ve Acil Durum Müdürlüğü'ne geldi.\n\nNATO Genel Sekreteri Stoltenberg başkanlığında Hatay AFAD salonlarında yapılan toplantıda "Türkiye'nin bölgesel tehditlere bakışı", "Türkiye'nin düzensiz göçle mücadelesi" ve Zeytin Dalı ile Fırat Kalkanı bölgelerinde terör örgütlerinden temizlenen alanlara dönüşler gibi konular değerlendirildi.\n\nBasına kapalı gerçekleştirilen toplantının ardından Genel Sekreter ve beraberindeki heyet, kendileri için düzenlenen sosyal program kapsamında bir ilkokulu ziyaret etti, Hatay mutfağını tattı, St. Pierre Kilisesi ile Hatay Arkeoloji Müzesi'ni gezdikten sonra şehrimizden hava yoluyla ayrıldı."
 Turkey.366.a:0 "Hatay Meselesi İçin Çok İyi Haber"
 Turkey.367.title:0 "NATO Suriye'nin Hatay Iddialarini Reddetti"
 Turkey.367.desc:0 "NATO, Suriye'nin Hatay üzerindeki taleplerini tamamen reddetti ve Hatay'ın Türk toprağı olduğunu açıkladı. NATO, Hatay'ı almaya yönelik herhangi bir saldırı karşısında Suriye'nin tüm NATO ülkelerine savaş açmış sayılacağını belirtti."
 Turkey.367.a:0 "NATO İyi İş Çıkarıyor"
 Turkey.368.title:0 "Recep Tayyip Erdogan Afrika Turuna Basladi"
 Turkey.368.desc:0 "Recep Tayyip Erdoğan Afrika turuna başladığını duyurdu. Cumhurbaşkanı Recep Tayyip Erdoğan Afrika turu kapsamında Angola, Togo, Burkina Faso, Liberya ve Nijerya'yı ziyaret edecek. Bu turun sonunda Türkiye'nin siyasi olarak güçleneceği açık."
 Turkey.368.a:0 "Çok İlginç"
 Turkey.369.title:0 "Erdogan Yeni Kitabini Yayimladi"
 Turkey.369.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan'ın kaleme aldığı ve ilk olarak Türkçe olarak Turkuvaz Kitap tarafından yayımlanan "Daha Adil Bir Dünya Mümkün" adlı kitap yarın raflardaki yerini alıyor.\n\n40 TL'den satışa sunulacak kitapta şu ifadeler yer alıyor:\n\n"Tüm dünyanın kaderini etkileyecek konularda yalnızca beş ülkenin karar vermesi ne ahlaki ne de adildir. Dünya beşten büyüktür.\n\nAdil ve daha sürdürülebilir bir küresel barışın sağlanması için çok kültürlülüğü ve çok kutupluluğu yansıtan bir BM'ye ihtiyaç vardır.\n\nDünya ne tek kutupludur ne de iki kutuplu; ne baskın bir kültürün ne de birkaç ayrıcalıklı aktörün kültürel hegemonyası altındadır. Çok kutuplu, çok merkezli, çok kültürlü, daha kapsayıcı ve adil bir dünya kurmak mümkündür. Böyle bir dünyanın ilk adresi BM'dir.\n\nBarışa, istikrara, adalete ve etkin bir küresel yönetişime giden yol BM'nin reformundan geçer. BM'nin reformu ve özellikle Güvenlik Konseyi yapısının yeniden düzenlenmesi elbette dünyanın tüm ülkelerinin uzlaşısıyla hayat bulacaktır.\n\nTürkiye olarak uzun zamandır bu çerçevedeki önerimizi dile getiriyor ve tüm ülkelerin tartışmasına açıyoruz. Çözüm önerimiz, 'Dünya beşten büyüktür' ifadesinde kendini bulan ve BM Güvenlik Konseyi'nin yapısını değiştirmeye odaklanan bir bakış açısını hâkim kılmaktır. Konsey'in kıtaları, inançları, kökenleri ve kültürleri mümkün olan en adil şekilde temsil edecek biçimde yeniden yapılandırılması, çözüme ve küresel barışın tesisine yönelik devrim niteliğinde bir adım olacaktır.""
 Turkey.369.a:0 "İlginç"
 Turkey.370.title:0 "Cem Uzan AB'ye Saldirdi"
 Turkey.370.desc:0 "Cem Uzan bir konuşmasında Avrupa Birliği'ne yüklendi. Cem Uzan, "İngiltere ile Türkiye arasındaki görüşmeler sonucunda Türkiye Avrupa Birliği'ne girmeyecek, İngiltere de AB'den çıkacak" dedi. İngiltere'nin AB'den çıkacağını söylemesi Avrupa'yı paniğe sürükledi."
 Turkey.370.a:0 "Harika"
 Turkey.371.title:0 "Cem Uzan Ingiliz Sanayicilerle Anlasmalar Imzaladi"
 Turkey.371.desc:0 "İngiltere'ye giden Cem Uzan orada İngiliz yatırımcılarla görüşmeler yaptı. Görüşmeler sonunda iki taraf da memnun kaldı. İngilizler Türkiye'ye yatırım yapacak, Türkiye de karşılığında İngiltere'nin Arabistan'dan petrol almasını kolaylaştıracak."
 Turkey.371.a:0 "Harika Bir Anlaşma"
 Turkey.372.title:0 "CHP-MHP Ittifaki Kuruldu"
 Turkey.372.desc:0 "CHP ile MHP arasındaki görüşmeler sona erdi. Görüşmeler sonucunda iki taraf ittifak kurma kararı aldı. Bu ittifakın amacı bizi iktidardan indirmek ve meşru iktidarı ele geçirmek."
 Turkey.372.a:0 "Üstünlüğümüze Karşı Birleştiler"
 Turkey.373.title:0 "Ekmeleddin Ihsanoglu CHP-MHP'nin Cumhurbaskani Adayi Oldu"
 Turkey.373.desc:0 "Kılıçdaroğlu, cumhurbaşkanı adaylığına ilişkin görüşmeleri kapsamında MHP Genel Başkanı Devlet Bahçeli'yi TBMM'deki makamında ziyaret etti.\n\nGörüşmenin ardından gazetecilere açıklama yapan Kılıçdaroğlu, bir süredir çeşitli siyasi partileri, sivil toplum kuruluşlarını ve sanatçıları ziyaret ederek cumhurbaşkanlığı konusundaki görüşlerini aldığını hatırlattı.\n\nCHP Genel Başkanı Kemal Kılıçdaroğlu, MHP Genel Başkanı Devlet Bahçeli'ye İslam İşbirliği Teşkilatı (İİT) eski Genel Sekreteri Ekmeleddin İhsanoğlu'nun adını cumhurbaşkanlığı için "çatı aday" olarak önerdi. MHP Genel Başkanı Bahçeli de bu adayı olumlu karşıladıklarını ve bu isim etrafında birlikte çalışacaklarını açıkladı."
 Turkey.373.a:0 "Düşman Adayını Belirledi"
 Turkey.374.title:0 "Pelikan Dosyasi"
 Turkey.374.desc:0 "Pelikan Dosyası, 28 Ağustos 2014'te görevlerine başlayan iki Adalet ve Kalkınma Partisi siyasetçisi, Başbakan Ahmet Davutoğlu ile Cumhurbaşkanı Recep Tayyip Erdoğan arasındaki anlaşmazlık noktalarını sıralayan ve Nisan 2016'da yayımlanan, kimin hazırladığı belli olmayan 27 maddelik bir listeyi ifade eder. İsimsiz Erdoğan destekçileri tarafından bir WordPress.com blogunda yayımlanan dosya, Davutoğlu'nu Erdoğan'ın siyasi gündemine uymamakla sert bir dille eleştiriyordu. Dosyanın yayımlanması, sonunda Davutoğlu'nun başbakanlıktan uzaklaştırılmasına yol açan olayları başlatan gelişme olarak yaygın biçimde kabul edilir. "Pelikan Dosyası" adı, 1993 yapımı siyasi gerilim filmi Pelikan Dosyası'na göndermedir. Dosya, Davutoğlu ile Erdoğan arasındaki ilişkilerin keskin biçimde bozulduğu bir dönemde yayımlandı. Davutoğlu'nun başbakanlıktan istifasını sunduğuna dair söylentilerin ardından AKP Merkez Karar ve Yönetim Kurulu (MKYK), Davutoğlu'nun il ve ilçe teşkilatlarına atama yetkisini elinden aldı. 4 Mayıs 2016'da, planlanandan bir gün önce, Davutoğlu ile Erdoğan Cumhurbaşkanlığı Külliyesi'nde bir araya geldi. Cumhurbaşkanlığı çalışanlarınca başta "rutin bir görüşme" olarak nitelendirilse de görüşmenin hemen ardından AKP, Davutoğlu'nun genel başkan adayı olmayacağı olağanüstü bir kurultayı 2016'da yapma kararı aldı. "Muhtıra"nın yayımlanmasını ve amacını blog yazarı Fuat Avni önceden tahmin etmişti. Avni, 19 Nisan 2016'da Erdoğan'ın "Davutoğlu'na karşı darbe" planladığını ve "Berat ile Serhat"ın (Erdoğan'ın damadı ve kardeşine gönderme) "pelikanı"nın uçmak üzere olduğunu yazmıştı. Olay Türk sosyal medyasında ve başka kaynaklarda saray darbesi olarak nitelendirildi."
 Turkey.374.a:0 "Binali Yıldırım'ın Önü Açıldı"
 Turkey.375.title:0 "MHP-DSP Koalisyon Görüsmelerinden Olumlu Sonuç"
 Turkey.375.desc:0 "MHP ile DSP arasındaki görüşmeler sonuç verdi. MHP seçimlerde DSP ile birlikte olacak. Bu kararın alınması DSP ve Bülent Ecevit için çok iyi bir haber."
 Turkey.375.a:0 "Harika Haber"
 Turkey.376.title:0 "ANAP-DSP Koalisyon Görüsmelerinden Olumlu Sonuç"
 Turkey.376.desc:0 "ANAP ile DSP arasındaki görüşmeler sonuç verdi. ANAP seçimlerde DSP ile birlikte olacak. Bu kararın alınması DSP ve Bülent Ecevit için çok iyi bir haber."
 Turkey.376.a:0 "Harika Haber"
 Turkey.377.title:0 "Bülent Ecevit'in Durumu"
 Turkey.377.desc:0 "Liderimiz Ecevit yaşlı görünüyor. Bülent Ecevit'i tedavi etmiş ve ölümünü önleyecek doğru teşhisi koymuş olabiliriz, ama yaşlılığın çaresi yok. Önümüzde iki seçenek var: Ecevit ile devam etmek ya da iktidarı riske atmadan Ecevit'i emekliye ayırıp Ecevit'in gösterdiği kişiyle yola devam etmek."
 Turkey.377.a:0 "Onu Emekliye Ayırmanın Vakti Geldi!"
 Turkey.377.b:0 "Ölene Kadar Bizi Yönetecek"
 Turkey.378.title:0 "Ecevit'in Basarisiz Politikalari"
 Turkey.378.desc:0 "Ecevit'in politikaları başarısız olmaya başladı. Siyasi manevraları ve hamleleri çok eskimiş durumda. Siyasi olarak güçlenmemizi ve modernleşmemizi sağlamalıyız. Bir kadro değişikliği bu sorunları kesinlikle çözecektir."
 Turkey.378.a:0 "Kadro Değişikliği Bir An Önce Yapılmalı"
 Turkey.379.title:0 "YTP'nin Kurulusu"
 Turkey.379.desc:0 "Başbakan ve parti lideri olan kıdemli devlet adamı Bülent Ecevit'in sağlık durumu, Başbakan Yardımcısı ve Devlet Bakanı Hüsamettin Özkan'ın onun yerine geçmek için plan yaptığı söylentilerine yol açtı. Bunun sonucunda Özkan istifa etmek zorunda kaldı. Ancak Dışişleri Bakanı İsmail Cem de dahil olmak üzere DSP milletvekillerinin neredeyse yarısı onu izledi. Özkan, Cem ve ekonomiden sorumlu Devlet Bakanı, Dünya Bankası eski Başkan Yardımcısı Kemal Derviş daha sonra yeni bir sosyal demokrat parti olan Yeni Türkiye Partisi'ni kurmaya karar verdi. Partinin genel başkanı Cem oldu."
 Turkey.379.a:0 "Hainler!"
 Turkey.380.title:0 "TELSIM'in Yükselisi!"
 Turkey.380.desc:0 "Genç Parti'nin iktidara gelmesiyle TELSİM şirketi güçlendi. Bu güçlenme Genç Parti'yi daha ileri seviyelere taşıdı ve cesaretlendirdi. Şirketin siyasi bir nitelik kazanması ona hızlı bir ivme kazandırabilir de, çöküşüne de yol açabilir. Şirketi büyütelim mi?"
 Turkey.380.a:0 "Şirketi Büyütmeye Gerek Yok"
 Turkey.380.b:0 "Şirketi Büyütün"
 Turkey.381.title:0 "Ekrem Imamoglu Twitch Yayinina Katildi"
 Turkey.381.desc:0 "Bir metropol olan İstanbul'u yönetmesiyle son dönemde popülerlik kazanan Ekrem İmamoğlu, Twitch yayıncısı Purplebixi ile yayın yapacağını duyurdu. CHP'nin Z kuşağının oylarını almak için sosyal medyadaki kampanyalarını artırdığı görülüyor. Sosyal medya platformları birebir oy toplamak için biçilmiş kaftan."
 Turkey.381.a:0 "Twitch Bir Tür Twitter Siyasetine Dönüşüyor"
 Turkey.382.title:0 "Merkez Bankasi Faizi 16'ya Indirdi"
 Turkey.382.desc:0 "Merkez Bankası politika faizini yüzde 18'den yüzde 16'ya indirdi. İndirim beklentilerin çok üzerinde oldu. Banka 23 Eylül'deki toplantıda da faizi 100 baz puan düşürmüştü. Merkez Bankası'nın faiz kararının ardından dolar ivme kazandı."
 Turkey.382.a:0 "Dolar Kendisiyle Yarışıyor"
 Turkey.383.title:0 "2003: Ertelenen Seçimler"
 Turkey.383.desc:0 "15. Türkiye genel seçimleri 3 Kasım 2002'de yapılacaktı, ancak Bülent Ecevit liderliğindeki DSP-MHP-ANAP koalisyonunun direnmesi üzerine seçimler 6 Haziran 2003'e ertelendi. Türkiye Büyük Millet Meclisi'nin 550 sandalyesinin tamamı için seçim yapılacak."
 Turkey.383.a:0 "Hadi Bakalım!"
 Turkey.384.title:0 "Özbekistan Türk Birligi'ne Tam Üye Oldu"
 Turkey.384.desc:0 "Türk Konseyi üyelerinin evet oylarıyla Özbekistan tam üye oldu. Türk Konseyi büyüyor."
 Turkey.384.a:0 "İyi Haber"
 Turkey.385.title:0 "Macaristan ve Türkmenistan Türk Birligi'ne Gözlemci Oldu"
 Turkey.385.desc:0 "Türk Konseyi üyelerinin evet oylarıyla Türkmenistan ve Macaristan Türk Konseyi'ne gözlemci oldu. Türk Konseyi büyüyor."
 Turkey.385.a:0 "İyi Haber"
