 Turkey.148.title:0 "Çorlu Tren Kazasi"
 Turkey.148.desc:0 "8 Temmuz 2018'de Türkiye saatiyle 17:15'te İstanbul-Pythio demiryolu hattında İstanbul'daki Halkalı Garı'na giden 12703 numaralı altı vagonlu Uzunköprü-Halkalı bölgesel treninin beş vagonu, Tekirdağ'ın Çorlu ilçesine bağlı Sarılar köyü yakınlarında 162. kilometrede (101 mil) raydan çıktı. Trendeki 362 yolcu ve altı mürettebattan 24'ü hayatını kaybetti, 318'i yaralandı. Hafif yaralanan 276 yolcu tedavilerinin ardından taburcu edilirken ağır yaralanan 42 kişinin Tekirdağ, Çorlu ve İstanbul'daki hastanelerde tedavisi sürüyor."
