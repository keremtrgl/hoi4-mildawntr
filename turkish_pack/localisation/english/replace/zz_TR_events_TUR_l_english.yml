 Turkey.153.title:0 "Türkiye Yerel Seçimleri"
 Turkey.153.desc:0 "Ülke genelinde yerel seçimler yapıldı. Ekrem İmamoğlu İstanbul büyükşehir belediye başkanlığı seçimini 29.000 oy farkla kazandığını söylüyor; ancak iktidar partisi İmamoğlu'nun %48,65'ine karşılık %48,70 oy aldığını öne sürüyor. Binali Yıldırım ise %48,71 oy aldığını ve seçimi kazandığını iddia ediyor."
