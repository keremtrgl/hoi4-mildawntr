l_english:
 Turkey.1.title:0 "Hayata Dönüs Operasyonu"
 Turkey.1.desc:0 "Mahkûmların protestoları ve açlık grevleri bize bazı mahkûmlara özgürlüklerini vermemiz gerektiğini gösterdi. Hükümetimizin yeni bir af yasası çıkarması gerekiyor. Bu afla halkımız memnun ve mutlu olacak. Af planlarına başlayalım."
 Turkey.1.a:0 "Durum Kötü Görünüyor"
 Turkey.2.title:0 "Türk Halkinin 2000'lerden Beklentisi"
 Turkey.2.desc:0 "Halkımız 2000'lerde çok daha güçlü bir Türkiye istiyor ve hayal ediyor. Umduğumuz gibi önümüzdeki yıllarda güçlü ve yıkılmaz olacağız."
 Turkey.2.a:0 "2000'ler Bizim Yıllarımız Olacak!"
 Turkey.3.title:0 "2001 Türkiye Ekonomik Krizi"
 Turkey.3.desc:0 "19 Şubat 2001'de Başbakan Ecevit, Cumhurbaşkanı Sezer ile yaptığı toplantıdan "Bu ciddi bir kriz" diyerek çıktı. Bu söz, finansal ve siyasi istikrarsızlığın altını çizdi ve piyasalarda daha büyük bir paniğe yol açtı. Hisse senetleri çakıldı ve faiz oranı %3.000'e ulaştı. Büyük miktarda Türk lirası ABD dolarına veya avroya çevrildi ve Merkez Bankası rezervlerinden 5 milyar kaybetti. Çöküş daha da büyük bir ekonomik çalkantıyı tetikledi. 2001'in ilk sekiz ayında 14.875 kişi işini kaybetti, dolar 1.500.000 liraya çıktı ve zaten yüksek olan gelir eşitsizliği daha da arttı."
 Turkey.3.a:0 "Ooo..."
 Turkey.4.title:0 "Uçak Kazasi!"
 Turkey.4.desc:0 "16 Mayıs: TUSAŞ tarafından üretilen CASA tipi bir askeri kargo uçağı Malatya'nın Akçadağ ilçesi yakınlarında düştü. 34 asker hayatını kaybetti; bunlardan 10'u Türk."
 Turkey.4.a:0 "Kötü Haber"
 Turkey.5.title:0 "Hükümete Karsi Protestolar"
 Turkey.5.desc:0 "2001 krizinin ardından Türk halkı sokaklarda hükümeti protesto etmeye başladı. Bu olaylar Batı yanlısı hükümetimizin sonu olacak."
 Turkey.5.a:0 "Of..."
 Turkey.6.title:0 "Erken Seçim!"
 Turkey.6.desc:0 "Meclis Genel Kurulu'nda yapılan oylamada erken seçim önergesi, oylamaya katılan 514 milletvekilinin 449'unun oyuyla kabul edildi."
 Turkey.6.a:0 "Sandıkları Hazırlayın"
 Turkey.7.title:0 "Basbakan Bülent Ecevit Hastaneye Kaldirildi"
 Turkey.7.desc:0 "Başbakan Bülent Ecevit, Başbakanlık merkez binasında rahatsızlandı ve Başkent Üniversitesi Hastanesi'ne kaldırıldı."
 Turkey.7.a:0 "Hükümet Çöküyor"
 Turkey.8.title:0 "AKP'nin Kurulusu"
 Turkey.8.desc:0 "Sağcı İslamcı Fazilet Partisi'nin kapatılmasının ardından partinin bazı kurucuları AKP adında farklı bir parti kurdu. Bu parti ılımlı İslamcıdır ve başlangıçta Gülen hareketiyle birlikte çalıştı."
 Turkey.8.a:0 "Bu parti Fazilet Partisi'nin devamıdır"
 Turkey.9.title:0 "AKP'nin Yükselisi"
 Turkey.9.desc:0 "AKP ülkede hızla güç kazanmaya başladı. AKP mitingleri insanlarla dolup taşıyor. Bu gidişle ülke İslamcıların eline geçecek! Bir şey yapmalı mıyız?"
 Turkey.9.a:0 "AKP Karşıtı Propaganda Yap"
 Turkey.9.b:0 "Boş Ver"
 Turkey.10.title:0 "CHP'nin Yükselisi"
 Turkey.10.desc:0 "Partimize oy veren laik seçmenler CHP'ye kaymaya başladı. Bu gidişle hükümetimiz düşecek."
 Turkey.10.a:0 "Olamaz!"
 Turkey.11.title:0 "Seçim Kampanyasi"
 Turkey.11.desc:0 "15. Türkiye genel seçimi, Bülent Ecevit liderliğindeki DSP-MHP-ANAP koalisyonunun çökmesinin ardından 3 Kasım 2002'de yapılacaktı. Türkiye Büyük Millet Meclisi'nin 550 üyesinin tamamı seçilecekti."
 Turkey.11.a:0 "Hadi Bakalım!"
 Turkey.12.title:0 "Istanbul'da Protestolar"
 Turkey.12.desc:0 "İstanbul'da pek çok kişi ABD'nin Irak'ı işgal planlarını protesto etti. Bu olayla halkımızın ABD'ye karşı muhalefeti muazzam ölçüde arttı."
 Turkey.12.a:0 "Belirsiz Zamanlar"
 Turkey.13.title:0 "Çilgin Bir Teklif"
 Turkey.13.desc:0 "ABD bizi bir NATO gücü olarak Irak'a karşı savaşa davet etti ve katılırsak bize 6 milyar dolar vereceğini açıkladı. Efendim, ne yapmalıyız? Katılalım mı, katılmayalım mı?"
 Turkey.13.a:0 "10 Milyar Lazım"
 Turkey.13.b:0 "Operasyona Katılalım!"
 Turkey.13.c:0 "Irak'ın Bağımsızlığına Saygı Duyuyoruz"
 Turkey.14.title:0 "Türkiye'nin Teklifi"
 Turkey.14.desc:0 "Türk hükümeti, ABD 6 milyar dolarlık dış yardım paketini 10 milyara çıkarmadıkça savaşa onay vermeyeceğini açıkladı."
 Turkey.14.a:0 "Davamızda Müttefikimize İhtiyacımız Var"
 Turkey.14.b:0 "Hayır, Onlarsız Daha İyiyiz"
 Turkey.15.title:0 "ABD Kabul Etti"
 Turkey.15.desc:0 "ABD, sözde Irak'a Özgürlük Operasyonu'na katılabilmemiz için 6 milyar dolarlık dış yardım paketini 10 milyara çıkardı."
 Turkey.15.a:0 "Operasyona Hazırız!"
 Turkey.16.title:0 "Amerika Reddetti"
 Turkey.16.desc:0 "ABD, 6 milyar dolarlık dış yardım paketini 10 milyara çıkarmamaya karar verdi; dolayısıyla Irak'la savaşa girmeyeceğiz."
 Turkey.16.a:0 "O hâlde savaş yok."
 Turkey.17.title:0 "Rauf Denktas BM'nin Kibris Birlesme Planini Reddetti"
 Turkey.17.desc:0 "Kıbrıslı Türklerin lideri Rauf Denktaş, Kıbrıs'ı yeniden birleştirmeye yönelik Birleşmiş Milletler planının son versiyonunu reddetti; böylece Kuzey Kıbrıs bağımsız kalıyor."
 Turkey.17.a:0 "Güzel"
 Turkey.19.title:0 "Recep Tayyip Erdogan Milletvekili Seçildi"
 Turkey.19.desc:0 "Recep Tayyip Erdoğan Türkiye Büyük Millet Meclisi'ne seçildi ve yakında Başbakan olması bekleniyor. Erdoğan ABD askerlerinin Türkiye'ye konuşlandırılmasını destekliyor ve ilk resmî icraatlarından biri olarak bu konuda yeni bir oylama yapılmasını istemesi bekleniyor."
 Turkey.19.a:0 "İlginç"
 Turkey.20.title:0 "Türkiye-ABD Krizi"
 Turkey.20.desc:0 "Kuzey Irak'ta görev yapan Türk askeri personeli ABD ordusu tarafından yakalandı, başlarına çuval geçirilerek götürüldü ve sorgulandı."
 Turkey.20.a:0 "ABD bunun hesabını verecek!"
 Turkey.21.title:0 "Eurovision Zaferi"
 Turkey.21.desc:0 "Sertab Erener, Everyway That I Can şarkısıyla Eurovision Şarkı Yarışması'nı kazandı; bu Türkiye'nin yarışmadaki ilk zaferi. Onunla gurur duyuyoruz."
 Turkey.21.a:0 "Harika, harika, harika!"
 Turkey.22.title:0 "IBDA-C Bombalamalari!"
 Turkey.22.desc:0 "HSBC Bank genel merkezinde ve İngiliz Başkonsolosluğu'nda iki bomba yüklü kamyon daha patladı; otuz kişi hayatını kaybetti, 400 kişi yaralandı. Bombacıların etkiyi en üst düzeye çıkarmak için Levent'te Büyükdere Caddesi'ndeki HSBC genel merkezinin önündeki trafik ışıklarının kırmızıya dönmesini beklediği anlaşılıyor. İki saldırıda İstanbul'daki en üst düzey İngiliz yetkili Başkonsolos Roger Short dahil birkaç İngiliz öldü; daha önceki sinagog saldırılarında olduğu gibi kurbanların geri kalanı çoğunlukla Türk vatandaşlarıydı (oyuncu ve şarkıcı Kerem Yılmazer gibi)."
 Turkey.22.a:0 "Aman Tanrım"
 Turkey.23.title:0 "2004 Türkiye Yerel Seçimleri"
 Turkey.23.desc:0 "2004 Türkiye yerel seçimleri, belediye başkanlarını ve meclis üyelerini seçmek için 28 Mart 2004'te Türkiye'nin seksen bir ilinin tamamında yapıldı. 16 büyükşehir ve 3.193 ilçe belediyesinin tamamı için seçime gidilirken 3.208 il genel meclisi üyesi ve 34.477 belediye meclis üyesi de seçildi. Ayrıca 50.000'den fazla muhtar seçildi; ancak muhtarların herhangi bir siyasi bağlantısı yoktur."
 Turkey.23.a:0 "Halk sözünü söyledi"
 Turkey.24.title:0 "Afyon'un Adi Afyonkarahisar Olarak Degistirildi"
 Turkey.24.desc:0 "Afyon ilinin adı Afyonkarahisar olarak değiştirildi."
 Turkey.24.a:0 "Daha Uzun Bir İsim mi? Tamam"
 Turkey.25.title:0 "Okul Yasasi"
 Turkey.25.desc:0 "Cumhurbaşkanı Ahmet Necdet Sezer, "öğrenci affı" olarak bilinen ve üniversitelerden atılan öğrencilere yeni haklar getiren, Yükseköğretim Kanunu'na geçici maddeler eklenmesine ilişkin yasayı onayladı."
 Turkey.25.a:0 "Eğitimi Güçlendirelim"
 Turkey.26.title:0 "Bir Suriye Füzesi Türkiye Topraklarina Düstü"
 Turkey.26.desc:0 "Bir Suriye füzesi Hatay'ın Kırıkhan ilçesine düştü ve Suriye sınırına 25 kilometre uzaklıktaki iki ayrı noktada patlamaya yol açtı. Suriye Genelkurmayı, olayla ilgili Türk Genelkurmayı'nı bilgilendirdi ve üzüntüsünü bildirdi."
 Turkey.26.a:0 "Üzücü"
 Turkey.27.title:0 "Bir Protesto Daha, Bir Suikast Girisimi Daha"
 Turkey.27.desc:0 "Kütahya'da yeni akademik yılın açılışında Mustafa Bağdat adlı bir kişi, Başbakan Recep Tayyip Erdoğan'ı protesto etmeye çalışırken gözaltına alındı. Yapılan aramada şüphelinin çantasında taşıdığı ekmeğin içine gizlenmiş bir silah bulundu. Mustafa Bağdat ertesi gün tutuklandı."
 Turkey.27.a:0 "Aman Tanrım"
 Turkey.28.title:0 "Danistay Saldirisi"
 Turkey.28.desc:0 "Danıştay binası silahlı kişilerin saldırısına uğradı. 1 kişi öldü, 4 kişi yaralandı."
 Turkey.28.a:0 "Teröristler!"
 Turkey.29.title:0 "Cumhuriyet Mitingleri"
 Turkey.29.desc:0 "Türkiye'nin laik kimliğini koruması ve sürdürmesi, gösterilerden çok önce de bir tartışma ve gerginlik kaynağıydı. Başbakan Recep Tayyip Erdoğan geçmişte devlet dairelerinde ve okullarda İslami tarzda başörtüsü takılmasına yönelik kısıtlamalara karşı çıkmış ve dinî kurumları güçlendirecek adımlar atmıştı. Guardian Unlimited'e göre Erdoğan, 2004'te zinayı suç hâline getirme girişimini başlattığında İslamcı yüzünü göstermişti; bu girişim sonunda ülkedeki laik güçlerin ve Türkiye'nin katılmaya çalıştığı Avrupa Birliği'nin yoğun baskısıyla başarısız oldu.\n\nGenelkurmay Başkanı Orgeneral Yaşar Büyükanıt, Ekim 2006'da İslami köktendinciliğe karşı uyarıda bulundu. Başbakan Erdoğan böyle bir tehdit olmadığını söyledi. Büyükanıt gösteriden iki gün önce yaptığı basın toplantısında şunları söyledi: "Cumhuriyetin ilkelerine sözde değil özde bağlı birinin cumhurbaşkanı seçilmesini umuyoruz." Bu açıklama, Genelkurmay Başkanı'nın Erdoğan'a aday olmaması yönünde bir ima olarak yorumlandı.\n\nGörevdeki Cumhurbaşkanı Ahmet Necdet Sezer, gösterilerden bir gün önce "İslami köktendinciliğin ülkeye yönelik tehdidi hiç olmadığı kadar yüksek" diyerek Erdoğan'a açık bir gönderme yaptı. Makam ağırlıklı olarak sembolik olsa da Türkiye Cumhurbaşkanı, Anayasa'ya aykırı bulduğu yasaları ve üniversite rektörlükleri ile pek çok kamu kurumunun başkanlıkları gibi devlet yönetiminin en üst kademelerine yapılan atamaları veto etme yetkisine sahiptir. Anayasa Mahkemesi'nin eski başkanı olan Sezer, görev yaptığı yıllarda bunu pek çok kez yaptı. Hürriyet'in yakın zamanda yaptığı bir ankette katılımcıların çoğunluğu Cumhurbaşkanı'nın değerlendirmesine katıldı.\n\n24 Nisan'da Erdoğan, Dışişleri Bakanı Abdullah Gül'ü Adalet ve Kalkınma Partisi'nin resmî adayı olarak açıkladı. Gül'ün adaylığı, kapatılmış iki İslamcı partiden gelmesi ve 1995'te Guardian'da yayımlanan bir röportajda "Laik sistemi değiştirmek istiyoruz" demesi nedeniyle en başından tartışmalıydı. Bunun yanı sıra daha önce kamu binalarındaki yasak nedeniyle Türkiye aleyhine dava açmış olan eşinin başörtüsünün Türkiye'nin imajına etkisi gibi başka kaygılar da vardı.\n\n14 Nisan'da ilk protesto Ankara'daki Tandoğan Meydanı'nda gerçekleşti. Ankara'da Mustafa Kemal Atatürk'ün anıt mezarı olan Anıtkabir'in önünde toplanan kişi sayısının "yüz binlerce" ile 1,5 milyon arasında olduğu belirtildi. İlk protesto, o güne kadar Türkiye'nin yıllardır gördüğü en büyük gösterilerden biriydi. İlk protestonun hedefi, dönemin Başbakanı Recep Tayyip Erdoğan'ın olası cumhurbaşkanlığı adaylığıydı (sonuç, anayasada yapılan son değişiklikler zamanında onaylanmazsa, Erdoğan'ın Adalet ve Kalkınma Partisi'nin (AKP) rahat bir çoğunluğa sahip olduğu Türkiye Büyük Millet Meclisi'nde belirlenecekti). Erdoğan mitingin ardından cumhurbaşkanlığına aday olmamaya karar verdi.\n\nProtestonun sloganı Cumhuriyetine Sahip Çık idi. Anıtkabir'i yöneten Genelkurmay Başkanlığı'na göre o gün anıtı 370.000 kişi ziyaret etti; ancak katılımcıların tanıklıklarına göre en az bunun iki katı kadar kişi kalabalık alana giremedi. Polis açıklamaları 70.000 ile 150.000 arasında değişen çelişkili rakamlar verdi ve bu açıklamalar emniyet yetkilileri tarafından da eleştirildi: "Bu tür açıklamalar teşkilatın güvenilirliğini zedeliyor." CNN Türk mitinge 650.000'den fazla kişinin katıldığını bildirdi.\n\nGöstericilerin farklı motivasyonları vardı; bunlar arasında siyasal İslam'a bağlı olduğu düşünülen Erdoğan'ın laik devleti değiştireceği şüphesi de vardı. Erdoğan hükümeti İslami bir gündemi olduğunu reddediyor, ancak CNN'e göre bazı eleştirmenler hükümetin ülkeyi adım adım daha dinî bir yönetime doğru götürdüğünü savunuyor. Erdoğan geçmişte de yasayla başı derde girmişti: Türkiye'nin en kalabalık şehri İstanbul'un belediye başkanıyken "dinî nefreti kışkırtmak" suçundan yargılanıp mahkûm edilmiş ve sonuç olarak 2000 yılında dört ay hapis yatmıştı. Guardian Unlimited'e göre İslam yanlısı başbakanın partisi, laiklerin uzun süredir elinde tuttuğu iktidarı aşındırıyordu.\n\nProtesto "Atatürkçü Düşünce Derneği" tarafından başlatıldı ve Türkiye'deki yaklaşık 300 sivil toplum kuruluşu tarafından desteklendi. Önce Türkiye'nin dört bir yanından otobüslerle gelen yaklaşık 60.000 kişi 14 Nisan Cumartesi sabahın erken saatlerinde protesto alanına ulaştı. İnsanlar trenle geldi ve Ankara sakinleri de katılarak resmî başlangıçtan iki saat önce Tandoğan Meydanı'nı ve çevredeki sokakları doldurdu. Protestocular arasında muhalefet partilerinin liderleri Deniz Baykal (CHP), Zeki Sezer (DSP) ve akademik cübbeleriyle çeşitli üniversitelerden bazı profesörler de vardı. Türk bayrakları sallayan ve Atatürk resimli pankartlar taşıyan protestocular "Türkiye laiktir, laik kalacak" ve "Cumhurbaşkanı olarak imam istemiyoruz!" sloganları attı. Ankara merkezdeki gösteri yerel saatle 13:00'te (GMT 10:00) sona erdi. Ardından kalabalık, Cumhuriyetin kurucusuna saygılarını sunmak için Anıtkabir'e yürüdü.\n\nGösteriler sırasında Tandoğan Meydanı ve Anıtkabir üzerinde uçuş yasaklandı. Çevre sokaklarda on iki ambulans ve on bir polis zırhlı aracı hazır bekletildi. 10.000 polis memurundan oluşan bir birlik kalabalığı gözetledi, ancak gösteri barışçıl şekilde sona erdi.\n\nGösteriler uluslararası medyanın ilgisini çekse de yerel kanalların biri (Kanal Türk) hariç hepsi gösterilere çok az yer verdi. Habertürk'ün yöneticisi Melih Meriç, yerel yayın eksikliğinin siyasi baskıdan kaynaklandığını söyledi."
 Turkey.29.a:0 "Bu hiç iyi değil..."
 Turkey.30.title:0 "TSK'nin e-Muhtirasi"
 Turkey.30.desc:0 "e-Muhtıra, Genelkurmay'ın 2007 cumhurbaşkanlığı seçimine ilişkin olarak 2007'de internet sitesinde yayımladığı tartışmalı bir açıklamadır. Seçilmesi en muhtemel aday Abdullah Gül'dü. Türkiye'de cumhurbaşkanlığı makamı ülkenin laik sisteminin bekçisi olarak görülür; Gül'ün eşinin İslami başörtüsü takması ve kendisinin siyasal İslam geçmişi seçimleri siyasi bir krize dönüştürdü. \n\nKriz sırasında, Nisan 2007'de cumhurbaşkanlığı seçimine ilişkin şu açıklama Türk Silahlı Kuvvetleri'nin resmî internet sitesinde yayımlandı:\n\n"Cumhurbaşkanlığı seçim sürecinde ortaya çıkan sorun laiklik tartışmaları üzerinde odaklanmıştır. Son günlerde yaşanan durumu Türk Silahlı Kuvvetleri endişeyle izlemektedir. Unutulmamalıdır ki Türk Silahlı Kuvvetleri bu tartışmalarda taraftır ve laikliğin kesin savunucusudur. Ayrıca Türk Silahlı Kuvvetleri yapılan tartışmalara ve olumsuz yorumlara karşıdır. Gerektiğinde tavrını ve davranışlarını çok açık bir şekilde ortaya koyacaktır ... Büyük Önder Mustafa Kemal Atatürk'ün 'Ne mutlu Türküm diyene!' anlayışına karşı çıkanlar Türkiye Cumhuriyeti'nin düşmanıdır ve öyle kalacaktır. Türk Silahlı Kuvvetleri, Türkiye Cumhuriyeti'nin değişmez niteliklerini korumak için kanunların kendisine verdiği görevleri yerine getirme konusundaki sarsılmaz kararlılığını korumaktadır. Bu kararlılığa olan bağlılığı kesindir."\n\ne-Muhtıra terimi, yalnızca internet üzerinden yayımlandığı için Genelkurmay açıklamasını tanımlamak amacıyla Ural Akbulut tarafından türetildi."
 Turkey.30.a:0 "e-Muhtıra mı?"
 Turkey.31.title:0 "Muzaffer CHP"
 Turkey.31.desc:0 "CHP'nin başvurusu üzerine Anayasa Mahkemesi, cumhurbaşkanlığı seçiminin ilk turunu Anayasa'ya aykırı bularak iptal etti."
 Turkey.31.a:0 "Lanet olsun"
 Turkey.32.title:0 "Sirnak'ta Terör Saldirisi"
 Turkey.32.desc:0 "Şırnak'ın Beytüşşebap ilçesine bağlı Başağaç köyü yakınlarında bir yolcu minibüsü PKK militanlarının saldırısına uğradı; 13 kişi öldü ve yaralandı. Ölenlerden 7'sinin köy korucusu olduğu açıklandı."
 Turkey.32.a:0 "Aman Tanrım"
 Turkey.33.title:0 "Türk Telekom'da Grevler"
 Turkey.33.desc:0 "Tarihte ilk kez Türkiye genelinde Türk Telekom çalışanları greve başladı."
 Turkey.33.a:0 "Aman Tanrım"
 Turkey.34.title:0 "Halk Için Bir Referandum"
 Turkey.34.desc:0 "Türkiye'de cumhurbaşkanının halk tarafından seçilmesine ilişkin bir referandum yapıldı. Sonuç evet oldu: Cumhurbaşkanı artık Meclis tarafından seçilmeyecek."
 Turkey.34.a:0 "Güzel"
 Turkey.35.title:0 "El Kaide ile Çatisma"
 Turkey.35.desc:0 "Gaziantep'te El Kaide'ye karşı 13 saat süren operasyonlarda 2'si ölü olmak üzere 25 militan ele geçirildi. 1 polis memuru şehit oldu."
 Turkey.35.a:0 "Teröristler Temizlendi"
 Turkey.36.title:0 "Milletvekilleri Basörtüsü Yasaginin Sürmesini Istiyor"
 Turkey.36.desc:0 "CHP ve DSP milletvekilleri ile Tunceli Bağımsız Milletvekili Kamer Genç, Türkiye'de başörtüsü yasağının sürdürülmesi için Anayasa Mahkemesi'ne başvurdu."
 Turkey.36.a:0 "Başaramayacaklar"
 Turkey.37.title:0 "2008 AKP Kapatma Davasi"
 Turkey.37.desc:0 "18 Mart 2008'de iktidardaki AKP'nin kapatılmasını talep eden belgeler Türkiye Cumhuriyeti Anayasa Mahkemesi'ne sunuldu. 31 Mayıs 2008'de Anayasa Mahkemesi, Yargıtay Cumhuriyet Başsavcısı Abdurrahman Yalçınkaya'nın iddianamesini kabul edeceğini ve partinin kapatılmasına ilişkin davaya bakacağını açıkladı. Siyasi yasaklar konusunda iddianamede Erdoğan'ın 61, Arınç'ın 16 ve Dışişleri Bakanı olduğu dönemde Gül'ün 10 konuşma ve eylemine yer verildi."
 Turkey.37.a:0 "Kabul edilemez"
 Turkey.38.title:0 "Türksat 3A'ya Erteleme"
 Turkey.38.desc:0 "Türksat 3A uydusunun fırlatılması son dakika arızası nedeniyle ertelendi."
 Turkey.38.a:0 "Peki"
 Turkey.39.title:0 "Türksat 3A Basariyla Firlatildi!"
 Turkey.39.desc:0 "Türksat 3A, Türkiye saatiyle 01:05'te başarıyla uzaya fırlatıldı. Ülkemiz gelişiyor ve gelişmeye devam edecek!"
 Turkey.39.a:0 "Büyük Bir Gelişme"
 Turkey.40.title:0 "Ahmet Yildiz Cinayeti"
 Turkey.40.desc:0 "Marmara Üniversitesi Fizik Bölümü öğrencisi Ahmet Yıldız, olaydan yaklaşık bir yıl önce ailesinden tehdit aldığı için savcılığa suç duyurusunda bulunmuştu. 15 Temmuz 2008 gecesi bir kafeye giden Yıldız, saldırganla karşılaştı ve arabasından inip kaçmaya çalıştı. Göğsüne üç kurşun isabet etti ve sonunda aldığı yaralar nedeniyle hayatını kaybetti. Ateşlenen beş kurşundan biri AKP'nin milletvekili adayı Ümmühan Daraca'yı yaraladı. Olayın ardından açıklama yapan Yıldız'ın kuzeni Ahmet Kaya, "Yıldız, Şanlıurfa'daki son derece dindar ve varlıklı bir Kürt ailenin tek oğluydu" dedi. Daha önce Yıldız'a danışmanlık yapmış olan Lambda İstanbul'un insan hakları avukatı Fırat Söyle, cinayetten üç ay önce Yıldız'ın ailesinden ölüm tehditleri aldıktan sonra savcılığa şikâyette bulunduğunu, ancak savcılığın soruşturma başlatmayı ya da Yıldız'a koruma sağlamayı reddettiğini söyledi. Yıldız cinayeti yerli ve yabancı basında geniş yankı uyandırdı."
 Turkey.40.a:0 "Huzur İçinde Yatsın"
 Turkey.41.title:0 "Istanbul Bombalamalari"
 Turkey.41.desc:0 "2008 İstanbul bombalı saldırıları, 27 Temmuz 2008'de İstanbul'un Güngören ilçesindeki kalabalık bir yaya alışveriş caddesinde iki patlama meydana gelmesiyle yaşandı; beşi çocuk on yedi kişi hayatını kaybetti, 154 kişi yaralandı. Saldırılar, beş yıl önceki 2003 İstanbul saldırılarından bu yana Türkiye'de sivillere yönelik en kanlı saldırılardı.\n\nİki bombadan ilki bir telefon kulübesine yerleştirilmiş ses bombasıydı; ikincisi ise 50 metre ötede, kalabalık bir caddenin yakınındaki bir çöp konteynerine yerleştirilmişti. İlk bomba, yardım etmek ve merak nedeniyle kalabalıkların toplanmasına yol açtı; yaklaşık 10 dakika sonra ikinci ve daha güçlü bomba patlayarak çok sayıda kayba neden oldu. Polis, bombaların uzaktan patlatıldığını düşünüyor. Siyasi analist Damla Aras şöyle dedi: "Bunların PKK tarafından kuzey Irak'tan getirilen ve Türkiye'de birçok kez kullanılmış A4 veya C-4 patlayıcıları olma ihtimali var.""
 Turkey.41.a:0 "Aman Tanrım"
 Turkey.42.title:0 "Anayasa Mahkemesi AKP'yi Kapatmadi"
 Turkey.42.desc:0 "Kapatma yönünde yalnızca 6 üyenin oy kullanmasıyla (7 oy gerekiyordu) Mahkeme savcının taleplerini reddetti ve partiyi kapatmadı. Mahkeme talebi reddeden kararını açıkladı ve Adalet ve Kalkınma Partisi aleyhine açılan dava düştü. Avrupa Birliği, Türkiye'nin en yüksek mahkemesinin iktidardaki AKP'yi kapatmama kararıyla rahatladı. Avrupa Parlamentosu'nda Türkiye üzerine çalışan Joost Lagendijk şöyle dedi: "Herkes bu karardan çok memnun; aksi takdirde Türkiye için cehennem gibi bir durum ortaya çıkardı." Dava 4,5 ay önce başlamıştı."
 Turkey.42.a:0 "Harika"
 Turkey.43.title:0 "Konya'da Bir Bina Çöktü"
 Turkey.43.desc:0 "Konya'nın Taşkent ilçesine bağlı Balcılar kasabasında özel bir vakıf tarafından yaptırılan 3 katlı kaçak bir Kuran kursu yurdu, LPG sızıntısı nedeniyle saat 03:45'te çöktü: 18 ölü, 27 yaralı."
 Turkey.43.a:0 "Aman Tanrım"
 Turkey.44.title:0 "PKK Saldirisi"
 Turkey.44.desc:0 "Hakkari'nin Şemdinli ilçesindeki Aktütün jandarma karakolu PKK tarafından ağır silahlarla saldırıya uğradı."
 Turkey.44.a:0 "Bu terör saldırıları ne zaman bitecek?"
 Turkey.45.title:0 "Erdogan Davos Forumu'nu Terk Etti"
 Turkey.45.desc:0 "İsviçre'nin Davos kentindeki Dünya Ekonomik Forumu'nda "Gazze: Orta Doğu'da Barış Modeli" oturumuna katılan Başbakan Recep Tayyip Erdoğan, kendisine yeterli konuşma süresi verilmediği için oturumu terk etti. Olayın ardından Erdoğan, Davos toplantılarına artık katılmayacağını açıkladı."
 Turkey.45.a:0 "Of..."
 Turkey.46.title:0 "Demokratik Toplum Partisi Es Genel Baskanlari Kürtçe Konustu"
 Turkey.46.desc:0 "Demokratik Toplum Partisi Eş Genel Başkanları Ahmet Türk ve Selahattin Demirtaş, kürsüden grup toplantısına Kürtçe hitap etti. Ankara Cumhuriyet Başsavcılığı bu konuda soruşturma başlattı. Soruşturma 15 Nisan'da kovuşturmaya yer olmadığı kararıyla sonuçlandı."
 Turkey.46.a:0 "Eh"
 Turkey.47.title:0 "Türk Hava Yollari 1951 Sefer Sayili Uçus"
 Turkey.47.desc:0 "İstanbul'dan kalkan Türk Hava Yolları'na ait Boeing 737-800 tipi uçak, saat 09:26 UTC'de A9 otoyolunu geçmeden önce Polderbaan pistinin (18R) yaklaşık 1,5 kilometre (0,9 mil) kuzeyindeki bir tarlaya düştü. Uçak çarpmanın etkisiyle üç parçaya ayrıldı. Enkaz alev almadı. \n\nKaza, esas olarak uçağın arızalı bir radyo altimetresinin tetiklediği otomatik tepkisinden kaynaklandı; bu durum otomatik gaz kolunun yaklaşma sırasında motor gücünü rölantiye düşürmesine yol açtı. Mürettebat bunu, uçak irtifa kaybedip düşmeden önce itkiyi artırıp uçağı kurtarmak için çok geç fark etti. Boeing o zamandan beri tüm 737 serisi ve BBJ uçaklarının pilotlarına hava hızını ve irtifayı izlemenin önemini hatırlatan ve radyo altimetre değerleri tutarsız olduğunda inişte otopilot veya otomatik gaz kullanılmamasını tavsiye eden bir bülten yayımladı."
 Turkey.47.a:0 "Kötü Bir Kaza"
 Turkey.48.title:0 "Avrupa Salon Atletizm Sampiyonasi'nda Sampiyonluk"
 Turkey.48.desc:0 "Alemitu Bekele, 2009 Avrupa Salon Atletizm Şampiyonası'nda 3000 metrede Avrupa şampiyonu oldu. Onunla gurur duyuyoruz."
 Turkey.48.a:0 "Harika, harika, harika!"
 Turkey.49.title:0 "Muhsin Yazicioglu'nu Tasiyan Helikopter Düstü"
 Turkey.49.desc:0 "Büyük Birlik Partisi Genel Başkanı Muhsin Yazıcıoğlu ve 5 kişiyi taşıyan helikopter Kahramanmaraş'ta kırsal bir alana düştü. Kazadan kurtulan olmadı. Helikopterin enkazına 27 Mart'ta ulaşıldı."
 Turkey.49.a:0 "Aman Tanrım"
 Turkey.51.title:0 "Agir Ceza Mahkemesi Necmettin Erbakan'in Haklarini Iade Etti"
 Turkey.51.desc:0 "Ankara 9. Ağır Ceza Mahkemesi, hapis cezasına çarptırılan Necmettin Erbakan'ın siyasi haklarını iade etti."
 Turkey.51.a:0 "Mahkeme kararını verdi..."
 Turkey.52.title:0 "ABD-Türkiye Ziyaretleri"
 Turkey.52.desc:0 "ABD Başkanı Barack Obama, Meclis kürsüsünden milletvekillerine hitap etti. Associated Press, bunun Obama'nın başkan olarak Müslüman çoğunluklu bir ülkeye yaptığı ilk ziyaret olduğunu duyurdu."
 Turkey.52.a:0 "ABD ile daha iyi ilişkiler bizi güçlendirir"
 Turkey.53.title:0 "1 Mayis Emek ve Dayanisma Günü Ilan Edildi"
 Turkey.53.desc:0 "Meclis'te alınan kararla 1 Mayıs, "Emek ve Dayanışma Günü" adıyla resmî tatil oldu."
 Turkey.53.a:0 "İşçiler günlerini geri aldı!"
 Turkey.54.title:0 "Demokratik Toplum Partisi'nden Meclis'te Protesto"
 Turkey.54.desc:0 "Demokratik Toplum Partisi milletvekilleri Meclis salonunda oturma eylemi yaptı."
 Turkey.54.a:0 "İyi Değil"
 Turkey.55.title:0 "1 Mayis Kutlamalari"
 Turkey.55.desc:0 "1978'den bu yana 31 yıl sonra ilk kez 1 Mayıs Taksim Meydanı'nda yeniden kutlandı. 1979'dan itibaren sıkıyönetim nedeniyle Taksim Meydanı'nda kutlamalara izin verilmemişti."
 Turkey.55.a:0 "İşçiler iş başında!"
 Turkey.56.title:0 "Hayata Dönüs Operasyonu Davalari Düstü"
 Turkey.56.desc:0 "2000 yılında Bayrampaşa Cezaevi'nde gerçekleştirilen Hayata Dönüş Operasyonu kapsamında 196 mahkûm hakkındaki dava zamanaşımına uğrayarak düştü."
 Turkey.56.a:0 "Artık özgürler"
 Turkey.58.title:0 "Ilk Domuz Gribi Vakasi"
 Turkey.58.desc:0 "Türkiye'deki ilk domuz gribi vakası İstanbul'da görüldü. Domuz gribi artık kolayca tüm Türkiye'ye yayılabilir."
 Turkey.58.a:0 "Of..."
 Turkey.59.title:0 "TEKEL Isçilerinin Eylemi"
 Turkey.59.desc:0 "TEKEL işçilerinin eylemi, Türk-İş'e bağlı Tek Gıda-İş sendikasına üye TEKEL işçilerinin 15 Aralık 2009'da Ankara'da başlattığı protestoyla başladı. Bu, 1980'den bu yana Türkiye'de işçilerin gerçekleştirdiği en büyük kitlesel iş bırakma eylemiydi. Eylem, ülke genelinde gündemin ilk sıralarında yer alıp geniş bir kesimden destek görmesinin yanı sıra uluslararası destek de kazandı."
 Turkey.59.a:0 "Başka bir gün, başka bir protesto"
 Turkey.60.title:0 "Anayasa Mahkemesi DTP'yi Kapatti"
 Turkey.60.desc:0 "Anayasa Mahkemesi oybirliğiyle Demokratik Toplum Partisi'nin kapatılmasına karar verdi."
 Turkey.60.a:0 "Anayasa Mahkemesi kararını verdi"
 Turkey.61.title:0 "Istanbul 2010 Avrupa Kültür Baskenti Oldu"
 Turkey.61.desc:0 "İstanbul, Essen ve Peç ile birlikte 2010 Avrupa Kültür Başkenti oldu."
 Turkey.61.a:0 "Harika Haber"
 Turkey.62.title:0 "Türk Deniz Kuvvetleri Nöbetçilerine Roketatarli Saldiri"
 Turkey.62.desc:0 "İskenderun'daki bir Deniz Kuvvetleri birliğine nöbet değişimi sırasında roketatarla saldırı düzenlendi. 6 asker şehit oldu, 3'ü ağır olmak üzere 7 asker yaralandı."
 Turkey.62.a:0 "Aman Tanrım"
 Turkey.64.title:0 "Israil'in Mavi Marmara Gemisine Saldirisina Tepki"
 Turkey.64.desc:0 "İsrail'in Mavi Marmara gemisine saldırısı nedeniyle Meclis'te bir kınama bildirgesi kabul edildi."
 Turkey.64.a:0 "Güzel bir tepki"
 Turkey.63.title:0 "Istanbul'da PKK Saldirisi"
 Turkey.63.desc:0 "PKK, İstanbul'un Halkalı semtinde askeri bir servis aracına bombalı saldırı düzenledi. Biri lise öğrencisi, 4'ü asker 5 kişi hayatını kaybetti."
 Turkey.63.a:0 "Aman Tanrım"
 Turkey.65.title:0 "Murat Basesgioglu AKP'den Istifa Etti"
 Turkey.65.desc:0 "Murat Başesgioğlu, partinin Meclis'teki politikalarına muhalefeti nedeniyle Adalet ve Kalkınma Partisi'nden istifa etti."
 Turkey.65.a:0 "AKP'nin kaybı"
 Turkey.66.title:0 "Balyoz Darbe Plani Iddianamesi Kabul Edildi"
 Turkey.66.desc:0 "İstanbul 10. Ağır Ceza Mahkemesi Balyoz darbe planı iddianamesini kabul etti. İddianamede 196 askeri personel şüpheli olarak yer aldı ve bunlardan 102'si hakkında yakalama kararı çıkarıldı."
 Turkey.66.a:0 "Türkiye Cumhuriyeti'nde bir daha darbe olmayacak!"
 Turkey.68.title:0 "PKK'nin Dörtyol Saldirisi"
 Turkey.68.desc:0 "Hatay'ın Dörtyol ilçesinde bir polis aracı PKK tarafından saldırıya uğradı ve 4 polis memuru şehit oldu. Polislerin cenaze töreni sırasında Dörtyol ve İnegöl'de olaylar çıktı."
 Turkey.68.a:0 "Aman Tanrım"
 Turkey.67.title:0 "Terörle Mücadele Yasasi Kabul Edildi"
 Turkey.67.desc:0 "Cumhurbaşkanı, kamuoyunda "taş atan çocuklar" olarak bilinen çocukları kapsayan Terörle Mücadele Kanunu'ndaki değişikliği onayladı."
 Turkey.67.a:0 "Aman Tanrım"
 Turkey.69.title:0 "Anayasa Referandumu Sonucu: EVET"
 Turkey.69.desc:0 "Türkiye'de 12 Eylül 2010'da anayasada bir dizi değişikliğe ilişkin anayasa referandumu yapıldı. Sonuçlar, çoğunluğun %58 evet ve %42 hayır oyuyla anayasa değişikliklerini desteklediğini gösterdi. Değişiklikler anayasayı Avrupa Birliği standartlarıyla uyumlu hâle getirmeyi amaçlıyordu. Türkiye'nin AB üyeliğini destekleyenler, anayasa reformunun üyelik sürecini kolaylaştıracağını umuyor."
 Turkey.69.a:0 "Avrupa Birliği'ne!"
 Turkey.70.title:0 "Selanik'teki Türk Baskonsoloslugu Saldiriya Ugradi"
 Turkey.70.desc:0 "Yunanistan'ın Selanik kentindeki Türk Başkonsolosluğu'na molotofkokteyliyle saldırıldı."
 Turkey.70.a:0 "Bunun hesabını verecekler"
 Turkey.71.title:0 "Yüksekögretim Kurulu Harekete Geçti"
 Turkey.71.desc:0 "Yükseköğretim Kurulu (YÖK), İstanbul Üniversitesi'nde başörtülü öğrencilerin derslerden çıkarılmasını yasakladı."
 Turkey.71.a:0 "Güzel"
 Turkey.72.title:0 "Avrupa Insan Haklari Mahkemesi Türkiye'yi Suçlu Buldu"
 Turkey.72.desc:0 "Avrupa İnsan Hakları Mahkemesi, Kıbrıslı Rumların açtığı 19 davada Türkiye'yi suçlu buldu. Türkiye, davacılara 15 milyon avro maddi ve manevi tazminat ile 160 bin avro yargılama gideri ödemek zorunda kaldı."
 Turkey.72.a:0 "Düpedüz taraflılar"
 Turkey.73.title:0 "Türkiye'nin Ilk Dijital Kütüphanesi Açildi"
 Turkey.73.desc:0 "Türkiye'nin ilk dijital kütüphanesi İstanbul'un Esenler ilçesinde açıldı."
 Turkey.73.a:0 "Güzel"
 Turkey.74.title:0 "Terör Saldirisi"
 Turkey.74.desc:0 "Bir canlı bomba, İstanbul'un Taksim Meydanı'nda bir polis aracına saldırdı. 15'i polis 32 kişi yaralandı."
 Turkey.74.a:0 "Aman Tanrım"
 Turkey.75.title:0 "Haydarpasa Gari Yandi"
 Turkey.75.desc:0 "Binanın restorasyonu sırasındaki ihmal nedeniyle çıkan yangın gar binasının çatısını ve 4. katını tahrip etti. Üç kişi "taksirle yangına sebebiyet vermek" suçundan on ay hapis cezasına çarptırıldı."
 Turkey.75.a:0 "Tarihî binayı onarmalıyız"
 Turkey.76.title:0 "Bakanlar Kurulu Istiklal Marsi'ni Kamuya Mal Etti"
 Turkey.76.desc:0 "Bakanlar Kurulu'nun İstiklal Marşı'nı kamuya mal etme kararı yürürlüğe girdi. Karara göre "İstiklal Marşı'nın işaret, ses veya görüntü nakline yarayan araçlarla çoğaltılması, yayılması, temsili ve umuma iletilmesi için hiçbir gerçek veya tüzel kişi, kurum, kuruluş veya birlikten ücret talep edilemez.""
 Turkey.76.a:0 "Kulağa hoş geliyor"
 Turkey.77.title:0 "Mavi Marmara Gemisi Istanbul Limani'na Döndü"
 Turkey.77.desc:0 "Mavi Marmara gemisi, 26 Aralık 2010'da binlerce kişinin katıldığı bir karşılama töreniyle İstanbul limanına döndü."
 Turkey.77.a:0 "Harika"
 Turkey.78.title:0 "Ankara OSTIM Sanayi Sitesi'nde Patlamalar"
 Turkey.78.desc:0 "Ankara OSTİM sanayi sitesinde 8 saat arayla 2 patlama meydana geldi. 20 kişi hayatını kaybetti."
 Turkey.78.a:0 "Aman Tanrım"
 Turkey.79.title:0 "Iki Feribot Libya'dan Türkiye'ye Döndü"
 Turkey.79.desc:0 "Libya'daki ayaklanma nedeniyle Osmangazi ve Orhangazi adlı iki feribot, yaklaşık 2 bin Türk vatandaşını Libya'dan Marmaris limanına getirdi."
 Turkey.79.a:0 "Libya'daki durum umutsuz"
 Turkey.80.title:0 ""Imamin Ordusu" Kitabi Yasaklandi"
 Turkey.80.desc:0 "İmamın Ordusu, Türk gazeteci Ahmet Şık'ın kitabıdır. Kitap yayımlanmadan önce taslağı hükümet tarafından gizli Ergenekon örgütünün "yasa dışı örgütsel dokümanı" olduğu iddiasıyla ele geçirilip yasaklandı."
 Turkey.80.a:0 "Yasaklanması daha iyi"
 Turkey.81.title:0 "Türkiye Genel Seçimi"
 Turkey.81.desc:0 "Türkiye'nin 24. genel seçimi, Türkiye Büyük Millet Meclisi'nin 550 üyesini seçmek için 12 Haziran 2011'de yapıldı. 2007'de yapılan anayasa referandumunun sonucuna uygun olarak seçim, bir öncekinden beş yıl yerine dört yıl sonra yapıldı."
 Turkey.81.a:0 "Sandıkları Hazırlayın"
 Turkey.82.title:0 "Meclis Yemin Krizi"
 Turkey.82.desc:0 "Adalet ve Kalkınma Partisi (AKP) ve Milliyetçi Hareket Partisi (MHP) Meclis'teki yemin törenine katılırken, seçimi bağımsız adaylarla kazanan Barış ve Demokrasi Partisi (BDP) milletvekilleri katılmadı. CHP milletvekilleri de Oktay Ekşi dışında yemin etmedi."
 Turkey.82.a:0 "Ah, kriz!"
 Turkey.83.title:0 "Kürt Terör Saldirisi"
 Turkey.83.desc:0 "Ankara'nın Kızılay semtinde düzenlenen bombalı saldırı sonucunda 3 kişi öldü, 34 kişi yaralandı. TAK (Kürdistan Özgürlük Şahinleri) daha sonra saldırıyı üstlendi."
 Turkey.83.a:0 "Aman Tanrım"
 Turkey.84.title:0 "2011 Hakkâri Saldirisi"
 Turkey.84.desc:0 "2011 Hakkâri saldırıları, 19 Ekim 2011 gecesi 100'den fazla Kürdistan İşçi Partisi (PKK) militanının Hakkâri'de 26 Türk askerini şehit etmesiyle yaşandı. Bu saldırının, 33 silahsız erin öldürüldüğü Bingöl katliamından bu yana PKK'nın Türk güvenlik güçlerine yönelik en kanlı saldırısı olduğu belirtildi. PKK, saldırının Irak Kürdistanı'nda daha önce Türk operasyonlarında öldürülen üst düzey bir PKK komutanının intikamı olduğunu söyledi. \n\nTürk medyasına göre Türk güvenlik güçleri izleyen günlerde misilleme olarak 49 PKK militanını etkisiz hâle getirdi. \n\nTürk yetkililerine göre saldırı, Dr. Bahoz Erdal liderliğindeki PKK'nın Suriye kolu tarafından gerçekleştirildi."
 Turkey.84.a:0 "Aman Tanrım"
 Turkey.85.title:0 "Oda TV Davasi"
 Turkey.85.desc:0 "Oda TV davası kapsamında tutuklu bulunan 4 gazeteci, Nedim Şener, Ahmet Şık, Sait Çakır ve Coşkun Musluk serbest bırakıldı."
 Turkey.85.a:0 "Anlaşılabilir"
 Turkey.86.title:0 "Afganistan Savasi'nda Kaza"
 Turkey.86.desc:0 "16 Mart: NATO'nun Afganistan'daki Uluslararası Güvenlik Yardım Gücü'nde (ISAF) görev yapan Türk askerlerini taşıyan helikopter, iniş sırasında teknik bir arıza nedeniyle düştü. Kazada 12 Türk askeri şehit oldu."
 Turkey.86.a:0 "Aman Tanrım"
 Turkey.87.title:0 "Askeri Kaza"
 Turkey.87.desc:0 "Afyonkarahisar'daki bir askeri cephanelikte meydana gelen patlamada 25 asker şehit oldu."
 Turkey.87.a:0 "Aman Tanrım"
 Turkey.88.title:0 "ABD Büyükelçiligi Bombalandi"
 Turkey.88.desc:0 "Başkent Ankara'daki ABD Büyükelçiliği bombalandı; 2 kişi hayatını kaybetti. Radikal sol örgüt Devrimci Halk Kurtuluş Partisi-Cephesi (DHKP-C) saldırıyı üstlendi."
 Turkey.88.a:0 "ABD bizim için doğru taraf"
 Turkey.89.title:0 "Gezi Parki Protestolari"
 Turkey.89.desc:0 "Türkiye'de 28 Mayıs 2013'te başlayan gösteri ve sivil kargaşa dalgası, başlangıçta İstanbul'daki Taksim Gezi Parkı'na yönelik kentsel dönüşüm planına itiraz amacı taşıyordu. Protestolar, planı protesto eden parktaki oturma eyleminin şiddetle dağıtılmasına duyulan öfkeyle alevlendi. Ardından Türkiye genelinde, merkezinde basın, ifade ve toplanma özgürlüğü ile İslamcı hükümetin Türkiye'nin laikliğini aşındırması gibi konuların bulunduğu çok çeşitli kaygıları protesto eden destek gösterileri ve grevler yapıldı. İlk çevre protestosunu örgütleyen küçük grup dışında merkezi bir liderlikleri olmayan protestolar, Occupy hareketi ve Mayıs 1968 olaylarıyla karşılaştırıldı. Sosyal medya protestolarda kilit bir rol oynadı; bunun önemli bir nedeni, Türk medyasının büyük kısmının özellikle ilk aşamalarda protestoları önemsiz göstermesiydi. Türkiye'nin 80 milyonluk nüfusundan üç buçuk milyon kişinin, ilk Gezi Parkı protestosuyla bağlantılı olarak Türkiye genelinde düzenlenen yaklaşık 5.000 gösteriye aktif olarak katıldığı tahmin ediliyor. Yirmi iki kişi hayatını kaybetti ve çoğu ağır olmak üzere 8.000'den fazla kişi yaralandı.\n\nTaksim Gezi Parkı'ndaki oturma eylemi, polisin 1 Haziran'da Taksim Meydanı'ndan çekilmesinin ardından yeniden başladı ve binlerce protestocunun çadırlarda kaldığı, kütüphane, sağlık merkezi, yemek dağıtımı ve kendi medyalarını örgütledikleri bir protesto kampına dönüştü. Gezi Parkı'ndaki kampın 15 Haziran'da çevik kuvvet tarafından boşaltılmasının ardından protestocular Türkiye'nin dört bir yanındaki diğer parklarda buluşmaya başladı ve protestoların geleceğini tartışmak için halk forumları düzenledi. Türkiye Başbakanı Recep Tayyip Erdoğan 2 Haziran'da protestocuları "birkaç çapulcu" olarak niteledi. Polis protestoları biber gazı ve tazyikli suyla bastırdı. Ölümler ve 8.000'den fazla yaralının yanı sıra 3.000'den fazla gözaltı yapıldı. Polis şiddeti ve hükümetin protestocularla genel olarak diyalog kurmaması bazı yabancı hükümetler ve uluslararası kuruluşlar tarafından eleştirildi.\n\nProtestocular hem sağ hem de sol görüşlü bireyleri kapsayan geniş bir kesim olarak tanımlandı. Şikâyetleri, ilk yerel çevre kaygılarından Recep Tayyip Erdoğan'ın otoriterliği, alkol kısıtlamaları, kamusal alanda öpüşme konusundaki son tartışma ve Suriye'deki savaş gibi konulara kadar uzanıyordu. Protestocular Erdoğan'ın hakaretini sahiplenerek kendilerine çapulcu dediler ("haklarını aramak" anlamında "chapulling" türetmesini de ortaya attılar). Pek çok Twitter kullanıcısı da kullanıcı adlarına çapulcu ekledi. Çeşitli analistlere göre protestolar, Erdoğan'ın on yıllık iktidarındaki en zorlu olaylar ve onlarca yıldır ülke genelinde yaşanan en önemli huzursuzluktu."
 Turkey.89.a:0 "Felaket!"
