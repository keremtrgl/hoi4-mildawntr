 TurkeyNATO.1.title:0 "ABD Karargâhi Türkiye'yi Sorguluyor"
 TurkeyNATO.1.desc:0 "Türkiye NATO ittifakının bir üyesi. Ancak artık bir iç savaşa sürüklendi ve bu iç savaş laik demokratik Türk halkı ile terörist bir Osmanlı Türk devleti arasında yaşanıyor. Türk bölgesini bu bağnaz Osmanlılara bırakıp Rus Karadenizi'ne erişimimizi sonlandıralım ve bölgede Rus dostu bir devletin kurulmasına göz mü yumalım, yoksa NATO devletleriyle genel bir operasyon düzenleyip Türkiye'nin NATO'nun parçası olduğunu mu teyit edelim?"
