 TurkeyT.1.title:0 "Meclisin Ögretmen Teklifi Kabul Edildi"
 TurkeyT.1.desc:0 "Meclisin öğretmen teklifi Mecliste yapılan oylamayla kabul edildi. Teklifin kabulünün ardından araştırma yapıldı ve araştırma sonucunda öğretmenleri rahatsız eden sorunlar tespit edilip giderildi."
 TurkeyT.1.a:0 "Güzel"
 TurkeyT.2.title:0 "Meclisin Ögretmen Teklifi Reddedildi"
