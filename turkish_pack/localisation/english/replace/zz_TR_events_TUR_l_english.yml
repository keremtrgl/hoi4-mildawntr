 Turkey.247.title:0 "Anayasa Mahkemesi'nin Erdogan Karari"
 Turkey.247.desc:0 "Anayasa Mahkemesi, siyasi yasaklı olduğu için Erdoğan'ın milletvekili olamayacağına hükmetti; Erdoğan yasak kaldırılana kadar hiçbir siyasi adım atamayacak. AKP seçimi kazanırsa Erdoğan partiden başka birini göreve getirecek."
 Turkey.247.a:0 "Anayasa Mahkemesi direniyor"
 Turkey.248.title:0 "Anayasa Degisti, Erdogan'in Yasagi Kalkti"
 Turkey.248.desc:0 "AKP Genel Başkanı Tayyip Erdoğan'ın milletvekili olabilmesi için hazırlanan ve CHP'nin de desteklediği üç maddelik anayasa değişikliği jet hızıyla kabul edildi.\n\nCHP, Erdoğan'ın yasağını kaldıran birinci maddeye işkenceden hüküm giyenlerin milletvekili olamayacağı hükmünü eklemeye çalıştı ancak başaramadı. Bu maddeye ilişkin gizli oylamaya 501 milletvekili katıldı: 444 kabul, 45 ret, 9 çekimser ve 3 boş oy çıktı. Erdoğan'ın yasağını kaldıran maddenin kabulünün ardından katılım giderek düştü. Teklifin tümü üzerindeki oylamaya 465 milletvekili katıldı: 440 kabul, 18 ret, 4 çekimser ve 3 boş oy.\n\nMeclis komisyonlarından geçen ve iki tur oylamayla beş günde tamamlanan anayasa değişikliğini onaylamak artık Cumhurbaşkanı Ahmet Necdet Sezer'e kaldı. Anayasa'ya göre Sezer değişikliği onaylayabilir, referanduma götürebilir ya da istediği maddeleri veto edebilir."
 Turkey.248.a:0 "CHP-AKP ittifakı mı?"
 Turkey.249.title:0 "Kobani Protestolari"
 Turkey.249.desc:0 "Selahattin Demirtaş'ın Kobani için halkı sokağa çağırmasının ardından Diyarbakır'da sokağa çıkma yasağı ilan edildi ve askerler sokaklara çıktı. Kürtler hükümeti protesto etmek için sokaklara döküldü, bir parkı işgal ederek oradaki Atatürk heykelini ateşe verdi; bunun üzerine ülkücüler silahlanarak Kürtlere ateş açtı. Sokaklarda çatışmalar yaşandı ve çatışmalar asker ve polisin baskınlarıyla sona erdi. HDP Eş Genel Başkanı Selahattin Demirtaş, Kobani protestolarında hayatını kaybedenlerden sorumlu tutuldu ve hakkında soruşturma başlatıldı."
 Turkey.249.a:0 "Ne kaos ama!"
 Turkey.250.title:0 "Demirtas'in Konusmasi"
 Turkey.250.desc:0 "Selahattin Demirtaş, IŞİD'in Kobani kuşatmasının ardından halkı sokağa çağırdı. Konuşmanın ardından askerler hızla doğuya doğru hareket etmeye başladı."
 Turkey.250.a:0 "Tehlikeli bir konuşma"
 Turkey.251.title:0 "Zaman Gazetesine Kayyum Atandi"
 Turkey.251.desc:0 "İstanbul Cumhuriyet Başsavcılığı'nın talebi üzerine sulh ceza hâkimliği Zaman gazetesine kayyum atanmasına karar verdi. Ajansların haberine göre kayyumlar gazeteye el koymak için polis eşliğinde gazeteye gitti."
 Turkey.251.a:0 "Hükümet bunları denetlemeli"
 Turkey.252.title:0 "Cumhurbaskani Recep Tayyip Erdogan'in Lozan Konusmasi"
 Turkey.252.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan, 24 Temmuz 1923 tarihli Lozan Barış Antlaşması'nın zafer olarak yutturulmaya çalışıldığını söyledi.\n\nBeştepe'de muhtarlara hitap eden Erdoğan şöyle dedi: "Tarihte bize neler yaptılar. 1920'de bize Sevr'i gösterdiler, 1923'te Lozan'a ikna ettiler. Birileri de Lozan'ı bize zafer diye yutturmaya çalıştı. Her şey ortada."\n\nErdoğan sözlerini şöyle sürdürdü:\n\n"Şimdi Ege'yi görüyorsunuz, değil mi? Bağırsanız sesinizin duyulacağı adaları Lozan'da verdik. Zafer bu mu?\n\n"Oralar bizimdi. Oralarda camilerimiz, mabetlerimiz var; ama şu anda hâlâ Ege'de kıta sahanlığında ne olacak, havada ne olacak, denizde ne olacak onu konuşuyoruz, hâlâ bunun mücadelesini veriyoruz.\n\n"Neden? Çünkü o antlaşmada masaya oturanlar yüzünden. O masaya oturanlar o antlaşmanın hakkını veremediler. Veremedikleri için de şimdi bunun sıkıntısını çekiyoruz.""
 Turkey.252.a:0 "Lozan devletin teminatıdır"
 Turkey.252.b:0 "Lozan güncellenmeli"
 Turkey.253.title:0 "Muharrem Ince Hükümeti Sert Bir Dille Elestirdi"
 Turkey.253.desc:0 "CHP'nin cumhurbaşkanı adayı Muharrem İnce, İzmir'de yaklaşık 2,5 milyon kişinin katıldığı mitingde halka hitap etti. Vatandaşların internet olmadığını söylemesi üzerine İnce şöyle dedi: "İnternet yok mu? Yani parayı çalıyorsunuz, sandıkta oyu çalıyorsunuz, sınavda soruyu çalıyorsunuz, TRT'den benim hakkımı çalıyorsunuz, özel televizyonlarda yayınlatmıyorsunuz, internet yok, lanet olsun, daha ne diyeyim!""
 Turkey.253.b:0 "Durdurulmalı"
 Turkey.253.a:0 "Biliyor musun? Haklı!"
 Turkey.253.d:0 "Durdurulmalı §Y(Konuşmasız)§!"
 Turkey.253.c:0 "Biliyor musun? Haklı! §Y(Konuşmasız)§!"
 Turkey.254.title:0 "Meclisten Haberler"
 Turkey.254.desc:0 "CHP ve İYİ Parti'nin oylarıyla Andımız'ın yeniden okutulmasına karar verildi. Andımız artık okullarda İstiklal Marşı'nın yanında okunacak."
 Turkey.254.a:0 "Her Şey Cumhuriyet Adına!"
 Turkey.255.title:0 "CHP-IYI Hükümeti Kuruldu"
 Turkey.255.desc:0 "Cumhuriyet Halk Partisi (CHP) Genel Başkanı Kemal Kılıçdaroğlu, Ankara'daki CHP Genel Merkezi önünde bir zafer konuşması yaptı. Koalisyon ortağı Akşener ile birlikte kürsüye çıkan Kılıçdaroğlu şunları söyledi:\n\n"Hepinize yürekten teşekkür ediyorum. Bir yola çıktık ve mücadele verdik. Kavgasız, gerginlik yaratmadan mücadele ettik. Bizim mücadelemiz demokrasi mücadelesiydi. Her evde huzur olacak. Hiçbir çocuk yatağa aç girmeyecek. Tüm sözlerimizi tutacak ve bu emaneti Türkiye'nin dört bir yanına taşıyacağız.""
 Turkey.255.a:0 "Yepyeni bir Türkiye kapıda"
 Turkey.256.title:0 "AKP-MHP Hükümeti Kuruldu"
 Turkey.256.desc:0 "Havalimanından genel merkeze kadar yol boyunca gösterdikleri coşku, sevgi, destek ve karşılama için Ankaralılara teşekkür eden Erdoğan sözlerini şöyle sürdürdü:\n\n"3 Kasım 2002 seçimlerinde yanımızdaydınız ve bizi iktidara taşıdınız. Durmadınız; 'Durmak yok, yola devam, bu türkü burada bitmez' dediniz. 22 Temmuz 2007 seçimlerinde yanımızdaydınız ve vesayete karşı birlikte mücadele ettik. 12 Haziran 2011 seçimlerinde yanımızdaydınız ve ülkemizi birlikte lig atlattık. Gezi olaylarında, 17-25 Aralık emniyet-yargı darbe girişiminde, cumhurbaşkanlığı seçiminde yanımızdaydınız. Hep birlikte vandallara ve hain çetelere karşı dimdik durduk. 2015 seçimlerinde, özellikle 1 Kasım'da yanımızdaydınız. Türkiye'nin diz çökmesini ellerini ovuşturarak bekleyenlere ders verdik.""
 Turkey.256.a:0 "Erdoğan durdurulamaz"
 Turkey.257.title:0 "Yassiada'nin Adi Degistirildi"
 Turkey.257.desc:0 "Ada, dönemin Başbakanı Adnan Menderes ile bakanlar Fatin Rüştü Zorlu ve Hasan Polatkan'ın idamla sonuçlanan meşhur yargılamasına ev sahipliği yapmıştı. 1960 darbesi nedeniyle "Yassıada" adı olumsuz çağrışımlar taşıdığından adanın adı 7 Kasım 2013'te "Demokrasi ve Özgürlükler Adası" olarak değiştirildi."
 Turkey.257.a:0 "İlginç"
 Turkey.258.title:0 "2008 Türkiye Ekonomik Durgunlugu"
 Turkey.258.desc:0 "Krizdeki Avrupa ile Türkiye arasındaki ticaretin azalmasıyla Türkiye'nin cari açığı büyüdü ve makroekonomik verileri kötüleşti. Büyümenin eksiye dönmesiyle Türkiye, artan işsizlik ve yoksullukla birlikte küresel krizden payını aldı."
 Turkey.258.a:0 "Ekonomik bir başarısızlık"
 Turkey.259.title:0 "Turancilik Meselesi"
 Turkey.259.desc:0 "Kemalistler olarak Batılılaşma politikasını benimseyip Türk Birliği'nden uzaklaşmalı mıyız, yoksa Turancılığı mı desteklemeliyiz?"
 Turkey.259.a:0 "Türk yolu doğru taraf"
 Turkey.259.b:0 "Batı yolundan gitmeliyiz"
 Turkey.260.title:0 "Erdogan Terör Örgütlerine Meydan Okudu"
 Turkey.260.desc:0 "Erdoğan konuşmasında teröre karşı seferberlik ilan etti: "Bir yanda FETÖ, bir yanda YPG, bir yanda PKK, öbür yanda DEAŞ!" Halk konuşmayı coşkuyla karşıladı."
 Turkey.260.a:0 "Yaşasın!"
 Turkey.261.title:0 "IMF Borcu Ödemeleri"
 Turkey.261.desc:0 "Dördüncü gözden geçirmeye bağlı 1,6 milyar dolarlık kredi diliminin bu ay içinde serbest bırakılması beklenirken Türkiye, 2003 yılında IMF'ye olan 2 milyar 450 milyon 110 bin dolarlık borcunun geri ödemesine de başladı.\n\nBu yıl ödenecek 1 milyar 591 milyon 70 bin dolar anapara ve 859 milyon 40 bin dolar faizin 27 milyon 715 bin dolarlık kısmı Mart sonunda ödendi.\n\nTürkiye IMF'ye 17 Nisan'da 45 milyon 187.500 dolar, 30 Nisan'da 12.622 dolar ödeyecek. Mayıs'ta ise 185 milyon 750 bin dolar ödenecek.\n\nErteleme ihtiyacı olmazsa Ağustos'ta 485 milyon 751 bin dolar, Kasım'da 411 milyon 378 bin dolar ödenecek; en yüklü ödemeler 848 milyon 567 bin dolarla Ağustos'ta yapılacak. IMF'ye bu yıl yapılacak geri ödemelerin bir kısmı ise "yeniden müzakere edilebilir" olacak."
 Turkey.261.a:0 "Türkiye yükselecek!"
 Turkey.262.title:0 "Genç Parti'nin Konusmasi"
 Turkey.262.desc:0 "Genç Parti (GP) Genel Başkanı Cem Uzan, seçim kampanyasına İzmir'den başladıklarını söyledi.\n\nZaman zaman seçim otobüsünün önünü kesen vatandaşlara hitap eden Uzan şöyle dedi:\n\n"Evet, işsize iş bulacağım, bulana kadar 350 YTL maaş vereceğim. Mazot 1 YTL olacak. ÖSS ve harçlar kalkacak." Otobüsten bir vatandaşın "Sözünü tutacak mısın?" diye sorması üzerine "Vallahi billahi mazot 1 YTL olacak" dedi.\n\nBu, GP'nin seçim vaadiydi."
 Turkey.262.a:0 "Ne garip bir seçim vaadi"
 Turkey.263.title:0 "Kemalizmin Muhafizlari Geri Dönüyor"
 Turkey.263.desc:0 "CHP, yapılan anayasa değişiklikleriyle ordunun yeniden laikliği koruma göreviyle donatılacağını açıkladı. CHP'li Faik Öztrak, İç Hizmet Kanunu'nun 35. maddesinin yeniden yürürlüğe gireceğini duyurdu. \n\nMadde 35: Silahlı Kuvvetlerin vazifesi; Türk yurdunu ve Anayasa ile tayin edilmiş olan Türkiye Cumhuriyeti'ni kollamak ve korumaktır."
 Turkey.263.a:0 "Laiklik korunacak"
 Turkey.264.title:0 "2007 Yüksek Askeri Sûra"
 Turkey.264.desc:0 "Genelkurmay'ın internet sitesindeki açıklamaya göre 38 personel TSK'dan ihraç edildi. Yüksek Askeri Şûra toplantısı sonucunda 7'si irticai faaliyetlerden olmak üzere toplam 38 personelin Türk Silahlı Kuvvetleri ile ilişiği kesildi."
 Turkey.264.a:0 "Belirsiz Zamanlar"
 Turkey.265.title:0 "2008 Yüksek Askeri Sûra"
 Turkey.265.desc:0 "Yüksek Askeri Şûra kararlarına göre Genelkurmay Başkanlığı görevine Kara Kuvvetleri Komutanı Orgeneral İlker Başbuğ getirildi. 29 Nisan 1943 doğumlu Başbuğ, selefi Orgeneral Büyükanıt gibi yaşı nedeniyle 2 yıl Genelkurmay Başkanlığı yapacak. 2002'de orgeneralliğe terfi eden Başbuğ, Kara Kuvvetleri Kurmay Başkanlığı, Genelkurmay II. Başkanlığı ve 1. Ordu Komutanlığı görevlerinin ardından 2006'da Kara Kuvvetleri Komutanlığına atanmıştı. TSK Üstün Cesaret ve Feragat Madalyası, TSK Üstün Hizmet Madalyası ve Pakistan Nişanı sahibi olan Başbuğ, selefi Büyükanıt'a kıyasla "daha sakin ve daha keskin" olarak biliniyor."
 Turkey.265.a:0 "İlginç, Genelkurmay'ın kararı"
 Turkey.266.title:0 "2010 Yüksek Askeri Sûra"
 Turkey.266.desc:0 "Balyoz davasının gölgesinde toplanan Yüksek Askeri Şûra'nın kararları nihayet açıklandı ve Cumhurbaşkanı Abdullah Gül tarafından onaylandı. Sürpriz olarak nitelendirilen kararlara göre Genelkurmay Başkanlığına ve Kara Kuvvetleri Komutanlığına atama yapılmadı. Atamaların bugün yapılması bekleniyor.\n\nGenelkurmay Başkanı atanmamasının gerekçesi olarak Kara Kuvvetleri Komutanlığına atama yapılmamış olması gösteriliyor.\n\nAtama, Kara Kuvvetleri Komutanlığına atanması beklenen ancak internet andıcı davasında adı geçen 1. Ordu Komutanı Orgeneral Hasan Iğsız'ın adı listede yer almadığı için yapılmadı.\n\nKara Kuvvetleri Komutanlığına Atilla Işık'ın atanabileceği konuşuluyor.\n\nKarar listesinde ilişik kesme ve temdit (görev süresi uzatma) listesi de yer alıyor. Balyoz davasında sanık olan 11 general de terfi edemedi."
 Turkey.266.a:0 "İlginç, Genelkurmay'ın kararı"
 Turkey.267.title:0 "2009 Yüksek Askeri Sûra"
 Turkey.267.desc:0 "Yüksek Askeri Şûra (YAŞ) kararları açıklandı. Şûra, Ergenekon soruşturması kapsamında tutuklanan veya yargılanan subaylarla ilgili herhangi bir karar almadı. Üç ilişik kesme kararı, irticai faaliyetlerde bulunduğu belirtilen askerlerle ilgili. Şûra'nın terfiler konusundaki dikkat çekici kararları ise Diyarbakır Kolordu Komutanı Bekir Kalyoncu'nun orgeneralliğe ve Ergenekon soruşturmasında ifade veren Albay Levent Görgeç'in tuğgeneralliğe terfi ettirilmesi oldu."
 Turkey.267.a:0 "İlginç, Genelkurmay'ın kararı"
 Turkey.268.title:0 "Dolar 3,94'e Yükseldi"
 Turkey.268.desc:0 "Türk lirasının ABD doları karşısındaki değer kaybı sürüyor. Kur 3,9415'e yükselerek yeniden rekor kırdı. Böylece TL'nin dolar karşısındaki değer kaybı 2017 başından bu yana yüzde 10'u aştı."
 Turkey.268.a:0 "Kötü Haber"
 Turkey.269.title:0 "Dolar 5,09'a Yükseldi"
 Turkey.269.desc:0 "ABD'nin Türkiye'ye yaptırım kararının ardından dolar/TL kuru 5,09'a yükselirken avro/TL 5,90 seviyesini zorladı. 10 yıllık gösterge tahvilin bileşik faizi yüzde 18,53, 2 yıllık gösterge tahvilin bileşik faizi ise yüzde 21,03 oldu. Dolar endeksi sabah saatlerinde yüzde 0,15 artışla 94,44 puana çıkarken avro/dolar paritesi 1,1678'den işlem gördü."
 Turkey.269.a:0 "Kötü Haber"
 Turkey.270.title:0 "Dolar 5,97'ye Yükseldi"
 Turkey.270.desc:0 "ABD doları gün içinde yüzde 0,36 artışla kritik 6 eşiğine yaklaşarak 5,97'ye yükseldi. Dolar Türkiye saatiyle 19:00 itibarıyla 5,98'den, avro ise 6,60'tan işlem görüyor. Dün yapılan yılın ilk FOMC toplantısında komite beklendiği gibi faizleri değiştirmedi; Fed Başkanı Powell zayıf enflasyona dikkat çekerken bankaları fonlamaya devam edeceklerini açıkladı. Powell'ın açıklamaları piyasalarda yıl sonuna doğru faiz indirimi beklentilerini güçlendirdi, ancak fiyatlarda belirgin bir dalgalanma yaşanmadı."
 Turkey.270.a:0 "Kötü Haber"
 Turkey.271.title:0 "Dolar 7,2'ye Yükseldi"
 Turkey.271.desc:0 "Hafta içi rekor kırmayan döviz kurları, Asya borsalarının açılışıyla doların 7,20'yi test etmesiyle merak konusu oldu."
 Turkey.271.a:0 "Kötü Haber"
 Turkey.272.title:0 "Dolar 8,05'e Yükseldi"
 Turkey.272.desc:0 "Türkiye Cumhuriyet Merkez Bankası'nın (TCMB) faiz kararı günü 7,9799 ile rekor kıran dolar/TL bugün 8,0510'a tırmandı. Benzer bir seyir izleyen avro/TL ise 9,4851 ile tarihî zirvesine çıktı. Saat 9:30 itibarıyla dolar/TL 8,0015'ten, avro/TL 9,4760'tan el değiştirirken sterlin/TL 10,4248 seviyesinde bulunuyor. Haftaya rekorla başlayan dolar/TL 8,0510'a yükseldi."
 Turkey.272.a:0 "Kötü Haber"
 Turkey.273.title:0 "Türk Uzay Programi"
 Turkey.273.desc:0 "Millî Uzay Programı, dünyadaki gelişmeler dikkate alınarak ülkemizdeki mevcut potansiyeli değerlendirmek amacıyla ülkemizin uzay politikası alanındaki vizyonunu, stratejilerini, hedeflerini ve projelerini koordineli ve bütünleşik bir şekilde hayata geçirmek için hazırlanmıştır."
 Turkey.273.a:0 "Teknolojide ilerlemeliyiz!"
 Turkey.274.title:0 "Türk Uzay Mekigi Uçus Testleri"
 Turkey.274.desc:0 "Uçuş testlerimiz başarılı oldu. Uçuş programlarımıza devam edebiliriz."
 Turkey.274.a:0 "Aferin!"
 Turkey.275.title:0 "Türk Uzay Araci Ay'a Indi"
 Turkey.275.desc:0 "Bir Türk uzay aracı ilk kez Ay'a indi. Bu tarihî bir an ve çabalarımızın boşa gitmediğinin kanıtı."
 Turkey.275.a:0 "Türkiye'de ne güzel bir gün!"
 Turkey.276.title:0 "Türk Uzay Araci Mars'a Indi"
 Turkey.276.desc:0 "Bir Türk uzay aracı ilk kez Mars'a indi. Bu tarihî bir an ve çabalarımızın boşa gitmediğinin kanıtı."
 Turkey.276.a:0 "Türkiye'de ne güzel bir gün!"
 Turkey.277.title:0 "Mars'ta Türk Kaynak Programi"
 Turkey.277.desc:0 "Mars'ta kaynak çıkarmak için gönderdiğimiz özel makineler çalışıyor. Mars'tan ülkemize kaynak getirebiliriz; bu elbette çok büyük bir iş, ancak getirisi muazzam olacak. Bu kaynakları ülkemizde bir yere getirmeyi planlıyoruz ama nereye getireceğimize karar vermedik. Bu yüzden size soruyoruz: Bu kaynakları nereye getirmeliyiz?"
 Turkey.277.a:0 "Kayseri bunun için güzel bir yer!"
 Turkey.277.b:0 "Sivas bunun için güzel bir yer!"
 Turkey.277.c:0 "Konya bunun için güzel bir yer!"
 Turkey.277.d:0 "Malatya bunun için güzel bir yer!"
 Turkey.278.title:0 "Türk Uzay Araci Uzaya Ulasti"
 Turkey.278.desc:0 "İlk Türk uzay aracı atmosferi geçerek uzaya ulaştı. Bu tarihî bir zafer, haydi kutlayalım!"
 Turkey.278.a:0 "Görev tamamlandı"
 Turkey.279.title:0 "GENÇ Parti Seçimleri Kazandi"
 Turkey.279.desc:0 "Cem Uzan iktidara geldi; ülkemiz artık popülist bir grup tarafından yönetilecek. Yeni hükümetimize başarılar diliyoruz."
 Turkey.279.a:0 "Bol şans"
 Turkey.280.title:0 "Gazprom ile Anlasma Imzalandi"
 Turkey.280.desc:0 "Gazprom ile anlaşma masasına oturduk. Ödeme karşılığında Rus yanlısı petrol üsleri açacaklar. Anlaşmada özellikle Rusya ve Türkiye'nin yürüttüğü TürkAkım projesinin inşası ve tamamlanması ele alındı."
 Turkey.280.a:0 "Nereye imza atıyoruz?"
 Turkey.281.title:0 "Israil'e Protestolar"
 Turkey.281.desc:0 "Geçen hafta Mescid-i Aksa'da insanlık dışı eylemlere başlayan İsrail hükümetine tepkiler büyüyor. Bu kapsamda vatandaşlar Beşiktaş'taki İsrail Başkonsolosluğu önünde ellerinde Filistin ve Türk bayraklarıyla İsrail'i protesto etti."
 Turkey.281.a:0 "Siyonistler!"
 Turkey.282.title:0 "Çin'in Ankara Büyükelçisi Bakanliga Çagrildi"
 Turkey.282.desc:0 "İYİ Parti Genel Başkanı Meral Akşener ve Mansur Yavaş'ın 31 yıl önce Doğu Türkistan'da yaşanan Barın katliamını anma mesajları paylaşmasının ardından Çin'in Ankara Büyükelçiliği sosyal medya hesabından şu paylaşımı yaptı: "Sincan Uygur Özerk Bölgesi Çin topraklarının ayrılmaz bir parçasıdır. Bu, dünyada kabul gören ve tartışılmaz bir gerçektir. Çin tarafı, herhangi bir kişi veya gücün Çin'in egemenliğine ve toprak bütünlüğüne herhangi bir şekilde meydan okumasına kararlılıkla karşı çıkar ve bunu şiddetle kınar. Çin tarafı haklı olarak karşılık verme hakkını saklı tutar." Bu gelişmenin ardından Çin'in Ankara Büyükelçisi Dışişleri Bakanlığı'na çağrıldı."
 Turkey.282.a:0 "Gerginlik tırmanıyor"
 Turkey.283.title:0 "Merkez Bankasi Faizi 11,25'e Yükseltti"
 Turkey.283.desc:0 "Merkez Bankası kararını verdi: faiz artırılacak. Merkez Bankası faizler yükseldikçe yatırımın artacağını öngörüyor."
