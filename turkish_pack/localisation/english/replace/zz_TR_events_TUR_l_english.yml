 TurkeyNATO.6.title:0 "ABD Deniz Yollarimiza Burnunu Sokuyor"
 TurkeyNATO.6.desc:0 "NATO'nun Türkiye'yi işgal girişimlerinden anlaşılacağı üzere ABD, Montrö Boğazlar Sözleşmesi'ne ve Rusya'nın çıkarlarına açıkça saldırıyor. Rusya Boğazlar'ın bu şekilde kontrol edilmesine izin vermemeli, müdahale askerî yoldan yapılmalı!"
