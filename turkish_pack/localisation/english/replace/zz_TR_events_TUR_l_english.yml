 TurkeyF.236.desc:0 "Bu darbenin ardından, Türkiye'nin geleceği üzerinde büyük güce sahip olacak yeni Genelkurmay Başkanı'nı seçmek için bir askerî komite kuruldu. Komite, hepsi seçkin subaylar olan önde gelen adayların niteliklerini ve meziyetlerini dikkatle inceliyor."
