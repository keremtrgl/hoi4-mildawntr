 SUPEREVENT_1_T:0 "Türkiye'nin 2023 Vizyonu"
 SUPEREVENT_1_DESC:0 "Yükselen yeni nesil! İstikbal sizsiniz. Cumhuriyeti biz kurduk, onu yükseltecek ve yaşatacak sizsiniz. Türk milletinin karakterine ve adetlerine en uygun olan idare, Cumhuriyet idaresidir. - Mustafa Kemal Atatürk"
 SUPEREVENT_2_T:0 "Türk Birligi"
 SUPEREVENT_2_DESC:0 "Fetih yolunda yürüyen milletler diğer milletleri korkutur ve kendilerine hayran bırakır. - Hüseyin Nihal Atsız"
 SUPEREVENT_3_T:0 "Türkiye Avrupa Birligi'ne Katildi"
 SUPEREVENT_3_DESC:0 "Kaygan, değişken ve deniz yolculuğuyla dolu bir kültürdür Avrupa. Tarifi imkânsız bir kelime. - Cemil Meriç"
 SUPEREVENT_4_T:0 "Türk Ordusunda Tasfiyeler"
 SUPEREVENT_4_DESC:0 "Sizi vicdanınızla baş başa bırakıyorum ve naçiz hayatımı Aziz Mustafa Kemal'in kurduğu Cumhuriyet'e feda ediyorum. Bu zulme son verecek son merci vicdanınızdır. Sizi onunla baş başa bırakıyorum. - Hurşit Tolon"
 SUPEREVENT_5_T:0 "Erdogan Seçimleri Kaybetti"
 SUPEREVENT_5_DESC:0 "Taşı gediğine koymak bize düşecek. - Recep Tayyip Erdoğan"
 SUPEREVENT_6_T:0 "Erdogan Cumhurbaskani Oldu"
 SUPEREVENT_6_DESC:0 "Türkiye Cumhuriyeti devletinin ve bu kahraman milletin cumhurbaşkanı olmaktan onur duyuyorum. - Recep Tayyip Erdoğan"
 SUPEREVENT_7_T:0 "Kanal Istanbul Projesi"
 SUPEREVENT_7_DESC:0 "Devlet projesine karşı çıkmakla suçlandım. "Beton kanal" dediğimiz bu proje bir devlet projesi değil, bir seçim projesidir. - Ekrem İmamoğlu"
 SUPEREVENT_8_T:0 "Türkiye NATO'dan Ayrildi"
 SUPEREVENT_8_DESC:0 "NATO bizi koruyan örgüttür, NATO ülkeleri müttefikimizdir derler. Şimdi Türkiye büyük gerçekle yüz yüze. NATO Atatürk'ü hedef tahtasına koydu. Bunu dünyaya açıkça ilan etti. - Doğu Perinçek"
 SUPEREVENT_9_T:0 "Türkiye'de Basörtüsü Krizi"
 SUPEREVENT_9_DESC:0 "Ahlak örtüsü olmayan kişiyi başörtüsü dindar yapmaz. - Hz. Mevlana"
 SUPEREVENT_10_T:0 "Atatürk'ün Ideal Devleti"
 SUPEREVENT_10_DESC:0 "Benim naçiz vücudum elbet bir gün toprak olacaktır, ancak Türkiye Cumhuriyeti ilelebet payidar kalacaktır. - Mustafa Kemal Atatürk"
 SUPEREVENT_11_T:0 "Mezhepsel Sikintilarin Sonu"
 SUPEREVENT_11_DESC:0 "Her Türk bulunduğu yerin görevini imanla yaparsa Türkçülük ülküsü sağlamlaşır. Türklük güçlenir. - Hüseyin Nihal Atsız"
 SUPEREVENT_12_T:0 "Türkiye Kendi Uçaklarini Gelistirdi"
 SUPEREVENT_12_DESC:0 "İstikbal göklerdedir. Göklerini koruyamayan milletler yarınlarından asla emin olamazlar. - Mustafa Kemal Atatürk"
 SUPEREVENT_13_T:0 "Türk Almanya'si Ilan Edildi"
 SUPEREVENT_13_DESC:0 "Borç alan hürriyetini satar. - Alman atasözü"
 SUPEREVENT_14_T:0 "Türk Sanayilesmesi Basarildi"
 SUPEREVENT_14_DESC:0 "Uzun vade, güncel meseleler için yanıltıcı bir rehberdir. Uzun vadede hepimiz ölüyüz. - John M. Keynes"
 X_T:0 "§YMD +Turkey§!'ye Hos Geldiniz"
 MOD_OPENING_DESC:0 "§YMillennium Dawn'ın en ayrıntılı Türkiye'si.§!\n2000'den başlayarak Cumhuriyet'i koalisyonlar, krizler, darbeler, seçimler ve savaşlar arasından yönetin; AKP'den Osmanlı'ya uzanan yollarda.\n\n§YYol Rehberi§! her yola nasıl ulaşılacağını anlatır. Süper olaylar, ekstra sesler ve gizli yollar başlangıçta kapalıdır; §YMod Ayarları§! bölümünden açabilirsiniz.\n\nHata mı buldunuz, bir öneriniz mi var? §YDiscord§!'da bize yazın.\n§gSürüm 2.0.3-TUR.10 · Millennium Dawn 2.0.3§!"
 BITCOIN_DESC:0 "Mod Ayarları"
 MD_GO:0 "§GHadi Başlayalım!§!"
 FAQ_S:0 "Yol Rehberi 1/15"
 FAQ_1_DESC:0 "§YBuradan başlayın§!\nBu rehber moddaki her yola nasıl ulaşacağınızı adım adım anlatır.\n\n§YNasıl okunur§!\n§YSarı yazı§! bir odağın, kararın, olayın ya da seçeneğin oyundaki tam adıdır. Oyunda bu adı arayın.\n§RKırmızı yazı§! kaçırmamanız gereken bir kuraldır.\n\n§YKullanılan kelimeler§!\n§YOdak§!: ulusal odak ağacındaki bir kutu.\n§YKarar§!: kararlar sekmesindeki bir düğme.\n§YOlay§!: açılan bir pencere. Rehberin söylediği seçeneği seçin.\nİki sekme de sol üstteki çubuktadır.\n\n§RBu pencereyi kapattınız mı?§! Kararlar sekmesinde §YMod Menüsü§! bölümünü bulun ve §YKarşılama Penceresini Aç§! kararını alın. Menü ve rehber geri gelir."
 FAQ_S_2:0 "Yol Rehberi 2/15"
 FAQ_2_DESC:0 "§YSayılar nerede görünür§!\n§YTarih§!: sağ üstte. Boşluk tuşu oyunu durdurur ve başlatır, + ve - hızı değiştirir. Çoğu yol zamanın geçmesini ister.\n§YSiyasi güç§!: üst çubuktaki ilk sayı. Odaklar ve kararlar bununla ödenir.\n§Yİstikrar§!: üst çubukta, siyasi gücün yanında. Tam yüzdeyi görmek için üzerine gelin.\n§YFabrikalar§!: üst çubukta sivil, askerî fabrika ve tersane sayıları. Toplamı için üçünü toplayın.\n§YKim yönetiyor§!: sol üstteki bayrağınıza tıklayın. Siyaset ekranı iktidar partisini ve ideolojisini gösterir.\n\n§YNeden alamıyorum?§!\nGri bir odağın ya da kararın üzerine gelin. Açıklama bütün şartları listeler, §Rkırmızı satırlar henüz karşılamadıklarınızdır§!."
 FAQ_S_3:0 "Yol Rehberi 3/15"
 FAQ_3_DESC:0 "§YMod Ayarları ve Kurgusal Gerçeklik§!\n§YKurgusal Gerçeklik§! kurgu yolları açar: §YMafya§!, §YAnarşistler§!, §YMİT§! ve §YAtatürk§!. §ROyun başladığında kapalıdır.§!\n\nAçmak için:\n1. Bu karşılama penceresinde §YMod Ayarları§!'na tıklayın.\n2. §YKurgusal Gerçeklik:§! satırını bulun.\n3. Parlak simge durumu gösterir: çarpı kapalı, tik açık demektir. Tike tıklayıp parlatın.\n4. §YMenüye Dön§!, ardından §YHadi Başlayalım!§! düğmesine tıklayın.\n\n§RBunu 1 Ocak 2000'de, oyunu başlatmadan yapın.§! Aralık 2000'deki Rahşan Affı ayara bakar. O gün kapalıysa Mafya ve Anarşist yolları tamamen kaybolur.\n\nDiğer ayarlar (Bitcoin, Yeşiller, süper olaylar, sesler) isteğe bağlıdır."
 FAQ_S_4:0 "Yol Rehberi 4/15"
 FAQ_4_DESC:0 "§YZaman çizelgesi§!\n§YAralık 2000 - Ocak 2001§!: Rahşan Affı (Mafya, Anarşistler)\n§YŞubat 2001§!: 2001 ekonomik krizi (bütün parti yolları)\n§YOcak 2001 - Mayıs 2002§!: Atatürk aralığı\n§YHaziran - Eylül 2001§!: Teknokratik HP olayları\n§YMayıs 2002'den önce§!: Pamukoğlu (HEPAR)\n§Y2003'ten önce§!: Osmanlı kararları\n§YMayıs 2003§!: MİT\n§Y2007§!: Yenilenmiş AKP\n§Y2016 ve sonrası§!: Ülkücü rejim\n§Y2023§!: CHP liderleri\n\n§RHer oyunda tek yol.§! Birini seçmek diğerlerini kapatır, kaçan bir tarih geri gelmez.\n\n§YHer büyük seçimden önce kayıt alın§!, böylece yükleyip yeniden deneyebilirsiniz."
 FAQ_S_5:0 "Yol Rehberi 5/15"
 FAQ_5_DESC:0 "§YHiçbir şey olmuyor mu? Bunlara bakın§!\n1. §YTarih.§! Yolun zaman aralığında mısınız? Çok erkense oyunu çalıştırıp bekleyin.\n2. §YŞartlar.§! Odağın ya da kararın üzerine gelin ve kırmızı satırları okuyun.\n3. §YAyar.§! Mafya, Anarşistler, MİT ve Atatürk için Kurgusal Gerçeklik açık olmalı.\n4. §YÖnceki seçimleriniz.§! Başka bir yol bunu çoktan kapatmış olabilir.\n5. §YAğaç.§! Birçok yol bütün odak ağacını değiştirir. Ağacınız birden değiştiyse bu normaldir: yeni yol yüklenmiştir.\n6. §YDiğer modlar.§! Türkiye'yi değiştiren başka bir mod kullanmayın. Böyle bir mod varsa başta bir uyarı penceresi açılır.\n\n§gHâlâ takıldınız mı? Discord'da tarih, yol ve ekran görüntüsüyle sorun.§!"
 FAQ_S_6:0 "Yol Rehberi 6/15"
 FAQ_6_DESC:0 "§Y2001 krizi (1/2)§!\nBütün parti yolları buradan başlar.\n\n1. Odak ağacını açın ve ana odakları sırayla alın: §YCumhuriyetin Geleceği?§!, yolsuzlukla mücadele odakları, §YAnayasa Değişiklikleri§! (Haziran 2000'den sonra), cezaevi odakları, §Y2001 Rüzgârları§! (1 Ocak 2001'den sonra) ve §YSabiha Gökçen'i Uluslararası Hâle Getir§!.\n2. §Y2001 Türkiye Ekonomik Krizi§! olayını §Rbekleyin§!. 20 Şubat 2001'den itibaren gelir ve kriz fikrini verir.\n3. §Y2001 Ekonomik Krizi§! odağını alın.\n4. Altında her yol için bir halef odak vardır (sonraki sayfa). §RYalnızca BİRİNİ alabilirsiniz.§!\n\n§RDSP dışındaki tüm halefler için istikrar %45'in altında olmalı.§! Kriz odağı bitmeden üst çubuktan kontrol edin."
 FAQ_S_7:0 "Yol Rehberi 7/15"
 FAQ_7_DESC:0 "§Y2001 krizi (2/2): hangi halef?§!\n§YAKP§! (AKP Hareketi): her hükümete açık.\n§YDSP§! (Hükümetin İşi Henüz Bitmedi!): istikrar sınırı yok.\n§YMHP§!, §YSaadet§!, §YTKP§!, §YAskeri Komplo§!: her hükümete açık.\n§YCHP§!: hükümeti sosyal demokratlar yönetmeli.\n§YLDP§!: hükümeti liberaller yönetmeli. §YANAP§!: liberteryenler.\n§YGENÇPARTİ§!: hükümeti otoriter bir parti yönetmeli.\n§YTeknokratik HP§!: Haziran 2001'de §YHP Cesur Bir Adım Attı§! olayı gelir. §YHP Desteklenmeli§! seçeneğini seçin, Ağustos'taki devam olayını bekleyin, sonra §YYeniliğin Kıvılcımları§! odağını alın.\n\nHükümeti kimin yönettiği siyaset ekranındadır (bayrağınıza tıklayın). Seçimler ve koalisyon kararları onu değiştirir."
 FAQ_S_8:0 "Yol Rehberi 8/15"
 FAQ_8_DESC:0 "§YOsmanlı Restorasyonu§!\n§RSon tarih: 1 Ocak 2003.§! Bu tarihten sonra kararlar kaybolur.\n\n1. Kararlar sekmesinde §Yİslamcı Restorasyoncuların Gizli Planları§! bölümünü bulun.\n2. §YYüce Osmanlı Değerlerini Güçlendir§! ve §Yİslamcı Propaganda Bas§! kararlarını alın (her biri 50 SG ve 25 gün).\n3. §YYeniden Planlama Girişimi§! kararını alın (50 SG, 25 gün). Bunun için §Y2001 Ekonomik Krizi§! odağı bitmiş olmalı.\n4. §RÜç sayacın da bitmesini bekleyin.§! Bir plan tıkladığınızda değil, 25 günü dolunca sayılır.\n5. §YBüyük Planları Onayla§! kararını alın (75 SG). Osmanlı ağacı yüklenir.\n\nSon adım için en az 75 SG biriktirin."
 FAQ_S_9:0 "Yol Rehberi 9/15"
 FAQ_9_DESC:0 "§YAskerî cunta§!\nİki yolu var.\n\n§Y1. yol, isteyerek:§! 2001 krizinden sonra §YAskeri Komplo§! halef odağını alın (istikrar %45'in altında).\n\n§Y2. yol, zorla:§! AKP yolunda şunların hepsi aynı anda gerçekleşirse ordu sizi devirir:\n- askerî etki fikri aktif\n- AKP ile ilişkiler -25 veya daha kötü\n- §Yistikrar %20'nin altında§!\n- genel grev yok\n\nCunta ağacı iki sondan biriyle biter:\n§YTürk Subayları Demokrasiyi Askıya Almak İçin Darbe Yapıyor§!: kalıcı askerî rejim (TSK ağacı).\n§YTürkiye Seçimleri§!: iktidar partilere geri döner."
 FAQ_S_10:0 "Yol Rehberi 10/15"
 FAQ_10_DESC:0 "§YAnayasa Mahkemesi (AYM)§!\n1. Kararlar sekmesinde §YAnayasa Mahkemesi§! bölümünü bulun.\n2. Mahkemenin siyasallaşmasını §Y75§!'in üstüne çıkarın (5'ten başlar). §YHükümeti Soruştur§!, §YMuhalefeti Soruştur§! ve §YSeçimleri İptal Et/Seçim İlan Et§! her biri +10, §YYeni Siyasi Sorular Gündeme Getir§! +5 verir.\n3. §YAYM'ye Yaklaşan Askeri Müdahale§! görevi başlar. §RSiyasallaşmayı 225 gün boyunca 75'in üstünde tutun.§! 75 veya altına düşerse görev sonuçsuz biter.\n4. Görevin süresi dolunca §YAskerî Dram§! olayı gelir. §YOrdu Müdahale Edebilmemeli§! seçeneğini seçin. AYM ağacı yüklenir.\n\nAskerî etki fikri hâlâ aktif olmalıdır."
 FAQ_S_11:0 "Yol Rehberi 11/15"
 FAQ_11_DESC:0 "§YMafya, Anarşistler ve MİT§!\n1. §RKurgusal Gerçekliği ilk gün açın§! (3. sayfa).\n2. Oynamaya devam edin. §Y22 Aralık 2000 ile 22 Ocak 2001§! arasında §YRahşan Affı§! olayı gelir. Seçin:\n§YAfta Küçük Değişiklikler Yapın§!: Mafya devleti.\n§YAffı Doğrudan Genişletin§!: Anarşistler.\n§YAffın Kapsamı Yeterli§!: normal oyun.\n§RAyar kapalıysa başka bir olay gelir ve iki yol da kaybolur.§!\n\n§YMİT§! (Mafya yolundan):\n1. Mafya yolunu oynayın ve 2001 krizini atlatın.\n2. §Y1 Mayıs 2003§!'ten itibaren §YMİT'in Gizli Planı§! olayı gelir.\n3. §YBu Mafya Hükümeti Yıkılmalı§! seçeneğini seçin."
 FAQ_S_12:0 "Yol Rehberi 12/15"
 FAQ_12_DESC:0 "§YAtatürk§!\n§RKurgusal Gerçeklik gerekir. Mafya, Anarşist ve MİT yollarında olmaz.§!\n1. §Y10 Ocak 2001 ile 10 Mayıs 2002§! arasında aynı gün:\n- §Yistikrar %35'in altında§!, ve\n- §Yfabrika sayısı 25'ten az§! olsun (sivil + askerî + tersane, 2. sayfaya bakın).\n§RTürkiye yaklaşık 66 fabrikayla başlar, yani önce sanayisinin çoğunu kaybetmesi gerekir.§!\n2. §YAnıtkabir'den Tuhaf Sesler§! olayı gelir. Yol işliyor demektir.\n3. §RBekleyin.§! Üç olay daha gelir; en erken §Y10 Mayıs§!, §Y10 Haziran§! ve §Y10 Temmuz 2001§!'de.\n4. Sonuncusu Atatürk ağacını yükler. §YAtatürk en erken 10 Temmuz 2001'de döner.§!\n\nİlk odağı sanayinizi yeniden kurar. §YYeni Seçim İlan Et§! hükümeti CHP'ye verir."
 FAQ_S_13:0 "Yol Rehberi 13/15"
 FAQ_13_DESC:0 "§YHEPAR (Osman Pamukoğlu)§!\n§R1. ve 2. adımları Mayıs 2002'den önce yapın.§!\n\n1. Kararlar sekmesinde §YOsman Pamukoğlu'nun Görüşü§! bölümünü bulun. Görüşü 25'ten başlar ve 49'un üstüne çıkmalı. §YGenel Barış İçin Yeni Af§! (+20, 30 gün) ve §YHükümlü Kürtleri Serbest Bırak§! (+5, 3 gün) yeterlidir.\n2. §YOsman Pamukoğlu'na Siyasete Girmesi İçin Baskı Yap§! kararını alın (50 SG). Partisini kurar ve Mayıs 2002'de partisi %20 destek kazanır.\n3. Partisi (merkez sağ muhafazakârlar) hükümeti yönetmeli. Bu genelde bir seçimden sonra olur, seçim gelene kadar oynamaya devam edin.\n4. Hükümeti yönettiğinde HEPAR iktidara gelir."
 FAQ_S_14:0 "Yol Rehberi 14/15"
 FAQ_14_DESC:0 "§YYenilenmiş AKP§!\n1. AKP yolunu 2007'ye kadar oynayın.\n2. Mayıs 2007 ile Mayıs 2008 arasında 367 krizi ve §YAKP Delegeleri Reform İstiyor§! olayları gelir. §YReform Planını Kabul Et§! seçeneğini seçin.\n3. 2007 cumhurbaşkanlığı yarışını §YSabahattin Çakmakoğlu§! ile kazanın. Sonuç geldiğinde desteği %50'nin üstünde olmalı.\n4. 22 Haziran 2007'den sonra §Y2007 Seçimleri§!, ardından §YAKP'nin İkinci Reformu§! odağını alın."
 FAQ_S_15:0 "Yol Rehberi 15/15"
 FAQ_15_DESC:0 "§YÜlkücü rejim§!\n1. AKP yolunu oynayın ve §Y15 Temmuz 2016§!'yı atlatın.\n2. §YTüm Türkiye İçin Zafer§! ve §YÜlkü Ocakları§! odaklarını alın.\n3. 10 §YÜlkücüleri Örgütle§! kararının hepsini bitirin.\n4. §YÜlkücü Darbe Girişimi§! kararını alın (150 SG).\n\n§YCHP liderleri§!\nCHP yolunda §Y2023 CHP Kurultayı§! odağı Kılıçdaroğlu, Ekrem İmamoğlu ve Mansur Yavaş arasında seçim yapmanızı sağlar.\n\n§YYardım mı lazım?§!\nKarşılama penceresindeki düğmeyle Discord'umuza katılın. Tarihi ve yolunuzu yazın, ekran görüntüsü gönderin."
