 Turkey.226.title:0 "Askeri Bildiri"
 Turkey.226.desc:0 "Darbenin ardından ilk bildiri yayımlandı. \n\n Askeri bildiri: "Türkiye Cumhuriyeti'nde gerginlik talep eden ve Atatürk'e hakaret eden mesajlar politikacılardan gelmiştir. Bu politikacılar süratle tutuklanacaktır. Ülkemizi bu duruma getirenler bir daha ülkenin iktidarına gelemeyecek ve süresiz siyasi yasaklı olacaklardır. Şanlı Türk ordusu ülkenin yönetimini ele aldıktan sonra hemen idari kurumları denetlemeye başlamış ve yolsuzluklar tespit etmiştir. Bu yolsuzluklar Türkiye'yi bu hâle getiren en büyük etkenlerden biridir. Yolsuzluğun ülkemize zarar vermesi ve kimsenin bunu kontrol edecek gücünün olmaması üzerine Anayasa'nın değiştirilmesi çalışmaları kabul edilmiştir. Yeni anayasa hazırlandıktan sonra halkoyuna sunulacaktır. Hayırlı günler dileriz.""
