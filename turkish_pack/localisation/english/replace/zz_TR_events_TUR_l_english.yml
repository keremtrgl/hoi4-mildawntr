 TurkeyNATO.7.title:0 "Perinçek'in Protestolari"
 TurkeyNATO.7.desc:0 "Perinçek ve etrafında topladığı insanlar Türkiye'nin Çin ile savaşa girmesini sert bir dille kınadı. Çin bayraklarıyla gösteriler düzenlediler. Perinçek bu savaşın Türkiye'nin sonunu getireceğini söyledi ve Maoizmin önemini vurguladı."
 TurkeyNATO.7.a:0 "Susturun Onu"
 Turkey_news.1.t:0 "Gezi Parki Protestolari"
 Turkey_news.1.d:0 "Türkiye'de 28 Mayıs 2013'te, başlangıçta İstanbul Taksim Gezi Parkı'na yönelik kentsel dönüşüm planına itiraz etmek amacıyla bir gösteri ve sivil huzursuzluk dalgası başladı. Protestolar, planı protesto eden parktaki oturma eyleminin şiddetle dağıtılmasına duyulan öfkeyle alevlendi. Ardından Türkiye genelinde, özünde basın, ifade ve toplanma özgürlüğü ile İslamcı hükümetin Türkiye'nin laikliğini aşındırması gibi meselelerin yattığı çok çeşitli kaygıları protesto eden destek gösterileri ve grevler düzenlendi. İlk çevreci protestoyu organize eden küçük grup dışında merkezî bir liderliği olmayan protestolar, Occupy hareketine ve 1968 Mayıs olaylarına benzetildi. Türk medyasının büyük bölümü protestoları, özellikle ilk aşamalarda, görmezden geldiği için sosyal medya protestolarda kilit bir rol oynadı. Türkiye genelinde Gezi Parkı protestosuyla bağlantılı yaklaşık 5.000 gösteriye üç buçuk milyon kişinin aktif olarak katıldığı tahmin ediliyor. Yirmi iki kişi hayatını kaybetti, çoğu ağır olmak üzere 8.000'den fazla kişi yaralandı.\n\n"
 Turkey_news.1.a:0 "Türkiye'de Protestolar mı? İlginç"
 Turkey_news.2.t:0 "Türkiye'deki Darbe Girisimi Basarisiz Oldu"
 Turkey_news.2.d:0 "Türkiye'de hükümet ve Cumhurbaşkanı Recep Tayyip Erdoğan dahil devlet kurumlarına karşı bir darbe girişiminde bulunuldu. Girişim, Türk Silahlı Kuvvetleri içinde kendilerini Yurtta Sulh Konseyi olarak örgütleyen ve üyeleri hiçbir zaman tam olarak belirlenemeyen bir grup tarafından gerçekleştirildi. Grup Ankara, İstanbul, Marmaris ve başka yerlerde, Boğaziçi Köprüsü'nün Anadolu yakası girişi gibi birkaç kilit noktanın kontrolünü ele geçirmeye çalıştı, ancak devlete sadık güçlerin onları yenmesiyle başarısız oldu. Konsey, darbenin gerekçeleri olarak laikliğin aşınmasını, demokratik yönetimin ortadan kaldırılmasını, insan haklarının hiçe sayılmasını ve Türkiye'nin uluslararası arenada itibar kaybetmesini gösterdi. Hükümet, darbe liderlerinin Türkiye Cumhuriyeti tarafından terör örgütü olarak tanınan ve Pennsylvania'da yaşayan Türk iş insanı ve din adamı Fethullah Gülen tarafından yönetilen Gülen hareketiyle bağlantılı olduğunu açıkladı. Türk hükümeti, darbenin arkasında Gülen'in olduğunu (Gülen bunu reddetti) ve ABD'nin onu koruduğunu öne sürdü."
 Turkey_news.2.a:0 "Erdoğan Kazandı..."
 Turkey_news.3.t:0 "Türkiye S-400 Almaya Karar Verdi"
 Turkey_news.3.d:0 "ABD'nin müttefiki Türkiye'nin Patriot füze savunma sistemi talebine olumlu yanıt vermemesinin ardından farklı alternatiflere yönelen Ankara, Rusya'nın cazip teklifini değerlendirdi ve S-400 hava savunma sistemini satın alma kararı aldı. \n\nÖzellikle Suriye savaşında güvenlik ihtiyaçları her geçen gün artan ve hava sahası tehditlere açık olan Türkiye, NATO müttefikleri tarafından desteklenmediği için kendi hava savunma sistemlerini oluşturmaya yöneldi."
 Turkey_news.3.a:0 "İlginç"
 Turkey_news.4.t:0 "Türkiye Avrupa'yi Göç Dalgasiyla Tehdit Ediyor"
 Turkey_news.4.d:0 "Türkiye'nin kuzeydoğu Suriye'ye yönelik harekâtı başladı. İlk bir buçuk haftada 130.000 kişi yerinden edildi. 10 Ekim'de Cumhurbaşkanı Erdoğan'ın, Kürtlerin kontrolündeki kuzey Suriye'ye yönelik askerî harekâtına gelen eleştirilere yanıt olarak "milyonlarca" Suriyeli mülteciyi Avrupa'ya göndermekle tehdit ettiği bildirildi. 27 Şubat 2020'de üst düzey bir Türk yetkili, polis, sahil güvenlik ve sınır güvenliği birimlerine mültecilerin Avrupa'ya kara ve deniz yoluyla geçişlerini artık durdurmama talimatı verildiğini söyledi."
 Turkey_news.4.a:0 "AB İçin Kötü Günler"
 Turkey_news.5.t:0 "Lira Deger Kaybediyor"
 Turkey_news.5.d:0 "ABD yaptırımlarının ardından dolar lira karşısında yükseldi. Bu yükseliş karşısında Türkiye faizleri artırmaktan başka bir şey yapamadı. Dolar yükseldikçe Türk ekonomisi zayıfladı ve Erdoğan destekçileri azalmaya başladı."
 Turkey_news.5.a:0 "Belirsiz Zamanlar"
 Turkey_news.6.t:0 "Türk Yayilmaciligi"
 Turkey_news.6.d:0 "Uzun bir aradan sonra Türkiye arka planda silahlandı. Silahlanmanın sonucunda Türkler topraklarını genişletmeye başladı. \n\nGenişlemenin sonucunda Türkiye'nin bölge ülkeleriyle ilişkileri bozuldu ve dünyada gerginlik arttı."
 Turkey_news.6.a:0 "Militarizm yayılmacılığa yol açar"
 Turkey_news.7.t:0 "Türkiye'nin 2001 Ekonomik Krizi"
 Turkey_news.7.d:0 "19 Şubat 2001'de Başbakan Ecevit, Cumhurbaşkanı Sezer ile yaptığı toplantıdan "Bu ciddi bir kriz" diyerek çıktı. Bu söz, finansal ve siyasi istikrarsızlığın altını çizdi ve piyasalarda daha büyük bir paniğe yol açtı. Hisse senetleri çakıldı ve faiz oranı %3.000'e ulaştı. Büyük miktarda Türk lirası ABD dolarına veya avroya çevrildi ve Merkez Bankası rezervlerinden 5 milyar kaybetti. Çöküş daha da büyük bir ekonomik çalkantıyı tetikledi. 2001'in ilk sekiz ayında 14.875 kişi işini kaybetti, dolar 1.500.000 liraya çıktı ve zaten yüksek olan gelir eşitsizliği daha da arttı."
 Turkey_news.7.a:0 "Belirsiz Zamanlar"
 Turkey_news.8.t:0 "Türk Iç Savasi"
 Turkey_news.8.d:0 "Türkiye'deki darbenin ardından darbecilere karşı savaşan Kemalistler ve Erdoğan güçleri Türkiye'nin büyük bölümünde kontrolü ele geçirdi. Darbeciler yoğun çatışmaların ardından Marmara hattına çekildi. \n\nDarbecilerin bu denli yoğun savaşması, Türkiye'de bir iç savaşın baş gösterdiğinin kanıtıydı."
 Turkey_news.8.a:0 "Belirsiz Zamanlar"
 Turkey_news.9.t:0 "Türkiye'de Askerî Darbe"
 Turkey_news.9.d:0 "Ekonominin kötüleşmesi ve yolsuzluğun artmasıyla Türk Silahlı Kuvvetleri yönetime el koydu. Yaklaşık 223 kişi gözaltına alındı. Darbe girişiminde 2 nöbetçi hayatını kaybetti. Ordu, yönetimi her an bırakabileceğini ve Atatürk ilkelerine son derece bağlı olduğunu açıkladı."
 Turkey_news.9.a:0 "Belirsiz Zamanlar"
 Turkey_news.10.t:0 "Covid-19'un Yükselisi"
 Turkey_news.10.d:0 "Koronavirüs hastalığı 2019 (COVID-19), şiddetli akut solunum sendromu koronavirüsü 2'nin (SARS-CoV-2) neden olduğu bulaşıcı bir hastalıktır. İlk vaka Aralık 2019'da Çin'in Vuhan kentinde tespit edildi. Hastalık o zamandan bu yana dünya geneline yayılarak süregelen bir pandemiye yol açtı. \n\nElbette bu olay dünya ekonomilerine büyük zarar verecek."
 Turkey_news.10.a:0 "Önümüzde zor günler var"
 Turkey_news.11.t:0 "Karabag'da Çatismalar"
 Turkey_news.11.d:0 "Çatışmalar 27 Eylül 2020 sabahı Birinci Dağlık Karabağ Savaşı'nın (1988-1994) ardından oluşturulan Dağlık Karabağ Temas Hattı boyunca başladı. Buna karşılık Ermenistan ve Artsakh sıkıyönetim ve genel seferberlik ilan ederken Azerbaycan sıkıyönetim, sokağa çıkma yasağı ve kısmi seferberlik ilan etti. Türkiye Azerbaycan'a askerî destek sağladı, ancak bu desteğin boyutu tartışmalı. Türkiye'nin müdahalesinin hem Azerbaycan'ın çatışmadaki konumunu güçlendirerek hem de Rusya'nın bölgedeki etkisini zayıflatarak nüfuz alanını genişletme girişimi olduğu düşünülüyor."
 Turkey_news.11.a:0 "Sığınaklara girin"
 Turkey_news.12.t:0 "Türk Iç Savasi Sona Erdi"
 Turkey_news.12.d:0 "Ülkedeki iç savaş nihayet sona erdi. Şehirler İç Savaş nedeniyle ağır hasar gördü. Savaşın bitmesiyle Türkiye artık şehirlerini yeniden inşa etmeye başlayabilir. Yeniden inşa ülke ekonomisini elbette zorlayacak."
 Turkey_news.12.a:0 "Türkiye'ye barış geliyor"
 Turkey_news.13.t:0 "Azerbaycan Türkiye'ye Katildi"
 Turkey_news.13.d:0 "Türkiye'nin Azerbaycan ile iyi ilişkileri sonucunda iki ülke birleşme kararı aldı. Birleşme iki ülkeye de katkı sağlayacak. Bu birleşme Türk Birliği için büyük ve genel bir adım olabilir. Güç birlikten doğar."
 Turkey_news.13.a:0 "İlginç"
 Turkey_news.14.t:0 "Türklerin Birlesmesi"
 Turkey_news.14.d:0 "Türkler birleşme kararı alarak Turan Birliği'ni kurdu. Turan Birliği, başkentin Ankara, para biriminin Türk lirası olmasına ve ülkenin ortak bir dil kullanmasına karar verdi. Türk muhalefeti Turan Birliği'ne karşı sesini bile çıkarmadı, aksine destekledi. Bu da yeni kurulan birliğin daha da sıkılaşmasını sağladı. Turan Birliği'nin kurulması dünyadaki dengeleri değiştirdi. Görünüşe göre Rusya ve Çin bu durumdan memnun olmayacak."
 Turkey_news.14.a:0 "Güç birlikten doğar"
 Turkey_news.15.t:0 "Osmanli Saltanati Yeniden Dogdu"
 Turkey_news.15.d:1 "Tüm dünyanın büyük endişesine rağmen, ülkenin darbecileri ile laik Kemalistleri arasındaki son derece acımasız bir iç savaşın ardından Osmanlı padişahı yeniden tahtına oturtuldu. Adeta Orta Çağ'dan fırlamış gibi görünen görkemli bir törenle padişah eski makamına iade edildi ve Mustafa Kemal Atatürk'ün cumhuriyeti sonsuza dek lağvedildi. \n\n[TUR.GetLeader], yeniden doğan saltanatına hitap ederek atalarının makamına iade edilmesinden duyduğu şaşkınlık ve tevazuyu dile getirdi. Yeni padişah yumuşak huylu bir adam, ancak etrafı savaş yanlıları ve irredantistlerden oluşan bir saray erkânıyla çevrili. Padişahın dönüşünün mümkün olduğuna bile inanmayan uzmanlar, geleceğin neler getireceği konusunda hiçbir fikre sahip değil."
 Turkey_news.15.a:1 "Elhamdülillah!"
 Turkey_news.16.t:0 "Türkiye Islam Cumhuriyeti Ilan Edildi"
 Turkey_news.16.d:1 "Türkiye'deki darbeciler yönetimi tamamen ele geçirdikten sonra ABD'ye bağlı bir İslam Cumhuriyeti kurdu. Ülkedeki huzursuzluk had safhaya ulaştı. Bu durum sonucunda laikler gerillaya dönüşmeye başladı."
 Turkey_news.16.a:1 "Elhamdülillah!"
 Turkey_news.17.t:0 "Büyük Türk Iç Savasi"
 Turkey_news.17.d:1 "Polisin sert baskısıyla birlikte göstericiler ve işçiler silahlanmaya başladı ve sonunda polise ateş açtı. Sokaklar kan gölüne döndü. Bölgelere asker sevk edilmeye başlandı. Belirli bir yerel bölgede oluşan partizanlar birleşerek resmen Türkiye'nin batısını ele geçirdi ve orada yeni bir rejim kurdu. Kurtuluş Cephesi adı verilen bu cephenin amacı ülkeyi kapitalist düzenden kurtarmak.\n\nMevcut Türk rejiminin NATO tarafından destekleneceği açıklandı. Rusya ise Kurtuluş Cephesi'ni destekleyeceğini söyledi."
 Turkey_news.17.a:1 "Une Nouvelle Révolution"
 Turkey_news.18.t:0 "Türkiye Kopenhag Kriterlerini Benimsedi"
 Turkey_news.18.d:1 "Türkiye'de son yıllarda hükümetler Anayasa'da ve yasalarda çok kapsamlı değişiklikler ve yenilikler yaptı ve bunları yürürlüğe koydu. Bu arada Gümrük Birliği anlaşması Birliğe katılan 10 yeni ülkeyi de kapsayacak şekilde genişletildi. Kopenhag'ın siyasi kriterleri Türkiye açısından ön plana çıksa da, 3 Ekim 2005'te başlayacak müzakerelerde ele alınacak 35 ana başlığın önemli bir kısmını ekonomik konular oluşturduğundan, Kopenhag ekonomik kriterlerinin benimsenmesi Türkiye'nin Avrupa Birliği'ne tam üyeliğinin gerçekleşmesi açısından büyük önem taşıyor. Kopenhag ekonomik kriterleri temelde iki ana ekonomik unsuru kapsıyor."
 Turkey_news.18.a:1 "Piyasaların Serbestleşmesi"
 Turkey_news.19.t:0 "2008 Büyük Durgunlugu"
 Turkey_news.19.d:1 "Büyük Durgunluk, 2007-2009 yılları arasında küresel ölçekte ulusal ekonomilerde gözlemlenen belirgin bir genel gerileme (resesyon) dönemidir. Durgunluğun boyutu ve zamanlaması ülkeden ülkeye farklılık gösterdi. O dönemde Uluslararası Para Fonu (IMF), bunun Büyük Buhran'dan bu yana yaşanan en şiddetli ekonomik ve finansal çöküş olduğu sonucuna vardı. Sonuçlarından biri, olağan uluslararası ilişkilerin ciddi şekilde sekteye uğraması oldu.\n\nBüyük Durgunluğun nedenleri arasında finansal sistemde gelişen kırılganlıklar ile 2005-2012'de ABD konut balonunun patlamasıyla başlayan bir dizi tetikleyici olay yer alıyor."
 Turkey_news.19.a:1 "Mortgage Şovu"
 Turkey_news.20.t:0 "Lehman Brothers Iflas Etti"
 Turkey_news.20.d:1 "15 Eylül 2008'de şirket, müşterilerinin çoğunun kaçması, hisselerindeki sert kayıplar ve büyük ölçüde güven kaybı, Lehman'ın mortgage krizine dahil olması ve likiditesi düşük varlıklara maruz kalması nedeniyle kredi derecelendirme kuruluşlarının varlıklarının değerini düşürmesinin ardından Chapter 11 iflas koruması için başvurdu. Lehman'ın iflas başvurusu ABD tarihinin en büyüğüydü ve 2007-2008 finansal krizinin gelişiminde büyük rol oynadığı düşünülüyor. Piyasa çöküşü "batamayacak kadar büyük" doktrinine de destek verdi."
 Turkey_news.20.a:1 "Tschüss!"
 Turkey_news.21.t:0 "IMKB Çaresiz"
 Turkey_news.21.d:1 "İstanbul Menkul Kıymetler Borsası tarihinin en kötü yılını geride bırakmaya hazırlanıyor. 2008'de yüzde 52,4 değer kaybeden İMKB, bu gidişle en büyük yıllık düşüşünü yaşamış olacak. Tüm dünya piyasalarını etkileyen küresel krizden en çok etkilenen ülke borsalarından biri İMKB oldu. 2007'yi yüzde 42 primle tamamlayan borsa, 2008'de tam bir kâbus yaşadı. Yeni yıla 55 bin 538 puandan başlayan borsa, dünkü kapanışa göre 26 bin 411 puana geriledi. Böylece borsanın yıllık kaybı yüzde 52,4 olarak kaydedildi. Borsanın diğer yıllardaki performansına bakıldığında hiç bu kadar yüksek bir kayıp yaşanmadığı dikkat çekiyor. 1988'den itibaren yaptığımız araştırmada 2008'den sonraki en büyük kaybın yüzde 45 ile 1988'de yaşandığını tespit ettik. İMKB 2000'de değerinin yüzde 38'ini kaybetti; bunu yüzde 24,76 ile 2002 ve yüzde 24,72 ile 1998 izledi."
 Turkey_news.21.a:1 "Sigaran Var mı?"
 Turkey_news.22.t:0 "Mavi Marmara Krizi"
 Turkey_news.22.d:1 "İsrail hükümeti 23 Temmuz 2010'da, el konulduğundan bu yana ikisi Hayfa Limanı'nda, üçüncüsü Aşdod Limanı'nda demirli bekleyen Gazze Özgürlük Filosu'nun üç gemisini serbest bırakma kararı aldı. Gemileri Türkiye'ye geri getirmek için üç Türk römorkörü gönderildi. Mavi Marmara, Ocean Ergün tarafından iki günlük bir yolculukla İskenderun Limanı'na çekildi ve 7 Ağustos 2010'da limana ulaştı. Savcılığın yürüttüğü soruşturma nedeniyle kimsenin Mavi Marmara'ya binmesine izin verilmedi, ancak yayımlanan fotoğraflarda kırık camlar ve kaptan köşkünün camlarındaki kurşun delikleri görülüyordu. Geminin iskele tarafındaki İHH amblemi beyaz boyayla kapatılmıştı. Türk basınına göre adli ekipler gemide yaklaşık 250 kurşun deliği tespit etti; bunların çoğunun İsrail tarafından boyandığı ya da sıvandığı iddia edildi. Gemi 26 Aralık 2010'da binlerce kişinin katıldığı bir karşılama töreniyle İstanbul limanına döndü."
 Turkey_news.22.a:1 "Emperyalizm Kapıda"
 Turkey_news.23.t:0 "Ecevit'in Mirasi"
 Turkey_news.23.d:1 "Türkiye Cumhuriyeti devleti geleneklerine geri dönüş gösteriyor. Ecevit'in partisi yeniden bir şeyleri kurtarmaya çalışıyor. Görünüşe göre Türk kahramanlığı ve atılganlığı yakında artacak. ABD Dışişleri'nin açıklamasına göre Türkiye'nin kötü bir hamlesi önce yaptırımlarla, bir hata daha yapılırsa da özellikle Amerika bu durumdan rahatsız olursa savaşla sonuçlanacak. Amerikan ordusunun Dedeağaç'ta tatbikat yapması bekleniyor."
 Turkey_news.23.a:1 "Yaşasın Türk Kahramanlığı!"
 Turkey_news.24.t:0 "Türk Geçis Kapisi Projesi Basariya Ulasti"
 Turkey_news.24.d:1 "Türkiye Cumhuriyeti, planlarını yapıp gerekli yatırımları gerçekleştirerek Türk transit hatları projesini tamamladığını açıkladı. Böylece Türkiye önemli bir transit bölge hâline geldi. Ticaretin artık bu ülkeden geçecek olması ülke ekonomisine önemli katkı sağlayacak. Türkiye hızla gelişiyor."
 Turkey_news.24.a:1 "Ne Ticaret Yolu Ama!"
 Turkey_news.25.t:0 "Helen-Türkçülügün Yükselisi"
 Turkey_news.25.d:1 "Helen-Türkçülük idealleri Türkiye'de iktidara geldi. Türkiye'de gözlemlenen bu değişimin ardından aynısının Yunanistan'da da görülmesi bekleniyor. İki düşman ülke arasındaki husumetin sona erdiği görülüyor. Bu durum iki ülkenin milliyetçilerini ve özellikle Rusya'yı rahatsız edecek. Destekçilerine göre Yunanistan, Türkiye ve Kıbrıs arasında kurulacak (ulusal başkentleri Atina, Ankara ve Lefkoşa, konfederasyon meclisi İstanbul'da olan) iki dilli bir "Yunan-Türk Konfederasyonu" (Doğu Akdeniz Konfederasyonu), bir ölçüde Bizans ve Osmanlı İmparatorluklarının yeniden doğuşu olacak; böylece bu iki tarihî süper gücün Doğu Akdeniz bölgesindeki yokluğunun bıraktığı siyasi, kültürel ve ekonomik boşluğu dolduracak. Balkanlar, Orta Doğu, Doğu Akdeniz, Kafkasya ve Orta Asya'yı kapsayan bölgedeki en büyük ekonomiye ve orduya sahip olacak ve coğrafi konumu sayesinde dünyanın kilit büyük güçlerinden biri hâline gelecek."
 Turkey_news.25.a:1 "Ne!"
 Turkey_news.26.t:0 "Ilk Mafya Darbesi"
 Turkey_news.26.d:1 "Uzun bir mücadelenin ardından mafyalar Türkiye'de iktidarı ele geçirdi. Bu durum dünyayı etkiledi. \n\nİnsanlardaki kuşkular artıyor. Mafyaların iktidara gelmesiyle suç dosyaları artacak, genel olarak suç oranı da yükselecek. Birleşmiş Milletler'in ve dünya kuruluşlarının bu mafya durumunun üstesinden gelebilmesini umuyoruz."
 Turkey_news.26.a:1 "Eyvah"
 Turkey_news.27.t:0 "Islam Isbirligi Teskilati Gerçege Dönüsüyor"
 Turkey_news.27.d:1 "İslam İşbirliği, birleşme ve güçlenme kararı nedeniyle son dönemde gelişiyor. \n\nBu kararla birlikte Amerikan karşıtı gösteriler arttı. Artık Amerikan etkisine karşı çıkacak, topraklarını işgalcilerden koruyacak ve kendini gayrimüslimlere karşı savunacak tek ses İslam dünyası."
 Turkey_news.27.a:1 "İslam Birliğini Buldu"
 Turkey_news.28.t:0 "IMF Anarsistlerin Kontrolüne Geçti"
 Turkey_news.28.d:1 "IMF'nin kontrolü anarşistlerin eline geçti ve dünya ülkeleri bu durumu kabullendi. Çünkü dünya devletleri bu anarşistlerin IMF'yi daha sistemli yöneteceğine inanıyor. \n\nDünya anarko-kapitalizmle ilk kez tanışıyor ve onun nimetlerinden yararlanmak istiyor. Gelecek ne getirecek? Zaman gösterecek."
 Turkey_news.28.a:1 "Uluslararası Anarşizm mi?"
 Turkey_news.29.t:0 "Bir NATO Ülkesi Rus Müttefikine mi Dönüsüyor?"
 Turkey_news.29.d:1 "31 Temmuz'da ABD'nin Türkiye'ye Rusya ile S-400 füze sistemi anlaşmasından vazgeçmesi için verdiği süre doldu. \n\nAnkara, Washington ile müzakere ederek yaptırım uygulamaması için onu ikna etme çabalarını sürdürürken Batılı yorumcular Türk dış politikasında büyük bir değişimden söz etmeye başladı. Bazıları Türkiye'nin "ABD'ye sırtını döndüğünü" ve Rusya'ya yakınlaştığını öne sürecek kadar ileri gitti."
 Turkey_news.29.a:1 "Bir Olay"
 Turkey_news.30.t:0 "Andrew Brunson ABD'ye Geri Gönderildi"
 Turkey_news.30.d:1 "ABD'deki Evanjelik Hristiyanlar hızla davasına sahip çıkarak kendisine yöneltilen suçlamaların asılsız olduğunu, dinî inancı nedeniyle tutulduğunu ve zulme uğradığını söyledi. Muhafazakâr bir Hristiyan kuruluşu olan Amerikan Hukuk ve Adalet Merkezi, Brunson için Beyaz Saray ve diğer kurumlar nezdinde lobi faaliyeti yürüttü. Kuruluşun başlattığı ve "Hristiyanlık yargılanıyor" ifadesine yer verilen, rahibe destek kampanyasını yaklaşık 600.000 kişi imzaladı. \n\nTrump'ın nisan ayında Brunson hakkında attığı ilk tweet şöyleydi: "ABD'de iyi bir beyefendi ve Hristiyan lider olan Rahip Andrew Brunson, Türkiye'de sebepsiz yere yargılanıyor ve zulme uğruyor. Ona casus diyorlar, ama ben ondan daha fazla casusum. Umarım ait olduğu güzel ailesinin yanına dönmesine izin verilir!""
 Turkey_news.30.a:1 "Ne Trajedi!"
 Turkey_news.31.t:0 "Türk Iç Savasi"
 Turkey_news.31.d:1 "Seçim sonuçlarıyla komünistlerin meşru iktidarı kazanması nedeniyle Türkiye'de gerginlik artıyor. Bu seçim sonuçlarından memnun olmayan sağ kesim sokaklara dökülerek isyan etti ve bir iç savaş başlattı. Bu sağcı yapılanma resmen ülkücü milliyetçiler tarafından finanse ediliyor, bu da neden bu kadar güçlü olduklarını açıklıyor. \n\nÇatışmaların uzun süre devam etmesi ve sonunda komünistlerin zafer kazanması bekleniyor."
 Turkey_news.31.a:1 "Vatan Harpte!"
 Turkey_news.32.t:0 "Ilk Anarsist Ele Geçirme"
 Turkey_news.32.d:1 "Anarşist devrim Türkiye'ye ulaştı ve bu durum tüm dünyada yankı uyandırdı. \n\nAnarşizm tüm dünyaya yayılabilir. Böyle bir şey olursa geriye kim hayatta kalır? Bu devrim insanların tüylerini diken diken ediyor."
 Turkey_news.32.a:1 "Bir Cadı Avının Başlangıcı"
 Turkey_news.34.t:0 "Isveç-Türkiye Siyasi Krizi"
 Turkey_news.34.d:1 "Türkiye İsveç'teki Kur'an yakma olayını sert bir dille kınadı. Erdoğan ise İsveç'in NATO'ya kabul edilmemesi gerektiğini söyledi. İsveç'te Kur'an yakma eylemi gerçekleştiren Danimarkalı aşırı sağcı Paludan İslam dünyasının tepkisini çekti ve çeşitli İsveç konsoloslukları önünde eylemler yapıldı. Bazıları İsveç'le yaşanan gerginliğin geçmesinin uzun zaman alacağını söyledi."
 Turkey_news.34.a:1 "Eyvah..."
 Turkey_news.35.t:0 "Türkiye'de Anayasal Hükümet Yönetimi Devraldi"
 Turkey_news.35.d:1 "Türkiye'de beklenmedik bir olay yaşandı. Türkiye'deki Anayasa Mahkemesi Türk Silahlı Kuvvetleri'ne ve hükümete karşı ayaklandı. Ayaklanma sonucunda Anayasa Mahkemesi yasama, yürütme ve yargı yetkilerini ele geçirdi. Ordudaki düzen ise altüst oldu. Mahkeme vatandaşlardan sakin olmalarını istedi ve Atatürk'ün adalet ilkelerini vurguladı. NATO ve Avrupa Birliği ise mahkemenin Türkiye'deki hamlesini destekledi."
 Turkey_news.35.a:1 "Bu Beklenmiyordu"
 Turkey_news.36.t:0 "Kahramanmaras 7,7 ve 7,6 Depremleri"
 Turkey_news.36.d:1 "6 Şubat'ta yerel saatle 04.15 sıralarında Türkiye-Suriye sınırı yakınlarında Türkiye'nin güney-orta kesiminde 7,8 büyüklüğünde bir deprem meydana geldi. Yalnızca 11 dakika sonra 6,7 büyüklüğünde bir artçı sarsıntı yaşandı. Bu yazının yazıldığı sırada en büyük artçı sarsıntı, 95 km (yaklaşık 60 mil) kuzeyde meydana gelen M7,5 büyüklüğündeki depremdi. USGS gözlemleri ve analizleri tüm bu olayların Doğu Anadolu fay sistemi içinde gerçekleştiğini gösteriyor.\n\nSerideki en büyük iki deprem görece sığ; ana şok 18 kilometre (11 mil), 7,5 büyüklüğündeki artçı ise 10 kilometre (6 milin biraz üzerinde) derinlikte. Depremlerin görece sığ olması nedeniyle sarsıntının şiddeti çok yüksek."
 Turkey_news.36.a:1 "Allah Yardımcımız Olsun"
 Turkey_news.37.t:0 "Kiliçdaroglu Muhalefetin Adayi Oldu"
 Turkey_news.37.d:1 "Türk muhalefet lideri Kemal Kılıçdaroğlu, altılı ittifakın beklendiği gibi kendisini cumhurbaşkanı adayı olarak belirlemesinin ardından pazartesi günü 14 Mayıs'ta yapılması beklenen tarihî seçimlerde Cumhurbaşkanı Tayyip Erdoğan'ın başlıca rakibi olarak öne çıktı.\n\nÜlkenin ikinci büyük partisinin lideri olan 74 yaşındaki Kılıçdaroğlu, Erdoğan'ın gölgesinden çıkmayı ve NATO üyesi ve büyük gelişmekte olan ekonomi olan ülkeyi dönüştüren yirmi yıllık iktidarın ardından Cumhurbaşkanı'nı koltuğundan etmeyi hedefliyor. Cumhuriyet Halk Partisi (CHP) Genel Başkanı Kılıçdaroğlu, Ankara'da toplanan yaklaşık 2.000 kişiye "Bizim masamız barış masasıdır. Tek hedefimiz ülkeyi refah, huzur ve neşe dolu günlere taşımaktır" dedi."
 Turkey_news.37.a:1 "İlginç"
 Turkey_news.38.t:0 "Muharrem Ince'nin 2023 Zaferi"
 Turkey_news.38.d:1 "Muharrem İnce, uzun süren bir iktidarın sonunu getiren isim oldu. Yaklaşık 20 yıl süren AK Parti iktidarı sona erdi. Seçim günü Muharrem İnce'nin etrafında büyük bir coşku vardı; artık güçlü rakipleri Recep Tayyip Erdoğan, Kemal Kılıçdaroğlu ve Sinan Oğan'ı yenerek bu ülkenin cumhurbaşkanı olacaktı. Uzun süren AK Parti iktidarının sona ermesinin ardından ortamda bir belirsizlik olması bekleniyor. Beklenmedik bir şey olmazsa durum iyi olacak."
 Turkey_news.38.a:1 "Çok İlginç"
 Turkey_news.39.t:0 "Sinan Ogan'in 2023 Zaferi"
 Turkey_news.39.d:1 "Sinan Oğan uzun süren bir iktidarın sonunu getiren isim oldu. Yaklaşık 20 yıl süren AK Parti iktidarı sona erdi. Seçim günü Sinan Oğan'ın etrafında büyük bir coşku vardı; artık güçlü rakipleri Recep Tayyip Erdoğan, Kemal Kılıçdaroğlu ve Muharrem İnce'yi yenerek bu ülkenin cumhurbaşkanı olacaktı. Uzun süren AK Parti iktidarının sona ermesinin ardından ortamda bir belirsizlik olması bekleniyor. Sinan Oğan'ın iktidara gelmesi başka bir meseleyi de gündeme getirdi: Mültecilere şimdi ne olacak? Vaat edildiği gibi mülteciler Avrupa Birliği hesaba katılmadan ülkeden çıkarılacak mı?"
 Turkey_news.39.a:1 "Çok İlginç"
 Turkey_news.40.t:0 "Erdogan'in 2023 Zaferi"
 Turkey_news.40.d:1 "Gayriresmî sonuçlara göre Cumhurbaşkanı Recep Tayyip Erdoğan oyların yüzde 52'siyle yeniden seçildi. Seçim zaferinin ardından Cumhurbaşkanı Erdoğan, Beştepe'deki Cumhurbaşkanlığı Külliyesi'nde gelenekselleşen "balkon konuşmasını" yaptı. Erdoğan konuşmasına kampanya boyunca mitinglerinde sıkça seslendirdiği şarkıyla başladı. Beştepe'de toplanan kalabalık "Ordu burada, komutan burada" sloganları attı.\n\nErdoğan, "Cumhur İttifakı'nı mahcup etmediniz, yalnız bırakmadınız. Bu yolu birlikte yürüdük. Gece gündüz demeden yürüdük ve bize bu görevi yeniden verdiniz. İnşallah Türkiye Yüzyılı'nı birlikte inşa etmeye ve ihya etmeye devam ediyoruz" dedi."
 Turkey_news.40.a:1 "Çok İlginç §Y(Konuşmasız)§!"
 Turkey_news.40.b:1 "Yaşasın Recep Tayyip Erdoğan"
 Turkey_news.41.t:0 "Kiliçdaroglu'nun 2023 Zaferi"
 Turkey_news.41.d:1 "Türkiye seçimlerinde beklenmedik bir gelişme yaşandı ve Cumhuriyet Halk Partisi (CHP) Genel Başkanı Kemal Kılıçdaroğlu galip geldi. Kılıçdaroğlu'nun zaferi, Türkiye'nin siyasi manzarasında çarpıcı bir değişime işaret ediyor ve yeni bir birlik, reform ve kapsayıcı yönetim dönemi vaat ediyor.\n\nÇekişmeli geçen yarışta Kılıçdaroğlu'nun kampanyası millî birlik ve sosyal adalet mesajıyla ivme kazandı. Hâkim siyasi kutuplaşmadan bir değişim isteyen seçmenler kapsayıcı yaklaşımına olumlu yanıt verdi ve onu zafere taşıdı."
 Turkey_news.41.a:1 "Çok İlginç"
 Turkey_news.42.t:0 "Atatürk'ün Dönüsü"
 Turkey_news.42.d:1 "Mustafa Kemal Atatürk'ün yaşadığı ortaya çıktı; bu inanılmaz bir durum. Bilim insanları şaşkına döndü. Tanrı Türklere acıdığı için mi Atatürk'ü geri gönderdi? Mustafa Kemal Atatürk'ün dönüşü Yunanistan'da ve Ermenistan'da gerginliğe yol açtı. Aynı şey Suriye'de de yaşandı. Mustafa Kemal Atatürk'ün ülkenin yönetimini devralması ve pek çok reform yapması da bekleniyor. Türkiye, Avrupa Birliği'nin aşırı anlayışından biraz kopmayı ve Atatürk'ün yüce liderliğinde özgür ve demokratik bir ekonomik kalkınma sağlamayı umuyor."
 Turkey_news.42.a:1 "İmkânsız"
 Turkey_news.43.t:0 "Kuzey Kürdistan Türkiye'ye Katildi"
 Turkey_news.43.d:1 "Şaşırtıcı bir hamleyle özerk Kuzey Kürdistan bölgesi, tamamen entegre bir il olarak Türkiye'ye katılma kararı aldı. Karar, Kürt yönetimi ile Türk yetkililer arasında aylarca süren müzakerelerin ardından geldi; iki taraf birleşme için bir dizi şart ve koşul üzerinde anlaştı. Anlaşmaya göre Kuzey Kürdistan kendi valisi ve idari yapısıyla Türkiye'nin 82. ili olacak. Kürtçe Türkçeyle birlikte resmî dil olarak tanınacak, Kürt nüfus tam vatandaşlık haklarından ve Türkiye Büyük Millet Meclisi'nde temsil hakkından yararlanacak. Karar bölgede karışık tepkilerle karşılandı; bazı Kürt milliyetçileri bunu bağımsızlık davalarına ihanet olarak kınadı. Diğerleri ise bunu Kürtler ile Türkler arasında daha fazla birlik ve işbirliğine doğru bir adım olarak görüyor ve bunun bölgenin bütününe daha fazla istikrar ve refah getirmesini umuyor."
 Turkey_news.43.a:1 "İmkânsız"
 Turkey_news.44.t:0 "Gülen Suikasti"
 Turkey_news.44.d:1 "Şok edici bir gelişmeyle tartışmalı Türk din adamı Fethullah Gülen, bugün erken saatlerde düzenlendiği iddia edilen suikast girişiminden kurtulamadı. Olay, kimliği belirsiz saldırganların görünüşe göre onu öldürmek amacıyla sızdığı Gülen'in konutunda meydana geldi. Gülen'in güvenlik personeli müdahale etse de saldırganları zamanında durduramadı. Soruşturmalar sürerken dünya, bu son gelişmenin Türkiye ile ABD arasındaki zaten karmaşık olan ilişkiyi nasıl etkileyeceğini yakından izliyor. Olay, Fethullah Gülen ve hareketini çevreleyen süregelen güç mücadelelerini, siyasi gerginlikleri ve tartışmaları hatırlatıyor."
 Turkey_news.44.a:1 "Eyvah"
 Turkey_news.45.t:0 "Mavi Çatisma Harekâti"
 Turkey_news.45.d:1 "Şaşırtıcı bir hamleyle ABD ve NATO hükümetleri, öncelikli olarak NATO yardımı sağlamaya ve bölgede barışı teşvik etmeye odaklanarak süregelen Türk İç Savaşı'na müdahale etme niyetlerini açıkladı. Karar, tırmanan siyasi krizi ve çatışmanın neden olduğu yaygın acıyı ele almak için aylarca süren dikkatli değerlendirmelerin ve kapsamlı diplomatik çabaların ardından geldi.\n\nTürk İç Savaşı tüm şiddetiyle sürerken sivil can kayıpları ve altyapıdaki hasar artmaya devam ediyor. Yaygın yerinden edilme, gıda kıtlığı ve tıbbi malzeme eksikliğine ilişkin haberler uluslararası ilgi ve endişeye yol açtı. Durumun aciliyetinin farkında olan ABD ve NATO, acıları hafifletmeye ve savaşın harap ettiği ülkede istikrarı yeniden sağlamaya yardım etme sözü verdi."
 Turkey_news.45.a:1 "ABD Yine Özgürlük Getiriyor"
 Turkey_news.46.t:0 "Rusya Mavi Çatisma Operasyonunu Ezdi"
 Turkey_news.46.d:1 "Endişe verici bir gelişmeyle Rusya, ABD ve NATO'nun süregelen Türk İç Savaşı'na müdahalesine ilişkin derin kaygılarını dile getirdi. Tırmanan çatışmanın ortasında Rus yetkililer, yabancı güçlerin müdahalesinin Türk Boğazları gibi kritik uluslararası su yollarını da etkileyebilecek geniş kapsamlı sonuçlar doğurabileceği uyarısında bulundu.\n\nGerginlik artarken haberler, zırhlı araçlar ve hava desteğiyle desteklenen Rus birliklerinin Boğazlar bölgesine geçtiğini doğruluyor. Bu hamle bir güç gösterisi ve Rusya'nın nüfuz alanına tecavüz olarak algıladığı duruma göz yummayacağına dair açık bir mesaj olarak görülüyor. Durum, daha geniş bir bölgesel çatışma ihtimaliyle birlikte çatışmanın tırmanabileceği endişelerini artırdı."
 Turkey_news.46.a:1 "Gerginlik Tırmanıyor"
 Turkey_news.47.t:0 "SADAT Öncülügündeki Tank Konvoyu Hükümeti Devirmeye Çalisiyor"
 Turkey_news.47.d:1 "Eşi görülmemiş bir gelişmeyle Türkiye, bağımsız bir savunma danışmanlık şirketi olan SADAT ile bağlantılı bir grubun MİT (Hakan Fidan ve Fahrettin Altun) liderliğindeki hükümeti devirmek için düzenlediği darbe girişimiyle kargaşaya sürüklendi. Darbeciler Ankara'ya doğru bir tank konvoyu yürüyüşü düzenleyerek ülkenin kurumlarını tehdit ederken Türk devleti beklenmedik zorluklarla karşılaştı. Darbe girişimi ülke genelinde şok etkisi yarattı ve başarılı bir devrimin olası sonuçları konusunda uluslararası toplumda endişelere yol açtı."
 Turkey_news.47.a:1 "SADAT Yürüyor"
 Turkey_news.48.t:0 "HP'nin Teknokrasi Referandumu Zaferi"
 Turkey_news.48.d:1 "Teknokrat Parti'nin (Halkın Partisi - HP) teknokrasi referandumunda ezici bir zafer kazanmasının ardından Türkiye, ülke yönetiminde bir paradigma değişimine işaret eden bilinmeyen sularda yol alıyor. HP'nin referandumdaki başarısı kanıta dayalı karar almaya yönelik bir halk iradesini ortaya koysa da sonrasında ortaya çıkan bir dizi öngörülemeyen sorun ve toplumsal karmaşa ülkeyi çözüm arayışına itti. HP'nin teknokratik vizyonu lehine çoğunluk sağlayan referandum sonuçları, Türk vatandaşları arasında uzmanların ve veriye dayalı politikaların yön verdiği bir hükümete yönelik artan isteği yansıtıyordu. HP'nin verimlilik, ilerleme ve etkili sorun çözme vaatleri, acil sorunlara alternatif çözümler arayan seçmenlerde karşılık buldu."
 Turkey_news.48.a:1 "Teknokratik Bir Ele Geçirme mi?"
 Turkey_news.49.t:0 "Türk Iç Savasi"
 Turkey_news.49.d:1 "Güçlü mafya grupları ile MİT Başkanı Hakan Fidan liderliğindeki hükümet güçleri arasında şiddetli bir iç savaş patlak verirken Türkiye kaosa sürüklendi. Savaşan taraflar arasındaki şiddetli çatışmalar büyük şehirlere yayılarak arkasında yıkım ve kayıp bırakırken ülke yok olmanın eşiğine geldi. Kriz, köklü rekabetler ve çatışan çıkarlarla beslenen hükümet ile mafya grupları arasındaki gerginliğin patlama noktasına ulaşmasıyla başladı. Kontrol kurmak ve etkilerini genişletmek isteyen mafya grupları kilit devlet kurumlarına ve yetkililerine bir dizi küstah saldırı düzenledi. Türkiye'nin Millî İstihbarat Teşkilatı'nın (MİT) başındaki Hakan Fidan, devletin kurumlarını koruma ve kanun ile düzeni sağlama sözü vererek hükümetin karşı hamlesinin başına geçti."
 Turkey_news.49.a:1 "Türkiye İstikrarsızlığa Sürükleniyor"
 Turkey_news.50.t:0 "Türkiye Rus Uçaklarini Düsürdü"
 Turkey_news.50.d:1 "Son derece provokatif bir olayda Türkiye'nin Suriye sınırı yakınında hava sahasına giren iki Rus askerî uçağını düşürdüğü bildirildi. Olay Türkiye ile Rusya arasındaki gerginliği tırmandırdı ve bölgesel istikrar açısından olası sonuçları konusunda uluslararası endişeye yol açtı.\n\nTürk yetkililere göre Rus uçakları izinsiz olarak Türk hava sahasını ihlal etti ve geri dönmeleri için yapılan çok sayıda uyarıyı dikkate almadı. Toprak bütünlüğüne yönelik bu tehdide karşılık Türk savaş uçakları Rus uçaklarına angajmana girdi ve onları düşürdü.\n\nRus hükümeti ise Türkiye'nin olaya ilişkin açıklamasına şiddetle itiraz ederek uçaklarının Suriye üzerinde rutin bir devriye görevinde olduğunu ve Türk hava sahasına girmediğini öne sürdü."
 Turkey_news.50.a:1 "Ne Dramatik Bir Durum!"
 Turkey_news.51.t:0 "Türk Hükümeti Ekrem Imamoglu'nu Tutukladi"
 Turkey_news.51.d:1 "Cumhurbaşkanı Recep Tayyip Erdoğan'ın en büyük rakibi olan İstanbul Büyükşehir Belediye Başkanı Ekrem İmamoğlu, geçen ay tutuklanıp yüksek güvenlikli bir cezaevine konulmasından bu yana ilk kez hâkim karşısına çıktı. Yolsuzluk ve terör suçlamalarıyla tutuklu bulunan İmamoğlu, cuma günü İstanbul Cumhuriyet Başsavcısını tehdit etmeye çalışmakla suçlandığı ayrı bir davada Silivri cezaevindeki özel mahkemede hâkim karşısına çıktı. Türk muhalefeti İmamoğlu'nun tutuklanmasını "bir sonraki cumhurbaşkanımıza karşı darbe girişimi" olarak kınadı; tutuklanması on yılı aşkın sürenin en büyük Erdoğan karşıtı protestolarına yol açtı.\n\nİmamoğlu mahkemede "İstanbul'da üç kez seçim kazandığım için buradayım" dedi. "'İstanbul'u kazanan Türkiye'yi kazanır' anlayışına karşı kazandığım için tutuklu olarak buradayım" diye ekledi.\n\nİmamoğlu, siyasi kariyerine Türkiye'nin en büyük şehrinin belediye başkanı olarak başlayan ve o zamandan beri bu ifadeyi sıkça kullanan Cumhurbaşkanı Erdoğan'a atıfta bulunuyordu."
 Turkey_news.51.a:1 "Hiç İyi Görünmüyor"
 TurkeyO.1.title:0 "Kemalist Isyan Patlak Verdi"
 TurkeyO.1.desc:0 "İslamcıların ülkede iktidarı tamamen ele geçirdiğini gören Kemalist güçler silahlanarak bazı bölgeleri kontrolleri altına aldı. Kemalistlerin kontrol ettiği/işgal ettiği bu bölgelerdeki güçleri temizleyerek ülkeyi eski hâline getireceğiz."
