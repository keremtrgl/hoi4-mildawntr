 Turkey.400.title:0 "CHP'nin Mersin Mitingi"
 Turkey.400.desc:0 "CHP'nin seçim öncesi düzenlediği "Milletin Sesi" adlı ilk miting büyük ilgi gördü. Sabahın erken saatlerinden itibaren miting alanına girmek isteyenler oluşturulan 10 ayrı arama noktasından alana alındı. Yoğun ilgi nedeniyle arama noktalarının önünde büyük izdiham yaşandı."
 Turkey.400.a:0 "Kötü Haber"
 Turkey.401.title:0 "Bitcoin Alip Satmak Ister misin?"
 Turkey.401.desc:0 "2009'dan itibaren açılan kararlar aracılığıyla Bitcoin alıp satabilirsiniz. Bu kararlar oyunun gerçekçiliğini bozabileceğinden, onları açıp açmamaya buradan karar verebilirsiniz. Söyle bakalım, Bitcoin alıp satmak istiyor musun? Binance cevabını bekliyor."
 Turkey.401.a:0 "§GSadece Eğlenmek İçin Oynuyorum§!"
 Turkey.401.b:0 "§RHayır, Önce Gerçekçilik§!"
 Turkey.403.title:0 "Dogu Ekspresi Projesi Meclisten Geçti"
 Turkey.403.desc:0 "Doğu Ekspresi'ni genişletme projesi Meclisten geçti. Artık Doğu Ekspresi'ni geliştirmeye başlayabiliriz."
 Turkey.403.a:0 "Mükemmel"
 Turkey.402.title:0 "Türkiye Barolar Birligi Yeni Baskanini Seçti"
 Turkey.402.desc:0 "Türkiye Barolar Birliği (TBB) 36. Olağan Genel Kurulu'nda oylama tamamlandı. 348 delegenin oy kullandığı seçimde gayriresmî sonuçlara göre Ankara Barosu Başkanı Erinç Sağkan, mevcut Başkan Metin Feyzioğlu'nu geride bırakarak TBB'nin yeni başkanı oldu."
 Turkey.402.a:0 "Bol şans"
 Turkey.404.title:0 "Dolar 13,50 Lirayi Gördü"
 Turkey.404.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan'ın 22 Kasım'daki kabine toplantısının ardından "Kur artışı istihdamı artırır" demesinin ardından dolar/TL kuru yeni bir rekor kırarak 13,46'yı aştı.\n\nAvro/TL 15,16'yı aşarken sterlin/TL de ilk kez 18'i gördü.\n\nTürkiye Cumhuriyet Merkez Bankası (TCMB) eylül, ekim ve kasım aylarında piyasaların beklentilerinin aksine toplam 400 baz puanlık faiz indirimine giderek TL'deki değer kaybını hızlandırdı.\n\nEnflasyon yüzde 20'ye yaklaşmışken TCMB'nin politika faizini yüzde 15'e indirmesi TL üzerindeki baskıyı artırıyor."
 Turkey.404.a:0 "Devalüasyon gibi enflasyon"
 Turkey.405.title:0 "Dolar 16,42 Lirayi Gördü"
 Turkey.405.desc:0 "Kurlardaki yükseliş sürerken dolar ve avro güne yeni rekorlarla başladı. Dolar/TL 17'yi aşarak tüm zamanların en yüksek seviyesine ulaştı. Dolar 17 lirayı aşınca Merkez Bankası piyasaya müdahale etti, ancak 16,20'ye kadar gerileyen kısa süreli düşüşün ardından dolar yeniden 16,82'nin üzerine yerleşti."
 Turkey.405.a:0 "Merkez Bankası'nın Müdahaleleri İşe Yaramıyor Gibi"
 Turkey.406.title:0 "Üç Liderin Açiklamasi"
 Turkey.406.desc:0 "Üç partinin liderlerinden PKK açıklaması geldi. Açıklama kısaca şöyle: "PKK nerede görülürse ezilmelidir.""
 Turkey.406.a:0 "Millî Birlik İçin İyi Haber"
 Turkey.407.title:0 "Sosyal Demokrasinin Mücevheri"
 Turkey.407.desc:0 "CHP'nin sosyal demokrasisi işliyor. Etkileri sosyoekonomik açıdan olumlu. Sosyal demokrasimizin ileride bize çelme takmamasını umuyoruz, ama şu an çok iyi gidiyoruz. Yaşasın Büyük Yükseliş!"
 Turkey.407.a:0 "Yaşasın!"
 Turkey.408.title:0 "CHP Hükümeti Türkiye'sinin Ekonomik Atilimi"
 Turkey.408.desc:0 "CHP hükümeti sayesinde ekonomik atılımlarımız büyük seviyelere ulaştı. Halkımız bu durumdan çok memnun. Sosyal demokrasi işliyor. Atatürk'ün partisi kurucusunun izinden gidiyor."
 Turkey.408.a:0 "Ne Gelişme Ama!"
 Turkey.409.title:0 "Türk Lirasi Canlaniyor"
 Turkey.409.desc:0 "Türk lirası tarihî bir hafta geçiriyor. Pazartesi akşamı 18,36 ile tarihî zirveye ulaşan kur, Cumhurbaşkanı Recep Tayyip Erdoğan'ın Türk lirasını teşvik paketinin ardından adeta çakıldı.\n\nPazartesi günkü kabine toplantısı öncesinde 18 seviyesini aşarak rekor kıran dolar/TL, TL'yi teşvik edecek tedbirlerin açıklanmasıyla 10,42'ye geriledi.\n\nSalı sabahı 11,09 seviyesini test ettikten sonra yüzde 14'ten fazla düşen dolar kuru yeniden yükselerek 14 seviyesinin üzerine çıktı. Gün içinde 14,37 ile zirveyi gören dolar/TL ardından yeniden gerileyerek 10,42'nin altına indi.\n\nTürkiye'nin CDS'i 592 baz puan seviyesinde bulunurken 10 yıllık tahvil faizi yüzde 23,04 civarında.\n\nTürk lirasının 1 aylık örtük oynaklığı salı günü 62,62 ile tüm zamanların zirvesine ulaştı. Gösterge en son 13 Ağustos 2018'de 61,47 seviyesine tırmanmıştı."
 Turkey.409.a:0 "Ne Gelişme Ama!"
 Turkey.410.title:0 "Deniz Baykal Istifa Etti"
 Turkey.410.desc:0 "Gazetecilerin karşısına çıkan Deniz Baykal şunları söyledi:\n\n"Günlerdir beklenen değerlendirmemi ve kararımı açıklıyorum. Bu bir kaset meselesi değil, bir kumpastır. Kumpas hukuksuz ve ahlaksız bir tezgâhtır. Kumpas kurarken bazen bir eve girersiniz. Gizli çekimlerle insanların en korunmasız görüntülerini alır, keser, biçer, kurgular ve çarpıtırsınız. Bütün dinlerin ahlak anlayışını ve insanlığın ahlak anlayışını ayaklar altına alırsınız. İnsanların namusunu umursamazlar. Bu kumpası kuranlar sapkınlardır; bunu şantaj için değil, siyaset yapmak için yaptılar.\n\nBir kumpas üretilmiştir. Taze, iki haftalık bir kumpas. Bu kumpasın hedefi bir kişi değildir. Hedefi, CHP'nin sivil diktaya karşı neredeyse tek başına yürüttüğü mücadeledir. Son iki hafta içinde kurgulanmış ve yayınlanmıştır. Kumpas tezgâhının malzemeleri ve çekimleri günceldir, tazedir. Böylesine kaba bir kumpas tezgâhının iktidarın zirvesinin bilgisi olmadan son iki haftada hazırlanıp yayınlanması mümkün değildir. Olayın ardından yapılan sözde iyi niyetli açıklamalar, perde arkasındaki tezgâhın suçunu örtmeye yetmez. Bu, hükümetin bilgisi ve onayı olmadan yayınlanamazdı. Asıl ayıp edenler, ayıbı işleyenlerdir.\n\nAmerika Birleşik Devletleri'nden, Pennsylvania'dan gelen üzüntü mesajlarının samimiyetine de inanıyorum. 'Ayıptır' diyorlar, ama başlatanlara söyleyecek bir sözüm var: Ahlaksız ve hukuksuz kumpaslardan itibar devşirerek kendinizi savunamazsınız. Ayıptır deyip kumpasa alan açanlar asıl ayıbı işleyenlerdir. Bu kumpaslara itibar edenlerin nereye kadar gidebileceğini hep birlikte göreceğiz.\n\nBu tablo karşısında teslim olmayacağım. Kimsenin beni hesaba çekmesine izin vermeyeceğim. Bunun bir bedeli varsa ve bu bedel CHP Genel Başkanlığını bırakmaksa, o bedeli ödeyeceğim. İstifa etmem kaçmak anlamına gelmez. Tam tersine, bu bir meydan okumadır. İstifa ediyorum; çünkü buradaki hedef ben değilim, CHP'dir."\n\nParti tüzüğü uyarınca genel başkan yardımcılarından Cevdet Selvi'nin genel başkana vekâlet edeceği açıklandı.\n\nBaykal'ın istifa kararını açıklamasının ardından bazı parti üyelerinin yüksek sesle "Hayır, yapma!" dediği duyuldu.\n\nAçıklama sırasında bazı parti üyelerinin gözyaşlarını tutamadığı görüldü."
 Turkey.410.a:0 "CHP İçin Hüzünlü Anlar"
 Turkey.410.b:0 "CHP İçin Hüzünlü Anlar §Y(Konuşmasız)§!"
 Turkey.411.title:0 "Editörün Notu: 2024 Yerel Seçimleri"
 Turkey.411.desc:0 "Türkiye yüzüncü yılında yerel seçimlere giriyor. 31 Mart'ta yapılacak seçimlerde kim hak ediyorsa o kazansın. UYARI: Seçimler güncel olduğundan lütfen oyunu fazla siyasallaştırmaktan kaçının."
 Turkey.411.a:0 "Devam Edelim!"
 Turkey.411.b:0 "§R100. Yıl Marşı'nı Dinlemek İstiyorum§!"
 OLDTurkey.411.b:0 "Erdoğan Balkon Konuşmasını Yaptı"
 Turkey.412.title:0 "2022 Kapida"
 Turkey.412.desc:0 "2022 yılına göz açıp kapayıncaya kadar geldik. Hepinizin yeni yılını kutluyor, yeni yılda güçlü bir ekonomi ve sağlıklı günler diliyorum."
 Turkey.412.a:0 "Devam!"
 Turkey.413.title:0 "Kenan Yasar Anayasa Mahkemesi'ne Seçildi"
 Turkey.413.desc:0 "Türkiye Büyük Millet Meclisi Genel Kurulu'nda yapılan oylamada 302 oyla seçilen Kenan Yaşar, Anayasa Mahkemesi'nin (AYM) yeni üyesi oldu.\n\nYaş haddi nedeniyle 31 Ocak'ta emekliye ayrılacak Celal Mümtaz Akıncı'dan boşalacak üyelik için seçim TBMM Genel Kurulu'nda yapıldı. Çorum Barosu Başkanı Kenan Yaşar, Diyarbakır Barosu üyesi Zülal Erdoğan ve Erzurum Barosu Başkanı Talat Göğebakan'ın aday gösterildiği AYM üyeliği için gizli oylama yapıldı. Üç tur süren oylama sonucunda Kenan Yaşar 302 oy alarak AYM'nin yeni üyesi seçildi."
 Turkey.413.a:0 "Devam!"
 Turkey.414.title:0 "Osman Pamukoglu Siyasete Atildi"
 Turkey.414.desc:0 "Osman Pamukoğlu askerlikten ayrılarak siyasete gireceğini açıkladı. Bu açıklama siyasette panik havası yarattı. Ardından Osman Pamukoğlu'nun HEPAR adlı bir parti kurduğu öğrenildi. Yeni bir oyuncu geliyor."
 Turkey.414.a:0 "O Geliyor!"
 Turkey.415.title:0 "Osman Pamukoglu Orduda Kaldi"
 Turkey.415.desc:0 "Belirsizliği ortadan kaldırmak için Osman Pamukoğlu askerlikten ayrılmayacağını ve siyasete girmeyeceğini açıkladı. Bu açıklamayla siyasetçiler rahat bir nefes aldı. Askerî geçmişe sahip biri siyasete girmeyeceği için işler artık kolaylaşacaktı."
 Turkey.415.a:0 "Bunu Duymak Güzel"
 Turkey.416.title:0 "Osman Pamukoglu'nun Mitingleri"
 Turkey.416.desc:0 "Osman Pamukoğlu'nun mitingleri büyük ilgi gördü. Artık dengeler değişiyor. Osman Pamukoğlu'nun sandıktan çok sayıda oy çıkarması bekleniyor."
 Turkey.416.a:0 "Siyaset Sertleşiyor"
 Turkey.417.title:0 "Osman Pamukoglu'nun Zaferi"
 Turkey.417.desc:0 "Seçim kazanıldı. Osman Pamukoğlu'nun iktidara gelmesiyle terör örgütlerinin kökünün kuruyacağı bekleniyor. Yaşasın yeni iktidar! Yaşasın yeni denge!"
 Turkey.417.a:0 "İyi Haber"
 Turkey.418.title:0 "Kar Istanbul'u Esir Aldi"
 Turkey.418.desc:0 "Ülkenin büyük bölümünde etkili olan kar yağışı bugün İstanbul'u esir aldı. Akşam saatlerinde etkisini daha da artıran kar yağışı nedeniyle kentin büyük bölümünde trafik kilitlendi ve araçlar yolda kaldı. Bazı vatandaşlar araçlarını yolda bırakıp evlerine yürüyerek gitti. İstanbul'da trafik yoğunluğu yüzde 90'a çıkarken toplu taşımada da ciddi bir insan yoğunluğu yaşanıyor. Uyarılara rağmen megakentte önlem alınmadı; bazı metrobüs ve otobüs seferleri aksadı, vatandaşlar evlerine dönerken büyük zorluk yaşadı. Öte yandan evine gidemeyip dışarıda mahsur kalan vatandaşlar hâlâ var."
 Turkey.418.a:0 "Lanet Olsun!"
 Turkey.419.title:0 "Rahsan Affi"
 Turkey.419.desc:0 "Asıl adı Şartla Salıverilme ile Dava ve Cezaların Ertelenmesine Dair Kanun olan yasa, Rahşan Ecevit'in önerisiyle 22 Aralık 2000'de kabul edildi ve devlete karşı işlenen suçlar dışındaki suçlar için erteleme ya da şartla salıverme getirdi.\n\nÖlüm orucu eylemlerini sona erdirmek için 19 Aralık 2000'de başlatılan Hayata Dönüş Operasyonu'ndan 3 gün sonra 4616 sayılı "Şartla Salıverilme ve Erteleme Kanunu" çıkarıldı (22 Aralık). Cezaevlerinde yer kalmadığı için çıkarılan af yasasının ardından 70 bin kişilik kapasiteye sahip cezaevlerinin nüfusu 40 bine düştü."
 Turkey.419.a:0 "Affın Kapsamı Yeterli"
 Turkey.419.b:0 "Afta Küçük Değişiklikler Yapın"
 Turkey.419.c:0 "Affı Doğrudan Genişletin"
 Turkey.4190.title:0 "Rahsan Affi"
 Turkey.4190.desc:0 "Asıl adı Şartla Salıverilme ile Dava ve Cezaların Ertelenmesine Dair Kanun olan yasa, Rahşan Ecevit'in önerisiyle 22 Aralık 2000'de kabul edildi ve devlete karşı işlenen suçlar dışındaki suçlar için erteleme ya da şartla salıverme getirdi.\n\nÖlüm orucu eylemlerini sona erdirmek için 19 Aralık 2000'de başlatılan Hayata Dönüş Operasyonu'ndan 3 gün sonra 4616 sayılı "Şartla Salıverilme ve Erteleme Kanunu" çıkarıldı (22 Aralık). Cezaevlerinde yer kalmadığı için çıkarılan af yasasının ardından 70 bin kişilik kapasiteye sahip cezaevlerinin nüfusu 40 bine düştü."
 Turkey.4190.a:0 "Affın Kapsamı Yeterli"
 Turkey.420.title:0 "Atatürk Heykeline Yapilan Saldiriya Halkin Tepkisi"
 Turkey.420.desc:0 "Samsun'daki Atatürk heykeline yapılan saldırının ardından akşam saatlerinde heykelin çevresinde bir kalabalık toplandı."
 Turkey.420.a:0 "Kemalistler Sokaklarda!"
 Turkey.421.title:0 "Recep Tayyip Erdogan Partisine Döndü"
 Turkey.421.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan, kurucusu olduğu AK Parti'ye yeniden üye oldu. 16 Nisan'da kabul edilen referandumun birçok maddesi Kasım 2019'daki seçimle birlikte yürürlüğe girecek. Ancak cumhurbaşkanının partisiyle ilişiğine ilişkin değişiklik hemen yürürlüğe girdi ve bu da Cumhurbaşkanı Recep Tayyip Erdoğan'ın kurucusu olduğu AK Parti'ye üye olmasının önünü açtı.\n\nErdoğan'ın 21 Mayıs'ta yapılacak kongrede yeniden genel başkan seçilmesi de bekleniyor.\n\nErdoğan, AK Parti Genel Merkezi'nde düzenlenen törenle üyelik formunu sembolik olarak imzaladı. Bazı parti üyelerinin ve Erdoğan'ın gözyaşları dikkat çekti.\n\nErdoğan törende şunları söyledi: "27 Ağustos 2014'te milletimiz tarafından cumhurbaşkanlığına seçilmem nedeniyle anayasa gereği ayrılmak zorunda kaldığım, kurucusu olduğum evime, aşkıma, sevdama, davama, partime dönüyorum. Tam 979 gün sonra bu hasret hamdolsun sona eriyor.""
 Turkey.421.a:0 "AKP İçin En İyisi O!"
 Turkey.422.title:0 "Alti Muhalefet Lideri Birlesti"
 Turkey.422.desc:0 "Altı muhalefet lideri bir araya geldi. Amaçları yeni bir anayasa teklifi hazırlamak. Muhalefetin kararıyla ortaya çıkacak anayasa teklifinden pek hoşlanacağımız söylenemez."
 Turkey.422.a:0 "Ne Korkunç Bir An!"
 Turkey.423.title:0 "28 Subat Mutabakat Metni"
 Turkey.423.desc:0 "Muhalefetin ortak açıklamasıyla 28 Şubat Mutabakat Metni ilan edildi. Bu metinle parlamenter sistemi savunanlar, hükümetimize karşı muhalefet içindeki güçlerini artıracak."
 Turkey.423.a:0 "Muhalefet Güçleniyor"
 Turkey.424.title:0 "AKP Delegeleri Reform Istiyor"
 Turkey.424.desc:0 "AK Parti delegeleri partimize reform çağrısında bulunuyor. Bu reformla partimizi değiştirip modernleştirerek ve ilkelerimize uygun hareket ederek daha fazla oy alma potansiyeline sahibiz. Öte yandan reforma gidersek modernleşme, Erdoğan'ı kaybetmek gibi değer verdiğimiz şeylere zarar verebilir."
 Turkey.424.a:0 "Reform Planını Kabul Et"
 Turkey.424.b:0 "AKP Erdoğan'la Devam Ediyor!"
 Turkey.425.title:0 "Bayraktar Kizilelma MIUS Halka Tanitildi"
 Turkey.425.desc:0 "Bayraktar Kızılelma Türk halkına tanıtıldı. Türk savunma şirketi Baykar tarafından geliştirilen uçak, jet motorlu, tek motorlu, düşük görünürlüklü, süpersonik ve uçak gemisinden kalkabilen insansız bir savaş uçağıdır."
 Turkey.425.a:0 "Teknoloji Yarışına Girdik"
 Turkey.426.title:0 "Antalya Diplomasi Forumu'nda Baris Görüsmeleri"
 Turkey.426.desc:0 "Dışişleri Bakanları Sergey Lavrov ve Dmitro Kuleba, işgalin başlamasından bu yana iki taraf arasındaki ilk üst düzey temasta Türkiye Dışişleri Bakanı Mevlüt Çavuşoğlu'nun arabuluculuğunda Antalya'da bir araya geldi. Ukrayna, başta Mariupol olmak üzere sivillere yardım ulaştırmak ve tahliye için 24 saatlik bir ateşkes sağlamaya çalıştı. İki saatlik görüşmelerin ardından anlaşmaya varılamadı. Liman kentine yönelik hava saldırıları sürdü."
 Turkey.426.a:0 "Barış Yok, Ama Bizim İçin Siyasi Bir Zafer"
 Turkey.427.title:0 "Furkan Vakfi'na Polis Saldirisi"
 Turkey.427.desc:0 "Alparslan Kuytul'un başkanlığını yaptığı Furkan Vakfı üyeleri, gözaltına alınan 8 gönüllü için Adana Seyhan'daki Cevat Yurdakul Caddesi'nde eylem yapmak istedi.\n\nAralarında Alparslan Kuytul'un da bulunduğu gruba polis müdahale etti; Kuytul yere yatırıldı. Furkan Vakfı'nın paylaştığı görüntülere göre polis eylemcilere biber gazı ve plastik mermiyle müdahale etti, coplarla vurdu.\n\nFurkan Vakfı'nın resmî Twitter hesabından yapılan paylaşımda, "Güvenliğe hukuksuz talimat veren bakan istemiyoruz! Soylu'nun talimatıyla maskeli polisler Furkan Hareketi üyelerine cop yağdırdı!" denildi."
 Turkey.427.a:0 "Polis Müdahalede Haklı!"
 Turkey.428.title:0 "Montrö Açiklamasi"
 Turkey.428.desc:0 "Çavuşoğlu, Montrö Sözleşmesi'nin Karadeniz'e kıyısı olan ve olmayan ülkelerin savaş gemilerinin Boğazlar'dan geçişi ve Karadeniz'de kalışlarının süresi ve sınırına ilişkin düzenlemeleri açıkça içerdiğini belirtti.\n\nTürkiye'nin bugüne kadar Montrö Boğazlar Sözleşmesi'ni eksiksiz uyguladığını anlatan Çavuşoğlu, "Bu şartlarda elbette Montrö Sözleşmesi'ni uygulayacağız. Türkiye'nin taraf olmadığı bir savaşta Türkiye, savaşan ülkelerin gemilerinin geçişine Boğazlar'ı kapatabilir. Montrö Sözleşmesi'nin 19. maddesi bu konuda gayet açık" dedi.\n\nSon gelişmelerin "savaş, çatışma ya da operasyon" olarak mı nitelendirilmesi gerektiği sorusuna Çavuşoğlu şu yanıtı verdi:\n\n"Başlangıçta Rusya'nın bir saldırısı vardı. Ama bunu uzmanlarımızla, askerlerimizle, hukukçularımızla değerlendirdik. Şu an özellikle pek çok şehirde bunun artık bir savaşa dönüştüğü açıkça görülüyor. Yani sokaktaki çatışmalar taraflar arasında bir savaşa dönüştü. Nitekim bu konuda bir kanaate vardık. Şu anda devletler arasında ciddi bir çatışma var. Bu bir askerî operasyon değil, geçici bir iki hava saldırısı değil; şu an ülkede resmen bir savaş hâli var."\n\nSürecin şeffaf olması gerektiğini vurgulayan Çavuşoğlu, Karadeniz'deki üslerine gidecek bazı Rus gemilerinin şu anda Akdeniz'de bulunduğuna dikkat çekti.\n\nÇavuşoğlu, Montrö Sözleşmesi'nin 19. maddesinin savaşan ülkelerin gemilerinin geçişine bir istisna tanıdığını da belirterek şöyle konuştu: "Bu istisna nedir? Savaş gemisi savaşa taraf olan ülkedeki üssüne, bağlı olduğu limana dönecekse bu geçiş engellenemez. Burada genel hükme bir istisna getiriliyor." \n\nÇavuşoğlu, "Tabii burada da bir suistimal olmamalı. Yani 'Üssüme gidiyorum, gemimi limana bağlayacağım' deyip Boğaz'dan geçtikten sonra savaşa katılmamalı. Montrö'nün tüm hükümlerini bu şekilde, şeffaf bir şekilde uygulayacağız" ifadesini kullandı."
 Turkey.428.a:0 "Karadeniz'de Barış Korunmalı"
 Turkey.429.title:0 "Istanbul'da Baris Görüsmeleri"
 Turkey.429.desc:0 "Salı günü Ukraynalı ve Rus müzakereciler iki haftayı aşkın bir sürenin ardından ilk kez yüz yüze geldi. Boğaz kıyısındaki 19. yüzyıldan kalma bir Osmanlı sarayında, beyaz örtülü uzun bir masada oturan heyetleri Cumhurbaşkanı Recep Tayyip Erdoğan bizzat karşıladı ve onları İngilizce "good morning" diyerek selamladı."
 Turkey.429.a:0 "Barış Yok, Ama Bizim İçin İkinci Bir Siyasi Zafer"
 Turkey.430.title:0 "ABD F-16 Satmaya Hazirlaniyor"
 Turkey.430.desc:0 "ABD Dışişleri Bakanlığı Kongre'ye gönderdiği mektupta, Biden yönetiminin Türkiye'ye olası F-16 savaş uçağı satışının ABD'nin ulusal güvenlik çıkarlarıyla uyumlu olacağına ve aynı zamanda NATO'nun uzun vadeli birliğine hizmet edeceğine inandığını belirtti."
 Turkey.430.a:0 "Umarız Satarlar"
 Turkey.431.title:0 "Istanbul Bogazi'nda Mayin Tespit Edildi"
 Turkey.431.desc:0 "Dün Sarıyer açıklarında balıkçıların fark ettiği bir mayın alarma neden oldu. Boğaz 5 saat boyunca gemi trafiğine kapatıldı ve SAT komandoları mayını etkisiz hâle getirdi. Bakan Akar, mayının eski tip olduğunu açıkladı."
 Turkey.431.a:0 "Etkisiz Hâle Getirildi, Yolumuza Devam Edebiliriz"
 Turkey.432.title:0 "ESK Et Fiyatlarina Dev Zam Yapti"
 Turkey.432.desc:0 "Et ve Süt Kurumu (ESK) kırmızı ete yüzde 48 zam yaptı. Bu da insanların ekonominin şu an tamamen işe yaramaz durumda olduğunu düşünmesine yol açtı."
 Turkey.432.a:0 "Hiç İyi Bir Haber Değil"
 Turkey.433.title:0 "Zafer Partisi'nin Kurulusu"
 Turkey.433.desc:0 "Zafer Partisi'nin kuruluşu için gerekli belgeleri teslim ettikten sonra onaylanan evrakı almak üzere beraberindeki heyetle İçişleri Bakanlığı'na gelen Özdağ, burada basın mensuplarına açıklama yaptı.\n\n"'İlim, birlik, barış' diyerek Türkiye'yi dolaşmaya devam edeceğiz. Bugün, 26 Ağustos, Anadolu'ya gelişimizin 950. yılı ve Büyük Taarruz'un 99. yıl dönümü; kendi partimizi kuruyoruz. Türkiye'ye, yüce Türk milletine ve Türk dünyasına hayırlı olsun.""
 Turkey.433.a:0 "İlginç"
 Turkey.434.title:0 "Kiliçdaroglu SADAT'a Yüklendi"
 Turkey.434.desc:0 "CHP Genel Başkanı Kemal Kılıçdaroğlu sürpriz bir şekilde SADAT'ın önüne gitti. Kılıçdaroğlu'na çok sayıda CHP milletvekili de eşlik etti.\n\nBurada açıklama yapan CHP lideri, "Karşı karşıya olduğumuz SADAT paramiliter bir örgüttür... Bu, terörist yetiştiren bir kurumdur" dedi. Seçim güvenliğinin önemine vurgu yapan Kılıçdaroğlu, "Seçime gölge düşürecek, seçimin güvenliğini zedeleyecek herhangi bir şey olursa bunun sorumlusu burası ve Saray'dır" dedi."
 Turkey.434.a:0 "Korkunç Bir Hamle"
 Turkey.435.title:0 "Zafer Partisi Lideri Içisleri Bakanina Düello Teklif Etti"
 Turkey.435.desc:0 "Kendisi için "Hayvandan aşağıdır. Soros çocuğudur" diyen İçişleri Bakanı Süleyman Soylu'ya meydan okuyan Zafer Partisi Genel Başkanı Ümit Özdağ, dün İçişleri Bakanlığı'na gitti. Burada güvenlik güçleri tarafından durdurulan Özdağ, sosyal medya hesabından dikkat çekici paylaşımlar yapmaya devam ediyor. Bakan Soylu'ya bir kez daha meydan okuyan Özdağ, "Yer belirle. Ne zaman istersen, nerede istersen" dedi."
 Turkey.435.a:0 "Ne!"
 Turkey.436.title:0 "Finlandiya ve Isveç NATO'ya Katilmak Istiyor"
 Turkey.436.desc:0 "NATO'nun 5. maddesinin oluşturduğu güvenlik şemsiyesinden yararlanmak isteyen ilk ülke, Rusya ile 1.300 kilometrelik sınırı olan Finlandiya oldu.\n\nİsveç kamuoyu da Finlandiyalı komşularını izleyerek ülkenin 200 yıllık tarafsızlık politikasına son verdi.\n\nİki ülkenin NATO üyeliği başvurusu, ittifaka yönelik önceki tarafsızlık politikalarında da köklü bir değişim anlamına geliyor. Bu nedenle atılan adımlar tarihî olarak değerlendiriliyor."
 Turkey.436.a:0 "Veto Hakkını Kullanma Vakti"
 Turkey.436.b:0 "Girsinler!"
 Turkey.437.title:0 "Türkiye NATO'da Pazarlik Yapiyor"
 Turkey.437.desc:0 "Türkiye, İsveç ve Finlandiya'nın üçü de PKK'yı terör örgütü olarak tanıyor. Ancak Erdoğan, iki İskandinav ülkesini PKK militanlarını barındırmak ve desteklemekle suçladı; bu ülkeler ise suçlamayı reddediyor. Yine de özellikle İsveç, Türk hükümetinin PKK'dan ayırt etmediği Suriye'deki başka Kürt gruplarını destekliyor ve onlara yardım gönderiyor.\n\nErdoğan için bu konuda daha iyi bir işbirliğinin güvence altına alınması ve Türkiye'nin güvenlik ihtiyaçlarına saygı gösterilmesi bir numaralı öncelikti.\n\nCumhurbaşkanlığından yapılan açıklamada, Türkiye'nin salı gecesi İsveç ve Finlandiya ile imzalanan anlaşmadan "istediğini aldığı" belirtildi. Bu, ABD dahil Batılı ülkelerin IŞİD'e karşı mücadelede desteklediği, PKK'nın Suriye'deki uzantısı YPG de dahil olmak üzere "PKK ve bağlantılı yapılarla mücadelede Türkiye ile tam işbirliği" anlamına geliyordu.\n\nAçıklamaya göre Stockholm ve Helsinki ayrıca Türkiye'ye "savunma sanayii alanında ambargo kısıtlamaları uygulamama" ve "terörist suçluların iadesi konusunda somut adımlar atma" sözü verdi."
 Turkey.437.a:0 "Harika Olur!"
 Turkey.438.title:0 "Çesme Ormani Yaniyor"
 Turkey.438.desc:0 "İzmir'in Çeşme ilçesinde otluk bir alanda yangın çıktı. Çeşme Belediye Başkanı Ekrem Oran, "Ildır merkez yanıyor. Bütün özel su tankeri sahiplerine sesleniyorum. Su tankerlerini doldurup yardıma gelin" dedi. Yangın ekiplerin müdahalesiyle kontrol altına alındı."
 Turkey.438.a:0 "Berbat"
 Turkey.439.title:0 "Tahil Koridoru Görüsmeleri"
 Turkey.439.desc:0 "Dört gün sürmesi planlanan toplantının ilk günü, Rusya'nın Ukrayna'yı işgali ve daha önce Ukrayna buğdayının ihracatında kullanılan Karadeniz limanlarını ele geçirmesinin gölgesinde geçti.\n\nToplantı, Rusya'nın Ukrayna işgalinin beşinci ayına girdiği ve Karadeniz'deki limanlarının ele geçirilmesinin Afrika ve Orta Doğu'daki insanlar arasında açlık endişelerini artırdığı bir dönemde yapıldı.\n\nUkrayna buğdayın yanı sıra arpa, mısır ve ayçiçeği tohumu gibi ürünlerin de büyük ihracatçılarından biri. Kiev, şu anda limanlarında 25 milyon tona kadar tahılın bekletildiğini tahmin ediyor.\n\nMüzakereciler, Ukrayna'daki yaklaşan hasat öncesinde siloları boşaltacak bir çözüm bulmayı umuyor. Şu anda bir miktar tahıl Avrupa üzerinden demir yolu, kara yolu ve nehir yoluyla taşınıyor, ancak bu miktar deniz yoluyla ihraç edilebilecek olanla kıyaslandığında çok az."
 Turkey.439.a:0 "Bakalım Nasıl Gidecek"
 Turkey.440.title:0 "Türk Sanayisi 150'ye Ulasti"
 Turkey.440.desc:0 "Türk sanayisi 150 bandını aştı. Sanayimiz artık mükemmel bir kabiliyete ulaştı ve her zamankinden daha hızlı gelişecek bir seviyeye geldi."
 Turkey.440.a:0 "Ne Büyük Başarı!"
 Turkey.440.b:0 "Ne Büyük Başarı! §Y(Konuşmasız)§!"
 Turkey.441.title:0 "Türk Uçaklari Gelistirildi"
 Turkey.441.desc:0 "Türk uçakları geliştirildi. Bu yerli uçaklar sayesinde daha güvenilir, daha güçlü ve daha kolay üretilen uçaklara sahip olacağız. Artık gökyüzüne hükmedebiliriz!"
 Turkey.441.a:0 "Motorlar Gayet İyi Çalışıyor"
 Turkey.441.b:0 "Motorlar Gayet İyi Çalışıyor §Y(Sessiz)§!"
 Turkey.442.title:0 "Turkey Adini Türkiye Olarak Degistirdi"
 Turkey.442.desc:0 "Uluslararası arenada "Turkey" yerine "Türkiye" adının kullanılması için atılan adımlar hedefine ulaştı. Birleşmiş Milletler, Ankara'nın talebi üzerine yabancı dillerde "Turkey" adını "Türkiye" olarak değiştirdi."
 Turkey.442.a:0 "Yaşasın!"
 Turkey.443.title:0 "Türk-Yunan Deniz Siniri Krizi"
 Turkey.443.desc:0 "Yunanistan Başbakanı Kiryakos Miçotakis'in geçen ay ABD Kongresi'nde yaptığı konuşmanın ardından Türkiye ile Yunanistan arasındaki köklü gerginlik yeniden alevleniyor. Her iki ülke de aynı anda şiddetli enflasyonla birlikte ekonomik bir durgunlukla karşı karşıyayken ve 2023'teki seçimlere yaklaşırken uzmanlar, aralarındaki gerginliğin giderek iç politika amaçlı kullanıldığını söylüyor.\n\nYunanca birkaç tweet atan Cumhurbaşkanı Recep Tayyip Erdoğan, Yunanları Ege'deki tutumları konusunda aklıselim olmaya, aksi takdirde "pişman olacaklarını" söyleyerek doğrudan tehdit etti.\n\nErdoğan kısa süre önce Miçotakis'i Türkiye'ye F-16 satışını engellemeye çalışmakla suçlayarak onun kendisi için "artık yok" hükmünde olduğunu söyledi. Ayrıca "Türkiye ile dans etmeye kalkmayın. Yorulursunuz, yolda kalırsınız" diye uyardı.\n\nBuna karşılık Yunan hükümeti "öngörülemez" bir komşuya karşı ulusal birlik çağrısı yaparken eski Başbakan Aleksis Çipras Erdoğan'a Türkçe yanıt verdi: "Yunanistan egemenliğini tüm tehditlere karşı koruyacaktır. O yüzden provokasyonlara son verelim ve uluslararası hukuk temelinde diyaloğa geri dönelim. Hepimizin karşı karşıya olduğu ekonomik krize çare aşırı milliyetçilik değildir.""
 Turkey.443.a:0 "Bu Ne Zaman Bitecek?"
 Turkey.444.title:0 "Türk Disisleri Bakani Israil'i Ziyaret Etti"
 Turkey.444.desc:0 "Türkiye'den İsrail'e dışişleri bakanı düzeyindeki ilk ziyaret 15 yıl aradan sonra gerçekleşti. Mevkidaşı Yair Lapid ile bölgesel konularda görüş alışverişinde bulunduğunu belirten Çavuşoğlu, "Kalıcı barış için tek yolun iki devletli çözüm olduğuna inanıyoruz" dedi."
 Turkey.444.a:0 "Eski Müttefikler Yeniden Bir Arada"
 Turkey.445.title:0 "Gazprom TürkAkim Projesini Tamamladi"
 Turkey.445.desc:0 "Rus enerji şirketi Gazprom'un daha önce TürkAkım projesinin deniz bölümü için boru hattı inşaatına başladığı bildirilmişti. Gazprom yaptığı açıklamada, TürkAkım projesinde Karadeniz'den geçecek boru hattının inşaatına belirlenen takvime uygun olarak başlandığını duyurmuştu.\n\nAçıklamada inşaatın Allseas şirketine ait Audacia gemisiyle yürütüldüğü, Karadeniz'in daha derin kısımlarındaki boru hattı inşaatının ise Pioneering Spirit gemisiyle yapılacağı belirtilmişti.\n\nHükümetlerarası anlaşma iki yıl önce ekim ayında İstanbul'da imzalanmıştı. TürkAkım projesi kapsamında her biri yıllık 15,75 milyar metreküp kapasiteli iki boru hattı inşa edilmesi planlanıyor. İlk hattın Türkiye'ye, ikinci hattın ise gerekli güvenceler sağlanması hâlinde Avrupa'ya doğal gaz taşıması öngörülüyor."
 Turkey.445.a:0 "Bunu Duymak Güzel"
 Turkey.446.title:0 "Mesut Yilmaz Darbedildi"
 Turkey.446.desc:0 "Mesut Yılmaz'ın yıllar önce Budapeşte'de darbedildiği fotoğraflar sonradan medyada görünmeye başladı. Bu fotoğraflar ülkenin itibarını derinden sarsıyor."
 Turkey.446.a:0 "Of"
 Turkey.447.title:0 "ANAP'in Yükselisi"
 Turkey.447.desc:0 "Seçimlerde büyük kazanımlar elde eden Anavatan Partisi (ANAP) iktidarın zirvesine yükseldi. Bu hiç beklenmedik bir geçiş. Tüm ülkemiz için hayırlı olmasını umuyoruz."
 Turkey.447.a:0 "Doğru Görünüyor"
 Turkey.448.title:0 "KPSS Krizi"
 Turkey.448.desc:0 "Kamu Personeli Seçme Sınavı'nda (KPSS) soruların sızdırıldığı iddialarına ilişkin soruşturma başlatılmasının ardından ÖSYM Başkanı görevden alındı. Prof. Dr. Halis Aygün'ün yerine atanan ÖSYM Başkanı Prof. Dr. Bayram Ali Ersoy dün bir açıklama yaparak tüm oturumların iptal edildiğini duyurdu. Ersoy, sınavda adaylara sorulan soruların bir kısmının bir yayınevinin soru kitapçıklarında yer aldığının tespit edildiğini belirtti."
 Turkey.448.a:0 "Tam Bir Felaket!"
 Turkey.449.title:0 "Yeni Bir Medya Yasasi Açiklandi"
 Turkey.449.desc:0 "Basın Kanunu ile Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanun Resmî Gazete'de yayımlandı. Sosyal medyada yanıltıcı bilgi yayılmasını önleyecek düzenleme Resmî Gazete'de yayımlanarak yürürlüğe girdi."
 Turkey.449.a:0 "Güzel"
 Turkey.450.title:0 "CHP Medya Yasasinin Iptali Için Dilekçe Verdi"
 Turkey.450.desc:0 "CHP, dezenformasyon düzenlemesi olarak bilinen Basın Kanunu ile Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanun'un Resmî Gazete'de yayımlanmasının ardından harekete geçti.\n\nCHP Grup Başkanvekili Engin Altay, "halkı yanıltıcı bilgiyi alenen yayma" suçunu işleyenlere 1 ila 3 yıl hapis cezası öngören Basın Kanunu ile Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanun'un 29. maddesinin iptali ve yürürlüğünün durdurulması için hazırlanan dilekçeyi teslim etti. Engin Altay, Anayasa Mahkemesi önünde açıklama yaptı.\n\nAnayasa Mahkemesi'ne sunulan dilekçede, "13/10/2022 tarihli ve 7418 sayılı Basın Kanunu ile Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanun'un 29. maddesiyle 26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanunu'na eklenen 217/A maddesi Anayasa'nın 2., 13., 25., 26., 28., 38. ve 153. maddelerine aykırı olduğundan iptaline ve uygulanması hâlinde giderilmesi güç veya imkânsız zarar ve durumlar doğuracağından iptal davası sonuçlanıncaya kadar yürürlüğünün durdurulmasına karar verilmesi gerekmektedir" denildi."
 Turkey.450.a:0 "Nasıl Cüret Ederler?"
 Turkey.453.title:0 "Istanbul Istiklal Caddesi'nde Bombali Saldiri"
 Turkey.453.desc:0 "Pazar günü İstanbul'un merkezindeki işlek bir yaya caddesini sarsan ve Cumhurbaşkanı Tayyip Erdoğan'ın "terör kokan" bombalı bir saldırı olarak nitelendirdiği patlamada altı kişi hayatını kaybetti, 81 kişi yaralandı. Patlamanın ardından ambulanslar ve polis bölgeye koşarken yüzlerce kişi tarihî İstiklal Caddesi'nden kaçtı. Türkiye'nin en büyük şehrinin Beyoğlu ilçesindeki bölge, hafta sonu olması nedeniyle her zamanki gibi alışveriş yapanlar, turistler ve ailelerle doluydu."
 Turkey.453.a:0 "Eyvah..."
 Turkey.454.title:0 "Sinan Ates Suikasti"
 Turkey.454.desc:0 "Ülkü Ocakları Eğitim ve Kültür Vakfı eski Genel Başkanı ve Hacettepe Üniversitesi öğretim üyesi Doç. Dr. Sinan Ateş ile yanındaki arkadaşı Selman Bozkurt, geçen cuma Ankara'nın Çankaya ilçesine bağlı Kızılırmak Mahallesi 1456. Cadde'deki camiden çıkışta motosikletli bir kişinin saldırısına uğradı. Başından vurulan Doç. Dr. Ateş olay yerinde hayatını kaybederken arkadaşı Bozkurt omzundan yaralandı. Olayla ilgili saldırganla birlikte 3 kişi gözaltına alındı. Doç. Dr. Sinan Ateş, Bursa Ulu Camii'nde yaklaşık 10 bin kişinin katıldığı cenaze namazının ardından Emir Sultan Mezarlığı'nda toprağa verildi."
 Turkey.454.a:0 "İyi Değil"
 Turkey.455.title:0 "Özgür Özel Içisleri Bakanina Yüklendi"
 Turkey.455.desc:0 "İçişleri Bakanı Süleyman Soylu ile ilgili olduğunu iddia ettiği dosyayı "başına bir şey gelirse" diye üç kişiye daha verdiğini belirten CHP Grup Başkanvekili Özgür Özel, elindeki belgeleri canlı yayında açıkladı."
 Turkey.455.a:0 "Ne Saçmalıyorlar?"
 Turkey.456.title:0 "Devlet Bahçeli Dikkat Çekti"
 Turkey.456.desc:0 "MHP Genel Başkanı Devlet Bahçeli, grup toplantısının ardından Meclis koridorundan geçerken gazetecilerin yoğun ilgisiyle karşılaştı.\n\nAmerika'nın Sesi radyosunun Ankara muhabiri Yıldız Yazıcıoğlu, Bahçeli'ye mikrofon uzatarak "Meclis'te karar alınmazsa Erdoğan'ın üçüncü kez aday olamayacağı tartışılıyor... Merak ediyorum, sizin görüşünüz nedir?" diye sordu. Bahçeli, Yazıcıoğlu'na "Beni dinlemediğiniz anlaşılıyor" yanıtını verdi.\n\nMHP Genel Başkan Yardımcısı Muhammed Levent Bülbül'ün gözleri, gazetecinin ağzından dökülen "Sinan Ateş" ifadesini duyunca fal taşı gibi açıldı.\n\nMuhabir, alandan uzaklaşmak isteyen Bahçeli'ye bu kez "Sinan Ateş cinayetinde MHP'ye yönelik suçlamalar..." diye başlayan bir soru yöneltti. Bu soruya sinirlenen MHP Genel Başkanı, "Sen işine bak, hadi" dedi."
 Turkey.456.a:0 "Bu Konuda Ne Yapabiliriz?"
 Turkey.457.title:0 "Rasmus Paludan Türk Büyükelçiligi Önünde Kur'an Yakti"
 Turkey.457.desc:0 "Aşırı sağcı Stram Kurs partisinin kurucusu Rasmus Paludan, dün İsveç polisinin bugün yapılacak eyleme izin verdiğini vurgulamış ve sosyal medya hesaplarından herkesi eyleme davet etmişti. Paludan saat 15.00'te Stockholm'deki Türk Büyükelçiliği önündeki bir alanda, İsveç polisinin aldığı güvenlik önlemleri arasında elinde bir çakmakla uzun bir konuşma yaptı.\n\nPaludan ardından Kur'an-ı Kerim'i yaktı ve elindeki yanan Kur'an-ı Kerim'le konuşmasını sürdürdü. Eylem sırasında İsveç polisinin Paludan'a müdahale etmediği görüldü.\n\nAşırı sağcı görüşleriyle bilinen Danimarka-İsveç vatandaşı Rasmus Paludan, Danimarka ve İsveç'te faaliyet gösteren Stram Kurs adlı aşırı sağcı siyasi partinin kurucusu olarak biliniyor. Paludan daha önce 2020'de Danimarka'da ırkçılık dahil çeşitli suçlardan bir ay hapis cezasına çarptırılmıştı.\n\nPaludan daha önce de Kur'an yakma eylemi düzenlemiş, en son geçen yıl Müslümanların yoğun olarak yaşadığı bir mahallede Kur'an yakmıştı."
 Turkey.457.a:0 "Nasıl Cüret Ederler?"
 Turkey.458.title:0 "Türkiye Üçlü Mekanizma Toplantilarini Süresiz Askiya Aldi"
 Turkey.458.desc:0 "Ankara'nın talebi üzerine Türkiye, İsveç ve Finlandiya arasındaki üçlü mekanizma toplantısı süresiz olarak ertelendi. Bir sonraki toplantının şubat ayında Brüksel'de yapılması planlanıyordu. \n\nCumhurbaşkanı Tayyip Erdoğan dün, "İsveç Müslümanların dinî inancına saygı gösteremiyorsa NATO konusunda bizden hiçbir destek göremez" dedi."
 Turkey.458.a:0 "Elveda NATO!"
 Turkey.459.title:0 ""Altili Masa"nin Kurulusu"
 Turkey.459.desc:0 "Altılı Masa, CHP, İYİ Parti, Saadet Partisi, Demokrat Parti, DEVA Partisi ve Gelecek Partisi tarafından 12 Şubat 2022'deki ilk toplantısıyla siyasi bir oluşum olarak kuruldu. İYİ Parti Genel Sekreteri Uğur Poyraz, Millet İttifakı'nın seçim sürecine yönelik bir ittifak olduğunu, Altılı Masa'nın ise seçim süreci geride kalsa da süren bir çalışma birlikteliği hâline geldiğini açıkladı."
 Turkey.459.a:0 "Muhalefet Birleşti"
 Turkey.460.title:0 "Çesitli Konsolosluklardan Uyarilar"
 Turkey.460.desc:0 "ABD Büyükelçiliği'nin 27 Ocak'ta yayımladığı güvenlik uyarısının ardından önde gelen Avrupa ülkeleri de benzer açıklamalar yaptı ve başta Taksim çevresindekiler olmak üzere İstanbul'daki konsolosluklarını geçici olarak kapatma kararı aldı. Güvenlik uyarısı, yabancı temsilcilikleri, kiliseleri, sinagogları ve turistik noktaları hedef alabilecek bir terör eylemine ilişkin "ciddi ve spesifik" istihbarata dayanıyordu ve açıklamalar Türk makamlarıyla işbirliği içinde yapıldı."
 Turkey.460.a:0 "Ne Planlıyorlar?"
 Turkey.461.title:0 ""Altili Masa"nin Ortak Politikalar Mutabakat Metni Yayimlandi"
 Turkey.461.desc:0 "CHP, İYİ Parti, DEVA Partisi, Gelecek Partisi, Saadet Partisi ve Demokrat Parti'den oluşan "Altılı Masa", seçim vaatlerinden oluşan Ortak Politikalar Mutabakat Metni'ni yayımladı. Mutabakat metni 9 başlık altında 2 binden fazla düzenleme içerirken seçim barajı, cumhurbaşkanlığı görev süresi ve Atatürk Havalimanı dikkat çeken vaatler arasında yer aldı.\n\nMillet İttifakı Ortak Politikalar Mutabakat Metni, altı siyasi parti genel başkanının katıldığı toplantıda açıklandı. Altı partinin genel başkan yardımcılarının sunduğu metin "Hukuk, Adalet ve Yargı", "Kamu Yönetimi", "Yolsuzlukla Mücadele, Şeffaflık ve Denetim", "Ekonomi, Finans ve İstihdam", "Bilim, Ar-Ge, İnovasyon, Girişimcilik ve Dijital Dönüşüm", "Sektörel Politikalar", "Eğitim", "Sosyal Politika" ile "Dış Politika, Savunma, Güvenlik ve Göç Politikası" adlı 9 ana başlıktan oluşuyor.\n\nÖne Çıkan Seçim Vaatleri\n\n2 binden fazla düzenleme içeren Ortak Politikalar Mutabakat Metni'nde yer alan ve sosyal medyada en çok konuşulan 12 başlık şöyle:\n\n1) Cumhurbaşkanlığına tahsis edilen konutlar ve saraylar halka açılacak. Cumhurbaşkanlığına ait bazı uçaklar satılacak.\n2) Seçim barajı yüzde 3'e düşürülecek.\n3) Yolsuzluktan elde edilip yurt dışına kaçırılan gelirler ülkeye getirilecek, bu çerçevede Varlık Geri Kazanım Ofisi kurulacak.\n4) Türkiye Varlık Fonu kapatılacak.\n5) Kanal İstanbul projesi iptal edilecek, Atatürk Havalimanı yeniden açılacak.\n6) Yerel yönetimlere atanan kayyumlar gidecek.\n7) Cumhurbaşkanlığı bünyesinde kurulan finans ofisi, insan kaynakları ofisi gibi ofisler kapatılacak.\n8) İstanbul'a taşınmaya hazırlanan Merkez Bankası tüm birimleriyle Ankara'da kalacak.\n9) Kur Korumalı Mevduat sistemi sonlandırılacak.\n10) Usulsüzlük ve yolsuzluk tespit edilen Kamu-Özel İşbirliği projelerinde, varsa kamu zararına yol açan yüklenici şirketler, ortakları ve sorumlular hakkında yasal işlem başlatılacak ve oluşan zararlar ilgililerden tahsil edilecek.\n11) Hiç kimse birden fazla maaş almayacak. Mülakat sona erecek.\n12) Yükseköğretim Kurulu kaldırılacak, üniversiteler kendi yönetimlerini seçecek, denetimi kendi öğretim üyeleri yapacak."
 Turkey.461.a:0 "İlginç"
 Turkey.462.title:0 "Kiliçdaroglu Bir Gençle Konustu"
 Turkey.462.desc:0 "CHP Genel Başkanı Kemal Kılıçdaroğlu dün İstanbul'da düzenlenen Gelecek Gençlik Festivali'ne katıldı.\n\nKılıçdaroğlu etkinlikte konuşmasını yaparken tribünün arka sıralarında oturan lise öğrencisi Ömer Faruk Berber, CHP liderine "Aday olma" diye seslendi.\n\nEtkinliğe katılanların bir kısmı Ömer Faruk Berber'e tepki gösterirken CHP Genel Başkanı Kılıçdaroğlu kendisine seslenen gençle görüştü.\n\nCHP Grup Başkanvekili Engin Özkoç, görüşmeyle ilgili sosyal medya hesabından şu paylaşımı yaptı: "Genel Başkanımız Kemal Kılıçdaroğlu, Gençlik Festivali'nde kendisini protesto eden lise öğrencisi Ömer Faruk ile görüştü. Herkesin düşünce özgürlüğü olduğunu, her görüşe saygı duyduğunu söyledi. 'Demokrasi kazanacak' dedi.""
 Turkey.462.a:0 "Neyse"
 Turkey.464.title:0 "Pazarcik Depremi"
 Turkey.464.desc:0 "6 Şubat 2023'te Türkiye'nin güneyi ve orta kesimleri ile Suriye'nin kuzeyi ve batısında bir deprem meydana geldi. Deprem, TSİ 04.17'de (UTC 01.17) Gaziantep kentinin 34 km (21 mil) batısında, en yüksek Mercalli şiddeti XI (Aşırı) ve en az Mw 7,8 büyüklüğünde gerçekleşti. Geniş çaplı hasar oluştu ve on binlerce kişi hayatını kaybetti.\n\nBu deprem, aynı büyüklükteki 1939 Erzincan depreminden bu yana Türkiye'de yaşanan en ölümcül ve en güçlü deprem oldu. Ayrıca 1822 Halep depreminden bu yana Suriye'yi etkileyen en ölümcül deprem, Levant'ta kaydedilen en güçlü depremlerden biri ve 2010 Haiti depreminden bu yana dünyadaki en ölümcül deprem oldu. Deprem İsrail, Lübnan, Kıbrıs ve Türkiye'nin Karadeniz kıyılarına kadar hissedildi ve yapısal hasara yol açtı. Ana şoktan dokuz saat sonra meydana gelen alışılmadık derecede güçlü Mw 7,7'lik deprem de dahil olmak üzere 1.000'den fazla artçı sarsıntı yaşandı. 10 Şubat itibarıyla 20 bini Türkiye'de, 4 bini Suriye'de olmak üzere 24 binden fazla ölüm bildirildi. Büyük bir kış fırtınası enkazın üzerine kar yağdırıp sıcaklıkları düşürerek kurtarma çalışmalarını sekteye uğrattı. Bölgedeki dondurucu soğuklar nedeniyle hayatta kalanlar, özellikle de enkaz altında mahsur kalanlar büyük bir hipotermi tehlikesiyle karşı karşıya."
 Turkey.464.a:0 "Yıkıcı"
 Turkey.465.title:0 "Deniz Baykal'in Vefati"
 Turkey.465.desc:0 "Türk siyasetinin en önemli isimlerinden eski CHP Genel Başkanı Deniz Baykal hayatını kaybetti. Baykal'ın vefat haberini CHP Genel Başkanı Kemal Kılıçdaroğlu sosyal medya hesabından duyurdu. Deniz Baykal'ın kızı Aslı Baykal, "Babam bu sabah evinde uykusunda vefat etti. Salı günü Antalya'da toprağa vermeyi planlıyoruz" bilgisini verdi."
 Turkey.465.a:0 "Huzur İçinde Yatsın"
 Turkey.466.title:0 "1999 Gölcük Depreminin Mirasi"
 Turkey.466.desc:0 "17 Ağustos 1999'da Türkiye'nin Kocaeli ilinde 7,6 büyüklüğünde yıkıcı bir deprem meydana geldi; deprem muazzam hasara ve 17.127 ile 18.373 arasında ölüme yol açtı. Kuzeybatıdaki İzmit kentine yakınlığı nedeniyle bu adla anılan deprem, yaygın olarak 17 Ağustos Depremi ya da 1999 Gölcük Depremi olarak da bilinir. Deprem yerel saatle 03.01'de (UTC 00.01) 15 km gibi sığ bir derinlikte gerçekleşti. En yüksek Mercalli şiddeti X (Aşırı) olarak gözlemlendi. 37 saniye süren deprem büyük hasara yol açtı ve modern Türkiye tarihinin en ölümcül doğal afetlerinden biri olarak hafızalara kazındı.\n\n1999 depremi, Kuzey Anadolu Fayı boyunca 1939'da başlayan ve 60 yıllık bir süre içinde doğudan batıya doğru ilerleyen büyük depremlere yol açan sismik dizinin bir parçasıydı. Deprem, afetten etkilenenlere yardım sağlamayı amaçlayan ve deprem vergisi olarak bilinen verginin getirilmesine de yol açtı.\n\nDeprem Marmara'da büyük yıkıma neden oldu; binlerce kişi hayatını kaybetti ve çok sayıda bina çöktü. Buraları o zaman onarmaya başladık, ama hasar hâlâ duruyor. Bu bölgelerin tamamen onarılması gerekiyor."
 Turkey.466.a:0 "Hâlâ İnşa Etmemiz Gerekiyor!"
 Turkey.467.title:0 "Pazarcik Depremi"
 Turkey.467.desc:0 "Mw 7,8 büyüklüğündeki deprem, aynı büyüklükteki 1939 Erzincan depreminden bu yana Türkiye'deki en büyük deprem ve 1668 Kuzey Anadolu depreminin ardından ülke tarihinde kaydedilen en güçlü ikinci deprem (Erzincan ile birlikte). Ayrıca Levant'ta kaydedilen en güçlü depremlerden biri. Deprem Mısır'a ve Türkiye'nin Karadeniz kıyılarına kadar hissedildi. Takip eden üç haftada 10.000'den fazla artçı sarsıntı yaşandı. Sismik dizi sığ doğrultu atımlı faylanmanın sonucuydu.\n\nYaklaşık 350.000 km²lik (140.000 mil²) bir alanda, yani kabaca Almanya büyüklüğünde bir bölgede geniş çaplı hasar oluştu. Yaklaşık 14 milyon kişi, yani Türkiye nüfusunun yüzde 16'sı etkilendi. Birleşmiş Milletler'in kalkınma uzmanları yaklaşık 1,5 milyon kişinin evsiz kaldığını tahmin etti.\n\nDoğrulanan ölü sayısı 59.259'dur: Türkiye'de 50.783, Suriye'de 8.476. Bu deprem, 526 Antakya depreminden bu yana bugünkü Türkiye topraklarındaki en ölümcül deprem ve ülkenin modern tarihindeki en ölümcül doğal afettir. Ayrıca 1822 Halep depreminden bu yana bugünkü Suriye'deki en ölümcül deprem, 2010 Haiti depreminden bu yana dünyadaki en ölümcül deprem ve 21. yüzyılın en ölümcül beşinci depremidir. Hasarın Türkiye'de 104 milyar dolar, Suriye'de 14,8 milyar dolar olduğu tahmin ediliyor; bu da onu kayıtlardaki en maliyetli dördüncü deprem yapıyor."
 Turkey.467.a:0 "Yıkıcı"
 Turkey.468.title:0 "Pazarcik Depremi"
 Turkey.468.desc:0 "6 Şubat 2023'te Türkiye'nin güneyi ve orta kesimleri ile Suriye'nin kuzeyi ve batısında bir deprem meydana geldi. Deprem, TSİ 04.17'de (UTC 01.17) Gaziantep kentinin 34 km (21 mil) batısında, en yüksek Mercalli şiddeti XI (Aşırı) ve en az Mw 7,8 büyüklüğünde gerçekleşti. Geniş çaplı hasar oluştu ve çok sayıda kişi hayatını kaybetti.\n\nBu deprem, aynı büyüklükteki 1939 Erzincan depreminden bu yana Türkiye'deki en güçlü deprem, 1822 Halep depreminden bu yana Suriye'yi etkileyen en ölümcül deprem ve Levant'ta kaydedilen en güçlü depremlerden biri oldu. Deprem İsrail, Lübnan, Kıbrıs ve Türkiye'nin Karadeniz kıyılarına kadar hissedildi ve yapısal hasara yol açtı. Ana şoktan dokuz saat sonra meydana gelen alışılmadık derecede güçlü Mw 7,7'lik deprem de dahil olmak üzere 1.000'den fazla artçı sarsıntı yaşandı. Türkiye'deki sağlam yapılar sayesinde ülkedeki kayıplar şaşırtıcı derecede düşük kaldı: 10 Şubat itibarıyla 27'si Türkiye'de, 11.000'i Suriye'de olmak üzere 11.027 ölüm bildirildi. Büyük bir kış fırtınası enkazın üzerine kar yağdırıp sıcaklıkları düşürerek kurtarma çalışmalarını sekteye uğrattı. Bölgedeki dondurucu soğuklar nedeniyle hayatta kalanlar, özellikle de enkaz altında mahsur kalanlar büyük bir hipotermi tehlikesiyle karşı karşıya."
 Turkey.468.a:0 "Binalarımız Dimdik Ayakta!"
 Turkey.469.title:0 "2020 Ege Denizi Depremi"
 Turkey.469.desc:0 "İzmir depremi, 30 Ekim 2020 Cuma günü Yunanistan'ın Sisam Adası'nın yaklaşık 14 km (8,7 mil) kuzeydoğusunda 7,0 moment büyüklüğünde meydana geldi. Deprem sonucunda pek çok bina ağır hasar gördü ya da çöktü; Yunanistan'ın Karlovasi kentindeki Meryem Ana'nın Göğe Yükselişi Kilisesi kısmen çökerken depremden ağır etkilenen İzmir'de onlarca bina hasar gördü ya da tamamen yıkıldı. İki ülkenin acil durum ekipleri hemen olay yerine ulaştı ve kurtarma çalışmaları gece boyunca sürdü. İzmir'de 1.170 kişinin hayatını kaybettiği, 7.034 kişinin de yaralandığı biliniyor. \n\nYunanistan'da ise iki kişi hayatını kaybetti, on dokuz kişi hafif yaralandı. Deprem 1981'den bu yana Ege Denizi'ndeki en güçlü, 1955'te dört kişinin öldüğü 6,6 büyüklüğündeki depremden bu yana İzmir'deki en ölümcül ve 2020 yılının en ölümcül depremi oldu."
 Turkey.469.a:0 "Olamaz!"
 Turkey.470.title:0 "2020 Elazig Depremi"
 Turkey.470.desc:0 "2020 Elazığ depremi 24 Ocak'ta saat 20.55'te Türkiye'de meydana geldi. Depremin büyüklüğü 6,7 Mw olarak belirlendi. Merkez üssü Elazığ'ın Sivrice ilçesine yakın olan deprem, komşu iller Diyarbakır, Malatya ve Adıyaman ile komşu ülkeler Ermenistan, Suriye ve İran'da da hissedildi. Kandilli Rasathanesi depremin büyüklüğünü 6,5 Mw olarak açıkladı. Toplam 783 kişi hayatını kaybetti, 3.600'den fazla kişi yaralandı."
 Turkey.470.a:0 "Olamaz!"
 Turkey.471.title:0 "IYI Parti Altili Masadan Kalkti"
 Turkey.471.desc:0 "İYİ Parti Genel Başkanı Meral Akşener, Genel İdare Kurulu üyeleriyle yaptığı toplantının ardından basın toplantısı düzenledi. Akşener, gelinen noktada İYİ Parti'nin kıskaca alınarak bir dayatmaya zorlandığını, ancak buna boyun eğmeyeceklerini söyledi.\n\nDün yapılan altılı masa toplantısında 5 siyasi partinin Kemal Kılıçdaroğlu'nun adaylığı yönünde görüş bildirdiğini belirten Akşener, "Biz İYİ Parti olarak 3 yılı aşkın süredir sokaklarda, esnafta, meydanlarda sıkça duyduğumuz 2 ismin adaylığı konusundaki görüşümüzü ifade ettik. Milletimizin bu isimlere gösterdiği yoğun teveccühe hemen her yerde şahit olduk ve uzun zamandır tüm kamuoyu yoklamalarında Sayın Erdoğan'a açık ara fark attıklarını gördük. Bu 2 isim; Ankara Büyükşehir Belediye Başkanımız Sayın Mansur Yavaş ve İstanbul Büyükşehir Belediye Başkanımız Sayın Ekrem İmamoğlu'ydu" dedi."
 Turkey.471.a:0 "Kesin Bir Karar"
 Turkey.472.title:0 "Suriye Sinirindaki Mayinlarin Temizlenmesi"
 Turkey.472.desc:0 "Suriye ile Türkiye arasındaki ilişkiler ne olursa olsun, Ottawa Sözleşmesi'ni imzaladığımız için bu mayınları temizlemekle yükümlüyüz. 2011 itibarıyla sınırdaki mayınları temizledik."
 Turkey.472.a:0 "İnsanlık İçin!"
 Turkey.473.title:0 "Ümit Özdag ve Muharrem Ince Ittifak Kurdu"
 Turkey.473.desc:0 "Zafer Partisi Genel Başkanı Ümit Özdağ, Memleket Partisi Genel Başkanı Muharrem İnce, Doğru Parti Genel Başkanı Rifat Serdaroğlu ve Adalet Partisi Genel Başkanı Vecdet Öz'ün Türkiye'deki dördüncü ittifak için bir araya geldiği bildirildi.\n\nTürkiye'de Mayıs 2023 seçimleri için Cumhur İttifakı, Millet İttifakı ve Emek ve Özgürlük İttifakı halihazırda kurulmuş durumda. Memleket Partisi, Zafer Partisi, Doğru Parti ve Adalet Partisi daha önce dördüncü bir ittifak kuracaklarını kamuoyuna duyurmuştu."
 Turkey.473.a:0 "Neyse"
 Turkey.474.title:0 "Özdag-Ince Ittifakinin Sonu"
 Turkey.474.desc:0 "Ümit Özdağ katıldığı bir televizyon programında Muharrem İnce'nin kurmayı düşündükleri ittifaktan ayrıldığını açıkladı. Özdağ, bunun sebebinin Ankara Büyükşehir Belediye Başkanı Mansur Yavaş'ı göreve çağırması olduğunu söyledi. İnce'nin tutumunu yanlış bulduğunu belirten Özdağ, böyle bir şeyi beklediğini de itiraf etti."
 Turkey.474.a:0 "Ve İttifak Gidiyor!"
 Turkey.475.title:0 "Tribünlerde Hükümet Karsiti Protestolar"
 Turkey.475.desc:0 "Geçen hafta oynanan Fenerbahçe-Konyaspor ve Beşiktaş-Antalyaspor maçlarında, seçimden birkaç ay önce hükümeti istifaya çağıran taraftarlar hükümetin tepkisini çekti."
 Turkey.475.a:0 "Nasıl Cüret Ederler?"
 Turkey.476.title:0 "IYI Parti Altili Masaya Geri Döndü"
 Turkey.476.desc:0 "İYİ Parti Genel Başkanı Meral Akşener, Ekrem İmamoğlu ve Mansur Yavaş ile görüştükten sonra CHP Genel Başkanı Kemal Kılıçdaroğlu ile bir araya geldi. Akşener ile Kılıçdaroğlu'nun Çukurambar'daki bir otelde yaptığı görüşmeye İmamoğlu ve Yavaş'ın da katıldığı belirtildi.\n\nGörüşmede Akşener'in Kılıçdaroğlu'na İmamoğlu ve Yavaş'a cumhurbaşkanı yardımcılığı görevi verilmesi önerisini ilettiği öğrenildi. Görüşmenin ardından Akşener ve Kılıçdaroğlu otelden ayrı ayrı ayrıldı.\n\nOteldeki bu görüşmenin ardından İYİ Parti Sözcüsü Kürşad Zorlu, parti genel merkezi önünde açıklama yaptı. Zorlu, İYİ Parti Genel Başkanı Meral Akşener'in CHP Genel Başkanı Kemal Kılıçdaroğlu ile görüştüğünü belirterek "Şu an itibarıyla Genel Başkanımız birazdan Saadet Partisi'ndeki Millet İttifakı toplantısına katılma kararı almıştır" dedi."
 Turkey.476.a:0 "Geri Döndüler!"
 Turkey.477.title:0 "Kiliçdaroglu Millet Ittifaki'nin Cumhurbaskani Adayi Oldu"
 Turkey.477.desc:0 "Cumhurbaşkanı adaylığı tartışması bugün Millet İttifakı'nın kritik toplantısında sonuçlandı. Cumhurbaşkanı adayının Altılı Masa'da belirleneceği açıklanan toplantıda CHP Genel Başkanı Kemal Kılıçdaroğlu'nun adaylığına itiraz eden İYİ Parti Genel Başkanı Meral Akşener'in açıklamalarının ardından art arda gelişmeler yaşandı. Bugün CHP, İYİ Parti, DEVA Partisi, Gelecek Partisi, Saadet Partisi ve Demokrat Parti, Saadet Partisi'nin ev sahipliğinde yeniden bir araya geldi. Toplantı 4,5 saat sürdü. Millet İttifakı'nın cumhurbaşkanı adayı Kemal Kılıçdaroğlu olarak açıklandı. Popüler belediye başkanları Mansur Yavaş ve Ekrem İmamoğlu ileride cumhurbaşkanı yardımcısı olacak."
 Turkey.477.a:0 "Başlıyoruz!"
 Turkey.477.b:0 "Başlıyoruz! §Y(Konuşmasız)§!"
 Turkey.478.title:0 "CHP'nin Yeni Cumhurbaskani Adayi"
 Turkey.478.desc:0 "CHP'nin Ankara ve İstanbul belediye başkanları ülke genelinde popüler oldu. Ekrem İmamoğlu'nu ya da Mansur Yavaş'ı cumhurbaşkanı adayı yapabiliriz. Seçim sizin."
 Turkey.478.a:0 "Mansur Yavaş"
 Turkey.478.b:0 "Ekrem İmamoğlu"
 Turkey.479.title:0 "Adiyaman'da Sel"
 Turkey.479.desc:0 "Adıyaman'ın Gölbaşı ilçesine koordinatör olarak atanan Tokat Valisi Numan Hatipoğlu, sağanağın etkili olduğu Adıyaman'ın Tut ilçesinde bir bahçedeki konteynerin sele kapılması sonucu 1 kişinin hayatını kaybettiğini, 3 kişinin de kayıp olduğunu açıkladı. Kayıp 3 kişinin aynı aileden olduğu öğrenildi. Metrekareye 103 kilogram yağışın düştüğü kentteki duruma ilişkin Adıyaman Belediye Başkanı Süleyman Kılınç, "Son zamanların en büyük yağışını alıyoruz. Bilgiler bize gelmeye devam etsin; ilçemizde 1 can kaybımız, 3 kaybımız var. Çadırlarda sorunlar var, kademeli olarak tahliye ediyoruz" dedi. AFAD'ın yaptığı açıklamada ise "Bölgede meydana gelen aşırı yağışlar nedeniyle Adıyaman ilimizin Tut ilçesinde sel ve su baskınları meydana gelmiştir. Adıyaman, Adana, Kahramanmaraş ve Diyarbakır AFAD ekiplerimiz olay bölgesinde görevlendirilmiştir. Gelişmeleri takip ediyoruz" denildi."
 Turkey.479.a:0 "Depremin Ardından Bir Felaket Daha"
 Turkey.480.title:0 "Gaziantep'te Siddetli Dolu"
 Turkey.480.desc:0 "Kentte akşam saatlerinde başlayan yağmur ve dolu nedeniyle bazı cadde ve sokaklarda su birikintileri oluştu. Sürücüler ve yayalar su birikintileri yüzünden zor anlar yaşadı. Dolu nedeniyle araçların beyaz bir örtüyle kaplandığı kentte bazı vatandaşlar araçlarını doludan korumak için battaniye ve halılarla örttü."
 Turkey.480.a:0 "Depremin Ardından Bir Felaket Daha"
 Turkey.481.title:0 "Yeniden Refah ve AK Parti Ittifaki"
 Turkey.481.desc:0 "Siyasi partilerin ittifak protokollerini Yüksek Seçim Kurulu'na (YSK) sunmasına saatler kala, Genel Başkanlığını Fatih Erbakan'ın yaptığı Yeniden Refah Partisi (YRP), son anda varılan uzlaşmayla Cumhur İttifakı'na katıldı.\n\nAdalet ve Kalkınma Partisi (AKP), Milliyetçi Hareket Partisi (MHP), Büyük Birlik Partisi (BBP) ve YRP'den oluşan Cumhur İttifakı'nın varılan uzlaşma doğrultusunda genel başkanlarca imzalanan protokolü parti yöneticileri tarafından YSK'ya teslim edildi."
 Turkey.481.a:0 "Altılı Masaya Karşı Birleştik"
 Turkey.482.title:0 "Mehmet Simsek AK Parti'yi Geri Çevirdi"
 Turkey.482.desc:0 "AKP Genel Başkanı Recep Tayyip Erdoğan, eski Maliye Bakanı Mehmet Şimşek ile AKP Genel Merkezi'nde görüştü. Erdoğan ile görüşmesinde Şimşek, aktif siyasete girmeyi düşünmediğini, ancak kendi alanına giren konularda destek vermeye hazır olduğunu belirtti."
 Turkey.482.a:0 "Neyse"
 Turkey.483.title:0 "HÜDA PAR AK Parti'nin Safina Katildi"
 Turkey.483.desc:0 "HÜDA PAR Genel Başkanı Zekeriya Yapıcıoğlu, "2023 cumhurbaşkanlığı seçiminde Cumhur İttifakı'nın adayı Recep Tayyip Erdoğan'ı destekleme kararı aldık. Milletvekili seçimleriyle ilgili görüşmelerimiz de devam ediyor" dedi."
 Turkey.483.a:0 "Altılı Masaya Karşı Birleştik"
 Turkey.484.title:0 "TOGG Gündelik Hayata Giriyor"
 Turkey.484.desc:0 "TOGG'un seri üretim heyecanı fabrika açılış töreniyle başladı. Türkiye'nin akıllı otomobili TOGG'un fabrikası bugün Bursa'nın Gemlik ilçesinde Cumhurbaşkanı'nın katılımıyla açıldı. Dünyanın en teknolojik altyapılarından biri kullanılarak inşa edilen fabrikada çok kısa süre içinde seri üretim tam hızla başlayacak. Yıllık 175 bin üretim kapasitesine sahip tesiste 10 yılda 5 farklı modelden toplam 1 milyon araç üretilmesi hedefleniyor."
 Turkey.484.a:0 "İyi Haber"
 Turkey.485.title:0 "HÜRJET'in Ilk Uçusu"
 Turkey.485.desc:0 "Türk Havacılık ve Uzay Sanayii (TUSAŞ) tarafından geliştirilen HÜRJET Jet Eğitim ve Hafif Taarruz Uçağı, F404 turbofan motoruyla piste çıktı. Motor entegrasyonu başarıyla tamamlanan HÜRJET yer testlerine başladı ve ilk uçuşunu başarıyla gerçekleştirdi."
 Turkey.485.a:0 "İyi Haber"
 Turkey.486.title:0 "Ilk Bor Karbür Tesisi"
 Turkey.486.desc:0 "Enerji ve Tabii Kaynaklar Bakanlığı'nın açıklamasına göre dünya bor rezervlerinin yüzde 73'üne sahip Türkiye'de Eti Maden geçen yıl 1 milyar 321 milyon dolarlık satış geliriyle rekor kırdı. Türkiye'nin ilk stratejik tesislerinden biri olacak ve savunma sanayiinin gücüne güç katacak Türkiye'nin ilk bor karbür tesisi bugün Balıkesir'in Bandırma ilçesinde açılacak.\n\nTam kapasiteyle çalıştığında 279 kişinin istihdam edileceği tesiste yılda 1.000 ton bor karbür üretilecek. Elmas ve kübik bor nitrürden sonra en sert üçüncü madde olan bor karbür, başta savunma sanayii olmak üzere pek çok alanda kullanılıyor."
 Turkey.486.a:0 "İyi Haber"
 Turkey.487.title:0 "TCG Anadolu"
 Turkey.487.desc:0 "TCG Anadolu (L-400), V/STOL uçak gemisi olarak da yapılandırılabilen bir Türk Deniz Kuvvetleri amfibi hücum gemisidir. Adını Türkiye'nin kara kütlesinin büyük bölümünü oluşturan Anadolu yarımadasından alır. İnşa çalışmalarına 30 Nisan 2016'da İstanbul'daki Sedef Gemi İnşaatı tersanesinde başlandı, omurgası 7 Şubat 2018'de kızağa kondu. TCG Anadolu, 10 Nisan 2023'te düzenlenen törenle hizmete girdi."
 Turkey.487.a:0 "İyi Haber"
 Turkey.488.title:0 "Kizilay Skandali"
 Turkey.488.desc:0 "Kızılay Başkanı Kerem Kınık, CNN Türk'te Kızılay çadırlarının Ahbap'a satıldığı iddialarına yanıt verdi. Kınık, "Yaklaşık 2 bin 50 çadırımız maliyet fiyatına teslim edildi. Bunu finansal sürdürülebilirlik için yapıyoruz" dedi.\n\nBu itirafın ardından Kızılay'a yapılan gönüllü kan bağışlarında ciddi düşüşler görüldü ve kurumun itibarı ağır yara aldı."
 Turkey.488.a:0 "Durum Kötüleşiyor"
 Turkey.489.title:0 "Mahir Akkoyun Tutuklandi"
 Turkey.489.desc:0 "Son dönemde sosyal medyada paylaşılan bazı görseller, yakın dönemin en yaratıcı ve dikkat çekici siyasi protestoları arasında yer aldı. Market ve mağazalardaki ürünlerin üzerine "Erdoğan sayesinde" yazılı etiketler yapıştırılarak son dönemde dayanılmaz boyutlara ulaşan hayat pahalılığı eleştirildi. Pahalı market ve mağazaların raflarına yapıştırılan bu "Erdoğan sayesinde" sloganlı etiketler dikkat çekici bir gelişmeye yol açtı. Etiketlerin tasarımcısı Mahir Akkoyun, sosyal medya hesabından gözaltına alındığını duyurdu. Akkoyun'un gözaltına alınmasına binlerce sosyal medya kullanıcısının yanı sıra çok sayıda siyasetçi de sert tepki gösterdi."
 Turkey.489.a:0 "Eh"
 Turkey.490.title:0 "IYI Parti Fahrettin Altun'a Yüklendi"
 Turkey.490.desc:0 "İYİ Parti, animasyonlu bir videoyla Fahrettin Altun'u hedef aldı. İYİ Parti'nin animasyonunda İletişim Başkanı Fahrettin Altun'un medyayı manipüle ettiği ve bir trol ordusu kurduğu iddia edildi."
 Turkey.490.a:0 "Kabul Edilemez"
 Turkey.491.title:0 "Süleyman Soylu Muhalefete Yüklendi"
 Turkey.491.desc:0 "AK Parti Sarıyer İlçe Başkanlığı'nda partililere seslenen İçişleri Bakanı Süleyman Soylu, "Değişecek olan iktidar değil, muhalefet olacak. İktidarı hak etmek bir yana, muhalefeti bile hak etmeyen bir muhalefetle karşı karşıyayız. Millet gereğini yapacaktır" dedi."
 Turkey.491.a:0 "Devam!"
 Turkey.492.title:0 "Mansur Yavas'tan Sert PKK Çikisi"
 Turkey.492.desc:0 "Millet İttifakı'nın cumhurbaşkanı yardımcısı adayı Ankara Büyükşehir Belediye Başkanı Mansur Yavaş, terör örgütü PKK'ya çok sert sözlerle tepki gösterdi. Altılı masanın tertemiz bir sayfa açmak istediğini, ancak Kandil'in bunu bozmaya çalıştığını söyleyen Yavaş, "Açık açık söylüyoruz: Kandil'i de başlarına yıkacağız! Biz de PKK'ya karşıyız" dedi."
 Turkey.492.a:0 "Kötü Haber"
 Turkey.493.title:0 "Mustazaf-Der'in Kurulusu"
 Turkey.493.desc:0 "2002'de silahlı mücadeleye son verme kararının ardından Hizbullah'ın Menzil grubu aktivistleri 2004'te "Mustazaflarla Dayanışma Derneği" (Mustazaf-Der) adlı bir dernek kurdu."
 Turkey.493.a:0 "Yeni Bir Dernek"
 Turkey.494.title:0 "Mahkeme Mustazaf-Der'i Kapatti"
 Turkey.494.desc:0 "20 Nisan 2010'da Diyarbakır'daki bir mahkeme, "terör örgütü Hizbullah adına faaliyet yürüttüğü" gerekçesiyle Mustazaflarla Dayanışma Derneği'nin (Mustazaf-Der) kapatılmasına karar verdi. Karar 11 Mayıs 2012'de Yargıtay tarafından onandı."
 Turkey.494.a:0 "Hareket Yeni Adıyla Devam Edecek"
 Turkey.495.title:0 "HDP YSP'ye Dönüstü"
 Turkey.495.desc:0 "Aday tanıtım toplantısında partisine yönelik kapatma davasına değinen HDP Eş Genel Başkanı Mithat Sancar, "Değişimin gücü bizim elimizde, geleceği özgürlük ve eşitlik üzerine inşa etme sorumluluğu omuzlarımızda. Bu sorumluluğu ve görevi asla mahkemenin inisiyatifine ve iktidarın insafına bırakamazdık. Nitekim bırakmadık. Bütün oyunlara karşı yolumuzu böyle ördük. Şimdi yol Yeşil Sol'dan geçiyor" dedi.\n\nSeçimlere Yeşil Sol Parti çatısı altında girme kararı alan HDP, daha önce aldığı karar doğrultusunda Anayasa Mahkemesi'ne sözlü savunma yapmadı. Parti yöneticileri Anayasa Mahkemesi yerine milletvekili adaylarını tanıttıkları Yeşil Sol Parti aday tanıtım toplantısına katıldı."
 Turkey.495.a:0 "Ne dramatik bir değişim!"
 Turkey.496.title:0 "Karadeniz Sular Altinda"
 Turkey.496.desc:0 "Ağustos 2021'de Türkiye'nin Karadeniz Bölgesi, kuzey Türkiye'de 7 Ağustos 2021'de başlayıp 14 Ağustos'a kadar süren bir dizi gök gürültülü fırtınanın yol açtığı seller ve heyelanlar nedeniyle felaket boyutunda bir taşkından etkilendi. Su bazı yerlerde 4 metreye (13 ft) kadar yükseldi ve seller Türkiye tarihinin en kötüsü olarak nitelendirildi. Sellerde 97 kişi hayatını kaybetti, yaklaşık 228 kişi yaralandı; çatılardan kurtarılanlar da dahil olmak üzere 1.800'den fazla kişi tahliye edildi. Raporlar en az 454 binanın ciddi hasar gördüğünü ortaya koydu. Köprüler de hasar gördü ya da yıkıldı ve birçok kasabanın altyapısı ciddi şekilde etkilendi. Uzmanlar Türkiye'deki kentleşme ve iklim değişikliğinin selleri daha da kötüleştirdiğini belirtti, ancak her bir etkenin ne ölçüde sorumlu olduğu tartışmalı."
 Turkey.496.a:0 "Tam Bir Felaket"
 Turkey.497.title:0 "Soma Maden Kazasi"
 Turkey.497.desc:0 "13 Mayıs 2014'te Manisa'nın Soma ilçesindeki Eynez kömür madeninde yapılan patlatma, 15 Mayıs'a kadar süren bir yer altı yangınına yol açtı. Türkiye tarihinin en büyük maden faciasında toplam 301 kişi hayatını kaybetti. Kömür üreticisi Soma Kömür İşletmeleri A.Ş. tarafından işletilen madende, nedenlerinin daha sonra karmaşık olduğu anlaşılan bir yangın çıktı. Yangın madendeki vardiya değişimi sırasında çıktı ve o sırada yer altında 787 işçi bulunuyordu. Başlangıçta faciaya yangından çok bir patlamanın yol açtığı düşünülüyordu. Yangından dört gün sonra, 17 Mayıs 2014'te son cesetlerin madenden çıkarılmasının ardından Enerji ve Tabii Kaynaklar Bakanı Taner Yıldız ölü sayısının 301 olduğunu doğruladı. Afet ve Acil Durum Yönetimi Başkanlığı (AFAD), maden faciasında hayatını kaybeden 301 işçinin ve kurtulan 486 kişinin isimlerini açıkladı."
 Turkey.497.a:0 "Tam Bir Felaket"
 Turkey.498.title:0 "Ankapark'in Kurulusu"
 Turkey.498.desc:0 "Melih Gökçek'in başkanlığında Ankara'da bir Ankapark projesi için adımlar atıldı. Bu Ankapark projesinin turist çekmek için iyi bir fırsat sunmasını umuyoruz."
 Turkey.498.a:0 "İlginç"
 Turkey.499.title:0 "Mansur Yavas Ankapark'i Açmayi Kabul Etti"
 Turkey.499.desc:0 "AKP Milletvekili Sinan Burhan'ın "Ankapark'ı açacak mısınız?" sorusuna "Evet, açacağım" yanıtını veren Yavaş şöyle devam etti: "Neden açmayayım, benim de param var orada. Halka açacağım, hem de pul parasıyla değil.""
 Turkey.499.a:0 "İyi Bir Haber Gibi Görünüyor"
 Turkey.500.title:0 "Cem Saygi Skandali"
 Turkey.500.desc:0 "Memleket Partisi Genel Başkanı Muharrem İnce'nin sosyal medyayı sallayan "Gaz Pedalı" dansının ardından Cem Saygı'nın dans ettiği görüntüler de viral oldu. Saygı, "Twerk yaptıysam ne olmuş kardeşim? İnce de Gaz Pedalı yapıyor" sözleriyle kendini savundu.\n\nYaşananların ardından Cem Saygı, Muharrem İnce'nin liderliğindeki Memleket Partisi'nin milletvekili adaylığından çekilmesi için kendisine 5 bin TL teklif edildiğini ve ölüm tehditleri aldığını öne sürdü. Sosyal medya hesabından açtığı canlı yayında açıklamalar yapan Saygı, "Gençlerin önünü böyle mi açıyor?" sözleriyle İnce'ye sitem etti."
 Turkey.500.a:0 "Kötü Haber"
 Turkey.501.title:0 "Muharrem Ince'den Uzay Madenciligi Vaadi"
 Turkey.501.desc:0 "Muharrem İnce seçim konuşmasında tuhaf ve gerçek dışı vaatlerde bulundu. İnce halka uzay madenciliğini, nanoteknolojiyi ve füzyonu anlattı. Füzyonu üç kez vurguladı."
 Turkey.501.a:0 "Dansı İyi Ama"
 Turkey.502.title:0 "Melih Gökçek Balon Patlatti"
 Turkey.502.desc:0 "Melih Gökçek muhalefet lideri Kılıçdaroğlu'na saldırdı. Gökçek saldırı yöntemi olarak bir balonun üzerine Kılıçdaroğlu yazıp balonu patlattı. Durum kamuoyunda tuhaf karşılandı."
 Turkey.502.a:0 "Neyin Peşinde?"
 Turkey.503.title:0 "Istanbul Finans Merkezi"
 Turkey.503.desc:0 "İstanbul Finans Merkezi, İstanbul'un Ümraniye ilçesinde yer alan finans merkezi projesine verilen addır. Çevre ve Şehircilik Bakanlığı'nın açıklamasına göre projenin amacı New York, Londra ve Dubai'deki mevcut finans merkezlerinden daha büyük bir finans merkezi inşa etmek ve İstanbul'u uluslararası bir finans merkezine dönüştürmektir. Yapılan açıklamalara göre projenin amacı hem finans sektörünün kalbi olacak bir merkez oluşturmak hem de 24 saat yaşayan bir yer inşa etmek. Projenin tamamlanmasıyla yaklaşık 30 bin kişiye istihdam sağlanacağı da eklendi. Yaklaşık 2 milyon 500 bin metrekarelik inşaat alanının 560 bin metrekaresi ofis, 90 bin metrekaresi alışveriş merkezi, 70 bin metrekaresi otel, 60 bin metrekaresi konut olacak; ayrıca 2 bin kişilik bir kültür ve kongre merkezi yer alacak."
 Turkey.503.a:0 "Büyük Bir Gelecek İçin"
 Turkey.504.title:0 "IMECE Uzaya Gönderildi"
 Turkey.504.desc:0 "2013 yılında Kalkınma Bakanlığı'nın finansmanıyla bir altyapı projesi olarak başlayan İMECE, 2017'de TÜBİTAK 1007 Programı kapsamında "İMECE Uydu Projesi" olarak desteklendi ve çalışmalara TÜBİTAK UZAY'da başlandı. 6 yıllık sürecin sonuna yaklaşan projenin çıktılarından biri olan İMECE uydusu 15 Nisan 2023'te fırlatıldı. Bu kapsamda saat 12.23'te fırlatma aracından (Falcon 9) ayrılan İMECE, dakikalar içinde ilk sinyallerini de gönderdi."
 Turkey.504.a:0 "Uzayda Yeni Bir Adım"
 Turkey.505.title:0 "Mansur Yavas 2021 Dünya Belediye Baskani Ödülü'nü Kazandi"
 Turkey.505.desc:0 "Ankara Büyükşehir Belediye Başkanı Mansur Yavaş, 21 ülkeden 32 belediye başkanının aday gösterildiği "2021 Dünya Belediye Başkanı Ödülü"nü kazandığını açıkladı. Yavaş, "Bu başarı Mansur Yavaş'a ait değil. 6 milyon Ankaralı, inşallah bu ödülü sizin adınıza alacağım" dedi."
 Turkey.505.a:0 "CHP İçin İyi"
 Turkey.506.title:0 "Erdogan'in Dogal Gaz Politikasi"
 Turkey.506.desc:0 "Cumhurbaşkanı Tayyip Erdoğan perşembe günü Karadeniz'de keşfedilen rezervden karadaki tesise yapılan ilk doğal gaz sevkiyatının düğmesine bastı ve 14 Mayıs seçimleri öncesinde konutlara ücretsiz doğal gaz sözü verdi."
 Turkey.506.a:0 "İyi Haber"
 Turkey.507.title:0 "AK Parti Güdümlü Kiliçdaroglu Saldirisi"
 Turkey.507.desc:0 "Ramazan Bayramı'nın ilk gününde, 14 Mayıs seçimlerinde ana muhalefet partisinin lideri olan Kemal Kılıçdaroğlu'nun depremde hayatını kaybedenlerin bulunduğu mezarlıkta dua ederken mezhepçi hakaretlerle hedef alınmasının ardından, Adıyaman'da bir türbe ziyareti sırasında bir grup ana muhalefet partisi Cumhuriyet Halk Partisi (CHP) üyelerine saldırdı.\n\n Olay, Kılıçdaroğlu'nun bir türbeyi ziyaretinin ardından yaşandı. Heyet türbeden çıkarken bir kişi Kılıçdaroğlu'na yaklaşmaya çalıştı ve "Seni istemiyoruz. Buraya gelme. Sen buraya ait değilsin" diye bağırdı. Bölgedeki bazı kişiler Kılıçdaroğlu'nun korumalarına saldırmaya çalıştı."
 Turkey.507.a:0 "Neyse"
 Turkey.508.title:0 "Çiftlikbank Dolandiriciligi"
 Turkey.508.desc:0 "Çiftlikbank adıyla kurulan yapı, insanları büyük miktarda parayla dolandırdı. Çiftlikbank'ı yöneten "Tosuncuk" lakaplı kişi ülkeden kayboldu; büyük ihtimalle yurt dışına kaçtı. Dolandırılan insanlar oldukça üzgün."
 Turkey.508.a:0 "Bu Kötü Olmalı"
 Turkey.509.title:0 "CHP'den TÜIK Binasi Önünde Protesto"
 Turkey.509.desc:0 "Enflasyon rakamlarının açıklanmasının ardından TÜİK'i ziyaret edeceğini duyuran CHP Genel Başkanı Kemal Kılıçdaroğlu ve beraberindeki heyete randevuları olmadığı gerekçesiyle TÜİK'in kapıları açılmadı. TÜİK önünde açıklama yapan Kılıçdaroğlu, "TÜİK bir devlet kurumu olmaktan çıkmış, bir saray kurumuna dönüşmüştür. Burası artık bir devlet kurumu değildir" dedi."
 Turkey.509.a:0 "Bizi Hedef Alıyorlar!"
 Turkey.510.title:0 "Pazarcik Hortumu"
 Turkey.510.desc:0 "Kahramanmaraş'ın Pazarcık ilçesinde meydana gelen hortum nedeniyle depremzedelerin kaldığı çadırlar yerinden savruldu. Hasarlı binaların çatılarından savrulan parçalar nedeniyle 1 kişi hayatını kaybetti, 50 kişi yaralandı."
 Turkey.510.a:0 "Depremin Ardından Bir Felaket Daha"
 Turkey.512.title:0 "Zafer Partisi'nin Kampanyasi"
 Turkey.512.desc:0 "Zafer Partisi Genel Başkanı Ümit Özdağ, cumhurbaşkanı adayı Sinan Oğan'a oy toplamak için sokaklarda. Sokakta göç politikasını hedef alarak hükümeti yerden yere vuruyor."
 Turkey.512.a:0 "Bizi Hedef Alıyorlar!"
 Turkey.513.title:0 "IYI Parti Binasina Saldiri"
 Turkey.513.desc:0 "Cuma sabahı İYİ Parti İstanbul İl Başkanlığı binasının camına bir kurşun isabet etti. İYİ Parti Genel Başkanı Meral Akşener olayın ardından ilk olarak Twitter hesabından olayı paylaşarak Cumhurbaşkanı ve AKP Genel Başkanı Recep Tayyip Erdoğan'a "Bize sıktırdığın kurşunları, tehditlerini görev bilerek yaptırma; geleceksen kendin gel!" sözleriyle seslendi."
 Turkey.513.a:0 "Soruşturma Başlatın"
 Turkey.514.title:0 "HDP Seçimi Ilk Turda Bitirmeyi Planliyor"
 Turkey.514.desc:0 "Emek ve Özgürlük İttifakı adına açıklama yapan HDP Eş Genel Başkanı Pervin Buldan, 14 Mayıs'taki cumhurbaşkanlığı seçiminde aday çıkarmayacaklarını duyurarak "Cumhurbaşkanlığı seçiminde tek adam rejimine karşı tarihî sorumluluğumuzu yerine getireceğiz" dedi."
 Turkey.514.a:0 "Kafa Karıştırıcı"
 Turkey.515.title:0 "DSP AK Parti'nin Yaninda"
 Turkey.515.desc:0 "İktidardaki Adalet ve Kalkınma Partisi (AK Parti) yetkililerinin seçim öncesi ittifakı genişletme çabalarında son durak Demokratik Sol Parti (DSP) oldu.\n\nPartinin genel başkanvekili Binali Yıldırım ile genel başkan yardımcısı ve parti sözcüsü Ömer Çelik, DSP'nin Ankara'daki genel merkezini ziyaret etti ve DSP Genel Başkanı Önder Aksakal tarafından karşılandı.\n\nAksakal, Cumhur İttifakı'na katılma önerisini parti yönetim kurulu toplantısında görüşeceklerini ve AKP'ye katılım kararını açıklayacaklarını söyledi."
 Turkey.515.a:0 "Altılı Masaya Karşı Birleştik"
 Turkey.516.title:0 "Erdogan Ilk Türk Uzay Yolcularini Açikladi"
 Turkey.516.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan cumartesi günü, Türkiye'nin bu yılın son çeyreğinde uzaya gönderilecek ilk uzay yolcuları olarak Alper Gezeravcı ve Tuva Cihangir Atasever'i seçtiğini açıkladı.\n\nÜlkenin en büyük teknoloji etkinliği TEKNOFEST'te konuşan Erdoğan, Türk Hava Kuvvetleri pilotu Gezeravcı'nın Uluslararası Uzay İstasyonu'na gönderileceğini, Türk füze üreticisi Roketsan'da uzay fırlatma sistemleri alanında sistem mühendisi olarak çalışan Atasever'in ise yedek aday olarak seçildiğini söyledi."
 Turkey.516.a:0 "İyi Haber"
 Turkey.517.title:0 "Erdogan'in Sagligina Dair Yeni Endiseler"
 Turkey.517.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan'ın 25 Nisan salı akşamı canlı yayında rahatsızlanmasının ve iki gün boyunca etkinliklerinin iptal edilmesinin ardından yönetimi, Cumhurbaşkanı'nın sağlık durumuna ilişkin çeşitli açıklamalar yaptı. İletişim Başkanlığı'nın açıklamaları, Cumhurbaşkanı'nın soğuk algınlığı geçirdiğini belirterek internette yayılan, daha ciddi bir rahatsızlık geçirdiği yönündeki söylentileri yatıştırmayı amaçladı."
 Turkey.517.a:0 "Hiçbir Sorun Yok"
 Turkey.518.title:0 "Süleyman Soylu: 14 Mayis Bir Darbe Girisimi"
 Turkey.518.desc:0 ""14 Mayıs siyasi bir darbe girişimidir" sözleri sorulan Soylu, "Bunun neresi yanlış? Darbeyle yapamadıklarını seçimle yapmak istiyorlar. Erdoğan, Amerika Birleşik Devletleri'nin kurduğu sistemi tasfiye etti" yanıtını verdi. ABD Başkanı Joe Biden'ı işaret eden Soylu, "Biden bu konuşmasında 'Şimdi bu işi Türkiye'deki tüm muhalifleri bir araya getirerek 2023 seçimlerinde sağlamalıyız' diyor. Bunu bir gazeteci söylemiyor, Amerikan başkanı söylüyor. Darbeyle değil, seçimle diyor" ifadesini kullandı."
 Turkey.518.a:0 "Haklı"
 Turkey.519.title:0 "Akkuyu Nükleer Santrali'nin Açilis Töreni"
 Turkey.519.desc:0 "Kremlin salı günü, bu ayın sonunda Türkiye'de düzenlenecek Akkuyu Nükleer Güç Santrali (NGS) törenine Rusya'nın "uygun düzeyde" temsil edileceğini açıkladı.\n\nMoskova'da bir basın toplantısında konuşan Sözcü Dmitriy Peskov, Kremlin'in açılışta Rus heyetine kimin başkanlık edeceğini yakında duyuracağını belirterek video bağlantısıyla da katılım olacağını ekledi. Daha önce Cumhurbaşkanı Recep Tayyip Erdoğan, Rus mevkidaşı Vladimir Putin'in 27 Nisan'daki törene bizzat ya da telekonferans yoluyla katılabileceğini söylemişti.\n\nRusya-Türkiye işbirliği kapsamında hayata geçirilen Mersin'deki Akkuyu NGS, dört reaktörü ve 4.800 megavatlık kurulu gücüyle Türkiye'nin ilk nükleer santrali olacak."
 Turkey.519.a:0 "Türk Nükleer Çağına!"
 Turkey.520.title:0 "Erdogan Yeni Petrol Rezervlerini Açikladi"
 Turkey.520.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan salı günü yeni petrol rezervi keşfini açıkladı ve rezervin ülkenin doğusunda bulunduğunu duyurdu.\n\nKarapınar güneş enerjisi santralinin açılış töreninde konuşan Cumhurbaşkanı, "Sizlerle taze bir müjdeyi paylaşmak istiyorum. Cudi ve Gabar'da günlük 100 bin varil üretim kapasiteli petrol rezervi keşfettik" dedi.\n\nYeni bulunan petrolün "yüksek kaliteli bir yapıya sahip olduğunu" açıklayan Erdoğan, "Türkiye artık enerjide başkalarına bağımlı olmayacak, aksine enerji ihracatçısı olacak" dedi."
 Turkey.520.a:0 "Bir Şekilde Ters Tepti"
 Turkey.521.title:0 "TIP'in 1 Mayis Mitingleri"
 Turkey.521.desc:0 "Sol bir siyasi parti olan Türkiye İşçi Partisi (TİP), ülkede geleneksel olarak 1 Mayıs Emek ve Dayanışma Günü mitingleri düzenleyen örgütlerden biri. TİP 2021'de daha iyi çalışma koşulları, daha yüksek ücretler ve işçiler için daha fazla iş güvencesi talebiyle İstanbul, Ankara ve İzmir dahil birçok şehirde mitingler düzenledi.\n\nİstanbul'da TİP'in 1 Mayıs mitingi, parti üyeleri ve destekçilerinin konuşmaları dinlemek ve gösterilere katılmak için toplandığı Kadıköy Meydanı'nda başladı. Katılımcıların iş yerindeki sömürü ve baskıya son verilmesi çağrısı yapan pankart ve dövizler taşıdığı miting olaysız geçti.\n\nBenzer mitingler diğer şehirlerde de düzenlendi; TİP üyeleri ve destekçileri işçiler için daha fazla hak ve koruma talep etmek amacıyla sendikalar ve diğer ilerici örgütlerle güçlerini birleştirdi. Mitingler, Türkiye'de ve dünyada işçilerin süregelen mücadelelerini öne çıkarmak, daha fazla dayanışma ve kolektif eylem çağrısı yapmak için önemli bir fırsat olarak görüldü."
 Turkey.521.a:0 "Komünistler Büyük Bir Dava İçin Toplanıyor"
 Turkey.522.title:0 "CHP'nin ve Kiliçdaroglu'nun 2023 Mitingleri"
 Turkey.522.desc:0 "Cumhuriyet Halk Partisi (CHP) 2023'te milletvekili seçimleri öncesinde Türkiye genelinde bir dizi miting düzenledi. Mitinglerin amacı destekçileri harekete geçirmek ve partinin politikaları ile programı hakkında farkındalık yaratmaktı.\n\nGenel olarak CHP'nin 2023 mitingleri partinin demokratik değerlere, sosyal adalete ve ekonomik refaha bağlılığını ortaya koydu. Yoğun katılımlı etkinlikler, CHP ve müttefiklerinin güçlü bir performans sergilediği milletvekili seçimleri öncesinde destekçilere moral verdi."
 Turkey.522.a:0 "İlginç"
 Turkey.523.title:0 "AKP'nin ve Erdogan'in 2023 Mitingleri"
 Turkey.523.desc:0 "İktidardaki Adalet ve Kalkınma Partisi (AKP) 2023'te milletvekili seçimleri öncesinde Türkiye genelinde bir dizi miting düzenledi. Mitinglerin amacı destekçileri harekete geçirmek ve AKP'nin iktidarda olduğu dönemdeki başarılarını öne çıkarmaktı.\n\nGenel olarak AKP'nin 2023 mitingleri partinin istikrara, güvenliğe ve ekonomik büyümeye bağlılığını ortaya koydu. Yoğun katılımlı etkinlikler, AKP'nin ülkenin pek çok yerinde güçlü bir performans sergilediği seçimler öncesinde destekçilere moral verdi."
 Turkey.523.a:0 "İlginç"
 Turkey.525.title:0 "Cumhur Ittifaki'nin Kurulusu"
 Turkey.525.desc:0 "İttifak, muhafazakâr oyları konsolide etmek ve Cumhurbaşkanı Recep Tayyip Erdoğan'ın yeniden seçilmesini sağlamak amacıyla iktidardaki Adalet ve Kalkınma Partisi (AKP) ile sağcı Milliyetçi Hareket Partisi (MHP) arasında kuruldu.\n\nMilliyetçilik, muhafazakârlık ve güçlü liderlik ortak vizyonu üzerine kurulan Cumhur İttifakı, Türkiye genelinde geniş bir seçmen kitlesine hitap edebildi. Seçim kampanyası boyunca İttifak, ekonomik büyümeye, güvenliğe ve istikrara bağlılığını vurguladı ve ülkenin karşı karşıya olduğu sorunları çözme sözü verdi."
 Turkey.525.a:0 "Seçim Öncesi Yeniden Yapılanma"
 Turkey.526.title:0 "Millet Ittifaki'nin Kurulusu"
 Turkey.526.desc:0 "Millet İttifakı, Türkiye'de 2018'deki milletvekili ve cumhurbaşkanlığı seçimleri öncesinde kurulan bir siyasi koalisyondur. Koalisyon, iktidardaki Adalet ve Kalkınma Partisi'ne (AKP) güçlü bir alternatif sunmak amacıyla Cumhuriyet Halk Partisi (CHP), İYİ Parti ve Saadet Partisi (SP) dahil olmak üzere birçok muhalefet partisini bir araya getirdi.\n\nMillet İttifakı, AKP'nin giderek otoriterleşen yönetimine ve Türkiye'de demokratik kurumlar ile sivil özgürlüklerin aşınmasına ilişkin artan endişelere yanıt olarak kuruldu. Muhalefet partileri, muhalefet oylarını birleştirmek ve AKP'nin mecliste çoğunluğu elde edip cumhurbaşkanlığı seçimini kazanmasını engellemek için birlikte çalışmaları gerektiğini fark etti."
 Turkey.526.a:0 "Seçim Öncesi Yeniden Yapılanma"
 Turkey.527.title:0 "Erdogan'in Millî Uçagi"
 Turkey.527.desc:0 "AK Parti bu kez seçimlere "Yerli uçağımız göklerde" yazılı bir afişle çıktı. Afişlerdeki görsel sayesinde seçmenler AK Parti'ye yönelmeye başladı. Görünüşe göre AK Parti bu seçimlerde güç gösterecek."
 Turkey.527.a:0 "Gerçek Bu"
 Turkey.528.title:0 "Seçim Güvenligine Dair Endiseler"
 Turkey.528.desc:0 "Bu seçimlerde güven eksikliği de var. Örneğin YSK'nın İçişleri'nin paralel bir yapılanması olan GAMER'e itirazına rağmen yurt dışı oylamada önceden basılmış AKP oyları gibi konular seçim güvenliği sorunlarını artırdı."
 Turkey.528.a:0 "Neyse"
 Turkey.529.title:0 "HÜDA PAR Seçim Standina Halk Saldirisi"
 Turkey.529.desc:0 "Cumhurbaşkanı Erdoğan'ın bugün kentte yapacağı miting öncesinde HÜDA PAR, bildiri dağıtımı için Kahramanmaraş Caddesi'ne bir stant kurdu. Bu sırada caddeden geçen bazı Trabzonlulardan standa tepki gösterenler oldu. Kısa sürede büyüyen kalabalık "Ne mutlu Türküm diyene" sloganıyla standa müdahale ederken partiye ait pankart kesilerek yere atıldı."
 Turkey.529.a:0 "Zafer Partisi'nin İşi mi?"
 Turkey.532.title:0 "Ali Yesildag'in Skandal Açiklamalari"
 Turkey.532.desc:0 "Ali Yeşildağ adlı bir kişi, Sedat Peker tarzıyla hükümetin yolsuzluklarını ifşa etti. Açıklamalar seçmen arasında AK Parti karşıtı bir düşüncenin oluşmasına yol açtı. Bu durum seçim sonuçlarını etkileyecek."
 Turkey.532.a:0 "Of"
 Turkey.533.title:0 "The Economist Erdogan'a Yüklendi"
 Turkey.533.desc:0 "İngiltere merkezli haftalık dergi The Economist bu hafta kapağına 14 Mayıs seçimlerini taşıdı ve seçimin "2023'ün en önemli seçimi" olduğunu yazdı.\n\n Sayının kapağında Türk bayrağının yanı sıra "Erdoğan gitmeli", "Demokrasiyi kurtar" ve "Oy ver!" ifadelerinin yer aldığı bir çıkartma görseli de kullanıldı.\n\nBaşyazıda Cumhurbaşkanı Recep Tayyip Erdoğan'ın seçimi kaybetmesinin "tüm dünyadaki demokratlara umut vereceği, diktatörlerin seçimle gidebileceğini göstereceği" belirtildi."
 Turkey.533.a:0 "Demokrasimizi Hedef Alıyorlar"
 Turkey.534.title:0 "Erzurum Saldirisi!"
 Turkey.534.desc:0 "İstanbul Büyükşehir Belediye Başkanı'nın planlanan seçim mitingi öncesinde Erzurum'un yerel yönetimi, etkinliğin planlandığı gibi yapılmasını engellemek amacıyla kentin ana meydanına onlarca toplu taşıma otobüsü park etti. Kentin belediye başkanı Mehmet Sekmen, Cumhurbaşkanı Recep Tayyip Erdoğan'ın Adalet ve Kalkınma Partisi'nden (AKP). İmamoğlu'nun mitingini baltalamaya yönelik bu ilk girişim muhalefet liderlerinin yaygın tepkisine yol açtı. \n\nArdından İmamoğlu'nun konuşmaya başlamasından kısa süre sonra miting alanı ve İstanbul Büyükşehir Belediye Başkanı'nın kullandığı seçim otobüsü bir grup tarafından mermer taşları ve inşaat malzemeleriyle saldırıya uğradı. Aralarında çocukların da bulunduğu birkaç kişinin yaralandığı bildirildi. Konuşmasını yarıda kesen İmamoğlu, saldırı sırasında olaylara seyirci kalan yerel polisi azarladı: "Seyreden polisler, biz de sizi seyrediyoruz. Bu şehrin yerel yönetimine ve emniyet müdürlüğüne sesleniyorum: Sizi izliyoruz. Hakkınızda suç duyurusunda bulunulacak."\n\nİmamoğlu ayrıca polisin hareketsizliğinin şiddeti cesaretlendirdiğini söyleyerek "Türk bayrakları taşıyan bir kalabalığa karşı bu saldırıyı siz kışkırtıyorsunuz. Bunların hepsi sözde vatanseverlik adına. Elinde Türk bayrağı tutan insanlara hakaret ediliyor" dedi. İstanbul Büyükşehir Belediyesi'nin otobüsün içinden çekip paylaştığı video ve fotoğraflar, araç camlarındaki büyük hasarı ve saldırgan grup İstanbul Büyükşehir Belediye Başkanı'nın seçim otobüsüne mermer parçaları fırlatırken Erzurum çevik kuvvet polisinin seyirci kaldığını gösterdi."
 Turkey.534.a:0 "Mağduriyet Oy Getirir"
 Turkey.535.title:0 "Ekrem Imamoglu'na Suç Isnadi"
 Turkey.535.desc:0 "İstanbul seçimleri sırasında Ekrem İmamoğlu seçim yetkililerini sert bir dille eleştirmişti. Şimdi Ekrem İmamoğlu hakkında hakaret davası açıldı ve hapis cezası istendi. Davanın yakın zamanda sonuçlanması beklenmiyor."
 Turkey.535.a:0 "İşler Sertleşiyor"
 Turkey.536.title:0 "Erdogan Televizyonda Gençlerle Konustu"
 Turkey.536.desc:0 "Cumhurbaşkanı Erdoğan son dönemde anketlerde düşüş eğilimine girdi. Bunu önlemek için kendi ekibinin düzenlediği bir programa katıldı. Soru ve cevaplar önceden hazırlandığı ve soru soranlar çekingen davrandığı için program, Erdoğan'ın oy toplamasına yardımcı olacak haklı bir görüntü oluşturdu."
 Turkey.536.a:0 "İlginç"
 Turkey.537.title:0 "Istanbul Borsasi'nda Kötü Gidisat"
 Turkey.537.desc:0 "İstanbul Borsası BIST seçimler nedeniyle yüksek gerginlik altında kaldı. Borsa ağır kayıplar yaşadı; bunun üzerine Kemal Kılıçdaroğlu borsanın durumundan AK Parti'yi sorumlu tuttu. Ekonomik dengelerde kırılganlık oluştu."
 Turkey.537.a:0 "Ne Büyük Başarısızlık"
 Turkey.538.title:0 "Kaz Daglari Tahrip Ediliyor"
 Turkey.538.desc:0 "Altın bulmak için Kaz Dağları'ndaki ormanlar tahrip edildi. Ortaya çıkan görüntüler iklim gönüllülerini ve ekolojistleri de rahatsız etti. Buna neden olan kurumlar vakıf ve kuruluşlar tarafından sert bir dille kınandı."
 Turkey.538.a:0 "Dramatik Zamanlar"
 Turkey.539.title:0 "Muharrem Ince Yaristan Çekildi"
 Turkey.539.desc:0 "Cumhurbaşkanı adayı Muharrem İnce, iddia edilen bir seks kasetinin yayılmasının ardından yarıştan çekildi; bu durum anketlerin çekişmeli geçeceğini gösterdiği yarışta diğer adayların ilk turda kazanma şansını artırdı.\n\n2018'de de Recep Tayyip Erdoğan'a kaybeden ve iki kez cumhurbaşkanı adayı olan İnce, Türkiye'nin bir kuşaktır yaşadığı en önemli seçime günler kala adaylığını geri çekti ve şöyle dedi: "Türkiye'ye üçüncü bir seçenek, üçüncü bir yol sundum. Bu şekilde başaramadık."\n\nEski okul müdürü ve uzun yıllar Cumhuriyet Halk Partisi (CHP) üyesi olan İnce, internette dolaşan iddia edilen seks kasetinin "bir İsrail porno sitesinden" alınan görüntülerle yapılmış bir deepfake olduğunu söyledi."
 Turkey.539.a:0 "Bu Kadar"
 Turkey.540.title:0 "Yenilenen Kiz Kulesi"
 Turkey.540.desc:0 "Kule, Kültür ve Turizm Bakanlığı projesi kapsamında iki yıl süren kapsamlı bir restorasyonun ardından yeniden açıldı. Çalışmalarda kullanılan malzemeler kulenin Osmanlı Padişahı II. Mahmud (1808-1839) dönemindeki hâline sadık kalınarak seçildi, yapıya sonradan yapılan eklemeler ise kaldırıldı.\n\nKulenin restorasyonu, bilim kurulunun denetiminde İstanbul Teknik Üniversitesi'nden Feridun Çılı, restorasyon uzmanı Zeynep Ahunbay ve mimar Han Tümertekin tarafından uluslararası restorasyon ilkelerine uygun olarak gerçekleştirildi."
 Turkey.540.a:0 "İlginç"
 Turkey.541.title:0 "Kerem Kinik Istifaya Zorlandi"
 Turkey.541.desc:0 "Kahramanmaraş merkezli depremlerin ardından bölgedeki depremzedelerin çadır ihtiyacının "ücretsiz" karşılanması gerekirken, depremin ilk haftasında deposundaki çadırları AHBAP Derneği'ne ve Türk Eczacıları Birliği'ne sattığı haberlerinin ardından eleştirilen Kızılay Başkanı Kerem Kınık, Türk Kızılay Genel Başkanlığı görevinden istifa etti."
 Turkey.541.a:0 "Ondan Kurtulmak İyi Oldu"
 Turkey.542.title:0 "Kemal Dervis'in Vefati"
 Turkey.542.desc:0 "Bu yüzyılın başında doğduğu ülke Türkiye'yi ekonomik krizden çıkarmada kilit rol oynayan ve daha sonra Birleşmiş Milletler Kalkınma Programı'ndan kalkınma yardımı almış bir ülkeden gelip programın başına geçen ilk kişi olan ekonomist Kemal Derviş, pazar günü Maryland'in Bethesda kentinde hayatını kaybetti. 74 yaşındaydı."
 Turkey.542.a:0 "Huzur İçinde Yatsın"
 Turkey.543.title:0 "Nebatinomi"
 Turkey.543.desc:0 "Türkiye Cumhuriyeti'nin ekonomiden sorumlu ismi Nebati, dolardaki artışı ve parasal kayıpları komik bir şekilde yorumlayarak konuyu değiştirmeye çalışan biri. Bu durum halk tarafından öfkeyle karşılandı; son dönemdeki yüksek enflasyonun ve Türk ekonomisinin dolar karşısında ezilmesinin ülkeyi son derece kötü yerlere getirdiği artık herkes tarafından kabul görüyor."
 Turkey.543.a:0 "Başarısızlığın Tarihi"
 Turkey.544.title:0 "Ümit Özdag Mayinlarla Geldi"
 Turkey.544.desc:0 "Hatay'a gelerek bir dizi görüşme ve ziyaret gerçekleştiren Zafer Partisi Genel Başkanı Ümit Özdağ, Reyhanlı ilçesinde bir tarlaya sembolik bir mayın bırakmak istedi. Jandarma, Özdağ'ın oto yedek parçası olduğunu söylediği sembolik mayın eyleminin yapılmasına izin vermedi."
 Turkey.544.a:0 "Çok Tuhaf"
 Turkey.545.title:0 "Gemi Tartismasi"
 Turkey.545.desc:0 "NTV'de yayınlanan "Seçim 2007" programında gündeme ilişkin soruları yanıtlayan Erdoğan, oğlunun gemi almasının medya tarafından gündeme getirildiğini söyledi. "Gemi var, kayık var" diyen Erdoğan şöyle devam etti:\n\n"Bunun da sıfırı var, eskisi var. 15-16-17 yaşında bir gemi alırsanız, küçük de bir gemiyse, ödeme koşulları da uygunsa, kendi kendini ödeyecek durumdaysa neden alınmasın? 300, 400, 500 bin dolar peşinatla bir gemi alabilir, sonra da bu gemi taksitlerini kendi kendine ödeyebiliyorsa bunu yapabilirsiniz.""
 Turkey.545.a:0 "İlginç"
 Turkey.546.title:0 "2023 Seçim Kampanyasinin Sonu"
 Turkey.546.desc:0 "Kılıçdaroğlu seçim kampanyasını Anıtkabir'e giderek bitirirken Erdoğan seçim kampanyasını Ayasofya'ya giderek bitirmeye karar verdi. Bu durum seçimin bir referandum havasına büründüğünü yansıtmaya başladı. Halk kendi kararını verecek."
 Turkey.546.a:0 "Bitti"
 Turkey.547.title:0 "ABD Ermeni Soykirimini Tanidi"
 Turkey.547.desc:0 "ABD, Kongre'nin her iki kanadından geçen iki karar tasarısı ve başkanlık açıklamasıyla Ermeni soykırımını tanıyor. Temsilciler Meclisi 29 Ekim 2019'da geniş destekle bir karar tasarısını kabul etti, Senato da 12 Aralık 2019'da oy birliğiyle aynısını yaptı; böylece Ermeni soykırımının tanınması ABD politikasının bir parçası hâline geldi."
 Turkey.547.a:0 "Of"
 Turkey.548.title:0 "HDP ve TIP Yeni Bir Ittifak Kurdu"
 Turkey.548.desc:0 "Halkların Demokratik Partisi (HDP), Türkiye İşçi Partisi (TİP), Emek Partisi (EMEP), Toplumsal Özgürlük Partisi (TÖP), Emekçi Hareket Partisi (EHP) ve Sosyalist Meclisler Federasyonu (SMF), Emek ve Özgürlük İttifakı'nın kurulduğunu duyurdu."
 Turkey.548.a:0 "Neyse"
 Turkey.549.title:0 "Sinan Ogan Destegi Için Pazarlik Sinyali Verdi"
 Turkey.549.desc:0 "Cumhurbaşkanı adayı Sinan Oğan, seçim ikinci tura kalırsa ikinci turda kalan adaylarla pazarlık masasına oturacaklarını söyledi. Bu sözlere muhalefetten tepki gelmesi üzerine Oğan, "Seçimlerden bir gün önce sözlerimi bağlamından kopararak bize haksız suçlamalar ve saldırılar yaptığınıza göre, seçimlerin ikinci turunda seçmen tabanımızın desteğine ihtiyacınız olmayacak sanırım" dedi. Eleştirenler ise "İkinci turda Sinan Oğan'ın desteği çok değerli olmayacak mı, onun seçmen tabanını ikna etmek zorunda kalmayacak mısınız?" diye karşılık verdi."
 Turkey.549.a:0 "Kendi Seçmenine mi Saldırdı?"
 Turkey.550.title:0 "Büyük 2023 Seçimleri"
 Turkey.550.desc:0 "Bir önceki Türkiye genel seçimi 2018'de yapıldı. Bu seçim, 2017 anayasa referandumunda seçmenlerin kıl payı onayladığı parlamenter sistemden cumhurbaşkanlığı sistemine geçişi simgeliyordu. Seçim, 2014'ten bu yana görevde olan Cumhurbaşkanı Recep Tayyip Erdoğan'ın zaferiyle sonuçlandı. Öte yandan iktidardaki Adalet ve Kalkınma Partisi (AK Parti), Haziran 2015'ten bu yana ilk kez Türkiye Büyük Millet Meclisi'ndeki salt çoğunluğunu kaybetti ve yasa çıkarmak için ittifak ortağı Devlet Bahçeli'nin Milliyetçi Hareket Partisi'ne (MHP) muhtaç kaldı. Başbakanlık 12 Temmuz 2018'de kaldırıldı ve son başbakan Binali Yıldırım TBMM Başkanı oldu.\n\n2023'teki olağan seçimden önce erken seçim yapılacağına dair spekülasyonlar olsa da Bahçeli bu ihtimali reddetti. Yazılı bir açıklamada seçimlerin 2023'ten önce yapılmayacağını söyledi. Ayrıca AK Parti ile MHP arasındaki mevcut ittifakın süreceğini ve Erdoğan'ın ortak cumhurbaşkanı adayları olacağını teyit etti. Erdoğan 9 Haziran 2022'de adaylığını açıkladı. 22 Ocak 2023'te Erdoğan, 10 Mart'ta seçim kararı alacağını ve seçim tarihini 18 Haziran'dan 14 Mayıs'a çekeceğini duyurdu. Ancak yıkıcı Türkiye-Suriye depreminin seçmen tercihleri üzerindeki etkisi henüz bilinmiyor. Muharrem İnce 11 Mayıs'ta adaylıktan çekildiğini açıkladı."
 Turkey.550.a:0 "Tehlike Yaklaşıyor!"
 Turkey.550.b:0 "İkinci Tur Vakti mi?"
 Turkey.551.title:0 "Kemal Kiliçdaroglu Babala TV'de"
 Turkey.551.desc:0 "Babala TV'nin sahibi Oğuzhan Uğur, dün Millet İttifakı'nın cumhurbaşkanı adayı Kemal Kılıçdaroğlu ile "Açık Mikrofon" yayınının çekimlerini yaptı. Sosyal medyada herkes Babala TV Açık Mikrofon Kemal Kılıçdaroğlu yayınını izlemek için çabaladı. Çekimler dün yapıldı, ancak görüntüler canlı yayınlanmadı."
 Turkey.551.a:0 "İlginç"
 Turkey.552.title:0 "Sinan Ogan Erdogan'a Destegini Açikladi"
 Turkey.552.desc:0 "14 Mayıs'taki cumhurbaşkanlığı seçiminin ilk turunda ATA İttifakı'nın cumhurbaşkanı adayı Sinan Oğan oyların yüzde 5,17'sini aldı. Bugün (22 Mayıs) Ankara'da basın toplantısı düzenleyen Oğan, Cumhur İttifakı'nın adayı, AKP Genel Başkanı ve Cumhurbaşkanı Recep Tayyip Erdoğan'ı destekleyeceğini açıkladı.\n\nHem Cumhur İttifakı hem de Millet İttifakı ile görüştüklerini söyleyen Oğan, "14 Mayıs seçimlerinde Türk seçmeni, Türk milletinin hassasiyetlerine gereken yaklaşımı göstermedikleri için hem Cumhur İttifakı'nı hem de Millet İttifakı'nı ciddi şekilde uyarmıştır. Seçmen bize de Türk milletinin bu hassasiyetlerini yürütme gücü aracılığıyla savunma görevi vermiştir" dedi."
 Turkey.552.a:0 "ATA İttifakı'nın Çöküşü"
 Turkey.553.title:0 "Ümit Özdag Kiliçdaroglu'na Destegini Açikladi"
 Turkey.553.desc:0 "Millet İttifakı'nın cumhurbaşkanı adayı CHP Genel Başkanı Kemal Kılıçdaroğlu ile Ümit Özdağ Zafer Partisi Genel Merkezi'nde bir araya geldi ve ikinci turda Kılıçdaroğlu'nu destekleme kararı aldıklarını açıkladı. Özdağ tüm seçmenlere şöyle seslendi: "Sevgili vatandaşlarım, anne babanızdan aldığınız Türkiye'yi çocuklarınıza devretmek istiyorsanız, Türkiye'nin 'göçmenistan' olmasını istemiyorsanız, kızınız sokağa çıktığında endişelenmek istemiyorsanız, oğlunuzu akşam 21.30'da köşedeki bakkala güvenle göndermek istiyorsanız, 28 Mayıs'ta 13 milyon sığınmacıyı vatanına gönderecek politikayı destekleyin ve Kemal KILIÇDAROĞLU'na oy verin. Türkiye'nin 'göçmenistan' olmamasının tek yolu budur.""
 Turkey.553.a:0 "Hizipleşmenin Yükselişi"
 Turkey.554.title:0 "Muharrem Ince Tarafsizligini Açikladi"
 Turkey.554.desc:0 "28 Mayıs'ta yapılacak cumhurbaşkanlığı seçiminin ikinci turuna üç gün kala, ilk turda adaylıktan çekilen Memleket Partisi Genel Başkanı Muharrem İnce partisinin yöneticileriyle bir araya geldi.\n\n28 Mayıs'ta Millet İttifakı'nın cumhurbaşkanı adayı Kemal Kılıçdaroğlu'nu destekleyeceği iddiasını hastane yatağından yaptığı paylaşımla yalanlayan İnce, öğleden sonra partisinin 22 kişilik Merkez Yönetim Kurulu ile toplantı yaptı.\n\nEdinilen bilgiye göre Kılıçdaroğlu'nu destekleme ve tarafsız kalma görüşlerinin tartışıldığı toplantıda pek çok il başkanının Kılıçdaroğlu'nu desteklemeyi talep ettiği öğrenildi. İnce adaylıktan çekildikten sonra herhangi bir isim işaret etmemişti. Parti ikinci turda da bu tutumla devam etme kararı aldı. Kararla ilgili herhangi bir açıklama yapılmayacağı belirtildi."
 Turkey.554.a:0 "Neyse"
 Turkey.555.title:0 "Büyük 2023 Seçimlerinin Ikinci Turu"
 Turkey.555.desc:0 "Cumhurbaşkanlığı seçimi yalnızca Türkiye'yi kimin yöneteceğini değil, ülkenin daha laik ve demokratik bir yola dönüp dönmeyeceğini, ağır hayat pahalılığı kriziyle nasıl başa çıkacağını ve Rusya, Orta Doğu ve Batı ile kilit ilişkilerini nasıl yöneteceğini de belirleyecek.\n\nİkinci turda kazanacağını söyleyen Kılıçdaroğlu destekçilerini sabırlı olmaya çağırdı ve Erdoğan'ın partisini oyların sayımına ve sonuçların bildirilmesine müdahale etmekle suçladı."
 Turkey.555.a:0 "Riskli!"
 Turkey.556.title:0 "Kaotik 13. CHP Olaganüstü Kurultayi"
 Turkey.556.desc:0 "Cumhuriyet Halk Partisi'nin 13. Olağanüstü Kurultayı, Türkiye'nin merkez sol partisi CHP'nin genel başkanını seçmek için 29-30 Ocak 2005'te yapıldı. Mevcut Genel Başkan Deniz Baykal'a genel başkanlık için Şişli Belediye Başkanı Mustafa Sarıgül rakip oldu. Kurultaya, konuşmalarında birbirlerini yolsuzluk ve elitizmle suçlayan iki rakibin destekçileri arasındaki şiddet olayları damga vurdu."
 Turkey.556.a:0 "CHP'nin Sorunları"
 Turkey.557.title:0 "Kaotik 13. CHP Olaganüstü Kurultayi"
 Turkey.557.desc:0 "Cumhuriyet Halk Partisi'nin 13. Olağanüstü Kurultayı, Türkiye'nin merkez sol partisi CHP'nin genel başkanını seçmek için 29-30 Ocak 2005'te yapıldı. Mevcut Genel Başkan Deniz Baykal'a genel başkanlık için Şişli Belediye Başkanı Mustafa Sarıgül rakip oldu. Kurultaya, konuşmalarında birbirlerini yolsuzluk ve elitizmle suçlayan iki rakibin destekçileri arasındaki şiddet olayları damga vurdu."
 Turkey.557.a:0 "Yaşasın Deniz Baykal"
 Turkey.557.b:0 "Yaşasın Mustafa Sarıgül"
 Turkey.558.title:0 "Erdogan'in Üçüncü Dönemi"
 Turkey.558.desc:0 "Recep Tayyip Erdoğan, eşi benzeri görülmemiş şekilde üçüncü kez Türkiye Cumhurbaşkanı olarak yemin etti. Erdoğan, geçen hafta muhalefet adayı Kemal Kılıçdaroğlu ile girdiği ikinci turun ardından beş yıllık yeni bir dönem kazandı. 14 Mayıs'ta adaylardan hiçbiri yüzde 50 barajına ulaşamamıştı, ancak iki hafta sonraki ikinci turda Erdoğan oyların yüzde 52,1'ini aldı. 69 yaşındaki Erdoğan, cumartesi günü yabancı devlet erkânının katıldığı ayrı bir göreve başlama töreni öncesinde Ankara'da Meclis'te yemin etti. Bu da onu, 2002'den bu yana AK Partisiyle ülkeyi yöneten, Türkiye tarihinin en uzun süre görev yapan lideri yapıyor.\n\nYeni kabinesini bu hafta sonu açıklayacak."
 Turkey.558.a:0 "Hoşça Kal Kemal!"
 Turkey.559.title:0 "Erdogan Politikalarini Yeniden Liberallestiriyor"
 Turkey.559.desc:0 "Cumhurbaşkanı Tayyip Erdoğan cumartesi günü, Türkiye'nin hayat pahalılığı krizi ve diğer sıkıntılarla mücadele etmesi için Mehmet Şimşek'i kabinesine almasıyla yeni seçilen hükümetinin daha ortodoks ekonomi politikalarına döneceğinin sinyalini verdi.\n\nAnalistler, Şimşek'in Hazine ve Maliye Bakanı olarak atanmasının önümüzdeki aylarda faiz artışlarına zemin hazırlayabileceğini söyledi; bu, Erdoğan'ın yükselen enflasyona rağmen faizleri indirme yönündeki uzun süreli politikasından belirgin bir dönüş anlamına geliyor."
 Turkey.559.a:0 "Erdoğan'dan U Dönüşü mü?"
 Turkey.560.title:0 "MKE Patlamasi"
 Turkey.560.desc:0 "Milli Savunma Bakanlığı cumartesi günü yaptığı açıklamada, başkent Ankara'daki bir patlayıcı fabrikasını sarsan patlamada en az beş işçinin hayatını kaybettiğini bildirdi. Patlama, Ankara'nın yaklaşık 40 km (25 mil) dışındaki MKE Roket ve Patlayıcı Fabrikası'nda meydana geldi. Ankara Valisi Vasip Şahin gazetecilere "Teknik personelin bildirdiğine göre fabrikanın dinamit bölümünde kimyasal bir deney sonucu patlama meydana geldi" dedi.\n\nŞahin, "Maalesef beş işçimiz hayatını kaybetti, ailelerine başsağlığı diliyoruz" dedi. Milli Savunma Bakanlığı da ayrı bir açıklamayla ölü sayısını doğruladı. "Enkaz altında beş işçi daha vardı, ancak onları kurtarmayı başardık."\n\nDevlet medyasına göre fabrikanın yaralanan çalışanları hastanelere kaldırıldı ve olayla ilgili soruşturma başlatıldı."
 Turkey.560.a:0 "Kötü"
 Turkey.561.title:0 "Muhalefet Kendini Sorguluyor"
 Turkey.561.desc:0 "Cumhuriyet Halk Partisi, Kemal Kılıçdaroğlu liderliğinde cumhurbaşkanlığı seçimini kaybetti. Seçimin yanı sıra parti oy oranında küçük düşüşler ve ciddi milletvekili kaybı yaşadı. Bu ciddi kayıplar sonucunda Kemal Kılıçdaroğlu liderliğindeki CHP tam bir kaosa sürüklendi. Parti üyeleri Kılıçdaroğlu'nun istifasını isterken Kılıçdaroğlu delegeler aracılığıyla CHP'nin başında kalmaya çalışıyor.\n\nPartide kalmaya çalışan Kemal Kılıçdaroğlu'na karşı İstanbul Büyükşehir Belediye Başkanlığını kazanan Ekrem İmamoğlu, Bolu Belediye Başkanı Tanju Özcan ve Özgür Özel karşı çıktı. Son dönemde Erzincan milletvekilliğiyle adından söz ettiren Mustafa Sarıgül'ün de Kılıçdaroğlu'na karşı ayaklanması muhtemel.\n Buradan Cumhuriyet Halk Partisi'nin bir sonraki olağan kurultayının oldukça sert geçeceği anlaşılıyor."
 Turkey.561.a:0 "Ah, CHP Klasikleri!"
 Turkey.562.title:0 "TDP CHP'ye Katildi"
 Turkey.562.desc:0 "TDP Genel Başkanı ve CHP Erzincan Milletvekili Mustafa Sarıgül, yaptığı açıklamayla partisinin CHP'ye katıldığını duyurdu. Sarıgül, "TDP olarak tarihî bir karar alıyoruz, tarihin doğru tarafında olacağız. TDP ile CHP'nin birleşme çalışmaları bugün itibarıyla başlamıştır" dedi."
 Turkey.562.a:0 "Neyse"
 Turkey.563.title:0 "Ekolojik Sorunlar"
 Turkey.563.desc:0 "Türkiye son dönemde sanayileşiyor; sanayileşme ülkedeki karbon seviyesini artırmaya başladı ve bu da çevreci bir hareketin doğmasına yol açtı. Onların kaygılarını ciddiye almalı ve ortaya çıkabilecek sorunları önlemeliyiz."
 Turkey.563.a:0 "Beklendiği Gibi"
 Turkey.564.title:0 "Türk Beyin Göçü"
 Turkey.564.desc:0 "Ülkemize Suriyeli akını, Türkiye'nin giderek İslamlaşması ve laiklikten uzaklaşma, ülkedeki aydınları bir an önce ülkeyi terk etmeye yöneltti. Bunu önlemeliyiz; önlemezsek nitelikli iş gücü sorunuyla karşılaşacak ve verimlilik kaybı yaşayacağız."
 Turkey.564.a:0 "Bunu Aşmamız Gerekiyor"
 Turkey.566.title:0 "Türkiye Varlik Fonu"
 Turkey.566.desc:0 "2017 Türkiye anayasa referandumunun ardından Başbakanlık kaldırıldı. Bu değişikliğin ardından TVF kanunu, Türkiye Cumhurbaşkanı'nın TVF'nin yönetim kurulu başkanı olmasına ve genel müdür, başkan yardımcısı ile yönetim kurulu üyelerinin Cumhurbaşkanı tarafından atanmasına imkân verecek şekilde değiştirildi."
 Turkey.566.a:0 "İyi Bir Kurum Daha"
 Turkey.567.title:0 "Eylül 2001 Istanbul Bombalamasi"
 Turkey.567.desc:0 "10 Eylül 2001'de Devrimci Halk Kurtuluş Partisi-Cephesi üyesi Uğur Bülbül, İstanbul Beyoğlu'nda Gümüşsuyu semtindeki bir polis kontrol noktasına intihar saldırısı düzenledi. Patlamada saldırganla birlikte iki polis memuru ve yoldan geçen bir sivil hayatını kaybetti, 23 kişi yaralandı."
 Turkey.567.a:0 "Aman Tanrım"
 Turkey.568.title:0 "Ocak 2001 Istanbul Bombalamasi"
 Turkey.568.desc:0 "3 Ocak 2001'de Devrimci Halk Kurtuluş Partisi-Cephesi üyesi Gültekin Koç, İstanbul Şişli'deki bir karakola intihar saldırısı düzenledi. Patlamada failin yanı sıra bir sivil hayatını kaybetti, 2'si ağır olmak üzere 7 kişi yaralandı."
 Turkey.568.a:0 "Aman Tanrım"
 Turkey.569.title:0 "2003 Hür ve Kabul Edilmis Masonlar Büyük Locasi Saldirisi"
 Turkey.569.desc:0 "9 Mart 2003'te iki saldırgan, İstanbul'un Kartal ilçesindeki Hür ve Kabul Edilmiş Masonlar Büyük Locası binasına girerek bir güvenlik görevlisini yaraladıktan sonra üzerlerindeki patlayıcıları infilak ettirdi. El Kaide'nin Türkiye yapılanmasının üyeleri Engin Vural ve Nihat Doğruel tarafından gerçekleştirildiği belirlenen saldırıdan Vural yaralı olarak kurtuldu; hayatını kaybedenlerin ve yaralananların tamamı sivildi. İstanbul 9. Ağır Ceza Mahkemesi'nde görülen dava sonucunda 4 sanık müebbet hapis cezasına çarptırıldı."
 Turkey.569.a:0 "Aman Tanrım"
 Turkey.570.title:0 "2006 Van Bombalamasi"
 Turkey.570.desc:0 "2006 Van saldırısı, 9 Mart 2006'da Van'da PKK üyesi Devrim Solduk'un Van Belediyesi'ne ait bir trafik aracına yaklaşarak üzerindeki patlayıcıları infilak ettirmesiyle gerçekleşen bir intihar saldırısıdır. Patlamada saldırganın yanı sıra iki kişi hayatını kaybetti, 19 kişi saldırıdan yaralı olarak kurtuldu."
 Turkey.570.a:0 "Aman Tanrım"
 Turkey.571.title:0 "2007 Ankara Bombalamasi"
 Turkey.571.desc:0 "2007 Ankara bombalaması, 22 Mayıs 2007'de Türkiye'nin başkenti Ankara'da gerçekleşen bir intihar saldırısıdır. Biri Pakistan kökenli olmak üzere altı kişinin öldüğü, 121 kişinin yaralandığı bildirildi. 7 Haziran'da yedinci, 17 Haziran'da ise bir kişi daha yaralarına yenik düşerek ölü sayısı sekize yükseldi. Dokuzuncu kişi 4 Temmuz'da yaşamını yitirdi."
 Turkey.571.a:0 "Aman Tanrım"
 Turkey.572.title:0 "2011 Bingöl Bombalamasi"
 Turkey.572.desc:0 "2011 Bingöl saldırısı, 29 Ekim 2011'de Türkiye'nin Bingöl ilinin merkezinde gerçekleştirilen bir intihar saldırısıdır. PKK üyesi Nazlı Görer'in gerçekleştirdiği saldırıda saldırgan dahil 4 kişi hayatını kaybetti, 20 kişi yaralandı."
 Turkey.572.a:0 "Aman Tanrım"
 Turkey.573.title:0 "2012 Kayseri Bombalamasi"
 Turkey.573.desc:0 "2012 Pınarbaşı saldırısı, 25 Mayıs 2012'de Kayseri'nin Pınarbaşı ilçesindeki Pınarbaşı İlçe Emniyet Müdürlüğü'ne önce silahlı, ardından intihar saldırısı olarak gerçekleştirilen bir saldırıdır. PKK üyelerinin gerçekleştirdiği saldırıda iki saldırganın yanı sıra biri polis, biri sivil 4 kişi hayatını kaybetti."
 Turkey.573.a:0 "Aman Tanrım"
 Turkey.574.title:0 "2012 Istanbul Intihar Saldirisi"
 Turkey.574.desc:0 "2012 İstanbul intihar saldırısı, İstanbul'un Sultangazi ilçesindeki bir karakolda gerçekleşti. İntihar bombacısı, Devrimci Halk Kurtuluş Partisi-Cephesi (DHKP-C) üyesi İbrahim Çuhadar'dı. 11 Eylül 2012'de karakola giderek içeri girmeye çalışan Çuhadar, polisin girişine izin vermemesi üzerine karakolun girişinde patlayıcıları infilak ettirdi. Patlamada saldırgan ve bir polis memuru hayatını kaybetti, yedi kişi yaralandı."
 Turkey.574.a:0 "Aman Tanrım"
 Turkey.575.title:0 "2015 Istanbul Intihar Saldirisi"
 Turkey.575.desc:0 "6 Ocak 2015'te Dağıstanlı Diana Ramazova, İstanbul'un merkezindeki Sultanahmet semtinde, Sultanahmet Camii ve Ayasofya yakınlarındaki bir polis karakolunda bomba yüklü yeleğini patlattı. Saldırıda Ramazova öldü ve iki polis memuru yaralandı; bunlardan biri daha sonra yaralarına yenik düştü. Ramazova, Aralık 2014'te Suriye'de öldürülen Norveçli-Çeçen bir IŞİD militanının hamile dul eşiydi."
 Turkey.575.a:0 "Aman Tanrım"
 Turkey.576.title:0 "Suruç Bombalamasi"
 Turkey.576.desc:0 "Suruç bombalaması, 20 Temmuz 2015'te Şanlıurfa'nın Suruç ilçesinde Amara Kültür Merkezi önünde, İslam Devleti'nin Dokumacılar adlı Türkiye yapılanmasının Türk solcularına yönelik gerçekleştirdiği bir intihar saldırısıdır. Saldırıda (fail dahil) toplam 34 kişi hayatını kaybetti, 104 kişi yaralandı. Hayatını kaybedenlerin çoğu, Suriye sınırındaki Kobani kasabasının yeniden inşasına katkı için planladıkları gezi hakkında basın açıklaması yapan Ezilenlerin Sosyalist Partisi (ESP) Gençlik Kolu ile Sosyalist Gençlik Dernekleri Federasyonu (SGDF) üyesi üniversite öğrencileriydi."
 Turkey.576.a:0 "Aman Tanrım"
 Turkey.577.title:0 "Aralik 2016 Istanbul Bombalamalari"
 Turkey.577.desc:0 "10 Aralık 2016 akşamı İstanbul'un Beşiktaş ilçesinde bomba yüklü bir araç ve bir canlı bombanın yol açtığı iki patlamada 48 kişi hayatını kaybetti, 166 kişi yaralandı. Hayatını kaybedenlerin 39'u polis, 7'si sivil, 2'si ise failler. Saldırıyı üstlenen Kürdistan Özgürlük Şahinleri (TAK), üyelerinin 100'den fazla polisi öldürdüğünü iddia etti."
 Turkey.577.a:0 "Aman Tanrım"
 Turkey.578.title:0 "2016 Bursa Bombalamasi"
 Turkey.578.desc:0 "27 Nisan 2016'da Bursa'da bir intihar saldırısı gerçekleşti. Saldırı saat 17.26'da (UTC+3) Ulu Camii'nin batı girişi ve bir kapalı çarşının yakınında meydana geldi. Saldırıda yalnızca canlı bomba hayatını kaybetti, 13 kişi hafif yaralandı. Yakındaki dükkân ve kafelerde büyük hasar oluştuğu bildirildi."
 Turkey.578.a:0 "Aman Tanrım"
 Turkey.579.title:0 "2016 Cizre Bombalamasi"
 Turkey.579.desc:0 "2016 Cizre bombalaması, PKK üyesi Mustafa Aslan'ın Cizre'de gerçekleştirdiği bir intihar saldırısıdır. Saldırgan, emniyet müdürlüğü önündeki polis kontrol noktasına bomba yüklü bir araçla saldırdı. Saldırıda Aslan ile birlikte on iki polis hayatını kaybetti; 75 polis ve üç sivil yaralandı."
 Turkey.579.a:0 "Aman Tanrım"
 Turkey.580.title:0 "2016 Elazig Bombalamasi"
 Turkey.580.desc:0 "2016 Elazığ bombalaması, 18 Ağustos 2016 perşembe günü Elazığ'daki bir emniyet binasını hedef alan bomba yüklü araçla saldırıdır. Saldırıyı Kürdistan İşçi Partisi (PKK) gerçekleştirdi. Saldırıda faillerden biri dahil altı kişi hayatını kaybetti, 217 kişi yaralandı. Saldırıyla bağlantılı olarak iki kişi tutuklandı."
 Turkey.580.a:0 "Aman Tanrım"
 Turkey.581.title:0 "2016 Semdinli Bombalamasi"
 Turkey.581.desc:0 "2016 Şemdinli bombalaması, 9 Ekim 2016'da PKK'nın silahlı kanadı HPG tarafından bir Türk askerî üssüne bomba yüklü araçla düzenlenen saldırıdır. Türk yetkililere göre bomba yüklü araç 10'u asker, 8'i sivil olmak üzere en az 18 kişinin ölümüne yol açtı. İlk raporlara göre 27 kişi de yaralandı. Saldırıyı üstlenen HPG, 32'den fazla askeri öldürdüğünü iddia etti."
 Turkey.581.a:0 "Aman Tanrım"
 Turkey.582.title:0 "Agustos 2016 Gaziantep Bombalamasi"
 Turkey.582.desc:0 "20 Ağustos 2016'da yerel saatle 22.50'de bir canlı bomba Gaziantep'te bir düğünü hedef aldı. Düğünde 200'den fazla kişi bulunuyordu. Tanıklara göre saldırı, Türkiye-PKK çatışmaları nedeniyle Siirt'ten kaçan bir Kürt aileyi hedef aldı ve geleneksel kına gecesi sırasında gerçekleşti. Damat saldırıda yaralandı, gelin ise yara almadan kurtuldu. Damadın yaralarının hayati tehlike taşımadığı açıklandı. Bir tanık, şüpheli iki kişinin düğüne yaklaştığını ve saldırının ardından olay yerinden ayrıldığını bildirdi. Güvenlik güçleri bu iki şüpheliyi arıyor. Halkların Demokratik Partisi (HDP), saldırının parti üyelerinin düğününe yapıldığını açıkladı."
 Turkey.582.a:0 "Aman Tanrım"
 Turkey.583.title:0 "2015 Ankara Bombalamalari"
 Turkey.583.desc:0 "10 Ekim 2015'te yerel saatle 10.04'te (EEST) Türkiye'nin başkenti Ankara'da Ankara Garı önünde iki bomba patlatıldı. 109 sivilin hayatını kaybettiği saldırı, 2013 Reyhanlı bombalamalarını geride bırakarak Türkiye tarihinin en kanlı terör saldırısı oldu. 500 kişi de yaralandı. Sansür izleme grubu Turkey Blocks, patlamaların ardından sosyal medya hizmetlerinde ülke çapında yavaşlama tespit etti; İnsan Hakları İzleme Örgütü bunu olayın bağımsız medyada haberleştirilmesini kısıtlamaya yönelik "yargısız" bir önlem olarak nitelendirdi."
 Turkey.583.a:0 "Aman Tanrım"
 Turkey.584.title:0 "2016 Bursa Bombalamasi"
 Turkey.584.desc:0 "27 Nisan 2016'da Bursa'da bir intihar saldırısı gerçekleşti. Saldırı saat 17.26'da (UTC+3) Ulu Camii'nin batı girişi ve bir kapalı çarşının yakınında meydana geldi. Saldırıda yalnızca canlı bomba hayatını kaybetti, 13 kişi hafif yaralandı. Yakındaki dükkân ve kafelerde büyük hasar oluştuğu bildirildi."
 Turkey.584.a:0 "Aman Tanrım"
 Turkey.585.title:0 "2016 Gaziantep Bombalamalari"
 Turkey.585.desc:0 "Ekim 2016 Gaziantep saldırıları, 16 Ekim 2016'da güvenlik birimlerinin düzenlediği baskın sırasında saldırganların, Gaziantep'in Şehitkamil ve Şahinbey ilçelerinde Irak ve Şam İslam Devleti militanlarınca kullanıldığı belirlenen iki ayrı evde patlayıcıları infilak ettirmesiyle gerçekleşen intihar saldırılarıdır. Patlamalarda saldırganların yanı sıra 3 polis hayatını kaybetti, 4'ü Suriyeli 13 kişi yaralandı."
 Turkey.585.a:0 "Aman Tanrım"
 Turkey.586.title:0 "Kasim 2016 Diyarbakir Bombalamasi"
 Turkey.586.desc:0 "Kasım 2016 Diyarbakır bombalaması, 4 Kasım'da Diyarbakır'ın Bağlar ilçesindeki bir emniyet binasının yakınında meydana gelen patlamadır. Bomba, ikisi polis en az 11 kişinin ölümüne yol açtı. Saldırıyı hem Irak ve Şam İslam Devleti hem de Kürdistan Özgürlük Şahinleri üstlendi."
 Turkey.586.a:0 "Aman Tanrım"
 Turkey.587.title:0 "2016 Kayseri Bombalamasi"
 Turkey.587.desc:0 "17 Aralık 2016'da Kayseri'de bomba yüklü araçla yapıldığından şüphelenilen saldırıda bir otobüsteki 15 asker hayatını kaybetti, en az 55 kişi yaralandı. Daily Sabah gazetesine göre hepsi er ve astsubaylardan oluşan askerler, kentteki komando tugayından izin almıştı. Patlama, İstanbul'da bir futbol maçının ardından gerçekleşen ve 44 kişinin öldüğü çifte bombalı saldırıdan bir hafta sonra meydana geldi."
 Turkey.587.a:0 "Aman Tanrım"
 Turkey.588.title:0 "Mart 2016 Ankara Bombalamasi"
 Turkey.588.desc:0 "Mart 2016 Ankara bombalamasında en az 37 kişi hayatını kaybetti, 125 kişi yaralandı. Yaralananlardan 19'u ağır yaralandı. Olayda birkaç bina da hasar gördü; bir otobüs ve çok sayıda otomobilin tamamen kullanılamaz hâle geldiği bildirildi."
 Turkey.588.a:0 "Aman Tanrım"
 Turkey.589.title:0 "Mart 2016 Istanbul Bombalamasi"
 Turkey.589.desc:0 "19 Mart 2016'da İstanbul'un Beyoğlu ilçesinde kaymakamlık binasının önünde bir intihar saldırısı gerçekleşti. Saldırı saat 10.55'te (EET) merkezî alışveriş caddesi İstiklal Caddesi ile Balo Sokak'ın kesiştiği noktada meydana geldi. Saldırıda fail dahil en az beş kişi hayatını kaybetti. Yedisi ağır olmak üzere otuz altı kişi yaralandı; yaralananlar arasında on iki yabancı turist vardı. Hayatını kaybedenlerden ikisi İsrail-ABD çifte vatandaşıydı. 22 Mart'ta İçişleri Bakanı, saldırganın IŞİD ile bağlantılı olduğunu açıkladı."
 Turkey.589.a:0 "Aman Tanrım"
 Turkey.590.title:0 "Ocak 2016 Istanbul Bombalamasi"
 Turkey.590.desc:0 "12 Ocak 2016'da İstanbul'un tarihî Sultanahmet semtinde gerçekleşen intihar saldırısında hepsi yabancı 13 kişi hayatını kaybetti, 14 kişi yaralandı. Saldırı yerel saatle 10.20'de turistlerin yoğun ilgi gösterdiği Sultanahmet Camii ve Ayasofya yakınlarında gerçekleşti."
 Turkey.590.a:0 "Aman Tanrım"
 Turkey.591.title:0 "Haziran 2016 Istanbul Bombalamasi"
 Turkey.591.desc:0 "7 Haziran 2016'da saat 08.40 sıralarında (UTC+3) İstanbul'un merkezinde meydana gelen bombalı saldırıda 12 kişi hayatını kaybetti, üçü ağır 51 kişi yaralandı. Saldırı, Şehzade Camii ve Vezneciler metro istasyonu yakınlarında Vezneciler'den geçen ve polisleri taşıyan bir otobüsü hedef aldı."
 Turkey.591.a:0 "Aman Tanrım"
 Turkey.592.title:0 "Igdir'a Roketli Saldirilar"
 Turkey.592.desc:0 "PKK'lılar sabah saatlerinde İran sınırındaki Iğdır'ın Aralık ilçesinde bulunan Şehit Bülent Aydın Karakolu'na uzun namlulu silahlarla ateş açtı. Saldırıda 1 asker şehit oldu, 2 asker yaralandı."
 Turkey.592.a:0 "Aman Tanrım"
 Turkey.593.title:0 "Mayis 2016 Dürümlü Bombalamasi"
 Turkey.593.desc:0 "Mayıs 2016 Dürümlü bombalaması (Türkiye'de Dürümlü katliamı olarak da bilinir), 12 Mayıs 2016'da yerel saatle 22.30 sıralarında Diyarbakır'ın Sur ilçesine bağlı Dürümlü mezrasında gerçekleşen bomba yüklü kamyonla saldırıdır. Saldırıda 16 köylü hayatını kaybetti, 23 köylü yaralandı."
 Turkey.593.a:0 "Aman Tanrım"
 Turkey.594.title:0 "Ağustos 2016 Gaziantep Bombalaması"
 Turkey.594.desc:0 "20 Ağustos 2016'da bir canlı bomba Gaziantep'te bir Kürt düğününü hedef aldı. Saldırıda 57 kişi hayatını kaybetti, 14'ü ağır olmak üzere 66 kişi yaralandı."
 Turkey.594.a:0 "Aman Tanrım"
 Turkey.595.title:0 "Mardin Midyat Bombalamasi"
 Turkey.595.desc:0 "5 yıl önce PKK'lı teröristlerin Midyat İlçe Emniyet Müdürlüğü'ne bomba yüklü araçla düzenlediği, biri hamile 3 polisin şehit olduğu, 3 kişinin hayatını kaybettiği ve 50 kişinin yaralandığı saldırının acısı dinmedi."
 Turkey.595.a:0 "Aman Tanrım"
 Turkey.596.title:0 "2013 Reyhanli Bombali Araç Saldirilari"
 Turkey.596.desc:0 "2013 Reyhanlı bombalı araç saldırıları, 11 Mayıs 2013'te Hatay'ın Suriye sınırına 5 km uzaklıktaki, Suriye ile en işlek kara sınır kapısına sahip 64.000 nüfuslu Reyhanlı ilçesinde iki bomba yüklü aracın patlamasıyla gerçekleşti. Saldırıda en az 52 kişi hayatını kaybetti, 140 kişi yaralandı."
 Turkey.596.a:0 "Aman Tanrım"
 Turkey.597.title:0 "Kürecik Radar Üssü mü?"
 Turkey.597.desc:0 "ABD Senatosu, Türkiye'deki Kürecik Radar Üssü'ne yapılan yatırımı sorgulayan şaşırtıcı bir açıklama yaptı. Üst düzey bir yetkili tarafından yapılan açıklama, değişen jeopolitik dinamikler ve teknolojik gelişmeler ışığında radar üssünün uzun vadeli sürdürülebilirliği ve stratejik önemi konusunda endişeleri dile getirdi."
 Turkey.597.a:0 "Yatırımlara Devam"
 Turkey.597.b:0 "Bunu Karşılayamayız"
 Turkey.598.title:0 "ABD Kürecik Radar Üssü'nü Faaliyete Geçirdi"
 Turkey.598.desc:0 "Beklenmedik bir gelişmeyle ABD ve Türkiye, Türkiye'nin Kürecik bölgesinde "Kürecik Küresel Havacılık ve Uzay Araştırma Merkezi"nin resmî açılışını ortaklaşa duyurdu. Merkez, iki ülkenin uzay araştırmaları ve ileri radar teknolojileri alanındaki işbirliğinde önemli bir dönüm noktası."
 Turkey.598.a:0 "Teşekkürler Efendim!"
 Turkey.599.title:0 "ABD Kürecik Radar Üssü'nü Faaliyete Geçirdi"
 Turkey.599.desc:0 "ABD, sınırımıza yakın Kürecik'e askerî yatırım yapacağını açıkladı. Bu durum sabrımızı sınırına getirdi; bunu İsrail'in bekçiliğini yapmak olarak görüyoruz. Bu durumdan kurtulmalıyız."
 Turkey.599.a:0 "Türkler İsrail'le Çalışıyor!"
 Turkey.600.title:0 "Sarraf Olayi"
 Turkey.600.desc:0 "Sarraf'ın iki İran vatandaşıyla birlikte ABD yaptırımlarını yasa dışı yollarla delmek amacıyla İran devleti ve bazı şirketler adına milyonlarca dolarlık finansal işlem yaptığı iddia ediliyor."
 Turkey.600.a:0 "Ah!"
 Turkey.601.title:0 "?Zinisim Adnikraf Ninekilhet"
 Turkey.601.desc:0 "Cumhuriyet gazetesi, aylar önce başlattığı "?Zınısım Adnıkraf Ninekilhet" ("Tehlikenin farkında mısınız?" ifadesinin tersten yazılışı) kampanyasına yeni bir bölüm ekledi. Gazete, Çankaya'ya çıkacak adayın AKP'den olacağını ima ederek "16 Mayıs'ta saatler 100 yıl geri alınıyor. Tehlikenin farkında mısınız?" diye sordu. Peki sizin bu konudaki görüşünüz nedir? Cumhuriyet gerçekten tehlikede mi? Bir AKP'linin Çankaya'ya çıkması Türkiye'yi geriye mi götürür? Bir basın organının Çankaya tartışmalarına taraf olarak katılması normal mi? Cumhuriyet'in söyledikleri doğru kabul edilse bile yöntem doğru mu?"
 Turkey.601.a:0 "?Zınısım Adnıkraf Ninekilhet"
 Turkey.602.title:0 "Demirtas Tutuklandi"
 Turkey.602.a:0 "Hükümet İçin İyi"
 Turkey.602.desc:0 "PKK ile Türkiye arasındaki çözüm süreci sırasında 2013 Nevruz kutlamasında Selahattin Demirtaş ve HDP Milletvekili Sırrı Süreyya Önder konuşma yaptı. Demirtaş Nisan 2018'deki duruşmaya katılmazken Önder, savunmasında polisin konuşmasını yanlış çevirdiğini söyledi. Eylül 2018'de aynı davada Demirtaş, PKK'nın cezaevindeki lideri Abdullah Öcalan'ı övdüğü gerekçesiyle 4 yıl 8 ay, Önder ise 3 yıl 6 ay hapis cezasına çarptırıldı."
 Turkey.603.title:0 "Demirtas Erdogan'a Yüklendi"
 Turkey.603.desc:0 "Eş Genel Başkan Selahattin Demirtaş tarihin en kısa grup toplantısını yaptı. Konuşmasına salondakileri selamlayarak başlayan Demirtaş, Türkiye'nin dört bir yanından getirilen çiçeklerle grup toplantısının daha da anlamlı hâle geldiğinin altını çizdi. HDP Genel Merkezi'nde Karadeniz örgütleriyle buluşacaklarını vurgulayan Demirtaş, "Bugün kürsüye tek bir cümle söylemek için çıktım. Halklarımıza verdiğimiz demokrasi, barış ve özgürlük mücadelesinden asla vazgeçmeyeceğimiz sözünü tekrarlamak için çıktım. Biz pazarlık hareketi değiliz. Bizimle AKP arasında hiçbir zaman kirli bir işbirliği ve müzakere olmadı, asla da olmayacak" dedi.\n\nGrup toplantılarında konuşacakları pek çok konu olduğunu belirterek konuşmasını sürdüren Demirtaş, "Ama kürsüye çıkma sebebim olan tek cümleyi söyleyeyim. Sayın Recep Tayyip Erdoğan, HDP var oldukça, HDP halkı bu topraklarda nefes aldıkça sen başkan olamayacaksın. Sayın Recep Tayyip Erdoğan, seni başkan yaptırmayacağız, seni başkan yaptırmayacağız, seni başkan yaptırmayacağız" dedi."
 Turkey.603.a:0 "Nasıl Cüret Ederler!"
 Turkey.604.title:0 "Iran-Türkiye Dogal Gaz Tahkimi"
 Turkey.604.desc:0 "Türkiye'nin İran'dan satın aldığı doğal gazın fiyatı konusunda 2012'de açtığı tahkim davasını kazandığı belirtildi. Enerji ve Tabii Kaynaklar Bakanlığı yetkilileri, "Mahkeme Türkiye lehine karar verdi, oran meselesini tahkim heyeti belirleyecek" dedi. Azerbaycan'ın Trend Haber Ajansı, "İran Petrol Bakan Yardımcısı Hamid Rıza Araki, Türkiye'nin İran'dan alınan doğal gaz fiyatlarına itiraz ederek gittiği tahkim davasını kazandığını açıkladı" haberini verdi. Habere göre Araki, Uluslararası Tahkim Mahkemesi'nin davacı Türkiye'yi İran karşısında haklı bulduğunu söyledi. Kararın ardından Türkiye'nin 2011-2015 yıllarında İran'dan aldığı doğal gazın fiyatına yüzde 10-15 indirim uygulanması bekleniyor."
 Turkey.604.a:0 "Nasıl Cüret Ederler!"
 Turkey.605.title:0 "10. Uluslararasi Türkçe Olimpiyatlari"
 Turkey.605.desc:0 "10. Uluslararası Türkçe Olimpiyatları 30 Mayıs - 14 Haziran 2012 tarihleri arasında Türkiye'de düzenlendi. Uluslararası Türkçe Derneği (TÜRKÇEDER) tarafından düzenlenen ve 3 kategoride toplam 20 yarışmadan oluşan olimpiyatlara 135 ülkeden toplam 1.500 yarışmacı katıldı."
 Turkey.605.a:0 "Güzel Bir Tören"
 Turkey.606.title:0 "Degisim ve Adalet Yürüyüsü"
 Turkey.606.desc:0 "Özcan ve destekçileri 3 Temmuz 2023'te Bolu'daki Anıtpark'tan yürüyüşe başladı. Özcan, partisini Atatürk çizgisine getirmek istediği için yürüyüşe başladığını da belirtti. İlk gün 24 kilometre yürüyen Özcan'a destekçilerinin yanı sıra eşi ve kuzeni de eşlik etti. Özcan geceyi Tekkeköy mevkiinde bir karavanda geçirdi.\n\nYolculuğun ikinci gününde Yeniçağa ilçesine ulaşan Özcan, geceyi Bolu'nun Yeniçağa ilçesinde karavanında geçirdi ve üçüncü gün saat 8'de yeniden yürümeye başladı. Yürüyüşünün üçüncü gününde Gerede ilçesini geride bırakan Özcan, üçüncü günü Süller köyünde tamamladı ve toplamda 68 kilometre yürüdü. Özcan yürüyüşünün dördüncü gününde Ankara il sınırına ulaştı.\n\nYürüyüşünün beşinci gününde Özcan, "12 Temmuz'da bizi genel merkeze almayacaklarmış. Sen kimsin de kimin yerine genel başkan olarak oturuyorsun? Senin evine gelmiyorum. Senin evine gelsem belki beni almazsın. Ben Atatürk'ün evine, bizim evimize gidiyorum. Babanın çiftliği mi orası?" diyerek Kemal Kılıçdaroğlu'na tepki gösterdi."
 Turkey.606.a:0 "CHP'nin Sorunları"
 Turkey.607.title:0 "Andrey Karlov Suikasti"
 Turkey.607.desc:0 "Rusya'nın Türkiye Büyükelçisi Andrey Karlov, 19 Aralık 2016 akşamı Ankara'da bir sanat sergisinde izinli bir Türk polis memuru olan Mevlüt Mert Altıntaş tarafından suikast sonucu öldürüldü. Suikast, Rusya'nın Suriye İç Savaşı'na ve Halep muharebesine müdahalesine karşı Türkiye'de günlerce süren protestoların ardından gerçekleşti."
 Turkey.607.a:0 "Rusya ile Ne Büyük Gerginlik"
 Turkey.608.title:0 "ABD'de Gerginlik"
 Turkey.608.desc:0 "Washington'daki Türkiye Büyükelçiliği Konutu önünde Cumhurbaşkanı Recep Tayyip Erdoğan'ı protesto eden bir grup ile Erdoğan'ın korumaları arasında kavga çıktı. Amerikan polisi kavgayı güçlükle ayırabildi. Olaylar Cumhurbaşkanı Recep Tayyip Erdoğan konuta gelmeden önce başladı ve Erdoğan'ın gelişiyle daha da alevlendi. Cumhurbaşkanı gelmeden önce konutun karşı kaldırımında toplanan ve "Demirtaş'a Özgürlük" pankartı taşıyan bir grup Erdoğan aleyhine slogan atmaya başladı. Bunun üzerine konutun önünde ellerinde Türk bayraklarıyla bekleyen grupla protestocular arasında sözlü düello yaşandı. Bir süre sonra sözlü düello kavgaya dönüştü. Erdoğan'ın koruma ekibindekiler de kavgaya karıştı."
 Turkey.608.a:0 "Çok Beklenmedik Bir Durum"
 Turkey.609.title:0 "İzmir Saldırısında Şehit Düşen Polis Kahraman İlan Edildi"
 Turkey.609.desc:0 "İzmir'deki terör saldırısı, kentin ana adliye binasının hemen dışında 43 yaşındaki polis memuru Fethi Sekin'in şüpheli bir aracı durdurmasıyla gerçekleşti; aracın patlayıcı taşıdığı ortaya çıktı. Aracı durdurur durdurmaz teröristleri fark eden Sekin, onlara ateş açtı ve aracın ilerlemesini engelleyerek sivil kayıpların önüne geçti. Teröristlerle güvenlik güçleri arasında silahlı çatışma da yaşandı. Ardından gelen çatışma ve bomba yüklü araç saldırısında Sekin ve bir adliye çalışanı şehit oldu, beş kişi yaralandı; başka bir araçla yapılacak daha büyük bir patlama ise önlendi."
 Turkey.609.a:0 "Bu Ülke Sana Borçlu"
 Turkey.612.title:0 "2009 Türkiye Yerel Seçimleri"
 Turkey.612.desc:0 "Türkiye'de yerel seçimler 29 Mart 2009'da yapıldı. Seçimin genel galibi iktidardaki Adalet ve Kalkınma Partisi oldu, ancak parti 2007 genel seçimine kıyasla oy kaybı yaşadı. Ana muhalefet partisi, sosyal demokrat ve Kemalist CHP oy oranını artırdı; aynı şekilde SP, DTP ve genel başkanı Muhsin Yazıcıoğlu seçimden dört gün önce helikopter kazasında hayatını kaybeden BBP gibi bazı küçük partiler de oylarını artırdı. Üçüncü büyük parti olan Türk milliyetçisi MHP ise daha sınırlı bir oy artışı yaşadı. Cem Uzan'ın GP'si seçime katılmadı."
 Turkey.612.a:0 "Halk sözünü söyledi"
 Turkey.613.title:0 "2014 Türkiye Yerel Seçimleri"
 Turkey.613.desc:0 "Türkiye'de yerel seçimler 30 Mart 2014'te yapıldı, bazı yerlerde 1 Haziran 2014'te yenilendi. Şehirlerde büyükşehir ve ilçe belediye başkanları ile belediye meclis üyeleri; kırsal alanlarda (ve kentlerdeki mahallelerde) muhtarlar ve ihtiyar heyetleri seçildi. Seçimleri çevreleyen tartışmalar nedeniyle seçim hükümet hakkında bir referandum olarak görüldü."
 Turkey.613.a:0 "Halk sözünü söyledi"
 Turkey.614.title:0 "2019 Türkiye Yerel Seçimleri"
 Turkey.614.desc:0 "2019 Türkiye yerel seçimleri 31 Mart 2019 pazar günü Türkiye'nin 81 ilinde yapıldı. Mahalle muhtarları ve ihtiyar heyetleri gibi partiler üstü çok sayıda yerel göreve ek olarak toplam 30 büyükşehir ve 1.351 ilçe belediye başkanı ile 1.251 il genel meclisi ve 20.500 belediye meclisi üyesi seçildi."
 Turkey.614.a:0 "Halk sözünü söyledi"
 Turkey.651.title:0 "2024 Türkiye Yerel Seçimleri"
 Turkey.651.desc:0 "2024 Türkiye yerel seçimleri, Türkiye'deki yerel yönetimleri belirlemek için 31 Mart 2024'te yapılacak yerel seçimlerdir. 1.393 belediyede yapılacak seçimlerde belediye başkanları, büyükşehir belediye başkanları, belediye meclis üyeleri, il genel meclisi üyeleri, muhtarlar ve ihtiyar heyetleri belirlenecek."
 Turkey.651.a:0 "Halk sözünü söyledi"
 Turkey.615.title:0 "Imamoglu'nun Gizli Planlari"
 Turkey.615.desc:0 "Tarihî seçim yenilgisinin ardından hazımsızlıkla iç içe geçen CHP'de işler her geçen gün karmaşıklaşıyor. İstanbul Büyükşehir Belediye (İBB) Başkanı Ekrem İmamoğlu öncülüğünde değişim isteyen parti üyelerinin katıldığı bir Zoom toplantısı yapıldı ve toplantının amacının "Kılıçdaroğlu'nu devirmek" olduğu düşünüldü. Gizli toplantının medyaya sızmasıyla partide ihanet ana gündem hâline geldi. CHP Genel Başkanı Kemal Kılıçdaroğlu ise dün katıldığı canlı yayında konuyla ilgili açıklama yaparak bu tür toplantıların olabileceğini, ancak bunu "etik açıdan rahatsız edici" bulduğunu söyledi."
 Turkey.615.a:0 "Tuhaf Şeyler Oluyor"
 Turkey.616.title:0 "Tanju Özcan CHP'den Ihraç Edildi"
 Turkey.616.desc:0 "Cumhuriyet Halk Partisi, Bolu Belediye Başkanı Tanju Özcan'ı partiden ihraç etme kararı aldı.\n\nCHP Yüksek Disiplin Kurulu Başkanlığı yaptığı açıklamada, "Yüksek Disiplin Kurulu'nun 26.07.2023 tarihli toplantısında Tanju Özcan hakkında CHP Tüzüğü'nün 68. maddesinin 1-a ve 1-b bentleri uyarınca kesin ihraç cezası verilmiştir" denildi. Tanju Özcan, ihraç kararının ardından sosyal medya hesabından yaptığı açıklamada CHP Genel Başkanı Kemal Kılıçdaroğlu'nu eleştirdi."
 Turkey.616.a:0 "İlginç"
 Turkey.617.title:0 "HÜDA PAR'a Saldirilar"
 Turkey.617.desc:0 "Cumartesi günü Adana'da düzenlenen bıçaklı saldırıda Kürt muhafazakâr bir partinin üst düzey üyelerinden biri hayatını kaybetti, bir parti yöneticisi yaralandı. Hür Dava Partisi (HÜDA PAR) İl Başkanı Salih Demir ve partinin il sekreteri Sacit Pisgin, partinin Adana'daki binasının mescidinde bıçaklandı. Demir ağır yaralanırken Pisgin hayatını kaybetti."
 Turkey.617.a:0 "Ah!"
 Turkey.618.title:0 "Emine Ülker Tarhan CHP'den Ayrildi"
 Turkey.618.desc:0 "Cumhurbaşkanlığı seçiminin ardından CHP Genel Başkanı Kemal Kılıçdaroğlu'nu görevi bırakmaya çağıran milletvekillerinden Emine Ülker Tarhan partisinden istifa etti.\n\nCHP Ankara Milletvekili Emine Ülker Tarhan bugün yaptığı yazılı açıklamada seçim yenilgilerinden ve hatalardan ders çıkarılması çağrısının görmezden gelindiğini söyledi. Tarhan'ın açıklaması şöyle: \n\n"Ülkemizin içinde bulunduğu savaş tehlikesi de dahil koşullar nedeniyle çocuklarımızın geleceği açısından olağanüstü önem kazanan 2015 Genel Seçimleri öncesinde; parti içinde demokrasinin işletilmesi, seçim yenilgilerinden ve özellikle cumhurbaşkanlığını ilk turda iktidara teslim eden hatalardan ders çıkarılarak ciddi bir yol haritası çizilmesi çağrımın görmezden gelinmesi, kurultayın koltuk kapma yarışına dönüştürülmesi; kurucusunun büyük fedakârlıklarla kurduğu devletin yıkılmasına, diktiği ağaçların sökülmesine ve bunun yerine 'ak' denilen ucube bir sarayda somutlaşan otoriter bir devlet yaratılması girişimine ve cumhuriyet köşkünün hanedan sarayına dönüştürülmesine sessizce seyirci kalınması; Türkiye'nin iç ve dış tehditlerle karşı karşıya olduğu, siyasi ve terör cinayetleriyle sarsıldığı bu çok kritik dönemde sorumsuz çağrılarda, tutarsız tezkere söylemlerinde, muğlak politikalarda ve halkımızın hassasiyetlerinden kopuk bir muhalefet anlayışında ısrar eden CHP yönetiminin olası vahim tercihlerini değiştiremeyeceğimi anladığım için, ne iktidar umudu ne de hedefi olan yanlış ve zayıf politikaların parçası olmamak adına büyük umutlarla geldiğim CHP'den istifa ediyorum.""
 Turkey.618.a:0 "CHP İçin Kötü"
 Turkey.619.title:0 "Emine Ülker Tarhan CHP'den Ayrildi"
 Turkey.619.desc:0 "Cumhurbaşkanlığı seçiminin ardından CHP Genel Başkanı Kemal Kılıçdaroğlu'nu görevi bırakmaya çağıran milletvekillerinden Emine Ülker Tarhan partisinden istifa etti.\n\nCHP Ankara Milletvekili Emine Ülker Tarhan bugün yaptığı yazılı açıklamada seçim yenilgilerinden ve hatalardan ders çıkarılması çağrısının görmezden gelindiğini söyledi. Tarhan'ın açıklaması şöyle: \n\n"Ülkemizin içinde bulunduğu savaş tehlikesi de dahil koşullar nedeniyle çocuklarımızın geleceği açısından olağanüstü önem kazanan 2015 Genel Seçimleri öncesinde; parti içinde demokrasinin işletilmesi, seçim yenilgilerinden ve özellikle cumhurbaşkanlığını ilk turda iktidara teslim eden hatalardan ders çıkarılarak ciddi bir yol haritası çizilmesi çağrımın görmezden gelinmesi, kurultayın koltuk kapma yarışına dönüştürülmesi; kurucusunun büyük fedakârlıklarla kurduğu devletin yıkılmasına, diktiği ağaçların sökülmesine ve bunun yerine 'ak' denilen ucube bir sarayda somutlaşan otoriter bir devlet yaratılması girişimine ve cumhuriyet köşkünün hanedan sarayına dönüştürülmesine sessizce seyirci kalınması; Türkiye'nin iç ve dış tehditlerle karşı karşıya olduğu, siyasi ve terör cinayetleriyle sarsıldığı bu çok kritik dönemde sorumsuz çağrılarda, tutarsız tezkere söylemlerinde, muğlak politikalarda ve halkımızın hassasiyetlerinden kopuk bir muhalefet anlayışında ısrar eden CHP yönetiminin olası vahim tercihlerini değiştiremeyeceğimi anladığım için, ne iktidar umudu ne de hedefi olan yanlış ve zayıf politikaların parçası olmamak adına büyük umutlarla geldiğim CHP'den istifa ediyorum.""
 Turkey.619.a:0 "Değişime İhtiyacımız Var!"
 Turkey.619.b:0 "CHP İçin Kötü"
 Turkey.620.title:0 "Erdogan "Kader" Konusmasini Yapti"
 Turkey.620.desc:0 "Kader deme! Kaderin üstünde bir kader vardır. Ne yapsalar boştur, Hak'tan gelen karar vardır..."
 Turkey.620.a:0 "O, Zatıâlileridir"
 Turkey.620.b:0 "O, Zatıâlileridir §Y(Konuşmasız)§!"
 Turkey.621.title:0 "Beyaz Enerji Operasyonu"
 Turkey.621.desc:0 "Beyaz Enerji Operasyonu'nun sanıkları Müsteşar Yardımcısı Mendilcioğlu ve eski TEAŞ Genel Müdürü Selvi'nin jandarmadaki ifadeleri ortaya çıktı. İki bürokrat, Bakan Ersümer'in ihalelere müdahale ettiğini belirterek "Bakanlıklarda bir rant durumu var. Bu, Cumhur Bey döneminde de böyle" iddiasında bulundu."
 Turkey.621.a:0 "Kabul Edilemez"
 Turkey.622.title:0 "Banka Operasyonlari"
 Turkey.622.desc:0 "2000'li yıllarda Türkiye, ülkenin finans sektörünü sarsan büyük bir bankacılık skandalı yaşadı. Bu olay bazı bankalardaki yolsuzluğu ve mali usulsüzlükleri gün yüzüne çıkardı; kamuoyunun güveni sarsıldı ve ilgili kurumlar ağır sonuçlarla karşılaştı."
 Turkey.622.a:0 "Kabul Edilemez"
 Turkey.623.title:0 "Kocaeli'deki TMO Silosunda Patlama"
 Turkey.623.desc:0 "Kocaeli'de Derince Limanı mevkiindeki Toprak Mahsulleri Ofisi (TMO) silosunda patlama meydana geldi. Patlama kentin her yerinden hissedilirken bölgeye çok sayıda ekip sevk edildi. Kocaeli Büyükşehir Belediye Başkanı Tahir Büyükakın patlamada 12 kişinin yaralandığını, 3 kişinin entübe edildiğini açıkladı. Adalet Bakanı Yılmaz Tunç patlamayla ilgili adli soruşturma başlatıldığını duyurdu. TMO'nun yaptığı açıklamada "Patlamanın toz sıkışmasından kaynaklanmış olabileceği değerlendirilmekte olup sebebi detaylı teknik inceleme sonucunda netlik kazanacaktır" denildi. Öte yandan patlama anına ait görüntüler de ortaya çıktı."
 Turkey.623.a:0 "Aman Tanrım"
 Turkey.625.title:0 "AKP'nin Filistin'e Destek Mitingi"
 Turkey.625.desc:0 "İktidardaki Adalet ve Kalkınma Partisi'nin (AKP) İstanbul teşkilatının 28 Ekim'de düzenlediği Filistin'e destek mitingine yüz binlerce kişi katıldı. İstanbul Atatürk Havalimanı'nda düzenlenen etkinlikte uzun bir konuşma yapan Cumhurbaşkanı Recep Tayyip Erdoğan, Gazze'deki son olaylar nedeniyle hem İsrail'i hem de Batılı ülkeleri kınadı. Erdoğan, "Gazze'deki katliamın da en büyük sorumlusu Batı'dır" dedi ve İsrail'i açıkça "savaş suçlusu" ilan etti.\n\nSözleri, çoğu Filistin ve Türk bayrakları sallayan kalabalık arasında büyük yankı buldu. Miting, Hamas'ın 7 Ekim saldırıları ve İsrail'in ardından Gazze'ye düzenlediği hava saldırılarından bu yana Türkiye'deki en büyük Filistin'e destek gösterisi oldu. Öğle saatlerinden itibaren akın akın gelen katılımcılar öfkelerini dile getirmek için "Katil İsrail" gibi sloganlar attı.\n\nCumhur İttifakı ortağı Milliyetçi Hareket Partisi'nin (MHP) Genel Başkanı Devlet Bahçeli'nin de mitinge katılması dikkat çekti."
 Turkey.625.a:0 "Yaşasın!"
 Turkey.626.title:0 "Incirlik ABD Üssü'ne Protesto"
 Turkey.626.desc:0 "Adana'da İncirlik Üssü önünde İsrail'in Filistin'e yönelik saldırılarını protesto etmek için düzenlenen eylemde gerginlik çıktı. Bazı eylemcilere tazyikli su ve biber gazıyla müdahale eden polislerden 6'sı yaralandı."
 Turkey.626.a:0 "Nasıl Cüret Ederler?"
 Turkey.627.title:0 "Yargitay AYM Kararina Uymayi Reddetti"
 Turkey.627.desc:0 "Yargıtay, Anayasa Mahkemesi'nin kararını kabul etmedi ve TİP'in tutuklu milletvekilini tahliye etmedi. Bu gelişmeler üzerine İstanbul Barosu yürüyüş başlattı ve CHP milletvekilleri TBMM'de eylem yaptı. Yaşananlar sonucunda ülkedeki gerginlik tırmandı ve adalete duyulan şüphe arttı."
 Turkey.627.a:0 "Hukuk ve Düzen mi?"
 Turkey.628.title:0 "Ali Yerlikaya Uyusturucu Operasyonlari Baslatti!"
 Turkey.628.desc:0 "İçişleri Bakanı Ali Yerlikaya, uyuşturucuyla mücadele kapsamında düzenlenen "Narkogüç" operasyonlarında 210 şüphelinin yakalandığını bildirdi.\n\nYerlikaya sosyal medya hesabından yaptığı açıklamada, Ankara Emniyet Müdürlüğü Narkotik Suçlarla Mücadele Şube Müdürlüğü'nün Ankara merkezli olarak 32 ilde suç işlemek amacıyla örgüt kuran ve yöneten, konum bilgisiyle uyuşturucu bırakan, banka hesaplarına para yatırılması yoluyla uyuşturucu ticareti yapan ve suçtan kaynaklanan malvarlığını aklayan çıkar amaçlı suç örgütüne yönelik eş zamanlı "Narkogüç" operasyonları düzenlediğini belirtti. Operasyonlarda örgütün elebaşı yabancı uyruklu Jamukhan Ulus'un da yakalandığını açıklayan Yerlikaya, 210 şüphelinin gözaltına alındığını ve örgütün yönetici ağının çökertildiğini kaydetti."
 Turkey.628.a:0 "Güzel!"
 Turkey.629.title:0 "CHP'nin 38. Olagan Kurultayi"
 Turkey.629.desc:0 "Türkiye'nin ana muhalefet partisi Cumhuriyet Halk Partisi (CHP), ülke gelecek mart ayındaki yerel seçimlere hazırlanırken pazar günü Özgür Özel'i yeni genel başkanı seçti ve Kemal Kılıçdaroğlu'nun 13 yıllık dönemine son verdi. 49 yaşındaki Özel, 2015'ten bu yana CHP Grup Başkanvekili, 2011'den bu yana milletvekili. Özel, Kılıçdaroğlu'nun ve CHP'nin mayıs ayındaki cumhurbaşkanlığı ve genel seçimlerde Cumhurbaşkanı Tayyip Erdoğan ve iktidar ittifakı karşısında aldığı acı yenilginin ardından eylülde adaylığını açıklamıştı.\n\nMesleği eczacılık olan Özel, Ankara'da iki tur süren, saatler boyunca devam eden gergin bir kurultayda 1.366 olası oydan 812'sini aldı. Sonuçların açıklanmasının ardından Özel, "Bu hayatımın en büyük onuru" dedi ve Kılıçdaroğlu'na partideki çalışmaları için teşekkür etti. "Yerel seçim zaferine giden yola çıkıyoruz" diye ekledi.\n\nAlkışlayan parti üyelerinin arasında ve İstanbul Büyükşehir Belediye Başkanı Ekrem İmamoğlu'nun yanında duran Özel, "Umutsuzluğu umuda çevirmeye inandık, umutluyuz" dedi."
 Turkey.629.a:0 "13 Yıl Sonra Yeni Bir Lider İşbaşında"
 Turkey.632.title:0 "16 Ögrenciyi Tasiyan Asansör Düstü"
 Turkey.632.desc:0 "Kredi ve Yurtlar Genel Müdürlüğü'ne (KYK) bağlı, Aydın'ın Efeler ilçesindeki Güzelhisar Kız Öğrenci Yurdu'nda bir asansör "kazası" meydana geldi. İçinde 16 kişinin bulunduğu asansörün üst katlardan düştüğü iddia edildi. DHA'nın haberine göre asansörden çıkmaya çalışırken sıkışarak hayatını kaybeden öğrencinin Adnan Menderes Üniversitesi İktisadi ve İdari Bilimler Fakültesi 4. sınıf öğrencisi Zeren Ertaş olduğu öğrenildi. Ertaş'ın ailesine bilgi verildi.\n\nZeren Ertaş'ın hayatını kaybettiğinin açıklanmasının ardından yurtta kalan öğrenciler "Katil KYK" sloganlarıyla eylem yaptı."
 Turkey.632.a:0 "Korkunç Görünüyor"
 Turkey.633.title:0 "Polis Televizyon Vaizi Adnan Oktar'i Yakaladi"
 Turkey.633.desc:0 "İstanbul polisi çarşamba sabahı erken saatlerde tartışmalı bir televizyon vaizini yakaladı ve "çetesiyle" bağlantılı olduğundan şüphelenilen 235 kişiyi de arıyor.\n\nMedyaya konuşma kısıtlamaları nedeniyle isimlerinin açıklanmamasını isteyen güvenlik kaynakları, Harun Yahya olarak da bilinen Adnan Oktar'ın Mali Suçlar Şube'nin en çok arananlar listesinde olduğunu söyledi. Polis, Oktar'ın kaçmaya hazırlanırken yakalandığını açıkladı.\n\nOktar'ın çetesi suç örgütü kurmak, çocukların cinsel istismarı, reşit olmayanla cinsel ilişki, kişiyi hürriyetinden yoksun kılma, vergi kanununa muhalefet ve terörle mücadele kanununa muhalefet gibi suçlarla itham ediliyor.\n\nPolis, Oktar'la bağlantılı olmakla suçlanan şüphelileri beş ilde arıyor; şimdiye kadar 166 kişi gözaltına alındı. İstanbul Sulh Ceza Hâkimliği ayrıca 235 şüphelinin malvarlıklarına el konulmasına ve şirketlerine, kuruluşlarına ve derneklerine kayyum atanmasına karar verdi."
 Turkey.633.a:0 "Bunu Duymak Güzel"
 Turkey.634.title:0 "Yürüyüsün Ardindan Gerginlik"
 Turkey.634.desc:0 "Dün sabah Fatih'te düzenlenen "Şehitlere rahmet, Filistin'e destek, İsrail'e lanet" yürüyüşüne katılan İsmail Aydemir, yürüyüşün ardından elinde Kelime-i Tevhid bayrağıyla yürüyordu. Üniversite öğrencisi Ege Akersoy, Galata Köprüsü'nde Aydemir'e yumrukla saldırdı. Saldırının ardından Aydemir'in yüzü kana bulanırken Ege Akersoy polis ekiplerince gözaltına alındı. Ege Akersoy, emniyetteki işlemlerinin ardından İstanbul Cumhuriyet Başsavcılığı'na sevk edildi."
 Turkey.634.a:0 "Lanet olsun"
 Turkey.635.title:0 "TBMM Isveç'in NATO Üyeligini Onayladi"
 Turkey.635.desc:0 "Türk milletvekilleri, uzun süredir ertelenen bir oylamayla İsveç'in NATO'ya katılım talebini onayladı; bu, İskandinav ülkesinin üyelik yolunda büyük bir adım.\n\nİsveç, Rusya'nın Ukrayna'yı topyekûn işgalinin ardından 2022'de üyelik başvurusunda bulundu, ancak Türkiye İsveç'in Kürt ayrılıkçılara destek verdiğini söylediği bir anlaşmazlık nedeniyle onayını esirgedi.\n\nCumhurbaşkanı Erdoğan'ın yasayı birkaç gün içinde imzalaması bekleniyor. Böylece İsveç'in katılımını onaylamayan tek NATO üyesi Macaristan kalıyor. İsveç Başbakanı Ulf Kristersson sosyal medyada "Bugün NATO'nun tam üyesi olmaya bir adım daha yaklaştık" paylaşımını yaptı. NATO Genel Sekreteri Jens Stoltenberg de Türkiye'nin oylamasını memnuniyetle karşılayarak Macaristan'ın "ulusal onay sürecini bir an önce tamamlamasını" beklediğini söyledi."
 Turkey.636.a:0 "Kararımızı Verdik, Kabul Edin!"
 Turkey.637.title:0 "Demirtas Nobel'e Aday Gösterildi"
 Turkey.637.desc:0 "Eski HDP Eş Genel Başkanı Selahattin Demirtaş'ın Nobel Barış Ödülü'ne aday gösterildiği bildirildi. Demirtaş'ın kaleme aldığı "Seher"in yayıncısı Emir Ali Türkmen'den edindiğimiz bilgiye göre İsveç Sosyal Demokrat Partisi milletvekili Thomas Hammarberg, Selahattin Demirtaş'ı Nobel Barış Ödülü'ne aday gösterdi."
 Turkey.637.a:0 "İsveç Onayımızın Karşılığını Böyle Verdi"
 Turkey.638.title:0 "Türkiye'nin Ilk Astronotu"
 Turkey.638.desc:0 "Alper Gezeravcı Türkiye tarihinde bir ilke imza attı. İlk Türk astronot Alper Gezeravcı'nın Uluslararası Uzay İstasyonu'na doğru yola çıkmasıyla uzay yolculuğu hayali gerçek oldu. Gezeravcı'nın da aralarında bulunduğu Axiom Mission 3 (Ax-3) ekibini Uluslararası Uzay İstasyonu'na (ISS) taşıyan roket fırlatıldı. Türkiye'nin tarihî görevi dünya basınında da büyük yankı uyandırdı. Uluslararası ajanslar ilk Türk astronotun uzay yolculuğunu manşetlerine taşıdı."
 Turkey.638.a:0 "Çok İyi Haber!"
 Turkey.639.title:0 "Milletvekili Can Atalay'in Vekilligi Düsürüldü"
 Turkey.639.desc:0 "Yargıtay'ın Türkiye İşçi Partisi (TİP) Hatay Milletvekili Can Atalay'ın milletvekilliğinin düşürülmesine ilişkin kararı bugün TBMM Genel Kurulu'nda okundu. Kararın okunmasıyla Atalay'ın milletvekilliği resmen düştü. TİP'in milletvekili sayısı da 3'e geriledi.\n\n TİP, DEM Parti ve CHP milletvekilleri pankartlarla Başkanlık kürsüsünü işgal etti; Bozdağ'a Anayasa kitapçığı fırlatıldı. Meclis'i yöneten TBMM Başkanvekili Bekir Bozdağ, protestolar nedeniyle çalışmaların sürdürülemeyeceği gerekçesiyle birleşimi kapattı."
 Turkey.639.a:0 "AYM'nin Kararı Gölgede Kaldı"
 Turkey.640.title:0 "ISID'den Kiliseye Saldiri"
 Turkey.640.desc:0 "İslam Devleti, pazar günü İstanbul'da bir Roma Katolik kilisesine düzenlenen ve bir kişinin hayatını kaybettiği saldırıyı üstlendi. Uzmanlar saldırıda aşırılıkçı cihatçı grubun Horasan kolunun izlerini görüyor. Pazar ayini sırasında kayak maskesi takan iki saldırgan İstanbul'un Sarıyer ilçesindeki Santa Maria Katolik Kilisesi'ne girerek kalabalığa rastgele ateş açtı ve 52 yaşındaki Tuncer Cihan'ı öldürdükten sonra olay yerinden kaçtı. Yerel kaynaklara göre İslami usullerle defnedilen Cihan, kiliseyi ara sıra ziyaret ediyordu."
 Turkey.640.a:0 "Gerçekten Çok Kötü"
 Turkey.641.title:0 "Kuzey Irak'ta Terör Saldirisi"
 Turkey.641.desc:0 "PKK terör örgütü Kuzey Irak'taki bir üs bölgesine sızmaya çalıştı. Sızma girişimi sırasında çıkan çatışmalarda 9 Türk Silahlı Kuvvetleri personeli şehit oldu, 4 personel de yaralandı. Milli Savunma Bakanlığı saldırının ardından etkisiz hâle getirilen terörist sayısının 23'e yükseldiğini açıkladı. Bölgedeki operasyonlar komando birliklerinin katılımıyla sürüyor. F-16'lar da bölgedeki terör yuvalarını vuruyor. Öte yandan Kuzey Irak ve Suriye'de gerçekleştirilen hava operasyonlarında 29 hedefin imha edildiği bildirildi."
 Turkey.641.a:0 "Bölgeyi Temizlemeliyiz"
 Turkey.642.title:0 "P&G Fabrikasina Silahli Baskin"
 Turkey.642.desc:0 "P&G'nin Gebze'deki fabrikası iki silahlı kişi tarafından basıldı. İlk belirlemelere göre saldırganlar yedi çalışanı rehin aldı. Rehinecilerin fabrikanın çalışanları olduğu öne sürülürken fabrikanın geri kalan kısmının boşaltıldığı belirtildi. Çalışanları rehin alan şüphelinin fotoğrafı ortaya çıktı ve üzerinde "bomba düzeneği" olduğu görüldü."
 Turkey.642.a:0 "Hemen Tutuklayın!"
 Turkey.646.title:0 "Anagold Faciasi"
 Turkey.646.desc:0 "Aralık 2010'dan bu yana altın üretimi yapılan Erzincan'ın İliç ilçesinde, Anagold Madencilik Sanayi ve Ticaret A.Ş.'ye ait madende siyanürlü atıkların oluşturduğu dağda meydana gelen heyelanda çok sayıda işçi toprak altında kaldı. Zehirli atıkların çevre illeri etkileyeceği konusunda uyarılar yapılan bölgede yaşanan tehlike ilk değil. Haziran 2022'de altın madeninde siyanür taşıyan boru patlamış, zehirli atıklar Fırat Nehri üzerindeki İliç Barajı'na karışmıştı."
 Turkey.646.a:0 "Bir Felaket"
 Turkey.647.title:0 "Danistay Karari"
 Turkey.647.desc:0 "Danıştay, Sabah gazetesinin göreve iade edilen hâkim ve savcı sayısının 4.500 olduğu iddiasıyla ilgili açıklama yaparak yalnızca 450 kişinin ihraç kararının iptal edildiğini bildirdi. İhraç edilenler FETÖ ile irtibatlı olmakla suçlanmıştı."
 Turkey.647.a:0 "Neyse"
 Turkey.648.title:0 "Yeni Ordu Forsu"
 Turkey.648.desc:0 "Kara Kuvvetleri Komutanlığı'nın forsu değiştirildi. Milli Savunma Bakanlığı'nın yazılı açıklamasında, "Geçmişi şan ve şerefle dolu Kara Kuvvetleri Komutanlığı'nın kadim geçmişini yansıtan yeni bir fors tasarımı, yeni bir fors tasarımı yapılması ihtiyacıyla tasarlanmış, onaylanmış ve kullanıma alınmıştır. Kara Kuvvetleri Komutanlığı'nın arma ve amblemlerinde herhangi bir değişiklik bulunmamaktadır" denildi."
 Turkey.648.a:0 "İyi Haber"
 Turkey.650.title:0 "Karabük Üniversitesi'nde Saglik Skandali"
 Turkey.650.desc:0 "Karabük Üniversitesi'nin Instagram'daki "itiraf sayfasında" bazı kız ve erkek öğrencilerin yabancı öğrencilerle cinsel ilişkiye girdiği iddiaları gündem oldu. Öğrencilerin bir kısmı HPV, bir kısmı ise HIV şüphesiyle hastaneye gittiğini söyledi. Karabük İl Sağlık Müdürlüğü iddiaları yalanladı."
 Turkey.650.a:0 "Iyy!"
 Turkey.652.title:0 "Belçika'da PKK Yandaslarindan Provokasyon"
 Turkey.652.desc:0 "Belçika polisi, başkent Brüksel yakınlarındaki Limburg eyaletinin Heusden-Zolder ilçesinde Türk kökenli vatandaşların yaşadığı bir bölgeden geçerken provokatif sloganlar atan ve onlara saldıran PKK terör örgütü sempatizanlarının başlattığı arbedeyi kontrol altına almak için tazyikli su kullandı. Pazar sabahı Nevruz kutlamalarından araçlarıyla dönen ve PKK terör örgütünü simgeleyen bayraklar taşıyan bir grup PKK sempatizanı, ağırlıklı olarak Türk kökenli vatandaşların yaşadığı bir sokaktan geçerken provokatif sloganlar attı. Türklerin gruba karşılık vermesiyle arbede çıktı."
 Turkey.652.a:0 "Onları Protesto Edin!"
 Turkey.653.title:0 "Antalya'da Ölümcül Teleferik Kazasi"
 Turkey.653.desc:0 "Ramazan Bayramı'nın yoğun döneminde cuma günü saat 17.28'de bir direk çökerek bir kabine çarptı. Kazada bir kişi hayatını kaybetti, ikisi çocuk yedi kişi yaralandı. Ardından 24 kabindeki 184 kişi havada asılı kaldı.\n\nKurtarma çalışmaları gece görüş sistemli helikopterlerle gece boyunca sürdü. Yedi helikopter, 87 araç ve yaklaşık 500 personelin 22,5 saat süren ortak çabası sonucunda kabinlerde mahsur kalan herkes başarıyla kurtarıldı."
 Turkey.653.a:0 "Aman Tanrım"
 Turkey.654.title:0 "Türk Hükümeti Instagram'i Geçici Olarak Yasakladi"
 Turkey.654.desc:0 "Bilgi Teknolojileri ve İletişim Kurumu (BTK), 2 Ağustos'ta belirli bir gerekçe göstermeden Instagram'a erişimi engelledi. Hükümet yetkilileri daha sonra yasağın sosyal medya platformunun Türk yasalarına uymaması nedeniyle getirildiğini söyledi."
 Turkey.654.a:0 "Sosyal Medyada Düzeni Korumalıyız"
 Turkey.655.title:0 "Türk Hükümeti Discord'u Yasakladi"
 Turkey.655.desc:0 "Adalet Bakanı Yılmaz Tunç, platformu kullanan bazı kişilerce "çocukların cinsel istismarı ve müstehcenlik" suçlarının işlendiğine dair yeterli şüphe bulunduğu gerekçesiyle Ankara'daki bir mahkemenin Türkiye'den Discord'a erişimi engelleme kararı verdiğini söyledi. Erişim engeli, bu ay İstanbul'da 19 yaşındaki bir erkeğin iki kadını öldürmesinin Türkiye'de yol açtığı kamuoyu tepkisinin ardından geldi. Sosyal medyadaki içerikler, Discord kullanıcılarının ardından cinayeti övdüğünü gösterdi."
 Turkey.655.a:0 "Sosyal Medyada Düzeni Korumalıyız"
 Turkey.656.title:0 "Ahmet Özer'in Tutuklanmasi"
 Turkey.656.desc:0 "Seçkin bir Kürt akademisyen ve ana muhalefet partisi Cumhuriyet Halk Partisi (CHP) üyesi olan Özer, 31 Ekim'de evine düzenlenen baskında gözaltına alındı ve ardından "terör" suçlamasıyla tutuklandı."
 Turkey.656.a:0 "CHP Baskı Altında"
 Turkey.658.title:0 "Türk Hükümeti Van Belediye Baskanini Görevden Aldi"
 Turkey.658.desc:0 "İçişleri Bakanlığı, Kürt yanlısı DEM Parti'den Van Büyükşehir Belediye Eş Başkanı Abdullah Zeydan'ı "terör örgütüne yardım ve propaganda" suçundan ceza almasının ardından görevden aldı. Bakanlık Van Valisi'ni kayyum olarak atadı; binlerce Vanlı ve DEM Parti bu kararı protesto etti. Polis protestolar sırasında 127 kişiyi gözaltına aldı."
 Turkey.658.a:0 "Geniş Çaplı Çatışmalar"
 Turkey.659.title:0 "Bir Türk Nobel Ödülü Kazandi"
 Turkey.659.desc:0 "Çalışmalarıyla siyasi sistemler ile ekonomik büyüme arasındaki ilişkiye ışık tutan MIT ekonomistleri Daron Acemoğlu ve Simon Johnson, 2024 Alfred Nobel Anısına İsveç Merkez Bankası İktisat Bilimleri Ödülü'nün sahibi oldu. Birlikte yakından çalıştıkları Chicago Üniversitesi'nden siyaset bilimci James Robinson da ödülü paylaştı."
 Turkey.659.a:0 "İyi Bir Gelişme"
 Turkey.660.title:0 "Ortak Türk Alfabesi"
 Turkey.660.desc:0 "Türk Akademisi ve Türk Dil Kurumu tarafından 1991'den bu yana üzerinde çalışılan ortak alfabe, Latin temelli Türk alfabesinden oluşturuldu ve 34 harften oluşan yeni alfabe, tüm ülkelerin imzasıyla Türk Devletleri Teşkilatı tarafından ortak Türk alfabesi olarak kabul edildi."
 Turkey.660.a:0 "İyi Bir Gelişme"
 Turkey.661.title:0 "Bahçeli Imrali Heyetiyle Görüstü"
 Turkey.661.desc:0 "Halkların Eşitlik ve Demokrasi Partisi'nin (DEM Parti) yeni bir siyasi müzakere süreci yürüten İmralı heyeti, 28 Aralık'ta PKK lideri Abdullah Öcalan ile yaptığı görüşmenin ardından Milliyetçi Hareket Partisi (MHP) Genel Başkanı Devlet Bahçeli ile bir araya geldi.\n\nMezopotamya Ajansı'nın haberine göre DEM Parti heyetini Bahçeli kapıda karşıladı. MHP liderinin Meclis'teki makamında yapılan kapalı görüşme yaklaşık 40 dakika sürdü. Görüşmenin içeriği henüz açıklanmadı."
 Turkey.661.a:0 "Neyse"
 Turkey.662.title:0 "Yeni Yol"
 Turkey.662.desc:0 "Saadet Partisi, Gelecek Partisi ve DEVA Partisi "Yeni Yol" çatısı altında ortak meclis grubu kurma çalışmalarını tamamladı. Eski Anayasa Mahkemesi üyesi ve DEVA Partisi Genel Başkan Yardımcısı Celal Mümtaz Akıncı grup başkanı seçildi."
 Turkey.662.a:0 "Neyse"
 Turkey.663.title:0 "Ümit Özdag'in Tutuklanmasi"
 Turkey.663.desc:0 "İstanbul'da bir mahkeme, göçmen karşıtı ve aşırı sağcı Zafer Partisi'nin Genel Başkanı Ümit Özdağ'ın "halkı alenen kin ve düşmanlığa tahrik" suçlamasıyla tutuklanmasına karar verdi.\n\nSavcılık, Özdağ'ın 2024'te Kayseri'de yaşanan göçmen karşıtı olaylardaki iddia edilen etkisine dikkat çekti. Savcılığa göre Özdağ'ın açıklamaları "provokatif tutum ve davranışlar" içeriyordu.\n\nTürkiye, Temmuz 2024'te Kayseri'de Suriyeli mültecilerin karıştığı iddia edilen bir çocuk istismarı vakasının ardından göçmen ve mülteci karşıtı protestolara sahne olmuştu. Öfkeli protestocular Suriyelilere ait dükkânlara saldırmış ve çok sayıda aracı ateşe vermişti.\n\nÖzdağ suçlamaları reddetti. Mahkemedeki savunmasında "Zafer Partisi'nin Kayseri'deki olaylarla hiçbir ilgisi yoktur" dedi."
 Turkey.663.a:0 "Zafer Partisi'ne Ağır Baskı"
 Turkey.664.title:0 "Bolu Grand Otel Yangini"
 Turkey.664.desc:0 "21 Ocak 2025'te Bolu'daki Kartalkaya kayak merkezinde bulunan Grand Kartal Otel'de çıkan yangında en az 78 kişi hayatını kaybetti, 51 kişi yaralandı. Yangın otelin dördüncü katındaki mutfak/restoran bölümünde başladı. Yangın, otelin yüzde 80-90 dolu olduğu sömestr tatilinde çıktı. Duman dedektörlerinin, otomatik yağmurlama sistemlerinin, çalışan yangın alarmlarının, çalışan acil çıkış ışıklarının ve diğer yangın güvenliği önlemlerinin olmaması, yangının boyutunu ve can kaybını artırdı. Dondurucu soğuk ve otelin uzak konumu kurtarma çalışmalarını zorlaştırdı; itfaiye ekipleri yangının ihbar edilmesinden bir saatten fazla süre sonra ulaşabildi. Hayatını kaybedenlerin çoğu dumandan zehirlenerek öldü."
 Turkey.664.a:0 "Bir Felaket!"
 Turkey.665.title:0 ""Yenidogan" Çetesi"
 Turkey.665.desc:0 "Yenidoğan bebeklerin kâr amacıyla hastaneler arasında sevk edildiği iddia edilen bir dolandırıcılık düzeniyle bağlantılı olarak Türkiye'de 47 kişi hâkim karşısına çıktı.\n\nSavcılar, doktorların, hemşirelerin ve ambulans şoförlerinin en az 10 bebeğin ölümünden sorumlu olduğunu söylüyor. Sanıklar, bebekleri 19 özel hastaneye sevk etmek için sahte teşhisler koymakla suçlanıyor; bebeklerin bu hastanelerde yenidoğan yoğun bakım ünitelerinde uzun süreli ve kimi zaman gereksiz tedavilerle tutulduğu iddia ediliyor.\n\n1.400 sayfalık iddianameye göre olaya karışanlar, bebeklerin ünitede kaldığı her gün için kazanılan sosyal güvenlik ödemelerini paylaşıyordu. Sanıklar suçlamaları reddediyor. Kararları iyi niyetle verdiklerini ve bebeklere mümkün olan en iyi bakımı sağladıklarını söylüyorlar. Associated Press'in haberine göre sanıklardan Dr. Fırat Sarı, savcılara her şeyin "prosedürlere uygun" yapıldığını söyledi. AP'nin aktardığına göre dava başlarken İstanbul yakınlarındaki adliye önünde onlarca kişi "Bebek katilleri hesap verecek" ve "Özel hastaneler kapatılsın" sloganlarıyla protesto düzenledi.\n\nPolis, Mart 2023'te gelen isimsiz bir ihbarın ardından soruşturma başlattı. Soruşturma sonucunda on hastanenin ruhsatı iptal edildi."
 Turkey.666.title:0 "Zorlu Holding CEO'su Istifaya Zorlandi"
 Turkey.666.desc:0 "Zorlu Holding'e bağlı elektronik şirketi Vestel'in CEO'su Ergün Güler cuma günü çalışanlara cumartesi başlayan Ramazan ayını kutlayan bir mesaj gönderdi. Ardından Zorlu Holding CEO'su Cem Köksal, şirketin resmî olarak Ramazan'ı değil yalnızca Ramazan Bayramı ve Kurban Bayramı'nı kutladığını ve farklı inanç ve kökenlerden çalışanlara sahip çok uluslu bir şirket olma yolunda laik bir duruşu korumak istediğini belirten bir iç yazışma gönderdi.\n\nAnadolu Ajansı'nın (AA) haberine göre e-postanın görüntüleri yerel basında ve sosyal medyada yayılmasının ardından İstanbul'da bir savcılık konuyla ilgili soruşturma başlattı ve Köksal cumartesi günü "inanç, düşünce ve kanaat hürriyetinin kullanılmasını engelleme" suçlamasıyla gözaltına alındı. Zorlu Holding daha sonra yaptığı açıklamada "yönetim ilkelerine ilişkin iç tartışmanın" yol açtığı "hassasiyetin" farkında olduklarını ve Köksal'ın 1 Mart itibarıyla istifa ettiğini bildirdi."
 Turkey.666.a:0 "Ramazan İçin"
 Turkey.667.title:0 "Ekrem Imamoglu'nun Tutuklanmasi"
 Turkey.667.desc:0 "19 Mart 2025 sabahı Türk polisi İmamoğlu'nun İstanbul'daki evini kuşattı. İmamoğlu, yerel saatle sabah 7 sıralarında paylaştığı videoda "Büyük bir zulümle karşı karşıyayız, ama yılmayacağım. Kendimi milletime emanet ediyorum" dedi. Kısa süre sonra İmamoğlu ve danışmanı Murat Ongun dahil yaklaşık 100 kişi gözaltına alındı. Aynı operasyon kapsamında CHP'li iki İstanbul ilçe belediye başkanı ile çok sayıda gazeteci ve iş insanı da gözaltına alındı. Bu gelişmeler İmamoğlu'nun CHP'nin cumhurbaşkanı adayı olacağı günün sabahında yaşandı. CHP gözaltıları "darbe girişimi" olarak nitelendirerek kınadı ve İmamoğlu'na desteğini açıkladı. 23 Mart'ta Medya A.Ş. Yönetim Kurulu Başkanı ve İmamoğlu'nun danışmanı Murat Ongun, İstanbul Planlama Ajansı Başkanı Buğra Gökçe, İmamoğlu İnşaat Genel Müdürü Tuncay Yılmaz ve İBB Kültür A.Ş. Genel Müdürü Murat Abbas dahil yirmi kişi tutuklandı. Yolsuzluk soruşturmasında İmamoğlu dahil kırk sekiz kişi, terör soruşturmasında üç kişi tutuklandı; kırk bir kişi hakkında adli kontrol kararı verildi. Aynı gün İmamoğlu, CHP'nin yaklaşan cumhurbaşkanlığı seçimi için adayını belirlemek üzere düzenlediği ön seçimin tek adayıydı. CHP Genel Başkanı Özgür Özel'e göre İmamoğlu 14,85 milyonun üzerinde oy aldı. \n\nİstanbul Cumhuriyet Başsavcılığı İmamoğlu'nu belediye ihaleleriyle bağlantılı yolsuzluk, yağma, rüşvet ve kara para aklama iddialarıyla "suç örgütü lideri" olmakla suçladı. Savcılar ayrıca İmamoğlu'nu 2024 yerel seçimlerinde Kürt yanlısı Halkların Eşitlik ve Demokrasi Partisi (DEM) ile seçim ittifakı kurarak Kürdistan İşçi Partisi'ne (PKK) yardım etmekle itham etti. Hükümet, bu "kent uzlaşısının" PKK'nın kentlerdeki etkisini artırdığını öne sürdü. İmamoğlu ve destekçileri suçlamaları uydurma olarak reddederek bunların kendisini Cumhurbaşkanı Recep Tayyip Erdoğan için siyasi bir tehdit olmaktan çıkarmak amacıyla tasarlandığını savundu. İstanbul Cumhuriyet Başsavcılığı ayrıca soruşturma kapsamında İmamoğlu'nun inşaat şirketine el konulduğunu ve genel müdürünün gözaltına alındığını duyurdu. İnternet gözlem kuruluşu NetBlocks'a göre hükümet İstanbul'da dört günlük eylem yasağı ilan etti, ana yolları kapattı ve Twitter, YouTube ve Instagram gibi sosyal medya platformlarına erişimi kısıtladı. İmamoğlu, İstanbul'daki Vatan Emniyet Müdürlüğü'ne götürüldü ve yargı süreci devam ederken burada gözaltında kaldı."
 Turkey.667.a:0 "Sorunlar Tırmanıyor"
 Turkey.667.b:0 "Sorunlar Tırmanıyor §Y(Konuşmasız)§!"
 Turkey.668.title:0 "Morgan Stanley Borsa Istanbul'dan Ayrildi"
 Turkey.668.desc:0 "Borsa İstanbul A.Ş., 19 Mart 2025'te Kamuyu Aydınlatma Platformu'na (KAP) yaptığı açıklamada Morgan Stanley Menkul Değerler'in borsadan çıkarıldığını duyurdu."
 Turkey.668.a:0 "Kararlarını Verdiler"
 Turkey.670.title:0 "Istanbul Barosu Yönetimi Görevden Alindi"
 Turkey.670.desc:0 "Siyasi motivasyonlu olduğu gerekçesiyle geniş çapta kınanan bir kararla İstanbul 2. Asliye Hukuk Mahkemesi, anayasa hukukçusu Prof. Dr. İbrahim Özden Kaboğlu başkanlığındaki İstanbul Barosu yönetim kurulunun tamamını görevden aldı. Karar, baronun Aralık 2024'te kuzey Suriye'deki bir hava saldırısında iki gazetecinin öldürülmesinin ardından yaptığı açıklamaya yanıt olarak geldi ve hükümetin hukuk kurumlarına ve bağımsız seslere yönelik baskısında yeni bir tırmanışa işaret ediyor."
 Turkey.670.a:0 "Hukuk Gölgede Kaldı"
 Turkey.672.title:0 "2 Nisan Boykot Kampanyasi"
 Turkey.672.desc:0 "Türkiye'de muhalefetin öncülük ettiği boykot, İstanbul Büyükşehir Belediye Başkanı Ekrem İmamoğlu'nun gözaltına alındığı 19 Mart'ta başladı. O gece ana muhalefet partisi Cumhuriyet Halk Partisi'nin Genel Başkanı Özgür Özel, İstanbul Büyükşehir Belediyesi binası önünde toplanan kalabalığa, televizyon kanallarının büyük gösterileri haber yapmadığı gerekçesiyle hükümet yanlısı medya kanallarını ve hükümetle bağlantılı şirketlerin bir listesini boykot etme çağrısında bulundu.\n\nSonraki günlerde insanlar aynı meydanda toplanmaya devam ederken Özel çağrılarını sürdürdü; hükümet yanlısı kanallara reklam vermeyi sürdüren yeni şirket ve markaları listeye ekledi ve halktan bu ürünleri boykot etmesini istedi. Parti bir internet sitesi bile kurdu; site günler sonra bir sulh ceza hâkimliği kararıyla erişime engellendi.\n\nArdından 1 Nisan'da Türkiye genelindeki öğrencilerin çağrılarına katılan Özel, halkı gün boyu sürecek bir ekonomik boykota çağırdı. Özel 1 Nisan'da "Bütün alışverişleri durdurun! Market, internet alışverişi, restoran, benzin, kahve; hiçbir şey almayın" dedi. Ülke genelinde büyük küçük pek çok işletme dayanışma amacıyla dükkânlarını ve e-ticaret sitelerini kapattığını duyurdu. Yerel basının aktardığına göre İstanbul Cumhuriyet Başsavcılığı ise 1 Nisan'da yaptığı açıklamada, geleneksel ve sosyal medyada ekonomik faaliyeti engellemeye yönelik "bölücü söylemin" "nefret ve ayrımcılık" ile "halkı kin ve düşmanlığa tahrik" suçlarını oluşturduğu gerekçesiyle soruşturma başlattığını bildirdi."
 Turkey.672.a:0 "Şok Edici"
 Turkey.674.title:0 "LeMan Protestolari"
 Turkey.674.desc:0 "Bir mizah dergisinin Hz. Muhammed'in karikatürünü yayımladığı iddialarının ardından pazartesi günü İstanbul'da arbede çıktı; polis kalabalığı dağıtmak için plastik mermi ve biber gazı kullandı. Olaylar, İstanbul Cumhuriyet Başsavcılığı'nın LeMan dergisinin editörleri hakkında "dinî değerleri alenen aşağılayan" bir karikatür yayımladıkları gerekçesiyle gözaltı kararı vermesinin ardından yaşandı."
 Turkey.674.a:0 "Dinî Bir Mesele"
 Turkey.673.title:0 "Ana Muhalefet Liderine Saldiri"
 Turkey.673.desc:0 "Türkiye'nin ana muhalefet partisinin lideri pazar günü İstanbul'da bir anma töreninden ayrılırken saldırıya uğradı. Televizyon görüntülerine göre Cumhuriyet Halk Partisi (CHP) Genel Başkanı Özgür Özel, kent merkezindeki Atatürk Kültür Merkezi'nden çıkarken beyaz saçlı bir adam yanına yaklaşarak yüzüne tokat attı.\n\nCumartesi günü hayatını kaybeden Kürt yanlısı siyasetçi Sırrı Süreyya Önder için düzenlenen anma törenine katılan Özel'in yara almadığı belirtildi. İstanbul Cumhuriyet Başsavcılığı'na göre şüpheli gözaltına alındı. İçişleri Bakanlığı daha sonra saldırganın 2004'te iki çocuğunu öldüren ve 2020'de şartlı tahliyeyle serbest kalan 66 yaşında bir erkek olduğunu açıkladı. Cumhuriyet gazetesi, saldırganın 19 ve 17 yaşlarındaki oğlunu ve kızını vurarak ve bıçaklayarak öldürdüğünü yazdı. Olay, Türkiye'de siyasetçilerin güvenliğine ilişkin endişeleri yeniden alevlendirdi."
 Turkey.673.a:0 "Ülke İstikrarsızlaşıyor"
 Turkey.675.title:0 "Tunç Soyer'in Tutuklanmasi"
 Turkey.675.desc:0 "1 Temmuz'da İzmir Büyükşehir Belediyesi'ne yönelik operasyon kapsamında gözaltına alınan ve bu sabah adliyeye sevk edilen 119 kişiden 99'u tutuklama talebiyle hâkimliğe sevk edildi. Tutuklananlar arasında eski İzmir Büyükşehir Belediye Başkanı Tunç Soyer ve CHP İzmir İl Başkanı Şenol Aslanoğlu ile birlikte 33 kişi daha bulunuyor."
 Turkey.675.a:0 "CHP Baskı Altında"
 Turkey.676.title:0 "Antalya, Adana ve Adiyaman'in CHP'li Belediye Baskanlari Gözaltina Alindi"
 Turkey.676.desc:0 "Antalya, Adana ve Adıyaman'daki CHP'li belediyelere yönelik operasyon, İstanbul'da başlayıp ardından üçüncü büyük şehir İzmir'e yayılan soruşturmaların hemen ardından geldi. Ana muhalefet partisi Cumhuriyet Halk Partisi'nin (CHP) belediyelerine yönelik süren operasyonlar kapsamında Adana Büyükşehir Belediye Başkanı Zeydan Karalar ve Adıyaman Belediye Başkanı Abdurrahman Tutdere cumartesi sabahı gözaltına alındı."
 Turkey.676.a:0 "CHP Baskı Altında"
 Turkey.677.title:0 "Metan Gazi 12 Türk Askerinin Canini Aldi"
 Turkey.677.desc:0 "Milli Savunma Bakanlığı, kuzey Irak'ta bir mağarada arama yapan on iki Türk askerinin metan gazına maruz kalarak hayatını kaybettiğini açıkladı. Pazar günü düzenlenen arama-tarama operasyonu sırasında en az 19 personel gaza maruz kaldı ve hemen hastaneye kaldırıldı."
 Turkey.677.a:0 "Aman Tanrım"
 Turkey.678.title:0 "Sözcü TV Ekranlari Karartti"
 Turkey.678.desc:0 "Türkiye'nin muhalefet yanlısı kanalı Sözcü TV, yerel saatle çarşamba gece yarısı 10 günlüğüne yayınını durdurdu; pek çok kişi bunu ülkede muhalefete yönelik artan baskının yeni bir cephesi olarak görüyor. Kanalın sunucusu Serap Belovacıklı salı günü izleyicilerine "Saat 12'yi vurduğunda Sözcü TV ekranları karartacak. Ama pes edecek miyiz? Hayır! Sizin sesiniz olmaktan vazgeçmeyeceğiz" dedi.\n\nKarartma, son bir haftada keskin biçimde tırmanan ana muhalefet partisi Cumhuriyet Halk Partisi'ne (CHP) yönelik genişleyen baskının ortasında geldi. Aralarında geçen yılki tarihî yerel seçimlerde el değiştiren eski iktidar partisi kalelerinin de bulunduğu üç CHP'li belediye başkanı daha gözaltına alındı ve bu durum ülkedeki demokrasinin durumuna ilişkin artan endişeleri körükledi."
 Turkey.678.a:0 "Muhalefet Medyası Kontrolümüz Altında Olmalı"
 Turkey.679.title:0 "Yapay Zekâ Sohbet Botu Grok Türkiye'de Engellendi"
 Turkey.679.desc:0 "Yasak, Grok'un ürettiği ve Türkiye Cumhuriyeti'nin kurucusu Mustafa Kemal Atatürk'e, Cumhurbaşkanı Recep Tayyip Erdoğan'a ve Hz. Muhammed'e hakaret içerdiği iddia edilen içeriklerden kaynaklanıyor.\n\nMahkemenin Grok'u engelleme kararını Medya ve Hukuk Çalışmaları Derneği (MLSA) duyurdu. Hukukçu Yaman Akdeniz'e göre bu yasakla Türkiye, Grok yapay zekâ aracına sansür uygulayan dünyadaki ilk ülke oldu."
 Turkey.679.a:0 "Bağımsız Yapay Zekâ mı?"
 Turkey.680.title:0 "Özgür Kabadayi'nin Tutuklanmasi"
 Turkey.680.desc:0 "CHP'li belediyelere yönelik operasyonlar sürüyor. Sabahın erken saatlerinde İstanbul polisi Şile Belediyesi'ne baskın düzenledi. Belediye Başkanı Özgür Kabadayı gözaltına alındı. CHP Grup Başkanvekili Ali Mahir Başarır operasyonu "bir mafya düzeni" olarak nitelendirdi. CHP Genel Başkan Yardımcısı Burhanettin Bulut ise "Bu çürümüş düzeni kabul etmiyoruz!" dedi."
 Turkey.680.a:0 "CHP Baskı Altında"
 Turkey.681.title:0 "Muharrem Ince CHP'ye Geri Döndü"
 Turkey.681.desc:0 "CHP'li belediyelere yönelik operasyonlar sürüyor. Sabahın erken saatlerinde İstanbul polisi Şile Belediyesi'ne baskın düzenledi. Belediye Başkanı Özgür Kabadayı gözaltına alındı. CHP Grup Başkanvekili Ali Mahir Başarır operasyonu "bir mafya düzeni" olarak nitelendirdi. CHP Genel Başkan Yardımcısı Burhanettin Bulut ise "Bu çürümüş düzeni kabul etmiyoruz!" dedi."
 Turkey.681.a:0 "Muhalefet Birleşiyor"
 Turkey.682.title:0 "Erdogan Yeni Koalisyonunu Açikladi"
 Turkey.682.desc:0 "PKK'nın sembolik silah bırakma töreninin ardından Cumhurbaşkanı Recep Tayyip Erdoğan üç parti fikrine bağlılığını bir kez daha yineledi. Kızılcahamam kampında konuşan Cumhurbaşkanı Erdoğan, "Üç parti olarak bu süreci güvenle yönetmekte kararlıyız" dedi. \n\nEleştirilere açıkça yanıt veren Erdoğan, yeni sürecin "tüm siyasi partilere önemli sorumluluklar yüklediğini" savundu. Cumhurbaşkanı'nın sürecin üç parti tarafından yürütüleceği yönündeki açıklaması diğer parti liderlerinden eleştiri alıyor."
 Turkey.682.a:0 "Üçlü Koalisyon Şekilleniyor"
 Turkey.683.title:0 "Fatih Altayli'nin Tutuklanmasi"
 Turkey.683.desc:0 "Kıdemli gazeteci ve yorumcu Fatih Altaylı, 23 Haziran 2025'te YouTube kanalında Osmanlı padişahlarının tahttan indirildiği ya da öldürüldüğü tarihî örnekleri ele aldığı bir video yorumu yayımlamasının ardından tutuklandı. Savcılar, bu yorumların Cumhurbaşkanı Recep Tayyip Erdoğan'a yönelik bir tehdit oluşturduğunu öne sürdü.\n\n1962 doğumlu Altaylı, 2023'te geleneksel medyadan ayrılarak kendi YouTube kanalını kuran eski bir köşe yazarı ve televizyon sunucusu; kanalı o zamandan bu yana ülkenin en popüler kanallarından biri hâline geldi. 21 Haziran'da yayımlanan videoda Osmanlı İmparatorluğu'ndaki siyasi hesap verebilirliğin tarihî örneklerine değinerek "Bu, padişahını beğenmediğinde ya da istemediğinde boğan bir millettir" dedi. Videonun internette yayılmasının ardından Altaylı gözaltına alındı ve tutuklandı.\n\nOn bir gazeteci sendikası, medya kuruluşu ve sivil toplum kuruluşu tutuklamayı kamuoyu önünde kınadı. Ortak açıklamada Altaylı'nın yorumlarının tamamen gazetecilik yorumu kapsamında olduğu, şiddete teşvik etmediği ve herhangi bir tehdit içermediği vurgulandı. Türkiye Gazeteciler Sendikası (TGS) tutuklamayı hukuka aykırı ve siyasi motivasyonlu olarak nitelendirdi: "Hiçbir gazeteci düşünceleri, yazıları ya da eleştirileri nedeniyle hedef alınamaz; yargı böyle bir hedef göstermenin aracı olarak kullanılamaz.""
 Turkey.683.a:0 "Muhalif Gazeteciler Hedefte"
 Turkey.684.title:0 "Ismail Saymaz'in Tutuklanmasi"
 Turkey.684.desc:0 "19 Mart 2025'te polis, daha önce Halk TV ve Sözcü gibi kuruluşlarda çalışan serbest gazeteci ve televizyon yorumcusu İsmail Saymaz'ı İstanbul'daki evine düzenlenen baskında gözaltına aldı. Saymaz'ın avukatı, gazetecinin gözaltında gazetecilik faaliyetleri, bağlantıları ve Gezi protestolarını haberleştirirken yaptığı sosyal medya paylaşımları hakkında sorgulandığını; bu kapsamda iş insanı Osman Kavala, avukat Can Atalay, film yapımcısı Çiğdem Mater ve mimar Mücella Yapıcı gibi olayları organize etmekten hüküm giyen bazı kişilerle iletişiminin de sorulduğunu söyledi.\n\n21 Mart'ta İstanbul 10. Sulh Ceza Hâkimliği, 2013'teki ülke çapındaki Gezi Parkı protestoları sırasında "hükümeti devirmeye teşebbüse yardım" suçlamasıyla Saymaz hakkında ev hapsi kararı verdi. Gözaltına alınmasından birkaç gün önce Saymaz, yurt dışına çıkış yasağı getirildiğini ve pasaportuna el konulduğunu açıklamıştı."
 Turkey.684.a:0 "Muhalif Gazeteciler Hedefte"
 Turkey.685.title:0 "TÜRKSAT 6A"
 Turkey.685.desc:0 "15 Aralık 2014'te imzalanan anlaşmaya göre uydu, TÜBİTAK Uzay Teknolojileri Araştırma Enstitüsü (TÜBİTAK UZAY) liderliğinde Türk Havacılık ve Uzay Sanayii (TUSAŞ), ASELSAN ve CTech Bilişim Teknolojileri A.Ş. işbirliğiyle uzmanlar tarafından yerli olarak geliştirilip üretilecekti. TUSAŞ, uydu yapısının ve ısıl kontrol, kimyasal itki, kablo demeti ile görevi desteklemek için gereken mekanik yer destek ekipmanları gibi alt sistemlerin tasarım ve üretiminden sorumluydu. TUSAŞ ve TÜBİTAK UZAY, uydu yerleşik veri işleme ile uydu komuta ve kontrol yazılımlarının geliştirilmesinde işbirliği yaptı. Montaj, entegrasyon ve test faaliyetlerini TUSAŞ Uydu Montaj, Entegrasyon ve Test Tesisi'nde birlikte gerçekleştirdiler.\n\nUydu bir SpaceX Falcon 9 roketiyle fırlatıldı."
 Turkey.685.a:0 "İyi Haber"
 Turkey.686.title:0 "2025 Istanbul Depremi"
 Turkey.686.desc:0 "23 Nisan 2025'te TSİ 12.49.10'da İstanbul yakınlarında, Tekirdağ'ın Marmara Ereğlisi ilçesinin 28 km (17 mil) güneydoğusunda, Marmara Denizi'nde Mww 6,2 büyüklüğünde bir deprem meydana geldi. Bir kişi kalp krizi sonucu hayatını kaybetti, 359 kişi yaralandı ve Marmara Bölgesi genelinde orta düzeyde hasar kaydedildi."
 Turkey.686.a:0 "Riski Hissediyor musun?"
 Turkey.687.title:0 "Ümit Özdag'in Tahliyesi"
 Turkey.687.desc:0 "Mülteci karşıtı Zafer Partisi'nin Genel Başkanı Ümit Özdağ, Türk Ceza Kanunu'nun 216. maddesi uyarınca "halkı kin ve düşmanlığa tahrik" suçundan 2 yıl 4 ay 3 gün hapis cezasına çarptırılmasının ardından bugün cezaevinden tahliye edildi. Karar, İstanbul 18. Asliye Ceza Mahkemesi tarafından Silivri'deki Marmara Cezaevleri Yerleşkesi'nde görülen duruşmada verildi. Özdağ yaklaşık beş aydır tutukluydu.\n\nDuruşmaya Ankara Büyükşehir Belediye Başkanı Mansur Yavaş, muhalefet milletvekilleri ve Türkiye Barolar Birliği Başkanı Erinç Sağkan dahil pek çok siyasi ve hukuki isim katıldı. Destekçileri Özdağ'ı mahkeme salonuna girerken alkışladı; bazıları duruşma başlamadan önce İstiklal Marşı'nı okudu."
 Turkey.687.a:0 "Dışarıda"
 Turkey.688.title:0 "Türkiye'de Kuzey Isiklari"
 Turkey.688.desc:0 "Jeomanyetik fırtına nedeniyle Türkiye genelinde kuzey ışıkları geniş çapta gözlemlendi. Türkiye Uzay Ajansı (TUA), dün gece Türkiye'de gözlemlenen kuzey ışıklarının bir güneş patlamasının tetiklediği jeomanyetik fırtınadan kaynaklandığını ve bu durumun kuzey ışıklarının orta enlemlerde görülmesini olağan hâle getirdiğini açıkladı."
 Turkey.688.a:0 "Muhteşem"
 Turkey.689.title:0 "IYI Parti Müsavat Dervisoglu'nu Yeni Genel Baskani Seçti"
 Turkey.689.desc:0 "İYİ Parti, son seçim yenilgisinin ardından düzenlenen kurultayda Müsavat Dervişoğlu'nu yeni genel başkanı seçti. Partinin grup başkanı ve İzmir milletvekili olan Dervişoğlu, genel başkanlık seçimini 611 oyla kazandı.\n\n27 Nisan'daki seçim, ilk iki turda hiçbir aday salt çoğunluğu sağlayamadığı için üç tur sürdü. Rakibi, partinin meclis grup başkanı Koray Aydın 548 oy aldı."
 Turkey.689.a:0 "Yeni Bir Genel Başkan mı?"
 Turkey.691.title:0 "Erdogan Sisi ile Baristi ve Anlasma Yapti"
 Turkey.691.desc:0 "Cumhurbaşkanı Recep Tayyip Erdoğan ve Mısır Cumhurbaşkanı Abdülfettah es-Sisi, Suriye rejiminin düşmesinden bu yana ilk kez perşembe günü bir araya gelerek Suriye, Gazze ve ikili ilişkileri görüştü.\n\nKahire'deki D-8 Ekonomik İşbirliği Örgütü zirvesi marjında yapılan görüşmede Erdoğan, Türkiye'nin Suriye'nin birliğine ve 13 yıllık iç savaşın ardından yeniden inşasına desteğini sürdüreceği sözünü verdi. 8 Aralık'ta Beşar Esad'ı iktidardan deviren Suriyeli muhaliflerin başlıca destekçisi olan Türkiye'nin aksine Mısır hükümeti uzun süredir İslamcı eğilimli muhalefet yerine Esad'ı tercih ediyordu. Esad'ın düşüşü, Kahire'de 2013'te iktidardan uzaklaştırılan Müslüman Kardeşler'in yeniden güçlenme ihtimaline dair endişelere yol açtı."
 Turkey.691.a:0 "Peki"
 Turkey.693.title:0 "CHP'nin 2025 Mitingleri"
 Turkey.693.desc:0 "Ana muhalefet lideri Özgür Özel, 24 Nisan'da yaptığı açıklamada Cumhuriyet Halk Partisi'nin (CHP) İstanbul Büyükşehir Belediye Başkanı Ekrem İmamoğlu'nun tutuklanmasını protesto etmek ve erken seçim talep etmek için düzenlediği mitinglerin çok geniş bir siyasi yelpazeyi bir araya getirdiğini söyledi.\n\nAnkara'daki Sol Parti Genel Merkezi'ni ziyaretinin ardından gazetecilere konuşan Özel, "Sosyal demokratların, sosyalist demokratların, muhafazakâr demokratların, milliyetçi demokratların ve Kürt demokratların meydanlarda omuz omuza durduğu değerli bir süreç yaşıyoruz" dedi.\n\nÖzel başkanlığındaki CHP heyetinde genel başkan yardımcıları Gül Çiftci, Gamze Taşcıer ve Yalçın Karatepe yer alırken Sol Parti'yi parti sözcüleri Önder İşleyen, İsmail Hakkı Tombul, Gizem Özdem ve İlknur Başer temsil etti. Özel, "Bu süreç kalıcı olabilir ve Türkiye'nin umududur. Muhalefet olarak ve iktidara oy verdiği hâlde bugün yaşananları doğru bulmayan milyonlar olarak öncelikli talebimiz demokrasi ve adalettir" dedi."
 Turkey.693.a:0 "Direnecekler"
 Turkey.694.title:0 "2025 Türkiye Protestolari"
 Turkey.694.desc:0 "İstanbul Büyükşehir Belediye Başkanı Ekrem İmamoğlu ile 100'den fazla muhalefet üyesi ve protestocunun Türk makamlarınca gözaltına alınıp tutuklanmasının ardından 19 Mart 2025'te Türkiye genelinde protestolar başladı. Gösteriler, 2028 cumhurbaşkanlığı seçiminin başlıca muhalefet adayı ve Cumhurbaşkanı Recep Tayyip Erdoğan'ın baş siyasi rakibi olan İmamoğlu'na yönelik, katılımcıların siyasi motivasyonlu olarak nitelendirdiği hukuki işlemlere karşı güçlü bir halk tepkisini temsil ediyordu.\n\nGösteriler CHP ile pek çok başka siyasi parti, kuruluş ve dernek tarafından destekleniyor. Başta İstanbul, Ankara ve İzmir olmak üzere Türkiye'nin neredeyse tüm şehirlerinde yüz binlerce kişi protesto yapıyor; en büyük kalabalık İstanbul Büyükşehir Belediyesi binası önünde toplanıyor. Üniversite öğrencileri bu protestolarda önemli bir rol oynuyor.\n\nProtestocular sağdan sola geniş bir ideolojik yelpazeyi temsil ediyor. Bu bağlamda Cumhuriyet'in sembolleri, özellikle de Atatürk, gösteriler boyunca birleştirici bir çerçeve ve ortak referans noktası olarak sıkça kullanılıyor.\n\nProtestolar bir ekonomik kriz ortamında yaşanıyor. Türk lirası, İmamoğlu'nun tutuklanmasını izleyen üç günde ABD doları karşısında yüzde 16,3 değer kaybetti."
 Turkey.694.a:0 "Genel İstikrarsızlık İşaretleri"
 Turkey.695.title:0 "Saraçhane Mitingleri"
 Turkey.695.desc:0 "Akşam saatlerinde CHP'nin çağrısıyla binlerce kişi İstanbul Saraçhane'deki İstanbul Büyükşehir Belediyesi binası önünde toplandı. Göstericiler "Kurtuluş yok tek başına, ya hep beraber ya hiçbirimiz" gibi sloganlar attı ve "Hükümet istifa" diye seslendi.\n\nCHP Genel Başkanı Özgür Özel ve İmamoğlu'nun eşi Dilek İmamoğlu burada konuşma yaptı.\n\nÖzel, "Bugün milletin iradesi bir yargı darbesiyle elinden alınıyor" dedi.\n\nÖzel, İmamoğlu'nun tek aday olduğu, CHP'nin cumhurbaşkanı adayını belirlemek için 23 Mart pazar günü yapılacak ön seçimi hatırlattı:\n\n"Pazar günü binlerce, on binlerce, milyonlarca hep birlikte sokaklarda, sandıklarda, meydanlarda olacağız. 86 milyonun tamamını... mücadeleye, ayağa kalkmaya çağırıyorum.""
 Turkey.695.a:0 "Kaosa Hazırlanıyorlar"
 Turkey.696.title:0 "CHP'nin Yozgat'taki Ikonik Mitingi"
 Turkey.696.desc:0 "CHP, Yozgat'ta binlerce vatandaşın katılımıyla bir miting düzenledi. Miting öncesinde çiftçiler yaklaşık bin traktörden oluşan bir konvoy oluşturdu. CHP Genel Başkanı Özgür Özel miting alanına çiftçilerle birlikte traktörlerle geldi. Mitingde mesajı okunan CHP'nin tutuklu cumhurbaşkanı adayı Ekrem İmamoğlu erken seçimin altını çizerek "Her derdin çaresi milletin hakemliğidir" dedi. Mitingde konuşan çiftçi Abdullah Ceylan, "Devlet turpla şalgamla yönetilmez. Adaletle, hukukla yönetilir" dedi. CHP Genel Başkanı Özgür Özel ise "Dünün mağduru, bugünün zalimi Erdoğan. Bu mertlik değil, bu yiğitlik değil. Bu korkakça bir davranıştır" dedi."
 Turkey.696.a:0 "İşler Değişiyor"
 Turkey.697.title:0 "Merkez Bankasi Faizi 47,5'e Indirdi"
 Turkey.697.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 250 baz puan indirerek yüzde 47,5'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.697.a:0 "Enflasyon Soğuyor"
 Turkey.698.title:0 "Merkez Bankasi Faizi 45'e Indirdi"
 Turkey.698.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 250 baz puan indirerek yüzde 45'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.698.a:0 "Enflasyon Soğuyor"
 Turkey.699.title:0 "Merkez Bankasi Faizi 42,5'e Indirdi"
 Turkey.699.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 250 baz puan indirerek yüzde 42,5'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.699.a:0 "Enflasyon Soğuyor"
 Turkey.700.title:0 "Merkez Bankasi Faizi 46'ya Yükseltti"
 Turkey.700.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 350 baz puan artırarak yüzde 46'ya yükseltti. Ekrem İmamoğlu'nun tutuklanması gibi olaylar Türk ekonomisinde derin yaralar açtı. Bu derin yaralar da faiz artışlarını tetikledi."
 Turkey.700.a:0 "OVP'ye Bir Darbe Daha"
 Turkey.701.title:0 "Merkez Bankasi Faizi 43'e Indirdi"
 Turkey.701.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 300 baz puan indirerek yüzde 43'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.701.a:0 "Enflasyon Soğuyor"
 Turkey.702.title:0 "Türkiye'de Mülteci Karsiti Olaylar"
 Turkey.702.desc:0 "Suriyeli bir mültecinin yedi yaşındaki Suriyeli bir kız çocuğuna (sonradan kendi kuzeni olduğu ortaya çıktı) cinsel saldırıda bulunduğu söylentilerinin sosyal medyada yayılmasının ardından Kayseri'de şiddet olayları patlak verdi. Protestolar İstanbul, Hatay, Adana, Urfa, Bursa, Gaziantep, Konya, İzmir ve Antalya gibi başka yerlere de yayıldı. Protestocular sokaklarda Türk bayrakları sallayıp bozkurt işareti yaptı. Protestolarda "Erdoğan istifa!" ve "Ülkemde mülteci istemiyorum" gibi sloganlar atıldı.\n\nSuriyelilere ait onlarca mülk ve araç ateşe verildi. Olaylarda yaralananlar arasında on dört polis ve bir itfaiyeci de vardı. Maslak'taki bir restoranda elinde bıçak olan bir Türk, aralarında milyarderler Halid el-Fevzan ve İbrahim el-Hadisi'nin de bulunduğu Suudi iş insanlarının masasına yaklaşarak kesme hareketleri ve bozkurt işareti yaptı. Bu kişi daha sonra tutuklandı. Serik'te üç genç tarafından bıçaklanan 15 yaşındaki Suriyeli Ahmed en-Naif hastanede hayatını kaybetti."
 Turkey.702.a:0 "Gerginlik Tırmanıyor"
 Turkey.703.title:0 "Eskisehir'de Biçakli Saldiri"
 Turkey.703.desc:0 "12 Ağustos'ta Eskişehir'de bıçaklı bir saldırgan sosyal medyada canlı yayın yaparken sivillere saldırdı ve beş kişiyi yaraladı. Gözaltına alınan şüpheli tutuklandı; üzerinde Nazi sembolleriyle süslenmiş teçhizat bulunduğu tespit edildi."
 Turkey.703.a:0 "Ne?!"
 Turkey.704.title:0 "Erdogan-Feyzioglu Tartismasi"
 Turkey.704.desc:0 "Erdoğan, Feyzioğlu'nun konuşmasını "Yanlış konuşuyorsun" diyerek kesti. Feyzioğlu, Erdoğan'a "Neyi yanlış konuşuyorum Sayın Başbakan?" diye sordu. Başbakan ise "Böyle bir terbiyesizlik olamaz" yanıtını verdi. Feyzioğlu kürsüden "Terbiyesizlik yapmadım, kimseye terbiyesiz demeyi de uygun görmem. Gayet yapıcı bir konuşmaydı" karşılığını verdi.\n\nBunun üzerine Cumhurbaşkanı Gül'ün durdurma çabalarına rağmen ayağa kalkan Erdoğan, "Senin böyle bir hukuki hakkın yok. Ama maalesef yönetmelik gereği böyle bir şeye söz veriyoruz. Siyasi konuşma yapıyorsun. Sayın Cumhurbaşkanı 25 dakika konuştu, sen bir saattir konuşuyorsun. Van'la ilgili söylediklerin tamamen yalan. Bütün kinini kusuyor" dedi."
 Turkey.704.a:0 "İşte Bir Tartışma"
 Turkey.705.title:0 "Bursa'da Orman Yangini"
 Turkey.705.desc:0 "Türkiye'nin kuzeybatısındaki Bursa'yı çevreleyen ormanlık dağlarda gece boyunca hızla yayılan yangınlar, kentin doğu banliyölerinin üzerindeki gece gökyüzünü kızıla boyadı. Haziran sonundan bu yana ülkede her gün onlarca büyük orman yangını çıkıyor; hükümet cuma günü iki batı ili İzmir ve Bilecik'i afet bölgesi ilan etti.\n\nBursa Valiliği pazar günü yaptığı açıklamada, 1.900'den fazla itfaiyeci alevlerle mücadele ederken kuzeydoğudaki köylerden 1.765 kişinin güvenli bir şekilde tahliye edildiğini bildirdi. Çevredeki ormanlar yanarken Bursa'yı başkent Ankara'ya bağlayan otoyol trafiğe kapatıldı."
 Turkey.705.a:0 "Önlemleri Alın"
 Turkey.706.title:0 "Riza Akpolat'in Tutuklanmasi"
 Turkey.706.desc:0 "Ana muhalefet partisi Cumhuriyet Halk Partisi'nden (CHP) İstanbul'un lüks semti Beşiktaş'ın Belediye Başkanı Rıza Akpolat, cuma sabahı ihalelerde yolsuzluk suçlamasıyla tutuklanan 23 kişi arasında yer aldı.\n\nAkpolat ve diğer şüpheliler bu hafta başında belediyeyi, belediye şirketlerini ve İstanbul'un Avrupa yakasındaki Beşiktaş'ta kârlı ihaleler alan bir iş insanını kapsayan ihaleye fesat karıştırma soruşturması kapsamında gözaltına alınmıştı. Söz konusu iş insanı Aziz İhsan Aktaş da perşembe günü adliyede saatlerce ifade veren şüphelilerle birlikte tutuklandı. Belediye başkanının tutuklandığının açıklanmasının ardından CHP Beşiktaş Belediyesi binası önünde büyük bir kalabalık topladı ve tutuklamanın siyasi motivasyonlu olduğunu öne sürdü."
 Turkey.706.a:0 "CHP Baskı Altında"
 Turkey.707.title:0 "Alaattin Köseler'in Tutuklanmasi"
 Turkey.707.desc:0 "Bir Türk mahkemesi, ana muhalefet partisi Cumhuriyet Halk Partisi'nden (CHP) İstanbul Beykoz Belediye Başkanı Alaattin Köseler'in ihaleye fesat karıştırma ve görevi kötüye kullanma suçlamalarıyla tutuklanmasına karar verdi. Köseler, evine düzenlenen polis baskınının ardından 27 Şubat'ta özel kalem müdürü dahil 18 kişiyle birlikte gözaltına alınmıştı."
 Turkey.707.a:0 "CHP Baskı Altında"
 Turkey.708.title:0 "Hendek Operasyonlari"
 Turkey.708.desc:0 "Hendek operasyonları, Türk güvenlik güçlerinin Sur, Cizre ve Nusaybin merkezli olarak PKK militanlarına karşı yürüttüğü ortak askerî operasyonlardır. Operasyonların yapıldığı bazı bölgelerde sokağa çıkma yasağı ilan edildi, bazıları geçici özel güvenlik bölgesi ilan edildi. PKK militanlarının etkisiz hâle getirildiği, hendeklerin kapatıldığı, barikatların kaldırıldığı ve güvenliğin yeniden sağlandığı bölgelerde sokağa çıkma yasakları kaldırıldı."
 Turkey.708.a:0 "Onları Yok Etmeliyiz!"
 Turkey.709.title:0 "Sahte Diploma Skandali"
 Turkey.709.desc:0 "Türkiye'deki sahte diploma ve ehliyet skandalı gündemdeki yerini korurken İçişleri Bakanı Ali Yerlikaya salı günü süren operasyonlar kapsamında 197 şüphelinin yakalandığını, 37'sinin tutuklandığını ve 150'sinin adli kontrol altına alındığını açıkladı. Sosyal medya hesabından operasyonların ayrıntılarını paylaşan Yerlikaya, "7 Ocak'ta 23 ilde ve 23 Mayıs'ta 16 ilde eş zamanlı olarak düzenlenen iki koordineli operasyonda toplam 197 şüpheli yakalandı. Bunlardan 37'si tutuklandı, 150'si adli kontrol altına alındı" dedi.\n\nSahte belgelerle elektronik imza (e-imza) üretilmesi ve kamu sistemlerine yasa dışı erişim konusunda Yerlikaya, ilk operasyon dalgasının Ankara Cumhuriyet Başsavcılığı tarafından yürütüldüğünü açıkladı. Soruşturma "resmî belgede sahtecilik, Ölçme, Seçme ve Yerleştirme Merkezi hizmetlerine ilişkin ihlaller ve bilişim sistemlerine yetkisiz erişim" suçlarına odaklandı. Çalışmalara Ankara Siber Suçlarla Mücadele Şube Müdürlüğü öncülük etti. Yerlikaya, Adana, Mersin, Hatay, Ankara ve İstanbul'daki "TÜRKTRUST" ve "E-İMZATR" elektronik sertifika hizmet sağlayıcılarının şube ve ofislerinde e-imza başvurusu yapmak ve e-imza üretmek için sahte ehliyet ve T.C. kimlik kartlarının kullanıldığını da ekledi.\n\nBu e-imzalar daha sonra kamu kurumlarının sistemlerine yetkisiz erişim sağlanarak yasa dışı faaliyetler yürütmek için kullanıldı. 7 Ocak'ta Ankara merkezli 23 ilde düzenlenen eş zamanlı operasyonda 126 şüpheli yakalandı, 17'si tutuklandı."
 Turkey.709.a:0 "Ne Büyük Rezalet!"
 Turkey.710.title:0 "Editörün Notlari (15.01.2026)"
 Turkey.710.desc:0 "Mod bu günlerde sık sık düzeltme güncellemesi alıyor. Yaşayabileceğiniz aksaklıklar için özür dileriz. Modda karşılaştığınız sorunları bildirmekten çekinmeyin. Size en kısa sürede dönüş yapacağız."
 Turkey.710.a:0 "Mutlu Yıllar!"
 Turkey.711.title:0 "Çanakkale'de Orman Yangini"
 Turkey.711.desc:0 "Türkiye'nin kuzeybatısındaki Çanakkale'nin Gelibolu Yarımadası'nda çıkan orman yangını nedeniyle Çanakkale Boğazı'ndaki deniz trafiği kısmen durduruldu ve birkaç köy tahliye edildi.\n\nSalı günü yerel saatle (GMT+3) 16.05 sıralarında Eceabat ilçesine bağlı Kumköy yakınlarında başlayan yangın bir tarladan ormanlık alana hızla sıçradı ve itfaiye ekiplerinin geniş çaplı müdahalesine neden oldu."
 Turkey.711.a:0 "Kötü Görünüyor"
 Turkey.712.title:0 "Balikesir Depremi"
 Turkey.712.desc:0 "ABD Jeolojik Araştırmalar Kurumu (USGS) depremin büyüklüğünü Mww 6,1 olarak bildirdi. Merkez üssü Balıkesir'in Bigadiç ilçesinin 10 km (6,2 mil) güney-güneybatısındaydı. Kandilli Rasathanesi depremin Alakır ve Sındırgı ilçeleri yakınlarında, 7,7 km (4,8 mil) derinlikte meydana geldiğini açıkladı. Depremin merkez üssü, 1969 Demirci depreminden sorumlu olduğu düşünülen Simav fay zonunun batı ucuna yakın konumda."
 Turkey.712.a:0 "Ne Büyük Felaket"
 Turkey.713.title:0 "Aydin Belediye Baskani Çerçioglu Saf Degistirdi"
 Turkey.713.desc:0 "Batıdaki Aydın ilinin Büyükşehir Belediye Başkanı Özlem Çerçioğlu, perşembe günü artan anlaşmazlıklar nedeniyle ana muhalefet partisi Cumhuriyet Halk Partisi'nden (CHP) ayrıldığını açıkladı. CHP'den ayrılan Özlem Çerçioğlu AKP'ye katıldı."
 Turkey.713.a:0 "Hoş Geldin!"
 Turkey.714.title:0 "Inan Güney'in Tutuklanmasi"
 Turkey.714.desc:0 "İstanbul'da bir mahkeme, dün gece geç saatlerde muhalefetin yönetimindeki İstanbul Büyükşehir Belediyesi (İBB) ile bağlantılı süren yolsuzluk soruşturması kapsamında Beyoğlu Belediye Başkanı İnan Güney ve 16 kişiyi tutukladı."
 Turkey.714.a:0 "CHP Baskı Altında"
 Turkey.715.title:0 "Radar Gözetimi Skandali"
 Turkey.715.desc:0 "ASELSAN üretimi yeni radar sistemlerinin ülke genelindeki otoyollara yerleştirilmesinin ardından kamuoyu öfkesi doruğa ulaştı. Hükümet başlangıçta bunları "millî güvenlik varlıkları" ve "ileri trafik güvenliği teknolojisi" olarak lanse etse de gerçek vatandaşlar için acı bir şekilde netleşti: Radarlar öncelikle sürücüleri sıkı bir şekilde izlemek ve trafik cezalarını artırmak için kurulmuştu. Hız cezalarında ve otomatik kesilen cezalardaki ani artış, devletin yerli teknolojiyi gözetim yoluyla halktan "vergi" toplamak için kullandığı suçlamalarına yol açtı ve istikrarda gözle görülür bir düşüşe neden oldu."
 Turkey.715.a:0 "Yeni Gelir Kapısı mı?"
 Turkey.716.title:0 "Gebze'de Bina Çökmesi Felaketi"
 Turkey.716.desc:0 "Sanayinin kalbi Gebze, yerel bir felaketle sarsıldı. Çok katlı birkaç konut ve ticari bina aniden çöktü. İlk incelemeler maliyet düşürme önlemlerinin, standart dışı betonun ve belediye denetiminin tamamen yokluğunun sorumlu olduğuna işaret ediyor. Aileler enkazdan çıkarılırken inşaat sektöründe hesap sorulması yönündeki kamuoyu talebi sağır edici boyuta ulaştı. Bölgedeki altyapı ciddi şekilde zarar gördü ve acil devlet müdahalesi gerekiyor."
 Turkey.716.a:0 "Aman Tanrım!"
 Turkey.717.title:0 "Kirim Konvoyuna Pusu"
 Turkey.717.desc:0 "Rus kuvvetleri Kırım yakınlarında deniz konvoylarını durdurup saldırdı. Çıkarlarımız ve Karadeniz'deki hassas denge göz önüne alındığında bu saldırganlık denizdeki otoritemize meydan okuyor ve bizi deniz refakat politikalarımızı yeniden gözden geçirmeye zorluyor. Ankara'daki şahinler savaş hazırlığının artırılmasını talep ederken böyle bir provokasyonun diplomatik bedeli siyasi sermayemize ağır bir yük getiriyor."
 Turkey.717.a:0 "Off!"
 Turkey.718.title:0 "Babacan ve Simsek Görüsmede"
 Turkey.718.desc:0 "Ekonominin ağır topları Ali Babacan ve Mehmet Şimşek'in Türk ekonomisinin geleceğine ilişkin üst düzey görüşmeler yaptığı görüldü. İşbirlikleri, uluslararası piyasaları rahatlatacak şekilde daha ortodoks maliye politikalarına geçişe işaret ediyor. Yol haritaları uzun vadeli ekonomik büyüme ve uluslararası yatırımcı güveni vaat etse de kemer sıkmanın "acı reçetesini" uygulamanın siyasi bedeli çok büyük."
 Turkey.718.a:0 "Yeni Öncelikler"
 Turkey.719.title:0 "Ankara'da Libya Uçagi Düstü"
 Turkey.719.desc:0 "Diplomatik bir görevdeki Libya askerî uçağı Ankara'nın eteklerinde düştü. Olay ciddi bir diplomatik mahcubiyete yol açtı ve hava sahamızda uçan yabancı uçakların bakımına ilişkin endişeleri artırdı. Yurt dışındaki askerî angajmanlarımıza verilen siyasi destek sert bir darbe aldı."
 Turkey.719.a:0 "Trajik Bir Başarısızlık"
 Turkey.720.title:0 "Balikesir'de Deprem"
 Turkey.720.desc:0 "Güçlü bir deprem Balıkesir bölgesini salladı. Can kaybı sınırlı kalsa da yerel altyapıya ve elektrik şebekesine verilen zarar büyük. Bölgesel bir ekonomik durgunluğu önlemek için yeniden inşa hemen başlamalı. Hükümet, yerel ekonominin tamamen çökmesini önlemek için önemli kaynaklar ayırmalı."
 Turkey.720.a:0 "AFAD'ı Seferber Edin"
 Turkey.721.title:0 "Barzani Türkiye'yi Ziyaret Etti"
 Turkey.721.desc:0 "Neçirvan Barzani resmî bir ziyaret için Şırnak'a geldi. Görüşmeler bölgesel güvenlik, enerji boru hatları ve sınır ötesi militanlığa karşı ortak mücadeleye odaklanıyor. Ziyaret bazı milliyetçi çevreler için hassas bir konu olmaya devam ediyor. Ziyaret bölgesel istikrarı güçlendirdi, ancak partimizin milliyetçi tabanında sürtüşmeye yol açtı."
 Turkey.721.a:0 "Bu Gerçekten Resmî mi?"
 Turkey.722.title:0 "Millî Köpek Parklari Girisimi"
 Turkey.722.desc:0 "Kentsel yaşamı modernleştirmek ve hayvanseverlerin kaygılarını gidermek amacıyla hükümet, büyük şehirlerde özel "köpek parkları" yapılmasını finanse etti. Şehirliler arasında popüler olsa da bazı eleştirmenler bu fonların başka yerlerde kullanılabileceğini savunuyor. Yine de parklar İstanbul ve Ankara'nın beton ormanlarında evcil hayvan sahiplerinin yaşam kalitesini tartışmasız biçimde artırdı."
 Turkey.722.a:0 "Hav Hav Hav!"
 Turkey.723.title:0 "Imamoglu Hâkim Karsisinda"
 Turkey.723.desc:0 "Ekrem İmamoğlu suçlamalarla yüzleşmek için bir kez daha hâkim karşısına çıktı. Duruşmalar adliyeye büyük destekçi kalabalıkları çekti ve hukuki bir meseleyi muhalefet için önemli bir siyasi toplanma noktasına dönüştürdü. Hükümet geçici bir taktik avantaj elde etse de farkında olmadan İmamoğlu'nun popülerliğini artırıyor."
 Turkey.723.a:0 "Muhalefetin Direnişi Sürüyor"
 Turkey.724.title:0 "F-35'e Dönüs Müzakereleri"
 Turkey.724.desc:0 "Cumhurbaşkanı Erdoğan, F-35 Müşterek Taarruz Uçağı programına yeniden katılmayı amaçlayan büyük bir diplomatik atak başlattı. S-400 alımının ardından yıllarca dışlanan Ankara, Pentagon'un gözüne yeniden girmenin yolunu arıyor. Müzakereler yıpratıcı; yoğun lobi çalışmaları ve önemli siyasi tavizler gerektiriyor. Hava Kuvvetleri'nin beşinci nesil kabiliyete şiddetle ihtiyacı olsa da süreç siyasi gücümüzü tüketiyor."
 Turkey.724.a:0 "U Dönüşü Yapmamız Gerekiyor"
 Turkey.725.title:0 "Mahkemenin Fatih Altayli Karari"
 Turkey.725.desc:0 "Mahkeme, tanınmış gazeteci Fatih Altaylı hakkındaki kararını açıkladı. Karar basın özgürlüğü ve devlete yönelik kamusal eleştirinin sınırları hakkında sert bir tartışma başlattı. Karar, yorumlarını "kışkırtıcı" bulanları tatmin etse de muhalif medyayı birleştirdi."
 Turkey.725.a:0 "Basın Bir Savaş Alanı Olmaya Devam Ediyor"
 Turkey.726.title:0 "GAIN'e El Konulmasi"
 Turkey.726.desc:0 "Dijital medya sektörü için şok edici bir hamleyle hükümet, GAİN dijital yayın platformuna el koymak üzere kayyum atadı. "Millî güvenlik kaygılarını" gerekçe gösteren devlet, bağımsız dijital içeriğin son kalelerinden birini fiilen etkisiz hâle getirdi. Bu hamle hükümete mesajını yaymak için güçlü bir medya kuruluşu üzerinde daha tam kontrol sağlasa da uluslararası yatırımcıları daha da tedirgin etti."
 Turkey.726.a:0 "Buna İhtiyacımız Var!"
 Turkey.727.title:0 "Gürsel Tekin Meselesi"
 Turkey.727.desc:0 "Gürsel Tekin'in son kamuoyu açıklamaları CHP içinde ve genel siyasi ortamda büyük yankı uyandırdı. Parti içi politikalara yönelik eleştirileri, muhalefetin birlik görüntüsünü bir miktar zedeledi. Partinin mevcut yönünü kamuoyu önünde sorgulayarak iktidar ittifakına bolca koz verdi."
 Turkey.727.a:0 "İç Çatlaklar Görünür Hâle Geliyor"
 Turkey.728.title:0 "Bayrampasa Krizi"
 Turkey.728.desc:0 "İbrahim Karaman'ın da adının geçtiği bir dizi tartışmalı idari kararın ardından Bayrampaşa Belediyesi'nde kaos patlak verdi. Siyasi müdahale ve yerel yönetimde kötü idare suçlamalarının halk gösterilerine ve yerel yöneticilerle merkezî hükümet arasında sürtüşmeye yol açmasıyla durum hızla tırmandı. Bayrampaşa'daki kargaşa yerel istikrarsızlığa neden olsa da hükümetin duruma sert müdahalesi bazılarına otorite imajı verirken diğerleri bunu demokrasi açısından bir gerileme olarak görüyor."
 Turkey.728.a:0 "Neyse!"
 Turkey.729.title:0 "Imrali Ziyareti Tartismasi"
 Turkey.729.desc:0 "İmralı cezaevi yerleşkesine yakın zamanda yapılan üst düzey bir ziyarete ilişkin bilgiler basına sızdı. Bu tür ziyaretler her zaman siyasi açıdan hassastır ve yeni bir "çözüm süreci" ya da güvenlik stratejisinde değişiklik olacağı yönündeki spekülasyonları körükler. Hükümet ağzını sıkı tutsa da bir ziyaret yapıldığı ihtimali bile siyasi atmosferi değiştirdi."
 Turkey.729.a:0 "#TerörsüzTürkiye"
 Turkey.730.title:0 "Özgür Özel Kurultayda Yeniden Seçildi"
 Turkey.730.desc:0 "Özgür Özel, CHP Kurultayı'nda güçlü bir konuşma yaptı. Reform ve değişim mesajı parti tabanında karşılık buldu ve ana muhalefet lideri olarak konumunu güçlendirdi. Partinin siyasi gücü şu an iç yapılanmaya harcansa da demokratik hareketin uzun vadeli popülerliği artıyor."
 Turkey.730.a:0 "Muhalefet Saldırmanın Yeni Yollarını Buluyor"
 Turkey.731.title:0 "Papa Volkswagen Arena'da"
 Turkey.731.desc:0 "Tarihî ve son derece alışılmadık bir etkinlikle Papa, İstanbul'daki Volkswagen Arena'da bir buluşma düzenledi. Katolik liderin büyük bir Türk salonunda konuştuğu görüntüler tüm dünyaya yayınlandı. Bu, Türkiye'nin inançlar arasında köprü olma kararlılığının güçlü bir sembolü olsa da daha köktenci kesimleri soğuttu."
 Turkey.731.a:0 "Dinler Arasında Bir Zeytin Dalı"
 Turkey.732.title:0 "Rus Orlan IHA'sinin Sizmasi"
 Turkey.732.desc:0 "Sınırlarımız içinde düşen bir Rus Orlan-10 İHA'sı ele geçirildi. Bu yalnızca teknik bir arıza değil; egemenliğimizin açık bir ihlali. Rus "gözlerinin" topraklarımızın bu kadar derinlerinde bulunması Milli Savunma Bakanlığı'nda skandala yol açtı ve sınır güvenliğimize duyulan kamu güvenini sarstı."
 Turkey.732.a:0 "Sınırı Güvenceye Alın"
 Turkey.733.title:0 "Sadettin Saran'in Gözaltina Alinmasi"
 Turkey.733.desc:0 "Tanınmış iş insanı ve Fenerbahçe Başkanı Sadettin Saran gözaltına alındı. Hem iş hem de spor dünyasında büyük nüfuza sahip bir isim olan Saran'ın gözaltına alınması özel sektörde şok etkisi yarattı. Ortaya çıkan belirsizlik, yatırımcılar sıradakinin kim olacağını beklerken piyasa istikrarında düşüşe neden oldu."
 Turkey.733.a:0 "Olur Böyle Şeyler"
 Turkey.734.title:0 "THY Boeing Satin Aldi"
 Turkey.734.desc:0 "Türk Hava Yolları, yeni bir Boeing filosu satın almak için dev bir anlaşmayı tamamladı. Bu, kısa vadede millî hazineyi zorlasa da THY'nin küresel bir havacılık lideri olarak konumunu sağlamlaştırıyor. Hazine ciddi şekilde etkilendi, ancak havacılık üzerinden "yumuşak gücümüz" hiç bu kadar yüksek olmamıştı."
 Turkey.734.a:0 "Etki Alanımızı Genişletiyoruz..."
 Turkey.735.title:0 "Yeni Kota Kararlari"
 Turkey.735.desc:0 "İhracat ve ithalat kotalarına ilişkin yeni kararlar TOBB lobisinin sert direnişiyle karşılaştı. İşletmeler yeni düzenlemelere uyum sağlamakta zorlanıyor, bu da sanayi istikrarında düşüşe yol açıyor. İş dünyasının önde gelenleri bu kotaların yeniliği boğduğunu ve yapay kıtlıklar yarattığını savunuyor."
 Turkey.735.a:0 "Artık Her Şey Denetim İstiyor!"
 Turkey.736.title:0 "Papa Ankara'yi Ziyaret Etti"
 Turkey.736.desc:0 "İstanbul'daki halka açık etkinliğinin ardından Papa, Ankara'daki Millî Kütüphane'de yetkililerle bir araya geldi. Ziyarette tarihî el yazmalarının korunması ve kültürel diyalog ön plandaydı. Bu üst düzey diplomasi uluslararası itibarımızı ve siyasi prestijimizi büyük ölçüde artırdı."
 Turkey.736.a:0 "İyi Görünüyor!"
 Turkey.737.title:0 "CHP Istanbul Meselesi"
 Turkey.737.desc:0 "CHP İstanbul İl Başkanlığı'ndaki idari anlaşmazlıklar kamuoyunun gözü önüne çıktı. Sürtüşmeye rağmen partinin kentteki halk desteği üzerindeki hâkimiyeti güçlü kalmaya devam ediyor. Siyasi güç mücadelesi kaynakları tüketmeye devam etse de CHP'nin politikaları halkın gönlünü kazanmayı sürdürüyor."
 Turkey.737.a:0 "Muhalefet Direniyor!"
 Turkey.738.title:0 "ABD Ziyaretinde Skandal"
 Turkey.738.desc:0 "ABD'ye yapılan son diplomatik ziyaret bir dizi gaf ve lojistik aksaklığın gölgesinde kaldı. Ortaya çıkan medya şovu hükümetin uluslararası arenadaki prestijine zarar verdi. Önemli bir siyasi güç kaybı dışında elimizde hiçbir şey olmadan eve döndük."
 Turkey.738.a:0 "Tam Bir Felaket!"
 Turkey.739.title:0 "Merkez Bankasi Faizi 40,5'e Indirdi"
 Turkey.739.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 250 baz puan indirerek yüzde 40,5'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.739.a:0 "Enflasyon Soğuyor"
 Turkey.740.title:0 "Merkez Bankasi Faizi 39,5'e Indirdi"
 Turkey.740.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 100 baz puan indirerek yüzde 39,5'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.740.a:0 "Enflasyon Soğuyor"
 Turkey.741.title:0 "Merkez Bankasi Faizi 38'e Indirdi"
 Turkey.741.desc:0 "Türkiye Cumhuriyet Merkez Bankası (TCMB) dün politika faizini 150 baz puan indirerek yüzde 38'e çekti. Bu karar, bazı şeylerin istediğimiz yönde iyileşmeye başladığını gösteriyor."
 Turkey.741.a:0 "Enflasyon Soğuyor"
 TurkeyArms.1.title:0 "Hilmi Özkök Genelkurmay Baskani Oldu"
 TurkeyArms.1.desc:0 "Türk ordusunda yıllarca görev ve liderlik yapan Orgeneral Hilmi Özkök Genelkurmay Başkanlığına atandı. Stratejik kavrayışı ve taktik dehası ona hem meslektaşlarının hem de üstlerinin saygısını kazandırdı. Yeni Genelkurmay Başkanı olarak Türk Silahlı Kuvvetleri'ni bu zorlu dönemde yönlendirme sorumluluğu artık onun omuzlarında."
 TurkeyArms.1.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.2.title:0 "Yasar Büyükanit Genelkurmay Baskani Oldu"
 TurkeyArms.2.desc:0 "Önemli bir kararla Orgeneral Yaşar Büyükanıt, Türk Silahlı Kuvvetleri'nin yeni Genelkurmay Başkanı olarak atandı. Etkileyici askerî kariyeri ve güçlü liderlik nitelikleri ona bu saygın görevi kazandırdı. Genelkurmay Başkanı olarak Türkiye'nin çıkarlarını koruma gibi büyük bir sorumluluk artık onun omuzlarında."
 TurkeyArms.2.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.3.title:0 "Ilker Basbug Genelkurmay Baskani Oldu"
 TurkeyArms.3.desc:0 "Önemli bir gelişmeyle Orgeneral İlker Başbuğ, Türk Silahlı Kuvvetleri'nin Genelkurmay Başkanlığı görevini üstlendi. Olağanüstü askerî uzmanlığı ve millete sarsılmaz bağlılığı onu bu saygın göreve taşıdı. Yeni Genelkurmay Başkanı olarak Türkiye'yi koruma gibi kritik bir sorumluluk artık onun omuzlarında."
 TurkeyArms.3.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.4.title:0 "Isik Kosaner Genelkurmay Baskani Oldu"
 TurkeyArms.4.desc:0 "Önemli bir atamayla Orgeneral Işık Koşaner, Türk Silahlı Kuvvetleri'nin Genelkurmay Başkanlığı görevini üstlendi. Parlak askerî kariyeri ve kanıtlanmış liderlik becerileri ona bu saygın görevi kazandırdı. Yeni Genelkurmay Başkanı olarak Türkiye'nin egemenliğini savunma ve milleti küresel çatışmaların tehlikeli karmaşasında yönlendirme gibi kritik bir sorumluluk artık onun omuzlarında."
 TurkeyArms.4.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.5.title:0 "Necdet Özel Genelkurmay Baskani Oldu"
 TurkeyArms.5.desc:0 "Tarihî bir atamayla Orgeneral Necdet Özel, Türk Silahlı Kuvvetleri'nin Genelkurmay Başkanlığı görevini devraldı. Seçkin askerî kariyeri ve örnek liderlik becerileri ona bu saygın görevi kazandırdı. Yeni Genelkurmay Başkanı olarak Türkiye'nin çıkarlarını koruma gibi büyük bir sorumluluk artık onun omuzlarında."
 TurkeyArms.5.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.6.title:0 "Hulusi Akar Genelkurmay Baskani Oldu"
 TurkeyArms.6.desc:0 "Tarihî öneme sahip bir anda Orgeneral Hulusi Akar, Türk Silahlı Kuvvetleri'nin Genelkurmay Başkanlığına atandı. Seçkin askerî kariyeri ve olağanüstü liderliği ona bu saygın görevi kazandırdı."
 TurkeyArms.6.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.7.title:0 "Yasar Güler Genelkurmay Baskani Oldu"
 TurkeyArms.7.desc:0 "Önemli bir kararla Orgeneral Yaşar Güler, Türk Silahlı Kuvvetleri'nin Genelkurmay Başkanlığına atandı. Olağanüstü askerî kariyeri ve stratejik dehası ona bu saygın görevi kazandırdı."
 TurkeyArms.7.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyArms.8.title:0 "Metin Gürak Genelkurmay Baskani Oldu"
 TurkeyArms.8.desc:0 "Önemli bir gelişmeyle Orgeneral Metin Gürak, Türk Silahlı Kuvvetleri'nin Genelkurmay Başkanlığı görevini üstlendi. Olağanüstü askerî kariyeri ve stratejik dehası ona bu saygın görevi kazandırdı. Yeni Genelkurmay Başkanı olarak Türkiye'nin çıkarlarını koruma gibi kritik bir sorumluluk artık onun omuzlarında."
 TurkeyArms.8.a:0 "Ordu Yeniden Yapılanıyor"
 TurkeyForeign.1.title:0 "Türkiye'nin Artan Dogal Gaz Talebi"
 TurkeyForeign.1.desc:0 "Türkiye'deki doğal gaz talebinin hızla artmasıyla Rusya, TürkAkım boru hattının inşasına devam edip etmeme konusunda kritik bir kararla karşı karşıya. Proje, Türkiye'nin artan enerji ihtiyacını karşılamayı ve Rusya ile Türkiye arasındaki enerji işbirliğini geliştirmeyi amaçlıyor."
 TurkeyForeign.1.b:0 "Yatırımlarımızı Planlayın"
 TurkeyForeign.1.a:0 "Yatırım Yapmıyoruz"
 TurkeyForeign.2.title:0 "Rusya TürkAkim'i Teklif Etti"
 TurkeyForeign.2.desc:0 "Rusya, TürkAkım boru hattı projesi için Türkiye'ye kapsamlı bir plan sundu. Teklif, Türkiye'nin artan doğal gaz talebini karşılamak ve iki ülke arasındaki enerji işbirliğini geliştirmek için bir deniz boru hattı inşasını öngörüyor."
 TurkeyForeign.2.a:0 "Rus Teklifini Kabul Et"
 TurkeyForeign.2.b:0 "Buna İhtiyacımız Yok"
 TurkeyForeign.4.title:0 "Türkiye'yi Irak Savasi'na Davet Etmek"
 TurkeyForeign.4.desc:0 "ABD 2002'de Irak Savaşı stratejisini planlarken Türkiye'nin koalisyon güçlerine katılmaya davet edilip edilmeyeceği konusunda kritik bir karar gündeme geldi. Türkiye'nin çatışmaya dahil olmasının avantajlarını ve risklerini tartmamız gerekiyor."
 TurkeyForeign.4.a:0 "Onlarsız Daha İyiyiz!"
 TurkeyForeign.4.b:0 "Askerî İşbirliği Daveti Gönder"
 TurkeyForeign.6.title:0 "Türkiye'deki Konsoloslugumuza Saldiri!"
 TurkeyForeign.6.desc:0 "Türkiye'de ciddi bir olay yaşandı: Konsolosluğumuz saldırıya uğradı. Durum gerginliği tırmandırdı ve Türkiye ile diplomatik ilişkilerimiz için ciddi bir tehdit oluşturuyor."
 TurkeyForeign.6.a:0 "Ne Olay Ama"
 TurkeyForeign.7.title:0 "Türk-Rus Krizi: Düsürülen Uçak"
 TurkeyForeign.7.desc:0 "Ciddi bir olay yaşandı: Türk kuvvetleri bir Rus askerî uçağını düşürdü. Olay diplomatik bir fırtına kopardı ve iki ülke arasındaki gerginliği şiddetlendirdi."
 TurkeyForeign.7.a:0 "Egemenliğimizi Kabul Ettirelim"
 TurkeyForeign.7.b:0 "Özür Dile ve Soruşturma Başlat"
 TurkeyForeign.8.title:0 "Türkiye Uçagimizi Düsürdü"
 TurkeyForeign.8.desc:0 "Bir Rus askerî uçağı Türk kuvvetleri tarafından düşürüldü; değerli bir uçak ve personel kaybettik. Olay bir krize yol açtı ve Rusya, saldırganlık olarak algılanan bu eyleme nasıl karşılık vereceğine dair kritik bir kararla karşı karşıya."
 TurkeyForeign.8.a:0 "Bu Kabul Edilemez!"
 TurkeyForeign.9.title:0 "Rus Uçagi Hava Sahamizi Ihlal Etti"
 TurkeyForeign.9.desc:0 "Bir Rus askerî uçağı Türk hava sahasını ihlal ederek egemen topraklarımıza girdi. Olay diplomatik bir krize yol açtı ve Türkiye bu provokasyona nasıl karşılık vereceğine dair kritik bir kararla karşı karşıya."
 TurkeyForeign.9.a:0 "Düşürün!"
 TurkeyForeign.9.b:0 "Herhangi Bir Eylemden Kaçın"
 TurkeyForeign.10.title:0 "Türkiye Tavrini Ortaya Koydu"
 TurkeyForeign.10.desc:0 "Bir Rus askerî uçağının Türk hava sahasını ihlal etmesinin ardından Türkiye egemenliğini kabul ettirmek ve toprak bütünlüğünü korumak için kararlı bir tavır alıyor. Olay gerginliği ciddi şekilde artırdı."
 TurkeyForeign.10.a:0 "Bedelini Ödeyecekler!"
 TurkeyForeign.10.b:0 "Sakin Olalım"
 TurkeyForeign.11.title:0 "Filistin'e Gemi Gönderelim mi?"
 TurkeyForeign.11.desc:0 "Filistin'deki insani kaygılar sürerken ve Gazze halkına destek olma arzusuyla Türkiye'de, İsrail'in Gazze Şeridi'ne uyguladığı ablukayı kırmak için bir yardım filosu gönderme önerisi gündeme geldi. Filistin'e gemi gönderme kararı ağır bir karar; Türkiye'yi uluslararası arenada önemli zorluklar ve sonuçlarla karşı karşıya bırakıyor."
 TurkeyForeign.11.a:0 "Tabii"
 TurkeyForeign.11.b:0 "Hayır"
 TurkeyForeign.12.title:0 "Ablukayi Delmeye Çalisan Türk Gemilerine Yanit: Gerginlik Tirmaniyor"
 TurkeyForeign.12.desc:0 "Türk gemilerinin İsrail'in Gazze Şeridi ablukasını delme girişimleri sürerken İsrail, bu meydan okumaya nasıl yanıt vereceğine dair kritik bir kararla karşı karşıya. Durum ablukanın uygulanmasına ciddi bir tehdit oluşturuyor ve iki ülke arasındaki gerginliği tırmandırma potansiyeline sahip."
 TurkeyForeign.12.a:0 "Gemilerine Ateş Açın!"
 TurkeyForeign.12.b:0 "Herhangi Bir Eylemden Kaçın"
 TurkeyForeign.13.title:0 "Gelismis Hava Savunma Sistemlerine Ihtiyacimiz Var"
 TurkeyForeign.13.desc:0 "Türkiye, hava savunma kabiliyetlerini güçlendirmek için gelişmiş karadan havaya füze (SAM) sistemleri edinme konusunda kritik bir kararla karşı karşıya. Masadaki seçenekler Rus yapımı S-400 sistemi, Amerikan yapımı Patriot sistemi ya da bu sistemlerin hiçbirini almamak."
 TurkeyForeign.13.a:0 "Patriot Sipariş Et"
 TurkeyForeign.13.b:0 "Şaka mı? Bunlara İhtiyacımız Yok"
 TurkeyForeign.14.title:0 "ABD Teklifi Reddetti"
 TurkeyForeign.14.desc:0 "Şaşırtıcı bir gelişmeyle ABD, Türkiye'nin Patriot füze sistemi satın alma talebini resmen reddetti. Karar bölgedeki gerginliğin arttığı bir dönemde geldi ve Türkiye'nin ABD ile zaten karmaşık olan ilişkisini daha da gerdi; bu da savunma tedarik stratejisinde olası bir değişikliğe yol açabilir."
 TurkeyForeign.14.b:0 "O Zaman Hiçbir Şey Almıyoruz"
 TurkeyForeign.14.a:0 "S-400 Sipariş Et"
 TurkeyForeign.15.title:0 "Rusya Teklifi Reddetti"
 TurkeyForeign.15.desc:0 "Şaşırtıcı ve beklenmedik bir hamleyle Rusya, Türkiye'nin S-400 hava savunma sistemi edinme planını resmen reddetti. Karar iki ülke arasındaki gerginliğin arttığı bir dönemde geldi ve ikili ilişkileri daha da germe potansiyeline sahip."
 TurkeyForeign.15.a:0 "O Zaman Hiçbir Şey Almıyoruz"
 TurkeyForeign.16.title:0 "Türkiye Patriot Almak Istiyor"
 TurkeyForeign.16.desc:0 "Savunma kabiliyetlerini güçlendirmek ve ülkesinin güvenliğini ve egemenliğini sağlamak amacıyla Türkiye, ABD'den son teknoloji Patriot füzeleri edinmeye büyük ilgi gösterdi. Bu stratejik hamle, artan bölgesel gerginlikler ve değişen güvenlik ortamında geliyor."
 TurkeyForeign.16.a:0 "Satalım"
 TurkeyForeign.16.b:0 "Bunları Satmıyoruz"
 TurkeyForeign.17.title:0 "Türkiye S-400 Almak Istiyor"
 TurkeyForeign.17.desc:0 "Uluslararası ilgi uyandıran ve NATO müttefikleri arasında endişeye yol açan bir hamleyle Türkiye, Rusya'dan gelişmiş S-400 hava savunma sistemini satın alma isteğini dile getirdi. Bu karar değişen jeopolitik dinamikler ortamında geldi ve Türkiye'nin Batılı ortaklarıyla ilişkilerini daha da gerdi."
 TurkeyForeign.17.a:0 "Batı'yı Sarsma Vakti"
 TurkeyForeign.17.b:0 "Bunları Satmıyoruz"
 TurkeyForeign.18.title:0 "Perinçek Türkiye'nin Kontrolünü Ele Geçirdi"
 TurkeyForeign.18.desc:0 "Bir dizi siyasi çalkantı ve halkın verdiği yetkinin ardından karizmatik ve vizyoner siyasetçi Doğu Perinçek Türkiye'de iktidara geldi. Liderliğe yükselişi ülke tarihinde önemli bir dönüm noktası ve Perinçek diğer milletlerle yeni bir işbirliği ve dostluk dönemi başlatmak istiyor."
 TurkeyForeign.18.a:0 "İlginç"
 TurkeyF.1.title:0 "Ordu Yönetime El Koydu"
 TurkeyF.1.desc:0 "Ülkedeki huzursuzluk ve protestoları darbe gerekçesi olarak gören ordu sokaklara çıktı. Güçsüz iktidar da kısa sürede teslim oldu. Ordu, yaklaşık 3 yıl sürecek bir yönetimi devralacağını açıkladı."
 TurkeyF.1.a:0 "Demokrasiye Darbe"
 TurkeyF.3.title:0 "Türkiye Gülen'in Iadesini Istiyor"
 TurkeyF.3.desc:0 "Türkiye, Gülen'in ülkesine iade edilmesi için ABD'ye başvurdu. Efendim, Gülen'i Türkiye'ye teslim mi edelim, yoksa dik durup Gülen'i savunarak ülkemizde ağırlamaya devam mı edelim?"
 TurkeyF.3.a:0 "Amerika Birleşik Devletleri'nde kalacak"
 TurkeyF.3.b:0 "Onu Türkiye'ye gönderin"
 TurkeyF.4.title:0 "ABD Taleplerimizi Reddetti"
 TurkeyF.4.desc:0 "Beklediğimiz gibi ABD talebimizi reddetti; Gülen ABD'de kalacak. Bu, iktidarımıza karşı darbeyi ABD'nin planladığını kanıtlıyor."
 TurkeyF.4.a:0 "ABD bizi yok etmek istiyor!"
 TurkeyF.5.title:0 "ABD Taleplerimizi Kabul Etti"
 TurkeyF.5.desc:0 "ABD beklenmedik bir şekilde taleplerimizi kabul etti. Artık Gülen sorunu çözüldü. Amerika ile ilişkilerimizde olumlu adımlar atılıyor."
 TurkeyF.5.a:0 "ABD dost bir ülke"
 TurkeyF.6.title:0 "Brunson Tutuklandi"
 TurkeyF.6.desc:0 "15 Temmuz soruşturması sırasında bir "gizli tanık" savcılıkta Brunson aleyhine ifade verdi ve Evanjelik rahip Brunson, Gülen yapılanması ve PKK ile bağlantılı olduğu gerekçesiyle tutuklandı. Hakkında "devletin güvenliğine ilişkin gizli kalması gereken bilgileri siyasal veya askerî casusluk amacıyla temin etme" suçlamasıyla 20 yıl dahil toplam 35 yıla kadar hapis cezası istendi."
 TurkeyF.6.a:0 "Harekete Geçmek İyi Hissettiriyor"
 TurkeyF.7.title:0 "Amerikan Tepkisi"
 TurkeyF.7.desc:0 "Efendim, Türkler rahibimiz Brunson'ı tutuklayıp yargılıyor. Onu Türkiye'den kurtarmak için bir dizi yaptırım uygulayalım mı? Türkiye'ye yönelik yaptırımlar Türkiye ile ilişkilerimizi çok kötü etkileyecek."
 TurkeyF.7.a:0 "Onu geri istiyoruz!"
 TurkeyF.7.b:0 "İlişkileri riske atmayın"
 TurkeyF.8.title:0 "Amerika'nin Tepkisi"
 TurkeyF.8.desc:0 "ABD, Brunson'ı kendilerine teslim etmezsek bize yaptırım uygulamaya başlayacağını açıkladı. Böyle bir yaptırım başlarsa ekonomimiz kötü etkilenecek ve oy kaybedeceğiz. Efendim, Brunson'ı bırakalım mı?"
 TurkeyF.8.a:0 "Burada kalacak!"
 TurkeyF.8.b:0 "Her şey bitti! Onu ABD'ye geri gönderin"
 TurkeyF.9.title:0 "Ekonomi Bakani Berat Albayrak Istifa Etti"
 TurkeyF.9.desc:0 "Berat Albayrak akşam saatlerinde ekonomiden sorumlu bakanlık görevinden istifa ettiğini açıkladı. İstifası kısa süre sonra Erdoğan tarafından kabul edildi. Recep Tayyip Erdoğan'ın bu isabetli kararıyla ülke ekonomisinin düzelmesi bekleniyor."
 TurkeyF.9.a:0 "Ekonomi düzelmeli!"
 TurkeyF.10.title:0 "Türkiye Cumhuriyeti Bizi Birlesmeye Davet Ediyor"
 TurkeyF.10.desc:0 "Türkiye Cumhuriyeti bizi birleşmeye davet ediyor. Türkiye, birliğin Türk gücünü dünyaya taşıyacağına inanıyor. Efendim, kabul edelim mi etmeyelim mi?"
 TurkeyF.10.a:0 "Kabul Et"
 TurkeyF.10.b:0 "Reddet"
 TurkeyF.11.title:0 "Azerbaycan Teklifimizi Reddetti"
 TurkeyF.11.desc:0 "Azerbaycan teklifimizi reddetti. Bakü, birleşmenin dağınıklık ve düzensizlik getireceğine inanıyor; ayrıca Rusya ile ilişkilerini riske atmak istemiyor."
 TurkeyF.11.a:0 "Peki"
 TurkeyF.12.title:0 "Türk Televizyonunun Kurulusu"
 TurkeyF.12.desc:0 "Türk Birliği tarafından Türk TV kuruldu. Türk TV programları Azerice, Boşnakça, Türkmence, Kazakça, Kırgızca ve Özbekçe olarak Türkçe altyazıyla yayınlanıyor; belgeseller, sohbet programları, kültür ve müzik programlarının yanı sıra bölgeye özgü filmler ve diziler de yer alıyor. İzleyiciler ders programları aracılığıyla Türkçe öğrenme fırsatı da buluyor."
 TurkeyF.12.a:0 "Güzel Görünüyor"
 TurkeyF.13.title:0 "Türklerin Kabul Edilemez Yayilmaci Ültimatomu"
 TurkeyF.13.desc:0 "Türkler bize bir ültimatom gönderdi. Ültimatomda kabul edilemez şartlar var. Savaş yakın. Savaş hazırlıkları başlasın!"
 TurkeyF.13.a:0 "Devletimizi savunmalıyız!"
 TurkeyF.14.title:0 "Türkiye Batum'u Satin Almak Istiyor"
 TurkeyF.14.desc:0 "Türkiye Batum bölgesini bizden satın almak istiyor. Batum'u satalım mı satmayalım mı? Satarsak ekonomimize yardımı olur, ama barışımıza da zarar verebilir."
 TurkeyF.14.a:0 "Satalım"
 TurkeyF.14.b:0 "Batum bizimdir"
 TurkeyF.15.title:0 "Gürcistan Batum Teklifimizi Reddetti"
 TurkeyF.15.desc:0 "Gürcistan bölgede güçlenmemizi istemiyor. Bu yüzden Batum teklifimizi reddetti. Yükselen Türkiye'yi durduramayacaklar."
 TurkeyF.15.a:0 "Ah"
 TurkeyF.16.title:0 "NATO Teçhizat Birligi Oylamasi"
 TurkeyF.16.desc:0 "NATO, üye ülkeler arasında bir oylama başlattı: Yeterli evet oyu çıkarsa NATO teçhizatı tüm ülkeler için ortak hâle gelecek. Oylama başarılı olursa haberi gelecek; başarısız olursa gündeme bile gelmeyecek. Seçim sizin."
 TurkeyF.16.a:0 "Tüm NATO ülkeleri aynı silahları kullanmalı"
 TurkeyF.16.b:0 "Teçhizat birliğine ihtiyacımız yok"
 TurkeyF.17.title:0 "NATO Sanayilesme Oylamasi"
 TurkeyF.17.desc:0 "NATO, üye ülkeler arasında bir oylama başlattı. Oylamayı kabul eden ülkeler NATO çatısı altında bir sanayileşme programı başlatacak. Seçim sizin."
 TurkeyF.17.a:0 "NATO Sanayileşme Programı Güzel Görünüyor"
 TurkeyF.17.b:0 "NATO Sanayileşme Programına ihtiyacımız yok"
 TurkeyF.18.title:0 "NATO Silahlanma Oylamasi"
 TurkeyF.18.desc:0 "NATO, üye ülkeler arasında bir oylama başlattı. Oylamayı kabul eden ülkeler NATO çatısı altında bir silahlanma programı başlatacak. Seçim sizin."
 TurkeyF.18.a:0 "NATO Silahlanma Programı Güzel Görünüyor"
 TurkeyF.18.b:0 "NATO Silahlanma Programına ihtiyacımız yok"
 TurkeyF.19.title:0 "Türk Birlesme Teklifi"
 TurkeyF.19.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.19.a:0 "Güç birlikten doğar"
 TurkeyF.19.b:0 "Teklif cazip değil"
 TurkeyF.20.title:0 "Türk Birlesme Teklifi"
 TurkeyF.20.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.20.a:0 "Güç birlikten doğar"
 TurkeyF.20.b:0 "Teklif cazip değil"
 TurkeyF.21.title:0 "Türk Birlesme Teklifi"
 TurkeyF.21.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.21.a:0 "Güç birlikten doğar"
 TurkeyF.21.b:0 "Teklif cazip değil"
 TurkeyF.22.title:0 "Türk Birlesme Teklifi"
 TurkeyF.22.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.22.a:0 "Güç birlikten doğar"
 TurkeyF.22.b:0 "Teklif cazip değil"
 TurkeyF.23.title:0 "Türk Birlesme Teklifi"
 TurkeyF.23.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.23.a:0 "Güç birlikten doğar"
 TurkeyF.23.b:0 "Teklif cazip değil"
 TurkeyF.24.title:0 "Karabag Çatismasi"
 TurkeyF.24.desc:0 "Karabağ'ı elimizden alan Ermenileri Karabağ'dan kovma zamanı geldi. Karabağ Azerbaycan'dır!"
 TurkeyF.24.a:0 "Yaşasın!"
 TurkeyF.26.title:0 "Türk Dayatmasi"
 TurkeyF.26.desc:0 "Türkiye Cumhuriyeti, Kürt bölgeleri üzerindeki garantimizi kaldırmamızı ısrarla istiyor. Bunu yaparsak Kürt bölgeleri Türk yönetimine girecek ve bölgedeki gücümüz azalacak. Aksi yönde hareket edersek NATO'da büyük bir çatlak oluşabilir. Efendim, ne yapalım?"
 TurkeyF.26.a:0 "Türkler Kürt devletini yok etsin"
 TurkeyF.26.b:0 "Türkler Kürtleri rahat bıraksın"
 TurkeyF.27.title:0 "ABD Isgal Planimizi Kabul Etti"
 TurkeyF.27.desc:0 "ABD, Kürtlerle gireceğimiz savaşa yeşil ışık yaktı. ABD Kürdistan üzerindeki garantisini kaldıracak ve biz de bölgeye gireceğiz."
 TurkeyF.27.a:0 "Kürt Devletini Yok Etme Vakti"
 TurkeyF.28.title:0 "ABD Isgal Planimizi Reddetti"
 TurkeyF.28.desc:0 "ABD, Kürtlerle savaşımıza kırmızı ışık yaktı. ABD Kürdistan üzerindeki garantisini kaldırmayacak; Kürtlerle savaşa girersek ABD ile de savaşa girmiş olacağız. Bunun sonucunda NATO'da bir çatlak oluşacak ve diğer devletlerin savaşa girmesinin önü açılacak."
 TurkeyF.28.a:0 "ABD'nin sözleri umurumuzda değil"
 TurkeyF.29.title:0 "Türkiye Adalari Satin Almak Istiyor"
 TurkeyF.29.desc:0 "Türkiye'den beklenmedik bir teklif geldi. Türkiye, Yunanistan'ın adalarını 100 milyar dolar gibi çok yüksek bir bedelle satın almak istiyor. Efendim, bu teklife ne diyoruz? Kabul edip adaları bırakalım mı, yoksa satmayalım mı?"
 TurkeyF.29.a:0 "Bu Adaları Vermek Zorundayız"
 TurkeyF.29.b:0 "Saçma Bir Teklif"
 TurkeyF.30.title:0 "Yunanistan Teklifimizi Reddetti"
 TurkeyF.30.desc:0 "Yunanistan teklifimizden hoşlanmamış görünüyor. Adaları savaşmadan alamayacağımız anlaşıldı; yakında onlarla savaşmamız gerekecek."
 TurkeyF.30.a:0 "Bu bizim için iyi bir haber değil"
 TurkeyF.31.title:0 "Türk Koruma Teklifi"
 TurkeyF.31.desc:0 "Türkiye bize şartlı koruma vaat ediyor. Şartları, onların kukla devleti olmamız. Kukla devletleri olursak millî birliğimiz zayıflayacak, ama dış tehditlere karşı güçlü olacağız. Kabul etmezsek millî birliğimiz güçlenecek, ama dış tehditlere karşı pek bir şey yapamayacağız. Efendim, ne yapalım?"
 TurkeyF.31.a:0 "Koruma Şartlarını Kabul Et"
 TurkeyF.31.b:0 "Koruma Şartlarını Reddet"
 TurkeyF.32.title:0 "Bulgaristan Sartli Koruma Teklifimizi Reddetti"
 TurkeyF.32.desc:0 "Bulgaristan şartlı koruma teklifimizi reddetti. Bulgaristan'ı kendi hâline bırakmak zorundayız."
 TurkeyF.32.a:0 "Bu bizim için iyi bir haber değil"
 TurkeyF.33.title:0 "Türkiye Ermenistan'in Paylasilmasini Istiyor"
 TurkeyF.33.desc:0 "Türkiye'den birkaç diplomat, Ermenistan'ı Azerbaycan ile Türkiye arasında paylaşmak için bize geldi. Tekliflerini kabul edersek birlikte Ermenistan'la savaşa gireceğiz. Kabul etmezsek Ermenistan'la barış devam edecek."
 TurkeyF.33.a:0 "Ermenistan'ı Paylaşmalıyız"
 TurkeyF.33.b:0 "Komşularımızla Barış İçinde Kalmalıyız"
 TurkeyF.34.title:0 "Bakü Ermenistan'i Paylasma Planimizi Kabul Etti"
 TurkeyF.34.desc:0 "Bakü, Ermenistan'ı bölme önerimize olumlu yaklaşıyor. Türk Silahlı Kuvvetleri'ni Ermenistan sınırına getirme ve Ermenistan'ı Azerbaycan ile paylaşma zamanı geldi."
 TurkeyF.34.a:0 "Doğuyu Güvence Altına Alma Vakti"
 TurkeyF.35.title:0 "Bakü Ermenistan'i Paylasma Planimizi Reddetti"
 TurkeyF.35.desc:0 "Bakü, harekâtımızla pek ilgilenmeyerek Ermenistan'ı bölme planımızı reddetti. Ermenistan'ı tek başımıza işgal etmek zorundayız."
 TurkeyF.35.a:0 "Doğuyu Tek Başımıza Güvence Altına Almalıyız"
 TurkeyF.36.title:0 "ANAP ile DYP'nin Birlesmesi"
 TurkeyF.36.desc:0 "DYP ile ANAP'ın ortak olağanüstü kurultayında iki partinin birleşmesine karar verildi. Artık merkez sağ birleşiyor. Merkez sağın birleşmesi, iktidar için büyük bir oy oranına ulaşılmasını sağlayacak."
 TurkeyF.36.a:0 "Harika"
 TurkeyF.37.title:0 "Türkiye Sadabat Pakti'ni Yeniden Canlandirmak Istiyor"
 TurkeyF.37.desc:0 "Türkiye, Sadabat Paktı'nın yeniden canlandırılmasını istiyor. Bunun için istersek müzakerelere başlayabiliriz ya da müzakerelere girmeyerek Sadabat Paktı'nın yeniden canlanmasını engelleyebiliriz."
 TurkeyF.37.a:0 "Canlandırmaya Gerek Yok"
 TurkeyF.37.b:0 "Tabii"
 TurkeyF.38.title:0 "Tahran-Ankara Anlasmalari"
 TurkeyF.38.desc:0 "İran ile Türkiye arasındaki anlaşma resmen imzalandı. Anlaşma iki ülkenin birbirini korumasını öngörüyor. Türkiye İran'ın bağımsızlığını, İran da Türkiye'nin bağımsızlığını garanti edecek."
 TurkeyF.38.a:0 "İki Müslüman Ülke İçin Harika Haber"
 TurkeyF.39.title:0 "Kahire-Ankara Anlasmalari"
 TurkeyF.39.desc:0 "Mısır ile Türkiye arasındaki anlaşma resmen imzalandı. Anlaşma iki ülkenin birbirini korumasını öngörüyor. Türkiye Mısır'ın bağımsızlığını, Mısır da Türkiye'nin bağımsızlığını garanti edecek."
 TurkeyF.39.a:0 "İki Müslüman Ülke İçin Harika Haber"
 TurkeyF.40.title:0 "Türkiye Turu"
 TurkeyF.40.desc:0 "Mesut Yılmaz sokağa çıkarak halkı ve esnafı ziyaret etti, dertlerini dinledi. Mesut Yılmaz'ı gören halk çok mutlu oldu. Bu durum siyasi bir zafer."
 TurkeyF.40.a:0 "Ders Kitabı Gibi Popülizm"
 TurkeyF.41.title:0 "Türkiye'nin Talep Ettigi Referandum"
 TurkeyF.41.desc:0 "Türkiye bizi referanduma davet ediyor. İstekleri Kürt bölgesinin Türkiye'ye ilhakı. Kabul etmezsek sınırlarımızda silahlar patlamaya başlayacak ve insanlar ölecek. Efendim, bu Türklere ne cevap verelim?"
 TurkeyF.41.a:0 "Kabul Edilebilir"
 TurkeyF.41.b:0 "Ya İstiklal Ya Ölüm!"
 TurkeyF.42.title:0 "Kuzey Irak Yönetimine Savas Ilani"
 TurkeyF.42.desc:0 "Kürtler taleplerimizi kabul etmedi; bunun sonucunda Türk Silahlı Kuvvetlerimizle bu ülkeyi yok edeceğiz."
 TurkeyF.42.a:0 "Savaşa Hazırız!"
 TurkeyF.43.title:0 "Türk Birlesme Teklifi"
 TurkeyF.43.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.43.a:0 "Güç birlikten doğar"
 TurkeyF.43.b:0 "Teklif cazip değil"
 TurkeyF.44.title:0 "Türk Birlesme Teklifi"
 TurkeyF.44.desc:0 "Türkiye ile yapılan konferansların ardından Türkler bize bir birleşme teklifinde bulundu. Birleşirsek dünyada Türk milliyetçiliği ve Türk gücü yükselecek, ancak bu bize karşı muhalefete ve isyana da yol açabilir."
 TurkeyF.44.a:0 "Güç birlikten doğar"
 TurkeyF.44.b:0 "Teklif cazip değil"
 TurkeyF.45.title:0 "Tengri Inancina Dönüs"
 TurkeyF.45.desc:0 "Ülkemiz şu an Tengri inancına geri dönüyor. Tengriciliğe dönüşle ülkemizdeki terör azalacak ve Türk sevgisi en üst seviyelere çıkacak."
 TurkeyF.45.a:0 "Geleneksel İnanç En İyisidir!"
 TurkeyF.46.title:0 "Bir Han Seçimi"
 TurkeyF.46.desc:0 "Bugün itibarıyla yeni Türk hanımızı seçeceğiz. Efendim, Türklerin liderliğini kim üstlenecek, büyük Kağan kim olacak? Bu seçim Türklerin ve dünyanın kaderini kesin olarak değiştirecek, seçiminizi dikkatle yapın."
 TurkeyF.46.a:0 "Ülkücü Grup"
 TurkeyF.46.b:0 "Aliyev Ailesi"
 TurkeyF.46.c:0 "Genel Başkan Sayın Erdoğan"
 TurkeyF.46.d:0 "Kazak Liderliği"
 TurkeyF.47.title:0 "Okullardaki Gülen Baglantilari Temizlendi"
 TurkeyF.47.desc:0 "Okullarda Gülen yapılanmasıyla bağlantılar tarandı ve şüpheliler tek tek tutuklandı. Bir süre sonra şüpheliler olağan ve yasal sert baskıya dayanamayarak itiraf etti. Ülkemizdeki örgüt yuvalarını tek tek yok edeceğiz."
 TurkeyF.47.a:0 "Görev tamamlandı"
 TurkeyF.48.title:0 "Emniyetteki Gülen Baglantilari Temizlendi"
 TurkeyF.48.desc:0 "Gülen yapılanmasıyla bağlantılı polis memurları askerî ekiplerce tarandı ve şüpheliler tek tek tutuklandı. Bir süre sonra şüpheliler olağan ve yasal sert baskıya dayanamayarak itiraf etti. Ülkemizin güvenlik güçlerine bile sızmış bu örgütün yuvalarını tek tek yok edeceğiz."
 TurkeyF.48.a:0 "Görev tamamlandı"
 TurkeyF.49.title:0 "Ankara-Tahran PKK Karsiti Doktrini"
 TurkeyF.49.desc:0 "İran sıcak yaklaşımımıza sıcak karşılık verdi. İran ziyaretiniz sonucunda İran ile anlaşmaya vardık. Anlaşmaya varmamamız zaten mümkün değildi. Anlaşma uyarınca iki ülke PKK tehdidine karşı birliklerini teyakkuzda tutacak."
 TurkeyF.49.a:0 "Teröre Karşı Birlik"
 TurkeyF.50.title:0 "Ankara-Bagdat PKK Karsiti Doktrini"
 TurkeyF.50.desc:0 "Irak sıcak yaklaşımımıza sıcak karşılık verdi. Irak ziyaretiniz sonucunda Irak ile anlaşmaya vardık. Anlaşmaya varmamamız zaten mümkün değildi. Anlaşma uyarınca iki ülke PKK tehdidine karşı birliklerini teyakkuzda tutacak."
 TurkeyF.50.a:0 "Teröre Karşı Birlik"
 TurkeyF.51.title:0 "Ülkücülerle Anlasma"
 TurkeyF.51.desc:0 "CHP heyeti milliyetçilerin lideri Devlet Bahçeli'yi ziyaret etti. Ziyaretin ardından Devlet Bahçeli, doğudaki PKK tehdidini ezmek için ülkücüleri yönlendireceğini açıkladı."
