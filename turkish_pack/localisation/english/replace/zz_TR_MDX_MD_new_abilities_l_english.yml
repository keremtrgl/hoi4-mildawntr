 ABILITY_ARMORED_SPEARHEAD:0 "Zırhlı Öncü"
 ABILITY_ARMORED_SPEARHEAD_DESC:0 "Zırhlı birliklerimizi kullanarak düşman siperlerini mızrak ucuyla yarabiliriz."
 ABILITY_FLEXIBLE_DEFENSE:0 "Esnek Savunma"
 ABILITY_FLEXIBLE_DEFENSE_DESC:0 "Ordumuz şu anda düşmana karşı mevzileniyor. Ancak onlar savunmamızı yoklamaya başladı. Savunma duruşumuzda daha esnek olmaya başlamak çıkarımıza olabilir."
 ABILITY_WELL_PLANNED_ATTACK:0 "İyi Planlanmış Saldırı"
 ABILITY_WELL_PLANNED_ATTACK_DESC:0 "İyi planlanmış bir saldırı neredeyse her zaman iyi sonuç verir."
 ABILITY_DEEP_BATTLE:0 "Derin Muharebe"
 ABILITY_DEEP_BATTLE_DESC:0 "Muharebenin derinliği ana temas hattının dışında çok önemlidir. Haberleşme hatlarını bozmak, müstahkem noktaları zayıflatmak ve kanatlarda yenmek, doğrusal bir çatışmayı hızla derin bir muharebeye dönüştürebilir."
 ABILITY_INFILTRATION_ASSAULT:0 "Sızma Hücumu"
 ABILITY_INFILTRATION_ASSAULT_DESC:0 "Düşman hatlarına sızmak, düşmanı arkadan bozmayı ve yenmeyi kolaylaştırır."
