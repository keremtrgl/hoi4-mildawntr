 AGRI_experiencing_drought_TT:0 "Şu anda §YKuraklık§! yaşıyor"
 AGRI_not_experiencing_drought_TT:0 "Şu anda §YKuraklık§! §Ryaşamıyor§!"
 AGRI.1.t:0 "Olası Kuraklık Yaklaşıyor..."
 AGRI.1.d:0 "Tarım Bakanlığı'ndaki en iyi bilim insanlarımız ve uzmanlarımız kısa süre içinde bir kuraklık yaşanma ihtimalinden endişe ediyor; yağmur beklentisi de yok... Umarız her ihtimale karşı hazırlıklıyızdır."
 AGRI.1.A:0 "Dua edelim..."
 AGRI.2.t0:0 "Bilim İnsanları Yanılmış!"
 AGRI.2.d0:0 "Neyse ki bu sefer bilim insanları ve uzmanlar yanıldı, bu kez kuraklıktan kurtulduk ama bir dahaki sefere o kadar şanslı olmayabiliriz..."
 AGRI.2.A:0 "Kötü bir hasada hazırlanmalıyız"
 AGRI.2.B:0 "Kötü bir hasat mı? Peki ya berbat bir hasat?"
 AGRI.2.C:0 "Gerek yok! Bu sefer iyiydik, bir dahaki sefer de iyi olacağız!"
 AGRI.2.t1:0 "Bilim İnsanları Haklıymış! Bir Bakıma"
 AGRI.2.d1:0 "Bilim insanları ve uzmanlar yalnızca kısmen haklı çıktı; kuraklık yaşandı ancak [ROOT.GetName] topraklarında yalnızca bir iki bölgeyle sınırlı görünüyor. Başa çıkması çok zor olmamalı, ancak sorunu çözmezsek komşu bölgelere yayılabilir."
 AGRI.2.D:0 "Bu kadar kötü görünmüyor, kendi seyrini izlesin."
 AGRI.2.E:0 "Durumu çözmeye yardımcı olmak için biraz para ayırabiliriz."
 AGRI.2.F:0 "Bu acil müdahale gerektiriyor!"
 AGRI.2.G:0 "Belki abartı olur ama temkinli olmayı tercih ederiz."
 AGRI.2.t2:0 "Bilim İnsanları Haklıymış!"
 AGRI.2.d2:0 "Kuraklık bugün en şiddetli haline ulaştı; şimdiden onlarca ölü var ve önümüzdeki haftalarda çok daha fazlasının felakete yenik düşmesi bekleniyor. Bu vahim durumun daha da kötüleşmemesi için derhal harekete geçmeliyiz"
 AGRI.2.H:0 "Kendi seyrini izlemesine izin vermekten başka çaremiz yok."
 AGRI.2.I:0 "Her şeyi çözmeyecek ama hiç yoktan iyidir."
 AGRI.2.J:0 "Umarız bu, bir sonraki yağmurlara kadar idare ettirir."
 AGRI.2.K:0 "Bu stok için Allah'a şükür, gerektiği kadar kullanın!"
 AGRI.2.t3:0 "Yıkıcı Bir Kuraklık!"
 AGRI.2.d3:0 "Bu tam bir felaket... [ROOT.GetName] genelinde artık yaygınlaşmış görünen kuraklık yüzünden yüzlerce kişi ölü; komşu ülkelere de yayılması muhtemel. Elimizden geliyorsa durumu kontrol altına almalıyız..."
 AGRI.2.L:0 "Durduramayız, Allah bizi affetsin..."
 AGRI.2.M:0 "Keşke bu felaketi durduracak daha fazla şeyimiz olsaydı!"
 AGRI.2.N:0 "Bu hiç yeterli değil ama en kötüsünü hafifletmeye yardımcı olacaktır."
 AGRI.2.O:0 "Stokumuz bol, bu yeterli olacaktır, ancak maliyetli..."
 AGRI_neighbour.1.t:0 "Yerel Kuraklık [FROM.GetName] Ülkesini Etkiliyor!"
 AGRI_neighbour.1.d:0 "Komşularımızdan [FROM.GetName] kuraklık yaşıyor; neyse ki bir ölçüde yerel görünüyor ve durdurmak için çok az yardım yeterli olur. Yine de komşumuzun gönlünü kazanmak için biraz yardım gönderebiliriz."
 AGRI_neighbour.1.A:0 "[FROM.GetName] ülkesine yardım gönder"
 AGRI_neighbour.1.B:0 "Bundan kâr edebiliriz!"
 AGRI_neighbour.1.C:0 "Stoklarımızın durumu nasıl?"
 AGRI_neighbour.1.D:0 "Yardım mı? Kendi başlarının çaresine baksınlar!"
 AGRI_neighbour.10.t:0 "Komşumuz [FROM.GetName] Bize Yardım Gönderdi!"
 AGRI_neighbour.10.d:0 "[FROM.GetName], iyi komşuluğun ne demek olduğunu biliyor görünüyor ve kuraklığın etkisini azaltmak için bize biraz yardım gönderdi."
 AGRI_neighbour.10.A:0 "Harika"
 AGRI_neighbour.100.t:0 "Komşumuz [FROM.GetName] Yardım Göndermeyi Reddetti!"
 AGRI_neighbour.100.d:0 "[FROM.GetName], zor zamanda güvenilemeyeceğini gösteriyor; bu kuraklığın üstesinden kuşkusuz tek başımıza gelebiliriz ama biraz yardım güzel olurdu."
 AGRI_neighbour.100.A:0 "Neyse, bununla başa çıkmak o kadar da kötü değil."
 AGRI_neighbour.2.t:0 "Büyük Çaplı Kuraklık [FROM.GetName] Ülkesini Etkiliyor!"
 AGRI_neighbour.2.d:0 "Komşularımızdan [FROM.GetName] kuraklık yaşıyor; uzmanlar başlangıçta yerel kalacağını öngörmüştü ama yanıldılar. Durum beklenenden kötü olabilir; [FROM.GetName] yardımımızdan büyük fayda sağlar ve gelecekte bize kapılarını da açabilir."
 AGRI_neighbour.2.A:0 "[FROM.GetName] ülkesine yardım gönder"
 AGRI_neighbour.2.B:0 "Bundan kâr edebiliriz!"
 AGRI_neighbour.2.C:0 "Stoklarımızın durumu nasıl?"
 AGRI_neighbour.2.D:0 "Beceri sorunu gibi duruyor."
 AGRI_neighbour.20.t:0 "Komşumuz [FROM.GetName] Bize Yardım Gönderdi!"
 AGRI_neighbour.20.d:0 "[FROM.GetName], iyi komşuluğun ne demek olduğunu biliyor görünüyor ve kuraklığın etkisini azaltmak için bize biraz yardım gönderdi."
 AGRI_neighbour.20.A:0 "Harika"
 AGRI_neighbour.200.t:0 "Komşumuz [FROM.GetName] Yardım Göndermeyi Reddetti!"
 AGRI_neighbour.200.d:0 "[FROM.GetName], zor zamanda güvenilemeyeceğini gösteriyor; [FROM.GetName] tarafından kaderimize terk edilmiş görünüyoruz"
 AGRI_neighbour.200.A:0 "Alçaklar."
 AGRI_neighbour.3.t:0 "Devasa Çaplı Kuraklık [FROM.GetName] Ülkesini Etkiliyor!"
 AGRI_neighbour.3.d:0 "Komşularımızdan [FROM.GetName] kuraklık yaşıyor; uzmanlar bunun kolay halledilir bir durum olduğunu düşünüyordu ama yanıldılar. [FROM.GetName] topraklarının öngörülebilir gelecekte tamamen kuru ve çorak kalma ihtimali var; komşumuza yardım edeceksek bu hemen ve kapsamlı olmalı, bu sefer doğanın kazanmasına izin veremeyiz."
 AGRI_neighbour.3.A:0 "[FROM.GetName] ülkesine yardım gönder"
 AGRI_neighbour.3.B:0 "Bundan kâr edebiliriz!"
 AGRI_neighbour.3.C:0 "Stoklarımızın durumu nasıl?"
 AGRI_neighbour.3.D:0 "Şu an evde değiliz!"
 AGRI_neighbour.30.t:0 "Komşumuz [FROM.GetName] Bize Yardım Gönderdi!"
