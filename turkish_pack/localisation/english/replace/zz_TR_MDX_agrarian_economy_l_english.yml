l_english:
 agrarian_economy:0 "Tarıma Dayalı Ekonomi"
 agrarian_economy_desc:0 "[FROM.GetName] son derece yoksul bir ülkedir; ekonomisi ağırlıklı olarak tarımsal kazanca dayanır. Ülke yeni binyıla doğru modernleşirken halk tarlalarda çalışarak ekonomiye destek olacaktır.\n\n§Y$agrarian_economy$§!, §Y[ROOT.GetName]§! ülkesine haftada §Y$$§![?additional_income_agrarian_economy|+3] §YMilyar§! kazandırıyor.\n\n§RKişi başı GSYİH $$20.000'e ulaştığında sanayileşmiş sayılacağız ve tarım bonusunu kaybedeceğiz!§!"
 agri_farmer_opinion_TT:0 "Bu ulusal ruh sona erene kadar §Y$farmers$§! görüşü §G10§! artar"
 AGRI_standard_drought_ongoing:0 "Yerel Kuraklık Sürüyor"
 AGRI_standard_drought_ongoing_desc:0 "[ROOT.GetName] şu anda ülkenin belirli bölgelerine yeterli su ulaşmamasından kaynaklanan yerel bir kuraklık yaşıyor; durumun [ROOT.GetName] ya da komşuları için kötüleşmeden geçmesi muhtemel."
 AGRI_harsh_drought_ongoing:0 "Bölgesel Kuraklık Sürüyor"
 AGRI_harsh_drought_ongoing_desc:0 "[ROOT.GetName] şu anda ülkenin bütün bölgelerine yeterli su ulaşmamasından kaynaklanan bölgesel bir kuraklık yaşıyor; bu kuraklıktan [ROOT.GetName] komşularının da etkilenmesi muhtemel."
 AGRI_extreme_drought_ongoing:0 "Yaygın Kuraklık Sürüyor"
 AGRI_extreme_drought_ongoing_desc:0 "[ROOT.GetName] şu anda ülkenin geniş topraklarına yeterli su ulaşmamasından kaynaklanan ülke çapında bir kuraklık yaşıyor; [ROOT.GetName] için kuraklığın uzun süre etkisini sürdüreceği neredeyse kesin, [ROOT.GetName] komşularının da bundan dolaylı olarak etkilenme ihtimali yüksek."
