 AGRI_influencer.30.d:0 "[FROM.GetName], bir diplomatik ortaktan beklenenin ötesine geçti ve kuraklığın etkisini azaltmak için bize kapsamlı bir yardım gönderdi."
 AGRI_influencer.30.A:0 "Allah'a şükür!"
 AGRI_influencer.300.t:0 "[FROM.GetName] Yardım Göndermeyi Reddetti!"
 AGRI_influencer.300.d:0 "[FROM.GetName], zor zamanda güvenilemeyeceğini gösteriyor; Allah da [FROM.GetName] da bizi terk etti."
 AGRI_influencer.300.A:0 "[FROM.GetAdjective] bayrakları nerede? Yakılmaları gerek!"
 AGRI_random.1.t:0 "Çiftçiler Ekipman Eksikliğinden Şikâyetçi!"
 AGRI_random.1.d:0 "[THIS.GetName] ülkesine uygulanan ekonomik yaptırımlar yüzünden çiftçiler yeni, hatta bazı durumlarda çalışır durumda ekipman bulunmamasını protesto ediyor.\nÜç seçeneğimiz var: karaborsada şüpheli tiplerle ticaret yapmak, bizimle ticaret yapmaya istekli birini bulmaya çalışmak ya da elimizdekilerle idare etmek.\n\nNe yapalım [THIS.GetLeader]?"
 AGRI_random.1.A:0 "Şüpheli tipler mi? Onlar sadece iş insanı!"
 AGRI_random.1.B:0 "Ticaret yapacak birini bulmaya çalışalım"
 AGRI_random.1.C:0 "Öküzleriniz var, değil mi?"
 AGRI_random_black_market_TT:0 "§Y[THIS.GetNameWithFlag] Tarım Bakanı bir anlaşma yapmak için karaborsa bağlantılarına ulaşacak.§!"
 AGRI_random_embargo_trading_TT:0 "§Y[THIS.GetNameWithFlag] Tarım Bakanı bir anlaşma yapmak için diğer ülkelerdeki bağlantılarına ulaşacak.§!"
 AGRI_random.10.t1:0 "Sadece Nereden Geldiğini Sormayın"
 AGRI_random.10.d1:0 "Çiftçiler tedarik ettiğimiz ekipmandan memnun değil; ekipmanın kamyonun arkasından düştüğü yönündeki açıklamamızı yeterli bulmuyorlar. Hiç tedarik etmemiş olsaydık olacak kadar memnuniyetsiz değillerse bizim için başarıdır."
 AGRI_random.10.A:0 "Bunu alışkanlık haline getirmeyelim..."
 AGRI_random.10.t2:0 "Kaçakçılarla Silahlı Çatışma!"
 AGRI_random.10.d2:0 "Bunun için Tarım Bakanımızın kellesini isteyeceğiz! Kaçakçılarla anlaşma yapmaya çalışmak, paramızı almalarıyla kalmadı, ekipmanı da vermek istemediler; pek çok askerimiz soğukkanlılıkla kurşuna dizildi, bu kabul edilemez!"
 AGRI_random.10.B:0 "O piçler"
 AGRI_random.10.t3:0 "Parayı Alıp Kaçtılar..."
 AGRI_random.10.d3:0 "Neyse, Tarım Bakanımızın maaşı önümüzdeki on yıl boyunca kesilecek; aptal, kaçakçılarla anlaşma ayarlamış, onlar da ticaret heyetine ekipman için beklemelerini söylemiş, tahmin edersiniz ne oldu. 16 saat boyunca kaçakçıların dönmesini beklediler, korkunç."
 AGRI_random.10.C:0 "Lanet olsun."
 AGRI_random.100.t1:0 "Güzel Değiller Ama İş Görüyorlar"
 AGRI_random.100.d1:0 "Çiftçiler tedarik edebildiğimiz ekipmandan oldukça memnun; en güzel ya da en yeni takım olmayabilir ama çalışıyor ve mevcut durumumuzda isteyebileceğimiz de bu kadar."
 AGRI_random.100.A:0 "Burada felaketi önledik"
 AGRI_random.100.t2:0 "Bir Ambargo Daha mı?!"
 AGRI_random.100.d2:0 "Ticaret Bakanlığı'nda müzakereleri kim yürütüyorsa kurşuna dizilmeli. Bu kadar nasıl beceriksizlik ettiler bilmiyoruz ama bir ambargo daha yedik, inanılmaz. Üstelik çiftçiler de bize öfkeli!"
 AGRI_random.100.B:0 "Lanet olsun..."
 AGRI_random.100.t3:0 "Neredeyse Hiçbir Şey Çalışmıyor"
 AGRI_random.100.d3:0 "«Sıfır gibi» demişler, ne sıfırı! Tedarik edebildiğimiz ekipmanın neredeyse tamamı bozuk, kilitlenmiş ya da hayat belirtisi bile göstermiyor; çiftçiler bize epey kızgın..."
 AGRI_random.100.C:0 "Faturayı sakladık mı?"
 AGRI_random.2.t:0 "Tarlalar Oldukça Kuru Görünüyor..."
 AGRI_random.2.d:0 "Yılın bu zamanında tarlalarımız genellikle şimdikinden çok daha elverişli olur; Tarım Bakanımız bunun «biraz fazla güneş» olmaktan öte, daha ciddi bir kuraklığın habercisi olabileceğinden endişe ediyor.\n\nParamız kısıtlıysa komşularımızın su kaynaklarından bir miktar çekmeyi deneyebiliriz..."
 AGRI_random.2.A:0 "Eh, bunu kendimiz çözmeliyiz..."
 AGRI_random.2.B:0 "Neyse, onlar fark etmez"
 AGRI_random.2.C:0 "O kadar endişeliysen yağmur için dua et!"
 AGRI_random_water_diversion_TT:0 "§YKomşularımızın suyunun bir kısmını§! §Rçalmayı§! §Ydeneyebiliriz:§! §Cyönlendirerek§! §Yçalarız!§!"
 AGRI_random.20.t1:0 "Kriz Önlendi!"
 AGRI_random.20.t2:0 "Biraz Kuruduk"
 AGRI_random.20.t3:0 "Hiçbir Şey Değişmedi!"
 AGRI_random.20.d1:0 "Hükümetin hızlı müdahalesi olası kuraklık sorununu çözmüş görünüyor; düşman edinmedik, hatta beklenen hasat fiyatlarında artış bile olabilir."
 AGRI_random.20.d2:0 "Kuruyan toprakların önünü almayı başarmış görünsek de bazı çevre arazilerde hâlâ biraz kuraklık var ve o ürün türünden daha az hasat alabiliriz. Önemli değil, ürünlerin çoğu kurtarıldı."
 AGRI_random.20.d3:0 "Tüm çabalarımıza rağmen tarlalar bir türlü tutmuyor ve her zamankinden daha kuru görünüyor; bu tam ölçekli bir kuraklığa dönüşebilir, en kötüsüne hazır olmalıyız."
 AGRI_random.20.A:0 "Bunu duyduğuma sevindim!"
 AGRI_random.20.B:0 "Umarım yalnızca sebzelerdir."
 AGRI_random.20.C:0 "Sıkı tutunun!"
 AGRI_random.200.t1:0 "Fark Bile Etmediler!"
 AGRI_random.200.t2:0 "[FROM.GetName] Bizi Suçüstü Yakaladı"
 AGRI_random.200.t3:0 "Çok Fazla Su Aldık!"
 AGRI_random.200.t4:0 "[FROM.GetName] Tarlaları Kurumuş Görünüyor"
 AGRI_random.200.t5:0 "[FROM.GetName] Çiftlikleri Çorak Kaldı"
 AGRI_random.200.d1:0 "Doğru yerlere dağıttığımız biraz parayla komşumuzun suyundan haberleri olmadan bir miktar çalmayı başardık; umarız rüşvet verdiğimiz kişiler ağzını kapalı tutar. Kendi sorunlarımız şimdilik çözüldü."
 AGRI_random.200.d2:0 "Doğru kişilere rüşvet verdiğimizi sanıyorduk, tedarik ekibimiz su hatları başında hazır bekliyordu ama ne yazık ki [FROM.GetAdjective] yetkililer tarafından basıldı. Hükümetimizin eylemlerine epey kızgın görünüyorlar."
 AGRI_random.200.d3:0 "Komşumuz [FROM.GetName] sanıldığından daha az suya sahipmiş ve şimdi eylemlerimizin bedelini ödüyor! Suyu kimin çaldığı onlar için belli olabilir, neyse ki yalnızca yerel bir kuraklık görünüyor."
 AGRI_random.200.d4:0 "Komşumuz [FROM.GetName] sanıldığından daha az suya sahipmiş ve şimdi eylemlerimizin bedelini ödüyor! Suyu kimin çaldığı onlar için büyük olasılıkla belli, ne yazık ki kuraklık sonunda bize de uzanabilir."
 AGRI_random.200.d5:0 "Komşumuz [FROM.GetName] sanıldığından daha az suya sahipmiş ve şimdi eylemlerimizin bedelini ödüyor! Suyu kimin çaldığı onlar için neredeyse kesinlikle belli; Tarım Bakanımız aşırı kuraklıklar öngörüyor ve bu kuraklıkların kendi sınırlarımızdan içeri girme ihtimali yüksek."
 AGRI_random.200.A:0 "Suya sahip olmanın bedelini ödesinler!"
 AGRI_random.200.B:0 "Ah, kahretsin..."
 AGRI_random.200.C:0 "Onlarla aramızı düzeltmeye çalışalım."
 AGRI_random.200.D:0 "Eyvah."
 AGRI_random.200.E:0 "En kötüsüne hazırlanın."
 AGRI_random.200.F:0 "Dur... bu bizi de etkileyebilir!"
 AGRI_random.200.G:0 "Bizi etkileyebiliyorsa hazırlanmalıyız!"
 AGRI_random.200.H:0 "Aman Allahım... ne yaptık biz?"
 AGRI_random.2000.t:0 "[FROM.GetName] Suyumuzu Çaldı!"
 AGRI_random.2000.d1:0 "Su kaynakları ve stokları yetersiz kalınca bir terslik olduğunu düşündük. Kapsamlı bir soruşturmanın ardından suçlunun [FROM.GetName] olduğu anlaşıldı!"
 AGRI_random.2000.d2:0 "Su kaynakları ve stokları yetersiz kalınca bir terslik olduğunu düşündük. Kapsamlı bir soruşturmanın ardından suçlunun [FROM.GetName] olduğu anlaşıldı! Ambargo uygulayarak ciddi olduğumuzu gösterebiliriz..."
 AGRI_random.2000.A:0 "Tüm bağlarımızı koparalım!"
 AGRI_random.2000.B:0 "Alçaklar!"
 AGRI_random.3.t:0 "İki Çiftçi Arazi Anlaşmazlığında Yardım İstiyor"
 AGRI_random.3.d:0 "İki çiftçi, arazi anlaşmazlığını çözmek için hükümetin bir tür müdahalesini talep ederek tarım bakanlığının merkez ofislerine geldi. Birinci çiftçi, arazisine ikinci çiftçinin sığırlarının girdiğini söylüyor; ikinci çiftçi ise haritaların resmî olarak hiç çizilmediğini, birinci çiftçinin tarla sınırlarının aslında kendi mülküne taştığını iddia ediyor!\n\nKarmaşık bir mesele; hangisi daha ikna edici bir hikâye anlatıyorsa onun tarafını tutabiliriz."
 AGRI_random.3.A:0 "Sığırlarınızı kendi tarafınızda tutun!"
 AGRI_random_3_F1_TT:0 "§YArazi anlaşmazlığında§! §3Birinci Çiftçi§!'nin §Ytarafını tutacak§!"
 AGRI_random.3.B:0 "Sığırların sınırları bilmesini bekleyemezsiniz!"
 AGRI_random_3_F2_TT:0 "§YArazi anlaşmazlığında§! §3İkinci Çiftçi§!'nin §Ytarafını tutacak§!"
 AGRI_random.3.C:0 "Hatırlat bana, bu neden beni ilgilendiriyordu?"
 AGRI_random_3_NO_TT:0 "§YArazi anlaşmazlığında§! §Rkimsenin§! §Ytarafını tutmayacak, sorunu kendilerinin çözmesine bırakacak§!"
 AGRI_random.30.t1:0 "Sığır Yetiştiricileri Öfkeli!"
 AGRI_random.30.d1:0 "Büyük bir sığır yetiştiricisi grubu, hükümetin ekim yapan çiftçilerin yanında yer almasını skandal bir yetki aşımı olarak görüyor ve rakip bir siyasi parti için aktif kampanya yürütüyor!\n\nEkim yapan çiftçiler ise karara sevinç içinde ve mülkiyet hakları için kazanılan bu zaferi kutluyor!"
 AGRI_random.30.A:0 "Sığırlarınıza daha iyi göz kulak olmalıydınız!"
 AGRI_random.30.t2:0 "Ekim Yapan Çiftçiler Öfkeli!"
 AGRI_random.30.d2:0 "Yetiştiriciler hükümetin kararına çok sevinmiş görünüyor; otlatma hakları güvence altına alındığı için gelecek seçimlerde hükümeti destekleyeceklerine söz verdiler.\n\nEkim yapan çiftçiler ise birbirlerinin etrafında kenetlenmekle ve kararı kabul etmemekle tehdit ediyor!"
 AGRI_random.30.B:0 "Mülkiyet yasalarını sağlamlaştırsak iyi olur..."
 AGRI_random.30.t3:0 "Kendi Aralarında Çözdüler!"
 AGRI_random.30.d3:0 "Hükümetin iki tarafa da müdahale etmemesi sayesinde yetiştiriciler ile ekim yapan çiftçiler arasında bir beyefendi anlaşması sağlandı ve bu arazi anlaşmazlığı çözüldü.\n\nGelecekte yenileri çıkabilir ama herkes bu sonuçtan en azından bir ölçüde memnun görünüyor."
 AGRI_random.30.C:0 "Mükemmel bir çözüm."
 AGRI_random.30.t4:0 "Çiftlikte Silahlı Çatışma!"
 AGRI_random.30.d4:0 "Hükümet müdahalesi ya da denetimi olmadan, iki grup arasındaki görüşmeler sırasında arbede çıktı ve iki taraftan da ateş açıldı. Çok sayıda yetiştirici ve çiftçi ölü ya da yaralı; tarım sektörü cevap istiyor, halk değişim için sokaklarda."
 AGRI_random.30.D:0 "Eh, lanet olsun..."
 AGRI_random.4.t:0 "Bereketli Bir Hasat!"
 AGRI_random.4.d:0 "Çiftçilerimiz rekor hasat bildiriyor ve Tarım Bakanlığı'na fazla ürünle ne yapılacağını soruyor. Ya satabiliriz ya da «pek yağmurlu olmayan gün» stoklarımızı büyütebiliriz."
 AGRI_random.4.A:0 "Ek gelir her zaman iyidir."
 AGRI_random.4.B:0 "Bunların hepsi için silomuz var mı?"
 AGRI_random.5.t:0 "Ürünler Tarlada Ölüyor!"
 AGRI_random.5.d:0 "Bir şey ürünlerimizin hatırı sayılır bir kısmını öldürdü, beklenen hasat çürüdü; zararı gidermek için sert önlemler almazsak tarımsal üretimimizin önemli ölçüde küçülmesi bekleniyor."
 AGRI_random.5.A:0 "Dişimizi sıkıp katlanmak zorundayız."
 AGRI_random.5.B:0 "Stok sektörü sağlıklı tutacak!"
 AGRI_random.6.t:0 "İstilacı Türler Tarlaları Sardı!"
 AGRI_random.6.d:0 "Ufukta istilacı bir çekirge türü görüldü [ROOT.GetLeader]! Pestisit kullanımımızın hasadımızın fazlasını yok etmelerini önlemeye yeteceği umuluyor ama asla emin olamayız, en kötüsüne hazırlanmalıyız!"
 AGRI_random.6.A:0 "Hasar ne kadar kötü?"
 AGRI_random.60.t1:0 "Temel Ürün Tarlalarının Daha Fazla Araziye İhtiyacı Var!"
 AGRI_random.60.t2:0 "Nakdi Ürün Tarlalarının Daha Fazla Araziye İhtiyacı Var!"
 AGRI_random.60.d1:0 "Bu bir felaket... çekirgeler öngörülen temel ürün hasadımızdan sayısız ton yok etmiş görünüyor; tarım sektörümüzün ciddi bir darbe alacağını beklemeliyiz."
 AGRI_random.60.d2:0 "Neyse ki çekirgeler pestisit uygulanmış tarlalarımızı seçmiş ve bedelini ödemiş görünüyor. Öngörülen temel ürün hasadı şimdi daha düşük olsa da tarım sektörümüzün kârlılığında yalnızca hafif bir sarsıntı beklemeliyiz."
 AGRI_random.60.d3:0 "Bu bir felaket... çekirgeler öngörülen nakdi ürün hasadımızdan sayısız ton yok etmiş görünüyor; tarım sektörümüzün ciddi bir darbe alacağını beklemeliyiz."
 AGRI_random.60.d4:0 "Neyse ki çekirgeler pestisit uygulanmış tarlalarımızı seçmiş ve bedelini ödemiş görünüyor. Öngörülen nakdi ürün hasadı şimdi daha düşük olsa da tarım sektörümüzün kârlılığında yalnızca hafif bir sarsıntı beklemeliyiz."
 AGRI_random.60.A:0 "Lanet olsun"
 AGRI_random.60.B:0 "Lanet olsun"
 AGRI_random.60.C:0 "Lanet olsun"
 AGRI_random.60.D:0 "Lanet olsun"
 AGRI_random.7.t:0 "Orman Yangınları!"
 AGRI_random.7.d:0 "Ülkemizin en verimli çiftliklerinin tarlalarına yakın yerlerde orman yangınları çıkmış görünüyor. Tarım Bakanımız, yangının yayılmasıyla bu çiftliklerin ağır darbe almasını bekliyor."
 AGRI_random.7.A:0 "Hasar raporunu bekleyeceğiz..."
 AGRI_random.70.t1:0 "Temel Ürün Tarlalarını Alevler Sardı!"
 AGRI_random.70.t2:0 "Nakdi Ürün Tarlalarını Alevler Sardı!"
 AGRI_random.70.d1:0 "İtfaiyecilerimizin tüm çabalarına rağmen zorlu bir hasat dönemi bizi bekliyor olabilir. Pek çok çiftçi her şeyini kaybetti, ama en kötüsü piyasanın beklenmedik biçimde düşmesiyle temel ürünlerdeki pazar payımızın bu felaketten ağır yara almasıdır."
 AGRI_random.70.d2:0 "İtfaiyecilerimizin tüm çabalarına rağmen zorlu bir hasat dönemi bizi bekliyor olabilir. Pek çok çiftçi her şeyini kaybetti, ama en kötüsü piyasanın beklenmedik biçimde düşmesiyle nakdi ürünlerdeki pazar payımızın bu felaketten ağır yara almasıdır."
 AGRI_random.70.A:0 "Bunca emek, duman oldu."
 AGRI_random.70.B:0 "Bunca emek, duman oldu."
 AGRI_random.8.t:0 "Şiddetli Yağmurlar Sel Tehdidi Oluşturuyor"
 AGRI_random.8.d:0 "Yağmur mevsimi başlamış olsa da normalden daha sert bir yağmur mevsimi yaşama ihtimalimiz giderek artıyor; nehirler yılın bu zamanı için olağan düzeyin ötesinde kabarmış görünüyor ve meteorologlar kıyıların taşmasını bekliyor."
 AGRI_random.8.A:0 "En kötüsüne hazırlanalım."
 AGRI_random.80.t1:0 "Temel Ürün Tarlalarını Su Bastı!"
 AGRI_random.80.t2:0 "Nakdi Ürün Tarlalarını Su Bastı"
 AGRI_random.80.d1:0 "Derme çatma barikatlarımızla ve aceleyle yapılmış sel duvarlarımızla tutulamayacak kadar çok su vardı. Temel ürün tarlaları sırılsıklam, pek çok çiftçi her şeyini kaybetti ve tarım sektörünün bundan darbe alması bekleniyor."
 AGRI_random.80.d2:0 "Derme çatma barikatlarımızla ve aceleyle yapılmış sel duvarlarımızla tutulamayacak kadar çok su vardı. Nakdi ürün tarlaları sırılsıklam, pek çok çiftçi her şeyini kaybetti ve tarım sektörünün bundan darbe alması bekleniyor."
 AGRI_random.80.A:0 "Biraz fazla yağmur olmuş olabilir."
 AGRI_random.80.B:0 "Biraz fazla yağmur olmuş olabilir."
 AGRI_random.9.t:0 "Hayvan Sürüsü Panik İçinde Koşuyor!"
 AGRI_random.9.d:0 "Uzakta bir sürü hayvan toz kaldırıyor ve çiftlik arazilerinden geçerek yol değiştiriyor gibi görünüyorlar!"
 AGRI_random.9.A:0 "Nereye varacaklarına bakalım."
 AGRI_random.90.t1:0 "Panikleyen Sürü Temel Ürünleri Çiğnedi"
 AGRI_random.90.t2:0 "Panikleyen Sürü Nakdi Ürünleri Çiğnedi"
 AGRI_random.90.t3:0 "Panikleyen Sürü Tarlalardan Uzak Durdu"
 AGRI_random.90.d1:0 "Tüm çabalarımıza rağmen sürü, temel ürünlerimizin yetiştirildiği tarlaları çiğnemiş görünüyor. Nakdi ürünlerden temel ürünlere daha fazla arazi ayırmamız gerekecek; acil önlemler bitene kadar dağılımları değiştiremeyeceğiz."
 AGRI_random.90.d2:0 "Tüm çabalarımıza rağmen sürü, nakdi ürünlerimizin yetiştirildiği tarlaları çiğnemiş görünüyor. Temel ürünlerden nakdi ürünlere daha fazla arazi ayırmamız gerekecek; acil önlemler bitene kadar dağılımları değiştiremeyeceğiz."
 AGRI_random.90.d3:0 "Panikleyen sürü tarlalara ulaşmadan büyük ölçüde dağıldı ama bazı geride kalanlar yine de yollara sadık kalarak kırsal alanlara girmeyi başardı. Bu bir miktar trafik karışıklığına yol açtı ama işe geç kalmak, önümüzdeki aylarda öğle yemeklerini kaybetmekten çok daha iyidir."
 AGRI_random.90.A:0 "Acil önlemler alınmalı!"
 AGRI_random.90.B:0 "Acil önlemler alınmalı!"
 AGRI_random.90.C:0 "Çok şükür."
