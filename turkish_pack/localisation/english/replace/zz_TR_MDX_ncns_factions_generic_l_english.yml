 joint_military_exercises_goal_desc:0 "Modern harp, müttefik kuvvetler arasında birlikte çalışabilirlik gerektirir. Ortak tatbikatlar yaparak ve toplam 100 teçhizatlı tümen gücüne ulaşarak ittifakımız her tehdide karşılık vermeye hazır olduğunu gösterir."
 economic_integration_goal_desc:0 "Güçlü bir ekonomi her kalıcı ittifakın temelidir. Her üye devletin en az 15 sivil fabrikayı sürdürmesini sağlayarak ortak refah ve karşılıklı yardım için gereken sanayi tabanını oluşturuyoruz."
 technology_sharing_goal_desc:0 "Teknolojik üstünlük bir güç çarpanıdır. Ortak araştırma programları ve dijital altyapı yatırımıyla ittifakımız rakiplerini geride bırakabilir ve her alanda öncü konumunu koruyabilir."
 regional_stability_goal_desc:0 "Bir ittifak en zayıf halkası kadar güçlüdür. Tüm üye devletlerde istikrarı %50'nin üzerinde tutarak fırsatçı saldırganlığı ve iç yıkıcılığı caydıran birleşik bir cephe sunarız."
 counter_terrorism_goal_desc:0 "Terör sınır tanımaz. Her üye devlette istihbarat teşkilatları kurmak, tehditleri gerçekleşmeden önce önleyebilen bir ağ oluşturur; hem vatandaşlarımızı hem ortak çıkarlarımızı korur."
 semiconductor_supremacy_goal_desc:0 "Mikroçip üretimi 21. yüzyılın stratejik sanayisidir. İttifakımız genelinde toplam 50 mikroçip tesisi inşa ederek tedarik zinciri bağımsızlığını ve teknolojik üstünlüğü on yıllarca güvence altına alırız."
 strategic_resource_security_goal_desc:0 "Kritik hammaddelere erişim hem ekonomik büyümenin hem askerî hazırlığın temelidir. İttifakımız, hiçbir üyenin kaynak baskısına açık kalmaması için ortaklaşa yeterli petrol, kauçuk ve alüminyum çıkarmalıdır."
 collective_cyber_defense_goal_desc:0 "Dijital çağda kriptografik güvenlik, fiziksel tahkimatlar kadar hayati önemdedir. Her üye devletin gelişmiş şifreleme yeteneklerine ulaşmasını sağlayarak haberleşmemizi, istihbaratımızı ve kritik altyapımızı koruruz."
 economic_powerhouse_goal_desc:0 "Ekonomik güç doğrudan jeopolitik nüfuza dönüşür. İttifak liderimiz yüksek kişi başı GSYİH'ye ulaştığında ve her üye bir temel eşiği aştığında, görmezden gelinemeyecek bir ekonomik blok oluruz."
 faction_gdp_per_capita_target_tt:0 "İttifak lideri kişi başı GSYİH 15'in üzerinde ve tüm üyeler 5'in üzerinde"
 faction_economic_integration_idea:0 "Ekonomik Entegrasyon Paktı"
 faction_economic_integration_idea_desc:0 "Koordineli ticaret politikaları ve azaltılmış engeller sayesinde üye devletler gelişmiş ekonomik iş birliğinden ve daha hızlı kalkınmadan yararlanır."
