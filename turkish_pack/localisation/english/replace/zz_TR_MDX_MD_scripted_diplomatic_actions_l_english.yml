 DIPLO_ACTION_ASSUME_DEBT_TITLE:0 "§YBorç Üstlenme§! Öner"
 DIPLO_ACTION_ASSUME_DEBT_ACTION_DESC:0 "Başka bir ülkenin mevcut ekonomik sorunlarını hafifletmek için ona §YBorç Üstlenme§! önerebiliriz. Teklifi kabul ederse küçük bir ilişki kazancı elde ederiz ve §YBorcunun§! %25'ini üstleniriz. Bu tutar önce hazinemizden çıkar.\n\nYZ'nin anlaşmaya tepkisini belirleyen etkenler:\nAynı Hükümet, Görüş, Nüfuz, İttifak, AB Üyeliği, NATO Üyeliği."
 DIPLO_ACTION_ASSUME_DEBT_DESC:0 "Başka bir ülkenin mevcut ekonomik sorunlarını hafifletmek için onun §YBorcunu§! üstlenebiliriz. Teklifi kabul ederse küçük bir ilişki kazancı elde ederiz ve §YBorcunun§! %25'ini üstleniriz. Bu tutar önce hazinemizden çıkar."
