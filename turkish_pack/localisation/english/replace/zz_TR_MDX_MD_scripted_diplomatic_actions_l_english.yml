 CLOSE_EMBASSY_ACTION_TITLE:0 "Büyükelçiliği Kapat"
 CLOSE_EMBASSY_ACTION_ACTION_DESC:0 "Büyükelçiliğimizi kapatmak bu ülkeyle olan başlıca diplomatik bağlarımızı koparır.\n\n§YBüyükelçilikleri Kapatmanın§! Etkileri:\nİlişki §R100§! azalır; ayrıca büyükelçiliklerin kapatılması nedeniyle zamanla azalan §R25§! değerinde bir ilişki değiştiricisi eklenir."
 DIPLO_ACTION_CLOSE_EMBASSY_ACTION_DESC:0 "§Y[THIS.GetNameWithFlag]§! ile büyükelçiliklerimizi kapatmayı seçebiliriz; bunun etkisi şöyle olur:\nİlişki §R100§! azalır; ayrıca büyükelçiliklerin kapatılması nedeniyle zamanla azalan §R25§! değerinde bir ilişki değiştiricisi eklenir."
