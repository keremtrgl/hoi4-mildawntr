 CANCEL_MUTUAL_INVESTMENT_TOOLTIP:0 "Şu anda §Y[This.GetNameWithFlag]§! ile bir §YKarşılıklı Yatırım Antlaşması§! var\n"
 CANCEL_MUTUAL_INVESTMENT_TREATY_ACTION_DESC:0 "İki ülke arasındaki §YKarşılıklı Yatırım Antlaşması§!'nı sürdürmekle artık ilgilenmiyoruz. §YKarşılıklı Yatırım Antlaşması§!'nı sona erdirip gelecek için yeni anlaşmalar kurma zamanı. §YTicaret Anlaşması§!'nı Sonlandırmanın Etkileri:\n\nTicaret Nüfuzu §R50§! azalır\nİlişki §R25§! azalır; ayrıca anlaşmanın bozulması nedeniyle zamanla azalan §R15§! değerinde bir ilişki değiştiricisi eklenir\n"
 DIPLO_ACTION_CANCEL_MUTUAL_INVESTMENT_TREATY:0 "Ne yazık ki [THIS.GetNameWithFlag] §YKarşılıklı Yatırım Antlaşması§!'ndan çekildi. Belki bir başka gün yeni bir §YKarşılıklı Yatırım Antlaşması§! imzalayabiliriz ama şimdilik artık bir anlaşmamız yok."
