 DIPLO_ACTION_CLOSE_EMBASSY_ACCEPT_DESC:0 "[THIS.GetNameWithFlag] ile büyükelçiliğimizi kapattık."
 DIPLO_ACTION_CLOSE_EMBASSY_REJECT_TITLE:0 "Büyükelçilik Kapatma İptal Edildi"
 DIPLO_ACTION_CLOSE_EMBASSY_REJECT_DESC:0 "[THIS.GetNameWithFlag] ile büyükelçiliğimizi kapatmamaya karar verdik."
 REOPEN_EMBASSY_ACTION_TITLE:0 "Büyükelçiliği Yeniden Aç"
 REOPEN_EMBASSY_ACTION_ACTION_DESC:0 "Gerginliği azaltmak için büyükelçiliğimizi yeniden açabiliriz.\n\n§YBüyükelçilikleri Yeniden Açmanın§! Etkileri:\nİlişki §G100§! artar; ayrıca büyükelçiliklerin yeniden açılması nedeniyle zamanla azalan §G15§! değerinde bir ilişki değiştiricisi eklenir."
 DIPLO_ACTION_REOPEN_EMBASSY_ACTION_DESC:0 "§Y[THIS.GetNameWithFlag]§! ile büyükelçiliklerimizi yeniden açmayı teklif etmeyi seçebiliriz; bunun etkisi şöyle olur:\nİlişki §G100§! artar; ayrıca büyükelçiliklerin yeniden açılması nedeniyle zamanla azalan §G15§! değerinde bir ilişki değiştiricisi eklenir."
