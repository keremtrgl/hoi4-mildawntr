 PROPOSE_TRADE_AGREEMENT_DESC:0 "İki ülke arasındaki bir §YTicaret Anlaşması§!, kabul edilirse ticaret nüfuzunu §G100§! ve §Y[This.GetNameWithFlag]§! ile ilişkiyi §G25§! artıracaktır. İki ülke ayrıca birbirleri üzerinde §G~%1§! nüfuz kazanacak."
