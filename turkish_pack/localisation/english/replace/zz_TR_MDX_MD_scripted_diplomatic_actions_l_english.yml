 REVOKE_CIV_SPY_ACCESS_TITLE:0 "Sivil SPYSAT Erişimini İptal Et"
 REVOKE_CIV_SPY_ACCESS_ACTION_DESC:0 "Sivil keşif uydu sistemimize erişimlerini sonlandır ve tüm görüntü verisi yetkilerini iptal et. Bu eylem yeryüzü gözlem yeteneklerini keser, veri indirme sistemlerimizle entegrasyonlarını devre dışı bırakır ve çevre izleme, afet müdahale planlaması ile altyapı değerlendirmelerini önemli ölçüde aksatabilir. Bu tür bir adım, kötüleşen ilişkilerin işaretidir ve gözetleme ile analiz kapasitelerini sınırlar. Bizim §YSivil SPYSAT Uydu Ağımıza§! mevcut erişimlerini kaybedecekler."
