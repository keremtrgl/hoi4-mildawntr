 PROPOSE_SUBSIDIES_TO_SUBJECT_ACTION_DESC:0 "Bağımlı ülkemizin ekonomik gelişimine yardımcı olmak için toplam §YGayri Safi Yurt İçi Hasılasının§! (GSYİH) her hafta §Y%1§!'ini sübvanse etmeyi önerebiliriz. Karşılığında bağımsızlık peşine düşme olasılıkları azalır ve özerklikleri yavaş yavaş düşer."
