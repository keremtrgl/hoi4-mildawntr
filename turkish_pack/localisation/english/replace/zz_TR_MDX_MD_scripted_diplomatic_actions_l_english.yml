 PROPOSE_TRADE_AGREEMENT_ACCEPT_DESC:0 "[THIS.GetNameWithFlag] anlaşmayı kabul etti ve şu etkiler ortaya çıktı:\n\nTicaret Nüfuzu §G50§! arttı\nİlişki §G25§! arttı\nNüfuz yaklaşık §G~%1§! arttı\n"
