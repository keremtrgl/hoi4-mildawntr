 PROPOSE_MUTUAL_INVESTMENT_TREATY_TITLE:0 "§YKarşılıklı Yatırım Antlaşması§! Öner"
 PROPOSE_MUTUAL_INVESTMENT_TREATY_ACTION_DESC:0 "İki ülkede de yatırımları teşvik etmek için bu ülkeyle bir §YKarşılıklı Yatırım Antlaşması§! önerebiliriz. Antlaşma ikimize de §G%5§! oranında §YYatırım Maliyeti ve Süresi§! indirimi ve her ülkede §G~%1§! nüfuz sağlayacak.\n\nYZ'nin anlaşmaya tepkisini belirleyen etkenler:\nAynı Hükümet, Görüş, Nüfuz, İttifak, AB Üyeliği, NATO Üyeliği.\n\nAyrıca hedef ülke bir YZ ise §YKalıcı Yatırım Hedefi§! havuzuna eklenir; bu da size yatırım yapmaya çalışacakları anlamına gelir."
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY:0 "Bir §YKarşılıklı Yatırım Antlaşması§! önermek, diğer ülke kabul ederse §YTicaret Nüfuzunu§! §G30§! ve §Y[This.GetNameWithFlag]§! ile §Yİlişkiyi§! §G30§! artıracaktır. İki ülke ayrıca birbirleri üzerinde §G~%1§! §YNüfuz§! kazanacak. Ayrıca her ülkenin birbirine yönelik §YYatırım Maliyeti ve Süresi§! §G%5§! azalacak."
