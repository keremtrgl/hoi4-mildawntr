 DIPLO_ACTION_REOPEN_EMBASSY_ACCEPT_DESC:0 "[THIS.GetNameWithFlag] büyükelçiliğimizi yeniden açma teklifimizi kabul etti."
 DIPLO_ACTION_REOPEN_EMBASSY_REJECT_TITLE:0 "Büyükelçiliğin Yeniden Açılması [THIS.GetNameWithFlag] Tarafından Reddedildi"
 DIPLO_ACTION_REOPEN_EMBASSY_REJECT_DESC:0 "[THIS.GetNameWithFlag] büyükelçiliğimizi yeniden açma teklifimizi §Yreddetti§!."
