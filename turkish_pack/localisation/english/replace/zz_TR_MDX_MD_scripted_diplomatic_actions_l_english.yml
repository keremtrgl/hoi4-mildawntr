 PROPOSE_IMPROVED_TRADE_AGREEMENT_TITLE:0 "§YTicaret Anlaşması§! Öner"
 PROPOSE_IMPROVED_TRADE_AGREEMENT_ACTION_DESC:0 "Bu ülkeye §YTicaret Anlaşması§! önermek karşılıklı fayda sağlayan bir anlaşma olmalıdır; hem bizim hem onların ülkesine daha fazla refah getirir. Ülke yatırım yapmak istiyorsa §YTicaret Anlaşması§! yapmak yatırım alma şansınızı da artırır.\n\nYZ'nin anlaşmaya tepkisini belirleyen etkenler:\nAynı Hükümet, Görüş, Nüfuz, İttifak, AB Üyeliği, NATO Üyeliği."
