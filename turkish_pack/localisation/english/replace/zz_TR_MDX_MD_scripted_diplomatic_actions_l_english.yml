 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_ACCEPT_DESC:0 "[THIS.GetNameWithFlag] §YKarşılıklı Yatırım Antlaşması§!'nı imzaladı. İki ülkemiz bunun sonucunda şimdiden hızla yakınlaşıyor ve ülkemizdeki yatırımcılar yeni iş fırsatlarına şimdiden ilgi duyuyor."
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_REJECT:0 "[THIS.GetNameWithFlag] §YKarşılıklı Yatırım Antlaşması§!'nı §Rreddetti§!"
 DIPLO_ACTION_PROPOSE_MUTUAL_INVESTMENT_TREATY_REJECT_DESC:0 "[THIS.GetNameWithFlag] §YKarşılıklı Yatırım Antlaşması§!'nı reddetti. Ülkemizdeki yatırımcılar, iki ülkenin anlaşamamasından dolayı hayal kırıklığına uğradı. Belki başka bir zaman..."
