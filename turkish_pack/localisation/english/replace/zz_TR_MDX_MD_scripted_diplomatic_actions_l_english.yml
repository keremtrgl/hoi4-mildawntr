 OFFER_CIV_SPY_ACCESS_TITLE:0 "Sivil SPYSAT Erişimi Sun"
 OFFER_CIV_SPY_ACCESS_ACTION_DESC:0 "Yeryüzü gözlem ve izleme ihtiyaçlarını desteklemek için sivil keşif uydu sistemimize erişim sun. Bu erişim; görüntü verisi paylaşımını, teknik entegrasyon yardımını ve uyumlu yer analiz istasyonları için koordinasyonu içerir. Bu tür bir erişim; çevre izleme, afete hazırlık ve sivil altyapı planlamasını iyileştirir. Kabul edilirse onların §YSivil SPYSAT Uydu Ağı§!'na erişim kazanacağız."
