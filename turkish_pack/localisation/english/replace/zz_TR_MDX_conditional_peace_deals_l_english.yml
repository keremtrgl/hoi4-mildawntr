 CPD_resource_rights_button_TT:0 "§YKaynak Hakları§!"
 CPD_resource_rights_button_TT_DELAYED:0 "§YKaynak Çıkarma Haklarını§! elde etmek, seçilen eyaletlerin kaynak üretimini bize yönlendirir. Eyaletler mevcut sahibinin elinde kalır; yalnızca ürettikleri petrol, çelik, alüminyum, kauçuk, tungsten ve krom ekonomimize akar. Düzenleme, başka bir barış anlaşmasıyla geri alınana kadar sürer."
 CPD_military_basing_button_TT:0 "§YAskerî Üs Hakkı§!"
 CPD_military_basing_button_TT_DELAYED:0 "§YAskerî Üs Hakkı§!, kuvvetlerimize bu ülkenin topraklarında serbest geçiş sağlar. Erişim kaldırılana kadar birliklerimiz serbestçe hareket edebilir ve konuşlanabilir."
 CPD_full_puppet_button_TT:0 "§YTam Kukla§!"
 CPD_full_puppet_button_TT_DELAYED:0 "§YTam Kukla§! talep etmek, bu ülkenin tamamını bağımlı ülkemiz yapar. Sınırlarını ve nüfusunu korurlar ancak dış politika bağımsızlıklarını yitirirler; ekonomileri, insan güçleri ve orduları bize bağlı olur. Bu anlaşmadaki eyalet kuklalaştırma talepleri bunun içinde erir."
 CPD_ceasefire_button_TT:0 "§YAteşkes§!"
 CPD_ceasefire_button_TT_DELAYED:0 "§YAteşkes§!, savaşı cephe hattı mevcut haliyle bitirir. Her taraf, daha önce kimin elinde olduğuna bakılmaksızın şu anda denetlediği eyaletleri elinde tutar. Ateşkes, taraflardan biri yeniden savaş ilan edene kadar §Y720 gün§! geçerlidir.\n\nAteşkes ve toprak talepleri aynı anlaşmada yer alamaz. Ateşkesi etkinleştirmek, mevcut teklifteki tüm eyalet kalemlerini temizler."
 CPD_war_reparations_button_TT:0 "§YSavaş Tazminatı§!"
 CPD_war_reparations_button_TT_DELAYED:0 "§YSavaş Tazminatı§!, kaybedeni bir yıl boyunca her hafta GSYİH'sinin bir kısmını ödemeye zorlar. Transfer, ödeyenin bütçesinde yeni bir gider, alanın bütçesinde yeni bir gelir olarak görünür.\n\n[CPD_reparations_preview]"
 CPD_reparations_preview_TT:0 "Bu anlaşma için öngörülen transfer: §Yhaftada $$[?CPD_rep_preview_temp|.2] milyar§! (yıl boyunca yaklaşık §Y$$[?CPD_rep_preview_total_temp|.0] milyar§!)"
 CPD_forced_neutrality_button_TT:0 "§YZorunlu Tarafsızlık§!"
 CPD_forced_neutrality_button_TT_DELAYED:0 "§YZorunlu Tarafsızlık§!, imza anında bu ülkeyi bulunduğu ittifaktan çıkarır ve §Ybeş yıl§! boyunca başka bir ittifaka katılmasını ya da kurmasını yasaklar."
 CPD_regime_change_button_TT:0 "§YRejim Değişikliği§!"
 CPD_regime_change_button_TT_DELAYED:0 "§YRejim Değişikliği§!, hedef ülkenin iktidar partisini ülkemizde şu anda iktidarda olan partiyle değiştirir. Koalisyonları dağıtılır ve bizim siyasi çizgimizden bir lider iş başına getirilir. Yeni hükümet iki yıl boyunca §Ysavaş sonrası istikrarsızlık§! yaşar; İslam ülkelerinde dış güçlerce dayatılan yönetime karşı §Yselefi tepki§! görülebilir."
 additional_income_war_reparations_tt:0 "§YSavaş Tazminatından§! haftalık $$[?CPD_reparations_weekly|+3]\n"
 additional_expense_war_reparations_tt:0 "§YSavaş Tazminatından§! haftalık $$[?CPD_reparations_weekly|-3]\n"
 CPD_war_reparations_payer:0 "Savaş Tazminatı (Ödeyen)"
 CPD_war_reparations_payer_desc:0 "Bir barış anlaşması sonucunda savaş tazminatı ödüyoruz. Haftalık nakit transferi, bütçemizde §Y1 yıl§! boyunca ek gider olarak görünür."
 CPD_war_reparations_receiver:0 "Savaş Tazminatı (Alan)"
 CPD_war_reparations_receiver_desc:0 "Bir barış anlaşması sonucunda savaş tazminatı alıyoruz. Haftalık nakit transferi, bütçemizde §Y1 yıl§! boyunca ek gelir olarak görünür."
 CPD_forced_neutrality_spirit:0 "Dayatılan Tarafsızlık"
 CPD_forced_neutrality_spirit_desc:0 "Barış anlaşmasının bir koşulu olarak ülkemizin askerî ittifaklara katılması veya ittifak kurması yasaktır."
 CPD_regime_change_instability:0 "Savaş Sonrası Siyasi İstikrarsızlık"
 CPD_regime_change_instability_desc:0 "Zorla yapılan rejim değişikliği siyasi sistemimizi istikrarsızlaştırdı."
 CPD_peace_deal_explainer_ICON_TT:0 "Barış Anlaşmaları Nasıl İşler"
 CPD_peace_deal_explainer_ICON_TT_DELAYED:0 "Barış anlaşması hazırlamak, yukarıdan bir sekme seçip bir eyalet içinde neyden vazgeçileceğini ya da neyin talep edileceğini seçmek kadar basittir.\n\nMaliyeti §Ynegatif§! olan bir barış anlaşmasını yapay zekâ büyük olasılıkla kabul eder; maliyeti §Ypozitif§! olan bir anlaşmanın kabul edilme ihtimali ise daha düşüktür. Yapay zekânın anlaşmayı kabul etme isteğinin tam dökümünü kabul kutusunun üzerine gelerek görebilirsiniz.\n\nBir oyuncu için hazırlanan hiçbir barış anlaşması bu değerlerden etkilenmez."
 CPD_annex_state_button_TT_DEMAND:0 "Eyalet Talep Et"
 CPD_annex_state_button_TT_CONCESSION:0 "Eyalet Ver"
 CPD_annex_state_button_TT_DELAYED_DEMAND:0 "Seçilen düşman toprakları, halkı, fabrikaları ve kaynaklarıyla birlikte ülkemize ilhak edilir. Çekirdek toprağımız olan eyaletler stratejik değerin yarısına, hak iddia ettiklerimiz üçte birine mal olur. Asıl sahibinin hâlâ elinde tuttuğu toprağı talep etmek maliyeti ikiye katlar."
 CPD_annex_state_button_TT_DELAYED_CONCESSION:0 "§YEyalet Vermek§!, onları düşmana devretmek demektir. Verilen her toprak anlaşmanın toplam maliyetini düşürür ve diğer taleplerimizi tatlandırır."
 CPD_make_puppet_button_TT_DEMAND:0 "Kukla Hükümet Kur"
 CPD_make_puppet_button_TT_CONCESSION:0 "Kukla Hükümet Ver"
 CPD_make_puppet_button_TT_DELAYED_DEMAND:0 "§YKukla Hükümet§! talep etmek, seçilen düşman topraklarından yeni bir bağımlı devlet yaratır. Yeni kukla, ana ülkesinin kültürünü devralır ancak dış politikada bize bağlı olur. Ana ülke üzerinde çekirdek toprağı olan bir bağımlı ülkemiz zaten varsa, bu eyaletler yeni bir devlet doğurmak yerine o bağımlı ülkeye katılır."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION:0 "§YKukla Hükümet§! vermek, düşmanın elimizdeki topraklardan bir bağımlı devlet yaratmasına izin verir. Yeni kukla hükümet onlara bağlı olur."
 CPD_demilitarise_state_button_TT_DEMAND:0 "Eyaletlerin Askerden Arındırılmasını Talep Et"
 CPD_demilitarise_state_button_TT_CONCESSION:0 "Eyaletlerin Askerden Arındırılmasını Öner"
 CPD_demilitarise_state_button_TT__DELAYED_DEMAND:0 "§YAskerden Arındırma§! talep etmek, seçilen düşman eyaletlerini hiçbir ordunun faaliyet gösteremediği bölgelere çevirir. Sahibi oralara asker konuşlandıramaz ve tahkimat inşa edemez."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION:0 "§YAskerden Arındırma§! kabul etmek, kendi eyaletlerimizi aynı kısıtlamalara tabi kılar. Verilen topraklarda kuvvet hareket ettiremez ya da konuşlandıramayız."
 CPD_liberate_in_state_button_TT_DEMAND:0 "Eyaletleri Özgürleştir"
 CPD_liberate_in_state_button_TT_CONCESSION:0 "Bağımsızlık Ver"
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND:0 "§YÖzgürleştirme§! talep etmek, seçilen eyaletleri üzerinde haklı iddiası olan ülkeye geri verir. Hâlâ var olan bir çekirdek toprak sahibi toprağı doğrudan alır; çoktan yok olmuş olan yeniden canlandırılarak alır. Hiçbir çekirdek toprak sahibi kalmadıysa, mevcut sahibinin geriye kalanından yeni bir ayrılıkçı devlet kurulur."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION:0 "§YBağımsızlık§! vermek, elimizdeki seçili eyaletleri haklı sahibine bırakır; bu ülke ister hâlâ ayakta olsun ister tarihten yeniden canlandırılsın."
