l_english:
 ATA_lock.1.t:0 "Cumhuriyet Ayakta"
 ATA_lock.1.d:0 "Hükümet değişikliği geri alındı. Atatürk yolu sürdüğü sürece hiçbir seçim, darbe ya da parti manevrası iktidarı bu yoldan alamaz. Bu yola ait hükümet yeniden başta ve seçimler askıda kalıyor."
 ATA_lock.1.a:0 "Olması gereken buydu"
 ATA_lock.2.t:0 "Ordu Yerinde"
 ATA_lock.2.d:0 "Hükümeti devirme girişimi boşa çıktı. Generaller yeniden başta ve silahlı kuvvetlerin yolu devam ediyor. Bu yol sürdüğü sürece hükümet milliyetçi kalır."
 ATA_lock.2.a:0 "Düzen yeniden kuruldu"
