l_english:
 generic.Communist-State:0 "£generic_Communist_State_small Komünistler"
 generic.Communist-State_desc:0 "Komünizm genel olarak, ortaklaşa bir işçi cenneti yaratmak için kapitalist sistemin sona erdirilmesini savunan bir ideolojiyi ifade eder. Gerçekte komünist ülkeler kapitalist ekonomik sistemleri sürdürür ve çoğunlukla demokratik değildir."
 TUR.Western_AutocracyDP:0 "£tur_pro_western_autocrat DP"
 TUR.Western_AutocracyMEM:0 "£tur_memleket_partisi Memleket Partisi"
 NTU.Western_Autocracy:0 "£tur_nato_defence_shield NATO Karargâhı"
 TUR.conservatism_2017:0 "£tur_western_conservative_2017 İYİ Parti"
 TUR.conservatism_2017_desc:0 "İYİ Parti, iyi işleyen bir sosyal devlet kurarak toplumsal adaletsizliğin üstesinden gelmeyi amaçlayan milliyetçi, Kemalist ve laik bir Türk siyasi partisidir. 25 Ekim 2017'de kurulan parti, Türkiye'nin kurucusu Mustafa Kemal Atatürk'ün ilke ve ideallerine bağlıdır."
 TUR.Communist-State:0 "£tur_non_aligned_social_democrat İP"
 TUR.Communist-StateP:0 "£tur_non_aligned_social_democrat Vatan Partisi"
 TUR.Communist-State_desc:0 "İşçi Partisi, Türkiye'de Marksist-Leninist bir siyasi partidir. Parti, Türkiye Komünist Partisi (TKP) içindeki iki rakip hizip arasındaki iç çekişmenin sonucunda kurulmuştur."
 TUR.Conservative_saadet:0 "£tur_saadet Saadet Partisi"
 TUR.Conservative_saadet_desc:0 "Saadet Partisi, Fazilet Partisi'nin (FP) Anayasa Mahkemesi tarafından kapatılmasının ardından 20 Temmuz 2001'de kuruldu. Partinin yenilikçi kanadı Adalet ve Kalkınma Partisi'ni (AKP) kurarken gelenekçiler Saadet Partisi'ni kurdu. İslamcı bir parti olmasına rağmen programı Türkiye'deki siyasi meselelerin tamamını kapsar."
 TUR.Autocracy_rfp:0 "£tur_yeniden_refah Yeniden Refah"
 TUR.Mod_Vilayat_e_Faqih:0 "£tur_kurd_party HADEP"
 TUR.Mod_Vilayat_e_Faqih_desc:0 "Halkın Demokrasi Partisi, Türkiye'de bir Kürt siyasi partisiydi. 11 Mayıs 1994'te avukat Murat Bozlak tarafından kuruldu."
 TUR.Mod_Vilayat_e_Faqih_2017:0 "£tur_emerging_left_wing_radical HDP"
 TUR.HDP:0 "£tur_emerging_left_wing_radical HDP"
 TUR.Mod_Vilayat_e_Faqih_2017_desc:0 "HDP, Türkiye'de azınlık haklarını savunan bir siyasi partidir. Genel olarak sol olan parti, katılımcı ve radikal demokrasi, feminizm, azınlık hakları, gençlik hakları ve eşitlikçiliğe güçlü vurgu yapar."
 TUR.Mod_Vilayat_e_Faqih_2023:0 "£tur_ysp YSP"
 TUR.Vilayat_e_Faqih_2:0 "£tur_huda_par HÜDA PAR"
 TUR.Neutral_Muslim_Brotherhood_2001:0 "£tur_non_aligned_moderate_islamist AKP"
 TUR.Neutral_Muslim_Brotherhood_2001_desc:0 "Adalet ve Kalkınma Partisi, Türkiye'de muhafazakâr popülist bir siyasi partidir."
 TUR.Neutral_Autocracy_Gelecek:0 "£tur_gelecek Gelecek Partisi"
 TUR.HEPAR:0 "£tur_hepar HEPAR"
 TUR.JUC:0 "£tur_court Anayasa Mahkemesi"
 MAF.oligarchism:0 "£mafia_party Mafya Karargâhı"
 MAF.oligarchism_icon:0 "£mafia_party Mafya Karargâhı"
 TECH.oligarchism:0 "£tur_hp HP"
 TECH.oligarchism_icon:0 "£tur_hp HP"
 TECH.oligarchism_desc:0 "Teknokrasi, karar vericilerin özellikle bilimsel veya teknik bilgi bakımından ilgili sorumluluk alanındaki uzmanlıklarına göre seçildiği bir yönetim biçimidir. Bu sistem, seçilmiş temsilcilerin hükümette başlıca karar vericiler olması gerektiği fikrine dayanan temsilî demokrasiyle açıkça zıtlık içindedir."
 MIT.oligarchism:0 "£tur_mit MİT"
 MIT.oligarchism_icon:0 "£tur_mit MİT"
 MIT.oligarchism_desc:0 "Millî İstihbarat Teşkilatı, ulusal çıkarlara ilişkin bilgi toplamakla görevli Türk hükümetinin istihbarat teşkilatıdır. Türkiye'nin ülke bütünlüğünü, anayasal düzenini, varlığını, bağımsızlığını, güvenliğini ve millî gücünü oluşturan tüm unsurlara karşı içeriden ve dışarıdan yöneltilen mevcut ve muhtemel tehditler hakkında Cumhurbaşkanlığı ve Silahlı Kuvvetler için bilgi toplar ve gerektiğinde önlem alır."
 SADAT.oligarchism:0 "£tur_SADAT SADAT"
 SADAT.oligarchism_icon:0 "£tur_SADAT SADAT"
 SADAT.oligarchism_desc:0 "SADAT A.Ş. Uluslararası Savunma Danışmanlığı, merkezi İstanbul'da bulunan özel bir Türk askeri şirketidir. Ülkenin ilk yerli askeri danışmanlık şirketi olup 2012'de emekli Türk Silahlı Kuvvetleri (TSK) tuğgenerali Adnan Tanrıverdi tarafından kurulmuştur."
 TUR.Neutral_Communism_TIP:0 "£tur_tip TİP"
 TUR.Neutral_Communism_desc_TIP:0 "Türkiye İşçi Partisi (TİP), Türkiye'de bir siyasi partidir. Parti, Türkiye Komünist Partisi'ndeki (TKP) bir bölünmeden doğmuştur. İki rakip hizip arasındaki iç çekişmenin sonucunda eski genel başkan Erkan Baş liderliğindeki grup önce 2014'te Halkın Komünist Partisi'ni (HTKP) kurdu; üç yıl sonra, 2017'de aydınlar, gençler, kadınlar, sendika liderleri ve işçilerin katılımıyla parti Türkiye İşçi Partisi adını aldı."
 TUR.Nat_Fascism_Zafer:0 "£tur_zafer_partisi Zafer Partisi"
 TUR.Nat_Fascism_Zafer_desc:0 "Zafer Partisi, 26 Ağustos 2021'de Ümit Özdağ liderliğinde kurulan sağ ile aşırı sağ arasında konumlanan, milliyetçi, göçmen karşıtı ve Kemalist bir Türk siyasi partisidir. Hâlen TBMM'de tek bir milletvekiliyle, Özdağ'ın kendisiyle temsil edilmektedir. Zafer Partisi, Ümit Özdağ'ın başlattığı ve partinin kuruluşunun ardından bir gençlik hareketine dönüşen Ayyıldız Hareketi'nin devamıdır."
 MTU.Nat_Populism:0 "£generic_Nat_Populism_small Gülen Hareketi"
 MTU.Nat_Fascism:0 "£generic_Nat_Fascism_small Ulusal Yeniden Yapılanma İttifakı"
 MTU.Neutral_Muslim_Brotherhood:0 "£generic_Neutral_Muslim_Brotherhood_small Ilımlı Gelenekçiler"
 MTU.Monarchist:0 "£tur_nationalist_monarchist Osmanoğlu Hanedanı"
 MTU.Caliphate:0 "£tur_ibdas Hilafet Destekçileri"
 KTU.liberalism:0 "£tur_nationalist_military_junta Silahlı Kemalistler"
 KTU.socialism:0 "£generic_socialism_small Sol Popülistler"
 MTU.Nat_Populism_desc:0 "Katılımcıları tarafından Hizmet veya Cemaat olarak anılan ve 2015'ten bu yana Türkiye Hükümeti tarafından FETÖ (Fethullahçı Terör Örgütü) olarak adlandırılan Gülen hareketi, 1999'dan itibaren ABD'de yaşamış Türk İslam vaizi Fethullah Gülen'in yazı ve vaazlarından ilham alan, siyasi boyutları ve emelleri olan ulusötesi bir İslami harekettir. Hareket; Türkiye, Pakistan ve Körfez İşbirliği Konseyi tarafından terör örgütü olarak tanınmaktadır. Gülen hareketinin Türkiye'de yasaklı olması nedeniyle bazı gözlemciler hareketin Türk Müslüman gönüllülerini fiilen Sünni İslam'ın bir alt kolu olarak görür; bu gönüllüler genellikle dinî inançlarında genel Türk Sünni İslam anlayışını benimser. Hareket, başka milletlerden ve inançlardan katılımcıları da kapsar."
 CTU.Conservative:0 "£tur_emerging_communism TKP"
 CTU.Conservative_desc:0 "16 Ağustos 1993'te Sosyalist İktidar Partisi adıyla kuruldu. 2001'de parti adını Türkiye Komünist Partisi (TKP) olarak değiştirdi ve TKP'nin tarihî mirasını devraldı."
 CTU.anarchist_communism:0 "£tur_odp ÖDP"
 CTU.Autocracy:0 "£tur_emep EMEP"
 CTU.Communist-State:0 "£tur_non_aligned_social_democrat Vatan Partisi"
 TUR.Anarchist_Communism:0 "£tur_anarcho_red Anarko-Sol Eğilimler"
 TUR.Anarchist_Communism_desc:0 "Bazen kızıl anarşizm olarak da anılan sosyal anarşizm, bireysel özgürlüğü karşılıklı yardımlaşmayla iç içe gören anarşizm koludur."
 TUR.Anarchist_Social:0 "£tur_anarcho_pacifism Anarko-Pasifizm"
 TUR.Anarchist_Social_desc:0 "Anarko-pasifizm, şiddetin hangi amaçla olursa olsun her türlüsünü tamamen reddeden bir anarşizm biçimidir. Başlıca öncülü, Sivil İtaatsizlik adlı eseriyle hem Lev Tolstoy'un hem de Mohandas Gandhi'nin şiddetsiz direniş savunusunu etkileyen Henry David Thoreau'dur."
 TUR.Anarchist_Libertarian:0 "£tur_anarcho_capitalism Anarko-Kapitalizm"
 TUR.Anarchist_Libertarian_desc:0 "Anarko-kapitalizm (gündelik dilde ankap), merkezi devletlerin kaldırılarak yerine özel kurumlarca korunan özel mülkiyet sistemlerine, saldırmazlık ilkesine, serbest piyasalara ve özel mülkiyetin denetimini benliğin bir parçası sayan sağ-liberteryen kendi kendine sahiplik yorumuna dayalı devletsiz toplumların getirilmesini amaçlayan bir siyaset felsefesi ve ekonomi teorisidir. Anarko-kapitalistler, yasaların yokluğunda toplumun gönüllü bir toplum olarak tanımladıkları serbest piyasaya katılım yoluyla sözleşmeler aracılığıyla kendini düzenleme ve medenileşme eğiliminde olduğunu savunur."
 TUR.Anarchist_Green:0 "£tur_anarcho_green Anarko-Natürizm"
 TUR.Anarchist_Green_desc:0 "Anarko-natürizm, 19. yüzyılın sonlarında anarşist ve natürist felsefelerin birleşimi olarak ortaya çıktı."
 TURKIC.Nat_Autocracy:0 "£turkic_nationalist_military_junta Türk Silahlı Kuvvetleri"
 TURKIC.Nat_Autocracy_desc:0 "Türklerin ordusu olarak bilinir ve Göktürklerden gelir. Türk ordusunun amacı vatanı savunmak, hatta gerekirse iktidarı ele almaktır."
 TURKIC.Nat_Populism:0 "£turkic_mhp MHP"
 TURKIC.Nat_Populism_desc:0 "Milliyetçi Hareket Partisi, Türk ülkücülüğünü ve Avrupa şüpheciliğini benimseyen aşırı sağcı bir Türk siyasi partisidir. Parti Türk Birliğini kararlılıkla destekler."
 TURKIC.Monarchist:0 "£turkic_family Türk Kağanlığı"
 TURKIC.oligarchism:0 "£turkic_bbp BBP"
 TURKIC.Western_AutocracyDP:0 "£turkic_dp TDP"
 TURKIC.socialism:0 "£turkic_chp CHP"
 TURKIC.socialism_desc:0 "Cumhuriyet Halk Partisi, Türk Birliği'nde sosyal demokrat, Kemalist bir siyasi partidir. Ülkenin en eski siyasi partisidir. CHP kendini Türk Birliği'nin ve Türkiye Cumhuriyeti'nin kuruluş ilke ve değerlerine bağlı "modern bir sosyal demokrat parti" olarak tanımlar. Parti "modern Türkiye'nin kurucu partisi" olarak anılır. Logosu, Kemalizmin kuruluş ilkelerini temsil eden Altı Ok'tan oluşur: cumhuriyetçilik, milliyetçilik, devletçilik, halkçılık, laiklik ve inkılapçılık. Ayrıca CHP, Avrupa Sosyalistler Partisi'nin (PES) ortak üyesi ve Sosyalist Enternasyonal ile İlerici İttifak'ın üyesidir."
 TURKIC.Communist-State:0 "£turkic_communist TKP"
 TURKIC.Communist-State_desc:0 "Bu parti genel gücünü DİSK'ten ve önceden var olan komünist partilerden alır. Partinin adı Türk Komünist Partisi'dir. Parti sokaklarda rahatça görülebilir. Amacı işçileri korumak ve bunu milliyetçi bir ortamda başarmaktır."
 UTU.Nat_Populism:0 "£tur_nationalist_fascism MHP"
 UTU.Nat_Fascism:0 "£tur_bozkurtlar Bozkurtlar"
 TUR.TKPH:0 "£tur_emerging_communism TKP"
 TUR.TKPH_desc:0 "16 Ağustos 1993'te Sosyalist İktidar Partisi adıyla kuruldu. 2001'de parti adını Türkiye Komünist Partisi (TKP) olarak değiştirdi ve TKP'nin tarihî mirasını devraldı."
