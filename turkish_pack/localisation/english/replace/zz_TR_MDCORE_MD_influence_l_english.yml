 INFLUENCE_TOOLTIP_DELAYED:0 "Nüfuz, bir ülke üzerinde sahip olunan etkiyi ve hâkimiyeti ölçer. Nüfuz; binalara yatırım yaparak, hediye vererek, askeri yardım sağlayarak ve siyasi güç kullanarak artırılabilir. Diğer ülkeler nüfuz için yarışır ve ev sahibi ülke elinden geliyorsa egemenliğini savunmaya çalışır.\n\n Nüfuzunuz yeterince yüksekse ülkeyi lehinize ticaret anlaşmaları imzalamaya zorlayabilir, hatta onu bağımlı ülkeniz hâline getirebilirsiniz. Dünya Görüşünüze doğru yavaş bir kaymaya yol açmasının yanı sıra nüfuz, siyasetlerini lehinize manipüle etmek için bir para birimi olarak da kullanılabilir."
 influence_action_button_TT:0 "§HNüfuz Yay§!\n£click_left §YSol Tıkla§! ile §Y[FROM.GetNameWithFlag]§! ülkesini otomatik nüfuz uygulanacak ülke olarak belirle veya kaldır. Otomatik nüfuz uygulamak, otomatik nüfuz uyguladığınız her ülke için £pol_power §YGünlük Siyasi Gücünüzü§! her gün §R-1,50§! değiştirir. Otomatik nüfuzdan gelen §YNüfuz§! her ayın sonunda uygulanır. £pol_power Siyasi Gücünüz §R-100§!'ün altına düşerse otomatik nüfuz iptal edilir. Bir otomatik nüfuz belirledikten sonra iptal etmek için 30 gün beklemeniz gerekir. Şu anda kimin üzerinde nüfuz kurduğunuzu görmek için §YNüfuz Harita Modunu§! kullanabilirsiniz. (Mevcut §YGünlük Siyasi Maliyet§!: §R[?ROOT.auto_influence_cost|2]§!)\n\n(£key_shift + £click_left §YShift + Sol Tıkla§!)  §YŞu Anda Otomatik Nüfuz Uygulanan Tüm Ülkeleri Temizle§!\n£click_right §YSağ Tıkla§! ile §Y[FROM.GetNameWithFlag]§! üzerinde £pol_power §R50§! Siyasi Güç karşılığında elle §YNüfuz§! uygula"
