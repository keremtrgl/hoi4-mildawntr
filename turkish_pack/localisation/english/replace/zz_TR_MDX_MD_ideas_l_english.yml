 Opium_Economy:0 "Afyon Ekonomisi"
 Opium_Economy_desc:0 "Afyon, Afganistan'da yüzyıllardır başlıca nakit ürün olmuştur. Ancak son birkaç on yılın kaosu ve küresel uyuşturucu ticaretinin ortaya çıkışıyla birlikte Afganistan'da afyon ekimi büyük ölçüde artmış, kırsal ekonominin büyük bölümü artık haşhaşa bağımlı hale gelmiştir. Büyük bölümü yasa dışı uyuşturucu üretiminde kullanıldığı için hükümetimizin bu ekimden kâr elde etmesi güçtür."
 Major_Non_NATO_Ally:0 "Başlıca NATO Dışı Müttefik"
 Major_Non_NATO_Ally_desc:0 "Başlıca NATO dışı müttefik (MNNA), Amerika Birleşik Devletleri hükümeti tarafından ABD Silahlı Kuvvetleriyle stratejik çalışma ilişkisi bulunan ancak Kuzey Atlantik Antlaşması Örgütü (NATO) üyesi olmayan yakın müttefiklere verilen bir statüdür. MNNA statüsü ABD ile otomatik olarak karşılıklı savunma paktı anlamına gelmese de, NATO dışı ülkelerin başka türlü elde edemeyeceği çeşitli askeri ve mali avantajlar sağlar."
 ISI_jihadist_islamic_state:0 "Cihatçı İslam Devleti"
 ISI_jihadist_islamic_state_desc:0 "[ISI.GetNameWithFlag] toparlandı ve Hilafet güçlü kalmaya devam ediyor. Kâfirlere karşı cihat etme ve onların cılız varlığına son verme zamanı!"
 ISI_islamic_state_early_offensive_idea:0 "İslam Devleti'nin Erken Taarruzu"
 ISI_islamic_state_early_offensive_idea_desc:0 "İslam Devleti, Suriye ve Irak'ta taarruza başladı."
 ISI_islamic_state_failure_idea:0 "İslam Devleti'ne Karşı Savunma Başarısızlığı"
 ISI_islamic_state_failure_idea_desc:0 "Hilafet taarruzunu başlattı ve ona karşı savunmaya hazır değiliz. Savunmamızı güçlendirmeli ve en kötüsüne hazırlanmalıyız."
 ISI_decapitated_leadership:0 "Başsız Kalan Liderlik"
 ISI_decapitated_leadership_desc:0 "Bir hava saldırısı Hilafet'in üst düzey komutanlarından birini öldürdü. Maiyeti boş makam için kavga ediyor, emirler cepheye geç ulaşıyor ya da hiç ulaşmıyor ve onun terk edeceği mevzileri tutmak için tecrübeli savaşçılar harcanıyor."
 isis_sleeper_cell_idea:0 "IŞİD Uyuyan Hücreleri"
 isis_sleeper_cell_idea_desc:0 "Lanet teröristler bir şekilde ülkemize sızdı ve sorun çıkarıyor. Daha fazla kan, gözyaşı ve acıya yol açmadan onları bitirmeliyiz."
 israel_new_intifada:0 "Yeni İntifada"
 hutu_tutsi_tensions:0 "Hutu-Tutsi Gerginliği"
 hutu_tutsi_tensions_desc:0 "Hutular ve Tutsiler, Demokratik Kongo Cumhuriyeti ile Tanzanya arasındaki sınır bölgelerinde, özellikle Burundi ve Ruanda adlı iki küçük ülkede yaşayan iki ayrı etnik gruptur. Burundi'de Tutsiler egemendir ve 1972'de Hutulara karşı bir soykırım gerçekleştirmiştir; Ruanda'da ise Hutular egemendir ve 1994'te Hutu milisleri binlerce Tutsi'yi katletmiştir.\n\nBu iki etnik grup bir türlü anlaşamıyor gibi görünüyor, ancak Avrupalıların çizdiği sömürge sınırları yüzünden aynı ülkelere sıkıştırılmışlardır."
 generic_nationalist_boost_idea:0 "Milliyetçiliğin Yükselişi"
 generic_western_boost_idea:0 "Batı Yanlısı Bağlılık"
 generic_emerging_boost_idea:0 "Doğu'nun Yükselişi"
 generic_salafist_boost_idea:0 "Selefi Yükseliş"
 generic_non_aligned_boost_idea:0 "Bağlantısızlığın Yükselişi"
 additional_recruits:0 "Ek Askerler"
 additional_recruits_desc:0 "Hedefli askere alma kampanyaları ve genişletilmiş zorunlu askerlik politikaları silahlı kuvvetlerimiz için kullanılabilir insan gücünü artırdı."
 agricultural_investments:0 "Tarım Yatırımları"
 agricultural_investments_desc:0 "Tarımsal altyapıya ve modernizasyon programlarına yapılan stratejik yatırımlar, gıda üretim kapasitemizi ve kırsal ekonomik kalkınmayı geliştirecektir."
 commercialized_agricultural_investments:0 "Ticarileştirilmiş Tarım Yatırımları"
 commercialized_agricultural_investments_desc:0 "Büyük ölçekli ticari çiftçilik faaliyetleri ve tarım işletmeciliğinin gelişimi, ihracat fırsatları yaratırken tarımsal üretimimizi artıracaktır."
 aircraft_investments:0 "Uçak Yatırımları"
 aircraft_investments_desc:0 "Uçak imalat yeteneklerimizi genişletmek ve üretimi hızlandırmak için özel fon ve sanayi kapasitesi ayrılmıştır."
 amphibious_expertise:0 "Amfibi Uzmanlığı"
 amphibious_expertise_desc:0 "Özel eğitim programları ve taktik doktrin geliştirme çalışmaları, ordumuzun amfibi harekât yürütme yeteneğini artırdı."
 army_morale_bonus:0 "Kara Ordusu Moral Bonusu"
 army_morale_bonus_desc:0 "İyileştirilen koşullar, daha iyi liderlik ve yenilenen ulusal amaç, kara kuvvetlerimizin savaş ruhunu güçlendirdi."
 army_organization_bonus:0 "Kara Ordusu Düzen Bonusu"
 army_organization_bonus_desc:0 "Komuta yapılarında ve lojistik sistemlerinde yapılan reformlar, ordumuzu sahada daha verimli ve daha düzenli hale getirdi."
 artillery_production_bonus:0 "Topçu Üretim Bonusu"
 artillery_production_bonus_desc:0 "Kaynakların ve üretim tesislerinin odaklı biçimde tahsis edilmesi, top ve destek silahlarının imalatını hızlandırdı."
 drone_production_idea:0 "Yerli Dron Üretimi"
 drone_production_idea_desc:0 "İnsansız hava aracı teknolojisine ve üretim tesislerine yapılan yatırım, yerli bir dron imalat kapasitesi oluşturdu."
 equipment_conversion_efforts_idea:0 "Teçhizat Dönüşüm Çabaları"
 equipment_conversion_efforts_idea_desc:0 "Sanayi hatlarının ve fabrikaların, teçhizatı hızla daha modern teçhizata dönüştürmek üzere hedefli biçimde yeniden donatılması, askeri modernizasyon çabalarımızı destekleyecektir."
 civilian_industry_project:0 "Sivil Sanayi Projesi"
 commander_skill_bonus:0 "Komutan Beceri Bonusu"
 OAU_member:0 "Afrika Birliği Örgütü Üyesi"
 OAU_member_desc:0 "Afrika Birliği Örgütü (OAU), 1963'te dönemin bağımsız Afrika ülkeleri tarafından kurulmuştur. Örgütün amacı Afrika'nın siyasi ve ekonomik entegrasyonunu teşvik etmek ve sömürgeciliğe ve yeni sömürgeciliğe karşı mücadele etmekti. Ancak devletler arasında ortak bir askeri, yargısal veya siyasi birim kurulmadığı için örgüt büyük oranda bir «lafügüzaf kulübü» olarak kalmıştır. 1999'da Libya lideri Muammer Kaddafi'nin öncülüğünde OAU üyeleri Sirte Bildirgesi'ni imzalayarak OAU'nun en geç 2002'ye kadar yerini, Afrika kıtasını birleştirebilecek bir örgüt yaratmak üzere Afrika Birliği'ne bırakmasını amaçladı."
 AU_member:0 "Afrika Birliği Üyesi"
 AU_member_desc:0 "Afrika Birliği, Afrika Birliği Örgütü üyelerinden oluşturulmuştur. Önceki örgütün aksine Afrika Birliği siyasi kurumlar kurmuş ve kıtanın askeri, ekonomik, yargısal ve mali entegrasyonu için bir yol haritası belirlemiştir."
