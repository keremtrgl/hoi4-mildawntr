 ecowas_member_state:0 "ECOWAS"
 ecowas_member_state_desc:0 "Batı Afrika Devletleri Ekonomik Topluluğu, Batı Afrika'da bulunan on beş ülkenin siyasi ve ekonomik birliğidir. Birlik, ekonomik ve ticari bir birlik kurarak bir Batı Afrika ticaret bloğu oluşturmak suretiyle 'Kolektif Kendi Kendine Yeterlilik'i teşvik etme amacıyla Mayıs 1975'te resmen kurulmuştur. Ayrıca ECOWAS bölgede bir barış gücü olarak görev yapar ve üye ülkelerde siyasi istikrarsızlık veya huzursuzluk dönemlerinde kullanılmıştır."
 cfa_franc:0 "CFA Frankı"
 cfa_franc_desc:0 "CFA Frankı, İkinci Dünya Savaşı'ndan sonra sömürgeleri sert devalüasyondan korumak için oluşturuldu. Başlangıçta Fransız hükümetinin bir cömertliği olarak sunuldu, ancak gözler CFA Frankı'na sömürgecilik sonrası tahakkümün bir başka aracı olarak çevrildi. Para biriminin ekonomik yararları ve istikrarı, Fransa'nın üzerimizde koruduğu nüfuzun ve para politikamız üzerindeki denetiminin önüne her zaman geçmeyebilir."
 combined_arms_idea:0 "Birleşik Silahlar"
 combined_arms_idea_desc:0 "Birleşik silahlar fikri, nihai başarıyı elde etmek için bir ordunun farklı muharebe silahlarını bütünleştiren bir savaş yöntemidir."
 eco_factories_projects_idea:0 "Çevre Dostu Fabrikalar"
 eco_factories_projects_idea_desc:0 "Ülkelerimizi daha yeşil hâle getirme çabasıyla Çevre Dostu Fabrikalar kavramını uygulamaya başladık. Çevreye çevre dostu sanayi kurmaktan daha iyi nasıl yardım edilebilir?"
 sunni:0 "Sünni"
 sunni_desc:0 "Sünni İslam, İslam'ın en büyük mezhebidir. Adını İslam peygamberi Muhammed'in örnek davranışlarına işaret eden Sünnet sözcüğünden alır. Sünni ve Şii Müslümanlar arasındaki farklar, Muhammed'in halefinin seçimi konusundaki bir anlaşmazlıktan doğmuş, sonradan daha geniş siyasi önem ile teolojik ve hukuki boyutlar kazanmıştır."
 sufi_islam:0 "Sufi"
 sufi_islam_desc:0 "Sufi İslam çoğunlukla «İslami mistisizm» olarak tanımlanır. İslam tarihinin çok erken döneminde, İslam'ın siyasallaşmasına tepki olarak ortaya çıkmıştır. Sufiler, Kuran'ın sürekli okunması, ilahi söylenmesi ve derin tefekkür yoluyla arayıcı ile Muhammed arasında manevi bir bağ, yani vecd, kurulduğuna inanır. Sufiler Muhammed aracılığıyla Allah'ı anlamayı, onunla bağ kurmayı ve onu deneyimlemeyi hedefler. Tarihsel olarak Sufi misyonerler İslam'ı Afrika'ya ve Hint Alt Kıtası'na yayan başlıca kişilerdi."
 ibadi:0 "İbadi"
 ibadi_desc:0 "İbadi dinî hareketi, peygamber Muhammed'in ölümünden 20 yıl sonra İslam'ın ana kolundan ayrılmıştır ve bu nedenle hem Sünni hem Şii İslam'dan önce gelir. Hareket, Ali'nin Sıffin Savaşı'nda hakemliği kabul etmesinin onu liderliğe uygunsuz kıldığına, meşru halifeyi müzakerelerin değil savaş meydanındaki Allah hükmünün belirlemesi gerektiğine inanılan Hariciler ayrılığıyla birlikte doğmuştur. Ancak aşırılıkçı Haricilerden çok daha hoşgörülü bir kol sayılır ve İbadilik hem Sünnilerle hem Şiilerle birkaç belirgin inancı paylaşır."
 shia:0 "Şii"
 shia_desc:0 "Şia (Ali'nin takipçileri), İslam peygamberi Muhammed'in Ali bin Ebu Talib'i halefi (imam) olarak belirlediğini savunan bir İslam koludur. Şii İslam esas olarak, Muhammed'in halef atamadığına inanan ve Ebu Bekir'i (şura yoluyla, yani toplumsal uzlaşıyla halife atanmıştı) doğru halife sayan Sünni İslam ile karşıtlık oluşturur."
 shia_iranian_school:0 "Şii - İran Okulu"
 shia_iranian_school_desc:0 "Şia (Ali'nin takipçileri), İslam peygamberi Muhammed'in Ali bin Ebu Talib'i halefi (imam) olarak belirlediğini savunan bir İslam koludur. Şii İslam esas olarak, Muhammed'in halef atamadığına inanan ve Ebu Bekir'i (şura yoluyla, yani toplumsal uzlaşıyla halife atanmıştı) doğru halife sayan Sünni İslam ile karşıtlık oluşturur. Şiiliğin İran Okulu, ulemayı tümüyle devre dışı bırakır ve ulema ile kurumlar üzerinden gitmek yerine Tanrı ile doğrudan ilişkiyi savunur."
 judaism:0 "Yahudilik"
 judaism_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nYahudilik, temel metni Tevrat olan kadim bir tek tanrılı İbrahimî dindir. Yahudi halkının dinini, felsefesini ve kültürünü kapsar. Dindar Yahudiler Yahudiliği, Tanrı'nın İsrailoğulları ile kurduğu ahdin ifadesi olarak görür."
 cheondo:0 "Cheondo"
 cheondo_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nCheondoculuk («Göksel Yol Dini»), 19. yüzyılda Choe Je-u tarafından kurulan ve Son Byeong-hui tarafından sistemleştirilen Donghak neo-Konfüçyüsçü hareketine dayanan, 20. yüzyıl Kore dinî hareketidir. Kökeni, Joseon hanedanı döneminde 1812'den itibaren ortaya çıkan köylü isyanlarına uzanır."
 shinto:0 "Şinto"
 shinto_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nŞinto, günümüz Japonya'sı ile kadim geçmişi arasında bir bağ kurmak için özenle yerine getirilen ritüel uygulamalara odaklanan Japonya'nın etnik dinidir."
 buddism:0 "Budist"
 buddism_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nBudizm, büyük ölçüde Buda'ya atfedilen öğretilere dayanan çeşitli gelenekleri, inançları ve manevi uygulamaları kapsayan bir din ve dharmadır. M.Ö. 6 ile 4. yüzyıllar arasında Antik Hindistan'da ortaya çıkmış, oradan Asya'nın büyük bölümüne yayılmış ve Ortaçağ'da Hindistan'da gerilemiştir."
 hindu:0 "Hinduizm"
 hindu_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nHinduizm, Hint alt kıtasında yaygın biçimde uygulanan bir din veya yaşam biçimidir. Dünyanın en eski dini olarak anılmıştır ve bazı mensupları ve araştırmacılar onu insanlık tarihinin ötesinde «ebedî gelenek» ya da «ebedî yol» anlamına gelen Sanātana Dharma olarak adlandırır."
 christian:0 "Batı Hristiyanlığı"
 christian_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nBatı Hristiyanlığı, Batı Hristiyan inançlarının odak noktası olan İsa Mesih'in yaşamına ve öğretilerine dayanan, İbrahimî tek tanrılı bir dindir. Protestanlık, Katoliklik ve Lutheranlık gibi birçok Hristiyan mezhebini kapsar ve toplamda 2,4 milyardan fazla mensubu, yani küresel nüfusun %33'ü vardır."
 orthodox_christian:0 "Ortodoks Hristiyan"
 orthodox_christian_desc:0 "§YÖzel Kural:§! §WIlımlı İslamcı partileri yasaklayabilir.§!\n\nOrtodoks Kilisesi olarak da bilinen ve resmen Ortodoks Katolik Kilisesi adını taşıyan Doğu Ortodoks Kilisesi, ikinci en büyük Hristiyan Kilisesi ve dünyanın hâlen var olan en eski dinî kurumlarından biridir. Doğu Ortodoks Kilisesi, kendisinin İsa Mesih'in havarilere verdiği Büyük Görev'le kurduğu Tek, Kutsal, Katolik ve Havarisel Kilise olduğunu öğretir. Orijinal Hristiyan inancı olarak anladığını uygular ve havarilerden devralınan kutsal geleneği sürdürür."
 zoroastrian:0 "Zerdüşt"
 zoroastrian_desc:0 "Zerdüştlük dünyanın en eski tek tanrılı dinidir ve öğretileri, dünyadaki iyilik ile kötülüğün ikiliğini vaaz eden İranlı peygamber Zerdüşt'e dayanır. Zerdüştlüğün üç temel ilkesi İyi düşünce, İyi söz ve İyi davranıştır."
 assianism:0 "Assianizm"
 assianism_desc:0 "Assianizm, Alan kabilelerinin İskit torunları olan Osetlerin geleneksel mitolojisinden türeyen, kadim İskit dininin devamı olduğuna inanılan bir halk dinidir. Din, Rusça konuşan mensupları arasında «Assianizm», Osetler arasında ise kendi dillerinde yalnızca Iron Din olarak bilinir. 1980'lerde Osetler arasında etnik bir din olarak bilinçli biçimde yeniden düzenlenmeye başlamıştır."
 pluralist:0 "Çoğulcu"
 pluralist_desc:0 "Kişinin dininin hakikatin tek ve münhasır kaynağı olmadığını, dolayısıyla en azından bazı hakikatlerin ve gerçek değerlerin diğer dinlerde de bulunduğunun kabul edildiğini öne süren dünya görüşünün adıdır."
 EU_member:0 "Avrupa Birliği Üyesi"
 EU_member_desc:0 "Avrupa Birliği (AB), başlıca Avrupa'da bulunan üye devletlerin siyasi ve ekonomik birliğidir. AB, tüm üye devletlerde geçerli standartlaştırılmış bir yasa sistemiyle bir iç tek pazar geliştirmiştir. AB politikaları iç pazarda insanların, malların, hizmetlerin ve sermayenin serbest dolaşımını sağlamayı, adalet ve içişleri alanında yasa çıkarmayı ve ticaret, tarım, balıkçılık ve bölgesel kalkınmada ortak politikalar yürütmeyi amaçlar."
 united_nations_member:0 "Birleşmiş Milletler Üyesi"
 united_nations_member_desc:0 "Birleşmiş Milletler (BM), 26 Haziran 1945'te BM Şartı'nın imzalanmasıyla kurulan; uluslararası barış ve güvenliği korumak, devletler arasında dostane ilişkiler geliştirmek, uluslararası iş birliğini teşvik etmek ve devletlerin bu hedeflere ulaşma eylemlerini uyumlaştıran bir merkez olarak hizmet etmek misyonuyla kurulmuş küresel hükümetlerarası bir örgüttür."
 sco_observer:0 "Şanghay İşbirliği Örgütü Gözlemcisi"
 sco_observer_desc:0 "Şanghay İşbirliği Örgütü (ŞİÖ), kuruluşu 15 Haziran 2001'de Çin'in Şanghay kentinde Çin, Kazakistan, Kırgızistan, Rusya, Tacikistan ve Özbekistan liderlerince duyurulan Avrasya'daki siyasi, ekonomik ve güvenlik örgütüdür. Gözlemci statüsü tam üyeliğe giden bir ara adım işlevi görür."
 fifty_fifty_divide:0 "Yarı Yarıya Bölünme"
 fifty_fifty_divide_desc:0 "Ülke, dinî uygulamaları bakımından neredeyse yarı yarıya bölünmüş durumda."
 al_qaeda_network:0 "El Kaide Ağı"
 al_qaeda_network_desc:0 "El Kaide'nin küresel ağının bir parçası olarak müttefiklerimize yardım için savaşçı göndermek bizim için daha kolay."
 super_power:0 "Süper Güç"
 super_power_desc:0 "Biz bir Süper Güç'üz; dünyada son derece baskın bir konuma sahibiz ve nüfuzumuzu küresel ölçekte uygulama ve güç yansıtma yeteneğimizle ayrılıyoruz. Süper Güçler küresel hegemonyayı makul biçimde elde edebilir ve geleneksel Büyük Güçleri cüce bırakarak herkesle güç için yarışabilir.\n\nGüç durumu, dünya toplamına katkıda bulunduğumuz GSYİH'ye göre belirlenir ve §YYabancı Nüfuzdan Bağımsızlığımız§! ile değişir. Şu anki katkımız §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nFarklı seviyeler için gereken katkılar:\n§Y%15§!'ten fazla: §Y$super_power$§!\n§Y%6,5§!'ten fazla: §Y$great_power$§!\n§Y%2,5§!'ten fazla: §Y$large_power$§!\n§Y%0,2§!'den fazla: §Y$minor_power$§!\n§Y%0,2§!'den az: §Y$non_power$§!\n\nHer coğrafi bölgede, bölgede yeterli sayıda §Y$super_power$§!, §Y$great_power$§! ve §Y$large_power$§! yoksa, en güçlü belirli sayıda §Y$minor_power$§! §Y$regional_power$§! olarak sınıflandırılır. Bölgeler ve §Y$minor_power$§! üzerindeki ülke sayıları:\nAvrupa (7)\nOrta Doğu ve Kuzey Afrika (3)\nSahra Altı Afrika (3)\nAsya (7)\nAmerika (4)\n\nGüç Sıralaması üç ayda bir güncellenir (Şubat, Mayıs, Ağustos ve Kasım)."
 super_power_tt:0 "£economy_laws_cost_texticon  Yasa Maliyeti: §R%+80§!\n£economy_laws_cost_texticon  §YDahili Yatırım§! Yuvaları: §G+4§!"
 great_power:0 "Büyük Güç"
 great_power_desc:0 "Biz dünyada Büyük Güç'üz; nüfuzumuzu küresel ölçekte uygulama yeteneğimiz herkesçe tanınıyor ve bu bakımdan yalnızca Süper Güçler bizi aşıyor.\n\nGüç durumu, dünya toplamına katkıda bulunduğumuz GSYİH'ye göre belirlenir ve §YYabancı Nüfuzdan Bağımsızlığımız§! ile değişir. Şu anki katkımız §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nFarklı seviyeler için gereken katkılar:\n§Y%15§!'ten fazla: §Y$super_power$§!\n§Y%6,5§!'ten fazla: §Y$great_power$§!\n§Y%2,5§!'ten fazla: §Y$large_power$§!\n§Y%0,2§!'den fazla: §Y$minor_power$§!\n§Y%0,2§!'den az: §Y$non_power$§!\n\nHer coğrafi bölgede, bölgede yeterli sayıda §Y$super_power$§!, §Y$great_power$§! ve §Y$large_power$§! yoksa, en güçlü belirli sayıda §Y$minor_power$§! §Y$regional_power$§! olarak sınıflandırılır. Bölgeler ve §Y$minor_power$§! üzerindeki ülke sayıları:\nAvrupa (7)\nOrta Doğu ve Kuzey Afrika (3)\nSahra Altı Afrika (3)\nAsya (7)\nAmerika (4)\n\nGüç Sıralaması üç ayda bir güncellenir (Şubat, Mayıs, Ağustos ve Kasım)."
 great_power_tt:0 "£economy_laws_cost_texticon  Yasa Maliyeti: §R%+45§!\n£economy_laws_cost_texticon  §YDahili Yatırım§! Yuvaları: §G+3§!"
 large_power:0 "Ana Güç"
 large_power_desc:0 "Bir Ana Güç olarak henüz Büyük Güç veya Süper Güç statüsünde değiliz, ancak küresel ve bölgesel meselelerde yine de orantısız bir nüfuz kullanıyor, egemenliğimizi ve hayati çıkarlarımızı daha büyük güçlere karşı kolaylıkla koruyabiliyoruz.\n\nGüç durumu, dünya toplamına katkıda bulunduğumuz GSYİH'ye göre belirlenir ve §YYabancı Nüfuzdan Bağımsızlığımız§! ile değişir. Şu anki katkımız §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nFarklı seviyeler için gereken katkılar:\n§Y%15§!'ten fazla: §Y$super_power$§!\n§Y%6,5§!'ten fazla: §Y$great_power$§!\n§Y%2,5§!'ten fazla: §Y$large_power$§!\n§Y%0,2§!'den fazla: §Y$minor_power$§!\n§Y%0,2§!'den az: §Y$non_power$§!\n\nHer coğrafi bölgede, bölgede yeterli sayıda §Y$super_power$§!, §Y$great_power$§! ve §Y$large_power$§! yoksa, en güçlü belirli sayıda §Y$minor_power$§! §Y$regional_power$§! olarak sınıflandırılır. Bölgeler ve §Y$minor_power$§! üzerindeki ülke sayıları:\nAvrupa (7)\nOrta Doğu ve Kuzey Afrika (3)\nSahra Altı Afrika (3)\nAsya (7)\nAmerika (4)\n\nGüç Sıralaması üç ayda bir güncellenir (Şubat, Mayıs, Ağustos ve Kasım)."
 large_power_tt:0 "£economy_laws_cost_texticon  Yasa Maliyeti: §R%+30§!\n£economy_laws_cost_texticon  §YDahili Yatırım§! Yuvaları: §G+2§!"
 regional_power:0 "Bölgesel Güç"
 regional_power_desc:0 "Bir Bölgesel Güç olarak bölgesel meselelerde orantısız bir nüfuz kullanıyor, egemenliğimizi ve hayati çıkarlarımızı daha büyük güçlerin müdahalesine karşı ülke içinde koruma yeteneğini sürdürüyoruz.\n\nGüç durumu, dünya toplamına katkıda bulunduğumuz GSYİH'ye göre belirlenir ve §YYabancı Nüfuzdan Bağımsızlığımız§! ile değişir. Şu anki katkımız §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nFarklı seviyeler için gereken katkılar:\n§Y%15§!'ten fazla: §Y$super_power$§!\n§Y%6,5§!'ten fazla: §Y$great_power$§!\n§Y%2,5§!'ten fazla: §Y$large_power$§!\n§Y%0,2§!'den fazla: §Y$minor_power$§!\n§Y%0,2§!'den az: §Y$non_power$§!\n\nHer coğrafi bölgede, bölgede yeterli sayıda §Y$super_power$§!, §Y$great_power$§! ve §Y$large_power$§! yoksa, en güçlü belirli sayıda §Y$minor_power$§! §Y$regional_power$§! olarak sınıflandırılır. Bölgeler ve §Y$minor_power$§! üzerindeki ülke sayıları:\nAvrupa (7)\nOrta Doğu ve Kuzey Afrika (3)\nSahra Altı Afrika (3)\nAsya (7)\nAmerika (4)\n\nGüç Sıralaması üç ayda bir güncellenir (Şubat, Mayıs, Ağustos ve Kasım)."
 regional_power_tt:0 "£economy_laws_cost_texticon  Yasa Maliyeti: §R%+20§!\n£economy_laws_cost_texticon  §YDahili Yatırım§! Yuvaları: §G+1§!"
 minor_power:0 "Küçük Güç"
 minor_power_desc:0 "Bir Küçük Güç olarak uluslararası diplomaside ne önemli ne önemsiziz. Öncelik verirsek yabancı baskıya ve nüfuza karşı sınırlı bir direnç gösterebiliriz, ancak yurt dışına nüfuz yansıtma yeteneğimiz çok kısıtlıdır.\n\nGüç durumu, dünya toplamına katkıda bulunduğumuz GSYİH'ye göre belirlenir ve §YYabancı Nüfuzdan Bağımsızlığımız§! ile değişir. Şu anki katkımız §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nFarklı seviyeler için gereken katkılar:\n§Y%15§!'ten fazla: §Y$super_power$§!\n§Y%6,5§!'ten fazla: §Y$great_power$§!\n§Y%2,5§!'ten fazla: §Y$large_power$§!\n§Y%0,2§!'den fazla: §Y$minor_power$§!\n§Y%0,2§!'den az: §Y$non_power$§!\n\nHer coğrafi bölgede, bölgede yeterli sayıda §Y$super_power$§!, §Y$great_power$§! ve §Y$large_power$§! yoksa, en güçlü belirli sayıda §Y$minor_power$§! §Y$regional_power$§! olarak sınıflandırılır. Bölgeler ve §Y$minor_power$§! üzerindeki ülke sayıları:\nAvrupa (7)\nOrta Doğu ve Kuzey Afrika (3)\nSahra Altı Afrika (3)\nAsya (7)\nAmerika (4)\n\nGüç Sıralaması üç ayda bir güncellenir (Şubat, Mayıs, Ağustos ve Kasım)."
 non_power:0 "Güçsüz"
 non_power_desc:0 "Güç sayılmayan bir ülke olarak uluslararası diplomaside esasen hesaba katılmayan bir unsuruz; herhangi bir konudaki tutumumuzu önemseyen çok az kişi vardır, varsa. Siyasetimizi ve toplumumuzu kolaylıkla etkileyebilen daha baskın ve nüfuzlu egemen ulusların araçlarıyız.\n\nGüç durumu, dünya toplamına katkıda bulunduğumuz GSYİH'ye göre belirlenir ve §YYabancı Nüfuzdan Bağımsızlığımız§! ile değişir. Şu anki katkımız §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nFarklı seviyeler için gereken katkılar:\n§Y%15§!'ten fazla: §Y$super_power$§!\n§Y%6,5§!'ten fazla: §Y$great_power$§!\n§Y%2,5§!'ten fazla: §Y$large_power$§!\n§Y%0,2§!'den fazla: §Y$minor_power$§!\n§Y%0,2§!'den az: §Y$non_power$§!\n\nHer coğrafi bölgede, bölgede yeterli sayıda §Y$super_power$§!, §Y$great_power$§! ve §Y$large_power$§! yoksa, en güçlü belirli sayıda §Y$minor_power$§! §Y$regional_power$§! olarak sınıflandırılır. Bölgeler ve §Y$minor_power$§! üzerindeki ülke sayıları:\nAvrupa (7)\nOrta Doğu ve Kuzey Afrika (3)\nSahra Altı Afrika (3)\nAsya (7)\nAmerika (4)\n\nGüç Sıralaması üç ayda bir güncellenir (Şubat, Mayıs, Ağustos ve Kasım)."
 non_power_tt:0 "£economy_laws_cost_texticon  Yasa Maliyeti: §G%-20§!"
 naval_power_of_the_continent:0 "Kıtanın Deniz Gücü"
 naval_power_of_the_continent_desc:0 "Kıtamızın en büyük deniz gücüne sahibiz ve şu anda kıtamızdaki en büyük deniz gücünü temsil ediyoruz. Birisi, §YKonuşlu Deniz İnsan Gücü§! bizimkinden büyükse bizi geçebilir."
 IMF_failed_to_balance_budget_idea:0 "Bütçeyi Dengeleme Başarısızlığı"
 IMF_failed_to_balance_budget_idea_desc:0 "Bütçemizi dengelemede başarısız olduk. Ülkemizde yavaş yavaş istikrar ve halk nezdinde siyasi nüfuz kaybediyoruz. Bu durumu mümkün olan en kısa sürede düzeltmeye bakmalıyız."
 child_soldiers:0 "Çocuk Askerler"
 child_soldiers_desc:0 "Çocuk Askerler orduya zorla alınıyor. Birçok asimetrik çatışmada çocuklar zorla isyancı gruplara alınır ve şiddete duyarsızlaştırılır. Bu çocukların kaderi, ömür boyu travma yaşamaları ve birçoğunun ilerleyen yaşamlarında daha fazla şiddete, alkole ve uyuşturucuya yönelmesi nedeniyle üzücüdür.\n\nÇocukları zorla askere almak güçlerimizi artırır, ancak bu genç oğlanlar çoğu zaman canlı kalkandan başka bir işe yaramaz."
 mischevous_failure:0 "Yaramazlık ve Görevi Kötüye Kullanma"
 mischevous_failure_desc:0 "Yaramazlıklarımız ve görevi kötüye kullanmamız yüzünden devlet büyük risk altına girdi; şu an istikrarsız ve yozlaşmış durumdayız"
 operatives1:0 "1 Ajan Ekle"
 operatives5:0 "5 Ajan Ekle"
 operatives10:0 "10 Ajan Ekle"
 al_jazeera:0 "El Cezire Genel Merkezi"
 al_jazeera_desc:0 "Arap dünyasının açık ara en büyük ve en etkili haber ağı olan El Cezire, Katar yumuşak gücünün incisidir. Hamad bin Halife Al Sani'nin 1995'te iktidarı almasından beri Katar'ın izlediği özerk dış politikayla eş anlamlı hâle gelmiştir."
 al_jazeera_allowed:0 "El Cezire"
 al_jazeera_allowed_desc:0 "Arap dünyasının açık ara en büyük ve en etkili haber ağı olan El Cezire, Katar'ın dünya çapındaki yumuşak gücünün incisidir."
 al_jazeera_banned:0 "El Cezire Yasaklandı"
 al_jazeera_banned_desc:0 "Popüler haber kanalı El Cezire, tehlikeli fikirleri yaydığı ve Müslüman Kardeşler'i desteklediği için yasa dışı ilan edildi. Ancak insanların onu uydu çanaklarıyla izlemesini engellemek imkânsız."
 muslim_brotherhood_crackdown:0 "Müslüman Kardeşler'e Yönelik Baskı"
 muslim_brotherhood_crackdown_desc:0 "Müslüman Kardeşler yasa dışı ilan edildi ve her fırsatta baskı altına alınıyor."
 muslim_brotherhood_home:0 "Müslüman Kardeşler'in Yurdu"
 muslim_brotherhood_home_desc:0 "Mısır, Müslüman Kardeşler adlı son derece popüler ve etkili siyasi Sünni hareketin doğum yeri ve yurdudur."
 rentier_state:0 "Rant Devleti"
 rentier_state_desc:0 "Ülke doğal kaynaklar bakımından çok zengin olduğundan halktan vergi almaya çok az ihtiyaç duyulur ya da hiç duyulmaz. Vatandaşlar vergi ödemeden yardım alır ve iyi yönetim ya da siyasi hak talep etmek için çok az teşvike sahip olur. Sonuç, otoriter ve yozlaşmış bir hükümet ile kaynak dışı sektörler için kötü bir iş ortamı olan bir ahbap-çavuş kapitalizmidir.\n\n§RBu ulusal ruh, §YKaynak Çıkarımı§! toplam GSYİH'mizin %20'sinden azına katkıda bulunursa, §YKaynak İhracatı§! geliri Halk ve Kurumlar vergilerinin toplamının %30'undan az olursa ve savaşta değilseniz kaldırılır.§!"
 youth_radicalization:0 "Gençlik Radikalleşmesi"
 youth_radicalization_desc:0 "Gençlerin çoğu İslam'ın radikal yorumlarına kapılmış durumda ve ülke, El Kaide gibi gruplar için verimli bir devşirme zemini."
 saudi_aid:0 "Mescitler ve Medreseler için Suudi Yardımı"
 saudi_aid_desc:0 "Suudi Arabistan maliyemize cömertçe yardım ediyor ve özellikle mescitlerimize ve medreselerimize (dinî eğitim merkezleri) destek oluyor. Burada İslam'ın köktenci bir yorumu olan Selefilik öğretilip yayılıyor.\n\n§W--------------§!\n§RBu ulusal ruh, Kişi Başı GSYİH'miz $35 bini aşarsa, §Y[SAU.GetNameWithFlag]§! artık Faşist olmazsa veya §Y[SAU.GetNameWithFlag]§! ile savaşa girersek kaldırılır.§!"
 saudi_aid_idea_TT:0 "Ek Gelir: 10 milyon kişi başına $§G0,002§!"
 katib_hezbollah:0 "Kataib Hizbullah"
 katib_hezbollah_desc:0 "Hizbullah artık yalnızca bir Lübnan milis grubu olmaktan çok uzak; daha geniş Orta Doğu'ya yayıldı ve İran'ın yardımıyla vekiller kurdu. Kataib Hizbullah çok büyük ve iyi eğitimli bir Iraklı Şii milisidir."
 syrian_hezbollah:0 "Suriye Hizbullahı"
 syrian_hezbollah_desc:0 "Suriye Hizbullahı, hepsi İran'ın velayet-i fakih doktrinine bağlı birkaç Suriyeli Şii milisten oluşur. İran tarafından finanse edilir ve Lübnan Hizbullahı tarafından eğitilir."
 qatar_expat:0 "Katar Demografisi"
 qatar_expat_desc:0 "Katar nüfusunun yalnızca %12'si Katar vatandaşıdır; geri kalanı yabancı işçidir. Ülkedeki neredeyse tüm işleri yabancılar yapar ve Katarlıların neredeyse tamamı devlette çalışır. Bu yabancı işçilere yönelik muamele son yıllarda ağır biçimde eleştirilmiş, yaşam koşullarının sömürücü ve istismarcı olduğu ileri sürülmüştür."
 saudi_expat:0 "Suudi Demografisi"
 saudi_expat_desc:0 "Suudi Arabistan nüfusunun yalnızca %70'i Suudi vatandaşıdır; geri kalanı yabancı işçidir. Yetişkin Suudilerin çoğu devlette çalışır ve neredeyse tüm sanayi ve hizmet işlerini yabancılar yapar. Bu yabancı işçilere yönelik muamele son yıllarda ağır biçimde eleştirilmiş, yaşam koşullarının sömürücü ve istismarcı olduğu ileri sürülmüştür."
 omani_expat:0 "Umman Demografisi"
 omani_expat_desc:0 "Umman nüfusunun yalnızca %64'ü Ummanlı vatandaştır; geri kalanı yabancı işçidir. Yetişkin Ummanlıların çoğu devlette çalışır ve neredeyse tüm sanayi ve hizmet işlerini yabancılar yapar. Bu yabancı işçilere yönelik muamele son yıllarda ağır biçimde eleştirilmiş, yaşam koşullarının sömürücü ve istismarcı olduğu ileri sürülmüştür."
 uae_expat:0 "Emirlik Demografisi"
 uae_expat_desc:0 "Birleşik Arap Emirlikleri nüfusunun yalnızca %11'i Emirlik vatandaşıdır; geri kalanı yabancı işçidir. Yetişkin Emirlik vatandaşlarının çoğu devlette çalışır ve neredeyse tüm sanayi, ticaret ve hizmet işlerini yabancılar yapar. Bu yabancı işçilere yönelik muamele son yıllarda ağır biçimde eleştirilmiş, yaşam koşullarının sömürücü ve istismarcı olduğu ileri sürülmüştür."
 kuwait_expat:0 "Kuveyt Demografisi"
 kuwait_expat_desc:0 "Kuveyt nüfusunun yalnızca %29'u Kuveyt vatandaşıdır; geri kalanı yabancı işçidir. Yetişkin Kuveytlilerin çoğu devlette çalışır ve neredeyse tüm sanayi ve hizmet işlerini yabancılar yapar. Bu yabancı işçilere yönelik muamele son yıllarda ağır biçimde eleştirilmiş, yaşam koşullarının sömürücü ve istismarcı olduğu ileri sürülmüştür."
 bahraini_expat:0 "Bahreyn Demografisi"
 bahraini_expat_desc:0 "Bahreyn nüfusunun yalnızca yaklaşık yarısı Bahreyn vatandaşıdır; geri kalanı yabancı işçidir. Yetişkin Bahreynlilerin çoğu devlette çalışır ve neredeyse tüm sanayi ve hizmet işlerini yabancılar yapar. Bu yabancı işçilere yönelik muamele son yıllarda ağır biçimde eleştirilmiş, yaşam koşullarının sömürücü ve istismarcı olduğu ileri sürülmüştür."
 iranian_aid:0 "İran Yardımı"
 iranian_aid_desc:0 "İran askerî ve ekonomik yardım sağlar. Bu, hükümetimizi ve ordumuzu yürütme maliyetini düşürür; ancak İran bu yardımı siyasetimizi etkilemek için de kullanmaya çalışır.\n\n§RBu ulusal ruh, Kişi Başı GSYİH'miz $17 bini aşarsa kaldırılır§!"
 iranian_aid_idea_TT:0 "Ek Gelir: GSYİH'mizin §G%0,2§!'si"
 iranian_aid_custom:0 "İran Yardımı"
 iranian_aid_custom_desc:0 "İran askerî ve ekonomik yardım sağlar. Bu, hükümetimizi ve ordumuzu yürütme maliyetini düşürür; ancak İran bu yardımı siyasetimizi etkilemek için de kullanmaya çalışır."
 LoAS_member:0 "Arap Birliği Üyesi"
 LoAS_member_desc:0 "Arap Birliği, resmî adıyla Arap Devletleri Birliği, Arap devletlerinin bölgesel bir konseyidir. Örgütün amacı üye devletler arasındaki ilişkileri yakınlaştırmak ve aralarındaki iş birliğini koordine etmektir."
 restoring_hope:0 "Umut Yeniden"
 restoring_hope_desc:0 "Umut Yeniden Harekâtı, Suudi Arabistan'ın Yemen'e siyasi bir çözümle barış getirmek ve Yemen güçlerine yardım etmek için yürüttüğü bir kampanyadır."
 idea_focus_industrial_development_program:0 "Sanayi Kalkınma Programı"
 multi_ethnic_state_idea:0 "Çok Etnikli Devlet"
 multi_ethnic_state_idea_desc:0 "Bir söz vardır: «Çeşitlilikte Birlik»; ancak çoğu zaman büyük azınlık grupları daha fazla özerklik ya da doğrudan bağımsızlık arayışına yönelir."
 unsc_restricted_volunteers_too:0 "BMGK Gönüllü Kısıtlaması"
 unsc_restricted_volunteers_too_desc:0 "§BBM§! §YGüvenlik Konseyi§!, ülkelerin bu ülkeye askerî gönüllü göndermesini kısıtlayan bir karar aldı. Bu karara aykırı davranan ülkeler, gönüllülerini ülkeden çekene kadar derhâl §RYaptırıma§! tabi tutulur."
 un_aid_esco_member:0 "§BBM§! Eğitim, Bilim ve Kültür Örgütü Üyesi"
 un_aid_ido_member:0 "§BBM§! Sanayi Kalkınma Örgütü Üyesi"
 un_aid_cdf_member:0 "§BBM§! Sermaye Kalkınma Fonu Üyesi"
 unsc_arms_embargo:0 "BMGK Silah Ambargosu"
 unsc_arms_embargo_decs:0 "§BBM§! §YGüvenlik Konseyi§!, bu ülkeye silah ve mühimmat satışını kısıtlayan bir karar aldı. Ülkenin tüm taarruz çatışmalarını sonlandırana kadar uluslararası pazarı kullanması yasaklanır."
 un_vote_sway_assistance:0 "Kalkınma Yardımı Anlaşması"
 un_vote_sway_assistance_desc:0 "§BBM§! §YGüvenlik Konseyi§! veya §YGenel Kurul§!'da bir oy karşılığında yapılan anlaşmanın ardından, ülkemiz bize anlaşmayı veren ülkeden kalkınma yardımı alıyor."
 un_vote_sway_cost:0 "Kalkınma Yardımı Sağlıyor"
 un_vote_sway_cost_desc:0 "§BBM§! §YGüvenlik Konseyi§! veya §YGenel Kurul§!'daki bir oylamanın parçası olarak yapılan anlaşmadaki payımıza düşeni yerine getirerek, şartlarımızı kabul eden ülkeye kalkınma yardımı sağlıyoruz."
 unga_resolution_poverty_reduction:0 "Karar: Yoksulluğun Azaltılması"
 unga_resolution_poverty_reduction_desc:0 "§BBM§! §YGenel Kurulu§!, üye devletleri sosyal güvenlik ağlarını genişletmeye ve aşırı yoksulluğu azaltmaya adayan bağlayıcı olmayan bir karar aldı. Uyum, refah programlarını finanse etmek için tüketim malı harcamasının artırılmasını gerektirir."
 unga_resolution_food_security:0 "Karar: Gıda Güvenliği"
 unga_resolution_food_security_desc:0 "§BBM§! §YGenel Kurulu§!, tarımsal verimliliğe ve gıda dağıtım ağlarına yatırım çağrısı yapan bağlayıcı olmayan bir karar aldı. Kaynaklar tarım girişimlerini desteklemek için sanayi üretiminden kaydırılıyor."
 unga_resolution_global_health:0 "Karar: Küresel Sağlık"
 unga_resolution_global_health_desc:0 "§BBM§! §YGenel Kurulu§!, sağlık hizmetlerine erişimi ve pandemi hazırlığını genişletmeye yönelik bağlayıcı olmayan bir karar aldı. Halk sağlığının iyileşmesi toplumu istikrara kavuştursa da tıbbi malzeme talebi tüketim malı harcamasını artırır."
 unga_resolution_education_initiative:0 "Karar: Eğitim Girişimi"
 unga_resolution_education_initiative_desc:0 "§BBM§! §YGenel Kurulu§!, eğitim sistemlerine, okuryazarlığa ve bilimsel araştırmaya yatırım yapmaya yönelik bağlayıcı olmayan bir karar aldı. İşçiler eğitim programlarına yönlendirilir; bu da inşaatı yavaşlatır ama araştırma çıktısını hızlandırır."
 unga_resolution_clean_energy:0 "Karar: Temiz Enerji Dönüşümü"
 unga_resolution_clean_energy_desc:0 "§BBM§! §YGenel Kurulu§!, yenilenebilir enerjiye geçişi teşvik eden bağlayıcı olmayan bir karar aldı. Yenilenebilir altyapı teşvik edilirken fosil yakıt santrali inşaatı cezalandırılır; bu da geçiş sürecinde genel sanayi kapasitesini azaltır."
 unga_resolution_economic_growth:0 "Karar: Ekonomik Büyüme"
 unga_resolution_economic_growth_desc:0 "§BBM§! §YGenel Kurulu§!, sürdürülebilir ekonomik büyümeyi ve verimli istihdamı teşvik eden bağlayıcı olmayan bir karar aldı. Verimlilik ve fabrika çıktısı artar, ancak işçi korumaları tüketim malı talebini yükseltir ve düzenleyici yük siyasi gücü tüketir."
 unga_resolution_infrastructure:0 "Karar: Altyapı Kalkınması"
 unga_resolution_infrastructure_desc:0 "§BBM§! §YGenel Kurulu§!, dayanıklı sivil altyapıya yatırım çağrısı yapan bağlayıcı olmayan bir karar aldı. Sivil inşaat hızlanır ama kaynaklar başka yöne kaydırıldığından askeri fabrika inşaatı yavaşlar."
 unga_resolution_reduced_inequality:0 "Karar: Eşitsizliğin Azaltılması"
 unga_resolution_reduced_inequality_desc:0 "§BBM§! §YGenel Kurulu§!, ülkeler içinde ve arasında eşitsizliği azaltmaya yönelik bağlayıcı olmayan bir karar aldı. Servet yeniden dağıtım programları toplumu istikrara kavuşturur ama uygulanması için önemli ölçüde tüketim malı harcaması ve siyasi sermaye gerektirir."
 unga_resolution_climate_action:0 "Karar: İklim Eylemi"
 unga_resolution_climate_action_desc:0 "§BBM§! §YGenel Kurulu§!, iklim değişikliğiyle mücadelede acil eylem çağrısı yapan bağlayıcı olmayan bir karar aldı. Sert emisyon hedefleri fosil yakıt altyapısını ağır biçimde cezalandırır ve fabrika çıktısını azaltır; yine de kamuoyunun iyi niyeti ılımlı bir istikrar kazancı sağlar."
 unga_resolution_peace_institutions:0 "Karar: Barış ve Güçlü Kurumlar"
 unga_resolution_peace_institutions_desc:0 "§BBM§! §YGenel Kurulu§!, hukukun üstünlüğünü güçlendirmeye, yolsuzluğu azaltmaya ve hesap verebilir kurumlar inşa etmeye yönelik bağlayıcı olmayan bir karar aldı. Yönetişim iyileşir ve yabancı müdahaleye direnilir, ancak barış taahhütleri askeri üretimi yavaşlatır."
 unga_resolution_trade_partnerships:0 "Karar: Ticaret Ortaklıkları"
 unga_resolution_trade_partnerships_desc:0 "§BBM§! §YGenel Kurulu§!, ticaret iş birliği ve teknoloji transferi yoluyla küresel ortaklıkları güçlendirmeye yönelik bağlayıcı olmayan bir karar aldı. Ticaret koşulları iyileşir, ancak uluslararası standartlara uyum siyasi gücü tüketir."
 unga_resolution_digital_development:0 "Karar: Dijital Kalkınma"
 unga_resolution_digital_development_desc:0 "§BBM§! §YGenel Kurulu§!, internet altyapısı ve teknoloji yatırımıyla dijital uçurumu kapatmaya yönelik bağlayıcı olmayan bir karar aldı. Dijital ve teknoloji inşaatı hızlanır, ancak kaynaklar fiziksel altyapıdan kaydırılır."
 reverberations_of_the_great_financial_crisis:0 "Büyük Durgunluğun Yankıları"
 reverberations_of_the_great_financial_crisis_desc:0 "Adı yanlış konmuş durgunluk nihayet büyük ülkemize de ulaştı. Amerikalı ortakları artık onlardan alım yapamadığı için işletmeler kapılarını kapattı.\n\n§YEkonomik Patlamamız§! varsa bu ulusal ruh erken iptal olur. Fikrin süresi dolduğunda 180 gün boyunca §YBüyük Durgunluk Sonrası Patlama§! fikrini kazanırız.\n"
 post_great_financial_crisis_boom:0 "Büyük Durgunluk Sonrası Patlama"
 post_great_financial_crisis_boom_desc:0 "Ekonomimiz Büyük Durgunluk'tan toparlandı ve her zamankinden daha güçlü dönmeye başlıyoruz. Gerçekten yeni bir patlama ekonomisi!"
 the_rubber_baron_of_africa:0 "Afrika'nın Kauçuk Baronu"
 the_rubber_baron_of_africa_desc:0 "[CDI.GetName], doğal kaynaklardan oluşan bir hazine üzerinde oturuyor ve bu kaynaklardan biri de büyük ülkemizdeki Kauçuk Ağaçları. Afrika'nın kauçuğunun çoğunu biz üretiyoruz ve halkımız için böylesine değerli bir kaynağın tekelini sürdürmeliyiz. Bu yalnızca büyük ulusumuzun büyümesine ve gelişmesine yardımcı olacaktır."
 HLS_idea_holy_see:0 "Kutsal Makam"
 HLS_idea_holy_see_desc:0 "Vatikan Şehri tüm Katolikliğin merkezidir. Vatikan Şehri'nin nüfusu Papa ve danışmanları tarafından seçilir. Bu nedenle ülkeyi Papa'dan başkasının yönetmesi mümkün değildir."
 party_commands_gun:0 "Parti Silaha Komuta Eder"
 party_commands_gun_desc:0 "Çin Halk Kurtuluş Ordusu'nun öncelikli sadakati Çin komünist partisinedir. Bu sadakat, sıkı ideolojik eğitimle ve silahlı kuvvetlerde üst görevleri siyasi kadroların üstlenmesiyle sağlanır."
 party_commands_gun_new_era:0 "Parti Silaha Komuta Eder"
 party_commands_gun_new_era_desc:0 "Çin Halk Kurtuluş Ordusu'nun öncelikli sadakati Çin komünist partisinedir. Bu sadakat, sıkı ideolojik eğitimle ve silahlı kuvvetlerde üst görevleri siyasi kadroların üstlenmesiyle sağlanır."
 china_reunification:0 "Çin'in Yeniden Birleşmesi"
 china_reunification_desc:0 "Sayısız çetin savaşın ardından Çin nihayet yeniden birleşmeyi başardı. Çin bir dünya gücü olma yolunda bir adım daha attı."
 august_1st:0 "1 Ağustos Nişanı"
 august_1st_desc:0 "1 Ağustos Nişanı, Halk Kurtuluş Ordusu, Halk Silahlı Polisi ve Kamu Güvenliği Bakanlığı personeline ve sivillere verilen en yüksek askerî ödüldür."
 state_system:0 "Zhong Hua"
 state_system_desc:0 "Kural olarak süpürgenin ulaşmadığı yerde toz kendiliğinden yok olmaz. Eleştiri silahları, silahların eleştirisinin yerini tutamaz. Çin ordusu artık sınır duvarının ardında titreyerek saklanmıyor."
 chastity_paifang:0 "Barış İçinde Bir Arada Yaşama"
 chastity_paifang_desc:0 "Halk Cumhuriyeti'nin kuruluşundan beri Çin dış politikasına Barış İçinde Bir Arada Yaşamanın Beş İlkesi yön vermiştir. Bu ilkeler egemenliğe ve toprak bütünlüğüne karşılıklı saygıyı, karşılıklı saldırmazlığı, diğer devletlerin iç işlerine karışmamayı, eşitliği ve karşılıklı yararı ve barış içinde bir arada yaşamayı kapsar. Bu ilkelerin sonucunda Çin, Vestfalya devlet egemenliğini savunurken müdahale karşıtı bir duruş sürdürmüştür."
 one_child_policy:0 "Tek Çocuk Politikası"
 one_child_policy_desc:0 "Çin'in nüfus artışını sınırlamanın bir yolu olarak tasarlanan tek çocuk politikası, Çin hükümetinin Çin nüfusunun büyüklüğünü denetleme yönündeki tartışmalı ve iddialı bir girişimidir. Politikanın nüfus artışını ne ölçüde frenlediği tartışmalı olsa da politikanın Çin toplumu üzerindeki köklü etkileri inkâr edilemez."
 two_child_policy:0 "İki Çocuk Politikası"
 two_child_policy_desc:0 "Neredeyse otuz yıllık tek çocuk politikasının ardından Çin doğum oranlarında düşüş yaşıyor. Bu eğilimi hızla ele almak ve doğum oranlarını normal düzeylere döndürmek için Çin hükümeti doğum kısıtlama politikasını biraz gevşetmeyi amaçlıyor."
 factional_politics_balanced:0 "Hizip Siyaseti - Dengeli"
 factional_politics_balanced_desc:0 "Kırsal illerden gelen popülistler ile Çin'in daha kentleşmiş bölgelerinden gelen elitistler arasındaki iktidar mücadelesi yatıştı ve her iki taraftan üyeler, uzlaşmanın Çin'in geleceğini güvence altına almanın en iyi yolu olduğunda hemfikir."
 factional_politics_populist:0 "Hizip Siyaseti - Gençlik Birliği Hâkimiyeti"
 factional_politics_populist_desc:0 "Komünist Gençlik Birliği mezunları gibi popülist politikaların savunucuları şu anda Çin ulusal politikasını belirliyor. Bu, yerleşik çıkarlara kırsal yoksullar lehine meydan okuyor ama ekonomik büyümeyi desteklemiyor."
 factional_politics_elitist:0 "Hizip Siyaseti - Şanghay Kliği Hâkimiyeti"
 factional_politics_elitist_desc:0 "Çin siyasetinin daha iş dünyası yanlısı, kalkınma yanlısı hizbinin üyeleri iktidarın dizginlerini elinde tutuyor. Bu büyümeye ve kalkınmaya yardımcı olur ama kırsal yoksullar arasında destek kazanmayı ve yolsuzlukla mücadele etmeyi zorlaştırır."
 three_represents:0 "Üç Temsil"
 three_represents_desc:0 "«Üç Temsil», Jiang Zemin tarafından ortaya atılan, Komünist Parti'nin neyi temsil ettiğine dair bir kuramdır. Kuram, Komünist Parti'nin ileri toplumsal üretici güçleri, ileri kültürü ve çoğunluğun çıkarlarını temsil etmesi gerektiğini savunur. Bu kuramın sonuçları, Çin Komünist Partisi'nin büyüyen iş dünyası sınıfını daha fazla kabul etmesidir; bu da bazı çevrelerde Marksizm'den ve Mao Zedong düşüncesinden uzaklaşmakla eleştirilmesine yol açmıştır."
 scientific_outlook_on_development:0 "Kalkınmaya Bilimsel Bakış"
 scientific_outlook_on_development_desc:0 "Birçok bakımdan Hu Jintao'nun Jiang Zemin'in «Üç Temsil»inin büyüme merkezli odağına verdiği bir tepki olan «Kalkınmaya Bilimsel Bakış», Hu hükümetinin kuramsal temelidir ve çevre kirliliğini ve sosyoekonomik eşitsizliği en aza indiren sürdürülebilir büyümeye odaklanır."
 zeng_qinghong_thought:0 "Zeng Qinghong Düşüncesi"
 zeng_qinghong_thought_desc:0 "Jiang Zemin'in «Üç Temsil»i üzerine inşa eden Zeng, ÇKP için partinin Çin halkının çoğunluğunu temsil etme görevini vurgulayan yeni bir ideolojik temel oluşturmuştur. Zeng Qinghong düşüncesi, Çin halkı tarafından daha temsil edici ve meşru algılanabilecek, daha hesap verebilir ve şeffaf bir parti çağrısı yapar. Bu kuramın anahtarı, «halkın bakışı» fikri ve parti yetkililerinin ancak bu bakış altında çalıştıklarında ülkenin çıkarlarını azamiye çıkarabileceğidir."
 xi_jinping_thought:0 "Xi Jinping Düşüncesi"
 xi_jinping_thought_desc:0 "Xi Jinping'in ÇKP yönetiminin kuramsal temeline katkısı, parti ve ülke için ileriye dönük çok sayıda yüce hedef belirler. Bu kuramı Xi'nin seleflerinin çoğundan ayıran, bu ideolojiye bağlılığın sadakate ne ölçüde bağlanmış olmasıdır. Partiye sadakat, ülkeye sadakat ve ayrıca önemli olarak Xi Jinping'in kendisine sadakat."
 chongqing_model:0 "Chongqing Modeli"
 chongqing_model_desc:0 "Chongqing Modeli, Bo Xilai'nin Komünist Parti doktrinine katkısıdır. Sırasıyla organize suçla mücadeleyi ve komünist şarkılar söylemeyi içeren «karaya vur» ve «kızılı söyle» kampanyaları dahil geniş bir toplumsal ve ekonomik politika yelpazesi içeren bir modeldir. Model ayrıca adil dağıtıma ve devlet işletmelerine güçlü vurgu yaparak Çin'in piyasa liberalleşmesi politikalarından hafif bir sapmayı da temsil eder."
 nanjie_model:0 "Nanjie Modeli"
 nanjie_model_desc:0 "Birçok bakımdan Chongqing modelinin bir geliştirmesi olan Nanjie modeli, Bo'nun özgün kuramının birçok unsurunu korur ancak kolektivist bir sistemi sürdüren bir Maoizm kalesi olan Nanjie köyü örneğinden yararlanır. Bo'nun Nanjie modeli, Çin'i Nanjie'nin örneğine kulak vermeye, kapitalizmi ve serbest piyasayı geride bırakıp gerçek sosyalizme yönelmeye çağırır."
 open_nation:0 "Reformist Hükümet"
 open_nation_desc:0 "Otoriterlik ülkemize son birkaç on yılda iyi hizmet etmiş olsa da çevremizdeki dünyaya uyum sağlamalıyız. Küreselleşen 21. yüzyılda dünyanın geri kalanına açılmaktan ve iç siyasetimizi liberalleştirmekten başka yapabileceğimiz pek bir şey yok."
 open_nation_finish:0 "Liberal Hükümet"
 open_nation_finish_desc:0 "Halkımız kendini ifade etme, siyasi sürece katılma ve birden çok bilgi kaynağına dayanarak kendi görüşlerini oluşturma özgürlüğünü hak ediyor."
 censored_nation:0 "Baskıcı Hükümet"
 censored_nation_desc:0 "Halkımızı dünyanın geri kalanından tamamen koparmanın ve toplu biçimde telkin altına almanın uygulanamaz olduğunu kabul etsek de maruz kaldıkları şeyleri yine de denetlemeli ve ölçülü tutmalıyız. Siyasi söyleme aşırı gevşek yaklaşım yüzünden her istikrarsızlık kaynağının güvenlikleri için tehdit olabileceği bir sistemde halkımız gerçekten özgür olamaz."
 closed_nation:0 "Totaliter Hükümet"
 closed_nation_desc:0 "Ulusun istikrarını korumak ve ulusal egemenliğimizi sürdürmek için internete erişimi tamamen kısıtladık ve diğer tüm medya biçimleri üzerinde doğrudan denetim uyguluyoruz. Muhalefete hoşgörü gösterilemez."
 legacy_of_1949:0 "1949 Mirası"
 legacy_of_1949_desc:0 "1949'da Çin İç Savaşı'nın sona ermesiyle Milliyetçi Guomindang (KMT) ve destekçileri Tayvan adası eyaletine kaçtı. Bu olayın mirası, yerel, yerlici bir Tayvan hareketiyle birleşerek Tayvan vatandaşlarının çoğunluğunun anakara ile yeniden birleşmeyi güçlü biçimde reddetmesine yol açtı."
 legacy_of_1949_1:0 "1949 Mirası"
 legacy_of_1949_1_desc:0 "1949'da Çin İç Savaşı'nın sona ermesiyle Milliyetçi Guomindang (KMT) ve destekçileri Tayvan adası eyaletine kaçtı. Bu olayın mirası, yerel, yerlici bir Tayvan hareketiyle birleşerek Tayvan vatandaşlarının çoğunluğunun anakara ile yeniden birleşmeyi güçlü biçimde reddetmesine yol açtı."
 fate_of_mongolian_area:0 "Kuzeyden Uğursuz Bir Önsezi"
 fate_of_mongolian_area_desc:0 "Moğol Bölgesi, Çin Cumhuriyeti'nin anakara döneminde Dış Moğolistan bölgesinin resmî idari bölüm adıdır. Anakara Çin'i kaybettiğimizde Moğol Bölgesi de kaybedildi. Şimdi anakara hükümeti birdenbire Dış Moğolistan'a ilgi duyuyor; bu bizim için iyi bir şeye benzemiyor."
 fate_of_mongolian_area_1:0 "Moğol Bölgesi'nin kaderi"
 fate_of_mongolian_area_1_desc:0 " Beklenmedik biçimde, kaybettiğimiz Moğol bölgesi Çin anakara hükümeti tarafından geri alındı, dolayısıyla sıradaki hedef ortada."
 joint_control_zones:0 "Tayvan Boğazı Ortak Denetim Bölgesi"
 joint_control_zones_desc:0 "Ortak denetim bölgesi, Çin ve Tayvan'ın Tayvan Boğazı'nda daha etkili devriye gezmesine ve iki ülkenin ordularının etkinliğini artırmasına olanak tanır."
 our_national_enemy:0 "Tarihî Düşmanımız"
 our_national_enemy_desc:0 "Japonların açtığı eski yaralar henüz iyileşmedi. Çin-Japon savaşı sırasında Çin halkına uyguladıkları suçları tam olarak kabul etmeyi ve özür dilemeyi reddetmeleri, öngörülebilir gelecekte hem komünist hem milliyetçi Çin'in halefleri için düşman olmaya devam edecekleri anlamına gelir."
 old_hatreds:0 "Eski Nefretler"
 old_hatreds_desc:0 "Çin ile Japonya arasında binlerce yıldır süren husumete nihayet son verilmelidir."
 ceremony_in_khentii_1:0 "Khentii'de Tören"
 ceremony_in_khentii_1_desc:0 "Khentii Dağları'ndaki zafer, kaybedilen toprakları geri almamız için bizi hâlâ ilhamlandırıyor."
 ceremony_in_khentii_2:0 "Khentii'de Tören"
 ceremony_in_khentii_2_desc:0 "Khentii Dağları'ndaki zafer, kaybedilen toprakları geri almamız için bizi hâlâ ilhamlandırıyor."
 prosperity_of_borderland:0 "Sınır Bölgesinin Refahı"
 prosperity_of_borderland_desc:0 "İç bölge ile sınır bölgesi yakından ilişkilidir ve ikisi de Çin'in ayrılmaz bir parçasıdır"
 chinese_khalkha:0 "Çin'in Kalkanı"
 chinese_khalkha_desc:0 "Halha sözcüğü Moğolca'da kalkan anlamına gelir ve kuzeyimizin güçlü kalkanını geri aldık."
 jebtsundamba_khutuktu:0 "Cebtsundamba Kutuktu"
 jebtsundamba_khutuktu_desc:0 "Cebtsundamba Kutuktu, Dış Moğolistan bölgesinde Tibet Budizmi'nin Gelug soyunun ruhani başına verilen bir unvandır. Moğol halkımıza bereket verecektir."
 mongolia_rely_to_china:0 "Moğolistan Çin'e Bağımlı"
 mongolia_rely_to_china_desc:0 "Denize kıyısı olmayan bir ülke olduğumuzdan ekonomimiz Çin ile sıkı biçimde bütünleşmiş durumda."
 MON_khan_heir:0 "Cengiz Han'ın Mirasçısı"
 MON_khan_heir_desc:0 "Moğollar Cengiz Han'ın torunlarıdır ve atalarımızın şanı bizim için her zaman parlayacaktır."
 island_blockade:0 "Ada Ablukası"
 CHI_war_preparations:0 "Savaş Hazırlıkları"
 CHI_war_preparations_desc:0 "Halk Kurtuluş Ordusu Kore sınırı boyunca savaş düzenine geçti. Yedek askerler seferber ediliyor, eğitim döngüleri sıkıştırılıyor ve olası bir müdahale öncesinde taarruz planlaması hızlandırılıyor."
 taiwanese_coup:0 "Darbe Sürüyor"
 taiwanese_coup_desc:0 "Tayvan hükümeti ve ordusundaki Çin yanlısı unsurlar şu anda hükümetin denetimini ele geçirmeye çalışıyor."
 recently_acceded_to_wto:0 "Dünya Ticaret Örgütü'ne Yeni Katılım"
 recently_acceded_to_wto_desc:0 "DTÖ üyeliği çok çeşitli ticari avantajlar sağlayarak bu ülkenin ekonomisine önemli bir ivme kazandırır."
 wto_member:0 "Dünya Ticaret Örgütü Üyesi"
 wto_member_desc:0 "Dünya Ticaret Örgütü'nün tam üyesi olarak bu ülke kalıcı ticari ve sanayi avantajlarını korur."
 WTO_permanent_membership_tt:0 "§gBu ulusal ruhun süresi dolduğunda yerini kalıcı ancak daha zayıf bir avantajlar bütünü olan §Y$wto_member$§! alır.§!"
 CHI_foreign_investment:0 "Teşvik Edilen Yabancı Yatırım"
 CHI_foreign_investment_desc:0 "Yabancı yatırım kurallarının serbestleştirilmesi ve özel ekonomik bölgelerin kurulması, çok uluslu imalat ve teknoloji şirketlerini çeker. Yabancı sermaye altyapıya ve sanayi komplekslerinin inşasına akarak modernleşmeyi hızlandırır."
 Socialist_Market_Economy:0 "Sosyalist Piyasa Ekonomisi"
 Free_Market_Economy:0 "Serbest Piyasa Ekonomisi"
 Planned_Economy:0 "Planlı Ekonomi"
 factory_of_the_world:0 "Dünyanın Fabrikası"
 factory_of_the_world_desc:0 "Dünyanın fabrikası, dünya pazarı için büyük ölçekli sanayi ürünleri sağlayan bir imalat üssüdür."
 a_new_leap_forward:0 "Yeni Büyük Atılım"
 a_new_leap_forward_desc:0 "Komünizme Doğru Koşu"
 water_shortages:0 "Su Kıtlığı"
 water_shortages_desc:0 "Ülkenin güneyinde önemli su kaynaklarına sahip olmasına rağmen Çin, belirgin biçimde daha kurak olan kuzeyde yaygın bir su sıkıntısı çekmektedir. Ülkenin hızlı sanayileşmesinden kaynaklanan kirlilik, mevcut suyun da kirlenmesine yol açarak Çin'deki su kıtlığını daha da ağırlaştırmıştır."
 CHI_solar_power:0 "Güneş Enerjisiyle Yürüyen Ekonomi"
 CHI_nuclear_power_idea:0 "Nükleer Enerjiyle Yürüyen Ekonomi"
 fusion_power:0 "Füzyon Enerjisiyle Yürüyen Ekonomi"
 CHI_coal:0 "Kömürle Yürüyen Ekonomi"
 CHI_cepc:0 "Dairesel Elektron-Pozitron Çarpıştırıcısı (CEPC)"
 CHI_cepc_desc:0 "CEPC, Çinli parçacık fiziği topluluğunun yukarıda sözü edilen fizik programını araştırmak için önerdiği büyük bir uluslararası bilimsel tesistir. Çevresi 80 kilometre (49,70 mil) olup Manhattan adasının tamamını çevreleyebilir."
 CHI_space_marines_idea:0 "Uzay Askerleri"
 CHI_megacity_development:0 "Megakent Gelişimi"
 CHI_megacity_development_desc:0 "Birleşmiş Milletler, dünyanın mevcut 3,2 milyarlık kentli nüfusunun 2030'da 5 milyara çıkacağını öngörmektedir. 2030'a gelindiğinde dünya nüfusunun beşte üçü şehirlerde yaşayacaktır."
 CHI_western_development:0 "Batı Kalkınması"
 CHI_western_development_desc:0 "Batı Kalkınması, Çin Halk Cumhuriyeti merkezi hükümetinin genel ve eşgüdümlü bölgesel kalkınma stratejisidir; politika tercihleri ve mali yatırımlar yoluyla doğu ile batı bölgeleri arasındaki ekonomik gelişme farkını azaltmayı ve orta ile batı bölgelerinin kapsamlı ekonomik gücünü artırmayı amaçlar."
 CHI_new_boundary:0 "Yeni Sınır"
 CHI_new_boundary_desc:0 "Çin tarih kitaplarında yeni topraklar elde eden liderler her zaman derin bir iz bırakır."
 CHI_mass_production:0 "Seri Araç Üretimi"
 CHI_Hyundai_Partnership:0 "Hyundai Ortaklığı"
 CHI_Volkswagen_Partnership:0 "Volkswagen Ortaklığı"
 CHI_Toyota_Partnership:0 "Toyota Ortaklığı"
 CHI_GM_Partnership:0 "General Motors Ortaklığı"
 Public_Sector_Space_Program:0 "Kamu Sektörü Uzay Programı"
 Public_Sector_Space_Program_desc:0 "Devlet işletmesi bir sivil uzay ajansı; fırlatma kapasitesini, uydu konuşlandırmayı ve derin uzay keşfini yönlendirerek ulusal prestijin temelini bilimsel başarıya dayandırır. Program, yüksek teknoloji araştırmalarına geniş kamu yatırımı çeker; havacılık, malzeme bilimi ve bilişimde yarattığı yan etkilerle daha geniş sanayi tabanını güçlendirir."
 Private_Sector_Space_Program:0 "Özel Sektör Uzay Programı"
 space_combat_support_force:0 "Uzay Muharebe Destek Gücü"
 space_combat_support_force_desc:0 "Özel bir askeri uzay kolu, kara ve deniz kuvvetlerine uydu tabanlı keşif, konumlandırma ve haberleşme desteği sağlar. Gerçek zamanlı görüntüler ve şifreli veri bağlantıları harekât planlamasını iyileştirirken, özel sinyal istihbaratı unsurları temastan önce düşmanın savaş düzenini okuma yeteneğimizi keskinleştirir."
 space_efforts:0 "Uzay Çabaları"
 South_China_Sea_Dispute:0 "Güney Çin Denizi Anlaşmazlığı"
 South_China_Sea_Dispute_desc:0 "Çin'in Güney Çin Denizi'ndeki hak iddiaları birçok Güneydoğu Asya ülkesininkiyle çakışmaktadır. Bu çakışma Çin ile Vietnam, Filipinler ve daha az ölçüde Malezya gibi ülkeler arasında ciddi bir gerginliğe yol açmıştır. Spratly ve Paracel adaları gibi adaların stratejik konumu ve bölgedeki petrol varlığı nedeniyle anlaşmazlığın riskleri yüksektir. Güney Çin Denizi sorunu, Çin ile denizin çok sayıdaki adası üzerinde rekabet eden rakipleri arasındaki ilişkilerin iyileşmesini önemli ölçüde engellemiştir."
 Sino_Indian_Tensions:0 "Çin-Hindistan Gerginliği"
 Sino_Indian_Tensions_desc:0 "Asya'nın yükselen iki ekonomik ve askeri gücü olarak Hindistan ve Çin doğal rakiplerdir. Bu rekabet eğilimine sınır gerginlikleri tarihi ve Çin'in Pakistan ile ortaklığı eklendiğinde, rekabet çok daha ciddi bir düşmanlığa dönüşebilir."
 Workers_Rights:0 "İşçi Hakları"
 TV_Internet_Access:0 "Televizyon ve İnternet Erişimi"
 America_in_Decline:0 "Gerileyen Amerika"
 America_in_Decline_desc:0 "Bir zamanlar tartışmasız küresel hegemon olan Amerika'nın yurtdışındaki etkisi, yeni süper güç Çin'in yanında sönük kalmaktadır. ABD ya bu yeni dünya düzenini kabul edip kendi içine çekilmeli ya da Çin'in yeni üstünlüğüne meydan okuyarak ABD merkezli dünya düzenini sürdürmelidir. İkincisi ya güçle ya da Çin'deki daha az revizyonist siyasi güçlere destek verilerek gerçekleştirilebilir."
 Russia_on_the_Wane:0 "Gerileyen Rusya"
 Russia_on_the_Wane_desc:0 "Rusya, büyük güç statüsünü kaybetmenin ne demek olduğunu çok iyi bilir. Soğuk Savaş'ın bitiminden sonraki yıllarda yeni Rusya Federasyonu eski ihtişamının bir kısmını yeniden kazanmaya çalışmıştır. Yakın zamana kadar Rusya bu hedefinde Çin'den destek aldı; iki ülkenin stratejik ortaklığı Amerikan hegemonyasını zayıflatmaya yardımcı oldu. Ancak Çin'in büyük güç emelleri Rusya'nın konumunu zayıflattı; Slav devi, Çin parasıyla Orta Asya'daki nüfuz alanından dışarı itildi. Rusya şimdi ya ikincil bir güç olmayı kabul etmeli ya da Çin'in durdurulamaz görünen yükselişini ya güçle ya da Çin'deki daha az revizyonist siyasi güçlere destek vererek durdurmaya çalışmalıdır."
 CHI_Peacekeepers:0 "Barış Gücü Görevleri"
 CHI_Peacekeepers_desc:0 "Personelimiz, Afrika kıtasında BM barış gücü görevlerine yardım etmek üzere yurtdışına konuşlandırıldı; bu, askerlerimize çok ihtiyaç duyulan deneyimi kazandırıyor ve uluslararası toplumun güvenilir bir üyesi olarak itibarımızı artırıyor."
 CHI_promoting_innovation:0 "İnovasyonu Teşvik"
 CHI_promoting_innovation_desc:0 "İnovasyon, kalkınmanın birinci itici gücüdür."
 CHI_improving_rd:0 "Ar-Ge'yi İyileştirme"
 CHI_dominant_tech_industry:0 "Çin Teknoloji Hâkimiyeti"
 CHI_dominant_tech_industry_desc:0 "Bilim ve teknoloji, birincil üretici güçlerdir."
 CHI_idea_high_speed_railway_modifier:0 "Çin Hızlı Treni"
 CHI_idea_high_speed_railway_modifier_desc:0 "Çin Halk Cumhuriyeti'nin hızlı tren ağı şu anda dünyanın en büyük hızlı tren ağıdır."
 CHI_electric_car_project_idea:0 "Çin Elektrikli Otomobil Projesi"
 CHI_electric_car_project_idea_desc:0 "Elektrikli otomobillere ve diğer sanayi projelerine yapılan yatırım, büyük ulusumuzun ileriye yürüyüşünü sürdürmesini sağlayacak. Taşıt üretiminde öncü bir üretici olacağız ve bu, o hedefe giden yolda yalnızca bir adım."
 CHI_electric_car_project_idea_1:0 "Xiaomi Destekli Çin Elektrikli Otomobil Projesi"
 CHI_electric_car_project_idea_1_desc:0 "Çin'in elektrikli otomobil projesi, Xiaomi desteğiyle taşıt sanayisinde büyük bir atılım olacak."
 CHI_bilibili_idea:0 "Bilibili"
 CHI_bilibili_idea_desc:0 "Amcan, yani ben, gerçekten çok sinirleniyorum."
 CHI_studyding_strengthen:0 "Öğren ve Ulusu Güçlendir"
 CHI_studyding_strengthen_desc:0 "Başkan'ın Sözleri'nin Dijital Sürümü"
 CHI_highspeed_railway_construction:0 "Çin Hızlı Tren İnşaatı"
 CHI_highspeed_railway_construction_desc:0 "Çin'in nüfusu büyük ve hareketliliği yüksektir; yaygın bir ulaşım aracı olarak hızlı trenlere büyük talep vardır. Hızlı tren geliştirmesi ülkenin ulaşım koşullarını büyük ölçüde iyileştirecektir."
 CHI_string_of_pearls:0 "İnci Dizisi"
 CHI_string_of_pearls_desc:0 "İnci Dizisi, Hindistan'ı çevreleyen bir deniz üsleri ağıdır ve Hindistan ile bir silahlı çatışmada bize önemli bir üstünlük sağlayacaktır."
 KOR_joint_us_exercises:0 "Foal Eagle"
 KOR_joint_us_exercises_desc:0 "Foal Eagle, Kore Cumhuriyeti ve Amerika Birleşik Devletleri silahlı kuvvetlerinin her yıl düzenlediği bir eğitim tatbikatıdır. Her iki ülke bu tatbikatları olası bir Kuzey Kore işgaline karşı gerekli savunma hazırlıkları olarak görürken, Kuzey Kore bunları ABD-Güney Kore saldırgan eyleminin bir ön hazırlığı olarak değerlendirir."
 NKO_nuclear_tests_idea:0 "Nükleer Denemeler"
 NKO_nuclear_tests_idea_desc:0 "KDHC birkaç yılda bir nükleer silah denemeleri yapmaktadır. Bu, Kuzey Kore ile yakın ilişkisine rağmen Çin dahil dış güçlerin yaygın tepkisini çekmiştir. Kuzey Kore nükleer silah programının savunma amaçlı olduğunu savunsa da birçok kişi [NKO.GetLeader] liderinin bu silahları Amerika'ya veya müttefiklerine karşı kullanabileceğinden endişe etmektedir."
 non_state_actor:0 "Devlet Dışı Aktör"
 non_state_actor_desc:0 "İsyancı gruplardan hükümet dışı kuruluşlara kadar birçok uluslararası aktör uluslararası önem taşır, ancak tanınmış devlet olmadıkları için çeşitli bakımlardan ciddi dezavantajlıdır. Bu devlet dışı aktörlerin bir kısmı, adaletsiz bir hükümeti devirerek ya da yeni bir hükümet kurup uluslararası sınırları yeniden çizerek mevcut bir devletin denetimini ele geçirmeyi hedefler. Diğerlerinin devlet olma emeli yoktur; bunun yerine merkezi hükümetin otoritesinin bulunmadığı yerel ortamlarda güç ve zenginlik biriktirmek için zor kullanır."
 lacks_international_recognition:0 "Devlet Adayı"
 lacks_international_recognition_desc:0 "Bazı devletler, bir devletle ilişkilendirdiğiniz her şeye sahiptir: bir bürokrasi, bir ordu, bir ulusal bayrak ve benzerleri. Ancak uluslararası tanınmanın meşruiyet damgasının sağladığı ek avantajlar olmadan devlet olma durumları hiçbir zaman tamamlanmaz. Bu devletler, nihayetinde uluslararası topluluğun tam üyesi olabilecek kritik sayıda devletin desteğini kazanmak amacıyla yurtdışında davalarını savunarak bu tanınmayı elde etmeye çalışabilir."
 Basic_Law_MAC:0 "Makao ÖİB Temel Yasası"
 Basic_Law_MAC_desc:0 "Çin Halk Cumhuriyeti Makao Özel İdari Bölgesi Temel Yasası, Makao'nun anayasal belgesi olup Makao Organik Statüsü'nün yerini almıştır. Çin Halk Cumhuriyeti Anayasası'nın 31. maddesi uyarınca Makao özel idari bölge statüsüne sahiptir; bu statü «tek ülke, iki sistem» politikasının uygulanması için anayasal güvenceler ve Makao Özel İdari Bölgesi Temel Yasası'nın çıkarılması için anayasal dayanak sağlar."
 City_Of_Casino:0 "Kumarhaneler Şehri"
 City_Of_Casino_desc:0 "Kumarhaneler Şehri ya da Makao, Asya'daki en yüksek kumarhane yoğunluklarından birine ev sahipliği yapan Makao şehrinin halk arasındaki adıdır. Bu olgu nedeniyle sevgiyle «Asya'nın Las Vegas'ı» ya da «Çin Vegas'ı» diye anılır. Kumarhanelerin şehre getirdiği gelir eşsizdir ve kumar sektörünü hükümetin elinden uzak tutarak şehir için mükemmel bir gelir kaynağı oluşturur."
 MNC_city_of_casino:0 "Zenginlerin Kumarhane Şehri"
 MNC_city_of_casino_desc:0 "Monako, çok sayıda kumarhanesi nedeniyle Avrupa'da sevgiyle «Kumarhane Şehri» olarak bilinir. Özellikle Monako'daki kumarhaneler, şehrin milyarderlerin ve zenginlerin oyun alanı olmasıyla birlikte zenginlere hitap eder."
 ASEAN_Member:0 "ASEAN Üyesi"
 ASEAN_Member_desc:0 "ASEAN, merkezi Cakarta'da bulunan ve ilk olarak 1967'de kurulan, ağırlıklı olarak ekonomik nitelikte bir hükümetlerarası örgüttür. Soğuk Savaş'ın gergin ortamında dışarıda bırakılan ülkeleri de kapsayacak şekilde genişlemiş; Çin'in artan nüfuzuna karşı koymayı ve Batı'dan bağımsızlığını korumayı hedeflemiştir. Çok taraflılık, uluslararası hukuk, anlaşmazlıkların barışçıl çözümü, iç işlerine karışmama ve kendi kaderini tayin ilkelerine bağlıdır."
 socialist_vietnam:0 "Vietnam Sosyalist Cumhuriyeti"
 socialist_vietnam_desc:0 "Vietnam Sosyalist Cumhuriyeti tek parti diktatörlüğü uygular ve Vietnam Komünist Partisi'nin liderliğine bağlı kalır."
 lao_vietnan_treaty:0 "Laos-Vietnam Dostluk ve İşbirliği Antlaşması"
 lao_vietnan_treaty_desc:0 "Laos Komünist Partisi ile Vietnam Komünist Partisi'nin 18 Temmuz 1977'de Vientiane'de imzaladığı antlaşma, Vietnam'ın o dönemde «Çinhindi Federasyonu»'nun kurulmasını tasarlaması bakımından önemli bir adımdı."
 VIE_VPA_Business_Ventures:0 "HOV İş Girişimleri"
 VIE_VPA_Business_Ventures_desc:0 "1990'lardaki sert savunma kesintileri Vietnam'ı Çin'in örneğini izleyerek ordunun ticari girişimlere yönelmesine izin vermeye itti. Kârlar borçların ödenmesine, askeri teçhizatın ve sosyal imkânların iyileştirilmesine yardımcı oldu, ancak silahlı kuvvetlerin dikkatini dağıttı. Bu ulusal ruh, §Y$the_military$§! bir İç İttifak olduğunda, §Y$communist_cadres$§! bir İç İttifak olmadığında, Yolsuzluk 5. seviyede veya altında olduğunda ve en az 100.000 insan gücü konuşlandırıldığında kaldırılacaktır."
 vietnam.1.t:0 "Ordu Isten Çekiliyor"
 vietnam.1.d:0 "Yolsuzluk kontrol altına alınıp silahlı kuvvetler yeniden inşa edildiğinden, hükümet Vietnam Halk Ordusu'na ticari girişimlerine son vermesini emretti. Ordu dikkatini yeniden ulusal savunmaya yöneltecek, ticari faaliyetin sorumluluğunu ise sivil kurumlar üstlenecek."
 vietnam.1.a:0 "Ordu ulusa hizmet etmelidir."
 dominance_of_the_cpp:0 "KHP Hâkimiyeti"
 dominance_of_the_cpp_desc:0 "Kamboçya Halk Partisi, Kamboçya anayasasının yeniden düzenlenmesinden bu yana Kamboçya siyasi sahnesine hâkim olmuştur.\n"
 finnish_neutrality:0 "Finlandiya Tarafsızlığı"
 finnish_neutrality_desc:0 "Finlandiya, bir ölçüde Batılı demokratik ülkelerce korunsa da, esas olarak Rusları gücendirmemek için tarafsızlığını özenle korumuştur."
 Strategic_city_captured1:0 "Stratejik Bir Şehir Ele Geçirildi"
 Strategic_city_captured1_desc:0 "Stratejik bir şehri ele geçirdik ve bu, askerlerimizin moralini yükseltti!"
