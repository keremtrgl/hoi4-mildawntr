l_english:
 reshaping_national_identity:0 "Ulusal Kimliğin Yeniden Şekillenmesi"
 reshaping_national_identity_desc:0 "Eskiden ayrı olan devletlerden tek bir ulus yaratmak çalkantılı bir süreçtir. Birlik tamamen pekişene dek, birbiriyle yarışan bağlılıklar ve oturmamış kurumlar ulusal §Yistikrarın§! üzerinde yük oluşturur."
 GAME_RULE_reduce_internal_factions_cost:0 "İç Hizip Maliyetini Azaltır"
 player_instant_justification_spirit:0 "Savaş Gerekçesi"
 player_instant_justification_spirit_desc:0 "Hukuki altyapı, basın bilgilendirmeleri ve diplomatik yazışmalar önceden hazırlanmıştır. Bir savaşın gerekli olduğuna karar verdiğimizde gerekçesi aynı gün hazırdır."
 MICROSTATE_fix:0 "Hibe Gelir"
 minority_government:0 "Azınlık Hükümeti"
 minority_government_desc:0 "Hükümetimiz şu anda azınlık hükümeti olarak çalışıyor ve bu, tüm siyasi eylemleri çok zorlaştırıyor."
 international_sanctions:0 "Uluslararası Yaptırımlar"
 international_sanctions_desc:0 "Uluslararası toplum tarafından ekonomik yaptırımlara tabiyiz."
 p5_member:0 "BMGK Daimî Üyesi"
 p5_member_desc:0 "Birleşmiş Milletler Güvenlik Konseyi'nin daimî üyesi kalıcı bir koltuğa ve Konsey'in esasa ilişkin kararlarını veto etme yetkisine sahiptir. Bu statü ülkeyi uluslararası güvenlik kararlarının merkezine yerleştirir ve devlet, betikli siyasi değişimle koltuğunu kaybetmedikçe yürürlükte kalır."
 g7_member:0 "Yedi Büyükler Üyesi"
 g7_member_desc:0 "Yedi Büyükler (G7), Kanada, Fransa, Almanya, İtalya, Japonya, Birleşik Krallık ve Amerika Birleşik Devletleri'nden oluşan bir gruptur. Bu ülkeler küresel net servetin çok yüksek bir yüzdesini temsil eder ve hepsinin İnsani Gelişme Endeksi çok yüksektir."
 at_member:0 "Antarktika Antlaşması Üyesi"
 at_member_desc:0 "Antarktika Antlaşması 1959'da 12 ülke tarafından imzalanmış ve o tarihten beri çok daha fazla ülkenin katıldığı bir antlaşmadır. Antlaşma Antarktika'yı bilimsel bir koruma alanı olarak ayırır, bilimsel araştırma özgürlüğünü tesis eder ve kıtada askerî faaliyeti yasaklar. Antlaşma, kıtayı barışçıl ve bilimsel kullanım için korumada başarılı olmuştur."
 developmentalism:0 "Kalkınmacılık"
 developmentalism_desc:0 "Kalkınmacılık, az gelişmiş ülkelerin ekonomilerini geliştirmenin en iyi yolunun yüksek gümrük tarifeleriyle güçlü ve çeşitli bir iç pazara sahip olmak olduğunu savunan bir iktisat kuramıdır."
 revanchism:0 "İntikamcılık"
 revanchism_desc:0 "İntikamcılık (revanşizm), bir ülkenin daha önce kaybettiği toprakları geri alma iradesini ifade eder. Fransızlar tarafından Alsace-Lorraine'in kaybından sonra yaygınlaşan intikamcılık, hâlâ birçok ülkenin siyasetinde önemli bir etkendir."
 peaceful_emergence:0 "Barışçıl Yükseliş"
 peaceful_emergence_desc:0 "Dünya görüşlerimiz farklı olsa da eski düzene düşman olmamalı, bunun yerine dünyayı diplomasi ve ekonomiyle yavaşça değiştirmeye çalışmalıyız."
 idea_GUAM_member_state:0 "GUAM Üyesi"
 idea_GUAM_member_state_desc:0 "'GUAM' veya GUAM Demokrasi ve Ekonomik Kalkınma Örgütü, 1997'de Gürcistan, Ukrayna, Azerbaycan ve Moldova tarafından kurulmuş bir örgüttür. 2001'de resmîleştirilen tüzüğü; demokratik değerleri, istikrarlı kalkınmayı teşvik ederek, iç ve dış güvenliği artırarak ve nihayet Avrupa entegrasyonunu ilerleterek iş birliğini desteklemeyi amaçlamıştır. Çoğunlukla rejimlerde Rus nüfuzuna karşı bir araç olarak görülür; ancak GUAM liderleri bu iddiaları reddetmiştir."
 idea_GUAM_member_state_2:0 "GUAM Üyesi"
 idea_GUAM_member_state_2_desc:0 "'GUAM' veya GUAM Demokrasi ve Ekonomik Kalkınma Örgütü, 1997'de Gürcistan, Ukrayna, Azerbaycan ve Moldova tarafından kurulmuş bir örgüttür. 2001'de resmîleştirilen tüzüğü; demokratik değerleri, istikrarlı kalkınmayı teşvik ederek, iç ve dış güvenliği artırarak ve nihayet Avrupa entegrasyonunu ilerleterek iş birliğini desteklemeyi amaçlamıştır. Çoğunlukla rejimlerde Rus nüfuzuna karşı bir araç olarak görülür; ancak GUAM liderleri bu iddiaları reddetmiştir."
 CIS_member_state_idea:0 "BDT Üyesi"
 CIS_member_state_idea_desc:0 "Bağımsız Devletler Topluluğu (BDT), Avrasya'da bölgesel bir hükümetlerarası örgüttür. 1991'de Sovyetler Birliği'nin dağılmasının ardından kurulmuş olup onun hukuki halefidir. 20.368.759 km² alanı kapsar ve tahmini nüfusu 246.200.194'tür. BDT ekonomik, siyasi ve askerî konularda iş birliğini teşvik eder; sınır ötesi suçların önlenmesi dahil ticaret, finans, yasa yapımı ve güvenliğin koordinasyonuna ilişkin belirli yetkilere sahiptir."
 CIS_united_anti_air_idea:0 "Ortak BDT Hava Savunma Sistemi"
 CIS_anti_terror_idea:0 "BDT Terörle Mücadele Merkezi"
 CIS_bank_idea:0 "BDT Devletlerarası Bankası"
 CIS_council_leaders_idea:0 "BDT Devlet Başkanları Konseyi"
 CIS_confederation_member_idea:0 "BDT Konfederasyonu Üyesi"
