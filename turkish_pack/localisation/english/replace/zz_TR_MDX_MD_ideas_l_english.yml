 idea_focus_generic_counter_terrorism:0 "Terörle Mücadele Operasyonları"
 idea_focus_generic_counter_terrorism_desc:0 "Özel terörle mücadele birimleri istihbarat ve güvenlik servislerinin içine yerleştirilmiştir; bu, direnişin bastırılmasını ve karşı istihbarat toplamayı iyileştirir."
 idea_focus_generic_cyber_warfare:0 "Siber Savaş Girişimleri"
 idea_focus_generic_cyber_warfare_desc:0 "Saldırı ve savunma amaçlı siber yeteneklere yapılan yatırım, şifreli haberleşmeyi ve ulusal istihbarat ağlarını güçlendirdi."
 idea_focus_volunteer_corps:0 "Gönüllü Birlikler"
 idea_focus_generic_motorized_focus:0 "Taşıt Üretimi Odağı"
 idea_focus_generic_motorized_focus_desc:0 "Bu ülke, çeşitli iş dünyası ve hükümet reformları sayesinde sivil taşıtların fabrika üretimini azamiye çıkarmayı başarmıştır."
 idea_focus_generic_education_reform:0 "Eğitim Reformu"
 idea_focus_generic_education_reform_desc:0 "Bir Eğitim Reformu sayesinde bu ülke, bilim insanlarını ve akademisyenleri daha çok sayıda ve daha yetkin biçimde yetiştirmeyi başarmıştır. Ulusal ve özel araştırma projelerinin başarıya ulaşma ihtimali artık belirgin biçimde daha yüksektir."
 idea_focus_generic_public_service_investment:0 "Kamu Hizmeti Yatırımı"
 idea_focus_generic_public_service_investment_desc:0 "Bu ülke kamu yönetimini ve hizmet sektörünü büyük ölçüde iyileştirmiş, aynı zamanda tüketim malı üretiminin verimliliğini de artırmıştır. Bu, sanayi kapasitesinin daha çok hükümetin istediği yönde kullanılmasına yol açabilir."
 idea_focus_generic_national_strength:0 "Ulusal Güç"
 idea_focus_generic_national_strength_desc:0 "Bu ülke, kişisel özgürlük ve küçük devlet düşüncelerini ve ideallerini ezmeye kararlıdır. Yönetim, muhalif güçleri baskı altına alma ve susturma konusunda hiçbir pişmanlık göstermemiştir. Demokrasinin gelişmesi pek olası değildir."
 idea_focus_generic_path_of_equality:0 "Eşitlik Yolu"
 idea_focus_generic_path_of_equality_desc:0 "Bu ülke, yolunun eşitlik yolu olması gerektiğine karar vermiştir. Bireyin özgürlüğü, topluluğun ilerlemesi uğruna feda edilir. Militarizm, Milliyetçilik ve bunlarla gelmesi beklenen Düzen reddedilir, ancak dünyanın eşitliğe ulaşması için gerekli kötülükler olarak görülür."
 idea_generic_temporary_debt_refactoring:0 "Geçici Borç Yeniden Yapılandırması"
 idea_generic_temporary_debt_refactoring_desc:0 "Hükümetimizin mevcut borç durumu oldukça sürdürülemez. Mevcut devlet borcumuzda küçük düzenlemeler yaparsak toplam ödediğimiz borcu azaltabiliriz."
 idea_focus_generic_commerce_efficiency:0 "Ticaret Verimliliği"
 idea_focus_generic_reckless_progress:0 "Pervasız İlerleme"
 idea_focus_generic_will_of_the_people:0 "Halkın İradesi"
 idea_focus_generic_national_heritage:0 "Ulusal Miras"
 idea_focus_generic_jihad:0 "Cihat"
 idea_JAP_emperor_akihito:0 "İmparator Akihito"
 idea_JAP_emperor_akihito_desc:0 "Hirohito'nun oğlu Majesteleri Akihito, Japonya İmparatoru'dur. Gerçek bir gücü olmasa da Japon halkı için büyük bir mutluluk ve huzur kaynağıdır. Eski İmparatorluk ile bugünün Cumhuriyeti'ni birbirine bağlayan şeyi temsil eder. Japonya'nın karşılaştığı savaşların gazilerini, bunlardan haberi olmayan gençlerle birbirine bağlayan şeyi temsil eder."
 islamic_sectarian_conflicts:0 "İslami Mezhep Çatışmaları"
 islamic_sectarian_conflicts_desc:0 "İslam birçok mezhebe bölünmüştür, ancak üç ana grup öne çıkmıştır: Sünni (dünya Müslümanlarının %88'i), Şii (dünya Müslümanlarının %10'u) ve Haricî/İbâdî (dünya Müslümanlarının yaklaşık %1'i). Bu grupların birçok doktrin anlaşmazlığı vardır, ancak özellikle Sünniler ile Şiiler arasındaki rekabet, ister gerçek teolojik anlaşmazlıklar ister toprak çatışması ya da etnik şiddet için bir bahane olsun, yüzyıllar boyunca defalarca çatışmaya zemin hazırlamıştır.\n\nBu ülke hem önemli bir Sünni hem de Şii nüfusa sahiptir; bu da her iki tarafın ibadethanelerde, devlet kademelerinde veya gündelik kamusal yaşam alanlarında birbirine derin bir güvensizlik duymasına yol açar."
 political_autonomy:0 "Siyasi Özerklik"
 political_autonomy_desc:0 "Bir ülke için en büyük tehlikelerden biri yabancı nüfuzu altına girmektir. Bundan her ne pahasına olursa olsun kaçınmalıyız ve kendi yolumuzda yürüme olanağına her zaman sahip olmalıyız."
 economic_autonomy:0 "Ekonomik Özerklik"
 economic_autonomy_desc:0 "Bir ülke için en büyük tehlikelerden biri ekonomisini yabancı bir güce teslim etmektir. Halkımız onların ezeceği bir halk değildir; onu yönetecek olan biziz."
 emerging_outlook:0 "Yükselen Eğilimine Kayış"
 flexible_diplomacy:0 "Esnek Diplomasi"
 flexible_diplomacy_desc:0 "Her ülke müttefikimiz ya da düşmanımız olabilir. İkisini de her yerde aramalıyız."
 idea_generic_reaching_to_the_global_market:0 "Küresel Pazara Açılma"
 idea_generic_reaching_to_the_global_market_desc:0 "Küresel pazara açılmak ve yatırımlarımızı maliyet ve zaman açısından daha verimli hale getirmek, ulusumuza yalnızca daha fazla kâr getirecektir."
 idea_generic_the_manpower_solution:0 "İnsan Gücü Çözümü"
 idea_generic_the_manpower_solution_desc:0 "İş gücümüze daha fazla insan katılmasını teşvik edebilirsek ülkenin tüm ekonomik sektörlerini geliştirebiliriz."
 establishing_a_paratrooper_corps_idea:0 "Paraşütçü Birliği Kur"
 establishing_a_marine_corps_idea:0 "Deniz Piyade Birliği Kur"
 idea_generic_worker_productivity:0 "İyileştirilmiş Kişi Başı Verimlilik"
 idea_generic_worker_productivity_desc:0 "İşçilerimiz son derece verimli ve teknolojideki son gelişmeler sayesinde bu değişimi ve yönelimi ülkemizde teşvik etmeye devam etmeliyiz."
 idea_overlord_subsidies:0 "Hâkim Devlet Sübvansiyonları"
 idea_overlord_subsidies_desc:0 "Hâkim devletimizin ekonomik yararımız için sağladığı sübvansiyonlar, ekonomimiz için giderek ona daha bağımlı hale geldiğimizden özerkliğimizi yavaş yavaş kaybetmemize yol açıyor."
 idea_focus_import_additional_military_equipment:0 "Ek Askeri Teçhizat İthal Et"
 idea_focus_import_additional_military_equipment_desc:0 "Ek askeri teçhizat ithal etmeye başlama zamanı geldi; aksi halde teçhizat eksikliğiyle savaştığımız için muharebe sahasında yenileceğiz."
 national_identity_focus:0 "Ulusal Kimlik Odağı"
 national_identity_focus_desc:0 "Ülkemiz halkı ortak bir tarihi ve soyu paylaşır. Bir olduğumuz ve ayrı olmadığımız fikrini vurgulamalı, gerekirse yaratmalıyız."
 patriotism_focus:0 "Vatanseverlik Odağı"
 patriotism_focus_desc:0 "Vatanseverlik, milliyetten bağımsız olarak ülkeye bağlılık fikridir. Halkın etrafında birleşebileceği bir bayrağımız olursa genel olarak daha güçlü oluruz."
 civic_nationalism:0 "Yurttaşlık Milliyetçiliği"
 civic_nationalism_desc:0 "Yurttaşlık milliyetçiliği, etnik kimlikte değil devlette birliği ifade eder. Devlete, yasalara, kurallara ve kurumlara dair ortak ideallerle farklı kökenlerden insanlar birlikte çalışabilecektir."
 autarchy_focus:0 "Otarşi Odağı"
 autarchy_focus_desc:0 "Otarşi, bir devletin hem siyasi hem de ekonomik olarak kendi kendine yeterli olması fikridir. Kendi ayaklarımız üzerinde durabileceğimizden emin olursak dış etkilere karşı daha az savunmasız oluruz."
 assertive_emergence:0 "Girişken Yükseliş"
 assertive_emergence_desc:0 "Eski düzen gerekirse güçle yıkılmalıdır. Yozlaşmış Batı, dünya sahnesindeki hak ettiğimiz yeri almamızı sonsuza dek engelleyecektir."
 isis_allegiance:0 "İslam Devleti'ne Bağlılık Yemini Et"
 isis_allegiance_desc:0 "İslam Devleti, düşmanlarına karşı kazandığı hızlı zaferler ve fetihlerle hak yolda olduğunu kanıtlamıştır. İslam Hilafeti'ni gerçekleştirmek için ona bağlılık yemini etmeliyiz."
 ummah_focus:0 "Ümmet Odağı"
 ummah_focus_desc:0 "Bütün Müslümanlar, soylarına veya doğum yerlerine bakılmaksızın aynı ailenin üyesidir. Hepsini toplumumuza açık kollarla karşılamalıyız."
 shariah_world:0 "Şeriat Hukukunu Dünyaya Dayat"
 shariah_world_desc:0 "Dünya yozlaşmıştır ve değişmesi gerekir. Bu iğrenç fikirlerin daha fazla var olmasına izin veremeyiz, harekete geçmeliyiz."
 battery_park_expansion_idea:0 "Batarya Parkı Genişleme Projeleri"
 battery_park_expansion_idea_desc:0 "Ülkemizdeki mevcut batarya parklarını genişletmek, elektrik şebekemizi iyileştirmeye yardımcı olarak tüm vatandaşlarımız ve sanayilerimiz için istikrarlı enerji sağlayacaktır."
 geothermal_energy_production_idea:0 "Teşvik Edilen Jeotermal Enerji Üretimi"
 hydroelectric_energy_production_idea:0 "Teşvik Edilen Hidroelektrik Enerji Üretimi"
 generic_centralization:0 "Merkezileşme"
 generic_centralization_desc:0 "Devletin merkezileştirilmesi geniş ulusumuzu elde tutmaya yardımcı olacaktır. Ulusu merkezileştirmek ayrıca ek siyasi sermaye getirecek ve siyasi sermaye artışıyla birlikte bir miktar ek vergi geliri de sağlamalıdır."
 generic_decentralization:0 "Ademi Merkeziyet"
 generic_decentralization_desc:0 "Devleti ademi merkezileştirmek ve bürokratik engelleri kaldırmak, toplam bürokratik maliyeti azaltmaya ve ek inşaat büyümesini teşvik etmeye yardımcı olacaktır."
 mass_exports:0 "Kitlesel İhracat"
 railway_construction_effort:0 "Demiryolu İnşaat Çabası"
 railway_construction_effort_desc:0 "Demiryolları her ülkenin can damarıdır. Malları geniş kara parçaları boyunca taşımak bunu yapmanın en kolay ve en uygun maliyetli yoludur. Demiryollarımıza yatırım yapmak yalnızca net bir fayda sağlayacaktır."
 military_industry_project:0 "Askeri Sanayi Projesi"
 military_production_bonus:0 "Askeri Üretim Bonusu"
 motorization_investments:0 "Motorizasyon Yatırımları"
 national_unity_bonus:0 "Ulusal Birlik Bonusu"
 naval_production_bonus:0 "Deniz Üretim Bonusu"
 nuclear_innovations:0 "Nükleer Yenilikler"
 political_power_bonus:0 "İdari İyileştirmeler"
 political_power_bonus_desc:0 "Belirli iyileştirmeler ve bürokratik engellerin kaldırılması, yönetimin ek siyasi kararlar alabilmesini ve yasa değişiklikleri yapabilmesini sağlayacaktır."
 production_efficiency_bonus:0 "Üretim Verimliliği Bonusu"
 resource_production_bonus:0 "Kaynak Üretim Bonusu"
 idea_focus_energy_preferred_fossil:0 "Tercih Edilen Fosil Yakıt Enerjisi"
 idea_focus_energy_preferred_fossil_desc:0 "Fosil yakıt enerjisini yeşil enerjiye tercih etmeye karar verdik; çünkü daha uygun maliyetlidir ve şu anki sorunları hafifletmeye yardımcı olacaktır."
 idea_focus_energy_preferred_renewable:0 "Teşvik Edilen Yenilenebilir Enerji"
 idea_focus_unemployment_program:0 "İşsizlik Programları"
 idea_focus_social_spending_expansions:0 "Sosyal Harcama Genişlemeleri"
 repair_yard_focus:0 "Tersane Onarım Odağı"
 combined_defense_industries_idea:0 "Birleşik Savunma Sanayileri"
 rifle_production_bonus:0 "Hafif Silah Üretimi"
 convoy_production_bonus:0 "Konvoy Üretim Odağı"
 mechanized_special_forces_idea:0 "Mekanize Özel Kuvvetler Odağı"
 light_infantry_special_forces_idea:0 "Hafif Piyade Özel Kuvvetler Odağı"
 rubber_production_bonus:0 "Kauçuk Üretim Bonusu"
 scientific_advances:0 "Bilimsel Gelişmeler"
 steel_production_bonus:0 "Çelik Üretim Bonusu"
 SWE_idea_overhalling_our_university_system:0 "Üniversite Sistemimizi Elden Geçirmek"
 generic_bureaucratic_drain_idea:0 "Bürokratik Yük"
 generic_bureaucratic_drain_idea_desc:0 "Son eylemler bürokrasimizi yıprattı ve artık bir yük haline geldi. Bu genellikle geçici olsa da ilerleyen dönemde daha fazla soruna yol açabilir..."
 USA_homeland_security:0 "İç Güvenlik Bakanlığı"
 USA_homeland_security_desc:0 "İç Güvenlik Bakanlığı (Homeland Security), yeniden düzenlenen çeşitli ABD sivil kurumlarını kapsayan bir ABD ulusal güvenlik şemsiye terimidir. Temel amacı, diğer birçok ülkede bulunan içişleri bakanlığı gibi görev yapmaktır."
 USA_guantanamo_bay:0 "Guantanamo Körfezi"
 USA_guantanamo_bay_desc:0 "Guantanamo Körfezi gözaltı kampı, Küba'daki Guantanamo Körfezi kıyısında yer alan Guantanamo Körfezi Deniz Üssü içinde bulunan, Guantánamo, G-Bay, GTMO ve Gitmo olarak da anılan bir Amerika Birleşik Devletleri askeri hapishanesidir. Tutukluların süresiz ve yargılanmadan gözaltında tutulması ve birçok tutuklunun işkence gördüğüne dair haberler nedeniyle, bu kampın faaliyetleri Uluslararası Af Örgütü tarafından ve Amerika Birleşik Devletleri Anayasası'nın On Dördüncü Değişikliği'ndeki hukuki süreç hakları bakımından büyük bir insan hakları ihlali olarak değerlendirilmektedir."
 land_of_the_free:0 "Özgürlerin Ülkesi"
 land_of_the_free_desc:0 "Amerika Birleşik Devletleri, dünyaya özgürlük ve demokrasi feneridir."
 USA_usaid:0 "USAID"
 USA_usaid_desc:0 "Amerika Birleşik Devletleri Uluslararası Kalkınma Ajansı (USAID), ABD federal hükümetinin bağımsız bir kurumudur ve öncelikle sivil dış yardımı ve kalkınma desteğini yönetmekten sorumludur. $$27 milyarı aşan bütçesiyle USAID dünyanın en büyük resmi yardım kuruluşlarından biridir ve tüm ABD dış yardımının yarısından fazlasını oluşturur (bu, mutlak dolar bazında dünyanın en yüksek tutarıdır).\n\n§RBu ulusal ruh aşağıdaki koşullarda iptal edilir.§!\n§Y[USA.GetNameWithFlag]§! ya da herhangi bir §Y[USA.GetFlag] [USA.GetAdjective] müttefiki§! ile savaştaysak, §YKişi Başı GSYİH§! §Y35 bin§! üzerindeyse veya %10'dan fazla Dünya Gerginliği yarattıysak."
 USA_usaid_idea_tt:0 "Ek Gelir: 10 milyon kişi başına $$§G0,004§!"
 USA_usaid_idea_2_tt:0 "§Y[USA.GetNameWithFlag]§! tarafından etkilendiğinde, §Y[THIS.GetFlag] [THIS.GetAdjective]§! $foreign_influence_defense_modifier$ değeri §R%5§! oranında §Razalır§!\n"
 worker_strikes_1:0 "İşçi Grevleri"
 worker_strikes_1_desc:0 "Bu ülkenin işgücü arasında bir miktar huzursuzluk var."
 worker_strikes_2:0 "Yaygın İşçi Grevleri"
 worker_strikes_2_desc:0 "Otobüsler, trenler, uçaklar ve taksiler bu ülkede pek işlemiyor. Yalnızca bazı fabrikalar çalışıyor. İşgücü hoşnutsuz."
 worker_strikes_3:0 "Büyük İşçi Grevleri"
 worker_strikes_3_desc:0 "İnsanların siyasi bir mesaj vermek için çalışmak istemediği durumlar yaşanıyor. Bu ülkede büyük bir siyasi mesaj veriliyor."
 worker_strikes_4:0 "Yıkıcı İşçi Grevleri"
 worker_strikes_4_desc:0 "Ulusal ekonomi çöküşün eşiğinde. Hükümet halkını çalıştırmayı başaramıyor gibi görünüyor."
 full_control_of_suez:0 "Süveyş Kanalı İdaresi"
 full_control_of_suez_desc:0 "Süveyş Kanalı, Süveyş Kanalı İdaresi tarafından kontrol edilmekte ve işletilmektedir. İdarenin yalnızca geçiş ücretlerinden elde ettiği gelir yılda 5 milyar ABD dolarıdır. Süveyş, uluslararası anlaşmalar gereği hem sivil hem askeri gemilere açık olsa da Asya ile Avrupa arasındaki deniz taşımacılığını kontrol etmek için kolayca kullanılabilir."
 full_control_of_suez_idea_TT:0 "Ek Gelir: $§G0,100§!"
 full_control_of_hormuz_idea_TT:0 "Ek Gelir: $§G0,800§!"
 partial_control_of_suez:0 "Süveyş Kanalı İdaresi - Ortak Mülkiyet"
 partial_control_of_suez_desc:0 "Süveyş Kanalı, Süveyş Kanalı İdaresi tarafından kontrol edilmekte ve işletilmektedir. İdarenin yalnızca geçiş ücretlerinden elde ettiği gelir yılda 5 milyar ABD dolarıdır. Süveyş, uluslararası anlaşmalar gereği hem sivil hem askeri gemilere açık olsa da Asya ile Avrupa arasındaki deniz taşımacılığını kontrol etmek için kolayca kullanılabilir. Süveyş Kanalı şu anda iki ülkenin ortak yönetimi altındadır"
 partial_control_of_suez_idea_TT:0 "Ek Gelir: $§G0,050§!"
 entry_to_china:0 "Çin'e Giriş Kapısı"
 entry_to_china_desc:0 "Hong Kong'un anakara ile Batı arasında benzersiz bir ilişkisi vardır. Birleşik Krallık'tan yakın zamanda devralınması, Batı gelenekleri ve iş uygulamalarını da getirdi. Deng'in reformlarından önce Hong Kong, Çin'de dış yatırımın girebildiği tek yerdi.\n\nŞimdi bir değişim yaşanıyor ve Hong Kong bir zamanlar sahip olduğu benzersiz konumu kaybetme tehlikesiyle karşı karşıya. Yine de Hong Kong borsası, diğer birçok Asya borsasının imrendiği bir borsadır."
 full_control_of_panama:0 "Panama Kanalı İdaresi"
 full_control_of_panama_desc:0 "PCA (Autoridad del Canal de Panamá), Panama Kanalı'nın işletilmesinden ve yönetilmesinden sorumlu Panama hükümeti kurumudur. Devlet, ücretler ve diğer faaliyetler aracılığıyla istikrarlı bir gelire erişir. Stratejik önemi de küçümsenemez."
 full_control_of_panama_tt:0 "Ek Gelir: $§G0,050§!"
 asian_tigers_legacy:0 "Dört Asya Kaplanı Mirası"
 asian_tigers_legacy_desc:0 "Güney Kore, Tayvan, Singapur ve Hong Kong'dan oluşan dört ekonomi, geçen yüzyılın son döneminde benzeri görülmemiş bir büyüme yaşadı. İşletmeleri, piyasa ve devlet müdahalelerinin birleşimiyle hızla ilerleyen ekonomiler yarattı. \n\nGörkemli günleri 1997 Asya mali krizinin ardından yarıda kesildi. Etkilenen diğer ülkelerin aksine ekonomileri hâlâ nispeten verimlidir."
 asian_crisis:0 "1997 Asya Mali Krizi"
 asian_crisis_desc:0 "Gelişmekte olan Doğu ve Güneydoğu Asya'yı saran ekonomik kriz, on yıllık büyümeyi çöpe attı. Ulusal para birimlerine duyulan güvenin kaybı merkez bankalarını bugün bile uğraştırıyor. Kamu ve özel borç da fırladı.\n\nAcı dersler alındı; geçmişte istenmeyen ekonomik reformlar tüm hızıyla sürüyor. Her ülke krizden farklı etkilendi ve her birinin kendi çözümleri var.\n\nEtkilenen ülkelere akan yatırımlar bir zamanlar dünya toplamının yarısıydı, ancak artık bunlar [CHI.GetFlag]Çin'e ve başka yerlere gidiyor."
 int_investment_china:0 "Akın Eden Uluslararası Yatırımlar"
 int_investment_china_desc:0 "Asya ekonomik krizinin ardından yatırımcılar yatırımlarını başka piyasalara ve başlıca bizim piyasamıza yönlendirmeyi tercih etti.\n§W--------------§!\nBu ulusal ruh §HSavaşta§! olursak §RKaldırılır§!."
 mp_optimization_idea:0 "MP Yapay Zekâ Optimizasyonu"
 mp_optimization_idea_desc:0 "Yapay zekânın tuhaf şeyler yapmasını engeller."
 low_level_of_aids:0 "Düşük HIV Yaygınlığı"
 low_level_of_aids_desc:0 "Bu ülke nüfusunun %5 ila %10'u HIV'e yakalanmıştır. Ölümcül bir hastalık olan HIV, sonunda hastaların çalışmasını ya da normal bir yaşam sürmesini tümüyle engellediği için bundan acı çekenler üzerinde büyük bir etki yaratır. HIV ile mücadele yavaş bir süreçtir ve tek gerçek araç, insanların acısını azaltmak ve bulaşma riskini düşürmek için halkı eğitmek üzere sürekli ve yüksek kaliteli sağlık hizmetidir.\n\n[HIV_healthcare_tooltip]"
 rising_level_of_aids:0 "Artan HIV Yaygınlığı"
 rising_level_of_aids_desc:0 "Bu ülke nüfusunun %10 ila %15'i HIV'e yakalanmıştır. Ölümcül bir hastalık olan HIV, sonunda hastaların çalışmasını ya da normal bir yaşam sürmesini tümüyle engellediği için bundan acı çekenler üzerinde büyük bir etki yaratır. HIV ile mücadele yavaş bir süreçtir ve tek gerçek araç, insanların acısını azaltmak ve bulaşma riskini düşürmek için halkı eğitmek üzere sürekli ve yüksek kaliteli sağlık hizmetidir.\n\n[HIV_healthcare_tooltip]"
 high_level_of_aids:0 "Yüksek HIV Yaygınlığı"
 high_level_of_aids_desc:0 "Bu ülke nüfusunun %15 ila %20'si HIV'e yakalanmıştır. Ölümcül bir hastalık olan HIV, sonunda hastaların çalışmasını ya da normal bir yaşam sürmesini tümüyle engellediği için bundan acı çekenler üzerinde büyük bir etki yaratır. HIV ile mücadele yavaş bir süreçtir ve tek gerçek araç, insanların acısını azaltmak ve bulaşma riskini düşürmek için halkı eğitmek üzere sürekli ve yüksek kaliteli sağlık hizmetidir.\n\n[HIV_healthcare_tooltip]."
 very_high_level_of_aids:0 "Çok Yüksek HIV Yaygınlığı"
 very_high_level_of_aids_desc:0 "Bu ülke nüfusunun %20 ila %25'i HIV'e yakalanmıştır. Ölümcül bir hastalık olan HIV, sonunda hastaların çalışmasını ya da normal bir yaşam sürmesini tümüyle engellediği için bundan acı çekenler üzerinde büyük bir etki yaratır. HIV ile mücadele yavaş bir süreçtir ve tek gerçek araç, insanların acısını azaltmak ve bulaşma riskini düşürmek için halkı eğitmek üzere sürekli ve yüksek kaliteli sağlık hizmetidir.\n\n[HIV_healthcare_tooltip]"
 critical_level_of_aids:0 "Kritik HIV Yaygınlığı"
 critical_level_of_aids_desc:0 "Bu ülke nüfusunun %20 ila %25'i HIV'e yakalanmıştır. Ölümcül bir hastalık olan HIV, sonunda hastaların çalışmasını ya da normal bir yaşam sürmesini tümüyle engellediği için bundan acı çekenler üzerinde büyük bir etki yaratır. HIV ile mücadele yavaş bir süreçtir ve tek gerçek araç, insanların acısını azaltmak ve bulaşma riskini düşürmek için halkı eğitmek üzere sürekli ve yüksek kaliteli sağlık hizmetidir.\n\n[HIV_healthcare_tooltip]"
