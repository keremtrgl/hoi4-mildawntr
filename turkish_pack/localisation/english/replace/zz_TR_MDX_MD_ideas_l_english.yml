 corruption_decreased_adm_spending:0 "Yolsuz İdari Yönetim"
 corruption_decreased_adm_spending_desc:0 "Hükümetimizdeki idare yolsuz, ancak bu bazı giderleri defter dışında «kırpmamıza» olanak tanıyor."
 corruption_decreased_police_spending:0 "Yolsuz Polis Yönetimi"
 corruption_decreased_police_spending_desc:0 "Sistemde yapılacak birkaç değişiklik polisimizin daha küçük bir bütçeyle çalışmasını sağlayarak bize istediğimizi yapmak için daha fazla alan bırakmalı."
 corruption_decreased_mil_spending:0 "Yolsuz Savunma Sanayii Yönetimi"
 corruption_decreased_mil_spending_desc:0 "Savunma sanayimizde güç mevkilerine yerleştirilmiş doğru kişiler, daha elverişli koşullar pazarlık etmemize olanak tanıyacak."
 corruption_decreased_edu_spending:0 "Yolsuz Eğitim Yönetimi"
 corruption_decreased_edu_spending_desc:0 "Eğitim hükümet için yalnızca bir araçtır. Bu aracı sömürmenin ve buraya akıttığımız paranın bir kısmını geri toplamanın zamanı geldi."
 corruption_decreased_health_spending:0 "Yolsuz Sağlık Hizmetleri Yönetimi"
 corruption_decreased_health_spending_desc:0 "Sağlık hizmeti zaten bir Ponzi şemasıdır."
 corruption_decreased_social_spending:0 "Yolsuz Sosyal Hizmetler Yönetimi"
 corruption_decreased_social_spending_desc:0 "Sosyal yardım mı? Etkili bir sosyal yardıma ihtiyaçları yok, finansmanı kesme zamanı!"
 corruption_civ_construction:0 "Sivil İnşaat Düzenekleri"
 corruption_civ_construction_desc:0 "Bürokrasiyi biraz aşmak ve gözümüzü kapatmak, yapılmaması gereken bazı binaların yapılmasına izin vermeli."
 corruption_mil_construction:0 "Askeri İnşaat Düzenekleri"
 corruption_mil_construction_desc:0 "Daha fazla askeri imalatı kontrolümüz altına almalı ve belki bir iki dostumuza vermeliyiz."
 corruption_construction_buff_idea:0 "İnşaat Düzeneği"
 corruption_military_prod_buff_idea:0 "Askeri Üretim Düzenekleri"
 corruption_resource_buff_idea:0 "Kaynak İhracat Düzenekleri"
 corruption_reform_resistance:0 "Kök Salmış Direniş"
 corruption_reform_resistance_desc:0 "Denetimden rahatsız olan yetkililer ve iş ağları, yolsuzlukla mücadele önlemlerinin ilerlemesini engelliyor."
 post_war_recovery_effort:0 "Savaş Sonrası Toparlanma Çabası"
 fuel_structure_building_efforts:0 "Ulusal Yakıt Rezervini Güvence Altına Alma"
 civil_war_disorganised_military_1:0 "Denetimsiz Ordu"
 civil_war_disorganised_military_1_desc:0 "İç savaşın başlaması bizi ordumuzla irtibatsız bıraktı. Kimin kimin tarafında olduğundan, ikmal depolarımızın nerede bulunduğundan ve artık bize silahı kimin tedarik ettiğinden bile emin değiliz.\n\n§RBu ulusal ruhun süresi dolduğunda durum bir miktar düzelecek.§!\n\nMevcut ordu durumu:\n§YDenetimsiz§!\nKaotik\nŞaşkın\nDağınık\nDüzensiz"
 civil_war_disorganised_military_2:0 "Kaotik Ordu"
 civil_war_disorganised_military_2_desc:0 "İç savaşın ilk şokunu atlatmış olsak da komuta zincirlerinin karışıklığı ve kötü yönetilen lojistik nedeniyle işler hâlâ oldukça kaotik.\n\n§RBu ulusal ruhun süresi dolduğunda durum bir miktar düzelecek.§!\n\nMevcut ordu durumu:\nDenetimsiz\n§YKaotik§!\nŞaşkın\nDağınık\nDüzensiz"
 civil_war_disorganised_military_3:0 "Şaşkın Ordu"
 civil_war_disorganised_military_3_desc:0 "Ordumuzu başıboş bir gönüllü grubundan fazlası olacak şekilde örgütledik. Ancak liderlik hâlâ eksik ve ordumuz büyük bir strateji ya da hedef olmadan hareket etme eğiliminde.\n\n§RBu ulusal ruhun süresi dolduğunda durum bir miktar düzelecek.§!\n\nMevcut ordu durumu:\nDenetimsiz\nKaotik\n§YŞaşkın§!\nDağınık\nDüzensiz"
 civil_war_disorganised_military_4:0 "Dağınık Ordu"
 civil_war_disorganised_military_4_desc:0 "İlk karışıklığın en kötüsü geride kaldı ve ordumuz artık çoğunlukla gerçek bir ordu gibi davranıyor.\n\n§RBu ulusal ruhun süresi dolduğunda durum bir miktar düzelecek.§!\n\nMevcut ordu durumu:\nDenetimsiz\nKaotik\nŞaşkın\n§YDağınık§!\nDüzensiz"
 civil_war_disorganised_military_5:0 "Düzensiz Ordu"
 civil_war_disorganised_military_5_desc:0 "Ordumuz neredeyse iç savaş öncesindeki profesyonel durumuna döndü. Şu anki en büyük zorluk, yol boyunca topladığımız çeşitli milisleri birleştirmek ve entegre etmek.\n\n§RBu ulusal ruhun süresi dolduğunda durum bir miktar düzelecek.§!\n\nMevcut ordu durumu:\nDenetimsiz\nKaotik\nŞaşkın\nDağınık\n§YDüzensiz§!"
 SHA_libyan_education:0 "Libya Eğitimi"
 SHA_libyan_education_desc:0 "Libya, 1980'lerden beri Sahra bağımsızlığının hararetli bir destekçisi olmuştur. Libya'nın POLISARIO Cephesi'ni desteklemesinin başlıca yollarından biri, birçok genç Sahralıya eğitim sağlamaktır. Bu, halkımıza Faslıların bizden esirgediği eğitime erişim sağlıyor."
 generic_increased_military_support:0 "Artan Askeri Destek"
 generic_military_intervention:0 "Aktif Askeri Müdahale"
 protests_garrison_damage:0 "Çevik Kuvvet Görevde"
 MD_emergency_police_funding_idea:0 "Acil Polis Finansmanı"
 MD_emergency_police_funding_idea_desc:0 "Polis güçleri fazla mesai bütçeleriyle ve acil tedarikle çalışıyor. Kalabalıklar daha hızlı dağılıyor ve itaat artıyor, ancak fatura ağır."
 MD_jobs_for_unemployed_idea:0 "İşsizler İçin İstihdam Programı"
 MD_jobs_for_unemployed_idea_desc:0 "Bir kamu işleri ve istihdam seferberliği işsiz vatandaşları yeniden işe döndürüyor. İstikrar ve siyasi ivme artıyor, tüketim malı arzı ise küçük bir bedel ödüyor."
 MD_tax_relief_promise_idea:0 "Vergi İndirimi Paketi"
 MD_tax_relief_promise_idea_desc:0 "Düşük gelirli haneler daha az vergi ödüyor ve bir mali teşvik yolda. Sözümüzü yerine getirirken istikrar ve siyasi ivme artıyor."
 SUD_humiliated_army:0 "Aşağılanmış Ordu"
 SUD_humiliated_army_desc:0 "Darfurlu isyancıların El Faşir'e düzenlediği son baskın, Sudan Ordusu için hem askeri hem psikolojik açıdan ağır bir darbe oldu. Çok daha küçük bir isyancı grubu birkaç uçağı yok etmeyi, birden fazla askeri öldürmeyi ve bir hava üssünün komutanı olan bir tümgeneral yakalamayı başardı. Ordunun bundan toparlanması zaman alacak."
 AI_nationalist_drift:0 "Oyun Kuralı Milliyetçi Kayış"
 SWE_stealth_submarines:0 "Denizaltı Gizlilik Teknolojisi"
 SWE_stealth_submarines_desc:0 "Denizaltı Gizlilik Teknolojisi"
 SWE_stealth_corvettes:0 "Korvet Gizlilik Teknolojisi"
 SWE_stealth_corvettes_desc:0 "Korvet Gizlilik Teknolojisi"
 SWE_homeguard:0 "Hemvärnet"
 healthcare_privatization:0 "Sağlık Sistemi"
 healthcare_privatization_desc:0 "Tıbbi hizmetlerin devlet ile özel teşebbüs arasında ne ölçüde sağlandığını belirler. Tamamen kamusal sistemler evrensel kapsama sağlar ancak mali yük getirir; tamamen özel sistemler ise düşük gelirli kesimlerin erişimi pahasına devlet harcamasını azaltır."
 fully_privatized_healthcare:0 "Tamamen Özelleştirilmiş Sağlık Hizmeti"
 fully_privatized_healthcare_desc:0 "Tüm tıbbi hizmetler piyasa ortamında faaliyet gösteren özel sağlayıcılar tarafından sunulur. Devletin doğrudan sağlık harcaması yoktur, ancak erişim ödeme gücüne bağlıdır ve sağlık sonuçlarındaki toplumsal eşitsizlik genellikle yüksektir."
 partially_privatized_healthcare:0 "Kısmen Özelleştirilmiş Sağlık Hizmeti"
 partially_privatized_healthcare_desc:0 "Sağlık hizmetlerinin çoğunu özel sağlayıcılar sunar; devlet yalnızca sınırlı bir güvenlik ağını finanse eder. Hükümet için maliyetler nispeten düşük tutulur, ancak özel sigorta karşılayamayanlar için kapsam boşlukları sürer."
 partially_nationalized_healthcare:0 "Kısmen Millileştirilmiş Sağlık Hizmeti"
 partially_nationalized_healthcare_desc:0 "Kamu hastaneleri ve sigorta programlarının özel sağlayıcılarla birlikte çalıştığı karma bir sistemdir. Devlet tüm vatandaşlar için asgari bir bakım düzeyini güvence altına alırken özel sağlayıcıların bunu tamamlamasına izin verir."
 fully_nationalized_healthcare:0 "Tamamen Millileştirilmiş Sağlık Hizmeti"
 fully_nationalized_healthcare_desc:0 "Sağlık hizmeti, tamamen devlet tarafından finanse edilen ve yönetilen evrensel bir kamu hizmeti olarak ele alınır. Tüm vatandaşlar gelirlerine bakılmaksızın kapsama alınır, ancak maliyetin tamamını hükümet üstlenir ve sistem süregelen önemli bir yatırım gerektirir."
 mining_policies:0 "Madencilik Düzenlemeleri"
 mining_policies_desc:0 "Doğal kaynakların çıkarılmasına uygulanan çevresel ve operasyonel standartları belirler. Daha sıkı düzenlemeler çevreyi ve toplulukları korur ancak üretimi azaltır; daha gevşek standartlar ise ekolojik zarar pahasına kaynak verimini azamiye çıkarır."
 full_environmental_protections:0 "Tam Çevre Koruması"
 full_environmental_protections_desc:0 "Kapsamlı mevzuat, tüm çıkarma faaliyetlerinde en sıkı çevre standartlarını zorunlu kılar. Sanayi üretimi kısıtlanır, ancak ekosistemlerin ve yerel toplulukların uzun vadeli sağlığı korunur."
 partial_environmental_protections:0 "Kısmi Çevre Koruması"
 partial_environmental_protections_desc:0 "Çevre standartları en hassas bölgelere ve en zararlı uygulamalara uygulanırken olağan çıkarma faaliyetleri sınırlı denetimle sürer. Üretimi önemli ölçüde engellemeden ekolojik zararı hafifleten bir uzlaşıdır."
 balanced_protections:0 "Dengeli Madencilik Düzenlemeleri"
 balanced_protections_desc:0 "Düzenlemeler, verimli kaynak çıkarımına izin verirken asgari çevresel güvenceler getirecek şekilde ayarlanmıştır. Ne çevre grupları ne de sanayi lobileri tam olarak memnun olur, ancak hem üretim hem sürdürülebilirlik işler bir düzeyde korunur."
 economic_motivated_mining:0 "Ekonomi Öncelikli Madencilik"
 economic_motivated_mining_desc:0 "Çevre düzenlemeleri uluslararası normların gerektirdiği asgari düzeyde tutulur. Çıkarma oranları ulusal ekonomik hedeflere hizmet etmek üzere azamiye çıkarılır; ekolojik kaygılar yalnızca doğrudan verimliliği tehdit ettiğinde ele alınır."
 strip_mining:0 "Açık Ocak Madenciliği"
 strip_mining_desc:0 "Azami kaynak çıkarımı uğruna tüm çevresel kısıtlamalar kaldırılır. Araziler hızla tüketilir ve topluluklar çevresel bedeli öder, ancak kısa vadeli verim önemli ölçüde artar."
 critical_infrastructure:0 "Altyapı Bakımı"
 critical_infrastructure_desc:0 "Ulusal altyapıya uygulanan bakım standardını belirler: yollar, elektrik şebekeleri, haberleşme ağları ve su sistemleri. Daha yüksek bakım harcaması üretim kapasitesini ve toplum refahını korur; yetersiz yatırım ise kademeli bozulmaya yol açar."
 minimal_maintenance:0 "Asgari Bakım"
 minimal_maintenance_desc:0 "Altyapı yalnızca arızanın hemen kriz yaratacağı yerlerde işler halde tutulur. Rutin bakım ertelenir, maliyetler kısa vadede düşer ve ulusal ağın durumu yavaş yavaş kötüleşir."
 standard_maintenance:0 "Standart Bakım"
 standard_maintenance_desc:0 "Altyapı, mevcut durumunu ve hizmet kalitesini koruyacak düzeyde bakıma tabi tutulur. Harcama öngörülebilir ve ölçülüdür; genişleme ya da iyileştirme peşinde koşmadan bozulmayı önler."
 extensive_maintenance:0 "Kapsamlı Bakım"
 extensive_maintenance_desc:0 "Hükümet tüm kritik ağlarda bakıma, modernizasyona ve dayanıklılığa ağır yatırım yapar. Altyapı performansı azamiye çıkar ve uzun vadeli yenileme maliyetleri düşer, ancak program sürekli bir bütçe taahhüdü gerektirir."
 employment_pressure:0 "Çalışma Düzenlemeleri"
 employment_pressure_desc:0 "Çalışma standartlarını, işçi haklarını ve binaları işletmek için gereken iş gücü büyüklüğünü belirleyen yasalar."
 comprehensive_regulations:0 "Kapsamlı İş Kanunu"
 comprehensive_regulations_desc:0 "Geniş işçi korumaları ve zorunlu istihdam düzeyleri, tüm sektörlerde iş gücü ihtiyacını artırır. İşçiler güvenli istihdam bekler; bu da işsizliği siyaseten tahammül edilmez kılar."
 strong_regulations:0 "Güçlü Çalışma Korumaları"
 strong_regulations_desc:0 "Güçlü işçi hakları ve güvenlik standartları bina başına daha fazla çalışan gerektirir. İstikrarlı istihdam beklentisi, hükümetin işsizliğe tahammülünü azaltır."
 standard_regulations:0 "Standart Çalışma Çerçevesi"
 standard_regulations_desc:0 "İş gücü gereksinimleri ve işsizlik toleransı bakımından standart değerler sağlayan dengeli bir iş hukuku yaklaşımı."
 light_regulations:0 "Hafif Çalışma Denetimi"
 light_regulations_desc:0 "Azaltılmış düzenleyici yük, işletmelerin daha az işçiyle çalışmasına olanak tanır. Nüfus istihdam güvencesizliğine daha alışkındır; bu da tahammül edilen işsizlik eşiğini yükseltir."
 minimal_regulations:0 "Asgari Çalışma Standartları"
 minimal_regulations_desc:0 "Neredeyse hiç olmayan işçi korumaları tüm binalarda yalın bir istihdama olanak tanır. Ekonomi, geniş bir fazla işgücü havuzuyla çalışacak şekilde kurulmuştur; bu da yüksek işsizliğe tahammülü büyük ölçüde artırır."
 COVID_pandemic_origin:0 "COVID-19 Pandemisinin Çıkış Noktası"
 COVID_pandemic_origin_desc:0 "COVID-19 pandemisinin çıkış noktası olarak ülkemiz ciddi ekonomik aksamalarla ve uluslararası mercek altına alınmayla karşı karşıya. Sağlık sistemleri bunalmış durumda ve sanayi üretimi çakıldı."
 COVID_pandemic_impact:0 "COVID-19 Pandemisi"
 COVID_pandemic_impact_desc:0 "COVID-19 pandemisi gündelik hayatı ve ekonomik faaliyeti aksattı. Sokağa çıkma kısıtlamaları ve halk sağlığı önlemleri gerekli, ancak ağır bir ekonomik bedeli var."
 COVID_supply_chain_disruption:0 "Küresel Tedarik Zinciri Krizi"
 COVID_supply_chain_disruption_desc:0 "Pandemi küresel tedarik zincirlerini paramparça etti. Kritik bileşen ve hammadde kıtlıkları tüm sektörlerde inşaatı ve sanayi üretimini yavaşlatıyor."
 pandemic_swine_flu_origin:0 "H1N1 Domuz Gribi Çıkış Noktası"
 pandemic_swine_flu_origin_desc:0 "H1N1 domuz gribi pandemisinin çıkış noktası olarak ülkemiz artan uluslararası mercek altına alınmayla ve virüs nüfus arasında yayılırken fırlayan sağlık maliyetleriyle karşı karşıya."
 pandemic_swine_flu_impact:0 "H1N1 Domuz Gribi"
 pandemic_swine_flu_impact_desc:0 "H1N1 domuz gribi pandemisi ülkemize ulaştı. Başta korkulandan daha hafif seyretse de virüs sağlık sistemlerini zorluyor ve ekonomik faaliyeti aksatıyor."
 pandemic_MERS_outbreak:0 "MERS Salgını"
 pandemic_MERS_outbreak_desc:0 "Orta Doğu Solunum Sendromu, yüksek ölüm oranıyla ülkemizde yayılıyor. Hastaneler izolasyon koğuşları ve karantina protokolleri kurdukça sağlık maliyetleri fırlıyor."
 pandemic_ebola_outbreak:0 "Ebola Salgını"
 pandemic_ebola_outbreak_desc:0 "Ebola virüsü ülkemizi kasıp kavuruyor. Bütün topluluklar karantinaya alınıyor, sağlık çalışanları ön safta ölüyor ve etkilenen bölgelerde ekonomik faaliyet durma noktasına geldi."
 pandemic_ebola_DRC:0 "Ebola Vakaları Patlak Verdi"
 pandemic_ebola_DRC_desc:0 "Doğudaki bölgelerde patlak veren bir Ebola salgını sağlık sistemimizi zorluyor. Bölgedeki silahlı çatışma salgını kontrol altına alma çabalarını güçleştiriyor, maliyetleri artırıyor ve ekonomiyi istikrarsızlaştırıyor."
 USA_wot_diplomatic_victory:0 "Savaşsız Zafer"
 USA_wot_diplomatic_victory_desc:0 "Usame bin Ladin'i talep ettik ve bize teslim edildi; işgal olmadan, koalisyon olmadan ve eve bayrağa sarılı tek bir tabut gelmeden. Dünya, Amerikan baskısının zırhlı bir tümen tarafından desteklenmediğinde bile neler yapabildiğini fark etti.\n\nYurt içinde karşılama daha soğuk. Birçok kişi bir savaş istiyordu ve alamadı."
 USA_white_house_burned:0 "Beyaz Saray Yakıldı"
 USA_white_house_burned_desc:0 "Amerika Birleşik Devletleri Başkanı'nın resmî konutu ve çalışma yeri olan Beyaz Saray, düşman güçler tarafından yakıldı. Bu sembolik kayıp ulusu şoke etti ve halkı öfke ve intikam azmiyle coşturdu. Ordumuzun morali yükseliyor, ancak iktidar merkezi harabeye dönmüşken siyasi istikrar sarsılıyor."
 TAL_pariah_settlement:0 "Kandahar Uzlaşması"
 TAL_pariah_settlement_desc:0 "Şeyh'i teslim ettik ve karşılığında ülkemizi elimizde tutmamıza izin verildi. Bu kötü bir pazarlık. Neredeyse hiç kimse tarafından tanınmıyoruz, Güvenlik Konseyi tarafından ambargoya tabiyiz, Amerikalılarca izleniyoruz ve yanımızda savaşan adamlarca hor görülüyoruz.\n\nEmirlik ayakta kalıyor. Söylenebilecek tek şey bu."
 MD_nationalist_migrant_protests:0 "Milliyetçi Göçmen Protestoları"
 MD_nationalist_migrant_protests_desc:0 "Milliyetçi kalabalıklar göçmen politikamıza karşı sokaklara döküldü. Huzursuzluk zamanla yatışır, ancak sürdüğü müddetçe kamu düzenine yük bindirir."
