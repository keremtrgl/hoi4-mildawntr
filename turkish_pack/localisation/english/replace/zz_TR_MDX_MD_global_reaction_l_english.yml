 SOV_Global.5.t:0 "Rusya Belarus ile savaş başlattı"
 SOV_Global.5.d:0 "Rus hükümeti, onları ortadan kaldırmak için Belarus'ta askerî operasyon başlattığını duyurdu; Rus saldırganlığının bir sonraki kurbanı biz olabiliriz diye korkuyoruz, onların işgaline hazırlanmaya başlamalı mıyız?"
 SOV_Global.5.a:0 "Rusya'ya Karşı Savunma Doktrini İlan Et"
 SOV_Global.5.b:0 "Rusya'nın işgali mi? Saçmalık."
 SOV_Global.6.t:0 "[FROM.GetName] Savunma Doktrini İlan Etti"
 SOV_Global.6.d:0 "[FROM.GetName], bizim yürüttüğümüz son askerî operasyondan korkarak bize karşı bir savunma doktrini ilan etti. Hükümet, onlarla ortak sınırımızda ek tahkimat inşa edileceğini duyurdu."
 SOV_Global.6.a:0 "Kolay gelsin onlara"
 SOV_Global.17.t:0 "Rusya Belarus ile savaş başlattı"
 SOV_Global.17.d:0 "Rus hükümeti, onları ortadan kaldırmak için Belarus'ta askerî operasyon başlattığını duyurdu; Rus saldırganlığının bir sonraki kurbanı biz olabiliriz diye korkuyoruz, onların işgaline hazırlanmaya başlamalı mıyız?"
 SOV_Global.17.a:0 "Rusya'ya Karşı Savunma Doktrini İlan Et"
 SOV_Global.17.b:0 "Rusya'nın işgali mi? Saçmalık."
