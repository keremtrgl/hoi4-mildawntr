 SOV_Global.11.a:0 "Bu savaşa müdahale edeceğiz"
 SOV_Global.11.b:0 "Karışmamalıyız."
 SOV_Global.12.t:0 "Rusya Özbekistan ile savaş başlattı"
 SOV_Global.12.d:0 "Rus hükümeti, onları ortadan kaldırmak için Özbekistan'da askerî operasyon başlattığını duyurdu; belki bu savaşa biz de müdahale etmeliyiz?"
 SOV_Global.12.a:0 "Devrim Muhafızları'nı göndereceğiz"
 SOV_Global.12.b:0 "Karışmamalıyız."
 SOV_Global.13.t:0 "Turan Yardım Çağrısı Yapıyor"
 SOV_Global.13.d:0 "Rusya, dil, tarih ve kanla bize bağlı kardeş bir Türk ulusu olan Özbekistan'ı işgal etti. Hükümetimiz, Taşkent'in dayanışma çağrılarına sözden fazlasıyla karşılık verip vermeyeceğine karar vermeli."
 SOV_Global.13.a:0 "Askerî danışman göndereceğiz"
 SOV_Global.13.b:0 "Karışmamalıyız."
 SOV_Global.14.t:0 "Rusya Baltık Devletlerine Karşı Saldırganlık Gösteriyor"
 SOV_Global.14.d:0 "Rusya, Baltık topraklarını kendi bünyesine geri katma niyetini açıkça ilan ediyor; bu, bağımsızlığımıza doğrudan bir tehdit, gerekli önlemleri almalıyız"
 SOV_Global.14.a:0 "Rusya'ya Karşı Savunma Doktrini İlan Et"
 SOV_Global.14.b:0 "Rusya'nın işgali mi? Saçmalık."
 SOV_Global.15.t:0 "Rusya Ukrayna ile savaş başlattı"
 SOV_Global.15.d:0 "Rusya, Ukrayna topraklarını kendi bünyesine geri katma niyetini açıkça ilan ediyor; bu, bağımsızlığımıza doğrudan bir tehdit, gerekli önlemleri almalıyız"
 SOV_Global.15.a:0 "Rusya'ya Karşı Savunma Doktrini İlan Et"
 SOV_Global.15.b:0 "Rusya'nın işgali mi? Saçmalık."
 SOV_Global.16.t:0 "[FROM.GetName] Savunma Doktrini İlan Etti"
 SOV_Global.16.d:0 "[FROM.GetName], bizim yürüttüğümüz son askerî operasyondan korkarak bize karşı bir savunma doktrini ilan etti. Hükümet, onlarla ortak sınırımızda ek tahkimat inşa edileceğini duyurdu."
 SOV_Global.16.a:0 "Kolay gelsin onlara"
 SOV_Global.19.t:0 "Ukrayna Savaşı"
 SOV_Global.19.d:0 "Ukrayna'nın Rusya ile savaşı açıkça kaybettiği görülüyor; belki Rusya her şeyi tamamen kendine almasın diye müdahale etmeliyiz?"
 SOV_Global.19.a:0 "Şansımızı deneyelim"
 SOV_Global.19.b:0 "Bunu yapmamalıyız.."
 SOV_Global.20.t:0 "Ermeni Karşıtı Koalisyon"
 SOV_Global.20.d:0 "Azerbaycan hükümeti, Ermenistan'ın Kafkasya'daki genişlemesinden son derece endişe duyuyor ve saldırganın hamlesine karşı birlikte savunma yapmak üzere Ermenistan'ın saldırgan dış politikasına karşı bir askerî ittifak kurmamızı öneriyor."
 SOV_Global.20.a:0 "Harika fikir!"
 SOV_Global.20.b:0 "Hayır"
 SOV_Global.21.t:0 "Ermeni Karşıtı Koalisyon"
 SOV_Global.21.d:0 "Gürcistan, Ermenistan'ın saldırgan politikasına karşı askerî ittifak kurma fikrimizi kabul etti."
 SOV_Global.21.a:0 "Güzel"
 SOV_Global.22.t:0 "Ermeni Karşıtı Koalisyon"
 SOV_Global.22.d:0 "Gürcistan, saldırgan Ermeni dış politikasına karşı askerî ittifak kurma fikrimizi desteklemeyi reddetti; görünüşe göre bağımsızlıklarını kaybedeceklerine şimdiden karar vermişler."
 SOV_Global.22.a:0 "Üzücü"
 SOV_Global.23.t:0 "Ermeni Karşıtı Koalisyon"
 SOV_Global.23.d:0 "Gürcistan ve Azerbaycan bize karşı askerî ittifak kurduklarını duyurdu! Görünen o ki onlara saldırabileceğimizden gerçekten korkuyorlar."
 SOV_Global.23.a:0 "Korksunlar"
 SOV_Global.18.t:0 "Gürcistan'da Ayaklanma"
 SOV_Global.18.d:0 "Beklenmedik biçimde, silahlı gruplar sabah saatlerinde Gürcistan'ın başkent bölgesindeki tüm ana kurumları ele geçirdi ve ülkelerinin bağımsızlığı için silahlı çatışma başlattıklarını duyurdu. Özel servislerimiz bunun Rus özel servislerinin faaliyeti olduğunu tespit etti; anlaşılan Rusya bizi içeriden yıkmayı planlıyor."
 SOV_Global.18.a:0 "Moskova Bunun Bedelini Ödeyecek"
 SOV_Global.24.t:0 "Gürcü Direnişi"
 SOV_Global.24.d:0 "Özel servislerimiz, eski Gürcistan'ın başkent bölgesindeki tüm faaliyetleri sabote etmeye başlayan Gürcü silahlı grupların faaliyetlerini bildirdi; görünüşe göre birileri durumu içeriden zayıflatmaya çalışıyor."
 SOV_Global.24.a:0 "Buna Son Vermeliyiz"
 SOV_Global.25.t:0 "Azerbaycan Direnişi"
 SOV_Global.25.d:0 "Özel servislerimiz, eski Azerbaycan'ın başkent bölgesindeki tüm faaliyetleri sabote etmeye başlayan Azerbaycanlı silahlı grupların faaliyetlerini bildirdi; görünüşe göre birileri durumu içeriden zayıflatmaya çalışıyor."
 SOV_Global.25.a:0 "Buna Son Vermeliyiz"
 SOV_Global.26.t:0 "Azerbaycan'da Ayaklanma"
 SOV_Global.26.d:0 "Beklenmedik biçimde, silahlı gruplar sabah saatlerinde Azerbaycan'ın başkent bölgesindeki tüm ana kurumları ele geçirdi ve ülkelerinin bağımsızlığı için silahlı çatışma başlattıklarını duyurdu. Özel servislerimiz bunun Rus özel servislerinin faaliyeti olduğunu tespit etti; anlaşılan Rusya bizi içeriden yıkmayı planlıyor."
 SOV_Global.26.a:0 "Moskova Bunun Bedelini Ödeyecek"
 SOV_Global.27.t:0 "Abhaz Direnişi"
 SOV_Global.27.d:0 "Özel servislerimiz, eski Abhazya'nın başkent bölgesindeki tüm faaliyetleri sabote etmeye başlayan Abhaz silahlı grupların faaliyetlerini bildirdi; görünüşe göre birileri durumu içeriden zayıflatmaya çalışıyor."
 SOV_Global.27.a:0 "Buna Son Vermeliyiz"
 SOV_Global.28.t:0 "Abhazya'da Ayaklanma"
 SOV_Global.28.d:0 "Beklenmedik biçimde, silahlı gruplar sabah saatlerinde Abhazya'nın başkent bölgesindeki tüm ana kurumları ele geçirdi ve ülkelerinin bağımsızlığı için silahlı çatışma başlattıklarını duyurdu. Özel servislerimiz bunun Rus özel servislerinin faaliyeti olduğunu tespit etti; anlaşılan Rusya bizi içeriden yıkmayı planlıyor."
 SOV_Global.28.a:0 "Moskova Bunun Bedelini Ödeyecek"
 SOV_Global.29.t:0 "Acara'da Ayaklanma"
 SOV_Global.29.d:0 "Beklenmedik biçimde, silahlı gruplar sabah saatlerinde Acara'nın başkent bölgesindeki tüm ana kurumları ele geçirdi ve ülkelerinin bağımsızlığı için silahlı çatışma başlattıklarını duyurdu. Özel servislerimiz bunun Rus özel servislerinin faaliyeti olduğunu tespit etti; anlaşılan Rusya bizi içeriden yıkmayı planlıyor."
 SOV_Global.29.a:0 "Türkiye Bunun Bedelini Ödeyecek"
 SOV_Global.30.t:0 "Türk Eğitmenler"
 SOV_Global.30.d:0 "Türk hükümeti, askerlerimizi desteklemek ve onlara modern savaş taktikleri öğretmek için askerî eğitmenlerini bize göndermeye hazır."
 SOV_Global.30.a:0 "Kabul Ediyoruz"
 SOV_Global.30.b:0 "Hayır"
 SOV_Global.31.t:0 "[ADJ.GetName] ülkesinde Eğitmenler"
 SOV_Global.31.d:0 "Silahlı kuvvetlerini desteklemek üzere eğitmenlerimizi kabul etmeyi onayladılar."
 SOV_Global.31.a:0 "Güzel"
 SOV_Global.32.t:0 "[ADJ.GetName] ülkesinde Eğitmenler"
 SOV_Global.32.d:0 "Silahlı kuvvetlerini desteklemek üzere eğitmenlerimizi kabul etmeyi reddettiler."
 SOV_Global.32.a:0 "Güzel"
 SOV_Global.33.t:0 "Ermenistan'da Rus Yanlısı Devrim"
 SOV_Global.33.d:0 "Görünüşe göre Rusya'daki Moskova rejimi, Moskova'dan bağımsız bir güç olduğumuz gerçeğini kabul edemiyor. Rusya son adımı attı ve meşru hükümetimize karşı devrim başlatmaları için Ermenistan'daki son sadık güçlere baskı yaptı!"
 SOV_Global.33.a:0 "Moskova Bunun Bedelini Ödeyecek"
 SOV_Global.34.t:0 "Ermenistan Bizden Nahçıvan'ı Talep Ediyor"
 SOV_Global.34.d:0 "Ermeni hükümeti cüretkâr ve küstah bir biçimde Nahçıvan bölgesini derhal kendi denetimlerine devretmemizi talep etti; ültimatomlarını kabul etmezsek ciddi sonuçlarla tehdit ediyorlar."
 SOV_Global.34.a:0 "Taleplerine Boyun Eğeceğiz."
 SOV_Global.34.b:0 "Asla"
 SOV_Global.35.t:0 "Nahçıvan Çatışması"
 SOV_Global.35.d:0 "Azerbaycan hükümeti karşımızdaki çaresizliğini anladı ve Nahçıvan'ı bize bıraktı."
 SOV_Global.35.a:0 "Güzel"
 SOV_Global.36.t:0 "Nahçıvan Çatışması"
 SOV_Global.36.d:0 "Azerbaycan hükümeti karşımızdaki çaresizliğini anladı ve Nahçıvan'ı bize bıraktı."
 SOV_Global.36.a:0 "Fazla Vakitleri Kalmadı"
 SOV_Global.37.t:0 "Nahçıvan Çatışması"
 SOV_Global.37.d:0 "Türk hükümeti, Azerbaycan hükümetinin zayıflığını görünce Ermenistan'ın bölgedeki nüfuzunu sınırlamak için Nahçıvan'a asker gönderip burayı kendi devletine katmaya karar verdi; buna karşılık vermeden olmaz."
 SOV_Global.37.a:0 "Yapabileceğimiz Bir Şey Yok"
 SOV_Global.37.b:0 "Yapabileceğimiz Bir Şey Yok"
 SOV_Global.37.c:0 "Bu Savaştır!"
