 SOV_Global.2.t:0 "Rusya Azerbaycan ile savaş başlattı"
 SOV_Global.2.d:0 "Rus hükümeti, oradaki düşmanca rejimi ortadan kaldırmak için Azerbaycan'da askerî operasyon başlattığını duyurdu; belki bu savaşa biz de müdahale etmeliyiz?"
 SOV_Global.2.a:0 "Azerbaycan Tehdidinden kurtulalım!"
 SOV_Global.2.b:0 "Karışmamalıyız."
 SOV_Global.3.t:0 "Rusya Azerbaycan ile savaş başlattı"
 SOV_Global.3.d:0 "Rus hükümeti, onları ortadan kaldırmak için Azerbaycan'da askerî operasyon başlattığını duyurdu; belki bu savaşa biz de müdahale etmeliyiz?"
 SOV_Global.3.a:0 "Rusya'ya savaş ilan edip Azerbaycan'ı kurtaracağız!"
 SOV_Global.3.b:0 "Ermenistan'a savaş ilan edeceğiz."
 SOV_Global.3.c:0 "Onlara askerî danışman göndereceğiz.."
 SOV_Global.3.f:0 "Karışmamalıyız."
 SOV_Global.4.t:0 "Rusya Azerbaycan ile savaş başlattı"
 SOV_Global.4.d:0 "Rus hükümeti, onları ortadan kaldırmak için Azerbaycan'da askerî operasyon başlattığını duyurdu; belki bu savaşa biz de müdahale etmeliyiz?"
 SOV_Global.4.a:0 "Azerbaycan Tehdidinden kurtulalım!"
