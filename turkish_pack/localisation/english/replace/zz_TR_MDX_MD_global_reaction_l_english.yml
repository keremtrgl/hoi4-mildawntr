 SOV_Global.9.t:0 "Rusya Türkmenistan ile savaş başlattı"
 SOV_Global.9.d:0 "Rus hükümeti, onları ortadan kaldırmak için Türkmenistan'da askerî operasyon başlattığını duyurdu; belki bu savaşa biz de müdahale etmeliyiz?"
 SOV_Global.9.a:0 "Bu savaşa müdahale edeceğiz"
 SOV_Global.9.b:0 "Karışmamalıyız."
 SOV_Global.10.t:0 "Rusya Litvanya ile savaş başlattı"
 SOV_Global.10.d:0 "Rusya, Litvanya topraklarında askerî operasyon başlattı; belki bu, atalarımıza ait tarihî topraklar saydığımız yerlerin en azından bir kısmını ele geçirmek için bir fırsattır, bu savaşa müdahale etmeye değer mi?"
 SOV_Global.10.a:0 "Bu savaşa müdahale edeceğiz"
 SOV_Global.10.b:0 "Karışmamalıyız."
 SOV_Global.11.t:0 "Rusya Özbekistan ile savaş başlattı"
