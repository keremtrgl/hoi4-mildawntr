 FUEL_DESC:0 "§HYakıt§!, ülkenizin fazla petrolünden üretilir. Her ülkenin, §HSilolar§! inşa edilerek artırılabilen azami bir §HYakıt§! kapasitesi vardır. §HYakıt§!; tanklar/mekanize birlikler, gemiler ve uçaklar tarafından kullanılır ve §Hİkmal Hatları§! ile dağıtılır.\n\n§HYakıt§! ayrıca ulusunuzun §HFosil Yakıtlı Santrallerini§! çalıştırır ve ekonominizin işlemeye devam etmesini sağlamak için önemli bir kaynaktır. §HNükleer Reaktörler§!, §HYenilenebilir Enerji Altyapısı§! ve §HDiğer Güç Kaynakları§! enerji üretmek için hiç §HYakıt§! tüketmez. §HNüfusunuz§! da genel ihtiyaçlarının bir parçası olarak §HYakıt§! tüketir. Askerî olmayan §HYakıt§! tüketiminiz hakkında daha fazla bilgi için §HEnerji Ekranına§! bakın (§Hİnşaat Sekmesi§!)."
