l_english:
 PKK_hard_fought_freedom:0 "Zor Kazanılmış Özgürlük"
 PKK_hard_fought_freedom_desc:0 "Özgürlüğümüz kolay gelmedi. Kürdistan'ın cesur savaşçılarının Türk devletinden özerklik koparması on yıllar sürdü ve bu özgürlük son Kürt'e kadar korunacak!"
 TUR_belgian_workers:0 "Belçikalı Bilim İnsanları"
 TUR_no_economic_plan:0 "Ekonomik Plan Yok"
 TUR_no_economic_plan_desc:0 "§R§YEkonomik Döngümüzü§! §YDurgunluk§! seviyesinin üzerine çıkaramayız§!\n\n90'ların sonundaki birkaç hükümet kurma girişimi, ardından gelen askeri darbe ve yeni seçilen hükümet ile IMF'nin çöken ekonomiye dair uyarıları, yabancı yatırımcıların ülkeden çekilmesiyle ekonomiden onlarca milyar doların silinmesine yol açtı. Türk ekonomisi fiilen yabancı yatırıma dayandığından, bu durum her türlü ekonomik büyümeyi durdurdu."
 TUR_party_rumours:0 "Parti Söylentileri"
 TUR_party_rumours_desc:0 "§R§W[socialism_L]§! popülaritesini elle artıramayız§!\n\nBaşbakan Bülent Ecevit yaşlı biri ve sağlığının bozulduğuna dair söylentiler var. Ayrıca Başbakan Yardımcısı Hüsamettin Özkan'ın, Ecevit'i sağlık durumu ve verimsiz yönetimi nedeniyle devirmeyi planlayan bir §W[socialism_L]§! milletvekili grubunun parçası olduğu konuşuluyor. Parti içindeki bu tür söylentiler ve muhalefet, hükümetin işleyişi için zehir etkisi yapıyor.\n\nÖzkan'ı alenen hedef almak onu partiden ayrılmaya zorlar, ancak yanında bazı milletvekillerini de götürebilir. Alternatif olarak beklemeyi tercih edip bunların söylentiden öteye geçmemesini umabiliriz."
 TUR_neo_ottomanism:0 "Yeni Osmanlıcılık"
 TUR_neo_ottomanism_desc:0 "Yeni Osmanlıcılık, hükümetin komşu ülkeler üzerinde nüfuz kurmasını ve Türk etkisini dışarıya yaymasını sağlayan saldırgan bir Türk dış politikası biçimidir."
 TUR_no_disasters_plan:0 "Afet Planı Yok"
 TUR_no_disasters_plan_desc:0 "Hükümetimizin şu anda herhangi bir afet hazırlık planı yok; yani bir afet yaşandığında buna hazırlıksız yakalanıyoruz"
 TUR_attacking_mafia1:0 "Mafyaya Saldırı"
 TUR_attacking_mafia1_desc:0 "Mafya ve üyeleriyle aktif bir çatışma içindeyiz"
 TUR_attacking_mafia2:0 "Mafyaya Zarar Veriliyor"
 TUR_attacking_mafia2_desc:0 "Mafya ve üyeleriyle aktif bir çatışma içindeyiz ve üstünlük bizde"
 TUR_committees_of_resistance_patrol:0 "Direniş Komiteleri"
 TUR_committees_of_resistance_patrol_desc:0 "Direniş Komiteleri sokaklarda vatana yakışmayan faaliyetleri arıyor"
 CIW_member:0 "CIW Üyesi"
 CIW_member_desc:0 "Bu ülke, Orta Doğu ve çevresinde çeşitli ekonomik projelere katılan, temel amacı Müslümanların ekonomik refahını artırmak olan bir ekonomik örgüt olan CIW'nin (İslami Refah Konfederasyonu) üyesidir"
 TUR_PKK_released_TT:0 "£TUR_Neutral_Communism  §OPKK İsyanı§! sona erecek!\n - £TUR_Neutral_Communism  §OPKK§!, yeni Kürt devletinin yönetici gücü olacak."
 TUR_PKK_insurgency_formally_ends_TT:0 "£TUR_Neutral_Communism  §OPKK İsyanı§! sona erecek"
 TUR_PKK_broke_free_tt:0 "[PKK.GetFlag] PKK özgürleşecek!\n - Bir savaş hedefi gerekçelendirmedikçe veya bir baskın yoluyla savaş başlatmadıkça doğrudan müdahale edemeyeceğiz\n - [PKK.GetFlag] PKK'nın, bize karşı büyük bir savunma bonusuna sahip daimi bir ordusu olacak.\n - Kürt bölgelerindeki tüm çekirdek topraklarımızı kaybedeceğiz."
 TUR_through_troubles:0 "Sıkıntılı Günlerin Ardından"
 TUR_through_troubles_desc:0 "Türkiye şu anda ekonomik bir krizden geçiyor. Halkımıza hükümetin bu süreci atlatabileceğine dair güvence vermeliyiz"
 TUR_beacon_of_islam:0 "Büyük Alim"
 TUR_beacon_of_islam_desc:0 "Fethullah Gülen İslam'ın en büyük alimidir ve öğretileri tüm dünyada tanınacaktır. Elbette muhafazakâr İslam'ı vaaz etmenin bazı yan etkileri olabilir..."
 TUR_drug_problem:0 "Uyuşturucu Sorunu"
 TUR_drug_problem_desc:0 "Uyuşturucular zaman zaman tıbbi kullanım için gereklidir, ancak bu durum bazı kişilerin sistemi kötüye kullanıp tehlikeli sonuçlarla eğlence amaçlı kullanmasını engellemez."
 TUR_federalize_turkish_kurdistan:0 "Diyarbakır'ın Federalleşmesi"
 TUR_federalize_turkish_kurdistan_desc:0 "Ülkemizdeki Kürdistan vilayetini federalleştireceğiz; çünkü bu hem bizim hem de PKK'nın çıkarına olacaktır. Onlar ve bölge üzerinde bir ölçüde denetimi koruyacağız, ancak onlar da belli ölçüde özerklik kazanacak."
 TUR_rebuilding_kurdistan:0 "Kürdistan'ın Yeniden İnşası"
 TUR_rebuilding_kurdistan_desc:0 "\n£TUR_desctext_PKK \n\n\n\n\nUzlaşma vaadimiz, büyük ülkemizin doğusunda yaşayan Kürt nüfusun umutlarını yeniden canlandırdı. Ayrı bir yapı olsalar da yeni Kürt devleti yine de hükümetimize hesap verecek. İstikrarlı ve kendi kendine yeten bir Kürt devleti kurmak için, önce çökmeden ayakta kalabilmesi ve bize fazla bağımlı olmaması için gerekli altyapıyı ve çerçeveyi oluşturmalıyız. Bu vaadi yerine getiremezsek bölge üzerindeki denetimi tamamen kaybedebiliriz."
 TUR_the_promise_of_no_return:0 "Dönüşü Olmayan Söz"
 TUR_the_promise_of_no_return_desc:0 "Doğudaki Kürt topluluğuna daha fazla özerklik vaat ettik. Beş reformu tamamlayın ve süre dolmadan sonuçlandırın. Her reformun başlatılması süreyi uzatır. PKK üslerine yönelik askeri operasyonlar bu görevi etkilemez."
 TUR_seize_goods_from_ports:0 "Limanlardan Mal Çal"
 TUR_islamic_legacy:0 "İslami Miras"
 TUR_islamic_legacy_desc:0 "İslam'ın ulusumuzda çok uzun bir tarihi var ve bunu unutamayız. Bunu ideolojik amaçlar doğrultusunda avantajımıza kullanacağız"
 TUR_flavor_event.1.t:0 "Türk Ekonomisinin Çöküşü!"
 TUR_flavor_event.1.d:0 "Ekonomimiz çökmüş görünüyor ve şu anda onu kurtarmak için yapabileceğimiz bir şey yok. Ekonomiyi yavaş yavaş onaracak ve Türkiye'de ekonomik bir patlama başlatacak bir ekonomik plan geliştirmemiz gerekecek. Önümüzde uzun bir yol var, bu yüzden bir an önce işe koyulmalıyız."
 TUR_flavor_event.1.a:0 "Umalım ki sorunlarımızın sonuncusu budur"
 TUR_flavor_event.2.t:0 "Bingöl'de Büyük Deprem"
 TUR_flavor_event.2.d:0 "6,4 büyüklüğündeki büyük bir deprem doğudaki Bingöl şehrini salladı. 177 kişi hayatını kaybetti; bunların 84'ü bir yatılı okulun yurt binasının çökmesi sonucu öldü. Yaklaşık 8.000 ev hasar gördü ve 4 kadar okul çöktü. Bu deprem, afet yardım programımızı güçlendirmemiz gerektiğini hatırlatan bir uyarı olmalı.."
 TUR_flavor_event.2.a:0 "Ulusumuz için hüzünlü bir gün"
 TUR_flavor_event.3.t:0 "İstanbul'da Bombalı Saldırı!"
 TUR_flavor_event.3.d:0 "Yaklaşık beş gün önce sabah saat 9.30 civarında, bomba yüklü iki kamyon İstanbul'da patlatıldı. Biri Neve Şalom Sinagogu'nun yakınında, diğeri Bet İsrael Sinagogu'nda patladı. Yaklaşık 28 kişi hayatını kaybetti, 300 kişi daha yaralandı. Bugün ise İngiliz konsolosluğuna yönelik bir saldırıda 31 kişinin daha öldüğü ve 450 kişinin daha yaralandığı haberini aldık. Bu saldırılar sonucunda toplam 59 kişi hayatını kaybetti, 750 kişi daha yaralandı.."
 TUR_flavor_event.3.a:0 "Korkunç"
 TUR_flavor_event.3.b:0 "Bir miktar yardım hazırla"
 TUR_flavor_event.3.c:0 "Eldeki tüm yardımı hazırla"
 TUR_flavor_event.4.t:0 "Yeni Lira'ya Geçiş"
 TUR_flavor_event.4.d:0 "Yakın zamanda Lira'da büyük bir değişiklik yapıldı. Türkiye Büyük Millet Meclisi (TBMM), Lira'dan altı sıfırın atılmasını oyladı. Bu, yeni para biriminin 1 lirasının eski paranın 1.000.000 lirasına eşit olduğu anlamına geliyor. Ancak bazıları bu yeni değişikliğe şüpheyle yaklaşıyor ve bunun ulusa yarardan çok zarar getirebileceğini savunuyor.."
 TUR_flavor_event.4.a:0 "Hayır, bu iyi bir değişiklik"
 TUR_flavor_event.4.b:0 "Eski Köye Yeni Âdet Olmaz"
 TUR_flavor_event.5.t:0 "Hrant Dink'in Suikastı"
 TUR_flavor_event.5.d:0 "Ermeni asıllı Türkiye vatandaşı Hrant Dink birkaç gün önce İstanbul'da suikasta kurban gitti. Azınlık haklarının savunucusu ve Ermeniler ile Türkler arasında uzlaşmayı aktif biçimde arayan bir gazete editörüydü. Katilin 17 yaşında bir erkek olduğu belirlendi ve şu anda polis gözetiminde. Dink'in ölümü ülkemizdeki Ermeni toplumunda büyük öfke yarattı; bugün cenaze töreninde binlerce kişi dayanışma için bir araya geldi."
 TUR_flavor_event.5.a:0 "Trajik"
 TUR_flavor_event.5.b:0 "Trajik"
 TUR_flavor_event.6.t:0 "Göçmen Akını"
 TUR_flavor_event.6.d:0 "Son zamanlarda artan çatışmalar nedeniyle komşu ülkelerden ve yurt dışından giderek daha fazla göçmen alıyoruz. Bu durum siyasetimizi yavaş yavaş istikrarsızlaştırmaya başlıyor ve bazı kesimler daha sert politikalar için baskı yapıyor. Bu gelişmelere bir yanıt hazırlamamız gerekecek.."
 TUR_flavor_event.6.a:0 "Ne kadar çok, o kadar iyi mi?"
 TUR_flavor_event.7.t:0 "Uyuşturucu Kullanımında Artış"
 TUR_flavor_event.7.d:0 "Uyuşturucu kullanımı, özellikle düşük gelirli bölgelerde olmak üzere ülkenin bazı kesimlerinde yavaş yavaş artıyor. Bu konudaki politika ve yasalarımız dağınık olduğundan, bunun yıkıcı sonuçları olacak."
 TUR_flavor_event.7.a:0 "Yasaları gözden geçir"
 TUR_flavor_event.8.t:0 "Gazze Filosu Baskını"
 TUR_flavor_event.8.d:0 "Günün erken saatlerinde İsrailli deniz komandoları birkaç sivil gemiye operasyon düzenledi ve Mavi Marmara'daki 9 Türk vatandaşını öldürdü. Filo, İsrail'in Gazze Şeridi ablukasını kırmak amacıyla insani yardım malzemesi taşıyordu. Ancak bu, vatandaşlarımızın öldürülmesini haklı çıkarmaz ve İsrail herhangi bir tazminat ödemek ya da özür dilemek konusunda çok isteksiz davranıyor..."
 TUR_flavor_event.8.a:0 "Tazminat VE özür talep et!"
 TUR_flavor_event.8.b:0 "Elimizde daha büyük sorunlar var.."
 TUR_flavor_event.81.t:0 "Türkiye, Gazze Filosu Baskını için tazminat talep ediyor"
 TUR_flavor_event.81.d:0 "Türk hükümeti, komandolarımızın gemilere çıkıp Gazze ablukasının kırılmasını durdurmasına öfkeli. Elbette hatalı olan onlar, çünkü kendilerini defalarca uyardık, ama aldırmıyorlar."
 TUR_flavor_event.81.a:0 "Tazminatı öde, bu iş kapansın"
 TUR_flavor_event.81.b:0 "Hiçbir şey ödemeyeceğiz"
 TUR_flavor_event.811.t:0 "İsrail tazminat ödüyor"
 TUR_flavor_event.811.d:0 "İsrail, Özgür Gazze Hareketi'ne yönelik haksız baskın nedeniyle kurbanların ailelerine ve devletimize tazminat ödemeyi kabul etti."
 TUR_flavor_event.811.a:0 "Tazminat hiçbir zaman yeterli olmaz.."
 TUR_flavor_event.812.t:0 "İsrail talebimizi görmezden geliyor"
 TUR_flavor_event.812.d:0 "İsrail hükümeti taleplerimizi reddetti ve hatalı taraf biz olduğumuz için tazminat talep etmeye hakkımız olmadığını söyledi. Bu çok öfke verici bir açıklama, ama bunu unutmayacağız."
 TUR_flavor_event.812.a:0 "İnanılmaz"
 TUR_flavor_event.9.t:0 "Van'ı Deprem Vurdu"
 TUR_flavor_event.9.d:0 "Bugün erken saatlerde yaklaşık 7,1 büyüklüğünde bir deprem Van'ı salladı. Yaklaşık 11.000 bina hasar gördü veya yıkıldı; 60.000'den fazla kişi evsiz kaldı ve yaklaşık 600 kişi hayatını kaybetti. Ne yazık ki bu alışılmadık bir durum değil; doğu bölgelerimiz depremler gibi doğal afetlere yabancı değil."
 TUR_flavor_event.9.a:0 "Bir facia"
 TUR_flavor_event.9.b:0 "Afet yardımını seferber et"
 TUR_flavor_event.10.t:0 "Nevruz Protestoları"
 TUR_flavor_event.10.d:0 "Ülke genelindeki Kürtler hükümetimizin politikalarını protesto etmeye başlıyor ve bunları ihtiyaçlarına daha uygun biçimde değiştirmemizi talep ediyor. Bu protestocuların çoğu PKK yanlısı olduğundan, Türk ulusunu yıkmaktan başka bir şey istemedikleri açık."
 TUR_flavor_event.10.a:0 "Çevik kuvveti hazır beklet"
 TUR_flavor_event.10.b:0 "Protesto etmelerine izin ver"
 TUR_flavor_event.11.t:0 "ABD Büyükelçiliği Saldırıya Uğradı!"
 TUR_flavor_event.11.d:0 "İstanbul'daki ABD Büyükelçiliği, üzerine patlayıcı yelek bağlamış bir adamın saldırısına uğradı. Saldırıda şüpheli ile bir Türk güvenlik görevlisi öldü, bina da yan tarafında açılan büyük bir delikle hasar gördü. Beyaz Saray, olayın nedenine dair kendi soruşturmasını yürütmesi gerekeceğini söyledi, ancak bu olay hiç yaşanmamalıydı."
 TUR_flavor_event.11.a:0 "Onlar yürütüyorsa soruşturmaya gerek yok"
 TUR_flavor_event.11.b:0 "Kendi soruşturmamızı başlat"
 TUR_flavor_event.12.t:0 "Soma'da Maden Faciası"
 TUR_flavor_event.12.d:0 "Yaklaşık 2 gün önce Soma'daki bir kömür madeninde patlatma çalışması sonucu yangın çıktı. Yangın yaklaşık 2 gün sürdü, kurtarma ekipleri mümkün olan en kısa sürede seferber edildi, ancak yangından çıkan yoğun duman nedeniyle çalışmalar pek başarılı olamadı. Yaklaşık 301 kişinin öldüğü, 486 kişinin ise şans eseri kurtulduğu doğrulandı. Parmaklar yetersiz denetimlere ve denetimlerden sorumlu yetkililere çevrildi."
 TUR_flavor_event.12.a:0 "Trajik"
 TUR_flavor_event.12.b:0 "Denetim protokolünü baştan elden geçir"
 TUR_flavor_event.13.t:0 "Ankara'da Bombalı Saldırı"
 TUR_flavor_event.13.d:0 "Kısa süre önce Ankara Garı yakınında 2 bomba patlatıldı; 109 sivil hayatını kaybetti, 500 kişi daha yaralandı. Bombaların, çeşitli grupların Ankara'da düzenlediği «Emek, Barış ve Demokrasi» mitingini sekteye uğratmayı amaçladığı anlaşılıyor. Birkaç muhalefet partisi, saldırıyı önleyemediği için hükümetimizi suçluyor, ancak şimdilik yapabileceğimiz tek şey elimizden geldiği yerde değişiklik yapmak.."
 TUR_flavor_event.13.a:0 "Talihsiz"
 TUR_flavor_event.13.b:0 "Güvenliği sıkılaştır"
 TUR_flavor_event.14.t:0 "Müfredat Tartışması"
 TUR_flavor_event.14.d:0 "Ülke genelindeki muhafazakârlar ve muhafazakâr gruplar, evrim kavramının okul müfredatlarından çıkarılmasını talep ediyor. Bu durum ülkemizdeki laikleri endişelendirdi; hatta bazıları bunun ulusun temellerini sarstığını söylüyor."
 TUR_flavor_event.14.a:0 "Çıkarın, zaten ne kanıtları var ki?"
 TUR_flavor_event.14.b:0 "Saçma"
 TUR_flavor_event.15.t:0 "Isparta'da CASA CN-235 Düştü"
 TUR_flavor_event.15.d:0 "Bir süre önce Hava Kuvvetleri'ne ait bir CN-235, iki pilot ve bir teknisyenle eğitim görevindeydi. Bölgedeki yoğun sis nedeniyle mürettebat rotayı doğru takip edemedi ve uçak talihsiz biçimde düşerek içindekilerin tamamı hayatını kaybetti."
 TUR_flavor_event.15.a:0 "Gerçekten talihsiz"
 TUR_flavor_event.15.b:0 "Bazı değişiklikler yap"
 TUR_flavor_event.16.t:0 "Bilim İnsanları Antarktika'da Üs Kurdu"
 TUR_flavor_event.16.d:0 "Ülkemizin bilim insanlarından oluşan bir grup Antarktika'da bir üs kurdu; bu, ulusumuz için büyük bir bilimsel ilerleme!"
 TUR_flavor_event.16.a:0 "Harika"
 TUR_flavor_event.17.t:0 "Kürt Hakları"
 TUR_flavor_event.17.d:0 "Ülkemizdeki liberal unsurlar, mevcut Kürt yasaları konusunda daha fazla reform çağrısı yapıyor. Bu yasaların gevşetilmesini, Kürt partilerinin popülerlik kazanmasının kolaylaştırılmasını istiyorlar. Ancak daha muhafazakâr gruplar istikrar için mevcut durumun korunması gerektiğini söylüyor."
 TUR_flavor_event.17.a:0 "Reformlar tehlikelidir"
 TUR_flavor_event.17.b:0 "Reformlar gereklidir"
 TUR_flavor_event.18.t:0 "Aile Değerlerinde Değişim"
 TUR_flavor_event.18.d:0 "Yakın zamanda kadınların aile reisi olmasına izin veren yeni bir yasa kabul edildi. Bu değişiklik ülkedeki pek çok liberali memnun etse de muhafazakârları kızdırdı. Bu yasayı değiştirmek için, iyiye ya da kötüye, tek seferlik bir şansımız var."
 TUR_flavor_event.18.a:0 "Geleneklerimizi korumalıyız"
 TUR_flavor_event.18.b:0 "Değişim şart"
 TUR_flavor_event.19.t:0 "Ermenistan ile İlişkilerin Normalleşmesi"
 TUR_flavor_event.19.d:0 "Sonsuza dek sürecekmiş gibi görünen bir sürecin ardından Ermeniler, iki ülke arasındaki ilişkileri normalleştirmeye açık hale geliyor. Hrant Dink suikastının ardından Ermenistan ile ilişkilerimiz sert biçimde kötüleşti ve iki ulus arasında gereksiz bir husumet doğdu. Ancak son zamanlarda geçmişi geride bırakmaya başladılar ve ilişkileri yeniden normalleştirmeye açıklar.."
 TUR_flavor_event.19.a:0 "İlişkileri normalleştirmeye açık olabilirler, ama ben değilim"
 TUR_flavor_event.19.b:0 "Güzel haber"
 TUR_flavor_event.20.t:0 "Hazar Ötesi Gaz Boru Hattı"
 TUR_flavor_event.20.d:0 "Amerikalıların ikna çabalarının ardından Türkmenistan, Türkmenbaşı'ndan Türkiye'nin Adana kentine uzanan bir deniz altı petrol boru hattının inşasına izin vermeyi kabul etti. Ancak hükümetteki birçok kişi kuşkulu; mali yükün sonunda bize kalacağını ve bunun ekonomimizi riske atabileceğini savunuyorlar.."
 TUR_flavor_event.20.a:0 "Harika bir fırsat gibi görünüyor"
 TUR_flavor_event.20.b:0 "Evet.. Hayır"
 TUR_pkk.214.t:0 "Van'da Operasyonel Başarı"
 TUR_pkk.214.d:0 "On yıllardır süren çatışmaların ardından, Büyük Van bölgesinde örgütlü Kürt direnişi sona erdi. Türk devletinin şanlı bayrağı eskisinden de yükseklerde dalgalanıyor; ilde başlayan yeni dönem, orada yaşayan tüm halklar için umutları yeniden canlandırdı."
 TUR_pkk.214.a:0 "Nihayet.."
 TUR_pkk.215.t:0 "Orta Fırat'ta Operasyonel Başarı"
 TUR_pkk.215.d:0 "On yıllardır süren çatışmaların ardından, Büyük Orta Fırat bölgesinde örgütlü Kürt direnişi sona erdi. Türk devletinin şanlı bayrağı eskisinden de yükseklerde dalgalanıyor; ilde başlayan yeni dönem, orada yaşayan tüm halklar için umutları yeniden canlandırdı."
 TUR_pkk.215.a:0 "Nihayet.."
 TUR_pkk.216.t:0 "Diyarbakır'da Operasyonel Başarı"
 TUR_pkk.216.d:0 "On yıllardır süren çatışmaların ardından, Büyük Diyarbakır bölgesinde örgütlü Kürt direnişi sona erdi. Türk devletinin şanlı bayrağı eskisinden de yükseklerde dalgalanıyor; ilde başlayan yeni dönem, orada yaşayan tüm halklar için umutları yeniden canlandırdı."
 TUR_pkk.216.a:0 "Nihayet.."
 TUR_pkk.217.t:0 "[TUR.GetName], PKK'ya Karşı Zafer İlan Etti"
 TUR_pkk.217.d:0 "[TUR.GetAdjective] hükümeti yakın zamanda yayımladığı bir açıklamada, tüm büyük PKK üslerinin, hücrelerinin ve sığınaklarının [TUR.GetAdjective] Silahlı Kuvvetleri (TSK) tarafından temizlendiğini duyurdu. Bu açıklama, [TUR.GetName] dahil olmak üzere Orta Doğu'daki Kürt ayrılıkçıları endişelendirdi. PKK, 1970'lerdeki kuruluşundan itibaren on yıllar boyunca [TUR.GetName] içinde faaliyet gösterdi. Kürt grup başlangıçta Türkiye'nin doğusunda bağımsız bir devlet kurmayı hedefliyordu, ancak hareket kısa sürede tam bağımsızlık yerine özerklik talebine dönüştü. [TUR.GetAdjective] hükümeti bu baskıya karşı dirençli davrandı ve artık harekete karşı zafer ilan edebilecek noktaya ulaştı."
 TUR_pkk.217.a:0 "İlginç"
 TUR_pkk.600.t:0 "Vaadimizi Yerine Getirememenin Yıkıcı Sonuçları"
 TUR_pkk.600.d:0 "Boş vaatlerimiz sonunda başımıza bela oldu. Devletimizin doğusunda yaşayan Kürtler, Kürt nüfusun çoğunlukta olduğu bölgelerin denetimini ele geçirdi. Bu topraklar üzerinde artık resmen hâkim değiliz; içine düştüğümüz bürokratik süreç nedeniyle hükümetimiz anında karar alma konusunda fiilen güçsüz kalmış durumda."
 TUR_pkk.600.a:0 "Olamaz"
 TUR_pkk.601.t:0 "Kürt Özerklik Referandumu Kabul Edildi"
 TUR_pkk.601.d:0 "Kürt bağımsızlık referandumu, Kürtlerin ezici çoğunluğunun özerkleşme lehine oy kullanmasıyla kabul edildi. Bu referandumla Kürdistan Halk Cumhuriyeti, [TUR.GetName] bünyesinde bir Eyalet olacak. Kürdistan İşçi Partisi eyaletteki yönetici otorite olacak; ordu bulundurabilecek, bölgenin yasalarını ve siyasetini yönetebilecek ve seçimleri uygun gördüğü şekilde yapabilecek. Büyük sanayi ve ekonomi sektörlerinin denetimini elimizde tutmaya devam edeceğiz, ancak kârların bir kısmı yine de Kürt devletine gidecek."
 TUR_pkk.601.a:0 "Tamam"
 TurkeyFocusEvents.191.t:0 "Suriye tampon bölgeye izin veriyor"
 TurkeyFocusEvents.191.d:0 "Suriye hükümeti baskıya boyun eğdi ve ulusal sınırlarımız arasında bir tampon bölge oluşturmamıza izin verdi."
 TurkeyFocusEvents.191.a:0 "İyi"
 TurkeyFocusEvents.192.t:0 "Suriye tampon bölgeye izin vermiyor"
 TurkeyFocusEvents.192.d:0 "Suriye hükümeti, devletlerimiz arasında bir tampon bölge kurma talebimizi reddetti."
 TurkeyFocusEvents.192.a:0 "Peki öyleyse.."
 TurkeyFocusEvents.36.t:0 "Galler ve İskoçya Mafyaları Kendi Devletlerini Kuruyor!"
 TurkeyFocusEvents.36.d:0 "Anadolu Sendikası'nın İskoç ve Galli mafyaları tam burnumuzun dibinde finanse edip eğittiği anlaşılıyor. Bunu zamanında fark edip durduramadık, bu yüzden şimdi bir karar vermemiz gerekecek.."
 TurkeyFocusEvents.36.a:0 "Krallığımız BİRLEŞİK bir krallıktır!"
 TurkeyFocusEvents.36.b:0 "Buna değmez"
 TurkeyFocusEvents.37.t:0 "Anadolu Sendikası Bizi Avustralya Konusunda Uyarıyor"
 TurkeyFocusEvents.37.d:0 "Anadolu Sendikası bizi Avustralyalıların yaklaşan bir saldırısı konusunda uyarıyor. Elbette bir mafya devleti olduklarını düşünürsek bunların hepsi yalan olabilir. Ama yalan söylemiyor olma ihtimalleri de var.."
 TurkeyFocusEvents.37.a:0 "Yalan söylüyor olamazlar!"
 TurkeyFocusEvents.37.b:0 "Hayır.. Açıkça yalan söylüyorlar"
 TurkeyFocusEvents.53.t:0 "V. Osman Vefat Etti"
 TurkeyFocusEvents.53.d:0 "İnsanlar V. Osman'ın vefat ettiğini öğrendikçe bugün Konstantiniyye'de kötü haber yayıldı. Ölümü halkı büyük bir üzüntüye boğsa da III. Beyazıt onun mirasını sürdürecektir."
 TurkeyFocusEvents.53.a:0 "Taht değişiyor"
 TurkeyFocusEvents.54.t:0 "III. Beyazıt Vefat Etti"
 TurkeyFocusEvents.54.d:0 "Ne yazık ki bugün III. Beyazıt'ın vefat ettiğini öğrendik. İnsanlar sokaklarda yas tutuyor ve ulusu hüzün sardı. Ancak tüm umutlar tükenmiş değil; ulusal yas döneminin ardından kısa süre içinde I. Dündar tahta çıkacak ve saltanatı başlayacak."
 TurkeyFocusEvents.54.a:0 "Taht bir kez daha değişiyor.."
 Turkish_mafia.1200.t:0 "PKK İsyanı Ortadan Kaldırıldı"
 Turkish_mafia.1200.d:0 "Güvenlik güçlerimiz Kürt bölgelerindeki operasyonları tamamladı. PKK'nın Türk topraklarını tehdit etme kapasitesi kırıldı ve düzen yeniden sağlanıyor."
 Turkish_mafia.1200.a:0 "Buradaki işimiz bitti."
 Turkish_parties.10.t:0 "Bunu yalnızca yapay zekâ görmeli"
 Turkish_parties.10.d:0 "Yalnızca Yapay Zekâ"
 Turkish_parties.10.a:0 "Bunu görüyorsanız lütfen bize bildirin"
 Turkish_parties.11.t:0 "Hak ve Eşitlik Partisi"
 Turkish_parties.11.d:0 "Güneydoğudaki komutanlığıyla ünlenen ve destekçileri tarafından «Efsane Komutan» olarak anılan emekli general Osman Pamukoğlu, Hak ve Eşitlik Partisi'ni (HEPAR) kurdu. Parti, katı laik Kemalizmi Kürt meselesinde sert bir çizgiyle birleştiriyor ve kendini yerleşik partilerin lekelemediği milliyetçi bir alternatif olarak sunuyor."
 Turkish_parties.11.a:0 "Arenaya yeni bir güç giriyor"
 TUR_bulent_ecevit_desc:0 "Bülent Ecevit, 1950'lerden beri Türk siyasi sahnesinde etkin olan kıdemli bir siyasetçidir. CHP'de liderliğe yükselen Ecevit, 1972'de İsmet İnönü'nün ardından Başbakan oldu. Hükümeti 1974'te Kıbrıs'a müdahale emri verdi ve bu nedenle «Kıbrıs Fatihi» lakabını kazandı. 1980 darbesinin ardından hapsedilen ve siyasetten yasaklanan Ecevit, 1987'de eşi Rahşan'dan DSP genel başkanlığını devralarak siyasete geri döndü. Nihayet 1999'da, PKK lideri Abdullah Öcalan'ın yakalanmasıyla partisinin popülaritesi fırlayınca yeniden Türkiye Başbakanı oldu.\n\nEcevit aynı zamanda tutkulu bir şair ve yazardır; bu iki alanda da pek çok kitap yazmış ve birçok şiiri Türkçeye çevirmiştir.\n\nEcevit üniversite eğitimini hiçbir zaman tamamlamadığından Cumhurbaşkanı adayı olması mümkün değildir."
 TUR_afrin:0 "Suriye'de Kürt Karşıtı Operasyonları Duyur"
 TUR_afrin_desc:0 "Kürt teröristlerin birçok adı var, ama bu aynı ideallerin peşinde olmadıkları anlamına gelmez. PKK her zaman Türkiye için bir tehdit oldu ve YPG, PYD, SDG gibi müttefikleriyle birlikte yok edilene kadar tehdit olmaya devam edecek. Her şey Afrin'le başlıyor; birlikleri topla."
 TUR_afrin2:0 "Zeytin Dalı Harekâtı'nı Başlat"
 TUR_afrin2_desc:0 "Kürtler başarısızlıklarını ve yenilgilerini kabul etmeyi öğrenmezse Türkiye'ye ve halkına saldırmaya devam edecekler; çizgiyi çekmemiz gereken yer burası. Zeytin Dalı, YPG'nin elindeki Afrin'den kaynaklanan Kürt terör saldırılarına son verecek. Harekât, Kürt teröristleri yan zarar vermeden kökünden söküp yok etmeyi hedefliyor; dikkatle ilerlemeliyiz."
 TUR_afrin_d:0 "Türk Kuvvetleri Afrin'i Tehdit Ediyor"
 TUR_afrin_d_desc:0 "Türklerin Kürt halkına yönelik saldırısı sürüyor. Afrin'e istilanın tehdidi gerçek; Türk cumhurbaşkanı [their_country.GetLeader], şaşırtıcı olmayan biçimde bizi PKK ile aynı safta terörist ilan etti ve Türk topraklarına saçma bir terör saldırısı düzenlememize fırsat vermeden bizi boğmakla tehdit etti. Bu bizim yöntemimiz değil, ama derhal bir saldırıya hazırlanmalıyız!"
 TUR_afrin_d2:0 "Türk Kuvvetleri İlerlemeye Devam Ediyor"
 TUR_afrin_d2_desc:0 "Buna «Zeytin Dalı Harekâtı» diyorlar; zeytin dalının barış teklifi anlamına geldiği söylenir, ne komik. Türkler barışın anlamını bilmiyor ve Kürt halkına yönelik baskı kampanyaları yanlış hedefe karşı sürüyor. Madem bu savaşı sürdürmek istiyorlar, biz de kendimizi savunmaya devam edeceğiz."
