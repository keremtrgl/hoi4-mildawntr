 internal_preparation_1_desc:0 "En hızlı ve en ucuz seçenek. Bunu seçersek asıl taarruzun başarı oranı %40 olacak. Maliyet verimliliği açısından bu seçenek daha iyi.\n\n§RTek bir operasyon türü için birden fazla hazırlık yapamayız!§!"
