 external_security:0 "Sınır Ötesi Operasyonlar"
 external_security_desc:0 "PKK yalnızca sınırlarımızın içinde var olmuyor; üyelerinin önemli bir kısmının Kuzey Irak'ta da üsleri var. Bunun nedeni aynı engebeli araziden yararlanmak, askeri gücümüze karşı biraz daha güvende olmak, kaçakçılığı kontrol etmek ve eleman devşirmek. Yabancı güçlerden suçlama gelebilecek olsa da bu mevzilere de saldırmamız gerekiyor.\n\nSınır ötesi operasyonlar ile iç operasyonları aynı anda yürütemeyiz."
