 investment_propaganda_2:0 "İşsizlikle Mücadele"
 investment_propaganda_2_desc:0 "Aç insanlar suça yönelmeye eğilimlidir. Önceki hükümetler doğu bölgelerini görmezden geldi ve Kürtlerin ezilmiş hissetmesine yol açan sorunlara aldırmadı. Bizden öncekilerden daha iyi olmalıyız."
