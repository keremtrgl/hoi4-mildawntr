 internal_security:0 "İç Operasyonlar"
 internal_security_desc:0 "Ülkemizin doğusu engebeli bir araziye sahiptir; çok sayıda boşaltılmış köy, mağaralarla dolu kale gibi doğal vadiler ve kimsenin yaşamadığı dağ geçitleri barındırır. Bu özellikler isyancılar için çok işe yarar ve PKK bunlardan yararlanıyor. Gücünü azaltmak ve eleman devşirme çabalarını engellemek için derme çatma üslerine sürekli saldırıp yıkmalıyız.\n\nSınır ötesi operasyonlar ile iç operasyonları aynı anda yürütemeyiz."
