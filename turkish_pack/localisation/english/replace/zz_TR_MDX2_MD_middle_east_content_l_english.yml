 GCC_blockade:0 "§Y[FROM.GetFlag][FROM.GetNameDef]§! Ülkesine Karşı §RAbluka Başlat§!"
 GCC_blockade_desc:0 "[FROM.GetAdjective] yönetimi uzun süredir alternatif dış politikasını sergileyerek hem ulusal çıkarlarımızı hem de KİK'in birliğini baltalıyor. Ekonomik baskı uygulayarak bu sapkınlığa son vermeliyiz."
 GCC_drop_the_blockade:0 "§Y[FROM.GetFlag][FROM.GetNameDef]§! Ülkesine Karşı §GAblukayı Kaldır§!"
 GCC_drop_the_blockade_desc:0 "§Y[FROM.GetFlag][FROM.GetNameDef]§! hükümetinin yakın zamanda baskımıza boyun eğmesi pek olası değil. İlişkileri onarmak için ablukayı sona erdirmek en iyisi olabilir."
 GCC_accept_blockade_demands:0 "Abluka Uygulayanların §GTaleplerini Kabul Et§!"
 GCC_accept_blockade_demands_desc:0 "Abluka uygulayanların bize karşı ablukayı yakın zamanda hafifletmesi pek olası değil. Halkımızın çektiği acılara son vermek için taleplerini kabul etmeyi düşünmeliyiz."
 GCC_support_gcc_membership:0 "§Y[FROM.GetFlag][FROM.GetAdjective]§! KİK Üyeliğini §GDestekle§!"
 GCC_support_gcc_membership_desc:0 "[FROM.GetNameDef] ülkesinin KİK'e katılması çıkarımıza olabilir. Ancak bir yeni üyeyi aramıza kabul etmenin olası sonuçlarını dikkatle tartmalıyız. Bir ülkenin siyasi ve ekonomik durumu mevcut KİK üyelerinden ne kadar farklıysa, katılımı KİK birliğine o kadar fazla zarar verecektir."
 GCC_pressure_countries_to_support:0 "[FROM.GetAdjective] Üyeliğini Desteklemeleri İçin §GDevletlere Baskı Yap§!"
 GCC_pressure_countries_to_support_desc:0 "Diğer KİK üyesi devletlerdeki nüfuzumuz ne kadar yüksekse, [FROM.GetNameDef] ülkesinin KİK üyeliği adaylığını desteklemeleri için uyguladığımız baskıya o kadar açık olurlar."
 GCC_show_supporters:0 "Üyeliğimizi Destekleyen §YÜlkeleri Göster§!"
 GCC_show_supporters_desc:0 "KİK'e katılmak, KİK üyeliğinin sunduğu siyasi ve ekonomik avantajlardan yararlanmamızı sağlayacaktır. Mevcut KİK üyelerinin üyelik başvurumuzu destekleme olasılığı; istikrarımız ile hükümet biçimimizin, dış politikamızın ve baskın inancımızın mevcut KİK üyesi devletlerinkini yansıtıp yansıtmaması gibi çeşitli etkenlere bağlıdır."
 GCC_begin_accession_process:0 "KİK Katılım Sürecini §GBaşlat§!"
 GCC_begin_accession_process_desc:0 "KİK oybirliğiyle karar aldığından, KİK katılım sürecini başlatmak üzere resmen davet edilmek ve buna izin verilmesi için mevcut her KİK üyesinin desteğini almamız gerekir."
 GCC_complete_accession_plan:0 "KİK Katılım Planını §GTamamla§!"
 GCC_complete_accession_plan_desc:0 "Mevcut tüm KİK üyesi devletlerin desteğini almayı başarmış olsak da, tam KİK üyeliği hedefimize henüz ulaşılmış değil. Üyelik statüsü verilebilmesi için önce ülkemizi KİK şartlarıyla uyumlu hâle getirecek bir dizi siyasi ve ekonomik değişikliği tamamlamamız gerekir."
 every_gcc_member_supports_tt:0 "Her KİK üyesi üyeliğimizi destekliyor"
 GCC_support_gcc_membership_tt:0 "EĞER her KİK üyesi devleti [FROM.GetAdjective] üyeliğini destekliyorsa, [FROM.GetNameDef] ülkesi katılım sürecini başlatabilecek.\n§R[FROM.GetNameDef] ülkesi üye olursa KİK Birliği, [FROM.GetNameDef] ülkesinin siyasi durumuna bağlı olarak %25, %20, %10 ya da %5 azalacaktır.§!"
 GCC_support_gcc_membership1_tt:0 "EĞER her KİK üyesi devleti üyeliğini destekliyorsa, [pressured_to_accept] katılım sürecini başlatabilecek.\n§R[pressured_to_accept] üye olursa KİK Birliği, [pressured_to_accept] ülkesinin siyasi durumuna bağlı olarak %25, %20, %10 ya da %5 azalacaktır.§!"
 not_pro_monarchy_tt:0 "İktidar partisi monarşi yanlısı değil"
 gcc_focus_completed_tt:0 "Baskın KİK üyesi tarafından tamamlandı"
 subversive_activities:0 "Yıkıcı Faaliyetler"
 subversive_activities_desc:0 "Açık çatışmanın ulusal çıkarlarımızı gütmek için daha az uygulanabilir bir seçenek hâline geldiği bir çağda, nüfuzumuzu yansıtmak ve düşmanlarımızı zayıflatmak için daha örtülü yollara başvurmak zorundayız."
 send_support_to_the_syrian_opposition:0 "Suriye Muhalefetine Hafif Silah Gönder"
 send_support_to_the_syrian_opposition_desc:0 "Esad karşıtı devrimciler, mücadelelerinde yardımımızdan kuşkusuz yararlanacaktır."
 send_support_to_hamas:0 "Hamas'a Hafif Silah Gönder"
 send_support_to_hamas_desc:0 "Filistin Müslüman Kardeşleri'nden radikal bir kopuş grubu olarak ortaya çıkan Hamas, o zamandan beri bir Filistin devletinin kurulması için baskı yapan en etkin gruplardan biri hâline gelmiştir. Daha köklü olan Fetih'in Oslo Anlaşmaları'nın başarısızlığı nedeniyle meşruiyet ve ılımlılık kaybı yaşadığı göz önüne alındığında, Hamas Filistin siyasetindeki en etkili ve en radikal İsrail karşıtı güçtür."
 send_support_to_hezbollah:0 "Hizbullah'a Hafif Silah Gönder"
 send_support_to_hezbollah_desc:0 "İran destekli militan örgüt Hizbullah, İsrail Savunma Kuvvetleri'ne karşı bir ölçüde başarı elde eden az sayıdaki aktörden biri olmuştur. Yalnızca İsrail devletini zayıflatmak için güçlü bir araç değil, aynı zamanda Lübnan siyasetinde Şii mezhepçiliğini güçlendirmenin etkili bir yoludur."
 send_support_to_pro_government_forces:0 "Suriyeli Milislere Hafif Silah Gönder"
 send_support_to_pro_government_forces_desc:0 "Suriye Arap Ordusu laik bir kuruluş olsa da, İran'ın oluşumuna yardım ettiği ve daha açık biçimde mezhepçi bir gündeme sahip birçok Şii milis vardır. Bu milisleri desteklemek, tarihsel olarak laik olan bir cumhuriyette Şii davasına yardımcı olacaktır."
 send_support_to_pmu:0 "Halk Seferberlik Birlikleri'ne Hafif Silah Gönder"
 send_support_to_pmu_desc:0 "Irak Şiilerini El Kaide gibi aşırı Sünni güçlerden korumak için ortaya çıkan Şii milislere İran İslam Cumhuriyeti önemli destek vermiştir. Onları desteklemek, Irak siyaseti üzerindeki İran'ın ve dolayısıyla Şii nüfuzunu artırmaya yardımcı olacaktır."
 send_support_to_arabs:0 "Arap İsyancılara Hafif Silah Gönder"
 send_support_to_arabs_desc:0 "Ahvaz'ın Kurtuluşu İçin Arap Mücadele Hareketi, yıllardır İran İslam Cumhuriyeti'ne karşı bir gerilla kampanyası yürütmektedir. Bu Arapların çoğunluğu Şii olsa da, İslam Cumhuriyeti'nin Fars egemenliğindeki rejimi biçiminde onlarla ortak bir düşmanımız vardır."
 send_support_to_balochis:0 "Beluç İsyancılara Hafif Silah Gönder"
 send_support_to_balochis_desc:0 "İran'ın Sistan ve Beluçistan eyaletindeki Selefi hareketler, yıllardır halklarının Şii Fars rejimi tarafından ezilmesine karşı savaşmaktadır. Onların davasına destek vermeliyiz; çünkü yakında iyiliğe karşılık verme fırsatı bulacaklar."
 send_support_to_gna:0 "Libya Ulusal Mutabakat Hükümeti'ne Silah Gönder"
 send_support_to_gna_desc:0 "Ulusal Mutabakat Hükümeti, uluslararası alanda Libya'nın meşru hükümeti olarak tanınmaktadır. Buna rağmen itaatsiz isyancılar, güçlü İslamcı karşıtı devletlerin desteğiyle otoritesine askeri olarak meydan okumayı sürdürmektedir. Ulusal Mutabakat Hükümeti ise uluslararası toplum tarafından büyük oranda terk edilmiştir. Bu dengesizliği gidermeye yardımcı olarak kayda değer kaynaklarımızı Libya'da kullanmalıyız."
 send_support_to_gnc:0 "[GNC.GetNameDef] Güçlerine Silah Gönder"
 send_support_to_gnc_desc:0 "[GNC.GetNameDef] Libya halkının meşru temsilcisidir ve bu nedenle acımasız, otoriter düşmanlarına karşı tam desteğimizi almalıdır."
 send_support_to_hor:0 "Libya Ulusal Ordusu'na Silah Gönder"
 send_support_to_hor_desc:0 "Libya'nın kaotik savaş alanı, bir zehir olan Müslüman Kardeşler'le bağlantılı İslamcı güçler için bir üreme alanı hâline gelmiştir. Bu savaştan yıpranmış başarısız devlete istikrar ve güvenlik getirebilecek tek güçten yana ağırlığımızı koymalıyız."
