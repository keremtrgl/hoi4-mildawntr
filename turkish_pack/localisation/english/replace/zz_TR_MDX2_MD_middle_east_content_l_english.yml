 GCC_offer_joint_exercises_specific:0 "Ortak KİK Tatbikatlarına Ev Sahipliği §YTeklif Et§!"
 GCC_offer_joint_exercises_specific_desc:0 "KİK üyesi devletler arasında ortak askeri tatbikatlar düzenlemek, silahlı kuvvetlerimizi güçlendirecek ve ordularımızın iş birliği yapma yeteneğini artıracak, böylece KİK birliğini yükseltecektir."
 GCC_start_joint_exercises_specific:0 "Ortak KİK Tatbikatlarını §YBaşlat§!"
