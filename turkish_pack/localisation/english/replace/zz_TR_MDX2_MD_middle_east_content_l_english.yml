 arab_spring_encourage_supporters:0 "Destekçileri Teşvik Et"
 arab_spring_encourage_supporters_desc:0 "Muhalefetin mitingleri, hükümetimizin [ROOT.GetAdjective] halkı arasında desteğe sahip olmadığı yönünde yanlış bir izlenim yaratıyor. Gerçek bundan çok daha farklı. Sadık [ROOT.GetAdjective] vatandaşlarını hükümetimizi desteklemek için sokaklara dökülmeye teşvik etmek amacıyla siyasi irademizi harekete geçirmeliyiz."
 arab_spring_request_crackdown:0 "Yarımada Kalkanı'ndan Bastırma Talep Et"
 arab_spring_request_crackdown_desc:0 "Körfez İşbirliği Konseyi üyesi olarak, altı KİK devletinin birliklerinden oluşan ortak askeri birlik Yarımada Kalkanı Gücü'ne erişimimiz var. Bu güçlerin konuşlandırılması zorlanan güvenlik servislerimiz üzerindeki baskıyı hafifletse de iç düzeni korumak için yabancı askeri müdahaleye giderek daha bağımlı hale gelmemize yol açacaktır."
 arab_spring_deploy_the_military:0 "Ordu Konuşlandır"
 arab_spring_deploy_the_military_desc:0 "İç güvenlik güçlerimiz huzursuzluğun boyutu karşısında bunalmış durumda. Ordunun konuşlandırılması düzeni yeniden sağlamaya yardımcı olacaktır, ancak bu sert yaklaşım gerilimleri daha da körükleyebilir ve ordudan kopuşlar riskini doğurabilir."
 arab_spring_return_to_barracks:0 "Birlikleri Kışlalarına Döndür"
 arab_spring_return_to_barracks_desc:0 "Ordunun konuşlandırılması çözdüğünden daha fazla sorun yarattı. Birliklerimizin geri çekilme zamanı geldi."
 arab_spring_return_to_barracks_tt:0 "§GAyaklanmalar ve ölümcül çatışmalar artık yaşanmayacak.§!"
 arab_spring_reshuffle_government:0 "Hükümeti Yeniden Düzenle"
 arab_spring_reshuffle_government_desc:0 "Hükümetimizdeki bazı bakanlar geçmiş başarısızlıklarımızla diğerlerinden daha fazla özdeşleşmiş durumda. Özellikle gözden düşmüş bu isimlerden kurtulmak, geride kalanların konumunu güvence altına almaya yardımcı olabilir."
 arab_spring_amend_the_constitution:0 "Anayasayı Değiştir"
 arab_spring_amend_the_constitution_desc:0 "Muhalefet, mevcut [ROOT.GetAdjective] anayasasını hükümete çok fazla yetki verdiği gerekçesiyle eleştirdi. Yetkilerimiz üzerindeki anayasal sınırları artırmak, hesap verebilir yönetime bağlılığımızı göstermeye yardımcı olacaktır."
 constitutional_reform:0 "Anayasa Reformu"
 arab_spring_protests_1:0 "Protestoları Durdur"
 arab_spring_protests_1_desc:0 "Mevcut açmazdan ancak havuç ve sopa yöntemini birlikte kullanarak çıkabiliriz. Durumu kontrol altında tutamazsak ya iktidarı bırakmak ya da onu korumak için aşırı önlemlere başvurmak zorunda kalacağız."
 arab_spring_protests_2:0 "Protestoları Durdur"
 arab_spring_protests_2_desc:0 "Mevcut açmazdan ancak havuç ve sopa yöntemini birlikte kullanarak çıkabiliriz. Durumu kontrol altında tutamazsak ya iktidarı bırakmak ya da onu korumak için aşırı önlemlere başvurmak zorunda kalacağız."
 arab_spring_ended_tt:0 "Protesto Gücü 200'e düşürülerek protestolar yeterince zayıflatıldı (Mevcut Protesto Gücü: [?arab_spring|0Y])\n"
 mutiny_possibility_tt:0 "§ROrdu birlikleri isyan edebilir.§!\n"
 clashes_fatalities_tt:0 "§RÇatışmalar can kayıplarına yol açabilir.§!\n"
 change_arab_spring_strength_tt:0 "Arap Baharı Protestolarının Gücünü [?temp_strength|-0] kadar değiştirir. (Mevcut Protesto Gücü: [?arab_spring|0Y])\n"
 arab_spring.0.t:0 "Kitlesel Protestolar Patlak Verdi"
 arab_spring.0.d:0 "Ülke genelinde kitlesel protestolar patlak verdi ve hükümetin istifası talep ediliyor. Polis protestolara göz yaşartıcı gaz ve lastik mermiyle karşılık verdi; ancak [ROOT.GetLeader] göstericilerin taleplerini ele almaya mı yoksa otoritesine yönelik bu meydan okumayı ezmeye mi çalışacak, henüz pek belli değil."
 arab_spring.0.a:0 "Bu krizi hafifletmeliyiz!"
 arab_spring.1.t:0 "[FROM.GetNameDef] Ülkesinde Degisim Talep Eden Protestolar Patlak Verdi"
 arab_spring.1.d:0 "[FROM.GetNameDef] ülkesinde yolsuzluk ve insan hakları ihlalleri nedeniyle yıllardır süren memnuniyetsizlik, ülke genelinde kitlesel protestolar biçiminde nihayet taştı. Bazı göstericiler yalnızca köklü bir sistemsel reform istiyor gibi görünse de büyük kent merkezlerindeki kalabalıkların «halk rejimin düşmesini istiyor» sloganını attığı bildiriliyor; bu da bazı kesimlerin siyasi düzenin tümden reddedilmesini savunduğuna işaret ediyor.\n\nPolis protestolara göz yaşartıcı gaz ve lastik mermiyle karşılık verdi; ancak [FROM.GetLeader] göstericilerin taleplerini ele almaya mı yoksa otoritesine yönelik bu meydan okumayı ezmeye mi çalışacak, henüz pek belli değil."
 arab_spring.1.d_western:0 "[FROM.GetNameDef] ülkesinde yolsuzluk ve insan hakları ihlalleri nedeniyle yıllardır süren memnuniyetsizlik, ülke genelinde kitlesel protestolar biçiminde nihayet taştı. Bazı göstericiler yalnızca köklü bir sistemsel reform istiyor gibi görünse de [FROM.Capital.GetName] kentindeki kalabalıkların «halk rejimin düşmesini istiyor» sloganını attığı bildiriliyor; bu da bazı kesimlerin siyasi düzenin tümden reddedilmesini savunduğuna işaret ediyor.\n\nPolis protestolara göz yaşartıcı gaz ve lastik mermiyle karşılık verdi; ancak [FROM.GetLeader] göstericilerin taleplerini ele almaya mı yoksa otoritesine yönelik bu meydan okumayı ezmeye mi çalışacak, henüz pek belli değil. [FROM.GetLeader] liderliğindeki yönetimin Batılı destekçilerinin bu eşi görülmemiş gelişmelere nasıl tepki vereceği de merak konusu."
 arab_spring.1.a:0 "Bu krizi hafifletmeliyiz!"
 arab_spring.1.b:0 "Ortadoğu'da değişim rüzgârları esiyor..."
 arab_spring.3.t:0 "Tehdit Altindaki Müttefik"
 arab_spring.3.d:0 "[FROM.GetNameDef] ülkesinde [FROM.GetLeader] önderliğindeki rejim, yıllardır stratejik açıdan önemli bir bölgede güvenilir bir [ROOT.GetAdjective] ortağıydı. Eski müttefikimiz şimdi dış güçlerden değil, kendi halkından kaynaklanan bir tehdit altında. [FROM.GetAdjective] hükümetine destek açıklayıp açıklamayacağımıza ya da [FROM.GetNameDef] ülkesindeki demokrasi yanlısı güçleri kınamayı reddedip reddetmeyeceğimize karar vermeliyiz."
 arab_spring.3.a:0 "Müttefiklerimizin yanındayız!"
 arab_spring.3.b:0 "Demokratik reformun önünde durmayı reddediyoruz!"
 arab_spring.4.t:0 "Müttefikimiz Bizi Destekliyor!"
 arab_spring.4.d:0 "[ROOT.GetNameDef] ülkesinin uzun süredir dostu olan [FROM.GetAdjective] hükümeti, bu belirsiz dönemde meşru [ROOT.GetAdjective] hükümetine destek verdiğini açıkladı."
 arab_spring.4.a:0 "Desteklerini memnuniyetle karşılıyoruz!"
 arab_spring.5.t:0 "Müttefikimiz Bizi Terk Etti..."
 arab_spring.5.d:0 "[ROOT.GetNameDef] ülkesinin uzun süredir dostu olan [FROM.GetAdjective] hükümeti, bu belirsiz dönemde meşru [ROOT.GetAdjective] hükümetine destek vermeyi reddetti ve bunun yerine bizi halkımızın sözde demokratik özlemlerine saygı göstermeye çağırdı. Hükümetimizin bu şekilde terk edilmesi, otoritemizi baltalamak isteyen isyancıları cesaretlendirdi."
 arab_spring.5.a:0 "İhtiyacımız olduğu anda ihanete uğradık..."
 arab_spring.6.t:0 "Rejim Destekçileri Miting Düzenledi"
 arab_spring.6.d1:0 "Meşru [ROOT.GetAdjective] hükümetinin sadık destekçileri, hain muhalefete açıkça meydan okuyarak sokakları dolduruyor. Hiçbir şekilde mali teşviklerle kolaylaştırılmamış olan bu destek gösterisi, iktidarımızın sürmesine yönelik halk desteğini güçlendirecek. Hükümet yanlıları ve karşıtları arasında gerilim sürse de yaygın şiddet henüz yaşanmadı."
 arab_spring.6.d2:0 "Meşru [ROOT.GetAdjective] hükümetinin sadık destekçileri, hain muhalefete açıkça meydan okuyarak sokakları dolduruyor. Hiçbir şekilde mali teşviklerle kolaylaştırılmamış olan bu destek gösterisi, iktidarımızın sürmesine yönelik halk desteğini güçlendirecek. Hükümetimizin destekçileri ve karşıtları arasındaki çatışmalar şiddete dönüştü ve çok sayıda yaralanma, hatta ölümle sonuçlandı."
 arab_spring.6.a:0 "Halkın sevgilisi: [ROOT.GetLeader]!"
 arab_spring.6.b:0 "Gerilim tırmanıyor..."
 arab_spring.7.t:0 "Ordu Birlikleri Isyan Etti, Muhalefetin Yaninda Saf Tuttu"
 arab_spring.7.d:0 "Ordu saflarında hükümetimize yönelik hoşnutsuzluk, muhalefete geçişlere yol açtı. Bu firarlar, yönetimimizi protesto edenleri cesaretlendirdi ve kendi destekçilerimizin moralini bozdu. Danışmanlarımız, bir iç savaş çıkması hâlinde bu firarilerin silahlarını eski silah arkadaşlarına çevireceğinden korkuyor."
 arab_spring.7.a:0 "Otoritemiz zayıflıyor..."
 arab_spring.8.t:0 "Birlikler ile Göstericiler Arasindaki Çatismalarda Ölümler Yasandi"
 arab_spring.8.d:0 "Göstericiler ile askerler arasında şiddet patlak verdi ve çok sayıda can kaybı yaşandı. Taş atan göstericilere birliklerimiz gerçek mermiyle karşılık vererek hükümetimize yönelik halk öfkesini daha da körükledi."
 arab_spring.8.a:0 "Bu bizi iyi göstermiyor..."
 arab_spring.9.t:0 "Tavizler Kitleleri Yatistirdi"
 arab_spring.9.d:0 "Son reformlarımız hükümet karşıtı göstericiler tarafından iyi karşılandı. Bazı göstericiler hükümetimize güvensizliklerini dile getirmeyi sürdürse de hareket, önlemlerimizi büyük oranda doğru yönde atılmış bir adım olarak övdü."
 arab_spring.9.a:0 "Yeterli olacak mı?"
 arab_spring.10.t:0 "Taviz, Daha Fazla Reform Talebine Yol Açti"
 arab_spring.10.d:0 "Son reformlarımız hoşnutsuzluk ateşini körüklemekten başka bir işe yaramadı. Muhalefet liderleri bizi çok az ve çok geç davranmakla eleştirmeyi sürdürdü ve bizi «gerçek» reform önerilerini hayata geçirmeye çağırdı."
 arab_spring.10.a:0 "Güruh asla tatmin olmayacak..."
 arab_spring.11.t:0 "Protestolar Kaynama Noktasina Ulasti"
 arab_spring.11.d:0 "En iyi çabalarımıza rağmen hükümetimiz artık iktidarı alışılmış yöntemlerle elinde tutacak durumda değil. Önümüzde tarihî bir seçim var. Ya yenilgiyi kabul edip muhalefetin ülkemizin yönetimini devralmasına izin vereceğiz ya da denetimi elde tutmaya yönelik son bir girişimle tüm muhalefeti ezmek için orduyu kullanacağız."
 arab_spring.11.a:0 "Yenilgiyi kabul etmeliyiz..."
 arab_spring.11.b:0 "İktidarı asla bırakmayacağız!"
 arab_spring.12.t:0 "[FROM.GetNameDef] Ülkesinde Devrim Rejimi Iktidardan Uzaklastirdi"
 arab_spring.12.d1:0 "Görevden ayrılan yöneticinin hükümetinin çöküşünün ardından [FROM.GetNameDef] genelinde kutlamalar başladı. [FROM.GetAdjective] güvenlik servislerindeki üst düzey isimlerin muhalefetin yanında yer alma kararı üzerine eski diktatör tutuklandı.\n\nSeçimler yapılana kadar bir geçici hükümet iktidara geldi, ancak yönetiminin geçici niteliğini vurguladı. Yine de birçok kişi, hâlâ görevden ayrılan rejimle yakından özdeşleştirildiği için iktidar partisinin tümüyle tasfiye edilmesini ve tüm üyelerinin istifasını talep ettiğinden protestolar sürüyor."
 arab_spring.12.d2:0 "Görevden ayrılan yöneticinin hükümetinin çöküşünün ardından [FROM.GetNameDef] genelinde kutlamalar başladı. Eski cumhurbaşkanı ülkeyi terk etmek zorunda kaldı ve [SAU.GetNameDef] ülkesine sığındı.\n\nSeçimler yapılana kadar bir geçici hükümet iktidara geldi, ancak yönetiminin geçici niteliğini vurguladı. Yine de birçok kişi, hâlâ Zeynelabidin bin Ali'nin görevden ayrılan rejimiyle yakından özdeşleştirildiği için iktidar partisinin tümüyle tasfiye edilmesini ve tüm üyelerinin istifasını talep ettiğinden protestolar sürüyor."
 arab_spring.12.a:0 "Halk zafer kazandı!"
 arab_spring.12.b:0 "Endişe Verici Bir Gelişme"
 arab_spring.12.c:0 "Demokrasi ilerliyor..."
 arab_spring.13.t:0 "Protestolar Arap Dünyasina Yayildi"
 arab_spring.13.d:0 "[FROM.GetAdjective] rejiminin çöküşü Arap dünyası genelinde hareketlere ilham verdi. Birçok kişi [FROM.GetAdjective] devriminin sloganlarını benimseyerek liderlerini anlamlı reformlar yapmaya ya da bazı durumlarda toplu halde istifa etmeye çağırıyor. Arap liderler, [FROM.GetAdjective] diktatörün kaderinden kaçınmayı umarak protestolara ya uyum sağlamak ya da onları bastırmak için çırpınmaya başladı.\n\nBazılarının «Arap Baharı» olarak anmaya başladığı, bölge genelinde demokrasi yanlısı hareketlerin hızla yayılması dünyayı şaşırttı. Ancak birçok uzman geçmiş yıllarda, iktidarlarını baskı ve gözetime dayandırarak sürdüren Arap rejimlerinin kırılganlığına dikkat çekmişti. Bölgenin her yerinde uzak bir yönetici seçkinden duyulan yabancılaşma, kontrolsüz yolsuzluk ve ekonomik sıkıntılar, şu veya bu biçimde bir değişim arzusunu yavaş yavaş besledi. Şimdi bölge çapında değişim talep eden bir halk hareketine dönüşerek patlayan işte bu duygulardır."
 arab_spring.13.a:0 "Ortadoğu'da değişim rüzgârları esiyor..."
 arab_spring.14.t:0 "[FROM.GetNameDef] Ülkesinde Rejim Protestolari Ezince Iç Savas Patlak Verdi"
 arab_spring.14.d:0 "[FROM.GetNameDef] ülkesinde protestoların belirgin biçimde tırmanmasının ardından [FROM.GetLeader], ülke genelinde, adı açıklanmayan yabancı güçlerce desteklenen «kanunsuz isyancılar» ve «teröristler» olarak nitelediği kesime karşı askeri operasyonlar emretti. Temizleme operasyonlarında, sadık birlikler ile polis cephaneliklerinden ve askeri firarilerden ateşli silah edinen silahlı göstericiler arasında şiddet olayları yaşandı.\n\nBir zamanlar şiddet içermeyen protesto hareketi olan yapının hızla önce bir isyana, ardından iç savaşa dönüştüğü açıkça görülüyor. Ülkenin bazı bölgelerinde muhalefet savaşçılarının bütün şehirlerin kontrolünü ele geçirdiği anlaşılıyor, ancak [FROM.GetNameDef] ülkesinden gelen bilgilerin çoğu karışık ve çelişkili hale geldi. Dünya liderleri itidal çağrısı yaparken insan hakları örgütleri [FROM.GetLeader] yönetiminin protestolara yönelik baskısındaki zalimliği eleştirdi."
 arab_spring.14.a:0 "[FROM.GetNameDef] ülkesinin geleceği kıl payı bir dengede..."
 arab_spring.15.t:0 "ISID Öne Çikiyor"
 arab_spring.15.d:0 "[ISI.GetLeader] bugün, kendi ifadesiyle Irak ve Şam İslam Devleti'nin kurulduğunu ilan etti. Suriye'de rejime karşı savaşan Nusra grubunun Irak İslam Devleti üyeleri tarafından kurulduğunu ve iki örgütün artık birleştiğini açıkladı. Ancak Nusra ve onun El Kaide'deki destekçileri IŞİD'i reddederek feshedilmesi çağrısında bulundu.\n\nAnalistler, ortak bir ideolojiyi ve Suriye hükümetine muhalefeti paylaşsalar da El Kaide ile Suriye kolu Nusra'nın IŞİD'den çok farklı hedef ve yöntemlere sahip olduğu görüşünde. [ISI.GetLeader] önderliğindeki örgüt her zaman El Kaide'den bağımsız hareket etmeye çalıştı ve El Kaide'nin aynı ölçüde yapmadığı biçimde Müslüman azınlık gruplarını hedef alan kendi mezhepçi gündemini izledi. Hedefleri ulusötesi olsa da Nusra gibi El Kaide kolları faaliyetlerini genellikle münferit hükümetleri hedef almakla sınırladı."
 arab_spring.15.a:0 "Yönetimimize bir tehdit daha..."
 arab_spring.15.b:0 "Dünya barışı tehdit altında..."
 arab_spring.15.c:0 "Bu sonradan görmeler başarısızlığa mahkûm..."
 arab_spring.15.e:0 "Allah'a yemin olsun, yükseliyoruz!"
 arab_spring.17.t:0 "Arap Bahari [ROOT.GetNameDef] Ülkesine Ulasti"
 arab_spring.17.d:0 "Arap dünyasını kasıp kavuran halk seferberliği dalgası sonunda bizim kıyılarımıza da ulaştı. [ROOT.GetAdjective] halkı ciddi reformlar, bazı durumlarda ise hükümetin istifasını talep ediyor. Kırılgan hâkimiyetimizi korumak istiyorsak dikkatli adımlar atmalıyız."
 arab_spring.17.a:0 "Dayanacağız!"
 arab_spring.18.t:0 "Protestolar Yatisiyor"
 arab_spring.18.d:0 "Bazı radikaller hükümetimize karşı gösteri yapmayı sürdürse de protesto hareketinin ivmesindeki keskin düşüşün ardından göstericilerin çoğunluğu evlerine döndü. Ancak muhbirlerimiz, ülkenin büyük bölümünde hükümet karşıtı duyguların hâlâ sürdüğünü söylüyor. Protesto hareketi, hükümetimize verilen desteğin artmasından ziyade yorgunluk ve hayal kırıklığı nedeniyle destek kaybetmiş görünüyor. Yine de hükümetimiz için ani tehlike başarıyla savuşturuldu."
 arab_spring.18.d1:0 "Hükümetimizin protestocuların taleplerini karşılamaya yönelik çabalarının ardından ülkemizdeki demokrasi yanlısı hareket ivme kaybetti. Eski göstericilerin büyük çoğunluğu önlemlerimizden memnun görünüyor ve daha fazla reform talep etmiyor."
 arab_spring.18.a:0 "Hükümetimiz ayakta kalıyor..."
 arab_spring.19.t:0 "[FROM.GetNameDef] Yarimada Kalkani Müdahalesi Talep Ediyor"
 arab_spring.19.d:0 "[FROM.GetNameDef] ülkesinde gerilim artarken [FROM.GetLeader], KİK'in ortak güvenlik gücü Yarımada Kalkanı'ndan yardım istedi. [FROM.GetAdjective] yönetimi, hükümetinin çökme riskiyle karşı karşıya olduğunu ve ülkenin tehlikeli devrimci unsurların eline geçebileceğini iddia ediyor. [FROM.GetAdjective] hükümetini ayakta tutmak için birliklerimizi konuşlandırmanın gerekli olup olmadığını dikkatle düşünmeliyiz."
 arab_spring.19.a:0 "Müttefikimize yardım etmeliyiz!"
 arab_spring.19.b:0 "Düşsünler..."
 arab_spring.20.t:0 "Talebimiz kabul edildi!"
 arab_spring.20.d:0 "Başkentimizin sokaklarındaki radikal göstericilerin bölgesel güvenliğe yönelttiği yakın tehdidi gören [FROM.GetAdjective] yönetimi, bize karşı ayaklanmayı bastırmak üzere Yarımada Kalkanı birliklerinin konuşlandırılmasını desteklemeyi kabul etti."
 arab_spring.20.a:0 "[FROM.GetAdjective] yönetimi bizi kurtardı!"
 arab_spring.21.t:0 "Talebimiz reddedildi..."
 arab_spring.21.d:0 "[FROM.GetAdjective] yönetimi, hükümetimizi kurtarmanın Yarımada Kalkanı birliklerini konuşlandırmanın zahmetine ve emeğine değmediğine karar verdi."
 arab_spring.21.a:0 "Kendimizi yalnızca biz kurtarabiliriz."
 arab_spring.22.t:0 "Yarimada Kalkani Birlikleri [FROM.GetNameDef] Ülkesindeki Protestolari Bastirdi"
 arab_spring.22.d:0 "Körfez İşbirliği Konseyi'nin ortak askeri gücü Yarımada Kalkanı'na bağlı kuvvetler, [FROM.GetLeader] hükümetine karşı gösterilerdeki çarpıcı artışın ardından [FROM.GetAdjective] topraklarına girdi. [FROM.GetNameDef] ülkesi ile KİK, Yarımada Kalkanı birliklerinin kaos ortamında yalnızca kilit hükümet binalarını yabancı müdahalesinden korumak için kullanıldığını savunsa da, birliklerin [FROM.GetAdjective] göstericilere karşı sert taktikler kullandığına dair haberler hızla ortaya çıktı."
 arab_spring.22.a:0 "[FROM.GetLeader] iktidarını korumak için hiçbir şeyden çekinmeyecek..."
 hybrid_regime:0 "Hibrit Rejim"
 hybrid_regime_western_desc:0 "Bu ülkenin hükümeti seçim yapmasına rağmen, bu seçimlerin iktidar partisine çoğunluk sağlamasını güvence altına almak için bir dizi gayriresmî önleme başvuruyor. Bu nedenle seçim yoluyla rejim değişikliği sağlamak son derece zor."
 hybrid_regime_emerging_desc:0 "Bu ülkenin hükümeti seçim yapmasına rağmen, bu seçimlerin iktidar partisine çoğunluk sağlamasını güvence altına almak için bir dizi gayriresmî önleme başvuruyor. Bu nedenle seçim yoluyla rejim değişikliği sağlamak son derece zor."
 concede_rojava:0 "Kuzeydoğuyu Terk Et"
 concede_rojava_desc:0 "Suriye'nin Kürtlerin çoğunlukta olduğu kuzeydoğusu, hükümetimize karşı halk ayaklanmasına henüz katılmadı. Güçlerimizi daha fazla zayıf düşürmeye ve Özgür Suriye Ordusu karşısında yenilgi riskine girmeye devam etmektense, askerlerimizi bu bölgeden çekip burayı Kürt milislerin denetimine bırakmak çıkarımıza olabilir."
 terror.135.t:0 "Teröristler Saldirdi"
 terror.135.d:0 "Teröristler [FROM.GetFlag] saldırı düzenledi; bu çok trajik bir olay ve onlara destek olmak için bir yanıt bulmamız gerekiyor. Teröristlerin istedikleri gibi hareket etmelerine izin verilmemeli."
 terror.135.a:0 "Kayıplarımızın yasını tutuyoruz"
 terror.175.t:0 "Internet Izleme"
 terror.175.a:0 "Evet, İzle"
 terror.175.b:0 "Hayır"
 terror.176.t:0 "Kameralar Sokaklara"
 terror.176.a:0 "Evet, Konuşlandır"
 terror.176.b:0 "Hayır"
