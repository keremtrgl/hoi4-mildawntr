 terror.threat:0 "Terör Tehdidi"
 terror.1.t:0 "Basarili Baskinin Ardindan Teröristler Öldürüldü ve Yakalandi"
 terror.1.d1:0 "Bu sabahın erken saatlerinde [ROOT.GetAdjective] özel kuvvetleri, birkaç cihatçı militana ev sahipliği yapan bir daireye baskın düzenledi. Gafil avlanan teröristlerin çoğu, liderlerinin baskının başında kuvvetlerimiz tarafından öldürülmesinin ardından teslim oldu. Uzmanlar baskının başarısını, görece az terörle mücadele eğitimi almış kuvvetlerimizin etkinliğine değil elverişli koşullara bağlıyor. Bazı yerel sakinler baskının şiddetinden öfkelenip cihatçılara sempati duysa da, [ROOT.GetAdjective] halkının çoğu başarıya olumlu tepki verdi."
 terror.1.d2:0 "Bu sabahın erken saatlerinde [ROOT.GetAdjective] özel kuvvetleri, birkaç cihatçı militana ev sahipliği yapan bir daireye baskın düzenledi. Birkaç operatörün yaralandığı kısa bir çatışmanın ardından hayatta kalan teröristler kuvvetlerimize teslim oldu. Uzmanlar baskının başarısını, kapsamlı terörle mücadele eğitimi almış kuvvetlerimizin hazırlıklı olmasına bağlıyor. Ancak operatörlerimizin baskı sırasında yaptığı bazı hataların gerçekten seçkin bir terörle mücadele gücü tarafından yapılmayacağına dikkat çekildi. Bazı yerel sakinler baskının şiddetinden öfkelenip cihatçılara sempati duysa da, [ROOT.GetAdjective] halkının çoğu başarıya olumlu tepki verdi."
 terror.1.d3:0 "Bu sabahın erken saatlerinde [ROOT.GetAdjective] özel kuvvetleri, birkaç cihatçı militana ev sahipliği yapan bir daireye baskın düzenledi. Kısa bir çatışmanın ardından teröristlerin tamamı, saldıran kuvvetin hiç kayıp vermemesiyle öldürüldü ya da yakalandı. Uzmanlar baskının başarısını, titiz terörle mücadele eğitimi almış özel kuvvetlerimizin yüksek standardına bağlıyor. Bazı yerel sakinler baskının şiddetinden öfkelenip cihatçılara sempati duysa da, [ROOT.GetAdjective] halkının çoğu başarıya olumlu tepki verdi."
 terror.1.a:0 "Güvenlik servislerimiz iyi iş çıkardı!"
 terror.2.t:0 "Basarisiz Terörle Mücadele Baskininda Siviller Öldü"
 terror.2.d1:0 "Bu sabahın erken saatlerinde [ROOT.GetAdjective] özel kuvvetleri, birkaç cihatçı militana ev sahipliği yapan bir daireye baskın düzenledi. Ancak operatörlerimizin beceriksiz sızması teröristleri uyardı; teröristler saldıran kuvvete hemen pusu kurup birkaç operatörü öldürdükten sonra kaçtı. Daha da kötüsü, teröristler kaçışlarını örtmek için bomba patlattı ve patlamanın etki alanında kalan çok sayıda sivil öldü. Uzmanlar kuvvetlerimizin sergilediği profesyonellik eksikliğini eleştiriyor; bu eksiklik, yaşanan felaket başarısızlığın doğrudan sorumlusu olarak görülüyor. Sivil ölümleri hükümete karşı büyük bir tepkiye yol açtı ve bazılarının cihatçıların davasına daha fazla sempati duymasına neden oldu."
 terror.2.d2:0 "Bu sabahın erken saatlerinde [ROOT.GetAdjective] özel kuvvetleri, birkaç cihatçı militana ev sahipliği yapan bir daireye baskın düzenledi. Sığınağa fark edilmeden girmeyi başarmalarına rağmen operatörlerimiz beklenenden daha sert bir direnişle karşılaştı ve birkaç kayıp verdi. Cihatçılardan bazıları yaralanıp yakalansa da militanların büyük çoğunluğu zarar görmeden kaçtı. Üstelik uzayan çatışmada çapraz ateşte birçok sivil öldü ve yaralandı. Uzmanlar güvenlik servislerimizin standardını eleştiriyor; çünkü bir miktar terörle mücadele eğitimi almalarına rağmen en seçkin operatörlerimiz diğer ülkelerdeki emsalleriyle aynı standartlara ulaşamıyor. Sivil ölümleri hükümete karşı büyük bir tepkiye yol açtı ve bazılarının cihatçıların davasına daha fazla sempati duymasına neden oldu."
 terror.2.d3:0 "Bu sabahın erken saatlerinde [ROOT.GetAdjective] özel kuvvetleri, birkaç cihatçı militana ev sahipliği yapan bir daireye baskın düzenledi. Güvenlik servislerimizin yüksek standardına rağmen operatörlerimiz, beklenmedik biçimde çok sayıda sivilin bulunması nedeniyle bir avuçtan fazla cihatçıyı öldürüp yakalayamadı. Militanların büyük çoğunluğu, operatörlerimizin tüm çabasına rağmen çapraz ateşte kalan çok sayıda sivilin ölümüne yol açan kısa bir çatışmanın ardından zarar görmeden kaçtı. Uzmanlar, baskı boyunca profesyonelliğini koruyan ve sivil kayıplardan kaçınmak için elinden geleni yapan özel kuvvetlerimizin standardını övüyor. Yine de yaşanan sivil ölümleri hükümete karşı büyük bir tepkiye yol açtı ve bazılarının cihatçıların davasına daha fazla sempati duymasına neden oldu."
 terror.2.a:0 "Cihatçılar bir gün daha savaşmak için hayatta kaldı..."
 terror.3.t:0 "Istihbarat Servisleri Terör Planini Ortaya Çikardi"
 terror.3.d:0 "İstihbarat servislerimizin ulaştığı bilgiler üzerine [ROOT.GetAdjective] polisi, terör saldırısı planlayan birkaç cihatçıyı tutukladı. Saldırı gerçekleşmiş olsaydı onlarca insan ölecek ve yaralanacak, daha fazla aşırılıkçıyı terör davasına çekecekti."
 terror.3.a:0 "Bir felaketi önledik!"
 terror.4.t:0 "Cihatçilar Hedefli Saldirida Çok Sayida Sivili Öldürdü"
 terror.4.d1a:0 "Cihatçı militanların bir bakanlık binasına düzenlediği yıkıcı silahlı ve bombalı saldırıda onlarca sivil ve birkaç polis memuru öldü. [ROOT.GetAdjective] güvenlik servisleri saldırıyı önleyemediği için, ayrıca saldırının ardından gelen yetersiz müdahale nedeniyle eleştiriliyor. Titiz terörle mücadele eğitiminin eksikliği, güvenlik güçlerinin siviller koruyamamasına, hatta zaman zaman sivil ölümlerine doğrudan katkıda bulunmasına yol açtı. Hükümetin bu saldırıyı kötü yönetmesi ve saldırının kendisinin başarılı olması, kamuoyunu hükümete karşı sertleştirdi ve radikal İslamcılara desteği artırdı."
 terror.4.d1b:0 "Cihatçı militanların bir bakanlık binasına düzenlediği ciddi bombalı saldırıda bir düzineden fazla sivil öldü. [ROOT.GetAdjective] güvenlik güçleri daha fazla kaybı önlemeyi başardı ve saldırının başlamasından birkaç saat içinde saldırganların çoğunu öldürdü ya da tutukladı. Bununla birlikte bazıları güvenlik servislerini daha erken müdahale etmedikleri için eleştirdi. Bu durum [ROOT.GetAdjective] hükümetine karşı mevcut öfkeyi besledi ve saldırının kendisi radikal köktencileri harekete geçirdi."
 terror.4.d1c:0 "Birkaç cihatçı, [ROOT.GetAdjective] hükümet binasına bombalı araçla saldırmaya çalıştı ancak hedeflerine ulaşmadan güvenlik güçlerince durduruldu. Güvenlik güçleri bomba patlatılmadan önce çevreyi büyük oranda sivillerden arındırmayı başardı, ancak patlamada birkaç kişi yaralandı ve şu an kritik durumda. [ROOT.GetAdjective] halkının çoğu [ROOT.GetAdjective] güvenlik güçlerinin müdahalesindeki profesyonelliği övdü, ancak saldırının gerçekleşebilmiş olması bazı İslamcı radikalleri cesaretlendirdi."
 terror.4.d2a:0 "Cihatçı militanların bir Şii camisine düzenlediği yıkıcı silahlı ve bombalı saldırıda onlarca sivil ve birkaç polis memuru öldü. [ROOT.GetAdjective] güvenlik servisleri saldırıyı önleyemediği için, ayrıca saldırının ardından gelen yetersiz müdahale nedeniyle eleştiriliyor. Titiz terörle mücadele eğitiminin eksikliği, güvenlik güçlerinin siviller koruyamamasına, hatta zaman zaman sivil ölümlerine doğrudan katkıda bulunmasına yol açtı. Hükümetin bu saldırıyı kötü yönetmesi ve saldırının kendisinin başarılı olması, kamuoyunu hükümete karşı sertleştirdi ve radikal İslamcılara desteği artırdı."
 terror.4.d2b:0 "Cihatçı militanların bir Şii camisine düzenlediği ciddi bombalı saldırıda bir düzineden fazla sivil öldü. [ROOT.GetAdjective] güvenlik güçleri daha fazla kaybı önlemeyi başardı ve saldırının başlamasından birkaç saat içinde saldırganların çoğunu öldürdü ya da tutukladı. Bununla birlikte bazıları güvenlik servislerini daha erken müdahale etmedikleri için eleştirdi. Bu durum [ROOT.GetAdjective] hükümetine karşı mevcut öfkeyi besledi ve saldırının kendisi radikal köktencileri harekete geçirdi."
 terror.4.d2c:0 "Birkaç cihatçı, bir Şii camisine bombalı araçla saldırmaya çalıştı ancak hedeflerine ulaşmadan güvenlik güçlerince durduruldu. Güvenlik güçleri bomba patlatılmadan önce çevreyi büyük oranda sivillerden arındırmayı başardı, ancak patlamada birkaç kişi yaralandı ve şu an kritik durumda. [ROOT.GetAdjective] halkının çoğu [ROOT.GetAdjective] güvenlik güçlerinin müdahalesindeki profesyonelliği övdü, ancak saldırının gerçekleşebilmiş olması bazı İslamcı radikalleri cesaretlendirdi."
 terror.4.d3a:0 "Cihatçı militanların bir kiliseye düzenlediği yıkıcı silahlı ve bombalı saldırıda onlarca sivil ve birkaç polis memuru öldü. [ROOT.GetAdjective] güvenlik servisleri saldırıyı önleyemediği için, ayrıca saldırının ardından gelen yetersiz müdahale nedeniyle eleştiriliyor. Titiz terörle mücadele eğitiminin eksikliği, güvenlik güçlerinin siviller koruyamamasına, hatta zaman zaman sivil ölümlerine doğrudan katkıda bulunmasına yol açtı. Hükümetin bu saldırıyı kötü yönetmesi ve saldırının kendisinin başarılı olması, kamuoyunu hükümete karşı sertleştirdi ve radikal İslamcılara desteği artırdı."
 terror.4.d3b:0 "Cihatçı militanların bir kiliseye düzenlediği ciddi bombalı saldırıda bir düzineden fazla sivil öldü. [ROOT.GetAdjective] güvenlik güçleri daha fazla kaybı önlemeyi başardı ve saldırının başlamasından birkaç saat içinde saldırganların çoğunu öldürdü ya da tutukladı. Bununla birlikte bazıları güvenlik servislerini daha erken müdahale etmedikleri için eleştirdi. Bu durum [ROOT.GetAdjective] hükümetine karşı mevcut öfkeyi besledi ve saldırının kendisi radikal köktencileri harekete geçirdi."
 terror.4.d3c:0 "Birkaç cihatçı, bir kiliseye bombalı araçla saldırmaya çalıştı ancak hedeflerine ulaşmadan güvenlik güçlerince durduruldu. Güvenlik güçleri bomba patlatılmadan önce çevreyi büyük oranda sivillerden arındırmayı başardı, ancak patlamada birkaç kişi yaralandı ve şu an kritik durumda. [ROOT.GetAdjective] halkının çoğu [ROOT.GetAdjective] güvenlik güçlerinin müdahalesindeki profesyonelliği övdü, ancak saldırının gerçekleşebilmiş olması bazı İslamcı radikalleri cesaretlendirdi."
 terror.4.a:0 "Bu teröristleri avlayacağız..."
 terror.5.t:0 "Cihatçilar Ordu Devriyesine Pusu Kurdu"
 terror.5.d1:0 "Radikal İslamcı militanlar, [ROOT.GetAdjective] ordu devriyesine yıkıcı bir saldırı düzenleyerek tamamen gafil avlanan askerlerin çoğunu yok etti. Birliklerimizin isyan bastırma harekâtı konusunda aldığı eğitimin yetersizliği, onları büyük oranda zarar görmeden kaçan cihatçıların gerilla taktiklerine kolay av hâline getirdi. Saldırının haberi [ROOT.GetNameDef] ülkesinin dört bir yanına yayılarak hükümetin güvenliği sağlama becerisine olan güveni azalttı ve bazılarının ordumuzdan daha etkili bir savaş gücü olarak görmeye başladığı cihatçıların itibarını yükseltti."
 terror.5.d2:0 "Radikal İslamcı militanlar, [ROOT.GetAdjective] ordu devriyesine saldırarak şiddetli bir çatışmanın ardından bir düzineden fazla askeri öldürdü. Birliklerimiz kayda değer kayıp vermeyecek kadar iyi eğitilmişti, ancak cihatçılar geri çekildikten sonra karşı saldırı başlatacak kadar kendinden emin değildi. Saldırının haberi [ROOT.GetNameDef] ülkesinin dört bir yanına yayılarak hükümetin güvenliği sağlama becerisine olan güveni zedeledi ve bazılarının etkili bir savaş gücü olarak görmeye başladığı cihatçıların itibarını yükseltti."
 terror.5.d3:0 "Radikal İslamcı militanlar, [ROOT.GetAdjective] ordu devriyesine saldırdı ancak ağır kayıp vererek çabucak püskürtüldü. Yüksek eğitimli birliklerimiz cihatçılara karşı fazlasıyla yeterli oldu ve yalnızca birkaç kayıp verdi. Saldırının haberi [ROOT.GetNameDef] ülkesinin dört bir yanına yayıldı; güvenlik güçlerimizin başarısı olumlu karşılansa da saldırının cüretkârlığı hükümetin bazı radikal karşıtlarını cihatçı davasına çekti."
 terror.5.a:0 "Sadık askerlerimizin intikamı alınmalı!"
 terror.6.t:0 "[FROM.GetNameDef] Ülkesinde Cihatçilar Yabancilari Öldürdü"
 terror.6.d1:0 "Yabancı işçilere ait bir konut kompleksine düzenlenen cihatçı silahlı ve bombalı saldırıda onlarca kişi öldü ya da yaralandı. Kompleksi savunmakla görevli [FROM.GetAdjective] güvenlik güçlerinin, ağır silahlı militanlar gelince görev yerlerini terk ettiği, yabancıları ve ailelerini aşırılıkçıların katline terk ettiği bildirildi. [FROM.GetAdjective] güçlerin bu başarısızlığı, [FROM.GetAdjective] güvenlik güçlerinin aldığı düşük düzeydeki terörle mücadele eğitimine bağlandı. Saldırı uluslararası toplumu şoke ederken bölge genelindeki radikal İslamcıları harekete geçirdi.\n\n[FROM.GetAdjective] lider [FROM.GetLeader], kurbanlara ve ailelerine başsağlığı diledi ve [FROM.GetNameDef] ülkesindeki aşırılıkçı militanlarla mücadele önlemlerini artıracağına ve bu saldırının failleri adalete teslim edeceğine söz verdi."
 terror.6.d2:0 "Yabancı işçilere ait bir konut kompleksine düzenlenen cihatçı silahlı ve bombalı saldırıda onlarca kişi öldü ya da yaralandı. Kompleksi savunmakla görevli [FROM.GetAdjective] güvenlik güçlerinin, sivillerin tahliyesi için bir miktar zaman kazandırmayı başardığı, ancak sonunda saldırganlar tarafından bastırıldığı bildirildi. Güvenlik güçlerinin daha iyi performans gösterememesi, aldıkları sınırlı terörle mücadele eğitimine bağlandı. Saldırı uluslararası toplumu şoke ederken bölge genelindeki radikal İslamcıları cesaretlendirdi.\n\n[FROM.GetAdjective] lider [FROM.GetLeader], kurbanlara ve ailelerine başsağlığı diledi ve [FROM.GetNameDef] ülkesindeki aşırılıkçı militanlarla mücadele önlemlerini artıracağına ve bu saldırının failleri adalete teslim edeceğine söz verdi."
 terror.6.d3:0 "Yabancı işçilere ait bir konut kompleksine düzenlenen cihatçı silahlı ve bombalı saldırıda birkaç kişi öldü ya da yaralandı. Neyse ki kompleksi savunmakla görevli [FROM.GetAdjective] güvenlik güçleri, uzun süren bir çatışmanın ardından saldırganları püskürtmeyi başardı. Ancak çok sayıda sivil istemeden çapraz ateşte kaldı. [FROM.GetAdjective] güvenlik güçlerinin görece başarısı, aldıkları yüksek düzeydeki terörle mücadele eğitimine bağlandı. Saldırı uluslararası toplumu şoke ederken bölge genelindeki radikal İslamcıları cesaretlendirdi.\n\n[FROM.GetAdjective] lider [FROM.GetLeader], kurbanlara ve ailelerine başsağlığı diledi ve [FROM.GetNameDef] ülkesindeki aşırılıkçı militanlarla mücadele önlemlerini artıracağına ve bu saldırının failleri adalete teslim edeceğine söz verdi."
 terror.6.a:0 "Terör insanlığın belasıdır..."
 terror.6.b:0 "İslam'ın düşmanlarına karşı bir darbe daha!"
 terror.6.c:0 "Vatandaşlarımız hayatını kaybetti..."
 terror.7.t:0 "Cihatçilar Yabanci Askeri Üsse Cüretkâr Baskin Düzenledi"
 terror.7.d1:0 "[FROM.GetNameDef] ülkesinde konuşlu yüzlerce yabancı asker, İslamcı aşırılıkçıların saldırısında öldü ya da yaralandı. Hafif silahlar, roketatarlar ve hatta bazı zırhlı araçlarla donatılmış militanlar, geri çekilmeden önce üsse ağır hasar vermeyi başardı. Yüksek kayıp oranı, üssü yaklaşan tehdit konusunda uyarmayan ve yardım taleplerine rağmen harekete geçmeyen [FROM.GetAdjective] birliklerinin düşük performansına bağlandı. [FROM.GetAdjective] güçlerinin görece düşük standartta terörle mücadele eğitimi aldığı bildiriliyor; birçok kişi bunu etkisizliklerinin başlıca açıklaması sayıyor."
 terror.7.d2:0 "[FROM.GetNameDef] ülkesinde konuşlu onlarca yabancı asker, İslamcı aşırılıkçıların saldırısında öldü ya da yaralandı. Hafif silahlar, roketatarlar ve hatta bazı zırhlı araçlarla donatılmış militanlar, geri çekilmeden önce üsse orta ölçekli hasar vermeyi başardı. Kayıpların çoğu saldırının ilk aşamasında verildi; çünkü [FROM.GetAdjective] takviye kuvvetlerinin gelişi cihatçıları daha fazla hasar veremeden kaçmaya zorladı. [FROM.GetAdjective] güvenlik güçleri terörle mücadelede belli bir etkinlik göstermiş olsa da seçkin uluslararası terörle mücadele birliklerinin standartlarının altında kalıyor."
 terror.7.d3:0 "[FROM.GetNameDef] ülkesinde konuşlu düzinelerce yabancı asker, İslamcı aşırılıkçıların saldırısında öldü ya da yaralandı. Hafif silahlar, roketatarlar ve hatta bazı zırhlı araçlarla donatılmış militanlar, [FROM.GetAdjective] takviye kuvvetleri tarafından püskürtülmeden önce üsse hafif hasar verdi. [FROM.GetAdjective] güvenlik güçleri, saldırının yıkıcılığını en aza indirmeye yardımcı olan hızlı ve verimli müdahaleleri nedeniyle övüldü. [FROM.GetAdjective] birlikleri görece yüksek standartta terörle mücadele eğitimi alıyor ve bu nedenle bölgedeki en etkili terörle mücadele güçleri arasında yer alıyor."
 terror.8.t:0 "Cihatçilar [FROM.GetAdjective] Topraklarindan [ROOT.GetNameDef] Ülkesine Geçti"
 terror.8.d:0 "Savunmamızdaki boşlukları kullanan [FROM.GetAdjective] cihatçılar [ROOT.GetNameDef] ülkesine geçti. Niyetleri neredeyse kesinlikle düşmanca; bu nedenle oluşturdukları tehdidi bertaraf etmek için iç güvenlik servislerimiz bu yabancı militanları aramaya şimdiden başladı. İleride [FROM.GetAdjective] sınırında daha fazla asker konuşlandırmak, bu olayın tekrarlanma riskini azaltmaya yardımcı olacaktır."
 terror.8.a:0 "Umarız onları yakalarız..."
 terror.9.t:0 "Yabanci Cihatçilar Basariyla Yakalandi!"
 terror.9.d:0 "Kusursuz yürütülen bir operasyonun ardından [ROOT.GetAdjective] özel kuvvetleri, yakın zamanda ülkemize sızan tüm yabancı cihatçıları öldürme ya da yakalama görevlerini başarıyla tamamladı. Operatörler görevlerinde başarısız olsaydı [ROOT.GetNameDef] kaçınılmaz bir saldırıya hazırlanmak zorunda kalacaktı."
 terror.9.a:0 "Bu teröristler artık [ROOT.GetNameDef] ülkesi için tehdit oluşturmuyor!"
 terror.10.t:0 "Yabanci Cihatçilar Yakalanmaktan Kurtuldu!"
 terror.10.d:0 "Ne yazık ki yakın zamanda sınırı geçen İslamcı militanları öldürmek ya da yakalamak üzere gönderilen birlikler görevlerinde başarısız oldu. Kuvvetlerimiz cihatçıları bulup çatışmaya girmeyi başarsa da, militanların büyük oranda zarar görmeden kaçmasını engelleyemedi. Militanlar artık sınırlarımız içinde bir terör saldırısı düzenlemekte özgür. Bu arada, gelecekte benzer bir başarısızlık ihtimalini azaltmak için güvenlik servislerimizde terörle mücadele eğitimi vermeliyiz."
 terror.10.a:0 "Saldırmaları an meselesi..."
 terror.11.t:0 "Istihbarat Servislerimiz Yabanci Cihatçilarin Yerini Basariyla Tespit Etti!"
 terror.11.d:0 "[ROOT.GetAdjective] iç güvenlik servisleri, büyük bir zaman ve kaynak yatırımının ardından yakın zamanda [ROOT.GetNameDef] ülkesine sınırı geçen yabancı cihatçıların tam yerini tespit etmeyi başardı. Özel kuvvetler, militanları topraklarımızda saldırı düzenlemeden önce öldürmek ya da yakalamak üzere şimdi konuşlandırılacak."
 terror.11.a:0 "Umarız onları yakalayabiliriz..."
 terror.12.t:0 "[ROOT.GetNameDef] Ülkesinde Cihatçi Ayaklanmasi Kayniyor"
 terror.12.d:0 "Raporlar, [ROOT.GetNameDef] ülkesindeki cihatçı militanların hükümeti devirmek için büyük çaplı silahlı bir ayaklanma hazırladığını gösteriyor. Bu büyüyen tehdidi görmezden gelmeyi seçersek [ROOT.GetNameDef] yakında iç savaşa sürüklenecek."
 terror.12.a:0 "Harekete geçmeliyiz..."
 terror.14.t:0 "Cihatçi Ayaklanma Tehdidi Geçti"
 terror.14.d:0 "Son terörle mücadele eylemlerimiz, cihatçı tehdidini büyük çaplı bir ayaklanmanın artık yakın olmadığı noktaya kadar azaltmayı başardı."
 terror.14.a:0 "Bir kez daha rahat edebiliriz."
 terror.15.t:0 "Basarili Hava Saldirisinda Teröristler Öldürüldü"
 terror.15.d1:0 "Bu sabah erken saatlerde [ROOT.GetAdjective] uçakları, kırsal bölgelerdeki birkaç cihatçı sığınağını tespit edip yok etmeyi başardı. Gafil avlanan teröristlerin saldırıya hazırlıksız olduğu ve neredeyse tamamen yok edildiği bildiriliyor. Uzmanlar bu baskının başarısını, görece az terörle mücadele eğitimi almış pilotlarımızın etkinliğine değil cihatçıların rehavetine ve elverişli hava koşullarına bağlıyor. Bazı yerel sakinler saldırının yıkıcılığından öfkelenip cihatçılara sempati duysa da, diğer [ROOT.GetAdjective] vatandaşlar başarıya olumlu tepki verdi."
 terror.15.d2:0 "Bu sabah erken saatlerde [ROOT.GetAdjective] uçakları, kırsal bölgelerdeki birkaç cihatçı sığınağını tespit edip yok etmeyi başardı. Cihatçı militanların saldırıya hızlı karşılık vermesi nedeniyle baskın beklenenden uzun sürse de pilotlarımız sonunda tüm hedeflerini tespit edip etkisiz hale getirmeyi başardı. Uzmanlar bu baskının başarısını, kapsamlı terörle mücadele eğitimi almış pilotlarımızın hazırlıklı olmasına bağlıyor. Ancak pilotlarımızın baskı sırasında yaptığı bazı hataların gerçekten seçkin bir terörle mücadele gücü tarafından yapılmayacağına dikkat çekildi. Bazı yerel sakinler saldırının yıkıcılığından öfkelenip cihatçılara sempati duysa da, diğer [ROOT.GetAdjective] vatandaşlar başarıya olumlu tepki verdi."
 terror.15.d3:0 "Bu sabah erken saatlerde [ROOT.GetAdjective] uçakları, kırsal bölgelerdeki birkaç cihatçı sığınağını tespit edip yok etmeyi başardı. Cihatçı militanların çetin imkânlarına rağmen operasyon hızla sonuçlandı. Uzmanlar bu saldırının başarısını, titiz terörle mücadele eğitimi almış pilotlarımızın uzmanlığına bağlıyor. Bazı yerel sakinler saldırının yıkıcılığından öfkelenip cihatçılara sempati duysa da, diğer [ROOT.GetAdjective] vatandaşlar başarıya olumlu tepki verdi."
 terror.15.a:0 "Pilotlarımız iyi iş çıkardı!"
 terror.16.t:0 "Basarisiz Hava Saldirisinda Siviller Öldü"
 terror.16.d1:0 "Bu sabah erken saatlerde [ROOT.GetAdjective] uçakları, kırsal bölgelerdeki birkaç cihatçı sığınağını tespit edip yok etmeye çalıştı. Ancak pilotlarımızın tecrübesizliği, bir [ROOT.GetAdjective] köyünün yanlışlıkla hedef alınmasına ve onlarca sivilin ölmesine ve yaralanmasına yol açtı. Uzmanlar pilotlarımızın sergilediği profesyonellik eksikliğini eleştiriyor; bu eksiklik, yaşanan felaket başarısızlığın doğrudan sorumlusu olarak görülüyor. Sivil ölümleri hükümete karşı büyük bir tepkiye yol açtı ve birçok kişinin cihatçıların davasına daha fazla sempati duymasına neden oldu."
 terror.16.d2:0 "Bu sabah erken saatlerde [ROOT.GetAdjective] uçakları, kırsal bölgelerdeki birkaç cihatçı sığınağını tespit edip yok etmeye çalıştı. Ancak kötü hava koşulları ve uzmanlık eksikliği, bir [ROOT.GetAdjective] köyünün yanlışlıkla hedef alınmasına ve onlarca sivilin ölmesine ve yaralanmasına yol açtı. Uzmanlar pilotlarımızın standardını eleştiriyor; çünkü bir miktar terörle mücadele eğitimi almalarına rağmen en yüksek eğitimli pilotlarımız diğer ülkelerdeki emsalleriyle aynı standartlara ulaşamıyor. Sivil ölümleri hükümete karşı büyük bir tepkiye yol açtı ve birçok kişinin cihatçıların davasına daha fazla sempati duymasına neden oldu."
 terror.16.d3:0 "Bu sabah erken saatlerde [ROOT.GetAdjective] uçakları, kırsal bölgelerdeki birkaç cihatçı sığınağını tespit edip yok etmeye çalıştı. Ancak öngörülemeyen bir dizi olay, bir [ROOT.GetAdjective] köyünün yanlışlıkla hedef alınmasıyla ve onlarca sivilin ölmesi ve yaralanmasıyla sonuçlandı. Uzmanlar, baskı boyunca profesyonelliğini koruyan ve hedefin niteliğini anladıktan sonra sivil kayıplardan kaçınmak için elinden geleni yapan pilotlarımızın standardını övüyor. Yine de yaşanan sivil ölümleri hükümete karşı büyük bir tepkiye yol açtı ve birçok kişinin cihatçıların davasına daha fazla sempati duymasına neden oldu."
 terror.16.a:0 "Cihatçılar bir gün daha savaşmak için hayatta kaldı..."
 gulf.5.t:0 "[fossil_fuel_industry_name] Halka Arzi"
 gulf.5.d:0 "[FROM.GetAdjective] devletinin kârlı petrol şirketinin uzun süredir beklenen ilk halka arzı, [FROM.GetLeader] tarafından resmen duyuruldu. Bu riskli girişimin başarısı henüz belirsiz; bazı analistler bu halka arza yatırımcı ilgisinin sınırlı kalacağını öngörüyor. [FROM.GetAdjective] hükümeti bu tahminleri reddetti ve bu belirsiz dönemde güveni korumaya çalışarak hem yurt içindeki hem yurt dışındaki yatırımcıları hisse almaya çağırdı."
 gulf.5.a:0 "[FROM.GetNameDef] için heyecan verici bir gün!"
 gulf.7.t:0 "[fossil_fuel_industry_name] Halka Arzi Iyi Gitti"
 gulf.7.d:0 "[fossil_fuel_industry_name] şirketine duyulan oldukça yüksek yatırımcı güveni sayesinde halka arzımız büyük meblağlar topladı ve hükümetimizin itibarını hem yurt içinde hem yurt dışında önemli ölçüde güçlendirdi. Daha da önemlisi, toplanan fonlar sermaye fonumuza çok ihtiyaç duyulan kaynağı sağladı."
 gulf.7.a:0 "Mükemmel!"
 gulf.8.t:0 "[fossil_fuel_industry_name] Halka Arzi Fiyasko Oldu"
 gulf.8.d:0 "[fossil_fuel_industry_name] şirketine duyulan düşük yatırımcı güveni nedeniyle halka arzımız kayda değer meblağlar toplayamadı ve hükümetimizin itibarını hem yurt içinde hem yurt dışında zedeledi. Bu başarısızlık, sermaye fonumuza katkıda bulunacak görece az varlığa sahip olduğumuz anlamına geliyor."
 gulf.8.a:0 "Ülkemiz için üzücü bir gün..."
 gulf.9.t:0 "Yeni [FROM.GetAdjective] Yönetiminden Essiz Bir Teklif"
 gulf.9.d:0 "[FROM.GetNameDef] hükümetinde yaşanan köklü değişikliklerin ardından bu ülkenin yeni yönetimi, bizim hükümetimizle yakın ideolojik bağlara sahip. Ülkenin lideri [FROM.GetLeader], iki ülke arasında yakın bir askeri ortaklık kurulması için sessizce bir teklifte bulundu. Bu eşsiz teklifi kabul edip etmeyeceğimize karar vermeliyiz."
 gulf.9.a:0 "Silah arkadaşları!"
 gulf.9.b:0 "Bir ittifaka ihtiyacımız yok."
 gulf.10.t:0 "Ittifak Kuruldu!"
 gulf.10.d:0 "Ülkemiz ile [FROM.GetNameDef] artık kopmaz bir bağı paylaşıyor!"
 gulf.10.a:0 "Gerçekten sevindirici bir olay!"
 gulf.11.t:0 "Teklifimiz reddedildi..."
 gulf.11.d:0 "[FROM.GetNameDef] hükümeti, ittifak kurma teklifimize yanıt vermeye dahi tenezzül etmedi."
 gulf.11.a:0 "Müttefikleri başka yerde aramalıyız..."
 gulf.12.t:0 "[FROM.GetAdjective] Gayriresmî Toprak Talepleri Egemenligimizi Tehdit Ediyor"
 gulf.12.d:0 "[FROM.GetAdjective] hükümetindeki büyük değişikliklerin ardından ülkenin yeni lideri [FROM.GetLeader], [FROM.GetNameDef] ülkesinin haklı olarak bize ait topraklar üzerindeki iddialarını yeniden canlandıran bir konuşma yaptı. Birçok [ROOT.GetAdjective] vatandaşı, bu konuşmanın [FROM.GetAdjective] yönetiminin topraklarımızı zorla ilhak etme girişiminin habercisi olmasından korkuyor."
 gulf.12.a:0 "Bu bildiriyi eleştirmeliyiz!"
 gulf.12.b:0 "İlk darbeyi biz vurmalıyız!"
 gulf.13.t:0 "[FROM.GetNameDef] Kuruldu"
 gulf.13.d:0 "Yalnızca birkaç yıl önce resmen [FROM.GetNameDef] olarak bilinen ülke baskıcı bir monarşiydi. O zamandan beri ülke köklü bir dönüşüm geçirdi; monarşi siyasetten bir adım geri çekilerek tamamen demokratik seçimlere yol verdi. Şimdi [FROM.GetLeader] hükümeti bir adım daha ileri giderek [FROM.GetAdjective] monarşisinin feshedildiğini açıkladı; bu, dışarıdan birçok gözlemciyi şaşırttı."
 gulf.13.a:0 "Cumhuriyetçi bir zafer."
 gulf.14.t:0 "Türkiye ile [FROM.GetNameDef] Arasinda Üst Düzey Zirve Yapildi"
 gulf.14.d:0 "Haftalar süren perde arkası müzakerelerin ardından Türkiye Cumhurbaşkanı [TUR.GetLeader], mevkidaşı [FROM.GetLeader] ile görüşmek üzere [FROM.GetNameDef] ülkesine geldi. Birçok kişi bu zirveyi, [FROM.GetAdjective]-Türk iş birliğinin güçlenmesine yönelik ilk adım olarak görüyor; bu, Orta Doğu jeopolitiğinde önemli bir değişimin ve Türkiye'nin bölgesel nüfuzunda kayda değer bir artışın habercisi olabilir."
 gulf.14.a:0 "Güç dengeleri kayıyor."
 gulf.15.t:0 "[FROM.GetLeader] Türk Dis Politikasini Elestirdi"
 gulf.15.d:0 "Türkiye'nin Orta Doğu'daki faaliyetlerinde kayda değer bir artış yaşanırken [FROM.GetNameDef] lideri, Türkiye'nin Arap devletlerinin işlerine «müdahalesini» ve «karışmasını» sert biçimde eleştirdi. [FROM.GetLeader], Türkiye'yi eylemleriyle «Osmanlı İmparatorluğu'nu yeniden canlandırmaya» çalışmakla suçladı ve [TUR.GetLeader] tarafından düşmanca bir yanıt aldı. [USA.GetLeader] ve [SOV.GetLeader] dahil dünya liderleri, her iki tarafı da itidal göstermeye ve bölgesel istikrarı korumaya çağırdı."
 gulf.15.a:0 "Türk hırsları sorgulanıyor..."
 gulf.16.t:0 "[FROM.GetAdjective] Yönetimi Suriye'de Rejim Degisikligi Için Baski Yapiyor!"
 gulf.16.d:0 "[FROM.GetLeader], [SYR.GetLeader] yönetimini devirmeye yönelik bir koalisyon için desteğimizi istedi. Suriye'de rejim değişikliği aramak bu ülkede çıkarlarımıza daha uygun bir hükümetin kurulmasına yardımcı olabilirse de, böyle bir adımın uluslararası ve iç sonuçlarını göz önünde bulundurmalıyız."
 gulf.16.a:0 "Diktatörü devirme zamanı!"
 gulf.16.b:0 "Riskler çok büyük."
 gulf.17.t:0 "[USA.GetLeader] Esad Karsiti Koalisyonu Desteklemeyi Reddetti!"
 gulf.17.d:0 "Rus hükümetinin görüşlerini Suriye halkınınkilerin önüne koyduğu şüphesiz olan Amerikalılar, Suriye'ye yönelik insani müdahale teklifimizi reddetmeyi seçti."
 gulf.17.a:0 "İşleri kendi ellerimize almalıyız!"
 gulf.17.b:0 "Bu büyüklükte bir operasyona hazır değiliz..."
 gulf.18.t:0 "Uluslararasi Koalisyon Suriye'de Operasyonlara Basladi"
 gulf.18.d:0 "[USA.GetLeader] bugün, Suriye'deki sivilleri korumayı amaçlayan tartışmalı çok taraflı bir operasyon olan Kararlı Savunucu Harekâtı'nın başladığını duyurdu. Aralarında birkaç NATO ve Arap Birliği üyesinin bulunduğu ülkeler, Körfez monarşilerinin yoğun lobi faaliyetinin ardından kurulduğu bildirilen Amerikan öncülüğündeki koalisyona güç sağladı. [USA.GetLeader], operasyonun önceliğinin rejim değişikliği değil sivillerin korunması olduğunu savunsa da çoğu analist, sivillerin korunması yetkisini Esad'ın devrilmesi için ince örtülü bir gerekçe olarak görüyor. Eleştirmenler, koalisyonun eylemlerini haklı çıkaracak bir Güvenlik Konseyi kararından yoksun olduğuna dikkat çekerek operasyonu uluslararası hukuka göre yasadışı saydı. Rusya ve Çin gibi ülkeler, [SYR.GetLeader] ile birlikte operasyonu Suriye egemenliğinin ihlali olarak kınadı. Ayrıca Suriye'deki Rus birliklerinin varlığı, Kararlı Savunucu Harekâtı'nın Rus ve NATO kuvvetleri arasında çatışmalara yol açabileceği kaygılarını artırdı."
 gulf.18.d_NATO_only:0 "[USA.GetLeader] bugün, Suriye'deki sivilleri korumayı amaçlayan tartışmalı çok taraflı bir operasyon olan Kararlı Savunucu Harekâtı'nın başladığını duyurdu. Birkaç NATO üyesi, Körfez monarşilerinin yoğun lobi faaliyetinin ardından kurulduğu bildirilen Amerikan öncülüğündeki koalisyona güç sağladı. [USA.GetLeader], operasyonun önceliğinin rejim değişikliği değil sivillerin korunması olduğunu savunsa da çoğu analist, sivillerin korunması yetkisini Esad'ın devrilmesi için ince örtülü bir gerekçe olarak görüyor. Eleştirmenler, koalisyonun eylemlerini haklı çıkaracak bir Güvenlik Konseyi kararından yoksun olduğuna dikkat çekerek operasyonu uluslararası hukuka göre yasadışı saydı. Rusya ve Çin gibi ülkeler operasyonu Suriye egemenliğinin ihlali olarak şiddetle kınadı. Ayrıca Suriye'deki Rus birliklerinin varlığı, Kararlı Savunucu Harekâtı'nın Rus ve NATO kuvvetleri arasında çatışmalara yol açabileceği kaygılarını artırdı."
 gulf.18.a:0 "İnsan hakları savunulmalı!"
 gulf.18.b:0 "Bu, devlet egemenliğinin kabul edilemez bir ihlalidir!"
 gulf.19.t:0 "[FROM.GetAdjective] hükümeti gizli bir askeri teknoloji degisimi anlasmasi talep etti"
 gulf.19.d:0 "[FROM.GetNameDef] ile Hizbullah ve Tahran'daki hamileri biçiminde ortak düşmanlarımız var. Dolayısıyla [FROM.GetAdjective] yönetimiyle iş birliği yapmak, özellikle [FROM.GetLeader] sonunda Hizbullah'ı yok etme kararlılığı göz önüne alındığında bölgesel çıkarlarımıza son derece uygun olabilir. Ancak çıkarları sonsuza dek bizimkilerle örtüşmeyebilecek yabancı bir güçle teknoloji paylaşmadan önce bu teklifi dikkatle değerlendirmeliyiz."
 gulf.19.a:0 "Birlikte Hizbullah'a bedelini ödetebiliriz!"
 gulf.19.b:0 "Bu ortaklığa ihtiyacımız yok."
 gulf.20.t:0 "Israil bizimle askeri teknoloji paylasmayi kabul etti!"
 gulf.20.d:0 "İsrail, başlangıçtaki çekincelerine rağmen birlikte hareket ederek Hizbullah belasını yenme şansımızın daha yüksek olduğuna karar verdi. Artık yaklaşan savaşta İsrail'in imkânlarından yararlanabileceğiz."
 gulf.20.a:0 "Birlikte Hizbullah'a bedelini ödetebiliriz!"
 gulf.21.t:0 "Israil bizimle askeri teknoloji paylasmayi reddetti!"
 gulf.21.d:0 "Hizbullah'ın vatandaşlarına yönelik oluşturduğu tehdit konusunda açıkça ikna olmayan İsrail, iki ülke arasındaki askeri iş birliğini artırmayı reddetti."
 gulf.21.a:0 "Zaten onların yardımına ihtiyacımız yok."
 gulf.22.t:0 "[FROM.GetAdjective] hükümeti Hizbullah'i ortadan kaldirmak için ortak bir operasyon önerdi"
 gulf.22.d:0 "[FROM.GetNameDef] temsilcileri, Hizbullah'ın her iki ülkemiz için oluşturduğu ciddi tehdit karşısında bu tehlikeli terör grubuna karşı bir askeri operasyona katılmaya istekli olup olmadığımızı sordu. Bu operasyona katılıp katılmamaya ya da barışı korumaya karar vermeliyiz."
 gulf.22.d1:0 "[FROM.GetNameDef] temsilcileri, İsraillilerle birlikte Lübnan'da Hizbullah'a karşı askeri bir harekât başlatmayı planladıklarını bize bildirdi. Hizbullah'ı terör örgütü olarak tanımlamış ve İsrail'in kendini savunma hakkına bağlı olsak da, bu askeri harekât Orta Doğu'da daha fazla istikrarsızlık doğurabilir. Seçeneklerimizi buna göre tartmalıyız."
 gulf.22.d2:0 "[FROM.GetNameDef] temsilcileri, Lübnan'da Hizbullah'a karşı askeri bir harekât başlatmayı planladıklarını bize bildirdi. Hizbullah'ı terör örgütü olarak tanımlamış ve Hizbullah'ın tehdit ettiği İsrail güvenliğine bağlı olsak da, bu askeri harekât Orta Doğu'da daha fazla istikrarsızlık doğurabilir. Seçeneklerimizi buna göre tartmalıyız."
 gulf.22.d3:0 "Amerika Birleşik Devletleri, NATO'yu Lübnan'da Hizbullah'a karşı ortak bir askeri harekâta katılmaya çağırdı. Şüphesiz zor olacak bir askeri girişime kuvvetlerimizi gönderip göndermeyeceğimizi değerlendirmeliyiz."
 gulf.22.a:0 "Ortak kuvvetlerimiz teröristleri yok edecek!"
 gulf.22.b:0 "Savaş istemiyoruz."
 gulf.22.c:0 "NATO'yu operasyona katılmaya çağırmalıyız!"
 gulf.22.e:0 "İstedikleri gibi yapabilirler."
 gulf.22.f:0 "Bu operasyonun gerçekleşmesine izin verilemez!"
 gulf.23.t:0 "Israil, Hizbullah'a karsi ortak operasyonu kabul etti!"
 gulf.23.d:0 "İsrailliler, Lübnan'ın Hizbullah denetimindeki bölgelerinin işgaline kuvvet ayırmayı kabul ettiğine göre operasyonumuza devam edebiliriz. Ancak önce Amerikalılara operasyonumuzu bildirip ortak düşmanımızın yok edilmesine katılmaya davet etmek çıkarımıza olabilir. Bunun olumsuz yanı, ABD'nin operasyonumuzu veto edebilmesi ve bizi yine de devam edip etmeme sorusuyla baş başa bırakabilmesidir."
 gulf.23.a:0 "Önce Amerikalılara haber vermeliyiz!"
 gulf.23.b:0 "Beklemeyi göze alamayız."
 gulf.24.t:0 "Israil, Hizbullah'a karsi askeri harekâta katilmayi reddetti!"
 gulf.24.d:0 "Korkak İsrailliler, Hizbullah'a karşı bir savaşta kaybedecek çok şeye sahip. Ancak Hizbullah'ın başka düşmanları da var. Amerikan desteğini sağlarsak Hizbullah'ın tüm NATO'nun gazabıyla yüzleşmesi gerekebilir. Bununla birlikte İsrail'in katılmayı reddetmesi büyük bir aksilik ve geri adım atmayı düşünmek zorunda kalabiliriz."
 gulf.24.a:0 "Amerikalılara yaklaşmalıyız."
 gulf.24.b:0 "Tek başımıza gitmeliyiz."
 gulf.24.c:0 "İsrail olmadan bu girişim mahkûmdur."
 gulf.25.t:0 "Amerikalilar operasyonumuza karsi çikmayacak!"
 gulf.25.d:0 "[USA.GetLeader], Hizbullah'a karşı operasyonumuza yeşil ışık yaktı. Daha da iyisi, Amerikalılar teröristleri yok etmemize yardım edecek istekli NATO üyelerinden bir koalisyon kurma sözü verdi!"
 gulf.25.d1:0 "[USA.GetLeader], Hizbullah'a karşı operasyonumuza yeşil ışık yaktı. Amerika, haklı savaşımızın önüne çıkmayacak."
 gulf.25.a:0 "Devam edebiliriz!"
 gulf.26.t:0 "Amerikalilar geri adim atmamizi istiyor!"
 gulf.26.d:0 "[USA.GetLeader], Hizbullah'a karşı askeri operasyona yeşil ışık yakmayı reddetti ve anlaşmazlıklarımızı diplomatik yollarla çözmemizi istedi. Amerikalıları görmezden gelip yine de devam edebiliriz, ancak bu şüphesiz önemli bir müttefikle ilişkilerimize zarar verecektir."
 gulf.26.a:0 "Her şeye rağmen devam etmeliyiz!"
 gulf.26.b:0 "Amerikalılara karşı çıkmayı göze alamayız."
 gulf.27.t:0 "Hizbullah'a Savas Ilaninin Ardindan Lübnan'da Savas"
 gulf.27.d:0 "İsrail ve [FROM.GetNameDef] liderleri, [ISR.GetLeader] ve [FROM.GetLeader]'in Hizbullah'ı bölgesel istikrar için tehdit olarak sert biçimde eleştiren ortak açıklamasının ardından askeri bir operasyon başlattı. [USA.GetLeader] operasyonu alenen destekledi ve NATO üyelerini, birçok Avrupa, Kuzey Amerika ve Orta Doğu ülkesi tarafından terör örgütü olarak tanımlanan Hizbullah'a karşı yürütülen taarruza askeri destek vermeye çağırdı. Lübnan hükümeti ile Hizbullah lideri [HEZ.GetLeader] ve İranlı destekçileri, [ISR.GetAdjective] ve [FROM.GetAdjective] düşmanlık ilanına öfkeyle tepki gösterdi."
 gulf.27.d1:0 "İsrail ve [FROM.GetNameDef] liderleri, [ISR.GetLeader] ve [FROM.GetLeader]'in Hizbullah'ı bölgesel istikrar için tehdit olarak sert biçimde eleştiren ortak açıklamasının ardından askeri bir operasyon başlattı. [USA.GetLeader] operasyonu açıkça desteklemedi ancak birçok Avrupa, Kuzey Amerika ve Orta Doğu ülkesi tarafından terör örgütü olarak tanımlanan Hizbullah'ın şiddet eylemlerini kınadı. Lübnan hükümeti ile Hizbullah lideri [HEZ.GetLeader] ve İranlı destekçileri, [ISR.GetAdjective] ve [FROM.GetAdjective] düşmanlık ilanına öfkeyle tepki gösterdi."
 gulf.27.d2:0 "İsrail ve [FROM.GetNameDef] liderleri, [ISR.GetLeader] ve [FROM.GetLeader]'in Hizbullah'ı bölgesel istikrar için tehdit olarak sert biçimde eleştiren ortak açıklamasının ardından askeri bir operasyon başlattı. [USA.GetLeader] operasyon hakkında yorum yapmadı, ancak bildirildiğine göre [ISR.GetAdjective] ve [FROM.GetAdjective] liderlere, birçok Avrupa, Kuzey Amerika ve Orta Doğu ülkesi tarafından terör örgütü olarak tanımlanan Hizbullah'a karşı operasyonu yürütmemelerini söyledi. Lübnan hükümeti ile Hizbullah lideri [HEZ.GetLeader] ve İranlı destekçileri, [ISR.GetAdjective] ve [FROM.GetAdjective] düşmanlık ilanına öfkeyle tepki gösterdi."
 gulf.27.d3:0 "[FROM.GetNameDef] hükümeti, [FROM.GetLeader]'in Hizbullah'ı bölgesel istikrar için tehdit olarak sert biçimde eleştiren açıklamasının ardından askeri bir operasyon başlattı. [USA.GetLeader] operasyonu alenen destekledi ve NATO üyelerini, birçok Avrupa, Kuzey Amerika ve Orta Doğu ülkesi tarafından terör örgütü olarak tanımlanan Hizbullah'a karşı yürütülen taarruza askeri destek vermeye çağırdı. Lübnan hükümeti ile Hizbullah lideri [HEZ.GetLeader] ve İranlı destekçileri, [FROM.GetAdjective] düşmanlık ilanına öfkeyle tepki gösterdi."
 gulf.27.d4:0 "[FROM.GetNameDef] hükümeti, [FROM.GetLeader]'in Hizbullah'ı bölgesel istikrar için tehdit olarak sert biçimde eleştiren açıklamasının ardından askeri bir operasyon başlattı. [USA.GetLeader] operasyonu açıkça desteklemedi ancak birçok Avrupa, Kuzey Amerika ve Orta Doğu ülkesi tarafından terör örgütü olarak tanımlanan Hizbullah'ın şiddet eylemlerini kınadı. Lübnan hükümeti ile Hizbullah lideri [HEZ.GetLeader] ve İranlı destekçileri, [FROM.GetAdjective] düşmanlık ilanına öfkeyle tepki gösterdi."
 gulf.27.d5:0 "[FROM.GetNameDef] hükümeti, [FROM.GetLeader]'in Hizbullah'ı bölgesel istikrar için tehdit olarak sert biçimde eleştiren açıklamasının ardından askeri bir operasyon başlattı. [USA.GetLeader] operasyon hakkında yorum yapmadı. Lübnan hükümeti ile Hizbullah lideri [HEZ.GetLeader] ve İranlı destekçileri, [FROM.GetAdjective] düşmanlık ilanına öfkeyle tepki gösterdi."
 gulf.27.a:0 "Teröristlerin yokluğu hissedilmeyecek."
 gulf.27.b:0 "Bu, Lübnan egemenliğinin açık bir ihlalidir!"
 gulf.28.t:0 "[FROM.GetLeader] Israil Isgalini Kinadi"
 gulf.28.d:0 "Körfez devletleri son yıllarda pragmatik bir yaklaşımı tercih ederek İsrail'le yüzleşmekten kaçınma eğiliminde olsa da [FROM.GetNameDef], geleneksel tutumundan ayrılarak İsrail devletini yüksek sesle kınamaya başladı. Bu eğilim bugün [FROM.GetLeader]'in alışılmadık derecede sert ifadeler içeren bir açıklamasıyla doruğa ulaştı. Birçok kişi bu açıklamayı boş bir söylem olarak değerlendirse de, diğerleri konuşmadaki şiddet imgelerini şiddet yoluna destek verildiğinin ima edilmesi olarak yorumladı."
 gulf.28.a:0 "Arap-İsrail çatışması kızışıyor."
 gulf.29.t:0 "[FROM.GetLeader] Iran Saldirganligini Kinadi"
 gulf.29.d:0 "Son olaylarda bölgesel istikrarsızlığın kayda değer biçimde artmasının ardından İran'ın Orta Doğu'daki müdahalesini çarpıcı biçimde artırdığı görüldü. İran, faaliyetlerinin savunma amaçlı olduğunu ve düşmanca olmadığını savunsa da [FROM.GetNameDef] gibi birçok ülke bu faaliyetlere artan kaygıyla baktı; bu kaygı bugün [FROM.GetLeader]'in İran dış politikasına yönelik sert bir kınamasıyla doruğa ulaştı.\n\nBu açıklama, daha önce ılık seyreden [FROM.GetAdjective]-İran ilişkilerinin açık düşmanlığa dönüşerek kayda değer biçimde gerilemesinin ardından geldi. Bu ilişkinin ne kadar daha bozulacağı ve bunun sonuçlarının ne olacağı henüz belli değil."
 gulf.29.a:0 "Birinin İran'a karşı durmasının zamanı gelmişti!"
 gulf.29.b:0 "İran'ın ulusal çıkarlarını savunma hakkı vardır!"
 gulf.30.t:0 "[FROM.GetNameDef] Iran'a Önleyici Saldiri Öneriyor"
 gulf.30.d:0 "İran rejiminin düşmanca ve istikrarsızlaştırıcı eylemlerini gerekçe gösteren [FROM.GetLeader], geç olmadan harekete geçmemizi isteyerek ülkemizi [FROM.GetNameDef] ile birlikte İran'a önleyici bir saldırıya katılmaya çağırdı. İran'ın eylemleri [ROOT.GetAdjective] halkını endişelendirebilirse de, oluşturduğu tehdidin sallantılı bir hukuki zemin üzerinde agresif askeri eylemi gerektirecek ölçüde yeterli olup olmadığını değerlendirmeliyiz."
 gulf.30.a:0 "İran tehdidi ortadan kaldırılmalı!"
 gulf.30.b:0 "Orta Doğu siyaseti bizi ilgilendirmez."
 gulf.30.c:0 "[FROM.GetAdjective] maceracılığından kazanacağımız hiçbir şey yok."
 gulf.31.t:0 "[USA.GetLeader] Iran'la Savasi Desteklemeyi Reddetti!"
 gulf.31.d:0 "Bölgenin güvenliğinden çok önemsiz iç siyasetle ilgilendiği şüphesiz olan Amerikalılar, baskıcı İran rejimine karşı önleyici eylem teklifimizi reddetmeyi seçti."
 gulf.31.a:0 "İşleri kendi ellerimize almalıyız!"
 gulf.31.b:0 "Bu büyüklükte bir operasyona hazır değiliz..."
 gulf.32.t:0 "Gönüllüler Koalisyonu Iran'i Isgale Basladi"
 gulf.32.d:0 "[FROM.GetLeader] bugün, İran nükleer tesislerini kalıcı olarak kapatmak ve İran İslam Cumhuriyeti'nin müdahaleci dış politikasını sürdürme yeteneğini felce uğratmak üzere gönüllüler koalisyonunun kurulduğunu duyurdu. Koalisyonun, İran'ın bölgedeki faaliyetlerinden tehdit hisseden bir Arap monarşisinin isteği üzerine kurulduğu bildiriliyor. [PER.GetLeader], koalisyonun kurulmasını sert biçimde kınayarak uluslararası toplumu, uluslararası hukukun ağır bir ihlali ve devlet egemenliği normuna açık bir saldırı olarak nitelendirdiği bu adımı kınamaya çağırdı. İran Devrim Muhafızları Ordusu, koalisyonu kan kaybından öldüreceğine yemin etti; bir Devrim Muhafızları komutanı, İran topraklarına ayak basan tek bir yabancı askerin ülkeden sağ çıkamayacağı uyarısında bulundu."
 gulf.32.d1:0 "[FROM.GetLeader] bugün, İran nükleer tesislerini kalıcı olarak kapatmak ve İran İslam Cumhuriyeti'nin müdahaleci dış politikasını sürdürme yeteneğini felce uğratmak üzere gönüllüler koalisyonunun kurulduğunu duyurdu. Koalisyonun, İran'ın bölgedeki faaliyetlerinden tehdit hisseden bir Arap monarşisinin isteği üzerine kurulduğu bildiriliyor. [PER.GetLeader], koalisyonun kurulmasını sert biçimde kınayarak uluslararası toplumu, uluslararası hukukun ağır bir ihlali ve devlet egemenliği normuna açık bir saldırı olarak nitelendirdiği bu adımı kınamaya çağırdı. İran Devrim Muhafızları Ordusu, koalisyonu kan kaybından öldüreceğine yemin etti; bir Devrim Muhafızları komutanı, İran topraklarına ayak basan tek bir yabancı askerin ülkeden sağ çıkamayacağı uyarısında bulundu. Ancak raporlar, Huzistan eyaletindeki Arapların hükümete karşı silahlı bir ayaklanma başlattığını ve bunun zaten zorlanan İran ordusu için önemli bir tehdit oluşturduğunu gösteriyor."
 gulf.32.d2:0 "[FROM.GetLeader] bugün, İran nükleer tesislerini kalıcı olarak kapatmak ve İran İslam Cumhuriyeti'nin müdahaleci dış politikasını sürdürme yeteneğini felce uğratmak üzere gönüllüler koalisyonunun kurulduğunu duyurdu. Koalisyonun, İran'ın bölgedeki faaliyetlerinden tehdit hisseden bir Arap monarşisinin isteği üzerine kurulduğu bildiriliyor. [PER.GetLeader], koalisyonun kurulmasını sert biçimde kınayarak uluslararası toplumu, uluslararası hukukun ağır bir ihlali ve devlet egemenliği normuna açık bir saldırı olarak nitelendirdiği bu adımı kınamaya çağırdı. İran Devrim Muhafızları Ordusu, koalisyonu kan kaybından öldüreceğine yemin etti; bir Devrim Muhafızları komutanı, İran topraklarına ayak basan tek bir yabancı askerin ülkeden sağ çıkamayacağı uyarısında bulundu. Ancak raporlar, Sistan-Beluçistan eyaletindeki Beluçların hükümete karşı silahlı bir ayaklanma başlattığını ve bunun zaten zorlanan İran ordusu için önemli bir tehdit oluşturduğunu gösteriyor."
 gulf.32.d3:0 "[FROM.GetLeader] bugün, İran nükleer tesislerini kalıcı olarak kapatmak ve İran İslam Cumhuriyeti'nin müdahaleci dış politikasını sürdürme yeteneğini felce uğratmak üzere gönüllüler koalisyonunun kurulduğunu duyurdu. Koalisyonun, İran'ın bölgedeki faaliyetlerinden tehdit hisseden bir Arap monarşisinin isteği üzerine kurulduğu bildiriliyor. [PER.GetLeader], koalisyonun kurulmasını sert biçimde kınayarak uluslararası toplumu, uluslararası hukukun ağır bir ihlali ve devlet egemenliği normuna açık bir saldırı olarak nitelendirdiği bu adımı kınamaya çağırdı. İran Devrim Muhafızları Ordusu, koalisyonu kan kaybından öldüreceğine yemin etti; bir Devrim Muhafızları komutanı, İran topraklarına ayak basan tek bir yabancı askerin ülkeden sağ çıkamayacağı uyarısında bulundu. Ancak raporlar, Huzistan eyaletindeki Arapların ve Sistan-Beluçistan eyaletindeki Beluçların hükümete karşı eşzamanlı bir silahlı ayaklanma başlattığını ve bunun zaten zorlanan İran ordusu için önemli bir tehdit oluşturduğunu gösteriyor."
 gulf.32.a:0 "İran rejiminin günleri sayılı..."
 gulf.32.b:0 "Bu, çirkin bir saldırganlık eylemidir!"
 gulf.33.t:0 "[FROM.GetNameDef] Yabanci Müdahaleyi Kinadi"
 gulf.33.d:0 "Arap ulusların yeni sömürgeci güçlerin elinde onlarca yıl boyunca çektiği baskıdan yakınan [FROM.GetNameDef] lideri [FROM.GetLeader], önümüzdeki on yıl içinde bölgeyi yabancı nüfuzdan arındıracağına söz verdi. Amerika Birleşik Devletleri ve müttefikleri, hükümet değişikliğinden önce bölgede güvenilir bir ortak sayılan bir ülkeden gelen bu açıklamaya şok ve öfkeyle tepki gösterdi. Rusya ve İran, [FROM.GetNameDef] ülkesinin emperyalizm karşıtı gündemini nominal olarak desteklese de, bu açıklamanın Batı'nın olduğu kadar kendilerinin de Arap dünyasındaki çıkarlarını hedef aldığından endişe duyuyor. [FROM.GetLeader]'in bu söze nasıl uygulayacağı belirsizliğini koruyor."
 gulf.33.a:0 "Sırada ne var?"
 gulf.34.t:0 "[FROM.GetNameDef] Yabanci Askerlerin Çikarilmasini Talep Etti"
 gulf.34.d:0 "Ya onlarla ya da onlara karşı olduğumuzu belirten [FROM.GetNameDef], [ROOT.GetNameDef] dahil her Arap ülkesinin topraklarındaki yabancı askerleri derhal çıkarmasını talep etti. [FROM.GetNameDef] talebini yerine getirmek müttefiklerimizi karşımıza alacak ve bizi yabancı saldırılara karşı daha savunmasız bırakacak, ancak reddetmek savaşa yol açabilir."
 gulf.34.a:0 "Boyun eğmeliyiz."
 gulf.34.b:0 "Sadakat bizim her şeyimiz!"
 gulf.35.t:0 "[FROM.GetNameDef] «Yabanci Usaklara» Savas Ilan Etti"
 gulf.35.d:0 "Yabancı güçleri Orta Doğu'dan çıkarma sözünü yerine getiren [FROM.GetNameDef], yabancı güçlere ait askeri üsleri barındırmayı sürdüren her Orta Doğu ülkesini işgal edeceğine söz verdi. [FROM.GetLeader], [FROM.Capital.GetName] kentinden yaptığı yayında şöyle dedi: «Emperyalizmin 21. yüzyılda yeri yoktur. Arap kardeşlerimize mücadelemize katılma fırsatı verdik ama kendi halklarını yabancılara tercih etmemeyi seçtiler ve şimdi bedelini ödeyecekler. Arap halkını gerekirse her yolla özgürleştireceğiz.»"
 gulf.35.a:0 "Alev alan bir bölge."
 gulf.36.t:0 "[FROM.GetAdjective] yönetimi bize gizlice askeri teçhizat gönderdi!"
 gulf.36.d:0 "[FROM.GetNameDef] hükümeti, kuvvetlerimizin denetimindeki topraklara çok sayıda hafif silahı kaçırmayı başardı. Bu silahlar ortak düşmanlarımıza karşı mücadelemizde bize yardımcı olacak."
 gulf.36.a:0 "Yardım değerli."
 gulf.37.t:0 "[fossil_fuel_industry_name] Halka Arzi Kusursuz Geçti"
 gulf.37.d:0 "[fossil_fuel_industry_name] şirketine duyulan çok yüksek yatırımcı güveni sayesinde halka arzımız rekor meblağlar topladı ve hükümetimizin itibarını hem yurt içinde hem yurt dışında önemli ölçüde güçlendirdi. Daha da önemlisi, toplanan fonlar sermaye fonumuza çok ihtiyaç duyulan kaynağı sağladı."
 gulf.37.a:0 "İnanamıyoruz!"
 shia_terror.1.t:0 "«Hizbullah» Saldirisinda [FROM.GetAdjective] Baskenti Sarsildi"
 shia_terror.1.d:0 "Bu sabahın erken saatlerinde bir [FROM.GetAdjective] hükümet binasının önünde bomba yüklü bir araç patlatıldı; birkaç memur öldü ve yaralandı. Hükümet yetkilileri saldırıdan Hizbullah'ın yerel bir kolunu sorumlu tuttu ve bu sözde grubun faaliyetlerine karşı daha sert önlemler alacaklarına söz verdi; ancak uluslararası uzmanlar [FROM.GetNameDef] ülkesinde örgütlü bir Şii militan grubunun varlığından şüphe duyuyor.\n\nSünni egemenliğindeki hükümete yönelik Şii muhalefeti, Şiilere yönelik algılanan baskıya karşılık büyüdü. [FROM.GetAdjective] hükümeti ise vatandaşlarına kötü muamele ettiği yönündeki suçlamaları reddederek Şii militanları terörist ve Tahran ile Hizbullah'ın Lübnan'daki lideri [HEZ.GetLeader]'in piyonları olarak kınadı. [FROM.GetLeader], hem İran'ı hem Hizbullah'ı [FROM.GetNameDef] ülkesinde İslam devrimini tetiklemeye çalışmakla suçladı."
 shia_terror.1.d1:0 "Bu sabahın erken saatlerinde bir [FROM.GetAdjective] hükümet binasının önünde bomba yüklü bir araç patlatıldı; birkaç memur öldü ve yaralandı. Hükümet yetkilileri saldırıdan Şii militan grup Hizbullah el-Hicaz'ı sorumlu tuttu ve örgütün faaliyetlerine karşı daha sert önlemler alacaklarına söz verdi.\n\nSünni egemenliğindeki hükümete yönelik Şii muhalefeti, Şiilere yönelik algılanan baskıya karşılık büyüdü. [FROM.GetAdjective] hükümeti ise vatandaşlarına kötü muamele ettiği yönündeki suçlamaları reddederek Şii militanları terörist ve Tahran ile Hizbullah'ın Lübnan'daki lideri [HEZ.GetLeader]'in piyonları olarak kınadı. [FROM.GetLeader], hem İran'ı hem Hizbullah'ı [FROM.GetNameDef] ülkesinde İslam devrimini tetiklemeye çalışmakla suçladı."
 shia_terror.1.a:0 "[FROM.GetNameDef] için karanlık bir gün..."
 shia_terror.3.t:0 "Koordineli Saldirilarin Ardindan [FROM.GetAdjective] Birlikleri Konuslandirildi"
 shia_terror.3.d:0 "Şii militanlar [FROM.GetNameDef] genelinde eşzamanlı olarak birden fazla hedefe saldırdı ve ülkenin lideri [FROM.GetLeader] olağanüstü hâl ilan etti. Militanların iyi eğitimli olduğu ve askeri düzeyde silahlara sahip olduğu bildirilirken, roketatarlar ve ağır makineli tüfeklerle [FROM.GetAdjective] özel kuvvetlerine uzun süre direndikleri belirtiliyor. Polis karakolları, hükümet binaları ve hatta bir askeri üs, yerel hükümetin Hizbullah'ın [FROM.GetAdjective] kolu olarak tanımladığı grup tarafından hedef alındı; ayrımcı olarak algılanan hükümet politikalarının ardından bu grubun popülaritesinin hızla arttığı bildiriliyor. [FROM.GetLeader], [FROM.GetAdjective] halkını, «yabancı destekli terör» olarak kınadığı şeyin karşısında birlik olmaya çağırdı ve [FROM.GetAdjective] yönetiminin yerel Şii militanların İran ve Lübnan'daki Hizbullah tarafından desteklendiği yönündeki suçlamalarına atıfta bulundu."
 shia_terror.3.a:0 "Şimdilik yas tutuyoruz. Yakında karşılık vereceğiz."
 shia_terror.5.t:0 "Sii devrimciler hükümete karsi silahlaniyor!"
 shia_terror.5.d:0 "Lübnan'daki Hizbullah'ın sloganlarını kullanan militanlar, hükümetimizi devirmek ve yerine İran İslam Cumhuriyeti'ni model alan bir yönetim kurmak gibi açıkça ifade ettikleri hedefle büyük sayılarda seferber olmaya başladı. Silahlı kuvvetlerimiz bu yüksek düzeyde örgütlü ve iyi silahlanmış hareket karşısında erimekte; bu da ya devrimcilere teslim olmamız ya da dış müdahale talep etmemiz gerektiği anlamına geliyor."
 shia_terror.5.d1:0 "Hizbullah el-Hicaz'a bağlılık iddia eden militanlar, [ROOT.GetAdjective] yönetimine Şii çoğunluklu Katif bölgesinde son vermek ve İran İslam Cumhuriyeti'ni model alan bağımsız bir devlet kurmak gibi açıkça ifade ettikleri hedefle büyük sayılarda seferber olmaya başladı. Militanlar Doğu Eyaleti genelinde stratejik noktaları ele geçirerek kuvvetlerimizi bölgeden fiilen çıkardı. Barışçıl biçimde geri çekilmeye ya da kuvvetlerimize Şii isyancılarla askeri olarak çatışmaları emrini vermeye karar vermeliyiz."
 shia_terror.5.a:0 "İsyana teslim ol."
 shia_terror.5.b:0 "Yarımada Kalkanı'ndan müdahale talep et."
 shia_terror.5.c:0 "İsyanı ezeceğiz!"
 shia_terror.5.e:0 "Açık çatışmayı göze alamayız..."
 shia_terror.5.f:0 "Katif'e geç."
 gcc.1.t:0 "KIK Yüksek Konseyi"
 gcc.1.d:0 "[FROM.GetNameDef] heyeti, KİK'in ortak araştırma çabalarını ilerletmek üzere bir teknoloji paylaşım girişimi kurma önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Bu, kendi araştırma girişimlerimize yardımcı olacak olsa da, zaman ve kaynak harcayarak geliştirdiğimiz araştırmaları olası rakiplerle paylaşmak çıkarımıza olmayabilir. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.2.d:0 "[FROM.GetNameDef] heyeti, ortak pazar kurma önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Bu, KİK vatandaşlarının Körfez genelinde çalışmasına olanak tanıyacak ve KİK üyesi devletler arasında mal ve hizmet ticaretini kolaylaştıracak. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.3.d:0 "[FROM.GetNameDef] heyeti, tek para birimi kurma önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Hâlicî adı verilecek bu ortak para birimi KİK'in küresel finans piyasaları üzerindeki toplu etkisini artıracak, ancak para politikamızın denetimini bırakmamızı gerektirecek. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.4.d:0 "[FROM.GetNameDef] heyeti, ortak savunma anlaşması imzalama önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Bu anlaşma, tüm KİK üyesi devletleri bir üyeye yapılan saldırıyı tüm üyelere yapılmış saldırı saymakla yükümlü kılacak. Bu anlaşmayı imzalamak bizi yabancı tehditlere karşı güvence altına alacak, ancak silahlı kuvvetlerimize taşıyamayabilecekleri ek bir sorumluluk yükleyecek. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.6.d:0 "[FROM.GetNameDef] heyeti, KİK askeri subaylarının eğitimini geliştirmek ve standartlaştırmak üzere bir Körfez Stratejik ve Güvenlik Araştırmaları Akademisi kurma önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.7.d:0 "[FROM.GetNameDef] heyeti, birleşik bir askeri komuta kurma önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Bu, KİK üyesi devletlerin dahil olduğu bir savaş durumunda KİK'in çeşitli ordularının daha etkin biçimde koordine olabilmesi anlamına gelecek. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.8.d:0 "[FROM.GetNameDef] heyeti, sağlam bir askeri ittifak kurma önerisiyle KİK Yüksek Konseyi'nin huzuruna çıktı. Bu iddialı proje, KİK'i NATO'dan bile daha entegre bir ittifaka dönüştürecek ve Körfez'in Arap devletlerini hem tepkisel hem önleyici yollarla savunacak etkili, birleşik bir askeri güç yaratacak. Bu öneri hayata geçerse güvenliğimiz garanti altına alınacak, ancak silahlı kuvvetlerimiz [FROM.GetAdjective] saldırgan bir savaşın içine çekilebilir. Bu öneriyi desteklemeyi mi yoksa veto etmeyi mi seçeceğimizi dikkatle değerlendirmeliyiz."
 gcc.1.a:0 "Bu girişimi destekliyoruz!"
 gcc.1.b:0 "Bu girişime karşıyız!"
 gcc.5.t:0 "[FROM.GetAdjective] heyeti önerimizi desteklemeyi reddetti!"
 gcc.5.d:0 "Kendi egemen işleri üzerindeki denetimi bırakmak istemediğini belirten [FROM.GetNameDef], KİK Yüksek Konseyi'ndeki son önerimizi veto etmeyi seçti. Bu ret, yakın gelecekte Yüksek Konsey'e yeni öneriler sunma yeteneğimizi engelleyecek."
 gcc.5.a:0 "Bölgesel entegrasyon için bir adım geri..."
 gcc.11.t:0 "Körfez Isbirligi Konseyi korumamizi talep ediyor"
 gcc.11.d:0 "KİK temsilcileri bugün başkentimizi ziyaret ederek KİK'in [ROOT.GetAdjective] halkıyla bağlarını yeniden teyit etti. Körfez hükümetleri, sadakatlerine karşılık, bölgedeki saldırgan aktörlerin dış tehditlerine karşı Körfez devletlerini koruma taahhüdümüzün yasalaştırılmasını talep etti."
 gcc.11.a:0 "[ROOT.GetNameDef] müttefiklerinin yanında duruyor."
 gcc.11.b:0 "Onların davası bizim değil."
 gcc.12.t:0 "[FROM.GetAdjective] yönetimi KIK'in güvenligini garanti etmeyi reddetti!"
 gcc.12.d:0 "[FROM.GetLeader], [FROM.GetAdjective] halkının ilişkimize değer verse de KİK'in güvenliğini dış tehditlere karşı garanti ederek kendini taahhüt altına sokmak istemediğini bize bildirdi."
 gcc.12.a:0 "Belki koruma için başka yere yönelmeliyiz..."
 gcc.13.t:0 "Yeni bir garantör seçmek"
 gcc.13.d:0 "Amerikalılara KİK'i düşmanlarından savunmak için artık güvenilemeyeceğinden, korunmak için başka yerlere bakmalıyız."
 gcc.13.a:0 "Türkiye'yle git."
 gcc.13.b:0 "İran'la git."
 gcc.13.c:0 "Hindistan'la git."
 gcc.13.e:0 "Pakistan'la git."
 gcc.13.f:0 "Rusya'yla git."
 gcc.13.g:0 "Kendi güvenliğimizi kendimiz sağlarız."
 gcc.14.t:0 "Körfez Isbirligi Konseyi Ortak Para Birimini Duyurdu"
 gcc.14.d:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] bugün, KİK Yüksek Konseyi'nin KİK genelinde kullanılacak tek bir para birimi kurmayı kabul ettiğini duyurdu. Bu adım, tarihsel olarak uzlaşıya varmakta zorlanan bölgesel bir örgüt olan KİK'in entegrasyonu açısından önemli bir ilerlemeyi temsil ediyor. Ayrıca Körfez devletlerinin ekonomileri, ekonomik iş birliğini artırmaya yönelik geçmiş girişimlere rağmen yalnızca sınırlı ekonomik bağlara sahip; çünkü son derece benzer ekonomik yapıları nedeniyle Körfez devletleri ağırlıklı olarak KİK üyesi olmayan ülkelerle ticaret yapıyor. Hâlicî adı verilen yeni para birimi, çeşitli KİK üyesi devletler arasındaki bu sınırlı ekonomik iş birliğini ilerletmeye ve KİK'in küresel piyasalardaki etkisini artırmaya yardımcı olmayı amaçlıyor."
 gcc.14.a:0 "Körfez devletleri yakınlaşıyor."
 gcc.15.t:0 "Körfez Devletleri Ortak Savunma Anlasmasi Imzaladi"
 gcc.15.d:0 "Körfez İşbirliği Konseyi üyesi devletlerin liderleri, onlarca yıl içinde KİK askeri iş birliğinde atılan en önemli ilerlemeyi temsil eden dönüm noktası niteliğinde bir anlaşmayı imzalamayı kabul etti. Anlaşma, tüm üye devletleri bir dış tehdit tarafından saldırıya uğrayan KİK üyesi devletin yardımına koşmakla yükümlü kılıyor. Ancak yabancı analistler, bu anlaşmanın, ayrı komuta zincirlerini, kurumsal kültürlerini ve teçhizat türlerini koruyan KİK'in çeşitli silahlı kuvvetlerini entegre etmeye yönelik gerçek bir çabayla tamamlanmadığına dikkat çekti. Dolayısıyla KİK, tam bir askeri ittifakın bütünlük düzeyine ulaşmaktan hâlâ çok uzak."
 gcc.15.a:0 "KİK güçleniyor."
 gcc.16.t:0 "Körfez Devletleri Sürpriz Bir Hamleyle Egemenlikten Vazgeçti"
 gcc.16.d:0 "[FROM.GetNameDef] ülkesinin Körfez İşbirliği Konseyi'ndeki nüfuzunda belirgin bir artışın ardından raporlar, [FROM.GetLeader]'in ülkenin nüfuzunu kullanarak diğer KİK üyesi devletleri dış politikalarının denetimini bırakmaya zorladığını gösteriyor. Kurum üzerindeki [FROM.GetAdjective] egemenliği, diğer Körfez devletlerinin bu egemenlik aşınmasına direnemediği ve denetimi [FROM.GetLeader] hükümetine bırakmaktan başka seçeneği olmadığı anlamına geliyor. Bu, [FROM.GetNameDef] ülkesinin Körfez'deki bölgesel hegemon konumunu sağlamlaştırmasına ve Orta Doğu'nun en önde gelen aktörlerinden biri olma statüsünü pekiştirmesine olanak tanıdı."
 gcc.16.a:0 "Körfez'deki güç dengesi sonsuza dek değişti..."
 gcc.17.t:0 "Körfez Devletleri Birleserek Hâlic Devleti'ni Kurdu"
 gcc.17.d:0 "Körfez'in Arap devletleri, Körfez İşbirliği Konseyi'nin bölgeselleşme projesini mantıksal sonucuna taşıyarak, son aylarda KİK içindeki denetimi pekiştiren [FROM.GetLeader]'in liderliğinde birleşti. Arapçada «Körfez» anlamına gelen Hâlic adlı yeni ulus, dünya toplam petrol rezervlerinin neredeyse yarısını denetleyerek Orta Doğu'da güçlü bir güç oluşturuyor. Hâlic'in kuruluşu, Arap Körfez devletlerinin yabancı hamilerden bağımsız olarak uluslararası arenada kendi konumlarını güvence altına alma arzusunun sembolü olarak övülüyor."
 gcc.17.a:0 "Mutlu Hâlicî Ulusal Günü!"
 gcc.18.t:0 "[FROM.GetLeader] Gizli Toplanti Düzenledi"
 gcc.18.d1:0 "[FROM.GetNameDef] hükümeti, [BHR.GetNameDef] ülkesinde yaşanan siyasi çalkantıyı artan bir endişeyle izliyor. Bu endişe nedeniyle [FROM.GetAdjective] yönetimi, [BHR.GetNameDef] ülkesindeki çalkantının KİK birliği üzerindeki olumsuz sonuçlarını hafifletmek ve yeni [BHR.GetAdjective] hükümetini cezalandırmak için [BHR.GetNameDef] ülkesinin KİK'ten çıkarılmasını önerdi. [BHR.GetAdjective] temsilcilerinin davet edilmediği bu gizli toplantının sonuçları, [BHR.GetNameDef] ülkesinin KİK üyeliğinin geleceğini belirleyecek."
