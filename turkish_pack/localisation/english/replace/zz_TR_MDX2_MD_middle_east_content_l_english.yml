 gcc.20.a:0 "Arap Körfezi için belirsiz zamanlar."
 gcc.21.t:0 "[FROM.GetNameDef] Körfez Isbirligi Konseyi'ne Katildi"
 gcc.21.d:0 "[FROM.GetNameDef], uzun bir katılım sürecinin ardından, [SAU.GetNameDef], [BHR.GetNameDef], [KUW.GetNameDef], [OMA.GetNameDef], [QAT.GetNameDef] ve [UAE.GetNameDef] tarafından kurulan bölgesel örgüt Körfez İşbirliği Konseyi'ne üyelik elde etmeyi başardı. Bu gelişme, uzun süredir saflarına yeni üye almaya mesafeli duran KİK için önemli bir genişleme anlamına geliyor. [FROM.GetNameDef] artık KİK üyeliğinin sağladığı ekonomik, siyasi ve askeri bir dizi avantajdan yararlanabilecek."
 gcc.21.a:0 "KİK güçleniyor..."
 gcc.22.t:0 "[FROM.GetAdjective] Taraf, KIK'e Toplu Silah Satisi Talep Ediyor"
 gcc.22.d:0 "Körfez İşbirliği Konseyi tarihsel olarak [ROOT.GetAdjective] hükümetiyle yakın durmuştur ve bu nedenle [ROOT.GetAdjective] hükümetinin Arap dünyasındaki önemli bir müttefikidir. [FROM.GetAdjective] tarafı, KİK'e toplu silah satışına izin vermenin, KİK üyelerine çok ihtiyaç duydukları silahları sağlayarak ve kuvvetlerinin birlikte çalışabilirliğini artırarak ortak düşmanlarımıza karşı savunma yapmalarına yardımcı olacağını savunuyor."
 gcc.22.a:0 "Silahları verelim."
 gcc.22.b:0 "Onlara kendimiz için ihtiyacımız var."
 gcc.23.t:0 "[FROM.GetNameDef] KIK'e Toplu Silah Satisini Sonuçlandirdi"
 gcc.23.d:0 "Körfez İşbirliği Konseyi üyesi devletlerin talebi üzerine [FROM.GetAdjective] yönetimi, örgüte bir bütün olarak toplu silah satışını onayladı. Bu adım, KİK'in artan birliğinin bir işareti olarak görülüyor; zira geçmişte KİK'in çeşitli orduları entegre ve koordineli değildi ve farklı tedarikçilerden silah alınması bu durumu daha da ağırlaştırıyordu. [FROM.GetLeader], bu satışın KİK'in Ortadoğu'daki ortak tehditlerle daha etkili mücadele etmesine yardımcı olacağı umudunu dile getirdi. KİK'i oluşturan Arap Körfezi devletleri ise bu anlaşmanın başarıya ulaşmasından duydukları memnuniyeti ifade etti."
 gcc.24.t:0 "[FROM.GetNameDef], Yeni KIK Üyesine Destek Için Bize Baski Yapiyor"
 gcc.24.d:0 "[pressured_to_accept] şu anda Körfez İşbirliği Konseyi üyeliği için başvuruda bulunuyor ve bu girişimde [FROM.GetNameDef] tarafından destekleniyor. [pressured_to_accept] için yürütülen çabaya bizim de destek verip vermeyeceğimizi değerlendirmeliyiz."
 gcc.24.a:0 "Bu devlet üyeliği hak ediyor!"
 gcc.24.b:0 "Bu ülkenin üyeliğini desteklemeyi reddediyoruz!"
 gcc.25.t:0 "KIK, [FROM.GetNameDef] Ülkesine Resmen Davet Gönderdi"
 gcc.25.d:0 "Bir zamanlar [BHR.GetNameDef], [KUW.GetNameDef], [OMA.GetNameDef], [QAT.GetNameDef], [SAU.GetNameDef] ve [UAE.GetNameDef] olmak üzere altı kurucu üyeyle sınırlı olan Körfez İşbirliği Konseyi, yeni bir üye devleti kabul etmeye karar verdi. KİK Genel Sekreteri bugün, belirli ekonomik koşullar yerine getirildiğinde KİK üyeliğiyle sonuçlanacak bir katılım sürecini başlatmak üzere [FROM.GetNameDef] ülkesine resmen davet gönderildiğini duyurdu. Bildirildiğine göre [FROM.GetNameDef], kişi başı GSYİH'yi 10.000$ düzeyine çıkararak kalkınmada ilerleme kaydettiğini göstermek zorunda olacak. Mevcut KİK üyeleri, [FROM.GetNameDef] ekonomisine yatırım yaparak bu hedefe ulaşmasına yardım edeceklerine söz verdi."
 gcc.25.a:0 "Konsey genişliyor..."
 gcc.26.t:0 "[FROM.GetNameDef] KIK Ortak Tatbikatlarina Ev Sahipligi Yapmayi Teklif Ediyor"
 gcc.26.d:0 "[FROM.GetNameDef] heyeti, dış tehditlere karşı korunmaya yardımcı olmak üzere Körfez İşbirliği Konseyi üyesi devletler arasında ortak bir tatbikat önerdi. Bu, [ROOT.GetAdjective] askerleri için faydalı bir deneyim kazanma fırsatı olabilir."
 gcc.26.a:0 "Askerlerimiz bu pratiği takdir edecek!"
 gcc.26.b:0 "Katılmayı reddediyoruz!"
 peace_plan.1.t:0 "[FROM.GetNameDef] Ortadogu Baris Plani Öneriyor"
 peace_plan.1.d:0 "Oslo Anlaşmaları'nın başaramadığını başarmak amacıyla [FROM.GetLeader], İsrail ve Filistin halkları arasında kalıcı bir barış sağlamaya yönelik yeni bir girişim duyurdu. Planın ayrıntıları henüz açıklanmamış olsa da [ISR.GetAdjective] yönetimi, [FROM.GetAdjective] arabuluculuğundaki bir barışa temkinli desteğini şimdiden belirtti. Bu yeni girişimin büyük olasılıkla ele alacağı konular arasında Filistinlilerin geri dönüş hakkı, Batı Şeria'daki İsrail yerleşimleri, Kudüs'ün statüsü ve Filistin devletinin kurulması yer alıyor."
 peace_plan.1.d1:0 "Oslo Anlaşmaları'nın başaramadığını başarmak amacıyla [FROM.GetLeader], İsrail ve Filistin halkları arasında kalıcı bir barış sağlamaya yönelik yeni bir girişim duyurdu. Planın ayrıntıları henüz açıklanmamış olsa da [PAL.GetAdjective] yönetimi, [FROM.GetAdjective] arabuluculuğundaki bir barışa temkinli desteğini şimdiden belirtti. Bu yeni girişimin büyük olasılıkla ele alacağı konular arasında Filistinlilerin geri dönüş hakkı, Batı Şeria'daki İsrail yerleşimleri, Kudüs'ün statüsü ve Filistin devletinin kurulması yer alıyor."
 peace_plan.1.a:0 "Yine mahkûm bir barış anlaşması daha..."
 peace_plan.2.t:0 "Birinci Konu: Geri Dönüs Hakki"
 peace_plan.2.d:0 "1948 Arap-İsrail Savaşı, Filistinlilerin felaket anlamına gelen el-Nakba dediği olayla sonuçlandı. Bu olay, Filistin nüfusunun İsrail denetimindeki topraklardan kitlesel olarak göç etmesine ve komşu Arap ülkelerinde büyük mülteci kamplarının kurulmasına yol açtı. Birçok hükümet Filistinli mültecilere vatandaşlık vermediği için bu mülteciler çoğu zaman çalışma hakkından ve kamu hizmetlerine erişimden yoksun bırakılarak tehlikeli bir yaşam sürüyor. Mülteciler, ailelerinin 1948 öncesinde sahip olduğu evlere dönmeyi özlüyor; ancak bu mültecilere ait eski toprakların büyük bölümünde artık İsraillilerin yaşıyor olması, sorunun çözümünü zorlaştırıyor.\n\nFilistinlilerin geri dönüş hakkını savunmayı seçersek İsrail, milyonlarca olabilecek mültecinin İsrail yönetimindeki topraklara dönüşünü kabul etmek zorunda kalacak. Savunmamayı seçersek bunun yerine mali tazminat ile Filistinli mültecilerin Arap ev sahibi devletlerde bütünleştirilmesi veya Batı Şeria'ya yerleştirilmesi için destek önerebiliriz."
 peace_plan.2.a:0 "Geri dönüş hakkını savunmalıyız."
 peace_plan.2.b:0 "Geri dönüş hakkını savunmamalıyız."
 peace_plan.3.t:0 "Ikinci Konu: Bati Seria'daki Yerlesimler"
 peace_plan.3.d:0 "İsrail'in 1967 Altı Gün Savaşı'ndaki zaferinin ve Batı Şeria'nın denetimini Ürdün'den almasının hemen ardından, El Halil'de bir otelde kalan bir grup Siyonist aktivist oradan ayrılmayı reddetti. İsrail hükümeti, Batı Şeria'daki ilk Yahudi yerleşimini kurarak aktivistlerle uzlaşmaya çalıştı ve böylece Filistinli çobanların o araziyi kullanmaya devam etmesini engelledi. Bu olay, bugüne kadar süren bir eğilimi başlattı; yüzü aşkın yerleşim kuruldu ve bu durum Filistin nüfusunun giderek artan hoşnutsuzluğuna yol açtı.\n\nÖnerilen olası çözümlerden biri, İsraillilerin Filistinlilere bir miktar toprak vermesi karşılığında İsrail topraklarının yerleşimlerin bulunduğu araziyi kapsayacak şekilde genişletilmesidir. Ancak takas edilecek arazinin tam oranı hâlâ tartışma konusu."
 peace_plan.3.a:0 "Yerleşimler sökülmeli."
 peace_plan.3.b:0 "Yerleşimler kalmalı ve toprak takaslarında İsrail kayırılmalı."
 peace_plan.3.c:0 "Yerleşimler kalmalı ve toprak takaslarında Filistin kayırılmalı."
 peace_plan.4.t:0 "Üçüncü Konu: Kudüs'ün Kaderi"
 peace_plan.4.d:0 "Kudüs; İslam, Yahudilik ve Hristiyanlık için büyük manevi önem taşıyan bir şehirdir. Bu nedenle statüsü son derece hassas bir konu olmuştur; İsrailliler şehrin tamamının denetimini elinde tutmak isterken Filistinliler, Doğu Kudüs'ün bağımsız bir Filistin devletinin başkenti olmasında ısrar etmiştir. Kudüs konusunda İsrail ya da Filistin tarafını kayırmayı seçmenin yanı sıra, şehri Birleşmiş Milletler'in başlangıçta öngördüğü gibi uluslararasılaştırarak her iki devletin de elinin dışında tutma seçeneğimiz de var."
 peace_plan.4.a:0 "Şehir Filistinlilerin olmalı."
 peace_plan.4.b:0 "İsrailliler şehri elinde tutmalı."
 peace_plan.4.c:0 "Kudüs uluslararasılaştırılmalı."
 peace_plan.5.t:0 "Dördüncü Konu: Filistin Devleti"
 peace_plan.5.d:0 "İsrail, böyle bir devletin İsrail için oluşturacağı olası güvenlik tehdidi nedeniyle tarihsel olarak bağımsız bir Filistin devletinin kurulmasına karşı çıkmıştır. Bunun yerine İsrailliler, egemenliğin İsrail'de kaldığı, silahsızlandırılmış ve yalnızca kısmen özerk bir Filistin yapısının kurulmasını tercih etmiştir. Filistinliler ise 1967 öncesi sınırlara dayanan, Batı Şeria ve Gazze'de tam bağımsız bir Filistin devleti istemiştir."
 peace_plan.5.a:0 "Filistinlilerin bir devleti olmalı."
 peace_plan.5.b:0 "Filistin egemenliği sınırlı olmalı."
 peace_plan.6.t:0 "[FROM.GetAdjective] Baris Önerisi Açiklandi!"
 peace_plan.6.d:0 "[FROM.GetAdjective] önerisinin Batı Şeria'daki İsrail yerleşimleri, Filistin devleti, Filistinlilerin geri dönüş hakkı ve Kudüs'ün statüsü gibi temel konulardaki kaygılarımızı giderip gidermediğini değerlendirmeliyiz."
 peace_plan.6.a:0 "Bu anlaşma bizim için kabul edilebilir."
 peace_plan.6.b:0 "Böyle bir anlaşmayı kabul etmemiz beklenemez!"
 peace_plan.7.t:0 "Israil ve Filistin Yönetimi Dönüm Noktasi Niteliginde Bir Baris Anlasmasi Imzaladi"
 peace_plan.7.d:0 "[FROM.GetNameDef] arabuluculuğunda hazırlanan barış önerisi İsrail ve Filistin Yönetimi temsilcileri tarafından kabul edildi; bu, İsrail-Filistin ilişkilerinde bir dönüm noktasının habercisi. Her iki tarafta da bazı muhalifler anlaşmayı eleştirmiş olsa da her iki toplumun çoğunluğunun anlaşmayı kabul etmesi, analistlerin bu muhaliflerin anlaşmayı baltalamaya çalışma ihtimalinin nispeten düşük olduğu sonucuna varmasına yol açtı. Dünya liderleri bu başarıya olumlu karşılık verdi, ancak anlaşma hükümlerinin uygulanması gerektiğinden barış sürecinin tamamlanmaktan hâlâ uzak olduğu konusunda uyardı. [FROM.GetLeader], temkinli olunması yönündeki bu açıklamalara, barışın henüz sağlanmadığını kabul ederek yanıt verdi; ancak hem İsrail hem de Filistin'in barışa gösterdiği bağlılığın emsalsiz niteliğini vurgulamaya çalıştı."
 peace_plan.7.a:0 "Tarihî bir an!"
 peace_plan.8.t:0 "[FROM.GetNameDef] Baris Anlasmasini Reddetti"
 peace_plan.8.d:0 "[FROM.GetAdjective] heyeti barış önerimizi karşı tarafa aşırı yanlı bulduğu için reddetti."
 peace_plan.8.a:0 "Girişimimiz başarısız oldu..."
 uae_royal.1.t:0 "Seyh Zayed'in Ölümü"
 uae_royal.1.d1:0 "Birleşik Arap Emirlikleri, Müslüman dünyasının hatırı sayılır bir kesimiyle birlikte bugün yas tutuyor; hasta BAE cumhurbaşkanı Şeyh Zayed bin Sultan Al Nahyan hayatını kaybetti. Şeyh Zayed, bir zamanlar bölünmüş olan emirlikleri birleştirmedeki rolü nedeniyle BAE'de ulusun kurucu babası olarak saygı görüyor. Şeyh ayrıca BAE'nin Suudi Arabistan ve Batı ile ittifaklarını pekiştirmesi, ülkeyi Teröre Karşı Savaş'a taahhüt etmesi ve BM barış gücü operasyonlarında Emirlik rolünü artırmasıyla anılıyor. Şeyh Zayed'in yerine BAE Cumhurbaşkanı ve Abu Dabi Emiri olarak oğlu Halife bin Zayed Al Nahyan geçiyor."
 uae_royal.1.d2:0 "Birleşik Arap Emirlikleri, Müslüman dünyasının hatırı sayılır bir kesimiyle birlikte bugün yas tutuyor; hasta eski BAE cumhurbaşkanı Şeyh Zayed bin Sultan Al Nahyan hayatını kaybetti. Şeyh Zayed, bir zamanlar bölünmüş olan emirlikleri birleştirmedeki rolü nedeniyle BAE'de ulusun kurucu babası olarak saygı görüyor. Yönetiminin son yıllarında eski mutlak monarşi, gücün seçilmiş liderlere devredildiği anayasal bir monarşiye dönüştü. Yine de Şeyh Zayed'in ölümünün BAE'de yaygın biçimde yas tutulmasına yol açması, bu «ulusun babası»nın Emirlikliler için önemini koruduğunu gösteriyor."
 uae_royal.1.d3:0 "Birleşik Arap Emirlikleri, Müslüman dünyasının hatırı sayılır bir kesimiyle birlikte bugün yas tutuyor; hasta eski BAE cumhurbaşkanı Şeyh Zayed bin Sultan Al Nahyan hayatını kaybetti. Şeyh Zayed, bir zamanlar bölünmüş olan emirlikleri birleştirmedeki rolü nedeniyle BAE'de ulusun kurucu babası olarak saygı görüyor. Yönetimi, kraliyet ailesini iktidardan uzaklaştıran ve mutlak monarşinin yerini şimdi [UAE.GetNameDef] olarak bilinen yapıya bırakmasını sağlayan hızlı bir siyasi reform süreciyle anıldı. Artık resmî bir görevi olmasa da Şeyh Zayed, ölümünü yas tutan sadık takipçilerinden oluşan önemli bir çevresini korudu. Ancak [UAE.GetNameDef] nüfusunun çoğunluğu büyük oranda kayıtsız kaldı; küçük bir azınlık ise Şeyh'in ölümünü monarşik yönetimin resmen sona ermesi ve federal cumhuriyetin kurulmasında önemli bir ileri adım olarak açıkça kutladı."
 uae_royal.1.d4:0 "Haberlere göre hasta eski BAE cumhurbaşkanı Şeyh Zayed bin Sultan Al Nahyan hayatını kaybetti. Onun yönetimi altında El Kaide'nin tüm ülkede hâkimiyetini genişletmesiyle Emirlik kraliyet ailesi, eskiden hüküm sürdükleri topraklardan kaçmak zorunda kaldı. Şimdi yurt dışında sürgünde yaşayan kraliyet ailesi, hâlâ Birleşik Arap Emirlikleri dedikleri yere sonunda geri dönmeye yemin etti. Şeyh Zayed'in oğlu Halife bin Zayed Al Nahyan resmen sürgündeki BAE'nin cumhurbaşkanı ilan edildi; ancak monarşiye bağlılık yemini etmeyi sürdüren kişi sayısı nispeten az olduğundan bu unvan pek az yetki sağlıyor."
 uae_royal.1.a:0 "Al Nahyan ailesi için hüzünlü bir gün..."
 uae_royal.2.t:0 "BAE'den Seyh Halife Inme Geçirdi"
 uae_royal.2.d1:0 "BAE Cumhurbaşkanı ve Abu Dabi hükümdarı Şeyh Halife bin Zayed Al Nahyan'ın ağır bir inme geçirdiği bildirildi. Durumunun stabil olmasına rağmen Şeyh'in artık hükümetin günlük işlerini yürütecek durumda olmadığı belirtiliyor. Şeyh'in üvey kardeşi ve Abu Dabi Veliaht Prensi Muhammed bin Zayed Al Nahyan'ın Emirlik devletinin fiilî denetimini ele aldığı bildirildi.\n\nBatılı analistlerce MbZ olarak anılan Muhammed bin Zayed, nispeten genç ama yine de deneyimli bir lider. Geçmiş yıllarda Emirlik ekonomik reformunda aktif rol oynadı; BAE Silahlı Kuvvetleri'nin en prestijli kurumlarından ikisi olan Emirlik Hava Kuvvetleri ve Emir Muhafızları'nda görev yaptı ve bunlara komuta etti."
 uae_royal.2.d2:0 "Eski BAE cumhurbaşkanı ve Abu Dabi emiri Şeyh Halife bin Zayed Al Nahyan'ın ağır bir inme geçirdiği bildirildi. Yönetiminin son yıllarında eski mutlak monarşi, gücün seçilmiş liderlere devredildiği anayasal bir monarşiye dönüştü. Yine de Abu Dabi emiri olarak Şeyh Halife ülkede önemli bir sembolik değeri korumaya devam ediyor."
 uae_royal.2.d3:0 "Eski BAE cumhurbaşkanı ve Abu Dabi emiri Şeyh Halife bin Zayed Al Nahyan'ın ağır bir inme geçirdiği bildirildi. Yönetimi, kraliyet ailesini iktidardan uzaklaştıran ve mutlak monarşinin yerini şimdi [UAE.GetNameDef] olarak bilinen yapıya bırakmasını sağlayan hızlı bir siyasi reform süreciyle anıldı. Artık resmî bir görevi olmasa da Şeyh Halife önemli bir sembolik nüfuzunu koruyor."
 uae_royal.2.d4:0 "Eski BAE cumhurbaşkanı ve Abu Dabi emiri Şeyh Halife bin Zayed Al Nahyan'ın ağır bir inme geçirdiği bildirildi. Onun yönetimi altında El Kaide'nin tüm ülkede hâkimiyetini genişletmesiyle Al Nahyan ailesi, eskiden hüküm sürdükleri topraklardan kaçmak zorunda kaldı. Şimdi yurt dışında sürgünde yaşayan kraliyet ailesi, hâlâ Birleşik Arap Emirlikleri dedikleri yere sonunda geri dönmeye yemin etti. Ancak Şeyh'in geçirdiği inme, bu özlemin gerçekleşmesinin önüne bir engel daha çıkardı."
 uae_royal.2.a:0 "Şeyh'in bir an önce iyileşmesini dileriz..."
 kuwait_royal.1.t:0 "Cabir el-Ahmed es-Sabah'in Ölümü"
 kuwait_royal.1.d1:0 "Kuveyt Emiri Şeyh Cabir el-Ahmed es-Sabah'ın hayatını kaybetmesiyle Kuveyt bugün yas tutuyor. Şeyh Cabir, 2001'deki inmeden bu yana sağlık sorunları yaşıyordu ve Kuveyt tarihinin çalkantılı bir dönemine başkanlık etti. Onun yönetimi altında Kuveyt, meclisin feshedilip yeniden kurulmasına ve Irak güçlerinin işgaline tanık oldu; Şeyh bu süreçte Saddam'ın ordusuna karşı yeraltı direniş hareketini yönetti. Şeyh Cabir'in yerine Kuveyt Emiri olarak, Veliaht Prens Şeyh Saad el-Salim es-Sabah'ın kötü sağlık durumu nedeniyle üvey kardeşi Sabah el-Ahmed es-Sabah geçti."
 kuwait_royal.1.d2:0 "Kuveyt Emiri Şeyh Cabir el-Ahmed es-Sabah'ın hayatını kaybetmesiyle Kuveyt bugün yas tutuyor. Şeyh Cabir, 2001'deki inmeden bu yana sağlık sorunları yaşıyordu ve Kuveyt tarihinin çalkantılı bir dönemine başkanlık etti. Onun yönetimi altında Kuveyt, meclisin feshedilip yeniden kurulmasına ve Irak güçlerinin işgaline tanık oldu; Şeyh bu süreçte Saddam'ın ordusuna karşı yeraltı direniş hareketini yönetti. Ayrıca iktidarının son yıllarında gücün seçilmemiş monarşiden seçilmiş siyasetçilere devredildiği görüldü."
 kuwait_royal.1.d3:0 "Kuveyt Emiri Şeyh Cabir el-Ahmed es-Sabah'ın hayatını kaybetmesiyle Kuveyt bugün yas tutuyor. Şeyh Cabir, 2001'deki inmeden bu yana sağlık sorunları yaşıyordu ve Kuveyt tarihinin çalkantılı bir dönemine başkanlık etti. Onun yönetimi altında Kuveyt, meclisin feshedilip yeniden kurulmasına ve Irak güçlerinin işgaline tanık oldu; Şeyh bu süreçte Saddam'ın ordusuna karşı yeraltı direniş hareketini yönetti. İktidarının son dönemi, kraliyet ailesini iktidardan uzaklaştıran ve monarşinin yerini şimdi [KUW.GetNameDef] olarak bilinen yapıya bırakmasını sağlayan hızlı bir siyasi reform süreciyle anıldı. Artık resmî bir görevi olmasa da Şeyh Cabir, ölümünü yas tutan sadık takipçilerinden oluşan önemli bir çevresini korudu."
 kuwait_royal.1.a:0 "Kuveyt için hüzünlü bir gün..."
 oman_royal.1.t:0 "Sultan Kabus bin Said Al Said'in Ölümü"
 oman_royal.1.d:0 "1970'ten beri Umman'ı yöneten saygıdeğer Sultan maalesef hayatını kaybetti. Sultan Kabus, Umman'ın modernleşmesiyle geniş çevrelerce anılıyor; benzeri görülmemiş bir kalkınma, yaşam standartlarında iyileşme, kölelik uygulamasının kaldırılması ve batıdaki Zufar eyaletinde yaşanan solcu isyanın sona erdirilmesi onun döneminde gerçekleşti. Uluslararası alanda, Umman'ın İran, Suudi Arabistan, Amerika Birleşik Devletleri, Birleşik Krallık ve hatta İsrail ile yakın bağlar kurmasına olanak tanıyan son derece başarılı tarafsız bir dış politikanın mimarı olarak hatırlanıyor.\n\nSultanın çocuğu ya da kardeşi olmadığı ve bir halef ilan etmediği için Umman kraliyet ailesi, halefi ortaklaşa belirlemek zorunda. Sultanlık makamı için en popüler üç aday, Kabus'un amcası Seyyid Tarık bin Teymur Al Said'in çocukları. Esad bin Tarık, diğer Körfez devletlerinin liderleriyle iyi ilişkileri olan, geniş çevrelerce saygı gören eski bir askeri komutan. Şihab bin Tarık, mütevazı bir duruş sergileyen eski bir deniz komutanı; bildirildiğine göre geçmişte siyaset konularında Sultan Kabus'la aynı fikirde olmamaktan çekinmedi. Heysem bin Tarık ise Umman'ın tüccarlarının tercih ettiği isim, ancak siyasi tecrübeden yoksun."
 oman_royal.1.a:0 "Esad'ı seçelim."
 oman_royal.1.b:0 "Şihab'ı seçelim."
 oman_royal.1.c:0 "Heysem'i seçelim."
 SAU.1.t:0 "Dünya Sokta: [LEB.GetLeader] Istifa Etti ve Hizbullah'i Kinadi"
 SAU.1.d:0 "[SAU.GetNameDef] ziyaretinde bulunan Lübnan başbakanı [LEB.GetLeader], bugün yaptığı tuhaf bir açıklamayla, İran ve Hizbullah'ın Lübnan siyasetindeki artan nüfuzu nedeniyle istifa ettiğini duyurdu. Lübnan cumhurbaşkanı ve ülkedeki diğer bazı siyasi figürler, [SAU.GetNameDef] ülkesini başbakanı kaçırmakla ve onu bu açıklamayı yapmaya ve istifasını sunmaya zorlamakla suçladı. Nitekim [LEB.GetLeader] istifası kendi hükümeti tarafından tanınmadı.\n\nBu gelişme, [SAU.GetAdjective] tarafının Hizbullah'a yönelik saldırgan söylemiyle aynı döneme denk geldi; [SAU.GetAdjective] dışişleri bakanı, Hizbullah'ı [SAU.GetNameDef] aleyhine düşmanca faaliyetler yürütmekle suçladı. Olay ayrıca [SAU.GetNameDef] ile [PER.GetNameDef] arasında aylardır artan gerilimin ardından gerçekleşti ve geniş çevrelerce [PER.GetNameDef] ülkesinin Ortadoğu'daki artan nüfuzuna verilmiş bir [SAU.GetAdjective] tepkisi olarak görülüyor."
 SAU.1.a:0 "Çarpıcı gelişmeler."
 SAU_GCC_CRISIS.0.t:0 "Katar Ablukasi"
 SAU_GCC_CRISIS.0.d:0 "1995'te iktidara geldiğinden beri Hamad bin Halife Al Sani, Katar'ın güvenliği ancak kendisini Suudi Arabistan'ın bir uzantısı olmaktan çıkarıp bölgesel nüfuz konusunda Suudi Arabistan'ın rakibine dönüştürerek bulabileceğine inandı. Sonuç olarak Katar, kendi dış politika hedeflerimizle sıklıkla çelişen, alışılmadık derecede girişken bir dış politika izledi. Katar'ın uygunsuz davranışlarına son verme zamanı geldi."
 SAU_GCC_CRISIS.0.a:0 "Ya boyun eğecekler ya da bedelini ödeyecekler."
 SAU_GCC_CRISIS.0.b:0 "Tekrar düşününce, bu riski almamalıyız."
 Blockade:0 "KİK Ablukası"
 Blockade_Trade:0 "KİK Ablukası"
 Decline_Blockade:0 "Ablukaya katılmayı reddetti"
 Trump_Support_Blockade_QAT:0 "Katar Ablukasını destekliyor"
 SAU_GCC_CRISIS.1.t:0 "[FROM.GetAdjective] Tarafindan Katar Ablukasina Katilma Baskisi"
 SAU_GCC_CRISIS.1.d:0 "[FROM.GetNameDef], Katar'a karşı uyguladığı ablukaya katılmamız için bize baskı yapıyor. Katar'la ekonomik ilişkileri sürdürmenin, [FROM.GetNameDef] ülkesinin öfkesini çekmeye değip değmediğini değerlendirmeliyiz."
 SAU_GCC_CRISIS.1.a:0 "Onlara katıl."
 SAU_GCC_CRISIS.1.b:0 "Bu bizim savaşımız değil."
 SAU_GCC_CRISIS.2.t:0 "Ablukayi Destekle"
 SAU_GCC_CRISIS.2.d:0 "[FROM.GetAdjective] öncülüğündeki ablukayı desteklemek, Körfez müttefikimizle ortaklığımızı geliştirmede çok işe yarayacaktır. Ayrıca [FROM.GetNameDef] ülkesinin Katar'ın dış politikasında bir değişim sağlaması çıkarımıza da olabilir."
 SAU_GCC_CRISIS.2.a:0 "Amerika Birleşik Devletleri ablukayı destekliyor!"
 SAU_GCC_CRISIS.2.b:0 "Bu girişimi destekleyemeyiz."
 SAU_GCC_CRISIS.3.t:0 "Katar Diplomatik Krizi"
 SAU_GCC_CRISIS.3.d.1:0 "Birkaç Arap ülkesi Katar ile diplomatik ilişkilerini kesti ve ticaret ambargosu uygulayarak Katar ile [FROM.GetNameDef] arasındaki uzun süredir kaynayan anlaşmazlığı tırmandırdı. [FROM.GetAdjective] öncülüğündeki koalisyonun talepleri arasında Al Cezire'nin kapatılması, İran'la ilişkilerin kesilmesi ve diğer şeylerin yanı sıra Katar'daki bir Türk askeri üssünün kapatılması yer alıyor."
 SAU_GCC_CRISIS.3.d.2:0 "Birkaç Arap ülkesi Katar ile diplomatik ilişkilerini kesti ve ticaret ambargosu uygulayarak Katar ile [FROM.GetNameDef] arasındaki uzun süredir kaynayan anlaşmazlığı tırmandırdı. [FROM.GetAdjective] öncülüğündeki koalisyonun talepleri arasında diğer şeylerin yanı sıra Al Cezire'nin kapatılması ve İran'la ilişkilerin kesilmesi yer alıyor."
 SAU_GCC_CRISIS.3.a:0 "Bu talepler akıl almaz!"
 SAU_GCC_CRISIS.3.b:0 "Talepleri kabul etmeliyiz."
 SAU_GCC_CRISIS.3.c:0 "İlginç"
 SAU_GCC_CRISIS.4.t:0 "Amerika'ya Baski"
 SAU_GCC_CRISIS.4.d:0 "Katar, Ortadoğu'daki en büyük Amerikan askeri üssü olan El Udeyd Hava Üssü'ne ev sahipliği yapıyor. Bu durum, bize ABD'ye muazzam baskı uygulama imkânı sağlıyor ama aynı zamanda Amerikalılardan fiilî bir güvenlik garantisi de veriyor. Amerikan varlığını kaybetmek felaket anlamına gelebilir."
 SAU_GCC_CRISIS.4.a:0 "Riski göze al."
 SAU_GCC_CRISIS.4.b:0 "Buna değmez."
 SAU_GCC_CRISIS.5.t:0 "ABD'nin Katar Baskisina Yaniti"
 SAU_GCC_CRISIS.5.d:0 "Katar, Ortadoğu'daki en büyük Amerikan askeri üssü olan El Udeyd Hava Üssü'ne ev sahipliği yapıyor. Bu üs yalnızca Teröre Karşı Savaş için değil, bölgede güç projeksiyonu için de hayati önem taşıyor. Tutumumuzu koruyup ablukayı destekleyip desteklemeyeceğimize, yoksa tutumumuzu tersine çevirip Katar'la ilişkimize öncelik verip vermeyeceğimize karar vermeliyiz."
 SAU_GCC_CRISIS.5.a:0 "Üs çok önemli."
 SAU_GCC_CRISIS.5.b:0 "Ona ihtiyacımız yok."
 SAU_GCC_CRISIS.6.t:0 "ABD Disisleri Bakanligi Açiklamasi"
 SAU_GCC_CRISIS.6.d:0 "Dışişleri Bakanlığı, Körfez devletlerine, bir başka ABD müttefiki olan Katar ile yaşanan diplomatik çatlak konusunda beklenmedik bir kamuoyu uyarısı yayımladı ve Suudilerin bir krize yol açmış, Amerika Birleşik Devletleri'ni de yanlış gerekçelerle içine çekmiş olabileceğini öne sürdü. Bu sert kınama, Katar'ı abluka altına alan ülkeleri ciddi biçimde zayıflattı ve [QAT.GetLeader] için çok ihtiyaç duyulan bir meşruiyet desteği sağladı."
 SAU_GCC_CRISIS.6.a:0 "Görünüşe göre Amerikalılar en büyük askeri üslerinin nerede olduğunu hatırlamış..."
 SAU_GCC_CRISIS.7.t:0 "Katar Taleplere Yanit Veriyor"
 SAU_GCC_CRISIS.7.d:0 "Katar, ablukacı koalisyonun taleplerini reddetti. Katar dışişleri bakanı, taleplerin Katar'ın egemenliğini ihlal ettiğini belirterek ilişkilerin yeniden kurulması için öne sürülen koşullar listesini «gerçekçi olmayan» ve «uygulanabilir olmayan» olarak niteledi. Ortak basın toplantısında «Mesele terör değil, ifade özgürlüğünün susturulması» dedi. Ablukacı koalisyonun bu reddedişe nasıl yanıt vereceği ise belirsizliğini koruyor."
 SAU_GCC_CRISIS.7.a:0 "Kriz sürüyor..."
 SAU_GCC_CRISIS.8.t:0 "Katar Taleplere Yanit Veriyor"
 SAU_GCC_CRISIS.8.d:0 "Katar, Katar hükümeti ile ablukacı ülkelerin temsilcileri arasındaki uzun görüşmelerin ardından ablukacı koalisyonla bir anlaşmaya vardı. Sonuç olarak Katar, Al Cezire yayın ağını kapatacak ve dış politikasını KİK'in geri kalanıyla uyumlu hale getirecek; böylece Katar'ın bağımsız bir dış politika çizgisiyle flört etmesi sona erecek."
 SAU_GCC_CRISIS.8.a:0 "Yeniden birlik mi?"
 SAU_GCC_CRISIS.9.t:0 "Bahreyn Ablukasi"
 SAU_GCC_CRISIS.9.d:0 "[BHR.GetLeader] iktidara geldiğinden beri Bahreyn'i, dış politikamızla açıkça çelişen ve İran'la yakın ilişkileri alenen hedefleyen bir yola soktu. Bahreyn'in uygunsuz davranışlarına son verme zamanı geldi."
 SAU_GCC_CRISIS.9.a:0 "Ya boyun eğecekler ya da bedelini ödeyecekler."
 SAU_GCC_CRISIS.9.b:0 "Tekrar düşününce, bu riski almamalıyız."
