 gcc.20.t:0 "KIK Bir Üye Devleti Ihraç Etti"
 gcc.20.d1:0 "Körfez İşbirliği Konseyi'nin diğer üyelerinin topladığı gizli bir konferansın ardından [BHR.GetNameDef] örgütten çıkarıldı. KİK'in geri kalan üyeleri kararlarının gerekçesi olarak [BHR.GetNameDef] ülkesindeki «siyasi istikrarsızlığı» gösterdi. [BHR.GetLeader] öfkeyle tepki göstererek bunu, diğer Körfez devletlerinin [BHR.GetNameDef] ülkesinin siyasi ideolojisinin yayılmasını engellemeye yönelik bir komplo yürüttüğünün bir kanıtı daha olarak niteledi."
