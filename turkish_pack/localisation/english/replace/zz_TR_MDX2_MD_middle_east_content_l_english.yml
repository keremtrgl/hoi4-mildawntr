 arab_spring_category_desc:0 "§YArap Baharı§!, 2010'ların başında Ortadoğu ve Kuzey Afrika'yı kasıp kavuran tarihî kitlesel protesto dizisini ifade eder. Yeni binyıla girerken bu hareket, bilginin hızla yayılması ve internetin yükselişiyle körüklenerek her Arap ülkesinin üzerinde bir gölge gibi duruyor. Gerçekten halkın iradesini temsil eden yeni bir Arap dünyası inşa etmek için bu sorunların kök nedenlerini ele almalıyız... ya da iktidar üzerindeki hâkimiyetimizi sıkılaştırmayı seçebiliriz.\n\n§YArap Baharı§! en erken §Y2010§! yılında tetiklenebilir ve §Y2013§! yılına kadar kesinlikle tetiklenecektir. §YArap Baharı§! her ay ülkenizin mevcut ulusal durumuna göre artacak ya da azalacaktır. Arap Baharı, Arap Dünyası'ndaki herhangi bir ülke §Y200§! protesto gücüne ulaştığında ve yıl en az §Y2010§! olduğunda başlayacaktır. Bu gerçekleştiğinde domino taşları devrilecek ve diğer tüm ülkelerde de protestolar tetiklenecektir.\n\nMevcut Protesto Gücü: [arab_protest_strength]  (Değer: [?arab_spring|0Y])\n§YProtesto Gücü§!'nün Mevcut Aylık Değişimi: [?arab_spring_change|0Y].[AS_display_the_current_arab_spring_change]"
