 construction_boom:0 "İnşaat Patlaması"
 oil_dependency:0 "Petrol Bağımlılığı"
 oil_dependency_desc:0 "Bu ülkenin ekonomisi büyük ölçüde petrol ve diğer fosil yakıtların ihracatına bağlıdır. Bu bağımlılık kısa vadede kazançlı olsa da, bu aşırı bağımlılığın sürdürülemez olduğu herkesçe bilinmektedir."
 investors_bonus:0 "Bölgesel Finans Merkezi"
 investors_bonus_desc:0 "Ülkemizin bölgesel bir finans merkezi olarak gelişmesi ekonomimizi canlandırmış ve yatırımlar için cazip koşullar yaratmıştır."
 baath_movement:0 "Hükümet Destekli Baas Hareketi"
 shia_movement:0 "Hükümet Destekli Şii İslamcı Hareket"
 sunni_movement:0 "Hükümet Destekli Sünni İslamcı Hareket"
 pro_western_movement:0 "Hükümet Destekli Liberal Hareket"
 shia_resistance_01:0 "Şii Direnişi - İhmal Edilebilir"
 shia_resistance_01_desc:0 "Şii nüfusumuzun bazı kesimleri zaman zaman hükümetimize karşı içerleme dile getirse de, ülkemizdeki Şiilerin çoğunluğunun yönetimimizle bir sorunu yoktur."
 shia_resistance_02:0 "Şii Direnişi - Düşük"
 shia_resistance_02_desc:0 "Şii nüfus içindeki bazı radikaller hükümetimizin devrilmesi çağrısı yapmış olsa da bu çağrılar büyük oranda karşılık bulmamıştır. Bunun nedeni, hükümetimizin Şii nüfusa karşı görece kötü muamelede bulunmamasıdır."
 shia_resistance_03:0 "Şii Direnişi - Orta"
 shia_resistance_03_desc:0 "Toplumumuzda Şiilerin karşılaştığı bazı engeller ve güçlükler sürdüğü için, düzen karşıtı Şii güçler ülkemizin Şii nüfusu arasında bir miktar destek kazanmıştır. Bununla birlikte Şiiler arasında en yaygın tutum hâlâ şiddete karşı çıkmaktır."
 shia_resistance_04:0 "Şii Direnişi - Hatırı Sayılır"
 shia_resistance_04_desc:0 "Şii nüfusumuzun Sünni emsallerine kıyasla eşitsiz konumu, bazı çevrelerde hükümetimize karşı kayda değer bir muhalefete yol açmıştır. Hükümetimize karşı bir miktar militan faaliyet olsa da bu faaliyetler şimdilik görece marjinal kalmıştır."
 shia_resistance_05:0 "Şii Direnişi - Yüksek"
 shia_resistance_05_desc:0 "Şiilere yönelik ayrımcılık, hükümetimize karşı açıkça dile getirilen önemli düzeyde bir öfkeye yol açmıştır. Daha da endişe verici olan, hükümetin şiddet yoluyla indirilmesini savunan militan Şii gruplara verilen desteğin artmasıdır."
 shia_resistance_06:0 "Şii Direnişi - Aşırı Yüksek"
 shia_resistance_06_desc:0 "Politikalarımız Şiilerin yönetimimize duyduğu düşmanlığı ciddi biçimde artırmış, hükümetimize karşı güç kullanılmasını savunan Şii militan gruplara verilen desteği yükseltmiştir. Ancak bu militan grupların imkânları hâlâ nispeten sınırlıdır ve yalnızca ara sıra küçük saldırılar düzenleyebilmektedirler."
 shia_resistance_07:0 "Şii Direnişi - Ağır"
 shia_resistance_07_desc:0 "Şiilere yönelik tutumumuz, Şii nüfusun büyük çoğunluğunda hükümet karşıtı algıları alevlendirmiştir. Şiiler arasında birçok kişi henüz şiddeti savunmaya başlamamış olsa da, hükümetimize duyulan yaygın nefret, hükümeti devirmek için şiddet kullanılmasına geniş bir destek doğmasına katkıda bulunmuştur."
 shia_resistance_08:0 "Şii Direnişi - Çok Ağır"
 shia_resistance_08_desc:0 "Şii karşıtı politikalarımız, yönetimimize karşı ezici bir Şii muhalefetine yol açmıştır. Bu muhalefetin tamamı silahlı militan gruplara açık destek olarak yansımamış olsa da Şii nüfusun çoğu şiddet yöntemlerini zımnen kabul etmekte, bu da daha cüretkâr saldırılara girişmeye başlayan Şii militan grupları cesaretlendirmektedir."
 shia_resistance_09:0 "Şii Direnişi - Kritik"
 shia_resistance_09_desc:0 "Şii karşıtı politikaları nedeniyle hükümetimize duyulan yaygın nefret, Şii nüfus arasında silahlı militanlığa geniş bir destek doğurmuştur. Bu destek Şii militan grupları cesaretlendirmiş ve büyük saldırılar düzenlemelerine olanak tanımıştır."
 shia_resistance_10:0 "Şii Direnişi - Aşırı Kritik"
 shia_resistance_10_desc:0 "Hükümetimize duyulan neredeyse genel nefret, hükümete karşı silahlı direnişe ezici bir destek doğurmuştur. Şii militan gruplar fon ve eleman bakımından bol imkâna sahiptir ve bu nedenle geniş çaplı, iyi koordine edilmiş operasyonlar yürütebilmektedir."
 aggressive_nationalism:0 "Saldırgan Milliyetçilik"
 defensive_nationalism:0 "Savunmacı Milliyetçilik"
 transnational_shiism:0 "Ulusötesi Şiilik"
 national_shiism:0 "Ulusal Şiilik"
 elected_legislature:0 "Seçilmiş Yasama Organı"
 elected_legislature_desc:0 "Anayasal monarşinin kurulmasının ardından bu ülke, yürütmenin gücüne karşı bir denge unsuru oluşturan seçilmiş bir yasama organı kurmuştur."
 birthplace_of_wahhabism:0 "Vahhabiliğin Doğduğu Yer"
 birthplace_of_wahhabism_desc:0 "Suudi Arabistan, İbn Suud'un askeri gücü ile Muhammed bin Abdülvehhab'ın radikal dinî vizyonu arasındaki ittifak sonucunda kurulmuştur. İkincisinin kurduğu hareket olan Vahhabilik, İslam'ı arındırma ve inancı en eski ve en otantik biçimine döndürme yönündeki ateşli bağlılığıyla diğer İslami doktrinlerden ayrılır. Suudi Arabistan'ın benimsediği Vahhabilik biçimi, çoğu cihatçı grubun benimsediği, Seyyid Kutub'un düşüncesinden etkilenmiş daha devrimci ve popülist Selefilik türlerinin aksine, dinî otoritelere ve hükümete saygıyı vurgular."
 little_sparta:0 "Küçük Sparta"
 little_sparta_desc:0 "BAE tarihsel olarak uluslararası arenada gücünün üzerinde bir ağırlık taşımış, askeri güçlerini dünyanın uzak köşelerindeki çok taraflı askeri harekâtlara göndermiştir. Ülke, güçlü komşusu Suudi Arabistan'la ve Batı'yla yakın bağlar kurmuştur. ABD'li yetkililerin sevgiyle «Küçük Sparta» adını verdiği bu küçük ülke, ikisini birbirine karşı dengeleyerek kendi manevra özgürlüğünü etkin biçimde korumayı başarmıştır."
 omani_neutrality:0 "Umman Tarafsızlığı"
 omani_neutrality_desc:0 "Umman, Sultan Kabus bin Said Al Said'in rehberliğinde izlediği tarafsız ve ılımlı dış politikayla öğünmüştür. Onlarca yıldır Orta Doğu'daki barış girişimlerinin önemli bir destekçisi olmuş ve Arap Yarımadası içindekiler de dahil olmak üzere rakip devletler arasında arabuluculuk yapmada etkili olmuştur."
 home_of_the_baharna:0 "Baharna'nın Yurdu"
 home_of_the_baharna_desc:0 "Bahreyn nüfusunun çoğunluğu, kendilerini Bahreyn'in yerli halkı olarak gören Şii Araplardan oluşur. Bu insanlar, Doğu Arabistan'a uzanan kadim bir Baharna krallığına atıfta bulunur. Bu anlatının tarihsel doğruluğu tartışmalı olsa da, Baharna yurdunun yabancı işgalcileri olarak görülen Sünni Halife hanedanına karşı destek seferber etmede güçlü bir rol oynamıştır."
 legacy_of_the_gulf_war:0 "Körfez Savaşı'nın Mirası"
 legacy_of_the_gulf_war_desc:0 "2 Ağustos 1990'da Saddam Hüseyin'in Irak'ı Kuveyt Devleti'ni işgal etti ve ülkeyi yedi ay boyunca elinde tuttu. Bu süre içinde işgalcilere karşı bir direniş hareketi örgütlendi; mezhep ya da toplumsal sınıf ayrımı gözetmeksizin tüm Kuveytliler işgalcilere karşı savaşmak için bir araya geldi. Bu olay, Kuveyt'in çok daha büyük hasımlara karşı durduğu uzun bir tarih ve eşsiz derecede güçlü bir meclise sahip olmasıyla birlikte, bazı Körfez komşularının aksine Sünnilerle Şiilerin görece sorunsuz biçimde bir arada yaşamasına olanak tanıyan bir Kuveyt ulusal kimliğinin pekişmesine yardımcı olmuştur."
 unrepresentative_government:0 "Temsil Gücü Olmayan Hükümet"
 unrepresentative_government_sunni_desc:0 "Bu ülke Şii çoğunluğa sahip olmasına rağmen bir Sünni hükümet tarafından yönetilmektedir. Bu güç dengesizliği, mezhepsel sürtüşmeye ve adaletsiz ve temsil niteliği taşımayan olarak görülen hükümete karşı halk öfkesine katkıda bulunmuştur."
 unrepresentative_government_shia_desc:0 "Bu ülke Sünni çoğunluğa sahip olmasına rağmen bir Şii hükümet tarafından yönetilmektedir. Bu güç dengesizliği, mezhepsel sürtüşmeye ve adaletsiz ve temsil niteliği taşımayan olarak görülen hükümete karşı halk öfkesine katkıda bulunmuştur."
