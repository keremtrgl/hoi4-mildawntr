 conservative_society:0 "Muhafazakâr Toplum"
 moderately_conservative_society:0 "Ilımlı Muhafazakâr Toplum"
 moderately_liberal_society:0 "Ilımlı Liberal Toplum"
 liberal_society:0 "Liberal Toplum"
 extremely_liberal_society:0 "Aşırı Liberal Toplum"
 large_refugee_population:0 "Büyük Mülteci Nüfusu"
 large_refugee_population_desc:0 "1948 Arap-İsrail Savaşı, Filistinlilerin el-Nekbe, yani felaket dediği olayla sonuçlandı. Bu olay, Filistin nüfusunun İsrail'in denetimindeki topraklardan kitlesel olarak ayrılmasına ve komşu Arap ülkelerinde büyük mülteci kamplarının kurulmasına yol açtı. Birçok hükümet Filistinli mültecilere vatandaşlık vermediği için bu mülteciler, çoğu kez çalışma ve kamu hizmetlerine erişim haklarından yoksun kalarak istikrarsız bir yaşam sürmektedir. Bu mülteciler, ailelerinin 1948'den önce sahip olduğu evlere dönmeyi arzulamaktadır; ancak bu mültecilerin eski topraklarının büyük bölümünde artık İsrailliler yaşadığından, bu sorunun çözümü zordur."
 favorable_boundaries:0 "Elverişli Sınırlar"
 favorable_boundaries_desc:0 "İsrail-Filistin barış anlaşmasının bir sonucu olarak bu bölgenin sınırları kolayca savunulabilir durumdadır."
 unfavorable_boundaries:0 "Elverişsiz Sınırlar"
 unfavorable_boundaries_desc:0 "İsrail-Filistin barış anlaşmasının bir sonucu olarak bu bölgenin sınırları kolayca savunulabilir durumda değildir."
 russian_military_advisors:0 "Rus Askeri Danışmanlar"
 foreign_procurement:0 "Yurt Dışından Tedarik"
 foreign_procurement_desc:0 "Askeri teçhizatı denizaşırı ortaklardan tedarik etmek, ekonomik kapasitemizi başka alanlara yönlendirmemizi sağlar."
 local_arms_industry:0 "Yerli Silah Sanayii"
 local_arms_industry_desc:0 "Gelişmekte olan silah sanayimiz sürekli ilgi gerektirir ve bu nedenle ekonomimizin diğer alanlarından dikkati dağıtır. Ancak bu, yabancı silahlara bağımlılığımızı azaltarak uzun vadede karşılığını verecektir."
 tiny_shia_population:0 "Çok Küçük Şii Nüfusu"
 small_shia_population:0 "Küçük Şii Nüfusu"
 substantial_shia_population:0 "Hatırı Sayılır Şii Nüfusu"
 large_shia_population:0 "Büyük Şii Nüfusu"
 khaleeji:0 "Hâlicî"
 joint_gcc_ventures:0 "Ortak KİK Girişimleri"
 SAU_ailing_king:0 "Hasta Kral"
 SAU_ailing_king_desc:0 "Suudi Arabistan Kralı Fahd, 1995'te geçirdiği felçten beri ülkeyi etkin biçimde yönetememekte, fiili denetim Veliaht Prens Abdullah'ın elinde bulunmaktadır."
 SAU_crown_prince_mbn:0 "Veliaht Prens Muhammed bin Nayif"
 SAU_crown_prince_mbn_desc:0 "Muhammed bin Nayif, Suudi Arabistan Krallığı'nın içişleri bakanı olarak terörle mücadeledeki geniş tecrübesi nedeniyle hem yurt içinde hem yurt dışında geniş saygı görmektedir. İçişleri bakanı olarak faaliyetleri sonucunda çeşitli suikast girişimlerinden sağ çıkmış ve Amerikan ile İngiliz istihbarat teşkilatlarında güçlü müttefikler edinmiştir. Ayrıca Katar hanedanıyla yakın bağları vardır."
 SAU_crown_prince_mbn_lar_desc:0 "Muhammed bin Nayif, Suudi Arabistan Krallığı'nın içişleri bakanı olarak terörle mücadeledeki geniş tecrübesi nedeniyle hem yurt içinde hem yurt dışında geniş saygı görmektedir. İçişleri bakanı olarak faaliyetleri sonucunda çeşitli suikast girişimlerinden sağ çıkmış ve Amerikan ile İngiliz istihbarat teşkilatlarında güçlü müttefikler edinmiştir. Ayrıca Katar hanedanıyla yakın bağları vardır."
 SAU_crown_prince_mbs:0 "Veliaht Prens Muhammed bin Selman"
 SAU_crown_prince_mbs_desc:0 "Kral Selman'ın hırslı ve genç oğlu Muhammed bin Selman, toplumsal bir reformcu olarak görülmekle birlikte siyasi bir şahin olarak da değerlendirilmektedir. İran tehdidine karşı koymaya duyduğu saplantı onu saldırgan ve düşüncesiz bir dış politika izlemeye itmiş, iktidarını pekiştirmesi ise kraliyet ailesi ve Vahhabi ulema içindeki güçlü isimleri karşısına almasına yol açmıştır. İnsan haklarını hiçe sayması onu, az sayıda güçlü müttefiki bulunduğu Batı'da gözden düşürmüştür. Bunun yerine diğer Arap otokratlarıyla, özellikle de Emirlik Veliaht Prensi ile yakın bağlarını sürdürmektedir."
 SAU_king_mbs:0 "Kral Muhammed bin Selman"
 SAU_king_mbs_desc:0 "Kral Selman'ın hırslı ve genç oğlu Muhammed bin Selman, toplumsal bir reformcu olarak görülmekle birlikte siyasi bir şahin olarak da değerlendirilmektedir. İran tehdidine karşı koymaya duyduğu saplantı onu saldırgan ve düşüncesiz bir dış politika izlemeye itmiş, iktidarını pekiştirmesi ise kraliyet ailesi ve Vahhabi ulema içindeki güçlü isimleri karşısına almasına yol açmıştır. İnsan haklarını hiçe sayması onu, az sayıda güçlü müttefiki bulunduğu Batı'da gözden düşürmüştür. Bunun yerine diğer Arap otokratlarıyla, özellikle de Emirlik Veliaht Prensi ile yakın bağlarını sürdürmektedir."
 SAU_innovative_techniques:0 "Yenilikçi Teknikler"
 SAU_a_new_kind_of_warfare:0 "Yeni Bir Savaş Biçimi"
 UAE_sheikh_khalifa:0 "Şeyh Halife Rahatsız"
 UAE_sheikh_khalifa_desc:0 "BAE Devlet Başkanı ve Abu Dabi hükümdarı Şeyh Halife bin Zayed Al Nahyan, felç geçirdiğinden beri olağan siyasi görevlerini yerine getirememektedir. Sonuç olarak üvey kardeşi Muhammed bin Zayed, BAE'nin fiili yöneticisidir."
 operation_dignity:0 "Onur Harekâtı"
 operation_dignity_desc:0 "Devrim sonrasında Libya'da siyasal İslam'ın yükselişine karşılık Mareşal Halife Hafter, Libya'yı devrim sonrası hükümetle müttefik İslamcı milislerden geri almayı hedefleyen Onur Harekâtı'nı başlattı. Hafter'in İslamcılara karşı yürüttüğü kampanya, onu laik düşünceli birçok Libyalı ile Rusya ve Birleşik Arap Emirlikleri gibi siyasal İslam'ı dizginlemeye istekli yabancı güçler arasında popüler kıldı. Hafter'in geniş koalisyonu Sudanlı paralı askerler, Selefi köktenciler ve Kaddafi sadıkları gibi çeşitli aktörleri içermektedir."
 gulf_exploitation:0 "Göçmenlerin Sömürülmesi"
 gulf_exploitation_desc:0 "Göçmenlerin bir kısmını sınır dışı etmeye karar verdik. Kalan ve çalışabilen kısım çok daha fazla çalışacak ve çok daha az ücret alacak."
 gulf_society:0 "İslamcılık ve Laiklik"
 gulf_society_desc:0 "§Y[ROOT.GetFlag]Ülkemizin§! toplumu derinden dindar olmaya devam etmektedir. Bunun sonucunda §Y[ROOT.GetFlag]hükümetimizin§! süregelen popülaritesi dinî güvenilirliğimize bağlıdır ve bu nedenle dine saygısızlık suçlamalarına yol açabilecek politikaları izlerken dikkatli olmalıyız. Popülist İslamcı gruplar biçiminde alternatif dinî meşruiyet kaynaklarının varlığı iktidarımız için sürekli bir tehdit oluşturmaktadır. Bu tür grupların popülaritesi kontrolden çıkarsa kapsamlı bir baskı uygulamayı düşünmemiz gerekebilir.\n\n§Y[ROOT.GetFlag]Hükümetimizin§! dinî meşruiyetinde önemli bir etken, muhafazakâr toplumsal değerlere bağlılığımızdır. Toplumsal açıdan §1liberal§! politikaları çok hızlı izlemek, İslamcı alternatiflere desteği ve toplumun §RRadikalleşmesini§! artırma riski taşır. Odaklar ve kararlardan etkilenen £pol_idea §GToplumsal Muhafazakârlık - Hükümet§! değerini, zamanla ilkini izleyerek yükselip alçalan £population_texticon §YToplumsal Muhafazakârlık - Toplum§! değerinin çok altına düşürmeyerek bu riski azaltabiliriz. £population_texticon §YToplumsal Muhafazakârlık - Toplum§!, toplumun ne ölçüde muhafazakâr ya da liberal olduğunu belirler; yüksek muhafazakârlık düzeyleri daha fazla siyasi güç ve Selefi kayma sağlarken, yüksek liberallik düzeyleri daha yüksek bir ticaret ilişkisi çarpanı ve Batı'ya kayma sağlar.\n\n£pol_idea §GToplumsal Muhafazakârlık - Hükümet§!: [?ROOT.social_conservatism_government]%\n£population_texticon  §YToplumsal Muhafazakârlık - Toplum§!: [?ROOT.social_conservatism_society]%\n\n§YToplumsal Muhafazakârlık - Toplum§! fikirleriniz aylık güncellemeyle ayda bir yenilenecektir."
 GCC_crack_down_on_muslim_broterhood:0 "Müslüman Kardeşler'e §YBaskı Uygula§!"
 GCC_crack_down_on_muslim_broterhood_desc:0 "Müslüman Kardeşler, popülist bir İslam anlayışını benimseyen bir Sünni örgüttür. Bu, Müslüman Kardeşler'in ve bağlı kuruluşlarının yalnızca demokratikleşme yönünde bir baskı kaynağı olmadığı, aynı zamanda toplumun dindar kesimleri arasında da popüler olduğu, dolayısıyla benzer biçimde dinî meşruiyete dayanan otoriter hükümetler için bir tehdit oluşturduğu anlamına gelir."
 GCC_stop_crackdowns:0 "Müslüman Kardeşler Baskılarını §YDurdur§!"
 GCC_stop_crackdowns_desc:0 "Müslüman Kardeşler, popülist bir İslam anlayışını benimseyen bir Sünni örgüttür. Bu, Müslüman Kardeşler'in ve bağlı kuruluşlarının yalnızca demokratikleşme yönünde bir baskı kaynağı olmadığı, aynı zamanda toplumun dindar kesimleri arasında da popüler olduğu, dolayısıyla benzer biçimde dinî meşruiyete dayanan otoriter hükümetler için bir tehdit oluşturduğu anlamına gelir."
 GCC_allow_al_jazeera:0 "El Cezire'ye §Yİzin Ver§!"
 GCC_allow_al_jazeera_desc:0 "El Cezire, Katar hükümeti tarafından finanse edilen ve desteklenen bir haber kuruluşudur. Demokrasi yanlısı hareketleri desteklemesi yoluyla iç işlerine karışması nedeniyle Arap hükümetlerinden eleştiri almıştır."
 GCC_ban_al_jazeera:0 "El Cezire'yi §YYasakla§!"
 GCC_ban_al_jazeera_desc:0 "El Cezire, Katar hükümeti tarafından finanse edilen ve desteklenen bir haber kuruluşudur. Demokrasi yanlısı hareketleri desteklemesi yoluyla iç işlerine karışması nedeniyle Arap hükümetlerinden eleştiri almıştır."
 GCC_subsidize_western_culture:0 "Batı Kültürünü §YSübvanse Et§!"
 GCC_subsidize_salafism:0 "Selefiliği §YSübvanse Et§!"
 GCC_subsidize_salafism_desc:0 "Selefilik, Kur'an'ın katı bir yorumunu savunan, metinci bir Sünni İslam anlayışıdır."
 GCC_encourage_female_representation:0 "Hükümette Kadın Temsilini §YTeşvik Et§!"
 GCC_encourage_female_representation_desc:0 "Hükümetimiz, ezici çoğunlukla erkeklerden oluşmakla ve hükümet görevlerine atama yaparken kadınlara karşı ayrımcılık yapmakla suçlanmıştır. Bu durumu değiştirmeye çalışmalıyız."
 GCC_discourage_female_representation:0 "Hükümette Kadın Temsilini §YCaydır§!"
 GCC_discourage_female_representation_desc:0 "Kadınların siyasi görevlerde bulunması toplumumuz için bir utançtır. Bu kötücül eğilime karşı çalışmalıyız."
 GCC_expand_female_employment:0 "Kadınlara Yönelik İstihdam Seçeneklerini §YGenişlet§!"
 GCC_expand_female_employment_desc:0 "İşletmelerin ezici çoğunlukla kadın yerine erkek istihdam etmesi toplumumuz için bir engeldir. Eski moda geleneklere bağlı kalmak için ekonomimizin imkânlarını köstekleyemeyiz."
 GCC_limit_female_employment:0 "Kadınlara Yönelik İstihdam Seçeneklerini §YSınırla§!"
 GCC_limit_female_employment_desc:0 "Kadınların iş hayatında çalışması İslami değerlerimize ve geleneklerimize aykırıdır. Kadınlara toplumdaki asıl yerlerini hatırlatmalıyız."
 GCC_legalize_alcohol_in_hotels_and_clubs:0 "Otellerde ve Kulüplerde Alkolü §YYasallaştır§!"
 GCC_legalize_alcohol_in_hotels_and_clubs_desc:0 "Geniş halk kesimleri için alkol yasağını sürdürmemiz gerekse de, yabancıların uğrak yeri olan belirli alanlar için alkol ruhsatı vermek çıkarımıza olabilir."
 GCC_reverse_limited_alcohol_legalization:0 "Sınırlı Alkol Yasallaştırmasını §YGeri Al§!"
 GCC_reverse_limited_alcohol_legalization_desc:0 "Alkole yönelik mevcut yaklaşımımız İslami kültürümüze hakarettir ve geri alınmalıdır."
 GCC_legalize_alcohol:0 "Kamusal Alanlarda Alkolü §YYasallaştır§!"
 GCC_legalize_alcohol_desc:0 "Alkol yasağı geçmişin bir kalıntısıdır ve toplumumuzu ilerletmek için kaldırılmalıdır."
 GCC_ban_alcohol:0 "Kamusal Alanlarda Alkolü §YYasakla§!"
 GCC_ban_alcohol_desc:0 "Alkole yönelik mevcut yaklaşımımız İslami kültürümüze hakarettir ve geri alınmalıdır."
 GCC_relax_dress_code:0 "Giyim Kuralı Şartlarını §YGevşet§!"
 GCC_relax_dress_code_desc:0 "Giyim kuralı şartlarımız yabancı ziyaretçileri caydırmaktadır. Bu konuda esnek kalmak en iyisi olabilir."
 GCC_reimpose_dress_code:0 "Giyim Kuralı Şartlarını Yeniden §YUygula§!"
 GCC_reimpose_dress_code_desc:0 "Giyime yönelik mevcut yaklaşımımız İslami kültürümüze hakarettir ve geri alınmalıdır."
 GCC_ban_burqa:0 "Burka'yı §YYasakla§!"
 GCC_ban_burqa_desc:0 "Burka bir güvenlik tehdidi ve köhne geleneklerimizin bir kalıntısıdır. Yasaklanmasını düşünmeliyiz."
 GCC_unban_burqa:0 "Burka Yasağını §YKaldır§!"
 GCC_unban_burqa_desc:0 "Burka yasağı kültürümüze, dinimize ve tarihimize hakarettir. Kaldırılmalıdır."
 GCC_head_scarves:0 "Başörtülerini §YYasakla§!"
 GCC_head_scarves_desc:0 "Başörtüsü köhne geleneklerimizin bir kalıntısıdır. Toplumumuzun ilerlemesine yardımcı olmak için yasaklanmasını düşünmeliyiz."
 GCC_unban_head_scarves:0 "§YBaşörtüsü Yasağını Kaldır§!"
 GCC_unban_head_scarves_desc:0 "Başörtüsü yasağı kültürümüze, dinimize ve tarihimize hakarettir. Kaldırılmalıdır."
 GCC_decriminalize_same_sex_relations:0 "Eşcinsel İlişkileri §YSuç Olmaktan Çıkar§!"
 GCC_decriminalize_same_sex_relations_desc:0 "Eşcinsel ilişkilere yönelik mevcut tutumumuz, dışarıdakilerin toplumumuzu geri kalmış ve hatta barbar olarak nitelemesine yol açtı. Bu durum devam edemez."
 GCC_recriminalize_same_sex_relations:0 "Eşcinsel İlişkileri Yeniden §YSuç Say§!"
 GCC_recriminalize_same_sex_relations_desc:0 "Eşcinsel ilişkilere izin vermek İslami değerlerimize hakarettir ve devam etmesine izin verilemez."
 GCC_secularize_the_state:0 "Devleti §YLaikleştir§!"
 GCC_secularize_the_state_desc:0 "Devletimizin dindarlığı yasalarımızda, sembollerimizde ve söylemimizde yer almaktadır. Toplumumuzu laikleştirmek için dini hükümetimizin her alanından arındırmalıyız."
 shia_decisions:0 "Mezhepçilik"
 shia_decisions_desc:0 "Peygamberin ölümü, bin yılı aşkın süredir varlığını sürdüren Sünni ve Şii ayrılığına yol açtı. Sünniler ve Şiiler çoğu kez birbirleriyle barış içinde yaşayabileceklerini göstermiş olsalar da, 1979 İran Devrimi gibi olaylar nedeniyle bölgede artan gerilimler Sünni-Şii düşmanlığına katkıda bulunmuştur. Sünni Suudi Arabistan ile Şii İran arasındaki bölgesel jeopolitik mücadele bağlamında, kendi Şii nüfusumuza yönelik yaklaşımımızı dikkatle belirlemeliyiz.\n\n£population_texticon  §YŞii Nüfusu§!: [?shia_population]%\n       Ortaya çıkan kaymayı ve Şii ağacına erişimi belirler."
 encourage_shia_immigration:0 "Şii Göçünü Teşvik Et"
 encourage_shia_immigration_desc:0 "Irak ve İran gibi Şii çoğunluklu ülkelerden gelen göçmenlerin ülkemize taşınmak için karşılaması gereken şartları azaltarak, ülkemizdeki Müslüman nüfusun Şii inancına bağlı olan yüzdesini artırabiliriz."
 encourage_sunni_immigration:0 "Sünni Göçünü Teşvik Et"
 encourage_sunni_immigration_desc:0 "Daha geniş Orta Doğu ve Güney Asya'daki Sünni çoğunluklu ülkelerden gelen göçmenlerin ülkemize taşınmak için karşılaması gereken şartları azaltarak, ülkemizdeki Müslüman nüfusun Sünni inancına bağlı olan yüzdesini artırabiliriz."
 deport_foreign_shia:0 "Yabancı Şiileri Sınır Dışı Et"
 deport_foreign_shia_desc:0 "Irak, İran, Lübnan, Pakistan, Suriye ve büyük Şii nüfuslara sahip diğer ülkelerden gelen Şii göçmenler, bu göçmenlerin Şii terörünü desteklediği ve dolayısıyla hükümetimiz için tehdit oluşturduğu iddialarıyla oldukça kolay biçimde sınır dışı edilebilir."
 deport_foreign_sunnis:0 "Yabancı Sünnileri Sınır Dışı Et"
 deport_foreign_sunnis_desc:0 "Daha geniş Orta Doğu ve Güney Asya'dan gelen Sünni göçmenler, bu göçmenlerin Sünni terörünü desteklediği ve dolayısıyla hükümetimiz için tehdit oluşturduğu iddialarıyla oldukça kolay biçimde sınır dışı edilebilir."
 gcc_decisions:0 "Körfez İşbirliği Konseyi"
 gcc_decisions_desc:0 "\n£MAIN_desctext_gulf \n\n\n\n1981'de kurulan §YKİK§!, Orta Doğu'nun en önde gelen hükümetlerarası kuruluşlarından biridir. Körfez'deki Arap devletlerinin çoğunu siyasi ve ekonomik bir birlikte bir araya getirmeyi amaçlar. §YKİK§! üyelerinin benzer hükümet biçimlerine sahip olması ve normalde benzer dış politikalar benimsemesine rağmen, üye devletler arasındaki anlaşmazlıklar §Ydaha fazla entegrasyonun§! önünde bir engel oluşturmuştur.\n\n§YKİK Birliği§!, §Yİşbirliği Konseyi ağacında§! ilerleyerek, §YKİK üyeleri§! arasındaki anlaşmazlıkları çözerek ve §YKİK birliği§! için kampanya yürüterek artırılabilir. Ayrıca §Rdünya gerilimi§!, §Y[PER.GetFlag]İran§! §Rtehdidi§! ve §YKİK ülkelerinin§! §Y[USA.GetFlag]Amerikan yanlısı§! Sünni monarşilerden oluşan bölgesel modele uyup uymamasından etkilenir.\n\n§YKİK Birliği§!: [?global.gcc_unity]%\n\nBaskın Üye: §Y[gcc_dominant_member]§!\nDış Destekçi: §Y[gcc_foreign]§!"
