 coalition_decisions:0 "Yeni Hükümeti Kur"
 coalition_decisions_desc:0 "[Root.GetLeader], [show_ruling_party] ([?party_pop_elect_array^ruling_party|%1]) seçimde tek başına hükümet kurmaya yetecek çoğunluğa ulaşamadı. Diğer partileri katılmaya davet etmemiz gerekiyor.\n\nBizden daha fazla oy alan partiler katılmakla ilgilenmeyecektir. Bir partiyi hükümete eklemenin Siyasi Güç maliyeti, partinin büyüklüğüne ve bize olan siyasi uzaklığına bağlıdır.\n\n§HŞimdiye kadar koalisyonumuz şunlardan oluşuyor:§!\n[show_ruling_party] ([?party_pop_elect_array^ruling_party|%1])[L_coal_elect_percent_0][L_coal_elect_percent_1][L_coal_elect_percent_2][L_coal_elect_percent_3][L_coal_elect_percent_4][L_coal_elect_percent_5][L_coal_elect_percent_6][L_coal_elect_percent_7][L_coal_elect_percent_8][L_coal_elect_percent_9][L_coal_elect_percent_10][L_coal_elect_percent_11][L_coal_elect_percent_12][L_coal_elect_percent_13][L_coal_elect_percent_14][L_coal_elect_percent_15][L_coal_elect_percent_16][L_coal_elect_percent_17][L_coal_elect_percent_18][L_coal_elect_percent_19][L_coal_elect_percent_20][L_coal_elect_percent_21][L_coal_elect_percent_22][L_coal_elect_percent_23]\n\n§HMevcut koalisyonun gücü:§! [?government_coalition_strength_elect|%1]. \n§RÇoğunluk hükümeti kurmak için gereken güç:§! [?majority_threshold|%1]\nBizim §H[?election_threshold|%0]§! olan barajımız, bundan daha az oy alan partileri uygunsuz kılıyor.\n"
