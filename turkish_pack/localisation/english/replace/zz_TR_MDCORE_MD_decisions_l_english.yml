 sudan_second_civil_war_decisions_category:0 "İkinci Sudan İç Savaşı"
 sudan_second_civil_war_decisions_category_desc:0 "İkinci Sudan İç Savaşı, Sudan Silahlı Kuvvetleri ve Ömer el-Beşir önderliğindeki Ulusal İslami Cephe'nin Sadık el-Mehdi'yi devirmesiyle başladı. El-Beşir hükümeti hemen, el-Mehdi ile Sudan Halk Kurtuluş Ordusu arasındaki kırılgan ateşkes nedeniyle askıya alınmış olan İslamlaştırma politikalarını ülke genelinde (Güney Sudan dahil) yeniden uygulamaya başladı. Bu durum, ağırlıklı olarak Hristiyan ve Animist olan Güney Sudan'ın hükümete karşı silaha sarılmasına yol açtı."
 SUD_second_sudanese_civil_war_mission:0 "Kapsamlı Barış Anlaşması"
 SUD_second_sudanese_civil_war_mission_desc:0 "Sudan Halk Kurtuluş Ordusu bize karşı ayaklandı; amaçları rejimimizi devirip daha kapsayıcı ve demokratik bir rejim kurmak. Buna izin veremeyiz, çünkü Sudan Arap ve Müslüman olmalı. Halkımız savaştan bıkmadan isyancıları çabucak yenmeliyiz."
 SUD_second_sudanese_civil_war_mission_success_tt:0 "§Y[SSU.GetNameWithFlag]§! Teslim Olsun"
 SUD_second_sudanese_civil_war_mission_states_tt:0 "Aşağıdaki eyaletler, onları §Ykontrol eden§! kim ise ona verilecek. Diğer tüm Güney Sudan eyaletleri üzerindeki §Yiddialar§! kaybedilir"
 SUD_second_sudanese_civil_war_mission_tt:0 "Her iki taraf, §Y6 yıl§! içinde yapılacak bir §YGüney Sudan bağımsızlık referandumunu§! kabul ediyor.\n"
 SSU_second_sudanese_civil_war_mission:0 "Kapsamlı Barış Anlaşması"
 SSU_second_sudanese_civil_war_mission_desc:0 "Sudan hükümeti halkımızı son kez ezdi. Hartum'a kadar yürüyeceğiz ve [SUD.GetLeader]'ı istifaya zorlayacağız. Sudan için demokratik ve adil bir hükümeti sağlamanın tek yolu bu. Ancak çıkmaza girmek istemiyoruz."
 SSU_second_sudanese_civil_war_mission_success_tt:0 "§Y[SUD.GetNameWithFlag]§! Teslim Olsun"
 SSU_second_sudanese_civil_war_mission_states_tt:0 "Aşağıdaki eyaletler, onları §Ykontrol eden§! kim ise ona verilecek. Diğer tüm Sudan eyaletleri üzerindeki §Yiddialar§! kaybedilir"
 SSU_second_sudanese_civil_war_mission_tt:0 "Her iki taraf, §Y6 yıl§! içinde yapılacak bir §YGüney Sudan bağımsızlık referandumunu§! kabul ediyor.\n"
 SSU_second_sudanese_civil_war_eastern_front:0 "Doğu Cephesini Aç"
 SSU_second_sudanese_civil_war_eastern_front_desc:0 "Sudan'ın doğusunda Eritre'den faaliyet gösteren birkaç isyancı grup var. Bu gruplar da [SUD.GetLeader]'ın yönetimine karşı çıkıyor, ancak askeri kaynaklarını esas olarak Port Sudan'a giden yolları ve petrol boru hatlarını sabote etmek için kullanıyorlar. Onlarla ittifak kurup silah ve teçhizat göndermeliyiz. Böylece [SUD.GetAdjective] güçlerinin bir kısmını Güney'den çekebiliriz."
 SSU_second_sudanese_civil_war_eastern_front_tt:0 "İki tugay §YDoğu Cephesi§! gücü, Eritre'den §YPort Sudan§! yönüne sınırı geçiyor"
 SSU_second_sudanese_civil_war_derg_support:0 "Mengistu'dan Yardım İste"
 SSU_second_sudanese_civil_war_derg_support_desc:0 "Mengistu devrilmeden önce davamızın kararlı bir destekçisiydi. Bunun başlıca sebebi Sudan'ın Mengistu'nun muhalefetini desteklemesiydi. [ETH.GetName] içinde yaşayan çok sayıda Sudanlı mülteci var. Mengistu ülkenin başına yeniden geçtiğine göre, bu mültecileri [SUD.GetLeader] karşıtı bir birlik olarak silahlandırması için ondan yardım istemeliyiz."
 SSU_second_sudanese_civil_war_derg_support_tt:0 "Dört tugay §YSudan Kurtuluş Cephesi§! gücü, Etiyopya'dan §YMavi Nil§! eyaletine sınırı geçiyor"
 SSU_second_sudanese_civil_war_uganda_support:0 "[UGA.GetNameWithFlag]'dan Yardım İste"
 SSU_second_sudanese_civil_war_uganda_support_desc:0 "[UGA.GetName] Cumhurbaşkanı Yoweri Museveni, John Garang'ın uzun süredir destekçisi, dostu ve müttefikidir. 80'lerin sonunda SPLA'nın yanında savaşan [UGA.GetAdjective] ordu birlikleri bile vardı. Ancak ülke Demokratik Kongo Cumhuriyeti'ne karışınca Museveni'nin desteği azaldı. Kongo'daki durum sakinleşirse belki Museveni bize yeniden yardım edebilir."
 SSU_second_sudanese_civil_war_uganda_support_tt:0 "Kabul ederlerse:\n"
 SSU_second_sudanese_civil_war_trade_ilemi_triangle:0 "Silah Karşılığında [925.GetName] Bölgesini Devret"
 SSU_second_sudanese_civil_war_trade_ilemi_triangle_desc:0 "İlemi Üçgeni, Sudan ile Kenya arasında küçük bir bölgedir. Bölgenin resmî olarak kabul edilmiş bir sınırı yoktur ve fiilî idari hatlar yıllar içinde değişmiştir. Kenya, [SUD.GetName] karşısında silah bulmamıza yardım edeceğine söz verirse, belki de bölgeyi resmen ona vermeliyiz."
 SSU_second_sudanese_civil_war_trade_ilemi_triangle_tt:0 "Kabul ederlerse:\n"
 SUD_second_sudanese_civil_war_iraqi_paratroopers:0 "Iraklı Paraşütçüleri İstihdam Et"
 SUD_second_sudanese_civil_war_iraqi_paratroopers_desc:0 "Irak daha önce bize küçük bir paraşütçü müfrezesi gönderdi ve onlar Juba savaşına katıldılar. Mevcut ve eski Iraklı paraşütçülerden oluşan daha büyük bir birlik talep edip bunlardan seçkin bir birim oluşturmalıyız."
 SUD_second_sudanese_civil_war_iraqi_paratroopers_tt:0 "Bir Iraklı paraşütçü alayı Hartum'a konuşlandırılacak"
 SUD_second_sudanese_civil_war_chinese_oil_guard:0 "Petrol Sahaları İçin Çinli Güvenlik Kirala"
 SUD_second_sudanese_civil_war_chinese_oil_guard_desc:0 "Ülkedeki çeşitli isyancı gruplar nedeniyle petrol sahalarımızda sürekli güvenlik tutmamız gerekiyor. Bize Çin'den güvenlik hizmeti kiralama teklifi geldi. Bu korumaları kiralayarak petrol sahası güvenlik birimlerinin bir kısmını cephede savaşmaya kaydırabiliriz."
 SUD_second_sudanese_civil_war_chinese_oil_guard_tt:0 "Tam kontrol ettiğimiz petrol üreten eyalet sayısı arttıkça seferber edebileceğimiz güvenlik birimi sayısı da artar. Bu aynı zamanda bu kararın maliyetini ve [CHI.GetNameWithFlag]'nın bizim üzerimizdeki nüfuzunu da etkiler"
 SUD_second_sudanese_civil_war_libyan_mercenaries:0 "Ek [LBA.GetAdjective] Paralı Askerler İste"
 SUD_second_sudanese_civil_war_libyan_mercenaries_desc:0 "[LBA.GetNameDef] hükümetimize yardım etmesi için bir grup paralı asker gönderdi. Güçlerimizi takviye etmesi için ek bir birimin gönderilmesini talep etmeliyiz."
 SUD_second_sudanese_civil_war_congo_volunteers:0 "[DRC.GetNameWithFlag]'den Gönüllü Al"
 SUD_second_sudanese_civil_war_congo_volunteers_desc:0 "[UGA.GetNameDef] [SSU.GetNameDef]'u desteklediğinden biz [UGA.GetNameDef]'ya karşıyız. Bu bizi ve [DRC.GetNameDef]'yi doğal müttefik yapıyor. Ne yazık ki onlar [UGA.GetName]-[RWA.GetName] koalisyonu tarafından sıkıştırılıyor. Düşmanlarını geri püskürtmeyi başarırlarsa belki onların yardımından yararlanabiliriz"
 SUD_second_sudanese_civil_war_congo_volunteers_trigger_tt:0 "[DRC.GetNameDef], [SSU.GetNameDef] ile en az bir sınır kapısını kontrol ediyor"
 SUD_second_sudanese_civil_war_congo_volunteers_tt:0 "Dört tugay §YKongolu gönüllü§!, §YYambio§! ve §YYei§! kasabalarına saldırıyor"
 sudan_war_in_darfur_decisions_category:0 "Darfur'da Savaş"
 sudan_war_in_darfur_decisions_category_desc:0 "Darfur'daki gerilimler on yıllardır kaynıyor; merkezi hükümet, bazılarının Apartheid olarak adlandırdığı bir yöntemle yerel halkı Araplaştırmaya çalışıyor. Darfur Kurtuluş Cephesi ile Adalet ve Eşitlik Hareketi Sudan hükümetini devirmeye karar verince gerilimler sonunda savaşa dönüştü.\n\n[SUD.GetNameWithFlag], §Y[224.GetName]§! içinde hiçbir bölgeyi kontrol etmezse üç yıllık bir sayaç başlar. Sayaç dolduğunda [DAR.GetNameWithFlag], [SUD.GetName] bünyesinde §Yözerklik§! kazanır. Sayaç dolduğunda Darfur §Y[1183.GetName] veya [223.GetName]§! bölgesinden birini kontrol ediyorsa Darfur tam bağımsızlığa kavuşur. [SUD.GetNameWithFlag], §Y[224.GetName] içindeki herhangi bir bölgeyi§! yeniden işgal ederse sayaç sıfırlanır."
 SUD_war_in_darfur_mission:0 "[DAR.GetNameDef] ile Savaş"
 SUD_war_in_darfur_mission_desc:0 "[DAR.GetNameDef]'in nihai amacı [SUD.GetLeader]'ı devirmek. Güneydeki isyancılardan farklı olarak Darfur'daki çatışma daha yeni, dolayısıyla Darfurlular savaşı uzun süre sürdürmeye daha istekli olacak. Özerklik kazanmalarını engellemek istiyorsak onları ezmeliyiz."
 SUD_war_in_darfur_mission_cancel_trigger:0 "[224.GetName] eyaletindeki herhangi bir bölgeyi kontrol ediyoruz"
 DAR_war_in_darfur_mission:0 "[SUD.GetNameDef] ile Savaş"
 DAR_war_in_darfur_mission_desc:0 "Yıllardır [SUD.GetAdjective] rejimi halkımızı ezdi, bizi iradelerimiz dışında Araplaştırmaya çalıştı. Bu bugün sona eriyor."
 DAR_war_in_darfur_mission_cancel_trigger:0 "[SUD.GetName], [224.GetName] eyaletindeki herhangi bir bölgeyi kontrol ediyor"
 SUD_war_in_darfur_arm_janjaweed:0 "Cancawid'i Silahlandır"
 SUD_war_in_darfur_arm_janjaweed_desc:0 "Cancawid, Darfur'da faaliyet gösteren bir Arap milisidir. Aslen Çad tarafından kurulan Cancawid, Darfur'un Arap nüfusu için güçlü adamlar gibi hareket ederek toprağın onların elinde kalmasını sağlar. Darfur isyanını kontrol altında tutmak için uzun süredir Cancawid'i kullandık, ancak sayıca az olduğumuz için belki de onlara desteğimizi artırma vakti geldi."
 SUD_war_in_darfur_arm_janjaweed_tt:0 "Üç tugay §YCancawid milisi§! oluşturulacak"
 utility_trucks_purchase:0 "Teknik Pikap Satın Al"
 utility_trucks_purchase_desc:0 "Sivil piyasadan pikap kamyonetler satın al."
 does_not_have_equipment_purchased_scripted_loc_one:0 "Yakın zamanda teçhizat satın alınmadı"
 does_not_have_equipment_purchased_scripted_loc_two:0 "Sonraki satın alıma [?equipment_purchased_flag:days_left|.0Y] gün var"
 POR_expand_the_neves_corvo_mine:0 "Neves-Corvo Madenini Genişlet"
 POR_expand_the_neves_corvo_mine_desc:0 "Neves-Corvo madeni, bir jeofizik çalışmada gravimetrik bir anomalinin keşfedilmesinin ardından 1977'de kuruldu. Maden başlıca çinko ve bakır üretiyor ve ülkenin başlıca madenlerinden biri sayılıyor. Madene ek kaynak yatırarak ondan daha fazla yararlanmalıyız."
 POR_expand_the_panasqueira_mines:0 "Panasqueira Madenlerini Genişlet"
 POR_expand_the_panasqueira_mines_desc:0 "Toplu olarak Panasqueira Madenleri diye anılan bu isim, Cabeço do Pião ile Panasqueira köyü arasındaki madencilik faaliyetinin genel adıdır. Maden 19. yüzyılın sonundan beri faaliyette olup bölgede hâlâ tungsten ve başka minerallerin daha fazla rezervine sahiptir. Rezervlerden daha fazla yararlanıp ülkemize daha çok katkı sağlamak için ek yatırım ve daha fazla devlet kaynağı sağlayabiliriz."
 POR_expand_the_mua_mine:0 "Mua Madeni Projesi"
 POR_expand_the_mua_mine_desc:0 "Portekiz'deki Mua Madenleri hem ülkenin hem de dünyanın en büyük madenlerinden biridir. %37 demir tenörlü 2,56 milyar ton cevherlik rezervle en büyük demir cevheri rezervlerinden birini temsil eder. Bunu genişletip işletmek, ekonomik hayallerimizde daha da fazla bağımsızlık kazanmamıza yardımcı olacak."
 balance_of_power_title:0 "Güç Dengesi"
 lp_vs_rp:0 "Sol Güç ve Sağ Güç"
 we_are_very_powerful:0 "Çok Güçlüyüz"
 NATO_CSTO_agreement:0 "Avrupa'da Konvansiyonel Silahlı Kuvvetler Anlaşması"
 NATO_CSTO_agreement_desc:0 "AKKA Anlaşması, Soğuk Savaş'ın tam sonlarına doğru, 1990'da NATO ve Varşova Paktı tarafından imzalandı.\nAmaç, iki tarafın da Avrupa'da büyük çaplı bir yıldırım harekâtı, işgal veya savaş başlatmaya yetecek miktarda konvansiyonel askeri güç yığmasını önlemekti.\nAnlaşma sonradan NATO-KGAÖ anlaşmasına dönüştü, ancak Avrupa'da gerilimin tırmanmasını engelleyebileceğine dair umutlar hâlâ yüksek.\n\nAvrupa'daki güçlerimizi sınırlı tutmamız gerekecek.\n\nBaşlıca sınırlama mekanize ve zırhlı tabur sayısı üzerinedir. Konuşlandırılmış mevcut güç sayısı:\n\nNATO\nKonuşlandırılan piyade [?global.var_nato_inf_count]/1000\nKonuşlandırılan tank [?global.var_nato_tank_count]/400\n\nKGAÖ\nKonuşlandırılan piyade [?global.var_csto_inf_count]/1000\nKonuşlandırılan tank [?global.var_csto_tank_count]/400\n\n"
 propose_agreement_talks:0 "Avrupa'da Konvansiyonel Silahlı Kuvvetler Anlaşması'nın Güçlendirilmesini Öner"
 propose_agreement_talks_desc:0 "Avrupa'da kalıcı barışı sağlamak için AKKA'yı güçlendirmemiz gerekiyor."
 NATO_CSTO_breach_mission:0 "Avrupa'da Konvansiyonel Silahlı Kuvvetler Anlaşması'nın İhlali"
 NATO_CSTO_breach_mission_desc:0 "İttifakımız AKKA anlaşmasını ihlal ediyor; tabur sayımızı kontrol altına almamız gerekiyor."
 decision_will_give_tt:0 "Bu karar bize şunu kazandıracak:"
 mission_will_give_tt:0 "Bu görev tamamlandığında şu ödülü verecek:"
 mission_will_give_every_30_days_tt:0 "Her 30 günde bir otomatik olarak tamamlanıp yeniden başlayan bir görev başlatır. Her tamamlanışta şunu verir:"
 BUL_tourism_development_category:0 "Turizmin Geliştirilmesi"
 BUL_tourism_development_category_desc:0 "Turizm gelirini artırmak için Bulgaristan'ın başlıca turizm merkezlerini geliştir."
 BUL_develop_sunny_beach:0 "Güneş Kıyısı Tatil Beldesini Geliştir"
 BUL_develop_sunny_beach_desc:0 "Güneş Kıyısı, Bulgaristan'ın Karadeniz kıyısındaki en büyük sahil tatil beldesidir. Geliştirilmesi Rusya, Ukrayna, Romanya, Birleşik Krallık, Almanya ve Türkiye'den turist çekerek önemli gelir sağlayacak."
 BUL_develop_borovets:0 "Borovets Kayak Merkezini Geliştir"
 BUL_develop_borovets_desc:0 "Borovets, Sofya'nın güneyindeki Rila Dağları'nda yer alan Bulgaristan'ın önde gelen kayak merkezlerinden biridir. Yapılacak yatırım onu Avrupa'nın fiyat-performans açısından en iyi kayak destinasyonlarından biri haline getirecek."
 BUL_develop_varna_beaches:0 "Varna Sahil Tatil Beldelerini Geliştir"
 BUL_develop_varna_beaches_desc:0 "Varna bölgesi, Altın Kumlar ve Aziz Konstantin ile Elena gibi ünlü sahil tatil beldelerini kapsar. Geliştirilmeleri Rusya, Birleşik Krallık, Ukrayna ve Romanya'dan turist çekecek."
 MD_protests_forming:0 "Ülke Çapında Protestolar"
 MD_protests_forming_desc:0 "Hoşnutsuzluk ülke çapında büyüyor. §YProtesto Şiddeti§! kritik seviyelere ulaşırsa bir §YUyarı§! görevi başlayacak; bu da kontrol altına alınmazsa açık bir §RAyaklanma§! izleyecek. Aylık sürüklenme dökümünü okumak için yukarıdaki paneli kullanın, ardından gerginliği azaltmak için mevcut kararlara başvurun.\n\nAyaklanma sırasında Protesto Şiddeti, huzursuzluğun başkent dışındaki yeni bir ana eyalete yayılma aylık ihtimalini belirler; bu ihtimal en fazla §Y%75§!'tir. Protesto Yorgunluğu, etkin olduğu her ay bu ihtimali §G5§! puan düşürür. Ayaklanmayı sona erdirmek için Şiddeti §Y60 gün§! boyunca §G0§!'da tutun veya etkilenen her eyaleti §Y%50 Uyum§! ve §Y%40 Direniş§!'in altında olacak şekilde yatıştırın."
 MD_incoming_protest_movement:0 "Gelen Protestolar"
 MD_incoming_revolt:0 "Gelen Ayaklanma"
 MD_incoming_revolt_available_tt:0 "Etkilenen her başkent dışı eyalette en az §Y%50 Uyum§! var ve §Y%40 Direniş§!'ten azı var"
 MD_zero_strength_recovery:0 "Protestolar Hız Kaybediyor"
 MD_zero_strength_recovery_desc:0 "Protesto Şiddetini §Y60 gün§! boyunca §G0§!'da tut. Herhangi bir artış bu toparlanma dönemini iptal eder. Dönemi tamamlamak ayaklanmayı barışçıl yoldan sona erdirir."
 MD_appease_protesters:0 "Protestocuları Yatıştır"
 MD_appease_protesters_desc:0 "Kalabalıkların sivriliğini alacak küçük tavizler. Durum son raddeye gelmeden bize zaman kazandırır, o kadar."
 MD_hearts_and_minds_campaign:0 "Gönüller Kazanma Kampanyası"
 MD_hearts_and_minds_campaign_desc:0 "Hükümeti halkın can simidi olarak göster. 60 gün sonra etkilenen bir başkent dışı eyalet §G10 Uyum§! kazanır ve §G10 Direniş§! kaybeder."
 MD_extended_crackdown:0 "Gizli Baskı"
 MD_extended_crackdown_desc:0 "Silahlar patlaya patlaya sokaklara yürümek yerine protesto liderlerini sessizce tutuklayıp bastırıyoruz. Hareket örgütleyicilerini kaybeder ve zamanla dağılır."
 MD_activate_riot_police:0 "Çevik Kuvvet Birimlerini Etkinleştir"
 MD_activate_riot_police_desc:0 "Kalabalıkla doğrudan yüzleşmek için özel çevik kuvvet çağır. Garnizonlarımızı sağlam tutarlar, ancak sahada tutmak pahalıdır."
 MD_deactivate_riot_police:0 "Çevik Kuvvet Birimlerini Devre Dışı Bırak"
 MD_deactivate_riot_police_desc:0 "Çevik kuvvete artık ihtiyaç yok. Onları görevden çekip karakollarına geri gönder."
 MD_preemptive_reform:0 "Önleyici Reform"
 MD_preemptive_reform_desc:0 "Hoşnutsuzluk açık bir krize dönüşmeden önce hayata geçirilen, tek seferlik bir taviz ve istikrar önlemleri paketi. Erken davranırsak en kötüsünü etkisiz hale getiririz."
 MD_emergency_police_funding:0 "Vaat: Acil Polis Finansmanı"
 MD_emergency_police_funding_desc:0 "Çevik kuvvet birliklerine, gözetime ve fazla mesai ödemelerine acil para aktar ve halka düzenin yeniden sağlanacağı sözünü ver. Sözümüzü tutarsak güvenlik güçleri haklı çıkar. Tutamazsak halk baskıyı boşa harcanmış para olarak görür."
 MD_police_funding_mission:0 "Kamu Düzenini Yeniden Sağla"
 MD_police_funding_mission_desc:0 "Bütçeyi bir güvenlik baskısına yatırdık. Şimdi halkın sabrı tükenmeden sokaklar temizlenmeli. Polis fikrine, yapısal çözümlere ve zamana güven."
 MD_tax_relief_promise:0 "Vaat: Vatandaşlara Vergi İndirimi"
 MD_tax_relief_promise_desc:0 "Mali bir teşvik paketiyle birlikte düşük gelirli hanelere geniş çaplı vergi indirimi duyur ve bunun ülkeyi dengeleyeceğine dair söz ver. Sözü tutarsak halk bunu bize yazar. Tutamazsak verilmeyen sözü hatırlar."
 MD_tax_relief_mission:0 "İstikrarı Sağla"
 MD_tax_relief_mission_desc:0 "Vergi indirimi yürürlükte ve halk izliyor. Paket etkisini yitirmeden ülkenin gözle görülür biçimde daha istikrarlı olması gerekiyor. Odakları tamamla, istikrarı bozan olaylardan kaçın ve harcamaları dengede tut."
 MD_jobs_for_unemployed:0 "Vaat: İşsizlere İş Programı"
 MD_jobs_for_unemployed_desc:0 "Kapsamlı bir kamu işleri ve istihdam programı duyur ve işsizlere iş sözü ver. Sözümüzü tutarsak protesto krizi gevşer. Tutamazsak verilmeyen söz bize pahalıya mal olur."
 MD_jobs_program_mission:0 "İşsizliği Azalt"
 MD_jobs_program_mission_desc:0 "Halka büyük bir iş programı vaat ettik. Vaadin vadesi dolmadan işsizlik oranının düşmesi gerekiyor. Sanayi inşaatını artır, sosyal yardım harcamalarını yükselt ve istihdamı büyüten odakları tamamla."
