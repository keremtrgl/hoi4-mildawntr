 ARG_falklands_question_category:0 "Falkland Meselesi"
 ARG_falklands_question_category_desc:0 "Islas Malvinas bizim doğuştan hakkımız ve egemen topraklarımızdır. Kardeşlerimizin vatanımız uğruna adalarımızda akıttığı kanı unutmayacağız. \nÇay içen emperyalistlerden topraklarımızı geri alma vakti geldi!"
 ARG_second_falklands_war:0 "Falkland'ları geri al!"
 ARG_second_falklands_war_desc:0 "§R120 gün geçtikten sonra bu, [ENG.GetName] ile savaşa yol açacak.§!"
 TAI_category:0 "Tayvan Kararları"
 TAI_category_desc:0 "Tayvan ulusuyla ilgili kararlar."
 TAI_coast_guard:0 "Sahil Güvenlik Teşkilatını Kur"
 TAI_kaoshiung_university:0 "Kaohsiung Ulusal Üniversitesini Aç"
 TAI_remove_rival_government:0 "Rakip Hükümeti Kaldır"
 TAI_choose_new_capital:0 "Yeni Başkenti Seç"
 TAI_choose_new_capital_desc:0 "Anakara yeniden kontrolümüze girdiğine göre, Çin için yeni bir başkent seçebiliriz."
 TAI_CHI_confidence_building:0 "Boğaz Ötesi Güven Tesisi"
 TAI_CHI_confidence_building_desc:0 "Pekin ile diyalog kanallarını aç ve boğaz ötesi güven artırıcı önlemleri uygulayarak gerginliği azalt, karşılıklı güveni yükselt."
 TAI_CHI_assert_sovereignty:0 "Egemenliğimizi Vurgula"
 TAI_CHI_assert_sovereignty_desc:0 "Kamuoyu açıklamaları, yabancı ortaklarla derinleşen ilişkiler ve Pekin'e karşı kararlı bir tutumla Tayvan'ın egemenliğini yeniden teyit et. Boğaz ötesi güven bundan zarar görecek."
 TAI_tsmc_restrict_us_exports:0 "Amerika Birleşik Devletleri'ne Yarı İletken İhracatını Kısıtla"
 TAI_tsmc_restrict_us_exports_desc:0 "Fabrikalarımız Amerikan ekonomisini onların değil, bizim şartlarımızla besliyor. Gelişmiş silikon levhaları esirgemek Washington'daki iyi niyetimizin büyük bölümüne mal olur, ama onlara hayatta kalmamızın değerini hatırlatır."
 TAI_tsmc_resume_us_exports:0 "Amerika Birleşik Devletleri'ne Yarı İletken İhracatını Sürdür"
 TAI_tsmc_resume_us_exports_desc:0 "Mesaj verildi. İhracat kanalını yeniden açmak, Amerika'nın üretimimize erişimini geri getirir."
 public_war_wariness_decision_category:0 "Halkın Savaş Yorgunluğu"
 public_war_weariness_effect:0 "Halkın Savaş Yorgunluğu"
 public_war_wariness_decision_category_desc:0 "\n£MAIN_desctext_weariness \n\n\n\nÜlkemiz şu anda savaşta. Çatışmaya eşlik eden meseleler artık her zamankinden önemli. Bir savaşı kazanmanın en etkili yolu, halkın savaşa desteğini sürdürmektir. Halk bir çatışmaya desteğini kaybettiğinde, savaşı zaten kaybetmişizdir.\n\n§YNot: Halk uzun savaşlardan hoşlanmaz. Savaş ne kadar kesin sonuç getirirse, ceza o kadar hafif olur.§!\n\nMevcut Savaş Desteği Cezası: [?war_support_factor_var|R0%]\n"
 AB_war_support_campaigns:0 "Savaş Desteği Kampanyası"
 AB_war_support_campaigns_desc:0 "Halk hükümetimize olan güvenini kaybediyor ve savaşı artık desteklememeye başlıyor. Onlara ekstra bir motivasyon verelim."
 AB_promises_of_peace:0 "Barış Vaatleri"
 AB_promises_of_peace_desc:0 "Savaş halkı yıpratıyor. Barış ihtimalini tartışan kampanyalar düzenlemeye başlamalıyız."
 Civil_war_decisions:0 "İç Savaş"
 Civil_war_decisions_desc:0 "Ülkemiz bir iç savaşın içinde. Bu durum bizim için bazı gayriahlaki yollara başvurmaya imkân veriyor. Yöntemler aşırı ama zorunlu."
 confiscate_civilian_vehicles:0 "Sivil Araçlara El Koy"
 confiscate_civilian_vehicles_desc:0 "Sivil araçlara el koyup bunları teknik araçlara ve zırhlı personel taşıyıcılara dönüştürebiliriz. Savaşa rağmen sivil araçlar hâlâ bol ve yenileri sınırdan kolayca kaçırılabilir."
 smuggle_small_arms:0 "Hafif Silah Kaçırt"
 smuggle_small_arms_desc:0 "Yerel atölyelerde kendi hafif silahlarımızı üretmenin yanı sıra, bazı bağlantıları harekete geçirip yurt dışından silah kaçırtmayı deneyebiliriz."
 smuggle_heavy_weapons:0 "Ağır Silah Kaçırt"
 smuggle_heavy_weapons_desc:0 "Yerel atölyelerde kendi ağır silahlarımızı üretmenin yanı sıra, bazı bağlantıları harekete geçirip yurt dışından silah kaçırtmayı deneyebiliriz. Elbette füzeleri sınırdan geçirmek, tüfekleri geçirmekten biraz daha zor."
 Conscripting_Child_Soldiers:0 "Çocuk Askerleri Askere Alma"
 force_conscript_children:0 "Çocuk Askerleri Zorla Askere Al"
 force_conscript_children_desc:0 "Çocukları ordumuza almaya başlayabiliriz. Birçok asimetrik çatışmada çocuklar zorla isyancı gruplara alınır ve şiddete karşı duyarsızlaştırılır. Bu çocukların kaderi, hayat boyu süren travmalar yüzünden içler acısıdır; çoğu ilerleyen yaşlarında daha fazla şiddete, alkole ve uyuşturucuya yönelir.\n\nÇocukları zorla askere almak güçlerimizi artırır, ama bu genç oğlanlar çoğu zaman canlı kalkandan başka bir işe yaramaz."
 buy_fuel_from_black_market:0 "Kara Borsadan Yakıt Satın Al"
 buy_fuel_from_black_market_desc:0 "Durumumuz yasal yoldan Yakıt tedarik etmeyi zorlaştırıyor. Ancak yakıtı yasa dışı yollardan satın almanın pek çok yolu var."
 PER_space_missions:0 "İran Uzay Ajansı"
 PER_prepare_reforms:0 "Reformlara Hazırlan"
 SER_rename_nation:0 "Adını Sırbistan ve Karadağ Olarak Değiştir"
 SER_rename_nation_desc:0 "Yugoslavya, Güney Slavların Ülkesi demektir; fakat 90'lardaki kanlı savaşlar bu Güney Slavların çoğunu elimizden aldı ve artık yalnızca Sırpların ve Karadağlıların ülkesiyiz. Kendimize ne isem o diye seslenilme vakti geldi."
 SER_rename_nation_2:0 "Adını Sırbistan Olarak Değiştir"
 SER_rename_nation_2_desc:0 "Karadağlı kardeşlerimizle birliği sonlandırdığımıza göre, ulusumuzun Sırbistan ve Karadağ adını taşımasına gerek kalmadı; artık yalnızca Sırbistan'ız ve bu şekilde temsil edilmeliyiz."
 game_rule_toggle_cheat_decisions:0 "§Y[show_cheat_decision_status_3]§! Hile Kararları §RKüresel Olarak§!"
