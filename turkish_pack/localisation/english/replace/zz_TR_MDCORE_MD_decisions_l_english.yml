 child_soldiers_category:0 "Çocuk Askerler"
 child_soldiers_category_desc:0 "Cenevre Sözleşmeleri dahil birçok uluslararası hukuk kaynağı, çocukların ordulara alınmasını yasaklar. Çocuk asker kullanımı bize insan gücü sağlayarak savaş çabamıza yardımcı olsa da silahlı kuvvetlerimizin etkinliğini aşındırır ve uluslararası meşruiyetimize zarar verir.\n\n§YÇocuk Asker Devşirme Seviyesi§!, saflarımıza yeni çocuk asker katılma hızını belirler. Negatif olursa orduya girenden daha fazla çocuk asker ordudan ayrılır.\n\nÇocuk Asker Sayısı: §Y[?Root.child_soldiers]§!\nAylık Çocuk Asker Devşirme Seviyesi: §Y[?Root.child_soldiers_recruitment]§!"
 Small_Scale_Demobilization:0 "Çocuk Askerlerin Küçük Çaplı Terhisi"
 Small_Scale_Demobilization_desc:0 "Ordumuzda az sayıda çocuk asker tespit ettik; bunları vakit kaybetmeden ailelerine geri göndermeliyiz."
 Child_Soldier_Demobilization:0 "Çocuk Askerleri Terhis Et"
 Child_Soldier_Demobilization_desc:0 "Ordumuzda hatırı sayılır sayıda çocuk asker tespit ettik; bunları vakit kaybetmeden ailelerine geri göndermeliyiz."
 Large_Scale_Demobilization:0 "Çocuk Askerlerin Büyük Çaplı Terhisi"
 Large_Scale_Demobilization_desc:0 "Ordumuzda çok sayıda çocuk asker tespit ettik; bunları vakit kaybetmeden ailelerine geri göndermeliyiz."
 Punish_Recruiters:0 "Devşirmecileri Cezalandır"
 Punish_Recruiters_desc:0 "Çocuk asker devşirenleri cezalandırırsak, askerlik subaylarının reşit olmayanları orduya katılmaya zorlamasını caydırırız."
 Subsidize_Reintegration:0 "Yeniden Entegrasyon Programlarına Destek Ver"
 Subsidize_Reintegration_desc:0 "Çocuk askerleri terhis etmek bir şeydir; onların rehabilite edilmesini ve yeniden silah almaya zorlanmamasını sağlamak bir başkası. Özellikle kız çocuk askerler toplumlarına dönerken ciddi zorluklarla karşılaşıyor. Sivil toplum kuruluşlarının eski çocuk askerleri topluma yeniden kazandırmasına yardım etmek, mevcut çocuk askerleri silah bırakmaya teşvik edecek."
 Strengthen_Legislation_and_Regulation:0 "Mevzuatı ve Düzenlemeleri Güçlendir"
 Strengthen_Legislation_and_Regulation_desc:0 "Çocuk askerleri terhis etmek ve devşirmecilerini cezalandırmak kısa ve orta vadede işe yarasa da bu çabaları gerçekten pekiştirmek için çocuk asker devşirilmesini önleyecek sağlam bir düzenleme sistemi kurup sürdürmeliyiz."
