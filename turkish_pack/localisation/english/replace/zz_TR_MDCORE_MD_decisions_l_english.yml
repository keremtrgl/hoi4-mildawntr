l_english:
 corruption_reform_challenge_category:0 "Yolsuzlukla Mücadele Reformu"
 corruption_reform_challenge_category_desc:0 "Hükümetin yolsuzluğu azaltmak için bir yılı var. Başarı, yolsuzluk teklif havuzundan rastgele bir fayda sağlar. Başarısızlık ise yolsuzluğu artırır ve gelecekteki reformlara direnci güçlendirir."
 corruption_reform_challenge:0 "Bir Yıl İçinde Yolsuzluğu Azalt"
 corruption_reform_challenge_desc:0 "Son tarihten önce ulusal yolsuzluk seviyesini düşür. Başarı, 200 gün boyunca rastgele bir yolsuzluk teklifi çarpanı kazandırır. Başarısızlık yolsuzluğu artırır ve reform maliyetlerini bir yıl boyunca yükseltir."
 allow_foreign_recruitment:0 "Yabancı Devşirmeye İzin Ver"
 allow_foreign_recruitment_desc:0 "Yabancı devşirmeye izin vermek, Allah yolundaki mücadeleye devam edebilmemiz için saflarımızı güçlendirme fırsatı verecek. Ancak bu adım, yabancı düşmanı cihatçılarımızın bir kısmı arasında hoş karşılanmayacak."
 draw_in_foreign_recruits:0 "Yeni Devşirmeler Çek"
 draw_in_foreign_recruits_desc:0 "[ROOT.GetLeader], sınırlarımızın dışından devşirme almamıza izin verdiğine göre, her yerden ve her fırsatta ek devşirmeler çekmeye başlamalıyız. Fakat bir sorun var. Bu devşirmeler davaya yeterince bağlı değilse, büyük Hilafetimiz yavaş yavaş onların fikirlerini de benimsemeye başlayacak."
 generic_coalition_politics_decisions:0 "[Root.GetFlag][Root.GetAdjective] Siyasi Kararlar"
 generic_coalition_politics_decisions_desc:0 "\n£MAIN_desctext_elections \n\n\n\n [Root.GetFlag]§YSiyasi Yasalar§!:\n\n[Root.GetFlag]§YSeçim Var mı§!: [has_elections_check]\n[Root.GetFlag]§YSeçim Barajı§!: [?election_threshold|%0] [term_limit_text]"
