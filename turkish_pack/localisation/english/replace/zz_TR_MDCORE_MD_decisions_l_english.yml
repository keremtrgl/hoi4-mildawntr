 SWI_join_the_united_nations:0 "Birleşmiş Milletler'e Katıl"
 SWI_join_the_united_nations_desc:0 "İsviçre uzun süredir tam üye olmak yerine BM gözlemci devleti olarak kaldı. Ulusal bir referandum, ülkenin Birleşmiş Milletler'e tam üyeliğini onaylayacak."
 SWI_pan_alpine_claims:0 "Pan-Alp İddiaları"
 SWI_claim_french_alps:0 "Fransız Alplerini Talep Et"
 SWI_claim_french_alps_desc:0 "Fransız Alp bölgelerinin ortak kaderi ve yönetimi konusunda Fransa ile ince bir dille müzakereleri başlat."
 SWI_claim_italian_alps:0 "İtalyan Alplerini Talep Et"
 SWI_claim_italian_alps_desc:0 "İtalyan Alp topraklarının geleceğini ve olası entegrasyonunu görüşmek için İtalya ile diplomatik kanalları yokla."
 SWI_claim_austrian_alps:0 "Avusturya Alplerini Talep Et"
 SWI_claim_austrian_alps_desc:0 "Avusturya ile Alp bölgelerinin statüsü hakkında diyalog kur."
 SWI_invite_liechtenstein:0 "Lihtenştayn'ı Katılmaya Davet Et"
 SWI_invite_liechtenstein_desc:0 "Lihtenştayn zaten bizim frangımızı, gümrük birliğimizi ve sınır muhafızlarımızı kullanıyor. Vaduz'dan düzenlemeyi tamamlamasını ve federasyona tamamen katılmasını iste."
 SWI_neutrality_decisions:0 "İsviçre Tarafsızlığı"
 SWI_end_true_neutrality:0 "Mutlak Tarafsızlığı Bırak"
 SWI_end_true_neutrality_desc:0 "Tamamen dışarıda kalmak, İsviçre'ye isteyebileceği her masada bir yer kaybettirdi. Bu doktrini kaldırmak, bir ittifaka katılma hakkını geri getirir; ancak onu ayakta tutan iç uzlaşının bedelini ödemek gerekir."
 remove_usaid:0 "USAID'i §RSonlandır§!"
 remove_usaid_desc:0 "Amerika'ya karşı dik durma ve yardımlarını reddetme zamanı geldi. Onlara ihtiyacımız yok ve hiçbir zaman da olmayacak. Bir ulus ve bir halk olarak, Batılı güçlerin ülkemize müdahalesine karşı dimdik duracağız."
 GEN_remove_saudi_aid:0 "Suudi Arabistan'ın Cami Finansmanını Durdur"
 GEN_remove_saudi_aid_desc:0 "Suudi Arabistan'ın ülkemizdeki cami finansmanı son derece gereksiz; artık varlıklarını büyük ülkemizden silme vakti geldi."
 GEN_crack_down_on_muslim_broterhood:0 "Müslüman Kardeşler'e Operasyon Yap"
 GEN_stop_crackdowns:0 "Müslüman Kardeşler Operasyonlarını Durdur"
 GEN_allow_al_jazeera:0 "El Cezire'ye İzin Ver"
 GEN_ban_al_jazeera:0 "El Cezire'yi Yasakla"
 LAT_reopen_the_vef_microchip_plant:0 "VEF Yarı İletken Tesisini Yeniden Aç"
 LAT_reopen_the_vef_microchip_plant_desc:0 "Riga'daki VEF yarı iletken üretim tesisi son dönemde zor günler geçirdi. Şirket 1999'da kapılarını kapattı; tesise yatırım yapıp ortak bir devlet girişimi altında yeniden canlandırmak değerli olabilir."
 BRICS_apply_to_join_brics:0 "BRICS'e Katılmak İçin Başvur"
 BRICS_apply_to_join_brics_desc:0 "BRICS ekonomik ittifakına katılmak, ülkemize küreselleşmiş ekonomide refaha ulaşmak için güçlü bir fırsat sunuyor. Diğer üye devletlerle iş birliği yaparak, ilgili herkes için daha istikrarlı ve müreffeh bir gelecek inşa etmeye yardımcı olabiliriz."
 BRICS_application_pending:0 "BRICS Üyelik Başvurusu Beklemede"
 discourage_population_growth_decision:0 "Nüfus Artışını Caydır"
 discourage_population_growth_decision_desc:0 "Ülkemizin nüfusu biraz fazla yükselmeye başladı. Nüfusumuzu daha fazla çocuk sahibi olmaktan caydırmalıyız..."
 demobilize_after_warfare_mission:0 "Ulusu §GSilahsızlandır§!"
 demobilize_after_warfare_mission_desc:0 "Savaş günlerimiz sona erdi, şimdi askeri harcamalarımızı kısmanın zamanı geldi."
 fascism_extremist_civil_war:0 "[Nat_Fascism_L] ([?party_pop_array^21|%0]) Darbe Başlatıyor"
 fascism_extremist_civil_war_desc:0 "[Nat_Fascism_L] öncülüğündeki aşırı sağ güçler giderek güçleniyor. Askerler ve bazı askeri liderler arasında popüler olan bu hareketle ilgili, iktidarı ele geçirmeye yönelik bir ayaklanma söylentileri dolaşmaya başladı. \n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 fascism_20_tt:0 "[Nat_Fascism_L] ([?party_pop_array^21|%1]) > %20 Popülarite"
 nat_autocracy_extremist_civil_war:0 "[Nat_Autocracy_L] ([?party_pop_array^22|%0]) Askeri Darbe Başlatıyor"
 nat_autocracy_civil_war_desc:0 "Ordu hükümet içinde güç kazanıyor. [Nat_Autocracy_L] önderliğinde, ordunun birçok unsuru bir cunta kurmak için hükümete karşı bir ayaklanmayı büyük olasılıkla destekler. \n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 nat_autocracy_20_tt:0 "[Nat_Autocracy_L] ([?party_pop_array^22|%1]) > %20 Popülarite"
 monarchist_extremist_civil_war:0 "[Monarchist_L] ([?party_pop_array^23|%0]) Darbe Başlatıyor"
 monarchist_extremist_civil_war_desc:0 "Mutlak Monarşiyi savunan monarşist güçler, [Monarchist_L] bayrağı altında güçleniyor. Askerler ve bazı askeri liderler arasında popüler olan bu hareketle ilgili, iktidarı ele geçirmeye yönelik bir ayaklanma söylentileri dolaşmaya başladı. \n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 monarchist_20_tt:0 "[Monarchist_L] ([?party_pop_array^23|%1]) > %20 Popülarite"
 caliphate_extremist_civil_war:0 "[Caliphate_L] ([?party_pop_array^11|%0]) Darbe Başlatıyor"
 caliphate_extremist_civil_war_desc:0 "Selefi Cihatçılık, [Root.GetName] içinde önemli bir güç haline geldi. Sıkı örgütlenmiş ve fanatik bir dini motivasyona sahip olan bu kesim, «yozlaşmış ve İslam karşıtı hükümeti» yenip kendi Hilafetini kurmak için uzun ve yıpratıcı bir savaşı göze almaya fazlasıyla hazır.\n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 caliphate_20_tt:0 "[Caliphate_L] ([?party_pop_array^11|%1]) > %20 Popülarite"
 communist_state_extremist_civil_war:0 "[communist_state_L] ([?party_pop_array^4|%0]) Darbe Başlatıyor"
 communist_state_extremist_civil_war_desc:0 "[communist_state_L] komünistleri artık yalnızca sokaklarda yürümekten ve bildiri dağıtmaktan bıktı. Bu sefer iş laf olmaktan çıktı. Toplumun geniş bir kesiminden destek alan komünistler, sonunda [Root.GetName] burjuva-emperyalist hükümetini devirecek sınıf mücadelesi silahlı devrimini başlatmaya hazır görünüyor; ezilen kitlelerin özlemini çektiği proletarya diktatörlüğünü nihayet kuracaklar! Lenin ve Mao'nun ruhu hâlâ yaşıyor - Viva la revolución!\n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 communist_state_20_tt:0 "[communist_state_L] ([?party_pop_array^4|%1]) > %20 Popülarite"
 neutral_communist_extremist_civil_war:0 "[Neutral_Communism_L] ([?party_pop_array^19|%0]) Darbe Başlatıyor"
 neutral_communist_extremist_civil_war_desc:0 "[Neutral_Communism_L] komünistleri artık yalnızca sokaklarda yürümekten ve bildiri dağıtmaktan bıktı. Bu sefer iş laf olmaktan çıktı. Toplumun geniş bir kesiminden destek alan komünistler, sonunda [Root.GetName] burjuva-emperyalist hükümetini devirecek sınıf mücadelesi silahlı devrimini başlatmaya hazır görünüyor; ezilen kitlelerin özlemini çektiği proletarya diktatörlüğünü nihayet kuracaklar! Lenin ve Mao'nun ruhu hâlâ yaşıyor - Viva la revolución!\n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 neutral_communist_20_tt:0 "[Neutral_Communism_L] ([?party_pop_array^19|%1]) > %20 Popülarite"
 vilayat_e_faqih_extremist_civil_war:0 "[Vilayat_e_Faqih_L] ([?party_pop_array^9|%0]) Darbe Başlatıyor"
 vilayat_e_faqih_extremist_civil_war_desc:0 "İran'ın 1979 İslam Devrimi'nden ilham alan ve Direniş Ekseni güçlerinin ideolojik desteğini arkasına alan [Vilayat_e_Faqih_L], çoğu için «şehadetin tatlı şerbetini tatmak» anlamına gelse bile hükümeti devirmeye hazır olduğu söyleniyor. Sıkı örgütlenmiş, güçlü ideolojik ve dini temellere sahip olan bu kesim, Siyonizme ve Batı etkisine karşı bir kale olacak bir «İslam Fıkhı Hükümeti» kurmayı hedefliyor.\n\nEtki:\n§Hİç Savaşı Başlat: %50 güç§!\n\n§RBunu tetiklemek, ayaklanmanın kontrolünü ele geçirmenize yol açar§!"
 vilayat_e_faqih_20_tt:0 "[Vilayat_e_Faqih_L] ([?party_pop_array^9|%1]) > %20 Popülarite"
 promote_outlook_decision_category:0 "Görüşleri Teşvik Et"
 promote_outlook_decision_category_desc:0 "Ülke içinde destekleyebileceğimiz bazı hizipler var."
 promote_outlook_decision_support_pro_western_parties:0 "§YBatı Yanlısı§! Propaganda Kampanyası"
 promote_outlook_decision_support_pro_western_parties_desc:0 "Bilgi savaşı yoluyla dünyadaki durum hakkında kamuoyunu etkileyebiliriz. Ancak insanlar giderek ilgisini kaybettiği için böyle bir kampanya yalnızca sınırlı bir süre etkili olacaktır.\n\n§YPropaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YBatı Yanlısı Propaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%]"
 promote_outlook_decision_support_emerging_parties:0 "§YYükselen Görüş§! Propaganda Kampanyası"
 promote_outlook_decision_support_emerging_parties_desc:0 "Bilgi savaşı yoluyla dünyadaki durum hakkında kamuoyunu etkileyebiliriz. Ancak insanlar bir süre sonra ilgisini kaybettiği için böyle bir kampanya yalnızca sınırlı bir süre etkili olacaktır.\n\n§YPropaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YYükselen Görüş Propaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%]"
 promote_outlook_decision_support_the_non_aligned_parties:0 "§YBağlantısız§! Propaganda Kampanyası"
 promote_outlook_decision_support_the_non_aligned_parties_desc:0 "Bilgi savaşı yoluyla dünyadaki durum hakkında kamuoyunu etkileyebiliriz. Ancak insanlar giderek ilgisini kaybettiği için böyle bir kampanya yalnızca sınırlı bir süre etkili olacaktır.\n\n§YPropaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YBağlantısız Propaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%]"
 promote_outlook_decision_support_the_nationalists:0 "§YMilliyetçi§! Propaganda Kampanyası"
 promote_outlook_decision_support_the_nationalists_desc:0 "Bilgi savaşı yoluyla dünyadaki duruma milliyetçi bir gözle bakılması için kamuoyunu etkileyebiliriz. Ancak insanlar giderek ilgisini kaybettiği için böyle bir kampanya yalnızca sınırlı bir süre etkili olacaktır.\n\n§YPropaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YMilliyetçi Propaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%]"
 promote_outlook_decision_support_the_salafists:0 "§YSelefi§! Telkin Kampanyası"
 promote_outlook_decision_support_the_salafists_desc:0 "Bilgi savaşı yoluyla, aşırı muhafazakâr din adamlarını ve benzerlerini öne çıkararak dünyadaki durum hakkında kamuoyunu Selefilik lehine etkileyebilir ve radikalleştirebiliriz. Ancak insanlar giderek ilgisini kaybettiği için böyle bir kampanya yalnızca sınırlı bir süre etkili olacaktır.\n\n§YPropaganda Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YSelefi Telkin Kampanyası Maliyeti§! Çarpanı: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%]"
 promote_reduced_spending_campaigns:0 "Daha Düşük Devlet Harcaması Kampanyası"
 promote_reduced_spending_campaigns_desc:0 "Hükümetin acilen tasarruf tedbirlerine ihtiyacı var, ancak halk, hükümetin eline geçen paranın nerede kullanılması gerektiği konusunda çok farklı düşünüyor. İyi yerleştirilmiş bir propaganda kampanyasıyla halkı doğru yöne sevk edebiliriz."
