 type_99_decision:0 "ZTZ-99 Phase-I Plus Tasarımı Oluştur"
 type_99_decision_desc:0 "ZTZ-99 Phase-I Plus, WZ123 (Proje 9910) modelinin gelişmiş korumaya sahip yükseltilmiş bir türevidir. FY-4 reaktif zırhı ve erken lazer uyarı sistemiyle donatılmıştır."
 type_99_II_decision:0 "ZTZ-99 Phase-II Tasarımı Oluştur"
 type_99_II_decision_desc:0 "Proje 0910'un bir parçası olan ZTZ-99 Phase-II; geliştirilmiş taret yapısı, yükseltilmiş muharebe sahası bilgi sistemleri ve lazer karşı tedbir cihazı sunar."
 type_99a_decision:0 "ZTZ-99A Tasarımı Oluştur"
 type_99a_decision_desc:0 "ZTZ-99A tankı bilişimleştirme alanında bir atılımı temsil eder ve Çin'in yerli olarak geliştirdiği ilk dijitalleştirilmiş tanktır. Önceki modellere kıyasla taret ve şasi süspansiyon sistemi neredeyse tamamen yeniden tasarlanmıştır."
 ztq_15_decision:0 "ZTQ-15 Tasarımı Oluştur"
 ztq_15_decision_desc:0 "ZTQ-15, kompakt tasarımı ve hafif yapısı sayesinde Çin'in batısındaki yaylalarda ve güneydeki sık su yollarıyla kaplı arazilerde konuşlandırılmak için idealdir."
 zbd_04a_decision:0 "ZBD-04A Tasarımı Oluştur"
 zbd_04a_decision_desc:0 "ZBD-04 ZMA'nın geliştirilmiş türevi («502 Modifikasyonu» olarak da bilinir), orijinal modele kıyasla amfibi performans gereksinimlerini düşürür, yeniden tasarlanmış ve güçlendirilmiş gövde zırhına sahiptir ve yeni bir lazer uyarı sistemiyle donatılmıştır."
 zbl_08_decision:0 "ZBL-08 Tasarımı Oluştur"
 zsl_10_decision:0 "ZSL-10 Tasarımı Oluştur"
 pgz_09_decision:0 "PGZ-09 Tasarımı Oluştur"
 pgz_09_decision_desc:0 "PGZ-09, GDF-002'nin Çin'de lisansla üretilen bir sürümü olan iki PG99 uçaksavar topu kullanır ve sahra hava savunmasında PGZ-95'in yerini alır. Başarısı sayesinde Çin, ilk kez yüksek hareketli hedeflere karşı nihai hava savunma kabiliyetine ulaştı ve gelişmiş ülkelerdeki benzer sistemlerin seviyesini yakaladı."
 plz_05_decision:0 "PLZ-05 Tasarımı Oluştur"
 plz_05_decision_desc:0 "PLZ-05, yeni yüzyılda Çin Halk Kurtuluş Ordusu topçusunun modernleşmesinin kilit teçhizatlarından biri olarak, ordu hizmetindeki ilk 155 mm paletli kendinden tahrikli obüstür. Yeni bir şasi ve gelişmiş topçu teknolojileri kullanan bu kendinden tahrikli obüs dünya standartlarına ulaşmış olup Kara Ordusunun ateş desteği kabiliyetlerini önemli ölçüde artırmıştır."
