 protests_decision_category_desc:0 "Protestoları ve diğer kötü toplumsal gelişmeleri önlemek için vatandaşlarımızın beklentilerini karşılamamız gerekiyor.\n\nMevcut protesto şiddeti: [protest_strength_TT]\nMevcut protesto radikalleşmesi: [protest_radicalisation_TT][fuel_protests_TT]\n\n\nRapor nasıl okunur:\n§GYeşil§! kareler, vatandaşlarımızın talep ettiği ve mevcut harcamamızın karşıladığı harcama seviyesini gösterir\n§RKırmızı§! kareler, vatandaşlarımızın talep ettiği ancak mevcut harcamamızın karşılamadığı harcama seviyesini gösterir - protestoların güçlenmesinin kaynağı budur\n§BMavi§! kareler, vatandaşlarımızın talep etmediği ama mevcut harcamamızın karşıladığı harcama seviyesini gösterir\nBeyaz kareler, ne karşılanan ne de beklenen olası harcama seviyelerini gösterir"
