 AUTOMATION_SETTINGS_OPEN_TT:0 "Otomasyon Ayarlarını Aç"
 AUTOMATION_SETTINGS_TITLE:0 "Otomasyon Ayarları"
 AUTOMATION_SETTINGS_DESC:0 "Yinelenen eylemleri ve bildirim tercihlerini tek bir panelden yönetin. Başka yerlerdeki mevcut kontroller kullanılabilir kalır."
 AUTOMATION_SETTINGS_GENERAL_PAGE:0 "Orgeneral"
 AUTOMATION_SETTINGS_SPACE_PAGE:0 "Uydular"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE:0 "Nüfuz"
 AUTOMATION_SETTINGS_SPACE_DESC:0 "Otomatik uydu üretimini, fırlatmaları ve takımyıldız yükseltmelerini yapılandırın."
 AUTOMATION_SETTINGS_INFLUENCE_DESC:0 "Hükümetimizi yabancı nüfuzdan koruyan yinelenen eylemleri yapılandırın."
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT:0 "Birleşmiş Milletler eylemleri, Bildirim Tercihleri ve diğer küçük otomasyon eylemleri gibi genel otomasyonu yapılandırın."
 AUTOMATION_SETTINGS_SPACE_PAGE_TT:0 "Otomatik uydu üretimini, fırlatmaları ve takımyıldız yükseltmelerini yapılandırın.\n\n§YÖn Koşullar:§!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT:0 "Nüfuz savunması ve saldırısı gibi nüfuz otomasyonunu yapılandırın."
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT:0 "Vergi oranları, bütçe yasaları, yatırımlar ve enerji gibi ekonomik otomasyonu yapılandırın."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT:0 "Uzay Programında hazırlanan faydalı yük manifestosunu §YÖzel§! plan olarak kaydedin ve ona geçin.\n\n§YÖn Koşullar:§!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT:0 "Mevcut yörünge kapsamasının desteklediği her yerde, her takımyıldızı araştırılmış en yeni nesle yükseltin.\n\n§YÖn Koşullar:§!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER:0 "Bildirimler ve Tercihler"
 AUTOMATION_SETTINGS_UN_HEADER:0 "Birleşmiş Milletler"
 AUTOMATION_SETTINGS_NATO_HEADER:0 "NATO"
 AUTOMATION_SETTINGS_ENERGY_HEADER:0 "Enerji"
 AUTOMATION_SETTINGS_PP_RESERVE:0 "Siyasi Güç Rezervi"
 AUTOMATION_SETTINGS_PP_RESERVE_TT:0 "Siyasi Güç harcayan otomatik eylemler, maliyetlerini Siyasi Gücü bu rezervin altına düşürmeden ödeyebilene kadar bekler. Elle yapılan eylemler etkilenmez.\n\n£click_left §YSol Tıkla§!: §Y1§! ayarla\n£key_ctrl + £click_left §YCtrl Sol Tıkla§!: §Y10§! ayarla\n£key_shift + £click_left §YShift Sol Tıkla§!: §Y100§! ayarla"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT:0 "£click_left §YSol Tıkla§!: §Y1§! artır\n£key_ctrl + £click_left §YCtrl Sol Tıkla§!: §Y10§! artır\n£key_shift + £click_left §YShift Sol Tıkla§!: §Y100§! artır"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT:0 "£click_left §YSol Tıkla§!: §Y1§! azalt\n£key_ctrl + £click_left §YCtrl Sol Tıkla§!: §Y10§! azalt\n£key_shift + £click_left §YShift Sol Tıkla§!: §Y100§! azalt"
 AUTOMATION_SETTINGS_CORRUPTION:0 "Yolsuzluk Tekliflerini Otomatik Reddet"
 AUTOMATION_SETTINGS_CORRUPTION_TT:0 "Yolsuzluk tekliflerini otomatik olarak atla. Bu açıkken olaylar ve olası ödülleri görünmez."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION:0 "Yabancı Seçim Bildirimleri"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT:0 "Diğer ülkelerdeki seçimler hakkında haber bildirimleri göster."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS:0 "Nüfuz Baskını Bildirimleri"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT:0 "Diğer ülkeler arasındaki nüfuz baskınlarıyla ilgili olayları göster. Bu kapalıyken bize yönelik baskınlar yine de bildirilir."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT:0 "Aylık Otomatik Nüfuz Raporu"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT:0 "Otomatik nüfuzdan etkilenen ülkeleri listeleyen aylık raporu göster."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE:0 "Yatırım Tekliflerini Otomatik Kabul Et"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT:0 "Gelen her uluslararası yatırım teklifini otomatik olarak kabul et. Bunu açmak otomatik reddi kapatır."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION:0 "Yatırım Tekliflerini Otomatik Reddet"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT:0 "Gelen her uluslararası yatırım teklifini otomatik olarak reddet. Bunu açmak otomatik kabulü kapatır."
 AUTOMATION_SETTINGS_REINVESTMENT:0 "Uluslararası Yatırım Yeniden Yatırımı"
 AUTOMATION_SETTINGS_REINVESTMENT_TT:0 "Uluslararası yatırımlardan elde edilen haftalık getirilerin hazine ile yeniden yatırım arasında nasıl bölüneceğini seçin."
 AUTOMATION_SETTINGS_REINVEST_OFF:0 "Kapalı"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT:0 "Tüm uluslararası yatırım getirilerini hazineye gönder."
 AUTOMATION_SETTINGS_REINVEST_FULL:0 "Tam"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT:0 "Tüm uluslararası yatırım getirilerini yeniden yatırıma çevir."
 AUTOMATION_SETTINGS_REINVEST_SPLIT:0 "Böl"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT:0 "Uluslararası yatırım getirilerinin yarısını hazineye gönder, diğer yarısını yeniden yatırıma çevir."
 AUTOMATION_SETTINGS_FUEL_PURCHASE:0 "Otomatik Yakıt Alımı"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT:0 "Hemen yakıt satın al, ardından her 28 günde bir kontrol et ve yakıt rezervleri yüzde 20'nin altına düştüğünde yeniden satın al. Gelecekteki alımları iptal etmek için bunu kapat."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS:0 "Seçili İç Yatırımları Tekrarla"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT:0 "Etkinken günlük £pol_power §R0,15§! Siyasi Güç öde. Tekrarlanacak eyaleti ve yatırım türlerini seçmek için eyalet görünümündeki iç yatırım düğmelerine sağ tıklayın. Seçili yatırımlar haftalık kontrol edilir ve boş bir yuva olduğunda, hazine mevcut maliyeti ödeyebildiğinde ve Siyasi Güç Rezervi korunabildiğinde yürütülür."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY:0 "Antarktika İstasyonunu Otomatik İkmal Et"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT:0 "Antarktika istasyonumuz için Kasım'dan Mart'a kadar 15 veya daha az gün, Nisan'dan Ekim'e kadar 30 veya daha az gün kaldığında otomatik yakıt siparişi ver. Teslimatlar §R1000 yakıt başına $0,25 milyar§! tutar ve Antarktika kışında iki katına çıkar. Siparişler hazine tam maliyeti ödeyebilene kadar bekler."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY:0 "Otomatik Tüketim Politikası"
 AUTOMATION_SETTINGS_SC_VOTE:0 "Güvenlik Konseyi Varsayılan Oyu"
 AUTOMATION_SETTINGS_SC_VOTE_TT:0 "Güvenlik Konseyi kararlarında otomatik olarak nasıl oy kullanacağımızı seçin. Elle oy vermeye dönmek için seçili seçeneğe yeniden tıklayın."
 AUTOMATION_SETTINGS_GA_VOTE:0 "Genel Kurul Varsayılan Oyu"
 AUTOMATION_SETTINGS_GA_VOTE_TT:0 "Genel Kurul kararlarında otomatik olarak nasıl oy kullanacağımızı seçin. Elle oy vermeye dönmek için seçili seçeneğe yeniden tıklayın."
 AUTOMATION_SETTINGS_VOTE_YES:0 "Evet"
 AUTOMATION_SETTINGS_VOTE_NO:0 "Hayır"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN:0 "Çekimser"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT:0 "Her Güvenlik Konseyi kararında otomatik olarak Evet oyu ver."
 AUTOMATION_SETTINGS_SC_REJECT_TT:0 "Her Güvenlik Konseyi kararında otomatik olarak Hayır oyu ver. Daimî üyeler uygun olduğunda veto kullanır."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT:0 "Her Güvenlik Konseyi kararında otomatik olarak çekimser kal."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT:0 "Her Genel Kurul kararında otomatik olarak Evet oyu ver."
 AUTOMATION_SETTINGS_GA_REJECT_TT:0 "Her Genel Kurul kararında otomatik olarak Hayır oyu ver."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT:0 "Her Genel Kurul kararında otomatik olarak çekimser kal."
 AUTOMATION_SETTINGS_NATO_RATIFICATION:0 "NATO Katılımlarını Otomatik Onayla"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT:0 "Her NATO üyelik adayını onaylamak için otomatik olarak £pol_power §Y20§! harca. Onay, Siyasi Güç Rezervi korunabilene kadar bekler."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER:0 "Nüfuz Savunması"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE:0 "Yabancı Nüfuzla Otomatik Mücadele Et"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT:0 "Etkinken günlük £pol_power §R0,05§! Siyasi Güç öde. Uygun olduğunda Yerli Bağımsızlığı §G%2,5§! artırmak için otomatik olarak £pol_power §Y100§! harca. 100 gün sonra tekrarlanır. Hükümet lobi baskısı altındayken ya da iki maliyetten biri Siyasi Gücü rezervin altına düşürecekse otomasyon duraklar."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS:0 "Yabancı Nüfuz Sahiplerine Otomatik Saldır"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT:0 "Etkinken günlük £pol_power §R0,05§! Siyasi Güç öde. En güçlü uygun yabancı nüfuz sahibine karşı 60 günlük bir kampanya başlatmak için otomatik olarak £pol_power §Y125§! harca. Aynı anda yalnızca bir kampanya yürür. Uygun olmayan, lobi baskısı altındaki ve soğuma sürecindeki hedefler atlanır. İki maliyetten biri Siyasi Gücü rezervin altına düşürecekse otomasyon duraklar."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE:0 "Etkin her seçenek günlük £pol_power §R0,05§! maliyetlidir. İki seçenek birlikte günlük £pol_power §R0,10§! maliyetlidir."
 AUTOMATION_SETTINGS_ECONOMY_PAGE:0 "Ekonomi"
 AUTOMATION_SETTINGS_ECONOMY_DESC:0 "Hangi vergilerin, kamu harcamalarının, yatırımların ve enerji alımlarının otomatik yönetileceğini seçin. Ayrıntılar için bir başlığın ya da seçeneğin üzerine gelin."
 AUTOMATION_SETTINGS_TAX_HEADER:0 "Vergi Oranları"
 AUTOMATION_SETTINGS_BUDGET_HEADER:0 "Bütçe Yasaları"
 AUTOMATION_SETTINGS_INVESTMENT_HEADER:0 "Yatırımlar"
 AUTOMATION_SETTINGS_TAX_SUMMARY:0 "Etkin vergiler, bütçe dengesine, borca ve İstikrara bağlı olarak haftada en fazla bir puan değişir.\n\nElle yapılan değişiklikler otomasyonu açık bırakır."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY:0 "Etkin bütçeler beklenen harcamaya doğru bir düzey ilerler. Dönüşümlü öncelikle haftada en fazla bir bütçe değişir. Artışlar bütçe fazlası gerektirir. Elle yapılan yasa değişiklikleri otomasyonu açık bırakır."
 AUTOMATION_SETTINGS_POPULATION_TAX:0 "Halk Vergisi: %[?population_tax_rate|0]"
 AUTOMATION_SETTINGS_CORPORATE_TAX:0 "Kurumlar Vergisi: %[?corporate_tax_rate|0]"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT:0 "Halk Vergisini bütçe dengesi, borç ve İstikrara göre haftada bir puan otomatik ayarla. Vergi değişikliği kısıtlamalarına uyar ve rezervin üzerindeki olağan Siyasi Güç maliyetini öder. Elle yapılan vergi değişiklikleri bu seçeneği açık bırakır."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT:0 "Kurumlar Vergisini bütçe dengesi, borç ve mevcut sivil fabrikalara göre haftada bir puan otomatik ayarla. Vergi değişikliği kısıtlamalarına uyar ve rezervin üzerindeki olağan Siyasi Güç maliyetini öder. Elle yapılan vergi değişiklikleri bu seçeneği açık bırakır."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY:0 "Bürokrasi: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT:0 "Bürokrasiyi beklenen harcama düzeyine doğru her seferinde bir düzey otomatik ilerlet. Sayılar mevcut ve beklenen düzeyleri gösterir. Olağan yasa kısıtlamaları ve Siyasi Güç maliyetleri geçerlidir. Artışlar fazla gerektirir ve yaklaşan iflas sırasında duraklar. Siyasi Güç rezervi korunur. Elle yapılan yasa değişiklikleri bu seçeneği açık bırakır."
