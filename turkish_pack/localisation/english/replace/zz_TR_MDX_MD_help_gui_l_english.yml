l_english:
 HELP_BUTTON_TT:0 "Bu sekmenin yardım pencerelerini açmak için bu düğmeye tıkla. Tüm pencereleri kapatmak için düğmeye yeniden tıkla"
 HELP_BUTTON_TT_delayed:0 "Yardım pencereleri Millennium Dawn'ın mekaniklerini açıklar. Bu düğmeyi oyundaki çeşitli sekmelerde bulabilirsiniz"
 HELP_BUTTON_PARTIES_TT:0 "Siyasi partileriniz 5 ayrı §HGörüşe§! bölünmüştür: Batı, Yükselen, Selefi, Bağlantısız ve Milliyetçi. Her §HGörüş§! §HPartilere§! ayrılır. İki yeşil oka tıklayarak ülkenizin tüm partilerini ve her Görüşün ve partinin neyi temsil ettiğine dair açıklamaları görebilirsiniz. Bu pencerede partileri destekleyebilir ve onlara saldırabilirsiniz. Bir partinin azami popülerliği, ait olduğu Görüşün popülerliğiyle sınırlıdır. Seçimlerden sonra en yüksek popülerliğe sahip §HParti§! kazanır"
 HELP_BUTTON_PARTIES_TT_delayed:0 "Seçimler hakkında:\nSeçimlerden sonra seçimi kazanan parti, mecliste çoğunluğa ulaşmak için diğer partilerle koalisyon kurmak zorundadır. Bunu yapamazsa §HSiyasi Güç§! cezası alırsınız. İktidar partisi en büyük iki parti arasından seçilir ve en büyük iki parti birlikte koalisyon kuramaz. Koalisyon kurma §HKararlar Sekmesinde§! yapılır ve bunun için yalnızca sınırlı süreniz olur"
 HELP_BUTTON_GDP_TT_delayed:0 "Not! Ülkenizin 78'den fazla fabrikası varsa her eyalette bir boş yuva bırakıp yine de kişi başı GSYİH'nizi yükseltebilirsiniz"
 HELP_BUTTON_FINANCES_TT:0 "Hükümetinizin gelirini ve giderini yönetmek önemlidir. Üst çubukta §HBorcunuzu§!, §HHazinenizi§! ve §HUluslararası Yatırımlarınızı§! görürsünüz.\n\n§HBorç§!, ülkenizin ne kadar para ödünç aldığını gösterir. Krediniz için faiz ödemek zorundasınız. Faiz oranlarınız borç/GSYİH oranınıza göre belirlenir. Yüksek bir faiz oranı (>%15) iflasa yol açabilir!\n\n§HHazine§!, ülkenizin şu anda ne kadar parası olduğunu gösterir. Hazinenin üzerine gelerek haftalık kâr mı yoksa açık mı verdiğinizi görebilirsiniz. Hazineniz yoksa ve açık veriyorsanız borcunuz otomatik olarak artar.\n\n§HUluslararası Yatırımlar§!, ülkenizin yurt dışına ne kadar yatırım yaptığını gösterir. Yatırımlarınızdan sabit bir getiri oranı elde edersiniz ve bu haftalık gelirinize eklenir. Size ait olmayan bir eyalete tıklayıp eyalet penceresinin üstündeki inşa menüsünden seçim yaparak diğer ülkelere yatırım yapabilirsiniz.\n\nHarcama düzeylerinizi artırmak çeşitli bonuslar sağlar ancak size daha fazla paraya mal olur"
 HELP_BUTTON_FINANCES_TT_delayed:0 "Not! Millennium Dawn'da ekonomi gerçek hayattan esinlenerek modellenmiştir. Gerçek hayatta olduğu gibi açık vermek ve harcamalarınızın bir kısmını borçla finanse etmek normaldir. Yeter ki ekonomi genişleterek ve kişi başı GSYİH'nizi artırarak faiz oranınızı kontrol altında tutun!"
 HELP_BUTTON_INTERNAL_FACTIONS_TT:0 "İç Hizipler, ülkenizde siyasi güce sahip güçlü grupları temsil eder. Sizi severlerse size bonuslar verirler. Sizden hoşlanmayan hizipler ise tam tersi bir etki yaratır. İç hizipler sizden bir şeyler talep edebilir ve siyaset ile ulusal odaklar konusunda seçeneklerinizi sınırlayabilir. İç hiziplerin görüşü odaklar, kararlar ve olaylar yoluyla değişebilir"
 HELP_BUTTON_TRADE_TT:0 "Ticaret yasanızın düzeyi, doğal kaynaklarınızın ne kadarının pazara ihraç edileceğini belirler. Kaynak ihraç ettiğinizde ek gelir elde edersiniz. Başka bir ülke kaynaklarınızı satın alsın ya da almasın gelir elde edersiniz"
 HELP_BUTTON_DECISIONS_TT:0 "Millennium Dawn, içerik için temel oyuna göre çok daha fazla karar kullanır. Yeni kararlar için mevcut kararlarınızı düzenli olarak kontrol etmeyi unutmayın. İlgilenmediğiniz kararların işaretini kaldırabilirsiniz; ortaya çıkan her yeni karar '§HMevcut Kararlar§!' bildirimini otomatik olarak tetikler"
 HELP_BUTTON_RESEARCH_TT:0 "Millennium Dawn'da ülkeler, gerçek dünyada kendi geliştirdikleri teçhizatla ve başlangıç şablonları için ihtiyaç duydukları temel teçhizatla başlar. Küçük bir ülke olarak en modern teçhizatı edinmek için daha büyük ülkelere güvenmek zorundasınız. Kendi kendine yetmek istiyorsanız yerli silah sistemleri geliştirmek için hatırı sayılır kaynak yatırmalısınız"
 HELP_BUTTON_SLOTS_TT:0 "Millennium Dawn'da araştırma yuvaları çok sınırlıdır ve neyi güncel tutacağınıza öncelik vermelisiniz. Ulusal odaklarla daha fazla araştırma yuvası edinilebilir"
 HELP_BUTTON_INFLUENCE_TT:0 "Her ülke, yabancı ülkelerin §HNüfuzundan§! etkilenir. Nüfuz, ülkelerin birbirleri üzerindeki yumuşak gücü ve denetimini temsil eder. Ülkeler doğal olarak kendilerine nüfuz edenlerle aynı §HGörüşe§! doğru kayar. Başka bir ülkenin nüfuzu ne kadar fazlaysa kayma o kadar güçlüdür. Nüfuz harcayarak ülkeler diğer ülkelerin siyasetini etkileyebilir, kaynak elde edebilir ve hatta diğer ülkeleri kukla yapabilir. Nüfuz, §HSiyasi Güç§! harcayarak veya diğer ülkelere yatırım yaparak kazanılır. Kararlar sekmesindeki bir karar aracılığıyla nüfuza karşı mücadele edebilirsiniz"
 HELP_BUTTON_RESOURCES_TT:0 "Temel oyundan farklı olarak Millennium Dawn'da tüm askerî teçhizatın üretimi petrol maliyetlidir. Bu, ülkeleri barış zamanında bile petrol satın almaya teşvik etmek ve onları petrol üreten ülkelere bağımlı kılmak içindir"
 HELP_BUTTON_TEMPLATES_TT:0 "Birlikler temel oyundan epeyce farklıdır. Kabaca, birlikler ağırlaştıkça güçlenir (Hafif Piyade -> Piyade -> Motorize Piyade -> Zırhlı Piyade -> Zırhlı), ancak bunun bedeli olarak daha pahalıdır ve arazi cezalarını daha çok yer.\n\nTemel muharebe genişliği temel oyuna kıyasla 60'tan 120'ye çıkarılmıştır ve tek tek tabur genişlikleri çoğu zaman tek sayılardır. Bu, şablonlarınız için en uygun muharebe genişliğine sahip olmanın önemini azaltmak içindir. Çoğu durumda mevcut muharebe genişliğini sonuna kadar dolduramazsınız. Birlik boyutu açısından daha büyük birlikler her zaman daha iyidir"
 HELP_BUTTON_EQUIPMENT_TT:0 "Millennium Dawn'da tüm başlangıç birlikleriniz teçhizatsız başlar. Tüm başlangıç teçhizatı bunun yerine ülkelerin başlangıç stoklarına konur. Bu, tüm ülkelerin gerçek tarihî teçhizatlarıyla başlamasını sağlamak içindir. Bu nedenle hemen yeni birlik eğitmeye başlamamak iyi bir fikirdir; zira mevcut birliklerinizden teçhizat 'çalmış' olursunuz. Başlangıç birliklerinizin dolması oyun içi zamanla kabaca bir hafta sürer"
