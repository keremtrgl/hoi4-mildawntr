l_english:
 education_dynamic_modifier:0 "Okuryazarlık Oranı Dinamik Değiştiricisi"
 education_dynamic_modifier_desc:0 "Artan finansman, dümende sağlam bir el ve biraz sabırla bu ulus §YOkuryazarlık Oranının§! arttığını görebilir. Daha yüksek bir okuryazarlık oranı, §HOfis İşleri§! gibi eğitimli sektörlerde daha fazla verimlilik anlamına gelir.\n\nAncak ulus bir §YTarıma Dayalı Ekonomiye§! sahipse, okuryazarlık oranını düşürmenin de yararları vardır, örneğin..."
 education_category:0 "[ROOT.GetNameWithFlag] Ülkesinde Okuryazarlık Oranları"
 education_category_desc:0 "Halkına ihtiyaç duyduğu eğitimi sağlamakta zorlanan bir ulus olarak [ROOT.GetName], §Y$education_dynamic_modifier$§! cezalarını azaltabilmek için eğitim bütçesini etkili biçimde yönetmelidir; okul yılının sonuna yakın her yıl §YOkuryazarlık Oranı§! hakkında size bir rapor verilecektir.\n§YOlaylar§!, §YKararlar§! ve §YOdak Ağacında§! yapılan seçimler bu oranı artırabilir (veya azaltabilir).\n\n§YOkuryazarlık Oranı§! %95 olduğunda [ROOT.GetName] bu mekaniği kaybeder; §YOkuryazarlık Oranı§! %90'ın altına düşerse mekanik geri döner, bu çeşitli etkenlerle gerçekleşebilir.\n\n[ROOT.GetNameWithFlag] ülkesinin Mevcut §YOkuryazarlık Oranı§!: [?ROOT.literacy_rate|%2]"
 literacy_rate_change_TT:0 "§YOkuryazarlık Oranı§! şu kadar değişir: [?LR_change|+%2]"
 literacy_rate_change_event_TT:0 "§YOkuryazarlık Oranı§! şu kadar değişir: [?literacy_change_stored|+%2]"
 lit_rate_TT_yes:0 "\n\n[FROM.GetName] ülkesinin şu anda §YOkuryazarlık Oranı§! [?FROM.literacy_rate|Y%2]; ilhak gerçekleşirse bu, [ROOT.GetName] ülkesinin §YOkuryazarlık Oranını§! etkileyecek!"
 literacy_productivity_TT:0 "\n  Okuryazarlık dahil: [?literacy_productivity_gain|3+]"
 education.1.t:0 "Egitim Bakani Yüksek Okuryazarlik Oranlarini Bildiriyor!"
 education.1.d:0 "İhtiyatlı eğitim finansmanımız ve ustaca yönetilen müfredatlarımız meyvesini vermiş görünüyor; yüzde 95'in üzerindeki okuryazarlık oranıyla artık hem ulusun sınırları içinde hem dışında karamsarların fazla direnişiyle karşılaşmadan kendimize yüksek eğitimli ve bilgili bir toplum diyebiliriz. Bu muazzam hedefe ulaştığımız için artık ulusumuzun okuryazarlık oranlarına dair yıllık rapor almayacağız."
 education.1.A:0 "Günlük elmam hâlâ geliyor mu?"
 education.2.t:0 "Egitim Bakani Okuryazarlik Oranlarinin Sendeledigini Bildiriyor!"
 education.2.d:0 "Tüm çabalarımıza rağmen okuryazarlık oranlarımız düşmüş görünüyor; bunun nedeni eğitim sistemini iyi finanse etme desteğinin sarsılması mı yoksa daha az okuryazar insanların kitlesel akını mı, bilemiyoruz. Ulusumuzun okuryazarlık oranlarına dair yeniden yıllık rapor alacağız."
 education.2.A:0 "Alfabe kitaplarım nerede?"
 education_literacy_pulse.1.t:0 "Okullar Yaz Için Tatil!"
 education_literacy_pulse.1.d:0 "Okullar yaz tatiline girerken, işler ne kadar zor olursa olsun öğrencilerimizin bayrağı selamlamasını umuyoruz. Raporlar geldi ve öğrencilerimizin sınavları hesaplandı; ne olursa olsun umalım ki kendilerini faydalı kılsınlar, olur mu?"
 education_literacy_pulse.1.A:0 "Umarım notlarımız iyidir."
