 corvette_desc:0 "Savaş gemisi sayılan en küçük gemi sınıfı. Korvet sınıfı gemiler ucuzdur ve daha büyük emsallerinden daha harcanabilirdir."
 frigate:0 "Fırkateyn"
 frigate_desc:0 "Birçok modern donanmanın çekirdeğini oluşturan Fırkateynler, 'açık deniz' deniz kuvvetlerinin bir parçası olarak kullanılabilir."
 destroyer:0 "Muhrip"
 destroyer_desc:0 "Filodaki daha büyük gemilere eşlik etmek üzere tasarlanan bu hızlı, manevra kabiliyetli, uzun dayanıklı savaş gemileri bağımsız harekâta da aynı derecede yeteneklidir."
 stealth_destroyer:0 "Hayalet Muhripler"
 stealth_destroyer_desc:0 "Düşmanın gemiyi tespit etme ve ona müdahale etme yeteneğini en aza indirirken ateş gücünü yerine koymak için tasarlanmış ilk hayalet gemiler."
 cruiser:0 "Kruvazör"
 cruiser_desc:0 "Modern bir filodaki genellikle en büyük hücum gemileri olan bu güçlü varlıklar tüm dünya okyanuslarını ve denizlerini kapsayabilir."
