l_english:
 MD_ace_promoted.1.t:0 "As Pilot Terfi Etti"
 MD_ace_promoted.1.d:0 "[Root.GetAdjective] hava kuvvetlerinin cesur pilotları kadar az kişi bu denli risk alır. [From.GetCallsign] çağrı adıyla tanınan yetenekli pilot [From.GetName] [From.GetSurname], yalnızca sağ dönmekle değil, [From.GetWing] uçağını eşsiz bir beceriyle uçurmakla da öne çıktı. Yakın zamanda [From.GetMissionRegion] üzerindeki bir görevde yer alan [From.GetName], bu kritik çatışmanın başarısında belirleyici oldu.\n\n[Root.GetAdjective] cesaretinin parlak bir örneği olarak gösterilen [From.GetName] kişisinin son terfisi geniş çapta duyuruldu. Halk savaşı zaferden çok cehennem olarak görse de, arkasında toplanılacak kahramanların hâlâ var olmasına sevinenler çok."
 MD_ace_promoted.1.a:0 "Cesaret eden kazanır."
 MD_ace_died.1.t:0 "[From.GetCallsign] [From.GetMissionRegion] Üzerinde Öldürüldü"
 MD_ace_died.1.d:0 "[From.Owner.GetName] ülkesinin en ünlü [From.GetAceType] asları arasındaki [From.GetFullName] görev başında düştü. Görevden dönen pilotlar, [From.GetWingShort] uçağının yoğun düşman ateşi altında [From.GetMissionRegion] üzerinde alevler içinde düştüğünü gördüklerini bildirdi. Ne yazık ki uzun süredir kamuya mal olmuş biri olduğundan, [From.GetCallsign] kaybı ona hayranlık duyan birçok insanın moralini ciddi biçimde bozuyor.\n\nBu olayı halktan saklamanın bir yolu olsun isterdik, ancak [From.GetName] kişisinin kamu karşısına çıkmaması kısa sürede şüphe uyandırırdı. Nihayetinde onun ölümü, umarım bugünkü sıkıntılarımızdan çok sonra da yaşayacak bir efsanenin parçasıdır."
 MD_ace_died.1.a:0 "Yaşayan efsane yine de daha iyi."
 MD_ace_killed_by_ace.1.t:0 "[From.GetFullName], [Prev.GetCallsign] Tarafından Düşürüldü"
 MD_ace_killed_by_ace.1.d:0 "[From.GetMissionRegion] üzerinden dönen pilotlar, ünlü [Prev.GetCallsign] komutasındaki [Prev.Owner.GetAdjective] uçak filosunun [From.GetCallsign] çağrı adlı pilotu kovalamaya odaklandığını bildirdi. Birkaç düşman uçağını düşürüp [Prev.Owner.GetAdjective] füzelerinden birkaçını atlattıktan sonra [From.GetCallsign], [Prev.GetCallsign] tarafından alt edildi; [Prev.GetWingShort] uçağındaki bu pilot onu manevrada geride bırakıp yakıt depolarını temiz bir isabetle yardı. [From.GetName] [From.GetSurname] kişisinin [From.GetWingShort] uçağı alev aldı ve [From.GetMissionRegion] üzerinde şiddetli bir cehennem içinde spiral çizerek düştü.\n\n[From.GetFullName] hizmeti boyunca büyük cesaret gösterdi ve birçok kişinin hayranlığını kazandı. Bu ulusal kahramanın kaybı [From.Owner.GetAdjective] hava kuvvetleri için büyük, ülke için ise yıkıcı bir darbedir. Biz yas tutarken [Prev.Owner.GetName] ülkesinin [Prev.GetFullName] kişisini kahraman diye kutlaması trajediyi daha da büyütüyor."
 MD_ace_killed_by_ace.1.a:0 "Hepimiz için yıkıcı bir kayıp"
 MD_ace_killed_other_ace.1.t:0 "[From.GetFullName], [Prev.GetCallsign] Kişisini Düşürdü"
 MD_ace_killed_other_ace.1.d:0 "[From.GetMissionRegion] üzerindeki son görevimiz [From.Owner.GetAdjective] hava kuvvetleri için birden fazla bakımdan büyük başarıydı. [Prev.Owner.GetAdjective] pilot [Prev.GetName] [Prev.GetSurname], namıdiğer [Prev.GetCallsign], kişisini zekâyla alt eden [From.GetFullName] kişisinin kahramanca eylemini öne çıkaran raporlar geldi. [From.GetCallsign] kendini yem olarak kullanıp [Prev.GetCallsign] kişisini, [From.Owner.GetAdjective] pilotların [Prev.GetCallsign] filosunun üzerine dalabildiği bir tuzağa çekti. [From.GetCallsign] ardından [Prev.Owner.GetAdjective] uçakları manevrada geride bıraktı ve tek bir füzeyle [Prev.GetCallsign] kişisini [From.GetMissionRegion] göklerinden spiral çizerek düşürdü.\n\n[Prev.GetFullName], vicdanında birçok [From.Owner.GetAdjective] can bulunan korkulan bir pilottu. Bu büyük bir zafer ve büyük kahramanların arkasında saf tuttuğumuzda büyük işler başardıklarını gösteriyor."
 MD_ace_killed_other_ace.1.a:0 "[From.Owner.GetName] ülkesinin hepsinin hatırlayacağı bir zafer!"
 MD_aces_killed_each_other.1.t:0 "[From.GetFullName] düştü"
 MD_aces_killed_each_other.1.d:0 "Son görevde ünlü [From.GetAceType] asımız [From.GetFullName], korkulan as pilot [Prev.GetFullName] ile uzun süren bir çarpışmaya girdi. Cephanesi azalmış ve kaçış imkânı kalmamış olan [From.GetCallsign], [From.GetWingShort] uçağını [Prev.Owner.GetAdjective] uçaklarının ateşi arasından manevra yaptırıp [Prev.GetCallsign] kişisine çarptı.\n[From.GetCallsign] kişisinin [From.GetWingShort] ve [Prev.GetCallsign] kişisinin [Prev.GetWingShort] uçaklarının [From.GetMissionRegion] üzerinde parçalara ayrılarak düştüğü görüldü.\n\n[Prev.Owner.GetAdjective] belası [Prev.GetCallsign] artık başımıza dert olmayacak olsa da, kıymetli bir kamu figürünü ve tüm [From.Owner.GetAdjective] halkı için bir ilham kaynağını kaybettik."
 MD_aces_killed_each_other.1.a:0 "Yine de büyük bir kayıp"
