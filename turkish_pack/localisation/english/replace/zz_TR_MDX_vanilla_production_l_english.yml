 PRODUCTION_EFFICIENCY_DESC:0 "§TOrtalama Sanayi Üretim Verimliliği.\nÜretim Verimliliği, üretilen her birim başına $VALUE|H=2$% artar ve etkin Sanayilere eşit olarak bölünür.§!"
 PRODUCTION_MATERIALS_OIL:0 "Fosil Yakıt"
 oil_desc:0 "Fosil Yakıtlar, büyük bir modern ekonominin başarısı için gereklidir. Bu kaynağı güvence altına almak 21. yüzyıl ulusları için çok önemlidir."
 PRODUCTION_MATERIALS_ALUMINIUM:0 "Hafif Metal"
 aluminium_desc:0 "Hafif metaller, özel araçların ve uçakların yapımı için önemlidir. Alüminyum, helikopterlerin ve uçakların yer çekimine meydan okumasında tercih edilen ana metaldir."
 PRODUCTION_MATERIALS_RUBBER:0 "Kauçuk"
 rubber_desc:0 "Kauçuk, çoğu aracın yapımı için önemlidir. Esnek özellikleri lastik ve diğer sanayi uygulamalarının üretiminde mükemmeldir."
 PRODUCTION_MATERIALS_TUNGSTEN:0 "Teknoloji Metali"
 tungsten_desc:0 "Teknoloji metalleri, ileri teknoloji üretiminin ana hammaddesidir. En gelişmiş silah sistemleri ve teçhizat çoğu zaman bir muharebenin sonucunu belirler."
 PRODUCTION_MATERIALS_STEEL:0 "Çelik"
 steel_desc:0 "Çelik, ister kara araçları ister gemiler olsun, çoğu askerî makine türü için temel metaldir. Bu kaynağa erişimi olmayan uzun süreli çatışmalar askerî fabrikalarınızı neredeyse değersiz kılar."
 PRODUCTION_MATERIALS_CHROMIUM:0 "Değerli Metal"
 chromium_desc:0 "Değerli metaller, mineraller ve diğer nadir elementler modern teknolojinin kritik parçalarını oluşturur. Altın, gümüş ve elmas, istikrarsız gelişmekte olan bölgeler için özellikle hayati bir gelir kaynağıdır."
 PRODUCTION_MATERIALS_MICROCHIPS:0 "Mikroçipler"
 microchips_desc:0 "Mikroçip (çip, bilgisayar çipi, entegre devre veya IC de denir), küçük ve düz bir silikon parçası üzerindeki elektronik devreler bütünüdür. Gelişmiş bilgi işlem sistemlerinde ve askerî teçhizatta kullanılır."
 PRODUCTION_MATERIALS_COMPOSITES:0 "İleri Kompozitler"
 composites_desc:0 "Kompozitler, farklı fiziksel veya kimyasal özelliklere sahip iki ya da daha fazla bileşen malzemenin birleştirilmesiyle yapılan malzemelerdir."
