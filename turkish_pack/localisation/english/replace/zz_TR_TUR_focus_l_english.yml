 EU001E:0 "AB Politikaları"
 EU001E_desc:0 "§Y[EUU.GetFlag] AB'nin§! politikaları Birliğin değerleri, hedefleri ve ilkeleriyle belirlenir. AB bir ekonomik topluluk olarak başladığı için ekonomi politikası AB'de hâlâ önemli bir alandır. AB, değerlerine uygun olarak vatandaşlarının refahını, güvenliğini ve çıkarlarını gözetmeye çalışır. AB ekonominin istikrarlı ve rekabetçi kalmasını ister ve kendini sürekli reforme etmeye çalışır..."
 EU002E:0 "AB Adaylığı"
 EU002E_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'ne§! üyelik başvurusu yapmadan önce AB aday ülke statüsü almamız gerekiyor. §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleriyle zorlu müzakereler olacak ve çok fazla etkiye ihtiyacımız olacak."
 EU100E:0 "AB Reformları"
 EU100E_desc:0 "Üye devletler, Avrupa bütünleşmesini güçlendirmek için §Y[EUU.GetFlag] Avrupa Birliği'ni§! reforme etmeye çalışıyor."
 EU101E:0 "Avrupa Birliği Temel Haklar Şartı"
 EU101E_desc:0 "\"Avrupa halkları, aralarında giderek daha sıkı bir birlik oluştururken ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik, insan onuru, özgürlük, eşitlik ve dayanışmanın bölünmez ve evrensel değerleri üzerine kuruludur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.\" - Temel Haklar Şartı'nın Başlangıcı"
 EU102E:0 "Avrupa Konvansiyonu"
 EU102E_desc:0 "Laeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaş için daha sade, temel hedeflerine ulaşmada daha güçlü ve dünyada daha belirgin bir Birlik yolunda kararlı bir adım atmak üzere Birliğin geleceğine ilişkin bir Konvansiyon toplamaya karar verdi."
 EU103E:0 "Avrupa Anayasası"
 EU103E_desc:0 "Avrupa Konvansiyonu, Avrupa İçin Bir Anayasa Oluşturan Antlaşma Taslağı ile sonuçlandı. Bu uluslararası antlaşma, §Y[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturmak üzere mevcut Avrupa antlaşmalarının yerini alacak ve nitelikli çoğunluk oylamasını daha önce üye devletler arasında oybirliğiyle karar verilen politika alanlarına genişletecekti."
 EU104E:0 "Lizbon Antlaşması"
 EU104E_desc:0 "Lizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onay sürecinin olumsuz sonuçlanmasının bir sonucudur. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirmiştir; ikincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilmiştir."
 EU105E:0 "Avrupa Dış Eylem Servisi"
 EU105E_desc:0 "Avrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dışişleri ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU200E:0 "AB Maliye Politikaları"
 EU200E_desc:0 "Maliye politikaları ekonomik büyüme, makroekonomik istikrar ve enflasyon üzerinde önemli bir etkiye sahiptir. Bu bakımdan kilit unsurlar kamu harcama ve gelirlerinin düzeyi ve bileşimi, bütçe açıkları ve kamu borcudur. Maliye politikalarının sorumluluğunu elinde tutan egemen devletlerden oluşan avro bölgesi gibi bir para birliğinde mali disiplin ihtiyacı daha da güçlüdür."
 EU201E:0 "ECB Müdahalesi"
 EU201E_desc:0 "ECB Yönetim Konseyi, para politikası kararlarını uygulamak için Avrosistem para politikası araçları ve prosedürlerine ilişkin Genel Belgeler'de belirtilen bir dizi para politikası aracı ve prosedürü benimsemiştir."
 EU202E:0 "Avrupa Bankacılık Birliği"
 EU202E_desc:0 "Son finansal krize yanıt olarak tek pazar için daha güvenli bir finans sektörü oluşturmak amacıyla Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üye devletlerindeki tüm finansal aktörler için tek bir kural kitabı oluşturur. Bankalar için daha sıkı ihtiyati gereklilikler, mevduat sahipleri için daha iyi koruma ve batık bankaların yönetimine ilişkin kurallar içerir."
 EU203E:0 "Avro Tahvilleri"
 EU203E_desc:0 "Avro tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, para birliğinin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasıyla boy ölçüşebilecek bir avro tahvili piyasası kurarak hükümetlerin borçlarını finanse etmesi için yeni araçlar yaratır."
 EU204E:0 "Avrupa Finansal İstikrar Fonu (EFSF)"
 EU204E_desc:0 "EFSF, Avrupa borç krizinde avro bölgesi üye devletleri tarafından geçici bir kriz çözüm mekanizması olarak kuruldu ve birçok üye devlete mali yardım sağladı. Bu yardım, EFSF tarafından sermaye piyasalarında ihraç edilen EFSF tahvilleri ve diğer borçlanma araçlarıyla finanse edildi. EFSF artık başka mali yardım sağlamamaktadır; bu görev artık yalnızca ESM tarafından yürütülmektedir."
 EU205E:0 "Avrupa İstikrar Mekanizması (ESM)"
 EU205E_desc:0 "ESM'nin görevi, ciddi finansman sorunları yaşayan veya bu tehditle karşı karşıya kalan avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM üyelerinin finansal istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU206E:0 "Mali Birlik"
 EU206E_desc:0 "Mali birlik, üye devletlerin ortak bir bütçeyi paylaşmasını içerir. Bu, harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirlenmesi anlamına gelir. Mali birlik, Avrupa bütünleşmesinin bir sonraki adımı olarak önerilmektedir ve tüm üye devletler için harcama ve vergi oranlarını merkezi bir Avrupa otoritesinin belirlemesi anlamına gelir."
 EU207E:0 "Avrupa Ekonomik Hükümeti"
 EU207E_desc:0 "Bir Avrupa Ekonomik Hükümeti, AB'de ortak bir maliye ve aktif ekonomi politikasını mümkün kılar. §Y[EUU.GetFlag] Avrupa Birliği'ne§! kendi vergi otoritesini kazandırır ve üye devletler için asgari ücretleri merkezi bir otorite belirler."
 EU208E:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU208E_desc:0 "Bir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükümeti ile oluşturulan politika ve yetkileri tek bir makamda birleştirir."
 EU300E:0 "AB Savunma Politikaları"
 EU300E_desc:0 "Ortak Güvenlik ve Savunma Politikası (OGSP), Birliğin barışı koruma operasyonlarında, çatışmaların önlenmesinde ve uluslararası güvenliğin güçlendirilmesinde öncü bir rol üstlenmesini sağlar. Sivil ve askeri imkânlardan yararlanan OGSP, AB'nin kriz yönetimine yönelik kapsamlı yaklaşımının ayrılmaz bir parçasıdır."
 EU301E:0 "Avrupa Savunma Ajansı (EDA)"
 EU301E_desc:0 "Avrupa Savunma Ajansı, üye devletleri ve §Y[EUU.GetFlag] Avrupa Birliği'ni§! kriz yönetimi alanında Avrupa savunma kabiliyetlerini geliştirme ve Avrupa Güvenlik ve Savunma Politikası'nı bugünkü hâliyle ve gelecekteki gelişimiyle sürdürme çabalarında desteklemek amacıyla kuruldu."
 EU302E:0 "Daimi Yapılandırılmış İşbirliği (PESCO)"
 EU302E_desc:0 "PESCO, istekli ve muktedir üye devletlerin ortak kabiliyet projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına imkân tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu kabiliyetleri ulusal ve çok uluslu görev ve operasyonlar için üye devletlerin kullanımına sunmaktır."
 EU303E:0 "Avrupa Savunma Fonu"
 EU303E_desc:0 "Avrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine ve vatandaşlarının korunup savunulmasına kilit bir katkı sağlayacak. Yeniliği teşvik etmek ve son teknoloji savunma teknolojileri ve ürünleri geliştirmek için şirketler arasında ve AB ülkeleri arasında savunma işbirliğini destekleyecek. Fon, savunmaya yapılan ulusal yatırımları koordine edecek, tamamlayacak ve güçlendirecek."
 EU304E:0 "Avrupa Güvenlik Konseyi"
 EU304E_desc:0 "Bir Avrupa Güvenlik Konseyi, AB'yi uluslararası siyasette karar almaya daha hazırlıklı hâle getirir. AB tutarlı kararları daha hızlı alıp uygulamayı başaramazsa, AB kurallarını uygulama ve çok taraflı yapıları güçlendirme kabiliyeti zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükümetlerarası işbirliği formatıyla desteklenmelidir."
 EU305E:0 "Avrupa Ordusu"
 EU305E_desc:0 "Üye devletler, §Y[EUU.GetFlag] Avrupa Birliği'nin§! askeri kabiliyetlerini güçlendirmek için ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvrupa Ordusu§! olarak bilinecektir."
 EU306E:0 "Avrupa Donanması"
 EU306E_desc:0 "21. yüzyılda çok uluslu filolar ve görev kuvvetleri giderek yaygınlaşıp önem kazanırken §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri güçlerini birleştirip savaş gemilerini §YAvrupa Donanması§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU307E:0 "BM Güvenlik Konseyi'nde AB Daimi Üyeliği"
 EU307E_desc:0 "Üye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olmasına karar verdi. Bu, BMGK'nın reforme edilmesiyle ya da hâlihazırda BMGK üyesi olan üye devlet(ler)in koltuğunun AB'ye devredilmesiyle gerçekleştirilir."
 EU308E:0 "AB Nükleer Gücü"
 EU308E_desc:0 "Nükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki etkisini artıracaktır. Birlik, nükleer silahları üye devletlerinin nükleer silahlarını devralıp paylaşarak ya da kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU400E:0 "AB İkincil Mevzuatı"
 EU400E_desc:0 "AB antlaşmaları, AB üye devletleri arasında AB'nin hedeflerini, AB kurumlarına ilişkin kuralları, kararların nasıl alınacağını ve AB ile üyeleri arasındaki ilişkiyi belirleyen bağlayıcı anlaşmalardır. Antlaşmalar birincil hukuk olarak bilinir. Antlaşmaların ilke ve hedeflerinden doğan hukuk bütünü ise ikincil hukuk (tüzükler, yönergeler, kararlar, tavsiyeler ve görüşler) olarak bilinir."
 EU401E:0 "Genel Veri Koruma Tüzüğü"
 EU401E_desc:0 "AB Genel Veri Koruma Tüzüğü (GDPR), Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek amacıyla tasarlanmıştır."
 EU402E:0 "Dijital Tek Pazarda Telif Hakkı Yönergesi"
 EU402E_desc:0 "Dijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU403E:0 "Dublin II Tüzüğü"
 EU403E_desc:0 "Dublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini belirler. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve aynı kişinin birden fazla sığınma başvurusu yaparak sistemi kötüye kullanmasının önüne geçmektir."
 EU404E:0 "Sığınmacıların Yeniden Yerleştirilmesi ve İskânı"
 EU404E_desc:0 "Başvurularının olumlu sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan başvurularının işleme alınacağı diğer üye devletlere yeniden yerleştirilir. Başvurular olumlu sonuçlanırsa başvuru sahiplerine, yerleştirildikleri üye devlette ikamet hakkıyla birlikte mülteci statüsü verilir."
 EU405E:0 "AB-Türkiye Mutabakatı"
 EU405E_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye üzerinden Avrupa'ya yönelik düzensiz göç akışını durdurmayı amaçlayan bir anlaşma için müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye iade edilecek. §Y[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler İçin Mali Yardım Programı'na 3 milyar avro ödeyecek."
 EU406E:0 "Avrupa Sığınma Ajansı"
 EU406E_desc:0 "AB Komisyonu, sığınma süreci boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali imkânlarla donatılmış bir AB Sığınma Ajansı kurulmasını önerdi."
 EU407E:0 "Frontex"
 EU407E_desc:0 "Frontex, AB ülkelerine ve Schengen'e bağlı ülkelere dış sınırlarını yönetmede yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır yetkilileri arasındaki işbirliğini kolaylaştırır, teknik destek ve uzmanlık sağlar."
 EU408E:0 "Avrupa Sınır ve Sahil Güvenlik Ajansı"
 EU408E_desc:0 "Frontex, Avrupa Sınır ve Sahil Güvenlik Ajansı'na dönüşüyor. Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa sahne oldu. Dış sınırı olan ülkeler sınır kontrolünden tek başına sorumludur; ancak Frontex ciddi göç baskısıyla karşı karşıya kalan AB ülkelerine ek teknik destek sağlayabilir."
 EU500E:0 "Avrupa Komisyonu Politikaları"
 EU500E_desc:0 "Avrupa Komisyonu Politikaları"
 EU600E:0 "AB Genişlemesi"
 EU600E_desc:0 "Genişleme politikası, AB'ye katılmak isteyen ülkeler ve potansiyel adaylar için geçerlidir. Üyelik perspektifi, AB üyesi olmak isteyen ülkelerde demokratik ve ekonomik reformlar için güçlü bir teşviktir."
 EU601E:0 "Avrupa Birliği'nin 2004 Genişlemesi"
 EU601E_desc:0 "1 Mayıs 2004'te toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), bir eski Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) kapsıyor."
 EU602E:0 "Avrupa Birliği'nin 2007 Genişlemesi"
 EU602E_desc:0 "Doğu Avrupa'dan iki ülke daha, §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§!, AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU603E:0 "Avrupa Birliği'nin 2013 Genişlemesi"
 EU603E_desc:0 "2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katılarak üye devlet sayısını 28'e çıkardı."
 EU700E:0 "Ayrılma Politikaları"
 EU700E_desc:0 "Birlik genelinde yükselen Avrupa şüpheciliğiyle birlikte bazı üye devletler §Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmayı düşünecek."
 EU701E:0 "50. Madde"
 EU701E_desc:0 "\"Her Üye Devlet, kendi anayasal kurallarına uygun olarak Birlikten ayrılmaya karar verebilir.\"\n- Avrupa Birliği Antlaşması, Madde 50(1).\n50. Madde ilk olarak Avrupa Birliği Anayasal Antlaşması için kaleme alındı. Anayasanın onaylanamamasının ardından madde Lizbon Antlaşması'na dahil edildi."
 EU702E:0 "Ayrılma Antlaşması"
 EU702E_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmak, ayrılan ülkenin AB hukukunun geçerliliğini yitireceği döneme göre ulusal hukukunu uyarlamak zorunda olduğu karmaşık bir süreçtir. Ayrılan ülke ile §Y[EUU.GetFlag] Avrupa Birliği§! gelecekteki ilişkileri konusunda bir anlaşmaya varmak zorundadır."
 EU703E:0 "Anlaşmasız Çıkış"
 EU703E_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ile bir Ayrılma Antlaşması'na varılamazsa, halkımızı Anlaşmasız Çıkış'ın kaosundan korumak için acil önlemler alınmalıdır."
 EU110E:0 "Avrupa Birliği'nin Federalleşmesi"
 EU110E_desc:0 "Avrupa bütünleşme süreci, daha fazla bütünleşmenin §Y[EUU.GetFlag] Avrupa Birliği'nin§! Federalleşmesine yol açacağı bir noktaya ulaştı."
 EU111E:0 "Avrupa Birleşik Devletleri"
 EU111E_desc:0 "70 yılı aşkın Avrupa bütünleşmesinin ardından §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri egemenliklerinden vazgeçerek §Y[EUU.GetFlag] Avrupa Birleşik Devletleri'ni§! kurmaya karar verdi."
 EU112E:0 "Avrupa Federasyonu"
 EU112E_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri, nitelikli çoğunluk oylamasını temel ilke olarak benimseyen ve §YAvrupa Federasyonu Başkanı§! tarafından yönetilen §Y[EUU.GetFlag] Avrupa Federasyonu'na§! Birliği dönüştürmeye karar verdi."
 EU113E:0 "Anavatanlar Avrupası"
 EU113E_desc:0 "Daha fazla Avrupa bütünleşmesi, üye devletlerin kültürel mirasını, ulusal kimliklerini ve egemenliğini tehlikeye atacaktır. Avrupa, anavatanların Avrupası'dır; bu yüzden Avrupa bütünleşmesi bu aşamada durmalıdır."
 EU604E:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU604E_desc:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU605E:0 "Batı Balkanlar Genişlemesi"
 EU605E_desc:0 "Batı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU606E:0 "Türkiye"
 EU606E_desc:0 "§Y[TUR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU607E:0 "Karadeniz Genişlemesi"
 EU607E_desc:0 "Karadeniz ülkeleri §Y[MLV.GetNameWithFlag]§! ve §Y[UKR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU608E:0 "Kafkasya Genişlemesi"
 EU608E_desc:0 "Kafkas ülkeleri §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! ve §Y[GEO.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU609E:0 "Avrupa Ekonomik Alanı"
 EU609E_desc:0 "Avrupa Ekonomik Alanı'nın AB üyesi olmayan ülkeleri (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! ve §Y[ICE.GetNameWithFlag]§!) §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU610E:0 "Belarus"
 EU610E_desc:0 "§Y[BLR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU611E:0 "İç Genişleme"
 EU611E_desc:0 "İç genişleme, mevcut bir üye devletin dağılması veya ondan ayrılma yoluyla yeni üye devletlerin ortaya çıkması sürecidir. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! ve §Y[WAS.GetNameWithFlag]§! bağımsızlıklarını kazandıklarında §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday olabilir."
 POTEF001E:0 "Avrupa Federasyonu Başkanı"
 POTEF001E_desc:0 "§YAvrupa Federasyonu Başkanı (POTEF)§! Avrupa'nın en üst lideridir. Bu nedenle Avrupa Federasyonu Başkanı, tüm Federasyon için belirleyici stratejik kararları alma yetkisine sahiptir."
 POTEF100E:0 "Alp Doktrini"
 POTEF100E_desc:0 "Alp ülkeleri §Y[AUS.GetNameWithFlag]§! ve §Y[SWI.GetNameWithFlag]§! uzun bir dağ savaşı geleneğine sahiptir. Alp Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF101E:0 "Yaratılışın Bütünlüğü"
 POTEF101E_desc:0 "Avrupa Federasyonu, Yaratılışın Bütünlüğünü korumak ve sürdürmek için politikalarını uyarlıyor."
 POTEF102E:0 "Çevreci Emperyalizm"
 POTEF102E_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF103E:0 "Kuzey Amerika"
 POTEF103E_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF104E:0 "Güney Amerika"
 POTEF104E_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF105E:0 "Avrupa"
 POTEF105E_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF106E:0 "Afrika"
 POTEF106E_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF107E:0 "Orta Doğu"
 POTEF107E_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF108E:0 "Asya"
 POTEF108E_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF109E:0 "Okyanusya"
 POTEF109E_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF110E:0 "Pasifik"
 POTEF110E_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF150E:0 "Alman Doktrini"
 POTEF150E_desc:0 "§Y[GER.GetNameWithFlag]§! geleneksel olarak güçlü zırhlı kuvvetlere odaklanmıştır. Zırhlı Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF151E:0 "Ticaret İmparatorluğu"
 POTEF151E_desc:0 "Avrupa Federasyonu bir Ticaret İmparatorluğu olacak."
 POTEF200E:0 "Fransız Doktrini"
 POTEF200E_desc:0 "§Y[FRA.GetNameWithFlag]§! geleneksel olarak yüksek hareket kabiliyetine sahip hafif zırhlı ve motorlu kuvvetlere odaklanmıştır. Manevra Savaşı Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF201E:0 "İmparatorluk Gücü"
 POTEF201E_desc:0 "Avrupa Federasyonu, imparatorluk öncüllerinin geleneğini sürdürüyor."
 POTEF202E:0 "Özgürlük İmparatorluğu"
 POTEF202E_desc:0 "Avrupa Federasyonu bir Özgürlük İmparatorluğu olacak."
 POTEF203E:0 "Amerika: Müttefik mi, Hasım mı?"
 POTEF203E_desc:0 "Amerika ve Avrupa, 20. yüzyılın büyük bölümünde müttefikti. §Y[USA.GetNameWithFlag]§! ülkesindeki son siyasi değişikliklerle bu durum sorgulanır oldu…"
 POTEF204E:0 "NATO Mirası"
 POTEF204E_desc:0 "NATO'nun barışı koruma mirası geleneğinde §Y[USA.GetNameWithFlag]§! ve §YEDU§! yeni bir ittifak kuruyor."
 POTEF205E:0 "Trump'ın Mirası"
 POTEF205E_desc:0 "§Y[USA.GetNameWithFlag]§! müttefiklikten hasımlığa geçti. Avrupa bu belirleyici stratejik değişime karşılık vermek zorunda."
 POTEF206E:0 "Duvarı Yık"
 POTEF206E_desc:0 "Avrupa egemenliğine yönelik Amerikan tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[MEX.GetNameWithFlag]§! ile ittifak kurup §Y[USA.GetNameWithFlag]§! ülkesini güneyden işgal etmeye yönelik bir plan hazırladı."
 POTEF207E:0 "Buster'ın Dirilişi"
 POTEF207E_desc:0 "ABD'nin Avrupa'ya yönelik tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[CAN.GetNameWithFlag]§! ile ittifak kurup 1 No'lu Savunma Planı'nı revize etmeyi önerdi. Bu plan, Kanadalı Yarbay James 'Buster' Sutherland Brown tarafından ABD ile Britanya İmparatorluğu arasında yakın bir çatışma durumunda Kanada'nın ABD'ye önleyici bir saldırı düzenlemesi için hazırlanmıştı. Bu planla §YEDU§!, §Y[USA.GetFlag] ABD'yi§! kuzeyden işgal edebilir."
 POTEF250E:0 "Benelüks Doktrini"
 POTEF250E_desc:0 "Soğuk Savaş'ın ardından §YAlçak Ülkeler§! yeni duruma uyum sağlamak için havadan hareketli kuvvetlere odaklandı. Havadan Hareket Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF251E:0 "Liberal Miras"
 POTEF251E_desc:0 "Avrupa Federasyonu Liberal Mirasını onurlandırıyor."
 POTEF252E:0 "Eski Ticaret Yollarını Güvenceye Al"
 POTEF252E_desc:0 "Avrupa Federasyonu'nun Karayipler'e, Afrika'ya ve eski Hollanda Doğu Hint Adaları'na uzanan eski ticaret yollarını güvenceye alması gerekiyor."
 POTEF253E:0 "Endonezya"
 POTEF253E_desc:0 "Avrupa Federasyonu'nun eski Hollanda sömürgesi §Y[IND.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF300E:0 "İber Doktrini"
 POTEF300E_desc:0 "§YIberya ülkeleri§! geleneksel olarak güçlü deniz piyadesi kuvvetlerine odaklanmıştır. Deniz Piyadesi Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF301E:0 "Latin Kuzenler"
 POTEF301E_desc:0 "Avrupa Federasyonu'nun Güney Amerika'daki eski sömürgelerle ilişkilerini geliştirmesi gerekiyor."
 POTEF302E:0 "Meksika"
 POTEF302E_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[MEX.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Orta Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF303E:0 "Büyük Kolombiya"
 POTEF303E_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[COL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF304E:0 "Orta Amerika"
 POTEF304E_desc:0 "Avrupa Federasyonu'nun §YOrta Amerika'daki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF305E:0 "Güney Koni"
 POTEF305E_desc:0 "Avrupa Federasyonu'nun §YGüney Amerika'nın Güney Konisi'ndeki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF306E:0 "Brezilya"
 POTEF306E_desc:0 "Avrupa Federasyonu'nun eski Portekiz sömürgesi §Y[BRA.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF350E:0 "İngiliz Doktrini"
 POTEF350E_desc:0 "§YBritanya§! geleneksel olarak güçlü bir donanmaya odaklanmıştır. Deniz Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF351E:0 "Kuzey Atlantik'i Güvenceye Al"
 POTEF351E_desc:0 "Denizlerin özgürlüğünü ve serbest ticareti güvence altına almak için Avrupa Federasyonu'nun Kuzey Atlantik'i kontrol etmesi gerekiyor."
 POTEF352E:0 "Milletler Topluluğu Mirası"
 POTEF352E_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması ve eski İngiliz dominyonlarıyla ilişkilerini geliştirmesi gerekiyor."
 POTEF353E:0 "Kanada"
 POTEF353E_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[CAN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF354E:0 "Avustralya"
 POTEF354E_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[AST.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF355E:0 "Yeni Zelanda"
 POTEF355E_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[NZL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF356E:0 "Kuzey Denizi'ni Güvenceye Al"
 POTEF356E_desc:0 "Kuzey Denizi, Avrupa Federasyonu'nun arka bahçesidir ve güvence altına alınması gerekir."
 POTEF357E:0 "Malaya Mirası"
 POTEF357E_desc:0 "Avrupa Federasyonu'nun Malaya'daki eski İngiliz sömürgeleriyle ilişkilerini geliştirmesi gerekiyor."
 POTEF358E:0 "Malezya"
 POTEF358E_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[MAY.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF359E:0 "Singapur"
 POTEF359E_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[SIN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF360E:0 "Hong Kong'a Garanti Ver"
 POTEF360E_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[HKG.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Çin-İngiltere Ortak Bildirisi'ndeki özgürlükleri güvence altına alması gerekiyor."
 POTEF400E:0 "İskandinav Doktrini"
 POTEF400E_desc:0 "§YSkandinav ülkeleri§! geleneksel olarak Arktik'te savaşmaya odaklanmıştır. İskandinav Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF401E:0 "Arktik'i Güvenceye Al"
 POTEF401E_desc:0 "Denizlerin özgürlüğünü ve jeostratejik konumunu güvence altına almak için Avrupa Federasyonu'nun Arktik'i kontrol etmesi gerekiyor."
 POTEF450E:0 "Akdeniz Doktrini"
 POTEF450E_desc:0 "§YAkdeniz ülkeleri§! geleneksel olarak denizden çıkarma taktiklerine odaklanmıştır. Amfibi Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF451E:0 "Kuzey Afrika"
 POTEF451E_desc:0 "Bir yakınsama bölgesi ve mülteciler için güvenli bir liman oluşturmak amacıyla Avrupa Federasyonu'nun §YKuzey Afrika§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF452E:0 "Kıbrıs'ı Birleştir"
 POTEF452E_desc:0 "Avrupa Federasyonu'nun egemen bir üye devleti olarak §Y[CYP.GetNameWithFlag]§! yeniden birleştirilmelidir."
 POTEF500E:0 "Balkan Doktrini"
 POTEF500E_desc:0 "§YBalkan ülkeleri§! geleneksel olarak partizan kuvvetlere odaklanmıştır. Partizan Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF501E:0 "Balkan Altyapısı"
 POTEF501E_desc:0 "Avrupa Federasyonu'nun bölgesel barışı korumak ve Balkanları yabancı etkiden korumak için Balkanların altyapısını geliştirmesi gerekiyor."
 POTEF502E:0 "İpek Yolu'na Meydan Oku"
 POTEF502E_desc:0 "Avrupa Federasyonu'nun Çin'in yeni İpek Yolu'na meydan okuması ve Orta Asya'daki Çin etkisini azaltması gerekiyor."
 POTEF503E:0 "Rakip Çin"
 POTEF503E_desc:0 "§Y[CHI.GetNameWithFlag]§! küresel düzeyde Avrupa Federasyonu'nun başlıca rakiplerinden biri hâline geldi. Avrupa Federasyonu'nun politikalarını buna göre uyarlaması gerekiyor."
 POTEF504E:0 "Ok Harekâtı"
 POTEF504E_desc:0 "Adını Ok Savaşı'ndan (İkinci İngiliz-Çin Savaşı) alan Ok Harekâtı, Çin'in yayılmacı politikasını durdurmak için §Y[CHI.GetNameWithFlag]§! ülkesine Avrupa müdahalesini öngören bir plandır."
 POTEF505E:0 "Asyalı Müttefikler"
 POTEF505E_desc:0 "§Y[CHI.GetNameWithFlag]§! ile yüzleşmek için Avrupa Federasyonu'nun Asya'da müttefiklere ihtiyacı var."
 POTEF506E:0 "Kore Cumhuriyeti"
 POTEF506E_desc:0 "§Y[KOR.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF507E:0 "Japonya"
 POTEF507E_desc:0 "§Y[JAP.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF550E:0 "Karadeniz Doktrini"
 POTEF550E_desc:0 "Soğuk Savaş'ın ardından §YKaradeniz ülkeleri§! yeni duruma uyum sağlamak için hareketli hava savunma kuvvetlerine odaklandı. Hava Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF551E:0 "Karadeniz'i Güvenceye Al"
 POTEF551E_desc:0 "Karadeniz, Avrupa Federasyonu'nu Kafkasya'ya ve güneydoğudaki üye devletlerine bağlar. Bu nedenle güvence altına alınması gerekir."
 POTEF552E:0 "Ayrılıkçı Cumhuriyetleri Yeniden Entegre Et"
 POTEF552E_desc:0 "§Y[SOV.GetNameWithFlag]§!, ayrılıkçı hareketleri destekleyip ayrılıkçı cumhuriyetler kurarak Avrupa Federasyonu'nun çeşitli doğu üye devletlerinin egemenliğini ihlal etti. Bu Rus kuklalarını yeniden entegre etmemiz gerekiyor."
 POTEF553E:0 "Rakip Rusya"
 POTEF553E_desc:0 "§Y[SOV.GetNameWithFlag]§! Avrupa Federasyonu'nun başlıca rakiplerinden biri oldu. Ona yaptırımlar uygulamamız gerekiyor."
 POTEF554E:0 "Şarlman Harekâtı"
 POTEF554E_desc:0 "Adını 'Avrupa'nın Babası' (Pater Europae) olarak anılan efsanevi imparator Şarlman'dan alan Şarlman Harekâtı, §Y[SOV.GetNameWithFlag]§! ülkesine karşı önleyici meşru müdafaa planıdır. Bu harekâtla §YEDU§!, Avrupa egemenliğine yönelik bu tehdidi ortadan kaldırmak için §Y[SOV.GetNameWithFlag]§! ülkesine önleyici bir işgal başlatabilir."
 POTEF600E:0 "Kafkasya Doktrini"
 POTEF600E_desc:0 "Soğuk Savaş'ın ardından §YKafkasya bölgesi ülkeleri§! yeni duruma uyum sağlamak için güçlü bir savunmaya odaklandı. Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF601E:0 "Avrupa Erişimi"
 POTEF601E_desc:0 "Avrupa Federasyonu'nun Kafkasya'ya ve güneydoğudaki üye devletlerine erişime ihtiyacı var. Bu nedenle yeni deniz üsleri ve altyapı inşa edilmesi gerekiyor."
 POTEF650E:0 "Vişegrad Doktrini"
 POTEF650E_desc:0 "§YVişegrad ülkeleri§! geleneksel olarak güçlü topçu kuvvetlerine odaklanmıştır. Topçu Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF651E:0 "Avrupa Hava Savunma Ağı"
 POTEF651E_desc:0 "Avrupa Federasyonu'nun doğu kanadını güvence altına almak için bir hava savunma ağı kurması gerekiyor."
 POTEF652E:0 "Doğu Güvenlik Duvarı"
 POTEF652E_desc:0 "§Y[SOV.GetNameWithFlag]§! ülkesinin doğudaki üye devletlerde artan etkisine karşı koyulması gerekiyor."
 POTEF700E:0 "Baltık Doktrini"
 POTEF700E_desc:0 "§YBaltık ülkeleri§! geleneksel olarak küçük ve son derece yetenekli özel kuvvetlere odaklanmıştır. Özel Kuvvetler Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF701E:0 "Baltık Denizi'ni Güvenceye Al"
 POTEF701E_desc:0 "Baltık Denizi, Avrupa Federasyonu'nun iç denizidir ve güvence altına alınması gerekir."
 POTEF800E:0 "Pax Europaea"
 POTEF800E_desc:0 "Avrupa Federasyonu'nun dünya barışını sağlamak için küresel süper güç olması gerekiyor."
 USoE001E:0 "Yeni Avrupa Milletini Kur"
 USoE001E_desc:0 "Birleşik Avrupa Birliği'nin kendini yeni bir millet olarak kurması gerekiyor. Anayasa ve Birleşme Antlaşmaları bir şey; ama şimdi halkın bu yasal çerçeveyi hayatla doldurması gerekiyor."
 USoE002E:0 "Avrupa Subay Kolordusu"
 USoE002E_desc:0 "Birlik döneminde her üye devletin kendi ordusu vardı, daha sonra da Avrupa Ordusu kuruldu. Ortak doktrin ve eğitime sahip bir Avrupa Subay Kolordusu oluşturmamız gerekiyor."
 USoE003E:0 "Avrupa Siyasi Partileri"
 USoE003E_desc:0 "Yeni bir millet yeni siyasi partilere ihtiyaç duyar. Üye devletlerin eski siyasi partileri birleşmek zorunda."
 USoE004E:0 "Avrupa Vatanseverliği"
 USoE004E_desc:0 "Yeni bir millet kendi vatanseverliğine ve ulusal sembollerine ihtiyaç duyar."
 USoE005E:0 "Yeni Büyük Oyun"
 USoE005E_desc:0 "Yeni Büyük Oyun daha yeni başladı ve Avrupa geç kaldı; ABD, Çin ve Rusya ise ilk hamlelerini çoktan yaptı."
 USoE006E:0 "Avrupa'nın Kalbi ve Ruhu"
 USoE006E_desc:0 "Yeni milletin değerlerini ve standartlarını tanımlaması gerekiyor. Avrupa'nın bir Kalbe ve Ruha ihtiyacı var!"
 USoE100E:0 "Nüfuz Alanları Oyunu"
 USoE100E_desc:0 "Nüfuz alanları oyununu oynadığında ya kazanırsın ya ölürsün. Orta yolu yoktur."
 USoE101E:0 "Kartalla Hesaplaş"
 USoE101E_desc:0 "Amerikan Kartalı yere indirilmeli! Avrupa semalarında fazlasıyla uzun süre uçtu."
 USoE102E:0 "Ayıyla Kapış"
 USoE102E_desc:0 "Ayı bize saldırmadan önce biz ona saldırmalıyız."
 USoE103E:0 "Ejderhayla Dans"
 USoE103E_desc:0 "Ejderhayla Dans tehlikeli bir oyundur."
 USoE104E:0 "Demirden Bir Kalp"
 USoE104E_desc:0 "Eski zamanlarda demirciler, yenilen kötülerin silahlarından demir bir taht döverlerdi. Günümüzde ise sadece Avrupa'nın demirden kalbini kanıtladığını ve artık dünyanın tartışmasız hâkimi olduğunu ilan ediyoruz!"
 USoE200E:0 "Barış İçinde Bir Arada Yaşam"
 USoE200E_desc:0 "Demirden daha keskin kılıçlar vardır. Parayla ödeyebilecekken neden kanla ödeyesin?"
 USoE201E:0 "Önce Amerika"
 USoE201E_desc:0 "Kendi doktrinlerimize saygı duyulmasını istiyorsak Önce Amerika doktrinine saygı duymalıyız."
 USoE202E:0 "Rus Nüfuz Alanı"
 USoE202E_desc:0 "Rusya tüm Rus halkının koruyucusudur. Bu, saygı duymamız gereken onların nüfuz alanıdır."
 USoE203E:0 "Çin Nüfuz Alanı"
 USoE203E_desc:0 "Çin'in nüfuz alanı Güneydoğu Asya'yı kapsar ve bizi rahatsız etmez. Çin bizim ticaret ortağımızdır, rakibimiz değil."
 USoE204E:0 "Avrupa Nüfuz Alanı"
 USoE204E_desc:0 "21. yüzyılın tüm süper güçlerini yatıştırdık; artık Avrupa, Levant ve Kuzey Afrika'da Avrupa Nüfuz Alanı'nı kurmak için elimiz serbest."
 USoE300E:0 "Medeniyetler Çatışması"
 USoE300E_desc:0 "Medeniyetler Çatışması, Amerikalı siyaset bilimci Samuel P. Huntington'ın Soğuk Savaş sonrası dünyada insanların kültürel ve dinî kimliklerinin başlıca çatışma kaynağı olacağını öne süren tezidir. Gelecekteki savaşlar ülkeler arasında değil, kültürler arasında yaşanacaktır."
 USoE301E:0 "Batı'nın Geri Kalanı"
 USoE301E_desc:0 "Avrupa, Batı'nın geri kalanıdır. Amerika, Önce Amerika doktriniyle bizi yalnız ve tecrit edilmiş bıraktı."
 USoE302E:0 "Haç ve Hilal"
 USoE302E_desc:0 "Avrupa'nın güneydoğu sınırında haç ile hilal çatışıyor. Kim galip gelecek: Batı medeniyeti mi, İslam medeniyeti mi?"
 USoE303E:0 "Papa ve Patrik"
 USoE303E_desc:0 "1054'teki Büyük Ayrılık'tan bu yana Papa ile Ortodoks Patrik farklı yollara gitti. Batı medeniyetini savunmak için yeniden birleşme zamanı geldi."
 USoE304E:0 "İki Haç"
 USoE304E_desc:0 "Doğu ve Batı Hristiyanlığının İslam'a karşı birleşmesi gerekiyor."
 USoE305E:0 "Avrasya İttifakı"
 USoE305E_desc:0 "NATO'nun dağılmasının ardından Avrupa, Rus komşusuyla yeni ve büyük bir ittifak kurabilir."
 USoE306E:0 "Konstantinopolis"
 USoE306E_desc:0 "Konstantinopolis Batı'nın bir parçasıdır. Avrupa'nın onu İslam etkisinden kurtarması gerekiyor."
 USoE307E:0 "Antakya"
 USoE307E_desc:0 "Antakya Prinkepsliği, Birinci Haçlı Seferi sırasında kurulan Haçlı devletlerinden biriydi. Batı'ya aittir ve bir kez daha İslam'dan arındırılmalıdır."
 USoE308E:0 "Trablus"
 USoE308E_desc:0 "Trablus Kontluğu (1109–1289) Haçlı devletlerinin sonuncusuydu. Yeniden yükselmeli. Avrupa'nın Levant'ı İslam'dan kurtarması gerekiyor."
 USoE309E:0 "Kudüs"
 USoE309E_desc:0 "Avrupa'nın Kutsal Şehri İslam etkisinden kurtarması gerekiyor. Kudüs Krallığı kutsal mekânları bir kez daha koruyacak."
 USoE310E:0 "Malta Şövalyeleri"
 USoE310E_desc:0 "Avrupa'nın Kuzey Afrika'yı İslam etkisinden kurtarması gerekiyor. Avrupa, Malta Şövalyeleri'nin örneğini izleyecek."
 USoE311E:0 "Arabistan'ın Batılılaşması"
 USoE311E_desc:0 "Arap Yarımadası'ndaki bazı ülkelerin Batı ile zaten yakın bağları var. Güvenli bir komşuluğa sahip olmak için Avrupa'nın Arap Yarımadası'nı tamamen Batılılaştırması gerekiyor."
 USoE312E:0 "Hindistan'ın Batılılaşması"
 USoE312E_desc:0 "Sömürge mirası sayesinde Hindistan'ın Batı ile geleneksel olarak yakın bağları var. Avrupa, Hindistan'ı tamamen Batılılaştırmak için bu ilişkiyi derinleştirmeli."
 USoE313E:0 "İran Cumhuriyeti"
 USoE313E_desc:0 "İran, Orta Doğu'da Batı'nın başlıca rakiplerinden biridir. Avrupa, İran'ı Batılılaştırıp İran Cumhuriyeti'ne dönüştürerek onun bölgesel hegemonya arayışını durdurabilir."
 USoE320E:0 "Batı ve Diğerleri"
 USoE320E_desc:0 "Avrupa ve Amerika, dünyadaki her düşmana kafa tutabilecek Batılı süper güçlerdir. NATO'yu temel alarak Batı küresel hâkimiyetini dayatabilir."
 USoE321E:0 "Asya'nın Batılılaşması"
 USoE321E_desc:0 "Batı'nın Asya'daki yükselen güçlere odaklanması gerekiyor. Batı onlarla savaşmalı ya da onları Batılılaştırmalı."
 USoE322E:0 "Dört Kaplan"
 USoE322E_desc:0 "Hong Kong, Singapur, Güney Kore ve Tayvan'dan oluşan Dört Asya Kaplanı'nın Batı ile her zaman yakın bağları oldu ve yükselen Çin ejderhasından korkuyorlar. Asya'da Batı'nın güvenilir müttefikleri olabilirler."
 USoE323E:0 "Japonya"
 USoE323E_desc:0 "İkinci Dünya Savaşı'nın sona ermesinin ardından Japonya, Asya'da Batı'nın önemli bir müttefiki oldu. Batı'nın bu yakın ortaklığı sürdürmesi gerekiyor."
 USoE324E:0 "Çin"
 USoE324E_desc:0 "Çin, Asya'da Batı'nın başlıca rakibidir. Batı Çin'i Batılılaştırabilirse Asya'da Batı hegemonyasına rakip kalmayacaktır."
 USoE325E:0 "Düşünülemez Harekâtı 2.0"
 USoE325E_desc:0 "Düşünülemez Harekâtı, Mayıs 1945'te Winston Churchill'in emriyle İngiliz Genelkurmay Başkanları tarafından Sovyetler Birliği'ne karşı hazırlanan bir savaş planıydı. Batılı Müttefikler, eski Alman Wehrmacht'ı ile birlikte Sovyetler Birliği'ne sürpriz bir saldırı başlatacaktı. Batı'nın bu planı mevcut duruma göre revize etmesi ve Avrupa'da Rus hegemonyasını önlemek için Rusya'ya karşı önleyici meşru müdafaa amacıyla harekete geçmesi gerekiyor."
 USoE400E:0 "Özgürlük Meşalesi"
 USoE400E_desc:0 "Avrupa'nın Özgürlük Meşalesi'ni taşıması gerekiyor! Avrupa Birleşik Devletleri, insan haklarına ve hukukun üstünlüğüne saygı duyan demokratik bir cumhuriyettir."
 USoE401E:0 "Dijital Demokrasi"
 USoE401E_desc:0 "Avrupa'nın demokratik kurumlarını dijital çağa göre reforme etmesi gerekiyor. Sosyal medya ve sosyal ağlar sayesinde halk yasamaya ve yönetime doğrudan katılabilir."
 USoE402E:0 "Orak ve Çekiç"
 USoE402E_desc:0 "Sosyalizmin ve Marksizmin babaları Karl Marx ve Friedrich Engels Avrupalıydı. Avrupa'nın bu mirası sürdürmesi gerekiyor."
 USoE403E:0 "ASSCB"
 USoE403E_desc:0 "Avrupa solu kapitalistleri Avrupa Birliği'nde kapana kıstırdı; artık Karl Marx ve Friedrich Engels'in manevi mirasçıları ASSCB'yi, yani Avrupa Sovyet Sosyalist Cumhuriyetler Birliği'ni kurma gücüne sahip."
 USoE404E:0 "Yapay Zekâ Hükümeti"
 USoE404E_desc:0 "Yapay zekâ, bir ülkeyi verimsiz ve yozlaşma ihtimali olan insan politikacılardan daha verimli yönetecek kadar gelişti. İktidar partisinin yapay zekâ ajanı kontrolü ele alacak ve ülkeyi iktidar partisinin değerlerine göre yönetecek."
 USoE500E:0 "Yeşil Gelecek"
 USoE500E_desc:0 "İnkâr edilemez iklim değişikliği karşısında Avrupa için yeşil bir gelecekten başka gelecek yok."
 USoE501E:0 "Çevre İmparatorluğu"
 USoE501E_desc:0 "Avrupa'nın, ekonomi ile çevrenin çelişmediği bir Çevre İmparatorluğu olması gerekiyor."
 USoE502E:0 "Çevreci Emperyalizm"
 USoE502E_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE503E:0 "Kuzey Amerika"
 USoE503E_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE504E:0 "Güney Amerika"
 USoE504E_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE505E:0 "Avrupa"
 USoE505E_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE506E:0 "Afrika"
 USoE506E_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE507E:0 "Orta Doğu"
 USoE507E_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE508E:0 "Asya"
 USoE508E_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE509E:0 "Okyanusya"
 USoE509E_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE510E:0 "Pasifik"
 USoE510E_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE600E:0 "Haç ve Taç"
 USoE600E_desc:0 "Avrupa'nın mirasını yerine getirmesi ve bir kez daha imparatorluk olması gerekiyor."
 USoE601E:0 "Yeni Şövalyeler"
 USoE601E_desc:0 "Düşmanca bir dünyada ordu, halkını yozlaşmış politikacılardan ve yabancı güçlerden kurtarmak için Avrupa'da kontrolü ele aldı."
 USoE602E:0 "Avrupa Orduları Generali"
 USoE602E_desc:0 "Genelkurmay, Avrupa'nın bir kara kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Orduları Generali rütbesi verilecek."
 USoE603E:0 "Avrupa Hava Mareşali"
 USoE603E_desc:0 "Genelkurmay, Avrupa'nın bir hava kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Hava Mareşali rütbesi verilecek."
 USoE604E:0 "Avrupa Büyükamirali"
 USoE604E_desc:0 "Genelkurmay, Avrupa'nın bir amiral tarafından yönetilmesine karar verdi. Bu amirale Avrupa Büyükamirali rütbesi verilecek."
 USoE605E:0 "Avrupa İmparatorluğu"
 USoE605E_desc:0 "Avrupa bir kez daha imparatorluk oldu ve halkının çıkarlarını küresel düzeyde savunabiliyor."
 USoE620E:0 "Yeni İmparator"
 USoE620E_desc:0 "Avrupa'nın kıtayı 21. yüzyılda yönetecek yeni bir imparatora ihtiyacı var."
 USoE621E:0 "Bir Hanedan Seç"
 USoE621E_desc:0 "Avrupa'nın uzun ve şanlı geçmişe sahip pek çok büyük hanedanı var. İlk kez birleşen kıtanın 21. yüzyılda hangi hanedanın hüküm süreceğine karar vermesi gerekiyor."
 USoE622E:0 "Savoy Hanedanı"
 USoE622E_desc:0 "Savoy Hanedanı, 1003'te tarihî Savoy bölgesinde kurulan bir kraliyet hanedanıdır. Aile, kademeli genişlemeyle İtalya'nın kuzeybatısındaki küçük bir Alp kontluğunu yönetmekten Sicilya Krallığı'nın mutlak hâkimiyetine kadar yükseldi. Hanedan üyeleri Sardinya, İtalya, Arnavutluk, Etiyopya ve kısa bir süre İspanya'yı yönetti. Hanedan ayrıca Kıbrıs, Kudüs ve Ermenistan krallıkları unvanlarında da hak iddia eder."
 USoE623E:0 "Wittelsbach Hanedanı"
 USoE623E_desc:0 "Wittelsbach Hanedanı, kolları Bavyera, Hollanda, Zeeland, Köln, İsveç, Romanya, Bohemya, Macaristan, Danimarka, Norveç, Yunanistan ve Kutsal Roma İmparatorluğu dahil pek çok toprağı yönetmiş Alman-Bavyeralı bir hanedandır. Katolik bir hükümdarın hakkını tanıyan Jakobit veraset çizgisi, Bavyera Veliaht Prensi Franz'ı II. Francis olarak meşru varis kabul eder."
 USoE624E:0 "Borbón-Anjou Hanedanı"
 USoE624E_desc:0 "Borbón-Anjou Hanedanı, İspanya Krallığı'nın hüküm süren kraliyet hanedanıdır. 18. yüzyılda İspanyol Bourbon hanedanının üyeleri İspanya, Napoli, Sicilya ve Parma'da taht sahibiydi."
 USoE625E:0 "Bourbon Hanedanı"
 USoE625E_desc:0 "Bourbon Hanedanı, Fransa'nın kraliyet hanedanı olan Capet hanedanının bir kolu olan Fransız kökenli bir Avrupa hanedanıdır. Bourbon kralları Fransa ve Navarra'yı ilk kez 16. yüzyılda yönetti."
 USoE626E:0 "Hannover Hanedanı"
 USoE626E_desc:0 "Hannover Hanedanı, 17. ve 20. yüzyıllar arasında çeşitli dönemlerde Hannover, Büyük Britanya ve İrlanda'yı yönetmiş bir Alman kraliyet hanedanıdır. Hanedan 1635'te Brunswick-Lüneburg Hanedanı'nın genç bir kolu olarak doğdu ve 1692'de Hannover'in Prens-Seçicilik olmasına kadar prestij kazandı."
 USoE627E:0 "Glücksburg Hanedanı"
 USoE627E_desc:0 "Schleswig-Holstein-Sonderburg-Glücksburg Hanedanı'nın kısaltılmış adıyla Glücksburg Hanedanı, üyeleri çeşitli dönemlerde Danimarka, Norveç, Yunanistan ve birkaç kuzey Alman devletinde hüküm sürmüş, Oldenburg Hanedanı'nın Danimarkalı-Alman bir koludur."
 USoE628E:0 "Windsor Hanedanı"
 USoE628E_desc:0 "Windsor Hanedanı, Birleşik Krallık'ın ve diğer Milletler Topluluğu krallıklarının hüküm süren kraliyet hanedanıdır. 1901'de Saxe-Coburg ve Gotha Hanedanı, İngiliz monarşisinde Hannover Hanedanı'nın yerini aldı. 1917'de Birinci Dünya Savaşı nedeniyle kraliyet hanedanının adı Almanca Saxe-Coburg ve Gotha'dan İngilizce Windsor'a (Windsor Kalesi'nden) değiştirildi."
 USoE629E:0 "Orange-Nassau Hanedanı"
 USoE629E_desc:0 "Orange-Nassau Hanedanı, Hollanda'nın hâlen hüküm süren hanedanıdır. Avrupa Nassau Hanedanı'nın bir kolu olan hanedan, özellikle Sessiz William'ın İspanyol yönetimine karşı Hollanda isyanını örgütlemesinden ve bu isyanın Seksen Yıl Savaşları'nın (1568–1648) ardından bağımsız bir Hollanda devletine yol açmasından bu yana Hollanda ve Avrupa siyasetinde ve yönetiminde merkezi bir rol oynamıştır."
 USoE630E:0 "Habsburg-Lorraine Hanedanı"
 USoE630E_desc:0 "Habsburg-Lorraine Hanedanı, 1736'da Lorraine ve Bar Dükü III. François ile daha sonra sırasıyla Bohemya Kraliçesi, Macaristan Kraliçesi ve Avusturya Arşidüşesi olacak olan Avusturyalı Maria Theresa'nın evliliğinden doğmuştur. Üyeleri, Habsburg Hanedanı'nın ve Lorraine Hanedanı'nın hayatta kalan meşru soyudur; aile mülklerini ve İmparatorluk misyonunu miras almışlardır."
 USoE631E:0 "Bonaparte Hanedanı"
 USoE631E_desc:0 "Bonaparte Hanedanı, İtalyan kökenli eski bir imparatorluk ve kraliyet hanedanıdır. 1804'te I. Napolyon tarafından kuruldu. Napolyon, Grande Armée'yi tüm büyük Avrupa güçlerine karşı yöneltti ve bir dizi askeri zaferle kıta Avrupası'na hâkim oldu. Ailesinin üyelerini bağımlı devletlerin tahtlarına oturtarak hanedanın gücünü genişletti."
 USoE632E:0 "Hohenzollern Hanedanı"
 USoE632E_desc:0 "Hohenzollern Hanedanı, üyeleri çeşitli dönemlerde Hohenzollern, Brandenburg, Prusya, Alman İmparatorluğu ve Romanya'nın prensleri, prens-seçicileri, kralları ve imparatorları olmuş eski bir Alman kraliyet hanedanıdır. Aile, 11. yüzyılda Svabya'daki Hechingen kasabası çevresinde ortaya çıktı ve adını Hohenzollern Kalesi'nden aldı."
 USoE633E:0 "Bir Saray Seç"
 USoE633E_desc:0 "Avrupa'nın yeni İmparatoru'nun hüküm sürmek için temsil gücü yüksek bir saraya ihtiyacı var."
 USoE634E:0 "Quirinale Sarayı"
 USoE634E_desc:0 "Quirinale Sarayı, İtalya'nın Roma şehrinde bulunan tarihî bir yapıdır ve İtalya Cumhurbaşkanı'nın üç resmî konutundan biridir. Napolyon, Quirinale Sarayı'nı İmparator olarak asıl konutu olarak seçmişti. Ancak 1814'teki Fransız yenilgisi ve ardından gelen Avrupa Restorasyonu nedeniyle buraya hiç yerleşemedi."
 USoE635E:0 "Neuschwanstein Şatosu"
 USoE635E_desc:0 "Neuschwanstein Şatosu, Almanya'nın güneybatı Bavyera bölgesinde engebeli bir tepenin üzerinde yer alan 19. yüzyıldan kalma Neo-Romanesk bir saraydır. Saray, Bavyera Kralı II. Ludwig tarafından yaptırıldı. Şato, 1886'daki ölümüne kadar Kral'ın konutu olması amacıyla inşa edildi ve ölümünden kısa süre sonra halka açıldı. O zamandan beri 61 milyondan fazla kişi Neuschwanstein Şatosu'nu ziyaret etti."
 USoE636E:0 "Madrid Kraliyet Sarayı"
 USoE636E_desc:0 "Madrid Kraliyet Sarayı, İspanyol kraliyet ailesinin Madrid'deki resmî konutudur, ancak günümüzde yalnızca devlet törenleri için kullanılmaktadır. Saray 135.000 metrekare kullanım alanına ve 3.418 odaya sahiptir. Avrupa'da hâlâ işlevini sürdüren en büyük kraliyet sarayıdır ve kullanım alanı bakımından da en büyüğüdür."
 USoE637E:0 "Versay Sarayı"
 USoE637E_desc:0 "Versay Sarayı, XIV. Louis döneminde 1682'den XVI. Louis döneminde 1789'da Fransız Devrimi'nin başlangıcına kadar Fransa'nın başlıca kraliyet konutuydu. Saray bugün tarihî bir anıt ve UNESCO Dünya Mirası alanıdır; özellikle tören salonu olan Aynalı Salon ve fıskiyeler, kanallar, geometrik çiçek tarhları ve korulukların bulunduğu geniş Versay Bahçeleri ile ünlüdür."
 USoE638E:0 "Buckingham Sarayı"
 USoE638E_desc:0 "Buckingham Sarayı, Birleşik Krallık hükümdarının Londra'daki konutu ve idari merkezidir. Westminster Şehri'nde bulunan saray, sıklıkla devlet törenlerinin ve kraliyet ağırlamalarının merkezindedir. Ulusal sevinç ve yas dönemlerinde İngiliz halkının odak noktası olmuştur."
 USoE639E:0 "Hofburg"
 USoE639E_desc:0 "Hofburg, Habsburg hanedanı hükümdarlarının eski başlıca imparatorluk sarayıdır ve bugün Avusturya Cumhurbaşkanı'nın resmî konutu ve çalışma yeri olarak hizmet vermektedir. Viyana'nın merkezinde yer alan saray 13. yüzyılda inşa edilmiş ve sonrasında birkaç kez genişletilmiştir."
 USoE640E:0 "Sanssouci"
 USoE640E_desc:0 "Sanssouci, Prusya Kralı Büyük Frederick'in Berlin yakınlarındaki Potsdam'da bulunan yazlık sarayıdır. Genellikle Versay'ın Alman rakipleri arasında sayılır. Sanssouci daha samimi Rokoko üslubunda ve Fransız Barok muadilinden çok daha küçük olsa da parkındaki çok sayıda tapınak ve süs yapısıyla dikkat çeker."
 USoE641E:0 "Yeni Bir Saray"
 USoE641E_desc:0 "Yeni bir imparatorun tarihî bir anıta değil, yeni bir saraya ihtiyacı var. Brüksel'de modern mimariye sahip yeni bir saray inşa edelim."
 USoE642E:0 "Taç Giyme Töreni"
 USoE642E_desc:0 "Avrupa'nın yeni İmparatorun taç giyme törenine hazırlanması gerekiyor. Ancak önce imparatorun hangi tacı takacağına ve taç giyme törenini kimin yapacağına karar vermeli."
 USoE643E:0 "İmparatorluk Tacı"
 USoE643E_desc:0 "Yeni imparatorluk Kutsal Roma İmparatorluğu'nun devamı ve mirasıdır; bu yüzden imparatorun Kutsal Roma İmparatorluğu Tacı'nı takması gerekir."
 USoE644E:0 "Yeni Bir Ekümenik Taç"
 USoE644E_desc:0 "Yeni bir imparatorluk ve yeni bir imparatorun tarihî bir kalıntıya değil, yeni bir taca ihtiyacı var."
 USoE645E:0 "Papa Tarafından"
 USoE645E_desc:0 "Tanrı'nın lütfuyla yeni imparatorun Papa tarafından taç giydirilmesi gerekir."
 USoE646E:0 "Halk Tarafından"
 USoE646E_desc:0 "Yeni İmparatorun halk tarafından taç giydirilmesi gerekir; Majestelerinin yönetimini meşrulaştırmak için bir seçim yapalım."
 USoE647E:0 "Kutsal Avrupa İmparatorluğu"
 USoE647E_desc:0 "İmparator taç giydi ve Kutsal Avrupa İmparatorluğu kuruldu."
 USoE700E:0 "Pax Occidentalis"
 USoE700E_desc:0 "Avrupa küresel hâkimiyet kazandı ve dünya barışını dayatabiliyor. Bu döneme Pax Occidentalis denecek."
 USoE701E:0 "Dünya Barışının Muhafızları"
 USoE701E_desc:0 "Avrupa, Amerika, Rusya ve Çin nüfuz alanlarını belirledi. Her süper güç kendi alanında barışı sağlıyor ve böylece dünya barışının muhafızları oluyorlar."
 EU001D:0 "AB Politikaları"
 EU001D_desc:0 "§Y[EUU.GetFlag] AB'nin§! politikaları Birliğin değerleri, hedefleri ve ilkeleriyle belirlenir. AB bir ekonomik topluluk olarak başladığı için ekonomi politikası AB'de hâlâ önemli bir alandır. AB, değerlerine uygun olarak vatandaşlarının refahını, güvenliğini ve çıkarlarını gözetmeye çalışır. AB ekonominin istikrarlı ve rekabetçi kalmasını ister ve kendini sürekli reforme etmeye çalışır..."
 EU002D:0 "AB Adaylığı"
 EU002D_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'ne§! üyelik başvurusu yapmadan önce AB aday ülke statüsü almamız gerekiyor. §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleriyle zorlu müzakereler olacak ve çok fazla etkiye ihtiyacımız olacak."
 EU100D:0 "AB Reformları"
 EU100D_desc:0 "Üye devletler, Avrupa bütünleşmesini güçlendirmek için §Y[EUU.GetFlag] Avrupa Birliği'ni§! reforme etmeye çalışıyor."
 EU101D:0 "Avrupa Birliği Temel Haklar Şartı"
 EU101D_desc:0 "\"Avrupa halkları, aralarında giderek daha sıkı bir birlik oluştururken ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik, insan onuru, özgürlük, eşitlik ve dayanışmanın bölünmez ve evrensel değerleri üzerine kuruludur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.\" - Temel Haklar Şartı'nın Başlangıcı"
 EU102D:0 "Avrupa Konvansiyonu"
 EU102D_desc:0 "Laeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaş için daha sade, temel hedeflerine ulaşmada daha güçlü ve dünyada daha belirgin bir Birlik yolunda kararlı bir adım atmak üzere Birliğin geleceğine ilişkin bir Konvansiyon toplamaya karar verdi."
 EU103D:0 "Avrupa Anayasası"
 EU103D_desc:0 "Avrupa Konvansiyonu, Avrupa İçin Bir Anayasa Oluşturan Antlaşma Taslağı ile sonuçlandı. Bu uluslararası antlaşma, §Y[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturmak üzere mevcut Avrupa antlaşmalarının yerini alacak ve nitelikli çoğunluk oylamasını daha önce üye devletler arasında oybirliğiyle karar verilen politika alanlarına genişletecekti."
 EU104D:0 "Lizbon Antlaşması"
 EU104D_desc:0 "Lizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onay sürecinin olumsuz sonuçlanmasının bir sonucudur. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirmiştir; ikincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilmiştir."
 EU105D:0 "Avrupa Dış Eylem Servisi"
 EU105D_desc:0 "Avrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dışişleri ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU200D:0 "AB Maliye Politikaları"
 EU200D_desc:0 "Maliye politikaları ekonomik büyüme, makroekonomik istikrar ve enflasyon üzerinde önemli bir etkiye sahiptir. Bu bakımdan kilit unsurlar kamu harcama ve gelirlerinin düzeyi ve bileşimi, bütçe açıkları ve kamu borcudur. Maliye politikalarının sorumluluğunu elinde tutan egemen devletlerden oluşan avro bölgesi gibi bir para birliğinde mali disiplin ihtiyacı daha da güçlüdür."
 EU201D:0 "ECB Müdahalesi"
 EU201D_desc:0 "ECB Yönetim Konseyi, para politikası kararlarını uygulamak için Avrosistem para politikası araçları ve prosedürlerine ilişkin Genel Belgeler'de belirtilen bir dizi para politikası aracı ve prosedürü benimsemiştir."
 EU202D:0 "Avrupa Bankacılık Birliği"
 EU202D_desc:0 "Son finansal krize yanıt olarak tek pazar için daha güvenli bir finans sektörü oluşturmak amacıyla Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üye devletlerindeki tüm finansal aktörler için tek bir kural kitabı oluşturur. Bankalar için daha sıkı ihtiyati gereklilikler, mevduat sahipleri için daha iyi koruma ve batık bankaların yönetimine ilişkin kurallar içerir."
 EU203D:0 "Avro Tahvilleri"
 EU203D_desc:0 "Avro tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, para birliğinin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasıyla boy ölçüşebilecek bir avro tahvili piyasası kurarak hükümetlerin borçlarını finanse etmesi için yeni araçlar yaratır."
 EU204D:0 "Avrupa Finansal İstikrar Fonu (EFSF)"
 EU204D_desc:0 "EFSF, Avrupa borç krizinde avro bölgesi üye devletleri tarafından geçici bir kriz çözüm mekanizması olarak kuruldu ve birçok üye devlete mali yardım sağladı. Bu yardım, EFSF tarafından sermaye piyasalarında ihraç edilen EFSF tahvilleri ve diğer borçlanma araçlarıyla finanse edildi. EFSF artık başka mali yardım sağlamamaktadır; bu görev artık yalnızca ESM tarafından yürütülmektedir."
 EU205D:0 "Avrupa İstikrar Mekanizması (ESM)"
 EU205D_desc:0 "ESM'nin görevi, ciddi finansman sorunları yaşayan veya bu tehditle karşı karşıya kalan avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM üyelerinin finansal istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU206D:0 "Mali Birlik"
 EU206D_desc:0 "Mali birlik, üye devletlerin ortak bir bütçeyi paylaşmasını içerir. Bu, harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirlenmesi anlamına gelir. Mali birlik, Avrupa bütünleşmesinin bir sonraki adımı olarak önerilmektedir ve tüm üye devletler için harcama ve vergi oranlarını merkezi bir Avrupa otoritesinin belirlemesi anlamına gelir."
 EU207D:0 "Avrupa Ekonomik Hükümeti"
 EU207D_desc:0 "Bir Avrupa Ekonomik Hükümeti, AB'de ortak bir maliye ve aktif ekonomi politikasını mümkün kılar. §Y[EUU.GetFlag] Avrupa Birliği'ne§! kendi vergi otoritesini kazandırır ve üye devletler için asgari ücretleri merkezi bir otorite belirler."
 EU208D:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU208D_desc:0 "Bir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükümeti ile oluşturulan politika ve yetkileri tek bir makamda birleştirir."
 EU300D:0 "AB Savunma Politikaları"
 EU300D_desc:0 "Ortak Güvenlik ve Savunma Politikası (OGSP), Birliğin barışı koruma operasyonlarında, çatışmaların önlenmesinde ve uluslararası güvenliğin güçlendirilmesinde öncü bir rol üstlenmesini sağlar. Sivil ve askeri imkânlardan yararlanan OGSP, AB'nin kriz yönetimine yönelik kapsamlı yaklaşımının ayrılmaz bir parçasıdır."
 EU301D:0 "Avrupa Savunma Ajansı (EDA)"
 EU301D_desc:0 "Avrupa Savunma Ajansı, üye devletleri ve §Y[EUU.GetFlag] Avrupa Birliği'ni§! kriz yönetimi alanında Avrupa savunma kabiliyetlerini geliştirme ve Avrupa Güvenlik ve Savunma Politikası'nı bugünkü hâliyle ve gelecekteki gelişimiyle sürdürme çabalarında desteklemek amacıyla kuruldu."
 EU302D:0 "Daimi Yapılandırılmış İşbirliği (PESCO)"
 EU302D_desc:0 "PESCO, istekli ve muktedir üye devletlerin ortak kabiliyet projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına imkân tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu kabiliyetleri ulusal ve çok uluslu görev ve operasyonlar için üye devletlerin kullanımına sunmaktır."
 EU303D:0 "Avrupa Savunma Fonu"
 EU303D_desc:0 "Avrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine ve vatandaşlarının korunup savunulmasına kilit bir katkı sağlayacak. Yeniliği teşvik etmek ve son teknoloji savunma teknolojileri ve ürünleri geliştirmek için şirketler arasında ve AB ülkeleri arasında savunma işbirliğini destekleyecek. Fon, savunmaya yapılan ulusal yatırımları koordine edecek, tamamlayacak ve güçlendirecek."
 EU304D:0 "Avrupa Güvenlik Konseyi"
 EU304D_desc:0 "Bir Avrupa Güvenlik Konseyi, AB'yi uluslararası siyasette karar almaya daha hazırlıklı hâle getirir. AB tutarlı kararları daha hızlı alıp uygulamayı başaramazsa, AB kurallarını uygulama ve çok taraflı yapıları güçlendirme kabiliyeti zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükümetlerarası işbirliği formatıyla desteklenmelidir."
 EU305D:0 "Avrupa Ordusu"
 EU305D_desc:0 "Üye devletler, §Y[EUU.GetFlag] Avrupa Birliği'nin§! askeri kabiliyetlerini güçlendirmek için ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvrupa Ordusu§! olarak bilinecektir."
 EU306D:0 "Avrupa Donanması"
 EU306D_desc:0 "21. yüzyılda çok uluslu filolar ve görev kuvvetleri giderek yaygınlaşıp önem kazanırken §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri güçlerini birleştirip savaş gemilerini §YAvrupa Donanması§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU307D:0 "BM Güvenlik Konseyi'nde AB Daimi Üyeliği"
 EU307D_desc:0 "Üye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olmasına karar verdi. Bu, BMGK'nın reforme edilmesiyle ya da hâlihazırda BMGK üyesi olan üye devlet(ler)in koltuğunun AB'ye devredilmesiyle gerçekleştirilir."
 EU308D:0 "AB Nükleer Gücü"
 EU308D_desc:0 "Nükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki etkisini artıracaktır. Birlik, nükleer silahları üye devletlerinin nükleer silahlarını devralıp paylaşarak ya da kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU400D:0 "AB İkincil Mevzuatı"
 EU400D_desc:0 "AB antlaşmaları, AB üye devletleri arasında AB'nin hedeflerini, AB kurumlarına ilişkin kuralları, kararların nasıl alınacağını ve AB ile üyeleri arasındaki ilişkiyi belirleyen bağlayıcı anlaşmalardır. Antlaşmalar birincil hukuk olarak bilinir. Antlaşmaların ilke ve hedeflerinden doğan hukuk bütünü ise ikincil hukuk (tüzükler, yönergeler, kararlar, tavsiyeler ve görüşler) olarak bilinir."
 EU401D:0 "Genel Veri Koruma Tüzüğü"
 EU401D_desc:0 "AB Genel Veri Koruma Tüzüğü (GDPR), Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek amacıyla tasarlanmıştır."
 EU402D:0 "Dijital Tek Pazarda Telif Hakkı Yönergesi"
 EU402D_desc:0 "Dijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU403D:0 "Dublin II Tüzüğü"
 EU403D_desc:0 "Dublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini belirler. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve aynı kişinin birden fazla sığınma başvurusu yaparak sistemi kötüye kullanmasının önüne geçmektir."
 EU404D:0 "Sığınmacıların Yeniden Yerleştirilmesi ve İskânı"
 EU404D_desc:0 "Başvurularının olumlu sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan başvurularının işleme alınacağı diğer üye devletlere yeniden yerleştirilir. Başvurular olumlu sonuçlanırsa başvuru sahiplerine, yerleştirildikleri üye devlette ikamet hakkıyla birlikte mülteci statüsü verilir."
 EU405D:0 "AB-Türkiye Mutabakatı"
 EU405D_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye üzerinden Avrupa'ya yönelik düzensiz göç akışını durdurmayı amaçlayan bir anlaşma için müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye iade edilecek. §Y[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler İçin Mali Yardım Programı'na 3 milyar avro ödeyecek."
 EU406D:0 "Avrupa Sığınma Ajansı"
 EU406D_desc:0 "AB Komisyonu, sığınma süreci boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali imkânlarla donatılmış bir AB Sığınma Ajansı kurulmasını önerdi."
 EU407D:0 "Frontex"
 EU407D_desc:0 "Frontex, AB ülkelerine ve Schengen'e bağlı ülkelere dış sınırlarını yönetmede yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır yetkilileri arasındaki işbirliğini kolaylaştırır, teknik destek ve uzmanlık sağlar."
 EU408D:0 "Avrupa Sınır ve Sahil Güvenlik Ajansı"
 EU408D_desc:0 "Frontex, Avrupa Sınır ve Sahil Güvenlik Ajansı'na dönüşüyor. Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa sahne oldu. Dış sınırı olan ülkeler sınır kontrolünden tek başına sorumludur; ancak Frontex ciddi göç baskısıyla karşı karşıya kalan AB ülkelerine ek teknik destek sağlayabilir."
 EU500D:0 "Avrupa Komisyonu Politikaları"
 EU500D_desc:0 "Avrupa Komisyonu Politikaları"
 EU600D:0 "AB Genişlemesi"
 EU600D_desc:0 "Genişleme politikası, AB'ye katılmak isteyen ülkeler ve potansiyel adaylar için geçerlidir. Üyelik perspektifi, AB üyesi olmak isteyen ülkelerde demokratik ve ekonomik reformlar için güçlü bir teşviktir."
 EU601D:0 "Avrupa Birliği'nin 2004 Genişlemesi"
 EU601D_desc:0 "1 Mayıs 2004'te toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), bir eski Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) kapsıyor."
 EU602D:0 "Avrupa Birliği'nin 2007 Genişlemesi"
 EU602D_desc:0 "Doğu Avrupa'dan iki ülke daha, §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§!, AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU603D:0 "Avrupa Birliği'nin 2013 Genişlemesi"
 EU603D_desc:0 "2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katılarak üye devlet sayısını 28'e çıkardı."
 EU700D:0 "Ayrılma Politikaları"
 EU700D_desc:0 "Birlik genelinde yükselen Avrupa şüpheciliğiyle birlikte bazı üye devletler §Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmayı düşünecek."
 EU701D:0 "50. Madde"
 EU701D_desc:0 "\"Her Üye Devlet, kendi anayasal kurallarına uygun olarak Birlikten ayrılmaya karar verebilir.\"\n- Avrupa Birliği Antlaşması, Madde 50(1).\n50. Madde ilk olarak Avrupa Birliği Anayasal Antlaşması için kaleme alındı. Anayasanın onaylanamamasının ardından madde Lizbon Antlaşması'na dahil edildi."
 EU702D:0 "Ayrılma Antlaşması"
 EU702D_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmak, ayrılan ülkenin AB hukukunun geçerliliğini yitireceği döneme göre ulusal hukukunu uyarlamak zorunda olduğu karmaşık bir süreçtir. Ayrılan ülke ile §Y[EUU.GetFlag] Avrupa Birliği§! gelecekteki ilişkileri konusunda bir anlaşmaya varmak zorundadır."
 EU703D:0 "Anlaşmasız Çıkış"
 EU704D:0 "Yeniden Katıl"
 EU704D_desc:0 "Birlikten ayrılmak sonsuza dek ayrılmak anlamına gelmez. Bir ülke çıkışın ardından yeniden katılabilir."
 EU110D:0 "Avrupa Birliği'nin Federalleşmesi"
 EU110D_desc:0 "Avrupa bütünleşme süreci, daha fazla bütünleşmenin §Y[EUU.GetFlag] Avrupa Birliği'nin§! Federalleşmesine yol açacağı bir noktaya ulaştı."
 EU111D:0 "Avrupa Birleşik Devletleri"
 EU111D_desc:0 "70 yılı aşkın Avrupa bütünleşmesinin ardından §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri egemenliklerinden vazgeçerek §Y[EUU.GetFlag] Avrupa Birleşik Devletleri'ni§! kurmaya karar verdi."
 EU112D:0 "Avrupa Federasyonu"
 EU112D_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri, nitelikli çoğunluk oylamasını temel ilke olarak benimseyen ve §YAvrupa Federasyonu Başkanı§! tarafından yönetilen §Y[EUU.GetFlag] Avrupa Federasyonu'na§! Birliği dönüştürmeye karar verdi."
 EU113D:0 "Anavatanlar Avrupası"
 EU113D_desc:0 "Daha fazla Avrupa bütünleşmesi, üye devletlerin kültürel mirasını, ulusal kimliklerini ve egemenliğini tehlikeye atacaktır. Avrupa, anavatanların Avrupası'dır; bu yüzden Avrupa bütünleşmesi bu aşamada durmalıdır."
 EU604D:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU604D_desc:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU605D:0 "Batı Balkanlar Genişlemesi"
 EU605D_desc:0 "Batı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU606D:0 "Türkiye"
 EU606D_desc:0 "§Y[TUR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU607D:0 "Karadeniz Genişlemesi"
 EU607D_desc:0 "Karadeniz ülkeleri §Y[MLV.GetNameWithFlag]§! ve §Y[UKR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU608D:0 "Kafkasya Genişlemesi"
 EU608D_desc:0 "Kafkas ülkeleri §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! ve §Y[GEO.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU609D:0 "Avrupa Ekonomik Alanı"
 EU609D_desc:0 "Avrupa Ekonomik Alanı'nın AB üyesi olmayan ülkeleri (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! ve §Y[ICE.GetNameWithFlag]§!) §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU610D:0 "Belarus"
 EU610D_desc:0 "§Y[BLR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU611D:0 "İç Genişleme"
 EU611D_desc:0 "İç genişleme, mevcut bir üye devletin dağılması veya ondan ayrılma yoluyla yeni üye devletlerin ortaya çıkması sürecidir. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! ve §Y[WAS.GetNameWithFlag]§! bağımsızlıklarını kazandıklarında §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday olabilir."
 POTEF001D:0 "Avrupa Federasyonu Başkanı"
 POTEF001D_desc:0 "§YAvrupa Federasyonu Başkanı (POTEF)§! Avrupa'nın en üst lideridir. Bu nedenle Avrupa Federasyonu Başkanı, tüm Federasyon için belirleyici stratejik kararları alma yetkisine sahiptir."
 POTEF100D:0 "Alp Doktrini"
 POTEF100D_desc:0 "Alp ülkeleri §Y[AUS.GetNameWithFlag]§! ve §Y[SWI.GetNameWithFlag]§! uzun bir dağ savaşı geleneğine sahiptir. Alp Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF101D:0 "Yaratılışın Bütünlüğü"
 POTEF101D_desc:0 "Avrupa Federasyonu, Yaratılışın Bütünlüğünü korumak ve sürdürmek için politikalarını uyarlıyor."
 POTEF102D:0 "Çevreci Emperyalizm"
 POTEF102D_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF103D:0 "Kuzey Amerika"
 POTEF103D_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF104D:0 "Güney Amerika"
 POTEF104D_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF105D:0 "Avrupa"
 POTEF105D_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF106D:0 "Afrika"
 POTEF106D_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF107D:0 "Orta Doğu"
 POTEF107D_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF108D:0 "Asya"
 POTEF108D_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF109D:0 "Okyanusya"
 POTEF109D_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF110D:0 "Pasifik"
 POTEF110D_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF150D:0 "Alman Doktrini"
 POTEF150D_desc:0 "§Y[GER.GetNameWithFlag]§! geleneksel olarak güçlü zırhlı kuvvetlere odaklanmıştır. Zırhlı Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF151D:0 "Ticaret İmparatorluğu"
 POTEF151D_desc:0 "Avrupa Federasyonu bir Ticaret İmparatorluğu olacak."
 POTEF200D:0 "Fransız Doktrini"
 POTEF200D_desc:0 "§Y[FRA.GetNameWithFlag]§! geleneksel olarak yüksek hareket kabiliyetine sahip hafif zırhlı ve motorlu kuvvetlere odaklanmıştır. Manevra Savaşı Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF201D:0 "İmparatorluk Gücü"
 POTEF201D_desc:0 "Avrupa Federasyonu, imparatorluk öncüllerinin geleneğini sürdürüyor."
 POTEF202D:0 "Özgürlük İmparatorluğu"
 POTEF202D_desc:0 "Avrupa Federasyonu bir Özgürlük İmparatorluğu olacak."
 POTEF203D:0 "Amerika: Müttefik mi, Hasım mı?"
 POTEF203D_desc:0 "Amerika ve Avrupa, 20. yüzyılın büyük bölümünde müttefikti. §Y[USA.GetNameWithFlag]§! ülkesindeki son siyasi değişikliklerle bu durum sorgulanır oldu…"
 POTEF204D:0 "NATO Mirası"
 POTEF204D_desc:0 "NATO'nun barışı koruma mirası geleneğinde §Y[USA.GetNameWithFlag]§! ve §YEDU§! yeni bir ittifak kuruyor."
 POTEF205D:0 "Trump'ın Mirası"
 POTEF205D_desc:0 "§Y[USA.GetNameWithFlag]§! müttefiklikten hasımlığa geçti. Avrupa bu belirleyici stratejik değişime karşılık vermek zorunda."
 POTEF206D:0 "Duvarı Yık"
 POTEF206D_desc:0 "Avrupa egemenliğine yönelik Amerikan tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[MEX.GetNameWithFlag]§! ile ittifak kurup §Y[USA.GetNameWithFlag]§! ülkesini güneyden işgal etmeye yönelik bir plan hazırladı."
 POTEF207D:0 "Buster'ın Dirilişi"
 POTEF207D_desc:0 "ABD'nin Avrupa'ya yönelik tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[CAN.GetNameWithFlag]§! ile ittifak kurup 1 No'lu Savunma Planı'nı revize etmeyi önerdi. Bu plan, Kanadalı Yarbay James 'Buster' Sutherland Brown tarafından ABD ile Britanya İmparatorluğu arasında yakın bir çatışma durumunda Kanada'nın ABD'ye önleyici bir saldırı düzenlemesi için hazırlanmıştı. Bu planla §YEDU§!, §Y[USA.GetFlag] ABD'yi§! kuzeyden işgal edebilir."
 POTEF250D:0 "Benelüks Doktrini"
 POTEF250D_desc:0 "Soğuk Savaş'ın ardından §YAlçak Ülkeler§! yeni duruma uyum sağlamak için havadan hareketli kuvvetlere odaklandı. Havadan Hareket Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF251D:0 "Liberal Miras"
 POTEF251D_desc:0 "Avrupa Federasyonu Liberal Mirasını onurlandırıyor."
 POTEF252D:0 "Eski Ticaret Yollarını Güvenceye Al"
 POTEF252D_desc:0 "Avrupa Federasyonu'nun Karayipler'e, Afrika'ya ve eski Hollanda Doğu Hint Adaları'na uzanan eski ticaret yollarını güvenceye alması gerekiyor."
 POTEF253D:0 "Endonezya"
 POTEF253D_desc:0 "Avrupa Federasyonu'nun eski Hollanda sömürgesi §Y[IND.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF300D:0 "İber Doktrini"
 POTEF300D_desc:0 "§YIberya ülkeleri§! geleneksel olarak güçlü deniz piyadesi kuvvetlerine odaklanmıştır. Deniz Piyadesi Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF301D:0 "Latin Kuzenler"
 POTEF301D_desc:0 "Avrupa Federasyonu'nun Güney Amerika'daki eski sömürgelerle ilişkilerini geliştirmesi gerekiyor."
 POTEF302D:0 "Meksika"
 POTEF302D_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[MEX.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Orta Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF303D:0 "Büyük Kolombiya"
 POTEF303D_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[COL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF304D:0 "Orta Amerika"
 POTEF304D_desc:0 "Avrupa Federasyonu'nun §YOrta Amerika'daki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF305D:0 "Güney Koni"
 POTEF305D_desc:0 "Avrupa Federasyonu'nun §YGüney Amerika'nın Güney Konisi'ndeki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF306D:0 "Brezilya"
 POTEF306D_desc:0 "Avrupa Federasyonu'nun eski Portekiz sömürgesi §Y[BRA.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF350D:0 "İngiliz Doktrini"
 POTEF350D_desc:0 "§YBritanya§! geleneksel olarak güçlü bir donanmaya odaklanmıştır. Deniz Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF351D:0 "Kuzey Atlantik'i Güvenceye Al"
 POTEF351D_desc:0 "Denizlerin özgürlüğünü ve serbest ticareti güvence altına almak için Avrupa Federasyonu'nun Kuzey Atlantik'i kontrol etmesi gerekiyor."
 POTEF352D:0 "Milletler Topluluğu Mirası"
 POTEF352D_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması ve eski İngiliz dominyonlarıyla ilişkilerini geliştirmesi gerekiyor."
 POTEF353D:0 "Kanada"
 POTEF353D_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[CAN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF354D:0 "Avustralya"
 POTEF354D_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[AST.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF355D:0 "Yeni Zelanda"
 POTEF355D_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[NZL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF356D:0 "Kuzey Denizi'ni Güvenceye Al"
 POTEF356D_desc:0 "Kuzey Denizi, Avrupa Federasyonu'nun arka bahçesidir ve güvence altına alınması gerekir."
 POTEF357D:0 "Malaya Mirası"
 POTEF357D_desc:0 "Avrupa Federasyonu'nun Malaya'daki eski İngiliz sömürgeleriyle ilişkilerini geliştirmesi gerekiyor."
 POTEF358D:0 "Malezya"
 POTEF358D_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[MAY.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF359D:0 "Singapur"
 POTEF359D_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[SIN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF360D:0 "Hong Kong'a Garanti Ver"
 POTEF360D_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[HKG.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Çin-İngiltere Ortak Bildirisi'ndeki özgürlükleri güvence altına alması gerekiyor."
 POTEF400D:0 "İskandinav Doktrini"
 POTEF400D_desc:0 "§YSkandinav ülkeleri§! geleneksel olarak Arktik'te savaşmaya odaklanmıştır. İskandinav Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF401D:0 "Arktik'i Güvenceye Al"
 POTEF401D_desc:0 "Denizlerin özgürlüğünü ve jeostratejik konumunu güvence altına almak için Avrupa Federasyonu'nun Arktik'i kontrol etmesi gerekiyor."
 POTEF450D:0 "Akdeniz Doktrini"
 POTEF450D_desc:0 "§YAkdeniz ülkeleri§! geleneksel olarak denizden çıkarma taktiklerine odaklanmıştır. Amfibi Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF451D:0 "Kuzey Afrika"
 POTEF451D_desc:0 "Bir yakınsama bölgesi ve mülteciler için güvenli bir liman oluşturmak amacıyla Avrupa Federasyonu'nun §YKuzey Afrika§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF452D:0 "Kıbrıs'ı Birleştir"
 POTEF452D_desc:0 "Avrupa Federasyonu'nun egemen bir üye devleti olarak §Y[CYP.GetNameWithFlag]§! yeniden birleştirilmelidir."
 POTEF500D:0 "Balkan Doktrini"
 POTEF500D_desc:0 "§YBalkan ülkeleri§! geleneksel olarak partizan kuvvetlere odaklanmıştır. Partizan Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF501D:0 "Balkan Altyapısı"
 POTEF501D_desc:0 "Avrupa Federasyonu'nun bölgesel barışı korumak ve Balkanları yabancı etkiden korumak için Balkanların altyapısını geliştirmesi gerekiyor."
 POTEF502D:0 "İpek Yolu'na Meydan Oku"
 POTEF502D_desc:0 "Avrupa Federasyonu'nun Çin'in yeni İpek Yolu'na meydan okuması ve Orta Asya'daki Çin etkisini azaltması gerekiyor."
 POTEF503D:0 "Rakip Çin"
 POTEF503D_desc:0 "§Y[CHI.GetNameWithFlag]§! küresel düzeyde Avrupa Federasyonu'nun başlıca rakiplerinden biri hâline geldi. Avrupa Federasyonu'nun politikalarını buna göre uyarlaması gerekiyor."
 POTEF504D:0 "Ok Harekâtı"
 POTEF504D_desc:0 "Adını Ok Savaşı'ndan (İkinci İngiliz-Çin Savaşı) alan Ok Harekâtı, Çin'in yayılmacı politikasını durdurmak için §Y[CHI.GetNameWithFlag]§! ülkesine Avrupa müdahalesini öngören bir plandır."
 POTEF505D:0 "Asyalı Müttefikler"
 POTEF505D_desc:0 "§Y[CHI.GetNameWithFlag]§! ile yüzleşmek için Avrupa Federasyonu'nun Asya'da müttefiklere ihtiyacı var."
 POTEF506D:0 "Kore Cumhuriyeti"
 POTEF506D_desc:0 "§Y[KOR.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF507D:0 "Japonya"
 POTEF507D_desc:0 "§Y[JAP.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF550D:0 "Karadeniz Doktrini"
 POTEF550D_desc:0 "Soğuk Savaş'ın ardından §YKaradeniz ülkeleri§! yeni duruma uyum sağlamak için hareketli hava savunma kuvvetlerine odaklandı. Hava Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF551D:0 "Karadeniz'i Güvenceye Al"
 POTEF551D_desc:0 "Karadeniz, Avrupa Federasyonu'nu Kafkasya'ya ve güneydoğudaki üye devletlerine bağlar. Bu nedenle güvence altına alınması gerekir."
 POTEF552D:0 "Ayrılıkçı Cumhuriyetleri Yeniden Entegre Et"
 POTEF552D_desc:0 "§Y[SOV.GetNameWithFlag]§!, ayrılıkçı hareketleri destekleyip ayrılıkçı cumhuriyetler kurarak Avrupa Federasyonu'nun çeşitli doğu üye devletlerinin egemenliğini ihlal etti. Bu Rus kuklalarını yeniden entegre etmemiz gerekiyor."
 POTEF553D:0 "Rakip Rusya"
 POTEF553D_desc:0 "§Y[SOV.GetNameWithFlag]§! Avrupa Federasyonu'nun başlıca rakiplerinden biri oldu. Ona yaptırımlar uygulamamız gerekiyor."
 POTEF554D:0 "Şarlman Harekâtı"
 POTEF554D_desc:0 "Adını 'Avrupa'nın Babası' (Pater Europae) olarak anılan efsanevi imparator Şarlman'dan alan Şarlman Harekâtı, §Y[SOV.GetNameWithFlag]§! ülkesine karşı önleyici meşru müdafaa planıdır. Bu harekâtla §YEDU§!, Avrupa egemenliğine yönelik bu tehdidi ortadan kaldırmak için §Y[SOV.GetNameWithFlag]§! ülkesine önleyici bir işgal başlatabilir."
 POTEF600D:0 "Kafkasya Doktrini"
 POTEF600D_desc:0 "Soğuk Savaş'ın ardından §YKafkasya bölgesi ülkeleri§! yeni duruma uyum sağlamak için güçlü bir savunmaya odaklandı. Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF601D:0 "Avrupa Erişimi"
 POTEF601D_desc:0 "Avrupa Federasyonu'nun Kafkasya'ya ve güneydoğudaki üye devletlerine erişime ihtiyacı var. Bu nedenle yeni deniz üsleri ve altyapı inşa edilmesi gerekiyor."
 POTEF650D:0 "Vişegrad Doktrini"
 POTEF650D_desc:0 "§YVişegrad ülkeleri§! geleneksel olarak güçlü topçu kuvvetlerine odaklanmıştır. Topçu Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF651D:0 "Avrupa Hava Savunma Ağı"
 POTEF651D_desc:0 "Avrupa Federasyonu'nun doğu kanadını güvence altına almak için bir hava savunma ağı kurması gerekiyor."
 POTEF652D:0 "Doğu Güvenlik Duvarı"
 POTEF652D_desc:0 "§Y[SOV.GetNameWithFlag]§! ülkesinin doğudaki üye devletlerde artan etkisine karşı koyulması gerekiyor."
 POTEF700D:0 "Baltık Doktrini"
 POTEF700D_desc:0 "§YBaltık ülkeleri§! geleneksel olarak küçük ve son derece yetenekli özel kuvvetlere odaklanmıştır. Özel Kuvvetler Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF701D:0 "Baltık Denizi'ni Güvenceye Al"
 POTEF701D_desc:0 "Baltık Denizi, Avrupa Federasyonu'nun iç denizidir ve güvence altına alınması gerekir."
 POTEF800D:0 "Pax Europaea"
 POTEF800D_desc:0 "Avrupa Federasyonu'nun dünya barışını sağlamak için küresel süper güç olması gerekiyor."
 USoE001D:0 "Yeni Avrupa Milletini Kur"
 USoE001D_desc:0 "Birleşik Avrupa Birliği'nin kendini yeni bir millet olarak kurması gerekiyor. Anayasa ve Birleşme Antlaşmaları bir şey; ama şimdi halkın bu yasal çerçeveyi hayatla doldurması gerekiyor."
 USoE002D:0 "Avrupa Subay Kolordusu"
 USoE002D_desc:0 "Birlik döneminde her üye devletin kendi ordusu vardı, daha sonra da Avrupa Ordusu kuruldu. Ortak doktrin ve eğitime sahip bir Avrupa Subay Kolordusu oluşturmamız gerekiyor."
 USoE003D:0 "Avrupa Siyasi Partileri"
 USoE003D_desc:0 "Yeni bir millet yeni siyasi partilere ihtiyaç duyar. Üye devletlerin eski siyasi partileri birleşmek zorunda."
 USoE004D:0 "Avrupa Vatanseverliği"
 USoE004D_desc:0 "Yeni bir millet kendi vatanseverliğine ve ulusal sembollerine ihtiyaç duyar."
 USoE005D:0 "Yeni Büyük Oyun"
 USoE005D_desc:0 "Yeni Büyük Oyun daha yeni başladı ve Avrupa geç kaldı; ABD, Çin ve Rusya ise ilk hamlelerini çoktan yaptı."
 USoE006D:0 "Avrupa'nın Kalbi ve Ruhu"
 USoE006D_desc:0 "Yeni milletin değerlerini ve standartlarını tanımlaması gerekiyor. Avrupa'nın bir Kalbe ve Ruha ihtiyacı var!"
 USoE100D:0 "Nüfuz Alanları Oyunu"
 USoE100D_desc:0 "Nüfuz alanları oyununu oynadığında ya kazanırsın ya ölürsün. Orta yolu yoktur."
 USoE101D:0 "Kartalla Hesaplaş"
 USoE101D_desc:0 "Amerikan Kartalı yere indirilmeli! Avrupa semalarında fazlasıyla uzun süre uçtu."
 USoE102D:0 "Ayıyla Kapış"
 USoE102D_desc:0 "Ayı bize saldırmadan önce biz ona saldırmalıyız."
 USoE103D:0 "Ejderhayla Dans"
 USoE103D_desc:0 "Ejderhayla Dans tehlikeli bir oyundur."
 USoE104D:0 "Demirden Bir Kalp"
 USoE104D_desc:0 "Eski zamanlarda demirciler, yenilen kötülerin silahlarından demir bir taht döverlerdi. Günümüzde ise sadece Avrupa'nın demirden kalbini kanıtladığını ve artık dünyanın tartışmasız hâkimi olduğunu ilan ediyoruz!"
 USoE200D:0 "Barış İçinde Bir Arada Yaşam"
 USoE200D_desc:0 "Demirden daha keskin kılıçlar vardır. Parayla ödeyebilecekken neden kanla ödeyesin?"
 USoE201D:0 "Önce Amerika"
 USoE201D_desc:0 "Kendi doktrinlerimize saygı duyulmasını istiyorsak Önce Amerika doktrinine saygı duymalıyız."
 USoE202D:0 "Rus Nüfuz Alanı"
 USoE202D_desc:0 "Rusya tüm Rus halkının koruyucusudur. Bu, saygı duymamız gereken onların nüfuz alanıdır."
 USoE203D:0 "Çin Nüfuz Alanı"
 USoE203D_desc:0 "Çin'in nüfuz alanı Güneydoğu Asya'yı kapsar ve bizi rahatsız etmez. Çin bizim ticaret ortağımızdır, rakibimiz değil."
 USoE204D:0 "Avrupa Nüfuz Alanı"
 USoE204D_desc:0 "21. yüzyılın tüm süper güçlerini yatıştırdık; artık Avrupa, Levant ve Kuzey Afrika'da Avrupa Nüfuz Alanı'nı kurmak için elimiz serbest."
 USoE300D:0 "Medeniyetler Çatışması"
 USoE300D_desc:0 "Medeniyetler Çatışması, Amerikalı siyaset bilimci Samuel P. Huntington'ın Soğuk Savaş sonrası dünyada insanların kültürel ve dinî kimliklerinin başlıca çatışma kaynağı olacağını öne süren tezidir. Gelecekteki savaşlar ülkeler arasında değil, kültürler arasında yaşanacaktır."
 USoE301D:0 "Batı'nın Geri Kalanı"
 USoE301D_desc:0 "Avrupa, Batı'nın geri kalanıdır. Amerika, Önce Amerika doktriniyle bizi yalnız ve tecrit edilmiş bıraktı."
 USoE302D:0 "Haç ve Hilal"
 USoE302D_desc:0 "Avrupa'nın güneydoğu sınırında haç ile hilal çatışıyor. Kim galip gelecek: Batı medeniyeti mi, İslam medeniyeti mi?"
 USoE303D:0 "Papa ve Patrik"
 USoE303D_desc:0 "1054'teki Büyük Ayrılık'tan bu yana Papa ile Ortodoks Patrik farklı yollara gitti. Batı medeniyetini savunmak için yeniden birleşme zamanı geldi."
 USoE304D:0 "İki Haç"
 USoE304D_desc:0 "Doğu ve Batı Hristiyanlığının İslam'a karşı birleşmesi gerekiyor."
 USoE305D:0 "Avrasya İttifakı"
 USoE305D_desc:0 "NATO'nun dağılmasının ardından Avrupa, Rus komşusuyla yeni ve büyük bir ittifak kurabilir."
 USoE306D:0 "Konstantinopolis"
 USoE306D_desc:0 "Konstantinopolis Batı'nın bir parçasıdır. Avrupa'nın onu İslam etkisinden kurtarması gerekiyor."
 USoE307D:0 "Antakya"
 USoE307D_desc:0 "Antakya Prinkepsliği, Birinci Haçlı Seferi sırasında kurulan Haçlı devletlerinden biriydi. Batı'ya aittir ve bir kez daha İslam'dan arındırılmalıdır."
 USoE308D:0 "Trablus"
 USoE308D_desc:0 "Trablus Kontluğu (1109–1289) Haçlı devletlerinin sonuncusuydu. Yeniden yükselmeli. Avrupa'nın Levant'ı İslam'dan kurtarması gerekiyor."
 USoE309D:0 "Kudüs"
 USoE309D_desc:0 "Avrupa'nın Kutsal Şehri İslam etkisinden kurtarması gerekiyor. Kudüs Krallığı kutsal mekânları bir kez daha koruyacak."
 USoE310D:0 "Malta Şövalyeleri"
 USoE310D_desc:0 "Avrupa'nın Kuzey Afrika'yı İslam etkisinden kurtarması gerekiyor. Avrupa, Malta Şövalyeleri'nin örneğini izleyecek."
 USoE311D:0 "Arabistan'ın Batılılaşması"
 USoE311D_desc:0 "Arap Yarımadası'ndaki bazı ülkelerin Batı ile zaten yakın bağları var. Güvenli bir komşuluğa sahip olmak için Avrupa'nın Arap Yarımadası'nı tamamen Batılılaştırması gerekiyor."
 USoE312D:0 "Hindistan'ın Batılılaşması"
 USoE312D_desc:0 "Sömürge mirası sayesinde Hindistan'ın Batı ile geleneksel olarak yakın bağları var. Avrupa, Hindistan'ı tamamen Batılılaştırmak için bu ilişkiyi derinleştirmeli."
 USoE313D:0 "İran Cumhuriyeti"
 USoE313D_desc:0 "İran, Orta Doğu'da Batı'nın başlıca rakiplerinden biridir. Avrupa, İran'ı Batılılaştırıp İran Cumhuriyeti'ne dönüştürerek onun bölgesel hegemonya arayışını durdurabilir."
 USoE320D:0 "Batı ve Diğerleri"
 USoE320D_desc:0 "Avrupa ve Amerika, dünyadaki her düşmana kafa tutabilecek Batılı süper güçlerdir. NATO'yu temel alarak Batı küresel hâkimiyetini dayatabilir."
 USoE321D:0 "Asya'nın Batılılaşması"
 USoE321D_desc:0 "Batı'nın Asya'daki yükselen güçlere odaklanması gerekiyor. Batı onlarla savaşmalı ya da onları Batılılaştırmalı."
 USoE322D:0 "Dört Kaplan"
 USoE322D_desc:0 "Hong Kong, Singapur, Güney Kore ve Tayvan'dan oluşan Dört Asya Kaplanı'nın Batı ile her zaman yakın bağları oldu ve yükselen Çin ejderhasından korkuyorlar. Asya'da Batı'nın güvenilir müttefikleri olabilirler."
 USoE323D:0 "Japonya"
 USoE323D_desc:0 "İkinci Dünya Savaşı'nın sona ermesinin ardından Japonya, Asya'da Batı'nın önemli bir müttefiki oldu. Batı'nın bu yakın ortaklığı sürdürmesi gerekiyor."
 USoE324D:0 "Çin"
 USoE324D_desc:0 "Çin, Asya'da Batı'nın başlıca rakibidir. Batı Çin'i Batılılaştırabilirse Asya'da Batı hegemonyasına rakip kalmayacaktır."
 USoE325D:0 "Düşünülemez Harekâtı 2.0"
 USoE325D_desc:0 "Düşünülemez Harekâtı, Mayıs 1945'te Winston Churchill'in emriyle İngiliz Genelkurmay Başkanları tarafından Sovyetler Birliği'ne karşı hazırlanan bir savaş planıydı. Batılı Müttefikler, eski Alman Wehrmacht'ı ile birlikte Sovyetler Birliği'ne sürpriz bir saldırı başlatacaktı. Batı'nın bu planı mevcut duruma göre revize etmesi ve Avrupa'da Rus hegemonyasını önlemek için Rusya'ya karşı önleyici meşru müdafaa amacıyla harekete geçmesi gerekiyor."
 USoE400D:0 "Özgürlük Meşalesi"
 USoE400D_desc:0 "Avrupa'nın Özgürlük Meşalesi'ni taşıması gerekiyor! Avrupa Birleşik Devletleri, insan haklarına ve hukukun üstünlüğüne saygı duyan demokratik bir cumhuriyettir."
 USoE401D:0 "Dijital Demokrasi"
 USoE401D_desc:0 "Avrupa'nın demokratik kurumlarını dijital çağa göre reforme etmesi gerekiyor. Sosyal medya ve sosyal ağlar sayesinde halk yasamaya ve yönetime doğrudan katılabilir."
 USoE402D:0 "Orak ve Çekiç"
 USoE402D_desc:0 "Sosyalizmin ve Marksizmin babaları Karl Marx ve Friedrich Engels Avrupalıydı. Avrupa'nın bu mirası sürdürmesi gerekiyor."
 USoE403D:0 "ASSCB"
 USoE403D_desc:0 "Avrupa solu kapitalistleri Avrupa Birliği'nde kapana kıstırdı; artık Karl Marx ve Friedrich Engels'in manevi mirasçıları ASSCB'yi, yani Avrupa Sovyet Sosyalist Cumhuriyetler Birliği'ni kurma gücüne sahip."
 USoE404D:0 "Yapay Zekâ Hükümeti"
 USoE404D_desc:0 "Yapay zekâ, bir ülkeyi verimsiz ve yozlaşma ihtimali olan insan politikacılardan daha verimli yönetecek kadar gelişti. İktidar partisinin yapay zekâ ajanı kontrolü ele alacak ve ülkeyi iktidar partisinin değerlerine göre yönetecek."
 USoE500D:0 "Yeşil Gelecek"
 USoE500D_desc:0 "İnkâr edilemez iklim değişikliği karşısında Avrupa için yeşil bir gelecekten başka gelecek yok."
 USoE501D:0 "Çevre İmparatorluğu"
 USoE501D_desc:0 "Avrupa'nın, ekonomi ile çevrenin çelişmediği bir Çevre İmparatorluğu olması gerekiyor."
 USoE502D:0 "Çevreci Emperyalizm"
 USoE502D_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE503D:0 "Kuzey Amerika"
 USoE503D_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE504D:0 "Güney Amerika"
 USoE504D_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE505D:0 "Avrupa"
 USoE505D_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE506D:0 "Afrika"
 USoE506D_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE507D:0 "Orta Doğu"
 USoE507D_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE508D:0 "Asya"
 USoE508D_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE509D:0 "Okyanusya"
 USoE509D_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE510D:0 "Pasifik"
 USoE510D_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE600D:0 "Haç ve Taç"
 USoE600D_desc:0 "Avrupa'nın mirasını yerine getirmesi ve bir kez daha imparatorluk olması gerekiyor."
 USoE601D:0 "Yeni Şövalyeler"
 USoE601D_desc:0 "Düşmanca bir dünyada ordu, halkını yozlaşmış politikacılardan ve yabancı güçlerden kurtarmak için Avrupa'da kontrolü ele aldı."
 USoE602D:0 "Avrupa Orduları Generali"
 USoE602D_desc:0 "Genelkurmay, Avrupa'nın bir kara kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Orduları Generali rütbesi verilecek."
 USoE603D:0 "Avrupa Hava Mareşali"
 USoE603D_desc:0 "Genelkurmay, Avrupa'nın bir hava kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Hava Mareşali rütbesi verilecek."
 USoE604D:0 "Avrupa Büyükamirali"
 USoE604D_desc:0 "Genelkurmay, Avrupa'nın bir amiral tarafından yönetilmesine karar verdi. Bu amirale Avrupa Büyükamirali rütbesi verilecek."
 USoE605D:0 "Avrupa İmparatorluğu"
 USoE605D_desc:0 "Avrupa bir kez daha imparatorluk oldu ve halkının çıkarlarını küresel düzeyde savunabiliyor."
 USoE620D:0 "Yeni İmparator"
 USoE620D_desc:0 "Avrupa'nın kıtayı 21. yüzyılda yönetecek yeni bir imparatora ihtiyacı var."
 USoE621D:0 "Bir Hanedan Seç"
 USoE621D_desc:0 "Avrupa'nın uzun ve şanlı geçmişe sahip pek çok büyük hanedanı var. İlk kez birleşen kıtanın 21. yüzyılda hangi hanedanın hüküm süreceğine karar vermesi gerekiyor."
 USoE622D:0 "Savoy Hanedanı"
 USoE622D_desc:0 "Savoy Hanedanı, 1003'te tarihî Savoy bölgesinde kurulan bir kraliyet hanedanıdır. Aile, kademeli genişlemeyle İtalya'nın kuzeybatısındaki küçük bir Alp kontluğunu yönetmekten Sicilya Krallığı'nın mutlak hâkimiyetine kadar yükseldi. Hanedan üyeleri Sardinya, İtalya, Arnavutluk, Etiyopya ve kısa bir süre İspanya'yı yönetti. Hanedan ayrıca Kıbrıs, Kudüs ve Ermenistan krallıkları unvanlarında da hak iddia eder."
 USoE623D:0 "Wittelsbach Hanedanı"
 USoE623D_desc:0 "Wittelsbach Hanedanı, kolları Bavyera, Hollanda, Zeeland, Köln, İsveç, Romanya, Bohemya, Macaristan, Danimarka, Norveç, Yunanistan ve Kutsal Roma İmparatorluğu dahil pek çok toprağı yönetmiş Alman-Bavyeralı bir hanedandır. Katolik bir hükümdarın hakkını tanıyan Jakobit veraset çizgisi, Bavyera Veliaht Prensi Franz'ı II. Francis olarak meşru varis kabul eder."
 USoE624D:0 "Borbón-Anjou Hanedanı"
 USoE624D_desc:0 "Borbón-Anjou Hanedanı, İspanya Krallığı'nın hüküm süren kraliyet hanedanıdır. 18. yüzyılda İspanyol Bourbon hanedanının üyeleri İspanya, Napoli, Sicilya ve Parma'da taht sahibiydi."
 USoE625D:0 "Bourbon Hanedanı"
 USoE625D_desc:0 "Bourbon Hanedanı, Fransa'nın kraliyet hanedanı olan Capet hanedanının bir kolu olan Fransız kökenli bir Avrupa hanedanıdır. Bourbon kralları Fransa ve Navarra'yı ilk kez 16. yüzyılda yönetti."
 USoE626D:0 "Hannover Hanedanı"
 USoE626D_desc:0 "Hannover Hanedanı, 17. ve 20. yüzyıllar arasında çeşitli dönemlerde Hannover, Büyük Britanya ve İrlanda'yı yönetmiş bir Alman kraliyet hanedanıdır. Hanedan 1635'te Brunswick-Lüneburg Hanedanı'nın genç bir kolu olarak doğdu ve 1692'de Hannover'in Prens-Seçicilik olmasına kadar prestij kazandı."
 USoE627D:0 "Glücksburg Hanedanı"
 USoE627D_desc:0 "Schleswig-Holstein-Sonderburg-Glücksburg Hanedanı'nın kısaltılmış adıyla Glücksburg Hanedanı, üyeleri çeşitli dönemlerde Danimarka, Norveç, Yunanistan ve birkaç kuzey Alman devletinde hüküm sürmüş, Oldenburg Hanedanı'nın Danimarkalı-Alman bir koludur."
 USoE628D:0 "Windsor Hanedanı"
 USoE628D_desc:0 "Windsor Hanedanı, Birleşik Krallık'ın ve diğer Milletler Topluluğu krallıklarının hüküm süren kraliyet hanedanıdır. 1901'de Saxe-Coburg ve Gotha Hanedanı, İngiliz monarşisinde Hannover Hanedanı'nın yerini aldı. 1917'de Birinci Dünya Savaşı nedeniyle kraliyet hanedanının adı Almanca Saxe-Coburg ve Gotha'dan İngilizce Windsor'a (Windsor Kalesi'nden) değiştirildi."
 USoE629D:0 "Orange-Nassau Hanedanı"
 USoE629D_desc:0 "Orange-Nassau Hanedanı, Hollanda'nın hâlen hüküm süren hanedanıdır. Avrupa Nassau Hanedanı'nın bir kolu olan hanedan, özellikle Sessiz William'ın İspanyol yönetimine karşı Hollanda isyanını örgütlemesinden ve bu isyanın Seksen Yıl Savaşları'nın (1568–1648) ardından bağımsız bir Hollanda devletine yol açmasından bu yana Hollanda ve Avrupa siyasetinde ve yönetiminde merkezi bir rol oynamıştır."
 USoE630D:0 "Habsburg-Lorraine Hanedanı"
 USoE630D_desc:0 "Habsburg-Lorraine Hanedanı, 1736'da Lorraine ve Bar Dükü III. François ile daha sonra sırasıyla Bohemya Kraliçesi, Macaristan Kraliçesi ve Avusturya Arşidüşesi olacak olan Avusturyalı Maria Theresa'nın evliliğinden doğmuştur. Üyeleri, Habsburg Hanedanı'nın ve Lorraine Hanedanı'nın hayatta kalan meşru soyudur; aile mülklerini ve İmparatorluk misyonunu miras almışlardır."
 USoE631D:0 "Bonaparte Hanedanı"
 USoE631D_desc:0 "Bonaparte Hanedanı, İtalyan kökenli eski bir imparatorluk ve kraliyet hanedanıdır. 1804'te I. Napolyon tarafından kuruldu. Napolyon, Grande Armée'yi tüm büyük Avrupa güçlerine karşı yöneltti ve bir dizi askeri zaferle kıta Avrupası'na hâkim oldu. Ailesinin üyelerini bağımlı devletlerin tahtlarına oturtarak hanedanın gücünü genişletti."
 USoE632D:0 "Hohenzollern Hanedanı"
 USoE632D_desc:0 "Hohenzollern Hanedanı, üyeleri çeşitli dönemlerde Hohenzollern, Brandenburg, Prusya, Alman İmparatorluğu ve Romanya'nın prensleri, prens-seçicileri, kralları ve imparatorları olmuş eski bir Alman kraliyet hanedanıdır. Aile, 11. yüzyılda Svabya'daki Hechingen kasabası çevresinde ortaya çıktı ve adını Hohenzollern Kalesi'nden aldı."
 USoE633D:0 "Bir Saray Seç"
 USoE633D_desc:0 "Avrupa'nın yeni İmparatoru'nun hüküm sürmek için temsil gücü yüksek bir saraya ihtiyacı var."
 USoE634D:0 "Quirinale Sarayı"
 USoE634D_desc:0 "Quirinale Sarayı, İtalya'nın Roma şehrinde bulunan tarihî bir yapıdır ve İtalya Cumhurbaşkanı'nın üç resmî konutundan biridir. Napolyon, Quirinale Sarayı'nı İmparator olarak asıl konutu olarak seçmişti. Ancak 1814'teki Fransız yenilgisi ve ardından gelen Avrupa Restorasyonu nedeniyle buraya hiç yerleşemedi."
 USoE635D:0 "Neuschwanstein Şatosu"
 USoE635D_desc:0 "Neuschwanstein Şatosu, Almanya'nın güneybatı Bavyera bölgesinde engebeli bir tepenin üzerinde yer alan 19. yüzyıldan kalma Neo-Romanesk bir saraydır. Saray, Bavyera Kralı II. Ludwig tarafından yaptırıldı. Şato, 1886'daki ölümüne kadar Kral'ın konutu olması amacıyla inşa edildi ve ölümünden kısa süre sonra halka açıldı. O zamandan beri 61 milyondan fazla kişi Neuschwanstein Şatosu'nu ziyaret etti."
 USoE636D:0 "Madrid Kraliyet Sarayı"
 USoE636D_desc:0 "Madrid Kraliyet Sarayı, İspanyol kraliyet ailesinin Madrid'deki resmî konutudur, ancak günümüzde yalnızca devlet törenleri için kullanılmaktadır. Saray 135.000 metrekare kullanım alanına ve 3.418 odaya sahiptir. Avrupa'da hâlâ işlevini sürdüren en büyük kraliyet sarayıdır ve kullanım alanı bakımından da en büyüğüdür."
 USoE637D:0 "Versay Sarayı"
 USoE637D_desc:0 "Versay Sarayı, XIV. Louis döneminde 1682'den XVI. Louis döneminde 1789'da Fransız Devrimi'nin başlangıcına kadar Fransa'nın başlıca kraliyet konutuydu. Saray bugün tarihî bir anıt ve UNESCO Dünya Mirası alanıdır; özellikle tören salonu olan Aynalı Salon ve fıskiyeler, kanallar, geometrik çiçek tarhları ve korulukların bulunduğu geniş Versay Bahçeleri ile ünlüdür."
 USoE638D:0 "Buckingham Sarayı"
 USoE638D_desc:0 "Buckingham Sarayı, Birleşik Krallık hükümdarının Londra'daki konutu ve idari merkezidir. Westminster Şehri'nde bulunan saray, sıklıkla devlet törenlerinin ve kraliyet ağırlamalarının merkezindedir. Ulusal sevinç ve yas dönemlerinde İngiliz halkının odak noktası olmuştur."
 USoE639D:0 "Hofburg"
 USoE639D_desc:0 "Hofburg, Habsburg hanedanı hükümdarlarının eski başlıca imparatorluk sarayıdır ve bugün Avusturya Cumhurbaşkanı'nın resmî konutu ve çalışma yeri olarak hizmet vermektedir. Viyana'nın merkezinde yer alan saray 13. yüzyılda inşa edilmiş ve sonrasında birkaç kez genişletilmiştir."
 USoE640D:0 "Sanssouci"
 USoE640D_desc:0 "Sanssouci, Prusya Kralı Büyük Frederick'in Berlin yakınlarındaki Potsdam'da bulunan yazlık sarayıdır. Genellikle Versay'ın Alman rakipleri arasında sayılır. Sanssouci daha samimi Rokoko üslubunda ve Fransız Barok muadilinden çok daha küçük olsa da parkındaki çok sayıda tapınak ve süs yapısıyla dikkat çeker."
 USoE641D:0 "Yeni Bir Saray"
 USoE641D_desc:0 "Yeni bir imparatorun tarihî bir anıta değil, yeni bir saraya ihtiyacı var. Brüksel'de modern mimariye sahip yeni bir saray inşa edelim."
 USoE642D:0 "Taç Giyme Töreni"
 USoE642D_desc:0 "Avrupa'nın yeni İmparatorun taç giyme törenine hazırlanması gerekiyor. Ancak önce imparatorun hangi tacı takacağına ve taç giyme törenini kimin yapacağına karar vermeli."
 USoE643D:0 "İmparatorluk Tacı"
 USoE643D_desc:0 "Yeni imparatorluk Kutsal Roma İmparatorluğu'nun devamı ve mirasıdır; bu yüzden imparatorun Kutsal Roma İmparatorluğu Tacı'nı takması gerekir."
 USoE644D:0 "Yeni Bir Ekümenik Taç"
 USoE644D_desc:0 "Yeni bir imparatorluk ve yeni bir imparatorun tarihî bir kalıntıya değil, yeni bir taca ihtiyacı var."
 USoE645D:0 "Papa Tarafından"
 USoE645D_desc:0 "Tanrı'nın lütfuyla yeni imparatorun Papa tarafından taç giydirilmesi gerekir."
 USoE646D:0 "Halk Tarafından"
 USoE646D_desc:0 "Yeni İmparatorun halk tarafından taç giydirilmesi gerekir; Majestelerinin yönetimini meşrulaştırmak için bir seçim yapalım."
 USoE647D:0 "Kutsal Avrupa İmparatorluğu"
 USoE647D_desc:0 "İmparator taç giydi ve Kutsal Avrupa İmparatorluğu kuruldu."
 USoE700D:0 "Pax Occidentalis"
 USoE700D_desc:0 "Avrupa küresel hâkimiyet kazandı ve dünya barışını dayatabiliyor. Bu döneme Pax Occidentalis denecek."
 USoE701D:0 "Dünya Barışının Muhafızları"
 USoE701D_desc:0 "Avrupa, Amerika, Rusya ve Çin nüfuz alanlarını belirledi. Her süper güç kendi alanında barışı sağlıyor ve böylece dünya barışının muhafızları oluyorlar."
 EU001C:0 "AB Politikaları"
 EU001C_desc:0 "§Y[EUU.GetFlag] AB'nin§! politikaları Birliğin değerleri, hedefleri ve ilkeleriyle belirlenir. AB bir ekonomik topluluk olarak başladığı için ekonomi politikası AB'de hâlâ önemli bir alandır. AB, değerlerine uygun olarak vatandaşlarının refahını, güvenliğini ve çıkarlarını gözetmeye çalışır. AB ekonominin istikrarlı ve rekabetçi kalmasını ister ve kendini sürekli reforme etmeye çalışır..."
 EU002C:0 "AB Adaylığı"
 EU002C_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'ne§! üyelik başvurusu yapmadan önce AB aday ülke statüsü almamız gerekiyor. §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleriyle zorlu müzakereler olacak ve çok fazla etkiye ihtiyacımız olacak."
 EU100C:0 "AB Reformları"
 EU100C_desc:0 "Üye devletler, Avrupa bütünleşmesini güçlendirmek için §Y[EUU.GetFlag] Avrupa Birliği'ni§! reforme etmeye çalışıyor."
 EU101C:0 "Avrupa Birliği Temel Haklar Şartı"
 EU101C_desc:0 "\"Avrupa halkları, aralarında giderek daha sıkı bir birlik oluştururken ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik, insan onuru, özgürlük, eşitlik ve dayanışmanın bölünmez ve evrensel değerleri üzerine kuruludur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.\" - Temel Haklar Şartı'nın Başlangıcı"
 EU102C:0 "Avrupa Konvansiyonu"
 EU102C_desc:0 "Laeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaş için daha sade, temel hedeflerine ulaşmada daha güçlü ve dünyada daha belirgin bir Birlik yolunda kararlı bir adım atmak üzere Birliğin geleceğine ilişkin bir Konvansiyon toplamaya karar verdi."
 EU103C:0 "Avrupa Anayasası"
 EU103C_desc:0 "Avrupa Konvansiyonu, Avrupa İçin Bir Anayasa Oluşturan Antlaşma Taslağı ile sonuçlandı. Bu uluslararası antlaşma, §Y[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturmak üzere mevcut Avrupa antlaşmalarının yerini alacak ve nitelikli çoğunluk oylamasını daha önce üye devletler arasında oybirliğiyle karar verilen politika alanlarına genişletecekti."
 EU104C:0 "Lizbon Antlaşması"
 EU104C_desc:0 "Lizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onay sürecinin olumsuz sonuçlanmasının bir sonucudur. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirmiştir; ikincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilmiştir."
 EU105C:0 "Avrupa Dış Eylem Servisi"
 EU105C_desc:0 "Avrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dışişleri ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU200C:0 "AB Maliye Politikaları"
 EU200C_desc:0 "Maliye politikaları ekonomik büyüme, makroekonomik istikrar ve enflasyon üzerinde önemli bir etkiye sahiptir. Bu bakımdan kilit unsurlar kamu harcama ve gelirlerinin düzeyi ve bileşimi, bütçe açıkları ve kamu borcudur. Maliye politikalarının sorumluluğunu elinde tutan egemen devletlerden oluşan avro bölgesi gibi bir para birliğinde mali disiplin ihtiyacı daha da güçlüdür."
 EU201C:0 "ECB Müdahalesi"
 EU201C_desc:0 "ECB Yönetim Konseyi, para politikası kararlarını uygulamak için Avrosistem para politikası araçları ve prosedürlerine ilişkin Genel Belgeler'de belirtilen bir dizi para politikası aracı ve prosedürü benimsemiştir."
 EU202C:0 "Avrupa Bankacılık Birliği"
 EU202C_desc:0 "Son finansal krize yanıt olarak tek pazar için daha güvenli bir finans sektörü oluşturmak amacıyla Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üye devletlerindeki tüm finansal aktörler için tek bir kural kitabı oluşturur. Bankalar için daha sıkı ihtiyati gereklilikler, mevduat sahipleri için daha iyi koruma ve batık bankaların yönetimine ilişkin kurallar içerir."
 EU203C:0 "Avro Tahvilleri"
 EU203C_desc:0 "Avro tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, para birliğinin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasıyla boy ölçüşebilecek bir avro tahvili piyasası kurarak hükümetlerin borçlarını finanse etmesi için yeni araçlar yaratır."
 EU204C:0 "Avrupa Finansal İstikrar Fonu (EFSF)"
 EU204C_desc:0 "EFSF, Avrupa borç krizinde avro bölgesi üye devletleri tarafından geçici bir kriz çözüm mekanizması olarak kuruldu ve birçok üye devlete mali yardım sağladı. Bu yardım, EFSF tarafından sermaye piyasalarında ihraç edilen EFSF tahvilleri ve diğer borçlanma araçlarıyla finanse edildi. EFSF artık başka mali yardım sağlamamaktadır; bu görev artık yalnızca ESM tarafından yürütülmektedir."
 EU205C:0 "Avrupa İstikrar Mekanizması (ESM)"
 EU205C_desc:0 "ESM'nin görevi, ciddi finansman sorunları yaşayan veya bu tehditle karşı karşıya kalan avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM üyelerinin finansal istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU206C:0 "Mali Birlik"
 EU206C_desc:0 "Mali birlik, üye devletlerin ortak bir bütçeyi paylaşmasını içerir. Bu, harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirlenmesi anlamına gelir. Mali birlik, Avrupa bütünleşmesinin bir sonraki adımı olarak önerilmektedir ve tüm üye devletler için harcama ve vergi oranlarını merkezi bir Avrupa otoritesinin belirlemesi anlamına gelir."
 EU207C:0 "Avrupa Ekonomik Hükümeti"
 EU207C_desc:0 "Bir Avrupa Ekonomik Hükümeti, AB'de ortak bir maliye ve aktif ekonomi politikasını mümkün kılar. §Y[EUU.GetFlag] Avrupa Birliği'ne§! kendi vergi otoritesini kazandırır ve üye devletler için asgari ücretleri merkezi bir otorite belirler."
 EU208C:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU208C_desc:0 "Bir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükümeti ile oluşturulan politika ve yetkileri tek bir makamda birleştirir."
 EU300C:0 "AB Savunma Politikaları"
 EU300C_desc:0 "Ortak Güvenlik ve Savunma Politikası (OGSP), Birliğin barışı koruma operasyonlarında, çatışmaların önlenmesinde ve uluslararası güvenliğin güçlendirilmesinde öncü bir rol üstlenmesini sağlar. Sivil ve askeri imkânlardan yararlanan OGSP, AB'nin kriz yönetimine yönelik kapsamlı yaklaşımının ayrılmaz bir parçasıdır."
 EU301C:0 "Avrupa Savunma Ajansı (EDA)"
 EU301C_desc:0 "Avrupa Savunma Ajansı, üye devletleri ve §Y[EUU.GetFlag] Avrupa Birliği'ni§! kriz yönetimi alanında Avrupa savunma kabiliyetlerini geliştirme ve Avrupa Güvenlik ve Savunma Politikası'nı bugünkü hâliyle ve gelecekteki gelişimiyle sürdürme çabalarında desteklemek amacıyla kuruldu."
 EU302C:0 "Daimi Yapılandırılmış İşbirliği (PESCO)"
 EU302C_desc:0 "PESCO, istekli ve muktedir üye devletlerin ortak kabiliyet projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına imkân tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu kabiliyetleri ulusal ve çok uluslu görev ve operasyonlar için üye devletlerin kullanımına sunmaktır."
 EU303C:0 "Avrupa Savunma Fonu"
 EU303C_desc:0 "Avrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine ve vatandaşlarının korunup savunulmasına kilit bir katkı sağlayacak. Yeniliği teşvik etmek ve son teknoloji savunma teknolojileri ve ürünleri geliştirmek için şirketler arasında ve AB ülkeleri arasında savunma işbirliğini destekleyecek. Fon, savunmaya yapılan ulusal yatırımları koordine edecek, tamamlayacak ve güçlendirecek."
 EU304C:0 "Avrupa Güvenlik Konseyi"
 EU304C_desc:0 "Bir Avrupa Güvenlik Konseyi, AB'yi uluslararası siyasette karar almaya daha hazırlıklı hâle getirir. AB tutarlı kararları daha hızlı alıp uygulamayı başaramazsa, AB kurallarını uygulama ve çok taraflı yapıları güçlendirme kabiliyeti zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükümetlerarası işbirliği formatıyla desteklenmelidir."
 EU305C:0 "Avrupa Ordusu"
 EU305C_desc:0 "Üye devletler, §Y[EUU.GetFlag] Avrupa Birliği'nin§! askeri kabiliyetlerini güçlendirmek için ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvrupa Ordusu§! olarak bilinecektir."
 EU306C:0 "Avrupa Donanması"
 EU306C_desc:0 "21. yüzyılda çok uluslu filolar ve görev kuvvetleri giderek yaygınlaşıp önem kazanırken §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri güçlerini birleştirip savaş gemilerini §YAvrupa Donanması§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU307C:0 "BM Güvenlik Konseyi'nde AB Daimi Üyeliği"
 EU307C_desc:0 "Üye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olmasına karar verdi. Bu, BMGK'nın reforme edilmesiyle ya da hâlihazırda BMGK üyesi olan üye devlet(ler)in koltuğunun AB'ye devredilmesiyle gerçekleştirilir."
 EU308C:0 "AB Nükleer Gücü"
 EU308C_desc:0 "Nükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki etkisini artıracaktır. Birlik, nükleer silahları üye devletlerinin nükleer silahlarını devralıp paylaşarak ya da kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU400C:0 "AB İkincil Mevzuatı"
 EU400C_desc:0 "AB antlaşmaları, AB üye devletleri arasında AB'nin hedeflerini, AB kurumlarına ilişkin kuralları, kararların nasıl alınacağını ve AB ile üyeleri arasındaki ilişkiyi belirleyen bağlayıcı anlaşmalardır. Antlaşmalar birincil hukuk olarak bilinir. Antlaşmaların ilke ve hedeflerinden doğan hukuk bütünü ise ikincil hukuk (tüzükler, yönergeler, kararlar, tavsiyeler ve görüşler) olarak bilinir."
 EU401C:0 "Genel Veri Koruma Tüzüğü"
 EU401C_desc:0 "AB Genel Veri Koruma Tüzüğü (GDPR), Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek amacıyla tasarlanmıştır."
 EU402C:0 "Dijital Tek Pazarda Telif Hakkı Yönergesi"
 EU402C_desc:0 "Dijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU403C:0 "Dublin II Tüzüğü"
 EU403C_desc:0 "Dublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini belirler. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve aynı kişinin birden fazla sığınma başvurusu yaparak sistemi kötüye kullanmasının önüne geçmektir."
 EU404C:0 "Sığınmacıların Yeniden Yerleştirilmesi ve İskânı"
 EU404C_desc:0 "Başvurularının olumlu sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan başvurularının işleme alınacağı diğer üye devletlere yeniden yerleştirilir. Başvurular olumlu sonuçlanırsa başvuru sahiplerine, yerleştirildikleri üye devlette ikamet hakkıyla birlikte mülteci statüsü verilir."
 EU405C:0 "AB-Türkiye Mutabakatı"
 EU405C_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye üzerinden Avrupa'ya yönelik düzensiz göç akışını durdurmayı amaçlayan bir anlaşma için müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye iade edilecek. §Y[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler İçin Mali Yardım Programı'na 3 milyar avro ödeyecek."
 EU406C:0 "Avrupa Sığınma Ajansı"
 EU406C_desc:0 "AB Komisyonu, sığınma süreci boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali imkânlarla donatılmış bir AB Sığınma Ajansı kurulmasını önerdi."
 EU407C:0 "Frontex"
 EU407C_desc:0 "Frontex, AB ülkelerine ve Schengen'e bağlı ülkelere dış sınırlarını yönetmede yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır yetkilileri arasındaki işbirliğini kolaylaştırır, teknik destek ve uzmanlık sağlar."
 EU408C:0 "Avrupa Sınır ve Sahil Güvenlik Ajansı"
 EU408C_desc:0 "Frontex, Avrupa Sınır ve Sahil Güvenlik Ajansı'na dönüşüyor. Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa sahne oldu. Dış sınırı olan ülkeler sınır kontrolünden tek başına sorumludur; ancak Frontex ciddi göç baskısıyla karşı karşıya kalan AB ülkelerine ek teknik destek sağlayabilir."
 EU500C:0 "Avrupa Komisyonu Politikaları"
 EU500C_desc:0 "Avrupa Komisyonu Politikaları"
 EU600C:0 "AB Genişlemesi"
 EU600C_desc:0 "Genişleme politikası, AB'ye katılmak isteyen ülkeler ve potansiyel adaylar için geçerlidir. Üyelik perspektifi, AB üyesi olmak isteyen ülkelerde demokratik ve ekonomik reformlar için güçlü bir teşviktir."
 EU601C:0 "Avrupa Birliği'nin 2004 Genişlemesi"
 EU601C_desc:0 "1 Mayıs 2004'te toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), bir eski Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) kapsıyor."
 EU602C:0 "Avrupa Birliği'nin 2007 Genişlemesi"
 EU602C_desc:0 "Doğu Avrupa'dan iki ülke daha, §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§!, AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU603C:0 "Avrupa Birliği'nin 2013 Genişlemesi"
 EU603C_desc:0 "2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katılarak üye devlet sayısını 28'e çıkardı."
 EU700C:0 "Ayrılma Politikaları"
 EU700C_desc:0 "Birlik genelinde yükselen Avrupa şüpheciliğiyle birlikte bazı üye devletler §Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmayı düşünecek."
 EU701C:0 "50. Madde"
 EU701C_desc:0 "\"Her Üye Devlet, kendi anayasal kurallarına uygun olarak Birlikten ayrılmaya karar verebilir.\"\n- Avrupa Birliği Antlaşması, Madde 50(1).\n50. Madde ilk olarak Avrupa Birliği Anayasal Antlaşması için kaleme alındı. Anayasanın onaylanamamasının ardından madde Lizbon Antlaşması'na dahil edildi."
 EU702C:0 "Ayrılma Antlaşması"
 EU702C_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmak, ayrılan ülkenin AB hukukunun geçerliliğini yitireceği döneme göre ulusal hukukunu uyarlamak zorunda olduğu karmaşık bir süreçtir. Ayrılan ülke ile §Y[EUU.GetFlag] Avrupa Birliği§! gelecekteki ilişkileri konusunda bir anlaşmaya varmak zorundadır."
 EU703C:0 "Anlaşmasız Çıkış"
 EU703C_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ile bir Ayrılma Antlaşması'na varılamazsa, halkımızı Anlaşmasız Çıkış'ın kaosundan korumak için acil önlemler alınmalıdır."
 EU110C:0 "Avrupa Birliği'nin Federalleşmesi"
 EU110C_desc:0 "Avrupa bütünleşme süreci, daha fazla bütünleşmenin §Y[EUU.GetFlag] Avrupa Birliği'nin§! Federalleşmesine yol açacağı bir noktaya ulaştı."
 EU111C:0 "Avrupa Birleşik Devletleri"
 EU111C_desc:0 "70 yılı aşkın Avrupa bütünleşmesinin ardından §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri egemenliklerinden vazgeçerek §Y[EUU.GetFlag] Avrupa Birleşik Devletleri'ni§! kurmaya karar verdi."
 EU112C:0 "Avrupa Federasyonu"
 EU112C_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri, nitelikli çoğunluk oylamasını temel ilke olarak benimseyen ve §YAvrupa Federasyonu Başkanı§! tarafından yönetilen §Y[EUU.GetFlag] Avrupa Federasyonu'na§! Birliği dönüştürmeye karar verdi."
 EU113C:0 "Anavatanlar Avrupası"
 EU113C_desc:0 "Daha fazla Avrupa bütünleşmesi, üye devletlerin kültürel mirasını, ulusal kimliklerini ve egemenliğini tehlikeye atacaktır. Avrupa, anavatanların Avrupası'dır; bu yüzden Avrupa bütünleşmesi bu aşamada durmalıdır."
 EU604C:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU604C_desc:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU605C:0 "Batı Balkanlar Genişlemesi"
 EU605C_desc:0 "Batı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU606C:0 "Türkiye"
 EU606C_desc:0 "§Y[TUR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU607C:0 "Karadeniz Genişlemesi"
 EU607C_desc:0 "Karadeniz ülkeleri §Y[MLV.GetNameWithFlag]§! ve §Y[UKR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU608C:0 "Kafkasya Genişlemesi"
 EU608C_desc:0 "Kafkas ülkeleri §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! ve §Y[GEO.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU609C:0 "Avrupa Ekonomik Alanı"
 EU609C_desc:0 "Avrupa Ekonomik Alanı'nın AB üyesi olmayan ülkeleri (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! ve §Y[ICE.GetNameWithFlag]§!) §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU610C:0 "Belarus"
 EU610C_desc:0 "§Y[BLR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU611C:0 "İç Genişleme"
 EU611C_desc:0 "İç genişleme, mevcut bir üye devletin dağılması veya ondan ayrılma yoluyla yeni üye devletlerin ortaya çıkması sürecidir. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! ve §Y[WAS.GetNameWithFlag]§! bağımsızlıklarını kazandıklarında §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday olabilir."
 POTEF001C:0 "Avrupa Federasyonu Başkanı"
 POTEF001C_desc:0 "§YAvrupa Federasyonu Başkanı (POTEF)§! Avrupa'nın en üst lideridir. Bu nedenle Avrupa Federasyonu Başkanı, tüm Federasyon için belirleyici stratejik kararları alma yetkisine sahiptir."
 POTEF100C:0 "Alp Doktrini"
 POTEF100C_desc:0 "Alp ülkeleri §Y[AUS.GetNameWithFlag]§! ve §Y[SWI.GetNameWithFlag]§! uzun bir dağ savaşı geleneğine sahiptir. Alp Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF101C:0 "Yaratılışın Bütünlüğü"
 POTEF101C_desc:0 "Avrupa Federasyonu, Yaratılışın Bütünlüğünü korumak ve sürdürmek için politikalarını uyarlıyor."
 POTEF102C:0 "Çevreci Emperyalizm"
 POTEF102C_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF103C:0 "Kuzey Amerika"
 POTEF103C_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF104C:0 "Güney Amerika"
 POTEF104C_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF105C:0 "Avrupa"
 POTEF105C_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF106C:0 "Afrika"
 POTEF106C_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF107C:0 "Orta Doğu"
 POTEF107C_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF108C:0 "Asya"
 POTEF108C_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF109C:0 "Okyanusya"
 POTEF109C_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF110C:0 "Pasifik"
 POTEF110C_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF150C:0 "Alman Doktrini"
 POTEF150C_desc:0 "§Y[GER.GetNameWithFlag]§! geleneksel olarak güçlü zırhlı kuvvetlere odaklanmıştır. Zırhlı Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF151C:0 "Ticaret İmparatorluğu"
 POTEF151C_desc:0 "Avrupa Federasyonu bir Ticaret İmparatorluğu olacak."
 POTEF200C:0 "Fransız Doktrini"
 POTEF200C_desc:0 "§Y[FRA.GetNameWithFlag]§! geleneksel olarak yüksek hareket kabiliyetine sahip hafif zırhlı ve motorlu kuvvetlere odaklanmıştır. Manevra Savaşı Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF201C:0 "İmparatorluk Gücü"
 POTEF201C_desc:0 "Avrupa Federasyonu, imparatorluk öncüllerinin geleneğini sürdürüyor."
 POTEF202C:0 "Özgürlük İmparatorluğu"
 POTEF202C_desc:0 "Avrupa Federasyonu bir Özgürlük İmparatorluğu olacak."
 POTEF203C:0 "Amerika: Müttefik mi, Hasım mı?"
 POTEF203C_desc:0 "Amerika ve Avrupa, 20. yüzyılın büyük bölümünde müttefikti. §Y[USA.GetNameWithFlag]§! ülkesindeki son siyasi değişikliklerle bu durum sorgulanır oldu…"
 POTEF204C:0 "NATO Mirası"
 POTEF204C_desc:0 "NATO'nun barışı koruma mirası geleneğinde §Y[USA.GetNameWithFlag]§! ve §YEDU§! yeni bir ittifak kuruyor."
 POTEF205C:0 "Trump'ın Mirası"
 POTEF205C_desc:0 "§Y[USA.GetNameWithFlag]§! müttefiklikten hasımlığa geçti. Avrupa bu belirleyici stratejik değişime karşılık vermek zorunda."
 POTEF206C:0 "Duvarı Yık"
 POTEF206C_desc:0 "Avrupa egemenliğine yönelik Amerikan tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[MEX.GetNameWithFlag]§! ile ittifak kurup §Y[USA.GetNameWithFlag]§! ülkesini güneyden işgal etmeye yönelik bir plan hazırladı."
 POTEF207C:0 "Buster'ın Dirilişi"
 POTEF207C_desc:0 "ABD'nin Avrupa'ya yönelik tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[CAN.GetNameWithFlag]§! ile ittifak kurup 1 No'lu Savunma Planı'nı revize etmeyi önerdi. Bu plan, Kanadalı Yarbay James 'Buster' Sutherland Brown tarafından ABD ile Britanya İmparatorluğu arasında yakın bir çatışma durumunda Kanada'nın ABD'ye önleyici bir saldırı düzenlemesi için hazırlanmıştı. Bu planla §YEDU§!, §Y[USA.GetFlag] ABD'yi§! kuzeyden işgal edebilir."
 POTEF250C:0 "Benelüks Doktrini"
 POTEF250C_desc:0 "Soğuk Savaş'ın ardından §YAlçak Ülkeler§! yeni duruma uyum sağlamak için havadan hareketli kuvvetlere odaklandı. Havadan Hareket Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF251C:0 "Liberal Miras"
 POTEF251C_desc:0 "Avrupa Federasyonu Liberal Mirasını onurlandırıyor."
 POTEF252C:0 "Eski Ticaret Yollarını Güvenceye Al"
 POTEF252C_desc:0 "Avrupa Federasyonu'nun Karayipler'e, Afrika'ya ve eski Hollanda Doğu Hint Adaları'na uzanan eski ticaret yollarını güvenceye alması gerekiyor."
 POTEF253C:0 "Endonezya"
 POTEF253C_desc:0 "Avrupa Federasyonu'nun eski Hollanda sömürgesi §Y[IND.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF300C:0 "İber Doktrini"
 POTEF300C_desc:0 "§YIberya ülkeleri§! geleneksel olarak güçlü deniz piyadesi kuvvetlerine odaklanmıştır. Deniz Piyadesi Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF301C:0 "Latin Kuzenler"
 POTEF301C_desc:0 "Avrupa Federasyonu'nun Güney Amerika'daki eski sömürgelerle ilişkilerini geliştirmesi gerekiyor."
 POTEF302C:0 "Meksika"
 POTEF302C_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[MEX.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Orta Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF303C:0 "Büyük Kolombiya"
 POTEF303C_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[COL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF304C:0 "Orta Amerika"
 POTEF304C_desc:0 "Avrupa Federasyonu'nun §YOrta Amerika'daki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF305C:0 "Güney Koni"
 POTEF305C_desc:0 "Avrupa Federasyonu'nun §YGüney Amerika'nın Güney Konisi'ndeki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF306C:0 "Brezilya"
 POTEF306C_desc:0 "Avrupa Federasyonu'nun eski Portekiz sömürgesi §Y[BRA.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF350C:0 "İngiliz Doktrini"
 POTEF350C_desc:0 "§YBritanya§! geleneksel olarak güçlü bir donanmaya odaklanmıştır. Deniz Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF351C:0 "Kuzey Atlantik'i Güvenceye Al"
 POTEF351C_desc:0 "Denizlerin özgürlüğünü ve serbest ticareti güvence altına almak için Avrupa Federasyonu'nun Kuzey Atlantik'i kontrol etmesi gerekiyor."
 POTEF352C:0 "Milletler Topluluğu Mirası"
 POTEF352C_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması ve eski İngiliz dominyonlarıyla ilişkilerini geliştirmesi gerekiyor."
 POTEF353C:0 "Kanada"
 POTEF353C_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[CAN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF354C:0 "Avustralya"
 POTEF354C_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[AST.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF355C:0 "Yeni Zelanda"
 POTEF355C_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[NZL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF356C:0 "Kuzey Denizi'ni Güvenceye Al"
 POTEF356C_desc:0 "Kuzey Denizi, Avrupa Federasyonu'nun arka bahçesidir ve güvence altına alınması gerekir."
 POTEF357C:0 "Malaya Mirası"
 POTEF357C_desc:0 "Avrupa Federasyonu'nun Malaya'daki eski İngiliz sömürgeleriyle ilişkilerini geliştirmesi gerekiyor."
 POTEF358C:0 "Malezya"
 POTEF358C_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[MAY.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF359C:0 "Singapur"
 POTEF359C_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[SIN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF360C:0 "Hong Kong'a Garanti Ver"
 POTEF360C_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[HKG.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Çin-İngiltere Ortak Bildirisi'ndeki özgürlükleri güvence altına alması gerekiyor."
 POTEF400C:0 "İskandinav Doktrini"
 POTEF400C_desc:0 "§YSkandinav ülkeleri§! geleneksel olarak Arktik'te savaşmaya odaklanmıştır. İskandinav Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF401C:0 "Arktik'i Güvenceye Al"
 POTEF401C_desc:0 "Denizlerin özgürlüğünü ve jeostratejik konumunu güvence altına almak için Avrupa Federasyonu'nun Arktik'i kontrol etmesi gerekiyor."
 POTEF450C:0 "Akdeniz Doktrini"
 POTEF450C_desc:0 "§YAkdeniz ülkeleri§! geleneksel olarak denizden çıkarma taktiklerine odaklanmıştır. Amfibi Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF451C:0 "Kuzey Afrika"
 POTEF451C_desc:0 "Bir yakınsama bölgesi ve mülteciler için güvenli bir liman oluşturmak amacıyla Avrupa Federasyonu'nun §YKuzey Afrika§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF452C:0 "Kıbrıs'ı Birleştir"
 POTEF452C_desc:0 "Avrupa Federasyonu'nun egemen bir üye devleti olarak §Y[CYP.GetNameWithFlag]§! yeniden birleştirilmelidir."
 POTEF500C:0 "Balkan Doktrini"
 POTEF500C_desc:0 "§YBalkan ülkeleri§! geleneksel olarak partizan kuvvetlere odaklanmıştır. Partizan Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF501C:0 "Balkan Altyapısı"
 POTEF501C_desc:0 "Avrupa Federasyonu'nun bölgesel barışı korumak ve Balkanları yabancı etkiden korumak için Balkanların altyapısını geliştirmesi gerekiyor."
 POTEF502C:0 "İpek Yolu'na Meydan Oku"
 POTEF502C_desc:0 "Avrupa Federasyonu'nun Çin'in yeni İpek Yolu'na meydan okuması ve Orta Asya'daki Çin etkisini azaltması gerekiyor."
 POTEF503C:0 "Rakip Çin"
 POTEF503C_desc:0 "§Y[CHI.GetNameWithFlag]§! küresel düzeyde Avrupa Federasyonu'nun başlıca rakiplerinden biri hâline geldi. Avrupa Federasyonu'nun politikalarını buna göre uyarlaması gerekiyor."
 POTEF504C:0 "Ok Harekâtı"
 POTEF504C_desc:0 "Adını Ok Savaşı'ndan (İkinci İngiliz-Çin Savaşı) alan Ok Harekâtı, Çin'in yayılmacı politikasını durdurmak için §Y[CHI.GetNameWithFlag]§! ülkesine Avrupa müdahalesini öngören bir plandır."
 POTEF505C:0 "Asyalı Müttefikler"
 POTEF505C_desc:0 "§Y[CHI.GetNameWithFlag]§! ile yüzleşmek için Avrupa Federasyonu'nun Asya'da müttefiklere ihtiyacı var."
 POTEF506C:0 "Kore Cumhuriyeti"
 POTEF506C_desc:0 "§Y[KOR.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF507C:0 "Japonya"
 POTEF507C_desc:0 "§Y[JAP.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF550C:0 "Karadeniz Doktrini"
 POTEF550C_desc:0 "Soğuk Savaş'ın ardından §YKaradeniz ülkeleri§! yeni duruma uyum sağlamak için hareketli hava savunma kuvvetlerine odaklandı. Hava Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF551C:0 "Karadeniz'i Güvenceye Al"
 POTEF551C_desc:0 "Karadeniz, Avrupa Federasyonu'nu Kafkasya'ya ve güneydoğudaki üye devletlerine bağlar. Bu nedenle güvence altına alınması gerekir."
 POTEF552C:0 "Ayrılıkçı Cumhuriyetleri Yeniden Entegre Et"
 POTEF552C_desc:0 "§Y[SOV.GetNameWithFlag]§!, ayrılıkçı hareketleri destekleyip ayrılıkçı cumhuriyetler kurarak Avrupa Federasyonu'nun çeşitli doğu üye devletlerinin egemenliğini ihlal etti. Bu Rus kuklalarını yeniden entegre etmemiz gerekiyor."
 POTEF553C:0 "Rakip Rusya"
 POTEF553C_desc:0 "§Y[SOV.GetNameWithFlag]§! Avrupa Federasyonu'nun başlıca rakiplerinden biri oldu. Ona yaptırımlar uygulamamız gerekiyor."
 POTEF554C:0 "Şarlman Harekâtı"
 POTEF554C_desc:0 "Adını 'Avrupa'nın Babası' (Pater Europae) olarak anılan efsanevi imparator Şarlman'dan alan Şarlman Harekâtı, §Y[SOV.GetNameWithFlag]§! ülkesine karşı önleyici meşru müdafaa planıdır. Bu harekâtla §YEDU§!, Avrupa egemenliğine yönelik bu tehdidi ortadan kaldırmak için §Y[SOV.GetNameWithFlag]§! ülkesine önleyici bir işgal başlatabilir."
 POTEF600C:0 "Kafkasya Doktrini"
 POTEF600C_desc:0 "Soğuk Savaş'ın ardından §YKafkasya bölgesi ülkeleri§! yeni duruma uyum sağlamak için güçlü bir savunmaya odaklandı. Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF601C:0 "Avrupa Erişimi"
 POTEF601C_desc:0 "Avrupa Federasyonu'nun Kafkasya'ya ve güneydoğudaki üye devletlerine erişime ihtiyacı var. Bu nedenle yeni deniz üsleri ve altyapı inşa edilmesi gerekiyor."
 POTEF650C:0 "Vişegrad Doktrini"
 POTEF650C_desc:0 "§YVişegrad ülkeleri§! geleneksel olarak güçlü topçu kuvvetlerine odaklanmıştır. Topçu Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF651C:0 "Avrupa Hava Savunma Ağı"
 POTEF651C_desc:0 "Avrupa Federasyonu'nun doğu kanadını güvence altına almak için bir hava savunma ağı kurması gerekiyor."
 POTEF652C:0 "Doğu Güvenlik Duvarı"
 POTEF652C_desc:0 "§Y[SOV.GetNameWithFlag]§! ülkesinin doğudaki üye devletlerde artan etkisine karşı koyulması gerekiyor."
 POTEF700C:0 "Baltık Doktrini"
 POTEF700C_desc:0 "§YBaltık ülkeleri§! geleneksel olarak küçük ve son derece yetenekli özel kuvvetlere odaklanmıştır. Özel Kuvvetler Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF701C:0 "Baltık Denizi'ni Güvenceye Al"
 POTEF701C_desc:0 "Baltık Denizi, Avrupa Federasyonu'nun iç denizidir ve güvence altına alınması gerekir."
 POTEF800C:0 "Pax Europaea"
 POTEF800C_desc:0 "Avrupa Federasyonu'nun dünya barışını sağlamak için küresel süper güç olması gerekiyor."
 USoE001C:0 "Yeni Avrupa Milletini Kur"
 USoE001C_desc:0 "Birleşik Avrupa Birliği'nin kendini yeni bir millet olarak kurması gerekiyor. Anayasa ve Birleşme Antlaşmaları bir şey; ama şimdi halkın bu yasal çerçeveyi hayatla doldurması gerekiyor."
 USoE002C:0 "Avrupa Subay Kolordusu"
 USoE002C_desc:0 "Birlik döneminde her üye devletin kendi ordusu vardı, daha sonra da Avrupa Ordusu kuruldu. Ortak doktrin ve eğitime sahip bir Avrupa Subay Kolordusu oluşturmamız gerekiyor."
 USoE003C:0 "Avrupa Siyasi Partileri"
 USoE003C_desc:0 "Yeni bir millet yeni siyasi partilere ihtiyaç duyar. Üye devletlerin eski siyasi partileri birleşmek zorunda."
 USoE004C:0 "Avrupa Vatanseverliği"
 USoE004C_desc:0 "Yeni bir millet kendi vatanseverliğine ve ulusal sembollerine ihtiyaç duyar."
 USoE005C:0 "Yeni Büyük Oyun"
 USoE005C_desc:0 "Yeni Büyük Oyun daha yeni başladı ve Avrupa geç kaldı; ABD, Çin ve Rusya ise ilk hamlelerini çoktan yaptı."
 USoE006C:0 "Avrupa'nın Kalbi ve Ruhu"
 USoE006C_desc:0 "Yeni milletin değerlerini ve standartlarını tanımlaması gerekiyor. Avrupa'nın bir Kalbe ve Ruha ihtiyacı var!"
 USoE100C:0 "Nüfuz Alanları Oyunu"
 USoE100C_desc:0 "Nüfuz alanları oyununu oynadığında ya kazanırsın ya ölürsün. Orta yolu yoktur."
 USoE101C:0 "Kartalla Hesaplaş"
 USoE101C_desc:0 "Amerikan Kartalı yere indirilmeli! Avrupa semalarında fazlasıyla uzun süre uçtu."
 USoE102C:0 "Ayıyla Kapış"
 USoE102C_desc:0 "Ayı bize saldırmadan önce biz ona saldırmalıyız."
 USoE103C:0 "Ejderhayla Dans"
 USoE103C_desc:0 "Ejderhayla Dans tehlikeli bir oyundur."
 USoE104C:0 "Demirden Bir Kalp"
 USoE104C_desc:0 "Eski zamanlarda demirciler, yenilen kötülerin silahlarından demir bir taht döverlerdi. Günümüzde ise sadece Avrupa'nın demirden kalbini kanıtladığını ve artık dünyanın tartışmasız hâkimi olduğunu ilan ediyoruz!"
 USoE200C:0 "Barış İçinde Bir Arada Yaşam"
 USoE200C_desc:0 "Demirden daha keskin kılıçlar vardır. Parayla ödeyebilecekken neden kanla ödeyesin?"
 USoE201C:0 "Önce Amerika"
 USoE201C_desc:0 "Kendi doktrinlerimize saygı duyulmasını istiyorsak Önce Amerika doktrinine saygı duymalıyız."
 USoE202C:0 "Rus Nüfuz Alanı"
 USoE202C_desc:0 "Rusya tüm Rus halkının koruyucusudur. Bu, saygı duymamız gereken onların nüfuz alanıdır."
 USoE203C:0 "Çin Nüfuz Alanı"
 USoE203C_desc:0 "Çin'in nüfuz alanı Güneydoğu Asya'yı kapsar ve bizi rahatsız etmez. Çin bizim ticaret ortağımızdır, rakibimiz değil."
 USoE204C:0 "Avrupa Nüfuz Alanı"
 USoE204C_desc:0 "21. yüzyılın tüm süper güçlerini yatıştırdık; artık Avrupa, Levant ve Kuzey Afrika'da Avrupa Nüfuz Alanı'nı kurmak için elimiz serbest."
 USoE300C:0 "Medeniyetler Çatışması"
 USoE300C_desc:0 "Medeniyetler Çatışması, Amerikalı siyaset bilimci Samuel P. Huntington'ın Soğuk Savaş sonrası dünyada insanların kültürel ve dinî kimliklerinin başlıca çatışma kaynağı olacağını öne süren tezidir. Gelecekteki savaşlar ülkeler arasında değil, kültürler arasında yaşanacaktır."
 USoE301C:0 "Batı'nın Geri Kalanı"
 USoE301C_desc:0 "Avrupa, Batı'nın geri kalanıdır. Amerika, Önce Amerika doktriniyle bizi yalnız ve tecrit edilmiş bıraktı."
 USoE302C:0 "Haç ve Hilal"
 USoE302C_desc:0 "Avrupa'nın güneydoğu sınırında haç ile hilal çatışıyor. Kim galip gelecek: Batı medeniyeti mi, İslam medeniyeti mi?"
 USoE303C:0 "Papa ve Patrik"
 USoE303C_desc:0 "1054'teki Büyük Ayrılık'tan bu yana Papa ile Ortodoks Patrik farklı yollara gitti. Batı medeniyetini savunmak için yeniden birleşme zamanı geldi."
 USoE304C:0 "İki Haç"
 USoE304C_desc:0 "Doğu ve Batı Hristiyanlığının İslam'a karşı birleşmesi gerekiyor."
 USoE305C:0 "Avrasya İttifakı"
 USoE305C_desc:0 "NATO'nun dağılmasının ardından Avrupa, Rus komşusuyla yeni ve büyük bir ittifak kurabilir."
 USoE306C:0 "Konstantinopolis"
 USoE306C_desc:0 "Konstantinopolis Batı'nın bir parçasıdır. Avrupa'nın onu İslam etkisinden kurtarması gerekiyor."
 USoE307C:0 "Antakya"
 USoE307C_desc:0 "Antakya Prinkepsliği, Birinci Haçlı Seferi sırasında kurulan Haçlı devletlerinden biriydi. Batı'ya aittir ve bir kez daha İslam'dan arındırılmalıdır."
 USoE308C:0 "Trablus"
 USoE308C_desc:0 "Trablus Kontluğu (1109–1289) Haçlı devletlerinin sonuncusuydu. Yeniden yükselmeli. Avrupa'nın Levant'ı İslam'dan kurtarması gerekiyor."
 USoE309C:0 "Kudüs"
 USoE309C_desc:0 "Avrupa'nın Kutsal Şehri İslam etkisinden kurtarması gerekiyor. Kudüs Krallığı kutsal mekânları bir kez daha koruyacak."
 USoE310C:0 "Malta Şövalyeleri"
 USoE310C_desc:0 "Avrupa'nın Kuzey Afrika'yı İslam etkisinden kurtarması gerekiyor. Avrupa, Malta Şövalyeleri'nin örneğini izleyecek."
 USoE311C:0 "Arabistan'ın Batılılaşması"
 USoE311C_desc:0 "Arap Yarımadası'ndaki bazı ülkelerin Batı ile zaten yakın bağları var. Güvenli bir komşuluğa sahip olmak için Avrupa'nın Arap Yarımadası'nı tamamen Batılılaştırması gerekiyor."
 USoE312C:0 "Hindistan'ın Batılılaşması"
 USoE312C_desc:0 "Sömürge mirası sayesinde Hindistan'ın Batı ile geleneksel olarak yakın bağları var. Avrupa, Hindistan'ı tamamen Batılılaştırmak için bu ilişkiyi derinleştirmeli."
 USoE313C:0 "İran Cumhuriyeti"
 USoE313C_desc:0 "İran, Orta Doğu'da Batı'nın başlıca rakiplerinden biridir. Avrupa, İran'ı Batılılaştırıp İran Cumhuriyeti'ne dönüştürerek onun bölgesel hegemonya arayışını durdurabilir."
 USoE320C:0 "Batı ve Diğerleri"
 USoE320C_desc:0 "Avrupa ve Amerika, dünyadaki her düşmana kafa tutabilecek Batılı süper güçlerdir. NATO'yu temel alarak Batı küresel hâkimiyetini dayatabilir."
 USoE321C:0 "Asya'nın Batılılaşması"
 USoE321C_desc:0 "Batı'nın Asya'daki yükselen güçlere odaklanması gerekiyor. Batı onlarla savaşmalı ya da onları Batılılaştırmalı."
 USoE322C:0 "Dört Kaplan"
 USoE322C_desc:0 "Hong Kong, Singapur, Güney Kore ve Tayvan'dan oluşan Dört Asya Kaplanı'nın Batı ile her zaman yakın bağları oldu ve yükselen Çin ejderhasından korkuyorlar. Asya'da Batı'nın güvenilir müttefikleri olabilirler."
 USoE323C:0 "Japonya"
 USoE323C_desc:0 "İkinci Dünya Savaşı'nın sona ermesinin ardından Japonya, Asya'da Batı'nın önemli bir müttefiki oldu. Batı'nın bu yakın ortaklığı sürdürmesi gerekiyor."
 USoE324C:0 "Çin"
 USoE324C_desc:0 "Çin, Asya'da Batı'nın başlıca rakibidir. Batı Çin'i Batılılaştırabilirse Asya'da Batı hegemonyasına rakip kalmayacaktır."
 USoE325C:0 "Düşünülemez Harekâtı 2.0"
 USoE325C_desc:0 "Düşünülemez Harekâtı, Mayıs 1945'te Winston Churchill'in emriyle İngiliz Genelkurmay Başkanları tarafından Sovyetler Birliği'ne karşı hazırlanan bir savaş planıydı. Batılı Müttefikler, eski Alman Wehrmacht'ı ile birlikte Sovyetler Birliği'ne sürpriz bir saldırı başlatacaktı. Batı'nın bu planı mevcut duruma göre revize etmesi ve Avrupa'da Rus hegemonyasını önlemek için Rusya'ya karşı önleyici meşru müdafaa amacıyla harekete geçmesi gerekiyor."
 USoE400C:0 "Özgürlük Meşalesi"
 USoE400C_desc:0 "Avrupa'nın Özgürlük Meşalesi'ni taşıması gerekiyor! Avrupa Birleşik Devletleri, insan haklarına ve hukukun üstünlüğüne saygı duyan demokratik bir cumhuriyettir."
 USoE401C:0 "Dijital Demokrasi"
 USoE401C_desc:0 "Avrupa'nın demokratik kurumlarını dijital çağa göre reforme etmesi gerekiyor. Sosyal medya ve sosyal ağlar sayesinde halk yasamaya ve yönetime doğrudan katılabilir."
 USoE402C:0 "Orak ve Çekiç"
 USoE402C_desc:0 "Sosyalizmin ve Marksizmin babaları Karl Marx ve Friedrich Engels Avrupalıydı. Avrupa'nın bu mirası sürdürmesi gerekiyor."
 USoE403C:0 "ASSCB"
 USoE403C_desc:0 "Avrupa solu kapitalistleri Avrupa Birliği'nde kapana kıstırdı; artık Karl Marx ve Friedrich Engels'in manevi mirasçıları ASSCB'yi, yani Avrupa Sovyet Sosyalist Cumhuriyetler Birliği'ni kurma gücüne sahip."
 USoE404C:0 "Yapay Zekâ Hükümeti"
 USoE404C_desc:0 "Yapay zekâ, bir ülkeyi verimsiz ve yozlaşma ihtimali olan insan politikacılardan daha verimli yönetecek kadar gelişti. İktidar partisinin yapay zekâ ajanı kontrolü ele alacak ve ülkeyi iktidar partisinin değerlerine göre yönetecek."
 USoE500C:0 "Yeşil Gelecek"
 USoE500C_desc:0 "İnkâr edilemez iklim değişikliği karşısında Avrupa için yeşil bir gelecekten başka gelecek yok."
 USoE501C:0 "Çevre İmparatorluğu"
 USoE501C_desc:0 "Avrupa'nın, ekonomi ile çevrenin çelişmediği bir Çevre İmparatorluğu olması gerekiyor."
 USoE502C:0 "Çevreci Emperyalizm"
 USoE502C_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE503C:0 "Kuzey Amerika"
 USoE503C_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE504C:0 "Güney Amerika"
 USoE504C_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE505C:0 "Avrupa"
 USoE505C_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE506C:0 "Afrika"
 USoE506C_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE507C:0 "Orta Doğu"
 USoE507C_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE508C:0 "Asya"
 USoE508C_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE509C:0 "Okyanusya"
 USoE509C_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE510C:0 "Pasifik"
 USoE510C_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE600C:0 "Haç ve Taç"
 USoE600C_desc:0 "Avrupa'nın mirasını yerine getirmesi ve bir kez daha imparatorluk olması gerekiyor."
 USoE601C:0 "Yeni Şövalyeler"
 USoE601C_desc:0 "Düşmanca bir dünyada ordu, halkını yozlaşmış politikacılardan ve yabancı güçlerden kurtarmak için Avrupa'da kontrolü ele aldı."
 USoE602C:0 "Avrupa Orduları Generali"
 USoE602C_desc:0 "Genelkurmay, Avrupa'nın bir kara kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Orduları Generali rütbesi verilecek."
 USoE603C:0 "Avrupa Hava Mareşali"
 USoE603C_desc:0 "Genelkurmay, Avrupa'nın bir hava kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Hava Mareşali rütbesi verilecek."
 USoE604C:0 "Avrupa Büyükamirali"
 USoE604C_desc:0 "Genelkurmay, Avrupa'nın bir amiral tarafından yönetilmesine karar verdi. Bu amirale Avrupa Büyükamirali rütbesi verilecek."
 USoE605C:0 "Avrupa İmparatorluğu"
 USoE605C_desc:0 "Avrupa bir kez daha imparatorluk oldu ve halkının çıkarlarını küresel düzeyde savunabiliyor."
 USoE620C:0 "Yeni İmparator"
 USoE620C_desc:0 "Avrupa'nın kıtayı 21. yüzyılda yönetecek yeni bir imparatora ihtiyacı var."
 USoE621C:0 "Bir Hanedan Seç"
 USoE621C_desc:0 "Avrupa'nın uzun ve şanlı geçmişe sahip pek çok büyük hanedanı var. İlk kez birleşen kıtanın 21. yüzyılda hangi hanedanın hüküm süreceğine karar vermesi gerekiyor."
 USoE622C:0 "Savoy Hanedanı"
 USoE622C_desc:0 "Savoy Hanedanı, 1003'te tarihî Savoy bölgesinde kurulan bir kraliyet hanedanıdır. Aile, kademeli genişlemeyle İtalya'nın kuzeybatısındaki küçük bir Alp kontluğunu yönetmekten Sicilya Krallığı'nın mutlak hâkimiyetine kadar yükseldi. Hanedan üyeleri Sardinya, İtalya, Arnavutluk, Etiyopya ve kısa bir süre İspanya'yı yönetti. Hanedan ayrıca Kıbrıs, Kudüs ve Ermenistan krallıkları unvanlarında da hak iddia eder."
 USoE623C:0 "Wittelsbach Hanedanı"
 USoE623C_desc:0 "Wittelsbach Hanedanı, kolları Bavyera, Hollanda, Zeeland, Köln, İsveç, Romanya, Bohemya, Macaristan, Danimarka, Norveç, Yunanistan ve Kutsal Roma İmparatorluğu dahil pek çok toprağı yönetmiş Alman-Bavyeralı bir hanedandır. Katolik bir hükümdarın hakkını tanıyan Jakobit veraset çizgisi, Bavyera Veliaht Prensi Franz'ı II. Francis olarak meşru varis kabul eder."
 USoE624C:0 "Borbón-Anjou Hanedanı"
 USoE624C_desc:0 "Borbón-Anjou Hanedanı, İspanya Krallığı'nın hüküm süren kraliyet hanedanıdır. 18. yüzyılda İspanyol Bourbon hanedanının üyeleri İspanya, Napoli, Sicilya ve Parma'da taht sahibiydi."
 USoE625C:0 "Bourbon Hanedanı"
 USoE625C_desc:0 "Bourbon Hanedanı, Fransa'nın kraliyet hanedanı olan Capet hanedanının bir kolu olan Fransız kökenli bir Avrupa hanedanıdır. Bourbon kralları Fransa ve Navarra'yı ilk kez 16. yüzyılda yönetti."
 USoE626C:0 "Hannover Hanedanı"
 USoE626C_desc:0 "Hannover Hanedanı, 17. ve 20. yüzyıllar arasında çeşitli dönemlerde Hannover, Büyük Britanya ve İrlanda'yı yönetmiş bir Alman kraliyet hanedanıdır. Hanedan 1635'te Brunswick-Lüneburg Hanedanı'nın genç bir kolu olarak doğdu ve 1692'de Hannover'in Prens-Seçicilik olmasına kadar prestij kazandı."
 USoE627C:0 "Glücksburg Hanedanı"
 USoE627C_desc:0 "Schleswig-Holstein-Sonderburg-Glücksburg Hanedanı'nın kısaltılmış adıyla Glücksburg Hanedanı, üyeleri çeşitli dönemlerde Danimarka, Norveç, Yunanistan ve birkaç kuzey Alman devletinde hüküm sürmüş, Oldenburg Hanedanı'nın Danimarkalı-Alman bir koludur."
 USoE628C:0 "Windsor Hanedanı"
 USoE628C_desc:0 "Windsor Hanedanı, Birleşik Krallık'ın ve diğer Milletler Topluluğu krallıklarının hüküm süren kraliyet hanedanıdır. 1901'de Saxe-Coburg ve Gotha Hanedanı, İngiliz monarşisinde Hannover Hanedanı'nın yerini aldı. 1917'de Birinci Dünya Savaşı nedeniyle kraliyet hanedanının adı Almanca Saxe-Coburg ve Gotha'dan İngilizce Windsor'a (Windsor Kalesi'nden) değiştirildi."
 USoE629C:0 "Orange-Nassau Hanedanı"
 USoE629C_desc:0 "Orange-Nassau Hanedanı, Hollanda'nın hâlen hüküm süren hanedanıdır. Avrupa Nassau Hanedanı'nın bir kolu olan hanedan, özellikle Sessiz William'ın İspanyol yönetimine karşı Hollanda isyanını örgütlemesinden ve bu isyanın Seksen Yıl Savaşları'nın (1568–1648) ardından bağımsız bir Hollanda devletine yol açmasından bu yana Hollanda ve Avrupa siyasetinde ve yönetiminde merkezi bir rol oynamıştır."
 USoE630C:0 "Habsburg-Lorraine Hanedanı"
 USoE630C_desc:0 "Habsburg-Lorraine Hanedanı, 1736'da Lorraine ve Bar Dükü III. François ile daha sonra sırasıyla Bohemya Kraliçesi, Macaristan Kraliçesi ve Avusturya Arşidüşesi olacak olan Avusturyalı Maria Theresa'nın evliliğinden doğmuştur. Üyeleri, Habsburg Hanedanı'nın ve Lorraine Hanedanı'nın hayatta kalan meşru soyudur; aile mülklerini ve İmparatorluk misyonunu miras almışlardır."
 USoE631C:0 "Bonaparte Hanedanı"
 USoE631C_desc:0 "Bonaparte Hanedanı, İtalyan kökenli eski bir imparatorluk ve kraliyet hanedanıdır. 1804'te I. Napolyon tarafından kuruldu. Napolyon, Grande Armée'yi tüm büyük Avrupa güçlerine karşı yöneltti ve bir dizi askeri zaferle kıta Avrupası'na hâkim oldu. Ailesinin üyelerini bağımlı devletlerin tahtlarına oturtarak hanedanın gücünü genişletti."
 USoE632C:0 "Hohenzollern Hanedanı"
 USoE632C_desc:0 "Hohenzollern Hanedanı, üyeleri çeşitli dönemlerde Hohenzollern, Brandenburg, Prusya, Alman İmparatorluğu ve Romanya'nın prensleri, prens-seçicileri, kralları ve imparatorları olmuş eski bir Alman kraliyet hanedanıdır. Aile, 11. yüzyılda Svabya'daki Hechingen kasabası çevresinde ortaya çıktı ve adını Hohenzollern Kalesi'nden aldı."
 USoE633C:0 "Bir Saray Seç"
 USoE633C_desc:0 "Avrupa'nın yeni İmparatoru'nun hüküm sürmek için temsil gücü yüksek bir saraya ihtiyacı var."
 USoE634C:0 "Quirinale Sarayı"
 USoE634C_desc:0 "Quirinale Sarayı, İtalya'nın Roma şehrinde bulunan tarihî bir yapıdır ve İtalya Cumhurbaşkanı'nın üç resmî konutundan biridir. Napolyon, Quirinale Sarayı'nı İmparator olarak asıl konutu olarak seçmişti. Ancak 1814'teki Fransız yenilgisi ve ardından gelen Avrupa Restorasyonu nedeniyle buraya hiç yerleşemedi."
 USoE635C:0 "Neuschwanstein Şatosu"
 USoE635C_desc:0 "Neuschwanstein Şatosu, Almanya'nın güneybatı Bavyera bölgesinde engebeli bir tepenin üzerinde yer alan 19. yüzyıldan kalma Neo-Romanesk bir saraydır. Saray, Bavyera Kralı II. Ludwig tarafından yaptırıldı. Şato, 1886'daki ölümüne kadar Kral'ın konutu olması amacıyla inşa edildi ve ölümünden kısa süre sonra halka açıldı. O zamandan beri 61 milyondan fazla kişi Neuschwanstein Şatosu'nu ziyaret etti."
 USoE636C:0 "Madrid Kraliyet Sarayı"
 USoE636C_desc:0 "Madrid Kraliyet Sarayı, İspanyol kraliyet ailesinin Madrid'deki resmî konutudur, ancak günümüzde yalnızca devlet törenleri için kullanılmaktadır. Saray 135.000 metrekare kullanım alanına ve 3.418 odaya sahiptir. Avrupa'da hâlâ işlevini sürdüren en büyük kraliyet sarayıdır ve kullanım alanı bakımından da en büyüğüdür."
 USoE637C:0 "Versay Sarayı"
 USoE637C_desc:0 "Versay Sarayı, XIV. Louis döneminde 1682'den XVI. Louis döneminde 1789'da Fransız Devrimi'nin başlangıcına kadar Fransa'nın başlıca kraliyet konutuydu. Saray bugün tarihî bir anıt ve UNESCO Dünya Mirası alanıdır; özellikle tören salonu olan Aynalı Salon ve fıskiyeler, kanallar, geometrik çiçek tarhları ve korulukların bulunduğu geniş Versay Bahçeleri ile ünlüdür."
 USoE638C:0 "Buckingham Sarayı"
 USoE638C_desc:0 "Buckingham Sarayı, Birleşik Krallık hükümdarının Londra'daki konutu ve idari merkezidir. Westminster Şehri'nde bulunan saray, sıklıkla devlet törenlerinin ve kraliyet ağırlamalarının merkezindedir. Ulusal sevinç ve yas dönemlerinde İngiliz halkının odak noktası olmuştur."
 USoE639C:0 "Hofburg"
 USoE639C_desc:0 "Hofburg, Habsburg hanedanı hükümdarlarının eski başlıca imparatorluk sarayıdır ve bugün Avusturya Cumhurbaşkanı'nın resmî konutu ve çalışma yeri olarak hizmet vermektedir. Viyana'nın merkezinde yer alan saray 13. yüzyılda inşa edilmiş ve sonrasında birkaç kez genişletilmiştir."
 USoE640C:0 "Sanssouci"
 USoE640C_desc:0 "Sanssouci, Prusya Kralı Büyük Frederick'in Berlin yakınlarındaki Potsdam'da bulunan yazlık sarayıdır. Genellikle Versay'ın Alman rakipleri arasında sayılır. Sanssouci daha samimi Rokoko üslubunda ve Fransız Barok muadilinden çok daha küçük olsa da parkındaki çok sayıda tapınak ve süs yapısıyla dikkat çeker."
 USoE641C:0 "Yeni Bir Saray"
 USoE641C_desc:0 "Yeni bir imparatorun tarihî bir anıta değil, yeni bir saraya ihtiyacı var. Brüksel'de modern mimariye sahip yeni bir saray inşa edelim."
 USoE642C:0 "Taç Giyme Töreni"
 USoE642C_desc:0 "Avrupa'nın yeni İmparatorun taç giyme törenine hazırlanması gerekiyor. Ancak önce imparatorun hangi tacı takacağına ve taç giyme törenini kimin yapacağına karar vermeli."
 USoE643C:0 "İmparatorluk Tacı"
 USoE643C_desc:0 "Yeni imparatorluk Kutsal Roma İmparatorluğu'nun devamı ve mirasıdır; bu yüzden imparatorun Kutsal Roma İmparatorluğu Tacı'nı takması gerekir."
 USoE644C:0 "Yeni Bir Ekümenik Taç"
 USoE644C_desc:0 "Yeni bir imparatorluk ve yeni bir imparatorun tarihî bir kalıntıya değil, yeni bir taca ihtiyacı var."
 USoE645C:0 "Papa Tarafından"
 USoE645C_desc:0 "Tanrı'nın lütfuyla yeni imparatorun Papa tarafından taç giydirilmesi gerekir."
 USoE646C:0 "Halk Tarafından"
 USoE646C_desc:0 "Yeni İmparatorun halk tarafından taç giydirilmesi gerekir; Majestelerinin yönetimini meşrulaştırmak için bir seçim yapalım."
 USoE647C:0 "Kutsal Avrupa İmparatorluğu"
 USoE647C_desc:0 "İmparator taç giydi ve Kutsal Avrupa İmparatorluğu kuruldu."
 USoE700C:0 "Pax Occidentalis"
 USoE700C_desc:0 "Avrupa küresel hâkimiyet kazandı ve dünya barışını dayatabiliyor. Bu döneme Pax Occidentalis denecek."
 USoE701C:0 "Dünya Barışının Muhafızları"
 USoE701C_desc:0 "Avrupa, Amerika, Rusya ve Çin nüfuz alanlarını belirledi. Her süper güç kendi alanında barışı sağlıyor ve böylece dünya barışının muhafızları oluyorlar."
 EU001B:0 "AB Politikaları"
 EU001B_desc:0 "§Y[EUU.GetFlag] AB'nin§! politikaları Birliğin değerleri, hedefleri ve ilkeleriyle belirlenir. AB bir ekonomik topluluk olarak başladığı için ekonomi politikası AB'de hâlâ önemli bir alandır. AB, değerlerine uygun olarak vatandaşlarının refahını, güvenliğini ve çıkarlarını gözetmeye çalışır. AB ekonominin istikrarlı ve rekabetçi kalmasını ister ve kendini sürekli reforme etmeye çalışır..."
 EU002B:0 "AB Adaylığı"
 EU002B_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'ne§! üyelik başvurusu yapmadan önce AB aday ülke statüsü almamız gerekiyor. §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleriyle zorlu müzakereler olacak ve çok fazla etkiye ihtiyacımız olacak."
 EU100B:0 "AB Reformları"
 EU100B_desc:0 "Üye devletler, Avrupa bütünleşmesini güçlendirmek için §Y[EUU.GetFlag] Avrupa Birliği'ni§! reforme etmeye çalışıyor."
 EU101B:0 "Avrupa Birliği Temel Haklar Şartı"
 EU101B_desc:0 "\"Avrupa halkları, aralarında giderek daha sıkı bir birlik oluştururken ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik, insan onuru, özgürlük, eşitlik ve dayanışmanın bölünmez ve evrensel değerleri üzerine kuruludur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.\" - Temel Haklar Şartı'nın Başlangıcı"
 EU102B:0 "Avrupa Konvansiyonu"
 EU102B_desc:0 "Laeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaş için daha sade, temel hedeflerine ulaşmada daha güçlü ve dünyada daha belirgin bir Birlik yolunda kararlı bir adım atmak üzere Birliğin geleceğine ilişkin bir Konvansiyon toplamaya karar verdi."
 EU103B:0 "Avrupa Anayasası"
 EU103B_desc:0 "Avrupa Konvansiyonu, Avrupa İçin Bir Anayasa Oluşturan Antlaşma Taslağı ile sonuçlandı. Bu uluslararası antlaşma, §Y[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturmak üzere mevcut Avrupa antlaşmalarının yerini alacak ve nitelikli çoğunluk oylamasını daha önce üye devletler arasında oybirliğiyle karar verilen politika alanlarına genişletecekti."
 EU104B:0 "Lizbon Antlaşması"
 EU104B_desc:0 "Lizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onay sürecinin olumsuz sonuçlanmasının bir sonucudur. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirmiştir; ikincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilmiştir."
 EU105B:0 "Avrupa Dış Eylem Servisi"
 EU105B_desc:0 "Avrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dışişleri ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU200B:0 "AB Maliye Politikaları"
 EU200B_desc:0 "Maliye politikaları ekonomik büyüme, makroekonomik istikrar ve enflasyon üzerinde önemli bir etkiye sahiptir. Bu bakımdan kilit unsurlar kamu harcama ve gelirlerinin düzeyi ve bileşimi, bütçe açıkları ve kamu borcudur. Maliye politikalarının sorumluluğunu elinde tutan egemen devletlerden oluşan avro bölgesi gibi bir para birliğinde mali disiplin ihtiyacı daha da güçlüdür."
 EU201B:0 "ECB Müdahalesi"
 EU201B_desc:0 "ECB Yönetim Konseyi, para politikası kararlarını uygulamak için Avrosistem para politikası araçları ve prosedürlerine ilişkin Genel Belgeler'de belirtilen bir dizi para politikası aracı ve prosedürü benimsemiştir."
 EU202B:0 "Avrupa Bankacılık Birliği"
 EU202B_desc:0 "Son finansal krize yanıt olarak tek pazar için daha güvenli bir finans sektörü oluşturmak amacıyla Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üye devletlerindeki tüm finansal aktörler için tek bir kural kitabı oluşturur. Bankalar için daha sıkı ihtiyati gereklilikler, mevduat sahipleri için daha iyi koruma ve batık bankaların yönetimine ilişkin kurallar içerir."
 EU203B:0 "Avro Tahvilleri"
 EU203B_desc:0 "Avro tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, para birliğinin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasıyla boy ölçüşebilecek bir avro tahvili piyasası kurarak hükümetlerin borçlarını finanse etmesi için yeni araçlar yaratır."
 EU204B:0 "Avrupa Finansal İstikrar Fonu (EFSF)"
 EU204B_desc:0 "EFSF, Avrupa borç krizinde avro bölgesi üye devletleri tarafından geçici bir kriz çözüm mekanizması olarak kuruldu ve birçok üye devlete mali yardım sağladı. Bu yardım, EFSF tarafından sermaye piyasalarında ihraç edilen EFSF tahvilleri ve diğer borçlanma araçlarıyla finanse edildi. EFSF artık başka mali yardım sağlamamaktadır; bu görev artık yalnızca ESM tarafından yürütülmektedir."
 EU205B:0 "Avrupa İstikrar Mekanizması (ESM)"
 EU205B_desc:0 "ESM'nin görevi, ciddi finansman sorunları yaşayan veya bu tehditle karşı karşıya kalan avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM üyelerinin finansal istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU206B:0 "Mali Birlik"
 EU206B_desc:0 "Mali birlik, üye devletlerin ortak bir bütçeyi paylaşmasını içerir. Bu, harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirlenmesi anlamına gelir. Mali birlik, Avrupa bütünleşmesinin bir sonraki adımı olarak önerilmektedir ve tüm üye devletler için harcama ve vergi oranlarını merkezi bir Avrupa otoritesinin belirlemesi anlamına gelir."
 EU207B:0 "Avrupa Ekonomik Hükümeti"
 EU207B_desc:0 "Bir Avrupa Ekonomik Hükümeti, AB'de ortak bir maliye ve aktif ekonomi politikasını mümkün kılar. §Y[EUU.GetFlag] Avrupa Birliği'ne§! kendi vergi otoritesini kazandırır ve üye devletler için asgari ücretleri merkezi bir otorite belirler."
 EU208B:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU208B_desc:0 "Bir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükümeti ile oluşturulan politika ve yetkileri tek bir makamda birleştirir."
 EU300B:0 "AB Savunma Politikaları"
 EU300B_desc:0 "Ortak Güvenlik ve Savunma Politikası (OGSP), Birliğin barışı koruma operasyonlarında, çatışmaların önlenmesinde ve uluslararası güvenliğin güçlendirilmesinde öncü bir rol üstlenmesini sağlar. Sivil ve askeri imkânlardan yararlanan OGSP, AB'nin kriz yönetimine yönelik kapsamlı yaklaşımının ayrılmaz bir parçasıdır."
 EU301B:0 "Avrupa Savunma Ajansı (EDA)"
 EU301B_desc:0 "Avrupa Savunma Ajansı, üye devletleri ve §Y[EUU.GetFlag] Avrupa Birliği'ni§! kriz yönetimi alanında Avrupa savunma kabiliyetlerini geliştirme ve Avrupa Güvenlik ve Savunma Politikası'nı bugünkü hâliyle ve gelecekteki gelişimiyle sürdürme çabalarında desteklemek amacıyla kuruldu."
 EU302B:0 "Daimi Yapılandırılmış İşbirliği (PESCO)"
 EU302B_desc:0 "PESCO, istekli ve muktedir üye devletlerin ortak kabiliyet projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına imkân tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu kabiliyetleri ulusal ve çok uluslu görev ve operasyonlar için üye devletlerin kullanımına sunmaktır."
 EU303B:0 "Avrupa Savunma Fonu"
 EU303B_desc:0 "Avrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine ve vatandaşlarının korunup savunulmasına kilit bir katkı sağlayacak. Yeniliği teşvik etmek ve son teknoloji savunma teknolojileri ve ürünleri geliştirmek için şirketler arasında ve AB ülkeleri arasında savunma işbirliğini destekleyecek. Fon, savunmaya yapılan ulusal yatırımları koordine edecek, tamamlayacak ve güçlendirecek."
 EU304B:0 "Avrupa Güvenlik Konseyi"
 EU304B_desc:0 "Bir Avrupa Güvenlik Konseyi, AB'yi uluslararası siyasette karar almaya daha hazırlıklı hâle getirir. AB tutarlı kararları daha hızlı alıp uygulamayı başaramazsa, AB kurallarını uygulama ve çok taraflı yapıları güçlendirme kabiliyeti zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükümetlerarası işbirliği formatıyla desteklenmelidir."
 EU305B:0 "Avrupa Ordusu"
 EU305B_desc:0 "Üye devletler, §Y[EUU.GetFlag] Avrupa Birliği'nin§! askeri kabiliyetlerini güçlendirmek için ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvrupa Ordusu§! olarak bilinecektir."
 EU306B:0 "Avrupa Donanması"
 EU306B_desc:0 "21. yüzyılda çok uluslu filolar ve görev kuvvetleri giderek yaygınlaşıp önem kazanırken §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri güçlerini birleştirip savaş gemilerini §YAvrupa Donanması§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU307B:0 "BM Güvenlik Konseyi'nde AB Daimi Üyeliği"
 EU307B_desc:0 "Üye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olmasına karar verdi. Bu, BMGK'nın reforme edilmesiyle ya da hâlihazırda BMGK üyesi olan üye devlet(ler)in koltuğunun AB'ye devredilmesiyle gerçekleştirilir."
 EU308B:0 "AB Nükleer Gücü"
 EU308B_desc:0 "Nükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki etkisini artıracaktır. Birlik, nükleer silahları üye devletlerinin nükleer silahlarını devralıp paylaşarak ya da kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU400B:0 "AB İkincil Mevzuatı"
 EU400B_desc:0 "AB antlaşmaları, AB üye devletleri arasında AB'nin hedeflerini, AB kurumlarına ilişkin kuralları, kararların nasıl alınacağını ve AB ile üyeleri arasındaki ilişkiyi belirleyen bağlayıcı anlaşmalardır. Antlaşmalar birincil hukuk olarak bilinir. Antlaşmaların ilke ve hedeflerinden doğan hukuk bütünü ise ikincil hukuk (tüzükler, yönergeler, kararlar, tavsiyeler ve görüşler) olarak bilinir."
 EU401B:0 "Genel Veri Koruma Tüzüğü"
 EU401B_desc:0 "AB Genel Veri Koruma Tüzüğü (GDPR), Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek amacıyla tasarlanmıştır."
 EU402B:0 "Dijital Tek Pazarda Telif Hakkı Yönergesi"
 EU402B_desc:0 "Dijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU403B:0 "Dublin II Tüzüğü"
 EU403B_desc:0 "Dublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini belirler. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve aynı kişinin birden fazla sığınma başvurusu yaparak sistemi kötüye kullanmasının önüne geçmektir."
 EU404B:0 "Sığınmacıların Yeniden Yerleştirilmesi ve İskânı"
 EU404B_desc:0 "Başvurularının olumlu sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan başvurularının işleme alınacağı diğer üye devletlere yeniden yerleştirilir. Başvurular olumlu sonuçlanırsa başvuru sahiplerine, yerleştirildikleri üye devlette ikamet hakkıyla birlikte mülteci statüsü verilir."
 EU405B:0 "AB-Türkiye Mutabakatı"
 EU405B_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye üzerinden Avrupa'ya yönelik düzensiz göç akışını durdurmayı amaçlayan bir anlaşma için müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye iade edilecek. §Y[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler İçin Mali Yardım Programı'na 3 milyar avro ödeyecek."
 EU406B:0 "Avrupa Sığınma Ajansı"
 EU406B_desc:0 "AB Komisyonu, sığınma süreci boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali imkânlarla donatılmış bir AB Sığınma Ajansı kurulmasını önerdi."
 EU407B:0 "Frontex"
 EU407B_desc:0 "Frontex, AB ülkelerine ve Schengen'e bağlı ülkelere dış sınırlarını yönetmede yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır yetkilileri arasındaki işbirliğini kolaylaştırır, teknik destek ve uzmanlık sağlar."
 EU408B:0 "Avrupa Sınır ve Sahil Güvenlik Ajansı"
 EU408B_desc:0 "Frontex, Avrupa Sınır ve Sahil Güvenlik Ajansı'na dönüşüyor. Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa sahne oldu. Dış sınırı olan ülkeler sınır kontrolünden tek başına sorumludur; ancak Frontex ciddi göç baskısıyla karşı karşıya kalan AB ülkelerine ek teknik destek sağlayabilir."
 EU500B:0 "Avrupa Komisyonu Politikaları"
 EU500B_desc:0 "Avrupa Komisyonu Politikaları"
 EU600B:0 "AB Genişlemesi"
 EU600B_desc:0 "Genişleme politikası, AB'ye katılmak isteyen ülkeler ve potansiyel adaylar için geçerlidir. Üyelik perspektifi, AB üyesi olmak isteyen ülkelerde demokratik ve ekonomik reformlar için güçlü bir teşviktir."
 EU601B:0 "Avrupa Birliği'nin 2004 Genişlemesi"
 EU601B_desc:0 "1 Mayıs 2004'te toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), bir eski Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) kapsıyor."
 EU602B:0 "Avrupa Birliği'nin 2007 Genişlemesi"
 EU602B_desc:0 "Doğu Avrupa'dan iki ülke daha, §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§!, AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU603B:0 "Avrupa Birliği'nin 2013 Genişlemesi"
 EU603B_desc:0 "2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katılarak üye devlet sayısını 28'e çıkardı."
 EU700B:0 "Ayrılma Politikaları"
 EU700B_desc:0 "Birlik genelinde yükselen Avrupa şüpheciliğiyle birlikte bazı üye devletler §Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmayı düşünecek."
 EU701B:0 "50. Madde"
 EU701B_desc:0 "\"Her Üye Devlet, kendi anayasal kurallarına uygun olarak Birlikten ayrılmaya karar verebilir.\"\n- Avrupa Birliği Antlaşması, Madde 50(1).\n50. Madde ilk olarak Avrupa Birliği Anayasal Antlaşması için kaleme alındı. Anayasanın onaylanamamasının ardından madde Lizbon Antlaşması'na dahil edildi."
 EU702B:0 "Ayrılma Antlaşması"
 EU702B_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmak, ayrılan ülkenin AB hukukunun geçerliliğini yitireceği döneme göre ulusal hukukunu uyarlamak zorunda olduğu karmaşık bir süreçtir. Ayrılan ülke ile §Y[EUU.GetFlag] Avrupa Birliği§! gelecekteki ilişkileri konusunda bir anlaşmaya varmak zorundadır."
 EU703B:0 "Anlaşmasız Çıkış"
 EU703B_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ile bir Ayrılma Antlaşması'na varılamazsa, halkımızı Anlaşmasız Çıkış'ın kaosundan korumak için acil önlemler alınmalıdır."
 EU110B:0 "Avrupa Birliği'nin Federalleşmesi"
 EU110B_desc:0 "Avrupa bütünleşme süreci, daha fazla bütünleşmenin §Y[EUU.GetFlag] Avrupa Birliği'nin§! Federalleşmesine yol açacağı bir noktaya ulaştı."
 EU111B:0 "Avrupa Birleşik Devletleri"
 EU111B_desc:0 "70 yılı aşkın Avrupa bütünleşmesinin ardından §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri egemenliklerinden vazgeçerek §Y[EUU.GetFlag] Avrupa Birleşik Devletleri'ni§! kurmaya karar verdi."
 EU112B:0 "Avrupa Federasyonu"
 EU112B_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri, nitelikli çoğunluk oylamasını temel ilke olarak benimseyen ve §YAvrupa Federasyonu Başkanı§! tarafından yönetilen §Y[EUU.GetFlag] Avrupa Federasyonu'na§! Birliği dönüştürmeye karar verdi."
 EU113B:0 "Anavatanlar Avrupası"
 EU113B_desc:0 "Daha fazla Avrupa bütünleşmesi, üye devletlerin kültürel mirasını, ulusal kimliklerini ve egemenliğini tehlikeye atacaktır. Avrupa, anavatanların Avrupası'dır; bu yüzden Avrupa bütünleşmesi bu aşamada durmalıdır."
 EU604B:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU604B_desc:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU605B:0 "Batı Balkanlar Genişlemesi"
 EU605B_desc:0 "Batı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU606B:0 "Türkiye"
 EU606B_desc:0 "§Y[TUR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU607B:0 "Karadeniz Genişlemesi"
 EU607B_desc:0 "Karadeniz ülkeleri §Y[MLV.GetNameWithFlag]§! ve §Y[UKR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU608B:0 "Kafkasya Genişlemesi"
 EU608B_desc:0 "Kafkas ülkeleri §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! ve §Y[GEO.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU609B:0 "Avrupa Ekonomik Alanı"
 EU609B_desc:0 "Avrupa Ekonomik Alanı'nın AB üyesi olmayan ülkeleri (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! ve §Y[ICE.GetNameWithFlag]§!) §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU610B:0 "Belarus"
 EU610B_desc:0 "§Y[BLR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU611B:0 "İç Genişleme"
 EU611B_desc:0 "İç genişleme, mevcut bir üye devletin dağılması veya ondan ayrılma yoluyla yeni üye devletlerin ortaya çıkması sürecidir. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! ve §Y[WAS.GetNameWithFlag]§! bağımsızlıklarını kazandıklarında §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday olabilir."
 POTEF001B:0 "Avrupa Federasyonu Başkanı"
 POTEF001B_desc:0 "§YAvrupa Federasyonu Başkanı (POTEF)§! Avrupa'nın en üst lideridir. Bu nedenle Avrupa Federasyonu Başkanı, tüm Federasyon için belirleyici stratejik kararları alma yetkisine sahiptir."
 POTEF100B:0 "Alp Doktrini"
 POTEF100B_desc:0 "Alp ülkeleri §Y[AUS.GetNameWithFlag]§! ve §Y[SWI.GetNameWithFlag]§! uzun bir dağ savaşı geleneğine sahiptir. Alp Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF101B:0 "Yaratılışın Bütünlüğü"
 POTEF101B_desc:0 "Avrupa Federasyonu, Yaratılışın Bütünlüğünü korumak ve sürdürmek için politikalarını uyarlıyor."
 POTEF102B:0 "Çevreci Emperyalizm"
 POTEF102B_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF103B:0 "Kuzey Amerika"
 POTEF103B_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF104B:0 "Güney Amerika"
 POTEF104B_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF105B:0 "Avrupa"
 POTEF105B_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF106B:0 "Afrika"
 POTEF106B_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF107B:0 "Orta Doğu"
 POTEF107B_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF108B:0 "Asya"
 POTEF108B_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF109B:0 "Okyanusya"
 POTEF109B_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF110B:0 "Pasifik"
 POTEF110B_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF150B:0 "Alman Doktrini"
 POTEF150B_desc:0 "§Y[GER.GetNameWithFlag]§! geleneksel olarak güçlü zırhlı kuvvetlere odaklanmıştır. Zırhlı Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF151B:0 "Ticaret İmparatorluğu"
 POTEF151B_desc:0 "Avrupa Federasyonu bir Ticaret İmparatorluğu olacak."
 POTEF200B:0 "Fransız Doktrini"
 POTEF200B_desc:0 "§Y[FRA.GetNameWithFlag]§! geleneksel olarak yüksek hareket kabiliyetine sahip hafif zırhlı ve motorlu kuvvetlere odaklanmıştır. Manevra Savaşı Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF201B:0 "İmparatorluk Gücü"
 POTEF201B_desc:0 "Avrupa Federasyonu, imparatorluk öncüllerinin geleneğini sürdürüyor."
 POTEF202B:0 "Özgürlük İmparatorluğu"
 POTEF202B_desc:0 "Avrupa Federasyonu bir Özgürlük İmparatorluğu olacak."
 POTEF203B:0 "Amerika: Müttefik mi, Hasım mı?"
 POTEF203B_desc:0 "Amerika ve Avrupa, 20. yüzyılın büyük bölümünde müttefikti. §Y[USA.GetNameWithFlag]§! ülkesindeki son siyasi değişikliklerle bu durum sorgulanır oldu…"
 POTEF204B:0 "NATO Mirası"
 POTEF204B_desc:0 "NATO'nun barışı koruma mirası geleneğinde §Y[USA.GetNameWithFlag]§! ve §YEDU§! yeni bir ittifak kuruyor."
 POTEF205B:0 "Trump'ın Mirası"
 POTEF205B_desc:0 "§Y[USA.GetNameWithFlag]§! müttefiklikten hasımlığa geçti. Avrupa bu belirleyici stratejik değişime karşılık vermek zorunda."
 POTEF206B:0 "Duvarı Yık"
 POTEF206B_desc:0 "Avrupa egemenliğine yönelik Amerikan tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[MEX.GetNameWithFlag]§! ile ittifak kurup §Y[USA.GetNameWithFlag]§! ülkesini güneyden işgal etmeye yönelik bir plan hazırladı."
 POTEF207B:0 "Buster'ın Dirilişi"
 POTEF207B_desc:0 "ABD'nin Avrupa'ya yönelik tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[CAN.GetNameWithFlag]§! ile ittifak kurup 1 No'lu Savunma Planı'nı revize etmeyi önerdi. Bu plan, Kanadalı Yarbay James 'Buster' Sutherland Brown tarafından ABD ile Britanya İmparatorluğu arasında yakın bir çatışma durumunda Kanada'nın ABD'ye önleyici bir saldırı düzenlemesi için hazırlanmıştı. Bu planla §YEDU§!, §Y[USA.GetFlag] ABD'yi§! kuzeyden işgal edebilir."
 POTEF250B:0 "Benelüks Doktrini"
 POTEF250B_desc:0 "Soğuk Savaş'ın ardından §YAlçak Ülkeler§! yeni duruma uyum sağlamak için havadan hareketli kuvvetlere odaklandı. Havadan Hareket Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF251B:0 "Liberal Miras"
 POTEF251B_desc:0 "Avrupa Federasyonu Liberal Mirasını onurlandırıyor."
 POTEF252B:0 "Eski Ticaret Yollarını Güvenceye Al"
 POTEF252B_desc:0 "Avrupa Federasyonu'nun Karayipler'e, Afrika'ya ve eski Hollanda Doğu Hint Adaları'na uzanan eski ticaret yollarını güvenceye alması gerekiyor."
 POTEF253B:0 "Endonezya"
 POTEF253B_desc:0 "Avrupa Federasyonu'nun eski Hollanda sömürgesi §Y[IND.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF300B:0 "İber Doktrini"
 POTEF300B_desc:0 "§YIberya ülkeleri§! geleneksel olarak güçlü deniz piyadesi kuvvetlerine odaklanmıştır. Deniz Piyadesi Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF301B:0 "Latin Kuzenler"
 POTEF301B_desc:0 "Avrupa Federasyonu'nun Güney Amerika'daki eski sömürgelerle ilişkilerini geliştirmesi gerekiyor."
 POTEF302B:0 "Meksika"
 POTEF302B_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[MEX.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Orta Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF303B:0 "Büyük Kolombiya"
 POTEF303B_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[COL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF304B:0 "Orta Amerika"
 POTEF304B_desc:0 "Avrupa Federasyonu'nun §YOrta Amerika'daki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF305B:0 "Güney Koni"
 POTEF305B_desc:0 "Avrupa Federasyonu'nun §YGüney Amerika'nın Güney Konisi'ndeki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF306B:0 "Brezilya"
 POTEF306B_desc:0 "Avrupa Federasyonu'nun eski Portekiz sömürgesi §Y[BRA.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF350B:0 "İngiliz Doktrini"
 POTEF350B_desc:0 "§YBritanya§! geleneksel olarak güçlü bir donanmaya odaklanmıştır. Deniz Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF351B:0 "Kuzey Atlantik'i Güvenceye Al"
 POTEF351B_desc:0 "Denizlerin özgürlüğünü ve serbest ticareti güvence altına almak için Avrupa Federasyonu'nun Kuzey Atlantik'i kontrol etmesi gerekiyor."
 POTEF352B:0 "Milletler Topluluğu Mirası"
 POTEF352B_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması ve eski İngiliz dominyonlarıyla ilişkilerini geliştirmesi gerekiyor."
 POTEF353B:0 "Kanada"
 POTEF353B_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[CAN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF354B:0 "Avustralya"
 POTEF354B_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[AST.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF355B:0 "Yeni Zelanda"
 POTEF355B_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[NZL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF356B:0 "Kuzey Denizi'ni Güvenceye Al"
 POTEF356B_desc:0 "Kuzey Denizi, Avrupa Federasyonu'nun arka bahçesidir ve güvence altına alınması gerekir."
 POTEF357B:0 "Malaya Mirası"
 POTEF357B_desc:0 "Avrupa Federasyonu'nun Malaya'daki eski İngiliz sömürgeleriyle ilişkilerini geliştirmesi gerekiyor."
 POTEF358B:0 "Malezya"
 POTEF358B_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[MAY.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF359B:0 "Singapur"
 POTEF359B_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[SIN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF360B:0 "Hong Kong'a Garanti Ver"
 POTEF360B_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[HKG.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Çin-İngiltere Ortak Bildirisi'ndeki özgürlükleri güvence altına alması gerekiyor."
 POTEF400B:0 "İskandinav Doktrini"
 POTEF400B_desc:0 "§YSkandinav ülkeleri§! geleneksel olarak Arktik'te savaşmaya odaklanmıştır. İskandinav Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF401B:0 "Arktik'i Güvenceye Al"
 POTEF401B_desc:0 "Denizlerin özgürlüğünü ve jeostratejik konumunu güvence altına almak için Avrupa Federasyonu'nun Arktik'i kontrol etmesi gerekiyor."
 POTEF450B:0 "Akdeniz Doktrini"
 POTEF450B_desc:0 "§YAkdeniz ülkeleri§! geleneksel olarak denizden çıkarma taktiklerine odaklanmıştır. Amfibi Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF451B:0 "Kuzey Afrika"
 POTEF451B_desc:0 "Bir yakınsama bölgesi ve mülteciler için güvenli bir liman oluşturmak amacıyla Avrupa Federasyonu'nun §YKuzey Afrika§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF452B:0 "Kıbrıs'ı Birleştir"
 POTEF452B_desc:0 "Avrupa Federasyonu'nun egemen bir üye devleti olarak §Y[CYP.GetNameWithFlag]§! yeniden birleştirilmelidir."
 POTEF500B:0 "Balkan Doktrini"
 POTEF500B_desc:0 "§YBalkan ülkeleri§! geleneksel olarak partizan kuvvetlere odaklanmıştır. Partizan Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF501B:0 "Balkan Altyapısı"
 POTEF501B_desc:0 "Avrupa Federasyonu'nun bölgesel barışı korumak ve Balkanları yabancı etkiden korumak için Balkanların altyapısını geliştirmesi gerekiyor."
 POTEF502B:0 "İpek Yolu'na Meydan Oku"
 POTEF502B_desc:0 "Avrupa Federasyonu'nun Çin'in yeni İpek Yolu'na meydan okuması ve Orta Asya'daki Çin etkisini azaltması gerekiyor."
 POTEF503B:0 "Rakip Çin"
 POTEF503B_desc:0 "§Y[CHI.GetNameWithFlag]§! küresel düzeyde Avrupa Federasyonu'nun başlıca rakiplerinden biri hâline geldi. Avrupa Federasyonu'nun politikalarını buna göre uyarlaması gerekiyor."
 POTEF504B:0 "Ok Harekâtı"
 POTEF504B_desc:0 "Adını Ok Savaşı'ndan (İkinci İngiliz-Çin Savaşı) alan Ok Harekâtı, Çin'in yayılmacı politikasını durdurmak için §Y[CHI.GetNameWithFlag]§! ülkesine Avrupa müdahalesini öngören bir plandır."
 POTEF505B:0 "Asyalı Müttefikler"
 POTEF505B_desc:0 "§Y[CHI.GetNameWithFlag]§! ile yüzleşmek için Avrupa Federasyonu'nun Asya'da müttefiklere ihtiyacı var."
 POTEF506B:0 "Kore Cumhuriyeti"
 POTEF506B_desc:0 "§Y[KOR.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF507B:0 "Japonya"
 POTEF507B_desc:0 "§Y[JAP.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF550B:0 "Karadeniz Doktrini"
 POTEF550B_desc:0 "Soğuk Savaş'ın ardından §YKaradeniz ülkeleri§! yeni duruma uyum sağlamak için hareketli hava savunma kuvvetlerine odaklandı. Hava Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF551B:0 "Karadeniz'i Güvenceye Al"
 POTEF551B_desc:0 "Karadeniz, Avrupa Federasyonu'nu Kafkasya'ya ve güneydoğudaki üye devletlerine bağlar. Bu nedenle güvence altına alınması gerekir."
 POTEF552B:0 "Ayrılıkçı Cumhuriyetleri Yeniden Entegre Et"
 POTEF552B_desc:0 "§Y[SOV.GetNameWithFlag]§!, ayrılıkçı hareketleri destekleyip ayrılıkçı cumhuriyetler kurarak Avrupa Federasyonu'nun çeşitli doğu üye devletlerinin egemenliğini ihlal etti. Bu Rus kuklalarını yeniden entegre etmemiz gerekiyor."
 POTEF553B:0 "Rakip Rusya"
 POTEF553B_desc:0 "§Y[SOV.GetNameWithFlag]§! Avrupa Federasyonu'nun başlıca rakiplerinden biri oldu. Ona yaptırımlar uygulamamız gerekiyor."
 POTEF554B:0 "Şarlman Harekâtı"
 POTEF554B_desc:0 "Adını 'Avrupa'nın Babası' (Pater Europae) olarak anılan efsanevi imparator Şarlman'dan alan Şarlman Harekâtı, §Y[SOV.GetNameWithFlag]§! ülkesine karşı önleyici meşru müdafaa planıdır. Bu harekâtla §YEDU§!, Avrupa egemenliğine yönelik bu tehdidi ortadan kaldırmak için §Y[SOV.GetNameWithFlag]§! ülkesine önleyici bir işgal başlatabilir."
 POTEF600B:0 "Kafkasya Doktrini"
 POTEF600B_desc:0 "Soğuk Savaş'ın ardından §YKafkasya bölgesi ülkeleri§! yeni duruma uyum sağlamak için güçlü bir savunmaya odaklandı. Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF601B:0 "Avrupa Erişimi"
 POTEF601B_desc:0 "Avrupa Federasyonu'nun Kafkasya'ya ve güneydoğudaki üye devletlerine erişime ihtiyacı var. Bu nedenle yeni deniz üsleri ve altyapı inşa edilmesi gerekiyor."
 POTEF650B:0 "Vişegrad Doktrini"
 POTEF650B_desc:0 "§YVişegrad ülkeleri§! geleneksel olarak güçlü topçu kuvvetlerine odaklanmıştır. Topçu Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF651B:0 "Avrupa Hava Savunma Ağı"
 POTEF651B_desc:0 "Avrupa Federasyonu'nun doğu kanadını güvence altına almak için bir hava savunma ağı kurması gerekiyor."
 POTEF652B:0 "Doğu Güvenlik Duvarı"
 POTEF652B_desc:0 "§Y[SOV.GetNameWithFlag]§! ülkesinin doğudaki üye devletlerde artan etkisine karşı koyulması gerekiyor."
 POTEF700B:0 "Baltık Doktrini"
 POTEF700B_desc:0 "§YBaltık ülkeleri§! geleneksel olarak küçük ve son derece yetenekli özel kuvvetlere odaklanmıştır. Özel Kuvvetler Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF701B:0 "Baltık Denizi'ni Güvenceye Al"
 POTEF701B_desc:0 "Baltık Denizi, Avrupa Federasyonu'nun iç denizidir ve güvence altına alınması gerekir."
 POTEF800B:0 "Pax Europaea"
 POTEF800B_desc:0 "Avrupa Federasyonu'nun dünya barışını sağlamak için küresel süper güç olması gerekiyor."
 USoE001B:0 "Yeni Avrupa Milletini Kur"
 USoE001B_desc:0 "Birleşik Avrupa Birliği'nin kendini yeni bir millet olarak kurması gerekiyor. Anayasa ve Birleşme Antlaşmaları bir şey; ama şimdi halkın bu yasal çerçeveyi hayatla doldurması gerekiyor."
 USoE002B:0 "Avrupa Subay Kolordusu"
 USoE002B_desc:0 "Birlik döneminde her üye devletin kendi ordusu vardı, daha sonra da Avrupa Ordusu kuruldu. Ortak doktrin ve eğitime sahip bir Avrupa Subay Kolordusu oluşturmamız gerekiyor."
 USoE003B:0 "Avrupa Siyasi Partileri"
 USoE003B_desc:0 "Yeni bir millet yeni siyasi partilere ihtiyaç duyar. Üye devletlerin eski siyasi partileri birleşmek zorunda."
 USoE004B:0 "Avrupa Vatanseverliği"
 USoE004B_desc:0 "Yeni bir millet kendi vatanseverliğine ve ulusal sembollerine ihtiyaç duyar."
 USoE005B:0 "Yeni Büyük Oyun"
 USoE005B_desc:0 "Yeni Büyük Oyun daha yeni başladı ve Avrupa geç kaldı; ABD, Çin ve Rusya ise ilk hamlelerini çoktan yaptı."
 USoE006B:0 "Avrupa'nın Kalbi ve Ruhu"
 USoE006B_desc:0 "Yeni milletin değerlerini ve standartlarını tanımlaması gerekiyor. Avrupa'nın bir Kalbe ve Ruha ihtiyacı var!"
 USoE100B:0 "Nüfuz Alanları Oyunu"
 USoE100B_desc:0 "Nüfuz alanları oyununu oynadığında ya kazanırsın ya ölürsün. Orta yolu yoktur."
 USoE101B:0 "Kartalla Hesaplaş"
 USoE101B_desc:0 "Amerikan Kartalı yere indirilmeli! Avrupa semalarında fazlasıyla uzun süre uçtu."
 USoE102B:0 "Ayıyla Kapış"
 USoE102B_desc:0 "Ayı bize saldırmadan önce biz ona saldırmalıyız."
 USoE103B:0 "Ejderhayla Dans"
 USoE103B_desc:0 "Ejderhayla Dans tehlikeli bir oyundur."
 USoE104B:0 "Demirden Bir Kalp"
 USoE104B_desc:0 "Eski zamanlarda demirciler, yenilen kötülerin silahlarından demir bir taht döverlerdi. Günümüzde ise sadece Avrupa'nın demirden kalbini kanıtladığını ve artık dünyanın tartışmasız hâkimi olduğunu ilan ediyoruz!"
 USoE200B:0 "Barış İçinde Bir Arada Yaşam"
 USoE200B_desc:0 "Demirden daha keskin kılıçlar vardır. Parayla ödeyebilecekken neden kanla ödeyesin?"
 USoE201B:0 "Önce Amerika"
 USoE201B_desc:0 "Kendi doktrinlerimize saygı duyulmasını istiyorsak Önce Amerika doktrinine saygı duymalıyız."
 USoE202B:0 "Rus Nüfuz Alanı"
 USoE202B_desc:0 "Rusya tüm Rus halkının koruyucusudur. Bu, saygı duymamız gereken onların nüfuz alanıdır."
 USoE203B:0 "Çin Nüfuz Alanı"
 USoE203B_desc:0 "Çin'in nüfuz alanı Güneydoğu Asya'yı kapsar ve bizi rahatsız etmez. Çin bizim ticaret ortağımızdır, rakibimiz değil."
 USoE204B:0 "Avrupa Nüfuz Alanı"
 USoE204B_desc:0 "21. yüzyılın tüm süper güçlerini yatıştırdık; artık Avrupa, Levant ve Kuzey Afrika'da Avrupa Nüfuz Alanı'nı kurmak için elimiz serbest."
 USoE300B:0 "Medeniyetler Çatışması"
 USoE300B_desc:0 "Medeniyetler Çatışması, Amerikalı siyaset bilimci Samuel P. Huntington'ın Soğuk Savaş sonrası dünyada insanların kültürel ve dinî kimliklerinin başlıca çatışma kaynağı olacağını öne süren tezidir. Gelecekteki savaşlar ülkeler arasında değil, kültürler arasında yaşanacaktır."
 USoE301B:0 "Batı'nın Geri Kalanı"
 USoE301B_desc:0 "Avrupa, Batı'nın geri kalanıdır. Amerika, Önce Amerika doktriniyle bizi yalnız ve tecrit edilmiş bıraktı."
 USoE302B:0 "Haç ve Hilal"
 USoE302B_desc:0 "Avrupa'nın güneydoğu sınırında haç ile hilal çatışıyor. Kim galip gelecek: Batı medeniyeti mi, İslam medeniyeti mi?"
 USoE303B:0 "Papa ve Patrik"
 USoE303B_desc:0 "1054'teki Büyük Ayrılık'tan bu yana Papa ile Ortodoks Patrik farklı yollara gitti. Batı medeniyetini savunmak için yeniden birleşme zamanı geldi."
 USoE304B:0 "İki Haç"
 USoE304B_desc:0 "Doğu ve Batı Hristiyanlığının İslam'a karşı birleşmesi gerekiyor."
 USoE305B:0 "Avrasya İttifakı"
 USoE305B_desc:0 "NATO'nun dağılmasının ardından Avrupa, Rus komşusuyla yeni ve büyük bir ittifak kurabilir."
 USoE306B:0 "Konstantinopolis"
 USoE306B_desc:0 "Konstantinopolis Batı'nın bir parçasıdır. Avrupa'nın onu İslam etkisinden kurtarması gerekiyor."
 USoE307B:0 "Antakya"
 USoE307B_desc:0 "Antakya Prinkepsliği, Birinci Haçlı Seferi sırasında kurulan Haçlı devletlerinden biriydi. Batı'ya aittir ve bir kez daha İslam'dan arındırılmalıdır."
 USoE308B:0 "Trablus"
 USoE308B_desc:0 "Trablus Kontluğu (1109–1289) Haçlı devletlerinin sonuncusuydu. Yeniden yükselmeli. Avrupa'nın Levant'ı İslam'dan kurtarması gerekiyor."
 USoE309B:0 "Kudüs"
 USoE309B_desc:0 "Avrupa'nın Kutsal Şehri İslam etkisinden kurtarması gerekiyor. Kudüs Krallığı kutsal mekânları bir kez daha koruyacak."
 USoE310B:0 "Malta Şövalyeleri"
 USoE310B_desc:0 "Avrupa'nın Kuzey Afrika'yı İslam etkisinden kurtarması gerekiyor. Avrupa, Malta Şövalyeleri'nin örneğini izleyecek."
 USoE311B:0 "Arabistan'ın Batılılaşması"
 USoE311B_desc:0 "Arap Yarımadası'ndaki bazı ülkelerin Batı ile zaten yakın bağları var. Güvenli bir komşuluğa sahip olmak için Avrupa'nın Arap Yarımadası'nı tamamen Batılılaştırması gerekiyor."
 USoE312B:0 "Hindistan'ın Batılılaşması"
 USoE312B_desc:0 "Sömürge mirası sayesinde Hindistan'ın Batı ile geleneksel olarak yakın bağları var. Avrupa, Hindistan'ı tamamen Batılılaştırmak için bu ilişkiyi derinleştirmeli."
 USoE313B:0 "İran Cumhuriyeti"
 USoE313B_desc:0 "İran, Orta Doğu'da Batı'nın başlıca rakiplerinden biridir. Avrupa, İran'ı Batılılaştırıp İran Cumhuriyeti'ne dönüştürerek onun bölgesel hegemonya arayışını durdurabilir."
 USoE320B:0 "Batı ve Diğerleri"
 USoE320B_desc:0 "Avrupa ve Amerika, dünyadaki her düşmana kafa tutabilecek Batılı süper güçlerdir. NATO'yu temel alarak Batı küresel hâkimiyetini dayatabilir."
 USoE321B:0 "Asya'nın Batılılaşması"
 USoE321B_desc:0 "Batı'nın Asya'daki yükselen güçlere odaklanması gerekiyor. Batı onlarla savaşmalı ya da onları Batılılaştırmalı."
 USoE322B:0 "Dört Kaplan"
 USoE322B_desc:0 "Hong Kong, Singapur, Güney Kore ve Tayvan'dan oluşan Dört Asya Kaplanı'nın Batı ile her zaman yakın bağları oldu ve yükselen Çin ejderhasından korkuyorlar. Asya'da Batı'nın güvenilir müttefikleri olabilirler."
 USoE323B:0 "Japonya"
 USoE323B_desc:0 "İkinci Dünya Savaşı'nın sona ermesinin ardından Japonya, Asya'da Batı'nın önemli bir müttefiki oldu. Batı'nın bu yakın ortaklığı sürdürmesi gerekiyor."
 USoE324B:0 "Çin"
 USoE324B_desc:0 "Çin, Asya'da Batı'nın başlıca rakibidir. Batı Çin'i Batılılaştırabilirse Asya'da Batı hegemonyasına rakip kalmayacaktır."
 USoE325B:0 "Düşünülemez Harekâtı 2.0"
 USoE325B_desc:0 "Düşünülemez Harekâtı, Mayıs 1945'te Winston Churchill'in emriyle İngiliz Genelkurmay Başkanları tarafından Sovyetler Birliği'ne karşı hazırlanan bir savaş planıydı. Batılı Müttefikler, eski Alman Wehrmacht'ı ile birlikte Sovyetler Birliği'ne sürpriz bir saldırı başlatacaktı. Batı'nın bu planı mevcut duruma göre revize etmesi ve Avrupa'da Rus hegemonyasını önlemek için Rusya'ya karşı önleyici meşru müdafaa amacıyla harekete geçmesi gerekiyor."
 USoE400B:0 "Özgürlük Meşalesi"
 USoE400B_desc:0 "Avrupa'nın Özgürlük Meşalesi'ni taşıması gerekiyor! Avrupa Birleşik Devletleri, insan haklarına ve hukukun üstünlüğüne saygı duyan demokratik bir cumhuriyettir."
 USoE401B:0 "Dijital Demokrasi"
 USoE401B_desc:0 "Avrupa'nın demokratik kurumlarını dijital çağa göre reforme etmesi gerekiyor. Sosyal medya ve sosyal ağlar sayesinde halk yasamaya ve yönetime doğrudan katılabilir."
 USoE402B:0 "Orak ve Çekiç"
 USoE402B_desc:0 "Sosyalizmin ve Marksizmin babaları Karl Marx ve Friedrich Engels Avrupalıydı. Avrupa'nın bu mirası sürdürmesi gerekiyor."
 USoE403B:0 "ASSCB"
 USoE403B_desc:0 "Avrupa solu kapitalistleri Avrupa Birliği'nde kapana kıstırdı; artık Karl Marx ve Friedrich Engels'in manevi mirasçıları ASSCB'yi, yani Avrupa Sovyet Sosyalist Cumhuriyetler Birliği'ni kurma gücüne sahip."
 USoE404B:0 "Yapay Zekâ Hükümeti"
 USoE404B_desc:0 "Yapay zekâ, bir ülkeyi verimsiz ve yozlaşma ihtimali olan insan politikacılardan daha verimli yönetecek kadar gelişti. İktidar partisinin yapay zekâ ajanı kontrolü ele alacak ve ülkeyi iktidar partisinin değerlerine göre yönetecek."
 USoE500B:0 "Yeşil Gelecek"
 USoE500B_desc:0 "İnkâr edilemez iklim değişikliği karşısında Avrupa için yeşil bir gelecekten başka gelecek yok."
 USoE501B:0 "Çevre İmparatorluğu"
 USoE501B_desc:0 "Avrupa'nın, ekonomi ile çevrenin çelişmediği bir Çevre İmparatorluğu olması gerekiyor."
 USoE502B:0 "Çevreci Emperyalizm"
 USoE502B_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE503B:0 "Kuzey Amerika"
 USoE503B_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE504B:0 "Güney Amerika"
 USoE504B_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE505B:0 "Avrupa"
 USoE505B_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE506B:0 "Afrika"
 USoE506B_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE507B:0 "Orta Doğu"
 USoE507B_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE508B:0 "Asya"
 USoE508B_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE509B:0 "Okyanusya"
 USoE509B_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE510B:0 "Pasifik"
 USoE510B_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE600B:0 "Haç ve Taç"
 USoE600B_desc:0 "Avrupa'nın mirasını yerine getirmesi ve bir kez daha imparatorluk olması gerekiyor."
 USoE601B:0 "Yeni Şövalyeler"
 USoE601B_desc:0 "Düşmanca bir dünyada ordu, halkını yozlaşmış politikacılardan ve yabancı güçlerden kurtarmak için Avrupa'da kontrolü ele aldı."
 USoE602B:0 "Avrupa Orduları Generali"
 USoE602B_desc:0 "Genelkurmay, Avrupa'nın bir kara kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Orduları Generali rütbesi verilecek."
 USoE603B:0 "Avrupa Hava Mareşali"
 USoE603B_desc:0 "Genelkurmay, Avrupa'nın bir hava kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Hava Mareşali rütbesi verilecek."
 USoE604B:0 "Avrupa Büyükamirali"
 USoE604B_desc:0 "Genelkurmay, Avrupa'nın bir amiral tarafından yönetilmesine karar verdi. Bu amirale Avrupa Büyükamirali rütbesi verilecek."
 USoE605B:0 "Avrupa İmparatorluğu"
 USoE605B_desc:0 "Avrupa bir kez daha imparatorluk oldu ve halkının çıkarlarını küresel düzeyde savunabiliyor."
 USoE620B:0 "Yeni İmparator"
 USoE620B_desc:0 "Avrupa'nın kıtayı 21. yüzyılda yönetecek yeni bir imparatora ihtiyacı var."
 USoE621B:0 "Bir Hanedan Seç"
 USoE621B_desc:0 "Avrupa'nın uzun ve şanlı geçmişe sahip pek çok büyük hanedanı var. İlk kez birleşen kıtanın 21. yüzyılda hangi hanedanın hüküm süreceğine karar vermesi gerekiyor."
 USoE622B:0 "Savoy Hanedanı"
 USoE622B_desc:0 "Savoy Hanedanı, 1003'te tarihî Savoy bölgesinde kurulan bir kraliyet hanedanıdır. Aile, kademeli genişlemeyle İtalya'nın kuzeybatısındaki küçük bir Alp kontluğunu yönetmekten Sicilya Krallığı'nın mutlak hâkimiyetine kadar yükseldi. Hanedan üyeleri Sardinya, İtalya, Arnavutluk, Etiyopya ve kısa bir süre İspanya'yı yönetti. Hanedan ayrıca Kıbrıs, Kudüs ve Ermenistan krallıkları unvanlarında da hak iddia eder."
 USoE623B:0 "Wittelsbach Hanedanı"
 USoE623B_desc:0 "Wittelsbach Hanedanı, kolları Bavyera, Hollanda, Zeeland, Köln, İsveç, Romanya, Bohemya, Macaristan, Danimarka, Norveç, Yunanistan ve Kutsal Roma İmparatorluğu dahil pek çok toprağı yönetmiş Alman-Bavyeralı bir hanedandır. Katolik bir hükümdarın hakkını tanıyan Jakobit veraset çizgisi, Bavyera Veliaht Prensi Franz'ı II. Francis olarak meşru varis kabul eder."
 USoE624B:0 "Borbón-Anjou Hanedanı"
 USoE624B_desc:0 "Borbón-Anjou Hanedanı, İspanya Krallığı'nın hüküm süren kraliyet hanedanıdır. 18. yüzyılda İspanyol Bourbon hanedanının üyeleri İspanya, Napoli, Sicilya ve Parma'da taht sahibiydi."
 USoE625B:0 "Bourbon Hanedanı"
 USoE625B_desc:0 "Bourbon Hanedanı, Fransa'nın kraliyet hanedanı olan Capet hanedanının bir kolu olan Fransız kökenli bir Avrupa hanedanıdır. Bourbon kralları Fransa ve Navarra'yı ilk kez 16. yüzyılda yönetti."
 USoE626B:0 "Hannover Hanedanı"
 USoE626B_desc:0 "Hannover Hanedanı, 17. ve 20. yüzyıllar arasında çeşitli dönemlerde Hannover, Büyük Britanya ve İrlanda'yı yönetmiş bir Alman kraliyet hanedanıdır. Hanedan 1635'te Brunswick-Lüneburg Hanedanı'nın genç bir kolu olarak doğdu ve 1692'de Hannover'in Prens-Seçicilik olmasına kadar prestij kazandı."
 USoE627B:0 "Glücksburg Hanedanı"
 USoE627B_desc:0 "Schleswig-Holstein-Sonderburg-Glücksburg Hanedanı'nın kısaltılmış adıyla Glücksburg Hanedanı, üyeleri çeşitli dönemlerde Danimarka, Norveç, Yunanistan ve birkaç kuzey Alman devletinde hüküm sürmüş, Oldenburg Hanedanı'nın Danimarkalı-Alman bir koludur."
 USoE628B:0 "Windsor Hanedanı"
 USoE628B_desc:0 "Windsor Hanedanı, Birleşik Krallık'ın ve diğer Milletler Topluluğu krallıklarının hüküm süren kraliyet hanedanıdır. 1901'de Saxe-Coburg ve Gotha Hanedanı, İngiliz monarşisinde Hannover Hanedanı'nın yerini aldı. 1917'de Birinci Dünya Savaşı nedeniyle kraliyet hanedanının adı Almanca Saxe-Coburg ve Gotha'dan İngilizce Windsor'a (Windsor Kalesi'nden) değiştirildi."
 USoE629B:0 "Orange-Nassau Hanedanı"
 USoE629B_desc:0 "Orange-Nassau Hanedanı, Hollanda'nın hâlen hüküm süren hanedanıdır. Avrupa Nassau Hanedanı'nın bir kolu olan hanedan, özellikle Sessiz William'ın İspanyol yönetimine karşı Hollanda isyanını örgütlemesinden ve bu isyanın Seksen Yıl Savaşları'nın (1568–1648) ardından bağımsız bir Hollanda devletine yol açmasından bu yana Hollanda ve Avrupa siyasetinde ve yönetiminde merkezi bir rol oynamıştır."
 USoE630B:0 "Habsburg-Lorraine Hanedanı"
 USoE630B_desc:0 "Habsburg-Lorraine Hanedanı, 1736'da Lorraine ve Bar Dükü III. François ile daha sonra sırasıyla Bohemya Kraliçesi, Macaristan Kraliçesi ve Avusturya Arşidüşesi olacak olan Avusturyalı Maria Theresa'nın evliliğinden doğmuştur. Üyeleri, Habsburg Hanedanı'nın ve Lorraine Hanedanı'nın hayatta kalan meşru soyudur; aile mülklerini ve İmparatorluk misyonunu miras almışlardır."
 USoE631B:0 "Bonaparte Hanedanı"
 USoE631B_desc:0 "Bonaparte Hanedanı, İtalyan kökenli eski bir imparatorluk ve kraliyet hanedanıdır. 1804'te I. Napolyon tarafından kuruldu. Napolyon, Grande Armée'yi tüm büyük Avrupa güçlerine karşı yöneltti ve bir dizi askeri zaferle kıta Avrupası'na hâkim oldu. Ailesinin üyelerini bağımlı devletlerin tahtlarına oturtarak hanedanın gücünü genişletti."
 USoE632B:0 "Hohenzollern Hanedanı"
 USoE632B_desc:0 "Hohenzollern Hanedanı, üyeleri çeşitli dönemlerde Hohenzollern, Brandenburg, Prusya, Alman İmparatorluğu ve Romanya'nın prensleri, prens-seçicileri, kralları ve imparatorları olmuş eski bir Alman kraliyet hanedanıdır. Aile, 11. yüzyılda Svabya'daki Hechingen kasabası çevresinde ortaya çıktı ve adını Hohenzollern Kalesi'nden aldı."
 USoE633B:0 "Bir Saray Seç"
 USoE633B_desc:0 "Avrupa'nın yeni İmparatoru'nun hüküm sürmek için temsil gücü yüksek bir saraya ihtiyacı var."
 USoE634B:0 "Quirinale Sarayı"
 USoE634B_desc:0 "Quirinale Sarayı, İtalya'nın Roma şehrinde bulunan tarihî bir yapıdır ve İtalya Cumhurbaşkanı'nın üç resmî konutundan biridir. Napolyon, Quirinale Sarayı'nı İmparator olarak asıl konutu olarak seçmişti. Ancak 1814'teki Fransız yenilgisi ve ardından gelen Avrupa Restorasyonu nedeniyle buraya hiç yerleşemedi."
 USoE635B:0 "Neuschwanstein Şatosu"
 USoE635B_desc:0 "Neuschwanstein Şatosu, Almanya'nın güneybatı Bavyera bölgesinde engebeli bir tepenin üzerinde yer alan 19. yüzyıldan kalma Neo-Romanesk bir saraydır. Saray, Bavyera Kralı II. Ludwig tarafından yaptırıldı. Şato, 1886'daki ölümüne kadar Kral'ın konutu olması amacıyla inşa edildi ve ölümünden kısa süre sonra halka açıldı. O zamandan beri 61 milyondan fazla kişi Neuschwanstein Şatosu'nu ziyaret etti."
 USoE636B:0 "Madrid Kraliyet Sarayı"
 USoE636B_desc:0 "Madrid Kraliyet Sarayı, İspanyol kraliyet ailesinin Madrid'deki resmî konutudur, ancak günümüzde yalnızca devlet törenleri için kullanılmaktadır. Saray 135.000 metrekare kullanım alanına ve 3.418 odaya sahiptir. Avrupa'da hâlâ işlevini sürdüren en büyük kraliyet sarayıdır ve kullanım alanı bakımından da en büyüğüdür."
 USoE637B:0 "Versay Sarayı"
 USoE637B_desc:0 "Versay Sarayı, XIV. Louis döneminde 1682'den XVI. Louis döneminde 1789'da Fransız Devrimi'nin başlangıcına kadar Fransa'nın başlıca kraliyet konutuydu. Saray bugün tarihî bir anıt ve UNESCO Dünya Mirası alanıdır; özellikle tören salonu olan Aynalı Salon ve fıskiyeler, kanallar, geometrik çiçek tarhları ve korulukların bulunduğu geniş Versay Bahçeleri ile ünlüdür."
 USoE638B:0 "Buckingham Sarayı"
 USoE638B_desc:0 "Buckingham Sarayı, Birleşik Krallık hükümdarının Londra'daki konutu ve idari merkezidir. Westminster Şehri'nde bulunan saray, sıklıkla devlet törenlerinin ve kraliyet ağırlamalarının merkezindedir. Ulusal sevinç ve yas dönemlerinde İngiliz halkının odak noktası olmuştur."
 USoE639B:0 "Hofburg"
 USoE639B_desc:0 "Hofburg, Habsburg hanedanı hükümdarlarının eski başlıca imparatorluk sarayıdır ve bugün Avusturya Cumhurbaşkanı'nın resmî konutu ve çalışma yeri olarak hizmet vermektedir. Viyana'nın merkezinde yer alan saray 13. yüzyılda inşa edilmiş ve sonrasında birkaç kez genişletilmiştir."
 USoE640B:0 "Sanssouci"
 USoE640B_desc:0 "Sanssouci, Prusya Kralı Büyük Frederick'in Berlin yakınlarındaki Potsdam'da bulunan yazlık sarayıdır. Genellikle Versay'ın Alman rakipleri arasında sayılır. Sanssouci daha samimi Rokoko üslubunda ve Fransız Barok muadilinden çok daha küçük olsa da parkındaki çok sayıda tapınak ve süs yapısıyla dikkat çeker."
 USoE641B:0 "Yeni Bir Saray"
 USoE641B_desc:0 "Yeni bir imparatorun tarihî bir anıta değil, yeni bir saraya ihtiyacı var. Brüksel'de modern mimariye sahip yeni bir saray inşa edelim."
 USoE642B:0 "Taç Giyme Töreni"
 USoE642B_desc:0 "Avrupa'nın yeni İmparatorun taç giyme törenine hazırlanması gerekiyor. Ancak önce imparatorun hangi tacı takacağına ve taç giyme törenini kimin yapacağına karar vermeli."
 USoE643B:0 "İmparatorluk Tacı"
 USoE643B_desc:0 "Yeni imparatorluk Kutsal Roma İmparatorluğu'nun devamı ve mirasıdır; bu yüzden imparatorun Kutsal Roma İmparatorluğu Tacı'nı takması gerekir."
 USoE644B:0 "Yeni Bir Ekümenik Taç"
 USoE644B_desc:0 "Yeni bir imparatorluk ve yeni bir imparatorun tarihî bir kalıntıya değil, yeni bir taca ihtiyacı var."
 USoE645B:0 "Papa Tarafından"
 USoE645B_desc:0 "Tanrı'nın lütfuyla yeni imparatorun Papa tarafından taç giydirilmesi gerekir."
 USoE646B:0 "Halk Tarafından"
 USoE646B_desc:0 "Yeni İmparatorun halk tarafından taç giydirilmesi gerekir; Majestelerinin yönetimini meşrulaştırmak için bir seçim yapalım."
 USoE647B:0 "Kutsal Avrupa İmparatorluğu"
 USoE647B_desc:0 "İmparator taç giydi ve Kutsal Avrupa İmparatorluğu kuruldu."
 USoE700B:0 "Pax Occidentalis"
 USoE700B_desc:0 "Avrupa küresel hâkimiyet kazandı ve dünya barışını dayatabiliyor. Bu döneme Pax Occidentalis denecek."
 USoE701B:0 "Dünya Barışının Muhafızları"
 USoE701B_desc:0 "Avrupa, Amerika, Rusya ve Çin nüfuz alanlarını belirledi. Her süper güç kendi alanında barışı sağlıyor ve böylece dünya barışının muhafızları oluyorlar."
 EU001A:0 "AB Politikaları"
 EU001A_desc:0 "§Y[EUU.GetFlag] AB'nin§! politikaları Birliğin değerleri, hedefleri ve ilkeleriyle belirlenir. AB bir ekonomik topluluk olarak başladığı için ekonomi politikası AB'de hâlâ önemli bir alandır. AB, değerlerine uygun olarak vatandaşlarının refahını, güvenliğini ve çıkarlarını gözetmeye çalışır. AB ekonominin istikrarlı ve rekabetçi kalmasını ister ve kendini sürekli reforme etmeye çalışır..."
 EU002A:0 "AB Adaylığı"
 EU002A_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'ne§! üyelik başvurusu yapmadan önce AB aday ülke statüsü almamız gerekiyor. §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleriyle zorlu müzakereler olacak ve çok fazla etkiye ihtiyacımız olacak."
 EU100A:0 "AB Reformları"
 EU100A_desc:0 "Üye devletler, Avrupa bütünleşmesini güçlendirmek için §Y[EUU.GetFlag] Avrupa Birliği'ni§! reforme etmeye çalışıyor."
 EU101A:0 "Avrupa Birliği Temel Haklar Şartı"
 EU101A_desc:0 "\"Avrupa halkları, aralarında giderek daha sıkı bir birlik oluştururken ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik, insan onuru, özgürlük, eşitlik ve dayanışmanın bölünmez ve evrensel değerleri üzerine kuruludur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.\" - Temel Haklar Şartı'nın Başlangıcı"
 EU102A:0 "Avrupa Konvansiyonu"
 EU102A_desc:0 "Laeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaş için daha sade, temel hedeflerine ulaşmada daha güçlü ve dünyada daha belirgin bir Birlik yolunda kararlı bir adım atmak üzere Birliğin geleceğine ilişkin bir Konvansiyon toplamaya karar verdi."
 EU103A:0 "Avrupa Anayasası"
 EU103A_desc:0 "Avrupa Konvansiyonu, Avrupa İçin Bir Anayasa Oluşturan Antlaşma Taslağı ile sonuçlandı. Bu uluslararası antlaşma, §Y[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturmak üzere mevcut Avrupa antlaşmalarının yerini alacak ve nitelikli çoğunluk oylamasını daha önce üye devletler arasında oybirliğiyle karar verilen politika alanlarına genişletecekti."
 EU104A:0 "Lizbon Antlaşması"
 EU104A_desc:0 "Lizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onay sürecinin olumsuz sonuçlanmasının bir sonucudur. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirmiştir; ikincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilmiştir."
 EU105A:0 "Avrupa Dış Eylem Servisi"
 EU105A_desc:0 "Avrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dışişleri ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU200A:0 "AB Maliye Politikaları"
 EU200A_desc:0 "Maliye politikaları ekonomik büyüme, makroekonomik istikrar ve enflasyon üzerinde önemli bir etkiye sahiptir. Bu bakımdan kilit unsurlar kamu harcama ve gelirlerinin düzeyi ve bileşimi, bütçe açıkları ve kamu borcudur. Maliye politikalarının sorumluluğunu elinde tutan egemen devletlerden oluşan avro bölgesi gibi bir para birliğinde mali disiplin ihtiyacı daha da güçlüdür."
 EU201A:0 "ECB Müdahalesi"
 EU201A_desc:0 "ECB Yönetim Konseyi, para politikası kararlarını uygulamak için Avrosistem para politikası araçları ve prosedürlerine ilişkin Genel Belgeler'de belirtilen bir dizi para politikası aracı ve prosedürü benimsemiştir."
 EU202A:0 "Avrupa Bankacılık Birliği"
 EU202A_desc:0 "Son finansal krize yanıt olarak tek pazar için daha güvenli bir finans sektörü oluşturmak amacıyla Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üye devletlerindeki tüm finansal aktörler için tek bir kural kitabı oluşturur. Bankalar için daha sıkı ihtiyati gereklilikler, mevduat sahipleri için daha iyi koruma ve batık bankaların yönetimine ilişkin kurallar içerir."
 EU203A:0 "Avro Tahvilleri"
 EU203A_desc:0 "Avro tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, para birliğinin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasıyla boy ölçüşebilecek bir avro tahvili piyasası kurarak hükümetlerin borçlarını finanse etmesi için yeni araçlar yaratır."
 EU204A:0 "Avrupa Finansal İstikrar Fonu (EFSF)"
 EU204A_desc:0 "EFSF, Avrupa borç krizinde avro bölgesi üye devletleri tarafından geçici bir kriz çözüm mekanizması olarak kuruldu ve birçok üye devlete mali yardım sağladı. Bu yardım, EFSF tarafından sermaye piyasalarında ihraç edilen EFSF tahvilleri ve diğer borçlanma araçlarıyla finanse edildi. EFSF artık başka mali yardım sağlamamaktadır; bu görev artık yalnızca ESM tarafından yürütülmektedir."
 EU205A:0 "Avrupa İstikrar Mekanizması (ESM)"
 EU205A_desc:0 "ESM'nin görevi, ciddi finansman sorunları yaşayan veya bu tehditle karşı karşıya kalan avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM üyelerinin finansal istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU206A:0 "Mali Birlik"
 EU206A_desc:0 "Mali birlik, üye devletlerin ortak bir bütçeyi paylaşmasını içerir. Bu, harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirlenmesi anlamına gelir. Mali birlik, Avrupa bütünleşmesinin bir sonraki adımı olarak önerilmektedir ve tüm üye devletler için harcama ve vergi oranlarını merkezi bir Avrupa otoritesinin belirlemesi anlamına gelir."
 EU207A:0 "Avrupa Ekonomik Hükümeti"
 EU207A_desc:0 "Bir Avrupa Ekonomik Hükümeti, AB'de ortak bir maliye ve aktif ekonomi politikasını mümkün kılar. §Y[EUU.GetFlag] Avrupa Birliği'ne§! kendi vergi otoritesini kazandırır ve üye devletler için asgari ücretleri merkezi bir otorite belirler."
 EU208A:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU208A_desc:0 "Bir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükümeti ile oluşturulan politika ve yetkileri tek bir makamda birleştirir."
 EU300A:0 "AB Savunma Politikaları"
 EU300A_desc:0 "Ortak Güvenlik ve Savunma Politikası (OGSP), Birliğin barışı koruma operasyonlarında, çatışmaların önlenmesinde ve uluslararası güvenliğin güçlendirilmesinde öncü bir rol üstlenmesini sağlar. Sivil ve askeri imkânlardan yararlanan OGSP, AB'nin kriz yönetimine yönelik kapsamlı yaklaşımının ayrılmaz bir parçasıdır."
 EU301A:0 "Avrupa Savunma Ajansı (EDA)"
 EU301A_desc:0 "Avrupa Savunma Ajansı, üye devletleri ve §Y[EUU.GetFlag] Avrupa Birliği'ni§! kriz yönetimi alanında Avrupa savunma kabiliyetlerini geliştirme ve Avrupa Güvenlik ve Savunma Politikası'nı bugünkü hâliyle ve gelecekteki gelişimiyle sürdürme çabalarında desteklemek amacıyla kuruldu."
 EU302A:0 "Daimi Yapılandırılmış İşbirliği (PESCO)"
 EU302A_desc:0 "PESCO, istekli ve muktedir üye devletlerin ortak kabiliyet projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına imkân tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu kabiliyetleri ulusal ve çok uluslu görev ve operasyonlar için üye devletlerin kullanımına sunmaktır."
 EU303A:0 "Avrupa Savunma Fonu"
 EU303A_desc:0 "Avrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine ve vatandaşlarının korunup savunulmasına kilit bir katkı sağlayacak. Yeniliği teşvik etmek ve son teknoloji savunma teknolojileri ve ürünleri geliştirmek için şirketler arasında ve AB ülkeleri arasında savunma işbirliğini destekleyecek. Fon, savunmaya yapılan ulusal yatırımları koordine edecek, tamamlayacak ve güçlendirecek."
 EU304A:0 "Avrupa Güvenlik Konseyi"
 EU304A_desc:0 "Bir Avrupa Güvenlik Konseyi, AB'yi uluslararası siyasette karar almaya daha hazırlıklı hâle getirir. AB tutarlı kararları daha hızlı alıp uygulamayı başaramazsa, AB kurallarını uygulama ve çok taraflı yapıları güçlendirme kabiliyeti zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükümetlerarası işbirliği formatıyla desteklenmelidir."
 EU305A:0 "Avrupa Ordusu"
 EU305A_desc:0 "Üye devletler, §Y[EUU.GetFlag] Avrupa Birliği'nin§! askeri kabiliyetlerini güçlendirmek için ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvrupa Ordusu§! olarak bilinecektir."
 EU306A:0 "Avrupa Donanması"
 EU306A_desc:0 "21. yüzyılda çok uluslu filolar ve görev kuvvetleri giderek yaygınlaşıp önem kazanırken §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri güçlerini birleştirip savaş gemilerini §YAvrupa Donanması§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU307A:0 "BM Güvenlik Konseyi'nde AB Daimi Üyeliği"
 EU307A_desc:0 "Üye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olmasına karar verdi. Bu, BMGK'nın reforme edilmesiyle ya da hâlihazırda BMGK üyesi olan üye devlet(ler)in koltuğunun AB'ye devredilmesiyle gerçekleştirilir."
 EU308A:0 "AB Nükleer Gücü"
 EU308A_desc:0 "Nükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki etkisini artıracaktır. Birlik, nükleer silahları üye devletlerinin nükleer silahlarını devralıp paylaşarak ya da kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU400A:0 "AB İkincil Mevzuatı"
 EU400A_desc:0 "AB antlaşmaları, AB üye devletleri arasında AB'nin hedeflerini, AB kurumlarına ilişkin kuralları, kararların nasıl alınacağını ve AB ile üyeleri arasındaki ilişkiyi belirleyen bağlayıcı anlaşmalardır. Antlaşmalar birincil hukuk olarak bilinir. Antlaşmaların ilke ve hedeflerinden doğan hukuk bütünü ise ikincil hukuk (tüzükler, yönergeler, kararlar, tavsiyeler ve görüşler) olarak bilinir."
 EU401A:0 "Genel Veri Koruma Tüzüğü"
 EU401A_desc:0 "AB Genel Veri Koruma Tüzüğü (GDPR), Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek amacıyla tasarlanmıştır."
 EU402A:0 "Dijital Tek Pazarda Telif Hakkı Yönergesi"
 EU402A_desc:0 "Dijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU403A:0 "Dublin II Tüzüğü"
 EU403A_desc:0 "Dublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini belirler. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve aynı kişinin birden fazla sığınma başvurusu yaparak sistemi kötüye kullanmasının önüne geçmektir."
 EU404A:0 "Sığınmacıların Yeniden Yerleştirilmesi ve İskânı"
 EU404A_desc:0 "Başvurularının olumlu sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan başvurularının işleme alınacağı diğer üye devletlere yeniden yerleştirilir. Başvurular olumlu sonuçlanırsa başvuru sahiplerine, yerleştirildikleri üye devlette ikamet hakkıyla birlikte mülteci statüsü verilir."
 EU405A:0 "AB-Türkiye Mutabakatı"
 EU405A_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye üzerinden Avrupa'ya yönelik düzensiz göç akışını durdurmayı amaçlayan bir anlaşma için müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye iade edilecek. §Y[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler İçin Mali Yardım Programı'na 3 milyar avro ödeyecek."
 EU406A:0 "Avrupa Sığınma Ajansı"
 EU406A_desc:0 "AB Komisyonu, sığınma süreci boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali imkânlarla donatılmış bir AB Sığınma Ajansı kurulmasını önerdi."
 EU407A:0 "Frontex"
 EU407A_desc:0 "Frontex, AB ülkelerine ve Schengen'e bağlı ülkelere dış sınırlarını yönetmede yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır yetkilileri arasındaki işbirliğini kolaylaştırır, teknik destek ve uzmanlık sağlar."
 EU408A:0 "Avrupa Sınır ve Sahil Güvenlik Ajansı"
 EU408A_desc:0 "Frontex, Avrupa Sınır ve Sahil Güvenlik Ajansı'na dönüşüyor. Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa sahne oldu. Dış sınırı olan ülkeler sınır kontrolünden tek başına sorumludur; ancak Frontex ciddi göç baskısıyla karşı karşıya kalan AB ülkelerine ek teknik destek sağlayabilir."
 EU500A:0 "Avrupa Komisyonu Politikaları"
 EU500A_desc:0 "Avrupa Komisyonu Politikaları"
 EU600A:0 "AB Genişlemesi"
 EU600A_desc:0 "Genişleme politikası, AB'ye katılmak isteyen ülkeler ve potansiyel adaylar için geçerlidir. Üyelik perspektifi, AB üyesi olmak isteyen ülkelerde demokratik ve ekonomik reformlar için güçlü bir teşviktir."
 EU601A:0 "Avrupa Birliği'nin 2004 Genişlemesi"
 EU601A_desc:0 "1 Mayıs 2004'te toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), bir eski Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) kapsıyor."
 EU602A:0 "Avrupa Birliği'nin 2007 Genişlemesi"
 EU602A_desc:0 "Doğu Avrupa'dan iki ülke daha, §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§!, AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU603A:0 "Avrupa Birliği'nin 2013 Genişlemesi"
 EU603A_desc:0 "2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katılarak üye devlet sayısını 28'e çıkardı."
 EU700A:0 "Ayrılma Politikaları"
 EU700A_desc:0 "Birlik genelinde yükselen Avrupa şüpheciliğiyle birlikte bazı üye devletler §Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmayı düşünecek."
 EU701A:0 "50. Madde"
 EU701A_desc:0 "\"Her Üye Devlet, kendi anayasal kurallarına uygun olarak Birlikten ayrılmaya karar verebilir.\"\n- Avrupa Birliği Antlaşması, Madde 50(1).\n50. Madde ilk olarak Avrupa Birliği Anayasal Antlaşması için kaleme alındı. Anayasanın onaylanamamasının ardından madde Lizbon Antlaşması'na dahil edildi."
 EU702A:0 "Ayrılma Antlaşması"
 EU702A_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmak, ayrılan ülkenin AB hukukunun geçerliliğini yitireceği döneme göre ulusal hukukunu uyarlamak zorunda olduğu karmaşık bir süreçtir. Ayrılan ülke ile §Y[EUU.GetFlag] Avrupa Birliği§! gelecekteki ilişkileri konusunda bir anlaşmaya varmak zorundadır."
 EU703A:0 "Anlaşmasız Çıkış"
 EU703A_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ile bir Ayrılma Antlaşması'na varılamazsa, halkımızı Anlaşmasız Çıkış'ın kaosundan korumak için acil önlemler alınmalıdır."
 EU110A:0 "Avrupa Birliği'nin Federalleşmesi"
 EU110A_desc:0 "Avrupa bütünleşme süreci, daha fazla bütünleşmenin §Y[EUU.GetFlag] Avrupa Birliği'nin§! Federalleşmesine yol açacağı bir noktaya ulaştı."
 EU111A:0 "Avrupa Birleşik Devletleri"
 EU111A_desc:0 "70 yılı aşkın Avrupa bütünleşmesinin ardından §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri egemenliklerinden vazgeçerek §Y[EUU.GetFlag] Avrupa Birleşik Devletleri'ni§! kurmaya karar verdi."
 EU112A:0 "Avrupa Federasyonu"
 EU112A_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri, nitelikli çoğunluk oylamasını temel ilke olarak benimseyen ve §YAvrupa Federasyonu Başkanı§! tarafından yönetilen §Y[EUU.GetFlag] Avrupa Federasyonu'na§! Birliği dönüştürmeye karar verdi."
 EU113A:0 "Anavatanlar Avrupası"
 EU113A_desc:0 "Daha fazla Avrupa bütünleşmesi, üye devletlerin kültürel mirasını, ulusal kimliklerini ve egemenliğini tehlikeye atacaktır. Avrupa, anavatanların Avrupası'dır; bu yüzden Avrupa bütünleşmesi bu aşamada durmalıdır."
 EU604A:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU604A_desc:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU605A:0 "Batı Balkanlar Genişlemesi"
 EU605A_desc:0 "Batı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU606A:0 "Türkiye"
 EU606A_desc:0 "§Y[TUR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU607A:0 "Karadeniz Genişlemesi"
 EU607A_desc:0 "Karadeniz ülkeleri §Y[MLV.GetNameWithFlag]§! ve §Y[UKR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU608A:0 "Kafkasya Genişlemesi"
 EU608A_desc:0 "Kafkas ülkeleri §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! ve §Y[GEO.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU609A:0 "Avrupa Ekonomik Alanı"
 EU609A_desc:0 "Avrupa Ekonomik Alanı'nın AB üyesi olmayan ülkeleri (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! ve §Y[ICE.GetNameWithFlag]§!) §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU610A:0 "Belarus"
 EU610A_desc:0 "§Y[BLR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU611A:0 "İç Genişleme"
 EU611A_desc:0 "İç genişleme, mevcut bir üye devletin dağılması veya ondan ayrılma yoluyla yeni üye devletlerin ortaya çıkması sürecidir. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! ve §Y[WAS.GetNameWithFlag]§! bağımsızlıklarını kazandıklarında §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday olabilir."
 POTEF001A:0 "Avrupa Federasyonu Başkanı"
 POTEF001A_desc:0 "§YAvrupa Federasyonu Başkanı (POTEF)§! Avrupa'nın en üst lideridir. Bu nedenle Avrupa Federasyonu Başkanı, tüm Federasyon için belirleyici stratejik kararları alma yetkisine sahiptir."
 POTEF100A:0 "Alp Doktrini"
 POTEF100A_desc:0 "Alp ülkeleri §Y[AUS.GetNameWithFlag]§! ve §Y[SWI.GetNameWithFlag]§! uzun bir dağ savaşı geleneğine sahiptir. Alp Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF101A:0 "Yaratılışın Bütünlüğü"
 POTEF101A_desc:0 "Avrupa Federasyonu, Yaratılışın Bütünlüğünü korumak ve sürdürmek için politikalarını uyarlıyor."
 POTEF102A:0 "Çevreci Emperyalizm"
 POTEF102A_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF103A:0 "Kuzey Amerika"
 POTEF103A_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF104A:0 "Güney Amerika"
 POTEF104A_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF105A:0 "Avrupa"
 POTEF105A_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF106A:0 "Afrika"
 POTEF106A_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF107A:0 "Orta Doğu"
 POTEF107A_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF108A:0 "Asya"
 POTEF108A_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF109A:0 "Okyanusya"
 POTEF109A_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF110A:0 "Pasifik"
 POTEF110A_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF150A:0 "Alman Doktrini"
 POTEF150A_desc:0 "§Y[GER.GetNameWithFlag]§! geleneksel olarak güçlü zırhlı kuvvetlere odaklanmıştır. Zırhlı Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF151A:0 "Ticaret İmparatorluğu"
 POTEF151A_desc:0 "Avrupa Federasyonu bir Ticaret İmparatorluğu olacak."
 POTEF200A:0 "Fransız Doktrini"
 POTEF200A_desc:0 "§Y[FRA.GetNameWithFlag]§! geleneksel olarak yüksek hareket kabiliyetine sahip hafif zırhlı ve motorlu kuvvetlere odaklanmıştır. Manevra Savaşı Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF201A:0 "İmparatorluk Gücü"
 POTEF201A_desc:0 "Avrupa Federasyonu, imparatorluk öncüllerinin geleneğini sürdürüyor."
 POTEF202A:0 "Özgürlük İmparatorluğu"
 POTEF202A_desc:0 "Avrupa Federasyonu bir Özgürlük İmparatorluğu olacak."
 POTEF203A:0 "Amerika: Müttefik mi, Hasım mı?"
 POTEF203A_desc:0 "Amerika ve Avrupa, 20. yüzyılın büyük bölümünde müttefikti. §Y[USA.GetNameWithFlag]§! ülkesindeki son siyasi değişikliklerle bu durum sorgulanır oldu…"
 POTEF204A:0 "NATO Mirası"
 POTEF204A_desc:0 "NATO'nun barışı koruma mirası geleneğinde §Y[USA.GetNameWithFlag]§! ve §YEDU§! yeni bir ittifak kuruyor."
 POTEF205A:0 "Trump'ın Mirası"
 POTEF205A_desc:0 "§Y[USA.GetNameWithFlag]§! müttefiklikten hasımlığa geçti. Avrupa bu belirleyici stratejik değişime karşılık vermek zorunda."
 POTEF206A:0 "Duvarı Yık"
 POTEF206A_desc:0 "Avrupa egemenliğine yönelik Amerikan tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[MEX.GetNameWithFlag]§! ile ittifak kurup §Y[USA.GetNameWithFlag]§! ülkesini güneyden işgal etmeye yönelik bir plan hazırladı."
 POTEF207A:0 "Buster'ın Dirilişi"
 POTEF207A_desc:0 "ABD'nin Avrupa'ya yönelik tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[CAN.GetNameWithFlag]§! ile ittifak kurup 1 No'lu Savunma Planı'nı revize etmeyi önerdi. Bu plan, Kanadalı Yarbay James 'Buster' Sutherland Brown tarafından ABD ile Britanya İmparatorluğu arasında yakın bir çatışma durumunda Kanada'nın ABD'ye önleyici bir saldırı düzenlemesi için hazırlanmıştı. Bu planla §YEDU§!, §Y[USA.GetFlag] ABD'yi§! kuzeyden işgal edebilir."
 POTEF250A:0 "Benelüks Doktrini"
 POTEF250A_desc:0 "Soğuk Savaş'ın ardından §YAlçak Ülkeler§! yeni duruma uyum sağlamak için havadan hareketli kuvvetlere odaklandı. Havadan Hareket Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF251A:0 "Liberal Miras"
 POTEF251A_desc:0 "Avrupa Federasyonu Liberal Mirasını onurlandırıyor."
 POTEF252A:0 "Eski Ticaret Yollarını Güvenceye Al"
 POTEF252A_desc:0 "Avrupa Federasyonu'nun Karayipler'e, Afrika'ya ve eski Hollanda Doğu Hint Adaları'na uzanan eski ticaret yollarını güvenceye alması gerekiyor."
 POTEF253A:0 "Endonezya"
 POTEF253A_desc:0 "Avrupa Federasyonu'nun eski Hollanda sömürgesi §Y[IND.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF300A:0 "İber Doktrini"
 POTEF300A_desc:0 "§YIberya ülkeleri§! geleneksel olarak güçlü deniz piyadesi kuvvetlerine odaklanmıştır. Deniz Piyadesi Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF301A:0 "Latin Kuzenler"
 POTEF301A_desc:0 "Avrupa Federasyonu'nun Güney Amerika'daki eski sömürgelerle ilişkilerini geliştirmesi gerekiyor."
 POTEF302A:0 "Meksika"
 POTEF302A_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[MEX.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Orta Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF303A:0 "Büyük Kolombiya"
 POTEF303A_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[COL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF304A:0 "Orta Amerika"
 POTEF304A_desc:0 "Avrupa Federasyonu'nun §YOrta Amerika'daki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF305A:0 "Güney Koni"
 POTEF305A_desc:0 "Avrupa Federasyonu'nun §YGüney Amerika'nın Güney Konisi'ndeki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF306A:0 "Brezilya"
 POTEF306A_desc:0 "Avrupa Federasyonu'nun eski Portekiz sömürgesi §Y[BRA.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF350A:0 "İngiliz Doktrini"
 POTEF350A_desc:0 "§YBritanya§! geleneksel olarak güçlü bir donanmaya odaklanmıştır. Deniz Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF351A:0 "Kuzey Atlantik'i Güvenceye Al"
 POTEF351A_desc:0 "Denizlerin özgürlüğünü ve serbest ticareti güvence altına almak için Avrupa Federasyonu'nun Kuzey Atlantik'i kontrol etmesi gerekiyor."
 POTEF352A:0 "Milletler Topluluğu Mirası"
 POTEF352A_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması ve eski İngiliz dominyonlarıyla ilişkilerini geliştirmesi gerekiyor."
 POTEF353A:0 "Kanada"
 POTEF353A_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[CAN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF354A:0 "Avustralya"
 POTEF354A_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[AST.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF355A:0 "Yeni Zelanda"
 POTEF355A_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[NZL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF356A:0 "Kuzey Denizi'ni Güvenceye Al"
 POTEF356A_desc:0 "Kuzey Denizi, Avrupa Federasyonu'nun arka bahçesidir ve güvence altına alınması gerekir."
 POTEF357A:0 "Malaya Mirası"
 POTEF357A_desc:0 "Avrupa Federasyonu'nun Malaya'daki eski İngiliz sömürgeleriyle ilişkilerini geliştirmesi gerekiyor."
 POTEF358A:0 "Malezya"
 POTEF358A_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[MAY.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF359A:0 "Singapur"
 POTEF359A_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[SIN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF360A:0 "Hong Kong'a Garanti Ver"
 POTEF360A_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[HKG.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Çin-İngiltere Ortak Bildirisi'ndeki özgürlükleri güvence altına alması gerekiyor."
 POTEF400A:0 "İskandinav Doktrini"
 POTEF400A_desc:0 "§YSkandinav ülkeleri§! geleneksel olarak Arktik'te savaşmaya odaklanmıştır. İskandinav Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF401A:0 "Arktik'i Güvenceye Al"
 POTEF401A_desc:0 "Denizlerin özgürlüğünü ve jeostratejik konumunu güvence altına almak için Avrupa Federasyonu'nun Arktik'i kontrol etmesi gerekiyor."
 POTEF450A:0 "Akdeniz Doktrini"
 POTEF450A_desc:0 "§YAkdeniz ülkeleri§! geleneksel olarak denizden çıkarma taktiklerine odaklanmıştır. Amfibi Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF451A:0 "Kuzey Afrika"
 POTEF451A_desc:0 "Bir yakınsama bölgesi ve mülteciler için güvenli bir liman oluşturmak amacıyla Avrupa Federasyonu'nun §YKuzey Afrika§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF452A:0 "Kıbrıs'ı Birleştir"
 POTEF452A_desc:0 "Avrupa Federasyonu'nun egemen bir üye devleti olarak §Y[CYP.GetNameWithFlag]§! yeniden birleştirilmelidir."
 POTEF500A:0 "Balkan Doktrini"
 POTEF500A_desc:0 "§YBalkan ülkeleri§! geleneksel olarak partizan kuvvetlere odaklanmıştır. Partizan Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF501A:0 "Balkan Altyapısı"
 POTEF501A_desc:0 "Avrupa Federasyonu'nun bölgesel barışı korumak ve Balkanları yabancı etkiden korumak için Balkanların altyapısını geliştirmesi gerekiyor."
 POTEF502A:0 "İpek Yolu'na Meydan Oku"
 POTEF502A_desc:0 "Avrupa Federasyonu'nun Çin'in yeni İpek Yolu'na meydan okuması ve Orta Asya'daki Çin etkisini azaltması gerekiyor."
 POTEF503A:0 "Rakip Çin"
 POTEF503A_desc:0 "§Y[CHI.GetNameWithFlag]§! küresel düzeyde Avrupa Federasyonu'nun başlıca rakiplerinden biri hâline geldi. Avrupa Federasyonu'nun politikalarını buna göre uyarlaması gerekiyor."
 POTEF504A:0 "Ok Harekâtı"
 POTEF504A_desc:0 "Adını Ok Savaşı'ndan (İkinci İngiliz-Çin Savaşı) alan Ok Harekâtı, Çin'in yayılmacı politikasını durdurmak için §Y[CHI.GetNameWithFlag]§! ülkesine Avrupa müdahalesini öngören bir plandır."
 POTEF505A:0 "Asyalı Müttefikler"
 POTEF505A_desc:0 "§Y[CHI.GetNameWithFlag]§! ile yüzleşmek için Avrupa Federasyonu'nun Asya'da müttefiklere ihtiyacı var."
 POTEF506A:0 "Kore Cumhuriyeti"
 POTEF506A_desc:0 "§Y[KOR.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF507A:0 "Japonya"
 POTEF507A_desc:0 "§Y[JAP.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF550A:0 "Karadeniz Doktrini"
 POTEF550A_desc:0 "Soğuk Savaş'ın ardından §YKaradeniz ülkeleri§! yeni duruma uyum sağlamak için hareketli hava savunma kuvvetlerine odaklandı. Hava Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF551A:0 "Karadeniz'i Güvenceye Al"
 POTEF551A_desc:0 "Karadeniz, Avrupa Federasyonu'nu Kafkasya'ya ve güneydoğudaki üye devletlerine bağlar. Bu nedenle güvence altına alınması gerekir."
 POTEF552A:0 "Ayrılıkçı Cumhuriyetleri Yeniden Entegre Et"
 POTEF552A_desc:0 "§Y[SOV.GetNameWithFlag]§!, ayrılıkçı hareketleri destekleyip ayrılıkçı cumhuriyetler kurarak Avrupa Federasyonu'nun çeşitli doğu üye devletlerinin egemenliğini ihlal etti. Bu Rus kuklalarını yeniden entegre etmemiz gerekiyor."
 POTEF553A:0 "Rakip Rusya"
 POTEF553A_desc:0 "§Y[SOV.GetNameWithFlag]§! Avrupa Federasyonu'nun başlıca rakiplerinden biri oldu. Ona yaptırımlar uygulamamız gerekiyor."
 POTEF554A:0 "Şarlman Harekâtı"
 POTEF554A_desc:0 "Adını 'Avrupa'nın Babası' (Pater Europae) olarak anılan efsanevi imparator Şarlman'dan alan Şarlman Harekâtı, §Y[SOV.GetNameWithFlag]§! ülkesine karşı önleyici meşru müdafaa planıdır. Bu harekâtla §YEDU§!, Avrupa egemenliğine yönelik bu tehdidi ortadan kaldırmak için §Y[SOV.GetNameWithFlag]§! ülkesine önleyici bir işgal başlatabilir."
 POTEF600A:0 "Kafkasya Doktrini"
 POTEF600A_desc:0 "Soğuk Savaş'ın ardından §YKafkasya bölgesi ülkeleri§! yeni duruma uyum sağlamak için güçlü bir savunmaya odaklandı. Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF601A:0 "Avrupa Erişimi"
 POTEF601A_desc:0 "Avrupa Federasyonu'nun Kafkasya'ya ve güneydoğudaki üye devletlerine erişime ihtiyacı var. Bu nedenle yeni deniz üsleri ve altyapı inşa edilmesi gerekiyor."
 POTEF650A:0 "Vişegrad Doktrini"
 POTEF650A_desc:0 "§YVişegrad ülkeleri§! geleneksel olarak güçlü topçu kuvvetlerine odaklanmıştır. Topçu Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF651A:0 "Avrupa Hava Savunma Ağı"
 POTEF651A_desc:0 "Avrupa Federasyonu'nun doğu kanadını güvence altına almak için bir hava savunma ağı kurması gerekiyor."
 POTEF652A:0 "Doğu Güvenlik Duvarı"
 POTEF652A_desc:0 "§Y[SOV.GetNameWithFlag]§! ülkesinin doğudaki üye devletlerde artan etkisine karşı koyulması gerekiyor."
 POTEF700A:0 "Baltık Doktrini"
 POTEF700A_desc:0 "§YBaltık ülkeleri§! geleneksel olarak küçük ve son derece yetenekli özel kuvvetlere odaklanmıştır. Özel Kuvvetler Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF701A:0 "Baltık Denizi'ni Güvenceye Al"
 POTEF701A_desc:0 "Baltık Denizi, Avrupa Federasyonu'nun iç denizidir ve güvence altına alınması gerekir."
 POTEF800A:0 "Pax Europaea"
 POTEF800A_desc:0 "Avrupa Federasyonu'nun dünya barışını sağlamak için küresel süper güç olması gerekiyor."
 USoE001A:0 "Yeni Avrupa Milletini Kur"
 USoE001A_desc:0 "Birleşik Avrupa Birliği'nin kendini yeni bir millet olarak kurması gerekiyor. Anayasa ve Birleşme Antlaşmaları bir şey; ama şimdi halkın bu yasal çerçeveyi hayatla doldurması gerekiyor."
 USoE002A:0 "Avrupa Subay Kolordusu"
 USoE002A_desc:0 "Birlik döneminde her üye devletin kendi ordusu vardı, daha sonra da Avrupa Ordusu kuruldu. Ortak doktrin ve eğitime sahip bir Avrupa Subay Kolordusu oluşturmamız gerekiyor."
 USoE003A:0 "Avrupa Siyasi Partileri"
 USoE003A_desc:0 "Yeni bir millet yeni siyasi partilere ihtiyaç duyar. Üye devletlerin eski siyasi partileri birleşmek zorunda."
 USoE004A:0 "Avrupa Vatanseverliği"
 USoE004A_desc:0 "Yeni bir millet kendi vatanseverliğine ve ulusal sembollerine ihtiyaç duyar."
 USoE005A:0 "Yeni Büyük Oyun"
 USoE005A_desc:0 "Yeni Büyük Oyun daha yeni başladı ve Avrupa geç kaldı; ABD, Çin ve Rusya ise ilk hamlelerini çoktan yaptı."
 USoE006A:0 "Avrupa'nın Kalbi ve Ruhu"
 USoE006A_desc:0 "Yeni milletin değerlerini ve standartlarını tanımlaması gerekiyor. Avrupa'nın bir Kalbe ve Ruha ihtiyacı var!"
 USoE100A:0 "Nüfuz Alanları Oyunu"
 USoE100A_desc:0 "Nüfuz alanları oyununu oynadığında ya kazanırsın ya ölürsün. Orta yolu yoktur."
 USoE101A:0 "Kartalla Hesaplaş"
 USoE101A_desc:0 "Amerikan Kartalı yere indirilmeli! Avrupa semalarında fazlasıyla uzun süre uçtu."
 USoE102A:0 "Ayıyla Kapış"
 USoE102A_desc:0 "Ayı bize saldırmadan önce biz ona saldırmalıyız."
 USoE103A:0 "Ejderhayla Dans"
 USoE103A_desc:0 "Ejderhayla Dans tehlikeli bir oyundur."
 USoE104A:0 "Demirden Bir Kalp"
 USoE104A_desc:0 "Eski zamanlarda demirciler, yenilen kötülerin silahlarından demir bir taht döverlerdi. Günümüzde ise sadece Avrupa'nın demirden kalbini kanıtladığını ve artık dünyanın tartışmasız hâkimi olduğunu ilan ediyoruz!"
 USoE200A:0 "Barış İçinde Bir Arada Yaşam"
 USoE200A_desc:0 "Demirden daha keskin kılıçlar vardır. Parayla ödeyebilecekken neden kanla ödeyesin?"
 USoE201A:0 "Önce Amerika"
 USoE201A_desc:0 "Kendi doktrinlerimize saygı duyulmasını istiyorsak Önce Amerika doktrinine saygı duymalıyız."
 USoE202A:0 "Rus Nüfuz Alanı"
 USoE202A_desc:0 "Rusya tüm Rus halkının koruyucusudur. Bu, saygı duymamız gereken onların nüfuz alanıdır."
 USoE203A:0 "Çin Nüfuz Alanı"
 USoE203A_desc:0 "Çin'in nüfuz alanı Güneydoğu Asya'yı kapsar ve bizi rahatsız etmez. Çin bizim ticaret ortağımızdır, rakibimiz değil."
 USoE204A:0 "Avrupa Nüfuz Alanı"
 USoE204A_desc:0 "21. yüzyılın tüm süper güçlerini yatıştırdık; artık Avrupa, Levant ve Kuzey Afrika'da Avrupa Nüfuz Alanı'nı kurmak için elimiz serbest."
 USoE300A:0 "Medeniyetler Çatışması"
 USoE300A_desc:0 "Medeniyetler Çatışması, Amerikalı siyaset bilimci Samuel P. Huntington'ın Soğuk Savaş sonrası dünyada insanların kültürel ve dinî kimliklerinin başlıca çatışma kaynağı olacağını öne süren tezidir. Gelecekteki savaşlar ülkeler arasında değil, kültürler arasında yaşanacaktır."
 USoE301A:0 "Batı'nın Geri Kalanı"
 USoE301A_desc:0 "Avrupa, Batı'nın geri kalanıdır. Amerika, Önce Amerika doktriniyle bizi yalnız ve tecrit edilmiş bıraktı."
 USoE302A:0 "Haç ve Hilal"
 USoE302A_desc:0 "Avrupa'nın güneydoğu sınırında haç ile hilal çatışıyor. Kim galip gelecek: Batı medeniyeti mi, İslam medeniyeti mi?"
 USoE303A:0 "Papa ve Patrik"
 USoE303A_desc:0 "1054'teki Büyük Ayrılık'tan bu yana Papa ile Ortodoks Patrik farklı yollara gitti. Batı medeniyetini savunmak için yeniden birleşme zamanı geldi."
 USoE304A:0 "İki Haç"
 USoE304A_desc:0 "Doğu ve Batı Hristiyanlığının İslam'a karşı birleşmesi gerekiyor."
 USoE305A:0 "Avrasya İttifakı"
 USoE305A_desc:0 "NATO'nun dağılmasının ardından Avrupa, Rus komşusuyla yeni ve büyük bir ittifak kurabilir."
 USoE306A:0 "Konstantinopolis"
 USoE306A_desc:0 "Konstantinopolis Batı'nın bir parçasıdır. Avrupa'nın onu İslam etkisinden kurtarması gerekiyor."
 USoE307A:0 "Antakya"
 USoE307A_desc:0 "Antakya Prinkepsliği, Birinci Haçlı Seferi sırasında kurulan Haçlı devletlerinden biriydi. Batı'ya aittir ve bir kez daha İslam'dan arındırılmalıdır."
 USoE308A:0 "Trablus"
 USoE308A_desc:0 "Trablus Kontluğu (1109–1289) Haçlı devletlerinin sonuncusuydu. Yeniden yükselmeli. Avrupa'nın Levant'ı İslam'dan kurtarması gerekiyor."
 USoE309A:0 "Kudüs"
 USoE309A_desc:0 "Avrupa'nın Kutsal Şehri İslam etkisinden kurtarması gerekiyor. Kudüs Krallığı kutsal mekânları bir kez daha koruyacak."
 USoE310A:0 "Malta Şövalyeleri"
 USoE310A_desc:0 "Avrupa'nın Kuzey Afrika'yı İslam etkisinden kurtarması gerekiyor. Avrupa, Malta Şövalyeleri'nin örneğini izleyecek."
 USoE311A:0 "Arabistan'ın Batılılaşması"
 USoE311A_desc:0 "Arap Yarımadası'ndaki bazı ülkelerin Batı ile zaten yakın bağları var. Güvenli bir komşuluğa sahip olmak için Avrupa'nın Arap Yarımadası'nı tamamen Batılılaştırması gerekiyor."
 USoE312A:0 "Hindistan'ın Batılılaşması"
 USoE312A_desc:0 "Sömürge mirası sayesinde Hindistan'ın Batı ile geleneksel olarak yakın bağları var. Avrupa, Hindistan'ı tamamen Batılılaştırmak için bu ilişkiyi derinleştirmeli."
 USoE313A:0 "İran Cumhuriyeti"
 USoE313A_desc:0 "İran, Orta Doğu'da Batı'nın başlıca rakiplerinden biridir. Avrupa, İran'ı Batılılaştırıp İran Cumhuriyeti'ne dönüştürerek onun bölgesel hegemonya arayışını durdurabilir."
 USoE320A:0 "Batı ve Diğerleri"
 USoE320A_desc:0 "Avrupa ve Amerika, dünyadaki her düşmana kafa tutabilecek Batılı süper güçlerdir. NATO'yu temel alarak Batı küresel hâkimiyetini dayatabilir."
 USoE321A:0 "Asya'nın Batılılaşması"
 USoE321A_desc:0 "Batı'nın Asya'daki yükselen güçlere odaklanması gerekiyor. Batı onlarla savaşmalı ya da onları Batılılaştırmalı."
 USoE322A:0 "Dört Kaplan"
 USoE322A_desc:0 "Hong Kong, Singapur, Güney Kore ve Tayvan'dan oluşan Dört Asya Kaplanı'nın Batı ile her zaman yakın bağları oldu ve yükselen Çin ejderhasından korkuyorlar. Asya'da Batı'nın güvenilir müttefikleri olabilirler."
 USoE323A:0 "Japonya"
 USoE323A_desc:0 "İkinci Dünya Savaşı'nın sona ermesinin ardından Japonya, Asya'da Batı'nın önemli bir müttefiki oldu. Batı'nın bu yakın ortaklığı sürdürmesi gerekiyor."
 USoE324A:0 "Çin"
 USoE324A_desc:0 "Çin, Asya'da Batı'nın başlıca rakibidir. Batı Çin'i Batılılaştırabilirse Asya'da Batı hegemonyasına rakip kalmayacaktır."
 USoE325A:0 "Düşünülemez Harekâtı 2.0"
 USoE325A_desc:0 "Düşünülemez Harekâtı, Mayıs 1945'te Winston Churchill'in emriyle İngiliz Genelkurmay Başkanları tarafından Sovyetler Birliği'ne karşı hazırlanan bir savaş planıydı. Batılı Müttefikler, eski Alman Wehrmacht'ı ile birlikte Sovyetler Birliği'ne sürpriz bir saldırı başlatacaktı. Batı'nın bu planı mevcut duruma göre revize etmesi ve Avrupa'da Rus hegemonyasını önlemek için Rusya'ya karşı önleyici meşru müdafaa amacıyla harekete geçmesi gerekiyor."
 USoE400A:0 "Özgürlük Meşalesi"
 USoE400A_desc:0 "Avrupa'nın Özgürlük Meşalesi'ni taşıması gerekiyor! Avrupa Birleşik Devletleri, insan haklarına ve hukukun üstünlüğüne saygı duyan demokratik bir cumhuriyettir."
 USoE401A:0 "Dijital Demokrasi"
 USoE401A_desc:0 "Avrupa'nın demokratik kurumlarını dijital çağa göre reforme etmesi gerekiyor. Sosyal medya ve sosyal ağlar sayesinde halk yasamaya ve yönetime doğrudan katılabilir."
 USoE402A:0 "Orak ve Çekiç"
 USoE402A_desc:0 "Sosyalizmin ve Marksizmin babaları Karl Marx ve Friedrich Engels Avrupalıydı. Avrupa'nın bu mirası sürdürmesi gerekiyor."
 USoE403A:0 "ASSCB"
 USoE403A_desc:0 "Avrupa solu kapitalistleri Avrupa Birliği'nde kapana kıstırdı; artık Karl Marx ve Friedrich Engels'in manevi mirasçıları ASSCB'yi, yani Avrupa Sovyet Sosyalist Cumhuriyetler Birliği'ni kurma gücüne sahip."
 USoE404A:0 "Yapay Zekâ Hükümeti"
 USoE404A_desc:0 "Yapay zekâ, bir ülkeyi verimsiz ve yozlaşma ihtimali olan insan politikacılardan daha verimli yönetecek kadar gelişti. İktidar partisinin yapay zekâ ajanı kontrolü ele alacak ve ülkeyi iktidar partisinin değerlerine göre yönetecek."
 USoE500A:0 "Yeşil Gelecek"
 USoE500A_desc:0 "İnkâr edilemez iklim değişikliği karşısında Avrupa için yeşil bir gelecekten başka gelecek yok."
 USoE501A:0 "Çevre İmparatorluğu"
 USoE501A_desc:0 "Avrupa'nın, ekonomi ile çevrenin çelişmediği bir Çevre İmparatorluğu olması gerekiyor."
 USoE502A:0 "Çevreci Emperyalizm"
 USoE502A_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE503A:0 "Kuzey Amerika"
 USoE503A_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE504A:0 "Güney Amerika"
 USoE504A_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE505A:0 "Avrupa"
 USoE505A_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE506A:0 "Afrika"
 USoE506A_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE507A:0 "Orta Doğu"
 USoE507A_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE508A:0 "Asya"
 USoE508A_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE509A:0 "Okyanusya"
 USoE509A_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE510A:0 "Pasifik"
 USoE510A_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE600A:0 "Haç ve Taç"
 USoE600A_desc:0 "Avrupa'nın mirasını yerine getirmesi ve bir kez daha imparatorluk olması gerekiyor."
 USoE601A:0 "Yeni Şövalyeler"
 USoE601A_desc:0 "Düşmanca bir dünyada ordu, halkını yozlaşmış politikacılardan ve yabancı güçlerden kurtarmak için Avrupa'da kontrolü ele aldı."
 USoE602A:0 "Avrupa Orduları Generali"
 USoE602A_desc:0 "Genelkurmay, Avrupa'nın bir kara kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Orduları Generali rütbesi verilecek."
 USoE603A:0 "Avrupa Hava Mareşali"
 USoE603A_desc:0 "Genelkurmay, Avrupa'nın bir hava kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Hava Mareşali rütbesi verilecek."
 USoE604A:0 "Avrupa Büyükamirali"
 USoE604A_desc:0 "Genelkurmay, Avrupa'nın bir amiral tarafından yönetilmesine karar verdi. Bu amirale Avrupa Büyükamirali rütbesi verilecek."
 USoE605A:0 "Avrupa İmparatorluğu"
 USoE605A_desc:0 "Avrupa bir kez daha imparatorluk oldu ve halkının çıkarlarını küresel düzeyde savunabiliyor."
 USoE620A:0 "Yeni İmparator"
 USoE620A_desc:0 "Avrupa'nın kıtayı 21. yüzyılda yönetecek yeni bir imparatora ihtiyacı var."
 USoE621A:0 "Bir Hanedan Seç"
 USoE621A_desc:0 "Avrupa'nın uzun ve şanlı geçmişe sahip pek çok büyük hanedanı var. İlk kez birleşen kıtanın 21. yüzyılda hangi hanedanın hüküm süreceğine karar vermesi gerekiyor."
 USoE622A:0 "Savoy Hanedanı"
 USoE622A_desc:0 "Savoy Hanedanı, 1003'te tarihî Savoy bölgesinde kurulan bir kraliyet hanedanıdır. Aile, kademeli genişlemeyle İtalya'nın kuzeybatısındaki küçük bir Alp kontluğunu yönetmekten Sicilya Krallığı'nın mutlak hâkimiyetine kadar yükseldi. Hanedan üyeleri Sardinya, İtalya, Arnavutluk, Etiyopya ve kısa bir süre İspanya'yı yönetti. Hanedan ayrıca Kıbrıs, Kudüs ve Ermenistan krallıkları unvanlarında da hak iddia eder."
 USoE623A:0 "Wittelsbach Hanedanı"
 USoE623A_desc:0 "Wittelsbach Hanedanı, kolları Bavyera, Hollanda, Zeeland, Köln, İsveç, Romanya, Bohemya, Macaristan, Danimarka, Norveç, Yunanistan ve Kutsal Roma İmparatorluğu dahil pek çok toprağı yönetmiş Alman-Bavyeralı bir hanedandır. Katolik bir hükümdarın hakkını tanıyan Jakobit veraset çizgisi, Bavyera Veliaht Prensi Franz'ı II. Francis olarak meşru varis kabul eder."
 USoE624A:0 "Borbón-Anjou Hanedanı"
 USoE624A_desc:0 "Borbón-Anjou Hanedanı, İspanya Krallığı'nın hüküm süren kraliyet hanedanıdır. 18. yüzyılda İspanyol Bourbon hanedanının üyeleri İspanya, Napoli, Sicilya ve Parma'da taht sahibiydi."
 USoE625A:0 "Bourbon Hanedanı"
 USoE625A_desc:0 "Bourbon Hanedanı, Fransa'nın kraliyet hanedanı olan Capet hanedanının bir kolu olan Fransız kökenli bir Avrupa hanedanıdır. Bourbon kralları Fransa ve Navarra'yı ilk kez 16. yüzyılda yönetti."
 USoE626A:0 "Hannover Hanedanı"
 USoE626A_desc:0 "Hannover Hanedanı, 17. ve 20. yüzyıllar arasında çeşitli dönemlerde Hannover, Büyük Britanya ve İrlanda'yı yönetmiş bir Alman kraliyet hanedanıdır. Hanedan 1635'te Brunswick-Lüneburg Hanedanı'nın genç bir kolu olarak doğdu ve 1692'de Hannover'in Prens-Seçicilik olmasına kadar prestij kazandı."
 USoE627A:0 "Glücksburg Hanedanı"
 USoE627A_desc:0 "Schleswig-Holstein-Sonderburg-Glücksburg Hanedanı'nın kısaltılmış adıyla Glücksburg Hanedanı, üyeleri çeşitli dönemlerde Danimarka, Norveç, Yunanistan ve birkaç kuzey Alman devletinde hüküm sürmüş, Oldenburg Hanedanı'nın Danimarkalı-Alman bir koludur."
 USoE628A:0 "Windsor Hanedanı"
 USoE628A_desc:0 "Windsor Hanedanı, Birleşik Krallık'ın ve diğer Milletler Topluluğu krallıklarının hüküm süren kraliyet hanedanıdır. 1901'de Saxe-Coburg ve Gotha Hanedanı, İngiliz monarşisinde Hannover Hanedanı'nın yerini aldı. 1917'de Birinci Dünya Savaşı nedeniyle kraliyet hanedanının adı Almanca Saxe-Coburg ve Gotha'dan İngilizce Windsor'a (Windsor Kalesi'nden) değiştirildi."
 USoE629A:0 "Orange-Nassau Hanedanı"
 USoE629A_desc:0 "Orange-Nassau Hanedanı, Hollanda'nın hâlen hüküm süren hanedanıdır. Avrupa Nassau Hanedanı'nın bir kolu olan hanedan, özellikle Sessiz William'ın İspanyol yönetimine karşı Hollanda isyanını örgütlemesinden ve bu isyanın Seksen Yıl Savaşları'nın (1568–1648) ardından bağımsız bir Hollanda devletine yol açmasından bu yana Hollanda ve Avrupa siyasetinde ve yönetiminde merkezi bir rol oynamıştır."
 USoE630A:0 "Habsburg-Lorraine Hanedanı"
 USoE630A_desc:0 "Habsburg-Lorraine Hanedanı, 1736'da Lorraine ve Bar Dükü III. François ile daha sonra sırasıyla Bohemya Kraliçesi, Macaristan Kraliçesi ve Avusturya Arşidüşesi olacak olan Avusturyalı Maria Theresa'nın evliliğinden doğmuştur. Üyeleri, Habsburg Hanedanı'nın ve Lorraine Hanedanı'nın hayatta kalan meşru soyudur; aile mülklerini ve İmparatorluk misyonunu miras almışlardır."
 USoE631A:0 "Bonaparte Hanedanı"
 USoE631A_desc:0 "Bonaparte Hanedanı, İtalyan kökenli eski bir imparatorluk ve kraliyet hanedanıdır. 1804'te I. Napolyon tarafından kuruldu. Napolyon, Grande Armée'yi tüm büyük Avrupa güçlerine karşı yöneltti ve bir dizi askeri zaferle kıta Avrupası'na hâkim oldu. Ailesinin üyelerini bağımlı devletlerin tahtlarına oturtarak hanedanın gücünü genişletti."
 USoE632A:0 "Hohenzollern Hanedanı"
 USoE632A_desc:0 "Hohenzollern Hanedanı, üyeleri çeşitli dönemlerde Hohenzollern, Brandenburg, Prusya, Alman İmparatorluğu ve Romanya'nın prensleri, prens-seçicileri, kralları ve imparatorları olmuş eski bir Alman kraliyet hanedanıdır. Aile, 11. yüzyılda Svabya'daki Hechingen kasabası çevresinde ortaya çıktı ve adını Hohenzollern Kalesi'nden aldı."
 USoE633A:0 "Bir Saray Seç"
 USoE633A_desc:0 "Avrupa'nın yeni İmparatoru'nun hüküm sürmek için temsil gücü yüksek bir saraya ihtiyacı var."
 USoE634A:0 "Quirinale Sarayı"
 USoE634A_desc:0 "Quirinale Sarayı, İtalya'nın Roma şehrinde bulunan tarihî bir yapıdır ve İtalya Cumhurbaşkanı'nın üç resmî konutundan biridir. Napolyon, Quirinale Sarayı'nı İmparator olarak asıl konutu olarak seçmişti. Ancak 1814'teki Fransız yenilgisi ve ardından gelen Avrupa Restorasyonu nedeniyle buraya hiç yerleşemedi."
 USoE635A:0 "Neuschwanstein Şatosu"
 USoE635A_desc:0 "Neuschwanstein Şatosu, Almanya'nın güneybatı Bavyera bölgesinde engebeli bir tepenin üzerinde yer alan 19. yüzyıldan kalma Neo-Romanesk bir saraydır. Saray, Bavyera Kralı II. Ludwig tarafından yaptırıldı. Şato, 1886'daki ölümüne kadar Kral'ın konutu olması amacıyla inşa edildi ve ölümünden kısa süre sonra halka açıldı. O zamandan beri 61 milyondan fazla kişi Neuschwanstein Şatosu'nu ziyaret etti."
 USoE636A:0 "Madrid Kraliyet Sarayı"
 USoE636A_desc:0 "Madrid Kraliyet Sarayı, İspanyol kraliyet ailesinin Madrid'deki resmî konutudur, ancak günümüzde yalnızca devlet törenleri için kullanılmaktadır. Saray 135.000 metrekare kullanım alanına ve 3.418 odaya sahiptir. Avrupa'da hâlâ işlevini sürdüren en büyük kraliyet sarayıdır ve kullanım alanı bakımından da en büyüğüdür."
 USoE637A:0 "Versay Sarayı"
 USoE637A_desc:0 "Versay Sarayı, XIV. Louis döneminde 1682'den XVI. Louis döneminde 1789'da Fransız Devrimi'nin başlangıcına kadar Fransa'nın başlıca kraliyet konutuydu. Saray bugün tarihî bir anıt ve UNESCO Dünya Mirası alanıdır; özellikle tören salonu olan Aynalı Salon ve fıskiyeler, kanallar, geometrik çiçek tarhları ve korulukların bulunduğu geniş Versay Bahçeleri ile ünlüdür."
 USoE638A:0 "Buckingham Sarayı"
 USoE638A_desc:0 "Buckingham Sarayı, Birleşik Krallık hükümdarının Londra'daki konutu ve idari merkezidir. Westminster Şehri'nde bulunan saray, sıklıkla devlet törenlerinin ve kraliyet ağırlamalarının merkezindedir. Ulusal sevinç ve yas dönemlerinde İngiliz halkının odak noktası olmuştur."
 USoE639A:0 "Hofburg"
 USoE639A_desc:0 "Hofburg, Habsburg hanedanı hükümdarlarının eski başlıca imparatorluk sarayıdır ve bugün Avusturya Cumhurbaşkanı'nın resmî konutu ve çalışma yeri olarak hizmet vermektedir. Viyana'nın merkezinde yer alan saray 13. yüzyılda inşa edilmiş ve sonrasında birkaç kez genişletilmiştir."
 USoE640A:0 "Sanssouci"
 USoE640A_desc:0 "Sanssouci, Prusya Kralı Büyük Frederick'in Berlin yakınlarındaki Potsdam'da bulunan yazlık sarayıdır. Genellikle Versay'ın Alman rakipleri arasında sayılır. Sanssouci daha samimi Rokoko üslubunda ve Fransız Barok muadilinden çok daha küçük olsa da parkındaki çok sayıda tapınak ve süs yapısıyla dikkat çeker."
 USoE641A:0 "Yeni Bir Saray"
 USoE641A_desc:0 "Yeni bir imparatorun tarihî bir anıta değil, yeni bir saraya ihtiyacı var. Brüksel'de modern mimariye sahip yeni bir saray inşa edelim."
 USoE642A:0 "Taç Giyme Töreni"
 USoE642A_desc:0 "Avrupa'nın yeni İmparatorun taç giyme törenine hazırlanması gerekiyor. Ancak önce imparatorun hangi tacı takacağına ve taç giyme törenini kimin yapacağına karar vermeli."
 USoE643A:0 "İmparatorluk Tacı"
 USoE643A_desc:0 "Yeni imparatorluk Kutsal Roma İmparatorluğu'nun devamı ve mirasıdır; bu yüzden imparatorun Kutsal Roma İmparatorluğu Tacı'nı takması gerekir."
 USoE644A:0 "Yeni Bir Ekümenik Taç"
 USoE644A_desc:0 "Yeni bir imparatorluk ve yeni bir imparatorun tarihî bir kalıntıya değil, yeni bir taca ihtiyacı var."
 USoE645A:0 "Papa Tarafından"
 USoE645A_desc:0 "Tanrı'nın lütfuyla yeni imparatorun Papa tarafından taç giydirilmesi gerekir."
 USoE646A:0 "Halk Tarafından"
 USoE646A_desc:0 "Yeni İmparatorun halk tarafından taç giydirilmesi gerekir; Majestelerinin yönetimini meşrulaştırmak için bir seçim yapalım."
 USoE647A:0 "Kutsal Avrupa İmparatorluğu"
 USoE647A_desc:0 "İmparator taç giydi ve Kutsal Avrupa İmparatorluğu kuruldu."
 USoE700A:0 "Pax Occidentalis"
 USoE700A_desc:0 "Avrupa küresel hâkimiyet kazandı ve dünya barışını dayatabiliyor. Bu döneme Pax Occidentalis denecek."
 USoE701A:0 "Dünya Barışının Muhafızları"
 USoE701A_desc:0 "Avrupa, Amerika, Rusya ve Çin nüfuz alanlarını belirledi. Her süper güç kendi alanında barışı sağlıyor ve böylece dünya barışının muhafızları oluyorlar."
 EU001F:0 "AB Politikaları"
 EU001F_desc:0 "§Y[EUU.GetFlag] AB'nin§! politikaları Birliğin değerleri, hedefleri ve ilkeleriyle belirlenir. AB bir ekonomik topluluk olarak başladığı için ekonomi politikası AB'de hâlâ önemli bir alandır. AB, değerlerine uygun olarak vatandaşlarının refahını, güvenliğini ve çıkarlarını gözetmeye çalışır. AB ekonominin istikrarlı ve rekabetçi kalmasını ister ve kendini sürekli reforme etmeye çalışır..."
 EU002F:0 "AB Adaylığı"
 EU002F_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'ne§! üyelik başvurusu yapmadan önce AB aday ülke statüsü almamız gerekiyor. §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleriyle zorlu müzakereler olacak ve çok fazla etkiye ihtiyacımız olacak."
 EU100F:0 "AB Reformları"
 EU100F_desc:0 "Üye devletler, Avrupa bütünleşmesini güçlendirmek için §Y[EUU.GetFlag] Avrupa Birliği'ni§! reforme etmeye çalışıyor."
 EU101F:0 "Avrupa Birliği Temel Haklar Şartı"
 EU101F_desc:0 "\"Avrupa halkları, aralarında giderek daha sıkı bir birlik oluştururken ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik, insan onuru, özgürlük, eşitlik ve dayanışmanın bölünmez ve evrensel değerleri üzerine kuruludur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.\" - Temel Haklar Şartı'nın Başlangıcı"
 EU102F:0 "Avrupa Konvansiyonu"
 EU102F_desc:0 "Laeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaş için daha sade, temel hedeflerine ulaşmada daha güçlü ve dünyada daha belirgin bir Birlik yolunda kararlı bir adım atmak üzere Birliğin geleceğine ilişkin bir Konvansiyon toplamaya karar verdi."
 EU103F:0 "Avrupa Anayasası"
 EU103F_desc:0 "Avrupa Konvansiyonu, Avrupa İçin Bir Anayasa Oluşturan Antlaşma Taslağı ile sonuçlandı. Bu uluslararası antlaşma, §Y[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturmak üzere mevcut Avrupa antlaşmalarının yerini alacak ve nitelikli çoğunluk oylamasını daha önce üye devletler arasında oybirliğiyle karar verilen politika alanlarına genişletecekti."
 EU104F:0 "Lizbon Antlaşması"
 EU104F_desc:0 "Lizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onay sürecinin olumsuz sonuçlanmasının bir sonucudur. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirmiştir; ikincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilmiştir."
 EU105F:0 "Avrupa Dış Eylem Servisi"
 EU105F_desc:0 "Avrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dışişleri ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU200F:0 "AB Maliye Politikaları"
 EU200F_desc:0 "Maliye politikaları ekonomik büyüme, makroekonomik istikrar ve enflasyon üzerinde önemli bir etkiye sahiptir. Bu bakımdan kilit unsurlar kamu harcama ve gelirlerinin düzeyi ve bileşimi, bütçe açıkları ve kamu borcudur. Maliye politikalarının sorumluluğunu elinde tutan egemen devletlerden oluşan avro bölgesi gibi bir para birliğinde mali disiplin ihtiyacı daha da güçlüdür."
 EU201F:0 "ECB Müdahalesi"
 EU201F_desc:0 "ECB Yönetim Konseyi, para politikası kararlarını uygulamak için Avrosistem para politikası araçları ve prosedürlerine ilişkin Genel Belgeler'de belirtilen bir dizi para politikası aracı ve prosedürü benimsemiştir."
 EU202F:0 "Avrupa Bankacılık Birliği"
 EU202F_desc:0 "Son finansal krize yanıt olarak tek pazar için daha güvenli bir finans sektörü oluşturmak amacıyla Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üye devletlerindeki tüm finansal aktörler için tek bir kural kitabı oluşturur. Bankalar için daha sıkı ihtiyati gereklilikler, mevduat sahipleri için daha iyi koruma ve batık bankaların yönetimine ilişkin kurallar içerir."
 EU203F:0 "Avro Tahvilleri"
 EU203F_desc:0 "Avro tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, para birliğinin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasıyla boy ölçüşebilecek bir avro tahvili piyasası kurarak hükümetlerin borçlarını finanse etmesi için yeni araçlar yaratır."
 EU204F:0 "Avrupa Finansal İstikrar Fonu (EFSF)"
 EU204F_desc:0 "EFSF, Avrupa borç krizinde avro bölgesi üye devletleri tarafından geçici bir kriz çözüm mekanizması olarak kuruldu ve birçok üye devlete mali yardım sağladı. Bu yardım, EFSF tarafından sermaye piyasalarında ihraç edilen EFSF tahvilleri ve diğer borçlanma araçlarıyla finanse edildi. EFSF artık başka mali yardım sağlamamaktadır; bu görev artık yalnızca ESM tarafından yürütülmektedir."
 EU205F:0 "Avrupa İstikrar Mekanizması (ESM)"
 EU205F_desc:0 "ESM'nin görevi, ciddi finansman sorunları yaşayan veya bu tehditle karşı karşıya kalan avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM üyelerinin finansal istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU206F:0 "Mali Birlik"
 EU206F_desc:0 "Mali birlik, üye devletlerin ortak bir bütçeyi paylaşmasını içerir. Bu, harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirlenmesi anlamına gelir. Mali birlik, Avrupa bütünleşmesinin bir sonraki adımı olarak önerilmektedir ve tüm üye devletler için harcama ve vergi oranlarını merkezi bir Avrupa otoritesinin belirlemesi anlamına gelir."
 EU207F:0 "Avrupa Ekonomik Hükümeti"
 EU207F_desc:0 "Bir Avrupa Ekonomik Hükümeti, AB'de ortak bir maliye ve aktif ekonomi politikasını mümkün kılar. §Y[EUU.GetFlag] Avrupa Birliği'ne§! kendi vergi otoritesini kazandırır ve üye devletler için asgari ücretleri merkezi bir otorite belirler."
 EU208F:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU208F_desc:0 "Bir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükümeti ile oluşturulan politika ve yetkileri tek bir makamda birleştirir."
 EU300F:0 "AB Savunma Politikaları"
 EU300F_desc:0 "Ortak Güvenlik ve Savunma Politikası (OGSP), Birliğin barışı koruma operasyonlarında, çatışmaların önlenmesinde ve uluslararası güvenliğin güçlendirilmesinde öncü bir rol üstlenmesini sağlar. Sivil ve askeri imkânlardan yararlanan OGSP, AB'nin kriz yönetimine yönelik kapsamlı yaklaşımının ayrılmaz bir parçasıdır."
 EU301F:0 "Avrupa Savunma Ajansı (EDA)"
 EU301F_desc:0 "Avrupa Savunma Ajansı, üye devletleri ve §Y[EUU.GetFlag] Avrupa Birliği'ni§! kriz yönetimi alanında Avrupa savunma kabiliyetlerini geliştirme ve Avrupa Güvenlik ve Savunma Politikası'nı bugünkü hâliyle ve gelecekteki gelişimiyle sürdürme çabalarında desteklemek amacıyla kuruldu."
 EU302F:0 "Daimi Yapılandırılmış İşbirliği (PESCO)"
 EU302F_desc:0 "PESCO, istekli ve muktedir üye devletlerin ortak kabiliyet projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına imkân tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu kabiliyetleri ulusal ve çok uluslu görev ve operasyonlar için üye devletlerin kullanımına sunmaktır."
 EU303F:0 "Avrupa Savunma Fonu"
 EU303F_desc:0 "Avrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine ve vatandaşlarının korunup savunulmasına kilit bir katkı sağlayacak. Yeniliği teşvik etmek ve son teknoloji savunma teknolojileri ve ürünleri geliştirmek için şirketler arasında ve AB ülkeleri arasında savunma işbirliğini destekleyecek. Fon, savunmaya yapılan ulusal yatırımları koordine edecek, tamamlayacak ve güçlendirecek."
 EU304F:0 "Avrupa Güvenlik Konseyi"
 EU304F_desc:0 "Bir Avrupa Güvenlik Konseyi, AB'yi uluslararası siyasette karar almaya daha hazırlıklı hâle getirir. AB tutarlı kararları daha hızlı alıp uygulamayı başaramazsa, AB kurallarını uygulama ve çok taraflı yapıları güçlendirme kabiliyeti zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükümetlerarası işbirliği formatıyla desteklenmelidir."
 EU305F:0 "Avrupa Ordusu"
 EU305F_desc:0 "Üye devletler, §Y[EUU.GetFlag] Avrupa Birliği'nin§! askeri kabiliyetlerini güçlendirmek için ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvrupa Ordusu§! olarak bilinecektir."
 EU306F:0 "Avrupa Donanması"
 EU306F_desc:0 "21. yüzyılda çok uluslu filolar ve görev kuvvetleri giderek yaygınlaşıp önem kazanırken §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri güçlerini birleştirip savaş gemilerini §YAvrupa Donanması§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU307F:0 "BM Güvenlik Konseyi'nde AB Daimi Üyeliği"
 EU307F_desc:0 "Üye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olmasına karar verdi. Bu, BMGK'nın reforme edilmesiyle ya da hâlihazırda BMGK üyesi olan üye devlet(ler)in koltuğunun AB'ye devredilmesiyle gerçekleştirilir."
 EU308F:0 "AB Nükleer Gücü"
 EU308F_desc:0 "Nükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki etkisini artıracaktır. Birlik, nükleer silahları üye devletlerinin nükleer silahlarını devralıp paylaşarak ya da kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU400F:0 "AB İkincil Mevzuatı"
 EU400F_desc:0 "AB antlaşmaları, AB üye devletleri arasında AB'nin hedeflerini, AB kurumlarına ilişkin kuralları, kararların nasıl alınacağını ve AB ile üyeleri arasındaki ilişkiyi belirleyen bağlayıcı anlaşmalardır. Antlaşmalar birincil hukuk olarak bilinir. Antlaşmaların ilke ve hedeflerinden doğan hukuk bütünü ise ikincil hukuk (tüzükler, yönergeler, kararlar, tavsiyeler ve görüşler) olarak bilinir."
 EU401F:0 "Genel Veri Koruma Tüzüğü"
 EU401F_desc:0 "AB Genel Veri Koruma Tüzüğü (GDPR), Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek amacıyla tasarlanmıştır."
 EU402F:0 "Dijital Tek Pazarda Telif Hakkı Yönergesi"
 EU402F_desc:0 "Dijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU403F:0 "Dublin II Tüzüğü"
 EU403F_desc:0 "Dublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini belirler. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve aynı kişinin birden fazla sığınma başvurusu yaparak sistemi kötüye kullanmasının önüne geçmektir."
 EU404F:0 "Sığınmacıların Yeniden Yerleştirilmesi ve İskânı"
 EU404F_desc:0 "Başvurularının olumlu sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan başvurularının işleme alınacağı diğer üye devletlere yeniden yerleştirilir. Başvurular olumlu sonuçlanırsa başvuru sahiplerine, yerleştirildikleri üye devlette ikamet hakkıyla birlikte mülteci statüsü verilir."
 EU405F:0 "AB-Türkiye Mutabakatı"
 EU405F_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye üzerinden Avrupa'ya yönelik düzensiz göç akışını durdurmayı amaçlayan bir anlaşma için müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye iade edilecek. §Y[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler İçin Mali Yardım Programı'na 3 milyar avro ödeyecek."
 EU406F:0 "Avrupa Sığınma Ajansı"
 EU406F_desc:0 "AB Komisyonu, sığınma süreci boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali imkânlarla donatılmış bir AB Sığınma Ajansı kurulmasını önerdi."
 EU407F:0 "Frontex"
 EU407F_desc:0 "Frontex, AB ülkelerine ve Schengen'e bağlı ülkelere dış sınırlarını yönetmede yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır yetkilileri arasındaki işbirliğini kolaylaştırır, teknik destek ve uzmanlık sağlar."
 EU408F:0 "Avrupa Sınır ve Sahil Güvenlik Ajansı"
 EU408F_desc:0 "Frontex, Avrupa Sınır ve Sahil Güvenlik Ajansı'na dönüşüyor. Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa sahne oldu. Dış sınırı olan ülkeler sınır kontrolünden tek başına sorumludur; ancak Frontex ciddi göç baskısıyla karşı karşıya kalan AB ülkelerine ek teknik destek sağlayabilir."
 EU500F:0 "Avrupa Komisyonu Politikaları"
 EU500F_desc:0 "Avrupa Komisyonu Politikaları"
 EU600F:0 "AB Genişlemesi"
 EU600F_desc:0 "Genişleme politikası, AB'ye katılmak isteyen ülkeler ve potansiyel adaylar için geçerlidir. Üyelik perspektifi, AB üyesi olmak isteyen ülkelerde demokratik ve ekonomik reformlar için güçlü bir teşviktir."
 EU601F:0 "Avrupa Birliği'nin 2004 Genişlemesi"
 EU601F_desc:0 "1 Mayıs 2004'te toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), bir eski Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) kapsıyor."
 EU602F:0 "Avrupa Birliği'nin 2007 Genişlemesi"
 EU602F_desc:0 "Doğu Avrupa'dan iki ülke daha, §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§!, AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU603F:0 "Avrupa Birliği'nin 2013 Genişlemesi"
 EU603F_desc:0 "2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katılarak üye devlet sayısını 28'e çıkardı."
 EU700F:0 "Ayrılma Politikaları"
 EU700F_desc:0 "Birlik genelinde yükselen Avrupa şüpheciliğiyle birlikte bazı üye devletler §Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmayı düşünecek."
 EU701F:0 "50. Madde"
 EU701F_desc:0 "\"Her Üye Devlet, kendi anayasal kurallarına uygun olarak Birlikten ayrılmaya karar verebilir.\"\n- Avrupa Birliği Antlaşması, Madde 50(1).\n50. Madde ilk olarak Avrupa Birliği Anayasal Antlaşması için kaleme alındı. Anayasanın onaylanamamasının ardından madde Lizbon Antlaşması'na dahil edildi."
 EU702F:0 "Ayrılma Antlaşması"
 EU702F_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nden§! ayrılmak, ayrılan ülkenin AB hukukunun geçerliliğini yitireceği döneme göre ulusal hukukunu uyarlamak zorunda olduğu karmaşık bir süreçtir. Ayrılan ülke ile §Y[EUU.GetFlag] Avrupa Birliği§! gelecekteki ilişkileri konusunda bir anlaşmaya varmak zorundadır."
 EU703F:0 "Anlaşmasız Çıkış"
 EU703F_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği§! ile bir Ayrılma Antlaşması'na varılamazsa, halkımızı Anlaşmasız Çıkış'ın kaosundan korumak için acil önlemler alınmalıdır."
 EU110F:0 "Avrupa Birliği'nin Federalleşmesi"
 EU110F_desc:0 "Avrupa bütünleşme süreci, daha fazla bütünleşmenin §Y[EUU.GetFlag] Avrupa Birliği'nin§! Federalleşmesine yol açacağı bir noktaya ulaştı."
 EU111F:0 "Avrupa Birleşik Devletleri"
 EU111F_desc:0 "70 yılı aşkın Avrupa bütünleşmesinin ardından §Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri egemenliklerinden vazgeçerek §Y[EUU.GetFlag] Avrupa Birleşik Devletleri'ni§! kurmaya karar verdi."
 EU112F:0 "Avrupa Federasyonu"
 EU112F_desc:0 "§Y[EUU.GetFlag] Avrupa Birliği'nin§! üye devletleri, nitelikli çoğunluk oylamasını temel ilke olarak benimseyen ve §YAvrupa Federasyonu Başkanı§! tarafından yönetilen §Y[EUU.GetFlag] Avrupa Federasyonu'na§! Birliği dönüştürmeye karar verdi."
 EU113F:0 "Anavatanlar Avrupası"
 EU113F_desc:0 "Daha fazla Avrupa bütünleşmesi, üye devletlerin kültürel mirasını, ulusal kimliklerini ve egemenliğini tehlikeye atacaktır. Avrupa, anavatanların Avrupası'dır; bu yüzden Avrupa bütünleşmesi bu aşamada durmalıdır."
 EU604F:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU604F_desc:0 "Avrupa Birliği'nin Gelecekteki Genişlemesi"
 EU605F:0 "Batı Balkanlar Genişlemesi"
 EU605F_desc:0 "Batı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU606F:0 "Türkiye"
 EU606F_desc:0 "§Y[TUR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU607F:0 "Karadeniz Genişlemesi"
 EU607F_desc:0 "Karadeniz ülkeleri §Y[MLV.GetNameWithFlag]§! ve §Y[UKR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU608F:0 "Kafkasya Genişlemesi"
 EU608F_desc:0 "Kafkas ülkeleri §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! ve §Y[GEO.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU609F:0 "Avrupa Ekonomik Alanı"
 EU609F_desc:0 "Avrupa Ekonomik Alanı'nın AB üyesi olmayan ülkeleri (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! ve §Y[ICE.GetNameWithFlag]§!) §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU610F:0 "Belarus"
 EU610F_desc:0 "§Y[BLR.GetNameWithFlag]§! §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday oluyor."
 EU611F:0 "İç Genişleme"
 EU611F_desc:0 "İç genişleme, mevcut bir üye devletin dağılması veya ondan ayrılma yoluyla yeni üye devletlerin ortaya çıkması sürecidir. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! ve §Y[WAS.GetNameWithFlag]§! bağımsızlıklarını kazandıklarında §Y[EUU.GetFlag] Avrupa Birliği'ne§! katılım için aday olabilir."
 POTEF001F:0 "Avrupa Federasyonu Başkanı"
 POTEF001F_desc:0 "§YAvrupa Federasyonu Başkanı (POTEF)§! Avrupa'nın en üst lideridir. Bu nedenle Avrupa Federasyonu Başkanı, tüm Federasyon için belirleyici stratejik kararları alma yetkisine sahiptir."
 POTEF100F:0 "Alp Doktrini"
 POTEF100F_desc:0 "Alp ülkeleri §Y[AUS.GetNameWithFlag]§! ve §Y[SWI.GetNameWithFlag]§! uzun bir dağ savaşı geleneğine sahiptir. Alp Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF101F:0 "Yaratılışın Bütünlüğü"
 POTEF101F_desc:0 "Avrupa Federasyonu, Yaratılışın Bütünlüğünü korumak ve sürdürmek için politikalarını uyarlıyor."
 POTEF102F:0 "Çevreci Emperyalizm"
 POTEF102F_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF103F:0 "Kuzey Amerika"
 POTEF103F_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF104F:0 "Güney Amerika"
 POTEF104F_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF105F:0 "Avrupa"
 POTEF105F_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF106F:0 "Afrika"
 POTEF106F_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF107F:0 "Orta Doğu"
 POTEF107F_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF108F:0 "Asya"
 POTEF108F_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF109F:0 "Okyanusya"
 POTEF109F_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF110F:0 "Pasifik"
 POTEF110F_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 POTEF150F:0 "Alman Doktrini"
 POTEF150F_desc:0 "§Y[GER.GetNameWithFlag]§! geleneksel olarak güçlü zırhlı kuvvetlere odaklanmıştır. Zırhlı Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF151F:0 "Ticaret İmparatorluğu"
 POTEF151F_desc:0 "Avrupa Federasyonu bir Ticaret İmparatorluğu olacak."
 POTEF200F:0 "Fransız Doktrini"
 POTEF200F_desc:0 "§Y[FRA.GetNameWithFlag]§! geleneksel olarak yüksek hareket kabiliyetine sahip hafif zırhlı ve motorlu kuvvetlere odaklanmıştır. Manevra Savaşı Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF201F:0 "İmparatorluk Gücü"
 POTEF201F_desc:0 "Avrupa Federasyonu, imparatorluk öncüllerinin geleneğini sürdürüyor."
 POTEF202F:0 "Özgürlük İmparatorluğu"
 POTEF202F_desc:0 "Avrupa Federasyonu bir Özgürlük İmparatorluğu olacak."
 POTEF203F:0 "Amerika: Müttefik mi, Hasım mı?"
 POTEF203F_desc:0 "Amerika ve Avrupa, 20. yüzyılın büyük bölümünde müttefikti. §Y[USA.GetNameWithFlag]§! ülkesindeki son siyasi değişikliklerle bu durum sorgulanır oldu…"
 POTEF204F:0 "NATO Mirası"
 POTEF204F_desc:0 "NATO'nun barışı koruma mirası geleneğinde §Y[USA.GetNameWithFlag]§! ve §YEDU§! yeni bir ittifak kuruyor."
 POTEF205F:0 "Trump'ın Mirası"
 POTEF205F_desc:0 "§Y[USA.GetNameWithFlag]§! müttefiklikten hasımlığa geçti. Avrupa bu belirleyici stratejik değişime karşılık vermek zorunda."
 POTEF206F:0 "Duvarı Yık"
 POTEF206F_desc:0 "Avrupa egemenliğine yönelik Amerikan tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[MEX.GetNameWithFlag]§! ile ittifak kurup §Y[USA.GetNameWithFlag]§! ülkesini güneyden işgal etmeye yönelik bir plan hazırladı."
 POTEF207F:0 "Buster'ın Dirilişi"
 POTEF207F_desc:0 "ABD'nin Avrupa'ya yönelik tehdidine karşı koymak için §YEDU§! genelkurmayı, §Y[CAN.GetNameWithFlag]§! ile ittifak kurup 1 No'lu Savunma Planı'nı revize etmeyi önerdi. Bu plan, Kanadalı Yarbay James 'Buster' Sutherland Brown tarafından ABD ile Britanya İmparatorluğu arasında yakın bir çatışma durumunda Kanada'nın ABD'ye önleyici bir saldırı düzenlemesi için hazırlanmıştı. Bu planla §YEDU§!, §Y[USA.GetFlag] ABD'yi§! kuzeyden işgal edebilir."
 POTEF250F:0 "Benelüks Doktrini"
 POTEF250F_desc:0 "Soğuk Savaş'ın ardından §YAlçak Ülkeler§! yeni duruma uyum sağlamak için havadan hareketli kuvvetlere odaklandı. Havadan Hareket Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF251F:0 "Liberal Miras"
 POTEF251F_desc:0 "Avrupa Federasyonu Liberal Mirasını onurlandırıyor."
 POTEF252F:0 "Eski Ticaret Yollarını Güvenceye Al"
 POTEF252F_desc:0 "Avrupa Federasyonu'nun Karayipler'e, Afrika'ya ve eski Hollanda Doğu Hint Adaları'na uzanan eski ticaret yollarını güvenceye alması gerekiyor."
 POTEF253F:0 "Endonezya"
 POTEF253F_desc:0 "Avrupa Federasyonu'nun eski Hollanda sömürgesi §Y[IND.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF300F:0 "İber Doktrini"
 POTEF300F_desc:0 "§YIberya ülkeleri§! geleneksel olarak güçlü deniz piyadesi kuvvetlerine odaklanmıştır. Deniz Piyadesi Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF301F:0 "Latin Kuzenler"
 POTEF301F_desc:0 "Avrupa Federasyonu'nun Güney Amerika'daki eski sömürgelerle ilişkilerini geliştirmesi gerekiyor."
 POTEF302F:0 "Meksika"
 POTEF302F_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[MEX.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Orta Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF303F:0 "Büyük Kolombiya"
 POTEF303F_desc:0 "Avrupa Federasyonu'nun eski İspanyol sömürgesi §Y[COL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF304F:0 "Orta Amerika"
 POTEF304F_desc:0 "Avrupa Federasyonu'nun §YOrta Amerika'daki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF305F:0 "Güney Koni"
 POTEF305F_desc:0 "Avrupa Federasyonu'nun §YGüney Amerika'nın Güney Konisi'ndeki§! eski İspanyol sömürgeleriyle ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF306F:0 "Brezilya"
 POTEF306F_desc:0 "Avrupa Federasyonu'nun eski Portekiz sömürgesi §Y[BRA.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güney Amerika'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF350F:0 "İngiliz Doktrini"
 POTEF350F_desc:0 "§YBritanya§! geleneksel olarak güçlü bir donanmaya odaklanmıştır. Deniz Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF351F:0 "Kuzey Atlantik'i Güvenceye Al"
 POTEF351F_desc:0 "Denizlerin özgürlüğünü ve serbest ticareti güvence altına almak için Avrupa Federasyonu'nun Kuzey Atlantik'i kontrol etmesi gerekiyor."
 POTEF352F:0 "Milletler Topluluğu Mirası"
 POTEF352F_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması ve eski İngiliz dominyonlarıyla ilişkilerini geliştirmesi gerekiyor."
 POTEF353F:0 "Kanada"
 POTEF353F_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[CAN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF354F:0 "Avustralya"
 POTEF354F_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[AST.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF355F:0 "Yeni Zelanda"
 POTEF355F_desc:0 "Avrupa Federasyonu'nun Milletler Topluluğu mirasını onurlandırması, eski İngiliz dominyonu §Y[NZL.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF356F:0 "Kuzey Denizi'ni Güvenceye Al"
 POTEF356F_desc:0 "Kuzey Denizi, Avrupa Federasyonu'nun arka bahçesidir ve güvence altına alınması gerekir."
 POTEF357F:0 "Malaya Mirası"
 POTEF357F_desc:0 "Avrupa Federasyonu'nun Malaya'daki eski İngiliz sömürgeleriyle ilişkilerini geliştirmesi gerekiyor."
 POTEF358F:0 "Malezya"
 POTEF358F_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[MAY.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF359F:0 "Singapur"
 POTEF359F_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[SIN.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Güneydoğu Asya'da yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF360F:0 "Hong Kong'a Garanti Ver"
 POTEF360F_desc:0 "Avrupa Federasyonu'nun eski İngiliz sömürgesi §Y[HKG.GetNameWithFlag]§! ile ilişkilerini geliştirmesi ve Çin-İngiltere Ortak Bildirisi'ndeki özgürlükleri güvence altına alması gerekiyor."
 POTEF400F:0 "İskandinav Doktrini"
 POTEF400F_desc:0 "§YSkandinav ülkeleri§! geleneksel olarak Arktik'te savaşmaya odaklanmıştır. İskandinav Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF401F:0 "Arktik'i Güvenceye Al"
 POTEF401F_desc:0 "Denizlerin özgürlüğünü ve jeostratejik konumunu güvence altına almak için Avrupa Federasyonu'nun Arktik'i kontrol etmesi gerekiyor."
 POTEF450F:0 "Akdeniz Doktrini"
 POTEF450F_desc:0 "§YAkdeniz ülkeleri§! geleneksel olarak denizden çıkarma taktiklerine odaklanmıştır. Amfibi Doktrin ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF451F:0 "Kuzey Afrika"
 POTEF451F_desc:0 "Bir yakınsama bölgesi ve mülteciler için güvenli bir liman oluşturmak amacıyla Avrupa Federasyonu'nun §YKuzey Afrika§! ile ilişkilerini geliştirmesi ve orada yeni stratejik ileri karakollar kurması gerekiyor."
 POTEF452F:0 "Kıbrıs'ı Birleştir"
 POTEF452F_desc:0 "Avrupa Federasyonu'nun egemen bir üye devleti olarak §Y[CYP.GetNameWithFlag]§! yeniden birleştirilmelidir."
 POTEF500F:0 "Balkan Doktrini"
 POTEF500F_desc:0 "§YBalkan ülkeleri§! geleneksel olarak partizan kuvvetlere odaklanmıştır. Partizan Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF501F:0 "Balkan Altyapısı"
 POTEF501F_desc:0 "Avrupa Federasyonu'nun bölgesel barışı korumak ve Balkanları yabancı etkiden korumak için Balkanların altyapısını geliştirmesi gerekiyor."
 POTEF502F:0 "İpek Yolu'na Meydan Oku"
 POTEF502F_desc:0 "Avrupa Federasyonu'nun Çin'in yeni İpek Yolu'na meydan okuması ve Orta Asya'daki Çin etkisini azaltması gerekiyor."
 POTEF503F:0 "Rakip Çin"
 POTEF503F_desc:0 "§Y[CHI.GetNameWithFlag]§! küresel düzeyde Avrupa Federasyonu'nun başlıca rakiplerinden biri hâline geldi. Avrupa Federasyonu'nun politikalarını buna göre uyarlaması gerekiyor."
 POTEF504F:0 "Ok Harekâtı"
 POTEF504F_desc:0 "Adını Ok Savaşı'ndan (İkinci İngiliz-Çin Savaşı) alan Ok Harekâtı, Çin'in yayılmacı politikasını durdurmak için §Y[CHI.GetNameWithFlag]§! ülkesine Avrupa müdahalesini öngören bir plandır."
 POTEF505F:0 "Asyalı Müttefikler"
 POTEF505F_desc:0 "§Y[CHI.GetNameWithFlag]§! ile yüzleşmek için Avrupa Federasyonu'nun Asya'da müttefiklere ihtiyacı var."
 POTEF506F:0 "Kore Cumhuriyeti"
 POTEF506F_desc:0 "§Y[KOR.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF507F:0 "Japonya"
 POTEF507F_desc:0 "§Y[JAP.GetNameWithFlag]§! ve Avrupa Federasyonu'nun ikisi de Çin ejderhasının tehdidi altında. Bu tehditle başa çıkmak için ittifak kurmalılar."
 POTEF550F:0 "Karadeniz Doktrini"
 POTEF550F_desc:0 "Soğuk Savaş'ın ardından §YKaradeniz ülkeleri§! yeni duruma uyum sağlamak için hareketli hava savunma kuvvetlerine odaklandı. Hava Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF551F:0 "Karadeniz'i Güvenceye Al"
 POTEF551F_desc:0 "Karadeniz, Avrupa Federasyonu'nu Kafkasya'ya ve güneydoğudaki üye devletlerine bağlar. Bu nedenle güvence altına alınması gerekir."
 POTEF552F:0 "Ayrılıkçı Cumhuriyetleri Yeniden Entegre Et"
 POTEF552F_desc:0 "§Y[SOV.GetNameWithFlag]§!, ayrılıkçı hareketleri destekleyip ayrılıkçı cumhuriyetler kurarak Avrupa Federasyonu'nun çeşitli doğu üye devletlerinin egemenliğini ihlal etti. Bu Rus kuklalarını yeniden entegre etmemiz gerekiyor."
 POTEF553F:0 "Rakip Rusya"
 POTEF553F_desc:0 "§Y[SOV.GetNameWithFlag]§! Avrupa Federasyonu'nun başlıca rakiplerinden biri oldu. Ona yaptırımlar uygulamamız gerekiyor."
 POTEF554F:0 "Şarlman Harekâtı"
 POTEF554F_desc:0 "Adını 'Avrupa'nın Babası' (Pater Europae) olarak anılan efsanevi imparator Şarlman'dan alan Şarlman Harekâtı, §Y[SOV.GetNameWithFlag]§! ülkesine karşı önleyici meşru müdafaa planıdır. Bu harekâtla §YEDU§!, Avrupa egemenliğine yönelik bu tehdidi ortadan kaldırmak için §Y[SOV.GetNameWithFlag]§! ülkesine önleyici bir işgal başlatabilir."
 POTEF600F:0 "Kafkasya Doktrini"
 POTEF600F_desc:0 "Soğuk Savaş'ın ardından §YKafkasya bölgesi ülkeleri§! yeni duruma uyum sağlamak için güçlü bir savunmaya odaklandı. Savunma Doktrini ile tüm üye devletler bu taktikleri benimseyebilir."
 POTEF601F:0 "Avrupa Erişimi"
 POTEF601F_desc:0 "Avrupa Federasyonu'nun Kafkasya'ya ve güneydoğudaki üye devletlerine erişime ihtiyacı var. Bu nedenle yeni deniz üsleri ve altyapı inşa edilmesi gerekiyor."
 POTEF650F:0 "Vişegrad Doktrini"
 POTEF650F_desc:0 "§YVişegrad ülkeleri§! geleneksel olarak güçlü topçu kuvvetlerine odaklanmıştır. Topçu Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF651F:0 "Avrupa Hava Savunma Ağı"
 POTEF651F_desc:0 "Avrupa Federasyonu'nun doğu kanadını güvence altına almak için bir hava savunma ağı kurması gerekiyor."
 POTEF652F:0 "Doğu Güvenlik Duvarı"
 POTEF652F_desc:0 "§Y[SOV.GetNameWithFlag]§! ülkesinin doğudaki üye devletlerde artan etkisine karşı koyulması gerekiyor."
 POTEF700F:0 "Baltık Doktrini"
 POTEF700F_desc:0 "§YBaltık ülkeleri§! geleneksel olarak küçük ve son derece yetenekli özel kuvvetlere odaklanmıştır. Özel Kuvvetler Doktrini ile tüm üye devletler bu geleneği ve taktiklerini benimseyebilir."
 POTEF701F:0 "Baltık Denizi'ni Güvenceye Al"
 POTEF701F_desc:0 "Baltık Denizi, Avrupa Federasyonu'nun iç denizidir ve güvence altına alınması gerekir."
 POTEF800F:0 "Pax Europaea"
 POTEF800F_desc:0 "Avrupa Federasyonu'nun dünya barışını sağlamak için küresel süper güç olması gerekiyor."
 USoE001F:0 "Yeni Avrupa Milletini Kur"
 USoE001F_desc:0 "Birleşik Avrupa Birliği'nin kendini yeni bir millet olarak kurması gerekiyor. Anayasa ve Birleşme Antlaşmaları bir şey; ama şimdi halkın bu yasal çerçeveyi hayatla doldurması gerekiyor."
 USoE002F:0 "Avrupa Subay Kolordusu"
 USoE002F_desc:0 "Birlik döneminde her üye devletin kendi ordusu vardı, daha sonra da Avrupa Ordusu kuruldu. Ortak doktrin ve eğitime sahip bir Avrupa Subay Kolordusu oluşturmamız gerekiyor."
 USoE003F:0 "Avrupa Siyasi Partileri"
 USoE003F_desc:0 "Yeni bir millet yeni siyasi partilere ihtiyaç duyar. Üye devletlerin eski siyasi partileri birleşmek zorunda."
 USoE004F:0 "Avrupa Vatanseverliği"
 USoE004F_desc:0 "Yeni bir millet kendi vatanseverliğine ve ulusal sembollerine ihtiyaç duyar."
 USoE005F:0 "Yeni Büyük Oyun"
 USoE005F_desc:0 "Yeni Büyük Oyun daha yeni başladı ve Avrupa geç kaldı; ABD, Çin ve Rusya ise ilk hamlelerini çoktan yaptı."
 USoE006F:0 "Avrupa'nın Kalbi ve Ruhu"
 USoE006F_desc:0 "Yeni milletin değerlerini ve standartlarını tanımlaması gerekiyor. Avrupa'nın bir Kalbe ve Ruha ihtiyacı var!"
 USoE100F:0 "Nüfuz Alanları Oyunu"
 USoE100F_desc:0 "Nüfuz alanları oyununu oynadığında ya kazanırsın ya ölürsün. Orta yolu yoktur."
 USoE101F:0 "Kartalla Hesaplaş"
 USoE101F_desc:0 "Amerikan Kartalı yere indirilmeli! Avrupa semalarında fazlasıyla uzun süre uçtu."
 USoE102F:0 "Ayıyla Kapış"
 USoE102F_desc:0 "Ayı bize saldırmadan önce biz ona saldırmalıyız."
 USoE103F:0 "Ejderhayla Dans"
 USoE103F_desc:0 "Ejderhayla Dans tehlikeli bir oyundur."
 USoE104F:0 "Demirden Bir Kalp"
 USoE104F_desc:0 "Eski zamanlarda demirciler, yenilen kötülerin silahlarından demir bir taht döverlerdi. Günümüzde ise sadece Avrupa'nın demirden kalbini kanıtladığını ve artık dünyanın tartışmasız hâkimi olduğunu ilan ediyoruz!"
 USoE200F:0 "Barış İçinde Bir Arada Yaşam"
 USoE200F_desc:0 "Demirden daha keskin kılıçlar vardır. Parayla ödeyebilecekken neden kanla ödeyesin?"
 USoE201F:0 "Önce Amerika"
 USoE201F_desc:0 "Kendi doktrinlerimize saygı duyulmasını istiyorsak Önce Amerika doktrinine saygı duymalıyız."
 USoE202F:0 "Rus Nüfuz Alanı"
 USoE202F_desc:0 "Rusya tüm Rus halkının koruyucusudur. Bu, saygı duymamız gereken onların nüfuz alanıdır."
 USoE203F:0 "Çin Nüfuz Alanı"
 USoE203F_desc:0 "Çin'in nüfuz alanı Güneydoğu Asya'yı kapsar ve bizi rahatsız etmez. Çin bizim ticaret ortağımızdır, rakibimiz değil."
 USoE204F:0 "Avrupa Nüfuz Alanı"
 USoE204F_desc:0 "21. yüzyılın tüm süper güçlerini yatıştırdık; artık Avrupa, Levant ve Kuzey Afrika'da Avrupa Nüfuz Alanı'nı kurmak için elimiz serbest."
 USoE300F:0 "Medeniyetler Çatışması"
 USoE300F_desc:0 "Medeniyetler Çatışması, Amerikalı siyaset bilimci Samuel P. Huntington'ın Soğuk Savaş sonrası dünyada insanların kültürel ve dinî kimliklerinin başlıca çatışma kaynağı olacağını öne süren tezidir. Gelecekteki savaşlar ülkeler arasında değil, kültürler arasında yaşanacaktır."
 USoE301F:0 "Batı'nın Geri Kalanı"
 USoE301F_desc:0 "Avrupa, Batı'nın geri kalanıdır. Amerika, Önce Amerika doktriniyle bizi yalnız ve tecrit edilmiş bıraktı."
 USoE302F:0 "Haç ve Hilal"
 USoE302F_desc:0 "Avrupa'nın güneydoğu sınırında haç ile hilal çatışıyor. Kim galip gelecek: Batı medeniyeti mi, İslam medeniyeti mi?"
 USoE303F:0 "Papa ve Patrik"
 USoE303F_desc:0 "1054'teki Büyük Ayrılık'tan bu yana Papa ile Ortodoks Patrik farklı yollara gitti. Batı medeniyetini savunmak için yeniden birleşme zamanı geldi."
 USoE304F:0 "İki Haç"
 USoE304F_desc:0 "Doğu ve Batı Hristiyanlığının İslam'a karşı birleşmesi gerekiyor."
 USoE305F:0 "Avrasya İttifakı"
 USoE305F_desc:0 "NATO'nun dağılmasının ardından Avrupa, Rus komşusuyla yeni ve büyük bir ittifak kurabilir."
 USoE306F:0 "Konstantinopolis"
 USoE306F_desc:0 "Konstantinopolis Batı'nın bir parçasıdır. Avrupa'nın onu İslam etkisinden kurtarması gerekiyor."
 USoE307F:0 "Antakya"
 USoE307F_desc:0 "Antakya Prinkepsliği, Birinci Haçlı Seferi sırasında kurulan Haçlı devletlerinden biriydi. Batı'ya aittir ve bir kez daha İslam'dan arındırılmalıdır."
 USoE308F:0 "Trablus"
 USoE308F_desc:0 "Trablus Kontluğu (1109–1289) Haçlı devletlerinin sonuncusuydu. Yeniden yükselmeli. Avrupa'nın Levant'ı İslam'dan kurtarması gerekiyor."
 USoE309F:0 "Kudüs"
 USoE309F_desc:0 "Avrupa'nın Kutsal Şehri İslam etkisinden kurtarması gerekiyor. Kudüs Krallığı kutsal mekânları bir kez daha koruyacak."
 USoE310F:0 "Malta Şövalyeleri"
 USoE310F_desc:0 "Avrupa'nın Kuzey Afrika'yı İslam etkisinden kurtarması gerekiyor. Avrupa, Malta Şövalyeleri'nin örneğini izleyecek."
 USoE311F:0 "Arabistan'ın Batılılaşması"
 USoE311F_desc:0 "Arap Yarımadası'ndaki bazı ülkelerin Batı ile zaten yakın bağları var. Güvenli bir komşuluğa sahip olmak için Avrupa'nın Arap Yarımadası'nı tamamen Batılılaştırması gerekiyor."
 USoE312F:0 "Hindistan'ın Batılılaşması"
 USoE312F_desc:0 "Sömürge mirası sayesinde Hindistan'ın Batı ile geleneksel olarak yakın bağları var. Avrupa, Hindistan'ı tamamen Batılılaştırmak için bu ilişkiyi derinleştirmeli."
 USoE313F:0 "İran Cumhuriyeti"
 USoE313F_desc:0 "İran, Orta Doğu'da Batı'nın başlıca rakiplerinden biridir. Avrupa, İran'ı Batılılaştırıp İran Cumhuriyeti'ne dönüştürerek onun bölgesel hegemonya arayışını durdurabilir."
 USoE320F:0 "Batı ve Diğerleri"
 USoE320F_desc:0 "Avrupa ve Amerika, dünyadaki her düşmana kafa tutabilecek Batılı süper güçlerdir. NATO'yu temel alarak Batı küresel hâkimiyetini dayatabilir."
 USoE321F:0 "Asya'nın Batılılaşması"
 USoE321F_desc:0 "Batı'nın Asya'daki yükselen güçlere odaklanması gerekiyor. Batı onlarla savaşmalı ya da onları Batılılaştırmalı."
 USoE322F:0 "Dört Kaplan"
 USoE322F_desc:0 "Hong Kong, Singapur, Güney Kore ve Tayvan'dan oluşan Dört Asya Kaplanı'nın Batı ile her zaman yakın bağları oldu ve yükselen Çin ejderhasından korkuyorlar. Asya'da Batı'nın güvenilir müttefikleri olabilirler."
 USoE323F:0 "Japonya"
 USoE323F_desc:0 "İkinci Dünya Savaşı'nın sona ermesinin ardından Japonya, Asya'da Batı'nın önemli bir müttefiki oldu. Batı'nın bu yakın ortaklığı sürdürmesi gerekiyor."
 USoE324F:0 "Çin"
 USoE324F_desc:0 "Çin, Asya'da Batı'nın başlıca rakibidir. Batı Çin'i Batılılaştırabilirse Asya'da Batı hegemonyasına rakip kalmayacaktır."
 USoE325F:0 "Düşünülemez Harekâtı 2.0"
 USoE325F_desc:0 "Düşünülemez Harekâtı, Mayıs 1945'te Winston Churchill'in emriyle İngiliz Genelkurmay Başkanları tarafından Sovyetler Birliği'ne karşı hazırlanan bir savaş planıydı. Batılı Müttefikler, eski Alman Wehrmacht'ı ile birlikte Sovyetler Birliği'ne sürpriz bir saldırı başlatacaktı. Batı'nın bu planı mevcut duruma göre revize etmesi ve Avrupa'da Rus hegemonyasını önlemek için Rusya'ya karşı önleyici meşru müdafaa amacıyla harekete geçmesi gerekiyor."
 USoE400F:0 "Özgürlük Meşalesi"
 USoE400F_desc:0 "Avrupa'nın Özgürlük Meşalesi'ni taşıması gerekiyor! Avrupa Birleşik Devletleri, insan haklarına ve hukukun üstünlüğüne saygı duyan demokratik bir cumhuriyettir."
 USoE401F:0 "Dijital Demokrasi"
 USoE401F_desc:0 "Avrupa'nın demokratik kurumlarını dijital çağa göre reforme etmesi gerekiyor. Sosyal medya ve sosyal ağlar sayesinde halk yasamaya ve yönetime doğrudan katılabilir."
 USoE402F:0 "Orak ve Çekiç"
 USoE402F_desc:0 "Sosyalizmin ve Marksizmin babaları Karl Marx ve Friedrich Engels Avrupalıydı. Avrupa'nın bu mirası sürdürmesi gerekiyor."
 USoE403F:0 "ASSCB"
 USoE403F_desc:0 "Avrupa solu kapitalistleri Avrupa Birliği'nde kapana kıstırdı; artık Karl Marx ve Friedrich Engels'in manevi mirasçıları ASSCB'yi, yani Avrupa Sovyet Sosyalist Cumhuriyetler Birliği'ni kurma gücüne sahip."
 USoE404F:0 "Yapay Zekâ Hükümeti"
 USoE404F_desc:0 "Yapay zekâ, bir ülkeyi verimsiz ve yozlaşma ihtimali olan insan politikacılardan daha verimli yönetecek kadar gelişti. İktidar partisinin yapay zekâ ajanı kontrolü ele alacak ve ülkeyi iktidar partisinin değerlerine göre yönetecek."
 USoE500F:0 "Yeşil Gelecek"
 USoE500F_desc:0 "İnkâr edilemez iklim değişikliği karşısında Avrupa için yeşil bir gelecekten başka gelecek yok."
 USoE501F:0 "Çevre İmparatorluğu"
 USoE501F_desc:0 "Avrupa'nın, ekonomi ile çevrenin çelişmediği bir Çevre İmparatorluğu olması gerekiyor."
 USoE502F:0 "Çevreci Emperyalizm"
 USoE502F_desc:0 "Avrupa yeşil, ancak dünya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE503F:0 "Kuzey Amerika"
 USoE503F_desc:0 "Avrupa yeşil, ancak Kuzey Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE504F:0 "Güney Amerika"
 USoE504F_desc:0 "Avrupa yeşil, ancak Güney Amerika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE505F:0 "Avrupa"
 USoE505F_desc:0 "Avrupa yeşil, ancak diğer Avrupa ülkeleri hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE506F:0 "Afrika"
 USoE506F_desc:0 "Avrupa yeşil, ancak Afrika hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE507F:0 "Orta Doğu"
 USoE507F_desc:0 "Avrupa yeşil, ancak Orta Doğu hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE508F:0 "Asya"
 USoE508F_desc:0 "Avrupa yeşil, ancak Asya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE509F:0 "Okyanusya"
 USoE509F_desc:0 "Avrupa yeşil, ancak Okyanusya hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE510F:0 "Pasifik"
 USoE510F_desc:0 "Avrupa yeşil, ancak Pasifik hâlâ karanlık ve gri. Avrupa'nın politikalarını ve teknolojilerini tüm dünyaya yayması ve gezegeni yok eden fosil enerji imparatorluklarına karşı mücadele etmesi gerekiyor."
 USoE600F:0 "Haç ve Taç"
 USoE600F_desc:0 "Avrupa'nın mirasını yerine getirmesi ve bir kez daha imparatorluk olması gerekiyor."
 USoE601F:0 "Yeni Şövalyeler"
 USoE601F_desc:0 "Düşmanca bir dünyada ordu, halkını yozlaşmış politikacılardan ve yabancı güçlerden kurtarmak için Avrupa'da kontrolü ele aldı."
 USoE602F:0 "Avrupa Orduları Generali"
 USoE602F_desc:0 "Genelkurmay, Avrupa'nın bir kara kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Orduları Generali rütbesi verilecek."
 USoE603F:0 "Avrupa Hava Mareşali"
 USoE603F_desc:0 "Genelkurmay, Avrupa'nın bir hava kuvvetleri generali tarafından yönetilmesine karar verdi. Bu generale Avrupa Hava Mareşali rütbesi verilecek."
 USoE604F:0 "Avrupa Büyükamirali"
 USoE604F_desc:0 "Genelkurmay, Avrupa'nın bir amiral tarafından yönetilmesine karar verdi. Bu amirale Avrupa Büyükamirali rütbesi verilecek."
 USoE605F:0 "Avrupa İmparatorluğu"
 USoE605F_desc:0 "Avrupa bir kez daha imparatorluk oldu ve halkının çıkarlarını küresel düzeyde savunabiliyor."
 USoE620F:0 "Yeni İmparator"
 USoE620F_desc:0 "Avrupa'nın kıtayı 21. yüzyılda yönetecek yeni bir imparatora ihtiyacı var."
 USoE621F:0 "Bir Hanedan Seç"
 USoE621F_desc:0 "Avrupa'nın uzun ve şanlı geçmişe sahip pek çok büyük hanedanı var. İlk kez birleşen kıtanın 21. yüzyılda hangi hanedanın hüküm süreceğine karar vermesi gerekiyor."
 USoE622F:0 "Savoy Hanedanı"
 USoE622F_desc:0 "Savoy Hanedanı, 1003'te tarihî Savoy bölgesinde kurulan bir kraliyet hanedanıdır. Aile, kademeli genişlemeyle İtalya'nın kuzeybatısındaki küçük bir Alp kontluğunu yönetmekten Sicilya Krallığı'nın mutlak hâkimiyetine kadar yükseldi. Hanedan üyeleri Sardinya, İtalya, Arnavutluk, Etiyopya ve kısa bir süre İspanya'yı yönetti. Hanedan ayrıca Kıbrıs, Kudüs ve Ermenistan krallıkları unvanlarında da hak iddia eder."
 USoE623F:0 "Wittelsbach Hanedanı"
 USoE623F_desc:0 "Wittelsbach Hanedanı, kolları Bavyera, Hollanda, Zeeland, Köln, İsveç, Romanya, Bohemya, Macaristan, Danimarka, Norveç, Yunanistan ve Kutsal Roma İmparatorluğu dahil pek çok toprağı yönetmiş Alman-Bavyeralı bir hanedandır. Katolik bir hükümdarın hakkını tanıyan Jakobit veraset çizgisi, Bavyera Veliaht Prensi Franz'ı II. Francis olarak meşru varis kabul eder."
 USoE624F:0 "Borbón-Anjou Hanedanı"
 USoE624F_desc:0 "Borbón-Anjou Hanedanı, İspanya Krallığı'nın hüküm süren kraliyet hanedanıdır. 18. yüzyılda İspanyol Bourbon hanedanının üyeleri İspanya, Napoli, Sicilya ve Parma'da taht sahibiydi."
 USoE625F:0 "Bourbon Hanedanı"
 USoE625F_desc:0 "Bourbon Hanedanı, Fransa'nın kraliyet hanedanı olan Capet hanedanının bir kolu olan Fransız kökenli bir Avrupa hanedanıdır. Bourbon kralları Fransa ve Navarra'yı ilk kez 16. yüzyılda yönetti."
 USoE626F:0 "Hannover Hanedanı"
 USoE626F_desc:0 "Hannover Hanedanı, 17. ve 20. yüzyıllar arasında çeşitli dönemlerde Hannover, Büyük Britanya ve İrlanda'yı yönetmiş bir Alman kraliyet hanedanıdır. Hanedan 1635'te Brunswick-Lüneburg Hanedanı'nın genç bir kolu olarak doğdu ve 1692'de Hannover'in Prens-Seçicilik olmasına kadar prestij kazandı."
 USoE627F:0 "Glücksburg Hanedanı"
 USoE627F_desc:0 "Schleswig-Holstein-Sonderburg-Glücksburg Hanedanı'nın kısaltılmış adıyla Glücksburg Hanedanı, üyeleri çeşitli dönemlerde Danimarka, Norveç, Yunanistan ve birkaç kuzey Alman devletinde hüküm sürmüş, Oldenburg Hanedanı'nın Danimarkalı-Alman bir koludur."
 USoE628F:0 "Windsor Hanedanı"
 USoE628F_desc:0 "Windsor Hanedanı, Birleşik Krallık'ın ve diğer Milletler Topluluğu krallıklarının hüküm süren kraliyet hanedanıdır. 1901'de Saxe-Coburg ve Gotha Hanedanı, İngiliz monarşisinde Hannover Hanedanı'nın yerini aldı. 1917'de Birinci Dünya Savaşı nedeniyle kraliyet hanedanının adı Almanca Saxe-Coburg ve Gotha'dan İngilizce Windsor'a (Windsor Kalesi'nden) değiştirildi."
 USoE629F:0 "Orange-Nassau Hanedanı"
 USoE629F_desc:0 "Orange-Nassau Hanedanı, Hollanda'nın hâlen hüküm süren hanedanıdır. Avrupa Nassau Hanedanı'nın bir kolu olan hanedan, özellikle Sessiz William'ın İspanyol yönetimine karşı Hollanda isyanını örgütlemesinden ve bu isyanın Seksen Yıl Savaşları'nın (1568–1648) ardından bağımsız bir Hollanda devletine yol açmasından bu yana Hollanda ve Avrupa siyasetinde ve yönetiminde merkezi bir rol oynamıştır."
 USoE630F:0 "Habsburg-Lorraine Hanedanı"
 USoE630F_desc:0 "Habsburg-Lorraine Hanedanı, 1736'da Lorraine ve Bar Dükü III. François ile daha sonra sırasıyla Bohemya Kraliçesi, Macaristan Kraliçesi ve Avusturya Arşidüşesi olacak olan Avusturyalı Maria Theresa'nın evliliğinden doğmuştur. Üyeleri, Habsburg Hanedanı'nın ve Lorraine Hanedanı'nın hayatta kalan meşru soyudur; aile mülklerini ve İmparatorluk misyonunu miras almışlardır."
 USoE631F:0 "Bonaparte Hanedanı"
 USoE631F_desc:0 "Bonaparte Hanedanı, İtalyan kökenli eski bir imparatorluk ve kraliyet hanedanıdır. 1804'te I. Napolyon tarafından kuruldu. Napolyon, Grande Armée'yi tüm büyük Avrupa güçlerine karşı yöneltti ve bir dizi askeri zaferle kıta Avrupası'na hâkim oldu. Ailesinin üyelerini bağımlı devletlerin tahtlarına oturtarak hanedanın gücünü genişletti."
 USoE632F:0 "Hohenzollern Hanedanı"
 USoE632F_desc:0 "Hohenzollern Hanedanı, üyeleri çeşitli dönemlerde Hohenzollern, Brandenburg, Prusya, Alman İmparatorluğu ve Romanya'nın prensleri, prens-seçicileri, kralları ve imparatorları olmuş eski bir Alman kraliyet hanedanıdır. Aile, 11. yüzyılda Svabya'daki Hechingen kasabası çevresinde ortaya çıktı ve adını Hohenzollern Kalesi'nden aldı."
 USoE633F:0 "Bir Saray Seç"
 USoE633F_desc:0 "Avrupa'nın yeni İmparatoru'nun hüküm sürmek için temsil gücü yüksek bir saraya ihtiyacı var."
 USoE634F:0 "Quirinale Sarayı"
 USoE634F_desc:0 "Quirinale Sarayı, İtalya'nın Roma şehrinde bulunan tarihî bir yapıdır ve İtalya Cumhurbaşkanı'nın üç resmî konutundan biridir. Napolyon, Quirinale Sarayı'nı İmparator olarak asıl konutu olarak seçmişti. Ancak 1814'teki Fransız yenilgisi ve ardından gelen Avrupa Restorasyonu nedeniyle buraya hiç yerleşemedi."
 USoE635F:0 "Neuschwanstein Şatosu"
 USoE635F_desc:0 "Neuschwanstein Şatosu, Almanya'nın güneybatı Bavyera bölgesinde engebeli bir tepenin üzerinde yer alan 19. yüzyıldan kalma Neo-Romanesk bir saraydır. Saray, Bavyera Kralı II. Ludwig tarafından yaptırıldı. Şato, 1886'daki ölümüne kadar Kral'ın konutu olması amacıyla inşa edildi ve ölümünden kısa süre sonra halka açıldı. O zamandan beri 61 milyondan fazla kişi Neuschwanstein Şatosu'nu ziyaret etti."
 USoE636F:0 "Madrid Kraliyet Sarayı"
 USoE636F_desc:0 "Madrid Kraliyet Sarayı, İspanyol kraliyet ailesinin Madrid'deki resmî konutudur, ancak günümüzde yalnızca devlet törenleri için kullanılmaktadır. Saray 135.000 metrekare kullanım alanına ve 3.418 odaya sahiptir. Avrupa'da hâlâ işlevini sürdüren en büyük kraliyet sarayıdır ve kullanım alanı bakımından da en büyüğüdür."
 USoE637F:0 "Versay Sarayı"
 USoE637F_desc:0 "Versay Sarayı, XIV. Louis döneminde 1682'den XVI. Louis döneminde 1789'da Fransız Devrimi'nin başlangıcına kadar Fransa'nın başlıca kraliyet konutuydu. Saray bugün tarihî bir anıt ve UNESCO Dünya Mirası alanıdır; özellikle tören salonu olan Aynalı Salon ve fıskiyeler, kanallar, geometrik çiçek tarhları ve korulukların bulunduğu geniş Versay Bahçeleri ile ünlüdür."
 USoE638F:0 "Buckingham Sarayı"
 USoE638F_desc:0 "Buckingham Sarayı, Birleşik Krallık hükümdarının Londra'daki konutu ve idari merkezidir. Westminster Şehri'nde bulunan saray, sıklıkla devlet törenlerinin ve kraliyet ağırlamalarının merkezindedir. Ulusal sevinç ve yas dönemlerinde İngiliz halkının odak noktası olmuştur."
 USoE639F:0 "Hofburg"
 USoE639F_desc:0 "Hofburg, Habsburg hanedanı hükümdarlarının eski başlıca imparatorluk sarayıdır ve bugün Avusturya Cumhurbaşkanı'nın resmî konutu ve çalışma yeri olarak hizmet vermektedir. Viyana'nın merkezinde yer alan saray 13. yüzyılda inşa edilmiş ve sonrasında birkaç kez genişletilmiştir."
 USoE640F:0 "Sanssouci"
 USoE640F_desc:0 "Sanssouci, Prusya Kralı Büyük Frederick'in Berlin yakınlarındaki Potsdam'da bulunan yazlık sarayıdır. Genellikle Versay'ın Alman rakipleri arasında sayılır. Sanssouci daha samimi Rokoko üslubunda ve Fransız Barok muadilinden çok daha küçük olsa da parkındaki çok sayıda tapınak ve süs yapısıyla dikkat çeker."
 USoE641F:0 "Yeni Bir Saray"
 USoE641F_desc:0 "Yeni bir imparatorun tarihî bir anıta değil, yeni bir saraya ihtiyacı var. Brüksel'de modern mimariye sahip yeni bir saray inşa edelim."
 USoE642F:0 "Taç Giyme Töreni"
 USoE642F_desc:0 "Avrupa'nın yeni İmparatorun taç giyme törenine hazırlanması gerekiyor. Ancak önce imparatorun hangi tacı takacağına ve taç giyme törenini kimin yapacağına karar vermeli."
 USoE643F:0 "İmparatorluk Tacı"
 USoE643F_desc:0 "Yeni imparatorluk Kutsal Roma İmparatorluğu'nun devamı ve mirasıdır; bu yüzden imparatorun Kutsal Roma İmparatorluğu Tacı'nı takması gerekir."
 USoE644F:0 "Yeni Bir Ekümenik Taç"
 USoE644F_desc:0 "Yeni bir imparatorluk ve yeni bir imparatorun tarihî bir kalıntıya değil, yeni bir taca ihtiyacı var."
 USoE645F:0 "Papa Tarafından"
 USoE645F_desc:0 "Tanrı'nın lütfuyla yeni imparatorun Papa tarafından taç giydirilmesi gerekir."
 USoE646F:0 "Halk Tarafından"
 USoE646F_desc:0 "Yeni İmparatorun halk tarafından taç giydirilmesi gerekir; Majestelerinin yönetimini meşrulaştırmak için bir seçim yapalım."
 USoE647F:0 "Kutsal Avrupa İmparatorluğu"
 USoE647F_desc:0 "İmparator taç giydi ve Kutsal Avrupa İmparatorluğu kuruldu."
 USoE700F:0 "Pax Occidentalis"
 USoE700F_desc:0 "Avrupa küresel hâkimiyet kazandı ve dünya barışını dayatabiliyor. Bu döneme Pax Occidentalis denecek."
 USoE701F:0 "Dünya Barışının Muhafızları"
 USoE701F_desc:0 "Avrupa, Amerika, Rusya ve Çin nüfuz alanlarını belirledi. Her süper güç kendi alanında barışı sağlıyor ve böylece dünya barışının muhafızları oluyorlar."
 TR_GENERIC_anti_corruption_reforms:0 "Yolsuzlukla Mücadele Reformları"
 TR_GENERIC_anti_corruption_reforms_desc:0 "Yolsuzlukla mücadele reformlarını onaylayarak ülkemizdeki yolsuzluğu azaltmayı umabiliriz."
 TR_GENERIC_network_infrastructure:0 "İnternet Altyapısı"
 TR_GENERIC_network_infrastructure_desc:0 "Modern dünya interneti temel bir insan ihtiyacı hâline getirdi. Bu ihtiyaca yatırım yapmak eğitime, inşaat çalışmalarına ve çok daha fazlasına katkı sağlayacak."
 TR_GENERIC_centralization:0 "Merkezileşme"
 TR_GENERIC_centralization_desc:0 "Devletin merkezileşmesi geniş ülkemizi ayakta tutmamıza yardımcı olacak. Ülkeyi merkezileştirmek ayrıca ek siyasi sermaye sağlayacak ve bu siyasi destekle birlikte ek vergi geliri getirecektir."
 TR_GENERIC_decentralization:0 "Yerelleşme"
 TR_GENERIC_decentralization_desc:0 "Devleti yerelleştirmek ve bürokratik engelleri kaldırmak, genel bürokratik maliyetleri azaltacak ve inşaattaki büyümeyi teşvik edecektir."
 TR_GENERIC_political_reform:0 "Siyasi Reform"
 TR_GENERIC_political_reform_desc:0 "İç siyasetimizin durgunlaşmasını önlemek için hükümet, ülkeyi ve halkını siyasi olarak dinamik ve aktif tutmalıdır. Yasalar hazırlanmalı, devlet görevlileri atanmalı, finansman planları onaylanmalı ve kamu projeleri planlanmalıdır. [Root.GetAdjective] hükümeti, ülkeyi modernleştirme ve güçlendirme çabasında rehavete kapılamaz."
 TR_GENERIC_cabinet_reform:0 "Kabine Reformu"
 TR_GENERIC_cabinet_reform_desc:0 "Hükümet başkanının gündemine şu anda karşı çıkan birkaç kilit kabine üyesini değiştirerek yürütme organı, yaklaşan siyasi meseleler ve krizlerle başa çıkmada güç ve kararlılık gösterebilir. Bunu yaparken nefret edenleri, kaybedenleri ve karamsarları görmezden gelmeliyiz."
 TR_GENERIC_expand_the_secret_service:0 "Gizli Servisi Genişlet"
 TR_GENERIC_expand_the_secret_service_desc:0 "[Root.GetNameDef] ülkesinin güvenliği büyük ölçüde askeri ve sivil istihbarat teşkilatlarının gücüne bağlıdır. Düşman ajanlara, toplumun yıkıcı unsurlarına, teröristlere ve (en azından imkânsız olmayan) bir düşman nükleer saldırısı ihtimaline karşı etkili önlemler bulmalıyız."
 TR_GENERIC_build_intelligence_stations:0 "İstihbarat İstasyonları İnşa Et"
 TR_GENERIC_build_intelligence_stations_desc:0 "İkinci Dünya Savaşı'nın radar istasyonlarının devamı olan İstihbarat İstasyonları bize düşman birlik hareketleri ve yaklaşan uçaklar hakkında ayrıntılı raporlar sağlayacak. Soğuk Savaş döneminin casusluk olayları ve entrikalarından edinilen deneyimlerden yararlanacağız."
 TR_GENERIC_strengthen_government:0 "Hükümeti Güçlendir"
 TR_GENERIC_strengthen_government_desc:0 "Kurulu hükümetimizin biraz güçlendirilmeye ihtiyacı var. Partimizi siyasi olarak sağlamlaştırmak çeşitli politikalar izlememiz için bize daha fazla seçenek sunacak."
 TR_GENERIC_political_games:0 "Siyasi Oyunlar"
 TR_GENERIC_political_games_desc:0 "Kapsamlı bir siyasi kültür olmadan hükümet ne işe yarar? Siyasi ortamımızın gelişmesi ve istikrarlı kalması için tartışma ve müzakerenin tohumlarını ekmeliyiz."
 TR_GENERIC_public_service_annoucement:0 "Kamu Spotu"
 TR_GENERIC_public_service_annoucement_desc:0 "Kamu yararına mesajları doğrudan vatandaşlarımıza iletmek için standart bir yöntem oluşturmalıyız. Bu, kamu spotlarıyla yapılır."
 TR_GENERIC_the_establishment:0 "Düzen"
 TR_GENERIC_the_establishment_desc:0 "Düzenin temsilcileri devlet siyaseti üzerindeki hâkimiyetlerini güçlendiriyor. Devlet işlerinde ek erişim kazanmak için bunu iyi değerlendirebiliriz."
 TR_GENERIC_the_state:0 "Devlet"
 TR_GENERIC_the_state_desc:0 "Topraklarımızla ilgili her konuda sıkı bir el ile, ülkemizi uzun zamandır rahatsız eden bölünme ve oyalanma belasından nihayet bir kez ve tamamen kurtulabiliriz."
 TR_GENERIC_diplomatic_positions:0 "Diplomatik Tutumlar"
 TR_GENERIC_diplomatic_positions_desc:0 "Siyasi reformun ve dış ilişkilere odaklanmamızın ardından, daha fazla uluslararası işbirliği için komşularımızla tutarlı diplomatik tutumlar belirleyebiliriz."
 TR_GENERIC_our_place:0 "Yerimiz"
 TR_GENERIC_our_place_desc:0 "Kendimizin efendisiyiz ve bizi etkilemeye çalışan güçlerin açgözlü ellerinden kurtulmayı hak ediyoruz."
 TR_GENERIC_station_in_the_world:0 "Dünyanın Görüşleri"
 TR_GENERIC_station_in_the_world_desc:0 "Ülkeyi dünyaya açmak, liderlerimiz için uygulanabilir güç dahil pek çok fayda sağlayacak."
 TR_GENERIC_the_west:0 "Batı"
 TR_GENERIC_the_west_desc:0 "Batılı ülkeler demokrasi ve özgürlüğü ön plana çıkarır ve genellikle ABD ile aynı safta yer alır. Batılı ülkeler dünya siyasetinde mevcut durumu korumaya çalışır."
 TR_GENERIC_eastern_emergence:0 "Doğu'nun Yükselişi"
 TR_GENERIC_eastern_emergence_desc:0 "Siyasi olarak Yükselen ülkeler mevcut dünya düzeninden ayrılmak ve eskilerinin yerini alacak yeni örgütler kurmak ister. Kesin olarak ABD ya da Batı karşıtı olmasalar da Yükselen ülkeler sıklıkla Batı etkisini zayıflatmaya çalışır."
 TR_GENERIC_non_aligned:0 "Bağlantısız"
 TR_GENERIC_non_aligned_desc:0 "Tarafsız ülkeler küresel siyasetin dışında kalmaya çalışır ve genellikle iç veya bölgesel kalkınmaya odaklanır. Ne Batı'ya ne de Doğu'ya karşı güçlü bir bağlılık hissederler."
 TR_GENERIC_the_conservative_approach:0 "Muhafazakâr Yaklaşım"
 TR_GENERIC_the_conservative_approach_desc:0 "Muhafazakâr ülkeler küresel mevcut durumu aktif olarak korumaya çalışır ve Batı'nın eski muhafız tarzı siyasetini ve uluslararası bakış açısını sürdürmeye odaklanır."
 TR_GENERIC_the_nationalist_rise:0 "Milliyetçi Yükseliş"
 TR_GENERIC_the_nationalist_rise_desc:0 "Milliyetçi ülkeler büyük ölçüde kendilerine ve uluslarının geçmişteki şanına odaklanır. Sıklıkla otoriter siyasete kayarlar ve tek bir etnik kökenin ya da halkın varlığını öne çıkarırlar."
 TR_GENERIC_the_salafist_rise:0 "Selefi Yükseliş"
 TR_GENERIC_the_salafist_rise_desc:0 "Selefilik, İslam'ın aşırı muhafazakâr bir yorumudur. Selefiler, gerekirse zorla, İslam'ı daha geleneksel ve lafzi köklerine döndürerek reforme etmek ister."
 TR_GENERIC_western_ideas:0 "Batılı Fikirler"
 TR_GENERIC_western_ideas_desc:0 "Batı'nın çok değer verdiği demokrasi ve özgürlük idealleri, saygın her ulus-devletin başarısının anahtarıdır. Bunları benimsemeliyiz."
 TR_GENERIC_the_rising_powers:0 "Yükselen Güçler"
 TR_GENERIC_the_rising_powers_desc:0 "Bir millet görünmez kuklacılarının kurallarına daha ne kadar uymak zorunda kalacak? Bu adaletsiz ve yozlaşmış dünya düzeninden ayrılalım ve kardeşlerimizle birlikte yükselelim."
 TR_GENERIC_us_above_all:0 "Her Şeyden Önce Biz"
 TR_GENERIC_us_above_all_desc:0 "Millet dünyadaki tek kutsal ve saf şeydir. Başkaları bu konuda ne kadar güçlü hissederse hissetsin, ona yalnızca saygı duyulmamalı, ihtiyaçları da karşılanmalıdır!"
 TR_GENERIC_jihad:0 "Cihat"
 TR_GENERIC_jihad_desc:0 "Allahu Ekber!"
 TR_GENERIC_international_diplomacy:0 "Uluslararası Diplomasi"
 TR_GENERIC_international_diplomacy_desc:0 "Kapalı kapılar ardında anlaşmalar yapma, kamuoyu önünde ahlak dersi verme ve küçük ülkeleri büyük komşuları arasında paylaştırma sanatı olan uluslararası diplomasi, gösteriş ile pragmatik Makyavelizmin karışımından oluşan köklü bir kültüre sahiptir. Ne de olsa diplomasinin asıl amacı ülkenin petrol arzını güvenceye almaktır. [Root.GetNameDef] geride kalamaz."
 TR_GENERIC_trade_with_the_neighbors:0 "Komşularla Ticaret"
 TR_GENERIC_trade_with_the_neighbors_desc:0 "Hem diplomatik kadrolarımızı genişleterek hem de yol ağımızı büyüterek yakın komşularımızla saflarımızı sıklaştırdıktan sonra artık yanı başımızdaki ortaklarımızla daha yakın bir ticari entegrasyon izleyebiliriz. Bu, hem büyük şirketlerimizin hem de küçük esnafımızın kârlarına katkıda bulunacak."
 TR_GENERIC_alignment_debate:0 "Hizalanma Tartışması"
 TR_GENERIC_alignment_debate_desc:0 "Uluslararası diplomasinin açık bir sorusu, tarafsızlık ve yalnızcılık ile müdahalecilik fikirleri arasındaki çatışma ve karşıtlıktır."
 TR_GENERIC_neutrality:0 "Tarafsızlık"
 TR_GENERIC_neutrality_desc:0 "Her şeyden önce [Root.GetAdjective] vatandaşların güvenliği ve refahıyla ilgilenmeliyiz. Gençlerimizi, doğal kaynaklarımızı ve mali varlıklarımızı yabancı maceralarda harcayamayız. Bunun yerine sınırlarımızı güvenceye alarak ve uluslararası ittifak ağlarına üye olmaktan kaçınarak iç cephenin güvende olduğundan emin olmalıyız."
 TR_GENERIC_interventionism:0 "Müdahalecilik"
 TR_GENERIC_interventionism_desc:0 "Uluslararası sahnede yalnızca kendimize bakmak bencillik olmakla kalmaz, dünyanın tüm halklarına bir hakarettir. Ne pahasına olursa olsun tüm bölgenin, hatta belki de tüm dünyanın refahını ve güvenliğini sağlamalıyız! Bu arada [Root.GetNameDef] için biraz ek kaynak ve memnuniyet elde edersek de..."
 TR_GENERIC_build_fortifications:0 "Tahkimat İnşa Et"
 TR_GENERIC_build_fortifications_desc:0 "Güçlü savunma yapıları, yabancı kuvvetlerin işgali durumunda kırılmaz bir cephe hattını güvenceye almanın anahtarıdır."
 TR_GENERIC_militarism:0 "Militarizm"
 TR_GENERIC_militarism_desc:0 "Militarizm, bir ülkenin hem iç hem de dış alanlarda ulusal çıkarlarını güvenceye almak ve korumak için kullandığı güçlü bir orduya sahip olması fikridir."
 TR_GENERIC_peaceful_emergence:0 "Barışçıl Yükseliş"
 TR_GENERIC_peaceful_emergence_desc:0 "Farklı dünya görüşlerimize rağmen eski düzene düşmanca davranmamalı, bunun yerine dünyayı diplomasi ve ekonomi yoluyla yavaş yavaş değiştirmeye çalışmalıyız."
 TR_GENERIC_revanchism:0 "İntikamcılık"
 TR_GENERIC_revanchism_desc:0 "İntikamcılık, bir ülkenin daha önce kaybettiği toprakları geri kazanma isteğini ifade eden terimdir. Fransızların Alsace-Lorraine'i kaybetmesinin ardından popülerleşen intikamcılık, birçok ülkenin siyasetinde hâlâ önemli bir etkendir."
 TR_GENERIC_build_roads:0 "Yollar İnşa Et"
 TR_GENERIC_build_roads_desc:0 "Ulaşım, dünyanın gelişmiş her bölgesinde kilit öneme sahiptir; özellikle az gelişmiş bölgeler başta olmak üzere ülkenin her yerine yollar inşa ederek eğitime ve kent yaşamına erişimi artırabiliriz."
 TR_GENERIC_build_railways:0 "Demiryolları İnşa Et"
 TR_GENERIC_build_railways_desc:0 "Ulaşım, dünyanın gelişmiş her bölgesinde kilit öneme sahiptir; ülkenin az gelişmiş bölgelerinde demiryolları inşa ederek hem sanayileşmeyi teşvik edebilir hem de hızlı ve ucuz bir ulaşım yöntemi oluşturabiliriz."
 TR_GENERIC_build_highways:0 "Otoyollar İnşa Et"
 TR_GENERIC_build_highways_desc:0 "[Root.GetNameDef] genelinde insanların uzun mesafeli ulaşımı için otoyollara ihtiyaç var. Biraz inşa edelim."
 TR_GENERIC_expand_urban_areas:0 "Kentsel Alanları Genişlet"
 TR_GENERIC_expand_urban_areas_desc:0 "[Root.GetNameDef] ülkesinin kentsel bölgeleri, ilerlemesinin ve potansiyel olarak ekonomisinin çekirdeğidir. Kent yaşamını genişletip iyileştirerek ekonomiyi daha da merkezileştirebilir ve vatandaşlarımızın dinamizmini artırabiliriz."
 TR_GENERIC_developmentalism:0 "Kalkınmacılık"
 TR_GENERIC_developmentalism_desc:0 "Kalkınmacılık, az gelişmiş ülkelerin ekonomilerini geliştirmenin en iyi yolunun yüksek gümrük vergileriyle güçlü ve çeşitli bir iç pazara sahip olmak olduğunu savunan bir ekonomi teorisidir."
 TR_GENERIC_increase_resource_production:0 "Kaynak Üretimini Artır"
 TR_GENERIC_increase_resource_production_desc:0 "Üretim sahalarımızda daha yüksek kaynak verimi, toplu ihracatta daha yüksek gelir demektir. Kaynak çıkarımına öncelik vermek hem ekonomimizi güçlendirecek hem de askerlerimiz için daha fazla teçhizat üretmemizi sağlayacak."
 TR_GENERIC_economic_autonomy:0 "Ekonomik Özerklik"
 TR_GENERIC_economic_autonomy_desc:0 "Bir ülke için en büyük tehlikelerden biri ekonomisini yabancı bir güce teslim etmektir. Halkımız onların ezeceği değil, bizim halkımızdır."
 TR_GENERIC_autarky:0 "Otarşi"
 TR_GENERIC_autarky_desc:0 "Kendi kendine yeterlilik, vatandaşlarımıza öğretebileceğimiz en önemli şeylerden biridir. Bu yalnızca bürokrasinin iş yükünün azalması değil, aynı zamanda ulusal güvenlik tehditlerinin azalması, iç siyaset üzerinde daha fazla kontrol ve daha eğitimli bir halk anlamına gelir."
 TR_GENERIC_economic_measures:0 "Ekonomik Tedbirler"
 TR_GENERIC_economic_measures_desc:0 "Ekonomik düzenleyici tedbirler ve uluslararası borç kontrolü uygulayarak yerel bütçemizde büyümeyi teşvik edebilir ve borç faiz oranlarını düşürebiliriz."
 TR_GENERIC_assure_the_national_fuel_reserve:0 "Ulusal Yakıt Rezervini Güvenceye Al"
 TR_GENERIC_assure_the_national_fuel_reserve_desc:0 "Petrolümüz yalnızca araçlar ve zırhlılarda askeri kullanım için değil, genel sivil ulaşım ve günlük kullanım için de son derece önemlidir. Bu kara altını depolamada Ulusal Yakıt Rezervini daha etkili hâle getirmek için yakıt silolarını derinleştirebiliriz."
 TR_GENERIC_ease_of_business_reforms:0 "İş Yapma Kolaylığı Reformları"
 TR_GENERIC_ease_of_business_reforms_desc:0 "[Root.GetAdjective] vatandaşları arasında harcamayı ve girişimciliği teşvik etmenin olası yollarından biri, bağımsız girişimcilerin geçimini sağlamasını daha kolay ve kârlı hâle getirecek şekilde hukuku ve ekonomiyi reforme etmektir."
 TR_GENERIC_attract_foreign_investors:0 "Yabancı Yatırımcıları Çek"
 TR_GENERIC_attract_foreign_investors_desc:0 "Ticaret hukukunu gevşeterek topraklarımızı, burada bir iki parlak fırsat görebilecek fırsatçı yabancı yatırımcılar için cazip hâle getirebiliriz."
 TR_GENERIC_mobilize_the_working_class:0 "İşçi Sınıfını Seferber Et"
 TR_GENERIC_mobilize_the_working_class_desc:0 "Askerlik şubelerine daha fazla harcama yapmak, bir çatışma çıkması hâlinde [Root.GetNameDef] ülkesini zafere taşıyacak yeterli insan gücüne ve sanayi desteğine sahip olmamızı sağlamanın en kesin yollarından biridir."
 TR_GENERIC_light_industry_investments:0 "Hafif Sanayi Yatırımları"
 TR_GENERIC_light_industry_investments_desc:0 "Sivil sanayilere ve petrol kompleksine sermaye aktarmak, ekonomimizin en zor zamanlarda bile öne çıkmasına yardımcı olabilir."
 TR_GENERIC_heavy_industry_investments:0 "Ağır Sanayi Yatırımları"
 TR_GENERIC_heavy_industry_investments_desc:0 "Askeri-sanayi kompleksine sermaye aktarmak teçhizat üretimini artıracak ve tüm askerlerimizin savaş için iyi donatılmasını sağlayacak."
 TR_GENERIC_refitting_the_military_industry:0 "Askeri Sanayinin Yenilenmesi"
 TR_GENERIC_refitting_the_military_industry_desc:0 "Teçhizat üretimimizin geri kalmaması için yeni fabrikalar açabiliriz."
 TR_GENERIC_energy_sector:0 "Enerji Sektörü"
 TR_GENERIC_energy_sector_desc:0 "Bir ülkeyi ayakta tutabilmek için önce enerji sektörünün güncel tutulması gerekir. Tüm bölgeye uygun fiyatlı ve güvenilir enerji sağlamak için hem bir fosil yakıtlı santral hem de yenilenebilir enerji altyapısı kurmalıyız."
 TR_GENERIC_fossil_powerplant:0 "Fosil Yakıtlı Santraller"
 TR_GENERIC_fossil_powerplant_desc:0 "Enerji sektörümüzü fosil yakıtları TEK doğru seçim olarak benimsemeye odaklayabilir; ucuz ve iyi bilinen enerji üretim yöntemleri uğruna verimden ve yenilikten feragat edebiliriz."
 TR_GENERIC_improved_energy_cycling:0 "Geliştirilmiş Santraller"
 TR_GENERIC_improved_energy_cycling_desc:0 "Enerji sektöründeki tutumumuzu açıkça ortaya koyarak daha fazla şirket ve kuruluşun fosil yakıtla enerji üretimini tercih etmesini sağlayabiliriz. Bu aynı zamanda yenilenebilir enerji kaynakları için duraklama anlamına gelir."
 TR_GENERIC_renewable_retooling:0 "Yenilenebilir Dönüşüm"
 TR_GENERIC_renewable_retooling_desc:0 "Bunun yerine enerji sektörümüzü alternatif, sürdürülebilir yakıtlara yönelterek güvenilirlikten feragat edip daha yüksek maliyete katlanma pahasına yüksek verim ve düşük çevresel etki elde edebiliriz."
 TR_GENERIC_combined_military_defense_industries:0 "Birleşik Savunma Sanayileri"
 TR_GENERIC_combined_military_defense_industries_desc:0 "Mükemmel çalışmamız ve çabamız sayesinde artık savunma sanayilerimizi daha verimli yönetebiliyoruz."
 TR_GENERIC_renewable_infrastructure:0 "Yenilenebilir Altyapı"
 TR_GENERIC_renewable_infrastructure_desc:0 "Ülkemizde yenilenebilir enerjiye ilgi arttığına göre artık ilgili yatırımcıların mali desteğiyle sürdürülebilir altyapının inşasına devam edebiliriz."
 TR_GENERIC_unemployment_program:0 "İşsizlik Programları"
 TR_GENERIC_unemployment_program_desc:0 "Ülke zarar görmeye başlamadan önce daha yüksek işsizlik seviyelerine dayanabilmemiz için aceleci tedbirler alınabilir. Bu tedbirlerin uygulanması, halkın yararına sosyal yardım ve sağlık bütçemizi düzenlemenin de bir yolu olabilir."
 TR_GENERIC_satisfy_the_middle_class:0 "Orta Sınıfı Memnun Et"
 TR_GENERIC_satisfy_the_middle_class_desc:0 "Orta sınıf belki de ülkedeki en büyük çıkar grubudur. Çoğunlukla sanayi ve iş dünyası gruplarından oluşan bu kesimin kentsel altyapının genişletilmesiyle memnun olmasını bekleyebiliriz."
 TR_GENERIC_build_churches:0 "İbadethaneler İnşa Et"
 TR_GENERIC_build_churches_desc:0 "Din adamlarını memnun tutmak istiyorsak ülke genelinde ibadethanelerin ve diğer ibadet yerlerinin inşasına da sermaye aktarmalıyız. Ortalama vatandaşın bunun bir yan etkisi olarak daha ayakları yere basan biri olması da bir fayda."
 TR_GENERIC_please_the_upper_class:0 "Üst Sınıfı Memnun Et"
 TR_GENERIC_please_the_upper_class_desc:0 "Oligarşi, yatırımların, arazi alımlarının ve hem mikro hem makro düzeyde ekonominin arkasındaki görünmez el olarak her devletin küçük ama önemli bir parçasını oluşturur. Onları yatıştırmak bizim için gayet doğaldır."
 TR_GENERIC_import_foreign_automobiles:0 "Yabancı Otomobil İthal Et"
 TR_GENERIC_import_foreign_automobiles_desc:0 "Komşunun tavuğu komşuya kaz görünür; sınırın öte yanındaki arabalar da hep daha temiz görünür. Motorlu taşıtları doğrudan yabancı sanayilerden ithal etmek, hükümet için biraz heyecan yaratmanın harika bir bahanesi olacak."
 TR_GENERIC_invest_in_biofuels:0 "Biyoyakıtlara Yatırım Yap"
 TR_GENERIC_invest_in_biofuels_desc:0 "Alternatif enerji gelecektir! ...Ya da yatırımcılar öyle diyor. Her hâlükârda onların çıkarlarına ve bu çıkarların ülkemizinkilerle örtüşeceğine inanıyoruz."
 TR_GENERIC_assure_intellectual_freedoms:0 "Fikir Özgürlüğünü Güvenceye Al"
 TR_GENERIC_assure_intellectual_freedoms_desc:0 "[Root.GetNameDef] genelindeki tüm aydınlar, bilimsel çabalarının yalnızca değerli değil aynı zamanda refahımızın anahtarı olduğunu ve ideolojileri ya da bağlılıkları ne olursa olsun korunacağını bilsin."
 TR_GENERIC_create_an_automotive_industry:0 "Otomotiv Sanayisi Kur"
 TR_GENERIC_create_an_automotive_industry_desc:0 "O sinir bozucu yabancılardan otomobil üretiminin tüm küçük sırlarını öğrendikten sonra, ulusal sanayiyi canlandırmak ve bu süreçte alt sınıfı memnun etmek için kendi alternatiflerimizi geliştirmeye başlayabiliriz."
 TR_GENERIC_build_primary_schools:0 "İlkokullar İnşa Et"
 TR_GENERIC_build_primary_schools_desc:0 "Eğitim, dünyanın her ülkesinde halkın kalbi ve ruhudur. Özellikle ilköğretime erişim son derece önemlidir; çünkü eğitimsiz bir çocuk eğitimsiz bir yetişkin olarak büyür. Daha fazla ilkokul inşa etmek ülkemizin okuryazarlık oranını artırmamızı sağlayacak."
 TR_GENERIC_assure_access_to_education:0 "Eğitime Erişimi Güvenceye Al"
 TR_GENERIC_assure_access_to_education_desc:0 "Eğitim yalnızca temel bir ihtiyaç değil, bir haktır! Her zaman tüm vatandaşlar için eksiksiz sağlandığından emin olmalıyız. Bu sağlandığında yeni nesil aydınlar mutlaka bize destek olacaktır."
 TR_GENERIC_expand_the_universities:0 "Üniversiteleri Genişlet"
 TR_GENERIC_expand_the_universities_desc:0 "İlköğretimin temelleri atıldığına göre artık yükseköğretime yatırım yapabiliriz; böylece [Root.GetNameDef] de dâhiler ve dünyaca ünlü aydınlar yetiştirebilir."
 TR_GENERIC_industrial_research_task_forces:0 "Sanayi Araştırma Görev Güçleri"
 TR_GENERIC_industrial_research_task_forces_desc:0 "Sanayi Araştırma Görev Gücümüz, gelecekte uygulayabilmemiz için en iyi sanayi uygulamalarını gözlemlemeye adanmış, devlet tarafından finanse edilen bir araştırmacılar ekibi olacak."
 TR_GENERIC_naval_reform:0 "Deniz Kuvvetleri Reformu"
 TR_GENERIC_naval_reform_desc:0 "Artık eskimiş denizcilik uygulamalarımızdan kurtulup deniz kuvvetlerimizi daha ciddiye almanın zamanı geldi."
 TR_GENERIC_naval_bases:0 "Deniz Üsleri"
 TR_GENERIC_naval_bases_desc:0 "Kıyılar boyunca rıhtım ve liman inşası yalnızca sanayiye değil, donanmamıza da fayda sağlayacak."
 TR_GENERIC_submarines:0 "Denizaltılar"
 TR_GENERIC_submarines_desc:0 "İşgalcilerin su üstü gemilerimize rahatsız edici derecede yaklaşmasını önlemek için denizaltı teknolojisini incelemeye başlayabiliriz."
 TR_GENERIC_surface_ships:0 "Su Üstü Gemileri"
 TR_GENERIC_surface_ships_desc:0 "Her deniz harekâtının ardındaki kaba kuvvet olan en etkili ve modern su üstü gemilerini araştırmak bizi doğrudan deniz üstünlüğüne taşıyacak."
 TR_GENERIC_dockyards:0 "Tersaneler"
 TR_GENERIC_dockyards_desc:0 "Ticarette ve muharebede gelişmek için daha fazla liman inşa etmemiz ve deniz sanayisini teşvik etmemiz gerekiyor!"
 TR_GENERIC_nuclear_submarines:0 "Nükleer Denizaltılar"
 TR_GENERIC_nuclear_submarines_desc:0 "Nükleer denizaltı, bir nükleer reaktörle çalışan her tür denizaltıdır. Daha güçlü ve daha hızlıdırlar ve neredeyse hiç yakıt ikmaline ihtiyaç duymazlar."
 TR_GENERIC_naval_doctrine_innovations:0 "Deniz Doktrini Yenilikleri"
 TR_GENERIC_naval_doctrine_innovations_desc:0 "Deniz muharebesinde daha etkili olmak için dünyanın en güçlü ordularından bazılarının standart doktrinlerini inceleyebiliriz."
 TR_GENERIC_aircraft_carriers:0 "Uçak Gemileri"
 TR_GENERIC_aircraft_carriers_desc:0 "Uçak gemisi; tam boy uçuş güvertesiyle ve uçakları taşıma, silahlandırma, konuşlandırma ve geri alma tesisleriyle donatılmış, denizde hava üssü işlevi gören bir savaş gemisidir."
 TR_GENERIC_naval_doctrine_expertise:0 "Deniz Doktrini Uzmanlığı"
 TR_GENERIC_naval_doctrine_expertise_desc:0 "Modern deniz doktrininin her unsurunu birleşik bir taktik bütününe entegre etmek, en büyük deniz güçlerini bile ustalığımız karşısında titretecek."
 TR_GENERIC_vessel_production:0 "Gemi İnşası"
 TR_GENERIC_vessel_production_desc:0 "Tersane bürokrasisini optimize ederek ve kıyı illerinde denizcilik kültürünü teşvik ederek gemi üretim hızında bir artış sağlamak mümkün olabilir."
 TR_GENERIC_air_force_reform:0 "Hava Kuvvetleri Reformu"
 TR_GENERIC_air_force_reform_desc:0 "Göklerine hâkim olan bir milletin topraklarına da hâkim olacağı ilkesiyle havayla ilgili tüm doktrinlerde modernizasyona gitmeliyiz."
 TR_GENERIC_fighter_planes:0 "Avcı Uçakları"
 TR_GENERIC_fighter_planes_desc:0 "Avcı veya önleme uçakları havadan havaya çatışma göz önünde bulundurularak tasarlanır. Hava kuvvetlerimizin her muharebe alanında hava üstünlüğü kurmasının başlıca yoludur."
 TR_GENERIC_air_doctrine_innovations:0 "Hava Doktrini Yenilikleri"
 TR_GENERIC_air_doctrine_innovations_desc:0 "Hava doktrini, bizim ve düşmanlarımızın teknolojisi kadar hızlı değişir ve onunla birlikte evrilir. Bu süreci hızlandırmanın zamanı geldi."
 TR_GENERIC_countermeasures_against_aircraft:0 "Uçaklara Karşı Önlemler"
 TR_GENERIC_countermeasures_against_aircraft_desc:0 "Topraklarımızı havada potansiyel olarak üstün olan düşmanlara karşı savunacaksak özellikle uçaksavar silah teknolojisine odaklanmalıyız."
 TR_GENERIC_bomber_planes:0 "Bombardıman Uçakları"
 TR_GENERIC_bomber_planes_desc:0 "Bombardıman uçaklarıyla yapılan stratejik bombardıman, düzensiz savaş çağında bile düşmanın moralini bozar ve lojistik ağına zarar verir. Taarruzda önceliklidir."
 TR_GENERIC_drones:0 "İHA'lar"
 TR_GENERIC_drones_desc:0 "İHA (insansız hava aracı) teknolojisi, uzaktan kumanda edildikleri için tek bir askerimizi bile feda etmeden ister insan ister altyapı olsun uzak mesafedeki hedefleri bombalama, suikastle ortadan kaldırma ve yok etme imkânı verecek."
 TR_GENERIC_air_doctrine_expertise:0 "Hava Doktrini Uzmanlığı"
 TR_GENERIC_air_doctrine_expertise_desc:0 "Hava kuvvetlerimiz artık gerçekten hesaba katılması gereken bir güç; kullandığımız taktikler de öyle. Doktrinimizi modernleştirmeye ve geliştirmeye devam etmek gökyüzüne daha önce hiç düşünülmemiş şekillerde hâkim olmamızı sağlayacak."
 TR_GENERIC_army_reform:0 "Ordu Reformu"
 TR_GENERIC_military_emergency:0 "Askeri Olağanüstü Hâl"
 TR_GENERIC_land_doctrine_innovations:0 "Kara Doktrini Yenilikleri"
 TR_GENERIC_military_exercises:0 "Askeri Tatbikatlar"
 TR_GENERIC_military_education_reform:0 "Askeri Eğitim Reformu"
 TR_GENERIC_infantry_equipment_development:0 "Piyade Teçhizatının Geliştirilmesi"
 TR_GENERIC_land_doctrine_expertise:0 "Kara Doktrini Uzmanlığı"
 TR_GENERIC_artillery_experiments:0 "Topçu Deneyleri"
 TR_GENERIC_uniform_improvements:0 "Üniforma İyileştirmeleri"
 TR_GENERIC_self_propelled_artillery:0 "Kundağı Motorlu Topçu"
 TR_GENERIC_develop_armor_prototypes:0 "Zırhlı Prototipler Geliştir"
 TR_GENERIC_countermeasures_against_armored_units:0 "Zırhlı Birliklere Karşı Önlemler"
 MIT_send_forces_to_islands:0 "Ege Adalarına Adım At"
