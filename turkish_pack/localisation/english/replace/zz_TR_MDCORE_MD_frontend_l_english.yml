 MD_MAJOR_CHANGES:0 "v2.0'daki Önemli Değişiklikler"
 MD_MAJOR_CHANGES_TEXT:0 "- Yükleme ve çalışma sırasında daha iyi performans ve HOI4'ün en son güncellemesiyle uyumluluk için çekirdek sistemlerin eksiksiz ve tam yeniden yazımı\n\n- Ekonomi ve Siyaset için geliştirilmiş kullanıcı arayüzleri\n\n- Mikroçipler ve Kompozitler ile Teknoloji Ağacının 2080'e kadar genişletilmesi\n\n- Kaynak Depolama, Dinamik Kaynak Fiyatlandırması ve Enflasyon\n\n- Yeniden düzenlenen Uluslararası Sistemler (artık Birleşmiş Milletler ve Antarktika ile birlikte!)\n\n- Şu ülkeler için yeni veya geliştirilmiş Odak Ağaçları: Çin, Japonya, Yunanistan, Fransa, Suudi Arabistan, Türkiye, Benelüks, Hong Kong, Kuzey Kore ve Polonya\n\n- Genel MIO'ların ve Savunma Şirketlerinin yeniden düzenlenmesi ve şu ülkeler için yeni MIO'ların eklenmesi: ABD, Rusya, Yunanistan, Belçika, Hollanda, İtalya ve Fransa\n\n- Düzinelerce hata düzeltmesi ve istikrar iyileştirmesi\n\n- Event Horizon özel senaryosu ile oyun kurallarının birleştirilmesi ve genişletilmesi"
