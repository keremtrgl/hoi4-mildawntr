 gcc_invite.1.t:0 "Körfez'den Bir Davet"
 gcc_invite.1.d:0 "Körfez İşbirliği Konseyi adına konuşan [FROM.GetName], birliğe katılmamız için resmî bir davet gönderdi. Üyelik, ekonomimizi ve güvenliğimizi Arap dünyasının en zengin bloğuna bağlayacaktır. Konsey yanıtımızı bekliyor."
 gcc_invite.1.a:0 "Kabul ediyoruz. Konsey çok yaşasın."
 gcc_invite.1.b:0 "Şimdilik reddetmeliyiz."
 gcc_invite.2.t:0 "KIK Yeni Bir Üyeyi Karsiliyor"
 gcc_invite.2.d:0 "Riyad'daki bir törenle Körfez İşbirliği Konseyi, birliği ilk kez Körfez kıyılarının ötesine genişleterek yeni bir üye devleti resmen kabul etti. Bloğun erişimi ve hırsları büyüyor."
 gcc_invite.2.a:0 "Tarihî bir gün."
 gcc_invite.3.t:0 "Davet Reddedildi"
 gcc_invite.3.d:0 "Davetimiz geri çevrildi. Konseyin genişlemesi daha istekli bir ortağı ya da fikir değişikliğini beklemek zorunda kalacak."
 gcc_invite.3.a:0 "Öyle olsun."
