 MD_NUCLEAR_GUIDE:0 "§YMillennium Dawn'ın§! nükleer silahları işlemek için vanilya nükleer üretim sistemine dayanmaz. Bu sayaç oynanışınız boyunca §Y0§! kalacaktır.\n\nBunun yerine önce nükleer silah üretme yeteneğinin kilidini açmak için uygun §YÖzel Projeleri§! tamamlayın. Ardından nükleer silah kullanmak için taktik nükleer saldırılar yapmak üzere nükleer onay modülü takılı uçaklar üretin ya da eyalet ve stratejik düzeyde nükleer saldırıların kilidini açmak için §YICBM'ler§! veya §YNükleer IRBM'ler§! üretin.\n\n Tüm nükleer saldırılar, nükleer §Rbaskınların§! içinde yer alan seçeneklerdir. Nükleer saldırı denemeden önce §YNükleer Durumunuzu§! ve §YNükleer Silah Duruşunuzu§! kontrol edin ve saldırı ölçütlerinin karşılandığından emin olun."
