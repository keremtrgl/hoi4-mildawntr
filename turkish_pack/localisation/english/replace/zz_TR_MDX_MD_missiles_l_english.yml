 space_auto_preset_8:0 "§YÖzel§!"
 space_auto_preset_0_desc:0 "En çok eskimiş ağı yeniden kurar, ardından bir sonrakine geçer. Şu anda inşa edilecek bir şey yok."
 space_auto_preset_0_desc_gnss:0 "Önce en eskimiş ağ yeniden kuruluyor: şu anda §GGNSS§!. Kapasiteye ulaşınca kendiliğinden bir sonrakine geçer."
 space_auto_preset_0_desc_com:0 "Önce en eskimiş ağ yeniden kuruluyor: şu anda §GCOMSAT§!. Kapasiteye ulaşınca kendiliğinden bir sonrakine geçer."
 space_auto_preset_0_desc_spy:0 "Önce en eskimiş ağ yeniden kuruluyor: şu anda §GSPYSAT§!. Kapasiteye ulaşınca kendiliğinden bir sonrakine geçer."
 space_auto_preset_1_desc:0 "Dört yuvanın hepsi GNSS. Ordu hızı, hava ve deniz saldırı isabeti, inşaat hızı ve kaynak üretimi."
 space_auto_preset_2_desc:0 "Dört yuvanın hepsi COMSAT. Komuta gücü, ordu düzeni, planlama hızı, siyasi güç ve istihbarat operasyonları."
 space_auto_preset_3_desc:0 "Dört yuvanın hepsi SPYSAT. Planlama sınırı, keşif, tespit, konvoy verimi, araştırma hızı ve istihbarat kapsamı."
 space_auto_preset_4_desc:0 "Uçuş başına iki GNSS ve iki COMSAT. Komuta ve kontrolün yanında hedefleme ve inşaat."
 space_auto_preset_5_desc:0 "Uçuş başına iki GNSS ve iki SPYSAT. Keşif ve araştırmanın yanında hedefleme ve inşaat."
 space_auto_preset_6_desc:0 "Uçuş başına iki COMSAT ve iki SPYSAT. Keşif ve istihbaratın yanında komuta ve kontrol."
 space_auto_preset_7_desc:0 "İki GNSS, bir COMSAT ve bir SPYSAT. En ucuz ve en hafif olduğu için GNSS iki kat ağırlıklandırılır."
 space_auto_preset_8_desc:0 "Fırlatma ekranında hazırlayıp kaydettiğiniz manifestoyu uçurur. Faydalı yükler yine her hafta en yeni nesle yükseltilir."
 SPACE_AUTO_ROTATION:0 "§gRotasyon:§! [?var_space_auto_flights|C0]"
 SPACE_AUTO_ROTATION_TT:0 "Rotasyon başına fırlatılan uçuş sayısı. Her uçuş bir fırlatma aracı ve tam faydalı yük manifestosu taşır.\n\nBir rotasyon, stok her uçuş için eksiksiz bir set içerdiğinde uçar; bu nedenle üretim yetişirken gerçek sayı daha düşük olabilir.\n\nHarcama düğmeniz budur. Bu büyüklükteki bir rotasyonun bedeli yaklaşık §Y$[?var_space_auto_est_cost|C1] milyar§!dır ve inşa süresi boyunca haftalık olarak dağıtılır.\n\n§YDeğişiklikler hemen uygulanır§! - otomasyonu kapatıp açmanıza gerek yoktur. Üretimdeki hiçbir şeyin fiyatı yeniden belirlenmez; yeni büyüklük yalnızca bir sonraki parti sipariş edildiğinde ücretlendirilir."
 SPACE_AUTO_ROTATION_PLUS_TT:0 "Rotasyon başına bir uçuş daha (en fazla 10)"
 SPACE_AUTO_ROTATION_MINUS_TT:0 "Rotasyon başına bir uçuş daha az (en az 1)"
 SPACE_AUTO_BUDGET:0 "§gHaftalık:§! $[?space_prod_expense|C1] milyar"
 SPACE_AUTO_FUNDS_TT:0 "Otomasyonun harcayabileceği kalan tutar: hazineniz eksi devam eden partilerin hâlâ borçlu olduğu miktar.\n\nBir parti yalnızca bu tutar tam fiyatını karşıladığında başlar. Bu haftalık bir değer değildir; haftalık ücret solda gösterilir."
 SPACE_AUTO_BUDGET_TT:0 "Devam eden üretiminizin her hafta ne kadar ücretlendirildiği ve otomasyonun kullanabileceği fonlar.\n\nBir parti yalnızca §Yhazineniz tam fiyatını karşıladığında§! başlatılır. Başladıktan sonra tek seferde düşülmez, inşa süresi boyunca haftalık olarak ödenir; bu, elle verdiğiniz siparişler için de geçerlidir.\n\nMevcut büyüklükte tam bir rotasyonun bedeli yaklaşık §Y$[?var_space_auto_est_cost|C1] milyar§!dır. Rotasyonu değiştirmek halihazırda inşa edilenlere asla dokunmaz: partiler sipariş edildikleri büyüklük ve ücretle devam eder, yeni değer yalnızca bir sonraki parti verildiğinde faturalanır.\n\n§Yaçık finansmanı§! açıkken hazine kontrolü tamamen atlanır ve siparişler borçla ilerler."
 SPACE_AUTO_SAVE_BUTTON:0 "Özeli Kaydet"
 SPACE_AUTO_SAVE_BUTTON_TT:0 "[!space_auto_save_button_click_enabled]Yukarıda hazırlanan faydalı yük manifestosunu §YÖzel§! plan olarak saklar ve bu plana geçer."
 SPACE_AUTO_SAVE_TT_trigger_2:0 "Yukarıda en az bir §YFaydalı Yük§! yüklü"
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED:0 "Yalnızca faydalı yük yuvaları saklanır. Fırlatma aracı her zaman araştırdığınız en yenisidir, bu yüzden seçilmesine gerek yoktur."
 SPACE_AUTO_UPGRADE_BUTTON:0 "Şimdi Yükselt"
 SPACE_AUTO_UPGRADE_BUTTON_TT:0 "[!space_auto_upgrade_button_click_enabled]Yörüngedeki uydular kapsama kaybı olmadan izin verdiği ölçüde, her takımyıldızı araştırdığınız en yeni nesle yükseltir."
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED:0 "Hiçbir şey bir takımyıldızı kendiliğinden yükseltmez, yalnızca zamanla bozulur; bu yüzden bu işlem olmadan yeni uydularınız yörüngede boşuna bekler.\n\nOtomasyon bunu her fırlatmadan sonra yapar; bu düğme elle fırlatma yaptığınız zamanlar içindir."
 SPACE_AUTO_MANIFEST_TT:0 "Bu rotasyonda tek bir uçuşun taşıdığı fırlatma aracı ve faydalı yükler.\n\nOtomasyon, hangardaki §Yhâlâ bir faydalı yük kaldırabilen en eski roketi§! uçurur; böylece fazla eski kademeler yenilerinden önce harcanır. Yeni üretim her zaman en yeni nesildir, dolayısıyla eski stok kendiliğinden erir.\n\nTakımyıldızı zaten dolu olan yuvalar hâlâ eksik olan bir aileye devredilir ve manifesto o roketin kaldırabileceği kadarına kısaltılır; bu yüzden sayı dört yuvanızın altında olabilir ve eski bir roket uçuş başına daha az uydu taşır."
 SPACE_AUTO_BUILDING_TT:0 "Şu anda üretim hatlarında olanlar. Bunlar sıradan üretim partileridir; bu pencerenin §YÜretim§! sekmesinde kalan süreleriyle birlikte görünür ve tür başına tek parti sınırına dahildir.\n\nFırlatma araçlarının inşası uydulardan çok daha uzun sürer, bu yüzden açtıktan sonraki ilk rotasyon neredeyse bir yıl sonra olabilir."
 SPACE_AUTO_DEFICIT:0 "Açık finansman"
 SPACE_AUTO_DEFICIT_TT:0 "Hazine bakiyesine bakılmaksızın siparişe izin verir ve maliyeti borç olarak işler.\n\nKapalıyken bir parti yalnızca hazineniz tam fiyatını karşılıyorsa başlar; böylece program asla olmayan parayı harcayamaz. Otomasyon aşırıya kaçmak yerine boşta bekler.\n\n§RYaklaşan bir iflas çöküşü, ne olursa olsun onu her zaman durdurur§! - bu güvenlik kapatılamaz."
 SPACE_AUTO_DEFICIT_TT_DELAYED:0 "Bu, bir uzay programının onu finanse eden ekonomiyi geride bırakmasını sağlayan düğmedir."
 SPACE_AUTO_STOCKPILE:0 "Önceden inşa et"
 SPACE_AUTO_STOCKPILE_TT:0 "Tüm programı, rotasyon rotasyon yerine baştan inşa eder.\n\nFırlatma araçları 240-440 günde, uydular ise 80-260 günde yapıldığından yalnızca bir sonraki rotasyonun ihtiyacını sipariş etmek rampayı roketleri bekleyerek boşta bırakır. Bu açıkken otomasyon programın ihtiyaç duyacağı her fırlatmayı ve kalan takımyıldızın tamamını tek partide sipariş eder.\n\nHaftalık maliyeti çok daha yüksektir, ancak kapasiteye çok daha çabuk ulaşır ve duraksamadan fırlatmaya devam eder."
 SPACE_AUTO_STOCKPILE_TT_DELAYED:0 "§Yaçık finansmanla§! iyi eşleşir: stok, bütçenizin satın aldığı şeydir; açık düğmesi ise onun tavanını kaldıran şeydir."
 SPACE_AUTO_LATEST_OLV:0 "Yalnızca en yeni OLV"
 SPACE_AUTO_LATEST_OLV_TT:0 "Yalnızca araştırdığınız en yeni fırlatma aracını uçurur.\n\nKapalıyken otomasyon, §Ymanifestoyu hâlâ kaldırabilen stoktaki en eski roketi§! uçurur ve en yeni nesli siparişte tutar; böylece önceki nesilden kalan kademeler hangarda beklemek yerine harcanır. Eski bir roket daha az kaldırır, bu yüzden bu uçuşlar daha küçük bir manifesto taşır.\n\nAçıkken eski kademeler tamamen yok sayılır. Her uçuş tam manifestoyu taşır, ancak program elindekini fırlatmak yerine yeni roketleri bekler."
 SPACE_AUTO_LATEST_OLV_TT_DELAYED:0 "Kalan kademeleriniz bir fırlatma yuvasına değmeyecek kadar küçükse bunu açın; hangarı beklemek yerine boşaltmayı tercih ediyorsanız kapatın.\n\n§RSPYSAT faydalı yükleri tam olarak ilgili roketin kaldırabileceği kadar ağırdır§!. Bir casus uydu planında eski bir kademe en yeni nesli asla taşıyamaz; bu yüzden bu düğme orada hiçbir şeyi değiştirmez."
 SPACE_AUTO_NET_GNSS_TT:0 "§YSeyrüsel uydular§! - ordu hızı, yakın hava desteği ve deniz saldırı isabeti, stratejik bombardıman, konumlandırma ve deniz isabet şansı; ayrıca sivil tarafta inşaat hızı ve kaynak çıkarımı.\n\nYörüngeye yerleştirilmesi en ucuz ve en hafif ailedir."
 SPACE_AUTO_NET_COM_TT:0 "§YHaberleşme uyduları§! - komuta gücü, ordu düzeni, planlama hızı, hava eşliği ve önleme, deniz koordinasyonu; ayrıca siyasi güç, şifreleme, istihbarat ağı kazancı ve operasyon sonuçları.\n\nEtkinlik ayrıca yer alıcı teknolojinize de bağlıdır."
 SPACE_AUTO_NET_SPY_TT:0 "§YKeşif uyduları§! - planlama sınırı, keşif, hava durumu cezasının azaltılması, tespit ve konvoy verimi; ayrıca araştırma hızı, tüm kollarda istihbarat kapsamı ve direnişin bastırılması.\n\nTakımyıldızlarınızın ötesindeki yedekler casusluk görevlerine atanabilir."
