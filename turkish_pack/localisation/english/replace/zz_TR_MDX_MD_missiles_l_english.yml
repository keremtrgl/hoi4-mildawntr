 TOTAL_SAT_NUM_TT:0 "Yörüngedeki toplam uydu sayısı."
 TOTAL_SAT_NUM_TT_DELAYED:0 "Her ülke toplamda §Y3.000 uyduya§!, GNSS, COMSAT, SPYSAT ve KILLSAT türlerinin her birinden ise en fazla §Y1.000 uyduya§! sahip olabilir. Sınırlardan birine ulaşıldığında başarılı fırlatmalar, aynı türdeki en düşük nesil uygun uyduların yerine yeni nesilleri koyar. Aynı neslin daha fazlasına yer açmak için uyduları yörüngeden çıkarın."
