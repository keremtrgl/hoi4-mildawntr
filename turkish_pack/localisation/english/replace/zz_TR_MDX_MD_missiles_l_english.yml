 OLV_LAUNCH_BUTTON_TT_trigger_3:0 "§YUçuş Sayısı§! > 0"
 OLV_LAUNCH_BUTTON_TT_DELAYED:0 "Her ülke toplamda §Y3.000 uyduya§!, GNSS, COMSAT, SPYSAT ve KILLSAT türlerinin her birinden ise en fazla §Y1.000 uyduya§! sahip olabilir. Sınırlardan birine ulaşıldığında başarılı bir fırlatma, aynı türdeki en düşük nesil uygun uyduyu yalnızca daha yeni bir nesille değiştirir; başarısız fırlatmalar mevcut uyduları korur. Kapasite veya etkin casusluk görevleri nedeniyle engellenen bir uçuş, fırlatma aracını veya faydalı yükü tüketmeden durur."
 CLEAR_PAYLOAD_BUTTON:0 "Faydalı Yükü Temizle"
 SPACE_AUTO_TITLE:0 "§YProgram Otomasyonu§!"
 SPACE_AUTO_TITLE_TT:0 "Uzay programınızı ayrıntıyla uğraşmadan yürütür: her hafta seçili planın gerektirdiği uyduları ve fırlatma araçlarını sipariş eder, stok bir rotasyonu doldurabildiğinde bunları fırlatır.\n\nHer zaman §Yaraştırdığınız en yeni nesli§! üretir, asla eskisini değil; bir takımyıldız azami kapasiteye ulaştığında kendiliğinden durur.\n\n§Y3.000 toplam uyduya§! veya §Ytür başına 1.000 uyduya§! ulaşıldığında başarılı fırlatmalar, yeni nesillere yer açmak için aynı türdeki en düşük nesil uygun uyduları otomatik olarak yörüngeden çıkarır. Başarısız fırlatmalar mevcut uyduları korur. Uygun bir yedek yoksa otomasyon, fırlatma aracını veya faydalı yükü tüketmeden bekler. Etkin casusluk görevleri korunur.\n\n§YBu paneldeki değerler aylık olarak yeniden hesaplanır§! ve bu sekmeyi her yeniden açtığınızda da güncellenir; bir teknolojiyi bitirdikten sonra bir gösterge eskimiş görünürse sekmeler arasında geçip geri dönerek yenileyin.\n\n§RKILLSAT'lar otomatikleştirilmez§! - bunlar bir kapsama takımyıldızı değil yörünge silahlarıdır, dolayısıyla doldurulacak bir kapasite hedefi yoktur."
 SPACE_AUTO_STATUS_TT:0 "§YPasif§! - otomasyon kapalı.\n§YAktif§! - sipariş veriyor ve fırlatıyor; gösterilen değer mevcut haftalık ücrettir.\n§YBekliyor§! - etkin casusluk görevlerini aksatmadan fırlatmak için faydalı yük stoku veya yeterli uydu kapasitesi gerekir.\n§YKapasitede§! - plandaki her takımyıldız dolu; yeni bir nesil araştırana kadar boşta.\n§YTakıldı§! - plandaki hiçbir faydalı yük fırlatma aracına sığmıyor.\n§YDuraklatıldı§! - hazine bir sonraki partiyi karşılayamıyor; rotasyonu düşürün veya açık finansmanını etkinleştirin.\n§YDurduruldu§! - hazine boş ve açık finansmanı kapalı.\n\nBu durum aylık olarak ve bu sekmeyi her yeniden açtığınızda yeniden hesaplanır."
 SPACE_AUTO_TOGGLE_TT:0 "[!space_auto_toggle_button_click_enabled]Otomasyonu aç veya kapat."
 SPACE_AUTO_TOGGLE_TT_DELAYED:0 "Kapatmak yalnızca yeni siparişleri durdurur. Üretimdeki partiler tamamlanır ve teslim edilene kadar ücretlendirilmeye devam eder; yani ödediğiniz hiçbir şey boşa gitmez.\n\nTekrar açtığınızda takımyıldızlarınızın bulunduğu yerden devam eder."
 SPACE_AUTO_PRESET:0 "§gPlan:§! [space_auto_preset_name_loc]"
 SPACE_AUTO_PRESET_TT:0 "Otomasyonun hangi uyduları inşa edeceği. Elle tasarım gerekmez; her plan, araştırdığınız en yeni nesli kendisi seçer.\n\n§YOtomatik§! önce en eskimiş ağınızı yeniden kurar, o dolunca bir sonrakine geçer.\n§YOdak§! planları tüm yuvaları tek bir aileye ayırır.\n§YÇiftli§! ve §YDengeli§! planlar manifestoyu bölüştürür; diğerleri dolarken yuvaları en geride kalan aileye devreder.\n§YÖzel§! ise yukarıda hazırlayıp kaydettiğiniz manifestoyu uçurur."
