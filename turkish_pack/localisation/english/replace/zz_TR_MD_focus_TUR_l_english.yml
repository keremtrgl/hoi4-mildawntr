 TUR_arrest_members:0 "Şüpheli PKK Üyelerini Tutukla"
 TUR_attack_on_media:0 "PKK Karşıtı Propaganda"
 TUR_allow_pkk_bases:0 "PKK'yı Yasallaştır"
 TUR_appease_pkk:0 "PKK'yı Yatıştır"
 TUR_forbid_pkk_bases:0 "PKK'yı Yasakla"
 TUR_pkk.1.t:0 "PKK'ya Karsi Operasyon"
 TUR_pkk.1.d:0 "Kürtleri diyalogla yatıştıramayacağımız giderek daha açık hâle geliyor; bu da kontrolü ve istikrarı korumak için Kürt bölgelerimizde askeri operasyonlar düzenlemekten başka seçenek bırakmıyor. Başarı ihtimali seçtiğimiz seçeneğe bağlı. Başarırsak PKK'nın gücü sarsılacak, başaramazsak cesaretlenecekler."
 TUR_pkk.1.a:0 "Hesaplı ve İyi Planlanmış Bir Operasyon"
 TUR_pkk.1.b:0 "Hesaplı Bir Operasyon"
 TUR_pkk.1.c:0 "Plana gerek yok, girin!"
 TUR_pkk.2.t:0 "Operasyon Basarili"
 TUR_pkk.2.d:0 "Son operasyonumuzda PKK'yı başarıyla bastırdık. Güçleri dağların yükseklerine çekildi ve hazır olduklarında muhtemelen yeni saldırılar başlatacaklar, ancak şimdilik dinlenebiliriz."
 TUR_pkk.2.a:0 "Görev tamamlandı"
 TUR_pkk.3.t:0 "Operasyon Basarisiz"
 TUR_pkk.3.d:0 "Görünüşe göre kuvvetlerimiz Kürt bölgelerine girip PKK'yı dizginlemeye tam olarak hazır değildi ve geri çekilmek zorunda kaldılar. Türk askerlerinin muharebeden çekildiğini görmek PKK'ya savaşmaya devam etmek için daha fazla motivasyon verdi."
 TUR_pkk.3.a:0 "Yarın da bir gün..."
 TUR_pkk.4.t:0 "PKK Isyani"
 TUR_pkk.4.d:0 "PKK, Türkiye'nin doğusunda kendi devletini ilan etti ve bu uğurda sonuna kadar savaşmaya hazır. Bu, PKK'yı kontrol altında tutmaktaki başarısızlığımızın sonucudur; o illeri geri almak istiyorsak artık onlarla savaşarak uğraşmamız gerekecek. Ya da Kürt meselesinin yükünden kurtulmak için geri adım atabilir ve onları istedikleri gibi kendi yollarına bırakabiliriz."
 TUR_pkk.4.a:0 "Hayır! Savaşacağız"
 TUR_pkk.4.b:0 "Bırakın gitsinler..."
 TUR_pkk.5.t:0 "PKK Saldiri Baslatti"
 TUR_pkk.5.d:0 "PKK, Kürdistan bölgesinde konuşlu birliklerimize onları bölgeden atmak amacıyla saldırdı. Bu durum güçlerini artırdı ve böyle devam ederse PKK sonunda ayrılacak!"
 TUR_pkk.5.a:0 "Lanet olsun"
 TUR_pkk.5.b:0 "Karşı saldırı başlat"
 TurkeyRandomEvents.1.t:0 "§W[conservatism_L]§! Skandalla Sarsildi"
 TurkeyRandomEvents.1.desc:0 "İnternette, §W[conservatism_L]§! lideri Deniz Baykal'ı eski sekreteriyle birlikte bir yatak odasında gösteren bir video dolaşmaya başladı. Skandalın ardından Baykal istifa etmek zorunda kaldı."
 TurkeyRandomEvents.1.a:0 "Sanırım bizim için iyi oldu"
 TurkeyRandomEvents.1.b:0 "Bu video sahte! Baykal istifa etmeyecek!"
 TurkeyRandomEvents.1.c:0 "Hükümetin istifa etmekten başka seçeneği yok"
 Turkish_mafia.1.t:0 "Mafya Ortaligi Karistirdi!"
 Turkish_mafia.1.d:0 "Mafya büyük şehirlerimizden birinde ortalığı karıştırdı ve birkaç kişinin ölümüne yol açtı. Bu suçu kimin işlediği henüz bilinmese de polis teşkilatımız, söz konusu risklere rağmen failleri yakalamaya can atıyor."
 Turkish_mafia.1.a:0 "Daha fazla sorun çıkarmasak iyi olur..."
 Turkish_mafia.1.b:0 "Hemen kapsamlı bir soruşturma istiyorum!"
 Turkish_mafia.1.c:0 "Ayırabildiğiniz tüm kaynakları ayırın"
 Turkish_mafia.11.t:0 "Polis Aramasi Sonuçsuz Kaldi"
 Turkish_mafia.11.d:0 "Polis teşkilatımız, birkaç gün önce işlenen suçtan sorumlu mafya üyelerini bulamadı. Bu durum bazı mafya üyelerinin kendilerini dokunulmaz sanmasına yol açtı ve Mafyanın ülkedeki etkisini artırdı."
 Turkish_mafia.11.a:0 "Ne büyük beceriksizlik..."
 Turkish_mafia.12.t:0 "Polis Süphelileri Yakaladi"
 Turkish_mafia.12.d:0 "Emniyet müdürü, birkaç gün önce işlenen bir dizi cinayetle bağlantılı olarak birkaç suçlu ve şüphelinin yakalandığını duyurunca yöre halkı bugün derin bir nefes aldı. Mafyayla bağlantılı birçok kişi artık polis teşkilatımızın etkinliğinin farkında ve bu, başkalarının Mafyaya katılmadan önce iki kez düşünmesini sağlayacak."
 Turkish_mafia.12.a:0 "Çok iyi"
 Turkish_mafia.2.t:0 "Dedektifler Bir Mafya Siginagi Buldu"
 Turkish_mafia.2.d:0 "Kırsal kasabalarımızdan birindeki bir dedektif, olası bir mafya sığınağı bulduğunu bildirdi. Polis teşkilatı, içeride ne olduğunu ve hatta bunun gerçekten bir mafya sığınağı olup olmadığını bilmediği için hızla bir müdahale planı hazırlamaya çalışıyor. Mafyanın bu yerle bağlantılı olması çok muhtemel, ancak yine de her zaman riskler olacaktır."
 Turkish_mafia.2.a:0 "Bazı şeylere hiç dokunmamak daha iyi..."
 Turkish_mafia.2.b:0 "Ne demek müdahale planı hazırlamaya çalışıyorlar? Hazırlayın, hem de hemen!"
 Turkish_mafia.2.c:0 "Ayırabildiğiniz tüm kaynakları ayırın"
 Turkish_mafia.21.t:0 "Polis Kayip Verdi!"
 Turkish_mafia.21.d:0 "Görünüşe göre sığınak bir pusuymuş; memurlarımıza ateş açmaya hazır birkaç silahlı kişi bekliyormuş. Ne yazık ki silah ve yeterli destek eksikliği nedeniyle birkaç memurumuz hayatını kaybetti, çok daha fazlası yaralandı..."
 Turkish_mafia.21.a:0 "Kahretsin!"
 Turkish_mafia.22.t:0 "Siginak Güvenle Temizlendi"
 Turkish_mafia.22.d:0 "Son operasyonumuzda her şey kusursuz gitti. Sığınak birliklerimiz tarafından hızla temizlendi ve gafil avlanan birkaç şüpheli memurlarımız tarafından derhâl yakalandı."
 Turkish_mafia.22.a:0 "Harika"
 Turkish_mafia.3.t:0 "Büyük Bir Silah Deposu Bulundu"
 Turkish_mafia.3.d:0 "Devam eden bir arama sırasında polis, bir depoda saklanan büyük bir silah deposu buldu. Halktan pek çok kişi, polisin bu silahların nereden geldiğini bulmasını ve işin içindekileri tutuklamasını istiyor."
 Turkish_mafia.3.a:0 "Silahları alıp geçsek nasıl olur?"
 Turkish_mafia.3.b:0 "İyi fikir, hemen aramaya başlayın!"
 Turkish_mafia.3.c:0 "Ayırabildiğiniz tüm kaynakları ayırın"
 Turkish_mafia.31.t:0 "Polis Sorusturmayi Batirdi!"
 Turkish_mafia.31.d:0 "Koordinasyon eksikliği ve yüksek düzeydeki beceriksizlik nedeniyle polis teşkilatımız, silah deposunu bırakan suçluları bulamadı. Üstelik soruşturma sırasında polis kendi silahlarının önemli bir kısmını da kaybetti! Bunun nasıl olabildiğini soracak olursanız: Memurlarımız silah dolu bir ikmal kamyonetiyle olay yerine gitmiş, biri de kamyoneti kaçırıp gitmiş!"
 Turkish_mafia.31.a:0 "Ciddi misiniz?"
 Turkish_mafia.32.t:0 "Polis Süphelilerin Yerini Tespit Etti"
 Turkish_mafia.32.d:0 "Görünüşe göre daha kentleşmiş şehirlerimizden birinde yeraltı silah ticareti yapılıyormuş. Neyse ki büyük bir zarar oluşmadan suçluları yakalamayı başardık."
 Turkish_mafia.32.a:0 "Beklediğimiz standart budur"
 Turkish_mafia.4.t:0 "Polis Uyusturucu Kargosuna El Koydu"
 Turkish_mafia.4.d:0 "Bir grup memur şüpheli bir kargo konteynerine denk geldi ve açtıklarında hayrete düştüler. Bilinmeyen bir ağ aracılığıyla ülkeye büyük miktarda yasa dışı uyuşturucu sokulmuştu ve yöre halkı şüphelilerin yakalanmasını sabırsızlıkla bekliyor."
 Turkish_mafia.4.a:0 "Şey... tıbbi kullanım içindir herhalde, değil mi?"
 Turkish_mafia.4.b:0 "Hemen bir soruşturma istiyorum!"
 Turkish_mafia.4.c:0 "Ayırabildiğiniz tüm kaynakları ayırın"
 Turkish_mafia.41.t:0 "Süpheliler Gözaltina Alindi"
 Turkish_mafia.41.d:0 "Uyuşturucu konteyneriyle bağlantılı birkaç kişiyi bulduk ve şu anda polis tarafından sorgulanıyorlar. Halkın büyük kısmı, yasa dışı uyuşturucuların mahallelerine musallat olmayacağını bilmekten memnun."
 Turkish_mafia.41.a:0 "Hâlâ yapacak çok işimiz var! İşinizin başına dönün!"
 Turkish_mafia.42.t:0 "Sorusturma Sonuçsuz Kaldi"
 Turkish_mafia.42.d:0 "Uzun bir soruşturmanın ardından memurlarımız hiç kimseyi uyuşturucu konteyneriyle ilişkilendiremedi. Bu bizim için büyük bir kayıp; yasa dışı uyuşturucular hâlâ ülkeye sokuluyor ve elimizde hiçbir ipucu yok!"
 Turkish_mafia.42.a:0 "İnanılmaz"
 Turkish_mafia.5.t:0 "Mafya Üst Düzey Bir Yetkiliye Suikast Düzenledi"
 Turkish_mafia.5.d:0 "Bir trajedi yaşandı: Türk mafyası üst düzey bir yetkiliye suikast düzenledi. Bu, partimizin işini olması gerekenden çok daha zorlaştıracak ve muhalefetimiz büyük ihtimalle sevinçten havalara uçuyor..."
 Turkish_mafia.5.a:0 "Kahretsin!"
 Turkish_mafia.6.t:0 "Mafya Soygunu"
 Turkish_mafia.6.d:0 "Mafya ülkemizdeki bankalardan birini soydu. Büyük miktarda para çaldılar ve sonuçta ekonomimize ve halkımıza zarar verdiler."
 Turkish_mafia.6.a:0 "İnanılmaz"
 Turkish_mafia.7.t:0 "Bir Alisveris Merkezinde Patlama"
 Turkish_mafia.7.d:0 "Polis, büyük bir alışveriş merkezine düzenlenen bombalı saldırının arkasında Mafyanın olduğundan şüphelendiği için bugün parmaklar Mafyayı gösteriyor. Amaçları bilinmiyor, ancak bir şey kesin: Hükümete çok sorun çıkarıyorlar..."
 Turkish_mafia.7.a:0 "Ama neden?"
 Turkish_mafia.8.t:0 "Polis ile Mafya Arasinda Silahli Çatisma"
 Turkish_mafia.8.d:0 "Bu sabah polisimiz ile Mafya arasında çok uzun süren bir çatışma yaşandı. Birkaç polis memuru yaralandı, hatta bazıları hayatını kaybetti."
 Turkish_mafia.8.a:0 "Korkunç!"
 Turkish_mafia.9.t:0 "Mafyanin Yükselisi"
 Turkish_mafia.9.d:0 "Mafya son zamanlarda saldırılarını artırdı ve açıkçası güvenlik güçlerimizi zorladı. Her zamankinden fazla insanın Mafyaya katılıp suç hayatına yönelmesiyle devletimizin meşruiyeti sorgulanır hâle geldi. Pek çok kişi hükümetimizin istifa etmesini talep ediyor, ancak halkımıza hizmet etmek ve onu korumak bizim görevimiz..."
 Turkish_mafia.9.a:0 "Mücadele asla bitmeyecek!"
 Turkish_mafia.9.b:0 "Belki de haklılar..."
 TurkeyFocusEvents.10.t:0 "Kibris Sorunu"
 TurkeyFocusEvents.10.d:0 "Türk hükümeti Kıbrıs meselesinde eskisinden daha fazla bastırıyor ve hükümetimize karşılık vermekten başka seçenek bırakmıyor. Bu provokasyonlara karşı bir plan hazırladık ve buna göre hareket edeceğiz!"
 TurkeyFocusEvents.10.a:0 "İleri!"
 TurkeyFocusEvents.11.t:0 "Kibris'ta Çalkanti"
 TurkeyFocusEvents.11.d:0 "Yunan hükümeti pek çok konuda bizimle işbirliği yapmıyor, Kıbrıs söz konusu olduğunda ise daha da az. Bedeli ne olursa olsun Kıbrıs'ı Yunanistan'ın değil bizim tarafımıza çekmek için stratejik bir plan hazırlayacağız."
 TurkeyFocusEvents.11.a:0 "Bakalım ne olacak"
 TurkeyFocusEvents.12.t:0 "Türkiye Güney Kibris'a Saldirmamizi Istiyor!"
 TurkeyFocusEvents.12.d:0 "Türk hükümeti, güneydeki Kıbrıslı Rumlara saldırmamız umuduyla bizim için 3 milis tümeni eğitip silahlandırdı. Bunu yapmak elbette çıkarımıza olur, ancak her zaman reddedebiliriz."
 TurkeyFocusEvents.12.a:0 "Kesinlikle!"
 TurkeyFocusEvents.12.b:0 "Hayır"
 TurkeyFocusEvents.14.t:0 "Türk Hükümeti Kibris'tan Çekilmemizi Talep Ediyor!"
 TurkeyFocusEvents.14.d:0 "Bugün erken saatlerde Türk diplomatlar İngiliz askerlerinin Kıbrıs'tan çekilmesini talep etti. Bu, küçük ada ülkesini Türkiye'nin ilk işgal ettiği dönemden bile daha ciddi bir tehlikeye atar."
 TurkeyFocusEvents.14.a:0 "İşi tırmandırmayalım..."
 TurkeyFocusEvents.14.b:0 "Ne saçma bir talep"
 TurkeyFocusEvents.15.t:0 "Türkiye Birlesme Talep Ediyor"
 TurkeyFocusEvents.15.d:0 "Türk hükümeti bizden kendileriyle birleşmemizi ve büyük Türk devletinin bir parçası olmamızı istedi. Kabul etmek muhtemelen yararımıza olur; reddedersek saldırabilirler..."
 TurkeyFocusEvents.15.a:0 "Birleşmeliyiz!"
 TurkeyFocusEvents.15.b:0 "Hayır"
 TurkeyFocusEvents.16.t:0 "Türk ve Yunan Hükümetleri Kibris'in Yeniden Birlesmesini Talep Ediyor!"
 TurkeyFocusEvents.16.d:0 "Türk hükümeti bizden Güney Kıbrıs'la birleşmemizi ve harekât öncesi sınırlarımız içinde yeniden bütünleşmemizi istedi."
 TurkeyFocusEvents.16.a:0 "Vakti gelmişti"
 TurkeyFocusEvents.16.b:0 "Hayır"
 TurkeyFocusEvents.17.t:0 "Türkiye Ege'yi Istiyor"
 TurkeyFocusEvents.17.d:0 "Türk delegeler Atina'ya gelerek güçlenen bağlarımız ışığında Ege'nin kontrolünü kendilerine vermemizi istedi. Türk hükümeti Kuzey Kıbrıs'tan desteğini çekti ve adanın birleşmesine izin verdi; ama bu onlara meşru Yunan topraklarını isteme hakkı veriyor mu?"
 TurkeyFocusEvents.17.a:0 "Barış adına vermeliyiz"
 TurkeyFocusEvents.17.b:0 "Iıı... Hayır"
 TurkeyFocusEvents.171.t:0 "Yunanlar Ege'yi Bize Veriyor!"
 TurkeyFocusEvents.171.d:0 "Bugün harika bir haber aldık: Yunan delegeler, ülkemize Ege Adaları üzerinde tam kontrol veren bir antlaşmayı memnuniyetle imzaladı!"
 TurkeyFocusEvents.171.a:0 "Muhteşem!"
 TurkeyFocusEvents.172.t:0 "Yunanlar Ege'yi Bize Vermeyi Reddediyor!"
 TurkeyFocusEvents.172.d:0 "Bugün Ankara'ya korkunç bir haber ulaştı: Yunan delegeler Ege Adaları konusundaki talebimizi reddetti!"
 TurkeyFocusEvents.172.a:0 "Ege'yi bize vermelerini her zaman sağlayabiliriz..."
 TurkeyFocusEvents.18.t:0 "Türkiye Saldirgan Bir Politika Izliyor!"
 TurkeyFocusEvents.18.d:0 "Türk hükümeti diplomatik görüşmeler yapmaya yanaşmıyor ve istediğini elde etmek için saldırgan bir gündeme başvurdu. Felaketleri önlemek için etkisini mümkün olduğunca sınırlamalıyız!"
 TurkeyFocusEvents.18.a:0 "Lanet olsun"
 TurkeyFocusEvents.19.t:0 "Türkiye Tampon Bölge Kurmak Istiyor"
 TurkeyFocusEvents.19.d:0 "Türk hükümeti sınırımız boyunca bir tampon bölge kurmak istiyor. Bu, kuzeydeki birkaç ilimizi tamamen silahsızlandırmamız, tüm askeri varlığımızı çekmemiz ve Kürtlerle Türklerin savaşmasına izin vermemiz anlamına geliyor."
 TurkeyFocusEvents.19.a:0 "En iyisi bu..."
 TurkeyFocusEvents.19.b:0 "Kesinlikle hayır!"
 Turkish_parties.1.t:0 "Liberal Partiler Güç Kazaniyor"
 Turkish_parties.1.d:0 "Liberal partiler eskisinden daha fazla taraftar topladıkça halkımız giderek daha liberal bir çizgiye kayıyor. Bunun sonucunda insanlar ülkemizde daha liberal politikalar için baskı yapıyor."
 Turkish_parties.1.a:0 "Tamam"
 Turkish_parties.2.t:0 "Muhafazakâr Partiler Güç Kazaniyor"
 Turkish_parties.2.d:0 "Muhafazakâr partiler eskisinden daha fazla taraftar topladıkça halkımız giderek daha muhafazakâr bir çizgiye kayıyor. Bunun sonucunda insanlar ülkemizde daha muhafazakâr politikalar için baskı yapıyor."
 Turkish_parties.2.a:0 "Tamam"
 Turkish_parties.3.t:0 "Sol Partiler Güç Kazaniyor"
 Turkish_parties.3.d:0 "Sol partiler eskisinden daha fazla taraftar topladıkça halkımız giderek daha solcu bir çizgiye kayıyor. Bunun sonucunda insanlar ülkemizde daha sosyalist politikalar için baskı yapıyor."
 Turkish_parties.3.a:0 "Tamam"
 Turkish_parties.4.t:0 "Sag Partiler Güç Kazaniyor"
 Turkish_parties.4.d:0 "Sağ partiler eskisinden daha fazla taraftar topladıkça halkımız giderek daha milliyetçi bir çizgiye kayıyor. Bunun sonucunda insanlar ülkemizde daha milliyetçi politikalar için baskı yapıyor."
 Turkish_parties.4.a:0 "Tamam"
 Turkish_parties.9.t:0 "Siyasette Radikal Değişim"
 Turkish_parties.9.d:0 "Ülkemizin yönetiminde köklü ve radikal bir değişim yaşandı; bu da siyasi yapımızın tamamen yeniden düzenlenmesine yol açtı."
 Turkish_parties.9.a:0 "Tamam"
