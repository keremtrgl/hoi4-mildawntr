 TUR_PKK_insurgency_ceasefire:0 "PKK İsyanı - Ateşkes"
 TUR_PKK_insurgency_ceasefire_desc:0 "PKK, 1970'lerden bu yana daha fazla Kürt özerkliği için savaşan solcu bir Kürt isyancı örgütüdür. İki taraf da birbirini yenmek için terör taktiklerine başvurmuştur.\n\nPKK şu anda tek taraflı ateşkes ilan etmiş durumda.\n\n-Barış süreci ve müzakereler yalnızca aktif bir ateşkes sırasında sürebilir\n-Ateşkes, gücümüzü toplamamızı ve PKK'ya karşı sürpriz bir saldırı hazırlamamızı sağlar.§W\n------------\n§!PKK'dan §Hgücünü 15'e ve saldırganlığını 45 veya altına düşürerek§! ve ardından açılan §Hkararları§! alarak kurtulabiliriz."
 TUR_PKK_insurgency_active:0 "PKK İsyanı - Aktif"
 TUR_PKK_insurgency_active_desc:0 "PKK, 1970'lerden bu yana daha fazla Kürt özerkliği için savaşan solcu bir Kürt isyancı örgütüdür. İki taraf da birbirini yenmek için terör taktiklerine başvurmuştur.\n\nPKK şu anda hükümete karşı aktif olarak savaşıyor.\n\n-Barış süreci ve müzakereler yalnızca aktif bir ateşkes sırasında sürebilir\n-Ateşkes, gücümüzü toplamamızı ve PKK'ya karşı sürpriz bir saldırı hazırlamamızı sağlar.§W\n------------\n§!PKK'dan §Hgücünü 15'e ve saldırganlığını 45 veya altına düşürerek§! ve ardından açılan §Hkararları§! alarak kurtulabiliriz."
