 TUR_greek_issues:0 "Dost mu, Düşman mı?"
 TUR_greek_issues_desc:0 "Bir zamanlar imparatorluğumuzun bir eyaleti olan Yunanlar, NATO nedeniyle bizimle ittifak kurmak zorunda kaldı. Ancak bu ittifaka rağmen sayısız anlaşmazlığımız yüzünden ilişkilerimiz hiç düzelmedi."
 TUR_cypriot_troubles:0 "Kıbrıs Sorunları"
 TUR_cypriot_troubles_desc:0 "Kuzey'e askerlerimizi çıkardığımızdan beri Kıbrıs bitmek bilmeyen bir çatışma adası oldu. Yunanlar bu konuda hiç susmadı ve adadaki kazanımlarımızı yok etmeye çalışıyor gibi görünüyorlar. Buna uygun şekilde karşılık vermemiz gerekecek."
 TUR_aggressive_approach:0 "Saldırgan Yaklaşım"
 TUR_aggressive_approach_desc:0 "Kıbrıs'taki durumla ilgilenirken saldırgan bir yaklaşım benimseyeceğiz. Ne de olsa son birkaç yılda diplomasi işe yaramadı."
 TUR_direct_involvement:0 "Doğrudan Müdahale"
 TUR_direct_involvement_desc:0 "NATO'dan ayrıldığımız için artık Türk etkisini yayma kabiliyetimize getirilen sayısız kısıtlamanın engeline takılmıyoruz. Bu da kabiliyetlerimizi sınırlamadan Kıbrıs'a doğrudan müdahale edebileceğimiz anlamına geliyor."
 TUR_demand_british_withdrawal:0 "İngiliz Çekilmesini Talep Et"
 TUR_demand_british_withdrawal_desc:0 "İngilizler tarih boyunca burunlarını her şeye soktular, ancak son yıllarda imparatorlukları çöküyor. Kıbrıs ise bir istisna oldu. İngilizler hâlâ Ağrotur'da varlık sürdürüyor ve kaçınılmaz olarak güneye doğru genişlediğimizde bu bize sorun çıkaracak."
 TUR_bring_the_north_to_fold:0 "Türkiye ile Birleşme"
 TUR_bring_the_north_to_fold_desc:0 "Kuzey Kıbrıslılar Türk'tür ve ayrı bir Türk devleti olmasının hiçbir anlamı yok. Hükümetlerinin bizimkine katılmasını talep edecek ve Türk halkını birleştireceğiz."
 TUR_history_repeated:0 "Başladığımız İşi Bitir"
 TUR_history_repeated_desc:0 "Başladığımız işi bitirmeliyiz. Güneye devam etmeme yönündeki felaket karardan sonra Kıbrıs ikiye bölündü. Yunanlar istese de istemese de ordumuzu seferber edip Kıbrıs'ın geri kalanına ikinci bir harekât düzenlememiz gerekecek!"
 TUR_indirect_involvement:0 "Dolaylı Müdahale"
 TUR_indirect_involvement_desc:0 "Bir cumhuriyet olarak canımız istediğinde çatışma başlatamayız; daha ölçülü davranmalıyız. Bu nedenle Kıbrıs konusunda daha dolaylı bir yaklaşım benimseyecek ve Kuzey Kıbrıs'ın meşru hükümetini destekleyeceğiz."
 TUR_provide_military_training:0 "Askeri Eğitim Sağla"
 TUR_provide_military_training_desc:0 "Kaçınılmaz çatışmaya hazırlık olarak Kuzey Kıbrıs'taki milisleri eğitmek için Türk Silahlı Kuvvetleri'nden uzmanlar göndereceğiz."
 TUR_fund_militias:0 "Kıbrıslı Milisleri Finanse Et"
 TUR_fund_militias_desc:0 "Milislere eğitim verdiğimize göre artık onlara güvenle silah ve ek finansman sağlayabiliriz; Güney Kıbrıs'ı geri alacak yeterliliğe sahip olduklarını biliyoruz."
 TUR_great_uprising:0 "Oyun Başlasın!"
 TUR_great_uprising_desc:0 "Güney Kıbrıslılara karşı milislerini eğitmeyi, finanse etmeyi ve silahlandırmayı başardığımıza göre artık arkamıza yaslanıp Kuzey Kıbrıslıların savaşımızı bizim yerimize vermesini izleyebiliriz."
 TUR_path_of_compromise:0 "Uzlaşma Yolu"
 TUR_path_of_compromise_desc:0 "Komşumuzla bitmek bilmeyen yeni bir çatışma başlatmak yerine uzlaşmak ve dostluğumuzu güçlendirmek daha akıllıca olur."
 TUR_withdraw_support_cyprus:0 "Türk Desteğini Çek"
 TUR_withdraw_support_cyprus_desc:0 "Artık Kuzey Kıbrıs hükümetini desteklemeyecek ve Güney Kıbrıs hükümetini tek ve yegâne Kıbrıs hükümeti olarak tanıyacağız."
 TUR_support_one_cyprus:0 "Tek Kıbrıs'ın Hikâyesi"
 TUR_support_one_cyprus_desc:0 "Tek Kıbrıs fikrini kamuoyu önünde destekleyecek ve Kıbrıs'ı bölünmüş tutan onlarca yıllık politikadan geri adım atacağız!"
 TUR_peaceful_unification:0 "Barışçıl Birleşme mi?"
 TUR_peaceful_unification_desc:0 "Kuzey Kıbrıs hükümetinden Güney Kıbrıs hükümetiyle birleşmesini alçakgönüllülükle rica edeceğiz... barışçıl bir şekilde..."
 TUR_acquire_agean:0 "Ege'yi Talep Et"
 TUR_acquire_agean_desc:0 "Yunanlara, ulusal çıkarlarımızdan vazgeçmek pahasına bile olsa uzlaşmaya hazır olduğumuzu resmen gösterdiğimize göre artık Ege'nin Türk kontrolüne devredilmesini kibarca rica edeceğiz."
 TUR_path_of_no_return:0 "Dönüşü Olmayan Yol"
 TUR_path_of_no_return_desc:0 "Bize kalan tek seçenek saldırgan bir politika ve ne yazık ki bu noktadan sonra geri dönüş olmayacak. Yunanistan'la düşmanlıklar bir kez başladığında bunlara son vermek çok zor ve maliyetli olacak."
 TUR_aegan_dispute:0 "Ege Uyuşmazlığı"
 TUR_aegan_dispute_desc:0 "Ege adaları, Birinci Dünya Savaşı'nın sonundan ve bunun Türk milleti için doğurduğu felaket sonuçlardan bu yana Yunanistan'ın kontrolünde. Adalar üzerinde tarihî haklarımız olmasına rağmen Yunan hükümeti bize adaların kısmi kontrolünü bile vermeye yanaşmıyor; bu da onları zorla almanın bir yolunu bulmamız gerektiği anlamına geliyor."
 TUR_crete_rebellion:0 "Girit Milliyetçiliğini Ateşle"
 TUR_crete_rebellion_desc:0 "Giritlilerin Yunan kontrolü altında işgal edilmiş hissetmesini sağlayabilirsek, Ege olmasa bile bir şeyler kazanabiliriz."
 TUR_arm_crete_national_army:0 "Girit Millî Ordusunu Kur"
 TUR_arm_crete_national_army_desc:0 "Bir gün olası bir Yunan işgaline karşı kendini savunabilmesi umuduyla Girit Millî Ordusu'nu kuracağız."
 TUR_smuggle_trucks:0 "Kamyon Kaçır"
 TUR_smuggle_trucks_desc:0 "Girit Millî Ordusu yalnızca hafif silahlar ve topçuyla ayakta kalamaz; kamyonlara ihtiyacı olacak. Hazır olmaları için onlara kamyon sağlayacağız."
 TUR_let_the_games_begin:0 "Girit'in Bağımsızlığı!"
 TUR_let_the_games_begin_desc:0 "Bugün Girit nihayet Yunanistan'dan bağımsızlığını ilan ediyor ve bir Türk himaye bölgesi oluyor!"
 TUR_fortify_coast:0 "Atina'ya Karşı Propaganda"
 TUR_fortify_coast_desc:0 "Yunan televizyon kanallarına rüşvet vererek Yunanlara karşı propaganda yayınına başlayacağız. Bu, ülkeyi yavaş yavaş istikrarsızlaştıracak ve bir çatışmada bize üstünlük sağlayacak."
 TUR_border_pictures:0 "Yozlaşmış Politikacıları Kullan"
 TUR_border_pictures_desc:0 "Yozlaşmış Yunan politikacıların cepleri derin; seçim sistemlerinde ipleri elimize alıp istediğimiz partileri desteklerken bu cepler yakında Türk parasıyla dolacak."
 TUR_last_second_upgrades:0 "Sanayilerini Sabote Et"
 TUR_last_second_upgrades_desc:0 "Yunan devleti üzerinde bir miktar etkimiz olduğuna göre artık sanayilerini sabote etmeye başlayabiliriz; böylece Atina'da karşılaştığımızda daha zayıf olacaklar!"
 TUR_siege_of_greece:0 "5 Dakikadan Kısa Sürede Atina'da"
 TUR_siege_of_greece_desc:0 "Türk zırhlıları ve piyadelerinin Atina'ya girip toprağına Ay Yıldızlı bayrağı dikmesi uzun sürmeyecek!"
 pkk_static_modifier:0 "Kürt Direnişinin Yankıları"
 pkk_static_modifier_desc:0 "Büyük Savaş'ın ve Sevr Antlaşması'nın sonundan bu yana Kürtler, bizden özgür ve bağımsız kendi ülkelerinin hasretini çekiyor. Milletimizden bağımsızlıklarını kazanmaları yıkıcı sonuçlar doğurur, ancak onları işgal altında tutmanın da bir faydası olmaz."
 TUR_mafia_category:0 "Türk Mafyası"
 TUR_mafia_category_desc:0 "Türk Mafyası uzun süredir faaliyette ve uyuşturucu ticaretinden cinayete, dolandırıcılıktan aklınıza gelebilecek her türlü suça bulaşıyor. Ancak son yıllarda giderek daha fazla siyasallaştı; bazı partilerin onlarla anlaşma yaptığı ortaya çıktı ve bu da mafyaya yavaş yavaş daha fazla meşruiyet kazandırdı.\n\n§HMafya§! ayrıca bize para, hem de çok para kaybettirecek; çünkü etkisi arttıkça daha fazla kişi dolandırıcılık ve vergi suçları işleyebilir. Ayrıca §HMafya Etkisi§! §H60§! seviyesine ulaştığında §Rher iki haftada bir 1 artacak§!. Bu durum, bazı olayları ihmal edersek veya §HMafya§! ile mücadelede kötü kararlar alırsak gerçekleşebilir. §HMafya Etkisi§! ile güvenli evlerine baskın yaparak, polis harcamalarını artırarak ya da halkımızın kampanyalarından etkilenmemesi için parti popülerliğini koruyarak mücadele edebiliriz. Ayrıca §HMafya Etkisini§! §H35§! altına düşürürsek aranan §HMafya§! suçlularını tutuklayabilecek ve etki §G5§! altına düştüğünde §HMafyayı§! tamamen ortadan kaldırabileceğiz.\n\n§HMafya Etkisi§!: §R[?TUR.TUR_mafia_influence]§!"
 TUR_conduct_anti_mafia_raid:0 "Mafyaya Karşı Operasyonlar Düzenle"
 TUR_conduct_anti_mafia_raid_desc:0 "Mafyayı temizlemeye yönelik operasyonlar düzenleyerek etkisini hızla azaltabiliriz, ancak bunun bedeli son derece yüksek olacak."
 TUR_arrest_mafia_west:0 "Batı Türkiye'deki Mafya Üyelerini Tutukla"
 TUR_arrest_mafia_central:0 "İç Türkiye'deki Mafya Üyelerini Tutukla"
 TUR_arrest_mafia_south:0 "Güney Türkiye'deki Mafya Üyelerini Tutukla"
 TUR_arrest_mafia_east:0 "Doğu Türkiye'deki Mafya Üyelerini Tutukla"
 TUR_victory_over_mafia:0 "§PMafyayı Kökünden Kazı§!"
 TUR_mafia_influence_mechanic:0 "Küresel Görevler"
 TUR_mafia_influence_mechanic_desc:0 "§PTürk Mafyası§!, yalnızca yerli bir çete olmadığını, çok daha fazlası olduğunu kanıtladı. §HTürk Mafyasının dünyanın her yerinde bağlantıları ve etkisi var§!, ancak bazı yerlerde diğerlerinden daha fazla. Türk diasporası sayesinde Türk Mafyası başka ülkelerde §Hdestek§! ve §Hetki§! kazanabiliyor ve bunları yeni §PMafya vekillerini§! desteklemek için kullanabiliyor. Bu da §HTürk Mafyasının§! dünya genelinde hükümetlerin iplerini çekmesini ve bazı durumlarda onları §Rdevirmesini§! sağlıyor.\n\nAşağıdaki görsellerin gösterdiği gibi, bir ülkede §HMafya etkisi ne kadar yüksekse§! kontrolü de o kadar fazladır. Mafya etkisi §Rdüşükse§! Mafya köklü bir şey yapmaya §Rmuktedir değildir§!. Ancak §HMafya etkisi yüksekse§! §Gçok daha fazla§! seçenek vardır.\n\n§HBirleşik Krallık'taki Etki§!: §G[?mafia_uk|%]§!\n§HAlmanya'daki Etki§!: §G[?mafia_germany|%]§!\n§HHollanda'daki Etki§!: §G[?mafia_holland|%]§!\n§HAvustralya'daki Etki§!: §G[?mafia_australia|%]§!\n§HBelçika'daki Etki§!: §G[?mafia_belgium|%]§!\n\nRenksiz - Düşük etki\n§YSarı§! - Bir miktar etki\n§RKırmızı§! - Yüksek etki\n"
