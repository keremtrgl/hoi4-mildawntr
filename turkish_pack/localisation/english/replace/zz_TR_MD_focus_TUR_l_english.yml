 kurdish_resistance_dynamic_modifier_desc:0 "Büyük Savaş'ın ve Sevr Antlaşması'nın sonundan bu yana Kürtler, bizden özgür ve bağımsız kendi ülkelerinin hasretini çekiyor. Milletimizden bağımsızlıklarını kazanmaları yıkıcı sonuçlar doğurur, ancak onları işgal altında tutmanın da bir faydası olmaz."
