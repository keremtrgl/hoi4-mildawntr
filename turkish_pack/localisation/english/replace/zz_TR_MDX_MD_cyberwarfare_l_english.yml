 cyber_network_hardening_complete_tt:0 "Ağ sağlamlaştırma tamamlandı. Kritik ağ altyapısı güçlendirildi ve bilinen açıklar yamalandı."
 cyber_counter_intrusion_complete_tt:0 "Sızma karşıtı tarama tamamlandı. Tespit edilen tüm yabancı implantlar ve kalıcı yükler ağlarımızdan temizlendi."
 cyber_attribution_hunt_complete_tt:0 "Kaynak tespit avı tamamlandı. İstihbarat analistleri yakın tarihli sızma faaliyetine ilişkin adli incelemelerini sonuçlandırdı."
 cyber_gps_tracking_complete_tt:0 "GPS karıştırma operasyonu sonuçlandı. Sinyal ekibimiz hedefin uydu seyrüsefer sistemlerini sekteye uğratma çalışmasını tamamladı."
 cyber_economic_tracking_complete_tt:0 "Ekonomik sekteye uğratma operasyonu sonuçlandı. Siber ekiplerimiz düşmanın mali altyapısını hedefleyen kampanyasını tamamladı."
 cyber_propaganda_tracking_complete_tt:0 "Propaganda operasyonu sonuçlandı. Enformasyon birimlerimiz hedef halka yönelik nüfuz kampanyasını tamamladı."
 cyber_infra_tracking_complete_tt:0 "Altyapı saldırısı sonuçlandı. Ajanlarımız düşmanın kritik altyapısına yönelik süregelen saldırılarını tamamladı."
 cyber_crit_tracking_complete_tt:0 "Kritik vuruş operasyonu sonuçlandı. Birimlerimiz hedefin en hayati sistemlerine karşı yüksek öncelikli yükünü uyguladı."
 cyber_sigint_surveillance_tracking_complete_tt:0 "SIGINT gözetim operasyonu sonuçlandı. Dinleme ekiplerimiz hedeften sinyal istihbaratı toplamayı tamamladı."
 cyber_radar_spoofing_tracking_complete_tt:0 "Radar yanıltma operasyonu sonuçlandı. Elektronik harp ekiplerimiz düşmanın hava gözetleme ağını sekteye uğratma çalışmasını tamamladı."
 cyber_election_interference_tracking_complete_tt:0 "Seçimlere müdahale operasyonu sonuçlandı. Nüfuz birimlerimiz düşmanın seçim sürecini hedefleyen gizli kampanyasını tamamladı."
 cyber_industrial_espionage_tracking_complete_tt:0 "Sınai casusluk operasyonu sonuçlandı. Ajanlarımız düşmandan hedeflenen araştırma ve geliştirme verilerini çekti."
 cyber_comms_intercept_tracking_complete_tt:0 "İletişim dinleme operasyonu sonuçlandı. Ekiplerimiz düşmanın komuta ve kontrol ağlarına süregelen sızmalarını tamamladı."
 cyber_financial_system_attack_tracking_complete_tt:0 "Mali sistemlere saldırı sonuçlandı. Birimlerimiz düşmanın bankacılık ve ödeme altyapısını hedefleyen operasyonunu tamamladı."
 cyber_logistics_disruption_tracking_complete_tt:0 "Lojistiği sekteye uğratma operasyonu sonuçlandı. Ajanlarımız düşmanın tedarik zinciri ve dağıtım sistemlerine yönelik kampanyasını tamamladı."
 cyber_sleeper_network_tracking_complete_tt:0 "Uyuyan ağ yerleştirme sonuçlandı. Ekiplerimiz ileride etkinleştirilmek üzere düşmanın ağlarına kalıcı erişim araçları gömdü."
 cyber_deception_campaign_tracking_complete_tt:0 "Aldatma kampanyası sonuçlandı. Ajanlarımız düşmanın istihbarat analistlerini yanıltmak için tasarlanan sahte bayrak operasyonunu tamamladı."
 cyber_zero_day_strike_tracking_complete_tt:0 "Sıfırıncı gün vuruşu sonuçlandı. Birimlerimiz düşmanın kritik sistemlerindeki açıklanmamış bir güvenlik açığına karşı yüksek etkili bir istismar gerçekleştirdi."
 cyber_network_hardening_active:0 "Ağlar Sağlamlaştırıldı"
 cyber_network_hardening_active_desc:0 "Siber güvenlik ekiplerimiz kimlik doğrulama sistemlerini güçlendirdi, bilinen açıkları yamaladı ve kritik erişim kanallarını yalıttı. Bu savunmalar yerinde kaldığı sürece yabancı sızma girişimlerinin başarılı olma ihtimali önemli ölçüde düşüktür."
 cyber_counter_intrusion_active:0 "Sızma Karşıtı Tarama"
 cyber_counter_intrusion_active_desc:0 "Analistler ağlarımızdaki yabancı varlığı aktif olarak arıyor: günlükleri tarıyor, anormal süreçleri yalıtıyor ve kalıcı implantları temizliyor. Tüm devlet sistemlerinde operasyonel güvenlik farkındalığı yükseltildi."
 cyber_attribution_hunt_active:0 "Kaynak Tespit Avı Sürüyor"
 cyber_attribution_hunt_active_desc:0 "Dijital adli bilişim ekipleri saldırı yollarını yeniden kuruyor ve sorumlu aktörün imzalarını kataloglıyor. Toplanan istihbarat savunmamızı keskinleştirecek ve orantılı bir karşılığa yön verecek."
 MD_cyber.201.t:0 "Sizma Temizlendi"
 MD_cyber.201.d:0 "Sızma karşıtı ekiplerimiz taramalarını tamamladı. Yabancı erişim araçları, gözetleme implantları ve kalıcı arka kapılar tespit edilip kaldırıldı. Ağlarımız temiz."
 MD_cyber.201.a:0 "İyi iş. Teyakkuzda kalın."
 MD_cyber.202.t:0 "Tarama Tamamlandi: Aglar Temiz"
 MD_cyber.202.d:0 "Sızma karşıtı ekiplerimiz tüm kritik sistemlerdeki taramalarını bitirdi. Hiçbir yabancı erişim aracı veya gözetleme implantı tespit edilmedi. Ağlarımız güvenli görünüyor."
 MD_cyber.202.a:0 "Nöbeti sürdürün."
 MD_cyber.1.t:0 "Operasyon Basarili"
 MD_cyber.1.d:0 "Siber ekiplerimiz operasyonu başarıyla yürüttü. Geride hiçbir iz bırakılmadı. Hedefin bizim karışımıza dair hiçbir belirtisi yok."
 MD_cyber.1.a:0 "Harika iş."
 MD_cyber.2.t:0 "Yabanci Sizma Tespit Edildi"
 MD_cyber.2.d:0 "Güvenlik ekiplerimiz harici bir siber sızmanın belirtilerini tespit etti. Saldırganlar kaynaklarını etkili biçimde gizledi. Sorumluyu belirleyemiyoruz."
 MD_cyber.2.a:0 "Savunmamızı sağlamlaştıralım."
 MD_cyber.3.t:0 "[?disp_name_agressor.GetNameWithFlag] Tarafindan Siber Saldiri Tespit Edildi"
 MD_cyber.3.d:0 "İstihbarat servislerimiz yakın tarihli bir siber sızmanın kaynağını [?disp_name_agressor.GetNameWithFlag] ülkesine kadar izledi. Saldırı kasıtlı ve hedefliydi. Resmi bir diplomatik protesto sunduk."
 MD_cyber.3.a:0 "Saldırganı kınayalım."
 MD_cyber.4.t:0 "Operasyon Yarida Kesildi"
 MD_cyber.4.d:0 "Siber ekiplerimiz hedefin sistemlerinde güvenilir bir dayanak noktası kuramadı. Operasyon herhangi bir eylem gerçekleştirilmeden yarıda kesildi. Ek hazırlık gerekiyor."
 MD_cyber.4.a:0 "Yeniden toparlanıp durumu değerlendirelim."
 MD_cyber.11.t:0 "GPS Sinyali Kesintisi"
 MD_cyber.11.d:0 "Askeri birlikler uydu seyrüsefer sistemlerinde yaygın arızalar bildiriyor. Sahadaki komutanlar etkili koordinasyon sağlamakta zorlanıyor. Harici bir sinyal bozma saldırısından şüpheleniliyor."
 MD_cyber.11.a:0 "Yedek seyrüsefere geçelim."
 MD_cyber.12.t:0 "Mali Aglar Ele Geçirildi"
 MD_cyber.12.d:0 "Bankalar, borsalar ve ödeme işlemcileri art arda sistem arızaları bildiriyor. Bu kesinti tesadüf değil. Analistlerimiz yabancı ajanların mali altyapımızı hedef aldığına inanıyor."
 MD_cyber.12.a:0 "Hasarı yalıtıp sınırlayalım."
 MD_cyber.13.t:0 "Bilgi Alanina Sizildi"
 MD_cyber.13.d:0 "Sosyal medya platformları ve haber ağları koordineli dezenformasyonla dolduruluyor. Hükümete duyulan kamu güveni aşınıyor. Analistlerimiz bunun yabancı bir nüfuz operasyonu olduğuna inanıyor."
 MD_cyber.13.a:0 "Karşı anlatı kampanyası başlatalım."
 MD_cyber.14.t:0 "Kritik Altyapi Saldiri Altinda"
 MD_cyber.14.d:0 "Enerji santralleri, ulaşım merkezleri ve haberleşme düğümleri aynı anda arıza verdi. Mühendisler kontrol sistemlerimiz üzerinden kasıtlı sabotaj belirtileri bildiriyor. Bu ciddi bir tırmanma."
 MD_cyber.14.a:0 "Ulusal olağanüstü hal ilan edelim."
 MD_cyber.15.t:0 "Yikici Siber Vurus"
 MD_cyber.15.d:0 "Ülkedeki her kritik sistem aynı anda vuruldu: mali ağlar, enerji şebekeleri, askeri haberleşme ve tedarik zincirleri. Saldırının ölçeği ve hassasiyeti eşi benzeri görülmemiş. Ulus sakat kaldı."
 MD_cyber.15.a:0 "Elimizdeki her şeyi seferber edelim."
 MD_cyber.16.t:0 "Iletisim Ele Geçirildi"
 MD_cyber.16.d:0 "Yabancı ajanlar şifreli iletişim kanallarımıza sızdı. Hassas iletimlerin muhtemelen düşman bir devlet aktörü tarafından izlendiği düşünülüyor."
 MD_cyber.16.a:0 "İletişim kısıtlaması başlatalım."
 MD_cyber.17.t:0 "Radar Aglari Sekteye Ugradi"
 MD_cyber.17.d:0 "Hava savunma radar ağlarımız yanlış okumalar veriyor. Hayalet izler operatörleri bunaltıyor. Düşman uçakları bu karışıklıktan yararlanıyor olabilir."
 MD_cyber.17.a:0 "Yedek tespit protokollerine geçelim."
 MD_cyber.18.t:0 "Yabanci Nüfuz Operasyonu Tespit Edildi"
 MD_cyber.18.d:0 "Yurt içi siyasi ortamımızı hedefleyen koordineli bir yabancı nüfuz kampanyasına dair kanıtlar ortaya çıktı. Dezenformasyon sosyal medya ağlarında yayılıyor ve toplumsal bölünmeleri derinleştiriyor."
 MD_cyber.18.a:0 "Yabancı müdahaleyi kınayalım."
 MD_cyber.19.t:0 "Arastirma Aglarina Sizildi"
 MD_cyber.19.d:0 "Gizli araştırma verileri ve endüstriyel tasarımlar ulusal laboratuvarlarımızdan ve savunma müteahhitlerimizden çalındı. Hırsızlığın tam boyutu hâlâ değerlendiriliyor."
 MD_cyber.19.a:0 "Tüm gizli sistemleri denetleyelim."
 MD_cyber.110.t:0 "Komuta Aglarina Sizildi"
 MD_cyber.110.d:0 "Askeri ve diplomatik iletişim kanallarımıza sızıldı. Düşman ajanlar emirleri ve hassas yazışmaları gerçek zamanlı olarak dinliyor."
 MD_cyber.110.a:0 "Ele geçirilen tüm kanalları temizleyelim."
 MD_cyber.111.t:0 "Merkez Bankasi Sistemleri Saldiri Altinda"
 MD_cyber.111.d:0 "Merkez bankamız ve başlıca mali takas altyapımız sürekli bir siber saldırı altında. İşlem yürütme durdu ve döviz piyasaları hızla istikrarsızlaşıyor."
 MD_cyber.111.a:0 "Mali olağanüstü hal ilan edelim."
 MD_cyber.112.t:0 "Askeri Tedarik Zinciri Sekteye Ugradi"
 MD_cyber.112.d:0 "İleri lojistiğimizi yöneten komuta-kontrol yazılımı birden çok sektörde çöktü. Kesinti sisteme yayıldıkça cephedeki birlikler ikmal sıkıntısı bildiriyor."
 MD_cyber.112.a:0 "Elle ikmal prosedürlerine dönelim."
 MD_cyber.113.t:0 "Kalici Sizma Tespit Edildi"
 MD_cyber.113.d:0 "Güvenlik servislerimiz kritik ağ altyapısının derinliklerine gömülmüş uykuda erişim noktaları keşfetti. İmplantlar gelişmiş ve muhtemelen bir süredir etkin."
 MD_cyber.113.a:0 "Tam ağ denetimi başlatalım."
 MD_cyber.114.t:0 "Komuta Istihbarati Ele Geçirildi"
 MD_cyber.114.d:0 "İstihbarat servislerimiz uydurma sinyal trafiği ve sahte iletişimden oluşan sistematik bir kampanya tespit etti. Askeri komutanlarımız kasıtlı olarak zehirlenmiş bilgiye dayanarak hareket etmiş olabilir."
 MD_cyber.114.a:0 "Sinyal doğrulama görev gücü kuralım."
 MD_cyber.115.t:0 "Sifirinci Gün Vurusu"
 MD_cyber.115.d:0 "Daha önce bilinmeyen açıkları kullanan yıkıcı ve hassas bir siber vuruş en kritik sistemlerimizi aynı anda vurdu. Endüstriyel kontrol sistemleri, enerji altyapısı ve savunma ağlarının hepsi etkilendi."
 MD_cyber.115.a:0 "Ulusal siber olağanüstü hal protokollerini devreye alalım."
 cyber_propaganda_ops_malus:0 "Bilgi Alanına Sızıldı"
 cyber_propaganda_ops_malus_desc:0 "Koordineli bir yabancı dezenformasyon kampanyası hükümetimize ve kurumlarımıza duyulan kamu güvenini aktif olarak aşındırıyor, siyasi verimi bastırıyor ve ulusal birliği zayıflatıyor."
 cyber_gps_jamming_malus:0 "GPS Sistemleri Sekteye Uğradı"
 cyber_gps_jamming_malus_desc:0 "Yabancı siber ajanlar askeri uydu seyrüsefer altyapımızı ele geçirdi; birliklerin koordinasyonunu ve muharebe alanı farkındalığını ciddi biçimde bozdu."
 cyber_economic_disruption_malus:0 "Mali Ağlar Ele Geçirildi"
 cyber_economic_disruption_malus_desc:0 "Süregelen bir yabancı siber kampanya bankacılık sistemlerimizi, ödeme ağlarımızı ve sanayi üretimimizi zayıflatıyor. Ekonomik toparlanma zaman alacak."
 cyber_infrastructure_damage_malus:0 "Altyapı Hasarı"
 cyber_infrastructure_damage_malus_desc:0 "Yabancı siber saldırganlar kritik altyapımıza ciddi hasar verdi; lojistiği, inşaatı ve tedarik dağıtımını aksattı."
 cyber_critical_strike_malus:0 "Yıkıcı Siber Vuruş"
 cyber_critical_strike_malus_desc:0 "Yıkıcı, tam kapsamlı bir siber saldırı sanayi tabanımızı, haberleşmemizi ve tedarik zincirimizi aynı anda sakat bıraktı. Toparlanma uzun ve zahmetli olacak."
 cyber_sigint_surveillance_malus:0 "İletişim Gözetim Altında"
 cyber_sigint_surveillance_malus_desc:0 "Yabancı ajanlar şifreli iletişim altyapımıza sızdı. Hassas iletimlerin muhtemelen izlendiği düşünülüyor; bu da eşgüdümlü siyasi eylemi aksatıyor."
 cyber_radar_spoofing_malus:0 "Radar Ağı Ele Geçirildi"
 cyber_radar_spoofing_malus_desc:0 "Yabancı siber ajanlar hava savunma radar ağlarımıza sahte dönüşler besleyerek tespit ve önleme yeteneklerini zayıflatıyor."
 cyber_election_interference_malus:0 "Yabancı Nüfuz Kampanyası Aktif"
 cyber_election_interference_malus_desc:0 "Koordineli bir yabancı dezenformasyon kampanyası kamu güvenini aşındırıyor ve yurt içindeki siyasi bölünmeleri derinleştiriyor."
 cyber_industrial_espionage_malus:0 "Araştırma Ağlarına Sızıldı"
 cyber_industrial_espionage_malus_desc:0 "Gizli araştırma verileri ve endüstriyel tasarımlar ulusal laboratuvarlarımızdan ve savunma müteahhitlerimizden çalınarak geliştirme programlarımızı geriye attı."
 cyber_comms_intercept_malus:0 "Komuta Ağları Ele Geçirildi"
 cyber_comms_intercept_malus_desc:0 "Askeri ve diplomatik iletişimimize sızıldı. Operasyonel güvenlik zayıfladı ve koordinasyon zarar görüyor."
 cyber_financial_system_attack_malus:0 "Mali Altyapı Saldırı Altında"
 cyber_financial_system_attack_malus_desc:0 "Merkez bankacılığı ve ödeme altyapımıza yönelik süregelen bir saldırı ekonomi genelinde art arda arızalara yol açtı."
 cyber_logistics_disruption_malus:0 "Askeri Tedarik Zinciri Sekteye Uğradı"
 cyber_logistics_disruption_malus_desc:0 "İleri lojistiğimizi yöneten komuta-kontrol yazılımı ele geçirildi. Cephedeki birlikler ikmal sıkıntısı yaşıyor."
 cyber_sleeper_network_malus:0 "Kalıcı Ağ Sızması"
 cyber_sleeper_network_malus_desc:0 "Yabancı ajanlar kritik ağlarımızın derinliklerine uykuda erişim noktaları gömerek hassas sistemlere kalıcı ve düşük düzeyde erişimi sürdürüyor."
 cyber_deception_campaign_malus:0 "Komuta İstihbaratı Zehirlendi"
 cyber_deception_campaign_malus_desc:0 "Komutanlarımız uydurma sinyal trafiğine ve sahte iletişime dayanarak hareket etti. Askeri koordinasyon ve durumsal farkındalık ciddi biçimde bozuldu."
 cyber_zero_day_strike_malus:0 "Sıfırıncı Gün Vuruşu"
 cyber_zero_day_strike_malus_desc:0 "Gizli sıfırıncı gün açıklarını kullanan yıkıcı ve hassas bir vuruş, en kritik sanayi ve altyapı sistemlerimizi aynı anda vurdu."
 upgrade_establish_cyber_operations_division:0 "Siber Operasyonlar Bölümü"
 upgrade_establish_cyber_operations_division_desc:0 "Teşkilat bünyesinde, temel dijital harp yeteneğinin temelini oluşturan özel bir siber operasyonlar bölümü kurun. Bu bölüm, §YSiber Harp§! operasyonları yürütme yeteneğinin kilidini açar."
 upgrade_offensive_cyber_operations:0 "Taarruzi Siber Harp"
 upgrade_offensive_cyber_operations_desc:0 "Bölümü gelişmiş kalıcı tehdit araç setleri ve sıfırıncı gün istismar araştırmalarıyla genişleterek daha gelişmiş operasyonlara olanak tanıyın."
 upgrade_cyber_warfare_operational_planning:0 "Tam Spektrumlu Siber Komutanlık"
 upgrade_cyber_warfare_operational_planning_desc:0 "Bölümü, sağlamlaştırılmış hedeflere karşı karmaşık çok vektörlü operasyonları koordine edebilen, tam entegre bir siber komutanlığa dönüştürün."
 upgrade_defensive_cyber_operations:0 "Savunmacı Siber Operasyonlar"
 upgrade_defensive_cyber_operations_desc:0 "Kendi ağlarımızı sağlamlaştırma, sızmaları tespit etme ve dijital ayak izimizi gizleme konusunda uzmanlaşmış özel bir savunma ekibi kurun."
 upgrade_cyber_elite:0 "Sıfırıncı Gün Cephaneliği"
 upgrade_cyber_elite_desc:0 "Dünyanın en sağlamlaştırılmış sistemlerine bile sızabilen, seçkin sıfırıncı gün açıklarından oluşan gizli bir cephanelik geliştirin ve stoklayın."
 cyber_offense_power_modifier:0 "Taarruzi Siber Harp"
 cyber_offense_power_modifier_desc:0 "Taarruzi siber harp operasyonlarımızın ne kadar güçlü olduğunu belirleyen değer."
 cyber_defense_rating_modifier:0 "Savunmacı Siber Harp"
 cyber_capability_modifier:0 "Siber Harp Yeteneği"
 cyber_attribution_bonus_modifier:0 "Siber Kaynak Gizleme Bonusu"
