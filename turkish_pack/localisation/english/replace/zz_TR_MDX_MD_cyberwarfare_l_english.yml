 cyber_sigint_surveillance_tracking:0 "SIGINT Gözetimi Aktif"
 cyber_sigint_surveillance_tracking_desc:0 "Sinyal istihbaratı ekiplerimiz hedefin iletişimini ve ağ trafiğini izliyor; istihbarat birikimini normal pasif hızın çok ötesine çıkarıyor. Operasyon yaklaşık 180 gün sürecek."
 cyber_radar_spoofing_tracking:0 "Radar Yanıltma Aktif"
 cyber_radar_spoofing_tracking_desc:0 "Koordineli bir elektronik harp yükü, hedefin hava tespit ağlarına sahte dönüşler besleyerek durumsal farkındalığını bozuyor. Operasyon 30 gün içinde sona erecek."
 cyber_election_interference_tracking:0 "Seçimlere Müdahale Aktif"
 cyber_election_interference_tracking_desc:0 "Ajanlarımız hedefin siyasi bilgi alanını hedefleyen koordineli bir nüfuz kampanyası yürütüyor; dezenformasyon yayıyor ve hükümete duyulan kamu güvenini aşındırmak için muhalefet ağlarını fonluyor. Operasyon yaklaşık 180 gün sürecek."
 cyber_industrial_espionage_tracking:0 "Sınai Casusluk Aktif"
 cyber_industrial_espionage_tracking_desc:0 "Ekiplerimiz hedefin araştırma ağlarına erişim sağladı ve gizli teknik ve sınai verileri çekiyor. Analistler çalınan materyali işliyor."
 cyber_comms_intercept_tracking:0 "İletişim Dinleme Aktif"
 cyber_comms_intercept_tracking_desc:0 "Sinyal ekiplerimiz hedefin hükümet ve diplomatik iletişim kanallarına sızdı. Trafiklerini izliyor ve gerçek zamanlı olarak işe yarar istihbarat çekiyoruz."
 cyber_financial_system_attack_tracking:0 "Mali Sistemlere Saldırı Aktif"
 cyber_financial_system_attack_tracking_desc:0 "Ajanlarımız hedefin merkez bankacılığı ve ödeme işleme altyapısını hedef alan yıkıcı yükler yerleştirdi; ticaret yapma ve devlet operasyonlarını fonlama kapasitelerini boğuyor. Operasyon yaklaşık 150 gün sürecek."
 cyber_logistics_disruption_tracking:0 "Askeri Lojistiği Sekteye Uğratma Aktif"
 cyber_logistics_disruption_tracking_desc:0 "Hedefin askeri komuta-kontrol ve tedarik zinciri yönetimi yazılımını aktif olarak zayıflatıyoruz; yeniden ikmal ve takviye döngülerini aksatıyoruz. Operasyon 90 gün içinde sona erecek."
