 CYBER_GPS_BTN_TT_DELAYED:0 "Özel kötü amaçlı yazılım hedefin uydu alım altyapısına sızarak askeri seyrüsefer sistemlerini sahte sinyallerle doldurur. Sahada tanıdık yer işaretleri dijital haritalardan kaybolurken komutanlar koordinasyon sağlamakta zorlanır. Hassas seyrüsefer çöktüğünde sıradan manevralar bile tehlikeli hale gelir."
 CYBER_SIGINT_BTN_TT_DELAYED:0 "Kalıcı bir implant hedefin telekomünikasyon omurgasına sessizce yerleşerek hükümet, ordu ve diplomatik kanallardaki trafiği kopyalar. Hafta hafta, yakalanan veri akışı hedefin niyetleri, zayıflıkları ve iç anlaşmazlıkları hakkında ayrıntılı bir portre oluşturur. Hiçbir geleneksel casusun toplayamayacağı bir istihbarat."
 CYBER_RADAR_BTN_TT_DELAYED:0 "Hedefin hava savunma radar ekranlarında hayalet izler belirir. Operatörler var olmayan uçakları takip etmeye çalışır, hayaletlerin peşinde alarm döngülerini tüketir. Gerçek uçuşlar ise boşluklardan fark edilmeden geçer. Fırsat penceresi kısadır, ancak otuz günlük bozulmuş hava tespiti, aktif bir seferde belirleyici olabilir."
 CYBER_ECON_BTN_TT_DELAYED:0 "Ödeme işlemcileri hata vermeye başlar. Alım satım algoritmaları bozuk veri akışlarında tıkanır. Fabrika kontrol birimleri hatalı biçimlendirilmiş güncelleme paketleri alır. Saldırı inkâr edilebilir olacak şekilde tasarlanmıştır: ilgisiz görünen bir dizi teknik arıza, hedefin ekonomik üretimini aylarca sessizce tüketir."
 CYBER_PROP_BTN_TT_DELAYED:0 "Binlerce koordineli hesap, hedefin medya ortamını çelişkili anlatılarla doldurur. Uydurma hükümet belgeleri sosyal ağlarda dolaşır. Amaç aldatmak değil, yormaktır. Gerçekle kurguyu artık ayıramayan bir halk, kendi hükümeti de dahil tüm kurumlara olan güvenini yitirir."
 CYBER_ELECT_BTN_TT_DELAYED:0 "Seçmen kayıt sistemleri ustaca bozulur. Muhalefet liderlerinin deepfake görüntüleri oylamadan önceki son günlerde dolaşıma girer. Sosyal medya algoritmaları mevcut bölünmeleri büyütecek şekilde manipüle edilir. Hedefin demokratik kurumları yok edilmez. Sessizce güvenilmez kılınır; sonuçları daha tek bir oy pusulası sayılmadan tartışmalı hale gelir."
 CYBER_ESPION_BTN_TT_DELAYED:0 "Hedefli bir oltalama kampanyası, hedefin en hassas araştırma ağlarının derinliklerine özel implantlar yerleştirir. Kötü amaçlı yazılım aylarca ağ içinde yatay hareket ederek planları, test verilerini ve özel formülleri toplar. İhlal fark edildiğinde, araştırmacılarımız çoktan çaldıklarımızın üzerine inşa etmeye başlamış olur."
 CYBER_COMMS_BTN_TT_DELAYED:0 "Sessiz bir ortadaki adam, hedefin en hassas iletişim düğümlerine konumlanır. Generallerin emirleri, büyükelçilerin telgrafları ve kabine görüşmeleri aynı ele geçirilmiş aktarıcıdan geçer: kopyalanır, kataloglanır ve analistlerimize gerçek zamanlı iletilir. Hedef, her kararını okuduğumuzdan habersiz karar vermeye devam eder."
 CYBER_INFRA_BTN_TT_DELAYED:0 "Enerji dağıtımını, su arıtmayı ve lojistik düğümlerini yöneten endüstriyel kontrol sistemlerine sessiz, kötü amaçlı bellenim güncellemeleri yüklenir. Yük tetiklendiğinde art arda gelen arızalar, birden çok sektörde onarım ekiplerini aynı anda bunaltır. Hasar gerçek, fiziksel ve geri döndürülmesi yavaştır."
 CYBER_FIN_BTN_TT_DELAYED:0 "Merkez bankasının takas sistemleri çöker. ATM ağları ülke genelinde devre dışı kalır. Döviz alım satım algoritmaları, ani bir çöküşü tetikleyen zehirlenmiş girdiler alır. Bu kesinti, geleneksel yaptırımların ulaşabileceğinin çok ötesine geçer ve yaptırımların aksine kaynağı belli olmaz."
 CYBER_LOG_BTN_TT_DELAYED:0 "Tedarik zinciri yönetimi yazılımı, tüm ileri harekât üslerinde aynı anda çöker. Mühimmat talepleri bozulmuş kuyruklarda kaybolur. Yakıt tahsis algoritmaları konvoyları var olmayan depolara yönlendirir. Düşmanın askeri makinesi savaşta kırılmaz. Olduğu yerde açlıktan kırılır."
 CYBER_SLEEP_BTN_TT_DELAYED:0 "Sabırlı, yöntemli, görünmez. Ajanlarımız saldırmak için burada değil. Kalmak için buradalar. Hedefin kritik ağ dokusuna, emir üzerine etkinleştirilmeye hazır, uykuda erişim noktaları yerleştirilir. Önümüzdeki bir yıl boyunca en hassas sistemlerinin hiçbir sırrı kalmayabilir."
 CYBER_CRIT_BTN_TT_DELAYED:0 "Siber cephaneliğimizin tüm ağırlığı bir anda çöker. Enerji şebekeleri çöker. Askeri haberleşme dağılır. Sanayi üretimi durur. Mali sistemler donar. Operasyon, stratejik bombalama harekâtının dijital eşdeğeridir ve hedefi ulusal gücün her alanında aynı anda işlevsiz bırakır."
 CYBER_DECEPT_BTN_TT_DELAYED:0 "Hedefin sistemlerine saldırmıyoruz. Zihnini bozuyoruz. Uydurma istihbarat değerlendirmeleri, üst düzey komutanların kimlik doğrulama imzalarını taşıyan sahte emirler, en üst düzey karar vericilere sunulan manipüle edilmiş görüntüler. Hedefin verdiği her karar, bizim ürettiğimiz bir gerçekliğe dayanmış olabilir."
 CYBER_ZERO_BTN_TT_DELAYED:0 "Yıllar içinde biriktirilen ve tam da bu an için saklanan, daha önce bilinmeyen açıklardan oluşan gizli bir cephanelik, hedefin en kritik sistemlerine karşı aynı anda devreye sokulur. Analistleri ne olduğunu anladığında açıklar yanmış, hasar geri döndürülemez hale gelmiş olacaktır."
 CYBER_HARDEN_BTN_TT_DELAYED:0 "Güvenlik ekiplerimiz her açık arayüzü denetler, bilinen her güvenlik açığını yamalar ve yabancı istihbarat teşkilatlarının en sık yokladığı protokolleri sağlamlaştırır. İş gösterişsizdir, ancak kapattığımız her kapı, bir düşmanın kullanabileceği bir vektör eksiği demektir. En iyi siber operasyon, hiç hedefine ulaşmayandır."
 CYBER_CNTRINT_BTN_TT_DELAYED:0 "Analistler, yabancı varlığın ince belirtilerini arayarak ağ günlüklerini ve sistem telemetrisini tarar: anormal erişim örüntüleri, beklenmedik dışa dönük bağlantılar, meşru bir amacı olmayan uykudaki süreçler. Enfekte bir ağı temizlemek yavaş ve özenli bir iştir. Fark edilmeyen bir implant, bilinen bir implanttan çok daha tehlikelidir."
 CYBER_ATTRIB_BTN_TT_DELAYED:0 "Dijital adli bilişim ekiplerimiz saldırı yolunu yeniden kurar: kötü amaçlı yazılım imzalarını izler, komuta-kontrol altyapısını haritalar ve sorumlu aktörü belli eden operasyonel güvenlik örüntülerini kataloglar. Sızmanın arkasındaki devleti adlandırmak, orantılı bir karşılığa giden ilk adımdır."
