 cyber_op_slot_0_attribution_hunt_tracking_desc:0 "İstihbarat ekiplerimiz yakın tarihli bir sızmanın adli analizini yürütüyor; sorumlu devlet aktörünü belirlemek için saldırı vektörlerini ve dijital imzaları izliyor. Sonuçların 60 gün içinde alınması bekleniyor."
