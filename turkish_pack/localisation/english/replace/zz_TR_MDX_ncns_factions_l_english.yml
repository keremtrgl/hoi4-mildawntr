l_english:
 faction_manifest_containment_of_decadence_name:0 "Batı Yozlaşmasının Kuşatılması"
 faction_manifest_containment_of_decadence_desc:0 "'Rahman ve Rahim olan Allah'ın adıyla'\n--------------\nBu toprakları korumak için kendi etimizden ve kanımızdan başka neyimiz var? Emperyalistlerin kendilerine ait olmayan toprağa duyduğu susuzluk basit diplomasiyle asla dindirilemezdi. Sonunda Direniş Ekseni, dünyada emperyalist planların daha fazla yer kazanmasını önlemenin tek yoludur; son adama kadar savaşmak anlamına gelse bile."
 faction_cento_motto_name:0 "Özgürlük, Birlik, Uyanıklık"
 faction_cento_motto_desc:0 "'Doğu ile Batı arasında bir köprü'\n--------------\nHiçlikten bir şey doğdu: yeniden inşa edilmiş bir kimlik ve ittifak. Böylesine sorunlu bir bölgede zayıf adamlar ne başarabilirdi? Ne yazık ki bu doğu sınırlarında yaşayan tüm canların sürekli istikrarını gözetme ve sağlama sorumluluğu CENTO'ya verildi."
 faction_manifest_peace_in_our_time_name:0 "Dünyada Barış"
 faction_manifest_peace_in_our_time_desc:0 "'Animus in consulendo liber'\n--------------\nVarşova Paktı'nın çöküşü ve uluslararası hukuk ile düzenin yeniden yükselişi, tamamen NATO Üye Devletlerinin ortak çabası sayesindeydi. Ancak bugün dünyamızdaki bazı devletlerin bu istikrar dönemini kendi çıkarları için sömürmeye karar verdiği ve NATO çabalarına karşı aktif olarak çalıştığı görülüyor. Çağımızda güvenliği sağlamak için ittifakı yeni sınırlara genişletmeli ve dünya genelindeki tüm halkların güvenliğini sağlamalıyız."
 faction_manifest_preserving_our_place_name:0 "Dünyadaki Yerimizi Korumak"
 faction_manifest_preserving_our_place_desc:0 "'Çok kutuplu bir dünyada kolektif güvenlik'\n--------------\nSovyetler Birliği'nin çöküşü birkaç devletin doğmasına yol açtı. Böyle bir olay Batı bloğu için bir fırsat sundu; Amerika Birleşik Devletleri ve NATO'nun geri kalanı eski Sovyet devletlerini nüfuzları altına almaya çalıştı. Birçokları yeni hegemon Amerika Birleşik Devletleri'nin dünyanın tek süper gücü olduğunu söylese de, bunun kalıcı bir gerçeğe dönüşme umudunu raydan çıkarmak ittifakımızın niyetidir. Birlikteki güçle Sovyet sonrası alanın korunmasını, silahlandırılmasını ve hazır hâle getirilmesini sağlayacağız."
 faction_manifest_unite_islamic_countries_name:0 "İslam Dünyasını Birleştir"
 faction_manifest_unite_islamic_countries_desc:0 "Yüzyıllardır İslam dünyası parçalı durumda; şimdi iş birliği ve anlayışla yeniden birleşebiliriz."
 faction_manifest_the_second_red_wave_goal_name:0 "İkinci Kızıl Dalga"
 faction_manifest_the_second_red_wave_goal_desc:0 "Bolşevikler iktidara ilk geldiğinde on yıllarca süren bir ateş yaktı. Yine de yeni sistemlerinin en büyük kusurunu, yani yetersiz liderliği çözemediler. Batı güçlenirken Sovyetler Birliği durgunlaşıyordu. Komünist diktatörlükler altında çok uzun süre yaşadık. Şimdi kendi komünizm anlayışımızla dünyayı yönetme zamanı bizim."
 faction_manifest_comeback_of_the_monarchy_name:0 "Monarşinin Dönüşü"
 faction_manifest_comeback_of_the_monarchy_desc:0 "Yüzyıllardır monarşiler dünyayı bilgelik ve güçle yönetti. Yine de son on yıllarda cumhuriyetler ve demokrasiler yönetimi devralarak yalnızca geçici barış ve istikrar getirdi. Bu refah çökmeye başladı; bu yüzden monarşilerin yeniden yükselerek uluslarımıza düzeni ve geleneği geri getirme zamanı. Birlik ve iş birliğiyle monarşinin şanını geri getirebilir ve halkımızı daha parlak bir geleceğe taşıyabiliriz."
