 GDP_TOTAL_DESC:0 "§YGayri Safi Yurt İçi Hasılamız§! (GSYİH), ülkede üretilen tüm mal ve hizmetlerin değer ölçüsüdür. Millennium Dawn, yerel ekonomik koşulları hesaba kattığı ve ülkeleri karşılaştırmayı daha anlamlı kıldığı için SAGP'ye (Satın Alma Gücü Paritesi) göre düzeltilmiş GSYİH kullanır."
 NUM_GDP_TOTAL_DESC:0 "§YGSYİH§!'miz şu an $§Y[?ROOT.gdp_total|3]§! milyar.\n\nSon §YÇeyreklik GSYİH Büyüme Oranı§!: [?last_quarter_gdp_growth_rate|%Y].\n\nİpucu: §YÇeyreklik GSYİH Büyüme Oranınız§! ne kadar yüksekse olumlu ekonomik olaylar yaşama ihtimaliniz o kadar artar."
 NUM_GDP_TOTAL_DELAYED_DESC:0 "Sektörlerin Yaklaşık Yüzde Katkısı:\n§PSivil Fabrikalar§!: [?ROOT.civil_fac_percent|%]\n§OAskeri Fabrikalar§!: [?ROOT.military_factory_total_percent|%]\n§BTersaneler§!: [?ROOT.naval_factory_total_percent|%]\n§COfis Parkları§!: [?ROOT.office_fac_percent|%]\n§GTicarileşmemiş Tarım§!: [?ROOT.agriculture_percent|%]\n§YTicari Tarım Bölgeleri§!: [?ROOT.agriculture_district_fac_percent|%]\n§YMikroçip Tesisleri§!: [?ROOT.microchip_plant_percent|%]\n§YKompozit Tesisleri§!: [?ROOT.composite_plant_percent|%]\n§YSentetik Rafineriler§!: [?ROOT.synthetic_refinery_percent|%]\n§GKaynak Çıkarımı§!: [?ROOT.resources_percent|%]\n§YAltyapı§!: [?ROOT.infrastructure_gdp_percent|%]\n§PSağlık Hizmetleri§!: [?ROOT.healthcare_gdp_percent|%]\n"
 GDP_PER_CAPITA:0 "Kişi Başı GSYİH"
 GDP_PER_CAPITA_DESC:0 "Bu sayı §YKişi Başı GSYİH§! (§YGSYİH/K§!) değerimizi gösterir. Ülkedeki her bireyin ortalama üretimini temsil eder.\n\nSon §YÇeyreklik Kişi Başı GSYİH Büyüme Oranı§!: [?last_quarter_gdpc_growth_rate|%Y].\n\nİpucu: §YÇeyreklik Kişi Başı GSYİH Büyüme Oranınız§! ne kadar yüksekse olumlu ekonomik olaylar yaşama ihtimaliniz o kadar artar; ancak kontrol altında tutulmazsa §REnflasyon§! de o kadar yükselebilir."
 GDP_PER_CAPITA_DELAYED_DESC:0 "§YKişi Başı GSYİH§!'nin ülkemize mevcut etkisi:\nİnşaat Hızı: [?production_speed_buildings_factor_gdp_modifier|%+]\nAylık Nüfus: [?monthly_population_gdp_modifier|%+1]\nAraştırma Hızı: [?research_speed_factor_gdp_modifier|%+]\nİstikrar: [?stability_factor_gdp_modifier|%+]\nToplam İş Gücü: [?total_workforce_gdp_c_modifier_var|%+]\nFosil Santral İnşaat Hızı: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA_DESC:0 "§YKişi Başı GSYİH§!'miz şu an $§Y[?ROOT.gdp_per_capita|3]§! bin"
 PRODUCTIVITY:0 "Verimlilik"
 PRODUCTIVITY_DESC:0 "Bu sayı ülkemizin §YVerimliliğini§! gösterir."
 NUM_PRODUCTIVITY_DELAYED_DESC:0 "§YEyalet Düzeltmeleri Öncesi Aylık Büyüme:§! [?productivity_growth_scaled|3+]\n\n§YTemel Verimlilik Büyümesi:§!\nYasalar, Ulusal Ruhlar ve Teknolojiler: [?modifier@productivity_growth_modifier|3+]\n  Kurumlar Vergisi Dahil: [?productivity_growth_modifier_from_corporate_tax|3+][literacy_productivity_tooltip]\n\n§YUlusal Büyüme Değiştiricisi:§!\nYasalar, Ulusal Ruhlar ve Teknolojiler: [?modifier@country_productivity_growth_modifier|%+1]\n  Enflasyon Dahil: [?inflation_rate_prod_var|%+1]\n\nAylık büyüme = temel verimlilik büyümesi ×0,5 × (1 + ulusal büyüme değiştiricisi). Ulusal çarpan 0–100 ile sınırlıdır. Ardından her eyalet kendi dünya verimliliği düzeltmesini ve yerel büyüme değiştiricisini uygular.\n\nVerimliliğin Etkisi:\n§YGSYİH:§! [?productivity_tax_effect_display|%+1]\n§YFabrika Üretimi:§! [?productivity_tax_effect_display|%+1]\n§YTersane Üretimi:§! [?productivity_tax_effect_display|%+1]\n§Yİnşaat Hızı:§! [?productivity_tax_effect_display|%+1]\n§YKurumlar Vergisi:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §YTicari Tarım Bölgeleri§! İnşaat Hızı:§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY_DESC:0 "§YVerimlilik§!, kaynakları halkımız için mal ve hizmete ne kadar etkin dönüştürdüğümüzü ölçer; GSYİH'yi, Kurumlar Vergisini ve Sanayi Üretimini ölçekler. Yüksek verimlilik daha fazla etkinlik demektir; ancak eyaletler dünya ortalamasına göre verimlileştikçe büyüme yavaşlar, daha az verimli eyaletler ise daha hızlı yetişir.\n\n§YDünya Ortalaması:§! [?global.average_world_productivity|3]\n§YBizim Verimliliğimiz:§! [?ROOT.overall_productivity|3]\n"
 INFLATION:0 "Enflasyon"
 INFLATION_DESC:0 "Bu sayı ülkemizin §YEnflasyonunu§! gösterir"
 NUM_INFLATION_DESC:0 "§YPara Birimi Gücü:§! [currency_strength_display]\n§Y1,00§!'in altında zayıf para birimi, devlet maliyetlerine uygulanan enflasyonu artırır. §Y1,00§!'in üzerinde ise bu enflasyonu hafifletir.\n\n§YEnflasyon§!, ülkenizin satın alma gücünün ne ölçüde arttığını ya da azaldığını belirleyen değerdir. Enflasyon yükseldikçe paranız değer kaybeder ve hem halkınızın hem de hükümetinizin satın alma gücü azalır. Enflasyon, son 4 çeyreğin §YÇeyreklik Kişi Başı GSYİH Büyüme Oranı§! ortalamasının ortalama §YVergi Oranınız§! ile çarpılmasıyla hesaplanır; ardından §YEkonomik Döngüler§!, §YPara Basma§!, §YPolitika Faizi§! ve diğer ekonomik olaylarla düzeltilir.\n\nOrtalama §YÇeyreklik Kişi Başı GSYİH Büyüme Oranınız§! ve §YKişi Başı GSYİH§! değeriniz ne kadar yüksekse enflasyon oranınız da o kadar yüksek olur. Yüksek §YVergi Oranı§! enflasyonu düşürür, düşük oran ise artırır. Yüksek §YPolitika Faizi§! enflasyonu düşürür ancak §RBorç Faizini§! artırır; düşük faiz bunun tersini yapar.\n\n§Yİstikrarlı Büyüme§!'nin üzerindeki §YEkonomik Döngüler§!, mal talebinin ve harcanabilir paranın arttığını yansıtarak §YEnflasyonunuzu§! yükseltir; §Yİstikrarlı Büyüme§!'nin altındaki §YEkonomik Döngüler§! ise harcanabilir paranın ve tüketim malı talebinin azaldığını yansıtarak §YEnflasyonunuzu§! düşürür.\n\n§YEnflasyon§! oranınız negatife düşerse §YDeflasyon§! yaşanabilir. §YDeflasyon§! devlet giderlerini azaltmaya yardımcı olabilir; ancak insanlar fiyatların daha da düşmesini bekleyip harcamayı bıraktığından ekonomik daralmalara yol açabilir. Fiyatlar çok fazla veya çok hızlı düşerse piyasalar ve işletmeler §Rİflas edebilir§!."
 NUM_INFLATION_DELAYED_DESC:0 "§HSon 4 Çeyrek:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nGösterilen oran, ortalama yıllık enflasyonu temsil eden §Ydört çeyreklik hareketli ortalamadır§! ve tüm ekonomik etkilerde bu sayı kullanılır."
 total_civilian_factories_amount_tt:0 "Bu değer ülkemizdeki toplam §YSivil Sanayi§! sayısını gösterir."
 total_civilian_factories_amount_tt_delayed:0 "Bu bina, eyalete sivil mal üretimi veya yeni bina inşası için sanayi sağlar. Gerekirse askeri sanayiye dönüştürülebilir.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y206 bin§!\n§YSivil Sanayi§! başına Temel GSYİH Katkısı: $§Y17,5 Milyar§!\nTemel Enerji Tüketimi: §R-0,5§! GW\n\nKişi Başı GSYİH'nin §Yİş Gücüne§! etkisi: [?worker_requirement_gdp_multiplier_display|-%1]\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YSivil Sanayi İş Gücüne§! etkisi: [?modifier@civ_facs_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YSivil Sanayi§! başına gereken işçi: [?workers_per_civ_fac_display|2] bin\n"
 total_military_factories_amount_tt:0 "Bu değer ülkemizdeki toplam §YAskeri Sanayi§! sayısını gösterir."
 total_military_factories_amount_tt_delayed:0 "Bu bina, eyalete yeni askeri teçhizat üretimi için sanayi sağlar. Gerekirse sivil sanayiye dönüştürülebilir.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y18,8 bin§!\n§YAskeri Sanayi§! başına Temel GSYİH Katkısı: $§Y1,5 Milyar§!\nTemel Enerji Tüketimi: §R-0,5§! GW\n\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YAskeri Fabrika ve Tersane İş Gücüne§! etkisi: [?modifier@mil_facs_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YAskeri Sanayi§! başına gereken işçi: [?workers_per_mil_fac_display|2] bin\n"
 total_naval_yard_amount_tt:0 "Bu değer ülkemizdeki toplam §YTersane§! sayısını gösterir."
 total_naval_yard_amount_tt_delayed:0 "§YTersaneler§!, bir eyaletin §YDevriye Botlarından§!, §YKonvoylara§!, §YMuhriplerden§! §YUçak Gemilerine§! kadar her türlü askeri gemiyi üretme kapasitesini temsil eder.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y18,8 bin§!\n§YTersane§! başına Temel GSYİH Katkısı: $§Y1,5 Milyar§!\nTemel Enerji Tüketimi: §R-0,5§! GW\n\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YAskeri Fabrika ve Tersane İş Gücüne§! etkisi: [?modifier@mil_facs_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YTersane§! başına gereken işçi: [?workers_per_dockyard_display|2] bin\n"
 total_offices_amount_tt:0 "Bu değer ülkemizdeki toplam §YOfis Sektörü§! sayısını gösterir."
 total_offices_amount_tt_delayed:0 "§YOfis Sektörü§!, ekonominin madencilik ve ağır sanayi dışındaki tüm diğer kollarını temsil eder. Finans, müşteri hizmetleri, bilgi teknolojileri, perakende ve çok daha fazlası bu kapsamdadır.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y473 bin§!\n§YOfis Sektörü§! başına Temel GSYİH Katkısı: $§Y50 Milyar§!\nTemel Enerji Tüketimi: §R-0,25§! GW\n\nKişi Başı GSYİH'nin §Yİş Gücüne§! etkisi: [?worker_requirement_gdp_multiplier_display|-%1]\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YOfis Sektörü İş Gücüne§! etkisi: [?modifier@offices_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YOfis Sektörü§! başına gereken işçi: [?workers_per_office_display|2] bin\n"
 total_agriculture_district_amount_tt:0 "Bu değer ülkemizdeki toplam §YTicari Tarım Bölgesi§! sayısını gösterir."
 total_agriculture_district_amount_tt_delayed:0 "§YTicari Tarım Bölgeleri§!, ülkemizdeki geçimlik olmayan tüm tarımı kapsar. Tarım sanayisi, ekilebilir araziler, tahıl siloları, mezbahalar ve daha fazlasını içerir.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y188 bin§!\n§YTicari Tarım Bölgesi§! başına Temel GSYİH Katkısı: $§Y25 Milyar§!\nTemel Enerji Tüketimi: §R-0,10§! GW\nEyaletlerden §YYakıt Kazancı§!: 8\n§YYerel İkmal§!: %1,5\n\nKişi Başı GSYİH'nin §Yİş Gücüne§! etkisi: [?worker_requirement_gdp_multiplier_display|-%1]\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YTicari Tarım Bölgesi İş Gücüne§! etkisi: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YTicari Tarım Bölgesi§! başına gereken işçi: [?workers_per_agriculture_district_display|2] bin\n"
 total_microchips_factories_amount_tt:0 "Bu değer ülkemizdeki toplam §YMikroçip Tesisi§! sayısını gösterir."
 total_microchips_factories_amount_tt_delayed:0 "§YMikroçip Tesisleri§!, ülkemizin yarı iletken ve küçük elektronik üretimini temsil eder.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y37,5 bin§!\n§YMikroçip Tesisi§! başına Temel GSYİH Katkısı: $§Y32 Milyar§!\nTemel Enerji Tüketimi: §R-0,75§! GW\n\nKişi Başı GSYİH'nin §Yİş Gücüne§! etkisi: [?worker_requirement_gdp_multiplier_display|-%1]\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YMikroçip Tesisi İş Gücüne§! etkisi: [?modifier@microchip_plant_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YMikroçip Tesisi§! başına gereken işçi: [?workers_per_microchip_plant_display|2] bin\n"
 total_composites_factories_amount_tt:0 "Bu değer ülkemizdeki toplam §YKompozit Tesisi§! sayısını gösterir."
 total_composites_factories_amount_tt_delayed:0 "§YKompozit Tesisleri§!; seramik zırhlar, güçlendirilmiş polimerler ve yüksek performanslı yapısal malzemeler dahil ileri malzeme üretim tesislerini temsil eder.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y37,5 bin§!\n§YKompozit Tesisi§! başına Temel GSYİH Katkısı: $§Y28 Milyar§!\nTemel Enerji Tüketimi: §R-0,8§! GW\n\nKişi Başı GSYİH'nin §Yİş Gücüne§! etkisi: [?worker_requirement_gdp_multiplier_display|-%1]\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YKompozit Tesisi İş Gücüne§! etkisi: [?modifier@composite_plant_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YKompozit Tesisi§! başına gereken işçi: [?workers_per_composite_plant_display|2] bin\n"
 total_refineries_amount_tt:0 "Bu değer ülkemizdeki toplam §YSentetik Rafineri§! sayısını gösterir."
 total_refineries_amount_tt_delayed:0 "§YSentetik Rafineriler§!, sanayi ve lojistik için kritik olan sentetik kauçuk ve ilgili kimyasal malzemeleri üreten tesisleri temsil eder.\n\nEyalete sağladıkları:\nTemel Gerekli İşçi Sayısı: §Y184 bin§!\n§YSentetik Rafineri§! başına Temel GSYİH Katkısı: $§Y10 Milyar§!\nTemel Enerji Tüketimi: §R-0,2§! GW\n\nKişi Başı GSYİH'nin §Yİş Gücüne§! etkisi: [?worker_requirement_gdp_multiplier_display|-%1]\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Binalardaki İş Gücüne§! etkisi: [?modifier@buildings_worker_requirement_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YSentetik Rafineri İş Gücüne§! etkisi: [?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\nToplam indirim en fazla §Y%90§! olabilir.\n\n§YSentetik Rafineri§! başına gereken işçi: [?workers_per_synthetic_refinery_display|2] bin\n"
 POPULATION_TAX_RATE:0 "Halk Vergisi"
 POPULATION_TAX_RATE_TT:0 "Halk Vergisi Oranı, halka uygulanan tüm vergileri kapsar. Gelir vergisi, KDV, satış vergisi ve emlak vergisi bunlardan bazılarıdır.\n\n§YHalk Vergisinden Gelen Değiştiriciler:§!\n£stability_texticon  İstikrar: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE:0 "Kurumlar Vergisi"
 CORPORATE_TAX_RATE_TT:0 "Kurumlar Vergisi Oranı, şirketlere uygulanan tüm vergileri kapsar. Kurumlar gelir vergisi, işveren vergileri ve daha fazlasından oluşur.\n\n§YKurumlar Vergisinden Gelen Değiştiriciler:§!\n£consumer_goods_texticon  Vergi Maliyeti: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §YDış Yatırım Alma§! Maliyet Değiştiricisi: [?receiving_investment_cost_form_corporate_tax|%-]\nAylık Verimlilik Büyümesi: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE:0 "Politika Faizi"
 CB_POLICY_RATE_TT:0 "§YMerkez Bankası Politika Faizi§!, merkez bankasının belirlediği gösterge faiz oranıdır ve ekonomi genelinde borçlanmanın maliyetini belirler.\n\n§YFaizi artırmak§! para arzını daraltır; enflasyonu bastırır ama devlet borcunun maliyetini yükseltir ve ekonomik faaliyeti yavaşlatır.\n§YFaizi düşürmek§! borçlanmayı ve yatırımı teşvik eder ama enflasyonun daha serbestçe yükselmesine izin verir.\nFaizin her puanı, enflasyon ne kadar yüksek olursa olsun bir sonraki çeyreğe aktarılan enflasyonu da azaltır. Sürdürebileceğimizin üzerindeki bütçe açığı bu azalmayı yarıya kadar küçültür.\nEnflasyonun 1 puandan fazla üzerindeki bir faiz §YPara Birimi Gücünü§! destekler, daha düşük bir faiz ise zayıflatır. Enflasyon faizin çok üzerindeyken bile her puan aylık düşüşü yumuşatır.\n\nHer ayar §Y25§! £pol_power_icon tutar ve §Y30 günlük§! bekleme süresi vardır.\n\n§YMevcut Faiz:§! %[?cb_policy_rate]\n§YEnflasyon Aktarımı:§! [?cb_policy_rate|+0]% × her çeyrek 2,5 puan daha az\n§YBorç Faizi Primi:§! [?cb_policy_rate|+0]% × 0,33 puan §YFaiz Oranına§! eklenir"
