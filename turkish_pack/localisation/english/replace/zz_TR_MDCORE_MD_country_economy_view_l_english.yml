 increases_cb_rate_tooltip:0 "§YPolitika Faizini§! 1 puan artırarak para politikasını sıkılaştır.\n\n§YEtkiler:§!\nÇeyreklik enflasyon her çeyrek ek olarak §G%0,2§! bastırılır\nBir sonraki çeyreğe aktarılan enflasyon §G2,5 puan§! azalır; aşırı bütçe açığında bu azalma §G1,25 puana§! kadar düşer\nDevlet borcu faiz oranı §R0,33 puan§! artar\nAylık §YPara Birimi Gücü§! baskısı §G0,001§! artar; enflasyon faizin çok üzerindeyken §G0,00025§! artar (faiz enflasyonun 6 puan üzerine çıktığında değişmez)\n\n§YÖn Koşullar:§!\n£pol_power_icon §Y25§! Siyasi Güç\nPolitika Faizi %30'un altında\nSon 30 günde faiz değişikliği yapılmamış"
