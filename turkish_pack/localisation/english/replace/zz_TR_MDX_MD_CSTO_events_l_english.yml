l_english:
 CSTO.1.t:0 "[From.GetNameDef] KGAÖ'ye katılmak istiyor"
 CSTO.1.d:0 "[From.GetAdjective] heyetler ilginç bir teklifle geldi. Heyet, [From.GetNameDef] ülkesinin ortak anlaşmaları imzalamak ve KGAÖ'nün bir parçası olmak istediğini açıklıyor. Yeni bir dostluk bildirgesi imzalama sürecini başlatmak ve [From.GetNameDef] ülkesinin ittifakımıza girmesine izin vermek için bir görüşme talep ediyorlar."
 CSTO.1.a:0 "Kesinlikle"
 CSTO.1.b:0 "Asla"
 CSTO.2.t:0 "[SOV.GetNameDef] KGAÖ'ye katılma talebini reddediyor"
 CSTO.2.d:0 "[SOV.GetNameDef] KGAÖ'ye katılma talebimizi reddetti."
 CSTO.2.a:0 "Hayal kırıklığı"
 CSTO.3.t:0 "KGAÖ'ye Davet"
 CSTO.3.d:0 "[SOV.GetNameDef] ve müttefikleri bizi KGAÖ'ye davet etmek istiyor. Ne yapacağız?"
 CSTO.3.a:0 "Kabul ediyoruz!"
 CSTO.3.b:0 "Buna vaktimiz yok."
 CSTO.4.t:0 "[ROOT.GetNameDef] KGAÖ'ye katılıyor"
 CSTO.4.d:0 "[SOV.GetNameDef] ve [ROOT.GetNameDef] bugün [ROOT.GetNameDef] ülkesinin Kolektif Güvenlik Antlaşması Örgütü'ne girişini duyurmak için bir araya geldi. [SOV.GetNameDef] ve [ROOT.GetNameDef] rekabetlerini bir kenara bırakıp [ROOT.GetNameDef] ülkesinin ittifaka girmesinin her ikisinin de yararına olduğuna karar verdi."
 CSTO.4.a:0 "Harika Bir Gün!"
 CSTO.4.b:0 "Yeni Bir Müttefik"
 CSTO.4.c:0 "İlginç Gelişme"
 CSTO.5.t:0 "[ROOT.GetNameDef] KGAÖ'den ayrılıyor!"
 CSTO.5.d:0 "[ROOT.GetNameDef] lideri [ROOT.GetLeader], bugün ülkenin Kolektif Güvenlik Antlaşması Örgütü'nden ve bağlı ittifaklarından derhal çekilme niyetini duyurdu. Bu, askerî paktı zayıflatacak."
 CSTO.5.a:0 "İyi seçim"
 CSTO.5.b:0 "İlginç"
 CSTO.6.t:0 "KGAÖ Tam Bir Askerî İttifaka Dönüşüyor"
 CSTO.6.d:0 "Politikada büyük bir değişiklikle [SOV.GetNameDef], Kolektif Güvenlik Antlaşması Örgütü'nün tam bir taarruz ittifakına dönüştürüleceğini duyurdu. Üye devletler artık yalnızca savunma savaşlarına değil, ittifak liderinin ilan ettiği her savaşa katılmakla yükümlü olacak. Bu, [SOV.GetAdjective] askerî hırslarında önemli bir tırmanışa işaret ediyor ve Batılı güçler arasında endişe yarattı."
 CSTO.6.a:0 "Moskova'nın yanındayız"
 CSTO.6.b:0 "Endişe verici bir gelişme"
 CSTO_management:0 "KGAÖ Yönetimi"
 SOV_convert_csto_to_offensive:0 "KGAÖ'yü Taarruz İttifakına Dönüştür"
 SOV_convert_csto_to_offensive_desc:0 "Şu anda KGAÖ bir savunma ittifakı olarak işliyor; üyeler yalnızca saldırıya uğradığımızda silaha çağrılabilir. Antlaşmayı yeniden yapılandırarak onu, üyelerin taarruz harekâtları dahil tüm savaşlarımıza katılmak zorunda olduğu tam bir askerî ittifaka dönüştürebiliriz. Bu, müttefiklerimizi ve kuklalarımızı başlattığımız her çatışmaya çağırmamıza olanak tanır."
 SOV_csto_has_at_least_one_member_tt:0 "KGAÖ'de en az bir üye daha var"
