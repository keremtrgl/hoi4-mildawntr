 OPEN_STORAGE_BUTTON_TT:0 "Şu anda §YStratejik Kaynak Rezervlerinizde§! kaç kaynak bulunduğunu görebileceğiniz §YKaynak Depolama§! menüsünü açar.\n\nNOT: §YKaynak Depolama§!'nın bir motor sınırlaması vardır: §Yİhracat Ekonomisi§! veya §YKüreselleşmiş Ticaret Ekonomisi§! kullanıyorsanız, ihtiyaç duyduğunuz üretim hatlarından çok ihracata kaynak gönderebilirsiniz. Depodan çekim yapmaya başlamanız gerekiyorsa §YKarma Ekonomi§! veya daha düşük bir seviyeye geçmeniz önerilir.\n"
