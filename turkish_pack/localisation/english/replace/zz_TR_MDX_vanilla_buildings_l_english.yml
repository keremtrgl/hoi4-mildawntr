l_english:
 industrial_complex:0 "Sivil Sanayi"
 industrial_complex_plural:0 "Sivil Sanayiler"
 industrial_complex_desc:0 "Bu bina eyalete sivil malların üretimi veya yeni binaların inşası için sanayi sağlar. Gerekirse askerî sanayiye dönüştürülebilir.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y206 bin§!\n§YSivil Sanayi§! Başına Temel GSYİH Çıktısı: $§Y17,5 Milyar§!\nTemel Enerji Tüketimi: §R-0,5§! GW\n"
 arms_factory:0 "Askerî Sanayi"
 arms_factory_plural:0 "Askerî Sanayiler"
 arms_factory_desc:0 "Bu bina eyalete yeni askerî teçhizat üretimi için sanayi sağlar. Gerekirse sivil sanayiye dönüştürülebilir.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y18,8 bin§!\n§YAskerî Sanayi§! Başına Temel GSYİH Çıktısı: $§Y1,5 Milyar§!\nTemel Enerji Tüketimi: §R-0,5§! GW"
 internet_station:0 "Ağ Altyapısı"
 internet_station_plural:0 "Ağ Altyapısı"
 internet_station_desc:0 "§YAğ Altyapısı§!, telekomünikasyon ve telsiz haberleşme alanlarında iletimleri uzun mesafelere veya yeraltı fiber optik kablolarına ve bulut bilişim sistemlerine ulaştırmak için kullanılan yüksek yapılardır.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y12 bin§!\n§YAğ Altyapısı§! Başına Temel GSYİH Çıktısı: $§Y3,5 Milyar§!\n\nHer §YAğ Altyapısı§! seviyesi yerel verimlilik büyüme hızını §G+%5,00§! artırır.\nHer §YAğ Altyapısı§! seviyesi §YUluslararası Yatırımların§! süresini §G-%5,00§! azaltır."
 dockyard:0 "Tersane"
 dockyard_plural:0 "Tersaneler"
 dockyard_desc:0 "§YTersaneler§!, bir eyaletin §YDevriye Botları§!, §YKonvoylar§!, §YMuhripler§!, §YUçak Gemileri§! ve daha fazlası dahil her türlü askerî gemiyi üretme kabiliyetini temsil eder.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y18,8 bin§!\n§YTersane§! Başına Temel GSYİH Çıktısı: $§Y1,5 Milyar§!\nTemel Enerji Tüketimi: §R-0,5§! GW"
 air_base_desc:0 "§YHava Üssü§!, hava kuvvetlerinizin konuşlandırılması ve hazırlanması için bir depolama tesisi ve askerî komplekstir. Onuncu seviyeye kadar yığılabilir ve her seviye için §Y50§! uçaklık ek kapasite sağlar."
 radar_station_desc:0 "§YRadar İstasyonları§! yakındaki eyaletlerdeki düşman birlikleri hakkında istihbarat toplamanızı sağlar. Çeşitli radarlardan ve sensörlerden, ayrıca istihbarat varlıklarından ve gelişen durumu analiz etme kapasitesinden oluşur.\nDaha yüksek seviye etkin menzilini artırır.\nRadarları ayrıca eyaletin düşman hava kuvvetlerini daha iyi tespit etmesini sağlar ve uçaklarınıza onlarla çatışma konusunda daha iyi bir şans verir.\nBunlara ek olarak radarlar denizdeki düşman filolarının tespitini de artırır."
 anti_air_building:0 "Kısa Menzilli Hava Savunma Mevzileri"
 anti_air_building_plural:0 "Kısa Menzilli Hava Savunma Mevzileri"
 anti_air_building_desc:0 "§YKısa Menzilli Hava Savunma Mevzileri§!, alçak irtifa hava tehditlerine karşı hava savunmasını yürüten uçaksavar silahları ve taktikleri komplekslerinden ve gruplarından oluşur. Bu mevziler hava sahasını savunulabilir alanlara bölmek için birlikte çalışır ve yerel askerî hedeflere ve altyapıya helikopterlerden alçak uçan uçaklara ve jetlere kadar her şeye karşı hava koruması sağlar."
 nuclear_reactor_desc:0 "Bu bina, süreçte orta düzeyde zenginleştirilmiş uranyum tüketerek nükleer enerjiyi elektrik enerjisine dönüştürür.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y115 bin§!\n§YNükleer Reaktör§! Başına Temel GSYİH Çıktısı: $§Y4 Milyar§!\nTemel Güç Kazancı: §G+5§! GW\n"
 renewable_energy_infra:0 "Yenilenebilir Enerji Altyapısı"
 renewable_energy_infra_plural:0 "Yenilenebilir Enerji Altyapısı"
 renewable_energy_infra_desc:0 "§YYenilenebilir Enerji Altyapısı§!, tüm yenilenebilir enerji kaynaklarını kapsayan genel bir kategoridir. Güneş parkları, rüzgâr türbinleri, biyoyakıt rafinerileri, kömür tesisleri, biyoyakıtlı santraller ve daha fazlası bunlardan bazılarıdır. Bu nedenle yenilenebilir kaynakları kullanır ve bu kaynaklardan yakıt üretir.\n\nEyalete sağladıkları:\nGereken Temel İşçi Sayısı: §Y22,5 bin§!\n§YYenilenebilir Enerji Altyapısı§! Başına Temel GSYİH Çıktısı: $§Y2 Milyar§!\nTemel Enerji Kazancı: §G+0,5§! GW\n"
 fuel_silo:0 "Stratejik Kaynak Rezervi"
 fuel_silo_plural:0 "Stratejik Kaynak Rezervleri"
 fuel_silo_desc:0 "§YStratejik Kaynak Rezervi§!, depoların, kuru depolama alanlarının ve diğer §YYakıt§! benzeri depolama tesislerinin bir bileşimidir. Bu bina ülkenize §HYakıt§! ve §HKaynak§! istiflemek için daha fazla alan sağlar.\n\nNOT: §YKaynak Depolama§!, oyun motorundan kaynaklanan bir sınırlamaya sahiptir: §Y$export_economy$§! veya §Y$globalized_trade_economy$§! ekonomisindeyseniz ihtiyaç duyulan üretim hatlarından çok ihracata daha fazla kaynak gönderebilirsiniz. Depodan çekmeye başlamanız gerekirse §Y$mixed_economy$§! veya daha düşük bir ekonomiye geçmeniz önerilir.\n"
 offices:0 "Ofis Sektörü"
 offices_plural:0 "Ofis Sektörleri"
 rail_way_plural:0 "Demiryolları"
 fossil_powerplant:0 "Fosil Yakıtlı Santral"
 fossil_powerplant_plural:0 "Fosil Yakıt Santralleri"
 fossil_powerplant_desc:0 "§YFosil Yakıt Santralleri§!, tüm fosil temelli termoelektrik enerji kaynaklarını kapsayan genel bir kategoridir. Kömür, doğal gaz ve petrol bunlarla sınırlı olmamak üzere bunları içerir. Enerji üretimi tüketimden yüksekse §YFosil Yakıt Santralleri§! boşta çalışır.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y7,5 bin§!\n§YFosil Yakıt Santrali§! Başına Temel GSYİH Çıktısı: $§Y1,7 Milyar§!\nTemel Güç Kazancı: §G+2§! GW\n"
 agriculture_district:0 "Ticari Tarım Bölgesi"
 agriculture_district_plural:0 "Ticari Tarım Bölgeleri"
 agriculture_district_desc:0 "§YTicari Tarım Bölgeleri§!, ülkemizdeki geçimlik olmayan tüm tarımı kapsayan genel bir kategoridir. Tarım sanayisini, ekilebilir araziyi, tahıl silolarını, mezbahaları ve daha fazlasını içerir.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y188 bin§!\n§YTicari Tarım Bölgesi§! Başına Temel GSYİH Çıktısı: $§Y25 Milyar§!\nTemel Enerji Tüketimi: §R-0,10§! GW\nEyaletlerden §YYakıt Kazancı§!: 8\n§YYerel İkmal§!: %1,5\n"
 rocket_site:0 "Füze Fırlatma Sahası"
 rocket_site_plural:0 "Füze Fırlatma Sahaları"
 rocket_site_desc:0 "§YFüze Fırlatma Sahaları§!, §YYerden Havaya Füzelerden§! §YKıtalararası Balistik Füzelere§! kadar tüm harekât sahası düzeyindeki füze teçhizatını kapsayan genel bir kategoridir. Eyalete bu stratejik varlıkları stratejik hava bölgelerimizde konuşlandırma ve hava savunmamıza yardımcı olma veya taarruz kabiliyeti sağlama imkânı verir."
 nuclear_facility:0 "Sivil Ar-Ge Tesisi"
 nuclear_facility_plural:0 "Sivil Ar-Ge Tesisleri"
 nuclear_facility_desc:0 "§YSivil Ar-Ge Tesisi§!, sivil sanayi kapasitesi, nükleer tesisler ve daha fazlasıyla ilgili her türlü özel projeyi içerir."
 air_facility:0 "Aerodinamik ve Aviyonik Tesisi"
 air_facility_desc:0 "Aerodinamik ve Aviyonik Deney Tesisleri, uçaklar, gelişmiş roketler, ilgili elektronik ve uzay projeleri için araştırma projeleri başlatmanızı sağlar."
 naval_facility_desc:0 "Deniz Mühendisliği Deney Tesisleri, Yüzey Gemileri ve Denizaltılarla ilgili araştırma projeleri başlatmanızı sağlar.\nDeniz Mühendisliği tesisi yalnızca kıyı bölgesinde kurulabilir."
 stronghold_network:0 "Eyalet Çapında Savunma Ağı"
 stronghold_network_plural:0 "Eyalet Çapında Savunma Ağları"
 stronghold_network_desc:0 "Tünellerden, müstahkem noktalardan, siperlerden, sığınaklardan, silah depolarından ve önceden planlanmış yıkım noktalarından oluşan kapsamlı bir savunma ağı, savunanlara her saldırgana karşı kesin bir üstünlük sağlar."
 microchip_plant:0 "Mikroçip Tesisi"
 microchip_plant_plural:0 "Mikroçip Tesisleri"
 microchip_plant_desc:0 "Teknoloji Metallerini ve Değerli Metalleri hem sanayi hem askerî ihtiyaçlarda kullanılmak üzere Mikroçiplere dönüştüren üretim tesisi.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y37,5 bin§!\n§YMikroçip Tesisi§! Başına Temel GSYİH Çıktısı: $§Y32 Milyar§!\nTemel Enerji Tüketimi: §R-0,75§! GW\n20 §YMikroçip§! Üretimi\n\n§YMikroçipler§! birim başına en yüksek piyasa fiyatına sahiptir ve fazla ihracatta önemli nakit geliri sağlar.\n\nMaliyetler:\n3 §YTeknoloji Metali§!\n2 §YDeğerli Metal§!"
 composite_plant:0 "Kompozit Tesisi"
 composite_plant_plural:0 "Kompozit Tesisleri"
 composite_plant_desc:0 "Petrolü, Kauçuğu ve Değerli Metalleri hem bilimsel, askerî hem de sanayi çalışanlarında kullanılmak üzere Kompozitlere dönüştüren üretim tesisi.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y37,5 bin§!\n§YKompozit Tesisi§! Başına Temel GSYİH Çıktısı: $§Y28 Milyar§!\nTemel Enerji Tüketimi: §R-0,8§! GW\n20 §Yİleri Kompozit§! Üretimi\n\n§YKompozitler§! birim başına en yüksek piyasa fiyatlarından birinde satılır ve fazla ihracatta güçlü nakit geliri sağlar.\n\nMaliyetler:\n1 §YPetrol§!\n1 §YKauçuk§!\n1 §YDeğerli Metal§!"
 synthetic_refinery_desc:0 "Bu bina eyalete sentetik kauçuk üretimi için sanayi ve bir miktar ek yakıt üretim kabiliyeti sağlar.\n\nEyalete sağladıkları:\nGerekli Temel İşçi Sayısı: §Y184 bin§!\n§YSentetik Rafineri§! Başına Temel GSYİH Çıktısı: $§Y10 Milyar§!\nTemel Enerji Tüketimi: §R-0,2§! GW\n\n§YKauçuğu§! standart piyasa oranlarında üretir; fazlası kurumlar vergisine ek olarak nakit geliri sağlar.\n"
 enrichment_facility:0 "Nükleer Zenginleştirme Tesisi"
 enrichment_facility_plural:0 "Nükleer Zenginleştirme Tesisleri"
 enrichment_facility_desc:0 "Zenginleştirme tesisleri uranyumu alır ve nükleer reaktörlerde, bir ölçüde de nükleer silahlarda kullanılmak üzere zenginleştirir."
 rail_terminal:0 "Demiryolu Terminali"
 rail_terminal_plural:0 "Demiryolu Terminalleri"
 rail_terminal_desc:0 "Yoğun bir terminal ağıyla hizmet gören bir eyalet hem insanları hem malları daha hızlı taşır; böylece fabrikalar daha istikrarlı girdi alır, işçiler işlerine daha güvenilir ulaşır ve çevredeki ekonomi genişlemek için alan kazanır."
 show_construction_speed:0 "İşaretlendiğinde her §YBina Türü§! için mevcut £construction_speed_texticon §YInşaat Hızı Bonusunu§! görebilirsiniz.\n\nBu değiştirici yalnızca binaya özgü değiştiriciyi gösterir. §YKüresel £construction_speed_texticon İnşaat Hızını§! hesaba katmaz."
 landmark_kaaba:0 "Kâbe"
 landmark_kaaba_desc:0 "Mekke'deki Mescid-i Haram'ın kalbinde yer alan küp biçimli kutsal yapı Kâbe, İslam'ın en kutsal mekânıdır. Altın hat işlemeli siyah ipekle örtülü olup dünyadaki Müslümanların namazda yöneldiği kıbleyi oluşturur. Allah'ın Evi olarak bilinen bu kadim mabet, asırlık inancı, hacı ziyaretini ve İslam tarihini barındırır, Müslüman ümmetinin birliğini simgeler.\n\n§YKâbe Simgesi§!, Arap eyaletlerinin toplam nüfusuna bağlı turizm geliri sağlar. Tam miktar §YEkonomi Önizlemesinde§! görülebilir."
 landmark_milad:0 "Milad Kulesi"
 landmark_milad_desc:0 "Milad Kulesi veya Borj-e Milad'ın kökleri İran'ın devrim öncesi dönemine uzanır; ilk planlar 1970'lere dayanır. 1979 İran Devrimi'nden sonra değişen siyasi öncelikler nedeniyle bu ilk planlar rafa kaldırıldı. Fikir 1990'ların sonunda yeniden canlandırıldı ve inşaat, İran'ın yeni kalkınma ve modernleşme odağıyla uyumlu olarak 2000'de başladı. Tasarımı İran mirasının unsurlarını çağdaş mühendislikle birleştirir ve onu hem tarihî sürekliliğin hem de ülkenin gelişen kimliğinin çarpıcı bir simgesi yapar. Bugün kule, Tahran halkına ve ziyaretçilerine şehrin ve uzaktaki Elburz dağlarının panoramik manzarasını sunan çok işlevli bir kompleks ve öne çıkan bir kültürel simgedir."
 landmark_domeofrock:0 "Kubbetü's-Sahra"
 landmark_domeofrock_desc:0 "Kubbetü's-Sahra, Kudüs'ün Eski Şehri'ne bakan altın kubbesiyle ünlü, meşhur bir İslam türbesidir. Yedinci yüzyılda inşa edilmiş olup Müslümanlar ve Yahudiler için kutsal olan Harem-i Şerif'te, diğer adıyla Tapınak Dağı'nda yer alır. Türbe, Müslümanların Hz. Muhammed'in miraca yükseldiği yeri işaret ettiğine, Yahudilerin ise kadim Yahudi Tapınağı'nın Kutsalların Kutsalı'nın yeri olduğuna inandığı Temel Taşı'nı barındırır."
 landmark_goldengate:0 "Golden Gate Köprüsü"
 landmark_goldengate_desc:0 "1937'de tamamlanan Golden Gate Köprüsü, San Francisco Körfezi ile Pasifik Okyanusu arasındaki boğazı aşarak şehri Marin Headlands'e bağlar. Kendine özgü Uluslararası Turuncu renkli kuleleri ve uzun asma açıklığı, onu açıldığı sırada türünün dünyadaki en uzun köprüsü yaptı ve hâlâ Amerika Birleşik Devletleri'nin en tanınmış yapılarından biridir."
 landmark_UScongress:0 "ABD Kongre Binası"
 landmark_UScongress_desc:0 "ABD Kongre Binası, Washington D.C.'deki National Mall'un doğu ucunda yükselir ve Senato ile Temsilciler Meclisi salonlarını barındırır. Neoklasik tasarımı ve merkezî kubbesi onu Amerikan yasama gücünün en tanınmış merkezi yapmıştır; Kongre Kütüphanesi'ni, Yüksek Mahkeme'yi ve Smithsonian Enstitüsü müze kompleksini de içeren bir koridorun odağını oluşturur."
 landmark_fuji:0 "Fuji Dağı"
 landmark_fuji_desc:0 "3.776 metreyle Japonya'nın en yüksek zirvesi olan Fuji Dağı, Honşu'da yer alan ve açık havalarda Tokyo'dan görülebilen etkin bir tabaka yanardağıdır. Şinto inancında uzun zamandır kutsal sayılan ve Japon sanatının belirleyici bir motifi olan dağ, aynı zamanda bir UNESCO Dünya Mirası Alanıdır. Kusursuza yakın konik silueti ve çevresindeki göl bölgesi her yıl yüz binlerce dağcıyı ve turisti çeker."
 landmark_giza:0 "Giza Piramitleri"
 landmark_giza_desc:0 "Mısır Eski Krallığı döneminde firavunlar için anıtsal mezarlar olarak inşa edilen Giza Piramitleri, Kahire'nin eteklerinde yer alır. Firavun Keops için yapılan Büyük Piramit, Antik Dünyanın Yedi Harikası'ndan günümüze ulaşan son yapıdır. Kompleks, Sfenks ile birlikte Mısır'ın en çok ziyaret edilen simgelerinden biri ve ülke turizm ekonomisinin merkezidir."
 landmark_shuttle:0 "Kennedy Uzay Merkezi"
 landmark_shuttle_desc:0 "Florida'nın Atlantik kıyısındaki Kennedy Uzay Merkezi, NASA'nın insanlı uzay uçuşu görevlerinin ana fırlatma üssüdür. Roketlerin fırlatmaya hazırlandığı ikonik Araç Montaj Binası ile Apollo ve Uzay Mekiği programlarının tarihî kalkış noktası olan 39 Numaralı Fırlatma Kompleksi gibi tesislere sahiptir. Merkez, hem devlet hem ticari fırlatmaları destekleyen bir yenilik ve keşif merkezi olmaya devam ediyor."
 landmark_shuttle_launch:0 "Kennedy Uzay Merkezi"
 landmark_shuttle_launch_desc:0 "Florida'nın Atlantik kıyısındaki Kennedy Uzay Merkezi, NASA'nın insanlı uzay uçuşu görevlerinin ana fırlatma üssüdür. Roketlerin fırlatmaya hazırlandığı ikonik Araç Montaj Binası ile Apollo ve Uzay Mekiği programlarının tarihî kalkış noktası olan 39 Numaralı Fırlatma Kompleksi gibi tesislere sahiptir. Merkez, hem devlet hem ticari fırlatmaları destekleyen bir yenilik ve keşif merkezi olmaya devam ediyor."
 landmark_buran:0 "Baykonur Uzay Üssü"
 landmark_buran_desc:0 "Güney Kazakistan bozkırlarındaki Baykonur Uzay Üssü, dünyanın en eski ve en büyük faal uzay limanıdır. 1955'te kurulan üs, Yuri Gagarin'in Vostok 1 ile gerçekleştirdiği ilk insanlı uzay uçuşu dahil, Sovyet ve Rus tarihindeki dönüm noktası görevlerin fırlatma yeri olmuştur. Rusya tesisi Kazakistan'dan kiralamayı sürdürüyor ve Uluslararası Uzay İstasyonu'na yapılan insanlı Soyuz fırlatmaları için kullanıyor."
 landmark_ICBMsilominot:0 "Minot Hava Üssü"
 landmark_ICBMsilominot_desc:0 "Minot Hava Kuvvetleri Üssü'nün füze kompleksi, Kuzey Dakota ovalarına dağılmış, kıtalararası balistik füzeleri barındıran geniş bir yeraltı silo ağından oluşur. Silolar nükleer saldırıya karşı sertleştirilmiş, ağır biçimde korunmaktadır ve sürekli alarm durumunda tutularak Amerika Birleşik Devletleri'nin nükleer üçlüsünün kara ayağını oluşturur."
 landmark_ICBMsiloyasny:0 "Yasni Füze Üssü"
 landmark_ICBMsiloyasny_desc:0 "Rusya'nın Orenburg bölgesindeki Dombarovski yakınlarında bulunan Yasni füze üssü, Stratejik Füze Kuvvetleri'nin başlıca silo sahalarından biridir. Soğuk Savaş sırasında inşa edilmiş olup sertleştirilmiş yeraltı silolarında ağır kıtalararası balistik füzeleri barındırır ve Rusya'nın nükleer caydırıcılığının kritik bir bileşenidir."
 landmark_zenobia_wall:0 "Zenobia Savunma Hattı"
 landmark_zenobia_wall_desc:0 "Güney Mısır ve batı çölü boyunca uzanan ağır tahkim edilmiş bir hat. Beton duvarlar, sığınak kompleksleri ve önceden yerleştirilmiş toplar Zenobia Hattı'nın temelini oluşturur; bu hat, Çimera'nın Sahraaltı yarılma bölgelerinden ilerleyişini durdurmak için yükseltildi."
 landmark_hagia_sophia_desc:0 "537'de Bizans katedrali olarak inşa edilen Ayasofya, şehrin 1453'te fethinin ardından İstanbul'un başlıca Osmanlı camisi oldu. Türkiye Cumhuriyeti tarihinin büyük bölümünde laik bir müze olarak hizmet verdi. Devasa merkezî kubbesi ve Bizans mozaikleri, inşa edilmiş en etkili dinî mimari eserleri arasında yer almaya devam ediyor ve her yıl milyonlarca ziyaretçiyi İstanbul'a çekiyor."
 landmark_forbidden_city_desc:0 "Pekin'in kalbindeki surlarla çevrili saray kompleksi, yaklaşık beş asır boyunca Ming ve Qing hanedanlarının imparatorluk konutu olarak hizmet verdi. Bugün dünyanın en önemli Çin sanatı ve eser koleksiyonlarından birini barındıran Saray Müzesi'ne ev sahipliği yapıyor. Yasak Şehir, ülkenin en çok ziyaret edilen kültürel mekânı ve bir UNESCO Dünya Mirası Alanıdır; Çin medeniyetinin başlıca simgesi olarak durur."
 landmark_tokyo_imperial_palace_desc:0 "Meiji Restorasyonu'ndan bu yana Japonya İmparatoru'nun asıl ikametgâhı olan saray, Tokyo'nun kalbinde eski Edo Kalesi'nin yerinde yer alır. Saray ve çevresi, dünyanın en eski kalıtsal monarşisinin sürekliliğini temsil eder. Halka erişim kısıtlıdır, ancak Doğu Bahçeleri ve büyük imparatorluk törenleri her yıl önemli ölçüde turist çeker."
 landmark_taj_mahal_desc:0 "1632'de Babür İmparatoru Şah Cihan tarafından eşi Mümtaz Mahal için bir türbe olarak yaptırılan Tac Mahal, Babür mimarisinin günümüze ulaşan en seçkin örneğidir. Beyaz mermer cephesi, ince kakma işçiliği ve simetrik bahçeleri onu UNESCO Dünya Mirası Alanı ve dünyanın en çok ziyaret edilen anıtlarından biri yapmış olup her yıl milyonlarca ziyaretçiyi Agra'ya çeker."
 landmark_prague_castle:0 "Prag Kalesi"
 landmark_prague_castle_desc:0 "Alan bakımından dünyanın en büyük antik kale kompleksi olan Prag Kalesi, Bohemya krallarının, Kutsal Roma imparatorlarının ve bugün de Çekya Cumhurbaşkanı'nın makamı olmuştur. Surları içinde Aziz Vitus Katedrali ve Orta Avrupa'nın dört bir yanından yüzyıllık sanat eserleri bulunur; bu da kaleyi ülkenin en çok ziyaret edilen kültürel mekânı yapar."
 landmark_bojnice_castle:0 "Bojnice Kalesi"
 landmark_bojnice_castle_desc:0 "Ortaçağ Slovak kalesinin romantik neo-Gotik biçimde restore edilmiş hâli olan Bojnice Kalesi, on dokuzuncu yüzyılın sonlarında Kont János Pálffy döneminde Fransız Loire şatoları tarzında yeniden inşa edildi. Bugün Slovakya'nın en çok ziyaret edilen kültürel mekânlarından biridir; kuleli silueti ve çevresindeki park Slovak miras turizminin merkezini oluşturur."
 landmark_sadabad_complex:0 "Saadabad Kompleksi"
 landmark_sadabad_complex_desc:0 "Tahran'ın kuzeyindeki eteklerde yer alan geniş bir saray kompleksi; aslen Kaçarlar döneminde inşa edilmiş, Pehlevi şahları döneminde büyük ölçüde genişletilmiştir. 1979 devriminin ardından kompleks millileştirildi ve bugün kraliyet koleksiyonlarını, İran sanatını ve doğa tarihini barındıran bir devlet müzeleri ağı olarak işliyor."
 landmark_hofburg_palace_desc:0 "Viyana'nın kalbindeki Hofburg, yüzyıllar boyunca Habsburg hanedanının başlıca imparatorluk sarayı olarak hizmet verdi. Bugün salonlarında Avusturya Federal Cumhurbaşkanı'nın ofisleri, İspanyol Binicilik Okulu, İmparatorluk Hazinesi ve birkaç büyük müze bulunuyor. Viyana'nın belirleyici simgelerinden ve Avusturya kültür turizminin merkezlerinden biri olmaya devam ediyor."
 landmark_berlin_reichstag_desc:0 "Platz der Republik'teki Reichstag binası, yüzyılı aşkın süredir Berlin'in siyasi merkezinde yer alıyor. 1933'te ve İkinci Dünya Savaşı sırasında ağır hasar gören bina, yeniden birleşmenin ardından Norman Foster'ın yeniden tasarımıyla restore edildi ve 1999'da Alman federal parlamentosu Bundestag'ın merkezi olarak yeniden açıldı. Cam kubbesi modern Alman demokrasisinin belirleyici bir simgesi ve Berlin şehir merkezinin önemli bir cazibe noktası oldu."
