 form_AUSHUN_category:0 "Avusturya-Macaristan İmparatorluğu'nu Yeniden Kur"
 form_AUSHUN_category_desc:0 "Avusturya-Macaristan İmparatorluğu, 19. yüzyılın sonlarında ve 20. yüzyılın başlarında Orta Avrupa'da büyük bir güçtü. Ulus, Büyük Savaş'taki ezici yenilgisinin ardından dağıtıldı. Çekya, Avusturya, Macaristan, Slovakya, Slovenya, Bosna ve Ukrayna, Polonya ve Romanya'nın bazı bölümlerine ayrıldı. Çok uzun zaman önce yitirilen payeyi geri alma zamanı. Avusturya-Macaristan İmparatorluğu'nu yeniden kurma zamanı."
 AUSHUN_integrate_start:0 "[GetAUSHUNNameDef] oluşturmaya başla"
 AUSHUN_integrate_start_desc:0 "Avusturya-Macaristan İmparatorluğu'nun toprakları ordumuz tarafından geri alındı ve siyasetçilerimiz yeni bölgeleri yönetme çalışmalarına başladı.\n\n"
 AUSHUN_integrate_AUS:0 "[GetAUSHUNNameAdj] [AUS.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_AUS_desc:0 "Eski Habsburg İmparatorluğu'nun çekirdek toprakları olan Avusturya, ulusumuzdaki başlıca iktidar merkezlerinden biri olmalıdır."
 AUSHUN_integrate_HUN:0 "[GetAUSHUNNameAdj] [HUN.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_HUN_desc:0 "Macaristan Krallığı, Çifte Monarşi'nin öbür yarısı, imparatorluğun yönetiminde bir ortaktı. İmparatorluk yapısının restorasyonu için entegrasyonu şarttır."
 AUSHUN_integrate_SLV:0 "[GetAUSHUNNameAdj] [SLV.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_SLV_desc:0 "Sloven toprakları, Avusturya taç topraklarının bir parçasıydı; Adriyatik'e erişim sağlıyor ve Avusturya ile Balkanlar arasında köprü görevi görüyordu."
 AUSHUN_integrate_NORTHITA:0 "[GetAUSHUNNameAdj] Kuzey İtalya Topraklarını Entegre Et"
 AUSHUN_integrate_NORTHITA_desc:0 "Lombardiya-Venedik'in İtalyan toprakları bir zamanlar kültür ve ticaret bakımından zengin, Habsburg tacının mücevherleriydi. Geri dönmeleri, Avusturya'nın Po Vadisi üzerindeki nüfuzunu yeniden tesis edecek."
 AUSHUN_integrate_CRO:0 "[GetAUSHUNNameAdj] [CRO.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_CRO_desc:0 "Hırvatistan, kayda değer özerkliğe sahip olarak Macar tacının bir parçasıydı. Limanları ve Adriyatik boyunca stratejik konumu, onu imparatorluğun deniz gücü için hayati kıldı."
 AUSHUN_integrate_BOS:0 "[GetAUSHUNNameAdj] [BOS.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_BOS_desc:0 "1878'den beri Avusturya-Macaristan tarafından yönetilen ve 1908'de resmen ilhak edilen Bosna-Hersek'in entegrasyonu güney sınırlarımızı güvence altına alacak ve nüfuzumuzu Balkanlar'a yayacaktır."
 AUSHUN_integrate_SLO:0 "[GetAUSHUNNameAdj] [SLO.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_SLO_desc:0 "Slovak toprakları Macaristan Krallığı'nın ayrılmaz bir parçasıydı ve tacın dağlık kuzey sınırını oluşturuyordu. Yeniden entegrasyonları Karpatlar üzerindeki hâkimiyetimizi güçlendirir."
 AUSHUN_integrate_AUSROM:0 "[GetAUSHUNNameAdj] Transilvanya Topraklarını Entegre Et"
 AUSHUN_integrate_AUSROM_desc:0 "Transilvanya, Macaristan'ın Romen ve Macar nüfus arasında çekişilen tarihî bir taç toprağıydı. Bu bölgenin denetimi, imparatorluğa doğu yaklaşma yollarını güvence altına alır."
 AUSHUN_integrate_CZE:0 "[GetAUSHUNNameAdj] [CZE.GetAdjective] Topraklarını Entegre Et"
 AUSHUN_integrate_CZE_desc:0 "Bohemya taç toprakları, imparatorluğun en sanayileşmiş ve kültürce en zengin topraklarındandı. Prag büyük imparatorluk şehirlerinden biri olarak duruyordu ve yeniden entegrasyonu çok önemlidir."
 AUSHUN_integrate_AUSPOL:0 "Güney Polonya'yı Entegre Et"
 AUSHUN_integrate_AUSPOL_desc:0 "Galiçya, Polonya'nın paylaşımlarıyla edinilen bir taç toprağıydı ve imparatorluğun kuzey sınırına hem ekonomik kaynak hem de stratejik derinlik kazandırıyordu."
 AUSHUN_integrate_WESTUKR:0 "Güneybatı Ukrayna'yı Entegre Et"
 AUSHUN_integrate_WESTUKR_desc:0 "Galiçya'nın doğu uçları Ruten nüfusuna ev sahipliği yapıyordu ve tarımsal zenginlik sağlıyordu. Entegrasyonları nüfuzumuzu Ukrayna sınır bölgelerine yayar."
 AUSHUN_update_flag:0 "[GetAUSHUNNameDef] Oluşumunu Tamamla"
 AUSHUN_update_flag_desc:0 "Tüm bileşen topraklar entegre olduğunda dönüşümümüzü tamamlayıp [GetAUSHUNNameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 is_AUSHUN:0 "[GetAUSHUNNameDef] oluşturuldu"
 form_PBL_category:0 "Peru-Bolivya Konfederasyonu"
 form_PBL_category_desc:0 "Peru-Bolivya Konfederasyonu aslında 19. yüzyılın başında kısa ömürlü bir varlıktı. Peru Cumhuriyeti'nin bölünmesinden ve 1834 ile 1835-1836 iç savaşlarından doğdu ve Bolivya Devleti'ni de içeriyordu. Günümüzdeki görüşmeler asgari düzeydedir; yine de Bolivya ve Peru halklarının siyasi atmosferinde daima mevcuttur. Halkımız için bu yeni yarını düşünme zamanı."
 PBL_integrate_start:0 "[GetPBLNameDef] oluşturmaya başla"
 PBL_integrate_PRU:0 "[GetPBLNameAdj] [PRU.GetAdjective] Topraklarını Entegre Et"
 PBL_integrate_PRU_desc:0 "Peru, konfederasyondaki iki ulus devletin büyüğüdür. En büyük nüfusa, ekonomiye ve yüzölçümüne sahiptir. Peru'yu entegre etmek devasa bir girişim, ancak bu devleti ele geçirmek yeni konfederasyonun çıkarları için sağlam bir hamledir."
 PBL_integrate_BOL:0 "[GetPBLNameAdj] [BOL.GetAdjective] Topraklarını Entegre Et"
 PBL_integrate_BOL_desc:0 "Bolivya, konfederasyonu kuran iki ana ulus devletten biridir. Yüzölçümü, nüfusu ve ekonomik gücü bakımından daha küçük bir ülkedir; ancak bu, onu küçümsemek için bir gerekçe değildir. Dağları, elektronik ve ara mal üretimi için vazgeçilmez hammaddelerle zengindir. Bu ülkeyi entegre etmek, artık çeşitlenmiş ekonomimiz için bir güçlü konum daha sağlayacaktır."
 PBL_integrate_WESTPAR:0 "Batı Paraguay'ı Entegre Et"
 PBL_integrate_WESTPAR_desc:0 "Batı Paraguay, Batı Brezilya veya Kuzey Şili kadar zengin ham madde kaynaklarına sahip değildir. Yine de bu bölge bol miktarda tarım arazisine ve yeni ulusumuzun sanayisini geliştirebileceğimiz alanlara sahiptir."
 PBL_integrate_WESTBRA:0 "Batı Brezilya'yı Entegre Et"
 PBL_integrate_WESTBRA_desc:0 "Batı Brezilya; yerli halklara, bol kaynaklara ve çok daha fazlasına ev sahipliği yapar. Batı Brezilya'yı entegre etmek ulusumuzun konumunu güçlendirmeli ve gelişebileceğimiz toprakları artırmalıdır."
 PBL_integrate_NORTHCHL:0 "Kuzey Şili'yi Entegre Et"
 PBL_integrate_NORTHCHL_desc:0 "Şili'nin kuzey bölgeleri entegrasyon için olgunlaşmıştır; gelecekteki hedeflerimize ulaşmamıza yardımcı olması için bu toprakları bünyemize katmalıyız."
 PBL_update_flag:0 "[GetPBLNameDef] Kuruluşunu Tamamla"
 PBL_update_flag_desc:0 "Tüm bileşen topraklar entegre edildiğinde dönüşümümüzü tamamlayıp [GetPBLNameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 is_PBL:0 "[GetPBLNameDef] kurmuş olmak"
 form_UAS_category:0 "Afrika Devletleri Birliği"
 form_UAS_category_desc:0 "Afrika Devletleri Birliği, 1961'de Kwame Nkrumah'ın Pan-Afrikacı vizyonu doğrultusunda Gana, Gine ve Mali arasında kurulan kısa ömürlü bir siyasi birlikti. Batı Afrika birliği hayalini yeniden canlandıralım ve güçlü yeni bir birlik kuralım."
