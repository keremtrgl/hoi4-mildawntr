 formable_buy.1.t:0 "[?formable_offer_buyer_id.GetNameDef] Tarafından Toprak Teklifi"
 formable_buy.1.d:0 "[?formable_offer_buyer_id.GetNameDef], tarihî çekirdek toprağı saydığı [?formable_offer_state_id.GetName] eyaleti için hükümetimize resmen §H£treasury 100 milyar§! teklif etti.\n\nKabinemiz karar vermeli: ödemeyi kabul edip toprağı teslim etmek ya da teklifi reddedip topraklarımızı bütün tutmak."
 formable_buy.1.a:0 "Reddedemeyeceğimiz bir teklif."
 formable_buy.1.b:0 "Topraklarımız satılık değil."
 formable_buy.1.c:0 "Reddedin ve bir daha bize sormasınlar."
 formable_buy.2.t:0 "[?formable_offer_holder_id.GetNameDef] Teklifimizi Kabul Etti"
 formable_buy.2.d:0 "[?formable_offer_holder_id.GetNameDef], [?formable_offer_state_id.GetName] eyaletini idaremize devretti. Fonlar aktarıldı ve toprak artık bizim."
 formable_buy.2.a:0 "Değerli bir yatırım."
 formable_buy.3.t:0 "[?formable_offer_holder_id.GetNameDef] Teklifimizi Reddetti"
 formable_buy.3.d:0 "[?formable_offer_holder_id.GetNameDef], [?formable_offer_state_id.GetName] eyaleti için teklifimizi reddetti. Fonlar hazinemize iade edildi ve eyalet onların kontrolünde kalmayı sürdürüyor."
 formable_buy.3.a:0 "Diğer seçenekleri değerlendireceğiz."
 formable_buy.4.t:0 "Toprak Teklifimiz Hükümsüz Kaldı"
 formable_buy.4.d:0 "Elçilerimiz teklifi hiç sunamadı. Şartlar sahibine iletilmeden sahadaki durum değişti ve ayrılan fonlar hazineye iade edildi."
 formable_buy.4.a:0 "Boşa giden bir çaba."
 formable_buy.5.t:0 "[?formable_offer_holder_id.GetNameDef] Kapıyı Kapattı"
 formable_buy.5.d:0 "[?formable_offer_holder_id.GetNameDef], [?formable_offer_state_id.GetName] eyaleti için teklifimizi reddetti ve başka bir yaklaşımı dinlemeyeceğini açıkça belirtti. Fonlar hazinemize iade edildi."
 formable_buy.5.a:0 "O halde başka yerlere bakarız."
