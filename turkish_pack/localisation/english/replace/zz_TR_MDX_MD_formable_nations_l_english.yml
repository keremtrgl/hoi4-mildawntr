 form_ANTCONF_category:0 "Antiller Konfederasyonu"
 form_ANTCONF_category_desc:0 "Antil Konfederasyonu, [CUB.GetNameWithFlag], [DOM.GetNameWithFlag] ve [HAI.GetNameWithFlag] ülkelerinin birleşmesiyle Karayipler'de önerilen bir devlettir. Başlangıçta, Porto Rikolu bağımsızlık aktivisti Ramón Emeterio Betances'in, İspanyolca konuşan tüm Karayip uluslarını tek bir birleşik varlıkta toplama fikri olarak ortaya çıktı. Özgün fikre [HAI.GetNameWithFlag] dâhil değildi; ancak fikrin savunucuları tarafından kısa sürede dâhil edildi. [CUB.GetNameWithFlag] ve [PTR.GetNameWithFlag] sömürgeleri Amerika Birleşik Devletleri'ne devredildiği için fikir İspanyol-Amerikan Savaşı yüzünden büyük ölçüde ortadan kalktı. Bu fikir, başkenti büyük olasılıkla Santo Domingo ve resmî dili İspanyolca olan bir ulus ortaya çıkaracaktır."
 ANTCONF_integrate_start:0 "[GetANTCONFNameDef] oluşturmaya başla"
 ANTCONF_integrate_start_desc:0 "Antil Konfederasyonu'nu kurma zamanı. Karayipler halkı için daha parlak bir gelecek sağlamak üzere halkımız artık birleşmeli.\n\n"
 ANTCONF_integrate_CUB:0 "[GetANTCONFNameAdj] [CUB.GetAdjective] Topraklarını Entegre Et"
 ANTCONF_integrate_CUB_desc:0 "Küba, konfederasyondaki üç büyük ulusun en büyüğüdür. Bunu entegre etmek ekonominin büyüklüğünü artıracak, nüfusu ve yüzölçümünü neredeyse ikiye katlayacaktır."
 ANTCONF_integrate_DOM:0 "[GetANTCONFNameAdj] [DOM.GetAdjective] Topraklarını Entegre Et"
 ANTCONF_integrate_DOM_desc:0 "Dominik Cumhuriyeti, Konfederasyondaki üç büyük ulustan biridir. Hispaniola adasını Haiti ile paylaşır ve çok sayıda turist ile sanayiye sahiptir. Adanın kuzey yakasında ayrıca hafif madencilik faaliyetleri yürütülür ve Cumhuriyet'in yerel kullanımı için çelik üretilir. Entegrasyonu yeni Konfederasyon için paha biçilmez olacaktır."
 ANTCONF_integrate_HAI:0 "[GetANTCONFNameAdj] [HAI.GetAdjective] Topraklarını Entegre Et"
 ANTCONF_integrate_HAI_desc:0 "Haiti, Konfederasyondaki üç büyük ulusun en küçüğüdür. Eski bir Fransız sömürgesi olduğu için Küba ve Dominik Cumhuriyeti'nden büyük ölçüde farklıdır. Ulus grubu arasındaki dil farklılıkları nedeniyle entegrasyon daha uzun sürecek; ancak sanayi tabanı ve Port-au-Prince'in doğal limanı, Karayipler'deki ekonomik ve askeri harekât için paha biçilmez olacaktır."
 ANTCONF_integrate_PTR:0 "[GetANTCONFNameAdj] [PTR.GetAdjective] Topraklarını Entegre Et"
 ANTCONF_integrate_PTR_desc:0 "Porto Riko uzun zamandır Amerika Birleşik Devletleri'nin bir toprağıdır. Amerika Birleşik Devletleri'nin korumasından yararlanır, ancak onun ayrılmaz mülklerinden biri değildir. Nüfusu yaklaşık dört milyondur ve Karayipler'in en büyük adalarından biridir. Antil Konfederasyonu için olası entegre devletlerin en küçüğüdür. Yine de bölgenin canlı kültürü ve turizmi, daha büyük konfederasyona büyük fayda sağlayacaktır."
 ANTCONF_update_flag:0 "[GetANTCONFNameDef] Oluşumunu Tamamla"
 ANTCONF_update_flag_desc:0 "Tüm bileşen topraklar entegre olduğunda dönüşümümüzü tamamlayıp [GetANTCONFNameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 is_ANTCONF:0 "[GetANTCONFNameDef] oluşturuldu"
 form_CANZUK_category:0 "CANZUK"
 form_CANZUK_category_desc:0 "CANZUK; Kanada, Avustralya, Yeni Zelanda ve Birleşik Krallık arasındaki bir ulus birliğidir. Bu devletler birliği doğrudan yönetileceği ve gerçek anlamda birleşik bir ülke olacağı için Britanya İmparatorluğu'ndan farklıdır. Ulus, birkaç kıtaya yayılacak ve dünya sahnesinde büyük bir rakip olacaktır. Belki de bu fikri cezbedip ulusları birleştirmeliyiz?"
