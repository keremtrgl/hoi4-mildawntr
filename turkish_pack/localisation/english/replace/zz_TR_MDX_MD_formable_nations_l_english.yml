 form_AVG_category:0 "Anjou İmparatorluğu"
 form_AVG_category_desc:0 "Angevin İmparatorluğu, 12. ve 13. yüzyıllarda Avrupa gücünün zirvesiydi; Plantagenet hanedanı İngiltere'yi, Fransa'nın büyük bölümlerini ve başka toprakları yönetiyordu. İmparatorluk, kıta genelindeki kültürel ve siyasi nüfuzuyla öne çıkıyordu. Angevin İmparatorluğu'nu yeniden canlandırmak, bu tarihî toprakları bir kez daha tek bayrak altında birleştiren muazzam bir başarı olurdu."
