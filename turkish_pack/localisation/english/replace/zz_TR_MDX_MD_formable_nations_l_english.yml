l_english:
 form_BLT_category:0 "Baltık'ı Birleştir"
 form_BLT_category_desc:0 "Baltık Devletleri; Estonya, Letonya ve Litvanya arasındaki devletler birliğidir. Bu üç ulus uzun zamandır Avrupa jeopolitiğinin yırtıcılarına av olmuş ve Avrupa emperyalizminin elinde acı çekmeye devam etmektedir. Yabancı hamilerin nüfuzu ve baskısıyla mücadele şarttır ve en öncelikli işimizdir. Bu hedefe ulusları birleştirerek ve birlik olarak ulaşabiliriz. Yabancı nüfuzun baskılarına karşı durabilen, dünya sahnesinde bir üye olarak yer edinen ve diğer ulusların istismar edeceği bir engel olmayan bir halklar ulusu."
 BLT_integrate_start:0 "[GetBLTNameDef] oluşturmaya başla"
 BLT_integrate_start_desc:0 "Baltık Devletleri'ni kurma zamanı.\n\n"
 BLT_integrate_LIT:0 "[GetBLTNameAdj] [LIT.GetAdjective] Topraklarını Entegre Et"
 BLT_integrate_LIT_desc:0 "Litvanya, üç Baltık devleti içinde en büyüğüdür. Nüfus, GSYİH, yüzölçümü gibi çoğu ölçütte Letonya ve Estonya'yı geride bırakır. Bu ulusu entegre etmek ülkemizden hatırı sayılır kaynak götürecek, ancak yeni Baltık Devleti'ne yarar sağlayacak."
 BLT_integrate_LAT:0 "[GetBLTNameAdj] [LAT.GetAdjective] Topraklarını Entegre Et"
 BLT_integrate_LAT_desc:0 "Letonya bir diğer Baltık devletidir. Litvanya ile Estonya'yı birbirine bağlar ve çok önemli stratejik bir konuma sahiptir. Bu ulusu entegre etmek ülkemizden hatırı sayılır kaynak götürecek, ancak yeni Baltık Devleti'ne yarar sağlayacak."
 BLT_integrate_EST:0 "[GetBLTNameAdj] [EST.GetAdjective] Topraklarını Entegre Et"
 BLT_integrate_EST_desc:0 "Estonya üç Baltık devletinin en küçüğüdür, ancak üçü arasında en geniş kıyı şeridine sahiptir. Ekonomisi ağırlıklı olarak bu kıyıya bağımlılık ve ormancılık üzerine kuruludur. Estonya halkı, büyük yeni ulusumuza inanılmaz bir katkı olacaktır. Bu ulusu entegre etmek ülkemizden biraz kaynak götürecek. Yine de yeni Baltık Devleti'ne yarar sağlayacak."
 BLT_update_flag:0 "[GetBLTNameDef] Oluşumunu Tamamla"
 BLT_update_flag_desc:0 "Tüm bileşen topraklar entegre olduğunda dönüşümümüzü tamamlayıp [GetBLTNameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 form_FCA_category:0 "Orta Amerika'yı Birleştir"
 form_FCA_category_desc:0 "Orta Amerika Federal Cumhuriyeti 19. yüzyılın başlarında var oldu. Yeni İspanya'nın eski Guatemala Genel Kaptanlığı topraklarından oluşan bir devletler birliğiydi. Kosta Rika, El Salvador, Guatemala, Honduras, Nikaragua ile Meksika ve Belize'nin bazı bölgelerinden oluşuyordu. Federasyonu birleştirmek, çok sayıda ideolojiyi bir araya getiren ulusların sınavı olacak."
