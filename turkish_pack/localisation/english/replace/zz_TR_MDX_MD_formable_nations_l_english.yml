 form_INDOCHI_category:0 "Hindiçini"
 form_INDOCHI_category_desc:0 "Hindiçini, 1954'e kadar var olan, Vietnam, Kamboçya ve Laos'tan oluşan eski bir ulus federasyonudur. Üçü birlikte dünyanın en büyük ekonomilerinden birini oluşturur ve devasa bir nüfusa ev sahipliği yapar. Yoğun ormanların, dalgalı tepelerin, dağların ve muhteşem kıyı şeridinin ülkesidir. Gücü, grubu geleceğe taşıyacak halkında ve iradesindedir."
 INDOCHI_integrate_start:0 "[GetINDOCHINameDef] oluşturmaya başla"
 INDOCHI_integrate_start_desc:0 "Hindiçini'nin kuruluşuna başlama zamanı.\n\n"
 INDOCHI_integrate_VIE:0 "[GetINDOCHINameAdj] [VIE.GetAdjective] Topraklarını Entegre Et"
 INDOCHI_integrate_VIE_desc:0 "Vietnam'ın dağlarında ve kıyısında devasa miktarda doğal kaynak var. Vietnam'ı entegre etmek, ülke üzerindeki hâkimiyetimizi pekiştirmeye başlayacak."
 INDOCHI_integrate_LAO:0 "[GetINDOCHINameAdj] [LAO.GetAdjective] Topraklarını Entegre Et"
 INDOCHI_integrate_LAO_desc:0 "Laos da tıpkı Vietnam gibi devasa miktarda doğal kaynağa sahiptir."
 INDOCHI_integrate_CBD:0 "[GetINDOCHINameAdj] [CBD.GetAdjective] Topraklarını Entegre Et"
 INDOCHI_integrate_CBD_desc:0 "Kamboçya'nın doğal coğrafyası ve bereketli toprakları ulus için önemlidir. Onu ulusa entegre etmek de ulusu istikrarlı biçimde iyileştirecektir."
 INDOCHI_update_flag:0 "[GetINDOCHINameDef] Oluşumunu Tamamla"
 INDOCHI_update_flag_desc:0 "Tüm bileşen topraklar entegre olduğunda dönüşümümüzü tamamlayıp [GetINDOCHINameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 is_INDOCHI:0 "[GetINDOCHINameDef] oluşturuldu"
 form_ANDES_category:0 "And Federasyonu"
 form_ANDES_category_desc:0 "And Federasyonu, [COL.GetNameWithFlag], [PRU.GetNameWithFlag] ve [BOL.GetNameWithFlag] ülkeleri arasında önerilen bir devletler birliğidir. Gevşek biçimde, ülkeler arasında bir serbest ticaret/ekonomik birlik olan And Topluluğu'na dayanır. Önerilen yeni ulusun toplam nüfusu yüz on üç milyonu aşacak ve yüzölçümü dört milyon yedi yüz bin kilometrekare olacaktır. Boyut olarak Meksika'ya benzer, GSYİH'sı dörtte üç trilyon dolar olan bir ulus olacaktır."
