 form_IBR_category:0 "İber Birliği"
 form_IBR_category_desc:0 "İber Birliği, İber Yarımadası'nda İspanya ile Portekiz arasında önerilen küçük bir siyasi birliktir. İki ülke yakın tarihin çoğunda iç içe geçmiştir ve ortak İber kimliklerini paylaşmaya devam etmektedir. İki devleti birleştirmek dünya düzenini esaslı biçimde değiştirmez; ancak iki devletin birleşmesi, Akdeniz'in ağzında daha önce var olmayan bir ekonomik ve siyasi varlık sağlayacaktır."
