 form_MAPHI_category:0 "Maphilindo"
 form_MAPHI_category_desc:0 "1960'larda Malay Takımadaları'ndaki üç Güneydoğu Asya ülkesinin önerilen, siyasi olmayan bir konfederasyonu. Endonezya ile Malaya Federasyonu arasındaki anlaşmazlıklar yüzünden bu hayal asla gerçekleşmedi. Üç ulusun birleşmesi, dünyanın bazı büyük ülkeleriyle rekabet edebilecek bir ulus yaratacaktı."
 MAPHI_integrate_start:0 "[GetMAPHINameDef] oluşturmaya başla"
 MAPHI_integrate_start_desc:0 "Maphilindo'nun birleşmesi, ulusumuzun halkları için yeni bir çağın başlangıcıdır. Birleşme ve ortak halklarımız için yeni bir gelecek yaratma zamanı.\n\n"
 MAPHI_integrate_IND:0 "[GetMAPHINameAdj] [IND.GetAdjective] Topraklarını Entegre Et"
 MAPHI_integrate_IND_desc:0 "Endonezya, önerilen ulus için kaynak bakımından zengin temel bir bölgedir. Getireceği kaynaklar ve nüfus nedeniyle Endonezya'yı entegre etmek şarttır."
 MAPHI_integrate_PHI:0 "[GetMAPHINameAdj] [PHI.GetAdjective] Topraklarını Entegre Et"
 MAPHI_integrate_PHI_desc:0 "Filipinler, Pasifik'te önemli bir deniz ve ticaret merkezidir. Bu ulusu entegre etmek, Pasifik'te hâkimiyet kurmaya başlama şansımızı çok daha artıracaktır."
 MAPHI_integrate_SIN:0 "[GetMAPHINameAdj] [SIN.GetAdjective] Topraklarını Entegre Et"
 MAPHI_integrate_SIN_desc:0 "Singapur, yeni ulus için kritik bir merkezdir. Büyük bir ticaret limanı ve finans merkezi olarak konumu, onu yeni ulusun başarısı için kritik kılar."
 MAPHI_integrate_MAY:0 "[GetMAPHINameAdj] [MAY.GetAdjective] Topraklarını Entegre Et"
 MAPHI_integrate_MAY_desc:0 "Malezya siyaseten ulusun temel bölümlerinden biridir. Yarımadanın sahibi olarak Asya içindeki kara yollarına erişmemizi sağlar."
 MAPHI_integrate_BRU:0 "[GetMAPHINameAdj] [BRU.GetAdjective] Topraklarını Entegre Et"
 MAPHI_integrate_BRU_desc:0 "Brunei bu düzenlemede küçük bir ülkedir. Küçük bir devlet olmasına rağmen entegre edilmesi şart olan bir ülkedir."
