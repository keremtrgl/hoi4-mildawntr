 form_NORDEM_category:0 "Kuzey Denizi İmparatorluğu"
 form_NORDEM_category_desc:0 "Kuzey Denizi İmparatorluğu, 11. yüzyılın başlarında İngiltere, Danimarka ve Norveç devletlerinin siyasi birliğiydi. İmparatorluk Viking Çağı'nın sonuna yakındı ve inanılmaz kısa ömürlüydü. İmparatorluğu bir kez daha birleştirmek günümüzde bir başarı olacak ve yeni Viking çağının dönüşüne işaret edebilecektir."
