 form_RDLP_category:0 "Río de la Plata"
 form_RDLP_category_desc:0 "Río de la Plata Birleşik Eyaletleri, günümüzün Arjantin, Uruguay, Paraguay ve Bolivya ülkelerindeki devletlerin birliğiydi. Ulusun çağdaş fikri, Güney Amerika'nın çoğunu tek bir ulusal sancak altında birleştiren gruba Şili'yi de dâhil eder. Yeni ulus büyüklük, nüfus ve ekonomik güçte Brezilya ile boy ölçüşür. Belki de ulus grubumuzun yeni geleceği budur."
