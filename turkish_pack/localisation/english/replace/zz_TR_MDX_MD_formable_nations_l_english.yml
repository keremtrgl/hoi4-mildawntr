 form_MAGHREB_category:0 "Arap Mağrib Birliği"
 form_MAGHREB_category_desc:0 "Arap Mağrib Birliği; Cezayir, Libya, Moritanya, Fas ve Tunus'tan oluşan siyasi bir devletler birliğidir. Ağırlıklı olarak ulus devletler arasında siyasi birliği ve ekonomik bütünleşmeyi sağlamaya hizmet etti. Son yıllarda birliğin faaliyetleri azalıyor gibi görünse de bu fikri yeniden canlandırma zamanı gelmiş olabilir. Mağrib halklarını birleştirmek, Afrika kıtasına ve Akdeniz kıyılarına hâkim olabilecek yeni bir ulus yarattı. Mağrib'i birleştirip dünyanın büyük uluslarından biri olma zamanı."
