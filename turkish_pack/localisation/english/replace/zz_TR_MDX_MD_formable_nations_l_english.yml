 form_HBL_category:0 "Benelüks"
 form_HBL_category_desc:0 "Benelüks, Hollanda, Belçika ve Lüksemburg ulusları tarafından oluşturulan siyasi-ekonomik bir birliktir. Tarihsel olarak üç üye ülke birbirleriyle dostane ve samimi ilişkilere sahiptir. Mevcut örgüt, küresel sahnede siyasi ve ekonomik konularda salt bir devletler birliğidir. Bu devletler birliğini daha somut bir şeye dönüştürme olasılığına dair kısık sesli konuşmalar var. Alçak Ülkeler halklarını temsil edecek yeni bir ulus, halkına yeni bir gelecek getirecek ve onu bu parlak geleceğe yöneltecek."
 HBL_integrate_start:0 "[GetHBLNameDef] oluşturmaya başla"
 HBL_integrate_start_desc:0 "Benelüks'ü kurmaya başlama zamanı.\n\n"
 HBL_integrate_BEL:0 "[GetHBLNameAdj] [BEL.GetAdjective] Topraklarını Entegre Et"
 HBL_integrate_BEL_desc:0 "Belçika, Benelüks ülkelerinin ne en büyüğü ne de en küçüğüdür. Diğer iki üye devlet arasındaki konumuna benzer şekilde, merkezde rahatça oturur. Brüksel şehrinde birkaç Avrupa Birliği bürokrasi merkezine ev sahipliği yapar ve Hollandalı, Fransız ve AB dışı turistler için gözde bir turizm merkezidir."
 HBL_integrate_HOL:0 "[GetHBLNameAdj] [HOL.GetAdjective] Topraklarını Entegre Et"
 HBL_integrate_HOL_desc:0 "Hollanda, Benelüks'ün üç üye ülkesinin en büyüğüdür. Nüfusun, yüzölçümünün ve ekonomik büyüklüğün çoğunluğunu oluşturur ve birkaç denizaşırı mülke ev sahipliği yapar. Hollanda'yı entegre etmek Benelüks'ün büyük bölümünü yeni devlete katar ve yeni birliğimizin meşruiyetini önemli ölçüde güçlendirir."
 HBL_integrate_LUX:0 "[GetHBLNameAdj] [LUX.GetAdjective] Topraklarını Entegre Et"
 HBL_integrate_LUX_desc:0 "Lüksemburg üç ülkenin en küçüğüdür. En yüksek kişi başı GSYİH'ya sahiptir ve birkaç küçük turizm merkezi vardır. Ülke, en kayda değer olanları Fransızca, Almanca ve İngilizce olan karma bir dil konuşur. Lüksemburg'u entegre etmek, devletin büyüklüğü göz önüne alındığında büyük bir girişim değildir, ancak bazı bürokratik zorluklar çıkaracaktır."
 HBL_update_flag:0 "[GetHBLNameDef] Oluşumunu Tamamla"
 HBL_update_flag_desc:0 "Tüm bileşen topraklar entegre olduğunda dönüşümümüzü tamamlayıp [GetHBLNameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 is_HBL:0 "[GetHBLNameDef] oluşturuldu"
 form_USNA_category:0 "Kuzey Amerika'yı Birleştir"
 form_USNA_category_desc:0 "Kuzey Amerika kıtası, Meksika, Amerika Birleşik Devletleri ve Kanada ulus devlet olarak kurulduğundan beri tarihsel olarak yabancı nüfuzu geri püskürttü. Yeni binyılın başında toplam on bir trilyonluk GSYİH ile dünya ekonomisinin belkemiğini oluşturuyorlar. Ulusları birleştirmek ve gözümüzü daha büyük bir yarına dikmek bizi geleceğe taşıyacak."
 USNA_integrate_start:0 "[GetUSNANameDef] oluşturmaya başla"
 USNA_integrate_start_desc:0 "Kuzey Amerika Federasyonu'nu kurmaya başlama zamanı.\n\n"
 USNA_integrate_CAN:0 "[GetUSNANameAdj] [CAN.GetAdjective] Topraklarını Entegre Et"
 USNA_integrate_CAN_desc:0 "Kanada, yeni birlik içinde yüzölçümü bakımından en büyük ulustur ve çok sayıda kullanılmamış petrol rezervine sahiptir. Yalnızca bu iki olgu Kanada'yı yeni Kuzey Amerika Birliği yapbozunun ayrılmaz bir parçası yapar. Umarız, yeni ulusa daha fazla entegre oldukça özür dileme alışkanlıkları en aza iner."
 USNA_integrate_USA:0 "[GetUSNANameAdj] [USA.GetAdjective] Topraklarını Entegre Et"
 USNA_integrate_USA_desc:0 "Amerika Birleşik Devletleri, Kuzey Amerika Devletleri Birliği'nin büyük bölümünü oluşturur. En büyük ekonomiye, ikinci en büyük yüzölçümüne, orduya ve daha fazlasına sahiptir. Amerika Birleşik Devletleri'ni entegre etmek, küresel sahnedeki büyüklüğü ve ağırlığı nedeniyle çok sayıda zorluk getirir; ancak bu entegrasyon bizi ekonomik olarak dünyanın en büyük süper gücü yapacaktır."
 USNA_integrate_MEX:0 "[GetUSNANameAdj] [MEX.GetAdjective] Topraklarını Entegre Et"
 USNA_integrate_MEX_desc:0 "Meksika, yeni devleti oluşturan üç ulus arasında en kalabalık ikinci ulustur. Büyük bir orduyu devreye sokar. Ülkenin kartellerin yoğunluğu gibi çeşitli sorunları var. Yine de Meksika'yı entegre etmek yeni ulusun başlıca odak noktalarından biri olacaktır."
 USNA_update_flag:0 "[GetUSNANameDef] Oluşumunu Tamamla"
 USNA_update_flag_desc:0 "Tüm bileşen topraklar entegre olduğunda dönüşümümüzü tamamlayıp [GetUSNANameDef] ilan edebilir, birleşik bayrağını ve adını benimseyebiliriz."
 is_USNA:0 "[GetUSNANameDef] oluşturuldu"
 form_UTS_category:0 "Türk Topraklarını Birleştir"
 form_UTS_category_desc:0 "Birleşik Türk Toprakları; Özbekistan, Kırgızistan, Kazakistan ve Türkmenistan dâhil, Türkçe konuşan ulusların bir birliğidir. Rusya'daki Tatarlar ve Çin'deki Uygurlar gibi ülkelerin dışındaki diğer Türkçe konuşan halk grupları da var. Onlar birliğimiz için bir hedeftir ancak ilk hedef değildir. Hâlihazırda var olan ulus devletleri birleştirecek ve halkımızı eve dönmeye teşvik edecek ya da onları yeniden saflarımıza katacağız."
