 form_ANZ_category:0 "Avustralasya"
 form_ANZ_category_desc:0 "Avustralasya; Avustralya, Yeni Zelanda ve Pasifik Okyanusu'ndaki bazı küçük komşu adaları içeren daha büyük bir bölgedir. Yeni Zelanda ile Avustralya arasındaki devletler birliği, Pasifik Okyanusu'nda yeni bir güç yaratır ve bölgedeki nüfuz konusunda Endonezya ve Japonya ile rekabet eder."
