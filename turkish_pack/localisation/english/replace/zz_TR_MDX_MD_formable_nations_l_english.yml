 form_SOU_category:0 "Güney Amerika Ulusları Birliği"
 form_SOU_category_desc:0 "Güney Amerika Ulusları Birliği, tüm Güney Amerika ülkelerinin tek bir süper devlette birleşmesidir. Güney Amerika'nın ekonomik, siyasi ve kültürel kimliği, İspanyol ve Portekiz etkisinin ve ülkelere karışmış yerli halkların harmanlanmasına özgüdür. Geniş bir sanayi üssü, mali sektör, hammadde ve tarım ürünü yelpazesine sahiptir. Güney Amerika ulus devletlerini birleştirirsek, nihayet Amerika Birleşik Devletleri'nin ve diğer büyük güçlerin Batı Yarımküre'deki ve dışındaki nüfuzuyla boy ölçüşebiliriz."
