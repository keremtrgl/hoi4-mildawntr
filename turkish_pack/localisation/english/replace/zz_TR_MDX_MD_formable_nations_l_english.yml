 form_SCA_category:0 "Kuzey Halklarını Birleştir"
 form_SCA_category_desc:0 "Kuzey halkları daha önce birçok devleti paylaştı: İsveç İmparatorluğu, Kalmar Birliği ve diğerleri. Böylesine canlı ve zengin tarihlere, kendine özgü kültürlere ve dillere sahip bu halklar topluluğunu birleştirmek, bu başarıyı tamamlamaya cesaret edenlere zorlu bir sınav olacaktır."
 SCA_integrate_start:0 "[GetSCANameDef] oluşturmaya başla"
 SCA_integrate_start_desc:0 "İskandinav İmparatorluğu'nu kurma zamanı. Daha büyük bir yarın inşa ederken kardeşlerimiz gerçekten tek bir sancak altında birleşecek.\n\n"
