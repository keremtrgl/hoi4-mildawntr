 form_GCL_category:0 "İkinci Büyük Kolombiya"
 form_GCL_category_desc:0 "Büyük Kolombiya, günümüzün Ekvador, Kolombiya, Panama ve Venezuela ulus devletlerini kapsayan, artık var olmayan bir devletti. Bolivarcı devlet, Güney Amerika gücünün simgelerinden biridir ve bu yüzden büyük ulusumuz için değerli bir hedeftir. Kardeş ülkelerimizdeki hemcinslerimizi birleştirmek, büyük ulusumuzda yabancı nüfuzu güçlendirmek yerine onu ortadan kaldıracaktır. İkinci Büyük Kolombiya'yı ilan edecek ve büyük ulusumuza birlik getireceğiz!"
