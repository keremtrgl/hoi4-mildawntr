 form_WESTFED_category:0 "Batı Hint Adaları Federasyonu"
 form_WESTFED_category_desc:0 "Batı Hint Adaları Federasyonu, 1958'den 1962'ye kadar süren, birçok Karayip ada ulusunu kapsayan kısa ömürlü bir siyasi birlikti. Birlik, nasıl yönetileceği veya uygulanabilir biçimde nasıl işleyeceği konusundaki anlaşmazlıklar yüzünden kısa sürede dağıldı. Fikir hâlâ ülkeler arasında bir değer taşıyor ve Batı Yarımküre'nin bir sonraki büyük ulusu olması işten bile değil. Karayipler'i bu yeni yarına biz mi taşıyacağız?"
