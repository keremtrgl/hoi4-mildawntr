 suppress_regional_fascism_goal_name:0 "Faşizmi Bastır"
 suppress_regional_fascism_goal_desc:0 "Faşizm bir orman yangını gibi yayılma tehdidi taşıyor. Pençelerine düşen ülke sayısı arttıkça çevremizdeki durum daha da tehlikeli hale gelecek."
 suppress_regional_communism_goal_name:0 "[ROOT.GetCountryContinent] Kıtasında Komünizmi Bastır"
 suppress_regional_communism_goal_desc:0 "[ROOT.GetCountryContinent] kıtasının mümkün olduğunca büyük bölümünü komünist boyunduruktan özgür tutmak için ne gerekiyorsa yapmalıyız."
 regional_expansionism_goal_name:0 "[ROOT.GetCountryContinent] Kıtasında Genişleme"
 regional_expansionism_goal_desc:0 "İttifakımız [ROOT.GetCountryContinent] kıtasında öncülük etmeli ve hâkim olmalı"
 suppress_regional_democracy_goal_name:0 "Demokrasiyi Bastır"
 suppress_regional_democracy_goal_desc:0 "Sözde demokratik ülkeler ideallerimiz için en büyük tehdittir. Onların [ROOT.GetCountryContinent] kıtasının yalnızca küçük bir kısmını denetlemesini sağlamalıyız."
 between_the_seas_goal_name:0 "Denizler Arasında"
 between_the_seas_goal_desc:0 "Karadeniz'den Baltık'a uzanan müttefik topraklardan sağlam bir duvar örerek her olası tehdide dayanabiliriz."
 little_entente_goal_name:0 "Paris Barış Antlaşmalarını Uygulat"
 little_entente_goal_desc:0 "Paris Barış Antlaşmaları [GER.GetName], [HUN.GetName], [BUL.GetName] ve [AUS.GetName] sınırlarını belirledi. Asıl amacımız, bu ülkelerin sınır bölgelerini ilhak etmeye başlayıp Avrupa'da barışı yeniden bozmamasını sağlamaktır."
 china_territorial_integrity_goal_name:0 "Toprak Bütünlüğü"
 china_territorial_integrity_goal_desc:0 "Çin kurtarılmalı ve tek bir iktidar partisi altında birleştirilmelidir. Ancak topraklarımızın denetimini dış ve iç düşmanlardan geri alarak Çin'i eski ihtişamına kavuşturabiliriz."
 china_chinese_consolidation_goal_name:0 "Çin'in Pekiştirilmesi"
 china_wang_front_expansion_name:0 "Emperyalizme Karşı Zafer"
 china_wang_front_expansion_desc:0 "Sömürgeci güçlerin Doğu Asya üzerindeki nüfuzuna karşı koymanın zamanı geldi. Bir daha asla egemenlik altına alınmamak için bölgede kendi güç bloğumuzu kurmalıyız."
 strength_in_unity_goal_name:0 "Birlikte Güç"
 strength_in_unity_goal_desc:0 "Dünyanın bizim köşemizdeki ülkeler birlikte durmalıdır. Güçlü bir ittifak kurarak bağımsız ve tarafsız kalmak için mümkün olan en iyi şansa sahip oluruz."
 conquest_of_territory_goal_name:0 "Fetih ve Hâkimiyet"
 conquest_of_territory_goal_desc:0 "Düşmanca bir dünyada genişleme hayatta kalmak için hayati önemdedir. Genişleme tampon bölgeler yaratır ve bize daha fazla kaynağa erişim sağlar."
 spread_of_communism_goal_name:0 "Dünya Devrimi"
 spread_of_communism_goal_desc:0 "Kitlelerin ayağa kalkma zamanı geldi. Kitlelerin ayağa kalkamadığı yerde onlara silah gücüyle yardım etmeliyiz."
 control_of_the_balkans_goal_name:0 "Balkan Güvenliği"
 control_of_the_balkans_goal_desc:0 "Dış güçler nüfuzlarını her zaman Balkanlar'a yaymaya çalıştı. Birlikte güçlü durmamızı ve bölgeye yönelik her yabancı müdahaleye karşı koymamızı sağlamalıyız."
 african_decolonization_goal_name:0 "Afrika'nın Sömürgelikten Kurtuluşu"
 african_decolonization_goal_desc:0 "Afrika'nın düşmanlarına ve zalimlerine karşı ayağa kalkma zamanı geldi. Kıtayı gerekirse güç kullanarak özgürleştirmeliyiz!"
 habsburg_hegemony_goal_name:0 "Habsburg Hegemonyası"
 habsburg_hegemony_goal_desc:0 "Aile her birliğin en önemli parçasıdır ve ittifakımız da farklı değil. Avrupa'nın taçlarını güvence altına almalı ve nüfuzumuzu her yere yaymalıyız."
 indifference_is_a_threat_goal_name:0 "Kayıtsızlık Bir Tehdittir"
 indifference_is_a_threat_goal_desc:0 "Avrupa'da büyük bir çatışma neredeyse kaçınılmazken sürprizlerle karşılaşmamalıyız. Taraf tutmayı reddeden her ülke ortadan kaldırılmalıdır."
 security_through_expansion_goal_name:0 "Genişleme Yoluyla Güvenlik"
 security_through_expansion_goal_desc:0 "Topraklarımızın etrafında bir kalkan oluşturmalı ve mevcut sınırlarımızın çevresinde bir devletler halkası kurmalıyız."
 an_iron_curtain_goal_name:0 "Demir Perde"
 an_iron_curtain_goal_name_desc:0 "Ana vatanı daha iyi korumak için istenmeyen ziyaretçileri dışarıda tutacak, çevremizde bir kukla devletler perdesi oluşturmalıyız."
 eastern_european_security_goal_name:0 "Doğu Avrupa Güvenliği"
 eastern_european_security_goal_desc:0 "Doğu Avrupa'daki çıkarlarımızı daha iyi korumak için müdahale edip batımızda aynı görüşteki rejimleri kurmalıyız."
 mare_nostrum_goal_name:0 "Mare Nostrum"
 mare_nostrum_goal_desc:0 "Akdeniz'i kendi iç denizimize dönüştürmek halkımızın her zaman hayaliydi. Bu hayali gerçeğe dönüştürmenin zamanı geldi!"
 pax_romana_goal_name:0 "Pax Romana"
 pax_romana_goal_desc:0 "Roma İmparatorluğu'nun ihtişamını yeniden kurmak halkımızın her zaman hayaliydi. Bu hayali gerçeğe dönüştürmenin zamanı geldi!"
 building_up_guam_goal_name:0 "Guam Deniz Üssünü Genişlet"
 building_up_guam_goal_desc:0 "[JAP.GetName] ile bir çatışma olması durumunda [PHI.GetNameDef] ile bağlantıyı güvence altına almamız gerekiyor. Ayrıca [JAP.GetAdjective] güçlerle savaşa girmemiz halinde donanmalarımız için daha yakın bir hareket noktasına sahip olmak çok avantajlı olurdu. [638.GetName] bu işe mükemmel uyuyor."
 the_two_seas_goal_name:0 "Baltık ve Karadeniz'de Varlık Oluştur"
 the_two_seas_goal_desc:0 "Baltık Denizi'nde olduğu kadar Karadeniz'de de güçlü bir deniz varlığımız olmasını sağlamalıyız."
 one_germany_goal_name:0 "Alman Devletlerini Birleştir"
 one_germany_goal_desc:0 "Güçlü ve birleşik bir güç tabanı kurmak için önce Almanya'nın güçlü ve birleşik olmasını sağlamalıyız. Paris Barış Antlaşmaları Almanya'nın yeniden birleşmesini yasaklamıştı. Şimdi işe yaramaz antlaşmalarla bağlı olmadığımızı kanıtlamanın zamanı."
 guardians_of_peace_goal_name:0 "Küresel Barışı Koru"
 guardians_of_peace_goal_desc:0 "Ufukta fırtına bulutları toplanıyor. İttifakımızın kaçınılmaz çatışmaya düzgünce hazırlanabilmesi için savaşın çok erken patlak vermesine karşı tetikte olmalıyız."
 growing_the_faction:0 "İttifakı Genişlet"
 growing_the_faction_desc:0 "İttifakımızın jeopolitik sahnede ciddiye alınması için daha fazla üyeye sahip olması gerekir."
 a_large_faction_goal_name:0 "İttifakımıza Daha Fazla Ülke Davet Et"
 a_large_faction_goal_desc:0 "Daha da büyüyerek ittifakımız nüfuzunu çok daha uzağa yansıtabilecektir."
 preemptive_strike_on_fascism_goal_name:0 "Faşist Bir Ülkeye Önleyici Saldırı Başlat"
 preemptive_strike_on_fascism_goal_desc:0 "Onların bize vurmasını beklememeliyiz. İnisiyatifin bizde olmasını sağlamalıyız."
 a_great_fortress_goal_name:0 "Daha Güçlü Tahkimatlar İnşa Et"
 a_great_fortress_goal_desc:0 "Hazırlıklı olmak anahtardır. Sınır bölgelerini ve kilit noktaları en modern tahkimatlarla güvence altına alarak düşmanın bizi yenememesini sağlayabiliriz."
 aggressive_defense_goal_name:0 "Saldırganlara Zarar Ver"
 aggressive_defense_goal_desc:0 "Düşmana bir karış toprak vermeyeceğiz. Askerlerimize, önemli olanın ülkemiz için ölmek değil, düşmanı kendi ülkesi için öldürmek olduğu bilinci aşılanmalıdır."
 war_on_communism_goal_name:0 "Yükselene Savaş İlan Et"
 war_on_communism_goal_desc:0 "Yükselenin yayılmasını her ne pahasına olursa olsun durdurmalıyız."
 war_on_democracy_goal_name:0 "Demokrasiye Savaş İlan Et"
 war_on_democracy_goal_desc:0 "İdeolojik düşmanlarımıza karşı harekete geçmeliyiz."
 defeat_of_communism_goal_name:0 "Yükseleni Yen"
 defeat_of_communism_goal_desc:0 "Dünyadaki yükselişi yenmek için evimizden, yani dünyanın bizim kısmında yükselişi kökünden kazıyarak başlamalıyız."
 faction_goal_communist_states_available_tt:0 "Bir §YYükselen§! ülke kıtamızda en az bir eyaleti denetliyor"
 defeat_of_fascism_goal_name:0 "Faşizmi Yen"
 defeat_of_fascism_goal_desc:0 "Faşizmin yayılmasını bir kez ve herkes için durdurmak adına evimizden, yani dünyanın bizim kısmında faşizmi kökünden kazıyarak başlamalıyız."
 faction_goal_fascist_states_available_tt:0 "Bir §YSelefi§! ülke kıtamızda en az bir eyaleti denetliyor"
 defeat_of_anti_communists_goal_name:0 "Karşı Devrimcileri Yen"
 defeat_of_anti_communists_goal_desc:0 "Dünya devrimine giden ilk adım buna karşı çıkan bölgesel güçlerin başarıyla dönüştürülmesidir. Bu nedenle her şeyden önce kendi kıtamızdaki tehditleri ortadan kaldırmalıyız."
 faction_goal_anti_communist_states_available_tt:0 "Bir §YBatı Yanlısı§! veya §YSelefi§! ülke kıtamızda en az bir eyaleti denetliyor"
 defeat_of_anti_fascists_goal_name:0 "Faşizmi Kıtada Yay"
 defeat_of_anti_fascists_goal_desc:0 "Kıtamızdaki faşizm karşıtı hükümetleri yok etmeyi hedeflemeliyiz."
 defeating_our_enemies_goal_name:0 "Savaşı Kazan"
 defeating_our_enemies_goal_desc:0 "Zamanlar belirsiz ve savaş kaçınılmaz. O savaş nasıl gelirse gelsin, kazanan tarafta yer almamızı sağlamalıyız."
 is_victor_in_pc_tt:0 "Bir barış konferansında kazanan tarafta"
 a_military_base_goal_name:0 "Askeri Sanayiyi Genişlet"
 a_military_base_goal_desc:0 "Yükselene karşı haçlı seferi silah gerektirir. Silahları büyük miktarlarda üretmek için güçlü bir askeri sanayiye ihtiyacımız var."
 a_military_base_tech_bonus:0 "$a_military_base_goal_name$ Hedef Bonusu"
 resource_control_goal_name:0 "Stratejik Kaynakları Güvence Altına Al"
 resource_control_goal_desc:0 "İttifak, dünyadaki her tehdide karşı koymak için ihtiyaç duyduğu kaynaklara sahip olmasını sağlamalıdır"
 secure_european_continent_goal_name:0 "Avrupa Kalesi Kur"
 secure_european_continent_goal_desc:0 "Avrupa kıtasının davamızla hizalanmasını sağlamalıyız. [faction.GetName] Avrupa'da hâkim olmalıdır."
 secure_north_africa_goal_name:0 "Kuzey Afrika'yı Güvence Altına Al"
 secure_north_africa_goal_desc:0 "Yalnızca Avrupa'ya hâkim olmaya değil, Kuzey Afrika'da da bir ayak izinden fazlasına sahip olmamızı sağlamaya çalışmalıyız."
 an_armored_fist_goal_name:0 "Zırhlı Kuvvetlerimizi Genişlet"
 an_armored_fist_goal_desc:0 "Yeni zamanlar yeni savaş biçimleri için fırsatlar yaratıyor. Gelecek tanklarda. Bir ittifak olarak muharebe sahasına hâkim olacak kadar tankımızın olmasını sağlamalıyız."
 an_infantry_army_goal_name:0 "Piyade Kuvvetlerimizi Genişlet"
 an_infantry_army_goal_desc:0 "Her ordunun belkemiği piyadesidir. Hem diplomasi arenasında hem sahada iddialarımızı destekleyecek geniş bir piyade ordusuna ihtiyacımız var."
 high_seas_fleet_goal_name:0 "Ana Muharebe Gemisi Filosunu Genişlet"
 high_seas_fleet_goal_desc:0 "Düşmanlarımızın Kuzey Atlantik'i denetlememesini sağlamak operasyonlarımız için hayati önemdedir. Bunu aksatabilirsek hem deniz ablukasının etkilerinden kurtuluruz hem de filolarımız özgürce dolaşabilir."
 high_seas_fleet_tech_bonus:0 "$high_seas_fleet_goal_name$ Hedef Bonusu"
 control_the_chinese_coast_goal_name:0 "Kıyı Şeridinin Denetimini Koru"
 control_the_chinese_coast_goal_desc:0 "Saldırıya uğrarsak denizle bağlantımızı mümkün olduğunca uzun süre korumaya çalışmalıyız. Hayatta kalmamız, deniz ötesindeki ülkelerden mal alabilme yeteneğimize bağlıdır."
 guerilla_expansion_goal_name:0 "Direnişi Örgütle"
 guerilla_expansion_goal_desc:0 "İşgalcilere kendi koşullarında karşı koyamayabiliriz, bu nedenle onlara kendi koşullarımızda karşı koyacağız."
 industrial_expansion_goal_name:0 "Sanayi Genişlemesi"
 industrial_expansion_goal_desc:0 "Güçlü bir ittifak yaratmanın en iyi yolu güçlü bir sanayi tabanına sahip olmaktır. Önemli bir güç olmak için gereken sanayi gücüne sahip olduğumuzdan emin olmalıyız."
 industrial_domination_goal_name:0 "Sivil Sanayiyi Genişlet"
 industrial_domination_goal_desc:0 "Modern savaş tamamen üretim kapasitesiyle ilgilidir. Dünyanın gördüğü en büyük sanayi kapasitesine sahip olalım."
 industrial_expansion_tech_bonus:0 "$industrial_expansion_goal_name$ Hedef Bonusu"
 industrial_research_goal_name:0 "$construction4$ Araştırması"
 industrial_research_goal_desc:0 "Baskın bir oyuncu olmak için ittifak genelinde sanayi bilgi birikimine sahip olmamızı sağlamalıyız."
 secure_chinese_waters_goal_name:0 "Çin Sularını Güvence Altına Al"
 secure_chinese_waters_goal_desc:0 "Karada hâkim olabiliriz, ancak uzun bir kıyı şeridiyle kimsenin bizi işgal edememesini sağlamak en yüksek öncelik olmalıdır. Bu güvenlik açık denizden başlar."
 faction_goal_subjugate_the_faction_name:0 "İttifakı Boyun Eğdir"
 faction_goal_subjugate_the_faction_desc:0 "Yabancı işgalcilerin saldırısına direnebilmemizin tek yolu güçlü bir liderlikle birleşik bir cephe sunmaktır. Birçok farklı sesten büyük bir koro yükselecektir."
 faction_goal_north_subjugated_name:0 "Kuzeyi Boyun Eğdir"
 faction_goal_north_subjugated_desc:0 "İttifakımızın bu kısmını entegre etmek için ortak bir çaba göstersek diğer savaş ağaları rüzgârın nereden estiğini anlar ve saf tutardı."
 faction_goal_west_subjugated_name:0 "Batıyı Boyun Eğdir"
 faction_goal_west_subjugated_desc:0 "İttifakımızın bu kısmını entegre etmek için ortak bir çaba göstersek diğer savaş ağaları rüzgârın nereden estiğini anlar ve saf tutardı."
 faction_goal_south_subjugated_name:0 "Güneyi Boyun Eğdir"
 faction_goal_south_subjugated_desc:0 "İttifakımızın bu kısmını entegre etmek için ortak bir çaba göstersek diğer savaş ağaları rüzgârın nereden estiğini anlar ve saf tutardı."
 faction_goal_no_japanese_in_china_name:0 "İstilacıları Kov"
 faction_goal_no_japanese_in_china_desc:0 "Japonlar halkımızı çok uzun süredir eziyor. Artık Çin'de kalmalarına izin verilemez."
 faction_goal_the_northern_mandate_name:0 "Doğu Sibirya'yı Denetle"
 faction_goal_the_northern_mandate_desc:0 "Halkımızın refah içinde olabilmesi için Sibirya'da bulunan topraklara ve kaynaklara ihtiyacımız olacak. Mevcut denetim onları doğru dürüst kullanamıyor, dolayısıyla bunlar üzerinde hakkımız var."
 faction_goal_the_southern_mandate_name:0 "Güneydoğu Asya'yı Denetle"
 faction_goal_the_southern_mandate_desc:0 "Şanlı geçmişte güneyimizdeki bölgelerde nüfuz kurmuştuk ve bunu yeniden yapacağız. Bölgede bulunan servetle yapabileceklerimizin sonu yok."
 faction_goal_the_greater_game_name:0 "Orta Asya'yı Denetle"
 faction_goal_the_greater_game_desc:0 "İmparatorluklar iradelerini Orta Asya'ya dayatmaya çalıştı ve püskürtüldü. Bizim saatimiz geldi; yeniden batıya ve bozkırların ötesine ilerleme zamanı."
 suppress_asian_communism_goal_name:0 "Asya'daki Yükseleni Bastır"
 suppress_asian_communism_goal_desc:0 "Yükselen, geleneksel yaşam biçimleri için, doğal düzen için bir tehdittir. Yükselen çirkin yüzünü nerede gösterirse göstersin onu yenmek için birleşmeliyiz"
 strategic_resource_control_goal_name:0 "Stratejik Kaynak Denetimi"
 strategic_resource_control_goal_desc:0 "Dünyanın stratejik kaynaklarını denetleyen, dünya siyasetini denetler."
 align_china_goal_name:0 "Çin'i Hizaya Getir"
 align_china_goal_desc:0 "Çinli ittifakların ve temsil ettikleri tehdidin denetim altına alınması gerekiyor. Bu soruna en iyi çözüm, onların yerine dost görüşlü bir rejim getirmektir."
 control_the_chinese_capitals_goal_name:0 "Çin Başkentlerini Denetle"
 control_the_chinese_capitals_goal_desc:0 "Çin'in tarihi başkentlerinin denetimini ele geçirirsek planlarımıza karşı direnç kesinlikle azalacaktır."
 war_on_communism_in_asia_goal_name:0 "Asya'daki Yükselene Savaş İlan Et"
 war_on_communism_in_asia_goal_desc:0 "Yükseleni gerçekten yenmenin tek yolu vardır: silah gücü. Nüfuzundan hiçbir zaman güvende olabilmek için tüm Asya'da yükseleni kökünden kazımalıyız."
 coastal_security_goal_name:0 "Kıyıyı Denetle"
 coastal_security_goal_desc:0 "Doğu ve Güneydoğu Asya'nın tüm deniz cephesinde tam denetim sağlamalıyız. Böylece Batılı emperyalist sömürgecilerin bölgemizde ayak basmasını önleyebiliriz."
 secure_the_oil_supply_goal_name:0 "Petrol Tedarikini Güvence Altına Al"
 secure_the_oil_supply_goal_desc:0 "Uzun bir savaş vereceksek bunu sürdürmeye yetecek petrolü her ne pahasına olursa olsun güvence altına almalıyız."
 secure_the_oil_supply_tech_bonus:0 "Petrol Tedarikini Güvence Altına Alma Hedef Bonusu"
 protector_of_peace_goal_name:0 "Barışın Koruyucusu"
 protector_of_peace_goal_desc:0 "Bizim işimiz Avrupa'daki veya başka yerlerdeki savaşlara karışmak değil. Bunun yerine barışı korumaya çalışmalı ve diğer ülkeleri anlaşmazlıklarını barışçıl ve hızlı biçimde çözmeye teşvik etmeliyiz."
 african_domination_goal_name:0 "Afrika Hâkimiyeti"
 african_domination_goal_desc:0 "Nihai amacımız her zaman Afrika'da yabancı nüfuzun olmamasını sağlamak olmalıdır. Bizimle olmayan bize karşıdır ve boyun eğdirilmelidir."
 contain_japanese_expansion_asia_goal_name:0 "Japon Yayılmasını Durdur"
 contain_japanese_expansion_asia_goal_desc:0 "[JAP.GetName] ülkesinin toprak genişlemesini durdurmak için elimizden geleni yapmalıyız"
 pan_americanism_goal_name:0 "Pan-Amerikancılık"
 pan_americanism_goal_desc:0 "Tüm Amerika kıtaları birleşmelidir. Herkesi gemiye alarak dünyanın bizim kısmını güvence altına alabilir ve dış güçlere karşı tek bir birleşik cephe yaratabiliriz."
 amerindian_liberation_goal_name:0 "Yerli Amerikalıların Kurtuluşu"
 amerindian_liberation_goal_desc:0 "Amerika'nın asıl halkları, şu anda onlara hükmeden yabancı zalimlerden kurtarılmalıdır."
 islamic_brotherhood_goal_name:0 "İslami Kardeşlik"
 islamic_brotherhood_goal_desc:0 "Dünyanın İslam ülkeleri, bizi fethedilmiş ve boyun eğdirilmiş görmek isteyenlere karşı durmak için birleşmelidir."
 baltic_security_goal_name:0 "Baltık'ı Koru"
 baltic_security_goal_desc:0 "Vatandaşlarımızın ve sivillerimizin geleceğini güvence altına almak için Baltık bölgesini elimizdeki her şeyle korumalıyız. Ancak onu denetimimizde tutarsak halkı refaha kavuşabilir."
 nordic_defence_goal_name:0 "Kuzey Avrupa'yı Savun"
 nordic_defence_goal_desc:0 "Vatandaşlarımızın ve sivillerimizin geleceğini güvence altına almak için Nordik bölgeyi elimizdeki her şeyle korumalıyız. Ancak zorba imparatorlukları dışarıda tutarsak gelişebiliriz."
 european_dominance_goal_name:0 "Avrupa Hâkimiyeti Kur"
 european_dominance_goal_desc:0 "Avrupa'nın çoğunu tek bir bayrak altında birleştirebilirsek en ağır tehditlerle bile yüzleşecek kadar güçlü bir ittifak yaratabiliriz."
 asian_dominance_goal_name:0 "Asya Hâkimiyeti Kur"
 asian_dominance_goal_desc:0 "Asya'nın çoğu denetimimiz altındayken ittifakımız hesaba katılması gereken bir güç olacak."
 middle_east_dominance_goal_name:0 "Orta Doğu'yu Denetle"
 middle_east_dominance_goal_desc:0 "Arap Yarımadası'ndan ve Levant'tan Afgan dağlarına kadar birleşmeli ve tam denetim kurmalıyız. Herkesin birlikte çalıştığından emin olabilirsek bu bölge önemli bir aktör olabilir."
 the_arteries_of_trade_goal_name:0 "Ticaret Damarlarını Koru"
 the_arteries_of_trade_goal_desc:0 "Üye ülkelerimizin hayatta kalmasını sağlamak için başlıca deniz ticaret hatlarının kontrolümüz altına alınması gerekiyor."
 the_atomic_race_goal_name:0 "İlk Atom Bombasını Yap"
 the_atomic_race_goal_desc:0 "Mevcut ya da gelecekteki düşmanlarımızın nükleer silahlara bizden önce ulaşmamasını sağlamalıyız. Ancak ilk olursak başka hiçbir gücün bize karşı duramayacağından emin olabiliriz."
 the_atomic_race_complete_trigger:0 "[ROOT.GetFactionName] ittifakının bir üyesi $sp_nuclear_bomb$ projesini bitiren ilk ülke"
 the_atomic_race_complete_trigger_fail:0 "[ROOT.GetFactionName] ittifakının üyesi olmayan bir ülke $sp_nuclear_bomb$ projesini bitiren ilk ülke"
 rule_the_waves_goal_name:0 "Denizlere Hükmet"
 rule_the_waves_goal_desc:0 "Okyanusa gerçekten hâkim olmak için büyük bir donanma gerekir ve büyük donanmanın temel unsuru Ana Muharebe Gemileridir."
 eliminate_the_twin_threats_goal_name:0 "İkiz Tehdidi Ortadan Kaldır"
 eliminate_the_twin_threats_goal_desc:0 "[SOV.GetNameDef] ve [GER.GetNameDef] hizaya getirilmediği sürece asla güvende olamayız."
 disarm_aggression_central_powers_goal_name:0 "Saldırgan Ülkelerin Gücünü Kır"
 disarm_aggression_central_powers_goal_desc:0 "Demokrasiler başka ülkelere nadiren saldırır. Avrupa'yı gelecek nesiller için güvence altına almak adına bu saldırgan ülkelerin ya demokrasiye dönüştürülmesini ya da tamamen ortadan kaldırılmasını sağlamalıyız."
 rule_the_waves_tech_bonus:0 "Denizlere Hükmet Hedef Bonusu"
 imperial_glory_goal_name:0 "Hayati İmparatorluk Varlıklarını Savun"
 imperial_glory_goal_desc:0 "İmparatorluğumuzun ve müttefiklerimizin başlıca kaleleri dayanmalıdır. Savaş zamanında dünyanın dört bir yanındaki mülklerin denetimini koruyarak dünyaya hâlâ hesaba katılması gereken bir güç olduğumuzu gösterebiliriz."
 production_quotas_goal_name:0 "Üretim Kotalarına Ulaş"
 production_quotas_goal_desc:0 "[ROOT.GetFactionName] ittifakının bütünlüğünü güvence altına almak ve önümüze çıkabilecek her tehdide hazırlıklı olmak için devasa bir silah cephaneliğine sahip olmamız gerekiyor."
 stall_the_fascist_threat_goal_name:0 "Faşist Tehdidi Yavaşlat"
 stall_the_fascist_threat_goal_desc:0 "Dünyada faşizmin yayılmasını yavaşlatmamız gerekiyor. İspanya büyük olasılıkla düşecek, ancak faşizmin yükselen tehdidine karşı kendimizi savunmaya hazır olana dek bunu geciktirmek için üzerimize düşeni yapmalıyız. İspanya'daki bir çatışmada düşman birliklerini bağlayarak onların başka yerlere odaklanmasını zorlaştırır ve kendimize değerli zaman kazandırırız."
 the_red_tide_goal_name:0 "Kızıl Orduları Genişlet"
 the_red_tide_goal_desc:0 "En çok önemli olan sahadaki askerdir. Gereken, on milyonluk bir ordudur. Hayatta kalma gerçekten böyle güvence altına alınır."
 military_infrastructure_goal_name:0 "Askeri Altyapı İnşa Et"
 military_infrastructure_goal_desc:0 "İyi gelişmiş bir altyapı, sınır savunma kuvvetlerimizin ihtiyaç duyduğu ikmal hatlarını sağlamak için kritiktir. İttifakın denetlediği ve ittifak dışı bir ülkeyle sınır komşusu olan her çekirdek eyalet, §YAltyapı§! seviye 4'e kadar geliştirilmelidir. Geçilemez eyaletler muaftır."
 ensure_military_r_d_goal_name:0 "Askeri Ar-Ge Tesisleri İnşa Et"
 ensure_military_r_d_goal_desc:0 "Gelişmiş prototiplerin ve yeni kavramların araştırılmasına ve geliştirilmesine adanmış tesisler inşa ederek askeri teknolojimizin seviyede olmasını sağlamalıyız."
 spy_master_goal_name:0 "Bir Casus Şefi Ata"
 spy_master_goal_desc:0 "Üyelerimizden birini casusluk ve istihbarat toplama sanatında uzmanlaştırmalı, böylece ittifakımızın operasyonlarını denetleyip yönlendirmesine olanak tanımalıyız."
 develop_mexican_oil_goal_name:0 "Meksika Petrolünü Geliştir"
 develop_mexican_oil_goal_desc:0 "Meksika petrol rezervlerinin çıkarımını genişletmek, sanayi ve askeri talepler için yeterli yakıt arzını sağlayacaktır."
 develop_curacao_oil_goal_name:0 "Curaçao Petrolünü Geliştir"
 develop_curacao_oil_goal_desc:0 "Curaçao'daki rafineriler Venezuela petrolünün işlenmesinin ayrılmaz bir parçasıdır. Bunların çıkarımını genişletmek ittifakın rafine petrol ürünlerine erişimini sürdürecektir."
 develop_venezuelan_oil_goal_name:0 "Venezuela Petrolünü Geliştir"
 develop_venezuelan_oil_goal_desc:0 "Venezuela'nın petrol çıkarımı, ittifakımıza askeri faaliyetlerini desteklemek için gereken enerji erişimini sağlamak üzere daha da genişletilebilir."
 develop_guyanan_bauxite_goal_name:0 "Guyana Boksitini Geliştir"
 develop_guyanan_bauxite_goal_desc:0 "Guyana'nın boksit yataklarının daha fazla geliştirilmesi, büyük ölçekli uçak imalatı için gerekli olan ham kaynakları sağlayacaktır."
 develop_suriname_bauxite_goal_name:0 "Surinam Boksitini Geliştir"
 develop_suriname_bauxite_goal_desc:0 "Surinam'ın zengin boksit yataklarının daha fazla geliştirilmesi, ittifakımızın büyüyen uçak sanayisi için gereken ham maddeleri sağlayacaktır."
 develop_lappland_metals_goal_name:0 "Laponya Madenlerini Geliştir"
 develop_lappland_metals_goal_desc:0 "Laponya'nın maden zenginliğinin çıkarımını genişletmek, ittifakın demir ve tungsten arzını güçlendirerek silah imalat sanayimizi sürdürecektir."
 develop_ploiesti_oil_fields_goal_name:0 "Ploiești Petrol Sahalarını Geliştir"
 develop_ploiesti_oil_fields_goal_desc:0 "Avrupa'daki tek petrol sahaları olan Ploiești petrol sahaları, ittifakın süregelen askeri operasyonlar için gereken yakıta sahip olmasını sağlamak üzere uygun biçimde işletilmelidir."
 develop_baku_oil_fields_goal_name:0 "Bakü Petrol Sahalarını Geliştir"
 develop_baku_oil_fields_goal_desc:0 "Bakü petrol bölgesini geliştirmek, askeri operasyonlar için hayati önemde geniş miktarda rafine petrol ürünü sağlayacaktır."
 develop_iraqi_oil_goal_name:0 "Irak Petrolünü Geliştir"
 develop_iraqi_oil_goal_desc:0 "Irak'ın petrol üretim kapasitesini genişletmek, ordumuzun yakıt ihtiyaçlarının karşılanmasında belirleyici olabilir."
 develop_persian_oil_goal_name:0 "İran Petrolünü Geliştir"
 develop_persian_oil_goal_desc:0 "İran'ın petrol sahalarını ve rafineri kapasitesini genişletmek, operasyonel ihtiyaçlar için kesintisiz yakıt akışını sağlayacaktır."
 develop_chinese_metals_goal_name:0 "Çin Madenlerini Geliştir"
 develop_chinese_metals_goal_desc:0 "Çin'in çeşitli kritik metallerdeki zenginliği, ittifakın askeri-sanayi tabanına ihtiyaç duyduğu kaynakları sağlamak için daha kapsamlı biçimde çıkarılabilir."
 develop_malayan_riches_goal_name:0 "Malaya Zenginliklerini Geliştir"
 develop_malayan_riches_goal_desc:0 "Malaya'nın tungsten ve kauçuk kaynaklarının geliştirilmesi, ittifakın malzeme tabanını büyük ölçüde güçlendirecek; imalat ve askeri lojistik için kilit girdileri güvence altına alacaktır."
 develop_indonesian_riches_goal_name:0 "Endonezya Zenginliklerini Geliştir"
 expand_newfoundland_bases_goal_name:0 "Newfoundland Üslerini Genişlet"
 expand_newfoundland_bases_goal_desc:0 "Newfoundland'daki üslerimizi genişletmek, Kuzey Atlantik konvoyları üzerinde daha iyi denetim kurmamıza ve hayati deniz taşımacılığı rotaları boyunca hava ve deniz gücü yansıtmamıza olanak tanıyacaktır."
 expand_bermuda_bases_goal_name:0 "Bermuda Üslerini Genişlet"
 expand_bermuda_bases_goal_desc:0 "Bermuda'daki üslerimizi genişletmek, Atlantik'in ortasında daha etkili devriye gezmemizi ve kıtalar arasında daha güvenli ikmal hatları sürdürmemizi sağlayacaktır."
 expand_bahamas_bases_goal_name:0 "Bahama Üslerini Genişlet"
 expand_bahamas_bases_goal_desc:0 "Bahamalar'daki üslerimizi genişletmek, Karayip deniz yollarının daha etkili izlenmesine ve Kuzey ile Güney Amerika'ya giden deniz yaklaşımlarının korunmasına olanak tanıyacaktır."
 fortify_panama_canal_goal_name:0 "Panama Kanalı'nı Tahkim Et"
 expand_trinidad_bases_goal_name:0 "Trinidad Üslerini Genişlet"
 expand_azores_bases_goal_name:0 "Azor Üslerini Genişlet"
 expand_iceland_bases_goal_name:0 "İzlanda Üslerini Genişlet"
 expand_iceland_bases_goal_desc:0 "İzlanda'daki üsleri genişletmek, Danimarka Boğazı'nı daha iyi güvence altına almamıza ve Kuzey Atlantik koridoru üzerinde daha fazla nüfuz kurmamıza olanak tanıyacaktır."
 expand_faroese_bases_goal_name:0 "Faroe Üslerini Genişlet"
 expand_narvik_bases_goal_name:0 "Narvik Üslerini Genişlet"
 expand_narvik_bases_goal_desc:0 "Narvik'teki üsleri genişletmek, hayati demir cevheri sevkiyatlarına erişimin ve Arktik ikmal yolları üzerindeki denetimin daha iyi sürdürülmesine olanak tanıyacaktır."
 fortify_danish_belts_goal_name:0 "Danimarka Boğazlarını Tahkim Et"
 fortify_danish_belts_goal_desc:0 "Kattegat'ı tahkim etmek, Baltık ve Kuzey Denizleri arasındaki deniz erişimi üzerinde tek denetimi daha iyi kurmamızı sağlayacaktır."
 fortify_danish_belts_tooltip:0 "§YDanimarka Boğazlarını§! denetleyen §YJylland§!, §YFyn§! ve §YSjaelland§! üzerindeki her bölgede seviye 1 §YKıyı Kalesi§! bulunur ve bir tümen görevlendirilmiştir."
 fortify_gibraltar_goal_name:0 "Cebelitarık'ı Tahkim Et"
 fortify_gibraltar_goal_desc:0 "Cebelitarık Boğazı'ndaki stratejik üssümüzü tahkim etmek, Akdeniz ile Atlantik arasındaki deniz trafiği üzerinde daha iyi denetim kurmamızı sağlayacaktır."
 expand_maltese_bases_goal_name:0 "Malta Üslerini Genişlet"
 expand_maltese_bases_goal_desc:0 "Malta'daki üslerimizi genişletmek, düşman ikmal hatlarının daha iyi aksatılmasına ve orta Akdeniz genelinde güç yansıtılmasına olanak tanıyacaktır."
 expand_cretan_bases_goal_name:0 "Girit Üslerini Genişlet"
 expand_cretan_bases_goal_desc:0 "Girit'teki üslerimizi genişletmek, doğu Akdeniz üzerinde hâkimiyet kurmamıza ve Ege ile Kuzey Afrika'daki operasyonları kolaylaştırmamıza daha iyi olanak tanıyacaktır."
 expand_cypriot_bases_goal_name:0 "Kıbrıs Üslerini Genişlet"
 expand_cypriot_bases_goal_desc:0 "Kıbrıs'taki üslerimizi genişletmek, doğu Akdeniz'deki operasyonları daha iyi desteklememizi ve Orta Doğu'ya giden ve oradan gelen hayati hava yollarını güvence altına almamızı sağlayacaktır."
 fortify_bosporus_goal_name:0 "İstanbul Boğazı'nı Tahkim Et"
 fortify_bosporus_goal_desc:0 "İstanbul Boğazı'nı tahkim etmek, Karadeniz ile Akdeniz arasındaki tüm deniz erişimi üzerindeki denetimimizi sağlayacaktır."
 fortify_bosporus_tooltip:0 "§Yİstanbul§! içinde §YBoğaz§! geçidini denetleyen her bölgede seviye 1 §YKıyı Kalesi§!, seviye 1 §YKara Kalesi§! bulunur ve bir tümen görevlendirilmiştir."
 fortify_dardanelles_goal_name:0 "Çanakkale Boğazı'nı Tahkim Et"
 fortify_dardanelles_goal_desc:0 "Çanakkale Boğazı'nı tahkim etmek, Karadeniz'den gelen filo ve ticaret hareketlerini belirleme yeteneğimizi güçlendirecektir."
 fortify_dardanelles_tooltip:0 "§YÇanakkale Boğazı'nı§! denetleyen §YEdirne§! ve §YBursa§! üzerindeki her bölgede seviye 1 §YKıyı Kalesi§!, seviye 1 §YKara Kalesi§! bulunur ve bir tümen görevlendirilmiştir."
 fortify_suez_canal_goal_name:0 "Süveyş Kanalı'nı Tahkim Et"
 fortify_suez_canal_goal_desc:0 "Avrupa ile Asya arasındaki ana trafik damarı üzerindeki tek denetimimizi sağlamak için Süveyş Kanalı'na sahip olmaya devam etmek şarttır."
 fortify_suez_tooltip:0 "§YSüveyş§! boğazını denetleyen §YSüveyş§! üzerindeki her bölgede seviye 1 §YKıyı Kalesi§!, seviye 1 §YKara Kalesi§! bulunur ve bir tümen görevlendirilmiştir."
 expand_gulf_of_aden_bases_goal_name:0 "Aden Körfezi Üslerini Genişlet"
 fortify_strait_of_hormuz_goal_name:0 "Hürmüz Boğazı'nı Tahkim Et"
 fortify_strait_of_hormuz_goal_desc:0 "Hürmüz Boğazı'ndaki stratejik üsleri tahkim etmek, hayati İran ve Irak petrolüne erişim üzerinde denetim kurmamızı daha iyi sağlayacaktır."
 fortify_strait_of_hormuz_tooltip:0 "§YHürmüz§! boğazını denetleyen §YMusandam§! ve §YFars§! üzerindeki her bölgede seviye 1 §YKıyı Kalesi§!, seviye 1 §YKara Kalesi§! bulunur ve bir tümen görevlendirilmiştir."
 expand_ceylonese_bases_goal_name:0 "Seylan Üslerini Genişlet"
 expand_ceylonese_bases_goal_desc:0 "Seylan'daki üslerimizi genişletmek, Hint Okyanusu üzerindeki hâkimiyetimizi güçlendirecek ve Orta Doğu ile Güneydoğu Asya arasındaki hayati deniz yollarının korunmasını kolaylaştıracaktır."
 expand_singapore_naval_base_goal_name:0 "Singapur Deniz Üssünü Genişlet"
 expand_singapore_naval_base_goal_desc:0 "Singapur'un görkemli tahkim edilmiş deniz üssü Malakka Boğazı'na hâkimdir ve Hint ile Pasifik Okyanusları arasındaki hareketi düzenler. Daha da güçlendirilmelidir."
 fortify_manila_bay_goal_name:0 "Manila Körfezi'ni Tahkim Et"
 fortify_manila_bay_goal_desc:0 "Savunulabilir Manila Körfezi'ni tahkim etmek, batı Pasifik genelinde güç yansıtmamızı iyileştirecek ve Doğu Hint Adaları ile Güney Çin Denizi'ne erişimi güvence altına alacaktır."
 fortify_manila_tooltip:0 "§YManila§! bölgesinde seviye 2 §YKıyı Kalesi§! ve seviye 7 §YDonanma Üssü§! bulunur; §YManila§! eyaletinde seviye 8 §YHava Üssü§! bulunur."
 fortify_okinawa_goal_name:0 "Okinawa'yı Tahkim Et"
 fortify_okinawa_goal_desc:0 "Okinawa'yı tahkim etmek, Japon ana adalarına giden yaklaşım yollarına hâkim olacak ve Pasifik'te güçlü bir savunma çevresi kuracaktır."
 fortify_okinawa_tooltip:0 "§YOkinawa§! eyaletinde seviye 1 §YHava Savunması§! ve seviye 5 §YHava Üssü§! bulunur; §YNaha§! bölgesinde seviye 2 §YKıyı Kalesi§! bulunur."
 fortify_iwo_jima_goal_name:0 "İvo Jima'yı Tahkim Et"
 fortify_iwo_jima_goal_desc:0 "İvo Jima'yı tahkim etmek, Japon ana adalarına giden yaklaşım yollarına hâkim olacak ve Pasifik'te güçlü bir savunma çevresi kuracaktır."
 expand_caroline_islands_bases_goal_name:0 "Caroline Üslerini Genişlet"
 expand_caroline_islands_bases_goal_desc:0 "Caroline Adaları'ndaki ve Truk Atolü'ndeki üslerimizi genişletmek, orta Pasifik genelinde sürekli deniz ve hava harekâtlarını kolaylaştıracaktır."
 expand_guadalcanal_bases_goal_name:0 "Guadalcanal Üslerini Genişlet"
 expand_guadalcanal_bases_goal_desc:0 "Guadalcanal'daki üslerimizi genişletmek, Güney Pasifik'teki deniz operasyonları ve Avustralya'ya giden ve oradan gelen erişim yolları üzerinde daha iyi denetim kurmamızı sağlayacaktır."
 expand_wake_island_bases_goal_name:0 "Wake Üslerini Genişlet"
 expand_midway_island_bases_goal_name:0 "Midway Üslerini Genişlet"
 expand_midway_island_bases_goal_desc:0 "Midway'deki üslerimizi geliştirmek, orta Pasifik yaklaşım yollarının güvenliğini sağlayacak ve okyanus aşırı operasyonlar için kilit bir üs sunacaktır."
 undoing_brest_litowsk_goal_name:0 "Brest-Litovsk Antlaşması'nın İntikamını Al"
 undoing_brest_litowsk_goal_desc:0 "Brest-Litovsk'un utanç verici barışı hiçbir zaman tamamen geri alınmadı. Tarihimizin bu utanç verici bölümünün son kalıntılarını silme zamanı."
 marine_corps_goal_name:0 "Deniz Piyade Birliği Kur"
 marine_corps_goal_desc:0 "Amfibi kuvvetlerimizi genişletmek saldırı yeteneğimizi ve tehdit edebileceğimiz düşman toprağı miktarını büyük ölçüde artıracaktır."
 marine_corps_tech_bonus:0 "$marine_corps_goal_name$ Hedef Bonusu"
 submarine_force_goal_name:0 "Denizaltı Filosunu Genişlet"
 submarine_force_goal_desc:0 "Düşman ikmal hatlarını zayıflatmak için uygun bir denizaltı gücü kritiktir."
 submarine_force_tech_bonus:0 "$submarine_force_goal_name$ Hedef Bonusu"
 convoy_escort_force_goal_name:0 "Konvoyları Okyanuslar Boyunca Eskort Et"
 convoy_escort_force_goal_desc:0 "İkmal hatlarımızı güvence altına almak için yeterli sayıda eskort gemisine sahip olmalıyız."
 convoy_escort_force_tech_bonus:0 "$convoy_escort_force_goal_name$ Hedef Bonusu"
 air_superiority_goal_name:0 "Hava Üstünlüğünü Koru"
 air_superiority_goal_desc:0 "Havanın denetimi karada ve denizde başarıyı belirler. Hava hâkimiyetimizi sağlamak için yeterli avcı uçağına sahip olmalıyız."
 air_superiority_tech_bonus:0 "$air_superiority_goal_name$ Hedef Bonusu"
 control_mexican_oil_goal_name:0 "Meksika Petrolünü Denetle"
 control_mexican_oil_goal_desc:0 "Meksika petrol rezervlerini güvence altına almak, sanayi ve askeri talepler için yeterli yakıt arzını sağlayacaktır."
 control_curacao_oil_goal_name:0 "Curaçao Petrolünü Denetle"
 control_curacao_oil_goal_desc:0 "Curaçao'daki rafineriler Venezuela petrolünün işlenmesinin ayrılmaz bir parçasıdır. Bunlar üzerindeki denetim ittifaka rafine petrol ürünlerine güvenilir erişim sağlayacaktır."
 control_venezuelan_oil_goal_name:0 "Venezuela Petrolünü Denetle"
 control_venezuelan_oil_goal_desc:0 "Venezuela'nın büyük petrol rezervleri, ittifakımıza askeri faaliyetlerini desteklemek için gereken enerji erişimini sağlayacaktır."
 control_guyanan_bauxite_goal_name:0 "Guyana Boksitini Denetle"
 control_guyanan_bauxite_goal_desc:0 "Guyana'nın boksit yataklarına hâkim olmak, uçak imalatı için şart olan ittifakın alüminyum üretimini artıracaktır."
 control_suriname_bauxite_goal_name:0 "Surinam Boksitini Denetle"
 control_suriname_bauxite_goal_desc:0 "Surinam'ın zengin boksit yataklarına sahip olmak, ittifakımızın büyüyen uçak sanayisi için gereken ham maddeleri sağlayacaktır."
 control_lappland_metals_goal_name:0 "Laponya Madenlerini Denetle"
 control_lappland_metals_goal_desc:0 "Laponya'nın maden zenginliğine erişim, ittifakın demir ve tungsten arzını güçlendirerek silah imalat sanayimizi sürdürecektir."
 control_ploiesti_oil_fields_goal_name:0 "Ploiești Petrol Sahalarını Denetle"
 control_ploiesti_oil_fields_goal_desc:0 "Avrupa'daki tek petrol sahaları olan Ploiești petrol sahalarının denetimi, ittifakın süregelen askeri operasyonlar için gereken yakıta sahip olmasını sağlamada paha biçilmezdir."
 control_baku_oil_fields_goal_name:0 "Bakü Petrol Sahalarını Denetle"
 control_baku_oil_fields_goal_desc:0 "Bakü petrol bölgesini güvence altına almak, askeri operasyonlar için hayati önemde geniş petrol rezervlerine erişim sağlayacaktır."
 control_iraqi_oil_goal_name:0 "Irak Petrolünü Denetle"
 control_iraqi_oil_goal_desc:0 "Irak'ın petrol üretim kapasitesi, ordumuzun yakıt ihtiyaçlarının karşılanmasında belirleyici olabilir."
 control_persian_oil_goal_name:0 "İran Petrolünü Denetle"
 control_persian_oil_goal_desc:0 "İran'ın petrol sahaları ve rafineri kapasitesi üzerindeki denetim, operasyonel ihtiyaçlar için kesintisiz yakıt akışını sağlayacaktır."
 control_chinese_metals_goal_name:0 "Çin Madenlerini Denetle"
 control_chinese_metals_goal_desc:0 "Çin'in çeşitli kritik metallerdeki zenginliği, ittifakın askeri-sanayi tabanına ihtiyaç duyduğu kaynakları sağlayabilir."
 control_malayan_riches_goal_name:0 "Malaya Zenginliklerini Denetle"
 control_malayan_riches_goal_desc:0 "Malaya'nın tungsten ve kauçuk kaynaklarının denetimi, ittifakın malzeme tabanını büyük ölçüde güçlendirecek; imalat ve askeri lojistik için kilit girdileri güvence altına alacaktır."
 control_indonesian_riches_goal_name:0 "Endonezya Zenginliklerini Denetle"
 control_indonesian_riches_goal_desc:0 "Endonezya'nın petrol, kauçuk ve madenleri de içeren çeşitli doğal zenginliği, sanayi tabanımızı desteklemek ve ittifakın kaynak bağımsızlığını sağlamak için paha biçilmezdir."
 control_newfoundland_bases_goal_name:0 "Newfoundland Üslerini Denetle"
 control_newfoundland_bases_goal_desc:0 "Newfoundland'daki üsleri güvence altına almak, Kuzey Atlantik konvoyları üzerinde denetim kurmamıza ve hayati deniz taşımacılığı rotaları boyunca hava ve deniz gücü yansıtmamıza olanak tanıyacaktır."
 control_bermuda_goal_name:0 "Bermuda'yı Denetle"
 control_bermuda_goal_desc:0 "Bermuda'daki üsler, Atlantik'in ortasında daha etkili devriye gezmemizi ve kıtalar arasında daha güvenli ikmal hatları sürdürmemizi sağlayacaktır."
 control_bahamas_bases_goal_name:0 "Bahama Üslerini Denetle"
 control_bahamas_bases_goal_desc:0 "Bahamalar'daki üslere sahip olmak, Karayip deniz yollarının daha etkili izlenmesine ve Kuzey ile Güney Amerika'ya giden deniz yaklaşımlarının korunmasına olanak tanıyacaktır."
 control_panama_canal_goal_name:0 "Panama Kanalı'nı Denetle"
 control_panama_canal_goal_desc:0 "Panama Kanalı üzerindeki denetim, Atlantik ile Pasifik arasında filoların hızla yeniden konuşlandırılması için hayati önemdedir ve her iki okyanusta da stratejik esneklik sağlar."
 control_trinidad_goal_name:0 "Trinidad'ı Denetle"
 control_trinidad_goal_desc:0 "Trinidad'ın kilit konumu, Karayip petrol arzının denetimi için onu şart kılar ve Güney Amerika'nın kuzey kıyısında stratejik bir sıçrama noktası olarak hizmet etmesini sağlar."
 control_azores_goal_name:0 "Azorlar'ı Denetle"
 control_azores_goal_desc:0 "Azorlar'ın stratejik konumu, Atlantik'in ortasında erişimi genişleterek hem denizaltı hem denizaltı karşıtı kapsama boşluğunu kapatır ve konvoylara kesintisiz hava koruması sağlar."
 control_iceland_goal_name:0 "İzlanda'yı Denetle"
 control_iceland_goal_desc:0 "İzlanda'daki üslerin denetimi, Danimarka Boğazı'nı güvence altına almamıza ve Kuzey Atlantik koridoru üzerinde nüfuz kurmamıza olanak tanıyacaktır."
 control_faroe_islands_goal_name:0 "Faroe Adaları'nı Denetle"
 control_faroe_islands_goal_desc:0 "Faroe Adaları, kuzey deniz yollarının denetimini ve Britanya, İskandinavya ve Arktik yönündeki deniz operasyonlarının desteklenmesini sağlayan stratejik bir konumdadır."
 control_narvik_goal_name:0 "Narvik'i Denetle"
 control_narvik_goal_desc:0 "Narvik'i güvence altına almak, hayati demir cevheri sevkiyatlarına erişimin ve Arktik ikmal yolları üzerindeki denetimin sürdürülmesine olanak tanıyacaktır."
 control_danish_belts_goal_name:0 "Danimarka Boğazlarını Denetle"
 control_danish_belts_goal_desc:0 "Kattegat'a garnizon yerleştirmek, Baltık ve Kuzey Denizleri arasındaki deniz erişimi üzerinde tek denetimi kurmamızı sağlayacaktır."
 control_brittany_bases_goal_name:0 "Bretanya Üslerini Denetle"
 control_brittany_bases_goal_desc:0 "Bretanya kıyısı boyunca uzanan stratejik üsler, Atlantik'e daha geniş menzilli denizaltı ve hava operasyonlarına ve Avrupa anakarasına erişimin güvence altına alınmasına olanak tanıyacaktır."
 control_gibraltar_goal_name:0 "Cebelitarık'ı Denetle"
 control_gibraltar_goal_desc:0 "Cebelitarık Boğazı'ndaki stratejik üs, Akdeniz ile Atlantik arasındaki deniz trafiği üzerinde denetim kurmamıza olanak tanıyacaktır."
 control_malta_goal_name:0 "Malta'yı Denetle"
 control_malta_goal_desc:0 "Malta'ya sahip olmak, düşman ikmal hatlarının aksatılmasını ve orta Akdeniz genelinde güç yansıtılmasını mümkün kılacaktır."
 control_crete_goal_name:0 "Girit'i Denetle"
 control_crete_goal_desc:0 "Girit adası üzerindeki denetim, doğu Akdeniz üzerinde hâkimiyet kurmaya ve Ege ile Kuzey Afrika'daki operasyonları kolaylaştırmaya olanak tanıyacaktır."
 control_cyprus_goal_name:0 "Kıbrıs'ı Denetle"
 control_cyprus_goal_desc:0 "Kıbrıs'ın denetimi, doğu Akdeniz'deki operasyonların desteklenmesini ve Orta Doğu'ya giden ve oradan gelen hayati hava yollarının güvence altına alınmasını sağlayacaktır."
 control_bosporus_goal_name:0 "İstanbul Boğazı'nı Denetle"
 control_bosporus_goal_desc:0 "İstanbul Boğazı'nı ele geçirmek, Karadeniz ile Akdeniz arasındaki tüm deniz erişimini denetlememize olanak tanıyacaktır."
 control_dardanelles_goal_name:0 "Çanakkale Boğazı'nı Denetle"
 control_dardanelles_goal_desc:0 "Çanakkale Boğazı'nı elde tutmak, Karadeniz'den gelen filo ve ticaret hareketlerini belirlemeyi mümkün kılacaktır."
 control_suez_canal_goal_name:0 "Süveyş Kanalı'nı Denetle"
 control_suez_canal_goal_desc:0 "Hayati Süveyş Kanalı'na sahip olmak, Avrupa ile Asya arasındaki ana trafik damarı üzerinde tek denetimi bize verecek ve kuvvetlerin ve kaynakların hızla aktarılmasını sağlayacaktır."
 control_gulf_of_aden_bases_goal_name:0 "Aden Körfezi Üslerini Denetle"
 control_gulf_of_aden_bases_goal_desc:0 "Aden Körfezi boyunca uzanan stratejik üsler, Kızıldeniz yaklaşımlarının korunmasını ve Avrupa, Afrika ile Asya'yı bağlayan deniz taşımacılığı yollarının güvence altına alınmasını sağlar."
 control_strait_of_hormuz_goal_name:0 "Hürmüz Boğazı'nı Denetle"
 control_strait_of_hormuz_goal_desc:0 "Hürmüz Boğazı'ndaki stratejik üsler, hayati İran ve Irak petrolüne erişim üzerinde denetim kurmayı mümkün kılacaktır."
 control_ceylon_goal_name:0 "Seylan'ı Denetle"
 control_ceylon_goal_desc:0 "Seylan'ı güvence altına almak, Hint Okyanusu'na hâkim olmayı ve Orta Doğu ile Güneydoğu Asya arasındaki hayati deniz yollarını korumayı mümkün kılacaktır."
 control_singapore_goal_name:0 "Singapur'u Denetle"
 control_singapore_goal_desc:0 "Singapur'un görkemli tahkim edilmiş deniz üssü Malakka Boğazı'na hâkimdir ve Hint ile Pasifik Okyanusları arasındaki hareketi düzenler. Bizim olmalıdır."
 control_manila_goal_name:0 "Manila'yı Denetle"
 control_manila_goal_desc:0 "Savunulabilir Manila Körfezi'ne sahip olmak, batı Pasifik genelinde güç yansıtmaya izin verecek ve Doğu Hint Adaları ile Güney Çin Denizi'ne erişimi güvence altına alacaktır."
 control_okinawa_goal_name:0 "Okinawa'yı Denetle"
 control_okinawa_goal_desc:0 "Okinawa'nın denetimi, Japon ana adalarına karşı operasyonlar başlatmayı ve Pasifik'te güçlü bir savunma çevresi kurmayı mümkün kılacaktır."
 control_iwo_jima_goal_name:0 "İvo Jima'yı Denetle"
 control_iwo_jima_goal_desc:0 "İvo Jima'yı güvence altına almak, Japonya üzerindeki uzun menzilli hava operasyonlarının desteklenmesine olanak tanıyacak ve orta Pasifik'e erişimimizi genişletecektir."
 control_caroline_islands_goal_name:0 "Caroline Adaları'nı Denetle"
 control_caroline_islands_goal_desc:0 "Caroline Adaları ve Truk Atolü üzerindeki hâkimiyet, orta Pasifik genelinde sürekli deniz ve hava harekâtlarını mümkün kılacaktır."
 control_guadalcanal_goal_name:0 "Guadalcanal'ı Denetle"
 control_guadalcanal_goal_desc:0 "Guadalcanal'ı güvence altına almak, Güney Pasifik'teki deniz operasyonları ve Avustralya'ya giden ve oradan gelen erişim yolları üzerinde denetim kurmamıza olanak tanıyacaktır."
 control_wake_island_goal_name:0 "Wake Adası'nı Denetle"
 control_wake_island_goal_desc:0 "Wake Adası'nı elde tutmak, orta Pasifik rotaları boyunca keşif ve hava kapsamasını genişletmeyi mümkün kılacaktır."
 control_midway_island_goal_name:0 "Midway Adası'nı Denetle"
 control_midway_island_goal_desc:0 "Midway'in denetimi, orta Pasifik yaklaşım yollarının güvenliğini sağlayacak ve okyanus aşırı operasyonlar için kilit bir üs sunacaktır."
 control_hawaii_goal_name:0 "Hawaii'yi Denetle"
 control_hawaii_goal_desc:0 "Pearl Harbor'ı ele geçirmek, Pasifik operasyonlarını sabitlemeyi ve tüm okyanus cephesinde lojistiği eşgüdümlemeyi mümkün kılacak, ayrıca Amerikan Pasifik kıyı şeridine erişimin yolunu açacaktır."
 control_attu_island_goal_name:0 "Attu Adası'nı Denetle"
 control_attu_island_goal_desc:0 "Attu Adası'nı güvence altına almak, kuzey Pasifik deniz yolları üzerinde denetim kurmaya ve Aleut Adaları zinciri boyunca Alaska'ya ve Amerikan Pasifik kıyısına doğru operasyonlar yürütmeye olanak tanıyacaktır."
 undo_versailles_goal_name:0 "Versay Antlaşması'nın İntikamını Al"
 undo_versailles_goal_desc:0 "Bu «Diktat»ın maskaralığını geri alma zamanı çoktan geldi. Hakkımız olan toprağı geri alacağız!"
 strategic_bombing_campaign_goal_name:0 "Sürekli Stratejik Bombardıman Harekâtı"
 strategic_bombing_campaign_goal_desc:0 "Büyük ölçekli bir stratejik bombardıman harekâtı düşmanın sanayi kapasitesini sistemli biçimde zayıflatacak ve güçlerini yıpratmamıza olanak tanıyacaktır."
 liberate_territory_goal_name:0 "Topraklarımızı Kurtar"
 liberate_territory_goal_desc:0 "Düşman topraklarımızı elinde tutuyor. Onları kurtarmak ilk hedefimiz olmalıdır."
 great_offensive_goal_name:0 "Büyük Bir Taarruz Gerçekleştir"
 great_offensive_goal_desc:0 "Düşman topraklarını ele geçiren büyük bir taarruz, savaşın nihai sonucuna giden ilk adımımız olmalıdır."
