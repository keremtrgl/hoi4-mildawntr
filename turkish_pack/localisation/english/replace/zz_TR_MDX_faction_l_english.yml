 cento_alliance:0 "CENTO"
 faction_cento_alliance:0 "CENTO Üyesi"
 faction_cento_alliance_desc:0 "Merkezi Antlaşma Örgütü olarak da bilinen CENTO, Orta Doğu'da laik ve demokratik değerleri korumak amacıyla yakın zamanda yeniden canlandırılan bir askeri ittifaktır. İttifak Soğuk Savaş sırasında pek etkili olmasa da üyeleri bunu değiştirmeye ve bölgede daha fazla değişim sağlamaya yemin etti."
 faction_cento_TT:0 "§Rİttifak Özel Kuralları§!:\n- İttifaka yalnızca Orta Doğu, Afrika, Orta Asya ve Pakistan'daki bazı ülkeler katılabilir\n- Ülkeler yalnızca savunma savaşlarına çağrılabilir"
