 seato_alliance:0 "EAST"
 faction_seato_alliance:0 "EAST Üyesi"
 faction_seato_alliance_desc:0 "EAST, Doğu Asya Güvenlik Antlaşması anlamına gelir. İttifak, Çin'in artan nüfuzuna ve hâkimiyetine karşı Doğu Asya'da daha güçlü bir Demokratik ittifak için Amerikan desteğiyle kurulmuştur. İttifakın beyan edilen hedefleri bölgedeki Demokratik normları korumak ve üye devletler arasında askeri iş birliğini ve güvenliği güçlendirmektir."
 faction_seato_TT:0 "§Rİttifak Özel Kuralları§!:\n- İttifaka yalnızca Doğu Asya ve Okyanusya'daki bazı ülkeler katılabilir\n- Ülkeler yalnızca savunma savaşlarına çağrılabilir"
