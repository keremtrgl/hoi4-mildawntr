 CSTO_member_desc:0 "Kolektif Güvenlik Antlaşması Örgütü, Sovyet sonrası devletlerden oluşan savunma amaçlı bir askeri ittifaktır. Örgüt, Sovyetler Birliği'nin çöküşü ve Bağımsız Devletler Topluluğu'nun kurulmasıyla başladı; ülkeler Sovyet sonrası ulusların birliğini korumaya çalışıyordu. Zamanla ayrı bir askeri ittifaka dönüştü."
 CSTO_member_tooltip:0 "§Rİttifak Özel Kuralları§!:\n- İttifaka yalnızca bir zamanlar Sovyetler Birliği'nin parçası olan ülkeler katılabilir\n- Ülkeler yalnızca savunma savaşlarına çağrılabilir"
