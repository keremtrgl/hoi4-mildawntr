 faction_warsaw_pact_idea:0 "Varşova Paktı Üyesi"
 faction_warsaw_pact_idea_desc:0 "Resmî adı «Dostluk, İşbirliği ve Karşılıklı Yardım Antlaşması» olan §YVarşova Paktı§!, SSCB ve Polonya tarafından 28 Mayıs 1955'te imzalanan kolektif savunma antlaşmasıdır. Bu terimin günümüzde yeniden ortaya çıkışı, Sovyetler Birliği'nin yeniden canlanması ve Moskova önderliğindeki büyüyen komünist bloğun Batı nüfuzuna karşı koymak için Komünist nüfuzu her yöne yaymasıyla Doğu Avrupa'daki kolektif savunma bloğunu gevşek biçimde ifade eder."
 faction_warsaw_pact_member_tt:0 "§Rİttifak Özel Kuralları§!:\n- İttifaka yalnızca eski Varşova Paktı ülkeleri, Rusya'nın Bağımlı Ülkeleri veya bir Varşova Paktı üyesinin komşuları katılabilir\n- İktidar partisi Yükselen Komünist olmalıdır"
 warsaw_pact_join_faction_rule_tt:0 "§REski Varşova Paktı ülkeleri, Rusya'nın Bağımlı Ülkeleri veya bir Varşova Paktı üyesinin komşuları olmalı ve Yükselen Komünist olmalıdır§!"
 taj_alliance:0 "TAC Paktı"
 faction_taj_alliance:0 "TAC Üyesi"
 faction_taj_alliance_desc:0 "Bu ülke TAC Paktı'nın (Taç Paktı) üyesidir. Tacikistan hükümeti tarafından kurulan ittifak, Orta Asya devletlerine zarar vermek isteyenlere karşı birleşik bir savunma sağlamayı amaçlar. Bazıları ittifakın, Tacikistan hükümetinin Rus hükümetinden uzaklaşması sonucunda Rus saldırganlığını caydırmak için kurulduğunu öne sürmektedir."
