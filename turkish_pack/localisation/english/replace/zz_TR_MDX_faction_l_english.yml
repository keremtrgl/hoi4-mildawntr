 faction_resistance_axis_member_desc:0 "Direniş Ekseni, İran, Suriye ve Hizbullah (daha sonra Iraklı Şii milisler ve Husi isyancılar da) arasındaki gayriresmî ittifakı ifade eder. Orta Doğu'da İsrail, Suudi ve Batı nüfuzuna karşı çıkan ülkelerin bir araya gelmesidir."
