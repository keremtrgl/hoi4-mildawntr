 SIA_seato_alliance:0 "SEATO"
 faction_SIA_seato_alliance:0 "SEATO Üyesi"
 faction_SIA_seato_alliance_desc:0 "Güneydoğu Asya Antlaşması Örgütü SEATO, Tayland tarafından kurulan ve ASEAN üyeliği etrafında inşa edilen bir karşılıklı savunma paktıdır. 1954'teki özgün antlaşma dış güçlerin bir aracıydı ve 1977'de dağıldı; bu pakt ise tasarımı gereği bölgeseldir: Bangkok merkezde yer alır, üyeler komşulardır ve garanti, herhangi birinin çevreleme stratejisi için değil Güneydoğu Asya'nın savunması için işler."
 faction_SIA_seato_TT:0 "§Rİttifak Özel Kuralları§!:\n- İttifaka yalnızca Güneydoğu Asya ülkeleri katılabilir\n- Savaşta olan ülkeler katılamaz\n- Yalnızca bağımsız ülkeler savaş ilan edebilir\n- Ülkeler yalnızca savunma savaşlarına çağrılabilir\n- Üyelerin verdiği garantiler §Y%15§! daha az dünya gerginliği yaratır\n- Üyeler insan gücünün §Y%10§!'unu ittifak yedeğinde toplar\n- Liderlik yalnızca bildiri §Y%50§! altındayken el değiştirebilir"
 faction_SIA_seato_alliance_call_ally_rule_tt:0 "§RSEATO üyeleri müttefiklerini yalnızca savunma savaşlarına çağırabilir!§!"
 faction_SIA_seato_alliance_join_ally_rule_tt:0 "§RSEATO üyeleri müttefiklerine yalnızca savunma savaşlarında katılabilir!§!"
 faction_SIA_seato_alliance_join_faction_rule_tt:0 "§RSEATO'ya yalnızca Güneydoğu Asya ülkeleri katılabilir!§!"
 faction_SIA_seato_alliance_offer_join_faction_rule_tt:0 "§RSEATO'ya yalnızca Güneydoğu Asya ülkeleri katılabilir!§!"
 asean_centrality_goal_name:0 "ASEAN Merkeziliği"
 asean_centrality_goal_desc:0 "On devlet bu yarımadayı ve bu denizleri paylaşıyor ve elli yıldır büyük güçler onların güvenliğini onlar adına belirledi. SEATO bu kararı yeniden bölgenin eline vermek için var. Pakt, ancak ASEAN üyeliği içinde yer aldığında adına layık olur."
 seato_regional_stability_goal_name:0 "Bangkok Uzlaşması"
 seato_regional_stability_goal_desc:0 "İstikrarsız hükümetlerden oluşan bir pakt hiçbir şeyi garanti etmez. Her üyeyi sağlam bir zemine getirin ve beşini ittifakta tutun; antlaşma kâğıt olmaktan çıkar. Her üye Siyasi Güç, İstikrar ve iki yıl boyunca daha ucuz tüketim malı kazanır."
 SIA_seato_stability_dividend:0 "SEATO İstikrar Temettüsü"
 SIA_seato_stability_dividend_desc:0 "Pakt içindeki ortak tedarik ve açık sınırlar, Bangkok dahil tüm üyelikte gündelik malların fiyatını aşağı çekti."
 imperial_bloc_alliance:0 "Emperyal Blok"
 faction_imperial_bloc_alliance:0 "Emperyal Blok Üyesi"
 faction_imperial_bloc_alliance_desc:0 "Yeni Merkezî Güçler olarak da anılan Emperyal Blok, Almanya tarafından bölgede KGAÖ ve NATO hâkimiyetiyle rekabet etmek için kurulmuştur. Almanya'nın pakt oluşturması zorlayıcı nitelikte olsa da dünyanın daha iki kutuplu bir yapıya kaymasına yol açmıştır.."
 faction_imperial_bloc_TT:0 "§Rİttifak Özel Kuralları§!:\n- İttifaka yalnızca Avrupa'daki bazı ülkeler katılabilir\n- Ülkeler §HSaldırı§! savaşlarına çağrılabilir"
