 NATO:0 "NATO"
 NATO_member:0 "NATO Üyesi"
 NATO_member_desc:0 "Kuzey Atlantik Antlaşması Örgütü (NATO), ABD, Kanada ve birkaç Avrupa ülkesinden oluşan bir savunma ittifakıdır. Salt siyasi bir ittifak olarak başlayan NATO kısa sürede Sovyet karşıtı bir askeri ittifaka dönüştü. Sovyetler Birliği'nin dağılmasından sonra NATO dünyada giderek daha müdahaleci bir rol üstlendi. Yine de ittifakın asıl amacı üye ülkelerini savunmaktır ve bir üye devlete saldırı hepsine saldırı sayılır."
 NATO_member_tooltip:0 "§Rİttifak Özel Kuralları§!:\n- Yalnızca İttifak Lideri diğer ülkelere garanti verebilir\n- Ülkeler yalnızca savunma savaşlarına çağrılabilir\n- İttifaka giriş ve çıkış kararlar/olaylarla denetlenir"
