 faction_brics_alliance:0 "BRICS Üyesi"
 faction_brics_alliance_desc:0 "BRICS, birkaç bölgeye yayılan çeşitli ülkelerin oluşturduğu bir topluluktur. Pakt başlangıçta daha çok ekonomik nitelikte tasarlanmış olsa da üyeleri, NATO gibi ittifaklara rakip bir savunma paktı kurmanın kendileri için en iyisi olduğuna karar verdi."
 faction_brics_TT:0 "§Rİttifak Özel Kuralları§!:\n- Çekirdek üyelerin onayladığı herkes ittifaka katılabilir\n- Ülkeler yalnızca savunma savaşlarına çağrılabilir"
