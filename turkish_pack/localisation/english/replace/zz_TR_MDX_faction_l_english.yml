 UNASUL_member_tooltip:0 "§Rİttifak Özel Kuralları§!:\n- Üyeler yalnızca savunma savaşlarına çağrılabilir\n- İttifaka katılım olağan diplomasiyle veya blok olaylarıyla düzenlenebilir\n- İttifaktan ayrılma kararlar/olaylarla denetlenir\n- Üyeler olağan ittifak diplomasisiyle çıkarılamaz\n- İttifak olağan yollarla dağıtılamaz"
