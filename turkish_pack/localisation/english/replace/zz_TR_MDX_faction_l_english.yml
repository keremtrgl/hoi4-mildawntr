 aso_alliance:0 "ASO"
 faction_aso_alliance:0 "ASO Üyesi"
 faction_aso_alliance_desc:0 "Atlantik Güvenlik Örgütü olarak da bilinen ASO, Britanya'nın Avrupa'da ve genel olarak Atlantik bölgesinde NATO hegemonyasına karşı koymak için kurduğu yeni doğan bir askeri paktır. Ayrıca KGAÖ'nün Avrupa'daki faaliyetlerinde tam bir teslimiyete zorlanması gibi ek bir amacı da vardır."
 faction_aso_TT:0 "§Rİttifak Özel Kuralları§!:\n- ASO'ya yalnızca Avrupa'daki bazı ülkeler katılabilir"
