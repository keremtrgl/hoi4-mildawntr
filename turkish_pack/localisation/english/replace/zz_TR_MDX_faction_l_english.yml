 transform_nato_forces:0 "NATO Kuvvetlerini Dönüştür"
 transform_nato_forces_desc:0 "Yarının zorluklarını karşılamak için NATO kuvvetlerinin yapısını iyileştirmeliyiz."
 nato_gdp_per_capita:0 "NATO Ekonomik Kalkınması"
 nato_gdp_per_capita_desc:0 "Güvenli ve müreffeh bir gelecek için her üye devletin ekonomik olarak gelişmiş olmasını sağlamalıyız."
 transform_eap_forces:0 "Doğu Asya Paktı Kuvvetlerini Dönüştür"
 transform_eap_forces_desc:0 "Yarının zorluklarını karşılamak için Doğu Asya Paktı kuvvetlerinin yapısını iyileştirmeliyiz."
 check_russia:0 "Rus Tehdidiyle Yüzleş"
 check_russia_desc:0 "Rusya barışı yeterince uzun süredir bozuyor; hamlelerinin denetim altında tutulmasını sağlamalıyız."
 check_china:0 "Çin Tehdidiyle Yüzleş"
 check_china_desc:0 "Çin barışı yeterince uzun süredir bozuyor; hamlelerinin denetim altında tutulmasını sağlamalıyız."
 democracy_in_europe:0 "Avrupa'da Demokrasi"
 democracy_in_europe_desc:0 "Avrupa'da demokrasinin egemen olmasını güvence altına almamız ve sağlamamız şarttır."
 democracy_in_europe_completed_tt:0 "Tüm Avrupa ülkelerinde seçim var ve bunlar Batı Yanlısı veya Bağlantısız görüşte"
 democracy_in_east_asia:0 "Doğu Asya'da Demokrasi"
 democracy_in_east_asia_desc:0 "Doğu Asya'da demokrasinin egemen olmasını güvence altına almamız ve sağlamamız şarttır."
 faction_goal_no_terrorism_name:0 "Bir İstihbarat Teşkilatı Kur"
 faction_goal_no_terrorism_desc:0 "İttifakımızın küresel terörizme yanıtı çok uzun süredir parçalı kaldı. Ulusal bir istihbarat teşkilatı kurmak, ciddi terörle mücadele çalışmaları için bize temel sağlayacak ve ortaklarımıza tehditleri gerçekten avlamak için gereken bonusları verecektir."
 crush_the_democracy_goal_name:0 "Demokrasiyi Ez"
 crush_the_democracy_goal_desc:0 "Halk demokratik ideallerini unutmalı. Ancak o zaman Batı propagandasından ve saldırılarından güvende olabiliriz."
 help_ukraine_name:0 "İşgale Karşı Ukrayna'ya Yardım Et"
 help_ukraine_name_desc:0 "Ukrayna Batı'ya yöneliyor ve Rusya çökmüş imparatorluğuna umutsuzca tutunuyor. Ukrayna'nın yolunu değiştirme iradesini korumalıyız."
 help_taiwan_name:0 "İşgale Karşı Tayvan'a Yardım Et"
 help_taiwan_name_desc:0 "Çin, Doğu Asya için açık bir tehdit haline geldi. Tayvan'ın yeniden Çin'in denetimine girmesini önlemek iyi bir tercih olur."
 control_mandeb_goal_name:0 "Bab-ül Mendep'i Kontrol Et"
 control_mandeb_goal_name_desc:0 "Bab-ül Mendep Boğazı, Kızıldeniz'deki kilit noktalardan biridir. Bölgedeki ticaretin ve lojistiğin sürmesini sağlamak için onu kontrol etmeliyiz."
 dominate_the_middle_east_goal_name:0 "Orta Doğu'yu Güvence Altına Al"
 dominate_the_middle_east_goal_desc:0 "Orta Doğu çok uzun süredir bölünmüş ve yabancı güçlerce kontrol edilmiş durumda. Barış ve istikrar getirmek için bölge bizim bayrağımız altında birleştirilmelidir."
 call_to_war_rule_always:0 "Savaşa Çağrıdan Kaçınılamıyor"
 call_to_war_rule_never:0 "Savaşa Müdahale Yok"
 nato_defeat_taliban:0 "Afganistan'da Terörizmi Yen"
 nato_defeat_taliban_desc:0 "ABD'ye yönelik büyük terör saldırılarının ardından NATO, bu tehdidi daha fazla zarar vermeden yok etmeye hazır olmalıdır."
 secure_central_asia_name:0 "Orta Asya'yı Güvence Altına Al"
 secure_central_asia_desc:0 "KGAÖ Orta Asya bölgesinde büyük oranda pekişmiş olsa da bazı devletler hâlâ yörüngemizin hemen dışında oyalanıyor. Kalan devletleri safımıza katarak bölge üzerindeki otoritemizi tamamen kurabiliriz."
 secure_crimea_name:0 "Kırım'ı Güvence Altına Al"
 secure_crimea_desc:0 "Kırım, ticaretin ve deniz üstünlüğünün kolayca şah mat edilebileceği bölgenin hayati bir noktasında yer alır. Kırım denetimimiz altına girerse ittifakımız denizler üzerindeki hâkimiyetini daha iyi sağlayabilir."
 bring_georgia_into_orbit_name:0 "Gürcistan'ı Yörüngemize Kat"
 bring_georgia_into_orbit_desc:0 "Gürcistan, Doğu ile Batı siyaseti arasında giderek daha fazla gidip gelen bir devlettir. Çok geç olmadan onları kendi yörüngemize katmak en iyisidir."
 bring_ukraine_into_orbit_name:0 "Ukrayna'yı Dahil Et"
 bring_ukraine_into_orbit_desc:0 "Ukraynalılar hızla bölgesel bir aktör haline geliyor; bu da onları rakiplerimizin bize karşı üs olarak kullanması için değerli bir yatırım yapıyor. Çok geç olmadan Ukrayna'yı nüfuzumuz altına almaya girişmek en iyisidir."
 goal_global_hegemony_name:0 "Küresel Hegemonya"
 goal_global_hegemony_desc:0 "Amerikan imparatorluğunun yükselişi devletimizin varlığını tehdit ediyor. Bu nedenle bu tehditle başa çıkmak ve küresel hegemonya kurmak gereklidir."
 incorporate_syria_name:0 "Suriye'yi Dahil Et"
 incorporate_syria_desc:0 "Suriyeliler Batı emperyalizmine düşmenin eşiğinde. Kırılgan siyasi durumları onları yabancı sömürüsüne açık hale getiriyor ve çok geç olmadan müdahale etmeliyiz."
 control_lebanon_name:0 "Lübnan'ı Güvence Altına Al"
 control_lebanon_desc:0 "Lübnan, Şii faaliyetinin başlıca merkezlerinden biridir ve sonuç olarak düşmanlarımızın sürekli saldırısı altındadır. Onları denetimimiz altına almak en iyisidir... tabii ki güvende olmaları için."
 houthis_in_yemen_name:0 "Husi Yemen"
 houthis_in_yemen_desc:0 "Yemen hükümeti çok uzun zamandır Şii nüfusunun temel haklarını ihmal etti ve bu sesi çıkmayan insanları korumak bizim görevimiz."
 control_hormuz_name:0 "Hürmüz'ü Kontrol Et"
 control_hormuz_desc:0 "Hürmüz Boğazı yeryüzündeki en hayati geçiş noktalarından biridir ve o olmadan dünyadaki rolümüz hızla zayıflar. Küresel ölçekte güç yansıtma yeteneğimizi korumak için üzerinde tam denetim kurmamız şarttır."
 liberate_the_quds_name:0 "Kudüs'ün Kurtuluşu"
 liberate_the_quds_desc:0 "Siyonistler Kudüs'ü çok uzun süredir denetimleri altında tutuyor; Direniş Ekseni olarak bölgeyi son kez şekillendirme zamanı geldi."
