 lift_ban_from_operating_desc:0 "Bu, diğer ülkelerin ÖAŞ'mizi kiralamasına izin verir"
 call_pmc_back_sov:0 "Birlikleri Geri Çağır"
 call_pmc_back_sov_desc:0 "Bu, adamlarımızı eve getirmemizi sağlar; ancak her ülkeye sözleşme feshi tazminatı ödememiz gerekir."
 pmc_category:0 "Özel Askeri Şirketler"
 pmc_category_tracker_desc:0 "§YÖzel Askeri Şirketler§!.\n\nKendi §Yözel ordunuzu§! §Gkiralayın!§!\nBize §Gsadık§! §YŞirketler§! ya da doğrudan kontrol ettiklerimiz,\n hizmetlerinde bize §Y%20§! §Gindirim§! sağlar.\n\n[PMC_max_available]\n§YGüncel ÖAŞ listesi§!:\n[PMC_Header_blackwater][PMC_Header_wagner][PMC_Header_aegis][PMC_Header_constellis][PMC_Header_md]"
 pmc_local_management:0 "Yerel askeri birlikler"
 pmc_local_management_desc:0 "Yerel Özel Askeri Şirketler. Yerel şirketlerde indirim her zaman %20'dir.\nKapasitemizi en fazla 7'ye kadar genişletebiliriz. Kalitemizi en fazla 4. seviyeye kadar yükseltebiliriz.\n\n[PMC_max_available]\n[PMC_local_header]"
 form_local_pmc:0 "Yerel ÖAŞ Kur"
 open_blackwater_desc:0 "Blackwater, 26 Aralık 1996'da eski Deniz Kuvvetleri SEAL subayı Erik Prince tarafından kurulan Amerikan bir özel askeri şirketti. Blackwater ve selefleri, Amerika Birleşik Devletleri federal hükümetine sözleşmeli güvenlik hizmetleri sağlar. 2003'ten beri Merkezi İstihbarat Teşkilatı'na da hizmet vermektedir."
 open_aegis_desc:0 "Aegis Defence Services; Afganistan, Birleşik Arap Emirlikleri, Irak, Suudi Arabistan, Libya, Somali ve Mozambik'te yurt dışı ofisleri bulunan İngiliz bir özel askeri ve özel güvenlik şirketidir. Merkezi ABD'de bulunan Aegis LLC'nin de içinde yer aldığı Aegis Group şirketler topluluğunun bir parçasıdır. 2002'de, daha önce özel askeri şirket Sandline International'ın CEO'su olan Tim Spicer, girişimci Jeffrey Day ile eski yatırım bankacıları Mark Bullough ve Dominic Armstrong tarafından kuruldu."
 open_constellis_desc:0 "Constellis, karmaşık risk yönetimi sektöründe sınıfının en iyi markalarını, varlıklarını ve insanlarını bir araya getirmek isteyen bir grup operatör ve yatırımcı tarafından 2010'da kuruldu. Uyum ve operasyonel mükemmellik kültürünü teşvik eden Constellis şirketler ailesi; Triple Canopy, Olive Group ve The Development Initiative ile eski şirketler Centerra, ACADEMI, AMK9, OMNIPLEX, Strategic Social ve Edinburgh International'ı da kapsayan, sektör liderlerinden oluşan küresel bir ekibe dönüştü."
 get_constellis_light_infantry_desc:0 "Hafif piyade ve topçu desteğinden oluşan tugay büyüklüğündeki birlikler; zorlu araziler için uygundur ve diğer ordu tasarımlarından epeyce ucuzdur."
 get_aegis_light_infantry_desc:0 "Hafif piyade ve topçu desteğinden oluşan tugay büyüklüğündeki birlikler; zorlu araziler için uygundur ve diğer ordu tasarımlarından epeyce ucuzdur."
 get_blackwater_heavy_mech_infantry_desc:0 "Mekanize Piyade birlikleri hafif ve motorlu piyadeye karşı çok güçlüdür. Savunma bakımından da Hafif ve Motorlu Piyadeden daha güçlüdür. Maliyetleri yüksektir, ancak bu birliklerin gücü bunu karşılar."
 get_blackwater_special_infantry_desc:0 "Özel piyade kuvvetleri ya da komandolar, tecrübeli askerlerden oluşan güçlü birliklerdir. Özellikle dağlık bölgelerde savunmada çok işe yarayabilirler. Hafif tümenleri de kolayca yok edebilirler. Maliyetleri çok yüksektir, ancak pek çok ilginç özelliğe sahiptirler."
 get_constellis_mech_infantry_desc:0 "Mekanize Piyade birlikleri hafif ve motorlu piyadeye karşı çok güçlüdür. Savunma bakımından da Hafif ve Motorlu Piyadeden daha güçlüdür. Maliyetleri yüksektir, ancak bu birliklerin gücü bunu karşılar."
 get_blackwater_mech_infantry_desc:0 "Mekanize Piyade birlikleri hafif ve motorlu piyadeye karşı çok güçlüdür. Savunma bakımından da Hafif ve Motorlu Piyadeden daha güçlüdür. Maliyetleri yüksektir, ancak bu birliklerin gücü bunu karşılar."
 get_constellis_mot_infantry_desc:0 "Hafif hedeflere vurmak ve onları yok etmek için güçlü ve elverişli tümenler. Maliyetleri Hafif Piyade birliklerinden yüksektir, ancak onlardan daha güçlüdürler."
 get_blackwater_mot_infantry_desc:0 "Hafif hedeflere vurmak ve onları yok etmek için güçlü ve elverişli tümenler. Maliyetleri Hafif Piyade birliklerinden yüksektir, ancak onlardan daha güçlüdürler."
 get_blackwater_light_infantry_desc:0 "Hafif piyade ve topçu desteğinden oluşan tugay büyüklüğündeki birlikler; zorlu araziler için uygundur ve diğer ordu tasarımlarından epeyce ucuzdur."
