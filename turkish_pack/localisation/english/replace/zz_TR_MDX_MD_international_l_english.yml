 IS_counter_terror_threat_text:0 "Terör Tehdidi"
 terror_main_category:0 "Bir ülkenin §YTerör Tehdidi§! ne kadar yüksekse, cihatçı grupların o ülkede yerel hedeflere (devlet daireleri gibi) ve yabancı hedeflere (askeri üsler gibi) saldırı düzenleme olasılığı o kadar artar. Sınırı korumasız bırakılırsa saldırılar komşu ülkede de başlatılabilir. Terör saldırılarının şiddeti ve başarılı olma olasılığı, iç güvenlik harcamaları artırılarak ve terörle mücadele eğitimi yapılarak azaltılabilir."
 terror_instruct_category:0 "Bir ülkenin §YTerör Tehdidi§!'ni belirli bir noktanın ötesine indirebilmesi; savaşta olup olmadığına, istikrarına, kişi başı GSYİH'sine ve yolsuzluk düzeyine bağlıdır. §YTerör Tehdidi§!, §YRadikalleşme§! düzeyi ve komşu ülkelerden cihatçıların sızması nedeniyle artabilir. Düşük §YRadikalleşme§! düzeylerinde, baskınlar ve dış müdahale sonucunda azalır. Asgari §YRadikalleşme§! düzeyi; yolsuzlukla mücadele edilerek, istikrar artırılarak ve ekonomi büyütülerek düşürülebilir. §YRadikalleşme§!, [Caliphate_L] popülerliğiyle birlikte ve hızlı toplumsal özgürleşme sonucunda artar."
