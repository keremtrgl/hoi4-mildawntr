 PMC_blackwater_name_desc:0 "§YBlackwater Worldwide§!, 1996'nın sonlarında eski ABD Deniz Kuvvetleri SEAL'i Erik Prince tarafından kurulan Amerikan bir özel askeri müteahhittir. Şirket, kolluk eğitimi, yakın muharebe eğitimi ve güvenlik hizmetleri gibi çeşitli hizmetler sunar."
 PMC_aegis_name_desc:0 "§YAegis§!, tam adıyla Aegis Defence Services, daha önce Sandline International'ın CEO'su olan Tim Spicer'ın Jeffrey Day, Dominic Armstrong ve Mark Bullough ile birlikte kurduğu İngiliz bir özel askeri şirkettir. Sunduğu hizmetler arasında güvenlik hizmetleri, kolluk eğitimi, lojistik destek ve yeniden inşa çalışmaları yer alır."
 PMC_constellis_name_desc:0 "§YConstellis Holdings§!, Blackwater'ın Triple Canopy ile birleşmesiyle oluşan, merkezi ABD'de bulunan özel askeri şirketin adıdır."
 PMC_wagner_name_desc:0 "§YWagner Grubu§!, resmî adıyla ÖAŞ Wagner, Yevgeni Prigojin tarafından kurulan, devlet tarafından finanse edilen bir Rus özel askeri müteahhittir. Wagner Grubu en çok muharebe birlikleri için hapishane mahkûmlarını devşirmesiyle tanınır ve dünyanın birçok ülkesinde operasyon yürütür."
 PMC_md_name_desc:0 "§YMD Military Bois§! özel askeri şirketi 21. yüzyılda bir ara kuruldu. Kökenleri bilinmiyor, ancak şirket mensupları Amerika, İsviçre, Almanya, Çin ve Rusya gibi çok çeşitli ülkelerden geliyor; bu da onu küresel sahnedeki en çeşitli teçhizata ve en çok uluslu yapıya sahip özel askeri şirketlerden biri yapıyor. Yüksek morali, koordinasyonu ve çok sayıda silah platformunu kullanabilme becerisi nedeniyle kiralanabilecek en iyi paralı askerler arasında sayılıyor."
 PMC_mpri_name_desc:0 "§YMPRI§! (diğer adıyla §YL3-MPRI§!), 1987'de Genelkurmay Başkanlığı yapmış Carl Vuono da dahil sekiz eski üst düzey Amerikan askeri liderince kurulan, merkezi ABD'de bulunan küresel bir özel askeri müteahhittir. Şirket lojistik, askeri eğitim, kolluk eğitimi, uçak modernizasyonu ve bakımı, elektronik sistemler ve elektronik harp gibi çok çeşitli hizmetler sunar. Çöl Fırtınası Harekâtı'nda aktif rol oynamış, kısa süre sonra Hırvatistan, Bosna, Ekvator Ginesi, Kolombiya ve daha birçok ülkede sözleşmeleri olan dünyaca ünlü bir küresel ÖAŞ haline gelmiştir."
 PMC_sadat_name_desc:0 "§YSADAT Specialists§!, merkezi İstanbul'da bulunan bir Türk özel askeri şirketidir. 2012'de kurulan şirket, Orta Doğu'da faaliyet gösterir ve askeri müteahhitlik, mühimmat tedariki ve savunma danışmanlığı gibi çeşitli hizmetler sunar."
 PMC_rsb_name_desc:0 "§YRSB-Group§!, merkezi Rusya'da bulunan bir askeri danışmanlık şirketidir; çeşitli hizmetler sunar, ancak başlıca muharebe birlikleri, eğitim, lojistik ve iyi eğitimli bir subay kadrosu sağlar."
 PMC_sandline_name_desc:0 "§YSandLine International§!, 1990'larda Tim Spicer tarafından kurulan, merkezi Londra'da bulunan bir ÖAŞ'dir. SandLine 90'larda birkaç çatışmaya karıştı; bunlardan biri Papua Yeni Gine'dir. Diğer ÖAŞ'ler gibi SandLine de askeri eğitim ve güvenlik korumasının yanı sıra, sözleşme sahipleri için teçhizat ve silah tedariki ile diplomatik destek içeren benzersiz operasyonel destek hizmetleri verdi."
 PMC_kbr_name_desc:0 "§YKBR Logistics§!, en çok Amerika Birleşik Devletleri ile diğer NATO ve NATO'ya yakın ortaklara verdiği lojistik destekle tanınan, lojistik odaklı bir özel askeri müteahhittir."
 PMC_nirtal_name_desc:0 "§YNirtal Specialists§!, 1995'te muharebe eğitimi, yakın koruma hizmetleri ve güvenlik danışmanlığında uzmanlaşan küresel bir özel güvenlik şirketi olarak kuruldu."
 PMC_halo_name_desc:0 "§YThe Halo Trust§!, 1988'de kurulan, savaştan zarar görmüş bölgelerde mayınları güvenli ve etkili biçimde temizlemekte uzmanlaşmış kâr amacı gütmeyen bir insani yardım kuruluşudur. Gelecek nesillerin güvenliği için hükümetlerden bu çalışmaya devam etmelerini ister. Çalışmalarının bir kısmını Mozambik, Kosova, Somali, Afganistan ve daha birçok ülkede yürütmüştür."
 PMC_defense_name_desc:0 "§YDefense Conseil International§!, Fransız askeri bilgi birikimini, eğitimini ve teknik yardımını uluslararası alanda ihraç etmeyi asıl amaç edinen çeşitli eski güvenlik kuruluşlarının 2000'de birleşmesiyle kuruldu."
 PMC_gardaworld_name_desc:0 "§YGardaWorld§!, Stephan Crétier'e ait, dünya genelinde güvenlik görevlisi ve zırhlı araç hizmetleri yürüten Kanadalı bir özel güvenlik firmasıdır. Şirket, dünyanın dört bir yanında birçok ülkeyle sözleşme yaparak büyükelçiliklere, bankalara, devlet binalarına ve diğer mekânlara güvenlik hizmeti sağlamıştır."
 PMC_esa_name_desc:0 "§YEuropean Security Academy§!, 1992'de Andrzej Bryl tarafından kuruldu; denizcilik korumasından ilk yardıma ve atışa kadar çeşitli hizmetler sunar. Ayrıca şirket, §Y[EUU.GetFlag][EUU.GetName]§! polis ve askeri güçleri başta olmak üzere Avrupa Birliği'ndeki birçok özel birliği eğitmiştir."
 PMC_asgard_name_desc:0 "§YAsgard - Germany Security Group§!, 2007'de kurulan Alman bir özel askeri şirkettir. Muharebe, eğitim ve daha fazlası alanlarında uzmanlaşmış bir özel askeri şirkettir."
 PMC_sinai_name_desc:0 "§YSina Kabileleri Birliği§!, Mısır'ın Kuzey Sina vilayetinde bölgedeki Mısır Güvenlik Güçleriyle omuz omuza savaşmış yarı askeri bir güçtür. Güç ağırlıklı olarak yerel Bedevi kabilelerinden gelen insanlardan oluşur. Bu güç, isyancılara karşı etkili bir güç haline gelmiş ve koordineli profesyonel askeri güçlerle ikili olarak birlikte savaşmaktadır."
 PMC_gard_name_desc:0 "§YGardservis§!, 2020'de kurulan, Belarus hükümetinin desteklediği ve başta Afrika ile Güney Amerika ülkeleri olmak üzere diğer ulusların özel güvenlik kuvvetlerini barındırıp eğiten, merkezi Belarus'ta bulunan bir güvenlik kuruluşudur. Sıklıkla Rus özel askeri şirketi Wagner Grubu ile kıyaslanır ve yapı ile amaç bakımından ona benzer."
 PMC_patriot_name_desc:0 "§YPatriot§!, 2018 sonlarında §YWagner Grubu§!'nun daha seçkin bir sürümü olarak kurulan Rus özel askeri şirketidir. Daha çok kişisel korumaya odaklanır ve yalnızca muharebe deneyimi olan tecrübeli askerleri işe alır."
 PMC_dewe_name_desc:0 "§YDewe Security Services§!, 2011'de eski askerler ve polis memurlarınca kuruldu ve ilk olarak 2008 Pekin Olimpiyatları'nda görev yaptı. Çeşitli sivil polis güçlerinin eğitiminde sıkça yer alır ve Çin'in Afrika, Asya ve Orta Doğu'daki yatırımlarına güvenlik sağlayan Kuşak ve Yol girişiminin bir parçasıdır."
 PMC_over_name_desc:0 "§YChina Overseas Group Security§!, yurt dışındaki uluslarla yakın çalışarak Çin'in ve ev sahibi ülkenin çıkarlarının korunmasını sağlamayı amaçlayan, devlet destekli bir Çin güvenlik firmasıdır. Hizmetleri için ödeme yapan uluslara eğitim, koruma ve güvenlik gibi çeşitli hizmetler sunar."
 PMC_front_name_desc:0 "§YFront§! (ya da §YFrontier Services Group§!), merkezi [HKG.GetNameWithFlag] olan, Çin devletine ait bir özel güvenlik kuruluşudur; Afrika odaklı güvenlik, havacılık ve lojistik şirketi olup eski §YBlackwater Worldwide§! CEO'su Erik Prince tarafından kurulmuştur. Şirket esas olarak nakliye rotaları için lojistik projelere, silahsız güvenliğe ve terörle mücadele güvenlik eğitimine odaklanır. Ayrıca çatışma bölgelerinden yüksek riskli tahliyelerde de uzmandır."
 PMC_redut_name_desc:0 "§YRedut§!, 2008'de çeşitli Rus askeri gazilerinin ve Savunma Bakanlığı birliklerinin birleşmesiyle kuruldu; bu kişiler çeşitli barışı koruma ve askeri görevlerde muharebe deneyimi edinmişti."
 PMC_gazprom_name_desc:0 "Dağıtılan §YWagner ÖAŞ§!'sinin ardından §YGazprom§!, tesislerini korumasını sağlayan kendi özel güvenlik kuruluşunu kurdu. §YGazprom§!, ayrıca en çok Rusya Savunma Bakanlığı ile sözleşmeli olarak petrol ve gaz çıkarlarını korumasıyla bilinir."
 PMC_iron_name_desc:0 "§YIron Navy§!, çeşitli koruma hizmetleri ve yat güvenliği hizmetleri sunan, merkezi Estonya'da bulunan bir özel askeri şirkettir."
 PMC_sheriff_name_desc:0 "§YSheriff§!, Transdinyester'in en büyük ikinci şirketidir ve tüm kârlı özel işletmeleri kapsar. Benzin istasyonlarında, süpermarketlerde, TV kanallarında, bayilerde, otellerde ve daha fazlasında payı vardır. Güvenlik kuruluşu, şirket devi için başka bir gelir yöntemi olarak kuruldu. Şirket çeşitli varlıklarına güvenlik hizmeti verir ve hizmetlerini uluslararası alanda da sunmuştur."
 PMC_lukoil_name_desc:0 "§YLukoil§!, muharebe ve güvenlik koruması ile istihbarat toplamaya odaklanan ÖAŞ'sini kurdu. Lukoil'in desteklediği ÖAŞ'nin eski KGB ajanlarıyla bağlantılı olduğu düşünülüyor."
 PMC_rosneft_name_desc:0 "§YRosneft§!, Rusya'daki bir başka petrol devi olup esas olarak güvenlik güçlerine odaklanan bir askeri şirket kurmaya yöneldi."
 PMC_sberbank_name_desc:0 "§YSberbank§!, Rus hükümetinin isteği üzerine esas olarak muharebe ve güvenlik güçlerine odaklanan bir askeri şirket kuran, devlete ait bir Rus bankasıdır."
 PMC_vtb_name_desc:0 "§YVTB§!, Arkadi Rotenberg'in yardımıyla Convoy adıyla bir askeri şirket kuran, devlete ait bir Rus bankasıdır. Diğer Rus özel askeri şirketleri gibi bu şirket de muharebe ve güvenlik güçleri sağlamaya yönelik askeri ve güvenlik hizmetlerine odaklanır."
