 pmc_global_management:0 "Küresel ÖAŞ yönetimi"
 pmc_global_management_desc:0 "\n\n\n\n\n\n£CHVK_desctext_pmc\n\n\n\n\n\n\n\n\nBu ekran, sadık ÖAŞ'mizle küresel ölçekte faaliyet göstermemizi ve onu yönetmemizi sağlar.\nKapasitemizi en fazla 7'ye kadar genişletebiliriz. Kalitemizi en fazla 4. seviyeye kadar yükseltebiliriz.\n\n[PMC_global_header]"
 found_pmc_global:0 "Küresel ÖAŞ kur"
 expand_operations:0 "Operasyonları Genişlet"
 expand_operations_desc:0 "Bu, ÖAŞ'mizin toplam kapasitesini artırır."
