 un_aid_subsidies_modifier_desc:0 "Gelişmekte olan ulusları desteklemek ve uluslararası topluluğun üretken üyeleri haline gelmelerine yardımcı olmak için tasarlanmış çeşitli §BBM§! §YYardım Programları§!'nın şartları sağlandığında verilen sübvansiyonlar."
 IS_un_aid_general_budget:0 "§YGenel Faaliyet Bütçesi§!: $$[?global.un_operating_budget_base|+G3] / hafta"
 IS_un_aid_general_budget_tt:0 "Ulusların §BBM§! §YGenel Faaliyet Bütçesi§!'ne katkılarını azalan sırayla gösterir"
 IS_un_aid_general_budget_tt_delayed:0 "§YGenel Faaliyet Bütçesi§!, asgari şartları karşılayan tüm §BBM§! Üye devletlerinin katkıda bulunduğu genel temel bütçedir. Asgari bütçe katkısı GSYİH'nin §Y[?global.general_operating_budget_contribute_percent|%]§!'idir; her yılın başında yıllık olarak hesaplanır ve bütçeye en az §G$0,001§! eklenmesi gerekir. Bu asgariyi karşılamayan uluslar o yıl bütçeye katkıda bulunmaz ve sonuç olarak bütçe katkısı avantajlarından yararlanamaz.\n\n§YGenel Faaliyet Bütçesi§!, üye devletlerin §BBirleşmiş Milletler§!'e haftalık olarak sağladığı ve çeşitli §BBM§! §YYardım Programları§!'na dağıtılan temel para miktarıdır. Bu katkılar tüm programlara eşit olarak dağıtılır ve her programın her hafta işleyebilmek için aldığı ilk temel tutarı oluşturur.\n\nUluslar, katkılarının karşılığı olarak §YGenel Faaliyet Bütçesi§!'ne katkı yüzdelerine eşit oranda £foreign_influence_modifier_texticon §YDış Nüfuz§! Çarpanı ve £foreign_influence_defense_modifier_texticon §YDış Nüfuz Savunması§! Çarpanı bonusu alır."
 is_un_aid_total_budget_spending:0 "§CBM§! için §RToplam Harcama§!:"
 is_un_aid_total_budget_spending_tt:0 "Şu anda §BBM§! Finansmanına $[?united_nations_expenses|-3] harcıyoruz"
 is_un_aid_total_budget_spending_tt_delayed:0 "Bu sayı, §YGenel Faaliyet Bütçesi§! ve diğer tüm §BBM§! program katkıları için yaptığımız bağımsız harcama kararları dahil, tüm §BBM§! §YYardım Programlarına§! ne kadar harcadığımızı gösterir."
 is_un_basic_budget_spending:0 "§CBM§! §YBütçesi§! için §RHarcama§!:"
 is_un_basic_budget_spending_tt:0 "Şu anda §BBM§! §YGenel Faaliyet Bütçesi§!'ne $[?united_nations_base_expenses|-3] harcıyoruz"
 is_un_basic_budget_spending_tt_delayed:0 "§YGenel Faaliyet Bütçesi§!, üye devletlerin §BBirleşmiş Milletler§!'e haftalık olarak sağladığı ve çeşitli §BBM§! §YYardım Programları§!'na dağıtılan temel para miktarıdır. Bu katkılar tüm programlara eşit olarak dağıtılır ve her programın her hafta işleyebilmek için aldığı ilk temel tutarı oluşturur. Bu bütçeden fon alan programlar §YUNIDO§!, §YUNCDF§! ve §YUNESCOE§!'dir"
 is_un_aid_unescoe_spending:0 "§YUNESCOE§! için §RHarcama§!:"
 is_un_aid_unescoe_spending_tt:0 "Şu anda §YUNESCOE Programı§!'na $[?united_nations_unescoe_funding|-3] harcıyoruz"
 is_un_aid_unescoe_spending_tt_delayed:0 "§BBirleşmiş Milletler§! §YEğitim, Bilim ve Kültür Örgütü§!, eğitimi geliştirmek, gelişmekte olan ulusa teknik danışmanlık sağlamak ve büyümek için yardıma ihtiyaç duyan uluslara politika diyaloğu sunmak üzere tasarlanmış bir yardım kuruluşudur.\n\nBu §BBM§! §YYardım Programı§!, £research_speed_texticon §YAraştırma Hızı§! ve £political_power_texticon §YSiyasi Güç Kazanımı§! bonusları sağlar."
 is_un_aid_unido_spending:0 "§YUNIDO§! için §RHarcama§!:"
 is_un_aid_unido_spending_tt:0 "Şu anda §YUNIDO Programı§!'na $[?united_nations_unido_funding|-3] harcıyoruz"
 is_un_aid_unido_spending_tt_delayed:0 "§BBirleşmiş Milletler§! §YSanayi Kalkınma Örgütü§!, sanayi kalkınmasını teşvik etmek üzere tasarlanmış bir yardım programıdır. Gelişmekte olan ulusların kendi sanayisini kurmasına yardım ederek yoksullukla mücadele eder, kapsayıcı küreselleşmeyi sağlar ve çevresel sürdürülebilirliği de hedefler.\n\nBu §BBM§! §YYardım Programı§!, ulusların sanayi tabanını, enerji altyapısını ve inşaat altyapısını geliştirmesine yardımcı olmak için ücretsiz kiralık §YSivil Sanayi§! edinme imkânı sağlar ve ayrıca £construction_speed_texticon §Yİnşaat Hızı§! geliştirir."
 is_un_aid_uncdf_spending:0 "§YUNCDF§! için §RHarcama§!:"
 is_un_aid_uncdf_spending_tt:0 "Şu anda §YUNCDF Programı§!'na $[?united_nations_uncdf_funding|-3] harcıyoruz"
 is_un_aid_uncdf_spending_tt_delayed:0 "§BBirleşmiş Milletler§! §YSermaye Kalkınma Fonu§!, ulusal yatırımlar için sermaye akışını iyileştirmek üzere tasarlanmış bir yardım programıdır. Programın amacı, yatırım programları ve dijital finans yoluyla istihdam yaratmak ve sürdürülebilir ekonomik büyüme sağlamaktır.\n\nBu §BBM§! §YYardım Programı§!, programdan yardım alan ulusa hem §YMali§! hem de §YKalkınma§! desteği sağlar. Program, bütçeleri iyileştirmek ve verimlilik artışını güçlendirmek için tasarlanmıştır."
 is_un_aid_spending_percent:0 "§YTemel Bütçe§! yüzdesi:"
 is_un_aid_spending_percent_tt:0 "§YGenel Faaliyet Bütçesi§!'ne katkımızın yüzdesi [?united_nations_contribution_percent|Y%2]"
 is_un_aid_spending_percent_tt_delayed:0 "§YGenel Faaliyet Bütçesi§!'ndeki pay hem bir itibar hem de güç meselesidir. Ne kadar çok katkıda bulunursak başkaları üzerinde o kadar çok £foreign_influence_modifier_texticon §YDış Nüfuz§! kurabiliriz ve nüfuzumuz o kadar etkili olur. Bu yüzdeyi ne kadar yükseltebilirsek o kadar iyidir."
