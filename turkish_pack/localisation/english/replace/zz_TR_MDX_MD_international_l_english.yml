 recognition_category_desc:0 "Tanınmamış birçok devlet uluslararası topluluğa katılmak istiyor. Kampanyalarını destekleyip desteklemeyeceğimize karar vermeliyiz. BM üyesi devletlerden yeterli destek alırlarsa Birleşmiş Milletler'e kabul edilebilir, tanınmamış statülerinden ve bunun getirdiği dezavantajlardan kurtulabilirler. Daha önce tanıdığımız devletlerin kampanyalarına, diğer BM üyelerini de onları tanımaya teşvik ederek ek destek verebiliriz."
