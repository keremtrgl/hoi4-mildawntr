 is_un_aid_additional_percent_tt:0 "Tüm §YYardım Programı Ek Katkıları§!'na katkımızın yüzdesi [?united_nations_aid_program_contribution_percent|Y%2]"
 is_un_aid_additional_percent_tt_delayed:0 "§YYardım Programı Ek Katkıları§! yüzdesi, programlardan yardım alan uluslar üzerinde daha fazla nüfuz sağlar ve bize daha fazla £political_power_texticon §YSiyasi Güç Kazanımı§! kazandırır; ayrıca §YYatırımlarımız§! için gereken hem süreyi hem de maliyeti §GAzaltarak§! §Yyatırımlarımızın§! diğer uluslarca kabul edilme şansını artırır."
 is_un_aid_total_budget_ido_tt_delayed:0 "Programın bütçesinin §Y%25§!'i ülkelerin £construction_speed_texticon §Yİnşaat Hızını§! geliştirmesine yardım için, kalan §Y%75§!'i ise §GSübvansiyonlu§! uluslara Kiralık §YSivil Sanayi§! sağlamak için kullanılır."
