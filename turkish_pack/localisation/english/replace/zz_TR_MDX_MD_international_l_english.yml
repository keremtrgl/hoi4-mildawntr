 CT_CUR_INTEL:0 "§YŞu Anki İstihbaratımız:§!"
 CT_CUR_INTEL_TT:0 "Seçilen örgüt hakkındaki güncel istihbaratımızı gösterir."
 CT_CUR_THREAT:0 "§RTerör Tehdit Düzeyi§!"
 CT_CUR_THREAT_TT:0 "Örgütün terör saldırısı düzenleme tehdidinin tahmini güncel düzeyini gösterir. Bu düzey kötüleştikçe terör saldırısı olasılığı artar."
 CT_CUR_DEFENSE:0 "§YTerör Savunma Düzeyi§!"
 CT_CUR_DEFENSE_TT:0 "Terör saldırısına karşı güncel savunma düzeyimizi gösterir. Bu düzey yükseldikçe ulusumuzda bir terör saldırısının başarılı olma olasılığı azalır."
 CT_CUR_SEL_INTEL:0 "§Yİstihbarat Doğruluğu§!"
 CT_CUR_SEL_INTEL_TT:0 "Bu örgüte karşı istihbarat toplama faaliyetimizin şu anda ne kadar etkili olduğunu gösterir"
 CT_CUR_LOCATION:0 "§YOlası Karargâh Konumu§!"
 CT_CUR_LOCATION_TT:0 "Bölgesel bir karargâhın nerede olabileceğini düşündüğümüzü gösterir."
 CT_CUR_FOREIGN:0 "§YYabancı Danışmanlar§!"
 CT_CUR_FOREIGN_TT:0 "Bu sayı, terörle mücadele operasyonlarımıza yardımcı olmak üzere bize danışman gönderen ülkelerin sayısını gösterir. Danışman gönderen her ulus, §Yİstihbarat Doğruluğu§! çarpanımızı §G%1§! artırır ve §Yİstihbarat Doğruluğumuzu§! geliştirir. Ayrıca ulusumuzda §YYabancı Danışmanı§! bulunan ulusların ulusumuz içindeki operasyonları iyileşir."
 CT_CUR_FUNDING_DETECT:0 "§YFon Tespit Bonusu§!"
 CT_FUND_DETECT_TT:0 "Burada sağladığımız her ek fonun Terörle Mücadele Faaliyetlerimize sağladığı güncel tespit bonusunu gösterir"
 CT_CUR_POLICE_COST:0 "§YGüvenlik Maliyeti Çarpanı§!"
 CT_FUND_POLICE_TT:0 "Bu sistem içinde gerçekleştirilen mali tedbirlerle §Yİç Güvenlik Harcamasının§! ne kadar yüzde arttığını gösterir."
 CT_SYS_DESC:0 "§YTerörle Mücadele Sistemi§!, küresel durumun terör örgütlerinin tehdidinin artıp artmayacağını ve istihbarat teşkilatlarınca ne kadar görünür olduklarını belirlemesiyle çalışır. §RTerör Tehdit Düzeyi§! yükseldikçe örgütün saldırılarının sıklığı ve gücü artar. Dünya Gerginliği, ülke içeriği ve oyuncu eylemleri §RTerör Tehdit Düzeyi§!'ni artırabilir veya azaltabilir. Bu sayılar aylık olarak veya büyük eylemlerden sonra güncellenir.\n\nOyuncular ajan sistemini ve bu menüdeki eylemleri kullanarak istihbarat toplama operasyonları yürütebilir, baskın sistemiyle baskınlar düzenleyerek istihbarat toplayabilir ve §RTerör Tehdit Düzeyi§!'ni düşürebilir. §Yİstihbarat Doğruluğu§! arttıkça terör örgütlerini daha isabetli hedef alabilir, nihayetinde karargâhlarına baskın düzenleyip tehdidi ortadan kaldırabilirsiniz."
