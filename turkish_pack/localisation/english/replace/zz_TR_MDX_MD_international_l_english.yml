 is_ct_mass_gather_tt:0 "İşlenmek üzere veri toplamak için istihbarat toplama operasyonları yürüt. İşlenen veri, §Y[name_of_org_disp]§! üzerindeki §YİstihbaratDoğruluğu§! geçici bir artış sağlar; bu artış, bir §Yİstihbaratı Değerlendir§! eylemi yapıldıktan sonra her ay azalır."
 is_ct_exploit_intel_tt:0 "Topladığımız istihbaratı değerlendirir; §Y[name_of_org_disp]§! örgütüne karşı kısa süreliğine daha büyük bir §Yİstihbarat Doğruluğu§! artışı sağlar. Artış, operasyonel kullanımı bitene kadar her ay azalır."
 is_ct_infil_agent_tt:0 "§Y[name_of_org_disp]§! örgütüne bir ajan sızdırmayı dener. Başarılı olursak §Yİstihbarat Doğruluğumuz§! kalıcı olarak artar. Sızma başarısız olursa §Yİstihbarat Doğruluğumuz§! kısa süreliğine düşer ve §Y[name_of_org_disp]§! örgütünün §RTerör Tehdit Düzeyi§! yükselir.\n\nSızma girişiminin başarı şansı, §Yİstihbarat Doğruluğumuza§! ve genel §Yİstihbarat Teşkilatı§! ajan eğitimine göre değişir."
 is_ct_asset_seizure_tt:0 "Varlıklara el koymak §Y[name_of_org_disp]§! örgütünün §RTerör Tehdit Düzeyi§!'ni düşürür, ancak kısa bir süre boyunca §Y[name_of_org_disp]§! örgütüne karşı §Yİstihbarat Doğruluğu§! kazanmayı da zorlaştırır."
 is_ct_arrest_sympathizers_tt:0 "Sempatizanları tutuklamak §Y[name_of_org_disp]§! örgütünün §RTerör Tehdit Düzeyi§!'ni düşürür ve §Y[name_of_org_disp]§! örgütü üzerindeki §Yİstihbarat Doğruluğunu§! artırır. Ancak tutuklamalara masum insanların da takılma ihtimali vardır ve yakalanırlarsa siyasi tepkiyle karşılaşabiliriz.\n\nTutuklamaların etkinliği §Yİstihbarat Doğruluğumuza§! ve §Yİstihbarat Teşkilatımızın§! Karşı İstihbarat ile Terörle Mücadele yükseltmelerine bağlıdır.\n"
