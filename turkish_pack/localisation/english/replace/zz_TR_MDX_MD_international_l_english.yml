 CT_struck_by_terror_attack_desc:0 "Ulusumuz uluslararası bir terör örgütünün saldırısına uğradı. Bu acımasız saldırıdan hem askeri hem de ekonomik açıdan toparlanmamız zaman alacak."
 CT_terror_attack_happened:0 "Küresel Bir Terör Saldırısı Yaşandı"
 CT_terror_attack_happened_desc:0 "Dünyadaki terör saldırıları sürerse sıranın kendilerine gelebileceğinden korkan vatandaşlarımız endişeli. Güvenliklerini sağlamak için bir şey yapmalıyız."
 CT_terror_attack_prevented:0 "Terör Saldırısı Önlendi"
 CT_terror_attack_prevented_desc:0 "İstihbaratımız ve Terörle Mücadele güçlerimiz yakın zamanda ulusumuza yönelik bir terör saldırısını durdurarak halkın onları koruma yeteneğimize olan inancını pekiştirdi!"
 MD_terror.1.t:0 "[org_doing_attack] Terör Saldırısı Düzenledi!"
 MD_terror.1.d:0 "[org_doing_attack] bugün bize karşı, istihbarat ve terörle mücadele teşkilatlarımızın önleyemediği bir terör saldırısı düzenledi. Hasar ve can kaybıyla ilgili raporlar hâlâ gelmekte, ancak her ikisinin de ciddi boyutlarda olduğu tahmin ediliyor. Bu kriz anında vatandaşlarımıza güvenlik, emniyet ve destek sağlamak için şimdi bir sonraki hamlemize karar vermeliyiz."
 MD_terror.1.a:0 "Yerel müdahalenin gerçekleşmesine izin vermeliyiz."
 MD_terror.1.b:0 "Elimizden gelen tüm yardımı gönderelim!"
 MD_terror.2.t:0 "[org_doing_attack] Terör Saldırısı Önlendi!"
 MD_terror.2.d:0 "[org_doing_attack] bugün bir terör saldırısı düzenlemeye kalkıştı, ancak teşkilatlarımızın etkili istihbarat toplaması ve terörle mücadele ekiplerimizin cesur müdahalesi sayesinde saldırı önlendi. Olaya karışan tüm teröristler öldürüldü ya da yakalandı; sığınakları ise elde edebileceğimiz başka istihbarat için inceleniyor. Bugün Terörle Mücadele Güçlerimiz için büyük bir başarı!"
 MD_terror.2.a:0 "[THIS.GetNameDef] İçin Büyük Bir Zafer!"
 MD_terror.3.t:0 "[FROM.GetName] Terör Saldırısına Uğradı!"
 MD_terror.3.d:0 "[FROM.GetName] ülkesi bugün [org_doing_attack_int] tarafından düzenlenen ve ulusa ciddi hasar ve can kaybı veren bir saldırıya uğradı. [FROM.GetName] ülkesi saldırının şokunu yaşarken, kendi vatandaşlarımız da kendi topraklarımızda saldırı olasılığı konusunda endişelenmeye başlıyor. [FROM.GetName] ülkesine destek gönderip göndermeyeceğimize karar vermeli ve kendi vatandaşlarımıza güven vermek için ne yapacağımızı belirlemeliyiz."
 MD_terror.3.a:0 "Ne büyük bir trajedi."
 MD_terror.3.b:0 "Kendi güvenliğimizi sıkılaştırmalıyız!"
 MD_terror.3.c:0 "İnançsızlara karşı bir şehit saldırısı!"
 MD_terror.4.t:0 "[FROM.GetName] Terör Saldırısını Önledi!"
 MD_terror.4.d:0 "[FROM.GetName] hükümeti bugün, etkili istihbarat, polis ve askeri operasyonlarla terör hücresini saldırıdan önce etkisiz hale getirerek ülkesinde [org_doing_attack_int] tarafından planlanan bir terör saldırısını başarıyla önlediğini duyurdu. Bugünkü bu başarı, Küresel Terörle Mücadele için büyük bir kazanımdır!"
 MD_terror.4.a:0 "[FROM.GetNameDef] belli ki hazırlıklıydı."
 MD_terror.5.t:0 "Kitlesel Veri Toplama Protestoları"
 MD_terror.5.d:0 "İstihbarat topluluğumuzdaki sızıntılar nedeniyle kamuoyu, terörü önleme çabalarımız kapsamındaki kitlesel veri toplamamızdan haberdar oldu. Ancak halk bunu büyük bir mahremiyet ihlali olarak gördü ve hükümetin sınırı aştığını düşündüğü bu uygulamaya karşı eleştiri ve protestolara başladı."
 MD_terror.5.a:0 "Bu onların iyiliği için!"
 MD_terror.6.t:0 "Kitlesel Tutuklama Protestoları"
 MD_terror.6.d:0 "[name_of_org_disp] destekçilerine yönelik kitlesel tutuklamalarımız örgütün faaliyetlerini aksatmada etkili olsa da, kötü istihbarat yüzünden çok sayıda masum sivili ve görgü tanığını da yanlışlıkla tutukladık. Sonuç olarak kamuoyu terörle mücadele operasyonlarımızdan rahatsız oldu ve ulusumuzu güvende tutmak için başvurmamız gereken kitlesel tutuklamalara ve diğer sert tekniklere karşı protesto etmeye başladı."
 MD_terror.6.a:0 "Özür dilemek yetmez mi?"
 MD_terror.7.t:0 "Başarılı Sızma!"
 MD_terror.7.d:0 "Ajanımız sonunda rapor verdi: yerine başarıyla yerleşti ve artık örgütün içinde. Biraz zaman alabilir, ancak operasyonlarımızı ilerlettikçe bize aktarabileceği istihbarat ulusumuz için çok faydalı olacak."
 MD_terror.7.a:0 "Bilgileri çok değerli olacak!"
 MD_terror.8.t:0 "Ajan Öldürüldü"
 MD_terror.8.d:0 "Ne yazık ki ajanımızdan bir süredir haber alamamamızın nedenini sonunda öğrendik. [name_of_org_disp] bugün, ajanımızı ve birkaç kişiyi daha infaz ettiklerini gösteren bir video yayınladı. Ajanımız belli ki ortaya çıkarılmış ya da yakalanmış; bu yüzden ondan daha önce aldığımız veya şu anda topladığımız bilgilerin değeri azaldı, çünkü artık onu araştırdığımızı biliyorlar."
 MD_terror.8.a:0 "Ne büyük kayıp"
 MD_terror.9.t:0 "Artan Güvenlik Önlemlerine Duyulan Öfke"
 MD_terror.9.d:0 "Vatandaşlar, toplu taşımada hava, deniz ve kara yolculuğunu zorlaştıran, uyguladığımız artırılmış güvenlik önlemlerinden rahatsız oldu. Devlet etkinliklerindeki artırılmış güvenlik düzeyleri de vatandaşlarla ilişkilerimizi geriyor ve onları rahatsız ediyor."
 MD_terror.9.a:0 "Önlemler devam etmeli!"
 MD_terror.9.b:0 "Belki etkilerini biraz azaltabiliriz..."
 MD_terror.11.t:0 "[FROM.GetName] Ortak Terörle Mücadele Tatbikatları Öneriyor"
 MD_terror.11.d:0 "[FROM.GetName] ülkesi, askeri güçlerimizin ve terörle mücadele güçlerimizin yeteneklerini artırmak için ortak Terörle Mücadele tatbikatları yapmamızı önerdi. Kabul edersek tatbikatların gerçekleşmesi için bir miktar fon harcamamız gerekecek, ancak onlar da para harcayacak. Reddedersek muhtemelen onları kızdırırız, ama bu geçer."
 MD_terror.11.a:0 "Tatbikatları yapalım!"
 MD_terror.11.b:0 "Bu zaman kaybı."
 MD_terror.11.c:0 "İnançsızlarla birlikte eğitim yapmayız!"
 MD_terror.13.t:0 "[FROM.GetName] Danışman Öneriyor"
 MD_terror.13.d:0 "[FROM.GetName] ülkesi bize yabancı danışmanlar biçiminde yardım göndermeyi önerdi. Bu, terörle mücadele yeteneklerimizi artıracak olsa da, bu danışmanların faaliyetlerimizi ve yeteneklerimizi raporlayacağını da varsaymalıyız; bu da istihbarat sızıntılarına yol açabilir."
 MD_terror.13.a:0 "Teklifi kabul edelim!"
 MD_terror.13.b:0 "[THIS.GetName] ülkesinin yardıma ihtiyacı yok!"
 MD_terror.13.c:0 "Haçlı casuslarına ev sahipliği yapmayacağız!"
 MD_terror.14.t:0 "[FROM.GetName] Danışmanları Çekiyor"
 MD_terror.14.d:0 "[FROM.GetName] ülkesi, terörle mücadele danışmanlarını ülkemizden çekti; bu da terörle mücadele operasyonları yürütme yeteneklerimizi azalttı."
 MD_terror.14.a:0 "Bunu nasıl yaparlar!"
 MD_terror.15.t:0 "[FROM.GetName] Danışmanları Kabul Etti!"
 MD_terror.15.d:0 "[FROM.GetName] ülkesi, istihbarat teşkilatlarımızdan gelen terörle mücadele danışmanları teklifimizi kabul etti! Bu, onların terörle mücadele operasyonlarını geliştirmemize yardımcı olmakla kalmayacak, aynı zamanda istihbarat toplama ve işleme operasyonlarına da içeriden bir bakış sağlayacak."
 MD_terror.15.a:0 "Akıllıca bir karar verdiler!"
 MD_terror.16.t:0 "[FROM.GetName] Danışmanları Reddetti!"
 MD_terror.16.d:0 "[FROM.GetName] ülkesi, terörle mücadele danışmanlarımızın ülkesine girmesine izin vermeyi reddetti."
 MD_terror.16.a:0 "Neyse, kaybeden onlar."
