 generic.Western_Autocracy:0 "£generic_Western_Autocracy_small Batı Yanlısı Otokratlar"
 generic.conservatism:0 "£generic_conservatism_small Muhafazakârlar"
 generic.conservatism_desc:0 "Muhafazakârlık; geleneksel kültürün, birliğin ve istikrarlı bir yaşam tarzının önemini savunan, geniş bir ılımlı sağ ideolojiler yelpazesini ifade eder. Muhafazakârlar toplumsal ve ekonomik işlere devlet müdahalesine karşı çıkma eğilimindedir ve çoğunlukla daha az düzenlemenin halk için daha fazla toplumsal hareketlilik getireceğine inanır."
 generic.liberalism:0 "£generic_liberalism_small Liberaller"
 generic.liberalism_desc:0 "Liberalizm, bireyin haklarını öne çıkaran ve devlet gücünün genişlemesi yerine özgürlüğü vurgulayan bir merkez ideolojisidir. Liberaller, dünyanın geri kalanıyla serbest ticaretin yapıldığı bir serbest piyasa çerçevesinde ilerici toplumsal politikaları destekleme eğilimindedir."
 generic.socialism:0 "£generic_socialism_small Sosyal Demokratlar"
 generic.socialism_desc:0 "Sosyal demokrasi, liberalizmin çoğu kolundan daha fazla ölçüde ekonomik ve toplumsal adaleti savunan geniş bir sol ideolojiler yelpazesini ifade eder. Sosyal demokratlar eşitsizliği ve baskıyı azaltmak ve demokrasiyi güçlendirmek için kapitalizmi insancıllaştırmayı amaçlar."
 generic.communist_state:0 "£generic_Communist_State_small Komünistler"
 generic.communist_state_desc:0 "Komünizm, kapitalist sistemin sona ermesiyle ortak bir işçi cennetinin kurulmasını savunan bir ideolojiyi ifade eder. Gerçekte komünist ülkeler kapitalist ekonomik sistemleri sürdürür ve çoğunlukla demokratik değildir."
 generic.anarchist_communism:0 "£generic_anarchist_communism_small Sol Radikaller"
 generic.anarchist_communism_desc:0 "Sol radikalizm, genellikle kapitalizmin ve küreselleşmenin sona ermesini savunan geniş bir aşırı sol ideoloji yelpazesidir. Bazıları silahlı direnişi desteklese de çoğu kendini yalnızca sosyal demokratlardan 'daha solda' görür ve liberal demokrasiyi kabul eder."
 generic.Conservative:0 "£generic_Conservative_small Gericiler"
 generic.Conservative_desc:0 "Gericiler, hedefleri ılımlı muhafazakârlardan daha ileri giden geniş bir aşırı sağ ideolojiler yelpazesini ifade eder. Gericiler genellikle geçmişin idealize edilmiş bir versiyonuna inanır ve intikamcı ve toprak peşinde koşan bir ideoloji ile saldırgan bir askeri politika aracılığıyla bir ulusun eski ihtişamını yeniden kurmaya çalışır."
 generic.Autocracy:0 "£generic_Autocracy_small Otokratlar"
 generic.Autocracy_desc:0 "Otokrasi, tüm siyasi gücü tek bir hükümdarın veya ayrıcalıklı bir elit grubunun elinde tuttuğu, demokratik olmayan, otoriter geniş bir siyasi sistemler yelpazesini ifade eder."
 generic.Mod_Vilayat_e_Faqih:0 "£generic_Mod_Vilayat_e_Faqih_small Ilımlı Şii Devrimci"
 generic.Mod_Vilayat_e_Faqih_desc:0 "Ilımlı Şii devrimciler, Şii İslam'ın katı bir yorumunu savunan ancak daha katı çizgideki din kardeşlerine kıyasla daha fazla siyasi çoğulculuğu destekleyen sağcı Şii bağlıların bir yelpazesini ifade eder. Buna rağmen büyük ölçüde teokrasinin sürmesini desteklerler."
 generic.Vilayat_e_Faqih:0 "£generic_Vilayat_e_Faqih_small Katı Çizgili Şii Devrimci"
 generic.Vilayat_e_Faqih_desc:0 "Katı çizgili Şii devrimciler, Şii İslam'ın katı bir yorumunu savunan aşırı sağcı ve militarist Şii bağlıların bir yelpazesini ifade eder. Sünnilere karşı büyük ölçüde olumsuz bir bakışları vardır ve Şii İslam'ın teokratik bir devlet içinde sürmesini güvence altına almaya çalışırlar."
 generic.Kingdom:0 "£generic_Kingdom_small Düzen Yanlısı Selefilik"
 generic.Kingdom_desc:0 "Vahhabilik ve Medhalilik gibi bazı Selefi düşünce akımları, radikal devrim ve silahlı cihat yerine mevcut düzenin korunmasını savunur. Bu Selefiler, Kutupçu cihatçıların köktenci ve hoşgörüsüz görüşlerini paylaşır, ancak genellikle şiddeti reddeder ve mevcut hükümetleri destekler. Uyumlu tutumları, İslamcılığın daha siyasi kollarının iktidarlarına yönelttiği tehditten korkan otoriter Arap devletleri arasında onları popüler kılar."
 generic.Caliphate:0 "£generic_Caliphate_small Selefi Cihatçılık"
 generic.Caliphate_desc:0 "Selefi cihatçılık, Seyyid Kutub'un öğretilerinden ilham alan, İslami siyasi ideolojinin aşırı katı, aşırı muhafazakâr ve köktenci bir kolunu ifade eder. Tüm İslam topraklarını fethetmeyi ve İslam hukukunun sert yorumuyla yönetmeyi amaçlarlar. İslam'ın diğer biçimlerini de azınlık dinlerini de tanımazlar ve hedeflerine ulaşmak için hiçbir şeyden çekinmezler."
 generic.Neutral_Muslim_Brotherhood:0 "£muslim_brotherhood_small Ilımlı İslamcılar"
 generic.Neutral_Muslim_Brotherhood_desc:0 "Ilımlı İslamcılık, İslam hukukunun sınırları içinde demokratik bir devlet kurmayı amaçlayan geniş bir İslami siyasi hareketler yelpazesini ifade eder."
 generic.Neutral_Autocracy:0 "£generic_Neutral_Autocracy_small Bağlantısız Otokratlar"
 generic.Neutral_Autocracy_desc:0 "Otokrasi, tüm gücün tek bir hükümdarın elinde toplandığı, demokratik olmayan, otoriter geniş bir ideolojiler yelpazesini ifade eder."
 generic.Neutral_conservatism:0 "£generic_Neutral_conservatism_small Muhafazakârlar"
 generic.Neutral_conservatism_desc:0 "Muhafazakârlık; geleneksel kültürün, birliğin ve istikrarlı bir yaşam tarzının önemini savunan, geniş bir ılımlı sağ ideolojiler yelpazesini ifade eder. Muhafazakârlar toplumsal ve ekonomik işlere devlet müdahalesine karşı çıkma eğilimindedir ve çoğunlukla daha az düzenlemenin halk için daha fazla toplumsal hareketlilik getireceğine inanır."
 generic.oligarchism:0 "£generic_oligarchism_small Oligarklar"
 generic.oligarchism_desc:0 "Oligarşi, kontrolün siyasi ve ekonomik elitlerden oluşan seçkin bir grubun eline verildiği bir iktidar yapısını ifade eder. Oligarşiler genellikle demokratik olmayan ve otoriter yapıdadır."
 generic.Neutral_Libertarian:0 "£generic_Neutral_Libertarian_small Liberteryenler"
 generic.Neutral_Libertarian_desc:0 "Liberteryenlik, özgürlüğü temel ilke olarak savunan geniş bir siyasi ideoloji ve hareket yelpazesini ifade eder. Liberteryenler genellikle toplumsal, siyasi ve ekonomik yaşamın tüm alanlarında, muhafazakârlardan daha fazla ölçüde sınırlı devlet müdahalesini destekler."
 generic.Neutral_green:0 "£generic_Neutral_green_small Yeşiller"
 generic.Neutral_green_desc:0 "Yeşil siyaset veya ekopolitika; şiddetsizliği, toplumsal adaleti, doğrudan demokrasiyi ve çevreciliği savunan geniş bir sol hareketler yelpazesini ifade eder."
 generic.neutral_Social:0 "£generic_neutral_Social_small Sosyalist Demokratlar"
 generic.Neutral_Communism:0 "£generic_Neutral_Communism_small Komünistler"
 generic.Neutral_Communism_desc:0 "Komünizm, kapitalist sistemin sona ermesiyle ortak bir işçi cennetinin kurulmasını savunan bir ideolojiyi ifade eder. Gerçekte komünist ülkeler kapitalist ekonomik sistemleri sürdürür ve çoğunlukla demokratik değildir."
 generic.Nat_Populism:0 "£generic_Nat_Populism_small Sağ Popülistler"
 generic.Nat_Populism_desc:0 "Sağ popülizm, halkı toplumu kontrol ettiği algılanan elitlere karşı güçlendirmeyi amaçlayan popülist ideolojinin belirli bir koludur. Sağ popülistler genellikle küreselleşme karşıtlığını, korumacılığı, yerlicilik, milliyetçiliği ve göçe karşı çıkışı destekler."
 generic.Nat_Fascism:0 "£generic_Nat_Fascism_small Faşistler"
 generic.Nat_Fascism_desc:0 "Faşizm, militarist tonlarla savunulan otoriter bir ultra milliyetçilik biçimidir. Faşizm, mutlak otoriteyi elinde tutan tek bir liderin başında olduğu tek partili bir devlet kurmayı amaçlar ve ulusal yeniden doğuşu teşvik etmek için şiddeti ve saldırgan yayılmacılığı destekler."
 generic.Nat_Autocracy:0 "£generic_Nat_Autocracy_small Askeri Cunta"
 generic.Nat_Autocracy_desc:0 "Askeri cuntalar, bir askeri liderler kurulunun yönettiği hükümetleri ifade eder. Askeri cuntalar çoğunlukla demokratik olmayan ve otoriter yapıdadır; çok geniş anlamda bir askeri diktatörlük veya stratokrasi biçimi sayılabilir."
 generic.Monarchist:0 "£generic_Monarchist_small Monarşistler"
 generic.Monarchist_desc:0 "Monarşist İdeoloji, Mutlak Monarşileri ifade eder."
 FULL_POLITICS_VIEW_BUTTON_TT:0 "Parti Görünümünü Genişlet"
 si_title_text:0 "Partiler ve Hareketler"
 si_title_text_tt:0 "§YMevcut Siyasi Yasalar:§!\nSeçim Var mı: [has_elections_check]\nSeçim Barajı: [?election_threshold|%0] [term_limit_text]"
 western_desc:0 "Batılı ve Batı yanlısı hükümetler, Sovyetler Birliği'nin çöküşünden bu yana egemen olan ABD merkezli Liberal Dünya Düzeni'ni korumaya çalışır. Dünya Bankası ve IMF gibi kurumlar aracılığıyla ekonomik liberalleşmeyi ve özelleştirmeyi teşvik ederler. Batı Bakış Açısına sahip ülkelerin büyük çoğunluğu çeşitli demokrasi biçimleridir; ancak statükodan yararlanan Batı yanlısı güçlü adam yönetimleri de bunların arkasındadır."
 emerging_desc:0 "Yükselen Bakış Açısına sahip hükümetler, özellikle Küresel Güney'de ve Sovyet Sonrası Alan'da, hâkim Liberal Dünya Düzeni'ni kendi alternatif kurumları ve çok kutuplu bir küresel siyaset anlayışıyla değiştirmeye çalışanlardır. Küreselleşmeye, yönetim biçimlerine ve iç politikaya yönelik tutumları çoğunlukla farklılık gösterir."
 salafist_desc:0 "Selefilik, ana akım Sünni İslam'ın aşırı muhafazakâr, hoşgörüsüz ve köktenci bir koludur. Vahhabi Körfez Monarşilerinin 20. yüzyılın ortalarından itibaren öğretileri için milyarlarca dolar fon sağlamasıyla öne çıkmıştır. Selefilik, Taliban, El Kaide ve IŞİD'de özellikle şiddetli biçimlere bürünmüştür."
 non_aligned_desc:0 "Bağlantısız hükümetler yönetim türleri ve alt ideolojileri bakımından büyük farklılık gösterir ve genellikle dış ittifaklarına çok pragmatik yaklaşır. Birçoğu yalnızca kendi ulusal bağımsızlığını veya diğer bölgesel hedeflerini ilerletmek ister. Diğerleri ise nüfuz mücadelesinde onları farklı yönlere çeken daha büyük güçler arasında kalmıştır."
