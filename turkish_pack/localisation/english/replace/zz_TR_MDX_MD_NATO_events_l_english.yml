l_english:
 NATO_decisions:0 "NATO Üyeliği"
 NATO_decisions_desc:0 "\n£MAIN_desctext_nato \n\n\n\n§YNATO§!, yani §YKuzey Atlantik Antlaşması Örgütü§!, birden fazla Kuzey Amerika ve Avrupa ülkesi arasındaki askerî bir ittifaktır. §YNATO§!, bağımsız üye devletlerin herhangi bir dış tarafın saldırısına karşılık karşılıklı savunma konusunda anlaştığı bir toplu savunma sistemi oluşturur.\n\nEkranın sol tarafındaki düğmeler görüntülenecek ulusu seçmenizi sağlar. Gösterilen bayraklar, başvuran ülkenin NATO'ya katılımını henüz onaylamamış ülkeleri gösterir."
 leave_NATO:0 "NATO'dan §YAyrıl§!"
 leave_NATO_desc:0 "Artık NATO'nun bir parçası olmakla ilgilenmiyoruz"
 denounce_Status_As_Major_Non_NATO_Ally:0 "NATO Dışı Büyük Müttefik Statüsünü §YReddet§!"
 denounce_Status_As_Major_Non_NATO_Ally_desc:0 "Artık NATO ittifakıyla bağlantılı olmakla ilgilenmiyoruz."
 become_NATO_aspirant:0 "NATO Aday Ülkesi §YOl§!"
 become_NATO_aspirant_desc:0 "NATO Aday Ülkeleri, NATO üyesi olmaya ilgi göstermiş devletlerdir. NATO'ya ilgi gösterdikten sonra, katılmadan önce ulaşmamız gereken hedefleri içeren bir Üyelik Eylem Planı alırız. Hedefler tamamlandığında, mevcut tüm NATO üyelerinin onayını almamızı gerektiren katılım görüşmelerine başlayabiliriz."
 finish_NATO_membership_action_plan:0 "Üyelik Eylem Planını §YTamamla§!"
 finish_NATO_membership_action_plan_desc:0 "NATO'nun bize verdiği Üyelik Eylem Planını tamamlayarak mevcut üyelerle katılım görüşmelerine başlayabiliriz. Mevcut her NATO üyesinin başvurumuzu onaylaması gerekir. Tüm üyeler başvurumuzu onaylayana kadar NATO adayı olarak kalırız."
 ratify_country_accession:0 "§Y[From.GetName]§! ülkesinin NATO Üyeliğini Onayla"
 ratify_country_accession_desc:0 "[From.GetName] Üyelik Eylem Planını tamamladı. Geriye yalnızca bizim ve diğer NATO üyelerinin katılımını onaylaması kalıyor; ardından tam NATO üyesi olacak."
 join_NATO:0 "NATO'ya §YKatıl§!"
 join_NATO_desc:0 "NATO'nun diğer tüm üyeleri NATO'ya katılımımızı onayladı. Artık ittifakın tam üyesi olabiliriz."
 show_non_ratified_countries:0 "Onaylamayan Ülkeleri §YGöster§!"
 show_non_ratified_countries_desc:0 "Burada katılımımızı henüz onaylamamış ülkelerin listesini görebilirsiniz. Onlarla ilişkileri iyileştirerek ülkelerin katılımınızı onaylamasını sağlayabilirsiniz."
 call_nato_to_arms:0 "NATO'yu Silaha §YÇağır§!!"
 call_nato_to_arms_desc:0 "Yabancı bir güç tarafından saldırıya uğradık. Artık NATO antlaşmasının 5. Maddesini işletebiliriz; yani müttefiklerimiz savunmamıza gelmek zorundadır."
 nato_enhance_forward_presence_brigade:0 "NATO E Tugayını §YKonuşlandır§!"
 nato_enhance_forward_presence_brigade_desc:0 "Son Kırım krizi Amerika Birleşik Devletleri'ni zor bir duruma soktu. E Tugayının konuşlandırılması, Rusların olası yeni saldırganlıklarını caydırmaya yardımcı olmalı."
 nato_deploy_turkish_brigade:0 "NATO S Tugayını §YKonuşlandır§!"
 nato_deploy_turkish_brigade_desc:0 "Türkiye NATO'ya bağlılığını yinelemeyi sürdürdü. Bölgeye yeni bir tugay konuşlandırarak minnettarlığımızı göstermeliyiz."
 NATO_apply_to_become_major_non_nato_ally:0 "NATO Dışı Büyük Müttefik Statüsü İste"
 NATO_apply_to_become_major_non_nato_ally_desc:0 "NATO üyeleriyle ve özellikle ittifakın liderliğiyle olan son derece olumlu ilişkilerimiz, mevcut durumumuza bağlı olarak NATO Dışı Büyük Müttefik statüsünü talep etmemiz için benzersiz bir fırsat sundu."
 RULE_CANT_LEAVE_NATO:0 "§RSaldırı altındayken NATO'dan ayrılamayız!§!"
 RULE_CANT_KICK_OUT_OF_NATO:0 "§RÜlkeleri NATO'dan atamayız!§!"
 RULE_CANT_ASSUME_LEADERSHIP_OF_NATO:0 "§RNATO'nun savaştaki liderliği asıl lidere kilitlidir!§!"
 NATO.1.t:0 "[From.GetNameDef] ve NATO"
 NATO.1.d:0 "[From.GetNameDef] NATO üyesidir. Ona savaş ilan edersek NATO'nun diğer üyelerini savaşa çağırma seçeneğine sahip olurlar. Bu, NATO'nun büyük bölümüyle savaşa girme ihtimalimizin yüksek olduğu anlamına gelir."
 NATO.1.a:0 "Anlaşıldı"
 NATO.2.t:0 "NATO Silaha Çagrilsin mi?"
 NATO.2.d:0 "Yabancı bir güç tarafından saldırıya uğradık. NATO üyesi olarak antlaşmanın 5. Maddesini işletebiliriz; bu da diğer NATO ülkelerinin bize yardım etmesini gerektirir."
 NATO.2.a:0 "NATO'yu Çağır"
 NATO.2.b:0 "Bunu biz hallederiz"
 NATO.3.t:0 "[From.GetNameDef] Yardim Istiyor!"
 NATO.3.d:0 "[From.GetNameDef] başka bir ülke tarafından saldırıya uğradı ve NATO'nun 5. Maddesini işletti. Bu, onların savaşında yardım etmemiz gerektiği anlamına geliyor"
 NATO.3.a:0 "Müttefiklerimize yardım etmeliyiz!"
 NATO.3.b:0 "Belki de karışmasak?"
 NATO.4.t:0 "NATO'nun Terhisi"
 NATO.4.d:0 "Bir NATO üyesine yönelik tehdit bertaraf edildiğine göre, bu ülkeler arasındaki askerî ittifak dağıtılabilir. Başka bir üye saldırıya uğrarsa NATO yeniden seferber olacaktır."
 NATO.4.a:0 "Tamam"
 NATO.5.t:0 "NATO Terhis Oluyor"
 NATO.5.d:0 "NATO üyesi devlete yönelik tehdit bertaraf edildiğine göre, bu ülkeler arasındaki askerî ittifak dağıtılabilir. Başka bir üye saldırıya uğrarsa NATO yeniden seferber olacaktır."
 NATO.5.a:0 "Tamam"
 NATO.6.t:0 "[From.GetNameDef] NATO'dan Ayriliyor"
 NATO.6.d:0 "[From.GetNameDef] hükümeti NATO'dan ayrılacağını duyurdu. İttifakın artık ihtiyaçlarını karşılamadığını ve eski müttefikleriyle birlikte çalışmaktan artık rahatsızlık duyduklarını belirttiler."
 NATO.6.a:0 "İlginç"
 NATO.7.t:0 "[From.GetNameDef] NATO Üyeligi Ariyor"
 NATO.7.d:0 "[From.GetNameDef] NATO üyesi olmaya ilgi gösterdi. Kendisine bir Üyelik Eylem Planı verilecek; ardından yeni üye olabilmek için mevcut tüm NATO üyelerinin onayını alması gerekecek."
 NATO.7.a:0 "Yeni müttefikler mi?"
 NATO.8.t:0 "[From.GetNameDef] NATO'ya Katiliyor"
 NATO.8.d:0 "[From.GetNameDef] NATO'ya katılmak üzere kabul edildi. Artık askerî ittifakın bir parçası; müttefiklerini savunmak için savaşa katılacak ve yeni müttefikleri de onu savunmaya hazır."
 NATO.8.a:0 "İlginç"
 NATO.20.t:0 "NATO'da Liderlik El Degistiriyor"
 NATO.20.d:0 "Amerika Birleşik Devletleri kendi çöküşüyle boğuşurken artık ittifaka önderlik edemiyor. NATO'nun geri kalan üyeleri, ittifakı ayakta tutmak için yeni bir liderin arkasında saf tuttu."
 NATO.20.a:0 "İttifak ayakta kalıyor"
 NATO_join_tt:0 "Sizinle diğer tüm §BNATO§! üyeleri arasında karşılıklı bir §Yilişki artışı§! eklenecek.\nTüm §BNATO§! üyeleriyle karşılıklı §Yaskerî geçiş hakkı§! eklenecek.\n"
 NATO_leave_tt:0 "Sizinle diğer ülkeler arasındaki karşılıklı §Yilişki artışı§! kaldırılacak ve diğer tüm §BNATO§! üyelerine §Yaskerî geçiş hakkınızı§! kaybedeceksiniz.\nTüm §BNATO§! üyelerinin size yönelik §Ygörüşü§! kötüleşecek.\n"
 NATO.9.t:0 "NATO'ya Davet"
 NATO.9.d:0 "Amerika Birleşik Devletleri ve müttefikleri bize yaklaşarak özgürlüğü ve dünya barışını korumak için karşılıklı çıkar adına NATO'ya katılmamız çağrısında bulundu."
 NATO.9.a:0 "Kabul ediyoruz!"
 NATO.9.b:0 "Buna vaktimiz yok."
 NATO.10.t:0 "[From.GetNameDef] NATO'ya katiliyor!"
 NATO.10.d:0 "[From.GetNameDef] yetkilileri büyükelçilerimizle iletişime geçerek kısa süre içinde NATO'ya katılacaklarını doğruladı."
 NATO.10.a:0 "Özgür Dünya için!"
 NATO.11.t:0 "[From.GetNameDef] NATO üyeligini reddediyor"
 NATO.11.d:0 "[From.GetNameDef] bize NATO üyeliğinin çıkarlarıyla örtüşmediğini ve yakın zamanda ittifaka katılmayacağını bildirdi."
 NATO.11.o1:0 "Çok yazık."
 NATO.14.t:0 "[From.GetNameDef] NATO üyeligi ariyor"
 NATO.14.d:0 "[From.GetNameDef] heyetleri, ülkelerinin Kuzey Atlantik Antlaşması Örgütü'ne katılmaya istekli olduğunu giderek daha sık dile getiriyor. Kongre son derece önemli siyasi meselelerle meşgulken onları şimdiye kadar boş vaatlerle oyaladık; ancak artık Dış İlişkiler komitelerine, [From.GetName] ülkesini saflarımıza kabul etme talebini NATO'ya sunmayı düşünüp düşünmediğimizi bildirmemiz gerekiyor."
 NATO.14.a:0 "Eğlence şimdi başlıyor."
 NATO.14.b:0 "Bu çıkarlarımıza uymuyor."
 NATO.15.t:0 "[USA.GetNameDef] NATO'ya Katilma Talebini Reddetti"
 NATO.15.d:0 "[USA.GetNameDef] NATO'ya katılma talebimizi reddetti."
 NATO.15.a:0 "Hayal kırıklığı."
 NATO.16.t:0 "[From.GetName] NATO'dan ayriliyor!"
 NATO.16.d:0 "[From.GetNameDef] lideri [From.GetLeader], bugün ülkenin Kuzey Atlantik Antlaşması Örgütü'nden ve bağlı ittifaklarından derhal çekilme niyetini duyurdu. Bu, askerî paktı zayıflatacak."
 NATO.16.o1:0 "İyi seçim"
 NATO.16.o2:0 "İlginç"
 NATO.17.t:0 "Siyasette Kayma"
 NATO.17.d:0 "Son zamanlarda demokratik olmayan bir siyasete kaymamız NATO'nun bizi terk etmesine yol açtı. Sözde demokrasiyle ilgili saçma şartlarını artık karşılamıyoruz. Bu anlayışı reddediyoruz ve NATO'suz ve onların sahte korumasız daha iyi durumdayız!"
 NATO.17.o1:0 "Onlarsız Daha İyiyiz!"
 NATO_CSTO.1.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi'nin Sürdürülmesi Önerildi"
 NATO_CSTO.1.d:0 "Avrupa'da Konvansiyonel Silahlı Kuvvetler Antlaşması, KGAÖ üyeleri ile NATO'nun Avrupalı üyelerinin Avrupa'da konuşlandırdığı konvansiyonel kuvvetleri sınırlamayı amaçlar. Varşova Paktı ile yapılan önceki anlaşmaya dayanan bu öneri, Avrupa'da olası gelecekteki çatışmaları önlemek için ilk taslakları pekiştirmeyi hedefliyor."
 NATO_CSTO.1.a:0 "Kabul edeceğiz."
 NATO_CSTO.1.b:0 "Çıkarımıza uymuyor."
 NATO_CSTO.2.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi Kabul Edildi"
 NATO_CSTO.2.d:0 "[FROM.GetName] büyükelçileri bize ülkelerinin anlaşmayı imzalamaya istekli olduğunu bildirdi. Biraz beklenmedikti ama batı diplomasisi için kesinlikle hoş bir gün."
 NATO_CSTO.2.a:0 "Memnuniyetle karşılanan gelişme."
 NATO_CSTO.3.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi Reddedildi"
 NATO_CSTO.3.d:0 "[FROM.GetName] büyükelçileri bize ülkelerinin anlaşmayı imzalama fikrini reddettiğini bildirdi. Beklenen bir durum olsa da batı diplomasisi için yine de kara bir gün."
 NATO_CSTO.3.a:0 "Sanki gerçekten bir tehdit oluşturabilirlermiş gibi..."
 NATO_CSTO.100.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi Imzalandi"
 NATO_CSTO.100.d:0 "AKKA Antlaşması, 1990'da, Soğuk Savaş'ın tam sonuna doğru NATO ve Varşova Paktı tarafından imzalandı."
 NATO_CSTO.100.a:0 "Umalım ki kalıcı olsun."
 NATO_CSTO.100.b:0 "Akıllıca bir seçimdi."
 NATO_CSTO.100.c:0 "Avrupa'da barış yüzyılı mı?"
 NATO_CSTO.101.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi Kesin Olarak Reddedildi"
 NATO_CSTO.101.d:0 "AKKA Antlaşması, 1990'da, Soğuk Savaş'ın tam sonuna doğru NATO ve Varşova Paktı tarafından imzalandı."
 NATO_CSTO.101.a:0 "Kendi başlarına dert açıyorlar."
 NATO_CSTO.101.b:0 "Uygun gördüğümüzü yapacağız."
 NATO_CSTO.101.c:0 "Ufukta yeni bir Soğuk Savaş mı?"
 NATO_CSTO.103.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi Geçersiz Kilindi"
 NATO_CSTO.103.d:0 "AKKA Antlaşması ve uzantısı artık geçersiz kılınıyor. Uzmanlar sonucu tahmin etmekte zorlanıyor, ancak bir şey kesin: Avrupa'nın üzerinde fırtına toplanıyor."
 NATO_CSTO.103.a:0 "Onlara asla güvenilemezdi."
 NATO_CSTO.103.b:0 "Barış görüşmelerinin sonu bu."
 NATO_CSTO.103.c:0 "NATO saldırıya mı geçiyor?"
 NATO_CSTO.104.t:0 "Avrupa'da Konvansiyonel Silahli Kuvvetler Antlasmasi Geçersiz Kilindi"
 NATO_CSTO.104.d:0 "AKKA Antlaşması ve uzantısı artık geçersiz kılınıyor. Uzmanlar sonucu tahmin etmekte zorlanıyor, ancak bir şey kesin: Avrupa'nın üzerinde fırtına toplanıyor."
 NATO_CSTO.104.a:0 "Rusya ile yapılan her anlaşma, basıldığı kâğıttan daha az değerlidir."
 NATO_CSTO.104.b:0 "Biz sadece yeniden silahlanıyoruz."
 NATO_CSTO.104.c:0 "KGAÖ, ısırabileceğinden fazlasını ısırmaya çalışıyor olabilir."
