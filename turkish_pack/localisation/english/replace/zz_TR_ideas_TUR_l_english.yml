 fishing_sites_3:0 "Balıkçılık Sektörü"
 fishing_sites_3_desc:0 "Balıkçılık sektörü, balık ya da balık ürünlerinin avlanması, yetiştirilmesi, işlenmesi, korunması, depolanması, taşınması, pazarlanması ya da satışıyla ilgili her türlü sektörü veya faaliyeti kapsar. Gıda ve Tarım Örgütü tarafından rekreasyonel, geçimlik ve ticari balıkçılık ile ilgili avlama, işleme ve pazarlama sektörlerini içerecek şekilde tanımlanır. Ticari faaliyet, balık ve diğer deniz ürünlerinin insan tüketimine ya da diğer endüstriyel süreçlerde girdi olarak sunulmasını amaçlar.\n\n§YBalıkçılık Sektörü Seviyesi: §Gİyi§!"
