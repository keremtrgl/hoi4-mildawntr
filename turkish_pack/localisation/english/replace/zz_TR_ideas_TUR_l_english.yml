 passaport_strong:0 "Güçlü Türk Pasaportu"
 passaport_strong_desc:0 "Halkımız istediği her yere seyahat edebilmeli, bunu hak ediyor."
 passaport:0 "Türk Pasaportu"
 passaport_desc:0 "Halkımız istediği her yere seyahat edebilmeli, bunu hak ediyor."
 unions_of_the_state:0 "Devletin Sendikaları"
 unions_of_the_state_desc:0 "Sendika, çoğu zaman kısaca birlik olarak da anılan, mesleğin bütünlüğünü korumak, güvenlik standartlarını iyileştirmek ve işçilerin örgütlenmesiyle elde edilen artan pazarlık gücü sayesinde daha iyi ücret, sosyal hak ve çalışma koşulları elde etmek gibi pek çok ortak hedefe ulaşmak için bir araya gelen işçilerin oluşturduğu bir örgüttür. Sendikalar genellikle resmî örgütlenmelerini, genel merkezlerini ve hukuk ekiplerini düzenli aidatlarla finanse eder."
 pkk_terror_idea_low:0 "PKK İsyanı"
 pkk_terror_idea_low_desc:0 "1978'den bu yana Kürdistan İşçi Partisi (PKK) ve müttefik sol gruplar, Türkiye'nin Kürt illeri için kendi kaderini tayin hakkı talebiyle Türk hükümetine karşı büyük bir silahlı isyan yürütüyor. Sert baskılara ve liderleri Abdullah Öcalan'ın 1999'da yakalanmasına rağmen çatışma hâlâ tüm şiddetiyle sürüyor; ülkenin halklarında derin bir travma bırakmış ve sonu görünmüyor."
 militarize_the_workers:0 "Silahlı İşçiler"
 militarize_the_workers_desc:0 "İşçiler, yoldaşlar ve köylüler sizi isyana çağırıyor. Bu kapitalist düzeni birlikte yeneceğiz."
 prepare_for_war:0 "Savaşa Hazırlık"
