 TUR_6_arrows:0 "Altı Ok"
 TUR_6_arrows_desc:0 "İdeolojinin altı temel direği vardır: Cumhuriyetçilik, Milliyetçilik, Halkçılık, Laiklik, Devletçilik ve İnkılapçılık (ya da "Devrimcilik"). Bunlar birlikte, Atatürk'ün bizzat geleneksel düşünceli Türk-Müslüman halk arasında yaygın olan ve başta ulemanın bağnazlığından kaynaklandığını düşündüğü toplumsal despotizmi kırmak için siyasi despotizmi kullanma yöntemi olarak tanımladığı bir tür Jakobenliği temsil eder. İlkeler zamanla değiştirilemez ve kutsal kabul edildi."
 solar_energy:0 "Güneş Enerjisi"
 solar_energy_desc:0 "Güneş enerjisi, güneşten gelen ışınım ve ısının güneşle ısıtma, fotovoltaik, güneş termal enerjisi, güneş mimarisi, ergimiş tuz santralleri ve yapay fotosentez gibi sürekli gelişen bir dizi teknolojiyle kullanılmasıdır."
 wind_rose_energy:0 "Rüzgâr Enerjisi"
 wind_rose_energy_desc:0 "Rüzgâr gücü ya da rüzgâr enerjisi, elektrik üretmek için jeneratörleri döndüren rüzgâr türbinleri aracılığıyla rüzgârdan mekanik güç elde edilmesidir. Rüzgâr enerjisi, fosil yakıtları yakmaya kıyasla çevreye çok daha az etkisi olan popüler, sürdürülebilir ve yenilenebilir bir enerji kaynağıdır."
 hydroelectiricty:0 "Hidroelektrik"
 hydroelectiricty_desc:0 "Hidroelektrik ya da hidroelektrik enerji, su gücünden üretilen elektriktir. 2015'te hidroelektrik dünyadaki toplam elektriğin yüzde 16,6'sını ve tüm yenilenebilir elektriğin yüzde 70'ini üretti ve önümüzdeki 25 yıl boyunca her yıl yaklaşık yüzde 3,1 artması bekleniyordu."
 EU_approach:0 "Avrupa Yaklaşımı"
 TURAN_approach:0 "Turan Yaklaşımı"
 laws_of_bor:0 "Bor Sahaları"
 laws_of_bor_desc:0 "Bor, B simgesi ve 5 atom numarasıyla bir kimyasal elementtir. Yıldız nükleosentezi ile değil, tamamen kozmik ışın parçalanması ve süpernovalarla oluşan bor, Güneş Sistemi'nde ve yer kabuğunda az bulunan bir elementtir. Yer kabuğunun ağırlıkça yaklaşık binde birini oluşturur. Bor, doğada daha yaygın bulunan bileşikleri olan borat minerallerinin suda çözünmesiyle yeryüzünde yoğunlaşır. Bunlar boraks ve kernit gibi evaporitler olarak endüstriyel ölçekte çıkarılır. Bilinen en büyük bor yatakları, bor minerallerinin en büyük üreticisi olan Türkiye'dedir."
