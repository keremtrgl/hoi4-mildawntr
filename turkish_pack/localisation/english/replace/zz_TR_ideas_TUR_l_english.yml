 TUR_republicanism:0 "Cumhuriyetçilik"
 TUR_republicanism_desc:1 "Hakkıdır, Hakk'a tapan milletimin istiklâl!"
 TUR_nationalism:0 "Milliyetçilik"
 TUR_nationalism_desc:1 "Korkma, sönmez bu şafaklarda yüzen al sancak; sönmeden yurdumun üstünde tüten en son ocak. O benim milletimin yıldızıdır, parlayacak; o benimdir, o benim milletimindir ancak."
 TUR_populism:0 "Halkçılık"
 TUR_populism_desc:1 "Kim bu cennet vatanın uğruna olmaz ki fedâ? Şühedâ fışkıracak toprağı sıksan, şühedâ!"
 TUR_reformism:0 "İnkılapçılık"
 TUR_reformism_desc:1 "Garbın âfâkını sarmışsa çelik zırhlı duvar, benim iman dolu göğsüm gibi serhaddim var. Ulusun, korkma! Nasıl böyle bir imanı boğar, medeniyet dediğin tek dişi kalmış canavar?"
 TUR_revolutionism:0 "İnkılapçılık"
 TUR_revolutionism_desc:1 "Dalgalan sen de şafaklar gibi ey şanlı hilâl! Olsun artık dökülen kanlarımın hepsi helâl. Ebediyyen sana yok, ırkıma yok izmihlâl!"
