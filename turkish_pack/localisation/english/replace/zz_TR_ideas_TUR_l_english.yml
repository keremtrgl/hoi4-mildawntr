 kurds_want_independence:0 "Kürt Meselesi"
 kurds_want_independence_desc:0 "Türkiye'de ağırlıklı olarak ülkenin güneydoğusunda yoğunlaşmış büyük bir Kürt azınlık yaşıyor. Cumhuriyet tarihi boyunca Kürtler yoksulluk, şiddet ve ayrımcılıktan orantısız şekilde etkilendi. Kürt bölgelerindeki durumu iyileştirmezsek pek çoğu PKK gibi terör örgütlerinin kucağına itilebilir."
 protest_thingy:0 "Siyasi Baskı"
 protest_thingy_desc:0 "Bazı yabancı ülkeler soykırım yaptığımızı iddia eden diplomatik bir protesto notası verdiği için bir süre askerî operasyon düzenleyemiyoruz."
 treat_wounds:0 "Son Saldırının Yaralarını Sarmak"
 treat_wounds_desc:0 "Son saldırıda ağır hasar aldık. Her şeyi bir kenara bırakıp hasarı onarmaya odaklanma zamanı."
