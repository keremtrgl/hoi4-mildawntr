 tsk_seref_madalyonu:0 "TSK Şeref Madalyası"
 tsk_seref_madalyonu_desc:0 "Türk Silahlı Kuvvetleri Şeref Madalyası, 1967'den bu yana Türk Silahlı Kuvvetleri'nin başarılı personeline verilmektedir. Altın madalya bir savaşın sevk ve idaresinde ve kazanılmasında önemli rol oynayanlara; gümüş madalya ise kendi hayatlarını tehlikeye atarak tehlikedeki insanları ve birlikleri kurtaran Türk ve yabancı askerlere ve sivillere verilir."
 tsk_basari_madalyonu:0 "TSK Başarı Madalyası"
 tsk_basari_madalyonu_desc:0 "Türk Silahlı Kuvvetleri Başarı Madalyası, 1967'den bu yana Türk Silahlı Kuvvetleri'nin başarılı personeline verilmektedir. Savaşta önemli görevleri yerine getirmede olağanüstü başarı gösterenlere; barışta ise hizmetteki başarısı beklenenin çok üzerinde olanlara verilir."
 tsk_hizmet_madalyonu:0 "TSK Hizmet Madalyası"
 tsk_hizmet_madalyonu_desc:0 "Türk Silahlı Kuvvetleri Hizmet Madalyası, 1967'den bu yana Türk Silahlı Kuvvetleri'nin başarılı personeline verilmektedir. Savaşta ve barışta, görevlerini üstün gayretle yerine getirirken görev sebebiyle yaralanan ve Türk Silahlı Kuvvetleri için iftihar vesilesi olan Türk ve yabancı askerlere verilir."
 tsk_ustun_cesaret_madalyonu:0 "TSK Üstün Cesaret ve Feragat Madalyası"
 tsk_ustun_cesaret_madalyonu_desc:0 "Türk Silahlı Kuvvetleri Üstün Cesaret ve Feragat Madalyası, son derece zor koşullar altında sorumluluklarını ve görevlerini başarıyla yerine getiren askerlere Türk Silahlı Kuvvetleri tarafından verilen bir madalyadır. Üç parçadan oluşan madalya bronzdandır ve üzerinde görev yapan bir askerin resmi bulunur."
 tsk_ustun_hizmet_madalyonu:0 "TSK Üstün Hizmet Madalyası"
 tsk_ustun_hizmet_madalyonu_desc:0 "İlk kez 1967'de ihdas edilen ve 1983'te bugünkü şeklini alan Türk Silahlı Kuvvetleri Üstün Hizmet Madalyası; hizmeti emsallerini çok aşan silahlı kuvvetler mensuplarına, silahlı kuvvetlerin envanteri için araç ve gereç icat eden ya da geliştirenlere ve Türk ve yabancı asker ve sivillere, barışta ve savaşta gösterdikleri fedakârlık, kahramanlık ve üstün performansın karşılığı olarak verilir."
 trait_TUR_gulen_champion:0 "Gülenist Şampiyon"
 trait_TUR_gulen_champion_desc:0 "Bu komutanın, misyonu resmî devlet ideolojisi olan Kemalizmi yok etmek olan Gülen örgütüyle bağlantıları var."
 tsk_nato_officer:0 "NATO Yanlısı Subay"
 tsk_nato_officer_desc:0 "Bu komutanın NATO ile ilişkileri çok iyi; NATO destekli bir darbede ya da NATO tatbikatlarında yer alabilir."
