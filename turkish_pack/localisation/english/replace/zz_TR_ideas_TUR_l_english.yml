 globalization_of_turkey:0 "Türkiye'nin Küreselleşmesi"
 globalization_of_turkey_desc:0 "Aşırı milliyetçilik bizi tedirgin etti. Dünyadaki tüm ırklar ve tüm insanlar eşit olmalı. Yaşasın halkçılık!"
 turkish_union_front:0 "Birlik Cephesi"
 turkish_union_front_desc:0 "Cephemiz Halk Cephesidir. Halkımızın istediği budur. Atatürk'ün dediği gibi, kurduğumuz yeni sistemle ülkemizi yüksek seviyelere çıkaracağız."
