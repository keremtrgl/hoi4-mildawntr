 ulkist_paramilitaries:0 "Silahlı Ülkücü Paramiliterler"
 ulkist_paramilitaries_desc:0 "Milliyetçiler silahlı; bu sayede ülkemiz herhangi bir işgal tehdidi altında olduğunda bu silahlı güçler görevlerini yerine getirecek ve ortaya çıkan her düşmanı kovarak istikrarı sağlayacak."
 islamic_cooperation_and_ulkism:0 "Ülkücü-İslami İşbirliği"
 islamic_cooperation_and_ulkism_desc:0 "İslam ülkücülüğün içindedir. Bu yüzden İslamcılık güç kazanmalı ve ülkücülükle iyi bir işbirliği yapmalı. Bunların hepsi halkımızın huzuru için."
 islamic_cooperation_and_ulkism_2:0 "Ülkücü-İslami İşbirliği"
 islamic_cooperation_and_ulkism_2_desc:0 "İslam ülkücülüğün içindedir. Bu yüzden İslamcılık güç kazanmalı ve ülkücülükle iyi bir işbirliği yapmalı. Bunların hepsi halkımızın huzuru için."
 islamic_cooperation_and_ulkism_3:0 "Ülkücü-İslami İşbirliği"
 islamic_cooperation_and_ulkism_3_desc:0 "İslam ülkücülüğün içindedir. Bu yüzden İslamcılık güç kazanmalı ve ülkücülükle iyi bir işbirliği yapmalı. Bunların hepsi halkımızın huzuru için."
 ulkist_neutrality:0 "Ülkücü Tarafsızlık"
 ulkist_neutrality_desc:0 "Ülkücü ideolojinin tarafsızlığını benimseyerek ülkemizin başına kötü bir şey gelmesini önleyeceğiz. Savaş naraları atan ülkeler mutlak bir çöküşle sonuçlanır."
 kemalist_promotement:0 "Kemalizmin Teşviki"
 kemalist_promotement_desc:0 "Kemalizm gücünü kaybetmiş bir varlığa dönüştü. Kemalizmi derinden etkileyen kötü durumdan çıkararak onu yeniden faydalı hâle getirmeliyiz."
 islamic_appeasement:0 "İslamcıların Gönlünü Almak"
 islamic_appeasement_desc:0 "Ülkemizdeki İslamcılara karşı nazik olmalıyız. Onlara kötü davranmamız ülkedeki istikrarı ve gücü bozacak."
 ulkist_democratic_constitution:0 "Demokrasiden Etkilenen Anayasa"
 ulkist_democratic_constitution_desc:0 "Anayasa demokrasiye göre düzenlenmesi gerektiği için ana maddelerde demokratik unsurları kullanarak anayasamızı iyi seviyelere çıkaracağız."
 local_anti_terroristic_forces:0 "Faaliyete Geçirilen Yerel Terörle Mücadele Kuvvetleri"
 local_anti_terroristic_forces_desc:0 "Yerel terörle mücadele örgütleri ve kuvvetleri olmalı. Yerel olarak ortaya çıkabilecek bir sorunun tüm ülkenin sorunu hâline gelmesi oldukça mümkün ve olağan."
 controlling_the_society:0 "Kontrol Altındaki Toplum"
 controlling_the_society_desc:0 "Toplumlar kendini kaybetme eğilimine girerse müdahale gereklidir. Bu yüzden bu müdahalede gücümüzü kullanarak istikrarı sağlayacağız."
 blooded_eyes:0 "İntikam Kanı"
 blooded_eyes_desc:0 "Başımıza kötü şeyler gelmesine neden olan herkesten intikam alacağız. Bu intikam duygusuyla başarının gücüne hâkim olacağız."
 counter_pentagon_intelligence:0 "Pentagon'a Karşı İstihbarat"
 counter_pentagon_intelligence_desc:0 "Pentagon ülkemizdeki dijital ağlar aracılığıyla bilgi topluyor. Ülkemiz bu dijital ağları çözmek için MİT'i seferber etti. Bu Pentagon etkisinden kurtulma zamanı geldi!"
 kemalist_nationalism_ulkist_model:0 "Ülkücü-Kemalist Milliyetçilik Modeli"
 islamic_nationalism_ulkist_model:0 "Ülkücü-İslami Milliyetçilik Modeli"
 diciplined_forces:0 "Disiplinli Kemalist Silahlı Kuvvetler"
 diciplined_forces_desc:0 "Kemalizmin orduda sonsuza dek kalacağını ilan ettik. Ordudaki mevcut disiplin mutlaka korunmalı ve yanında Kemalizmin unsurları da bulunmalı."
 well_known_Qur_an:0 "İyi Bilinen Kur'an"
 well_known_Qur_an_desc:0 "Ülkedeki herkes Kur'an'ı biliyor; bu sayede insanlar genellikle İslamcıların ve din tüccarlarının etkisi altında kalmıyor. Bu sayede ülkemizde yenilik muazzam bir şekilde yaşayabilir."
 ataturk_culture:0 "Kemalist Kültür"
 ataturk_culture_desc:0 "Kemalizm ideolojisini kültürel bir değere dönüştürerek halkımızı yeniliğe ve bilime açık hâle getirdik; bu da millî kalkınmanın maliyetini düşürecek."
 banned_nihal_atsizs_books:0 "Yasaklanan Nihal Atsız Kitapları"
 banned_nihal_atsizs_books_desc:0 "Nihal Atsız'ın milliyetçiliği dinî değerlerimize ve dinî maneviyatımıza zarar verecek; bu yüzden bu milliyetçi megalomanın kitaplarını kısıtlamak faydalı."
 islamic_science:0 "İslami Bilim"
 islamic_science_desc:0 "İslami bilim kalkınma için önemli şeylerden biridir. İslam, zorluklar karşısında her zaman bir güç kaynağı olmuş bir dindir."
 islamic_army_traditions_1:0 "İslami Askeri Gelenekler"
 islamic_army_traditions_1_desc:0 "Orduda İslam mutlaka bir gelenek olarak yaşamalı. Çünkü ordu İslami geleneklerde kalmazsa manevi açıdan çöküş yaşanır."
 islamic_army_traditions_2:0 "İslami Askeri Gelenekler"
 islamic_army_traditions_2_desc:0 "Orduda İslam mutlaka bir gelenek olarak yaşamalı. Çünkü ordu İslami geleneklerde kalmazsa manevi açıdan çöküş yaşanır."
 islamic_army_traditions_3:0 "İslami Askeri Gelenekler"
 islamic_army_traditions_3_desc:0 "Orduda İslam mutlaka bir gelenek olarak yaşamalı. Çünkü ordu İslami geleneklerde kalmazsa manevi açıdan çöküş yaşanır."
 land_fort_planting:0 "Deneysel Kara Tahkimatları"
 coastal_fort_planting:0 "Deneysel Kıyı Tahkimatları"
 efficent_nationalism:0 "Etkili Milliyetçilik"
 efficent_nationalism_desc:0 "Milliyetçilik faydalı ve ülkemizi güçlü kılacak türden olmalı."
 golden_wolfs:0 "Kurtların Altın Çağı"
 golden_wolfs_desc:0 "Şimdi kurtların altın çağı. Bu çağdan sonra kurtlar birleşik bir sürü hâline gelerek gelişecek."
 mu_island_theory:0 "Mu Kıtası Teorisi"
 mu_island_theory_desc:0 "Mu kıtasının batmasının ardından Türkler zor zamanlar geçirdi, ama hayata tutundu. Bu olay Türklerin zor durumlardan çıkma potansiyeline sahip olduğunu gösteriyor."
 defensive_intelligence:0 "Savunma İstihbaratı"
 defensive_intelligence_desc:0 "Ülkemizin verilerine sızıp ele geçirmelerine izin vermeyeceğiz; bu yüzden ülkemizin dijital ağlarını geliştireceğiz."
 counter_pentagon_intelligence_2:0 "Pentagon'a Karşı İstihbarat"
 counter_pentagon_intelligence_2_desc:0 "Pentagon ülkemizdeki dijital ağlar aracılığıyla bilgi topluyor. Ülkemiz bu dijital ağları çözmek için MİT'i seferber etti. Bu Pentagon etkisinden kurtulma zamanı geldi!"
 powerized_mit:0 "Güçlendirilmiş Millî İstihbarat Teşkilatı"
 powerized_mit_desc:0 "MİT, Türkiye Cumhuriyeti'nin ülke ve millet bütünlüğüne, varlığına, bağımsızlığına, güvenliğine, anayasal düzenini ve millî gücünü oluşturan tüm unsurlarına karşı içeriden ve dışarıdan yöneltilen mevcut ve muhtemel tehditler hakkında istihbarat toplamakla görevlidir. MİT bu istihbaratı gerektiğinde Cumhurbaşkanına, Genelkurmay Başkanına, Millî Güvenlik Kurulu Genel Sekreterine ve ilgili diğer devlet kuruluşlarına iletmekle yükümlüdür."
 counter_pentagon_intelligence_3:0 "Pentagon'a Karşı İstihbarat"
 counter_pentagon_intelligence_3_desc:0 "Pentagon ülkemizdeki dijital ağlar aracılığıyla bilgi topluyor. Ülkemiz bu dijital ağları çözmek için MİT'i seferber etti. Bu Pentagon etkisinden kurtulma zamanı geldi!"
 ai_computing:0 "Yapay Zekâ Hesaplama"
 ai_computing_desc:0 "Yapay zekâ (YZ), insanlar dahil hayvanların sergilediği doğal zekânın aksine makinelerin sergilediği zekâdır. YZ araştırmaları, çevresini algılayan ve hedeflerine ulaşma şansını en üst düzeye çıkaran eylemlerde bulunan her türlü sistemi ifade eden akıllı ajanların incelendiği çalışma alanı olarak tanımlanmıştır."
 coding_offices:0 "Yazılım Ofisleri"
 unified_artifical_intelligence:0 "Yapay Zekâ Diyarı"
 unified_artifical_intelligence_desc:0 "Yapay zekâ (YZ), insanlar dahil hayvanların sergilediği doğal zekânın aksine makinelerin sergilediği zekâdır. YZ araştırmaları, çevresini algılayan ve hedeflerine ulaşma şansını en üst düzeye çıkaran eylemlerde bulunan her türlü sistemi ifade eden akıllı ajanların incelendiği çalışma alanı olarak tanımlanmıştır."
 independence_happiness:0 "Bağımsızlığın Mutluluğu"
 independence_happiness_desc:0 "Ülkemizin bağımsız olması çok sevindirici ve gurur verici. Bu sayede istikrar her zaman bizimle olacak."
 independent_state_forever:0 "Sonsuza Dek Bağımsız mı?"
 independent_state_forever_desc:0 "Ülkemizin bağımsız olması çok sevindirici ve gurur verici. Bağımsızlığımız her zaman sürmeli; gelişemezsek bağımsızlığımız yok olur. Bu yüzden istikrarlı bir kalkınmayı sürdüreceğiz."
 turkish_massive_construction_program:0 "Türk İnşaat Programı"
 turkish_massive_construction_program_desc:0 "Yeni gelen insanların yeni konutlarda yaşaması gerekiyor. Bu yüzden Türk gayrimenkul geliştiricilerine para yatıracak ve ülkemizin her yerinde binalar inşa edilmesini sağlayacağız."
 unshakable_economy:0 "Sarsılmaz Ekonomi"
 unshakable_economy_desc:0 "Ülkemize yeni getirdiğimiz dinamiklerle ekonomimizin parçalanmasını ve zayıflamasını önleyeceğiz; böylece asla bir ekonomik krize girmeyeceğiz."
 tasted_the_crisis:0 "Krizin Mirası"
 tasted_the_crisis_desc:0 "Türkiye Cumhuriyeti devleti pek çok kriz gördü ve atlattı. Buradan gelecekteki krizleri de atlatacağını, ekonomimizin dayanıklı olduğunu ve kırılgan olmadığını anlayabiliriz."
 limited_tourism:0 "Sınırlı Turizm"
 limited_tourism_desc:0 "Turizmi sınırlandırarak yabancı güçlerin adamlarının ülkemize gelmesini engelleyeceğiz; ülkemiz de bu sayede güven ve itibar kazanacak."
 resistance_against_capitalism:0 "Sermayeye Karşı Direniş"
 resistance_against_capitalism_desc:0 "Sermayeyi ortadan kaldırarak ve kapitalistlerin insanları sömürmesine izin vermeyerek işçilerimizin ve çalışanlarımızın devlet güvencesini sağlayacağız."
 local_investors_action:0 "Desteklenen Yerel Yatırımcılar"
 local_investors_action_desc:0 "Yerel yatırımcılar yatırımlarını ülke içinde yapmalı ve parayı yalnızca ülkede tutmalı. Yerel yatırımcıların böyle bir işlem yapabilmesi için ülkemizin bürokrasisi tarafından desteklenmesi gerekiyor. Bu destek maddi ve manevi kapsamda olmalı."
 local_investors_action_2:0 "Desteklenen Yerel Yatırımcılar"
 local_investors_action_2_desc:0 "Yerel yatırımcılar yatırımlarını ülke içinde yapmalı ve parayı yalnızca ülkede tutmalı. Yerel yatırımcıların böyle bir işlem yapabilmesi için ülkemizin bürokrasisi tarafından desteklenmesi gerekiyor. Bu destek maddi ve manevi kapsamda olmalı."
 local_investors_action_3:0 "Desteklenen Yerel Yatırımcılar"
 local_investors_action_3_desc:0 "Yerel yatırımcılar yatırımlarını ülke içinde yapmalı ve parayı yalnızca ülkede tutmalı. Yerel yatırımcıların böyle bir işlem yapabilmesi için ülkemizin bürokrasisi tarafından desteklenmesi gerekiyor. Bu destek maddi ve manevi kapsamda olmalı."
 dynamical_change_of_wages:0 "Ücretlerin Dinamik Değişimi"
 dynamical_change_of_wages_desc:0 "Toplumsal sınıflar arasındaki parasal dengesizlikleri ortadan kaldırarak, işe yarayabilecek reformlarla her toplumsal sınıfın gelirini eşitlemeye daha da yaklaşacağız."
 bor_mining_facilities:0 "Bor Sahaları"
 bor_mining_facilities_desc:0 "Bor, B simgesi ve 5 atom numarasıyla bir kimyasal elementtir. Yıldız nükleosentezi ile değil, tamamen kozmik ışın parçalanması ve süpernovalarla oluşan bor, Güneş Sistemi'nde ve yer kabuğunda az bulunan bir elementtir. Yer kabuğunun ağırlıkça yaklaşık binde birini oluşturur. Bor, doğada daha yaygın bulunan bileşikleri olan borat minerallerinin suda çözünmesiyle yeryüzünde yoğunlaşır. Bunlar boraks ve kernit gibi evaporitler olarak endüstriyel ölçekte çıkarılır. Bilinen en büyük bor yatakları, bor minerallerinin en büyük üreticisi olan Türkiye'dedir."
 wolf_status_basic:0 "Kurt Ruhu"
 wolf_status_basic_desc:0 "Kurt ülkeyi kendi kararlarına ve duygularına göre yönetir; bu yüzden kurdun durumu ve ruh hâli çok önemlidir."
 wolf_status_alone:0 "Kurt Ruhu"
 wolf_status_alone_desc:0 "Kurt ülkeyi kendi kararlarına ve duygularına göre yönetir; bu yüzden kurdun durumu ve ruh hâli çok önemlidir."
 wolf_status_agressive:0 "Kurt Ruhu"
 wolf_status_agressive_desc:0 "Kurt ülkeyi kendi kararlarına ve duygularına göre yönetir; bu yüzden kurdun durumu ve ruh hâli çok önemlidir."
 ulkist_quarries:0 "Yeniliğin Ülkü Ocakları"
 ulkist_quarries_desc:0 "Ülkü Ocaklarının açılmasıyla bilimsel ve teknolojik gelişimimiz artacak ve ülkemiz ileri seviyelere çıkacak."
 ulkist_quarries_more_educative:0 "Yeniliğin Ülkü Ocakları"
 ulkist_quarries_more_educative_desc:0 "Ülkü Ocaklarının açılmasıyla bilimsel ve teknolojik gelişimimiz artacak ve ülkemiz ileri seviyelere çıkacak."
 ulkist_quarries_far_more_educative:0 "Yeniliğin Ülkü Ocakları"
 ulkist_quarries_far_more_educative_desc:0 "Ülkü Ocaklarının açılmasıyla bilimsel ve teknolojik gelişimimiz artacak ve ülkemiz ileri seviyelere çıkacak."
 banned_commies_books:0 "Yasaklanan Komünist Kitaplar"
 banned_commies_books_desc:0 "Komünist kitaplar halkımızın kafasını karıştırıyor ve onları milletinden koparıyor. Bu yüzden bu komünist kitaplar ülkede yasaklanmalı ve uzak tutulmalı."
 scientific_community_under_one_roof:0 "Birleşik Bilim Camiası"
 scientific_community_under_one_roof_desc:0 "Bilim akademisyenleri ayrı ayrı değil, bir birlik içinde çalışmalı; çünkü birlikte çalışamayan gruplar çöküşle sonuçlanır."
 generation_of_nationalism:0 "Milliyetçilik ve Bilim Nesli"
 generation_of_nationalism_desc:0 "Yeni bir nesil yarattık. Bu nesil milliyetçilik ve bilimle tamamen harmanlanmış durumda ve Türkiye'nin kalkınması için kesinlikle gerekli."
 document_protectionism:0 "Bilimsel Belgelerin Korunması"
 document_protectionism_desc:0 "Akademisyenlerin ve bilim insanlarının belge ve projelerinin çalınmasını önleyeceğiz; çünkü akademisyenlerimizin ve bilim insanlarımızın projeleri ve belgeleri çalınırsa ülkemiz yeni bilim insanı ve akademisyen yetiştiremez."
 ulkist_technology_centre:0 "Ülkücü Teknoloji Merkezi"
 ulkist_technology_centre_desc:0 "Ülkücü teknoloji merkezini açtık. Bu bilim merkezini tüm zorluklara rağmen inşa ettik ve bu bilim merkezi sayesinde ülkemiz ileri seviyelere çıkacak."
 the_population_project:0 "100 Milyon Nüfus Projesi"
 the_population_project_desc:0 "Türkiye nüfusu 100 milyona çıkarmak için bir program başlattı. Türkiye nüfusunu artırmak istiyor, çünkü iş gücü her zaman güç getirir."
 the_population_projection_of_economics:0 "GSYH-Nüfus Endeksini Dengeleyin"
 the_population_projection_of_economics_desc:0 "Artan nüfus normalde kişi başı GSYH'nin düşmesine neden olur. Bunu önlemek için bir program başlatacağız. Bu programla yeni inşaat projeleri başlatarak GSYH'nin düşmesini önleyeceğiz."
 peace_in_the_borders:0 "Sınırlarda Barış"
 peace_in_the_borders_desc:0 "Sınırlarımızda barış olmalı; aksi takdirde başımıza inanılmaz acı şeyler gelebilir. Bu yüzden sınırımızda barışı tesis ediyoruz ve her türlü yabancıyı ülkemize kabul ederek küresel bir ülke hâline geldik."
 turkish_housing:0 "Nüfus İçin Konut"
 turkish_housing_desc:0 "Artan nüfus nedeniyle yeni evler inşa etmek gerekiyor; bu yeni evler konut sektörümüzü geliştirecek ve dolaylı olarak iş gücümüzü artıracak."
 principalist_party:0 "İlkeli MHP"
 principalist_party_desc:0 "MHP ilkeli bir yaklaşım izleyerek güçlenecek. Bu ilerleyen takdir seviyesiyle ülkemiz gelecekte huzura kavuşacak."
 turkes_legacies:0 "Türkeş'in Mirası"
 turkes_legacies_desc:0 "Atalarını tanı, onları unutma! Vatan değerlerine sahip çık, tıpkı Türkeş gibi! Bu vatan kolay kazanılmadı! Kanla kazanıldı!"
 politics_of_surpress:0 "Bastırma Siyaseti"
 politics_of_surpress_desc:0 "Bize karşı siyaset yapanları yok etmemizde hiçbir kusur yok. Bu kışkırtıcı zihniyetin susturulması halkımızın ve ülkemizin istikrarı için son derece önemli."
 bahceli_powers:0 "Bahçeli'nin Yetkileri"
 bahceli_powers_desc:0 "Ülkemiz Bahçeli yönetiminde daha hızlı gelişecek ve güçlenecek. Yaşasın bilge adam Devlet Bahçeli."
 bahceli_powers_2:0 "Bahçeli'nin Yetkileri"
 bahceli_powers_2_desc:0 "Ülkemiz Bahçeli yönetiminde daha hızlı gelişecek ve güçlenecek. Yaşasın bilge adam Devlet Bahçeli."
 bahceli_powers_3:0 "Bahçeli'nin Yetkileri"
 bahceli_powers_3_desc:0 "Ülkemiz Bahçeli yönetiminde daha hızlı gelişecek ve güçlenecek. Yaşasın bilge adam Devlet Bahçeli."
 mass_counter_immigrationism:0 "Kalıcı Göç Karşıtlığı Fikirleri"
 mass_counter_immigrationism_desc:0 "Ülkemizin istikrarını bozan bu mültecileri ülkemizden çıkarma zamanı geldi. Allah'a şükür ülkemizi bu mülteci işgalinin etkisinden kurtarıyoruz!"
 closed_border:0 "Kapatılan Millî Sınırlar"
 closed_border_desc:0 "Sınır kapılarını kapatma kararı alarak yabancıların ülkemize gelmesine izin vermeyeceğiz."
 nationalism_in_the_borders:0 "Sınırlarda Milliyetçilik"
 nationalism_in_the_borders_desc:0 "Milliyetçiliğin gücü sınırlarımızda hissedilmeli ve ülkemizle bütünleşmeli. Milliyetçilik duygusu dünyadaki en güçlü duygudur."
 harsh_solutions_of_the_border:0 "Sınır İçin Sert Çözümler..."
 harsh_solutions_of_the_border_desc:0 "Sınırlarımızın güvenliğini artırmak için Cenevre Sözleşmeleri'nin bazı maddelerini görmezden gelebiliriz. Sınırlarda klor gazı gibi zehirli gazların kullanılması mültecilerin gelişini engelleyecek önkoşullardan biri."
 well_execution_system:0 "İyi İşleyen İnfaz Sistemi"
 well_execution_system_desc:0 "Ülkemize yasa dışı yollarla giren mülteciler idam edilecek. Hiç kimsenin sınırımızı yasa dışı yoldan geçme hakkı yok."
 border_protection_institutions:0 "Sınır Koruma Kurumları"
 border_protection_institutions_desc:0 "Sınır korumasını sağlamak için orada belirli kurumların aktif görevde olması gerekiyor. Bu kurumlar sınır güvenliğini kalıcı hâle getirecek."
 turkish_presidency:0 "Türk Cumhurbaşkanlığı"
 turkish_presidency_desc:0 "Türk Cumhurbaşkanlığı belirli bir sistem içinde işliyor ve genel yargı güçleri ana merkezde toplanıyor. Bu sistemin türü, mükemmel işleyen Fransız sisteminin ta kendisi."
 steps_of_militarist_society:0 "Militarist Topluma Doğru Adımlar"
 steps_of_militarist_society_desc:0 "Artık militarist bir toplum yaratma zamanı. Bu militarist toplum sayesinde her yerde, özellikle askerî anlamda güçlü olabiliriz."
 turkish_wild_hunt:0 "Türk Vahşi Avı"
 turkish_wild_hunt_desc:0 "Avrupa'daki kargaşa nedeniyle Avrupa güçlerine müdahale ederek bölgedeki gücümüzü artırabiliriz. Avrupa Birliği'nden ayrılan ülkeler için av başlasın."
 turkish_arms_innovationalism:0 "Türk Silah Yenilikçiliği"
 anarchist_congress_assambled:0 "Anarşist Kongre Toplandı"
 anarchist_congress_assambled_desc:0 "Anarşist kongre toplandı; artık yönetim kademeleri belirli bir örgütlenme çerçevesinde oluşturulacak."
 anarchist_militarization:0 "Anarşist Silahlanma"
 anarchist_militarization_desc:0 "Anarşistler silaha sarılacak, bu iğrenç ve adaletsiz hükümeti yıkacak ve mutlak özgürlüğü getirecek!"
 spirit_of_rebellion:0 "İsyan Ruhu"
 spirit_of_rebellion_desc:0 "İsyan düşüncelerini canlandırarak ülkemizi bu istilacı yozlaşmadan temizleyeceğiz! Yaşasın Anarşi, Yaşasın Özgürlük!"
 anarchist_positivism:0 "Anarşist Pozitivizm"
 anarchist_positivism_desc:0 "Dünyayı pozitif bir şekilde incelemekten ne zarar gelebilir? Pozitivizm halkımızı hayatta tutacak bir ruhtur."
 guerilla_tactics:0 "Gerilla Taktikleri"
 guerilla_tactics_desc:0 "Gerilla savaşı, paramiliter personel, silahlı siviller ya da düzensiz birlikler gibi küçük savaşçı gruplarının daha büyük ve daha az hareketli geleneksel bir orduyla savaşmak için pusu, sabotaj, baskın, küçük çaplı çatışma, vur-kaç taktikleri ve hareketlilik gibi askerî taktikler kullandığı bir düzensiz savaş biçimidir."
 motherland_committee:0 "Vatan Komitesi"
 motherland_committee_desc:0 "Vatan komitesinin amacı anarşizmi sınırlar içinde başarıya ulaştırmak ve gelecekteki savaşları önlemektir."
 a_new_kind_of_modern_movement:0 "Yeni Tür Modern Bir Hareket"
 a_new_kind_of_modern_movement_desc:0 "Anarşizm modern ilkelerle birleştirilerek güçlendirilmeli. Bu güçlenme kesinlikle paha biçilmez olacak."
 anarchist_repairing_stuff:0 "Anarşist Onarım Ekibi"
 anarchist_repairing_stuff_desc:0 "Savaş sırasında çok fazla kayıp ve yıkım yaşadık. Şimdi bir anarşist grup oluşturarak bu yıkımı gidermek gerekiyor."
 workout_propaganda:0 "Çalışma Propagandaları"
 workout_propaganda_desc:0 "Propagandanın etkinliği inanılmaz derecede yüksek; bu yüzden istediğimiz her yerde çalışma gücümüzü artırabiliriz."
 anarchist_working_engine:0 "Anarşist Çalışma Motoru"
 anarchist_working_engine_desc:0 "Anarşist sistem muhteşem çalışıyor. Bu çalışma sistemi sayesinde kârlarımız inanılmaz seviyelerde!"
 anarchist_collectivization:0 "Anarşist Kolektifleştirme"
 anarchist_collectivization_desc:0 "Kolektif ekonomik yeniden yapılanmayla birlikte bu anarşist yapıyı yaşatacak ve güçlendireceğiz. Her gelişme ekonomik yeniden yapılanmayla sağlanır."
 torchbearers_of_state:0 "Devletin Meşale Taşıyıcıları"
 torchbearers_of_state_desc:0 "Ülkemizin meşaleleri olan vatandaşlarımızı aydın kılarak ülkemizi çok iyi yerlere getireceğiz."
 appoint_technicans:0 "Atanan Teknisyenler"
 brain_cleaning:0 "Beyin Yıkama"
 brain_cleaning_desc:0 "Bozulmuş beyinlerin düzeltilmesi gerekiyor. Bu beyinleri anarşist propaganda aktivistleriyle düzene sokacağız."
 a_new_society_of_anarchism:0 "Yeni Bir Toplum: Anarşizm"
 anarcho_neutrality:0 "Anarşist Tarafsızlık"
 anarcho_neutrality_desc:0 "Anarşizm şu an tarafsız bir tutum almalı; önce kendi aramızda anarşiyi kuracak, sonra onu tüm dünyaya yayacağız."
 divided_construction:0 "Bölünmüş İnşaat Planları"
 plans_of_construction:0 "Kitlesel İnşaat Planları"
 plans_of_construction_desc:0 "Büyük projelerin yürütülmesi gerekiyor ve bunun için planlı ekonomik sistemlerin nimetlerinden yararlanabiliriz."
 consumer_goods_lowering_for_anarchism:0 "Azaltılmış Tüketim Malları"
 consumer_goods_lowering_for_anarchism_desc:0 "Tüketim malları mutlaka azaltılmalı; bu mallar ekonomimize çok zarar veriyor."
 anarchist_born_economy:0 "Anarşizmden Doğan Ekonomi"
 anarchist_born_economy_desc:0 "Anarşist ekonomi modeli kalkınmamızı sağlayacak türden olacak ve bu ekonomi modeli sayesinde ülkemizi ileri seviyelere taşıyacağız."
 anarchist_collectivization_systematic:0 "Sistemli Anarşist Kolektifleştirme"
 anarchist_collectivization_systematic_desc:0 "Kolektif ekonomik yeniden yapılanmayla birlikte bu anarşist yapıyı yaşatacak ve güçlendireceğiz. Her gelişme ekonomik yeniden yapılanmayla sağlanır."
 protect_academies:0 "Korunan Akademiler"
 protect_academies_desc:0 "Akademilerin baskılardan korunması gerekiyor. Akademisyenler çalışmazsa yenilikte ciddi kayıplar yaşanabilir."
 free_education_free_land:0 "Özgür Eğitim, Özgür Toprak"
 free_education_free_land_desc:0 "Özgür Toprak! Özgür Eğitim! Bu sayede ülkemiz büyük tehlikelerden ve geri kalmışlıktan uzak olacak."
 education_WANTED:0 "Eğitim: ARANIYOR"
 education_WANTED_desc:0 "Eğitimin olmadığı yerde istikrar olmaz; bu yüzden eğitim ne olursa olsun GEREKLİ!"
 a_hacker_group:0 "Hacker Grubu"
 a_hacker_group_desc:0 "Bir hacker grubu sayesinde diğer ülkelerin verilerine sızacak ve anarşizmi onlara yayacağız."
 AI_technologies:0 "Yapay Zekâ Teknolojileri"
 AI_technologies_desc:0 "Yapay zekâ (YZ), insanlar dahil hayvanların sergilediği doğal zekânın aksine makinelerin sergilediği zekâdır. YZ araştırmaları, çevresini algılayan ve hedeflerine ulaşma şansını en üst düzeye çıkaran eylemlerde bulunan her türlü sistemi ifade eden akıllı ajanların incelendiği çalışma alanı olarak tanımlanmıştır."
 personel_innovationalism:0 "Kişisel Yenilikçilik"
 personel_innovationalism_desc:0 "Bireysel bilim ülkemizde bilimin artmasını sağlayacak. Bu sayede istediğimiz teknolojiye kolayca ulaşabiliriz."
 electiricy_controlled:0 "Kontrol Altındaki Elektrik"
 electiricy_controlled_desc:0 "Elektriğin kontrolünü ele alarak mevcut otoritemizi büyük ölçüde genişletebilir, kaynaklarımızı verimli kullanabilir ve otoritemizi geniş tutabiliriz."
 modern_echologist_movement:0 "Modern Ekolojist Hareket"
 modern_echologist_movement_desc:0 "Modern Ekolojist Hareket ile birlikte doğamızı güçlendirecek ve doğamızın bozulmasına izin vermeyeceğiz."
 support_from_scientists:0 "Bilim İnsanlarından Destek"
 support_from_scientists_desc:0 "Ülkemizdeki bilim insanlarının desteğiyle teknolojimizi geliştireceğiz. Bilim insanları bu ülkenin göz bebekleridir."
 support_from_academicians:0 "Akademisyenlerden Destek"
 support_from_academicians_desc:0 "Ülkemizdeki akademisyenlerin desteğiyle teknolojimizi geliştireceğiz. Akademisyenler bu ülkenin gözleridir."
 alliance_with_scientists:0 "Bilim İnsanlarıyla İttifak"
 alliance_with_scientists_desc:0 "Bilim insanlarıyla ittifak kurarak rejimimizi kısmen teknokratik bir rejime dönüştürdük. Bu rejim yönetimi güçlendirmemizi sağlayacak."
 sanction_community_of_greens:0 "Yeşillerin Yaptırım Komisyonu"
 sanction_community_of_greens_desc:0 "Yeşil çalışanlar olarak bir yaptırım komisyonu gibi kurumsallaşmalıyız; bu kurumsallaşmayı bir iletişim ağı aracılığıyla gerçekleştireceğiz."
 planted_trees:0 "Dikilen Ağaçlar"
 planted_trees_desc:0 "Ağaç dikerek ekolojiyi desteklemeliyiz; ekolojinin çöktüğü bir durumda bu dünyada kimse yaşayamaz."
 windmills:0 "Yel Değirmenleri"
 windmills_desc:0 "Yel değirmeni, rüzgâr gücünü yelken ya da kanat adı verilen pervaneler aracılığıyla dönme enerjisine dönüştüren ve özellikle tahıl öğütmek için kullanılan bir yapıdır; ancak terim rüzgâr pompalarını, rüzgâr türbinlerini ve diğer uygulamaları da kapsayacak şekilde genişletilmiştir. Bu tür aygıtlar için zaman zaman rüzgâr motoru terimi de kullanılır."
 windmills_place:0 "Yel Değirmeni Alanları"
 windmills_place_desc:0 "Yel değirmeni, rüzgâr gücünü yelken ya da kanat adı verilen pervaneler aracılığıyla dönme enerjisine dönüştüren ve özellikle tahıl öğütmek için kullanılan bir yapıdır; ancak terim rüzgâr pompalarını, rüzgâr türbinlerini ve diğer uygulamaları da kapsayacak şekilde genişletilmiştir. Bu tür aygıtlar için zaman zaman rüzgâr motoru terimi de kullanılır."
 termic_waters:0 "Termal Su Projeleri"
 termic_waters_large:0 "Termal Su Projeleri"
 the_energy_of_sun:0 "Güneş Enerjisi"
 the_energy_of_sun_desc:0 "Güneş enerjisi, güneş ışığından gelen yenilenebilir enerjinin doğrudan fotovoltaiklerle (PV), dolaylı olarak yoğunlaştırılmış güneş enerjisiyle ya da ikisinin bir bileşimiyle elektriğe dönüştürülmesidir. Fotovoltaik hücreler fotovoltaik etki aracılığıyla ışığı elektrik akımına dönüştürür."
 the_energy_of_sun_2:0 "Güneş Enerjisi"
 the_energy_of_sun_2_desc:0 "Güneş enerjisi, güneş ışığından gelen yenilenebilir enerjinin doğrudan fotovoltaiklerle (PV), dolaylı olarak yoğunlaştırılmış güneş enerjisiyle ya da ikisinin bir bileşimiyle elektriğe dönüştürülmesidir. Fotovoltaik hücreler fotovoltaik etki aracılığıyla ışığı elektrik akımına dönüştürür."
 nuclear_energy_ban:0 "Nükleer Enerji Yasağı"
 nuclear_energy_ban_desc:0 "Nükleer gibi büyük bir enerjinin kontrol edilmesi gerekiyor. Bu iş oldukça zor ve insanlar bunu kontrol edemez. Bu yüzden nükleer silahlar yok edilmeli!"
 nuclear_energy_ban_2:0 "Nükleer Enerji Yasağı"
 nuclear_energy_ban_2_desc:0 "Nükleer gibi büyük bir enerjinin kontrol edilmesi gerekiyor. Bu iş oldukça zor ve insanlar bunu kontrol edemez. Bu yüzden nükleer silahlar yok edilmeli!"
 nuclear_energy_ban_3:0 "Nükleer Enerji Yasağı"
 nuclear_energy_ban_3_desc:0 "Nükleer gibi büyük bir enerjinin kontrol edilmesi gerekiyor. Bu iş oldukça zor ve insanlar bunu kontrol edemez. Bu yüzden nükleer silahlar yok edilmeli!"
 nuclear_energy_ban_4:0 "Nükleer Enerji Yasağı"
 nuclear_energy_ban_4_desc:0 "Nükleer gibi büyük bir enerjinin kontrol edilmesi gerekiyor. Bu iş oldukça zor ve insanlar bunu kontrol edemez. Bu yüzden nükleer silahlar yok edilmeli!"
 protection_for_humans:0 "İnsanlar İçin Koruma"
 protection_for_humans_desc:0 "İnsanların kendi yarattıkları çevreden korunması gerekiyor. Aksi takdirde neslimizi kaybedeceğiz ve çevre hep böyle kalacak.""
 protection_for_animals:0 "Hayvanlar İçin Koruma"
 protection_for_animals_desc:0 "Hayvanları içinde bulunduğumuz kötü çevreden korumalıyız. Hayvanların korunması doğal denge için çok önemli."
 peace_solution:0 "Barışçıl Çözüm"
 peace_solution_desc:0 "Barış her şeyin çözümüdür; barışın olmadığı yerde ne istikrar ne de huzur vardır."
 peace_forever:0 "Sonsuza Dek Barış"
 peace_forever_desc:0 "Barış sonuna kadar mutlak bir şekilde korunmalı. Barış sonsuza dek sürmezse bu dünya ne yazık ki yok olacak."
 genius_europe:0 "Dâhi Avrupa"
 genius_europe_desc:0 "Avrupa akıllı, ekolojist insanların yaşadığı bir bölge; bu bölge dünyanın kurtuluşunu sağlayacak."
 green_world_projection:0 "Yeşil Dünya Tasarımı"
 green_world_projection_desc:0 "Tüm dünya yeşil perde altında yenilenecek! Yaşasın Yeşil Dünya! Yaşasın Çevre!"
 agriculture_increase_1:0 "Güçlendirilmiş Tarım"
 agriculture_increase_1_desc:0 "Tarım havzalarını güçlendirmemiz gerekiyor. Bu güçlendirme sayesinde halkımız ekolojiye daha bağlı olacak!"
 agriculture_increase_2:0 "Güçlendirilmiş Tarım"
 agriculture_increase_2_desc:0 "Tarım havzalarını güçlendirmemiz gerekiyor. Bu güçlendirme sayesinde halkımız ekolojiye daha bağlı olacak!"
 coal_ban:0 "Kömür Yasağı"
 coal_ban_desc:0 "Kömür çevreye oldukça zararlı bir madde; kesinlikle yasaklanmalı. Bu maddenin kullanımı sapkınlıktan başka bir şey değil."
 coal_and_oil_ban:0 "Kömür ve Petrol Yasağı"
 coal_and_oil_ban_desc:0 "Kömür ve petrol çevreye son derece zararlı maddeler; kesinlikle yasaklanmalı. Bu maddelerin kullanımı sapkınlıktan başka bir şey değil."
 deindustriaization_program:0 "Sanayisizleşme Programı"
 deindustriaization_program_desc:0 "Kitlesel bir sanayisizleşme hareketi başlatıyoruz. Bu hareketle çevre düşmanı fabrikaların fişini çekerek doğayı mutlu edeceğiz."
 create_a_socialist_front:0 "Sosyalist Cephe"
 create_a_socialist_front_desc:0 "Sosyalist cepheyi açtık. Bu cephenin anlamı açık: Sosyalist ve anarşist olmayanlar yok olacak!"
 capitalism_looting:0 "Kapitalistleri Yağmalamak..."
 capitalism_looting_desc:0 "Kapitalizmin sömürüsüne karşı bir hareket başlatıyoruz; bu hareketin faydaları ülkemiz için iyi olacak. Kapitalistlerin mülklerine el koyma zamanı!"
 labour_culture:0 "Emek Kültürü"
 labour_culture_desc:0 "Bir emek kültürü yaratmak işimize yarayacak bir faaliyettir; emek kültürü yaratmak üretimde teşviklerin kalıcılığını güçlendirecek."
 child_labour_culture:0 "Kalıcı Çocuk İşçiliği"
 child_labour_culture_desc:0 "Bu anarşist ortamda çocuk işçiliği yaşamaya devam etmeli. Kötü görünse de çocuk işçiliği istihdam seviyesini artırıyor, bu yüzden hızla inşa edebiliyoruz."
 anarchist_collectivization_systematic_culture:0 "Sistemli Anarşist Kolektifleştirme Kültürü"
 anarchist_collectivization_systematic_culture_desc:0 "Kolektif ekonomik yeniden yapılanmayla birlikte bu anarşist yapıyı yaşatacak ve güçlendireceğiz. Her gelişme ekonomik yeniden yapılanmayla sağlanır."
 fast_construction:0 "Hızlı İnşaatçılık"
 fast_construction_desc:0 "Hızlı inşaatı sağlamak daha hızlı sanayileşmemizi sağlayacak. Sanayileşme her güçlü ülkenin sahip olması gereken bir şeydir."
 working_teams_working:0 "Çalışma Ekipleri"
 working_teams_working_desc:0 "Çalışma ekipleri oluşturarak sağlıklı istihdamın oluşmasını sağlayacağız; sağlıklı istihdam bir güçtür."
 the_turkish_industrial_culture:0 "Türk Sanayi Kültürü"
 the_turkish_industrial_culture_desc:0 "Türk sanayileşmesini bir kültür hâline getirerek sanayileşmenin azami hızına ulaşacağız."
 the_turkish_radar_culture:0 "Radar Kültürü"
 the_turkish_radar_culture_desc:0 "Türk radar inşasını bir kültür hâline getirerek azami radar kapsamasını sağlayacağız."
 the_turkish_railway_culture:0 "Demir Yolu Kültürü"
 the_turkish_railway_culture_desc:0 "Türk demir yolu inşasını bir kültür hâline getirerek azami demir yolu ağını sağlayacağız."
 non_religious_interventionism:0 "Ateist Müdahaleler"
 non_religious_interventionism_desc:0 "Ateist müdahalelerle anarşizmi ve ülkenin dinsizleşmesini mümkün kılacağız. Bu müdahaleler başlıca ibadethaneleri kapatarak ve dinî mülklere el koyarak gerçekleştirilebilir."
 non_religious_interventionism_2:0 "Ateist Müdahaleler"
 non_religious_interventionism_2_desc:0 "Ateist müdahalelerle anarşizmi ve ülkenin dinsizleşmesini mümkün kılacağız. Bu müdahaleler başlıca ibadethaneleri kapatarak ve dinî mülklere el koyarak gerçekleştirilebilir."
 innovation_first:0 "Önce Yenilik"
 innovation_first_desc:0 "Yeniliği ön plana koyarak ülkemizi bilim ve irfanda geliştireceğiz."
 science_tourmaments:0 "Bilim Turnuvaları"
 science_tourmaments_desc:0 "Bilim insanları turnuvaları düzenleyerek bilimin kendi içinde gelişmesini sağlayacağız."
 science_exhabitions:0 "Bilim Fuarları"
 academicians_in_the_world:0 "Dünyadan Akademisyen Kazanmak"
 academicians_in_the_world_desc:0 "Dünyanın dört bir yanından akademisyenleri buraya çekerek ülkemizdeki yeniliğe farklı bir renk katacağız."
 invention_founder_society:0 "Mucitler Topluluğu"
 invention_founder_society_desc:0 "Yeni icatlar üreten bir topluluk yarattık; bu topluluk geleceğimizin öncüsüdür."
 anarchist_science_power:0 "Anarşist Bilim"
 anarchist_science_power_desc:0 "Anarşist bilimlerle birlikte olağan bilimsel gelişmelerin üst seviyelerine çıkacağız; bu gelişmeler bizim için önemli."
 anarchist_transportation:0 "Anarşist Ulaşım"
 anarchist_transportation_desc:0 "Anarşist ulaşım sayesinde ordumuzu bir yerden bir yere kolayca taşıyabileceğiz. Bu ulaşım işimize yarayacak."
 anarchist_transportation_2:0 "Anarşist Ulaşım"
 anarchist_transportation_2_desc:0 "Anarşist ulaşım sayesinde ordumuzu bir yerden bir yere kolayca taşıyabileceğiz. Bu ulaşım işimize yarayacak."
 human_waves_tactics:0 "İnsan Dalgası Taktikleri"
 human_waves_tactics_desc:0 "İnsan Dalgası taktikleriyle ordumuzun sayısını artırarak karşı tarafı ezeceğiz."
 the_socialist_elites:0 "Sosyalist Elitler"
 the_socialist_elites_desc:0 "Sosyalist elitler adlı bir ordu birliği oluşturarak ülkemizdeki kapitalistleri avlayacağız. Bu av tatlı olacak."
 arms_of_nato_against_attack:0 "NATO Saldırılarına Karşı Önlem"
 arms_of_nato_against_attack_desc:0 "NATO saldırılarına karşı özgün savunma orduları oluşturacağız. Bu savunma orduları bizi işgalci NATO'ya karşı koruyacak."
 arms_of_nato_against_defence:0 "NATO Savunmalarına Karşı Önlem"
 arms_of_nato_against_defence_desc:0 "NATO savunmalarını yarmak için özgün taarruz orduları oluşturacağız. Bu taarruz orduları bizi işgalci NATO'ya karşı koruyacak."
 attack_and_defense_combined_force:0 "NATO Saldırılarına ve Savunmalarına Karşı Önlem"
 attack_and_defense_combined_force_desc:0 "NATO'ya karşı özgün savunma ve taarruz orduları oluşturacağız. Bu savunma ve taarruz orduları bizi işgalci NATO'ya karşı koruyacak."
 systematic_forces_of_anarchism:0 "Anarşizmin Sistemli Kuvvetleri"
 systematic_forces_of_anarchism_desc:0 "Anarşist orduların sistemli olması gerekebilir. Doğamız gereği sistemi ve örgütlenmeyi sevmiyoruz, ama ordunun istikrarı için bunu yapmalıyız."
 joint_forces_of_military:0 "Anarşizmin Ortak Kuvvetleri"
 joint_forces_of_military_desc:0 "Anarşist ordumuza katılmak isteyenler katılabilmeli; orduya katılmak istemeyenlerin zorla katılması ordunun verimliliğinin ve düzeninin ihlalinden başka bir şey değil."
 the_money_law:0 "Para Kanunu"
 the_money_law_desc:0 "Para hakkında bir kanun çıkararak paranın değerini korumak bizim için iyi sonuçlar doğuracak. Paranın değerini korumak kritik önemde."
 free_robbing:0 "Yasallaştırılmış Soygun"
 free_robbing_desc:0 "Artık hırsızlığı yasal hâle getirmek gerekiyor. Hırsızlığın suç olmaktan çıkarılması paranın insanlar arasında dolaşmasını kolaylaştıracak ve anarşizm bu yolla güçlenecek."
 financial_freedom_action:0 "Finansal Özgürlük"
 financial_freedom_action_desc:0 "Finansal özgürlük yeryüzündeki hayatın tamamlayıcısıdır. Bu özgürlüğü sağlamak bizim için son derece önemli."
 the_credit_house:0 "Kredi Evi"
 the_credit_house_desc:0 "Kredi evleri kurarak insanların kredi almasını kolaylaştıracağız. Özgür finans dünyası hayattır."
 money_digging:0 "Para Kazısı"
 money_digging_desc:0 "Paranın kolayca elde edilebilmesi için basılması ya da Bitcoin gibi paraların kazılması gerekiyor; biz de para makinelerini ele geçirip kendimizi zengin ederek bu işi yapacağız."
 money_digging_2:0 "Para Kazısı"
 money_digging_2_desc:0 "Paranın kolayca elde edilebilmesi için basılması ya da Bitcoin gibi paraların kazılması gerekiyor; biz de para makinelerini ele geçirip kendimizi zengin ederek bu işi yapacağız."
 the_money_law_2:0 "Para Kanunu"
 the_money_law_2_desc:0 "Para üzerinde etkiler yaratarak paranın değerini artırabilir ve güçlendirebiliriz. Bu durumda gücümüz artacak."
 freedom_for_gunselers:0 "Silah Satıcılarına Özgürlük"
 freedom_for_gunselers_desc:0 "Silah satan pazarlamacılar özgür olmalı ve silahlarını satabilmeli; satamazlarsa ticaret söner, silah satışları azalacağı için insanların silahlanması azalır ve bu nedenle güvenliğimizde bir çatlak oluşur."
 freedom_for_banks:0 "Bankalara Özgürlük"
 freedom_for_banks_desc:0 "Bankalar müdahaleden uzak ve bağımsız olmalı. Olmazlarsa muazzam bir zarar doğar."
 the_finance_state_1:0 "Finans Devleti"
 the_finance_state_1_desc:0 "Buranın işleyişi artık bir finans kurulundan farksız; para her şeydir ve her şeyin lokomotifidir. Para olmadan devlet olmaz."
 the_finance_state_2:0 "Finans Devleti"
 the_finance_state_2_desc:0 "Buranın işleyişi artık bir finans kurulundan farksız; para her şeydir ve her şeyin lokomotifidir. Para olmadan devlet olmaz."
 the_finance_state_3:0 "Finans Devleti"
 the_finance_state_3_desc:0 "Buranın işleyişi artık bir finans kurulundan farksız; para her şeydir ve her şeyin lokomotifidir. Para olmadan devlet olmaz."
 the_finance_state_4:0 "Finans Devleti"
 the_finance_state_4_desc:0 "Buranın işleyişi artık bir finans kurulundan farksız; para her şeydir ve her şeyin lokomotifidir. Para olmadan devlet olmaz."
 gold_investments:0 "Altın Yatırımları"
 gold_investments_desc:0 "Altın yatırımları ülkemiz için umut vadediyor. Bu altınlar gelecekte güzel bir şekilde geri dönecek!"
 gold_investments_return:0 "Altın Yatırımlarının Getirisi"
 gold_investments_return_desc:0 "Altın yatırımlarımız başarıyla sonuçlandı; ülkemiz artık büyük miktarda para girişini değerlendirebilir."
 bank_investments:0 "Banka Yatırımları"
 bank_investments_desc:0 "Banka mevduatı yatırımları ülkemiz için umut vadediyor. Bu banka mevduatları gelecekte güzel bir şekilde geri dönecek!"
 bank_investments_return:0 "Banka Yatırımlarının Getirisi"
 bank_investments_return_desc:0 "Banka mevduatına yaptığımız yatırımlar başarıyla sonuçlandı; ülkemiz artık büyük miktarda para girişini değerlendirebilir."
 corporation_investments:0 "Şirket Yatırımları"
 corporation_investments_desc:0 "Şirket yatırımları ülkemiz için umut vadediyor. Bu şirket yatırımları gelecekte güzel bir şekilde geri dönecek!"
 corporation_investments_return:0 "Şirket Yatırımlarının Getirisi"
 corporation_investments_return_desc:0 "Şirket yatırımlarımız başarılı oldu; artık ülkemize büyük miktarda para girişi sağlayabiliriz."
 anarchized_us_banks:0 "Anarşistleşen ABD Bankaları"
 anarchized_us_banks_desc:0 "Bankalarımız anarşist unsurlardan etkilendi. Bunun etkileri kalıcı olabilir."
 solved_petrodolar_crisis:0 "Artık Petrol Krizi Yok"
 solved_petrodolar_crisis_desc:0 "Artık petrolde dolaylı bir ekonomik kriz yaşanmayacak. Çözümüyle biz ilgilendik."
 trade_trade_trade:0 "Ticaret Ütopyası"
 trade_trade_trade_desc:0 "Ticaret ütopyasını gerçekleştirdik. Artık herkes bu kapitalist sistemi kullanıyor. Bu sistem sayesinde sermaye dünya çapında kolayca dolaşabiliyor."
 consumer_goods_lowered:0 "Azaltılmış Tüketim Malları"
 consumer_goods_lowered_desc:0 "Tüketim malları mutlaka azaltılmalı; bu mallar ekonomimize çok zarar veriyor."
 gun_shops:0 "Silah Dükkânları"
 gun_shops_desc:0 "Silah dükkânlarını serbest bırakmak halkımızın rahatça silahlanabilmesi ve korunma olanaklarını artırabilmesi demek. İşte anarşist bayrağımızın yansıttığı bireycilik budur."
 gun_dealers:0 "Silah Satıcıları"
 gun_dealers_desc:0 "Silah pazarlaması sermayemizi artıracak ve ülkemizin gelişmesine yardımcı olacak. Silah ülkemizi uçuruyor."
 world_of_guns:0 "Silahlar Dünyası"
 world_of_guns_desc:0 "Şu an dünyada silahsız insanlar var. Bu yüzden ülkemizde herkes silahlı olmalı. Hatta ikinci bir yedek silahları bile olmalı."
 action_of_WFP:0 "WFP"
 action_of_WFP_desc:0 "Dünya Gıda Programı (WFP), Birleşmiş Milletler'in gıda yardımı koludur. Açlık ve gıda güvenliğine odaklanan dünyanın en büyük insani yardım kuruluşu ve en büyük okul yemeği sağlayıcısıdır. 1961'de kurulan WFP'nin merkezi Roma'dadır ve 80 ülkede ofisi bulunur."
 action_of_IFAD:0 "IFAD"
 action_of_IFAD_desc:0 "Uluslararası Tarımsal Kalkınma Fonu (IFAD), gelişmekte olan ülkelerin kırsal bölgelerindeki yoksulluk ve açlıkla mücadele eden uluslararası bir finans kuruluşu ve Birleşmiş Milletler uzmanlık kuruluşudur. Kırsal ekonomilere, gıda güvenliğine ve iklim değişikliğine odaklanan tek çok taraflı kalkınma kuruluşudur."
 action_of_FDO:0 "FAO"
 healthy_water:0 "Temiz Su"
 healthy_water_desc:0 "Temiz su insanlık için son derece gerekli. Suları temiz tutmalıyız. Bu suları korumazsak son yakın."
 upward_academicians:0 "Yükselen Akademisyenler"
 upward_academicians_desc:0 "Akademisyenlerimiz artık ortalamayı aştı. Akademisyenlerimiz artık son derece becerikli ve zeki."
 fiscal_politicss:0 "Maliye Politikası"
 TURKSAT_tech:0 "TÜRKSAT Teknolojileri"
 TURKSAT_tech_desc:0 "Türksat Uydu Haberleşme Kablo TV ve İşletme A.Ş., Türkiye'nin tek haberleşme uydusu işletmecisidir."
 islamic_dealership:0 "İslami Ortaklıklar"
 islamic_dealership_desc:0 "Müslüman ülke Türkiye, İslam ülkeleriyle ilişkilerini iyi tutmak zorunda. Müslüman Müslümanla dost olmazsa kiminle olacak?"
 nationalized_war_industry:0 "Millîleştirilmiş Savaş Sanayisi"
 nationalized_war_industry_desc:0 "Millîleştirilmiş altyapı ve ordu sanayisi yapısı ülkemizi kolayca ileriye taşıyacak."
 ecologist_tanks:0 "Ekolojist Tanklar"
 ecologist_tanks_desc:0 "Çevreci tanklar üreterek doğaya zarar vermeden düşmanlarımızı öldürebileceğiz."
 ecologist_tanks_buffed:0 "Ekolojist Tanklar"
 ecologist_tanks_buffed_desc:0 "Çevreci tanklar üreterek doğaya zarar vermeden düşmanlarımızı öldürebileceğiz."
 ecologist_weapons:0 "Çevreci Silahlar"
 ecologist_weapons_desc:0 "Ekolojinin bozulmaması için çevreci silahlar icat edilmeli. Bu silahlar daha az güçlü olabilir, ama çevreyi kirletmez."
 special_ecologist_armies:0 "Özel Ekolojist Ordular"
 special_ecologist_armies_desc:0 "Ekolojiyi korumayı amaçlayan özel ordular yetiştirmek gerekiyor. Aksi takdirde ne yazık ki ekoloji korunamayacak."
 water_planes:0 "Deniz Uçakları"
 water_planes_desc:0 "Deniz uçağı, suya iniş ve sudan kalkış yapabilen motorlu, sabit kanatlı bir hava aracıdır. Deniz uçakları teknolojik özelliklerine göre genellikle iki kategoriye ayrılır: şamandıralı uçaklar ve uçan tekneler; ikincisi genellikle çok daha büyüktür ve çok daha fazla yük taşıyabilir. Pistlere de iniş ve kalkış yapabilen deniz uçakları amfibi uçaklar adı verilen bir alt sınıfta yer alır."
 banned_flying_wings:0 "Uçuş Yasağı"
 banned_flying_wings_desc:0 "Gereksiz yere uçan her şey yasaklanmalı. Bunlar doğaya zarar veriyor!"
 ecoogical_imperialism:0 "Ekolojik Emperyalizm"
 ecoogical_imperialism_desc:0 "Ekolojik emperyalizmin zamanı geldi. Doğaya çok zarar veren her devlet mutlaka yok edilmeli! Yaşasın Doğanın Güçleri..."
 turkish_drone_sector_buffed:0 "Türk İHA Sektörü"
 turkish_drone_sector_buffed_desc:0 "Türkiye İHA üretimi ve İHA teknolojilerinde üst düzey bir ülke. Bunların hepsi Türk İHA sanayisi sayesinde oldu. Bir ülke olarak Türk İHA sektörünü finanse etmeye devam ederek daha modern ve daha güçlü İHA'lar üretip diğer ülkeleri korkutabiliriz."
 minor_inflation:0 "Hafif Enflasyon"
 anti_right_movement:0 "Sağ Karşıtı Hareket"
 anti_right_movement_desc:0 "Komünistler ve solcular sağcılara karşı tek vücut oldu. Şimdi sıra bizde. Tüm sağcıları yok edecek ve kızıl bayrağı dalgalandıracağız."
 anti_right_movement_2:0 "Sağ Karşıtı Hareket"
 anti_right_movement_2_desc:0 "Komünistler ve solcular sağcılara karşı tek vücut oldu. Şimdi sıra bizde. Tüm sağcıları yok edecek ve kızıl bayrağı dalgalandıracağız."
 anti_right_movement_3:0 "Sağ Karşıtı Hareket"
 anti_right_movement_3_desc:0 "Komünistler ve solcular sağcılara karşı tek vücut oldu. Şimdi sıra bizde. Tüm sağcıları yok edecek ve kızıl bayrağı dalgalandıracağız."
 peace_land_bread:0 "Barış, Toprak ve Ekmek"
 peace_land_bread_desc:0 ""Barış, Toprak ve Ekmek" sloganı, Rusya'daki siyasi iktidar mücadelesi sırasında halk desteği kazanmak için Lenin tarafından ortaya atıldı. Lenin bildirisinde halkın kaygılarına değindi: "Barış" savaşın sona ermesi, "toprak" köylülere toprak, "ekmek" ise yaygın açlıktan kurtuluş anlamına geliyordu."
 disk_cooperationism:0 "DİSK ile İşbirliği"
 disk_cooperationism_desc:0 "DİSK, Türkiye'nin dört büyük ulusal sendika konfederasyonundan biridir. 1967'de Türkiye İşçi Sendikaları Konfederasyonu'ndan ayrılan sendikalarca kurulmuştur ve 327.000 üyesi vardır."
 repair_stuff:0 "Onarım Ekipleri"
 repair_stuff_desc:0 "Ülkeyi genel olarak geri kalmışlıktan kurtarıp inşa etmek için belirli kurumlar oluşturmak iyi olacak. Ne kadar hızlı yapılanırsak o kadar hızlı gelişiriz."
 unions_agreed_each_other:0 "Sendika Anlaşmaları"
 unions_agreed_each_other_desc:0 "İyi geçinmek için sendikalarla anlaşmalar imzaladık. Sendikalarla iyi geçinirsek ekonomik durumumuz ve işçilerin mutluluğu artar."
 fast_construction_movement:0 "Hızlı İnşaat Hamlesi"
 fast_construction_movement_desc:0 "Hızlı inşaat harekâtını başlattık. Bu inşaat harekâtıyla ülkemizin dört bir yanında sanayi yapıları inşa edecek ve güçlü olacağız."
 kemalist_socialism:0 "Kemalist Milliyetçilik"
 kemalist_socialism_desc:0 "Kemalizm milliyetçilikle güçlenir. Milliyetçilik ve Kemalizm olmadan bu devlet var olmazdı!"
 neutral_positioning:0 "Tarafsız Konumlanma"
 neutral_positioning_desc:0 "Tarafsız bir şekilde konumlanmak bize iyi gelecek. Tarafsızlık stratejik bir bilgeliktir."
 perincek_powers:0 "Perinçek'in Yetkileri"
 perincek_powers_desc:0 "Perinçek ve gücü inanılmaz bir seviyede; Perinçek ile birlikte bu güçle dünyayı yöneteceğiz."
 perincek_wisdom:0 "Perinçek'in Bilgeliği"
 perincek_wisdom_desc:0 "Perinçek ve gücü ile bilgisi inanılmaz bir seviyede; Perinçek ile birlikte bu güç ve bilgiyle dünyayı yöneteceğiz."
 crush_local_investors:0 "Yerli Yatırımcıların Ezilmesi"
 crush_local_investors_desc:0 "Yerli yatırımcıların ezilmesiyle Çinli yatırımcılar ülkemizdeki etkilerini artıracak. Çinli yatırımcılar ülkemizin kârını düşünüyor. Yerliler ise yalnızca kendilerini."
 perincek_fundementalis:0 "Perinçek'in Temel İlkeleri"
 glory_of_the_soviet_past:0 "Sovyet Geçmişinin Görkemi"
 glory_of_the_soviet_past_desc:0 "Sovyet dönemi sona erdi, sosyalizmin süper gücü çöktü; şimdi Çin ile birlikte sosyalizmi yeniden bir süper güç yapacağız."
