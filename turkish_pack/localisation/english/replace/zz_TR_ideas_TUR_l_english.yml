 university_coercion:0 "Zorunlu Üniversite Eğitimi"
 university_coercion_desc:0 "İnsanları liseye kadar okutmak yeterli değil; herkesin üniversitede okuması gerekiyor. Üniversitede okuyan insanlar kültürlü ve düzgün nesillerin oluşmasını sağlayacak temel taştır."
 expanded_faculties:0 "Genişletilmiş Fakülteler"
 expanded_faculties_desc:0 "Üniversitelerdeki fakülte sayısının artması gerekiyor, çünkü insanlar istedikleri bölümlerde okumayı hak ediyor. Çeşitlilik ülkemize canlılık katacak."
 act_of_copyright:0 "Telif Hakkı Kanunu"
 act_of_copyright_desc:0 "Ülkemizde telif haklarını korumak için yeni kanunlar getirdik. Telif haklarının korunmasıyla birlikte araştırmalarımızı hızlandıracak ve güven ortamını artıracağız."
 rise_of_depoliticalization:0 "Depolitizasyonun Yükselişi"
 rise_of_depoliticalization_desc:0 "Ülkemizdeki siyasi durumun ülkemize hak etmediği zorluklar getirdiği açık. Bu yüzden devletimizi ve halkımızı siyasetten uzaklaştırmayı amaçlayan bir propaganda uyguluyoruz. Ülkemiz siyasi karakterini kaybettiğinde hak ettiği birlik ve beraberliğe ulaşacak."
 bureocratic_reorganization:0 "Bürokratik Yeniden Yapılanma"
 bureocratic_reorganization_desc:0 "Bürokrasi son dönemde çok zarar gördü. Artık bürokrasiyi yasal bir temele oturtacak ve bürokratik düzeni sağlayacağız."
 social_critiction:0 "Toplumsal Eleştiri"
 social_critiction_desc:0 "Toplumsal hayattaki kritik olaylara eğilmemiz gerekiyor. Kritik olaylara eğilmezsek zorluklardan güçlükle çıkarız."
 uncontrolled_senate:0 "Senatonun İşlevi"
 uncontrolled_senate_desc:0 "Meclisin yetkilerinin bir kısmını yeni kurduğumuz senatoya devrettik. Ancak bu yetki devri sonucunda bir kaos yaşandı. Zamanla güç dengesi yerine oturacak."
 eu_style_legislative:0 "AB Tarzı Yasama"
 eu_style_legislative_desc:0 "Avrupa tarzı bir yasama sistemine geçeceğiz. Bu sistemle adaletimiz genişleyecek, hızlanacak ve istikrarımız artacak."
 european_parliament_membership:0 "Avrupa Parlamentosu Üyeliği"
 european_parliament_membership_desc:0 "Avrupa Birliği üyesi değiliz, ama Avrupa Parlamentosu'nda kendimize yer edinebildik. Bu durum bizi siyasi ve ekonomik olarak güçlendirecek."
 passive_european_membership:0 "Pasif AB Üyesi"
 passive_european_membership_desc:0 "Avrupa Birliği'nin tam üyesi değiliz, ama AB işlerinde söz sahibiyiz. Artık tam üyeliğe hazırlanmaya başlayabiliriz."
 observer_of_the_frontex:0 "Frontex Gözlemci Statüsü"
 observer_of_the_frontex_desc:0 "Frontex Avrupa Birliği'nin koruyucu duvarıdır; bu kuruluşta küçük bir payımızın olması bile sınırlarımızı ve iç güvenliğimizi korumaya yeter."
 turkish_presidency_weakened:0 "Zayıflatılmış Türk Cumhurbaşkanlığı"
 turkish_presidency_weakened_desc:0 "Cumhurbaşkanlığı yönetimi çok fazla güce sahip olduğu için ülkemize zarar verdi. Bu sistemin zayıflatılması gerekiyor."
 financed_balkans:0 "Dış Finansman"
