 turkish_military_infulence_armed_desc:0 "Ülkemizde Kemalizmi koruyan muhafızlar 1960 ve 1980'de ülkemizde darbeler yaptı. Darbelerle birlikte ülkenin laiklik ilkesi korundu. Kemalist ordu ülkenin Atatürk'ün ideallerini izlemesini amaçlıyor. Yeni yönetim Atatürk'ün izinden gitmediğinde Türk Silahlı Kuvvetleri kötü durumu düzeltmek için ülkede darbeler yaptı. §GVe işler düzeldiğinde, halkın beklediği gibi ordu yönetimi bırakır ve yeniden seçimler yapılırdı.§!\n\n§YNeredeyse her 20 yılda bir ordu tarafından hükümete darbe ya da muhtıra verildi ve bu da halkın moralini bozdu. Halk artık silahlı Kemalist askerî düzeni sevmiyor. Bu durum halkımızın ekonomisini de etkiledi.§!\n\n§BTürk Silahlı Kuvvetleri laikliği benimsemeyen §Y[Conservative_L]§! gibi partileri hedef aldı ve bu partilere karşı çıkmaya devam edecek. Karşı çıktığı partiler sonunda Anayasa Mahkemesi tarafından kapatıldı.§!\n\nBu düzenin değişme zamanı geldi; halk kendi kendini yönetmeli ve bu askerî vesayet rejiminden bir an önce kurtulmalıyız, ama önce sabırlı olmalıyız. §RHer şeyin bir zamanı var.§!"
