 turkic_state:0 "Türk Birliği Üyesi"
 turkic_state_desc:0 "Resmî adı Türk Dili Konuşan Ülkeler İşbirliği Konseyi olan Türk Konseyi, bazı Türk ülkelerinden oluşan uluslararası bir örgüttür. Temel amacı Türk dili konuşan devletler arasında kapsamlı işbirliğini geliştirmek olan hükümetlerarası bir kuruluştur."
