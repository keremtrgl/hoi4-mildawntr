 war_with_hezbollah:0 "Hizbullah ile Savaş"
 war_with_hezbollah_desc:0 "Hizbullah'ın yok edilmesi Orta Doğu barışı için gerekli; Orta Doğu'nun barışı ve huzuru için en gerekli şey bu."
