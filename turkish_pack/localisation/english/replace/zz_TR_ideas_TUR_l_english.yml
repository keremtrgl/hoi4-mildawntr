 mit:0 "Millî İstihbarat Teşkilatı"
 mit_desc:0 "MİT, Türkiye Cumhuriyeti'nin ülke ve millet bütünlüğüne, varlığına, bağımsızlığına, güvenliğine, anayasal düzenini ve millî gücünü oluşturan tüm unsurlarına karşı içeriden ve dışarıdan yöneltilen mevcut ve muhtemel tehditler hakkında istihbarat toplamakla görevlidir. MİT bu istihbaratı gerektiğinde Cumhurbaşkanına, Genelkurmay Başkanına, Millî Güvenlik Kurulu Genel Sekreterine ve ilgili diğer devlet kuruluşlarına iletmekle yükümlüdür."
