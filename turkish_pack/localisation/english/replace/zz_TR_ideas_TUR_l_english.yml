 turkish_2001_crisis:0 "2001 Türkiye Ekonomik Krizi"
 turkish_2001_crisis_desc:0 "Çöküş, yıllardır Türkiye'yi yıpratan siyasi ve ekonomik sorunların simgesiydi. Hükümete duyulan güven yolsuzluk ve kalıcı koalisyonlar kurulamaması nedeniyle aşınmıştı. Borsa çöküşü, Türkiye ekonomisinin yalnızca son derece kırılgan değil, aynı zamanda tamamen yabancı yatırıma bağımlı olduğunu ortaya koydu. Azalan yabancı yatırım ya da devasa bütçe açığı kadar önemli olmasa da çöküş Türkiye'nin son dönemdeki siyasi istikrarsızlığını gözler önüne serdi."
 reformed_2001_crisis:0 "Türk Ekonomisinin Hastalığı"
 reformed_2001_crisis_desc:0 "İnsanlar ülkenin genel olarak yatırıma bağımlı olmasından ve Türk ekonomisinin siyasi sorunlar nedeniyle yaklaşık 50 yıldır iyileşmemesinden bıktı. Ülke artık siyasi krizden kurtulmalı ve ekonomik bağımsızlığı için ekonomisini düzeltmeli."
