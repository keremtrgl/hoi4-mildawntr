 turkish_IMF_reformation_1:0 "Türk Para Reformu - §YUygulamada§!"
 turkish_IMF_reformation_1_desc:0 "2000'lerin başında Türkiye, dönemin ekonomik sorunlarıyla, yani yüksek enflasyon, mali istikrarsızlık ve geçmişten gelen finansal krizlerle mücadele etmek için kapsamlı bir para reformundan geçti. Hükümet ve merkez bankası ekonomiyi istikrara kavuşturmak, enflasyonu dizginlemek ve ülkenin genel mali sağlığını yeniden tesis etmek için bir dizi reform hayata geçirdi."
 turkish_IMF_reformation_2:0 "Türk Para Reformu - §RBaşarısız§!"
 turkish_IMF_reformation_2_desc:0 "2000'lerin başında Türkiye, dönemin ekonomik sorunlarıyla, yani yüksek enflasyon, mali istikrarsızlık ve geçmişten gelen finansal krizlerle mücadele etmek için kapsamlı bir para reformundan geçti. Hükümet ve merkez bankası ekonomiyi istikrara kavuşturmak, enflasyonu dizginlemek ve ülkenin genel mali sağlığını yeniden tesis etmek için bir dizi reform hayata geçirdi."
 turkish_IMF_reformation_3:0 "Türk Para Reformu - §GYeniden Tesis Edildi§!"
 turkish_IMF_reformation_3_desc:0 "2000'lerin başında Türkiye, dönemin ekonomik sorunlarıyla, yani yüksek enflasyon, mali istikrarsızlık ve geçmişten gelen finansal krizlerle mücadele etmek için kapsamlı bir para reformundan geçti. Hükümet ve merkez bankası ekonomiyi istikrara kavuşturmak, enflasyonu dizginlemek ve ülkenin genel mali sağlığını yeniden tesis etmek için bir dizi reform hayata geçirdi."
 TMSF_overshooting:0 "Paralel Çöküş: BDDK Dağılıyor"
 TMSF_overshooting_desc:0 "Bankacılık Düzenleme ve Denetleme Kurumu'nun (BDDK) ani çöküşü Türkiye genelinde bir finansal girdap yarattı. Bankacılık istikrarını korumakla görevli bir zamanlar güvenilir olan bu denetçi artık işlevsiz; pervasız kredi dağıtımı, kötü yönetim ve denetimsiz yolsuzluk alabildiğine yayılıyor. Büyük bankalar iflasın eşiğinde sallanıyor ve hem mudiler hem de yatırımcılar arasında yaygın bir panik baş gösteriyor. Hükümet krizi kontrol altına almaya çalışırken ülkenin kredi notu çakıldı, yabancı yatırım kurudu ve enflasyon fırladı.\n\nFinans sektörünün çöküşü siyasi arenaya da sıçrayarak halkın öfkesini körüklüyor ve hükümetin ekonomiyi yönetme becerisine duyulan güveni aşındırıyor. Siyasi hizipler başarısızlık için birbirini suçlayarak ülkedeki ayrılıkları derinleştiriyor. Ekonomik kargaşa pençesini sıkılaştırdıkça toplumsal düzen zayıflıyor ve Türkiye hem iç istikrarsızlığa hem de dış etkiye karşı savunmasız kalıyor. Acil reformlar yapılmaz ve düzenleyici denetim yeniden tesis edilmezse ülke uzun soluklu bir ekonomik ve siyasi kaosa sürüklenme riskiyle karşı karşıya."
 TMSF_normal:0 "BDDK Ödemeleri"
 TMSF_normal_desc:0 "Bankacılık Düzenleme ve Denetleme Kurumu'nun denetlediği ödeme sistemleri ciddi aksaklıklarla karşı karşıya; Türkiye genelinde finansal işlemlerde gecikmeler ve başarısızlıklar yaşanıyor. İşletmeler ve vatandaşlar para transferlerini güvenilir bir şekilde yapmakta zorlanıyor, ticaret duraksıyor ve piyasalar tedirgin oluyor. İstikrarsız ödeme altyapısı bankacılık sistemine duyulan güveni aşındırıyor ve pek çok kişiyi kayıt dışı alternatiflere yöneltiyor."
 TMSF_ease:0 "BDDK Ödemeleri"
 TMSF_ease_desc:0 "Bankacılık Düzenleme ve Denetleme Kurumu'nun denetlediği ödeme sistemleri ciddi aksaklıklarla karşı karşıya; Türkiye genelinde finansal işlemlerde gecikmeler ve başarısızlıklar yaşanıyor. İşletmeler ve vatandaşlar para transferlerini güvenilir bir şekilde yapmakta zorlanıyor, ticaret duraksıyor ve piyasalar tedirgin oluyor. İstikrarsız ödeme altyapısı bankacılık sistemine duyulan güveni aşındırıyor ve pek çok kişiyi kayıt dışı alternatiflere yöneltiyor."
 TMSF_hard:0 "BDDK Ödemeleri"
 TMSF_hard_desc:0 "Bankacılık Düzenleme ve Denetleme Kurumu'nun denetlediği ödeme sistemleri ciddi aksaklıklarla karşı karşıya; Türkiye genelinde finansal işlemlerde gecikmeler ve başarısızlıklar yaşanıyor. İşletmeler ve vatandaşlar para transferlerini güvenilir bir şekilde yapmakta zorlanıyor, ticaret duraksıyor ve piyasalar tedirgin oluyor. İstikrarsız ödeme altyapısı bankacılık sistemine duyulan güveni aşındırıyor ve pek çok kişiyi kayıt dışı alternatiflere yöneltiyor."
 pkk_terror_idea:0 "PKK İsyanı"
 pkk_terror_idea_desc:0 "Kürtçe adıyla Partiya Karkerên Kurdistanê olan Kürdistan İşçi Partisi, 1970'lerden bu yana Türkiye'de faaliyet gösteren militan, sol eğilimli, Kürt ayrılıkçı bir örgüttür. Kürtlerin kendi kaderini tayin hakkı için savaştığını iddia eden örgüt, çoğu zaman terör yöntemlerine başvurarak gerçekleştirdiği saldırılarla pek çok can almaya devam ediyor."
 sympathetic_professors:0 "Sempatizan Üniversite Hocaları"
 sympathetic_professors_desc:0 "Üniversite hocalarımızın ve akademisyenlerimizin çoğu komünist ya da sosyalist görüşlere sahip; bu nedenle PKK isyanına sempatiyle bakan görüşleri destekliyor ve teşvik ediyorlar."
 sympathetic_professors_dealt_with:0 "Sempatizan Olmayan Hocalar"
 sympathetic_professors_dealt_with_desc:0 "Bir zamanlar PKK'ya sempati duyan hocalar ya tasfiye edildi ya da hükümetin terörle mücadele operasyonlarını eleştirmemeye ikna edildi."
 outposts_problem:0 "Karakol Sorunu"
 outposts_problem_desc:0 "Doğu'daki karakollarımızdan bir ya da birkaçının saldırıya uğradığına dair ara ara haberler alıyoruz. Bu durum bize çok fazla cana mal oluyor ve hükümetimizin siyasi itibarını zedeliyor."
 outposts_strenghtened_1:0 "Daha İyi Karakollar I"
 outposts_strenghtened_1_desc:0 "Doğu bölgelerindeki yeni karakollarımız için gerekli parayı bulduk ve projelerini çizdik. Artık işe koyulabiliriz."
 outposts_strenghtened_2:0 "Daha İyi Karakollar II"
 outposts_strenghtened_2_desc:0 "Pilot proje olarak bazı yeni karakollarımızın inşaatına başlandı. Ancak teröristler de projelerimizden haberdar ve bizi yavaşlatmaya çalışıyor. Faaliyetlerinde henüz gözle görülür bir azalma yok."
 outposts_strenghtened_3:0 "Daha İyi Karakollar III"
 outposts_strenghtened_3_desc:0 "En savunmasız mevzilerimiz yeni yapılarla güçlendirildi. Artık eskisi kadar sık saldırıya uğramıyorlar ve gelen saldırıları püskürtebiliyorlar. Muhalefet artık karakol planlarımıza itiraz edemiyor."
 outposts_strenghtened_4:0 "Daha İyi Karakollar IV"
 outposts_strenghtened_4_desc:0 "Artık ihtiyaç duymadığımız eski karakollar söküldü. Bu da diğer projeler için büyük miktarda kaynak ve insan gücünü serbest bıraktı."
 outposts_strenghtened_5:0 "Daha İyi Karakollar V"
 outposts_strenghtened_5_desc:0 "İstihbaratımız, teröristlerin ikmal ve kaçakçılık için basit kara yolları bile bulmakta zorlandığını bildiriyor. Taktik barajlar harika bir fikirdi."
 outposts_strenghtened_6:0 "Daha İyi Karakollar VI"
 outposts_strenghtened_6_desc:0 "Sabit karakollarımızla ilgili gerekli tüm adımlar atıldı. Bir süredir bunlara yönelik herhangi bir terör saldırısı bildirilmedi."
 air_strike_cooldown:0 "Hava Harekâtı Bekleme Süresi"
