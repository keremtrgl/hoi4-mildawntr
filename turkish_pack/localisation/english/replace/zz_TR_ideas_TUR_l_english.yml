 power_of_the_law:0 "Hukukun Gücü"
 power_of_the_law_desc:0 "Kanunlar her zaman güçlendirilmeli. Güçlü hukuk güçlü istikrar ve birlik demektir. Tarihte hukuksuz devletler şüphesiz her zaman çökmüştür."
