 turkish_tourism_sector_medium:0 "Türk Turizm Sektörü"
 turkish_tourism_sector_medium_desc:0 "Türkiye'nin eşsiz kültürel mirası, büyüleyici manzaraları ve tarihî mekânları uzun zamandır dünyanın dört bir yanından ziyaretçi çekiyor. Altyapıya, konaklama hizmetlerine ve uluslararası tanıtıma yatırım yapan Türkiye, turizm sektörünü küresel bağlarını güçlendiren önemli bir gelir kaynağına dönüştürdü. Bu gelişen sektör yalnızca ekonomimizi güçlendirmekle kalmıyor, kültürel etkileşimi ve millî gururu da besliyor.\n\n§YTurizm sektörünü kararlar £decision_icon_small üzerinden yönetebilirsiniz.§!"
