 liberal_socialism:0 "Liberal Sosyalizm"
 liberal_socialism_desc:0 "Rusya'daki komünist düşünce katı ve otoriter olduğu için çöktü. Açık düşünebilen sosyalist bir düzen, Türkiye'yi çökmeden birlik içinde ayakta tutabilir."
 tur_historical_confidence_1:0 "Türk Tarihî Özgüveni"
 tur_historical_confidence_1_desc:0 "Türkler tarihleri boyunca önemli zekâlar yetiştirdi. Türkler fetihlerle Orta Asya'da ve Avrupa'da tahtlar kurdu. Bir savaşta yenildiklerinde ise birleşip sıkı bir şekilde savaştılar. Türkler tarihleriyle ve atalarıyla gurur duyar. Bu nedenle Türkiye'de milliyetçilik duygusu yaygın ve baskındır."
 factory_law:0 "Fabrika Kanunu"
 factory_law_desc:0 "Fabrikaların ürettiği gazlar dünyamıza zarar veriyor. Buna son verilmeli! Bunun için yasal işlem başlattık."
