 international_brigades:0 "Enternasyonal Tugaylar"
 international_brigades_desc:0 "Tüm komünistleri açıkça ülkemize davet ediyoruz. Komünistler ülkemize gelip kirli kapitalist düzene karşı bizimle birlikte savaşabilir. Yaşasın komünizm!"
 repair_focus:0 "Onarım Odağı"
 repair_focus_desc:0 "Ülkemizin altyapısı ve sanayisi İç Savaş nedeniyle iflas etti. Bu iflası gidermek ve ülkemizi yeniden onarmak için işçilerimizi seferberliğe çağırıyoruz."
