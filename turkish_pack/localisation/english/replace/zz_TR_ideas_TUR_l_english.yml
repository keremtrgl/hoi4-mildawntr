 bank_education:0 "Bankacılık Eğitimi"
 bank_education_desc:0 "Halkımıza banka yönetmeyi öğretmeliyiz. Halkımız bankaları rahatça yönetebilmeli. Bankalar bizim sağ kolumuzdur."
 hard_capitalism:0 "Katı Kapitalizm"
 hard_capitalism_desc:0 "Bu ülkenin kalkınmasını sağlayacak tek güç kapitalizmdir. Kapitalizm, Türk Silahlı Kuvvetleri gibi ülkemizin sarsılmaz bir gücüdür."
 capitalim_spreader:0 "Kapitalizmin Yayıcısı"
 capitalim_spreader_desc:0 "Halk komünizmi değil kapitalizmi istiyor; bu yüzden kapitalizmi dünya düzenine yayarak güçlendireceğiz."
 guardians_of_the_liberalism:0 "Liberalizmin Muhafızları"
 guardians_of_the_liberalism_desc:0 "Biz kapitalizmin ve liberalizmin muhafızlarıyız. Bu ilkeler sonsuza dek yaşamalı; yaşayamıyorlarsa reforme edilip daha da güçlendirilmeli. Güçlü kapitalizm ve liberalizm, güçlü bir dünya devleti demektir."
 mass_banking1:0 "Türk Bankacılığı"
 mass_banking1_desc:0 "Ülkemizin gidişatı bu bankalara bağlı; bankaların çöküşü ülke ekonomisinin çöküşü gibidir. Bu yüzden bankalarımızı desteklemeli, büyütmeli ve ülkemizi güçlendirmeliyiz. Bu bankalar güçlendikçe halkımızın refah seviyesi artacak ve ülkemiz güzel seviyelere gelecek. Bankalar liberalizmin koruyucularından biridir. \n\n§YBankacılar daha fazla güç kazanmalı!§!\n§YBankacılık Seviyesi: §RÇok Düşük§!"
