 military_traditions_problematic_3_desc:0 "Mafyanın iktidarı ele geçirmesiyle ülkede beklenmedik bir şekilde itaatsizlik ve anarşi baş gösterdi. Bu düzensizlik orduyu son derece güçsüz bıraktı. Ordumuzun onuru yıprandı ve ülke güvenlik açısından bunalımda. Bu durumu hızla çözmek gerekiyor gibi görünüyor, aksi takdirde işgal edileceğiz."
 military_traditions_problematic_4:0 "İstikrarsız Ordu"
 military_traditions_problematic_4_desc:0 "Mafyanın iktidarı ele geçirmesiyle ülkede beklenmedik bir şekilde itaatsizlik ve anarşi baş gösterdi. Bu düzensizlik orduyu son derece güçsüz bıraktı. Ordumuzun onuru yıprandı ve ülke güvenlik açısından bunalımda. Bu durumu hızla çözmek gerekiyor gibi görünüyor, aksi takdirde işgal edileceğiz."
 military_traditions_problematic_5:0 "İstikrarsız Ordu"
 military_traditions_problematic_5_desc:0 "Mafyanın iktidarı ele geçirmesiyle ülkede beklenmedik bir şekilde itaatsizlik ve anarşi baş gösterdi. Bu düzensizlik orduyu son derece güçsüz bıraktı. Ordumuzun onuru yıprandı ve ülke güvenlik açısından bunalımda. Bu durumu hızla çözmek gerekiyor gibi görünüyor, aksi takdirde işgal edileceğiz."
 mafia_defence_organization:0 "Mafya Savunma Örgütleri"
 mafia_defence_organization_desc:0 "Mafya savunma örgütünü kurduk. Bu örgüt aracılığıyla ülkemizi tehlikeli durumlardan kurtaracak ve düşmanlarımızı ülkeden temizleyeceğiz. Güvenliğin olduğu yerde istikrar hüküm sürer."
 war_academies:0 "Harp Akademileri"
 war_academies_desc:0 "Harp akademileri ülkemiz için oldukça gerekli hâle geldi; çünkü mafya ülkeyi ele geçirdikten sonra ülkede general kalmadı ve yenisi de gelmeyecek. Bu yüzden harp akademilerini mafyaları eğitip cepheye sürmek için kullanacağız. Hiç general olmamasının yarattığı krizi çözmek gerekiyor."
 experimental_PKK_war:0 "PKK ile Çatışmanın Deneyimleri"
 experimental_PKK_war_desc:0 "Mafyalarımızın PKK ile savaştan edindiği deneyimi bir kurala dönüştürme zamanı geldi. Bu kural sayesinde sürekli savaş deneyimi kazanacağız. Bu durum adeta bir savaş bankası gibi."
 experimental_PKK_war_2:0 "PKK ile Çatışmanın Deneyimleri"
 experimental_PKK_war_2_desc:0 "Mafyalarımızın PKK ile savaştan edindiği deneyimi bir kurala dönüştürme zamanı geldi. Bu kural sayesinde sürekli savaş deneyimi kazanacağız. Bu durum adeta bir savaş bankası gibi."
 TUR_PKK_active_foreign:0 "PKK Faaliyeti"
 TUR_PKK_active_foreign_desc:0 "Kürt isyancı grup bu ülkede üsler işletiyor ya da bağlantılı gruplara yardım ediyor."
 speedful_forces:0 "Süratli Kuvvetler"
 speedful_forces_desc:0 "Ordularımızı hızlandırmak için gerekli çalışmaları yapıyoruz. Bu çalışmalar sayesinde ordumuz bir ölçüde hızlanabildi. Hız, muharebe ve planlamada önemli bir unsurdur. Hızın artması iyi bir şeydir."
 gun_studies_4:0 "Silah Çalışmaları"
 gun_studies_4_desc:0 "İnsanların silah kullanmayı öğrenmesi ve herkesin elinde bir silah olması gerekiyor. Halkımız bunu kendi kendine ya da belirli silah kurslarına giderek öğrenebilir. Halkımız silahları ne kadar iyi öğrenirse ordumuz o kadar güçlü şekillenir."
 gun_tests:0 "Silah Testleri"
 gun_tests_desc:0 "Elimizdeki silahları test etmemiz gerekiyor. Elimizdeki silahları test ederek silahlarımızın güvenilirliğini artıracağız. Silahların güvenilirliğini artırmalıyız."
 withdrawal_law:0 "Geri Çekilme Kanunu"
 withdrawal_law_desc:0 "Geri çekilme kanununu çıkarıyoruz. Bu kanun sayesinde belirli bir yerden geri çekilmeyi sınırlayacağız ve askerimizin ayak bastığı yeri kolay kolay terk etmeyeceğiz."
 tanks_and_airplanes_what:0 "Tanklar ve Uçaklar mı?"
 tanks_and_airplanes_what_desc:0 "Mafyalar uçaklar ve tanklar hakkında hiçbir şey bilmiyor. Mafyalar yalnızca piyade ağırlıklı bilgilere sahip. Mafyalar uçaklara ve tanklara uyum sağlamalı. Yoksa bu uçakları ve tankları ne yapacağız?"
 border_mafias_in_action:0 "Sınır Mafyaları İş Başında"
 border_mafias_in_action_desc:0 "Mafyanın yönetimi ele geçirmesiyle sınır güvenliği tamamen bozuldu. Bu nedenle sınır mafyaları oluşturuldu. Sınır mafyalarının amacı sınırları korumak ve sınırı geçmeye çalışanları vurmak. Böylece sınır güvenliği bozulmadan kalacak."
 border_mafias_in_action_2:0 "Sınır Mafyaları İş Başında"
 border_mafias_in_action_2_desc:0 "Mafyanın yönetimi ele geçirmesiyle sınır güvenliği tamamen bozuldu. Bu nedenle sınır mafyaları oluşturuldu. Sınır mafyalarının amacı sınırları korumak ve sınırı geçmeye çalışanları vurmak. Böylece sınır güvenliği bozulmadan kalacak."
 conducted_border_mines:0 "Sınırlara Döşenen Mayınlar"
 conducted_border_mines_desc:0 "Mafyalar aracılığıyla sınırlara mayın döşedik. Bu mayınlar sayesinde kimse sınırları geçemeyecek ve ülkemiz sınırdaki faaliyetlerden etkilenmeyecek."
 pretty_isolated_state:0 "Tamamen Yalıtılmış Devlet"
 pretty_isolated_state_desc:0 "Ülkemizin tüm sınırları kapalı olduğu için hiçbir ülkeyle etkileşime girmiyor. Etkileşimsizlik ülkemizin yalıtılmasına neden olurken yalıtılmışlık bize mutlak güç veriyor."
 fund_hezbollah:0 "Finanse Edilen Hizbullah"
 fund_hezbollah_desc:0 "Hizbullah her anlamda desteklenmeli. Hizbullah'ın desteklenmesine paralel olarak PKK'nın gücü azalacak. PKK'nın gücünün azalması ülkemize derin bir rahatlama getirecek."
 assistance_from_ulkists:0 "Ülkücülerden Destek"
 assistance_from_ulkists_desc:0 "PKK'yı yok etmek için ülkücülerden destek aldık. PKK her alanda yok edilmeli ve bertaraf edilmeli."
 counter_pkk_arming:0 "PKK Karşıtı Silahlanma"
 counter_pkk_arming_desc:0 "Halkımızı PKK'ya karşı orduya katılmaya davet ediyoruz. Bu teröre son vereceğiz ve doğuyu bir barış merkezine dönüştüreceğiz. Yaşasın Türk Silahlı Kuvvetleri!"
 legalized_world_drug_trade:0 "Yasallaştırılmış Uyuşturucu Ticareti"
 legalized_world_drug_trade_desc:0 "Uyuşturucu ticareti mafya düzenindeki ülkemiz için bir nimet. Uyuşturucu ticaretinden elde edilebilecek gelir trilyonlara ulaşabilir. Kısacası uyuşturucu ticareti bizi her sektörde en zengin ve en güçlü yapar. Bu yüzden uyuşturucu ticaretine başlıyor ve onu güvenlikli konvoylarla destekliyoruz. Haydi, para kazanma zamanı!"
 legalized_world_drug_trade_convoys:0 "Uzmanlaşmış Uyuşturucu Ticareti"
 legalized_world_drug_trade_convoys_desc:0 "Uyuşturucu ticareti mafya düzenindeki ülkemiz için bir nimet. Uyuşturucu ticaretinden elde edilebilecek gelir trilyonlara ulaşabilir. Kısacası uyuşturucu ticareti bizi her sektörde en zengin ve en güçlü yapar. Bu yüzden uyuşturucu ticaretine başlıyor ve onu güvenlikli konvoylarla destekliyoruz. Haydi, para kazanma zamanı!"
 legalized_world_drug_trade_specialized:0 "İleri Düzeyde Uzmanlaşmış Uyuşturucu Ticareti"
 legalized_world_drug_trade_specialized_desc:0 "Uyuşturucu ticareti mafya düzenindeki ülkemiz için bir nimet. Uyuşturucu ticaretinden elde edilebilecek gelir trilyonlara ulaşabilir. Kısacası uyuşturucu ticareti bizi her sektörde en zengin ve en güçlü yapar. Bu yüzden uyuşturucu ticaretine başlıyor ve onu güvenlikli konvoylarla destekliyoruz. Haydi, para kazanma zamanı!"
 legalized_world_drug_trade_specialized_max:0 "Dünya Çapında Uyuşturucu Ticareti"
 legalized_world_drug_trade_specialized_max_desc:0 "Uyuşturucu ticareti mafya düzenindeki ülkemiz için bir nimet. Uyuşturucu ticaretinden elde edilebilecek gelir trilyonlara ulaşabilir. Kısacası uyuşturucu ticareti bizi her sektörde en zengin ve en güçlü yapar. Bu yüzden uyuşturucu ticaretine başlıyor ve onu güvenlikli konvoylarla destekliyoruz. Haydi, para kazanma zamanı!"
 turkish_interventionary_group:0 "Türk Müdahale Grubu"
 turkish_interventionary_group_desc:0 "Türk müdahale grubunun amacı bölgedeki mafya unsurlarını maddi ve manevi olarak desteklemek ve silahlandırmak."
 local_american_communists_help:0 "Yerel Amerikan Komünistlerinin Yardımı"
 local_american_communists_help_desc:0 "Amerika doğumlu komünistlerden destek istiyoruz. Onların desteği ABD'ye karşı savaşta bizi güçlendirebilir."
 south_american_help:0 "Güney Amerika Mafyalarının İstihbaratı"
 south_american_help_desc:0 "Amerika'daki Güney Amerika mafyalarının bilgisinden yararlanarak Amerika ile savaşıp onu yeneceğiz. Bekleyin, zafer geliyor!"
 poison_modified_cigarettes:0 "Zehirlenmiş Amerikalılar"
 poison_modified_cigarettes_desc:0 "Sigaralara zehir koyarak Amerikalıları zehirledik; böylece Amerikalıları kısa sürede işgal edeceğiz. Artık direnecek gücü kalmayan Amerika kesinlikle yakında teslim olacak."
 weakened_pentagon:0 "Sabote Edilmiş Pentagon"
 weakened_pentagon_desc:0 "Avrupalıların ordularını zehirledik; böylece Avrupalıları kısa sürede işgal edeceğiz. Artık direnecek gücü kalmayan Avrupa kesinlikle yakında teslim olacak."
 pakistani_help:0 "Pakistanlı Mafyaların İstihbaratı"
 pakistani_help_desc:0 "Avrupa'daki Pakistanlı mafyaların bilgisinden yararlanarak Avrupa ile savaşıp onu yeneceğiz. Bekleyin, zafer geliyor!"
 poisoned_europeans:0 "Zehirlenmiş Avrupa Kuvvetleri"
 poisoned_europeans_desc:0 "Avrupalıların ordularını zehirledik; böylece Avrupalıları kısa sürede işgal edeceğiz. Artık direnecek gücü kalmayan Avrupa kesinlikle yakında teslim olacak."
 chemical_weapons_on_europeans:0 "Avrupalılara Karşı Kimyasal Silah Kullanımı"
 chemical_weapons_on_europeans_desc:0 "Avrupalılara karşı kimyasal silah kullanacağız; böylece Avrupa kamuoyu savaş karşıtı olacak ve bundan yararlanarak Avrupa'yı rahatça işgal edeceğiz."
 local_muslims_help:0 "Yerel Müslümanların Yardımı"
 local_muslims_help_desc:0 "Avrupa'daki Müslümanlardan destek istiyoruz. Avrupa'daki Müslümanların desteği Avrupa'ya karşı savaşta bizi güçlendirebilir."
 poisoned_russians:0 "Zehirlenmiş Rus Kuvvetleri"
 poisoned_russians_desc:0 "Rusların ordularını zehirledik; böylece Rusları kısa sürede işgal edeceğiz. Artık direnecek gücü kalmayan Rusya kesinlikle yakında teslim olacak."
 industrial_powerhouse:0 "Mafya Sanayi Güç Merkezi"
 industrial_powerhouse_desc:0 "Mafya sanayileri ivme kazanarak güçlendi. Bu güçlenme bu ülkenin artık bir sanayi gücü olduğunun göstergesi. Yaşasın yeni sistem! Yaşasın Türkiye'nin sanayi çağı!"
 mafia_capitol:0 "Finanse Edilen Mafya Sermayesi"
 mafia_capitol_desc:0 "Mafya sermayelerinin bulunması ve iyi oranlarda kâr etmesi ülkemiz için çok önemli. Mafya kapitalistleri arz ve talepte ne kadar çok güven kazanırsa o kadar çok kâr eder."
 increased_mafia_capitol:0 "Güvenilir Mafya Sermayesi"
 increased_mafia_capitol_desc:0 "Mafya sermayelerinin bulunması ve iyi oranlarda kâr etmesi ülkemiz için çok önemli. Mafya kapitalistleri arz ve talepte ne kadar çok güven kazanırsa o kadar çok kâr eder."
 mafia_marketplaces:0 "Özel Mafya Pazarları"
 mafia_marketplaces_desc:0 "Mafyalar için özel pazarlar kurarak ekonomide belirli bir düzen sağlayacağız. Bu düzenle birlikte ekonomik tıkanıklıkları önlemeyi amaçlıyoruz."
 mafia_trade_union:0 "Mafya Ticaret Birliği"
 mafia_trade_union_desc:0 "Mafya ticaret birliğinin kurulmasıyla mafyalar arasındaki ulusal ve uluslararası ticaret kolaylaşacak ve ekonomik getiriler artacak. Ekonomik unsurların ortaya çıkması hepimiz için iyi."
 mafia_gold:0 "Mafya Altını"
 mafia_gold_desc:0 "Mafya altını bizim için önemli şeyler ifade ediyor. Mafyanın altın fazlasına sahip olması ülkemizin ekonomisinin ne kadar güçlü olduğunu gösteriyor. Mafyalarımızın altın kazancını artırmalıyız."
 mafia_gold_2:0 "Mafya Altın Madenleri"
 mafia_gold_2_desc:0 "Mafya altını bizim için önemli şeyler ifade ediyor. Mafyanın altın fazlasına sahip olması ülkemizin ekonomisinin ne kadar güçlü olduğunu gösteriyor. Mafyalarımızın altın kazancını artırmalıyız."
 mafia_gold_3:0 "Mafya Altınının Durumu"
 mafia_gold_3_desc:0 "Mafya altını bizim için önemli şeyler ifade ediyor. Mafyanın altın fazlasına sahip olması ülkemizin ekonomisinin ne kadar güçlü olduğunu gösteriyor. Mafyalarımızın altın kazancını artırmalıyız."
 new_taxation_system:0 "Yeni Vergi Sistemi"
 new_taxation_system_desc:0 "Eski vergi sistemini kaldırıp yeni bir sistem getiriyoruz. Bu yeni vergi sistemiyle halktan daha fazla para alacağız."
 taxing_immigrants:0 "Göçmenlerin Vergilendirilmesi"
 taxing_immigrants_desc:0 "Mültecilerden özel vergiler alınacak. Bu karar halkımızı mutlu etti. Çünkü mülteciler eskiden vergi ödemekle yükümlü değildi."
 expanded_KDV:0 "Genişletilmiş KDV"
 expanded_KDV_desc:0 "KDV'nin artırılmasıyla devletimiz daha fazla para kazanacak; devletimiz para kazanırsa mafyalarımız da otomatik olarak bundan faydalanacak ve güçlenecek."
 general_tax:0 "Topluma Ağır Vergiler"
 general_tax_desc:0 "Halkımıza ağır vergiler koyarak devletimizin kârını daha da artıracak ve dengeleri zorlayacağız. Mafyaların getirilerindeki artış asla durmamalı."
 supply_trade:0 "İkmal Ticareti"
 supply_trade_desc:0 "İkmal malzemeleri ticaretini genişletmemiz gerekiyor. Bilindiği gibi ticaretin gelişmesi devletin ekonomik kalkınmasını sağlar."
 military_trade:0 "Askerî Ticaret"
 military_trade_desc:0 "Askerî araç ticaretini genişletmemiz gerekiyor. Bildiğiniz gibi askerî ticaretin gelişmesi ordumuzun gelişimi, finansmanı ve güçlenmesi için büyük bir adımdır."
 land_of_criminality:0 "Suç Ticareti"
 land_of_criminality_desc:0 "Sıradan ve yasal şeylerin ticaretini yapmak gereksiz; çok az para kazandırıyor. Bu yüzden yasa dışı şeylerin ticaretini yapmak bizim için çok daha önemli. Bu sayede daha fazla para kazanabiliriz."
 powerized_industry:0 "Güçlendirilmiş Sanayi"
 powerized_industry_desc:0 "Sanayiyi güçlendirme sürecindeyiz; çünkü sanayisi kötü olan bir ülke asla gelişmez ve yerinde sayar."
 true_civilian_power:0 "Gerçek Sivil Güç"
 true_civilian_power_desc:0 "Askerî fabrikalardan daha önemli olan sivil fabrikalar inşa etmek gerekiyor. Askerî fabrikalar genel olarak kısa vadeli getiri sağlar. Sivil fabrikaların getirileri ise genellikle uzun vadeli ve daha iyidir."
 mafiatic_drain:0 "Mafya Krizi"
 mafiatic_drain_desc:0 "Mafya krizinin ortaya çıkma nedeni, mafyaların iktidarı ele geçirmesinin ardından ortada işleyen bir bürokrasinin kalmamasıdır. Bürokrasisi olmayan ülkeler zayıftır ve siyasi anlamda gelişemez."
 mafias_level_1:0 "Türk Mafyaları"
 mafias_level_1_desc:0 "Türkiye'de belirli sayıda mafya grubu var ve bu mafyalar Türk siyaseti üzerinde büyük etkiye sahip oldu."
 mafias_level_2:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_2_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_3:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_3_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_4:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_4_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_5:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_5_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_6:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_6_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_7:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_7_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_8:0 "Türk Mafyasıyla İşbirliği"
 mafias_level_8_desc:0 "Türk mafyasıyla işbirliğimiz sürdürülebilir bir konumda. Ülkemizdeki PKK ve komünist örgütlerin kökünü kazıyarak ülkemize huzur getireceğiz."
 mafias_level_2_D:0 "Türk Mafyasıyla Savaş"
 mafias_level_2_D_desc:0 "Kolluk kuvvetlerimiz mafyayla mücadele içinde. Yakında ülkemizdeki mafyaların sonunu getirecek ve ülkemize huzur ve istikrar sağlayacağız."
 mafias_level_3_D:0 "Türk Mafyasıyla Savaş"
 mafias_level_3_D_desc:0 "Kolluk kuvvetlerimiz mafyayla mücadele içinde. Yakında ülkemizdeki mafyaların sonunu getirecek ve ülkemize huzur ve istikrar sağlayacağız."
 mafias_level_4_D:0 "Türk Mafyasıyla Savaş"
 mafias_level_4_D_desc:0 "Kolluk kuvvetlerimiz mafyayla mücadele içinde. Yakında ülkemizdeki mafyaların sonunu getirecek ve ülkemize huzur ve istikrar sağlayacağız."
 institutionalism:0 "Kurumsalcılık"
 institutionalism_desc:0 "Kurumsalcılık (yeni kurumsalcı kuram olarak da anılır), resmî ve gayriresmî kuralların bireylerin ve grupların davranışları üzerindeki kısıtlayıcı ve olanak tanıyıcı etkilerine odaklanan, kurumları inceleme yaklaşımıdır."
 vision_of_european_union:0 "Avrupa Birliği Rüzgârları"
 vision_of_european_union_desc:0 "Avrupa Birliği rüzgârları ülkemizde hissediliyor ve halkımıza mutluluk veriyor. Artık Avrupa Birliği'ne katılmaya çok yakınız. Refahı lehimize çalıştırmaya çok yakınız! Avrupa Birliği hayalleri gerçek oluyor!"
 european_constitution_desc:0 "Batı'nın etkisiyle oluşan bir anayasa tasarımımız var. Bu Batılılaşmış anayasa sayesinde Avrupa Birliği'ne ve Batı'ya uyum sağlayacağız."
 european_border_protection:0 "Avro Bölgesi Sınır Koruması"
 european_border_protection_desc:0 "Avrupa Birliği'nin bölgelerini ve sınırlarını korumak zorundayız. Askerlerimizi sınırlara yığarak mültecilerin geçmesine izin vermeyeceğiz. Yaşasın Avrupa Bölgesi!"
 adopted_european_laws:0 "Benimsenen Avrupa Kanunları"
 adopted_european_laws_desc:0 "Avrupa kanunlarının ülkemizde tam etki göstermesini sağladık; böylece ülkemiz Avrupa kanunları sayesinde önemli bir hukuki refaha ulaştı."
 international_peace_forces:0 "Uluslararası Barış Kuvvetleri"
 international_peace_forces_desc:0 "Uluslararası barış gücünün amacı, silahlı temsilci kuvvetler aracılığıyla dünyada barışı sağlamaktır. Barış gücü, liderimiz Atatürk'ün "Yurtta sulh, cihanda sulh" sözü doğrultusunda oluşturuldu."
 european_studies:0 "Avrupa Çalışmaları"
 european_studies_desc:0 "Avrupa Birliği'nden alınan eğitim sistemiyle ülkemizin eğitimini ve bilincini ileri seviyelere taşıyacağız. Bu eğitim reformu ülkemize her açıdan katkı sağlayacak."
 full_accordance_with_UN:0 "BM Barış Önerisinin İmzacısı"
 full_accordance_with_UN_desc:0 "Ülke olarak Birleşmiş Milletler barış önerilerine imza atarak savaşa karşı kamuoyu gücü kazanacağız. Ayrıca bununla tüm uluslararası kamuoyu bizim yanımızda olacak."
 full_accordance_with_AIHM:0 "AİHM'ye Doğrudan Bağlı"
 full_accordance_with_AIHM_desc:0 "Artık mahkemelerimizi ve hukukumuzu tamamen AİHM'nin denetimine bırakıyoruz. Böylece hukuksuzluk ve iktidara bağımlılık oranı belirli ölçüde azalacak."
 anti_inflation_program:0 "Enflasyonla Mücadele Programı"
 anti_inflation_program_desc:0 "Enflasyonla mücadele programını açıklıyoruz. Bu programla fiyatlarda düşüş yaşayacağız. Enflasyon düşecek ve refahımız artacak!"
 powerful_g20_member:0 "Güçlü Bir G20 Üyesi"
 powerful_g20_member_desc:0 "G20'nin en güçlü ülkelerinden biriyiz ve bu durumu uluslararası konjonktürde kullanarak gücümüzü siyasi olarak istikrara kavuşturuyoruz."
 international_help_program:0 "Uluslararası Yardım Programı Katkıcısı"
 international_help_program_desc:0 "Uluslararası yardım programlarını destekleyen bir ülke olduk. Uluslararası yardım programlarını destekleyerek "Türkiye'nin sesinin daha çok duyulmasını sağlayacağız.""
 toki_working_faster:0 "TOKİ İnşaatları"
 toki_working_faster_desc:0 "TOKİ (Toplu Konut İdaresi Başkanlığı), Türkiye'nin devlet destekli konut kurumudur. 1984'te kurulan TOKİ, hükümetin yapı ve toplu konut öncelikleri doğrultusunda başta Türkiye genelinde olmak üzere projeler ve faaliyetler yürütür."
 reliable_president:0 "Güvenilir Cumhurbaşkanı"
 reliable_president_desc:0 "Güvenilir bir cumhurbaşkanımız var. Bu güvenilirlik bize bağlılık ve güç veriyor. Hangi halk güvenilir bir yönetime sahip olmak istemez ki?"
 mit_empowered:0 "Millî İstihbarat Teşkilatı"
 mit_empowered_desc:0 "MİT, Türkiye Cumhuriyeti'nin ülke ve millet bütünlüğüne, varlığına, bağımsızlığına, güvenliğine, anayasal düzenini ve millî gücünü oluşturan tüm unsurlarına karşı içeriden ve dışarıdan yöneltilen mevcut ve muhtemel tehditler hakkında istihbarat toplamakla görevlidir. MİT bu istihbaratı gerektiğinde Cumhurbaşkanına, Genelkurmay Başkanına, Millî Güvenlik Kurulu Genel Sekreterine ve ilgili diğer devlet kuruluşlarına iletmekle yükümlüdür."
 euro_defence:0 "Resmîleşen Avro Savunması"
 euro_defence_desc:0 "Avro koruma bölgesini kurduk. Bu koruma bölgesi sayesinde ekonomik olarak Amerika güdümünde olmayacağız. Avrupa ekonomisi, Amerika ne yaşarsa yaşasın bağımsız ve etkilenmeden kalacak."
 fulfilled_order:0 "Tamamlanan Liberal Düzen"
 fulfilled_order_desc:0 "Yeni bir liberal düzen kuruldu. Bu liberal düzen sayesinde Batılılaşmış sistemin itibarını ve kalıcılığını yaşayacağız. Liberal devrimin istikrarı durmayacak!"
 echological_laws:0 "Ekolojik Kanunlar"
 echological_laws_desc:0 "Yeni ekolojik yapı ve kanunlarla doğamızı ve istikrarımızı koruyacağız. Bu ekolojik kanunlar ekolojiye zarar veren olaylar için öngörülen hapis cezalarını kesin bir şekilde artırıyor."
 factory_filter_law:0 "Fabrika Filtresi Kanunu"
 factory_filter_law_desc:0 "Fabrikalar için duman kanununun amacı fabrikaların ürettiği karbondioksiti sınırlamak. Bu sınırlamayla birlikte halkımızın ve işçilerimizin sağlığında ve zihinsel gelişiminde artışlar olacak."
 industrialization_law:0 "Sanayileşme Kanunu"
 industrialization_law_desc:0 "Artık sanayileşmeye ilişkin bir kanun çıkararak sanayinin planlı bir şekilde yürütülmesini sağlayacağız. Planlı sanayiler genellikle ekolojiye zarar veren bir yapıda değildir."
 high_quality_engines:0 "Yüksek Kaliteli Motorlar"
 high_quality_engines_desc:0 "Motor sanayisindeki yenilikleri artırarak motorların daha hızlı çalışmasını sağlayacağız. Yenilikler silahlanmada ve sivil kullanımda gelişmemizi sağlayacak."
 liberal_war_economy:0 "Liberal Savaş Ekonomisi"
 liberal_war_economy_desc:0 "Savaş ekonomisini liberal bir rotada kullanacağız. Bu sayede ekonomimizi savaşa hazır bir kapasiteye getireceğiz ve savaş sırasında da yatırım alacağız. Böylece büyük bir savaş çıktığında ekonomimiz belirli bir süre zarar görmeyecek."
 liberal_studies:0 "Liberal Araştırmalar"
 liberal_studies_desc:0 "Liberal ve uyumlu bir gençlik oluşuyor. Bu gençlik sayesinde yenilikler ve ilerleme sistemli ve düzenli hâle gelecek."
 KDK_strenghened:0 "KDK"
 KDK_strenghened_desc:0 "Türkiye Cumhuriyeti hükümetinin faaliyetlerinin insan haklarına saygı çerçevesinde hukuka ve hakkaniyete uygunluğu hakkında şikâyetleri inceleyen, araştıran ve önerilerde bulunan bir Türk kurumudur. Kurum hükümetten bağımsızdır ve yalnızca Meclise karşı sorumludur. Hem gerçek hem tüzel kişilerin şikâyetlerini değerlendirir. Yabancılar da Kuruma şikâyette bulunabilir."
 stopped_changing_of_the_liberalism:0 "Korunan Liberalizm"
 stopped_changing_of_the_liberalism_desc:0 "Gelişen konjonktür nedeniyle liberalizmin değişmesine izin vermeyeceğiz. Liberalizm her zaman aynı çizgide ilerleyecek! Başka bir yola sapmayacak! Saparsa mutlak bir istikrarsızlık doğar."
 democratic_pressure:0 "Batı Baskısı"
 democratic_pressure_desc:0 "Bu ülkedeki Batı baskısı sonucunda liberalizm yeniden güç kazanmaya başladı. Bu baskılar siyasi gücümüze ve milliyetçiliğimize çok zarar veren unsurlar arasında."
 liberal_islamic_state:0 "Liberal İslami Devlet"
 liberal_islamic_state_desc:0 "Liberalizmi İslamcılıkla harmanlayarak yeni düzenin bir biçimini yarattık. Bu biçimde artık hem din hem de liberalizm var. Yarattığımız bu düzen sayesinde artık ekonomik ve sosyal zorluklar yaşamayacağız."
 specialized_arms_industry:0 "Uzmanlaşmış Silah Sanayisi"
 specialized_arms_industry_desc:0 "Savunma sanayisindeki kısmi özelleştirmeler, ülkemizin askerî alanda genişlemesine büyük destek sağlayacak. Liberal bir yönetimde liberalizmin daha büyük rol oynaması ve hatta orduya bile dahil olması genel kazancımızı artırıyor."
 tradesman_support_package:0 "Esnaf Destek Programı"
 tradesman_support_package_desc:0 "Esnaf destek paketinin amacı esnafın daha güçlü hâle gelmesini sağlayarak ekonominin iç rekabette iyi durumda olmasını temin etmek. İç rekabet ekonomilerin gelişimi için çok önemlidir."
 liberal_brain:0 "Liberal Beyin"
 liberal_brain_desc:0 "Liberal Beyin stratejisi kapsamında liberalizm, insanları küreselleşen yenilikle rekabet ettirmek için piyasalara büyük destek sağlıyor."
 holy_european_imperialism:0 "Kutsal Avrupa Emperyalizmi"
 central_bank_reselves_law:0 "Merkez Bankası Rezervleri Kanunu"
 central_bank_reselves_law_desc:0 "Merkez Bankası rezerv kanunuyla rezervlerin kontrolü ve denetimi sağlanacak; rezervlerde artış ya da azalış gibi bir durum olursa kamuoyu bilgilendirilecek."
 multi_party_state:0 "Güvenceli Çok Partili Devlet"
 multi_party_state_desc:0 "Yapılan reformlarla çok partili sistem kesinleşti ve koruma altına alındı. Bir ülkede tek bir düşünce hâkim olursa o ülke düşünce bakımından fakirleşir."
 protected_elites:0 "Korunan Elitler"
 protected_elites_desc:0 "Elitler Osmanlı yönetiminin kurulmasını desteklemeli. Üst sınıfın desteği alt sınıfın gülünç desteğine benzemez. Elitlerin desteğini almak için onlara koruma sağlamak şu an yapabileceğimiz doğru hamlelerden biri gibi görünüyor."
 funded_elites:0 "Finanse Edilen Elitler"
 funded_elites_desc:0 "Elitler Osmanlı yönetiminin kurulmasını desteklemeli. Üst sınıfın desteği alt sınıfın gülünç desteğine benzemez. Elitlerin desteğini almak için onlara para vermek şu an yapabileceğimiz doğru hamlelerden biri gibi görünüyor."
 systematic_elite_boost:0 "Sistemli Olarak Korunan Elitler"
 systematic_elite_boost_desc:0 "Elitler Osmanlı yönetiminin kurulmasını desteklemeli. Üst sınıfın desteği alt sınıfın gülünç desteğine benzemez. Sistemli koruma ve kazanç sağlayarak elitlerin desteğini sonsuz kılacağız."
 cooperation_with_islamists:0 "İşbirlikçi İslamcılar"
 cooperation_with_islamists_desc:0 "Bazı İslamcılar işbirliğine sıcak bakmıyor. Sıcak bakmaları için belirli bir propaganda yürütüyoruz; desteklerini almamız için yanımızda olmaları gerekiyor."
 allied_with_jihadists:0 "Cihatçılarla İttifak"
 allied_with_jihadists_desc:0 "Cihatçılarla müttefik olduk. Cihatçılar ülkemizi gayrimüslim unsurlardan koruyacak ana güç. Onların arkasında onurla durmalıyız."
 replaced_mayors:0 "Değiştirilen Belediye Başkanları"
 replaced_mayors_desc:0 "Yönetim kademelerini kontrol ettiğimiz için belediye başkanları isteğimize göre değişiyor. Bu değişimle kendimize müttefik belediye başkanları elde edeceğiz. Bu belediye başkanları ülkenin dört bir yanında bulunacak ve Osmanlı hareketimize destek verecek."
 replaced_mayors_allied:0 "Müttefik Belediye Başkanları"
 replaced_mayors_allied_desc:0 "Belediye başkanlarının hepsi bize olumlu bakıyor. Bu olumlu bakış açısı görünmez bir güç olduğumuzun göstergesi. Yakında görünmez güçten tam güce geçeceğiz!"
 no_interest_rate_policy:0 "%0 Faiz Politikası"
 no_interest_rate_policy_desc:0 "İslam'da faiz haram olduğu için faizin sıfırlanmasına karar verildi. Faizin sıfırlanması ev sahibi olmayı kolaylaştırırken ekonomimize bir yük gibi çöktü."
 saviour_crescent:0 "Kurtarıcı Hilal"
 saviour_crescent_desc:0 "İslam'ın sembolü olan hilal, ordumuzun ve halkımızın moral kaynağı. Bu moral ve destekle İslam uğruna pek çok fetih yapacağız."
 islamic_cooperationism:0 "İslami İşbirlikçilik"
 islamic_cooperationism_desc:0 "İslam'ın destekçileriyle işbirliği yaparak milletimize güç katmak gerekiyor. İslam'ın destekçileri İslam devleti olan devletten destek almalı."
 ibda_c_cooperationism:0 "İBDA-C ile İşbirliği"
 ibda_c_cooperationism_desc:0 "Radikal İslamcı bir örgüt olan İBDA-C ile anlaşma imzalayıp işbirliği yaptık. Bu işbirliği sonucunda bazı askerî ve sosyal faydalar elde ediyoruz."
 ibda_c_cooperationism_2:0 "İBDA-C ile İttifak"
 ibda_c_cooperationism_2_desc:0 "Radikal İslamcı bir örgüt olan İBDA-C ile anlaşma imzalayıp ittifak kurduk. Bu ittifak sonucunda bazı askerî ve sosyal faydalar elde ediyoruz."
 ibda_c_cooperationism_3:0 "İBDA-C ile İttifak"
 ibda_c_cooperationism_3_desc:0 "Radikal İslamcı bir örgüt olan İBDA-C ile anlaşma imzalayıp ittifak kurduk. Bu ittifak sonucunda bazı askerî ve sosyal faydalar elde ediyoruz."
 hezbollah_cooperationism:0 "Hizbullah ile İşbirliği"
 hezbollah_cooperationism_desc:0 "İran'ın bir kolu olarak bilinen Hizbullah ile anlaşma imzalayıp işbirliği yaptık. Bu işbirliği sonucunda bazı askerî ve sosyal faydalar elde ediyoruz."
 hezbollah_cooperationism_2:0 "Hizbullah ile İttifak"
 hezbollah_cooperationism_2_desc:0 "İran'ın bir kolu olarak bilinen Hizbullah ile anlaşma imzalayıp ittifak kurduk. Bu ittifak sonucunda bazı askerî ve sosyal faydalar elde ediyoruz."
 communistic_organizations_crushed:0 "Komünizm Karşıtı Doktrin"
 communistic_organizations_crushed_desc:0 "Ülkemizde artık komünistlerin değil, İslam'ın sancağı dalgalanıyor. Bunun için komünizm karşıtı bir doktrin benimsiyoruz. Bu komünizm karşıtı doktrin dinden kopmaya karşı kurtarıcı unsurlarımızdan biri olacak."
 communistic_organizations_crushed_2:0 "Komünizm Karşıtı Doktrin"
 communistic_organizations_crushed_2_desc:0 "Ülkemizde artık komünistlerin değil, İslam'ın sancağı dalgalanıyor. Bunun için komünizm karşıtı bir doktrin benimsiyoruz. Bu komünizm karşıtı doktrin dinden kopmaya karşı kurtarıcı unsurlarımızdan biri olacak."
 repair_the_state:0 "Devleti Onarmak..."
 repair_the_state_desc:0 "Ülkemiz savaş sırasında çok fazla kayıp verdi, şehirler yerle bir oldu. Bomba sesleri ülkenin her yerinde hissedildi, ama artık savaş dönemi sona erdi. Artık ülkemizi yeniden yapılandırıyor ve savaş sanayilerine verilen desteği tamamen kaldırıyoruz. Refah zamanı!"
 repair_the_mobilization:0 "Seferberliğin Etkilerini Onarmak"
 repair_the_mobilization_desc:0 "Olağan nüfus artışı seferberlik nedeniyle büyük kayıplar verdi. Bu kayıplar nedeniyle nüfus azalmaya başladı. Bu durumu düzeltme zamanı geldi. Seferberliği bitirdiğimize göre halkımızı yeniden toparlayabiliriz."
 dusts_of_the_kemalist_guardians:0 "Kemalist Muhafızların Kalıntıları"
 dusts_of_the_kemalist_guardians_desc:0 "İç Savaş'ın ardından silahlar sustu. Mustafa Kemal'in izinden giden birliklerin çoğu İslam ordularımız tarafından yok edildi, ancak Kemalist orduların etkileri hâlâ hissediliyor. Çünkü ordunun işleyişi geleneksel ve kalıplaşmış. Bu gülünç gelenekleri reformlarla yok edeceğiz."
 dusts_of_the_kemalist_guardians_2:0 "Kemalist Muhafızların Kalıntıları"
 dusts_of_the_kemalist_guardians_2_desc:0 "İç Savaş'ın ardından silahlar sustu. Mustafa Kemal'in izinden giden birliklerin çoğu İslam ordularımız tarafından yok edildi, ancak Kemalist orduların etkileri hâlâ hissediliyor. Çünkü ordunun işleyişi geleneksel ve kalıplaşmış. Bu gülünç gelenekleri reformlarla yok edeceğiz."
 dusts_of_the_kemalist_guardians_3:0 "Kemalist Muhafızların Kalıntıları"
 dusts_of_the_kemalist_guardians_3_desc:0 "İç Savaş'ın ardından silahlar sustu. Mustafa Kemal'in izinden giden birliklerin çoğu İslam ordularımız tarafından yok edildi, ancak Kemalist orduların etkileri hâlâ hissediliyor. Çünkü ordunun işleyişi geleneksel ve kalıplaşmış. Bu gülünç gelenekleri reformlarla yok edeceğiz."
 dusts_of_the_kemalist_guardians_4:0 "Kemalist Muhafızların Kalıntıları"
 dusts_of_the_kemalist_guardians_4_desc:0 "İç Savaş'ın ardından silahlar sustu. Mustafa Kemal'in izinden giden birliklerin çoğu İslam ordularımız tarafından yok edildi, ancak Kemalist orduların etkileri hâlâ hissediliyor. Çünkü ordunun işleyişi geleneksel ve kalıplaşmış. Bu gülünç gelenekleri reformlarla yok edeceğiz."
 islamic_army_traditions:0 "İslami Ordu Gelenekleri"
 islamic_army_traditions_desc:0 "Ordunun bozulan geleneklerini yeniden yapılandırdık. Ordumuz artık eskisi gibi İslami geleneklere sahip. Bu gelenekler ordumuza son derece güçlü bir birlik etkisi veriyor."
 replaced_kemalist_institutions:0 "Değiştirilen Kemalist Kurumlar"
 replaced_kemalist_institutions_desc:0 "Ülkemize katkıda bulunmuş Kemalist kurumları hemen devre dışı bırakıp yerlerine İslamcı kurumlar koyduk. Böylece değişimden kaynaklanan kurumsal bir sorun yaşamayacağız."
 no_economical_freedom:0 "Kontrollü Ekonomik Özgürlük"
 no_economical_freedom_desc:0 "Ekonomik özgürlükler ekonomiye zarar vermekten başka bir şey yapmadı; bu yüzden ülkemizde finansmanı ve ekonomik özgürlükleri yasaklayarak ekonominin kontrolünü ele alıyoruz."
 fez_traditions:0 "Fes Gelenekleri"
 fez_traditions_desc:0 "Osmanlı İmparatorluğu'nun geri dönüşü ve alışılagelmiş yasakların reddedilmesiyle yasaklı fes geleneği yeniden gelişti. Halkımız başına ne isterse onu takabilir!"
 ottoman_language_partially:0 "Osmanlıcanın Etkilediği Güncel Dil"
 ottoman_language_partially_desc:0 "Eski laik, arı dil yerine eski Arapça etkili dilimize döndük. Ancak alfabemizde hâlâ Latin etkisi var, çünkü alfabeyi tamamen değiştirmek ülkeye çok fazla zarar verebilir."
 destroy_the_statues:0 "Yıkılan Heykel Sanayisi"
 destroy_the_statues_desc:0 "Etrafımıza sürekli heykel diken iktidar sahiplerinden kurtulduğumuza göre tüm heykellerimizi yıkabiliriz. Putperestliğe sonsuza dek ölüm!"
 secondary_jihadists_state:0 "İkinci Bir İslam Devleti"
 secondary_jihadists_state_desc:0 "İlk Radikal İslam Devleti yıkıldı. Bu ikinci radikal İslam devleti. Bu ikinci devlet asla birincisi gibi yıkılmayacak; pek çok fetihle İslam'ı yayacak ve güçlendirecek!"
 global_jihadists:0 "Küresel Cihatçılar"
 global_jihadists_desc:0 "Dünyanın dört bir yanından cihatçılar ülkemize çağrılıyor; bu çağrıyla iş gücü olarak sıkıntı çekmeden kolayca fetihler yapabileceğiz. Güç birlikten doğar!"
 prepared_for_the_sanctions:0 "Yaptırım Misillemelerine Hazır"
 prepared_for_the_sanctions_desc:0 "Bize karşı büyük yaptırımlar gelecek. Bu yaptırımlara hazırlıklı olmalıyız, çünkü bu yaptırımlar bilinen olağan yaptırımlara benzemeyecek."
 unpausable_war_condititions:0 "Durdurulamaz Savaş Hazırlıkları"
 unpausable_war_condititions_desc:0 "Asla bitmeyecek, yıllar sürecek bir savaşa hazırlanıyoruz. Bu savaş tüm ülkenin kaderini ve statüsünü belirleyecek."
 full_mobilization:0 "Topyekûn Seferberlik"
 full_mobilization_desc:0 "Ülkemizi topyekûn seferberliğe çağırıyoruz. Bu vatanın size ihtiyacı var!"
 no_turning_back:0 "Geri Dönüş Yok..."
 no_turning_back_desc:0 "Artık asla bitmeyecek bir savaşa giriyoruz. Bu savaştan geri dönüş yok. Arkamızdaki tüm köprüleri yaktık."
 desert_warfare:0 "Çöl Kuvvetleri"
 desert_warfare_desc:0 "Çöl ordularının temel amacı Afrika'da ve sıcak bölgelerde ilerlemeyi hızlandırmak. Çölde ya da sıcak bir bölgede düzenli bir orduyla ilerlemek düşünülemez."
 camel_warfare:0 "Deve Savaşı"
 camel_warfare_desc:0 "Develerden oluşan çöl ordularının temel amacı Afrika'da ve sıcak bölgelerde ilerlemeyi hızlandırmak. Çölde ya da sıcak bir bölgede düzenli bir orduyla ilerlemek düşünülemez. Bu yüzden böyle bir muharebede develer oldukça önemli."
 camel_blitzkrieg:0 "Deve Yıldırım Harekâtı"
 camel_blitzkrieg_desc:0 "Develerden oluşan çöl ordularının temel amacı Afrika'da ve sıcak bölgelerde ilerlemeyi hızlandırmak. Çölde ya da sıcak bir bölgede düzenli bir orduyla ilerlemek düşünülemez. Bu yüzden böyle bir savaşta develer çok önemli; develer birlikleri kuşatacak güce bile sahip."
 anti_usa_arms:0 "ABD Kuvvetlerine Karşı Etkili Ordu"
 anti_usa_arms_desc:0 "Amerikan askerî modeline karşı bir askerî düzen kurduk. Kurduğumuz bu askerî düzen sayesinde Amerika'nın emperyalist güçlerini kolayca yenebileceğiz."
 hard_breakthorugh_strategies:0 "Sert Tank Yarma Stratejileri"
 hard_breakthorugh_strategies_desc:0 "Ağır tankların cephe yarma taktiklerini benimseyerek ülkemize düşman olan milletlerin cephelerini yaracak ve düşman ülkelerin gücüne son vereceğiz."
 embraced_hardcore_revenge_policies:0 "Benimsenen İntikam Politikaları"
 embraced_hardcore_revenge_policies_desc:0 "Halkımıza intikam duygusu aşılayarak ülkemize güç katacağız. Çünkü intikam duygusu zaferlerin gelmesini sağlayan bir numaralı araçtır."
 throwable_man_to_the_front:0 "Kalabalık Kuvvetler İçin Verimli İkmal Sistemi"
 throwable_man_to_the_front_desc:0 "Yeni bir sistem izleyerek büyük orduların yiyecek ve mühimmat sıkıntısı yaşamasını önleyeceğiz; büyük ordular ikmal sorunu çekmeyecek."
 stuck_the_conflict:0 "Koru ve Bir Adım Bile Geri Çekilme!"
 stuck_the_conflict_desc:0 "Savunma politikası izleyerek tüm taarruz faaliyetlerini askıya alacak ve bir adım bile geri çekilmeyeceğiz. Böylece düşmanlarımızla sınırlarımız değişmeyecek ve onlar da muharebeden vazgeçecek."
 umayyad_navy_production:0 "Görkemli Emevî Tarzı Donanma Geliştirme Planı"
 stabilizing_the_great_state:0 "Büyük Devleti İstikrara Kavuşturmak"
 stabilizing_the_great_state_desc:0 "Ülkemizin dayanıklılığı ve istikrarı savaş sonucunda çok sarsıldı. Bu sarsıntıdan kurtulmak için istikrar programı kapsamında ülkemize huzur getiriyoruz."
 recovering_from_the_great_islamic_war:0 "Büyük Din Savaşı'ndan Toparlanmak"
 recovering_from_the_great_islamic_war_desc:0 "Din için verdiğimiz savaşta başarıya ulaştık. Ancak ülkemizde neredeyse sağlam ev kalmadı. Artık sosyal refahı sağlamalı ve millî ekonomiyi güçlendirmeliyiz. Bu amaçla toparlanma politikaları oluşturuyoruz."
 trying_to_overcome_heavy_casualties:0 "Savaştaki Can Kayıplarının Üstesinden Gelmeye Çalışmak"
 trying_to_overcome_heavy_casualties_desc:0 "Ülkemizde yaşayan insan sayısı savaş nedeniyle büyük ölçüde azaldı. İş gücü ağır şekilde kırıldı. Artık bu durumdan çıkmamız gerekiyor. İşleri yoluna koymak için uzun vadeli bir program işe yarayacak gibi görünüyor."
 rocketing_the_GDP:0 "GSYH'yi Uçurmak"
 rocketing_the_GDP_desc:0 "Ülkemizde GSYH seviyeleri düşük olduğu için GSYH'yi yükseltecek planlara girişiyoruz. Başarıyla düzenlediğimiz bu planlarla GSYH'yi uzun vadede 5 kat artıracağız."
 reliable_islamic_movement:0 "Güvenilir İslami Hareket"
 reliable_islamic_movement_desc:0 "İslam bir güven dinidir. İslam ülkesinde güven yoksa İslam'la bağdaşmayan bir devlet oluruz. Bu durumu önlemek için ülkemizde İslam'ı bir güven aracı olarak kullanacağız."
 ottoman_neutralism:0 "Osmanlı Tarafsızlığı"
 ottoman_neutralism_desc:0 "Osmanlı İmparatorluğu'nun bekası için Osmanlı tarafsızlığını benimsiyoruz. Bu tarafsızlık politikası bizi şimdilik savaşlardan uzak tutacak; zamanı geldiğinde savaşlara gireceğiz."
 returning_to_ottoman_values:0 "Geleneksel Osmanlı Cemaatleri"
 returning_to_ottoman_values_desc:0 "Osmanlı İmparatorluğu'nun geleneksel cemaatlerini kullanarak oy kazanacak, bu oy kazancıyla güç ve popülerlik elde edeceğiz."
 returning_to_ottoman_values_2:0 "Geleneksel Osmanlı Cemaatleri"
 returning_to_ottoman_values_2_desc:0 "Osmanlı İmparatorluğu'nun geleneksel cemaatlerini kullanarak oy kazanacak, bu oy kazancıyla güç ve popülerlik elde edeceğiz."
 returning_to_ottoman_values_3:0 "Geleneksel Osmanlı Cemaatleri"
 returning_to_ottoman_values_3_desc:0 "Osmanlı İmparatorluğu'nun geleneksel cemaatlerini kullanarak oy kazanacak, bu oy kazancıyla güç ve popülerlik elde edeceğiz."
 parliament_stays_in_course:0 "Meclis Çalışmalarını Sürdürüyor"
 parliament_stays_in_course_desc:0 "Meclis mevcut monarşinin izniyle hayatını sürdürecek. Monarşide demokratik unsurları korumak önemli ölçüde gerekli."
 parliament_stays_in_semi_course:0 "Yarı Aktif Meclis Çalışmalarını Sürdürüyor"
 parliament_stays_in_semi_course_desc:0 "Meclis mevcut monarşinin yarı denetimi altında hayatını sürdürecek. Monarşide bazı demokratik unsurları korumak önemli ölçüde gerekli."
 parliament_abolished:0 "Lağvedilen Meclis"
 parliament_abolished_desc:0 "Meclis, monarşinin mutlak otoritesiyle feshedildi. Monarşinin mutlak olması sayesinde demokrasi gibi gereksiz şeylere yer vermeden yönetimi tamamen sağlayabiliriz."
 fast_decision_staff:0 "Hızlı Karar Kadrosu"
 fast_decision_staff_desc:0 "Meclisin kapatılması ve yavaşlatıcı demokratik unsurların ortadan kaldırılmasıyla hızlı bir karar alma mekanizması kurduk. Hızlı karar mekanizması üst düzeyde güç göstermemizi ve ani saldırılar yapmamızı sağlayacak."
 ottoman_constitution:0 "Osmanlı Anayasası"
 ottoman_constitution_desc:0 "Osmanlı İmparatorluğu'nun anayasa tasarımını tamamlayıp yürürlüğe koyduk. Bu anayasa sayesinde laiklikten uzak bir devlet olacak ve ülkemizin siyasi birliğini ve gücünü kolayca sağlayacağız."
 islamization_of_kurds:0 "Kürtlerin İslamlaştırılması"
 islamization_of_kurds_desc:0 "Kürtleri İslamlaştırarak terörist olmalarını önleyeceğiz. Bu hamle terörü azaltmak için yapılabilecek iyi hamlelerden biri olacak."
 modern_museums:0 "Modern Müzeler"
 modern_museums_desc:0 "Modern müzeler inşa ederek Osmanlı İmparatorluğu'nda modern kültürün yayılmasını sağlayacağız. Kültür insanların zihnine bilgi ve modernleşme getirir."
 tubitak_reformed:0 "Reforme Edilmiş TÜBİTAK"
 tubitak_reformed_desc:0 "TÜBİTAK'ı reforme ederek onu eskisi gibi kamu yararına hizmet eden bir kuruma dönüştürdük. Artık bilim açısından geride kaldığımız bir durum olamaz."
 rasathaneler_s:0 "Rasathaneler"
 rasathaneler_s_desc:0 "Rasathane, karasal, denizel ya da göksel olayları gözlemlemek için kullanılan bir yerdir. Astronomi, klimatoloji/meteoroloji, jeofizik, oşinografi ve volkanoloji, rasathanelerin kurulduğu disiplinlere örnektir."
 science_supervision_institutions:0 "Osmanlı Bilim Denetim Kurumu"
 science_supervision_institutions_desc:0 "Osmanlı Bilimsel Denetim Kurumu'nu kurarak ülkemizde bilim hırsızlığını önleyeceğiz; bu sayede patent hırsızlığı gibi vakalar yaşanmayacak."
 fez_traditions_enforced:0 "Zorunlu Kılınan Fes Geleneği"
 fez_traditions_enforced_desc:0 "Fes geleneğini zorunlu tutarak fes geleneğinin asla kaybolmamasını ve sonsuza dek sürecek bir biçime gelmesini sağlayacağız."
 modern_and_cultural_museums:0 "Modern ve Kültürel Müzeler"
 hilali_ahmer_cemiyeti:0 "Osmanlı Hilal-i Ahmer Cemiyeti"
 hilali_ahmer_cemiyeti_desc:0 "Kızılay'ın halka yeniden düzgün hizmet vermesini sağlamak için bazı küçük değişiklikler yapacağız. Kızılay'ın kamuya faydası geçmişte olduğu gibi yüksek seviyede olacak."
 mehter_group:0 "Yeniden Düzenlenen Ordu Mehter Takımı"
 mehter_group_desc:0 "Ordudaki mehter takımını yönlendirerek mehter takımının yeniden milliyetçi marşlar bestelemesini sağlayacağız; bu marşlar aracılığıyla orduda bir birlik ve moral havası yaratacağız."
 unitary_state_principles:0 "Üniter Devlet İlkeleri"
 german_assistance:0 "Alman Yardımı"
 german_assistance_desc:0 "Birinci Dünya Savaşı'nda olduğu gibi Almanya'nın arkasında ve yardımcısı olarak duracağız. Ama bu kez Almanya'nın arkasında durup geçmişte yaşanan felaketlerin intikamını alacağız."
 turkish_war_machine:0 "Türk Savaş Makinesi"
 turkish_war_machine_desc:0 "Osmanlı İmparatorluğu bir Türk savaş makinesine dönüştü. Ülkemiz gerekli bir silahı çok kısa sürede üretebiliyor."
 long_term_invasion_planning:0 "Uzun Vadeli İşgal Planlaması"
 long_term_invasion_planning_desc:0 "Uzun vadede planlar ve hesaplar yaparak savaşlara gireceğiz ve sonunda galip çıkacağız. Planlar ve hesaplar dünya tarihinde her zaman sıradan doğaçlamadan üstün olmuştur."
 controlled_population_movements:0 "Kontrollü Nüfus Hareketleri"
 controlled_population_movements_desc:0 "Ülkemiz büyük olduğu için ülkemizde yaşanan göç ve nüfus hareketleri kontrol edilmeli. Nüfus hareketleri denetimsiz bırakılırsa çok fazla sorun ortaya çıkar."
 ottoman_mountainner_division:0 "Osmanlı Özel Dağ Birlikleri"
 ottoman_mountainner_division_desc:0 "Osmanlı Özel Dağ Birliklerinin amacı her türlü yüksek rakımlı dağ gibi yerlerde güçlü bir muharebe gücüne sahip olmaktı."
 ottoman_cavalary_and_mountainner_forces:0 "Osmanlı Özel Dağ Birlikleri ve Süvarileri"
 ottoman_cavalary_and_mountainner_forces_desc:0 "Osmanlı Özel Dağ Birlikleri ve Süvarilerinin amacı yüksek rakımlı dağlar gibi yerlerde ve çöller gibi sıcak yerlerde güçlü bir muharebe gücüne sahip olmaktı."
 ottoman_interventionism:0 "Osmanlı Müdahaleciliği"
 ottoman_interventionism_desc:0 "Osmanlı müdahaleciliğini benimseyerek bölgede bilgimiz dışında hiçbir şeyin yaşanmasını önleyeceğiz."
 building_ottoman_naval_forces:0 "Karadeniz Donanma-yı Hümayun'unun Kurulması"
 building_ottoman_naval_forces_desc:0 "Geçmişte yok edilen Osmanlı Karadeniz donanmasını yeniden yapılandırma çalışmalarına giriştik. Eski donanmamızı yeniden kuracak ve Karadeniz'in kontrolünü eskisi gibi ele alacağız."
 funded_ottoman_naval_forces:0 "Karadeniz Donanma-yı Hümayun'unun Kurulması"
 funded_ottoman_naval_forces_desc:0 "Geçmişte yok edilen Osmanlı Karadeniz donanmasını yeniden yapılandırma çalışmalarına giriştik. Eski donanmamızı yeniden kuracak ve Karadeniz'in kontrolünü eskisi gibi ele alacağız."
 med_navalshipments:0 "Akdeniz Deniz Sevkiyatları"
 med_navalshipments_desc:0 "Osmanlıların şu anda sahip olduğu Akdeniz deniz alanlarını genişleterek ülkemizin Akdeniz ticaret havzasını ve sevkiyatlarını güçlendirmesini sağlayacağız."
 industrialization_program_for_ottomans:0 "Osmanlı Sanayileşme Programı"
 industrialization_program_for_ottomans_desc:0 "Osmanlı İmparatorluğumuzun sanayileşme zamanı geldi. Osmanlı İmparatorluğu'nun sanayileşmesi kapsamında artık pek çok yenilik ve plan yapacağız. Bu planlar sayesinde güçlü bir devlet konumuna ulaşacağız!"
 ottoman_lira:0 "Osmanlı Lirası"
 ottoman_lira_desc:0 "Türk lirasının etkisizliği ve zayıflığının ardından geliştirdiğimiz Osmanlı lirası sayesinde halkımız artık mutlu ve kendini daha güçlü hissediyor. Umarız hep böyle devam eder."
 toki_cooperatives_ottoman:0 "Osmanlı TOKİ'si"
 toki_cooperatives_ottoman_desc:0 "TOKİ'yi Osmanlılaştırarak onu yeniden halka fayda sağlayabilecek bir devlet kuruluşuna dönüştüreceğiz. Konut idaresinde yapacağımız reformlar ülkemiz için faydalı olacak."
 supporting_foundation_culture:0 "Osmanlı Vakıf Kültürü"
 supporting_foundation_culture_desc:0 "Osmanlı İmparatorluğu'nda yok edilen vakıf geleneklerini yeniden canlandırarak bu vakıflar aracılığıyla ülkemizin hızla kalkınmasını sağlayacağız."
 ottoman_lira_valuable:0 "Değerli Osmanlı Lirası"
 ottoman_lira_valuable_desc:0 "Türk lirasının etkisizliği ve zayıflığının ardından geliştirdiğimiz Osmanlı lirası sayesinde para birimimiz eskisinden çok daha güçlü olduğu için halkımız artık mutlu ve kendini daha güçlü hissediyor. Umarız hep böyle devam eder."
 powerized_gold:0 "Güçlendirilmiş Altın"
 powerized_gold_desc:0 "Altın, Osmanlı İmparatorluğu'nda genellikle kullanılan parasal bir madendi. Bu altının güçlenmesi halkın kendini mutlu ve güvende hissetmesini kesinlikle sağlayacak."
 cizye_tax:0 "Cizye Vergisi"
 cizye_tax_desc:0 "Cizye, tarihsel olarak İslam hukukuyla yönetilen bir devletin daimi gayrimüslim tebaası olan zimmîlerden mali bir yükümlülük şeklinde alınan kişi başı yıllık vergidir."
 ottoman_tourism:0 "Osmanlı Turizmi"
 ottoman_tourism_desc:0 "Osmanlı İmparatorluğu, önceki Cumhuriyet döneminde olduğu gibi turizme yer açmaya devam etmeli. Turizmi engellemek Osmanlı ekonomisine darbe vurmaktan başka bir işe yaramaz."
 ottoman_film_sector:0 "Osmanlı Film Sektörü"
 ottoman_film_sector_desc:0 "Bir Osmanlı film sektörü oluşturarak dizilerimizi ve filmlerimizi Batı'ya pazarlayacağız. Bu pazarlama sayesinde kesinlikle yüksek gelir elde edebiliriz."
 unemployment_money_reform:0 "İşsizlik Maaşı Reformu"
 unemployment_money_reform_desc:0 "İşsizlerin gelirini belirli bir oranda azaltarak işsizleri iş sahibi olmaya itmemiz gerekiyordu."
 systematic_unemployment_decrease:0 "Sistemli İşsizlik Azalması"
 systematic_unemployment_decrease_desc:0 "İşsizlik için yaptığımız reformlar sayesinde işsizlik sistemli bir düşüş içinde; bu ülkemiz için çok hayırlı ve güzel bir durum."
 islamic_war_industries:0 "İslami Savaş Sanayileri"
 islamic_war_industries_desc:0 "İslami savaş sanayileri kurarak askerî sanayimizi yüksek seviyelere çıkaracak ve askerlerimizin ihtiyaçlarını kolayca karşılayabileceğiz."
 islamic_war_industries_boosted:0 "Genişletilmiş İslami Savaş Sanayileri"
 islamic_war_industries_boosted_desc:0 "İslami savaş sanayileri kurarak askerî sanayimizi yüksek seviyelere çıkaracak ve askerlerimizin ihtiyaçlarını kolayca karşılayabileceğiz."
 vulnerable_factories:0 "Savunmasız Silah Fabrikaları"
 vulnerable_factories_desc:0 "Fabrikaları bilinmeyen ve gizli bölgelere kurarak savaş zamanında bombalanmalarını önleyeceğiz; böylece sanayimiz zarar görme tehlikesiyle karşılaşmayacak ve savaş zamanında sürekli büyüyebilecek."
 budget_system_reorganized:0 "Yeniden Düzenlenen Bütçe Sistemi"
 budget_system_reorganized_desc:0 "Ülkemizin servetinin nereye harcandığı mutlaka bir plana bağlanmalı ve kurumlar aracılığıyla denetlenmeli. Servetin denetlenmesi ve kurallara bağlanması halkımızın mevcut hükümete güven duymasını sağlayacak ve ekonomik büyümemizde bir etken olacak."
 reformed_gold:0 "Reforme Edilmiş Altın"
 reformed_gold_desc:0 "Altın kapitalizmin oyun araçlarından biridir. Bu altının reforme edilmesi ve değerinin asgari düzeyde tutulması halkımızın kendini mutlu ve güvende hissetmesini sağlayacak."
 anti_left_movement:0 "Sol Karşıtı Hareket"
 anti_left_movement_desc:0 "Sol karşıtı hareketin meşru amacı ülkedeki solcu örgütlerin üstünlüğünü yok etmektir. Bu sağcı hareket kısacası ülkenin kurtuluşu için çalışan bir yapılanmadır."
 votable_right:0 "Seçilebilir Sağ"
 votable_right_desc:0 "Sağın oy alamayan özelliklerinden hızla kurtuluyoruz. Ülkemizdeki sağ, halkımıza tam olarak karşılık gelen bir sistemde olmalı."
 anti_left_movement_2:0 "Sol Karşıtı Hareket"
 anti_left_movement_2_desc:0 "Sol karşıtı hareketin meşru amacı ülkedeki solcu örgütlerin üstünlüğünü yok etmektir. Bu sağcı hareket kısacası ülkenin kurtuluşu için çalışan bir yapılanmadır."
 counter_guerillas:0 "Kontrgerilla"
 counter_guerillas_desc:0 "Amerika kökenli bir örgüt olan kontrgerilla, ülkemizde komünizmin yayılmasını önleyecek başlıca unsurlardan biridir."
 counter_guerillas_NATO_cooperated:0 "NATO ile İşbirliği Yapan Kontrgerilla"
 counter_guerillas_NATO_cooperated_desc:0 "Amerika kökenli bir örgüt olan kontrgerilla, ülkemizde komünizmin yayılmasını önleyecek başlıca unsurlardan biridir."
 political_rehabilitation:0 "Siyasi Rehabilitasyon"
 political_rehabilitation_desc:0 "Son savaş ülkemize siyasi olarak zarar verdi. Siyasetin kalıcı hasar görmemesi için onu yeniden yapılandırıp düzeltmemiz gerekiyor. Bu yüzden siyasetimizi baştan ele alıyoruz."
