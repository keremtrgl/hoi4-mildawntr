 PERINCEK_wins_the_congress:0 "Perinçek Kongreyi Kazandı"
 bozkurtlar:0 "Bozkurtlar"
 bozkurtlar_desc:0 "Bozkurtlar, Türk milliyetçiliğinin aşırı bir biçimini benimser. Akademisyenler, ana akım medya ve sol kaynaklar tarafından neofaşist olarak nitelendirilmiştir. Örgütün ideolojisi Orta Asya'daki Türk devletlerinin erken tarihini öne çıkarır ve bunu İslam ile harmanlar. Türk kimliği ile İslam'ın sentezi söylem ve faaliyetlerinde yaygın olarak görülür. Sloganlarından biri "Doktorun Türk, ilacın İslam olacak"tır. Diğer kaynaklar ise hareketi laik olarak tanımlamıştır."
 quarries_1:0 "Ülkü Ocakları"
 quarries_1_desc:0 "Ülkü Ocaklarının temel amacı ülkemiz için ülkücü ideal insanlar yetiştirmektir. Ülkü Ocaklarında yetişen insanlar vatanları için canlarını feda eder ve vatanları için çalışır."
 quarries_2:0 "Ülkü Ocakları"
 quarries_2_desc:0 "Ülkü Ocaklarının temel amacı ülkemiz için ülkücü ideal insanlar yetiştirmektir. Ülkü Ocaklarında yetişen insanlar vatanları için canlarını feda eder ve vatanları için çalışır."
 nation_in_chaos:0 "Kemalist Subaylar Protesto Ediyor"
 nation_in_chaos_desc:0 "Kemalistler kurduğumuz yeni düzeni reddediyor ve protesto ediyor. Bu protestolar temelsiz ve bastırılacak."
 islamization_of_the_army:0 "Ordunun İslamlaştırılması"
 islamization_of_the_army_desc:0 "Ordumuzun güçlü olması için İslamlaştırılması gerekir. Laiklik ordunun yapısını bozdu. Ne derlerse desinler, orduyu İslamlaştıracağız."
 secular_parties_protest:0 "Kemalist Partiler Protesto Ediyor"
 secular_parties_protest_desc:0 "Kemalist partiler beklediğimiz gibi kurduğumuz yeni düzeni beğenmedi. Onları bu yeni düzene zorlamak zorundayız. Aksi takdirde bu ülke bir iç savaş görebilir."
 jihadist_state:0 "Muhammed'in Tümenleri"
 jihadist_state_desc:0 "Ordumuz Muhammed'in askerleridir. Ordumuzla İslam'ı dünyanın dört bir yanına yayacağız. Yaşasın İslam!"
 anti_arabic_campaign:0 "Parti İçinde Araplara Karşı Milliyetçi Muhalefet"
 anti_arabic_campaign_desc:0 "Milliyetçi Türk halkının Araplara bakışı çok kötü. Araplarla ilişkilerimizi geliştirmemizden son derece rahatsızlar. Bu yüzden partimiz içinde muhalif hareketler başlattılar."
 moderate_sharia_state:0 "Ilımlı Şeriat Devleti"
 moderate_sharia_state_desc:0 "Allah'a şükür artık İslam'la yönetiliyoruz. Allah yolunda giderek ülkemizi yükselteceğiz. İslam'ı yok etmek isteyen Araplar gibi olmayacağız. Yaşasın Türklük ve İslam!"
 three_crescent:0 "Üç Hilal"
 controlled_juidacary:0 "Kontrollü Yargı"
 controlled_juidacary_desc:0 "Bağımsız bir yargı teröristleri serbest bırakabilir; bu yüzden duruma el atarak yargıyı devletimize bağlıyoruz. Bu sayede her teröristi hızla yakalayabilecek ve teröre yardım eden her partiyi kolayca kapatabileceğiz."
 legacy_of_turkes:0 "Alparslan Türkeş'in Mirası"
 legacy_of_turkes_desc:0 "Alparslan Türkeş'in izinden gidiyoruz. Onun dediklerini yaptık, otoriter bir ülke kurduk ve milliyetçiliğimizden ve Türkçülüğümüzden vazgeçmedik."
 islamist_barracks:0 "Cihatçı Kışlalar"
 islamist_barracks_desc:0 "Cihatçı gençlerimizi eğitip cihada gönderiyoruz. İslam yayılmalı!"
 turkish_dictatorship:0 "Kurt Diktatörlüğü"
 turkish_dictatorship_desc:0 "Seçimler ve partilerin işleyişi ülkeyi bölmekten farksız; bu bölücü hareketi sona erdirmek için diktatörlüğümüzü ilan ettik. Kurt diktatörlüğüyle Türkiye şüphesiz sarsılmaz bir bütün olacak."
 general_purges:0 "Milliyetçilik Karşıtlarına Yönelik Tasfiyeler"
 general_purges_desc:0 "Milliyetçilik olmadan ülke olmaz; bu yüzden milliyetçi olmayanları tutuklamak zorundayız. Milliyetçilik bizim için en önemli husustur."
 legacy_of_the_1980:0 "1980'in Mirası"
 legacy_of_the_1980_desc:0 "1980'de yaşadığımız olayları unutamayız. Solcular ile sağcılar arasındaki çatışmalar binlerce kişinin ölümüne yol açtı; bunun sonucunda Türk Silahlı Kuvvetleri tanklarla, toplarla ve tüfeklerle her şeyin kontrolünü ele aldı ve ülkenin başına Kenan Evren geçti. Kenan Evren'in gelişiyle sağcılar da solcular da topa tutuldu. Pek çok idam yaşandı. Bu anıları unutamayız. Bunlar bir daha yaşanmasın diye komünistler görüldükleri yerde ezilmeli."
 tur_historical_confidence_2:0 "Türk Tarihî Özgüveni"
 tur_historical_confidence_2_desc:0 "Türkler tarihleri boyunca önemli zekâlar yetiştirdi. Türkler fetihlerle Orta Asya'da ve Avrupa'da tahtlar kurdu. Bir savaşta yenildiklerinde ise birleşip sıkı bir şekilde savaştılar. Türkler tarihleriyle ve atalarıyla gurur duyar. Bu nedenle Türkiye'de milliyetçilik duygusu yaygın ve baskındır.""
 ataturk_nationalism:0 "Atatürk Milliyetçiliği"
 sun_language_theory:0 "Güneş Dil Teorisi"
 sun_language_theory_desc:0 "Güneş Dil Teorisi, 1930'larda Türkiye'de geliştirilen ve tüm insan dillerinin tek bir ön-Türkçe ana dilden türediğini öne süren Türk milliyetçisi, sözde bilimsel bir dil hipotezidir. Teori, bu ana dilin ses bakımından Türkçeye çok benzediği için diğer tüm dillerin esasen Türk köklerine dayandırılabileceğini ileri sürüyordu. Teoriye göre güneşin her şeye kadir gücünü ve hayat veren niteliklerini selamlamak isteyen Orta Asyalı tapınıcılar, anlamsız mırıldanmalarını tutarlı bir ritüel sözler bütününe dönüştürmüş ve böylece dil doğmuştu; teorinin adı da buradan gelir."
 secular_schools:0 "Laik Okullar"
 secular_schools_desc:0 "Ülkede laik okullar hâkim. TED gibi kuruluşlar bu laik okulları iyi yönetiyor."
 peace_coop:0 "Kemalist Tarafsızlık"
 peace_coop_desc:0 "Atatürk'ün dediği gibi ülkemiz barışçıl bir politika izleyerek diğer ülkelerin özgürlüklerini kısıtlamayacak. Atatürk'ün izlediği bu politikayla ülkemizi istikrara kavuşturup mutlu edebiliriz."
 assimalition_policy:0 "Asimilasyon Politikası"
 assimalition_policy_desc:0 "Kürtleri asimile ederek Doğu'daki sorunu çözebiliriz. Bunun için kendi vatandaşlarımızı görevlendirmemize gerek yok."
 cold_war_with_kurds:0 "Kürtlerle Soğuk Savaş"
 cold_war_with_kurds_desc:0 "Kürtlerle psikolojik savaşa girerek doğu bölgesini millîleştireceğiz."
 turkishness_principal:0 "Türklük İlkesi"
 united_wolfs:0 "Birleşik Kurtlar"
 united_wolfs_desc:0 "Artık Kurtlar birleştiğine göre kimse bize karşı koyamaz. Karşı çıkan herkesi bir kurt sürüsü gibi avlayacağız!"
 turkic_populism:0 "Türk Popülizmi"
 turkic_populism_desc:0 "Türk birliği için popülist hamleler yapacağız. Bu popülist hamlelerle Türklüğün birliğini zirveye taşıyacağız."
 TUR_turkic_unification:0 "Türk Birliği ilan edildi."
 purge_the_kemalistz:0 "Askeri Tasfiyeler"
 purge_the_kemalistz_desc:0 "Bu darbeci askerleri ordumuzdan temizlemek için harekete geçtik. Ordumuzda çok sayıda gözaltı yaptık. Bu gözaltılar elbette ordumuzu zayıflatacak, ama sonunda onlardan kurtulacağız."
 kemalists_in_exile:0 "Sürgündeki Kemalistler"
 kemalists_in_exile_desc:0 "Kemalistler bize Batı geleneklerini dayattı, ama halkımız Batıcılığa hayır diye haykırdı. Batıcılığın halk tarafından kabul görmemesi ve Kemalistlerin başarısız bir darbe girişiminde bulunması onları sürgüne göndermemize yol açtı."
 mosque_industry:0 "Cami Sanayii"
 mosque_industry_desc:0 "Cami inşası bir mimari sanattır. Sanayimizi ve halkımızı cami inşasına yönlendirerek güzel camiler yapacağız. Bu camiler bizim için sevap olacak ve ekonomik açıdan huzur sağlayacak."
 banner_of_islam:0 "Millî Görüş'ün Sancağı"
 banner_of_islam_desc:0 "İslam sancağı kötü ellere geçmişti; neyse ki artık İslam sancağı kurtarıldı. Türkiye gerçek İslam'ı yaşayarak ve fetihler yaparak İslam sancağını güçlendirecek."
 madrassas:0 "İslami Medreseler"
 madrassas_desc:0 "Atatürk'ün kapattığı medreseleri yeniden açtık. Bu medreseler bize İslam'ın ve yeniliğin yolunu öğretecek."
 volunteer_reserve:0 "Gönüllü Kuvvet"
 volunteer_reserve_desc:0 "Ülkemiz güçlü bir seviyede olduğu için artık bazı ülkelerin iç işlerine müdahale edebilir. Bu yüzden gönüllü bir müdahale grubu oluşturuyoruz. Bu grup müdahaleyle ülkemizin düşmanlarını alt edecek."
 volunteer_reserve_armed_well:0 "Müdahale Kuvvetleri"
 volunteer_reserve_armed_well_desc:0 "Ülkemiz güçlü bir seviyede olduğu için artık bazı ülkelerin iç işlerine müdahale edebilir. Bu yüzden gönüllü bir müdahale grubu oluşturuyoruz. Bu grup müdahaleyle ülkemizin düşmanlarını alt edecek."
 construction_plan:0 "Erbakan'ın Ağır Sanayi Planı"
 construction_plan_desc:0 "Erbakan ülkemizin ağır sanayide gelişmesini çok istiyor ve bunun için planlar hazırladı. Erbakan'ın fabrika kurma politikalarını uygulayarak ülkemizi sanayileştireceğiz. Sanayileşmiş bir Türkiye düşmanlarına göz açtırmayacak."
 policy_of_rework:0 "Çalışma Politikası"
 policy_of_rework_desc:0 "İşçilerimiz maaş almazsa, zam almazsa neden çalışsınlar? Bu yüzden işçilerimize para ve zam vererek onları çalışmaya teşvik ediyoruz. Çalışkan ve dinamik bir işçi kitlesi bizi ileri seviyelere taşıyacak."
 work_for_better_conditions:0 "Daha İyi Koşullar İçin Çalışmak"
 work_for_better_conditions_desc:0 "İşçilerimiz ne kadar çok çalışırsa çalışsın aynı parayı alıyordu. Artık daha çok çalışırlarsa daha çok kazanacaklarını bildikleri için daha çok çalışacaklar."
 nato_islam_power:0 "NATO'nun İslami Gücü"
 nato_islam_power_desc:0 "Erbakan'ın deyişiyle biz bir NATO-İslam gücüyüz. Elbette Orta Doğu'daki Müslümanları koruyacağımız gibi Avrupa'daki müttefiklerimizi de koruyacağız."
 crushing_pro_nato_organizations:0 "NATO Yanlısı Örgütlerin Ezilmesi"
 crushing_pro_nato_organizations_desc:0 "Ülkemizde NATO finansmanıyla örgütlenen kontrgerillayı ezme zamanı geldi. Kontrgerillanın ezilmesi millî huzuru artıracak. Bir örgüt tarafından yönetilmemize izin vermeyeceğiz."
 d-9_forces:0 "D-8 Özel Birlikleri"
 d-9_forces_desc:0 "D-8 Ekonomik Birliği'nin artık resmî bir ittifaka dönüşmesiyle D-8 Özel Kuvvetler Komutanlığı kuruldu. Bu D-8 Komutanlığı'nın amacı özel kuvvetler yetiştirerek D-8'i korumak. D-8 Komutanlığı'nın Pakistan, İran ve Türkiye'de birlikleri bulunuyor."
 d-9_forces_2:0 "D-8 Özel Birlikleri"
 d-9_forces_2_desc:0 "D-8 Ekonomik Birliği'nin artık resmî bir ittifaka dönüşmesiyle D-8 Özel Kuvvetler Komutanlığı kuruldu. Bu D-8 Komutanlığı'nın amacı özel kuvvetler yetiştirerek D-8'i korumak. D-8 Komutanlığı'nın Pakistan, İran ve Türkiye'de birlikleri bulunuyor."
 d-9_forces_3:0 "D-8 Özel Birlikleri"
 d-9_forces_3_desc:0 "D-8 Ekonomik Birliği'nin artık resmî bir ittifaka dönüşmesiyle D-8 Özel Kuvvetler Komutanlığı kuruldu. Bu D-8 Komutanlığı'nın amacı özel kuvvetler yetiştirerek D-8'i korumak. D-8 Komutanlığı'nın Pakistan, İran ve Türkiye'de birlikleri bulunuyor."
 afghan_immigration:0 "Afgan Göçü"
 afghan_immigration_desc:0 "Afganistan'daki savaşta Taliban'ın zafer kazanmasının ardından Afganlar İran üzerinden Türkiye'ye yasa dışı yollarla gelmeye başladı. Suriyelilerin gelip Türk ekonomisine zarar vermesinin ardından Afganların gelişi Türkiye'nin gücünü iyice yıprattı. Afganların ülkeye gelişinden rahatsız olan milliyetçiler hükümete oy vermeyi bıraktı ve muhalefete geçmeye başladı. AB'nin bu konudaki tutumu da laikler arasındaki muhalefetin artmasına yol açtı."
 outsides_problem_kurds:0 "Dış Dünyada PKK'ya Verilen Destek"
 outsides_problem_kurds_desc:0 "Bazı yabancı ülkeler PKK'ya sempati duyuyor. Bu sempati PKK'ya siyasi bir varlık kazandırıyor ve terörle mücadeleyi zorlaştırıyor. Bu sempatiyi kırmak zorundayız; bunun için bazı medya araçlarını kullanmalıyız."
 outsides_problem_kurds_2:0 "Dış Dünyada PKK'ya Verilen Destek"
 outsides_problem_kurds_2_desc:0 "Bazı yabancı ülkeler PKK'ya sempati duyuyor. Bu sempati PKK'ya siyasi bir varlık kazandırıyor ve terörle mücadeleyi zorlaştırıyor. Bu sempatiyi kırmak zorundayız; bunun için bazı medya araçlarını kullanmalıyız."
 outsides_problem_kurds_3:0 "Dış Dünyada PKK'ya Verilen Destek"
 outsides_problem_kurds_3_desc:0 "Bazı yabancı ülkeler PKK'ya sempati duyuyor. Bu sempati PKK'ya siyasi bir varlık kazandırıyor ve terörle mücadeleyi zorlaştırıyor. Bu sempatiyi kırmak zorundayız; bunun için bazı medya araçlarını kullanmalıyız."
 outsides_problem_kurds_4:0 "Dış Dünyada PKK'ya Verilen Destek"
 outsides_problem_kurds_4_desc:0 "Bazı yabancı ülkeler PKK'ya sempati duyuyor. Bu sempati PKK'ya siyasi bir varlık kazandırıyor ve terörle mücadeleyi zorlaştırıyor. Bu sempatiyi kırmak zorundayız; bunun için bazı medya araçlarını kullanmalıyız."
 outsides_problem_kurds_5:0 "Dış Dünyada PKK'ya Verilen Destek"
 outsides_problem_kurds_5_desc:0 "Bazı yabancı ülkeler PKK'ya sempati duyuyor. Bu sempati PKK'ya siyasi bir varlık kazandırıyor ve terörle mücadeleyi zorlaştırıyor. Bu sempatiyi kırmak zorundayız; bunun için bazı medya araçlarını kullanmalıyız."
 f-35_plan:0 "F-35 Uçak Programı Ortağı"
 f-35_plan_desc:0 "Programın katılımcıları arasında ABD, Birleşik Krallık, İtalya, Hollanda, Avustralya, Danimarka, Kanada ve Norveç'in yanı sıra Türkiye de vardı. Bu ülkelerin amacı yeni nesil, güçlü bir uçağa sahip olmak."
 turkish_drone_sector:0 "Türk İHA Sektörü"
 turkish_drone_sector_desc:0 "Türkiye İHA üretimi ve İHA teknolojilerinde üst düzey bir ülke. Bunların hepsi Türk İHA sanayisi sayesinde oldu. Bir ülke olarak Türk İHA sektörünü finanse etmeye devam ederek daha modern ve daha güçlü İHA'lar üretip diğer ülkeleri korkutabiliriz."
 turkish_armed_dictatorship:0 "Türk Askerî Diktatörlüğü"
 turkish_armed_dictatorship_desc:0 "Türk Silahlı Kuvvetleri son darbeyle çok değişti ve artık siyasetten çekilmek istemiyor. Türk Silahlı Kuvvetleri artık ülkede askerî diktatörlüğünü ilan ederek ülkeyi güçlendirecek ve ülke bir daha asla aşağılık ellere düşmeyecek!"
 end_of_the_turkish_democracy:0 "Türk Demokratik Sisteminin Sonu"
 end_of_the_turkish_democracy_desc:0 "Türk demokrasisi başarısız oldu. Bu başarısızlık nedeniyle Türk demokrasisi Türk Silahlı Kuvvetleri içindeki bir birlik tarafından yıkıldı. Türk demokrasisinin yıkılmasıyla ülke daha hızlı gelişecek, çünkü insanlar demokrasiyle birlikte çalışmıyor, birbirleriyle kavga ediyor."
 controlled_press:0 "Kontrollü Basın"
 controlled_press_desc:0 "Basın artık kontrolümüz altında; basının bize karşı çıkmasına asla izin vermeyeceğiz. Basın bize karşı çıkmazsa ülkemizin istikrar seviyesini iyi yerlere getirebiliriz."
 stabilization_of_TUR_act:0 "Ulusal İstikrar Yasası"
 stabilization_of_TUR_act_desc:0 "Millî istikrarı sağlamak için bir operasyon başlattık. Bu operasyonla ülkemizi istikrarlı seviyelere taşıyacağız. Yaşasın istikrar getiren Türkiye Cumhuriyeti!"
 non_european:0 "Türk Değerlerini Benimsemek"
 non_european_desc:0 "Avrupa Birliği'nin dayattıkları Türk halkına aykırı. Bu yüzden ordumuz Avrupa Birliği'nin dayattıklarını reddedecek ve Türk geleneklerimizi yaşatacak. Türk geleneklerinin yaşaması Türkiye'ye güç katacak."
 secular_forces:0 "Tamamen Laikleştirilmiş Kuvvetler"
 secular_forces_desc:0 "Yeni darbenin ardından laik olmayanları ordudan atarak ve orduya almayarak, laik olanları ise uzun süre orduda tutarak laik bir ordu kuracağız."
 rejecting_immigrationism:0 "Göçü Reddetmek"
 rejecting_immigrationism_desc:0 "Mülteci kabul etmek Türklüğe hakarettir. Bu yüzden ülkemize mülteci kabul etmeyeceğiz. Mültecisiz Türkiye, müreffeh Türkiye'dir!"
 power_of_turkish_blood:0 "Türk Kanının Gücü"
 power_of_turkish_blood_desc:0 "Türk ırkından olmak özel bir durumdur. Türk ırkından olmak güç verir. Türklerin bu güçle yapamayacağı hiçbir şey yoktur."
 civilian_economic_program:0 "Sivil Ekonomi Programı"
 civilian_economic_program_desc:0 "Ülkemizin sivil sanayisi iyi bir durumda değil; bu yüzden ülkemize bir sivil ekonomi ve sanayi programı uygulayarak ülkemizi kalkındıracağız."
 controlled_sendikalar:0 "Devletin Denetimindeki Sendikalar"
 controlled_sendikalar_desc:0 "Ülkemizdeki bağımsız sendikalara son verip sendikaları kendimize bağlayacağız. Bu sayede sendikalar resmî ideolojiden sapmayacak ve böylece istikrar sağlanacak."
 workers_administration_2:0 "Genişletilmiş İşçi Kanunu"
 populist_principals:0 "Popülist İlkeler"
 populist_principals_desc:0 "Ülkemiz artık halkçılık ilkeleri doğrultusunda halkçılığı yaşayacak. Halkçılık ilkeleri ise Türk milletiyle tamamen uyumlu."
 TUR_economic_power_house:0 "Türk Ekonomik Güç Merkezi"
 TUR_economic_power_house_desc:0 "Türk ekonomisi kötü olduğu dönemi geride bıraktı. Artık Türk ekonomisi düşmeyen istikrarlı bir güç."
 supporting_employers:0 "İşverenleri Desteklemek"
 supporting_employers_desc:0 "İşverenleri destekleyerek ülkemizdeki istihdam oranını artırıp işsizlik oranını düşüreceğiz."
 anti_arabic_state:0 "1917'nin Öfkesi"
 anti_arabic_state_desc:0 "1917'de yaşanan olayları unutmadık. 1917'de yaşanan olayların intikamını almak için bir sefere çıkmaya hazırız."
 guardians_of_the_balkans:0 "Balkanların Muhafızı"
 guardians_of_the_balkans_desc:0 "Balkan Paktı'nın lideri eskiden Romanya'ydı; Romanya Alman ve Sovyet işgallerine uğrayarak Balkan Paktı'nın liderliğini kaybetti ve ardından Balkan Paktı dış güçler tarafından yıkıldı. Bugün bu yıkılan paktı yeniden canlandırmamız gerekiyor. Balkanları koruyarak tehdidi önceden önleyecek ve Balkan istikrarını sağlayacağız. Balkanların muhafızı nöbette!"
 asia_minors_power:0 "Beyaz Prens"
 asia_minors_power_desc:0 "Orta Doğu'da Suudi Arabistan ile İran arasındaki gerginlik bölgeyi kasıp kavuruyor. Türkiye Orta Doğu'da. Bu oyuncu konumundaki Türkiye, Orta Doğu'nun beyaz prensi olarak anılıyor. Beyaz prens hangi tarafa yönelirse o taraf kazanır. O taraf İran tarafı olacak!"
 restoring_the_hope:0 "Umudu Yeniden Yeşert!"
 restoring_the_hope_desc:0 "ABD, Türkiye Cumhuriyeti'nin iyiliği için darbeler ve askerî müdahaleler gerçekleştirdi. Tüm bu müdahalelerin sonunda yönetim demokrasiye devredildi. Bu çok yanlış bir hamleydi. Ülkemizi artık bunak bir demokrasiye bırakmayarak askerî müdahalenin kılıcını sonsuza dek kuşanacağız. Bitmeyen askerî müdahaleyle ABD'nin ülkemiz ve bölgemiz için düşündüğü vizyonu gerçekleştirebileceğiz. Bu vizyonla ABD'nin Orta Doğu'daki Büyük Orta Doğu Projesi'ni hayata geçirebileceğiz. Bu planı uygulamaya koyduğumuzda ABD'den hem askerî hem de mali destek alacağız; böylece ülke ekonomik sıkıntı çekmeyecek. ABD'nin yanında olursak güçlü oluruz, karşısında olursak Sovyetler Birliği gibi yok oluruz. Yaşasın ABD ve kurucusu Atatürk olan Türkiye Cumhuriyeti!"
 redzyned_6_arrows:0 "Yeniden Tasarlanan Altı Ok"
 redzyned_6_arrows_desc:0 "Atatürk'ün altı okunu yeniden tasarladık. Bu düzenlemeyle Atatürk'ün altı oku parti programımızla örtüşüyor. Bu, iç istikrarı sağlayacak bir düzenleme."
 NATO_officers:0 "NATO Yanlısı Subaylar Başta"
 NATO_officers_desc:0 "Ordumuz içindeki NATO yanlısı komutanlar ikinci bir darbeyle iktidarı ele geçirdi. Aramızdaki NATO yanlısı komutanlar pek demokrasi sever tipler değil; büyük ihtimalle ülkemizi Batı'ya zorla bağlı bir rejime dönüştürecekler."
 general_staff_under_1:0 "Türk Genelkurmay Başkanlığı"
 general_staff_under_1_desc:0 "Genelkurmay, Silahlı Kuvvetlere komuta etmek için kurulmuş en üst düzey kurumdur.\nGenelkurmay, tümen ve daha üst birliklerin komutanlarına ordu politikalarının oluşturulması ve yayılması, emirlerin iletilmesi ve çalışmaların denetlenmesi konusunda yardımcı olan bir subaylar grubundan oluşur.\nNormalde yönetim, istihbarat, harekât, eğitim, lojistik ve diğer şubelerle işlevsel çizgide örgütlenir.\n\n§YGenelkurmay Başkanı: Hüseyin Kıvrıkoğlu§!"
 general_staff_under_2:0 "Türk Genelkurmay Başkanlığı"
