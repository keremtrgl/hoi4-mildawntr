 rise_of_fp_desc:0 "Türkiye uzun süredir laik bir ülke, ancak giderek daha fazla insan İslam geleneklerinin topluma geri dönmesini istiyor. Pek çok kişi Kemalist partilerin din karşıtlığına varan tutumuna öfkeli."
 TURKEY_MILLENNIUM_DAWN_DESC:0 "Genç cumhuriyet modern çağa güçlükle ulaştı. Son dönemde ülkedeki yolsuzluk yüksek seviyelere çıktı ve görüş ayrılığı içindeki partiler çatışmaya başladı. Buna son vermek isteyen ordu ülkede darbeler yaptı ve ülke ekonomisi darbe üstüne darbe aldı. Türk halkı 2000'li yıllara ekonomik ve siyasi sorunların düzeleceği umuduyla girdi. \n\nBakalım genç Cumhuriyet'i güzel günler bekliyor mu?"
 TURKEY_MODERN_DAY_DESC:0 "Türkiye'nin 2001 ekonomik krizinin ardından AKP oyların çoğunluğunu alarak iktidara geldi. Dinî bir parti olan AKP yakın geçmişte orduyla gerginlikler yaşadı. İktidara geldikten sonra reformlarla ekonomiyi canlandırdı, ancak ekonomik büyüme son dönemde yavaşlamaya başladı. 2016'da AKP'nin eskiden yakın olduğu ve artık terör örgütü ilan edilen Gülen yapılanması devleti devirmeye çalıştı, ancak halkın direnişiyle başarısız oldu. Gülenist darbe girişiminin başarısızlığıyla AKP'nin oyları arttı.\n\nBu ülkenin kaderi ne olacak?"
