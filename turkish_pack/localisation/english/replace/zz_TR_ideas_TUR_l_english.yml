 extensive_earthquake_repair_desc:0 "Deprem felaketi nedeniyle pek çok bina ve insan kaybettik; bu kayıplar büyük ekonomik zarara yol açtı. Bu kayıpların bilançosunu gidermek için olabildiğince hızlı olmalıyız."
 the_turkish_housing:0 "Türk Konut Sektörü"
 the_turkish_housing_desc:0 "Konut ya da daha genel olarak yaşam alanları, barınma amacıyla evlerin ya da binaların tek tek veya toplu olarak inşasını ve kullanımını ifade eder. Konut, toplum üyelerinin ister ev ister başka türde bir mesken, konaklama yeri ya da barınak olsun, yaşayacak bir yere sahip olmasını sağlar. Pek çok hükümetin, bazen konut bakanlığı ya da konut dairesi olarak da adlandırılan bir ya da daha fazla konut idaresi vardır."
 the_turkish_housing_2:0 "Türk Konut Sektörü"
 the_turkish_housing_2_desc:0 "Konut ya da daha genel olarak yaşam alanları, barınma amacıyla evlerin ya da binaların tek tek veya toplu olarak inşasını ve kullanımını ifade eder. Konut, toplum üyelerinin ister ev ister başka türde bir mesken, konaklama yeri ya da barınak olsun, yaşayacak bir yere sahip olmasını sağlar. Pek çok hükümetin, bazen konut bakanlığı ya da konut dairesi olarak da adlandırılan bir ya da daha fazla konut idaresi vardır."
 the_turkish_housing_3:0 "Türk Konut Sektörü"
 the_turkish_housing_3_desc:0 "Konut ya da daha genel olarak yaşam alanları, barınma amacıyla evlerin ya da binaların tek tek veya toplu olarak inşasını ve kullanımını ifade eder. Konut, toplum üyelerinin ister ev ister başka türde bir mesken, konaklama yeri ya da barınak olsun, yaşayacak bir yere sahip olmasını sağlar. Pek çok hükümetin, bazen konut bakanlığı ya da konut dairesi olarak da adlandırılan bir ya da daha fazla konut idaresi vardır."
 corruption_change_ease:0 "Mecliste Yolsuzluk Düzenlemelerinde Kolaylık"
 economic_shifting_ease:0 "Mecliste Ekonomik Düzenlemelerde Kolaylık"
 strikes_in_turkey:0 "Türkiye'de Grevler!"
 strikes_in_turkey_desc:0 "Grev ya da iş bırakma, çalışanların toplu olarak çalışmayı reddetmesiyle ortaya çıkan iş durdurmadır. Grev genellikle çalışanların şikâyetlerine tepki olarak yapılır."
 strikes_in_turkey_2:0 "Türkiye'de Grevler!"
 strikes_in_turkey_2_desc:0 "Grev ya da iş bırakma, çalışanların toplu olarak çalışmayı reddetmesiyle ortaya çıkan iş durdurmadır. Grev genellikle çalışanların şikâyetlerine tepki olarak yapılır."
 strikes_in_turkey_3:0 "Türkiye'de Grevler!"
 strikes_in_turkey_3_desc:0 "Grev ya da iş bırakma, çalışanların toplu olarak çalışmayı reddetmesiyle ortaya çıkan iş durdurmadır. Grev genellikle çalışanların şikâyetlerine tepki olarak yapılır."
 alliance_with_DISK:0 "DİSK ile İttifak"
 alliance_with_DISK_desc:0 "DİSK, ilerici duruşu ve işçi haklarını savunmasıyla bilinen Türkiye'deki bir diğer önemli sendika konfederasyonudur. DİSK ile işbirliği yapmak ve onun ruhunu benimsemek, genellikle sosyal adalet, eşitlik ve işçi haklarını savunmayı içeren ilkeleriyle uyum içinde olmak anlamına gelebilir."
 alliance_with_TURK_IS:0 "TÜRK-İŞ ile İttifak"
 alliance_with_TURK_IS_desc:0 "TÜRK-İŞ Türkiye'nin önde gelen sendika konfederasyonlarından biri olduğundan bu işbirliği Türk işçilerinin çıkarlarına yönelik ortak bir bağlılığa işaret edebilir. TÜRK-İŞ ile ittifak kurmak, işçi hakları, işçilerin refahı ve ilgili diğer konulardaki hedef ve değerleriyle uyum içinde olmayı içerebilir. Aynı zamanda Türk işçileri arasında millî birlik ve dayanışma duygusunu geliştirme kararlılığını da gösterebilir."
 rise_of_the_wild_left:0 "Vahşi Solun Yükselişi"
 rise_of_the_wild_left_desc:0 "Radikal sağdaki yüksek ivme solda da radikal bir ivme yarattı. Ancak soldaki bu radikallerin derhâl denetim altına alınması gerekiyor."
 a_new_kemalism:0 "Yeni Kemalizm"
 a_new_kemalism_desc:0 "Kemalistler Atatürk'ün izinden gitmek için yola çıktı. Atatürk yeniden hayata döndüğünde halkın Kemalizmi yanlış uyguladığını tespit etti. Böylece Kemalizm modern hayata uygun yeni bir düzene geçiş yaptı."
 ATA_return_of_the_father:0 "Ata'nın Dönüşü"
 ATA_return_of_the_father_desc:0 "Mustafa Kemal geri döndü. Fabrikalar bir gecede yeniden açılıyor, memurlar sabahlara kadar çalışıyor ve bütün millet kurucusunun etrafında kenetleniyor."
 a_new_kemalism_2:0 "Yeni Kemalizm"
 a_new_kemalism_2_desc:0 "Kemalistler Atatürk'ün izinden gitmek için yola çıktı. Atatürk yeniden hayata döndüğünde halkın Kemalizmi yanlış uyguladığını tespit etti. Böylece Kemalizm modern hayata uygun yeni bir düzene geçiş yaptı."
 political_troubles_caused_by_modernity:0 "Durumu Yeniden Değerlendirmek"
 political_troubles_caused_by_modernity_desc:0 "Atatürk yeniden hayata döndü ve bu onun için çok zor bir durum oldu. Çünkü Atatürk kendi zamanına alışkın; bu yüksek teknolojili dünyaya ve yeni politikalara alışık değil. Zamanla yeni kitaplar okuyacak ve bu dünyaya alışacak."
 political_troubles_caused_by_modernity_2:0 "Durumu Yeniden Değerlendirmek"
 political_troubles_caused_by_modernity_2_desc:0 "Atatürk yeniden hayata döndü ve bu onun için çok zor bir durum oldu. Çünkü Atatürk kendi zamanına alışkın; bu yüksek teknolojili dünyaya ve yeni politikalara alışık değil. Zamanla yeni kitaplar okuyacak ve bu dünyaya alışacak."
 political_troubles_caused_by_modernity_3:0 "Durumu Yeniden Değerlendirmek"
 political_troubles_caused_by_modernity_3_desc:0 "Atatürk yeniden hayata döndü ve bu onun için çok zor bir durum oldu. Çünkü Atatürk kendi zamanına alışkın; bu yüksek teknolojili dünyaya ve yeni politikalara alışık değil. Zamanla yeni kitaplar okuyacak ve bu dünyaya alışacak."
 new_turkish_economics:0 "Ankara'nın Ekonomik Misyonları"
 new_turkish_economics_desc:0 "Türkiye'deki ekonomik yapı tam bir enkaz. Bu yüzden Atatürk durumu kurtarmak için Ankara İktisat Kongresi'ni düzenledi. Bu kongreyle Türkiye'nin gelecek planları çizildi. Artık Türkiye zamanla Ankara Misyonu çerçevesinde belirli bir ekonomik kalkınma sağlayacak."
 simultanous_switzerland:0 "Kendi İsviçre'mizi Kurmak"
 simultanous_switzerland_desc:0 "Türkiye dış politikada İsviçre benzeri politikalar uygulayacak. Bu uygulamalarla ülkemiz her taraftan gelebilecek saldırılara karşılık verebilecek ve Türkiye asla ciddi bir sorunla karşılaşmayacak."
 free_eu_visa_deal:0 "AB Vize Anlaşması"
 free_eu_visa_deal_desc:0 "Vize meselesi Türkiye için çok önemli, devreye girmesi gerekiyor. Bu yüzden Avrupa Birliği'ne çeşitli kanunlar ve sözler vererek vize kaldırma işlemlerine geçeceğiz. Böylece Türkiye-Avrupa Birliği entegrasyonunu daha da hızlı sağlayacağız."
 model_the_euro:0 "Avro Modelli Para Birimi"
 model_the_euro_desc:0 "Türk lirasını kaldırmak gibi bir fikrimiz yok. Ama avro modelini devreye alarak Türk lirasını değerli ve istikrarlı hâle getireceğiz. Güçlü ve istikrarlı bir parayla kişi başı gelir artırılabilir."
 balkan_investment_fund:0 "Balkan Yatırım Fonu"
 balkan_investment_fund_desc:0 "Balkanlarda belirli aşamalarda yatırımların oluşması için Balkan Yatırım Fonu'nu kurduk. Kurulan bu fonla bölgedeki ekonomik sorunlar giderilecek ve bölge gelişecek."
 blocked_immigrant_routes:0 "Engellenen Göç Yolları"
 blocked_immigrant_routes_desc:0 "Orta Doğu'daki siyasi kriz nedeniyle göçmenler sınırlarımıza yığıldı. Ülkemize girmelerini engellemeliyiz. Göçmen akını ülkeyi kötü bir duruma sokar."
 nationalist_charities:0 "Milliyetçi Hayır Kurumlarının Yükselişi"
 nationalist_charities_desc:0 "Milliyetçi hayır kurumları eğitim, kültürel mirasın korunması ya da siyasi savunuculuk gibi çeşitli alanlarda faaliyet gösterebilir. Ancak milliyetçi ya da siyasi gündemleri destekleyen kuruluşların her ülkede hayır kurumu olarak tanınmayabileceğini ve faaliyetlerinin yasal kısıtlamalara veya denetime tabi olabileceğini belirtmek gerekir."
 mit_cap:0 "Ek MİT Kapasitesi"
 mit_cap_desc:0 "MİT teşkilatının kapasitesini geliştirmeye başladık. Bu kapasitenin genişlemesiyle MİT daha güçlü ve nitelikli istihbarat faaliyetleri yürütecek."
 mit_decp:0 "Ek MİT Şifre Çözme Gücü"
 mit_decp_desc:0 "MİT teşkilatının gücünü geliştirmeye başladık. Bu güçlenmenin genişlemesiyle MİT daha güçlü ve nitelikli istihbarat faaliyetleri yürütecek."
 strenghtened_mit:0 "Güçlendirilmiş MİT"
 strenghtened_mit_desc:0 "MİT, Türkiye Cumhuriyeti'nin ülke ve millet bütünlüğüne, varlığına, bağımsızlığına, güvenliğine, anayasal düzenini ve millî gücünü oluşturan tüm unsurlarına karşı içeriden ve dışarıdan yöneltilen mevcut ve muhtemel tehditler hakkında istihbarat toplamakla görevlidir. MİT bu istihbaratı gerektiğinde Cumhurbaşkanına, Genelkurmay Başkanına, Millî Güvenlik Kurulu Genel Sekreterine ve ilgili diğer devlet kuruluşlarına iletmekle yükümlüdür."
 educational_reformation:0 "Yükseltilmiş Eğitim Standartları"
 educational_reformation_desc:0 "Eğitim Atatürk'ün reformlarıyla daha iyi bir duruma gelecek. Eğitim sistemini ve politikasını iyileştirmek ve millî eğitimi desteklemek Türkiye'nin kalkınması için yapılabilecek tek şeydir."
 educational_reformation_2:0 "Yükseltilmiş Eğitim Standartları"
 educational_reformation_2_desc:0 "Eğitim Atatürk'ün reformlarıyla daha iyi bir duruma gelecek. Eğitim sistemini ve politikasını iyileştirmek ve millî eğitimi desteklemek Türkiye'nin kalkınması için yapılabilecek tek şeydir."
 educational_reformation_3:0 "Yükseltilmiş Eğitim Standartları"
 educational_reformation_3_desc:0 "Eğitim Atatürk'ün reformlarıyla daha iyi bir duruma gelecek. Eğitim sistemini ve politikasını iyileştirmek ve millî eğitimi desteklemek Türkiye'nin kalkınması için yapılabilecek tek şeydir."
 sumerian_turkey:0 "Sümerli Türkiye"
 sumerian_turkey_desc:0 "Güneş Dil Teorisi'ne göre Sümerler, Orta Asya'dan gelen bir Türk topluluğudur. Sümerler geçmişte büyük katkılar sağladı ve bugünün Türkiye'si onların mirasçısıdır."
 quality_first:0 "Kalitenin Yükselişi"
 quality_first_desc:0 ""Kalitenin yükselişi", yüksek kalite standartlarını karşılayan mal ve hizmetlerin üretimine giderek daha fazla odaklanılmasını ifade eder. Bu eğilimi teknolojideki ilerlemeler, tüketici tercihlerindeki değişimler ve pek çok sektörde artan rekabet gibi çeşitli etkenler yönlendirmiştir."
 turkish_culture_state:0 "Türk Kültürü"
 turkish_culture_state_desc:0 "Coğrafi konumu sayesinde Türkiye'de pek çok farklı kültür yaşar. Bu kültürel değerler ülkemizi bir turizm cazibe merkezine ve kültür merkezine dönüştürecek; böylece Türk halkı zengin bir kültüre sahip olacak."
 the_turkish_competition:0 "Türk Ekonomik Rekabeti"
 the_turkish_competition_desc:0 "Rekabet gücünü artırmaya odaklanan bir kanun çıkaracağız. Rekabet gücündeki bu artış sayesinde mallarımız piyasalarda güçlenecek ve bu sayede ekonomimiz dayanıklı ve güçlü hâle gelecek."
 the_rationality:0 "Akılcı Değerler"
 the_rationality_desc:0 "Atatürk'ün Türkiye'sinde akılcı bir düşünce yapısı oluşturacağız. Gerçekçi düşünceyle halkımız tercihlerini akılcı ve bilime dayalı bir şekilde yapacak; yeni akılcı ortam krizleri çözmek gibi pek çok uygulama yaratacak."
 systematic_industry:0 "İyi Yabancı Esinli Sanayi Zincirleri"
 systematic_industry_desc:0 ""Yabancı esinli sanayi zincirleri" genellikle belirli bir sektörde yabancı şirketlerin ya da küresel eğilimlerin etkilediği veya şekillendirdiği tedarik ya da değer zincirlerini ifade eder."
 benefits_of_neutrality:0 "Yarı Tarafsızlığın Faydaları"
 benefits_of_neutrality_desc:0 ""Yarı tarafsızlık", bir ülkenin ya da kuruluşun belirli bir çatışma veya mesele karşısında görece tarafsız ya da yansız bir konumu korumaya çalışırken yine de bir tür eylem ya da müdahalede bulunduğu durumu tanımlamak için kullanılabilecek bir terimdir."
 volunteers_of_the_arabic_spring:0 "Özgürlük Gönüllüleri"
 volunteers_of_the_arabic_spring_desc:0 "Orta Doğu siyasi bir kargaşa içinde. Kendi dış müdahalelerimizle bu duruma son verecek, bölgesel istikrarsızlığın etkilerini ortadan kaldıracak ve ülkeyi daha istikrarlı ve güzel hâle getireceğiz."
 med_navy_expansion:0 "Mısır Karşıtı Deniz Silahlanması"
 med_navy_expansion_desc:0 "Mısır bölgede çıkarlarımıza aykırı bir yol izliyor. Mavi Vatan vizyonumuzun gerçekleşmesi için donanmamızı güçlendirmeliyiz; böylece Mısır'ın bölgedeki etkisi bozulacak ve donanmamızı daha güçlü ve dayanıklı hâle getireceğiz."
 weapon_localization_timed:0 "Amerikan Silahlarının Yerlileştirilmesi"
 weapon_localization_timed_desc:0 "Gerekli askerî araçları ABD'den temin ettik. Şimdi bu araçları yerlileştirerek Türkiye'yi bir savaş mekanizmasına dönüştüreceğiz."
 power_of_the_nationalism:0 "Milliyetçiliğin Gücü"
 power_of_the_nationalism_desc:0 "Bu ülke gücünü milletini seven insanlardan alır. Sonsuza dek böyle sürecek. Yaşasın Türk halkını kucaklayan Türk milliyetçiliği! "Ne mutlu Türküm diyene!""
 mosque_law:0 "Cami Kanunu"
 mosque_law_desc:0 "Yeni bir cami kanunu çıkardık. Bu yeni kanunla camilerdeki imamlar ve din görevlileri propaganda yapamayacak. Böylece siyasi ve dinî istikrar huzura kavuşacak."
 counter_religion_politicization:0 "Dinin Siyasallaşmasına Karşı Koy"
 counter_religion_politicization_desc:0 "Radikalleşmeyi yok etmeliyiz! Onu yok etmek için çeşitli politikalar da uygulayacağız; bu politikalar kapsamında camileri denetim altında tutacak ve radikal imamların ortaya çıkmasını önleyeceğiz."
 the_land_of_religions:0 "Özgür İnançlar Diyarı"
 the_land_of_religions_desc:0 "Laik bir devlet olarak bilinmemiz özgür dinlerin diyarı olmadığımız anlamına gelmez. Her dinin ülkemizde faaliyet göstermesini sağlayacağız ve ülkemiz dinî bir huzur içinde yaşayacak. Dinî istikrar kalkınmadır."
 general_unionization:0 "Sendikalaşma Kampanyası"
 general_unionization_desc:0 "Sendikalaşma kampanyası, çalışanların iş yerindeki ortak çıkarlarını temsil edecek bir sendika altında örgütlenme çabasıdır. Kampanya genellikle çalışanları sendikalaşmanın faydaları konusunda bilgilendirmek, sendikayı destekleyen çalışanlardan imza ya da yetki belgesi toplamak ve sendikayı tanıması ve toplu pazarlığa başlaması için işverenle müzakere etmek gibi birkaç adım içerir."
 unemployment_planning_1:0 "İstihdam Misyonları"
 unemployment_planning_1_desc:0 "Yapısal reformlarla birlikte işsizliğin belini kıracağız; elbette bunu sendikalar, işçilerimizin devlete duyduğu güven ve pek çok sektörde yarattıkları destekle başaracağız. Millet burada!"
 unemployment_planning_2:0 "İstihdam Misyonları"
 unemployment_planning_2_desc:0 "Yapısal reformlarla birlikte işsizliğin belini kıracağız; elbette bunu sendikalar, işçilerimizin devlete duyduğu güven ve pek çok sektörde yarattıkları destekle başaracağız. Millet burada!"
 a_working_state:0 "Çalışan Devlet"
 a_working_state_desc:0 "Ülkemizi bir bilim diyarına dönüştürme sürecini başlattık. Böylece ülkede mutlu ve geleceğe dönük bireyler olacak. Türkiye her anlamda gelişecek."
 functional_YSK:0 "Bağımsız Yönetilen YSK"
 functional_YSK_desc:0 "Özgür ve tarafsız bir YSK'ya ulaşmak için kurulun bağımsızlığını ve tarafsızlığını tesis etmek ve korumak önemlidir. Bu, kurul üyelerinin niteliklerini ve deneyimlerini dikkate alan şeffaf ve adil bir süreçle atanmasını sağlayarak yapılabilir. Ayrıca görevlerini etkili bir şekilde yerine getirebilmeleri için gerekli kaynak ve desteğin sağlanması da önemlidir."
 reorganized_AYM:0 "Yeniden Düzenlenen AYM"
 reorganized_AYM_desc:0 "Türkiye'de iyi örgütlenmiş ve etkili bir AYM'ye ulaşmak; şeffaflığa, bağımsızlığa ve hesap verebilirliğe bağlılığın yanı sıra hâkimlerin görevlerini etkili bir şekilde yerine getirebilmeleri için gerekli kaynak ve desteğe yatırım yapma isteği gerektirir."
 natural_transformation:0 "Doğal Dönüşüm"
 natural_transformation_desc:0 "Halkımız yeni politikalar eşliğinde doğal bir değişim yaşayacak. Bu değişimle temel ve genel bir istikrar ve düzen ortamı sağlanacak."
 national_wisdom:0 "Millî Bilgelik"
 national_wisdom_desc:0 ""Millî bilgelik", bir milletin ya da ülkenin ortak zekâsını, kavrayışını ve bilgisini tanımlamak için sıkça kullanılan bir terimdir. Bir toplumun tarihi, kültürü, gelenekleri ve değerleri dahil birikmiş deneyimini ve anlayışını ifade eder."
 nuclear_energy_project:0 "Türk Nükleer Enerji Projesi"
 nuclear_energy_project_desc:0 "Türkiye Cumhuriyeti nükleer teknolojide geride kalmamalı. Bu yüzden Atatürk eşliğinde yenilikçi bir nükleer doktrine ve nükleer reaktör atılımlarına geçiyoruz. Bu kapsamlı program sayesinde başarıya ve istikrara ulaşacağız. Yaşasın Vatan ve Hürriyet! Sınırlarımızı her zaman koruyacağız!"
 nuclear_energy_project_2:0 "Türk Nükleer Enerji Projesi"
 nuclear_energy_project_2_desc:0 "Türkiye Cumhuriyeti nükleer teknolojide geride kalmamalı. Bu yüzden Atatürk eşliğinde yenilikçi bir nükleer doktrine ve nükleer reaktör atılımlarına geçiyoruz. Bu kapsamlı program sayesinde başarıya ve istikrara ulaşacağız. Yaşasın Vatan ve Hürriyet! Sınırlarımızı her zaman koruyacağız!"
 nuclear_energy_project_3:0 "Türk Nükleer Enerji Projesi"
 nuclear_energy_project_3_desc:0 "Türkiye Cumhuriyeti nükleer teknolojide geride kalmamalı. Bu yüzden Atatürk eşliğinde yenilikçi bir nükleer doktrine ve nükleer reaktör atılımlarına geçiyoruz. Bu kapsamlı program sayesinde başarıya ve istikrara ulaşacağız. Yaşasın Vatan ve Hürriyet! Sınırlarımızı her zaman koruyacağız!"
 space_intelligence:0 "Uzay İstihbaratı"
 space_intelligence_desc:0 "Uzaydaki teknolojimizi ve uydu gücümüzü artırarak uzaydaki casusluk ve gözetleme kabiliyetlerimizi artıracağız. Uzaydaki yeni imkânlar bize astropolitik güç kazandıracak."
 state_realism:0 "Gerçekçi Değerler"
 state_realism_desc:0 "Atatürk'ün Türkiye'sinde gerçekçi bir düşünce yapısı oluşturacağız; gerçekçi düşünceyle ülkemiz gerçeklik odaklı bir şekilde gelişecek. Bu durum Türkiye'nin istikrarı için bir ganimettir."
 ataturk_innovationalism:0 "Kemalist Yenilikçilik"
 ataturk_innovationalism_desc:0 "Atatürk'ün düşüncesi aynı zamanda yenilikçi bir düşüncedir. Bu düşünceler sayesinde ülkemiz bir teknoloji merkezi hâline gelecek."
 promising_investors:0 "Umut Vadeden Yatırımcılar"
 promising_investors_desc:0 "Türk ekonomisi tam bir enkaz olduğu için yatırımcı buraya gelmemişti. Artık Ankara'nın yapacağı teşviklerle ülkemiz kendine güvenen yerli ve yabancı yatırımcıları mıknatıs gibi çekecek ve güçlenecek."
 promising_investors_2:0 "Umut Vadeden Yatırımcılar"
 promising_investors_2_desc:0 "Türk ekonomisi tam bir enkaz olduğu için yatırımcı buraya gelmemişti. Artık Ankara'nın yapacağı teşviklerle ülkemiz kendine güvenen yerli ve yabancı yatırımcıları mıknatıs gibi çekecek ve güçlenecek."
 tank_research_office:0 "Tank Araştırma Ofisi"
 tank_research_office_desc:0 "Türkiye tank sanayisi konusunda Atatürk'ü hayal kırıklığına uğrattı. Atatürk tank sanayisini, bugünkü gibi yok olmak yerine ihracat yapabilecek bir numaralı alanlarımızdan biri olarak görüyordu. Atatürk şimdi Türk milletinin hatalarını düzeltmek için bu yardımcı geliştirme ofislerini kuruyor..."
 tank_research_office_2:0 "Tank Araştırma Ofisi"
 tank_research_office_2_desc:0 "Türkiye tank sanayisi konusunda Atatürk'ü hayal kırıklığına uğrattı. Atatürk tank sanayisini, bugünkü gibi yok olmak yerine ihracat yapabilecek bir numaralı alanlarımızdan biri olarak görüyordu. Atatürk şimdi Türk milletinin hatalarını düzeltmek için bu yardımcı geliştirme ofislerini kuruyor..."
 plane_research_office:0 "Uçak Araştırma Ofisi"
 plane_research_office_desc:0 "Türkiye uçak sanayisi konusunda Atatürk'ü hayal kırıklığına uğrattı. Atatürk uçak sanayisini, bugünkü gibi yok olmak yerine ihracat yapabilecek bir numaralı alanlarımızdan biri olarak görüyordu. Atatürk şimdi Türk milletinin hatalarını düzeltmek için bu yardımcı geliştirme ofislerini kuruyor..."
 reissuing_peace_in_the_region:0 "Bölgeye Barış Getirmek"
 reissuing_peace_in_the_region_desc:0 ""Yurtta sulh, cihanda sulh" sözü mevcut konjonktürde gerçekleşemez. Komşularımız tam bir kargaşa içinde; onları bu kötü durumdan mutlaka çıkarmalı ve bölgesel istikrarı sağlamalıyız. Bunu güçlü müdahalelerle yapabiliriz. Bu yüzden salt barış politikasını bir kenara bırakıp bölgedeki kendi çıkarlarımızı ve millî hedeflerimizi koruyarak bölgeyi bir barış eksenine dönüştürme süreçlerini başlatıyoruz."
 the_eximbank_improvement:0 "Eximbank'ın Geliştirilmesi"
 the_eximbank_improvement_desc:0 "Eximbank, 21 Ağustos 1987 tarihli Resmî Gazete'de yayımlanan Bakanlar Kurulu Kararı ile kurulan ve ihracatı geliştirmek için kredi sağlayan bir kurumdur. 1987'den 2012'ye kadar Türk Eximbank'ın genel müdürlüğü Ankara'daydı. 2012'de ihracatçı şirketlere daha yakın olmak için genel merkezini Ümraniye'ye taşıdı. Bankanın İstanbul, Ankara ve İzmir'de toplam 3 bölge müdürlüğü, 20 şubesi ve 12 irtibat bürosu bulunuyor."
 wage_improvement:0 "Ücret Politikaları"
 wage_improvement_desc:0 "İnsanların maddi olarak zenginleşmesi ülkenin sürekliliğini sağlayacak. Bu yüzden devlet olarak insanlara ekstra maddi destek sağlayacağız; böylece genel bir maddi ve devlet kazancı elde edebileceğiz."
 family_and_youth_bank:0 "Aile ve Gençlik Bankası"
 family_and_youth_bank_desc:0 "Gençlerimizi aile kurmaya teşvik ediyoruz. Yeni evli çiftlerimize evlilik kredisi vereceğiz. Bir aile ve gençlik bankası kuracağız. Gençlerimizi bu bankayla destekleyeceğiz. Bunu doğal gaz gelirleriyle destekleyeceğiz. Hibe ve teşvik programlarıyla onların yanında olacağız."
 turkiye_ekseni:0 "Türk Ekseni"
 turkiye_ekseni_desc:0 "Türkiye Yüzyılı'nda dış politikamızın temel hedefi Türkiye Ekseni'ni inşa etmektir. Bunu 85 milyon Türk vatandaşı, coğrafi sınırların ötesindeki akrabalarımız ve dünyanın dört bir yanındaki dostlarımız ve müttefiklerimizle birlikte güçlendireceğiz."
 turkish_genom_project:0 "Türk Genom Projesi"
 turkish_genom_project_desc:0 "Türk Genom Projesi (TGP), Türkiye'de insan DNA'sını oluşturan baz çiftlerini belirlemek ve insan genomundaki tüm genleri hem fiziksel hem de işlevsel açıdan tanımlamak, haritalamak ve dizilemek için yürütülen ulusal bir bilimsel araştırma projesiydi."
 justice_lessons:0 "Adalet Dersleri"
 justice_lessons_desc:0 "Adalet dersleri, bireyleri adalet ilkeleri, hukukun üstünlüğü ve hakkaniyet ile eşitliğin önemi konusunda eğiterek toplumda kritik bir rol oynar."
 e_turquality:0 "e-Turquality"
 e_turquality_desc:0 "E-Turquality (Bilişimin Yıldızları) programı, ülkemizde bilişim ve alt sektörlerinin gelişimini kapsayan, yeniliği teşvik eden ve uluslararası pazarlarda rekabet edebilecek bölgesel ve küresel unicornların oluşturulmasına yönelik bir destek programıdır."
 cimer_question:0 "Reforme Edilen CİMER"
 cimer_question_desc:0 "Kısaca CİMER olarak bilinen Cumhurbaşkanlığı İletişim Merkezi, 2015'te kurulan ve Türk vatandaşlarının şikâyetleri ya da bilgi edinmek için Cumhurbaşkanlığına ulaşmasını sağlayan bir sistemdir. Kurum, talebin türüne göre bu başvurulara 15 ya da 30 gün içinde yanıt vermek zorundadır."
 traditional_education:0 "Geleneksel Eğitim"
 traditional_education_desc:0 "Geleneksel eğitim, yüzyıllardır yaygın olan alışılagelmiş eğitim biçimini ifade eder. Genellikle öğretmen merkezli öğretim, standart müfredat ve sınıf temelli öğrenmeyi içerir. Geleneksel eğitim uzun süre baskın model olsa da son yıllarda alternatif eğitim yaklaşımlarına giderek daha fazla önem verilmektedir."
 the_national_front:0 "Cumhurbaşkanlığı Cepheleri"
 the_national_front_desc:0 "Ülkemiz yeni sistemle gelişti ve eksiklerini gidererek sağlam bir otorite ve güç elde etmeyi başardı. Bu sistem ülkemizin siyasi olarak güçlenmesini sağladı ve savaşa uygun bir devlet oluştu. Yeni Türkiye bu atılımlarla güçlendi. Yaşasın Türkiye'nin İkinci Yüzyılı!!"
 zafer_tourism:0 "Zafer Turizmi"
 zafer_tourism_desc:0 "Zafer Partisi, sosyal medya hesaplarından "Zafer Turizm" adıyla bir seçim kampanyası başlattığını duyurdu. Kampanya, mültecileri otobüslerle geri gönderme vaadiyle seçmenlerden para topluyor."
 zafer_mancinik:0 "Zafer Mancınık"
 zafer_mancinik_desc:0 "Zafer Mancınık projesi, Zafer Turizm'in ileri bir sürümü olarak biliniyor. Adı, mecazi anlamda mültecileri bir mancınıkla ülkeden fırlatma fikrinden geliyor."
 reach_the_left_right_front:0 "Sağ ve Sol Koalisyonu"
 reach_the_left_right_front_desc:0 "Sağ-sol koalisyonu, siyasi yelpazenin sağ ve sol uçlarındaki partiler arasındaki siyasi ittifakı ifade eder."
 the_national_investment_act:0 "Millî Yatırım Kanunu"
 the_national_investment_act_desc:0 "Pek çok ülke sınırları içindeki yatırım faaliyetlerini düzenleyen kanun ya da politikalara sahiptir. Bu kanunlar ekonomik büyümeyi teşvik etmeyi, yatırımcıları korumayı ve adil, şeffaf yatırım uygulamalarını sağlamayı amaçlar. Yabancı yatırım, yerli yatırım, yatırımcı teşvikleri, belirli sektörlere ilişkin düzenlemeler ve fikrî mülkiyet haklarının korunması gibi yatırımın çeşitli yönlerini kapsayabilir."
 granted_central_bank_independence:0 "Merkez Bankasına Bağımsızlık Tanındı"
 granted_central_bank_independence_desc:0 "Merkez bankası bağımsızlığı, bir merkez bankasının siyasi müdahale ya da etkiden bağımsız olarak özerk bir şekilde faaliyet göstermesi ve para politikası kararları alabilmesidir. Merkez bankalarına bağımsızlık tanındığında, fiyat istikrarı ve finansal istikrar gibi hedeflerini hükümetin ya da diğer dış aktörlerin aşırı baskısı olmadan izleme yetkisine sahip olurlar."
 turkish_style_silicon_valleys:0 "Türk Tarzı Silikon Vadileri"
 turkish_style_silicon_valleys_desc:0 "Amerika'da son derece iyi işleyen Silikon Vadisi sistemini uyarlamaya başladık. Bu uyarlamayla ülkemiz yenilikçi güçlerle bir kalkınma sürecine girecek ve dünya pazarına yeni teknolojik ürünler sunacak."
 the_turkish_start_up_culture:0 "Türk Girişim Kültürü"
 the_turkish_start_up_culture_desc:0 "Türkiye'nin girişim ekosistemi son on yılda önemli bir büyüme yaşadı; İstanbul, Ankara ve İzmir gibi şehirlerde canlı bir girişim kültürü ortaya çıktı."
 the_TWF:0 "Türkiye Varlık Fonu"
 the_TWF_desc:0 "Türkiye Varlık Fonu, Ağustos 2016'da kurulan ve Türkiye Cumhuriyeti hükümetine ait 33 milyar dolarlık bir ulusal varlık fonudur. Fon, Bakanlar Kurulu tarafından onaylanan bir "Stratejik Yatırım Planı" ile işletilir. Daha önce devlet kurumlarına ait şirket ve varlıklar fona devredilebilir ve uygun görülürse alt fonlar oluşturulabilir."
 syrian_marriage:0 "Suriyeli-Türk Evlilikleri"
 syrian_marriage_desc:0 "Suriyelilerin göçüyle makroekonomik, siyasi ve demografik zorluklar yaşadık ve bu sorunları çözmenin tek yolu Suriyelilerle evlenmek. Bu evlilikler ülkemizde nüfusun artmasına, Suriyelilerin ülkeye entegre olmasına ve aynı zamanda oy kazanmamıza yardımcı olacak."
 economic_failing_2:0 "Ekonomik Motivasyonun Kaybı"
 economic_failing_2_desc:0 "Devlet, iyi bilinen ortodoks politikaları terk ederek ekonomide derin bir çukur açtı. Bu çukuru kapatmak için liberal ortodoksinin kapitalist bakış açısına yeniden bağlanmalı ve toparlanmamız için uzun yıllar bu ekonomik düşünceyle yaşamalıyız."
 the_american_force:0 "Amerikan Destekli Kolordu"
 green_strikes_in_turkey:0 "Yeşil Ayaklanmalar"
 green_strikes_in_turkey_desc:0 "Ekolojistler hükümet politikalarını protesto ediyor; bu durum istikrarımıza ve iş gücümüze çok zarar veriyor. Bunun üstesinden derhâl gelmeliyiz, aksi takdirde ülkemiz için sorunlar çıkacak."
 the_turkish_brain_drain:0 "Türk Beyin Göçü"
 the_turkish_brain_drain_desc:0 ""Beyin göçü", yüksek vasıflı ve eğitimli bireylerin genellikle yurt dışındaki daha iyi fırsatlar ya da koşullar nedeniyle bir ülkeden başka bir ülkeye göç etmesi ya da kaybedilmesidir. Türkiye yıllar içinde bir beyin göçü yaşadı; pek çok yetenekli birey daha iyi kariyer olanakları, daha yüksek maaşlar ya da daha iyi yaşam standartları arayışıyla ülkeyi terk etmeyi seçti. Artık Türkiye'de beyin göçü çok büyük boyutlarda yaşanıyor ve bunun üstesinden gelmemiz gerekiyor."
 the_turkish_brain_drain_2:0 "Türk Beyin Göçü"
 the_turkish_brain_drain_2_desc:0 ""Beyin göçü", yüksek vasıflı ve eğitimli bireylerin genellikle yurt dışındaki daha iyi fırsatlar ya da koşullar nedeniyle bir ülkeden başka bir ülkeye göç etmesi ya da kaybedilmesidir. Türkiye yıllar içinde bir beyin göçü yaşadı; pek çok yetenekli birey daha iyi kariyer olanakları, daha yüksek maaşlar ya da daha iyi yaşam standartları arayışıyla ülkeyi terk etmeyi seçti. Artık Türkiye'de beyin göçü çok büyük boyutlarda yaşanıyor ve bunun üstesinden gelmemiz gerekiyor."
 the_turkish_brain_drain_3:0 "Türk Beyin Göçü"
 the_turkish_brain_drain_3_desc:0 ""Beyin göçü", yüksek vasıflı ve eğitimli bireylerin genellikle yurt dışındaki daha iyi fırsatlar ya da koşullar nedeniyle bir ülkeden başka bir ülkeye göç etmesi ya da kaybedilmesidir. Türkiye yıllar içinde bir beyin göçü yaşadı; pek çok yetenekli birey daha iyi kariyer olanakları, daha yüksek maaşlar ya da daha iyi yaşam standartları arayışıyla ülkeyi terk etmeyi seçti. Artık Türkiye'de beyin göçü çok büyük boyutlarda yaşanıyor ve bunun üstesinden gelmemiz gerekiyor."
 the_turkish_brain_drain_4:0 "Türk Beyin Göçü"
 the_turkish_brain_drain_4_desc:0 ""Beyin göçü", yüksek vasıflı ve eğitimli bireylerin genellikle yurt dışındaki daha iyi fırsatlar ya da koşullar nedeniyle bir ülkeden başka bir ülkeye göç etmesi ya da kaybedilmesidir. Türkiye yıllar içinde bir beyin göçü yaşadı; pek çok yetenekli birey daha iyi kariyer olanakları, daha yüksek maaşlar ya da daha iyi yaşam standartları arayışıyla ülkeyi terk etmeyi seçti. Artık Türkiye'de beyin göçü çok büyük boyutlarda yaşanıyor ve bunun üstesinden gelmemiz gerekiyor."
 chamber_of_innovation:0 "İnovasyon Odası"
 chamber_of_innovation_desc:0 "Bir İnovasyon Merkezi ya da Kuluçka Merkezi bağlamında "Yenilik Odası" terimi genellikle yeniliği teşvik eden ve girişimlerin büyümesini destekleyen bir kuruluşu ifade eder. Yenilikçiler, girişimciler, yatırımcılar ve diğer paydaşlar arasında işbirliği, bilgi paylaşımı ve ağ kurma için bir platform görevi görür."
 turkish_forums:0 "Türk Forumları"
 turkish_forums_desc:0 "Türk forumları, bireylerin Türkiye ile ilgili çeşitli konularda tartışmalara katılabildiği, bilgi paylaşabildiği ve görüş alışverişinde bulunabildiği çevrim içi platformlar ya da topluluklardır. Bu forumlar insanlara benzer ilgi alanlarına ya da deneyimlere sahip başkalarıyla bağlantı kurmaları ve tavsiye, bilgi ve bakış açısı alıp vermeleri için bir alan sağlar."
 technocratic_propaganda:0 "Teknokratik Propaganda"
 technocratic_propaganda_desc:0 "Teknokratik propaganda, teknokratik bir sistemin ilkelerini, değerlerini ve politikalarını öne çıkaran ve destekleyen bilgi, fikir ya da mesajların yayılmasıdır. Kamuoyunu şekillendirmeyi, destek oluşturmayı ve teknokrasi ile faydalarına ilişkin olumlu bir algı yaratmayı amaçlar."
 pain_of_the_government:0 "Teknokratik Değişimin Sancıları"
 pain_of_the_government_desc:0 "Teknokratik Değişimin Sancıları, teknokratik bir sistemin uygulanması sırasında ortaya çıkabilecek zorlukları, güçlükleri ya da direnişi temsil eder. Hükümetin ve paydaşlarının teknokratik bir modele geçiş sürecinde yaşadığı uyumları, aksaklıkları ya da çatışmaları kapsar."
 pain_of_the_government_2:0 "Teknokratik Değişimin Sancıları"
 pain_of_the_government_2_desc:0 "Teknokratik Değişimin Sancıları, teknokratik bir sistemin uygulanması sırasında ortaya çıkabilecek zorlukları, güçlükleri ya da direnişi temsil eder. Hükümetin ve paydaşlarının teknokratik bir modele geçiş sürecinde yaşadığı uyumları, aksaklıkları ya da çatışmaları kapsar."
 pain_of_the_government_3:0 "Teknokratik Değişimin Sancıları"
 pain_of_the_government_3_desc:0 "Teknokratik Değişimin Sancıları, teknokratik bir sistemin uygulanması sırasında ortaya çıkabilecek zorlukları, güçlükleri ya da direnişi temsil eder. Hükümetin ve paydaşlarının teknokratik bir modele geçiş sürecinde yaşadığı uyumları, aksaklıkları ya da çatışmaları kapsar."
 pain_of_the_parties:0 "Teknokratik Parti Sisteminin Sancıları"
 pain_of_the_parties_desc:0 "Teknokratik Değişimin Sancıları, teknokratik bir sistemin uygulanması sırasında ortaya çıkabilecek zorlukları, güçlükleri ya da direnişi temsil eder. Hükümetin ve paydaşlarının teknokratik bir modele geçiş sürecinde yaşadığı uyumları, aksaklıkları ya da çatışmaları kapsar."
 pain_of_the_parties_2:0 "Teknokratik Parti Sisteminin Sancıları"
 pain_of_the_parties_2_desc:0 "Teknokratik Değişimin Sancıları, teknokratik bir sistemin uygulanması sırasında ortaya çıkabilecek zorlukları, güçlükleri ya da direnişi temsil eder. Hükümetin ve paydaşlarının teknokratik bir modele geçiş sürecinde yaşadığı uyumları, aksaklıkları ya da çatışmaları kapsar."
 pain_of_the_parties_3:0 "Teknokratik Parti Sisteminin Sancıları"
 pain_of_the_parties_3_desc:0 "Teknokratik Değişimin Sancıları, teknokratik bir sistemin uygulanması sırasında ortaya çıkabilecek zorlukları, güçlükleri ya da direnişi temsil eder. Hükümetin ve paydaşlarının teknokratik bir modele geçiş sürecinde yaşadığı uyumları, aksaklıkları ya da çatışmaları kapsar."
 financial_relief_campaign:0 "Mali Yardım Kampanyası Kavramı"
 financial_relief_campaign_desc:0 "Mali yardım kampanyası, genellikle ihtiyaç sahibi bireylere ya da topluluklara fon toplamak ve mali yardım sağlamak için yürütülen koordineli bir çabayı ifade eder. Bu kampanyalar çoğunlukla ekonomik sıkıntıya ya da mali darboğaza yol açan belirli olaylara veya koşullara yanıt olarak düzenlenir."
 the_rational_policies:0 "Akılcı Politikalar"
 the_rational_policies_desc:0 "Akılcı ekonomi politikaları, sağlam ekonomik ilkelere, kanıtlara ve mantıksal akıl yürütmeye dayanan yaklaşım ve stratejileri ifade eder. Bu politikalar ekonomik büyümeyi, istikrarı ve kaynakların verimli dağılımını teşvik etmeyi amaçlar. Akılcı ekonomi politikalarının ayrıntıları belirli bir ülkenin ya da bölgenin bağlamına ve hedeflerine göre değişse de bu politikalarla sıklıkla ilişkilendirilen bazı temel ilke ve stratejiler vardır."
 the_rational_policies_2:0 "Akılcı Politikalar"
 the_rational_policies_2_desc:0 "Akılcı ekonomi politikaları, sağlam ekonomik ilkelere, kanıtlara ve mantıksal akıl yürütmeye dayanan yaklaşım ve stratejileri ifade eder. Bu politikalar ekonomik büyümeyi, istikrarı ve kaynakların verimli dağılımını teşvik etmeyi amaçlar. Akılcı ekonomi politikalarının ayrıntıları belirli bir ülkenin ya da bölgenin bağlamına ve hedeflerine göre değişse de bu politikalarla sıklıkla ilişkilendirilen bazı temel ilke ve stratejiler vardır."
 the_economist_cabinet:0 "Ekonomistler Kabinesi"
 the_economist_cabinet_desc:0 "Ekonomistler kabinesi, genellikle ekonomistlerden ya da güçlü ekonomik uzmanlığa sahip kişilerden oluşan bir hükümet kabinesini veya konseyini ifade eder. Ekonomistler kabinesinin amacı, ekonomi politikası kararlarına yön vermek ve onları şekillendirmek için hükümete ekonomik tavsiye, rehberlik ve politika önerileri sunmaktır."
 the_investment_campaign:0 "Yatırım Kampanyası"
 the_investment_campaign_desc:0 "Yatırım kampanyası, yerli ve yabancı yatırımcılar, işletmeler ya da bireyler gibi çeşitli kaynaklardan yatırım çekmeyi amaçlayan stratejik bir çabayı ifade eder. Yatırım kampanyasının amacı, belirli bir bölgeye, sektöre ya da projeye sermaye çekerek ekonomik büyümeyi teşvik etmek, iş olanakları yaratmak ve kalkınmayı canlandırmaktır."
 unions_deal:0 "Sendika Anlaşması"
 unions_deal_desc:0 "Sendika anlaşması, bir işçi sendikası ile bir işveren ya da işveren birliği arasında müzakere edilen bir anlaşma veya sözleşmedir. Sendika anlaşmasının amacı, sendikanın temsil ettiği işçilerin istihdam şartlarını ve koşullarını belirlemektir. Bu anlaşmalar genellikle ücretler, çalışma saatleri, sosyal haklar, iş güvencesi, şikâyet prosedürleri ve diğer istihdam şartları dahil çok çeşitli konuları kapsar.\n\nSendika anlaşmasının müzakere süreci, sendika ve işveren temsilcilerinin karşılıklı olarak kabul edilebilir bir anlaşmaya varmak için görüşmeler ve müzakereler yürüttüğü toplu pazarlığı içerir. Müzakere süreci, işçilerin çıkarları ile işverenin ihtiyaçları arasında bir denge bulmak için her iki taraftan da taviz ve uzlaşma gerektirebilir."
 unions_deal_imp:0 "Sendikaların Uyum Yeteneği"
 unions_deal_imp_desc:0 "Sendikaların uyum yeteneği, bir işçi sendikasının değişen koşullar ya da zorluklar karşısında uyum sağlama, tepki verme ve yenilik yapma becerisini ifade eder. Sendikanın üyelerinin değişen ihtiyaç ve kaygılarını karşılamak için yaratıcı düşünme, stratejilerini uyarlama ve yeni yaklaşımlar geliştirme kapasitesini içerir."
 corporation_boosting:0 "İşbirliği Fonu"
 corporation_boosting_desc:0 "İşbirliği fonu, farklı kuruluşlar arasındaki ortak girişimleri, işbirliklerini ya da ortaklıkları desteklemek için kurulan bir finansman mekanizmasıdır. İşbirliği fonunun temel amacı ortak girişimleri kolaylaştırmak, işbirliğini teşvik etmek ve ortak hedeflere ulaşmak için mali kaynak sağlamaktır."
 money_stocking_programme:0 "Para Rezervi"
 money_stocking_programme_desc:0 "Para rezervi genellikle fonların belirli bir amaç ya da olası bir durum için ayrılması veya mali kaynakların bir kısmının tahsis edilmesi uygulamasını ifade eder. Fonların ihtiyaç duyulduğunda hazır olmasını sağlamak ve başka amaçlarla kullanılmasını önlemek için ayrılmasını kapsar."
 automazation_campaign:0 "Otomasyon Kampanyası"
 automazation_campaign_desc:0 "Otomasyon kampanyası, çeşitli sektörlerde otomasyon teknolojilerini ve süreçlerini teşvik etmeyi ve uygulamayı amaçlayan stratejik bir çabadır. Kampanya, operasyonları sadeleştirmek, verimliliği artırmak ve üretkenliği iyileştirmek için teknolojideki ilerlemelerden yararlanmayı hedefler."
 robotic_workforces_auto:0 "Robotik ve Otomasyon Kampanyası"
 robotic_workforces_auto_desc:0 "Robotik ve otomasyon kampanyası, özellikle robotik sistemlerin ve otomasyon teknolojilerinin iş gücüne entegrasyonuna odaklanır. Kampanya robotik ve otomasyon kullanımıyla üretkenliği artırmayı, insan hatasını azaltmayı ve tekrarlayan ya da fiziksel olarak zorlu görevleri optimize etmeyi amaçlar."
 anti_unemployment_campaign:0 "İşsizlikle Mücadele ve Otomasyon Kampanyası"
 anti_unemployment_campaign_desc:0 "İşsizlikle mücadele ve otomasyon kampanyası, otomasyonun istihdam üzerindeki olası etkisini ele almayı amaçlar. Otomasyonu teşvik ederken aynı zamanda işçileri yeniden eğitmek ve becerilerini geliştirmek, girişimciliği teşvik etmek ve yeni istihdam olanakları yaratmak için önlemler uygulayarak iş kayıplarını azaltmaya çalışır."
 ending_the_automazation_campaign:0 "Genel Otomasyon Kampanyası"
 ending_the_automazation_campaign_desc:0 "Genel otomasyon kampanyası, ekonominin çeşitli sektörlerinde otomasyonun uygulanmasına yönelik genel kampanya hedeflerini ve stratejilerini ifade eder. Bir yenilik kültürü geliştirmeyi, araştırma ve geliştirmeye yatırım yapmayı ve otomasyonun faydalarını en üst düzeye çıkarmak için destekleyici politikalar ve altyapı oluşturmayı amaçlar."
 sufficent_tax:0 "Yeterli Vergi"
 sufficent_tax_desc:0 "Yeterli vergi, vergi gelirlerinin hükümetin mali ihtiyaçlarını karşılamaya yetmesini sağlama kavramını ifade eder. Kamu hizmetlerini, altyapı gelişimini, sosyal refah programlarını ve diğer hükümet girişimlerini finanse etmek için etkili bir şekilde gelir toplayan bir vergi sisteminin tasarlanıp uygulanmasını kapsar."
 sufficent_tax_economics:0 "Yeterli Vergi ve Ekonomi"
 sufficent_tax_economics_desc:0 "Bu politika, vergi politikaları ile ekonomik sonuçlar arasındaki ilişkiyi inceler. Gelir elde etmeyi ekonomik büyüme, yatırım teşvikleri, gelir dağılımı ve genel mali istikrarla dengeleyen iyi tasarlanmış bir vergi sisteminin önemini vurgular."
 new_turkish_education_policies:0 "Teknokratik Türk Eğitimi"
 new_turkish_education_policies_desc:0 "Teknokratik Türk eğitimi, Türkiye'de teknokratik bir yaklaşımı öne çıkaran eğitim politikalarının uygulanmasını ifade eder. Bu politikalar eğitimin kalitesini artırmak ve öğrencileri teknolojik olarak gelişmiş bir toplumda ihtiyaç duyulan becerilerle donatmak için teknolojiyi, yeniliği, dijital okuryazarlığı ve STEM (Bilim, Teknoloji, Mühendislik ve Matematik) eğitimini bir araya getirmeye odaklanır."
 new_turkish_education_policies_2:0 "Teknokratik Türk Eğitimi"
 new_turkish_education_policies_2_desc:0 "Teknokratik Türk eğitimi, Türkiye'de teknokratik bir yaklaşımı öne çıkaran eğitim politikalarının uygulanmasını ifade eder. Bu politikalar eğitimin kalitesini artırmak ve öğrencileri teknolojik olarak gelişmiş bir toplumda ihtiyaç duyulan becerilerle donatmak için teknolojiyi, yeniliği, dijital okuryazarlığı ve STEM (Bilim, Teknoloji, Mühendislik ve Matematik) eğitimini bir araya getirmeye odaklanır."
 new_turkish_education_policies_3:0 "Teknokratik Türk Eğitimi"
 new_turkish_education_policies_3_desc:0 "Teknokratik Türk eğitimi, Türkiye'de teknokratik bir yaklaşımı öne çıkaran eğitim politikalarının uygulanmasını ifade eder. Bu politikalar eğitimin kalitesini artırmak ve öğrencileri teknolojik olarak gelişmiş bir toplumda ihtiyaç duyulan becerilerle donatmak için teknolojiyi, yeniliği, dijital okuryazarlığı ve STEM (Bilim, Teknoloji, Mühendislik ve Matematik) eğitimini bir araya getirmeye odaklanır."
 new_turkish_education_policies_4:0 "Teknokratik Türk Eğitimi"
 new_turkish_education_policies_4_desc:0 "Teknokratik Türk eğitimi, Türkiye'de teknokratik bir yaklaşımı öne çıkaran eğitim politikalarının uygulanmasını ifade eder. Bu politikalar eğitimin kalitesini artırmak ve öğrencileri teknolojik olarak gelişmiş bir toplumda ihtiyaç duyulan becerilerle donatmak için teknolojiyi, yeniliği, dijital okuryazarlığı ve STEM (Bilim, Teknoloji, Mühendislik ve Matematik) eğitimini bir araya getirmeye odaklanır."
 new_turkish_education_policies_5:0 "Teknokratik Türk Eğitimi"
 new_turkish_education_policies_5_desc:0 "Teknokratik Türk eğitimi, Türkiye'de teknokratik bir yaklaşıma öncelik veren eğitim politikalarının uygulanmasına odaklanır. Teknolojiyi bütünleştirmeyi, eleştirel düşünme ve problem çözme becerilerini geliştirmeyi, yaratıcılığı teşvik etmeyi ve öğretim yöntemlerini modern dünyanın taleplerine uyarlamayı amaçlar."
 visual_learning:0 "Görsel Öğrenme"
 visual_learning_desc:0 "Görsel öğrenme, bireylerin bilgiyi resimler, diyagramlar, grafikler ya da videolar gibi görsel araçlar aracılığıyla daha iyi anladığı ve hatırladığı bir öğrenme stilini ifade eder. Kavrayışı, hafızada tutmayı ve genel öğrenme etkinliğini artırmak için görsel materyallerin kullanılmasını öne çıkarır."
 kinetic_learning:0 "Kinestetik Öğrenme"
 kinetic_learning_desc:0 "Kinestetik öğrenme, dokunsal ya da uygulamalı öğrenme olarak da bilinir; öğrenmeyi geliştirmek için fiziksel etkinliği ve etkileşimli deneyimleri öne çıkaran bir yaklaşımdır. Anlayışı derinleştirmek ve bilgiyi kalıcı kılmak için öğrenenleri uygulamalı deneyler, simülasyonlar, rol yapma ya da manipülatif etkinliklerle sürece dahil eder."
 vocal_learning:0 "İşitsel Öğrenme"
 vocal_learning_desc:0 "İşitsel öğrenme, öğrenme sürecinde işitsel ve sözlü etkileşimlerin önemine odaklanır. Kavrayışı, iletişim becerilerini ve eleştirel düşünme yeteneklerini geliştirmede konuşma dilinin, tartışmaların, münazaraların ve sunumların gücünü kabul eder."
 reformed_media:0 "Teknokratik Türk Medyası"
 reformed_media_desc:0 "Teknokratik Türk medyası, Türkiye'deki medya ortamını teknokratik bir yaklaşımla dönüştürmeyi amaçlayan reform ve politikaları ifade eder. Medya okuryazarlığını teşvik etmeye, bağımsız gazeteciliği geliştirmeye, dijital medya altyapısını güçlendirmeye ve medya çoğulculuğunu ve şeffaflığını sağlamaya odaklanır."
 reformed_media_2:0 "Teknokratik Türk Medyası"
 reformed_media_2_desc:0 "Teknokratik Türk medyası, Türkiye'deki medya ortamını teknokratik bir yaklaşımla dönüştürmeyi amaçlayan reform ve politikaları ifade eder. Medya okuryazarlığını teşvik etmeye, bağımsız gazeteciliği geliştirmeye, dijital medya altyapısını güçlendirmeye ve medya çoğulculuğunu ve şeffaflığını sağlamaya odaklanır."
