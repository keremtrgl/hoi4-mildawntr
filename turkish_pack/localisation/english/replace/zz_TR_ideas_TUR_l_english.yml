 turkish_war_for_confidence:0 "Onur İçin Savaş Politikası"
 turkish_war_for_confidence_desc:0 "Onurumuz için her yerde savaşmaya hazırız. İtibarımıza zarar verebilecek ülkeleri devirebilecek bir politikayı benimsiyoruz."
 ecevits_bird:0 "Ecevit'in Beyaz Kuşu"
 ecevits_bird_desc:0 "Ecevit'in kuşu göklerde uçuyor. Bu kuş barışın gücü, Türk gücü ve Türk sosyal demokrasisidir. Bu güçle tüm düşmanlarımızı tek tek yeneceğiz."
 democratic_cooperatives_of_industry_1:0 "Demokratik Sanayi Kooperatifleri"
 democratic_cooperatives_of_industry_1_desc:0 "Demokratik Sanayi Kooperatiflerinin amacı işçilerimizi memnun etmek. Devletimiz işçilerimizi memnun edemediği için işçilerle ilgili işleri Demokratik Sanayi Kooperatiflerine devrettik. Demokratik Sanayi Kooperatifleri işçilerle ilgilenecek yeni fabrikalar açacak ve ülkemizin ekonomik olarak güçlenmesini sağlayacak.\n\n§YDemokratik Sanayi Kooperatiflerinin Gücü: §RDüşük§!"
 democratic_cooperatives_of_industry_2:0 "Demokratik Sanayi Kooperatifleri"
 democratic_cooperatives_of_industry_2_desc:0 "Demokratik Sanayi Kooperatiflerinin amacı işçilerimizi memnun etmek. Devletimiz işçilerimizi memnun edemediği için işçilerle ilgili işleri Demokratik Sanayi Kooperatiflerine devrettik. Demokratik Sanayi Kooperatifleri işçilerle ilgilenecek yeni fabrikalar açacak ve ülkemizin ekonomik olarak güçlenmesini sağlayacak.\n\n§YDemokratik Sanayi Kooperatiflerinin Gücü: §YOrta§!"
 democratic_cooperatives_of_industry_3:0 "Demokratik Sanayi Kooperatifleri"
 democratic_cooperatives_of_industry_3_desc:0 "Demokratik Sanayi Kooperatiflerinin amacı işçilerimizi memnun etmek. Devletimiz işçilerimizi memnun edemediği için işçilerle ilgili işleri Demokratik Sanayi Kooperatiflerine devrettik. Demokratik Sanayi Kooperatifleri işçilerle ilgilenecek yeni fabrikalar açacak ve ülkemizin ekonomik olarak güçlenmesini sağlayacak.\n\n§YDemokratik Sanayi Kooperatiflerinin Gücü: §GÇok Yüksek§!"
 agricultural_act:0 "Tarım Gücü"
 agricultural_act_desc:0 "Türkiye'de hem tarım sanayisini hem de sanayiyi geliştirmek mümkün. Bu ikisini geliştirmek için düğmeye basıyoruz. Önce tarım sanayisini geliştireceğiz, tarımdan elde edilen kârla fabrikalar açacağız; bu fabrikalar da hammaddeleri işleyip yurt dışına satarak kâr edecek.\n\n§YTarım Programının Durumu: §Gİyi§!\n§YSanayi Programının Durumu: §RKötü§!"
 agricultural_act_2:0 "Tarım-Sanayi Gücü"
 agricultural_act_2_desc:0 "Türkiye'de hem tarım sanayisini hem de sanayiyi geliştirmek mümkün. Bu ikisini geliştirmek için düğmeye basıyoruz. Önce tarım sanayisini geliştireceğiz, tarımdan elde edilen kârla fabrikalar açacağız; bu fabrikalar da hammaddeleri işleyip yurt dışına satarak kâr edecek.\n\n§YTarım Programının Durumu: §GÇok İyi§!\n§YSanayi Programının Durumu: §YNormal§!"
 agricultural_act_3:0 "Tarım-Sanayi Güç Merkezi"
 agricultural_act_3_desc:0 "Türkiye'de hem tarım sanayisini hem de sanayiyi geliştirmek mümkün. Bu ikisini geliştirmek için düğmeye basıyoruz. Önce tarım sanayisini geliştireceğiz, tarımdan elde edilen kârla fabrikalar açacağız; bu fabrikalar da hammaddeleri işleyip yurt dışına satarak kâr edecek.\n\n§YTarım Programının Durumu: §GÇok İyi§!\n§YSanayi Programının Durumu: §GÇok İyi§!"
 beauty_of_kyk:0 "Yenilenen KYK Yurtları"
 beauty_of_kyk_desc:0 "KYK yurtlarını yenileyerek hizmete açacağız. Öğrencilerimiz bundan memnun olacak ve üniversitelerinden mezun olmak için çalışacak."
 summer_and_night_working_schools:0 "Yaz ve Gece Öğretimi Üniversiteleri"
 summer_and_night_working_schools_desc:0 "Üniversiteleri sabah ve akşam çalıştırarak kapasitelerini artıracağız. Bu kapasite artışıyla daha fazla üniversite mezunumuz olacak ve bunu üniversite inşa etmeden başarmış olacağız."
 unsickness_in_the_universities:0 "Üniversitelerde Özel İklim"
 cyprus_intervention_legacy:0 "Kıbrıs Harekâtının Mirası"
 cyprus_intervention_legacy_desc:0 "Kıbrıs'ı kurtarmamızı engelleyebilecek hiçbir güç olmadığını, diplomatik ambargolar ve manevralarla bizi yıldıramayacaklarını hatırlayacağız. Bu hatırlayışla istediklerimizi gerçekleştirebileceğiz."
 turkish_war_culture:0 "Türk Savaş Kültürü"
 turkish_war_culture_desc:0 "Türkler Orta Asya'daki göçebe hayatlarında savaşmakta çok iyiydi. Yerleşik hayat ve hızlı modernleşmeyle bu özellik gücünü yitirmeye başladı. Bu özellikleri tazeleyip yeniden canlandırma zamanı geldi."
 TUR_4_year_dockyard_plan:0 "Dört Yıllık Türk Deniz Programı"
 TUR_4_year_dockyard_plan_desc:0 "Mavi Vatan projemizi hayata geçirmek için deniz yapılanmasını yürürlüğe koyduk. Büyük bir donanmanın kurulmasıyla çevremizdeki ülkeler bizden korkacak."
 anti_italian_state:0 "İtalya Karşıtı Kuvvet"
 anti_italian_state_desc:0 "İtalya'nın askerî teçhizatına ve taktiklerine karşı güçlü bir taktik bulmak için yola çıktık. Bu sayede İtalya bize karşı hiçbir şey yapamayacak."
 resist_against_nato_supremacy:0 "NATO Üstünlüğüne Karşı Direniş!"
 resist_against_nato_supremacy_desc:0 "NATO'nun tankları ve uçakları üstün ateş gücüne sahip olabilir, ama NATO'ya karşı direniş gösterebiliriz. Bu direnişle sözde yenilmez NATO'yu yıkabiliriz. Yaşasın Türk Direnişi!"
 turkish_society_first:0 "Türk Milleti Önceliğimiz"
 turkish_society_first_desc:0 "Türk milleti her şeyin üstesinden gelecek güce sahiptir. Bu Kurtuluş Savaşı'nda kanıtlandı. Kanımızdan gelen bu güçle bizi yok etmeye çalışan her düşmanı yok edeceğiz."
 turkish_interventionism:0 "Türk Müdahaleciliği"
 turkish_interventionism_desc:0 "Türkler olarak çevremizde yaşanan olaylara gözümüzü kapatmayarak müdahale edeceğiz. Bu müdahaleyle dış politikada iyi kazanımlar elde edebiliriz."
 german_turkish_visits:0 "Alman-Türk Ziyaretleri"
 german_turkish_visits_desc:0 "Almanya ile Türkiye arasında anlaşmalar ve ziyaretler hazırlıyor, iki ülkeyi olumlu etkileyecek bir diplomatik girişim yürütüyoruz."
 wolkswagen_technicans_tur:0 "Türk Teknisyenler Volkswagen'e Gönderildi"
 wolkswagen_technicans_tur_desc:0 "Alman markası Volkswagen'i incelemek için Almanya'daki Volkswagen fabrikalarına mühendis gönderiyoruz. Bu inceleme sonucunda ülkemizdeki teknolojiyi iyi yerlere getirebiliriz."
 wolkswagen_technicans_ger:0 "Türk Teknisyenler Kabul Edildi"
 wolkswagen_technicans_ger_desc:0 "Türkiye'den ülkemize teknisyenler geldi. Bu teknisyenlerin amacı kendi ülkelerindeki teknolojiyi ilerletmek. Bu teknisyenlerden ücret alarak ülkemizin ekonomisine katkı sağlayabiliriz."
 received_acedicians_ger:0 "Türk Akademisyenler Kabul Edildi"
 received_acedicians_ger_desc:0 "Türkiye'den ülkemize akademisyenler geliyor; bu akademisyenlerin çalışmalarından ve paralarından yararlanarak ülkemizi güçlendirebiliriz."
 given_academicians_ger:0 "Almanya'ya Akademisyen Gönderildi"
 given_academicians_ger_desc:0 "Türk akademisyenlerimizi gelişmeleri için Almanya'ya gönderiyoruz. Almanya'da gelişen akademisyenlerimiz bize akademik ve teknolojik açıdan güç katacak."
 american_turkish_visits:0 "Amerikan-Türk Ziyaretleri"
 american_turkish_visits_desc:0 "ABD ile Türkiye arasında anlaşmalar ve ziyaretler hazırlıyor, iki ülkeyi olumlu etkileyecek bir diplomatik girişim yürütüyoruz."
 ford_technicans_tur:0 "Türk Teknisyenler Ford'a Gönderildi"
 ford_technicans_tur_desc:0 "ABD markası Ford'u incelemek için ABD'deki Ford fabrikalarına mühendis gönderiyoruz. Bu inceleme sonucunda ülkemizdeki teknolojiyi iyi yerlere getirebiliriz."
 ford_technicans_usa:0 "Türk Teknisyenler Kabul Edildi"
 ford_technicans_usa_desc:0 "Türkiye'den ülkemize teknisyenler geldi. Bu teknisyenlerin amacı kendi ülkelerindeki teknolojiyi ilerletmek. Bu teknisyenlerden ücret alarak ülkemizin ekonomisine katkı sağlayabiliriz."
 received_acedicians_usa:0 "Türk Akademisyenler Kabul Edildi"
 received_acedicians_usa_desc:0 "Türkiye'den ülkemize akademisyenler geliyor; bu akademisyenlerin çalışmalarından ve paralarından yararlanarak ülkemizi güçlendirebiliriz."
 given_academicians_usa:0 "Amerika'ya Akademisyen Gönderildi"
 given_academicians_usa_desc:0 "Türk akademisyenlerimizi gelişmeleri için ABD'ye gönderiyoruz. ABD'de gelişen akademisyenlerimiz bize akademik ve teknolojik açıdan güç katacak."
 huge_police_stations:0 "Modernize Edilmiş Karakollar"
 huge_police_stations_desc:0 "Yeni kararnamelerle karakolları modernize ettik. Bu modernizasyonla bölgedeki anarşist ve terör faaliyetleri en aza indirilecek."
 ziraat_pritavized:0 "Özelleştirilmiş Ziraat Bankası"
 ziraat_pritavized_desc:0 "Ziraat Bankası'nı özelleştirerek bankacılığa serbest piyasa gücü kazandırdık. Özelleştirilen Ziraat Bankası piyasada iyi bir yere gelecek ve ülkemize yatırım yapacak."
 cultural_museums:0 "Modern Müzeler"
 cultural_museums_desc:0 "Ülkemizin dört bir yanında modern müzeler açarak halkımızı hem mutlu hem de kültürlü kılacağız."
 modern_schools:0 "Modernize Edilmiş Okullar"
 modern_schools_desc:0 "Okullarımız Avrupa standartlarında olmadığı için onları modernize ediyoruz. Bu modernizasyon hamlesiyle okullarımız teknolojik kapasiteye kavuşacak ve güçlenecek."
 dicipline_in_school:0 "Okulda Önce Disiplin"
 dicipline_in_school_desc:0 "Okulda disiplin çok önemlidir. Okulda disiplin olmazsa çalışkan öğrenci olmaz, okul tembellerle dolar. Bu da ülkemizin yenilik gücünü yok eder. Bu yüzden okullarda disiplini güçlendirecek kararnameler çıkardık."
 modern_hospitals:0 "Modernize Edilmiş Hastaneler"
 modern_hospitals_desc:0 "Hastanelerimiz teknolojik donanım konusunda büyük sorun yaşıyor. Hastanelerimizi modernize ederek bu sorunu çözeceğiz. Bu sorunun sona ermesiyle halkımızın sağlık sorunları daha sistemli ve hızlı bir şekilde çözülecek."
 hospitals_to_munitiplacy:0 "Belediye Hastaneleri"
 hospitals_to_munitiplacy_desc:0 "Hastaneleri belediyelere bağlayarak devleti iş yükünden kurtarıyoruz. Ayrıca hastanelerin belediyeye bağlanması sistemin bölgesel olarak uygulanmasını sağlayacak."
 supports_to_the_disableds:0 "Engellilere Destek"
 supports_to_the_disableds_desc:0 "Yeni geliştirilen teknolojileri kullanarak engelli vatandaşlarımızın hayatını kolaylaştıracağız."
 trial_clashings:0 "DSP ve CHP Davaları"
 trial_clashings_desc:0 "CHP ile DSP arasında davalar sürüyor. Bu davalar sürdükçe ülkemizdeki siyasi kargaşa ve seçim şiddeti artacak. Yeni ve istikrarlı bir siyasi ortam için bu davalar bir an önce sonuçlandırılmalı."
 israeli_turkish_trade:0 "İsrail-Türk Teknoloji Ticareti"
 israeli_turkish_trade_desc:0 "Türkiye ile İsrail arasındaki anlaşmalar bize fayda sağlıyor. Bu anlaşmalar artık yeni bir içerik kazanarak teknoloji ticaretine dönüştü. İsrail ile yapılan bu anlaşma teknolojimizi ileri seviyelere taşıyacak."
 war_against_countergueralla:0 "Kontrgerillaya Karşı Savaş"
 war_against_countergueralla_desc:0 "NATO'nun ülkemizde örgütlediği "Kontrgerilla" denen örgütü gördüğümüz yerde yok edeceğiz. Ayrıca Kontrgerilla örgütünün sağı kışkırtmasına izin vermeyerek oyunu kendisine karşı çevireceğiz."
 united_left_against_USA:0 "ABD'ye Karşı Birleşik Sol"
 united_left_against_USA_desc:0 "ABD'nin korkunç emperyalizmine karşı ülkemizdeki solu örgütleyecek, solu birleştirip devrimcileri tek bayrak altında toplayarak Amerikan emperyalizminin topraklarımıza girmesine izin vermeyeceğiz."
 powerized_neutral_state:0 "Güçlü Tarafsız Devlet"
 powerized_neutral_state_desc:0 "Ülkemizde tarafsızlığı vurgulayarak yalnızca halkımıza bağlı olduğumuzu göstereceğiz. Tarafsız bir politika izlemeye başlayarak geçmişteki hatalarımızı giderecek ve Atatürk'ün izinden gideceğiz. Böylece tüm dünya güçlü bir ülke olduğumuzu görecek."
 working_sgk:0 "İşleyen SGK"
 working_sgk_desc:0 "Sosyal Güvenlik Kurumu, Türk sosyal güvenlik sisteminin yönetici otoritesidir. 20 Haziran 2006 tarihli ve 26173 sayılı Resmî Gazete'de yayımlanan 5502 sayılı Sosyal Güvenlik Kurumu Kanunu ile kuruldu. Bu kanun; memurları, sözleşmeli ücretlileri, tarım işçilerini ve bağımsız çalışanları etkileyen beş farklı emeklilik sistemini, eşit aktüeryal hak ve yükümlülükler sunan tek bir emeklilik sisteminde birleştirdi."
 free_media_sponsored_state:0 "Korunan Özgür Medya"
 free_media_sponsored_state_desc:0 "Bağımsız bir medyanın olması şart. Medya olmadan halkımız mutlu olamaz, muhalif sesler yükselemez; sonuçta otoriterleşir ve halkımızı mutsuz ederek yanlış yaparız. Bunu önlemek için medyayı sonsuza dek koruyacağız."
 weakened_centralist_regime:0 "Zayıflatılmış Merkeziyetçi Rejim"
 working_municipilites:0 "Çalışan Belediyeler..."
 working_municipilites_desc:0 "Şimdiye kadar merkeziyetçi rejimlerin hiçbir faydası olmadı. Hiçbir işe yaramayan bu sistemi söküp atma zamanı geldi. Halkımız artık demir yumruğu çok daha az hissedecek."
 redzyned_local_rules:0 "Yeniden Tasarlanan Yerel Kurallar"
 redzyned_local_rules_desc:0 "Bir kural ülke genelinde kabul edildiğinde belirli bir disiplin sağlanabilir, ancak bölgeler bu durumdan memnun değil. Bölgelerin memnuniyetsizliğini gidermek disiplinden daha önemli; bu yüzden bölgelere özgü kurallar oluşturuyoruz."
 local_religions_freedom:0 "Yerel Din Önderlerine Özgürlük"
 local_religions_freedom_desc:0 "Yerel din önderleri yerel halk için çok önemli. Bu yüzden yerel önderler ne yaparsa yapsın serbest bırakılmalı. Her şey halkımızın mutluluğu için."
 collected_economies_of_the_local_regions:0 "Yerel Bölgelerin Ekonomilerinin Birleştirilmesi"
 collected_economies_of_the_local_regions_desc:0 "Tüm yerel ekonomileri birbiriyle bütünleştireceğiz. Bu bütünleştirme halkımızın huzurunu bozabilir. Ama ekonomik olarak kalkınma gücü elde etmemizi sağlayacak."
 local_works:0 "Yerel İşler"
 local_works_desc:0 "Yerel işler desteklenmeli. Yerel işlerden iyi bir gelir elde edilirse çalışma kapasitesi ve çalışkanlık artar."
 local_banks:0 "Yerel Bankalar"
 local_banks_desc:0 "Yerel bankalar yerel finansal sorunları tespit edip yerel yatırımlar yapabilir; bu sayede yerel kalkınma iyi bir seviyeye ulaşabilir."
 local_institutions:0 "Yerel Kurumlar"
 local_institutions_desc:0 "Yerel kurumlar yerel sorunları tespit etmekte ve halkı mutlu etmekte çok başarılıdır."
 funded_science:0 "Desteklenen Bilim"
 funded_science_desc:0 "Bilime para dökmeye değer, çünkü bilimin faydaları saymakla bitmez. Yenilik fikri Türkiye Cumhuriyeti devletinde her zaman canlı kalmalı."
 improved_exams:0 "İyileştirilmiş Sınavlar"
 improved_exams_desc:0 "Sınavlar tuhaf bir şekilde ilerliyor. Bu tuhaf gidişatı önleyerek sınavları baştan düzenleyeceğiz. Bu düzenlemeyle sınavların gidişatı düzelecek."
 encouragment_instead_of_coercion:0 "Zorlama Yerine Teşvik"
 encouragment_instead_of_coercion_desc:0 "İnsanları ders çalışmaktan bıktırmak yerine çalışmaya teşvik edeceğiz. Zorla güzellik olmaz."
 believing_the_education_power:0 "Eğitimin Gücüne İnanmak"
 believing_the_education_power_desc:0 "Gelecek nesillerimizi yetiştirmede en çok eğitim işimize yarayacak. Eğitim olmadan halkımız bir adım ileri gidemez. Bu yüzden eğitimin her şey olduğunu söyleyecek ve eğitime önem vereceğiz."
 border_security_first:0 "Sınır Güvenliği"
 border_security_first_desc:0 "Hudut namustur. Sınırları korumak için Türk askerî birliklerini konuşlandırarak sınırdan kuş bile uçurtmayacağız. Teröristler artık sınırdan ülkemize giremeyecek."
 train_civilian_corps:0 "Sivil Koruma Kolordusu"
 train_civilian_corps_desc:0 "Sivil birlikler oluşturarak PKK ile savaşacağız. Elbette sivil birlikler Türk Silahlı Kuvvetleri kadar yetenekli ve güçlü olmayacak, ama büyük ölçüde işe yarayacaklar."
 train_civilian_corps_better:0 "Geliştirilmiş Sivil Koruma Kolordusu"
 train_civilian_corps_better_desc:0 "Sivil birlikler oluşturarak PKK ile savaşacağız. Elbette sivil birlikler Türk Silahlı Kuvvetleri kadar yetenekli ve güçlü olmayacak, ama büyük ölçüde işe yarayacaklar."
 peace_state:0 "Barış Devleti"
 peace_state_desc:0 "Savaşın getirdiği güzel hiçbir şey yoktur. Savaş bir zorunluluktur. Bu yüzden Türkiye'yi bir barış ülkesi yapıyoruz. Böylesi daha iyi olacak."
 mind_games:0 "Akıl Oyunları"
 mind_games_desc:0 "Akıl oyunları kurarak diğer ülkelerin planlarını bozacak ve kendi planımızı gerçekleştireceğiz. Akıl oyunları oynamak bizi siyasi bir güç yapacak."
 mind_games_of_infulence:0 "Akıl Oyunları"
 mind_games_of_infulence_desc:0 "Akıl oyunları kurarak diğer ülkelerin planlarını bozacak ve kendi planımızı gerçekleştireceğiz. Akıl oyunları oynamak bizi siyasi bir güç yapacak."
 mind_games_of_infulence_and_man:0 "Akıl Oyunları"
 mind_games_of_infulence_and_man_desc:0 "Akıl oyunları kurarak diğer ülkelerin planlarını bozacak ve kendi planımızı gerçekleştireceğiz. Akıl oyunları oynamak bizi siyasi bir güç yapacak."
 maximixed_political_power_output:0 "Yeni Çağın Akıl Oyunları"
 maximixed_political_power_output_desc:0 "Akıl oyunları kurarak diğer ülkelerin planlarını bozacak ve kendi planımızı gerçekleştireceğiz. Akıl oyunları oynamak bizi bu yeni emperyalist çağda siyasi bir güç yapacak."
 immigration_buying:0 "Göç Karşılığında Ödeme"
 immigration_buying_desc:0 "İyi yerlerde eğitim almış mültecileri seçerek ülkemize getirebilir ve onları kendimiz için kullanabiliriz. Ülkemiz lehine bir beyin göçü yaratmak ülkemizi yenilikte iyi yerlere taşır."
 immigration_law:0 "Göç Kanunu"
 immigration_law_desc:0 "Bir mülteci yasası çıkarma zamanı geldi; artık kimse bu ülkeye bu kadar kolay giremeyecek. Avrupalılar ve Amerikalılar hariç, elbette."
 turkish_gateway_project_finished:0 "Türk Geçiş Kapısı Projesi Tamamen Faaliyette"
 turkish_gateway_project_finished_desc:0 "Türk Geçiş Kapısı Projesi artık tamamen faaliyette. Bu projeyi tamamlayarak ticaret yollarının bizden geçmesini sağladık. Ticaret yollarının bizden geçmesi büyük miktarda para ve kaynak kazanmamızı sağlayacak ve büyüme oranlarımız ciddi şekilde artacak."
 adaptable_economy:0 "Uyum Sağlayan Ekonomi"
 adaptable_economy_desc:0 "Türk ekonomisi çok kötü şeyler yaşadı ve artık bu tür şeylere alıştı. Şimdi ekonomimizin bu tür durumlardan çıkmaya alışması gerekiyor; bildiğiniz gibi ANAP hükümeti ekonominin küçülmesine izin vermeyecek."
 working_like_a_bee:0 "Arı Gibi Çalışmak"
 working_like_a_bee_desc:0 "Karınca gibi değil, arı gibi çalışacağız. Çok çalışıp iyi yerlere geleceğiz. Her şey Türkiye için!"
 textile_industries:0 "Tekstil Sanayileri"
 textile_industries_desc:0 "Tekstil sektörü temel olarak iplik, kumaş ve giysinin tasarımı, üretimi ve dağıtımıyla ilgilenir. Hammadde doğal olabileceği gibi kimya sanayisinin ürünleri kullanılarak sentetik de olabilir."
 cotton_industries:0 "Pamuk Sanayileri"
 cotton_industries_desc:0 "Pamuk dünyanın en önemli doğal lifidir. 2007'de 50'den fazla ülkede ekilen 35 milyon hektarlık alandan dünya genelinde 25 milyon ton ürün elde edildi. Türkiye'de bu rakam yaklaşık yarım milyon ton ve ekonomiyi ilerletmek için bunu artırmak üzere buradayız."
 new_created_automative_sector:0 "Türk Otomotiv Sektörü"
 new_created_automative_sector_desc:0 "Türk otomotiv sanayisi, motorlu taşıtların tasarımı, geliştirilmesi, üretimi, pazarlanması ve satışıyla uğraşan çok çeşitli şirket ve kuruluşlardan oluşur. Otomotiv, gelir bakımından dünyanın en büyük sektörlerinden biridir. Otomotiv sektörü, son kullanıcıya teslimattan sonra araçların bakımına yönelik işletmeleri kapsamaz."
 good_created_automative_sector:0 "Türk Otomotiv Sektörü"
 good_created_automative_sector_desc:0 "Türk otomotiv sanayisi, motorlu taşıtların tasarımı, geliştirilmesi, üretimi, pazarlanması ve satışıyla uğraşan çok çeşitli şirket ve kuruluşlardan oluşur. Otomotiv, gelir bakımından dünyanın en büyük sektörlerinden biridir. Otomotiv sektörü, son kullanıcıya teslimattan sonra araçların bakımına yönelik işletmeleri kapsamaz."
 fifth_generation_military_industries:0 "Beşinci Nesil Askerî Sanayi"
 competetion_authority:0 "Rekabet Kurumu"
 competetion_authority_desc:0 "Rekabet Kurumu, Türkiye'nin rekabet düzenleyicisidir. Kanunla verilen yetkileri kullanarak mal ve hizmet piyasalarında rekabet sürecine yönelik her türlü tehdidi önleyen bir Türkiye Cumhuriyeti devlet kurumudur. Rekabet sürecinin korunması yoluyla kaynakların adil dağılımını sağlamak ve toplumsal refahı artırmak Rekabet Kurumu'nun misyonunun temelini oluşturur."
 turksoy:0 "TÜRKSOY"
 turksoy_desc:0 "Uluslararası Türk Kültürü Teşkilatı, Türk dil ailesine ait dilleri konuşan Türk nüfusa sahip ülkelerin uluslararası bir kültür kuruluşudur. Türksoy, eski resmî adı olan Türk Kültür ve Sanatları Ortak Yönetimi'nin kısaltması olmasının yanı sıra "Türk" ve "soy" kelimelerinden oluşan Türkçe birleşik bir isimdir."
 turkpa:0 "TÜRKPA"
 turkpa_desc:0 "Tam adı Türk Dili Konuşan Ülkeler Parlamenter Asamblesi olan TÜRKPA, bazı Türk ülkelerinden oluşan uluslararası bir örgüttür."
 unitary_speeches:0 "Birlikçi Türk Konuşmaları"
 unitary_speeches_desc:0 "Türkleri birleştiren mitingler yapılmalı. Bu mitinglerle Türklük kaynaşacak. Yaşasın Türklük!"
 turkic_media:0 "Türk Medyası"
 turkic_media_desc:0 "Tüm Türk medyası artık birleşiyor. Bu birleşme karmaşa yaratacak ve sonunda medyanın bizi sıkıntıya sokmasına neden olabilir. Ama bu birleşmeyle Türklük idealleri güçlenecek."
 bureocratic_unification:0 "Genel Bürokratik Birleşme"
 bureocratic_unification_desc:0 "Türk bürokrasileri tek çatı altında birleşiyor. Bürokratik birleşme ülkemizi geçici bir süre için ciddi siyasi zorluklara sürükleyecek. Bürokratik birleşme tamamlandığında yabancı siyasi eksenlerin yerini yerli eksenler alacak."
 turkic_business_council:0 "Türk İş Konseyi"
 turkic_business_council_desc:0 "Türk İş Konseyi, Türk devletlerinin iş gücünü ve ekonomik ilkelerini izliyor ve buna göre bir ekonomi programı oluşturuyor. Bu konsey tamamen Türk devletlerine bağlı. Ayrıca IMF ile de ilişkileri var."
 asian_economic_observer:0 "Asya Ekonomilerinin Ekonomik Gözlemcisi"
 asian_economic_observer_desc:0 "Türk Konseyi, Asya Piyasası ve Borsası'nda gözlemci konumunda. Gözlemci konumunda bulunması, Asya Piyasası ve Borsası'ndaki ekonomik faaliyetler hakkında daha hızlı bilgi edinilmesini sağlıyor."
 gdp_program:0 "GSYH Misyonu"
 gdp_program_desc:0 "Türk Konseyi'nin GSYH Misyonu'nun amacı tüm Türk ülkelerinde GSYH'nin yükselmesini sağlamak. Türk Konseyi, GSYH'si düşük ülkelerde de GSYH oranlarını artırmak için bu ülkelere mali destek sağlıyor."
 low_debts_program:0 "Düşük Borç Programı"
 low_debts_program_desc:0 "Türk Konseyi'nin Borç Misyonu'nun amacı tüm Türk ülkelerinde borçların azalmasını sağlamak, gönül rahatlığı ve Türk birleşmesini temin etmek. Borçların azaltılması kapsamında Türk Konseyi aşırı borcu olan ülkelere mali destek sağlıyor."
 turkic_resource_commision:0 "Türk Kaynak Komisyonu"
 turkic_resource_commision_desc:0 "Türk Konseyi Kaynak Komisyonu'nun amacı tüm Türk ülkelerinde kaynak çıkarmak. Türk Konseyi, kaynak çıkarmada kaynak çıkaracak parası olmayan ülkelere mali destek sağlıyor."
 turkic_bankers_union:0 "Türk Bankacılar Birliği"
 turkic_bankers_union_desc:0 "Türk Konseyi Bankacılık Birliği'nin amacı tüm Türk ülkelerinde enflasyon, döviz kuru ve faiz dengesini oluşturmak. Bu dengeyi sağlamak için Türk Konseyi dengeyi sağlayamayan bankalara mali destek veriyor."
 turkic_economic_movement:0 "Birleşik Türk Ekonomik Hareketi"
 turkic_economic_movement_desc:0 "Herkes ekonomik anlamda birleşti. Bölgeden bölgeye gelir adaletsizliği oluşmaması için tüm Türk ülkelerinde ekonomik kalkınmanın sağlanması gerekiyor. Gelir adaletsizliği oluşmazsa Türk Birliği daha hızlı sağlanabilir."
 turkic_ministry:0 "Türk Bakanlıkları Yönergesi"
 turkic_ministry_desc:0 "Türk Konseyi için yeni bakanlıkların kurulması gerekiyor. Türk Konseyi için bakanlıkların kurulması artık bu birliğin kuruluşunun yakın olduğunun göstergesi."
 turkic_armed_forces:0 "Türk Savunma Kuvvetleri"
 turkic_armed_forces_desc:0 "Türk Savunma Ordusu'nun amacı tüm Türk ülkelerini ölümüne savunmak. Atalarımızın topraklarını korumak zorundayız. Türk mirası güvende!"
 turkic_armed_forces_2:0 "Türk Savunma Kuvvetleri"
 turkic_armed_forces_2_desc:0 "Türk Savunma Ordusu'nun amacı tüm Türk ülkelerini ölümüne savunmak. Atalarımızın topraklarını korumak zorundayız. Türk mirası güvende!"
 turkic_blood:0 "Türk Kanı"
 turkic_blood_desc:0 "Türk askeri öldüğü güne kadar bulunduğu yeri terk etmez. Türklüğün gücü milliyetçilikten ve vatan sevgisinden gelir. Düşmanlarımız topraklarımızı işgal etmeyi aklından bile geçirmesin."
 contacting_old_traditions:0 "Eski Geleneklerle Bağ Kurmak"
 contacting_old_traditions_desc:0 "Yaklaşan Türk birleşmesi için kadim geleneklerimize bağlılığımızı ilan etmeliyiz. Kadim geleneklerimize bağlılık Türk birliğini büyük ölçüde artıracak, ancak yenilik gücümüze kesinlikle zarar verecek."
 war_spirit_of_turkic:0 "Savaş Ruhunun Diyarı"
 war_spirit_of_turkic_desc:0 "Eski savaş geleneklerimize dönüyoruz. Her Türk savaşmayı bilmeli. Göçebe toplumdan yerleşik hayata geçmek kendimizi kaybetmemize neden olmamalı."
 nationalistic_education_laws:0 "Milliyetçi Eğitim Kanunları"
 nationalistic_education_laws_desc:0 "Türk eğitim programı Türklük milliyetçiliğine dayanıyor. Bu eğitim programıyla mutlak Türk milliyetçiliği ve birliği sağlanabilir."
 center_of_nomidaic_civizilations:0 "Göçebe Medeniyetlerinin Merkezi"
 center_of_nomidaic_civizilations_desc:0 "Türklerin ortaya çıktığı bölge, göçebe toplulukların oluştuğu ve içinden geçtiği yerdir. Buradan geçen göçebe toplulukları incelemek gerekiyor. Bu konuların incelenmesi için bir enstitü kuruldu."
 turkic_heritage_council:0 "Türk Mirası Konseyi"
 turkic_heritage_council_desc:0 "Vakfın amaçları, destek ve finansman faaliyetleri, projeler ve programlar aracılığıyla Türk kültürünü ve mirasını korumak, incelemek ve tanıtmaktır."
 turkic_expansionism:0 "Türk Yayılmacılığı"
 turkic_expansionism_desc:0 "Onurumuz için her yerde savaşmaya hazırız. İtibarımıza zarar verebilecek ülkeleri devirebilecek bir politikayı benimsiyoruz."
 tengri_sponsored_country:0 "Tengri Destekli Devlet"
 tengri_sponsored_country_desc:0 "Bu ülke Tengri sistemini benimsiyor ve halkının Tengri inancına bağlı olmasını istiyor."
 official_tengri_state:0 "Tengri İnancı"
 official_tengri_state_desc:0 "Tengri, Göktürklerin millî tanrısıydı. Göktürk kağanları güçlerini Tengri'den aldıkları bir yetkiye dayandırırdı. Bu hükümdarlar genellikle Tengri'nin yeryüzündeki temsilcisi olan oğulları olarak kabul edilirdi. Tengri'nin bu hükümdarlara bahşettiği güçlü ruh olan kutu elde ettiklerine inanıldığı için tengrikut, kutluğ ya da kutalmış gibi unvanlar taşırlardı."
 leader_of_the_second_islamic_golden_age:0 "İkinci İslam Altın Çağı'nın Lideri"
 leader_of_the_second_islamic_golden_age_desc:0 "İkinci İslam Altın Çağı yaşanıyor ve buna biz öncülük ediyoruz. Bizim sayemizde İslam birlik kazanmaya ve düşmanlarının oyunlarını bozmaya başladı."
 united_chiefs_turkic:0 "Devletin Beyleri"
 power_is_prosper:0 "Güç Refahtır"
 power_is_prosper_desc:0 "Güçlünün kazandığı, zayıfın kaybettiği bir ülkedeyiz. Bu yüzden diğer ülkelere üstün gelebilmemiz için herkes birbiriyle rekabet ederek güçlenmeli."
 coup_traditions:0 "Darbe Gelenekleri"
 coup_traditions_desc:0 "Askerî müdahale geleneği kazanmış bir ülkeyiz. Bu durum ülkemizde demokratik ya da monarşik bir hareketin olamayacağının göstergesi. Bu ülke ordunun elinde."
 copenhagen_criterias:0 "Kopenhag Kriterleri"
 copenhagen_criterias_desc:0 "Kopenhag kriterleri, bir ülkenin Avrupa Birliği'ne katılmaya uygun olup olmadığını belirleyen kurallardır. Kriterler bir devletin demokratik yönetimi ve insan haklarını koruyacak kurumlara sahip olmasını, işleyen bir piyasa ekonomisine sahip olmasını ve AB'nin yükümlülüklerini ve amaçlarını kabul etmesini gerektirir."
 yap_islet_devrets:0 "Yap-İşlet-Devret"
 yap_islet_devrets_desc:0 "Yap-işlet-devret (YİD), genellikle büyük ölçekli altyapı projelerinde kullanılan ve özel bir kuruluşun imtiyaz sözleşmesinde belirtilen bir tesisi finanse etmek, tasarlamak, inşa etmek, sahiplenmek ve işletmek için kamu sektöründen (nadiren de özel sektörden) imtiyaz aldığı bir proje teslim yöntemidir. Bu, proje sahibinin yatırım, işletme ve bakım masraflarını projeden geri kazanmasını sağlar. \n\n YİD genellikle kamu-özel işbirliklerinde kullanılan bir modeldir. Düzenlemenin uzun vadeli niteliği nedeniyle ücretler genellikle imtiyaz süresi boyunca artırılır. Artış oranı çoğu zaman iç ve dış değişkenlerin bir bileşimine bağlanır ve bu da proje sahibinin yatırımından tatmin edici bir iç verim oranı elde etmesini sağlar."
 tenmaks:0 "TENMAK"
 tenmaks_desc:0 "Türkiye Enerji, Nükleer ve Maden Araştırma Kurumu (TENMAK), Ankara merkezli, Enerji ve Tabii Kaynaklar Bakanlığı'na bağlı bir kamu kurumudur."
 summer_tourism_attractions1:0 "Yaz Turizmi Cazibe Merkezleri"
 summer_tourism_attractions1_desc:0 "Ege ve Akdeniz kıyılarında güneşlenme süresinin uzunluğu, hava sıcaklığı ve deniz suyunun yüksek sıcaklığı denize girme süresinin uzun olmasını sağlıyor. Çok sayıda koy ve körfez kıyı turizminin gelişmesine katkıda bulunuyor. Büyük oteller ve tatil köyleri kıyılarımızda inşa edildi."
 winter_tourism_attractions1:0 "Kış Turizmi Cazibe Merkezleri"
 winter_tourism_attractions1_desc:0 "Turizm faaliyetlerini yıl geneline yaymak için kış turizmine önem verilmeye başlandı. Uludağ, Palandöken, Kartepe, Kartalkaya, Sarıkamış, Erciyes ve Davraz Dağı Türkiye'nin önemli kayak merkezleridir."
 tourism_power:0 "Ekonomiye Ek Turizm Desteği"
 tourism_power_desc:0 "Turizm sayesinde ülkemiz önemli ölçüde gelir elde ediyor. Türkiye konumu nedeniyle turizme çok elverişli. En büyük hedefimiz turizm sektörünü geliştirip ülkemizin kalkınmasını sağlamak. Bacasız sanayi çalışsın."
 quantity_inspection:0 "Kalite Denetimi"
 quantity_inspection_desc:0 "Kalite denetimleri, kusurlu malları, müşteri şikâyetlerini, uygunsuz ürünleri ve geç ya da eksik sevkiyatları en aza indirerek markanızı ve şirketinizin itibarını korumaya yardımcı olmak için tasarlanmıştır."
 e_devlet:0 "e-Devlet"
 e_devlet_desc:0 "e-Devlet, kamu hizmetlerine erişim sağlayan ve yabancılar için bir bilgi portalı da bulunan bir Türk web sitesidir. Kullanıcılar e-Devlet'e T.C. kimlik numarası ve şifreleriyle ya da kimlik kartlarıyla erişir. Şifrelerin yanı sıra mobil ya da elektronik imzayla giriş de mümkündür. İnternet bankacılığı müşterileri e-Devlet'e bankaları üzerinden de erişebilir."
 reduced_ministers:0 "Azaltılmış Bakanlıklar"
 reduced_ministers_desc:0 "Bakanlıklar çok fazla para harcıyor. Bu neredeyse bir para israfı; bu yüzden yaptığımız gibi bakanlık sayısını azaltmamız gerekiyor."
 ssk_systematic:0 "SSK'nın Sistemli Çalışmaları"
 ssk_systematic_desc:0 "Türkiye'nin en büyük sosyal güvenlik kuruluşu. Ülke nüfusunun yaklaşık yüzde 50'sine sigorta ve sağlık hizmeti sunuyor."
 bag_kur_system_perfected:0 "Bağ-Kur Sistemi Yeniden Düzenlendi"
 bag_kur_system_perfected_desc:0 "Bağ-Kur, kapsadığı sigortalılarına malullük, yaşlılık, ölüm ve sağlık sigortası yardımı sağlar; ayrıca toptan ödemeler, cenaze masrafı karşılığı ödemeler ve sosyal yardım artışları sunar."
 original_social_state:0 "Sosyal Devlet"
 original_social_state_desc:0 "Sosyal devlet ya da refah devleti, devletin (ya da köklü bir sosyal kurumlar ağının) fırsat eşitliği, servetin adil dağılımı ve iyi bir yaşam için asgari olanaklardan yararlanamayan vatandaşlara karşı kamusal sorumluluk ilkelerine dayanarak vatandaşlarının ekonomik ve sosyal refahını koruduğu ve geliştirdiği bir yönetim biçimidir. Sosyolog T. H. Marshall modern refah devletini demokrasi, refah ve kapitalizmin kendine özgü bir bileşimi olarak tanımlamıştır."
 city_inside_law:0 "Şehir İçi Yasası"
 city_inside_law_desc:0 "Şehir kanunlarının amacı şehir düzenini sağlamaktır. Bu düzenin sağlanması disiplinli ve çalışkan bir toplum yetiştirmenin temel taşıdır."
 virtual_learning:0 "Uzaktan Eğitim"
 virtual_learning_desc:0 "Eğitim teknolojisinde sanal öğrenme ortamı (SÖO), genellikle eğitim kurumları bünyesinde derslerin dijital yönleri için kullanılan web tabanlı bir platformdur. Bir ders yapısı içinde kaynaklar, etkinlikler ve etkileşimler sunar ve değerlendirmenin farklı aşamalarına olanak tanır."
 redzyne_the_syd:0 "Mükemmelleştirilmiş SYD"
 redzyne_the_syd_desc:0 "SYD güvenliğimiz için gerekli bir yapı. Bu yapıyı bir güvenlik düzenine sokarak yeniden halkımızın hizmetine sunduk. Halkımızın güvenliği bizim dileğimiz."
 CHP_constitution_TUR_reel:0 "Sosyal Temelli Anayasa"
 health_insurance:0 "Sağlık Sigortası"
 health_insurance_desc:0 "Genel sağlık sigortası, öncelikle insanların sağlığının korunmasını ve sağlık riskleriyle karşılaştıklarında ortaya çıkan masrafların finansmanını sağlayan sigortayı ifade eder. Bu ülkede sağlık sigortası iyi seviyelerde."
 medicine_supervision:0 "İlaç Denetimi"
 medicine_supervision_desc:0 "Tıbbi denetim, tıbbi hizmet verme ruhsatı olmayan bir kişinin kendisine devredilen tıbbi hizmetleri sunmasının bir hekim tarafından düzenli olarak koordine edilmesi, yönlendirilmesi ve denetlenmesi anlamına gelir."
 strike_law:0 "Grev Kanunu"
 strike_law_desc:0 "İşçiler greve gidebilir, ama bunun şartları var. Bu yüzden bu şartları gözden geçirdik ve yeni bir grev kanunu sunduk. Umarım bu yeni kanun işçilerimizi ve sendikalarımızı mutlu eder."
 ILO_standarts:0 "ILO Standartları"
 ILO_standarts_desc:0 "Uluslararası çalışma hukuku, işyerinin düzenlenmesinde çalışanların, işverenlerin, sendikaların ve hükümetlerin hak ve yükümlülüklerini düzenleyen, kamu ve özel uluslararası hukuku kapsayan kurallar bütünüdür. Uluslararası Çalışma Örgütü ve Dünya Ticaret Örgütü, işgücü piyasalarını reforme etmeye dahil olan başlıca uluslararası kuruluşlar olmuştur. Uluslararası Para Fonu ve Dünya Bankası ise kredi ya da hibe vermek için yapısal uyum koşulları talep ederek çalışma politikasındaki değişiklikleri dolaylı olarak yönlendirmiştir. İnsanlar birden fazla ülkede çalıştığında ulusal mahkemelerce ve uluslarüstü kuruluşlarca belirlenen kanunlar ihtilafı sorunları ortaya çıkar; özellikle Avrupa Birliği'nin çalışma haklarına ilişkin giderek büyüyen bir kurallar bütünü vardır. Artık dünyada kabul gören bu kanunları Türkiye'de tamamen yürürlüğe koyduk."
 stockers_hunt:0 "Stokçu Avı"
 stockers_hunt_desc:0 "Stokçuluk peşindeki hainleri yakalıyoruz. Stokçuluk doğrudan ülkemizin ekonomisini hedef alıyor. Böyle saldırıları görmezden gelemeyiz."
 employer_and_employment_peace:0 "İşveren ile Çalışan Arasında Barış"
 employer_and_employment_peace_desc:0 "İşveren ile çalışan iyi geçinmeli. İyi geçinmezlerse işsizlik ve iflaslar artar. Birbirleriyle iyi geçinmeleri için duruma müdahale edip her iki tarafa da yüklü miktarda para vereceğiz. Yaşasın Barış ve Finansal İstikrar!"
 inflation_defence:0 "İşçileri Enflasyona Karşı Korumak"
 inflation_defence_desc:0 "İşçilerimizi gelişen enflasyondan kurtarmalıyız. Bu kapsamda işçilerimizin maaşlarını enflasyonun üzerinde artıracağız. Bu bizi mali açıdan zora sokabilir, ama buna katlanacağız."
 kemalist_education_system:0 "Kemalist Eğitim Sistemi"
 kemalist_education_system_desc:0 "Okullarımızın vizyonu Kemalist çocuklar yetiştirmek olmalı. Bu eğitim modeliyle Türkiye gelişebilir."
 kemalist_education_system_2:0 "Kemalist-Milliyetçi Eğitim Sistemi"
 kemalist_education_system_2_desc:0 "Okullarımızın vizyonu Kemalist ve milliyetçi çocuklar yetiştirmek olmalı. Bu eğitim modeliyle Türkiye gelişebilir."
 kemalist_institutions:0 "Kemalist Kurumlar"
 kemalist_institutions_desc:0 "Kemalist düşünce kurumlarının amacı ülkemizin Kemalizm anlayışı altında güçlenmesini sağlamaktır."
 a_language_of_science:0 "Bilim Dili"
 a_language_of_science_desc:0 "Atatürk'ün dediği gibi dilimiz bilim dili olmalı. Atatürk'ün bu vizyonu doğrultusunda dilimizi bir bilim diline dönüştürmeye başlıyoruz."
 general_culture_programs:0 "Genel Kültür Programları"
 general_culture_programs_desc:0 "Genel kültür programları millî değerlerimizi anlamamız için çok önemlidir."
 mobilization_of_the_students:0 "Öğrencilerin Seferberliği"
 mobilization_of_the_students_desc:0 "Öğrencilerimizi bilgi yolunda seferberliğe çağırma zamanı geldi. Bu seferberlikle ülkemiz ön saflara çıkacak!"
 school_scholarships:0 "Okul Bursları"
 school_scholarships_desc:0 "Burs, bir öğrencinin özel bir ilk veya ortaokulda, özel veya devlet bir yükseköğretim kurumunda, üniversitede ya da başka bir akademik kurumda eğitimine devam etmesi için verilen mali yardımdır. Burslar akademik başarı, çeşitlilik ve kapsayıcılık, sportif beceri ve maddi ihtiyaç gibi çeşitli kriterlere (ya da bunların bir bileşimine) göre verilir. Burs kriterleri genellikle bağışçının ya da bursun kurucusunun değerlerini ve hedeflerini yansıtır."
 foreign_language_supported_schools:0 "Yabancı Dil Destekli Okullar"
 vocational_education:0 "Mesleki Eğitim"
 vocational_education_desc:0 "Mesleki eğitim ve öğretim (MEÖ), öğrencilere belirli meslek dallarında başarıyla çalışmak için gereken bilgi ve becerileri kazandırmayı amaçlayan bir eğitim türüdür."
 TDK_progress:0 "TDK'da İlerleme..."
 TDK_progress_desc:0 "Türk Dil Kurumu (TDK), Mustafa Kemal Atatürk'ün girişimiyle 12 Temmuz 1932'de kurulan, merkezi Ankara'da bulunan Türk dilinin düzenleyici kurumudur. Kurum dilin resmî otoritesi olarak hareket eder, Türkçe ve diğer Türk dilleri üzerine dil araştırmalarına katkıda bulunur ve dilin resmî sözlüğünü yayımlamakla görevlidir."
 protection_of_secularism:0 "Laikliğin Korunması"
 protection_of_secularism_desc:0 "Laikliği ve laik yasaları korumak için devasa bir duvar örüyoruz. Bu duvar asla yıkılmaya çalışılmamalı; çünkü bu duvar yıkılırsa Atatürk'ün devrimleri ve bu ülkedeki yenilik duygusu Kemalist bürokrasiyle birlikte ölür."
 secular_front:0 "Laik Cephe"
 secular_front_desc:0 "Laik cephenin amacı ülkemizdeki radikal İslamcı faaliyetleri yok etmektir. Bu radikal İslamcı faaliyetler görüldükleri yerde ezilmezse laikliğimize büyük zarar verecekler. Bu yüzden bunu önlemek için ilerliyoruz."
 planted_secular:0 "Yerleştirilmiş Gizli Laikler"
 planted_secular_desc:0 "Laik olmayan bazı partilerin içine laik gruplar yerleştirdik. Bu grupların amacı bu partilerin laiklik karşıtı kadrolarına zarar vermek ve hukuki malzeme toplamak. Bu sayede laik olmayan partiler hakkında delil bulup onları kapatabiliriz."
 alevi_cooperation:0 "Alevi İşbirliği"
 alevi_cooperation_desc:0 "Aleviler laiklerin dilinden anlar, çünkü Aleviler uzun süredir radikal Sünnilerin saldırısına uğruyor. Düşmanımız aynı: "Radikal Sünni İslamcılar". Bu yüzden onlarla anlaşıp bu radikalizme karşı birlik olabiliriz."
 alevi_quarries:0 "Alevi İşbirliği ve Cemevleri"
 alevi_quarries_desc:0 "Aleviler laiklerin dilinden anlar, çünkü Aleviler uzun süredir radikal Sünnilerin saldırısına uğruyor. Düşmanımız aynı: "Radikal Sünni İslamcılar". Bu yüzden onlarla anlaşıp bu radikalizme karşı birlik olabiliriz."
 anti_radicalism_program:0 "Radikalizm Karşıtı Program"
 anti_radicalism_program_desc:0 "Gelişen radikalizme karşı programlar yapmaya başladık. Bu programlarla halk radikalizmden merkezî bir yapıya doğru kayıyor."
 protect_the_belief:0 "İnanç Özgürlüğünü Koru"
 protect_the_belief_desc:0 "İnancımızı da korumak zorundayız. İnancımız asla laikliğin altında ezilemez. İnancımızı koruyarak bu ülkede dinî sıkıntıların ve bunalımların yaşanmasını önleyeceğiz."
 populist_art:0 "Halkçılık Sanatı"
 populist_art_desc:0 "Popülizm aslında bir sanattır. Bu sanatı doğru icra etmek çok önemlidir. Halkımız mutsuzsa ülke bir verimsizlik cennetine döner; halkımız doğru popülist adımları görürse mutlu olur ve ülkemiz bir verimlilik cennetine döner."
 obsudman_instution:0 "Kamu Denetçiliği Kurumu"
 obsudman_instution_desc:0 "Ombudsman ya da kamu denetçisi, genellikle hükümet ya da meclis tarafından atanan ancak önemli ölçüde bağımsızlığa sahip bir görevlidir. Bazı ülkelerde bir genel müfettiş, vatandaş avukatı ya da başka bir görevli ulusal ombudsmana benzer görevlere sahip olabilir ve yasama organı tarafından atanabilir. Ulusal düzeyin altında bir ombudsman eyalet, yerel ya da belediye yönetimi tarafından atanabilir. Resmî olmayan ombudsmanlar ise bir kamu hizmeti sağlayıcısı, gazete, STK ya da meslek düzenleyici kuruluş gibi bir kurum tarafından atanabilir, hatta onun için çalışabilir."
 juidacary_quality_1:0 "Hukuk ve Eşitlik Güçleri"
 juidacary_quality_1_desc:0 "Hukuk ve eşitlik güçleri tarafsız ve sistemli çalışıyor. Bu tarafsızlık ve sistemli çalışma halkımızı ülkemize bağlıyor. Bu bağlılık ülkemizin güçlenmesinde bir etken. \n\n§YHukuk ve Eşitlik Kalitesinin Durumu:§!§R Kötü§!"
 juidacary_quality_2:0 "Hukuk ve Eşitlik Güçleri"
 juidacary_quality_2_desc:0 "Hukuk ve eşitlik güçleri tarafsız ve sistemli çalışıyor. Bu tarafsızlık ve sistemli çalışma halkımızı ülkemize bağlıyor. Bu bağlılık ülkemizin güçlenmesinde bir etken. \n\n§YHukuk ve Eşitlik Kalitesinin Durumu:§!§Y Normal§!"
 juidacary_quality_3:0 "Eşitlik Güçlerine Avrupa İnsan Hakları Mahkemesi Desteği"
 juidacary_quality_3_desc:0 "Hukuk ve eşitlik güçleri tarafsız ve sistemli çalışıyor ve Avrupa İnsan Hakları Mahkemesi tarafından destekleniyor. Bu tarafsızlık ve sistemli çalışma halkımızı ülkemize bağlıyor. Bu bağlılık ülkemizin güçlenmesinde bir etken. \n\n§YHukuk ve Eşitlik Kalitesinin Durumu:§!§G İyi§!"
 support_women_works:0 "Kadın İstihdamını Destekle"
 support_women_works_desc:0 "Kadınların çalışma hakkı vardır ve bu haklar hem maddi hem manevi olarak desteklenmelidir. Yaşasın Kadın Hakları!"
 cotton_industries_strenghen:0 "Pamuk Sanayileri"
 cotton_industries_strenghen_desc:0 "Pamuk dünyanın en önemli doğal lifidir. 2007'de 50'den fazla ülkede ekilen 35 milyon hektarlık alandan dünya genelinde 25 milyon ton ürün elde edildi. Türkiye'de bu rakam yaklaşık yarım milyon ton ve ekonomiyi ilerletmek için bunu artırmak üzere buradayız. Ayrıca Türkiye'de pamuk sanayisinin koşulları çok iyi."
 agency_on_pensylvania:0 "Pennsylvania'daki Ajanlar"
 agency_on_pensylvania_desc:0 "Pennsylvania'da ajan çalıştırmamız gerekiyor. Çünkü Pennsylvania'dan ülkemize yönelik ciddi bir güvenlik saldırısı var. Bunu önlemek bizim dileğimiz."
 south_flank_NATO:0 "NATO Güney Kanadı Kuvvetlerinin Liderliği"
 south_flank_NATO_desc:0 "NATO'nun Güney Kanadı'ndaki duruma öncülük ediyoruz. Görevimiz Güney'i korumak ve NATO olarak geri adım atmamak."
 balkan_NATO:0 "NATO Balkan Kuvvetlerinin Liderliği"
 balkan_NATO_desc:0 "NATO'nun Balkanlar'daki duruma öncülük ediyoruz. Görevimiz Balkanlar'ı korumak ve NATO olarak geri adım atmamak."
 bedrock_of_financial_stability:0 "Finansal İstikrarın Temeli"
 bedrock_of_financial_stability_desc:0 "Bu bölgeler finans için çok elverişli ve çökmeyecek bir yapıya sahip. Bu yüzden burası yatırımcılar için neredeyse bir cennet."
 power_in_un:0 "BM'de Güçlendirilmiş Konum"
 power_in_un_desc:0 "Uluslararası açılımlarla BM'deki itibarımızı artırdık. Bu saygınlık her yerde işimize yarayacak."
 kilicdaroglus_emergency_powers:0 "Kılıçdaroğlu'nun Olağanüstü Yetkileri"
 kilicdaroglus_emergency_powers_desc:0 "Kılıçdaroğlu'na olağanüstü yetkiler veriyoruz. Bu yetkilerle parti kolayca yeniden yapılandırılabilir."
 heleno_kemalism:0 "Helen Kemalizmi"
 heleno_kemalism_desc:0 "Helen Kemalizmi, Helen ve Kemalist düşüncenin birleşimidir. Bu ikisinin birleşmesi sonucunda yıkılmaz bir güç oluştu. Helenizmin direnci ve Kemalizmin inkılapçılığı bu gücün temel taşlarıdır."
 concept_of_internationalism:0 "Mavi Kemalist Enternasyonalizm Kavramı"
 turkish_nationalism:0 "Türk Milliyetçiliği"
 turkish_nationalism_desc:0 "Türk milliyetçiliği, Türk halkını ulusal, etnik ya da dilsel bir grup olarak öne çıkaran ve yücelten siyasi bir ideolojidir."
 national_defence_organizations:0 "Millî Savunma Örgütleri"
 national_defence_organizations_desc:0 "Millî Savunma Örgütlerinin amacı ülkemizdeki terör faaliyetlerini yok etmektir. Bu millî örgütler PKK ile mücadelemizi kolaylaştıracak ve bizi zafere yaklaştıracak."
 european_values:0 "Avrupa Değerleri"
 reliable_man:0 "Güvenilir Adam Kılıçdaroğlu"
 reliable_man_desc:0 "Kılıçdaroğlu çok güvenilir biri olduğunu kanıtladı. Bu güvenilirliğin bizi iyi yerlere getireceğinden eminiz."
 embrace_positivism:0 "Pozitivizm"
 embrace_positivism_desc:0 "Pozitivizm, tüm gerçek bilginin ya pozitif, yani yalnızca doğal olayların ve bunların özellik ve ilişkilerinin deneyiminden türetilmiş, ya da tanım gereği doğru, yani analitik ve totolojik olduğunu savunan felsefi bir kuramdır. Böylece akıl ve mantık aracılığıyla yorumlanan duyusal deneyimden elde edilen bilgi, tüm kesin bilginin tek kaynağını oluşturur."
 strenghen_AYM:0 "Güçlü AYM"
 strenghen_AYM_desc:0 "Türkiye Cumhuriyeti Anayasa Mahkemesi (AYM), Türkiye'de anayasa yargısının en yüksek organıdır. "Kanunların, kanun hükmünde kararnamelerin ve Türkiye Büyük Millet Meclisi İçtüzüğünün Anayasaya şekil ve esas bakımlarından uygunluğunu denetler" (Anayasa'nın 148/1. maddesi). Gerektiğinde Cumhurbaşkanı, Cumhurbaşkanı Yardımcısı, Bakanlar Kurulu üyeleri ya da yüksek mahkeme hâkimleri hakkındaki davalara bakmak üzere Yüce Divan sıfatıyla da görev yapar. Bu görevlerin yanı sıra Anayasa'da güvence altına alınan temel hak ve özgürlüklerden Avrupa İnsan Hakları Sözleşmesi kapsamındaki herhangi birinin kamu gücü tarafından ihlal edildiği iddiasıyla yapılan bireysel başvuruları inceler (Anayasa'nın 148/3. maddesi)."
 kemalist_nationalism:0 "Kemalist Milliyetçilik"
 kemalist_nationalism_desc:0 "Kemalist devrim, çok dinli ve çok etnikli Osmanlı İmparatorluğu'nun kalıntılarından bir ulus-devlet yaratmayı amaçladı. Kemalist milliyetçilik toplum sözleşmesi kuramlarından, özellikle Jean-Jacques Rousseau'nun savunduğu ilkelerden ve Toplum Sözleşmesi'nden beslenir. Kemalist toplum sözleşmesi anlayışı, Osmanlı "millet" sisteminin ve etkisiz Osmanlıcılık politikasının başarısızlığının bir ürünü olarak görülen Osmanlı İmparatorluğu'nun dağılmasından etkilendi. Osmanlı İmparatorluğu'nun çöküşünü yaşayan Kemalist milliyetçilik, toplum sözleşmesini "en yüksek ideali" olarak tanımladı. Laiklik, şovenizm ve Atatürk kişi kültünü bir araya getirir."
 milletin_adami_kilicdaroglu:0 "Milletin Adamı Kılıçdaroğlu"
 milletin_adami_kilicdaroglu_desc:0 "Kılıçdaroğlu artık milletin adamı. Halk ne isterse yaptığı için halkımız tarafından saygı görüyor ve tanınıyor."
 old_school_kemalism:0 "Eski Usul Kemalizm"
 old_school_kemalism_desc:0 "Eski ekol Kemalizm genel olarak tarafsız Kemalizmden oluşur, ancak içinde sol Kemalizmden unsurlar da vardır. Eski ekol Kemalizmin amacı ülkeyi daha fazla depolitize etmektir. Eski ekol Kemalizme göre ülke depolitize olursa insanlar huzura kavuşur ve terör sona erer."
 war_with_inflation:0 "Enflasyonla Savaş"
 war_with_inflation_desc:0 "Şu anda enflasyonla mücadele ediyoruz. Enflasyon düşene kadar bize uyku yok. Deflasyona yakın bir ekonomi politikası izleyerek bunun üstesinden geleceğiz."
 sumerbank_D:0 "Sümerbank Gelirleri"
 sumerbank_D_desc:0 "Sümerbank, Atatürk'ün Türkiye'deki sanayi devriminin temel taşıydı. On yıllar boyunca Türk tekstil sektöründe devlet öncülüğündeki sanayileşmeyi temsil eden Sümerbank'ın fabrika ve tesisleri 2002'den itibaren aşamalı olarak kapatılıp satıldı. Bu aşamalı satışı artık durdurduk. Sümerbank'ın yeniden toparlanması için kâr etmesi gerekiyor, bu yüzden bu fabrikalar desteklenmeli."
 investment_cult:0 "Yatırım Kültü"
 investment_cult_desc:0 "Küreselleşme komşu ve ticaret yapan devletlerin ekonomilerini bütünleştirdikçe bu devletler genellikle, örneğin bir serbest ticaret anlaşmasıyla tanımlandığı gibi, ortak bir vergi, gümrük ve ticaret rejiminin parçası olarak bu tür kurallardan vazgeçmek zorunda kalır. Bu tür anlaşmalarda yerli yatırımcıları küresel yatırımcılara tercih eden yatırım politikaları genellikle caydırılır ve ayrı bir yatırım politikası fikri hızla bir kurguya dönüşür; çünkü gerçek kararlar, ulusların yerli yatırımcılarınınki dahil yatırım için rekabet etme yönündeki gerçek ihtiyacını yansıtır."
 national_mobilization:0 "Millî Seferberlik"
 national_mobilization_desc:0 "PKK'nın mutlak güçlerine karşı tüm ülkeyi seferber ettik. Bu örgütün yok edilmesi Türk milletinin huzurunu artıracak; bu yüzden bu örgütün yok edilmesi bizim dileğimiz."
 work_propaganda:0 "Çalışma Propagandaları"
 work_propaganda_desc:0 "Çalışma azmini canlı tutmak gerekiyor; bu yüzden çalışmayı destekleyen propaganda yaparak ülkemizdeki işsizlik oranını düşüreceğiz."
 industrialization_concept:0 "Sanayileşme Kavramı"
 industrialization_concept_desc:0 "Sanayileşme, ekonomik bir şaheser inşa etmenin temelidir. Bu yüzden ülkemizi hızla sanayileştirecek ve güçlü Türkiye adımları atacağız."
 diplomatic_coverage:0 "Weltpolitik Tarzı Diplomasi"
 diplomatic_coverage_desc:0 "Bismarck'ın akıllıca politikalarından esinlenerek diğer ülkelerden güvenceler alacağız. Bu güvenceler sayesinde ülkemizi ortaya çıkan tehlikelerden kurtaracağız."
 economic_interventionary:0 "Düzensiz Ekonomik Müdahaleler"
 economic_interventionary_desc:0 "Ülkemizdeki mevcut ekonomik müdahaleler bir sisteme bağlı değil; bu yüzden müdahaleler düzensiz bir şekilde gerçekleşiyor. Düzensiz müdahaleler ülkemizi kötü etkileyebilir, bu yüzden bir sisteme oturtulmalı."
 economy_resolvation_project:0 "Ekonomik Çözüm Projesi"
 economy_resolvation_project_desc:0 "Türkiye'deki bitmek bilmeyen ekonomik sorunlara çözümler bulacak, bu çözümler sayesinde ülkemizi bu kötü ekonomiden kurtarıp ülke ekonomisini büyüteceğiz."
 economic_interventionary_organized:0 "Sistemli Ekonomik Müdahaleler"
 economic_interventionary_organized_desc:0 "Ülkemizde yapılan ekonomik müdahaleleri bir sistemde birleştirdik. Bu sistem çerçevesinde ülkemizi istikrarlı bir şekilde büyüteceğiz."
 anti_privatization:0 "Özelleştirme Karşıtlığı"
 anti_privatization_desc:0 "Özelleştirmeye karşı çıkarak finansın devlet kontrolünde kalmasını sağlayacağız; böylece gelecekte ekonomik zorluklar yaşamayacak ve liberal piyasanın sorunlarını hissetmeyeceğiz."
 agriculture_projection:0 "Tarım Projesi"
 agriculture_projection_desc:0 "Ülkemizde çok fazla kırsal alan olduğu için tarım yapmak çok kolay ve bu tarım sayesinde ülkemiz önemli bir gelir elde edebilir. Tarım bu ülke için yapılabilecek en iyi şeylerden biri."
 agriculture_supporteds:0 "Tarım Projesi"
 agriculture_supporteds_desc:0 "Ülkemizde çok fazla kırsal alan olduğu için tarım yapmak çok kolay ve bu tarım sayesinde ülkemiz önemli bir gelir elde edebilir. Tarım bu ülke için yapılabilecek en iyi şeylerden biri."
 volunteer_efficent_force:0 "Verimli Gönüllü Kuvvet"
 volunteer_efficent_force_desc:0 "Ordu genel olarak gönüllülerden oluşmalı. Ordu ağırlıklı olarak gönüllülerden oluşursa daha güçlü ve durdurulamaz olur."
 feeded_the_military_revenge:0 "Askerî İntikam"
 feeded_the_military_revenge_desc:0 "Son saldırılar ordumuzu gerdi ve bu gerginlik doğal olarak orduda bir intikam arzusuna yol açtı. Ordudaki bu intikam arzusu lehimize sonuçlanacak. Çünkü hiçbir ülke ya da yapısal sistem intikama karşı yapısını koruyarak duramaz."
 feeded_the_military_revenge_extreme:0 "Aşırı Askerî İntikam"
 feeded_the_military_revenge_extreme_desc:0 "Son saldırılar ordumuzu gerdi ve bu gerginlik doğal olarak orduda bir intikam arzusuna yol açtı. Ordudaki bu intikam arzusu lehimize sonuçlanacak. Çünkü hiçbir ülke ya da yapısal sistem intikama karşı yapısını koruyarak duramaz."
 crusade_against_pkk:0 "PKK'ya Karşı Haçlı Seferi"
 crusade_against_pkk_desc:0 "PKK terör örgütüne karşı tüm dinlerden destek isteyeceğiz. Bu komünist ve imansız örgüt yok edilmeli."
 kemalist_doctrine:0 "Kemalist Doktrin"
 kemalist_doctrine_desc:0 "Kemalist bir doktrin izleyerek Kemalist bir Türkiye yaratacağız. Kemalizm, inkılapçılık ve milliyetçilik gibi birbirine zıt iki şeyin birleşimi olarak ortaya çıktı."
 revolutionism_TR:0 "İnkılapçılık"
 revolutionism_TR_desc:0 "İnkılapçı fikirler her ülke için gereklidir. Bir ülkede inkılapçı bir hareket yoksa o ülke olduğu yerde kalır ve ilerleyemez. Atatürk ülkemizin en büyük inkılapçısı ve kurucu lideridir. Onun izinden gittiğimiz için inkılapçılığı benimsemekte bir sakınca yok."
 elective_state:0 "Seçimli Devlet"
 quality_politics:0 "Temiz Siyaset"
 quality_politics_desc:0 "Kirli işlerle siyaset yapmayı yasakladık. Bu yasaklarla siyasetimiz temizlenecek ve daha temiz bir Türkiye'ye sahip olacağız."
 multi_party_elective_state:0 "Gerçek Çok Partili Devlet"
 multi_party_elective_state_desc:0 "Ülkemiz gerçekten çok partili. Çok partili olduğumuz için ülkemizde siyasi düşünce rahatça tartışılabiliyor ve bir yol bulunabiliyor."
 ethics_committee:0 "Etik Kurulu"
 ethics_committee_desc:0 "Etik kurul, tıbbi deneylerin ve insan denekli araştırmaların ulusal ve uluslararası hukuka uygun olarak etik bir şekilde yürütülmesini sağlamakla sorumlu bir organdır."
 state_search_group:0 "Devlet Arama Grubu"
 state_search_group_desc:0 "Şehir içi arama servisinin amacı ülkeyi büyük sıkıntılardan uzak tutmaktır. Şehir içi arama servisi bölgedeki düşmanları sezer ve bir sorun olduğunda doğrudan merkezî hükümete haber verir. Bu yüzden bu servis hem yönetim hem de güvenlik açısından çok önemlidir."
 controlled_pro_western_clubs:0 "Denetim Altındaki Batı Yanlısı Kulüpler"
 controlled_pro_western_clubs_desc:0 "Batı tarzı kulüplerin ve eğlence mekânlarının denetlenmesi artık tamamen gerekli. Bu kontrol ve denetimle Batıcılığın ülkemizde bir virüs gibi yayılmasını önleyebiliriz."
 neutral_power_of_realm:0 "Ne Fazla Batılı Ne Fazla Doğulu"
 neutral_power_of_realm_desc:0 "Atatürk her zaman ülkemizin tarafsız bir konumda olmasını istedi. Türkiye Atatürk'ün bu isteğini 1950'lerin başına kadar yerine getirdi, ancak ardından NATO'ya katılarak tarafsızlığını bozdu. Artık yönetimde biz olduğumuza göre ülkemize tarafsızlığın geri dönmesi ihtiyacı doğrultusunda ülkemizi siyasi angajmanlardan çekmek istiyoruz."
 TTK_progress:0 "Türk Tarih Kurumu"
 TTK_progress_desc:0 "Türk Tarih Kurumu (TTK), Mustafa Kemal Atatürk'ün talimatıyla Türk tarihini ilk kaynaklardan araştırmak amacıyla 12 Nisan 1931'de kurulan bir araştırma kurumudur. 664 sayılı Kanun Hükmünde Kararname ile ayrı bir kamu tüzel kişiliğine sahip olan Türk Tarih Kurumu, 1983'te kurulan Atatürk Kültür, Dil ve Tarih Yüksek Kurumu'nun gözetim ve denetimine bağlandı."
 TUR_17_year_politiche:0 "17 Yaş Politikası"
 TUR_17_year_politiche_desc:0 "Asgari çalışma yaşını 17'ye düşürdük. Bu sayede ülkemiz genç nüfusu iş gücüne daha hızlı katabilecek."
 militaristic_education:0 "Militarist Eğitim"
 militaristic_education_desc:0 "Konumumuz ve geleneklerimiz nedeniyle ülkemizde askerî eğitimin zorunlu kalması ve artırılması gerekiyor. Savaş bir gerçektir ve Türkiye tehlikeli bir durumdadır. Vatan her türlü savunmaya hazır olmalıdır."
 village_institutions:0 "Köy Enstitüleri"
 village_institutions_desc:0 "Köy Enstitüleri, dönemin Millî Eğitim Bakanı Hasan Âli Yücel'in öncülük ettiği bir proje kapsamında kurulan kırsal okullardı. Proje öğretmen yetiştirmek amacıyla 17 Nisan 1940'ta başladı. DP iktidara geldikten sonra proje kapatıldı. Artık bu projeyi yeniden hayata geçirdik. Enstitüler savaş sonrası Türk devletindeki kırsal kalkınma projelerinin temel taşlarıydı. O dönemde köylerin çoğunda pek eğitim kurumu yoktu; enstitüler kırsal nüfusun eğitilmesine yardımcı oldu. Köy Enstitüleri her köyün öğretmen ihtiyacını karşılamak için kuruldu."
 improvement_of_general_culture:0 "Genel Kültürün Geliştirilmesi"
 improvement_of_general_culture_desc:0 "Genel kültürde ilerleme kaydetmek çok önemlidir. Genel kültürü olmayan bir kişi ne bilirse bilsin cahil kalır."
 general_culture_protection_institutions:0 "Genel Kültürü Koruma Kurumları"
 general_culture_protection_institutions_desc:0 "Son dönemde genel kültürü bozan popüler kültür unsurları gelişiyor. Genel kültürü koruyan bir kurum kurarak bu popüler kültürün genel kültürü olumsuz etkilemesine izin vermeyeceğiz."
 quality_museums:0 "Nitelikli Müzeler"
 quality_museums_desc:0 "Ülkemizin dört bir yanında yüksek kaliteli müzeler açarak halkımızı hem mutlu hem de kültürlü kılacağız."
 turkish_theathers:0 "Türk Tiyatroları"
 turkish_theathers_desc:0 "Tiyatro, gerçek ya da hayalî bir olayın deneyimini belirli bir yerde, çoğunlukla bir sahnede, canlı bir seyirci önünde sunmak için canlı oyuncuları, genellikle aktör ve aktrisleri kullanan ortak bir sahne sanatıdır. Oyuncular bu deneyimi seyirciye jest, konuşma, şarkı, müzik ve dansın bileşimleriyle aktarabilir. Boyalı dekor gibi sanat unsurları ve ışıklandırma gibi sahne teknikleri deneyimin fizikselliğini, varlığını ve doğrudanlığını güçlendirmek için kullanılır."
 turkish_films:0 "Türk Filmleri ve Dizileri"
 turkish_films_desc:0 "Yerli film ve yerli dizi yapımları sürdürülmeli. Bu sayede ülkemiz başka bir ülkenin etkisine girmez ve kimliğini korur."
 four_elements_under_protection:0 "Koruma Altındaki İlk Dört Madde"
 four_elements_under_protection_desc:0 "Anayasamızın ilk dört maddesi koruma altında. Bu korunan maddeler değiştirilmeye çalışılırsa askerî müdahale kaçınılmaz olur."
 prisoner_law:0 "Ceza Kanunu"
 prisoner_law_desc:0 "Suçlulara ilişkin kanun tasarısını tamamladık ve daha mantıklı bir ceza kanunu çıkardık. Suçlular artık istediklerini kolayca yapamayacak."
 improve_the_women_laws:0 "Kadın Haklarının Geliştirilmesi"
 improve_the_women_laws_desc:0 "Son dönemde ülkemizde kadın hakları güç kaybetti. Kadın haklarını yeniden güçlendirmek için kadın haklarını koruyan yeni kanunlar çıkardık. Kadın hakları bizim için çok önemli."
 protect_informals:0 "Kayıt Dışı Çalışanları Koru"
 protect_informals_desc:0 "Telif haklarının korunmasına ilişkin bir kanun çıkardık. Bilim insanları ve pek çok işletme bu telif hakkı korumasından memnun kalacak."
 constitution_protection_under_arms:0 "Silahların Koruduğu Anayasa"
 turkish_books_level_1:0 "Türk Kitaplarının Gelişimi"
 turkish_books_level_1_desc:0 "Türk kitaplarının artması okumanın artması demektir. Okumanın artması ülkemizi ileriye taşıyacak bir cevherdir. Okumayı artırmak bir kalkınma aracıdır."
 turkish_books_level_2:0 "Türk Kitaplarında Büyük Gelişim"
 turkish_books_level_2_desc:0 "Türk kitaplarının artması okumanın artması demektir. Okumanın artması ülkemizi ileriye taşıyacak bir cevherdir. Okumayı artırmak bir kalkınma aracıdır."
 datamining_crush:0 "Veri Madenciliğini Ezin"
 datamining_crush_desc:0 "Veri madenciliği bulunduğu yerde yok edilmeli. Veri madenciliği millî bir beladır. Veri madenciliği bilgi çalmanın bir aracıdır."
 socialists_shield:0 "Kapitalizme Karşı Kalkan"
 socialists_shield_desc:0 "Bu ülke kapitalizme karşı bir direk ve savunma bölgesidir. Kapitalizmi sevmeyen ve ondan nefret eden insanlar ortak bir amaç için bu ülkede toplandı: Bu ülkedeki her kapitalist şeyi yok etmek."
 turkish_autarky:0 "Türk Otarşisi"
 turkish_autarky_desc:0 "Otarşi, genellikle toplumlara, topluluklara, devletlere ve ekonomik sistemlerine uygulanan kendi kendine yetme özelliğidir."
 great_power_projection:0 "Büyük Güç Projeksiyonu"
 great_power_projection_desc:0 "Ülkemiz pek çok yerde üsler kurarak kendini siyasi ve askerî olarak geliştirdi. Bu durum dünya konjonktüründe işimize yarayacak."
 total_war_economy:0 "Topyekûn Savaş Ekonomisi"
 total_war_economy_desc:0 "Savaş olduğu için ekonomimizi buna göre düzenlemeli ve fabrikalarımızı buna göre çalıştırmalıyız. Bu durum nedeniyle fabrikaları olağan dışı bir baskı altına alarak fazla üretim yapmaya çalışıyoruz. Bu baskı belli ölçüde otoriterlik ve istikrarsızlık getirecek."
 growing_industries:0 "Büyüyen Sanayiler..."
 growing_industries_desc:0 "Sanayiler büyük bir büyüme yaşamaya başladı. Bu büyüme sayesinde üretimi daha hızlı artırabiliriz."
 faster_production:0 "Daha Hızlı Üretim"
 faster_production_desc:0 "Fabrikalarımızın daha fazla üretmesini sağlıyoruz. Daha fazla üretim, daha fazla mal, istikrar ve güç demektir."
 compliance_forces:0 "İtaat Kuvvetleri"
 compliance_forces_desc:0 "Bölgedeki ayaklanmaları önlemek için yeni otorite birimleri oluşturduk. Bu birimlerin amacı isyanları durdurmak ve halka mevcut Türk rejimini kabul ettirmek."
 rise_of_greek_nationalism:0 "Yunan Milliyetçiliği Destekleniyor"
 rise_of_greek_nationalism_desc:0 "Türkiye Yunan milliyetçiliğini destekliyor; çünkü Yunanlar milliyetçilik nedeniyle yönetimimizi aşırı sağcı bir partiye bırakırsa NATO'dan çıkarılacağız. Türkiye de bu fırsatı değerlendirip Yunanistan'ı işgal edecek."
 rise_of_bulgarian_nationalism:0 "Bulgar Milliyetçiliği Destekleniyor"
 rise_of_bulgarian_nationalism_desc:0 "Türkiye Bulgar milliyetçiliğini destekliyor; çünkü Bulgarlar milliyetçilik nedeniyle yönetimimizi aşırı sağcı bir partiye bırakırsa NATO'dan çıkarılacağız. Türkiye de bu fırsatı değerlendirip Bulgaristan'ı işgal edecek."
 covering_industries:0 "Sanayilerin Gizlenmesi"
 covering_industries_desc:0 "Sanayimizi olası hava saldırılarına ve bombardımanlara karşı korumalıyız. Bu yüzden sanayilerimizi gizlemeliyiz. Sanayilerimizin zarar görmemesi bizim için çok önemli."
 covering_people_in_shelters:0 "Halkın Sığınaklara Alınması"
 covering_people_in_shelters_desc:0 "Görünüşe göre bu savaşta radyoaktif ve kimyasal silahlar çokça kullanılacak; bu yüzden nüfusumuzu tüneller ya da yer altı sığınakları gibi yerlere taşımak faydalı olacak."
 all_time_working_factories:0 "7/24 Çalışan Fabrikalar"
 all_time_working_factories_desc:0 "Fabrikalar durmaksızın çalışıyor. Halkımız bundan yoruluyor, ama bunlar savaşın getirdiği durumlar. Biraz daha dişimizi sıkıp üretelim, zafer önümüzde!"
 call_arms_for_war:0 "Silah Başına Çağrı"
 call_arms_for_war_desc:0 "Tüm halkımızı savaşa çağırıyoruz. Bu savaş bu milletin savaşıdır, sizin hayatta kalma savaşınızdır."
 war_for_the_motherland:0 "Anavatan İçin Savaş"
 war_for_the_motherland_desc:0 "Vatan tehlikede. Savaş dünyayı cehenneme çevirdi. Vatanımızı bu cehennemden çıkarmak zorundayız. Vatanımızın işgaline asla izin vermeyeceğiz."
 uranium_trade:0 "Uranyum Ticareti"
 uranium_trade_desc:0 "Ülkemiz artık uranyum ticareti yapıyor. Uranyum bulunması çok zor ve yüksek enerji sağlayan bir madde olduğu için piyasalarda çok yüksek fiyatlara satılıyor. Bu sayede ülkemiz de çok para kazanıyor."
 banner_of_victory:0 "Zafer Sancağı"
 banner_of_victory_desc:0 "Üçüncü Dünya Savaşı'ndan galip çıkmış görünüyoruz. Bundan sonra ülkemiz hiçbir ülke tarafından yenilmeyecek; hiçbir savaşı kaybetmeyen bir ülke olacağız."
 russian_victory_sighted:0 "Rus Üstünlüğü"
 russian_victory_sighted_desc:0 "Rus üstünlüğü Avrupa'da tamamen sağlandı. Artık tüm Avrupa'nın temeli Rusya. Rusya'nın sağladığı bu üstünlük, Rusya'mızın bir süper güç ve yenilmez bir güç olduğunun göstergesi."
 militant_interventionism:0 "Müdahaleci Kolordu"
 militant_interventionism_desc:0 "Müdahale grupları oluşturduk. Bu müdahale gruplarının amacı başka bir ülkedeki durumu lehimize çevirmek."
 emergency_relocation_plan:0 "Acil Durum Tahliye Planı"
 emergency_relocation_plan_desc:0 "Savaş kapıda, bunun için harekete geçmemiz gerekiyor. Ülkemizin nüfusunu doğudaki güvenli bölgelere göndermeli ve batı sınırlarımızda savunma hatları kurmalıyız."
 socialist_defenders:0 "Sosyalist Savunucular"
 socialist_defenders_desc:0 "Kapitalizmin dünya çapındaki vebasına karşı ülkemizin dört bir yanında sosyalist militanlar konuşlandırdık. Kapitalizm tehdidi geldiği anda bu militanlar toprağa gömdükleri silahları alıp sonuna kadar savaşacak."
 counter_fetwa:0 "Karşı Fetva"
 counter_fetwa_desc:0 "Gülen hareketi bize karşı fetva çıkardığı için biz de onlara karşı fetva çıkaracağız. Bu din tüccarlarını sınırlarımız içinde ezeceğiz."
 controlled_television:0 "Denetim Altındaki Televizyon"
 controlled_television_desc:0 "Terör propagandasını ve yabancı saldırganlığı engellemek için RTÜK aracılığıyla televizyon kanallarını kontrolümüze alıyoruz. Televizyonu ele geçirdikçe pek çok düzenleme gündemimize gelecek."
 collegues_against_gulenists:0 "Gülen Karşıtı Üniversiteler"
 collegues_against_gulenists_desc:0 "Üniversiteleri yanımıza çekerek onları Gülen karşıtı hâle getirdik. Bu sayede Gülen Hareketi'ne karşı tarafımızı güçlendirdik."
 scientific_community_against_gulenists:0 "Gülen Karşıtı Bilim Camiası"
 nationalist_coverage:0 "Milliyetçi Kapsama"
 nationalist_coverage_desc:0 "Milliyetçilik sayesinde büyük ve güçlü bir ordu kurabiliriz. Milliyetçilik devletler için en önemli şeydir. Liberal fikirler tamamen saçmalıktır."
 wheat_fields:0 "Buğday Tarlaları"
 wheat_fields_desc:0 "Buğday, diğer tüm gıda ürünlerinden daha geniş bir alanda yetiştirilir (2014'te 220,4 milyon hektar ya da 545 milyon dönüm). Dünya buğday ticareti diğer tüm ürünlerin toplamından daha büyüktür. 2017'de dünya buğday üretimi 772 milyon ton (1,7 trilyon pound) oldu; 2019 üretiminin 766 milyon ton olacağı öngörüldü. Bu da onu mısırdan sonra en çok üretilen ikinci tahıl yapıyor."
 adana_agriculture_basis:0 "Adana Tarım Üsleri"
 mafia_underground_base:0 "Mafya Yer Altı Üssü"
 mafia_underground_base_desc:0 "Ulusal mafya örgütünün genel merkezi belirlendi. Bu merkez sayesinde genel otorite ve genel yönetim sağlanıyor. Yani bu merkez yeni gelişen mafya düzeninin temel taşı ve denetimin de temel taşı diyebiliriz."
 datamining_group:0 "Veri Madenciliği Grubu"
 datamining_group_desc:0 "Veri madenciliği, makine öğrenmesi, istatistik ve veritabanı sistemlerinin kesişimindeki yöntemleri kullanarak büyük veri kümelerindeki örüntüleri çıkarma ve keşfetme sürecidir."
 code_breaker_group:0 "Şifre Kırıcı Grup"
 code_breaker_group_desc:0 "Bir şifre kırma grubu kurduk. Bu grubun amacı şifreleri kırarak devlet ağlarına sızmak ve yönetimi ele almak için bu ağları ele geçirmek."
 controlling_the_banks:0 "Bankaların Kontrolü"
 controlling_the_banks_desc:0 "Bankalar mutlaka kontrol edilmeli. Tüm bankalar kamu bankası olmalı; aksi takdirde düzen bozulur ve sömürü olur. Bankaların halkımızı sömürmesine izin vermeyeceğiz. Onları yalnızca biz, mafya, sömürebiliriz."
 controlling_the_security_channels:0 "Güvenlik Kanallarının Kontrolü"
 controlling_the_security_channels_desc:0 "Güvenlik duvarlarına sızarak ülkemizin güvenliğini ve gücünü kontrolümüz altına aldık. Artık ordu ve güvenlik güçlerinde yaşanan her olaydan rahatça haberdar oluyoruz."
 relocation_of_mafias:0 "Mafyaların Yeniden Konuşlanması"
 relocation_of_mafias_desc:0 "Mafyaları yeniden konuşlandırıp ülkemizin dört bir yanına dağıtarak ülke genelinde güç kazanacağız."
 mafia_underground_base_2:0 "Güvenli Mafya Üssü"
 mafia_underground_base_2_desc:0 "Ulusal mafya örgütünün genel merkezi belirlendi. Bu merkez sayesinde genel otorite ve genel yönetim sağlanıyor. Yani bu merkez yeni gelişen mafya düzeninin temel taşı ve denetimin de temel taşı diyebiliriz."
 one_man_state:0 "Mafya Diktatörlüğü"
 one_man_state_desc:0 "Artık demokratik bir düzen yok. Güç düzeni mafyaların gücüne göre şekillendi. Artık en güçlü mafya iktidarda olacak, diğerleri onun yardımcıları olacak."
 one_man_state_strong:0 "Güçlendirilmiş Mafya Diktatörlüğü"
 one_man_state_strong_desc:0 "Artık demokratik bir düzen yok. Güç düzeni mafyaların gücüne göre şekillendi. Artık en güçlü mafya iktidarda olacak, diğerleri onun yardımcıları olacak."
 tores_in_the_law:0 "Kanunda Töreler"
 tores_in_the_law_desc:0 "Mafyaların talebi üzerine töreler artık kanunda yer alacak. Bu töreler yapısal istikrarı zedeleyebilir."
 controlled_tores:0 "Denetim Altındaki Töreler"
 controlled_tores_desc:0 "Mafyaların talebi üzerine töreler artık kanunda yer alacak. Bu töreler yapısal istikrarı zedeleyebilir. Bunun önüne geçmek için törelerde belirli bir denetim üstünlüğü kuracağız. Denetim önemlidir."
 the_new_hyrarchy:0 "Yeni Hiyerarşi"
 the_new_hyrarchy_desc:0 "Eski demokratik düzenin ortadan kalkmasıyla artık yeni bir hiyerarşi var. Bu hiyerarşi mafyaları en üstte, azınlıkları en altta tutuyor. Bu yeni hiyerarşi sistematik olarak Nazizme yakın."
 gun_studies_1:0 "Serbest Bireysel Silahlanma"
 gun_studies_1_desc:0 "İnsanların silah kullanmayı öğrenmesi ve herkesin elinde bir silah olması gerekiyor. Halkımız bunu kendi kendine ya da belirli silah kurslarına giderek öğrenebilir. Halkımız silahları ne kadar iyi öğrenirse ordumuz o kadar güçlü şekillenir."
 gun_studies_25:0 "Silah Çalışmaları"
 gun_studies_25_desc:0 "İnsanların silah kullanmayı öğrenmesi ve herkesin elinde bir silah olması gerekiyor. Halkımız bunu kendi kendine ya da belirli silah kurslarına giderek öğrenebilir. Halkımız silahları ne kadar iyi öğrenirse ordumuz o kadar güçlü şekillenir."
 casinos_1:0 "Yasallaştırılmış Kumarhaneler"
 casinos_1_desc:0 "Kumarhaneleri yasaklamak tamamen saçmalık. İnsanlar paralarıyla oynamak istiyorsa oynamalı. Sonuçta biz de para kazanmak için kumarhaneleri kullanıyoruz."
 casinos_2:0 "Kumarhane Komisyonları"
 casinos_2_desc:0 "Kumarhaneleri yasaklamak tamamen saçmalık. İnsanlar paralarıyla oynamak istiyorsa oynamalı. Sonuçta kumarhanelerden komisyon aldığımız için biz de kumarhaneler sayesinde para kazanıyoruz."
 state_of_criminals:0 "Suçlular Devleti"
 state_of_criminals_desc:0 "Ülkemiz suçlular için bir cennet. Dünyanın dört bir yanından suçlular ülkemize geliyor, biz de onlara bakıyoruz ve bu sayede para kazanıyoruz."
 education_of_loyalty:0 "Sadakat Eğitimi"
 education_of_loyalty_desc:0 "Halkımıza mutlaka sadakat öğretilmeli. Sadakat olmadan yeni mafyalar ortaya çıkmaz, mafyalara yeni insanlar gelmez ve bu da bizi tıkanıklığa iter."
 return_to_islam:0 "İslam'a Dönüş..."
 return_to_islam_desc:0 "Mafya düzenindeki ülkemizin dindarlardan destek alması gerekiyor. Dindarlardan destek almak için halkımızı İslam'a yaklaştıracak ve gördüğümüz ateist faaliyetleri ezeceğiz."
 return_to_islam_2:0 "İslam'a Dönüş..."
 return_to_islam_2_desC:0 "Mafya düzenindeki ülkemizin dindarlardan destek alması gerekiyor. Dindarlardan destek almak için halkımızı İslam'a yaklaştıracak ve gördüğümüz ateist faaliyetleri ezeceğiz."
 right_wing_supremacy:0 "Sağcı Kitapların Hâkimiyeti"
 right_wing_supremacy_desc:0 "Ülkemizdeki solcu kesimin yok edilmesiyle ülkemizde sağ hâkim oldu. Sağcı kitaplar ve sağcı eğitim sadece küçük göstergeler. Büyük resme bakarsak daha fazlasını görürüz."
 right_wing_supremacy_2:0 "Sağcı Eğitim"
 right_wing_supremacy_2_desc:0 "Ülkemizdeki solcu kesimin yok edilmesiyle ülkemizde sağ hâkim oldu. Sağcı kitaplar ve sağcı eğitim sadece küçük göstergeler. Büyük resme bakarsak daha fazlasını görürüz."
 controlled_media:0 "Kontrollü Sosyal Medya"
 controlled_media_desc:0 "Sosyal medyayı izlemek ve kontrol etmek mutlak bir zorunluluk. Sosyal medya kontrol edilmezse halkı ayaklanmaya sürükleyebilir. Bunun acilen önlenmesi gerekiyor."
 new_prisons:0 "Yeni Cezaevleri"
 new_prisons_desc:0 "Yeni cezaevlerinin inşa edilmesi bizim için önemli. Yeni cezaevlerinin yapılmasıyla daha fazla suçlu cezasını çekebilecek ve istikrar belli bir seviyede artacak."
 all_power_to_TRT:0 "Tüm Güç TRT'ye"
 all_power_to_TRT_desc:0 "Tüm medyanın TRT tarafından yürütülmesi bizim için en mantıklısı. TRT bizim yönettiğimiz bir ağ olduğu için hiçbir sorun yaşamayız. Bu yüzden TRT'yi genel bir medyaya dönüştürüyoruz."
 secret_DNA_interventions_1:0 "Gizli DNA Müdahaleleri"
 secret_DNA_interventions_1_desc:0 "İnsanların genlerine ve DNA'larına müdahale etmek bizim için iyi görünüyor. Bu müdahaleyle halkımızı daha çalışkan kılabilir ve duygu çağını sona erdirebiliriz. Elbette bu genetik müdahalenin gizlenmesi gerekiyor. Bu durumun ortaya çıkması ülkemizi bir iç savaşa bile sürükleyebilir."
 secret_DNA_interventions_2:0 "Gizli Finanse Edilen DNA Müdahaleleri"
 secret_DNA_interventions_2_desc:0 "İnsanların genlerine ve DNA'larına müdahale etmek bizim için iyi görünüyor. Bu müdahaleyle halkımızı daha çalışkan kılabilir ve duygu çağını sona erdirebiliriz. Elbette bu genetik müdahalenin gizlenmesi gerekiyor. Bu durumun ortaya çıkması ülkemizi bir iç savaşa bile sürükleyebilir."
 acceptable_violance:0 "Kabul Edilebilir Şiddet"
 acceptable_violance_desc:0 "Şiddet ülkemizde kabul edilebilir bir şey olmalı. Şiddet insana güç verir ve hızla toparlanma alışkanlığını beraberinde getirir."
 arrest_the_unemployment:0 "İşsizleri Tutuklayın"
 arrest_the_unemployment_desc:0 "İşsizliği önlemek için sözde demokratik yöntemleri bırakıp şiddet yöntemlerine geçiyoruz. İşsizliği önlemek için işsizleri tutukluyoruz. Bu durumda işsizlik yüksek seviyelerde kalmayacak."
 create_state_information_bureau:0 "Devlet Bilgi Bürosu"
 create_state_information_bureau_desc:0 "Her şehirden bilgi toplamak için her şehirde bilgi büroları kuracağız. Bu bürolar gizli olacak ve bölgesel casusluk gibi bir faaliyet yürütecek."
 harsh_loyaly_laws:0 "Sert Sadakat Yasaları"
 harsh_loyaly_laws_desc:0 "Sert yeni kanunlarla sadakatsiz insanları ortadan kaldıracağız. Bu sert kanunlar ağır olsa da genel istikrarı ve huzuru sağlamakta başarılı."
 weaken_emotion:0 "Zayıflatılmış Duygular"
 weaken_emotion_desc:0 "Duygu tamamen gereksiz bir şey. Duygu insanları güçsüz kılar. Mafya reformlarıyla duyguları zayıflatacak ve yeni, soğukkanlı bir nesil yetiştireceğiz. Bu soğukkanlı nesil sayesinde duygulara yer vermeyen ve yalnızca işine bakan bir nesil oluşacak."
 weaken_emotion_2:0 "Zayıflatılmış Duygular"
 weaken_emotion_2_desc:0 "Duygu tamamen gereksiz bir şey. Duygu insanları güçsüz kılar. Mafya reformlarıyla duyguları zayıflatacak ve yeni, soğukkanlı bir nesil yetiştireceğiz. Bu soğukkanlı nesil sayesinde duygulara yer vermeyen ve yalnızca işine bakan bir nesil oluşacak."
 gun_studies_3:0 "Silah Çalışmaları"
 gun_studies_3_desc:0 "İnsanların silah kullanmayı öğrenmesi ve herkesin elinde bir silah olması gerekiyor. Halkımız bunu kendi kendine ya da belirli silah kurslarına giderek öğrenebilir. Halkımız silahları ne kadar iyi öğrenirse ordumuz o kadar güçlü şekillenir."
 national_unity_lessons:0 "Millî Birlik Eğitimi"
 national_unity_lessons_desc:0 "Millî birlik eğitimi bizim için çok önemli. Millî birlik olmazsa istikrar olmaz, ekonomi olmaz, kalkınma olmaz; kısacası hiçbir şey olmaz. Bu yüzden millî birlik en önemli şeydir."
 military_traditions_problematic:0 "İstikrarsız Ordu"
 military_traditions_problematic_desc:0 "Mafyanın iktidarı ele geçirmesiyle ülkede beklenmedik bir şekilde itaatsizlik ve anarşi baş gösterdi. Bu düzensizlik orduyu son derece güçsüz bıraktı. Ordumuzun onuru yıprandı ve ülke güvenlik açısından bunalımda. Bu durumu hızla çözmek gerekiyor gibi görünüyor, aksi takdirde işgal edileceğiz."
 military_traditions_problematic_2:0 "İstikrarsız Ordu"
 military_traditions_problematic_2_desc:0 "Mafyanın iktidarı ele geçirmesiyle ülkede beklenmedik bir şekilde itaatsizlik ve anarşi baş gösterdi. Bu düzensizlik orduyu son derece güçsüz bıraktı. Ordumuzun onuru yıprandı ve ülke güvenlik açısından bunalımda. Bu durumu hızla çözmek gerekiyor gibi görünüyor, aksi takdirde işgal edileceğiz."
