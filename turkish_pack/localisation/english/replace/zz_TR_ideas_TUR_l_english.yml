 power_on_bosporus:0 "Montrö Sözleşmesi Teyit Edildi"
 power_on_bosporus_desc:0 "Boğazlar Rejimine İlişkin Montrö Sözleşmesi, Türkiye'ye İstanbul ve Çanakkale boğazları üzerinde kontrol yetkisi veren ve savaş gemilerinin geçişini düzenleyen 1936 tarihli bir anlaşmadır. Sözleşme barış zamanında ticari gemilere serbest geçiş hakkı tanır ve Karadeniz'e kıyısı olmayan devletlerin savaş gemilerinin geçişini kısıtlar. Sözleşmenin hükümleri yıllar içinde, özellikle Sovyetler Birliği'nin Akdeniz'e askerî erişimi konusunda tartışma konusu oldu. \n\n20 Temmuz 1936'da İsviçre'deki Montrö Sarayı'nda imzalanan Sözleşme, Türkiye'nin Boğazlar'ı yeniden silahlandırmasına izin verdi. 9 Kasım 1936'da yürürlüğe girdi ve 11 Aralık 1936'da Milletler Cemiyeti Antlaşmalar Serisi'ne kaydedildi. Hâlâ yürürlüktedir."
