 STAT_NAVY_FIRE_RANGE_DESC:0 "Geminin ana füzelerinin menzili."
 STAT_NAVY_EVASION:0 "Nokta Savunma Silahları:"
 STAT_NAVY_EVASION_DESC:0 "Gemilerin yanıltıcı fişekler, CIWS ve diğer Karşı Tedbirlerle düşman isabetlerinden kaçınma yeteneği. Küçük gemilerin isabetten kaçınma ihtimali doğal olarak daha yüksektir."
 STAT_NAVY_SUB_ATTACK:0 "£depth_charge_texticon  Denizaltı Karşıtı Harp:"
