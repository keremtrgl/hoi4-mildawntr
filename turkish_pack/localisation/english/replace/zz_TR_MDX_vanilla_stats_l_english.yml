 STAT_NAVY_SHORE_BOMBARDMENT:0 "Amfibi Hücum Yeteneği:"
 STAT_NAVY_SHORE_BOMBARDMENT_DESC:0 "Bir geminin, Bekleme görevindeyken gemiye binen birliklere amfibi hücumlarda ve yakın kıyılardaki muharebelerde yardım etme yeteneği."
 STAT_NAVY_MISSION_COVERAGE:0 "Düşman Tespit Verimliliği:"
