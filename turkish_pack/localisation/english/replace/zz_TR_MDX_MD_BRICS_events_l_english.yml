l_english:
 brics_join.1.t:0 "[FROM.GetNameDef] BRICS Üyeliği Arıyor"
 brics_join.1.d:0 "[FROM.GetNameDef] BRICS'e katılmak için resmen başvurdu. Bloğun lideri olarak onları kabul etme kararı bize ait."
 brics_join.1.a:0 "Bloğu güçlendiriyorlar. Kabul et."
 brics_join.1.b:0 "Üyelikleri bize hizmet etmiyor."
 brics_join.2.t:0 "Başvurumuz Kabul Edildi"
 brics_join.2.d:0 "BRICS üyelik başvurumuzu onayladı. Bloğun ulusları arasındaki yerimizi alıyoruz."
 brics_join.2.a:0 "BRICS'teki yerimizi al"
 brics_join.3.t:0 "BRICS Başvurumuz Reddedildi"
 brics_join.3.d:0 "BRICS liderliği başvurumuzu geri çevirdi. Kapı ebediyen kapanmadı ve zamanla davamızı yeniden savunabiliriz."
 brics_join.3.a:0 "Daha sonra yeniden başvuracağız"
 brics_join.3.b:0 "Çabadan vazgeç"
 brics_join.4.t:0 "[ROOT.GetNameDef] BRICS'e Katılıyor"
 brics_join.4.d:0 "[ROOT.GetNameDef] BRICS'e kabul edildi ve bloğun uluslararası düzendeki erişimini ve ağırlığını genişletti."
 brics_join.4.a:0 "Değişen bir denge"
 brics_join.5.t:0 "BRICS'e Yeniden Yaklaşma Zamanı"
 brics_join.5.d:0 "Son reddimizden bu yana yeterince zaman geçti. BRICS liderliğine yeni bir başvuru yapabiliriz."
 brics_join.5.a:0 "Başvurumuzu yeniden sun"
 brics_join.5.b:0 "Henüz değil"
 brics_join.6.t:0 "[FROM.GetNameDef] Bizi BRICS'i Kurmaya Davet Ediyor"
 brics_join.6.d:0 "[FROM.GetNameDef] BRICS'i hayata geçiriyor ve bloğu en baştan şekillendirmek için bizden kurucu üyeleri arasında yer almamızı istedi."
 brics_join.6.a:0 "BRICS'i kurmaya yardım edeceğiz"
 brics_join.6.b:0 "Mesafemizi koruyacağız"
 brics_declined_membership:0 "BRICS üyeliğini reddetti"
