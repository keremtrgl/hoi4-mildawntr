 upgrade_economy_civilian:0 "Ekonomik istihbarat"
 upgrade_economy_civilian_desc:0 "§WEkonomik istihbarat modern istihbaratın kilit noktalarından biridir. Yabancı düşmanlarımızın ekonomilerinin inceliklerini daha iyi anlamak, hırslarını dizginlememize yardımcı olabilir.§!"
 upgrade_army_department:0 "Askeri Daire"
 upgrade_army_department_desc:0 "§WDüşmanlarımızın ve olası düşmanlarımızın silahlı kuvvetlerine sızmak, onların gücünü ölçmek için bize daha fazla fırsat sağlayacaktır.§!"
 upgrade_computer_servers:0 "Teşkilat Bilgisayarları"
 upgrade_computer_servers_desc:0 "§WTeşkilat bilgisayarlarımızı yükseltmek, siber güvenlik dairemizin gücünü artırmaya yardımcı olacaktır.§!"
 upgrade_computer_servers_TT:0 "§YSiber Güvenlik Dairesi Kur§! Teşkilat Yükseltmesini tamamlamış olmak"
 upgrade_naval_department:0 "Deniz Dairesi"
 upgrade_naval_department_desc:0 "§WDeniz muharebesi zaferi güvence altına almanın kilit parçasıdır ve deniz teknolojilerinin ilerlemesiyle Deniz İstihbarat Dairesi kurmak hayati hale gelmiştir.§!"
 upgrade_airforce_department:0 "Hava Kuvvetleri Dairesi"
 upgrade_airforce_department_desc:0 "§WHava İstihbarat Dairesi, teşkilatımızın yararlı bir şubesi olacaktır; düşman hava kuvvetlerine sızmak ve düşman uçak hareketleri hakkında istihbarat toplamakla sorumludur.§!"
 upgrade_passive_defense:0 "Karşı İstihbarat"
 upgrade_passive_defense_desc:0 "§WTopraklarımızda faaliyet gösteren yabancı ajanlar ciddi bir ulusal güvenlik riski oluşturur. Bu ajanların ülkemize yönelttiği tehdidi en aza indirmek için karşı istihbarat yeteneklerimize yatırım yapmalıyız.§!"
 upgrade_anti_partisan:0 "İsyan Bastırma"
 upgrade_anti_partisan_desc:0 "§W21. yüzyıl, devlet dışı gruplara karşı asimetrik savaşın dramatik biçimde yaygınlaştığına tanık oldu. Ajanlarımızın eğitim programlarında bu «yeni savaşları» ihmal etmek akıllıca olmaz.§!"
 upgrade_counter_terror_operations:0 "Terörle Mücadele"
 upgrade_counter_terror_operations_desc:0 "§WTerörün dünya sahnesinde bir tehdit olarak yükselişi ulusları uyum sağlamaya zorladı. Vatandaşlarımızı ve yaşam tarzımızı korumak istiyorsak terörle mücadele operasyonlarına yatırım yapmalıyız.§!"
 upgrade_blueprint_stealing:0 "Sınai Casusluk"
 upgrade_blueprint_stealing_desc:0 "§WDüşmanımızın deneysel silahlar ve araçlar için gizli projeleri olduğunu biliyoruz; bilmediğimiz şey, bu projelerin tam olarak ne olduğu ve ne inşa ettikleri. Düşmanlarımızın deneysel silah dairelerini hackleyerek yalnızca bize karşı neyi kullanmayı planladıklarını tam olarak öğrenme fırsatını yakalamakla kalmaz, bu bilgiyi kendi silah dairemizi geliştirmek için kullanma gibi benzersiz bir fırsat da elde ederiz.§!"
 upgrade_portable_radios:0 "Güvenli Haberleşme"
 upgrade_portable_radios_desc:0 "§WAjanlarımız sahadayken düşman tarafından ele geçirilme korkusu olmadan haberleşebilmeleri kesinlikle şarttır. Güvenli haberleşme kanalları, ajanlarımızın kimliklerini ve hayatlarını korumanın anahtarıdır.§!"
 upgrade_invisible_ink:0 "Gizli Dinleme Cihazları"
 upgrade_invisible_ink_desc:0 "§WTelefon dinlemeleri modern ajanın önemli bir aracıdır; özel nitelikteki konuşmaları dinlemesine imkân verir. Kilit noktalara yerleştirilebilecek böcekler geliştirmek, istihbarat toplama yeteneklerimizi önemli ölçüde artıracaktır.§!"
 upgrade_plastic_explosives:0 "El Yapımı Patlayıcılar"
 upgrade_plastic_explosives_desc:0 "§WEl yapımı patlayıcılar dünya genelinde devlet dışı silahlı gruplar için vazgeçilmez bir silah haline geldi. Basit yapılarına rağmen muazzam bir yıkım potansiyeline sahiptirler. Bu nedenle, düzensiz isyancı gruplarla zırhlı araçlara sahip profesyonel ordular arasındaki dengeyi sağlamaya yardımcı olurlar. Yurt dışında desteklediğimiz isyancılar bu patlayıcıları kuşkusuz kendileri de üretebilecek olsa da, cihazlarının yıkıcılığını ve güvenilirliğini azamiye çıkarmak için onlara daha gelişmiş teknoloji sağlayabiliriz. Böylece inkâr edilebilirliğimizi korurken yabancı düşmanlarımıza darbe indirebiliriz.§!"
 upgrade_suicide_pills:0 "Zehir Hapları"
 upgrade_suicide_pills_desc:0 "§WIstenmese de bir avuç ajanın düşman tarafından yakalanması kaçınılmazdır. Ajanlarımıza sorgu odasında onları bekleyen dehşetten kurtulmanın bir yolunu sunmalıyız; bir dişin yerine yerleştirilen siyanür hapı, işler o noktaya gelirse onlara bu kaçışı sağlayacaktır.§!"
 upgrade_training_centers:0 "Yurt Dışı Devşirme Merkezleri"
 upgrade_training_centers_desc:0 "§WAjanlarımız her ortama uyum sağlayabilse de yabancı ülkelerin kültürel normları ve dilleri o kültürde doğup büyüyenlere daha doğal gelir. Dünya çapında bir casus ağı kurmak istiyorsak devşirme ve eğitim merkezlerimizi tüm dünyaya yaymalı ve her kültürden, her geçmişten ajanlar devşirmeliyiz.§!"
 upgrade_commando_training:0 "Kara Operasyonlar"
 upgrade_commando_training_desc:0 "§WIstihbarat teşkilatımızın yerine getirmek zorunda kalacağı bazı görevler azami gizlilik gerektirir. Bu özel faaliyetler, ülkemizin özel kuvvetlerinden devşirilmiş, tehlikeli koşullarda paramiliter faaliyet yürütebilecek ajanların yetiştirilmesini şart koşar. Bu ajanların vatanları için ölmeye razı olması yetmez. Görevlerinde başarısız olurlarsa vatanları tarafından terk edilmeye ve alenen reddedilmeye de razı olmaları gerekir.§!"
 upgrade_interrogation_techniques:0 "Sorgu Teknikleri"
 upgrade_interrogation_techniques_desc:0 "§WÇoğu zaman bir düşman ajanının bedenini değil zihnini kırmak daha etkili olabilir. Fiziksel güç kullanmak güvenilmezdir ve genellikle yanlış bilgiyle sonuçlanır; gerçekten yetenekli bir sorgucu, şiddet olmadan düşmanın iradesini kırabilir. Ama iş o noktaya gelirse, onları konuşturmanın yollarını biliriz...§!"
 upgrade_diplo_training:0 "Diplomatik Eğitim"
 upgrade_diplo_training_desc:0 "§WAjanlarımızı birkaç yabancı yatırımcının ve diplomatın gönlünü hoş tutacak şekilde eğitmek, onları davamızın hayırlı olduğuna ikna edebilir ve çıkarlarını devletin düşmanlarından uzaklaştırabilir.§!"
 upgrade_psycho_warfare:0 "Psikolojik Harp"
 upgrade_psycho_warfare_desc:0 "§WPropaganda kendi devletimiz içindeki ideolojik çıkarlarımızı güvence altına almada etkili bir araç oldu, ancak hiçbir araç düşman rejimlerden ve onların ülkeye getirebileceklerinden duyulan korkuyu yaymak kadar etkili olmadı. Ajanlarımızı yabancı ülkelerdeki ideoloji karşıtı hareketlerle müttefik kılarak ideolojimizi dünya çapında yaymakta çok daha etkili olacağız...§!"
 upgrade_form_department:0 "Kriptoloji Dairesi Kur"
 upgrade_form_department_desc:0 "§WKriptoloji, ağlarımızın siber harpten korunmasıdır. Bir kriptoloji dairesi kurmak, istihbarat teşkilatımızı bu modern istihbarat toplama biçimine daha iyi yönlendirmemize yardımcı olacaktır.§!"
 upgrade_decryption_boost:0 "Şifre Çözme Operasyonları"
 upgrade_decryption_boost_desc:0 "§WŞifre çözme, bir yabancı ulusun güvenlik önlemlerini kırarak ona saldırmak için teknoloji kullanmaktır. Modern bir ulusun karada, denizde, havada ve siber uzayda taarruz kabiliyetine sahip olması, aksi halde geride kalma riskini göze alması giderek zorunlu hale geliyor.§!"
 upgrade_decryption_boost_2:0 "Makine Destekli Şifre Çözme"
 upgrade_decryption_boost_2_desc:0 "§WMakineler verileri şifrelemede zaten yararlı olduğunu kanıtladı; makine destekli şifrelenmiş sinyaller çözülmesi en zor olanlardır. Kriptanaliz makineleri, henüz kodunu bilmediğimiz mesajları kırmada hayati önemdedir ve çözme ekibimiz için değerli bir varlık olacaktır.§!"
 upgrade_crypto_strength:0 "Güçlendirilmiş Şifreleme"
 upgrade_crypto_strength_desc:0 "§WHassas bilgiler farklı daireler veya kişiler arasında aktarılırken dış hackerlara karşı savunmasızdır. Tüm iç haberleşmenin meraklı gözlerden korunması için yeterince şifrelendiğinden emin olmalıyız.§!"
 upgrade_crypto_strength_2:0 "Makine Öğrenmesi"
 upgrade_crypto_strength_2_desc:0 "§WYapay zekâdaki ilerlemeler, makine öğrenmesinin kriptoloji sistemlerine entegre edilmesini mümkün kıldı. Bu, sistemlerimizin geçmiş saldırılardan öğrenmesine, gelecekteki tekrarları önlemesine ve saldırılar gerçekleştiğinde dinamik biçimde karşılık vermesine imkân tanıyacaktır.§!"
