 CANNOT_RECRUITE_OPERATIVE_NO_SLOT_DESC:0 "İlk yuvayı istihbarat teşkilatını kurarak elde edebilirsiniz. Diğer yuvalar 5. yükseltmeden sonra ya da §HAldatıcı Centilmen§! danışmanı atandıktan sonra açılır.\nCasus başı olarak ittifakınızda ne kadar çok ülke varsa o kadar çok ajan yuvasının kilidi açılır. Kuklalar veya fabrika sayısı çok düşük olan ülkeler daha fazla ajan yuvasına katkıda bulunmaz."
