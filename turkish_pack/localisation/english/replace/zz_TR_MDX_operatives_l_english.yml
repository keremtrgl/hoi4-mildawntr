 upgrade_internal_security:0 "İç Güvenlik"
 upgrade_internal_security_desc:0 "§LKendi hükümetimizde ve ordumuzda yabancı istihbarat servislerince kolayca istismar edilebilecek noktaları ele almak, düşman ajanlarının düşmanca eylemlerine karşı en iyi savunmadır. Personeli her güvenlik alanında eğiterek ve güvenilir personeli mali sıkıntı, siyasi görüşler veya şantaja açıklık gibi risk alanlarında izleyerek düşmanlarımızın çabalarına karşı koyabiliriz.§!"
 upgrade_civil_intel:0 "Sivil İstihbarat"
 upgrade_civil_intel_desc:0 "§LTüm istihbarat toplama çabaları doğası gereği düşman ordusunu hedeflemez. Sanayi gelişimi, stratejik doğal kaynakların üretimi ve çıkarılması, altyapıdaki değişiklikler, eğitim ve hatta halk duyarlılığındaki köklü kaymalar, bir ulusun savaştaki karakterinin kritik etkenleridir.§!"
 upgrade_military_intel:0 "Askeri İstihbarat"
 upgrade_military_intel_desc:0 "§LIkmal fazlası veya açığı, askeri yedeklerinin durumu, etkin veya potansiyel personelinin sayısı ve niteliği, liderliğinin karakteri, destek kabiliyeti ve düşman kuvvetlerinin konuşlanışı. Rakibimize karşı çatışmada başarılı olmak istiyorsak bunları bilmeliyiz.§!"
 upgrade_maritime_intel:0 "Deniz İstihbaratı"
 upgrade_maritime_intel_desc:0 "§LDüşman deniz kuvvetlerinin sayısını ve konuşlanışını bilmek, her denizaşırı çatışmanın başarısı için kritiktir. Deniz personeli arasındaki konuşmaları izlemek, yakıt veya mühimmat tüketimine ilişkin kayıtları toplamak, hatta limandaki gemi sayısını saymak gibi basit bir ölçüm bile herhangi bir deniz çatışmasının başarısını veya başarısızlığını belirleyebilir.§!"
 upgrade_air_recon:0 "Hava Keşfi"
 upgrade_air_recon_desc:0 "§LHarbin görece yeni bir yönü olmasına rağmen hava gücü projeksiyonu, her modern askeri çatışmanın başarısı için hızla hayati hale geldi. Düşman hava gücünün kuvvetini, menzilini, kabiliyetini, sayısını, hareketini ve konumunu bilmek herhangi bir hava savaşının kapsamını hızla değiştirebilir. Böylece çekişmeli bir gökyüzünün altındaki herhangi bir çatışmanın dengesini kritik biçimde kaydırır.§!"
 upgrade_humint:0 "Bağlantılar ve Muhbirler"
 upgrade_humint_desc:0 "§LHUMINT, yani İnsan İstihbaratı; kişilerarası temasla toplanan ve insan kaynaklarınca sağlanan istihbarat. Akredite diplomatların diplomatik raporları, askerlerin veya mültecilerin birinci elden anlatımları, kendi ajanlarımızdan gelen raporlar ve hatta savaş esirlerinin sorgulanması HUMINT'e katkıda bulunur.§!"
 upgrade_sigint:0 "Sinyaller ve Haberleşme"
 upgrade_sigint_desc:0 "§LCOMINT, yani Haberleşme İstihbaratı; sinyallerin dinlenmesi yoluyla, doğrudan haberleşme ya da sinyal analizi (SIGINT olarak bilinir) üzerinden istihbarat toplama.§!"
 upgrade_masint:0 "Teknik ve Araştırma"
 upgrade_masint_desc:0 "§LMASINT, yani Ölçüm ve İz İstihbaratı; teknik bir istihbarat toplama biçimini yönetir ve sabit veya dinamik hedef kaynaklarının ayırt edici özelliklerini tespit etmeye, izlemeye, tanımlamaya veya betimlemeye yarar. Bunlar radar, akustik algılayıcı ya da yabancı ulusların silahlı kuvvetlerinden elde edilen silah ve teçhizatın basit pratik analizi gibi algılama araçlarının analizinden türetilen bilimsel veya teknik verileri içerir.§!"
 upgrade_opsec:0 "Operasyon Güvenliği"
 upgrade_opsec_desc:0 "§LYa da OPSEC; tek tek veri parçalarının bir araya getirilerek üst düzey liderlerce hayati sayılan kritik bilgileri ortaya çıkarmasını önleme süreci. Bu süreç, karmaşık güvenlik protokollerinden kilit personelin dinlenme girişimlerine karşı tetikte olmasını sağlamak gibi basit önlemlere uzanan karşı tedbirlerin geliştirilmesini içerir.§!"
