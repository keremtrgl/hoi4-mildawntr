l_english:
 MD_wacky.1.t:0 "Noel Arifesinde Kayıtsız Bir Temas"
 MD_wacky.1.d:0 "Hava savunması, gece yarısından kısa süre sonra sınırı geçen alçak ve yavaş bir temas tespit etti ve uyarısız müdahale etti. Kurtarma ekibi bir kızak, dokuz ren geyiği ve paketlenmiş hediyelerle dolu çok büyük bir çuval bildiriyor."
 MD_wacky.1.a:0 "Enkazı gizli olarak sınıflandır."
 MD_wacky.1.b:0 "Çocuklardan özür dile."
 MD_wacky.2.t:0 "Başkent Üzerinde Kimliği Belirsiz Cisim"
 MD_wacky.2.d:0 "Binlerce kişi, hükümet bölgesinin üzerinde on bir dakika boyunca sabit duran sessiz üçgen bir ışığı fotoğrafladı. Hava kuvvetleri radarlarının hiçbir şey izlemediğinde ısrar ediyor."
 MD_wacky.2.a:0 "Önleyicileri havalandır."
 MD_wacky.2.b:0 "Bunun bir hava balonu olduğunu duyur."
 MD_wacky.3.t:0 "Uzay Enkazı Bakanlık Otoparkına Düştü"
 MD_wacky.3.d:0 "Çalışmayan bir haberleşme uydusundan bir titanyum yakıt tankı gece boyunca düşerek üç resmî aracı ve bir çalıyı ezdi. Kimse yaralanmadı ve hiçbir uzay ajansı uydunun kime ait olduğunu kabul etmiyor."
 MD_wacky.3.a:0 "Fırlatan devlete fatura kes."
 MD_wacky.3.b:0 "Müzeye koy."
 MD_wacky.4.t:0 "Otomatlar Bakanlık Ağını Çökertti"
 MD_wacky.4.d:0 "İçişleri bakanlığı bir hafta boyunca yabancı bir siber saldırıyı aradı; teknisyenler trafiği sonunda binanın kendi akıllı otomatlarına kadar izledi: Otomatlar sessizce sonsuz döngüyle gazlı içecek sipariş ediyordu."
 MD_wacky.4.a:0 "Binadaki tüm makinelerin fişini çek."
 MD_wacky.4.b:0 "Basının bunu yabancı bir güç sanmasına izin ver."
 MD_wacky_events:0 "Tuhaf Olay"
 MD_wacky_classified_intercept:0 "Gizli Önleme"
 MD_wacky_classified_intercept_desc:0 "Müdahale hiçbir yayımlanmış kayıtta yer almıyor ve görevli mürettebata hedefin şeklini asla tartışmamaları talimatı verildi. Ancak silah kamerası görüntüleri mükemmel bir eğitim malzemesi."
 MD_wacky_ufo_conspiracy:0 "Hava Balonu Açıklaması"
 MD_wacky_ufo_conspiracy_desc:0 "Kimse resmî açıklamaya inanmıyor. Rakip iki yurttaş komitesi şimdi birbirine karşıt fotoğraf analizleri yayımlıyor ve bir yayıncı kuruluş hükümetin sessizliği hakkında belgesel sipariş etti."
 MD_wacky_debris_exhibit:0 "Yeniden Giriş Enkazı Sergisi"
 MD_wacky_debris_exhibit_desc:0 "Yakıt tankı ulusal bir müzede, üzerine düştüğü üç aracın fotoğrafının yanında duruyor. Ziyaretçi sayısı arttı ve olağandışı sayıda ziyaretçi öğrenci artık mühendislik okumak istediğini söylüyor."
 MD_wacky_phantom_cyber_threat:0 "Hayalet Siber Tehdit"
 MD_wacky_phantom_cyber_threat_desc:0 "Bakanlık yabancı sızmaya dair hikâyeyi hiç düzeltmedi ve acil ağ güvenliği bütçesi tek bir soru sorulmadan onaylandı. Otomatlar binadan kaldırıldı."
