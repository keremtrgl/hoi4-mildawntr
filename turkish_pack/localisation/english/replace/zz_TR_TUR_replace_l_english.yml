 generic.Western_Autocracy_desc:0 "Batı yanlısı otokrasi, Batı Yarımküre'nin jeopolitik çıkarlarıyla uyumlu, demokratik olmayan ve otoriter ideolojilerden oluşan geniş bir yelpazeyi ifade eder."
 generic.neutral_Social_desc:0 "Sosyal demokrasi, ekonomik ve toplumsal adaleti savunan sol ideolojileri ifade eder. Kapitalizmin çerçevesi içinde çalışan sosyal demokratlar eşitsizliği azaltmak için güçlü bir servet yeniden dağıtımı, refah devletinin geliştirilmesi ve özel sektör üzerinde daha fazla düzenleme uygulanmasını savunur."
 TUR.Western_Autocracy:0 "£tur_pro_western_autocrat DYP"
 TUR.conservatism_desc:0 "Sosyal demokrasi, liberalizmin çoğu kolundan daha güçlü bir şekilde ekonomik ve toplumsal adaleti savunan geniş bir sol ideolojiler yelpazesini ifade eder. Sosyal demokratlar eşitsizliği ve baskıyı azaltmak ve demokrasiyi geliştirmek için kapitalizmi insanileştirmeye çalışır."
 TUR.conservatism:0 "£tur_western_social_democrat DSP"
 TUR.socialism:0 "£tur_western_liberal CHP"
 TUR.socialism_desc:0 "Cumhuriyet Halk Partisi, Türkiye'de sosyal demokrat ve Kemalist bir siyasi partidir. Ülkenin en eski siyasi partisidir. CHP kendisini Türkiye Cumhuriyeti'nin kuruluş ilke ve değerlerine bağlı "modern bir sosyal demokrat parti" olarak tanımlar ve "modern Türkiye'nin kurucu partisi" olarak anılır. Logosu, Kemalizmin temel ilkelerini temsil eden Altı Ok'tan oluşur: cumhuriyetçilik, milliyetçilik, devletçilik, halkçılık, laiklik ve inkılapçılık. Ayrıca CHP, Avrupa Sosyalistler Partisi'nin (PES) ortak üyesi, Sosyalist Enternasyonal'in ve İlerici İttifak'ın üyesidir."
 TUR.Conservative:0 "£tur_fazilet FP"
 TUR.Autocracy:0 "£tur_emep EMEP"
 TUR.Vilayat_e_Faqih:0 "£tur_mustaza_der Mustazaf Der"
 TUR.Neutral_Muslim_Brotherhood_desc:0 "Adalet ve Kalkınma Partisi, Türkiye'de muhafazakâr popülist bir siyasi partidir."
 TUR.Neutral_Autocracy:0 "£tur_gencparti GENÇPARTİ"
 TUR.Neutral_conservatism:0 "£generic_Neutral_conservatism_small MP"
 TUR.oligarchism:0 "£tur_bbp BBP"
 TUR.Neutral_Libertarian_desc:0 "ANAP, ekonomide devletin rolünün sınırlandırılmasını, özel sermayeyi ve girişimciliği ve dinin kamusal alanda belirli ölçüde ifade edilmesini destekleyen merkez sağ, neoliberal, laik milliyetçi bir parti olarak görülüyordu."
 TUR.Neutral_green:0 "£tur_deva DEVA"
 TUR.Neutral_green_desc:0 "Demokrasi ve Atılım Partisi (DEVA), 9 Mart 2020'de AKP hükümetlerinde ekonomiden sorumlu bakanlık yapmış Ali Babacan liderliğinde kurulan bir Türk siyasi partisidir."
 TUR.neutral_Social:0 "£tur_btp BTP"
 TUR.neutral_Social_desc:0 "Bağımsız Türkiye Partisi, 25 Eylül 2001'de Haydar Baş tarafından kurulan milliyetçi ve Kemalist bir siyasi partidir."
 TUR.Neutral_Communism:0 "£tur_non_aligned_communism TSİP"
 TUR.Neutral_Communism_desc:0 "Türkiye Sosyalist İşçi Partisi 16 Haziran 1974'te kuruldu, ancak 1980 darbesinin ardından kapatıldı. TSİP, 3 Ocak 1993'te partinin eski üyeleri tarafından yeniden kuruldu."
 TUR.Nat_Autocracy:0 "£tur_nationalist_military_junta Millî Birlik Komitesi"
 TUR.Nat_Autocracy_desc:0 "Ordunun modern tarihi, Osmanlı İmparatorluğu'nun çöküşünün ardından kurulmasıyla başladı. Türk ordusu kendisini resmî devlet ideolojisi olan Kemalizmin, özellikle de onun laiklik vurgusunun bekçisi olarak gördü."
 TUR.Nat_Populism:0 "£tur_nationalist_fascism MHP"
 TUR.Nat_Populism_desc:0 "Milliyetçi Hareket Partisi, Türk ülkücülüğünü ve Avrupa şüpheciliğini benimseyen aşırı sağcı bir Türk siyasi partisidir. Zaman zaman faşist olarak nitelendirilmiş ve şiddet yanlısı milis ve paramiliter gruplarla ilişkilendirilmiştir."
 TUR.Nat_Fascism:0 "£tur_bozkurtlar Bozkurtlar"
 TUR.Nat_Fascism_desc:0 "Resmî adı Ülkü Ocakları olan Bozkurtlar, Milliyetçi Hareket Partisi'ne (MHP) bağlı aşırı sağcı bir Türk örgütü ve hareketidir. Genellikle ülkücü, İslamcı ve neofaşist olarak tanımlanan bu gençlik örgütü, MHP'nin paramiliter ya da militan kanadı olarak nitelendirilmiştir."
 TUR.Monarchist:0 "£tur_nationalist_monarchist Osmanoğlu Hanedanı"
 guerilla_warfare_desc:0 "Gerilla savaşı, paramiliter personel, silahlı siviller ya da düzensiz birlikler gibi küçük savaşçı gruplarının daha büyük ve daha az hareketli geleneksel bir orduyla savaşmak için pusu, sabotaj, baskın, küçük çaplı çatışma, vur-kaç taktikleri ve hareketlilik gibi askerî taktikler kullandığı bir düzensiz savaş biçimidir."
