 sp_land_generic_reward_artillery_bonus_1:0 "Geliştirilmiş Menzil İsabeti"
 sp_land_generic_reward_artillery_bonus_2:0 "Yeni Geri Tepme Azaltma Sistemleri"
 sp_land_generic_reward_artillery_bonus_3:0 "Gelişmiş Namlu Ağzı Tasarımı"
 sp_land_generic_reward_resource_scarcity:0 "Kaynak Kıtlığı"
 sp_land_generic_reward_critical_failure:0 "Kritik Başarısızlık"
 sp_caseless_ammunition_reward_new_propellant:0 "Yeni İtici Yakıt"
 sp_caseless_ammunition_reward_new_propellant_desc:0 "Mühendislerimiz, aşırı ısınmayı azaltmaya yardımcı olması gereken ısıya dayanıklı bir itici yakıt keşfetti."
 sp_fire_support_land_drone_reward_improved_communication:0 "Yeni İnsansız Araç Haberleşme Yöntemi"
 sp_fire_support_land_drone_reward_improved_communication_desc:0 "İnsansız araçlarımız için verimli bir kontrol yöntemi geliştirirken mühendislerimiz gelişmiş bir kablosuz haberleşme yöntemi geliştirdi. Bu atılımı sivil veya askeri bir uygulamada kullanabiliriz"
 sp_fire_support_land_drone_reward_improved_communication_civilian_application:0 "Sivil Bir Uygulama"
 sp_fire_support_land_drone_reward_improved_communication_military_application:0 "Askeri Bir Uygulama"
 sp_fire_support_land_drone_reward_improved_communication_tech_bonus:0 "Gelişmiş Kablosuz Haberleşme"
 sp_tactical_augmented_reality_reward_civilian_interest:0 "Sivil İlgi"
 sp_tactical_augmented_reality_reward_civilian_interest_desc:0 "Bir teknoloji şirketi, ordunun artırılmış gerçeklik araştırma projesine ilgi duydu. Sivil ve askeri sanayi kompleksi arasındaki iş birliğini artırmak istiyorlar. Ya sivil sektöre donanım sağlayan bir fabrika kurabiliriz ya da şirketin kaynaklarını kullanarak ordu için teçhizat üretimine yardımcı olabiliriz."
 sp_tactical_augmented_reality_reward_civilian_interest_civ_factory:0 "Sivil Yatırım"
 sp_tactical_augmented_reality_reward_civilian_interest_mil_factory:0 "Askeri Yatırım"
 sp_double_shot_rifle_reward_double_shot_type:0 "Çift Atış Yöntemi"
 sp_double_shot_rifle_reward_double_shot_type_desc:0 "Mühendislerimize, her biri ilk ateş gücünü artırmak için kendine özgü bir yöntem sunan iki şirket başvurdu. Bir şirket, kısa aralıkla ateş edebilen iki namlulu bir taarruz tüfeği tasarlamayı öneriyor. İkinci şirket ise iki mermiyi hızlı ardışıklıkla ateşlemek için sürgünün her hareketinde iki kez çalışmasını sağlayan bir makara sistemi uygulamak istiyor. Hangisini seçmeliyiz?"
 sp_double_shot_rifle_reward_double_shot_type_double_barrel:0 "Çift Namlu"
 sp_double_shot_rifle_reward_double_shot_type_pulley:0 "Makara Sistemi"
 sp_double_shot_rifle_reward_improved_firing_rate:0 "Geliştirilmiş Atış Hızı"
 sp_double_shot_rifle_reward_improved_firing_rate_desc:0 "Özel kuvvetlerimiz için hızlı atış yapan bir silah geliştirirken mühendislerimiz, mevcut piyade silahlarımızın atış hızını isabetten ödün vermeden artırmanın yolunu buldu. Bu yöntemi ana taarruz tüfeklerimize veya destek makineli tüfeklerimize uygulayabiliriz."
 sp_double_shot_rifle_reward_improved_firing_rate_offence:0 "Taarruz Tüfekleri"
 sp_double_shot_rifle_reward_improved_firing_rate_defence:0 "Makineli Tüfekler"
 sp_experimental_exoskeleton_reward_engineers:0 "Ordu Mühendislerinin İlgisi"
 sp_experimental_exoskeleton_reward_engineers_desc:0 "Ordumuzun istihkâm birliği, dış iskelet projemize ilgi duydu. Giyenin gücünü artıran bir dış iskeletle muharebe istihkâmcılarının etkinliğini artırabilirler. İstihkâm inşasında üstün bir giysi veya hasar görmüş askeri teçhizatın kurtarılmasına yardımcı olan bir giysi geliştirebiliriz."
 sp_experimental_exoskeleton_reward_engineers_defence:0 "İstihkâm Giysisi"
 sp_experimental_exoskeleton_reward_engineers_recovery:0 "Kurtarma Giysisi"
 sp_tank_support_drones_reward_improved_visibility:0 "Geliştirilmiş Görüş"
 sp_tank_support_drones_reward_improved_visibility_desc:0 "Yeni tank destek insansız araçlarının görsel ekranları üzerinde çalışırken mühendislerimiz, tank mürettebatımızın araçlarının dışını görme yeteneğini iyileştirmesi gereken bir kamera sistemine öncülük etti."
 sp_tank_support_drones_reward_improved_targeting:0 "Geliştirilmiş Hedefleme"
 sp_tank_support_drones_reward_improved_targeting_desc:0 "Muharebe insansız araçlarımız için tehdit tanıma yazılımı üzerinde çalışırken mühendislerimiz, mevcut tank yazılımımızla uyumlu bir sürüm oluşturmayı başardı. Bunlarla tanklarımızın hedefleme bilgisayarlarını geliştirebileceğiz."
 sp_active_camouflage_reward_vehicle_protection:0 "Araçlara Uygulanan Kamuflaj"
 sp_active_camouflage_reward_vehicle_protection_desc:0 "Kişisel kamuflaj teçhizatı üzerinde yürütülen araştırmaların bir kısmı araçlarımıza da uygulanabilir. Araçlarımızı ya kara ya da hava tabanlı düşmanlardan gizlemeye öncelik verebiliriz."
 sp_active_camouflage_reward_vehicle_protection_ground:0 "Kara Düşmanları"
 sp_active_camouflage_reward_vehicle_protection_ground_air:0 "Hava Düşmanları"
 sp_active_protection_systems_reward_improved_targeting:0 "Geliştirilmiş Hedefleme"
 sp_active_protection_systems_reward_improved_targeting_desc:0 "Mühendislerimiz gelen mermileri tespit etmek için yeni bir sistem geliştirdi. Algoritmaların bir kısmının uçak tespitini iyileştirmek için de kullanılabileceğini düşünüyorlar."
 sp_tank_electric_engine_hybrid_mode:0 "Geliştirilmiş Motorlar"
 sp_tank_electric_engine_hybrid_mode_desc:0 "Elektrikli motor geliştirme deneyimini kullanan mühendislerimiz, mevcut dizel ve türbin motor modellerimizi iyileştirmeyi başardı."
 sp_tank_aa_launchers_reward_multi_launcher_missile:0 "Uyarlanabilir Füze"
 sp_tank_aa_launchers_reward_multi_launcher_missile_desc:0 "Tanklarımız için bir yerden havaya füze fırlatıcısı geliştirirken mühendislerimiz kısa süreliğine namludan fırlatılan bir füze üretmeyi denedi. İdeal olmasa da çoğu tank namlumuza uyacak bir füze geliştirebileceklerini düşündüler. Benzer şekilde, füzeyi omuzdan atılan hava savunma sistemlerimizin birden fazla nesliyle uyumlu hale getirebilirler."
 sp_tank_aa_launchers_reward_utlise_in_tanks:0 "Namludan fırlatılabilir yap"
 sp_tank_aa_launchers_reward_utilise_in_manpads:0 "Nesiller arası uyumlu yap"
 sp_tank_self_sharpening_ammo_reward_improved_alloys:0 "Geliştirilmiş Alaşımlar"
 sp_tank_self_sharpening_ammo_reward_improved_alloys_desc:0 "Bir tungsten delici mermisinin mikro yapısını iyileştirmek için yeni bir ısıl işlem yöntemi üzerinde çalışırken malzeme mühendislerimiz, zırh plakalarımızı işlemek için kullanılabilecek bir ısıl işlem yöntemi keşfetti."
 sp_super_heavy_tank_turrets_reward_turret_ring:0 "Güçlendirilmiş Kule Halkası"
 sp_super_heavy_tank_turrets_reward_turret_ring_desc:0 "Daha ağır bir kulede zorluk, yüklere dayanabilen ve uygun hızlarda hareket edebilen bir kule halkası yaratmaktır. Süper ağır bir kule geliştirirken bazı dersler çıkardık ve bu bilgiyi kulelerimizin dönüş hızını artırmak veya dayanıklılığını artırmak için uygulayabiliriz."
 sp_super_heavy_tank_turrets_reward_turret_ring_speed:0 "Daha hızlı kule dönüşü"
 sp_super_heavy_tank_turrets_reward_turret_ring_armour:0 "Kule halkası zırhını artır"
 sp_double_barrel_cannons_reward_improved_autoloader:0 "Geliştirilmiş Otomatik Yükleyici"
 sp_double_barrel_cannons_reward_improved_autoloader_desc:0 "Mühendislerimiz, çift namlulu yeniden yükleme sistemi üzerinde çalışırken tanklarımız için geliştirilmiş bir otomatik yükleyici geliştirdi."
 sp_railgun_cannon_reward_improved_barrel:0 "Geliştirilmiş Namlu"
 sp_railgun_cannon_reward_improved_barrel_desc:0 "Bir ray topundan gelen muazzam ısıya dayanabilen bir namlu üzerinde çalışırken mühendislerimiz, bulgularının bir kısmını geleneksel top namlularımızı iyileştirmek için kullanmayı başardı."
