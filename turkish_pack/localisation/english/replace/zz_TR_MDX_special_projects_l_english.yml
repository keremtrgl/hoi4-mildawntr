 sp_biofuel_e10_blend_desc:0 "Etanolü petrolle %10 oranında harmanlamak, dünya genelinde milyarlarca araçta kullanılan, kanıtlanmış ve ticari olarak uygulanan bir teknolojidir. E10 üretim altyapısını standartlaştırmak, ithal fosil yakıta bağımlılığımızı azaltır, tarımsal fazlayı enerji karışımına yönlendirir ve mevcut rafineri ve dağıtım ağlarında yalnızca küçük değişiklikler gerektirir."
 sp_biofuel_flexfuel_butanol:0 "Esnek Yakıt ve Bütanol Sentezi"
 sp_biofuel_flexfuel_butanol_desc:0 "Standartlaşmış etanol harmanlamaya dayanan bu program iki paralel yol izler. Esnek yakıtlı motorlar E85 ve benzeri yüksek etanollü karışımları tolere ederek araç uyumluluğunu harman oranından ayırır. Biyobütanol daha yüksek enerji yoğunluğu ve benzine daha yakın soğuk çalıştırma performansı sunar, ancak ölçekli üretim çözülmemiş bir mühendislik sorunu olmayı sürdürüyor. Başarılı bir program rafineri sektörümüzü küresel pazarın önüne geçirir."
