 sp_multipurpose_warhead_reward_improved_warhead_desc:0 "Tank savar füzelerine uçaksavar performansı, uçaksavar füzelerine ise tank savar performansı katmanın yollarını bulmaya çalışırken mühendislerimiz, füze türlerinden birinin genel performansını iyileştirmenin yolunu buldu."
