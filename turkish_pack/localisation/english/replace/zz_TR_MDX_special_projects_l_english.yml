 sp_caseless_ammunition:0 "Kovansız Mühimmat"
 sp_caseless_ammunition_desc:0 "Mermiyi ve itici barutu tek bir gövdede birleştirerek mühimmatımızın hem ağırlığını hem de üretim maliyetini düşürebiliriz."
 sp_fire_support_land_drone:0 "Ateş Destek İnsansız Araçları"
 sp_fire_support_land_drone_desc:0 "Hava insansız araçlarımız var, ancak kara tabanlı insansız araçlar geliştirmek piyademizin kullanılabilir ateş gücünü artıracaktır."
 sp_tactical_augmented_reality:0 "Taktik Artırılmış Gerçeklik"
 sp_tactical_augmented_reality_desc:0 "Askerlerimizin görüş alanına canlı bilgi aktarabilen giyilebilir bir görüş cihazı yaratmak, muharebedeki verimliliklerini kuşkusuz artıracaktır."
 sp_double_shot_rifle:0 "Çift Atışlı Tüfek"
 sp_double_shot_rifle_desc:0 "Özel kuvvetlerimiz çatışmaya girdiğinde amaç, kısa sürede kısa ve isabetli bir ateş salvosu açmaktır. Buna en iyi, özel kuvvetlerimize özel bir silah yaratarak ulaşılabilir."
 sp_double_shot_rifle_tt:0 "Tüm §YÖzel Kuvvetler§! birliklerinin §YSavunmasını§! ve §YYarmasını§! §G%5§! artırır\n"
 sp_experimental_exoskeleton:0 "Deneysel Dış İskelet"
 sp_experimental_exoskeleton_desc:0 "Dış iskelet, giyenin yeteneklerini artırmayı amaçlayan mekanik bir giysidir. Bu; artan hız, güç veya refleks şeklinde olabilir. Askeri kullanım için bir giysi geliştirmek askerlerimizi daha etkili kılabilir."
 sp_active_camouflage:0 "Aktif Kamuflaj"
 sp_active_camouflage_desc:0 "Kamuflaj askerleri gizlemekte iyidir, ancak ne yazık ki genellikle beklenen muharebe ortamları arasında bir uzlaşmadır. Çevredeki araziye uyum sağlayabilen bir kamuflaj tasarlayabilirsek askerlerimiz düşman için neredeyse görünmez olabilir."
 sp_coilgun_memes:0 "Piyade Bobin Topları"
 sp_coilgun_memes_desc:0 "Tanklarımızdaki ray topu teknolojisini «çocuklar küçüldü» usulü küçülterek piyademize ses hızının katbekat üstünde giden bir tungsten mermi gücü verebiliriz.\nÇılgın geliştiriciyi tahrik etmeyin, çünkü yemin ederim bir akşamda bu tür şeyler yaparım."
 sp_recon_land_drone:0 "Kara Keşif İnsansız Araçları"
 sp_recon_land_drone_desc:0 "Modern kara harbi giderek daha çok bilgi üstünlüğüne ve erken tehdit tespitine bağlıdır. Kara kuvvetlerimizin yanına özel keşif insansız araçları konuşlandırarak onların farkındalığını geleneksel keşif yöntemlerinin çok ötesine taşırız. Bu yatırım, doğrudan çatışma gerçekleşmeden önce daha hızlı karar almayı, daha iyi eşgüdümü ve muharebe alanının daha net görülmesini sağlar."
 sp_smart_bullets:0 "Akıllı Mermiler"
 sp_smart_bullets_desc:0 "Güdüm ve hedefleme alanındaki gelişmeler muharebe alanının en küçük unsurlarını bile etkilemeye başlıyor. Piyademiz ve destek silahlarımız için akıllı mühimmata yatırım yaparak karmaşık muharebe ortamlarında isabeti ve etkinliği artırmayı hedefliyoruz."
 sp_recon_drone_land:0 "Kara Keşif İnsansız Araç Sistemleri"
 sp_recon_drone_land_desc:0 "Muharebe alanında insansız hava araçlarının yaygın kullanımıyla birlikte, kara keşif insansız araçları kara kuvvetlerine cephe hattı üzerinde sürekli, gerçek zamanlı istihbarat sağlar. Muharebe birliklerine yakın çalışan bu araçlar, personeli doğrudan riske atmadan durumsal farkındalığı, hedef tespitini ve eşgüdümü iyileştirir."
 sp_truck_modular_seating:0 "Modüler Kamyon Oturakları"
 sp_truck_modular_seating_desc:0 "Kamyonlarla taşınırken askerlerimiz çoğunlukla kasaya gelişigüzel oturuyor. Tüm kamyonlarımıza uyan modüler bir oturma düzeni geliştirmeliyiz. Böylece asker taşımacılığı daha düzenli, araçtan inme ise daha verimli olur."
 sp_utility_vehicle_electric_engines:0 "Kamyon Elektrik Motorları"
 sp_utility_vehicle_electric_engines_desc:0 "Elektrik motorları uzun zamandır var ve sivil piyasada giderek yaygınlaşıyor. Yakıta bağımlılığımızı azaltmak için askeri araçlarımızda kullanılacak bir motor geliştirebiliriz."
 sp_airless_tires:0 "Havasız Lastikler"
 sp_airless_tires_desc:0 "Hareketlilik, özellikle sert ve öngörülemez ortamlarda modern kara harekâtının kritik bir unsuru olmayı sürdürüyor. Askeri araçlarda havasız lastik teknolojisini benimseyerek bakım ihtiyaçlarını azaltabilir ve patlama riskini ortadan kaldırabiliriz. Bu yatırım harekât güvenilirliğini artırır ve kuvvetlerimizin elverişsiz koşullarda bile hareketi sürdürmesini sağlar."
 sp_armoured_vehicle_project:0 "Zırhlı Araç Deneyleri"
 sp_armoured_vehicle_project_desc:0 "Yerli zırhlı araçlar üretmek istiyorsak farklı araç tasarımlarını denemeye zaman ve emek ayırmalıyız."
 sp_armoured_vehicle_project_tt:0 "§YAna Muharebe Tankı Gövdelerini§!, §YZırhlı Muharebe Aracı Gövdelerini§!, §YHafif Tank Gövdelerini§!, §YKendi Yürür Topçu Gövdelerini§! ve §YKendi Yürür Uçaksavar Gövdelerini§! araştırabileceğiz"
 sp_tank_nera_armor:0 "Ağır NERA Kompoziti"
 sp_tank_nera_armor_desc:0 "Tükenmiş uranyum yerleştirmeleri gibi daha ağır ve daha dayanıklı zırh türleri üretmek için gelişmiş malzemeler araştırabiliriz"
 sp_tank_support_drones:0 "Tank Destek İnsansız Araçları"
 sp_tank_support_drones_desc:0 "İnsansız araçlar muharebe alanında giderek yaygınlaşıyor. Tanklarımızın görüşü sınırlı olduğundan, tankımıza bir insansız araç kontrol merkezi entegre edip fırlatılabilir bir insansız araçla donatmak mantıklı olabilir. Böylece tank operatörü muharebe alanını çok daha iyi gözlemleyebilir."
 sp_tank_support_drones_2:0 "Tank Muharebe İnsansız Araçları"
 sp_tank_support_drones_2_desc:0 "Gözetlemeye ek olarak tank muharebe insansız araçları hedefleri belirleyip işaretleyebilecek, hatta patlayıcılarla veya monte silahlarla belirli hedeflere karşı savaşabilecek."
 sp_active_protection_systems:0 "Aktif Koruma Sistemleri"
 sp_active_protection_systems_desc:0 "Tanklarımızı yalnızca dumanla gizlemek yeterli değildir. Gelen füzeleri ve delici mermileri yok etmek için tanklarımıza bir mermi savar sistem entegre etmeliyiz."
 sp_tank_electric_engine:0 "Tank Elektrikli Güç Aktarımı"
 sp_tank_electric_engine_desc:0 "Önceki elektrikli güç paketlerimiz yalnızca bir tankın yardımcı sistemlerine güç sağlayabildi. Yeterli yatırımla tam elektrikli bir tank güç aktarım sistemi yaratabiliriz."
 sp_tank_aa_launchers:0 "Tank Üstü Hava Savunma Füzesi"
 sp_tank_aa_launchers_desc:0 "Tanklar, kendilerini koruyan sınırlı önlemlerle her türlü hava hedefine karşı genellikle savunmasızdır. Tankların tank savar güdümlü mermi ateşlemesi kanıtlanmış bir yöntemdir, ancak onlara uçaksavar füzesi de ateşletebiliriz."
 sp_tank_self_sharpening_ammo:0 "Kendini Bileyen Çubuklar"
 sp_tank_self_sharpening_ammo_desc:0 "Belirli bir ısıl işlemle tungsten delici mermilerimizin mikro yapısını iyileştirerek mermilerin delme sırasındaki dayanıklılığını artırabiliriz."
 sp_tank_thermal_camo:0 "Termal Kamuflaj"
 sp_tank_thermal_camo_desc:0 "Özel bir kaplama ve gizleme cihazlarıyla araçlarımızın termal izini düşürebilir, böylece termal kameralar ve ısıya duyarlı füzeler tarafından tespit edilmelerini çok daha zorlaştırabiliriz."
 sp_tank_chameleon_camo:0 "Bukalemun Kamuflajı"
 sp_tank_chameleon_camo_desc:0 "Özel bir kaplamayla araçlarımızın arkalarında kalanı görünen yüzlerine yansıtarak arka planlarını taklit etmesini sağlayabiliriz."
 sp_super_heavy_tank_turrets:0 "Süper Ağır Tank Kuleleri"
 sp_super_heavy_tank_turrets_desc:0 "Tanklarımızı daha ağır silahlarla donatmak için daha büyük bir kule yaratmanın uygulanabilir bir yolunu bulmalıyız."
 sp_double_barrel_cannons:0 "Çift Namlulu Tank"
 sp_double_barrel_cannons_desc:0 "İki namlulu tank yaratmak için birkaç girişimde bulunuldu ancak verimsiz oldukları gerekçesiyle terk edildi. Verimli bir yükleme mekanizması geliştirebilirsek her iki topu da kullanabiliriz."
 sp_railgun_cannon:0 "Ray Topu"
 sp_railgun_cannon_desc:0 "Ray topu, manyetik bir mermiyi namlu boyunca fırlatmak için elektrik yüklü iki metal ray kullanır. Bu, geleneksel mermilerden daha küçük mermilerin hiçbir patlayıcı madde olmadan büyük hasar vermesini sağlar."
 sp_railgun_cannon_2:0 "Plazma Ray Topu"
 sp_railgun_cannon_2_desc:0 "Katı bir mermi yerine plazma ray topu, plazma gazı parçacıklarını elektromanyetik kuvvetlerle yüksek hızlara çıkarır. Hedefe çarptığında, oluşan muazzam ısı ve kinetik kuvvetlere ek olarak plazma, elektroniği bozan elektromanyetik radyasyon da yayar."
 sp_tank_based_laser_main_cannons:0 "Lazer Ana Topları"
 sp_tank_based_laser_main_cannons_desc:0 "Güçlü ve yoğunlaşmış bir lazer üretebilen büyük bir enerji silahı yaratarak pratikte her şeyi delebilecek bir ana muharebe tankı silahı geliştirebiliriz."
 sp_tank_based_laser_point_defense:0 "Tank Lazer Yakın Savunması"
 sp_tank_based_laser_point_defense_desc:0 "Aktif koruma sistemlerine ek olarak, tanklarımız için gelen füzeleri yok edecek küçük lazer tabanlı silahlar geliştirebiliriz."
 sp_afv_double_cannons:0 "Çift Top"
 sp_afv_double_cannons_desc:0 "Hafif zırhlı muharebe araçlarımız genellikle tek bir silahla, çoğunlukla otomatik topla donatılır. Ancak yan yana iki top monte edecek bir sistem yaratabiliriz."
 sp_tank_stealth_armor_early:0 "Erken Görünmezlik Zırhı"
 sp_tank_stealth_armor_early_desc:0 "Yalnızca tanklarımızı korumakla kalmayıp daha iyi gizleme de sağlayan bir zırh yaratarak en iyi zırhlı teorilerinden birini benimseyebiliriz: vurulmamak, vuruşu durdurmaktan iyidir."
 sp_exoskeletal_engine_tank:0 "Dış İskeletli Motor Sistemleri"
 sp_exoskeletal_engine_tank_desc:0 "Geleneksel motorlar, ağırlık, gerilim ve verimlilik açısından doğal sınırlamalar taşıyan merkezi mil ve disklere dayanır. Dönen kanatların bir tambur-rotor yapısı içinde desteklendiği dış iskeletli motor tasarımlarını araştırarak ağırlığı azaltmayı, güvenilirliği artırmayı ve kompakt, yüksek güçlü tahrik için yeni olanaklar açmayı hedefliyoruz."
 sp_nuclear_engine_tank:0 "Nükleer Enerjili Motor Sistemleri"
 sp_nuclear_engine_tank_desc:0 "Artan yakıt talebi ve uzayan harekât menzilleri, geleneksel zırhlı lojistik üzerindeki yükü artırıyor. Ağır kara araçları için nükleer enerjili motor sistemlerini araştırarak uzun vadeli hareketliliği sürdürürken ikmal hatlarına bağımlılığı azaltmaya çalışıyoruz."
 sp_light_walker_tank_chassis:0 "Hafif Yürüyen Tank Şasisi"
 sp_light_walker_tank_chassis_desc:0 "Paletli araçları kısıtlayan engebeli arazi, moloz ve kentsel engelleri aşmak için tasarlanmış hafif iki ayaklı bir zırhlı şasi. Yüksek silueti ve karmaşık tahrik mekanizmaları bakım ve güvenilirlik sorunları doğursa da hafif yürüyen platform, piyade ve insansız araçlarla uygun şekilde desteklendiğinde yoğun şehirlerde ve engebeli zeminde olağanüstü hareketlilik sunabilir."
 sp_drone_lrs:0 "İnsansız Araç Fırlatma Roket Sistemi"
 sp_drone_lrs_desc:0 "Geleneksel roket mühimmatının yerini çok sayıda harcanabilir insansız aracın aldığı bu fırlatma sistemi, geniş alanlara sürü tabanlı ateş gücü sağlar. Konuşlandırıldıktan sonra insansız araçlar dağılarak keşif, vuruş veya havada bekleyerek saldırı yapar; böylece kara kuvvetleri düşman savunmasını doyurur, uçuş sırasında hedeflere uyum sağlar ve geleneksel füze yüklerine dayanmadan baskıyı sürdürür."
 sp_heavy_walker_tank_chassis:0 "Ağır Yürüyen Tank Şasisi"
 sp_heavy_walker_tank_chassis_desc:0 "Önceki yürüyen araç konseptlerine dayanan ağır iki ayaklı zırhlı platformlar, kalın zırh korumasını eklemli hareketlilikle birleştirerek geleneksel ağır tankların geçemediği arazileri aşar. Daha yavaş ve mekanik olarak daha karmaşık olsalar da bu araçlar ön cephe dayanıklılığını ve kararlı silah platformlarını öne çıkarır; yoğun kentsel ve engebeli ortamlarda yarma harekâtlarını desteklemelerine olanak tanır."
 sp_walker_tank_chassis:0 "Yürüyen Tank Şasisi"
 sp_walker_tank_chassis_desc:0 "Zırhlı araç tasarımını eklemli bacak tabanlı hareketlilikle birleştiren yürüyen tank şasileri, geleneksel paletli platformların zorlandığı arazide çalışmak üzere tasarlanmıştır. Engelleri aşarak ve engebeli zeminde ilerleyerek bu araçlar kentsel, dağlık ve ağır hasar görmüş ortamlarda daha fazla esneklik sunar; bunun bedeli artan mekanik karmaşıklık ve bakım taleplerdir."
 sp_hover_suspension:0 "Havada Asılı Süspansiyon Sistemleri"
 sp_hover_suspension_desc:0 "Geleneksel palet takımını kaldırma kuvveti üreten havada asılı sistemlerle değiştiren zırhlı personel taşıyıcılar, zeminin üzerinde yer yüzeyini kat etmek yerine yüzeyin üstünden hareket etme yeteneği kazanır. Bu, araçların zeminle azalmış temasla çamuru, karı, suyu ve enkazı aşmasına olanak tanır; hareketliliği ve konuşlanma esnekliğini artırırken yeni güç ve bakım gereksinimleri getirir."
 sp_automatic_twin_barrel_mortar_turret:0 "Otomatik Çift Namlulu Havan"
 sp_automatic_twin_barrel_mortar_turret_desc:0 "Havan kuleleri eski bir fikir, ancak aynı kuleye iki havan monte edersek çok daha yüksek bir atış hızı ve birden fazla merminin eş zamanlı isabeti elde edebiliriz."
 sp_ground_fireandforget:0 "Ateşle ve Unut Tank Savar Füzesi"
 sp_ground_fireandforget_desc:0 "Elektroniğin minyatürleştirilmesi artık bir füzenin termal kilitlenmelerle hedefe kendiliğinden yönelmesine olanak tanıyor."
 sp_multipurpose_warhead:0 "Çok Amaçlı Harp Başlıkları"
 sp_multipurpose_warhead_desc:0 "Tanklara karşı füzelerimiz ve uçaklara karşı füzelerimiz var. Peki ya füzelerimizi her ikisine karşı da etkili kılabilirsek? Böylece zor durumda tank savar ve uçaksavar füzeleri asıl hedefleri dışındakilere karşı da kullanılabilir."
 sp_magneto_explosive_munition:0 "Manyeto-Hidrodinamik Patlayıcı Mühimmat"
 sp_magneto_explosive_munition_desc:0 "Ağır zırhlı araçlar, daha gelişmiş tank savar silahlarının geliştirilmesini sürdürüyor. Manyeto-hidrodinamik patlayıcı mühimmatı araştırarak güdümlü füzelerimizin delme ve yıkıcı etkilerini artırmayı hedefliyoruz."
 sp_naval_vessel_project:0 "Deniz Aracı Deneyleri"
 sp_naval_vessel_project_desc:0 "Yedi denizde (hatta arka bahçemizdeki havuzda) yelken açabilmek için deneysel savaş gemileri geliştirmeye kaynak ayırmalıyız."
 sp_naval_vessel_project_tt:0 "§YKorvet Gövdelerini§!, §YFırkateyn Gövdelerini§!, §YDestroyer Gövdelerini§!, §YKruvazör Gövdelerini§!, §YHelikopter Gemisi Gövdelerini§!, §YUçak Gemisi Gövdelerini§!, §YSaldırı Denizaltısı Gövdelerini§! ve §YFüze Denizaltısı Gövdelerini§! araştırabileceğiz"
 sp_stealth_corvette:0 "Görünmez Korvetler"
 sp_stealth_corvette_desc:0 "Küçük ölçekli görünmez korvetler, düşman güçlerin gemileri tarafından tespit edilmeden onlara karşı savaşma yeteneğimizi genişletmek için mükemmel bir seçenektir."
 sp_stealth_frigate:0 "Görünmez Fırkateynler"
 sp_stealth_frigate_desc:0 "Bazı fırkateynlerimizdeki tasarım geçişi değişmeye başlıyor. Fırkateynlerimizin en avantajlı konumlarda bulunmasını sağlamak için görünmez tasarımlara yatırım yapmanın en iyisi olduğuna karar verdik."
 sp_stealth_destroyer:0 "Görünmez Destroyer"
 sp_stealth_destroyer_desc:0 "Çeşitli üreticiler tarafından yeni bir deniz teknolojisi dalgası geliştirilmeye başlandı, ancak sonuç alınamadı. Destroyerlerimizin tespit edilmesinin neredeyse imkânsız olmasını sağlamak için bu yeni teknolojiyi desteklemeliyiz; böylece düşman filomuzun bölgede olduğunu öğrenmeden çok önce vurabiliriz."
 sp_medium_naval_nuclear_engines:0 "Deniz Nükleer Mühendisliği"
 sp_medium_naval_nuclear_engines_desc:0 "Nükleer reaktörlerin ve gücün icadından sonra, deniz araçlarımıza nükleer motor monte etme imkânını keşfetmeye ve araştırmaya başladık. Havuzda geçirilmesi gereken süreyi en aza indirecek"
 sp_advanced_ballistic_propulsion_systems:0 "Gelişmiş Balistik Tahrik Sistemleri"
 sp_advanced_ballistic_propulsion_systems_desc:0 "Bazı gelişmiş balistik tahrik sistemlerinin icadı bilim insanlarımızı «ya şöyle olsaydı?» sorusunu düşünmeye itti. Daha önce akla gelmemiş hızlarda mermi atabilen silahlar yapmak için elektromanyetik tahrik gibi yöntemlerle yeni balistik tahrik sistemleri geliştirmeye başladılar."
 sp_rail_gun_naval_cannons:0 "Ray Topu Deniz Topları"
 sp_rail_gun_naval_cannons_desc:0 "Ray topları, bir mermiyi havada muazzam hızlarda fırlatarak hasar vermek için elektromanyetik tahrik kullanır. Merminin kendisi hiçbir patlayıcı içermez; bunun yerine zırhı yarıp geçmek için bu yoğun hızdan yararlanır."
 sp_supercarrier_1:0 "Erken Süper Uçak Gemileri"
 sp_supercarrier_1_desc:0 "Genişletilmiş güverte alanı ve bu boyutta gemiler inşa edebilme yeteneği, uzun menzilli güç yansıtmamız için hayati olacaktır."
 sp_supercarrier_2:0 "Geç Süper Uçak Gemileri"
 sp_supercarrier_2_desc:0 "Nükleer motorların eklenmesiyle birlikte daha fazla güç daha büyük gemiler ve geniş güverte alanı demektir."
 sp_drone_torpedoes:0 "İnsansız Araç Torpidoları"
 sp_drone_torpedoes_desc:0 "Deniz harbi hızla evriliyor ve geleneksel torpidolar artık modern tehditlere karşı yetersiz. İnsansız araç tabanlı torpido sistemlerine yatırım yaparak su altındaki vuruş gücümüzü artırmayı hedefliyoruz. Bu yeni torpidolar bağımsız hedef takibi ve uyarlanabilir çatışma yeteneğine sahip olup filolarımızın denizaltı karşıtı ve deniz harekâtlarında inisiyatifi elinde tutmasını sağlar."
 sp_anti_drone_laser_modules:0 "İnsansız Araç Karşıtı Lazer Modülleri"
 sp_anti_drone_laser_modules_desc:0 "Denizde insansız araçların ve hassas güdümlü mühimmatın artan kullanımı, deniz hava savunmasının yeniden düşünülmesini zorunlu kılıyor. Gemilerimize lazer tabanlı insansız araç karşıtı sistemler entegre ederek bu tehditlere geleneksel silahların yakalayamayacağı hız ve isabetle karşılık verebiliriz."
 sp_mineclearing_drone:0 "İnsansız Araç Mayın Temizleme Sistemleri"
 sp_mineclearing_drone_desc:0 "Deniz mayınları, denizcilik harekâtları için en kalıcı ve en düşük maliyetli tehditlerden biri olmayı sürdürüyor. Mayın karşı tedbiri görevlerini insansız araç sistemlerine devrederek mürettebatın riskini azaltır, temizleme harekâtlarının hızını ve erişimini artırırız."
 sp_naval_recon_drone:0 "Deniz Keşif İnsansız Araçları"
 sp_naval_recon_drone_desc:0 "Deniz harekât sahaları kalabalıklaşıp çekişmeli hale geldikçe denizde durumsal farkındalığı sürdürmek giderek zorlaşıyor. Özel deniz keşif insansız araçlarına yatırım yaparak gözetleme erişimimizi insanlı platformların sınırlarının ötesine taşırız. Bu sistemler filolarımızın tehditleri daha erken tespit etmesini, izlemesini ve karşılık vermesini sağlayarak daha bilinçli komuta kararları ve daha fazla harekât esnekliği sunar."
 sp_drone_submarine:0 "İnsansız Denizaltı"
 sp_drone_submarine_desc:0 "Su altı harbi, salt ateş gücünden çok kalıcılığa ve inkâr edilebilirliğe kayıyor. İnsansız denizaltı platformları geliştirerek mürettebatı veya yüksek değerli varlıkları riske atmadan kesintisiz su altı varlığı sürdürebiliriz. Bu insansız denizaltılar, konvansiyonel tırmanma eşiğinin altında faaliyet gösterirken kilit deniz alanlarını izlememize, aksatmamıza ve bu alanlarda söz sahibi olmamıza olanak tanır."
 sp_modern_sail_ships:0 "Modern Yelken Destekli Gemiler"
 sp_modern_sail_ships_desc:0 "Artan enerji talepleri ve uzayan deniz lojistiği, destek filolarımızın nasıl çalıştığının yeniden değerlendirilmesini zorunlu kılıyor. Seçili gemilerde modern yelken destekli tasarımları yeniden kullanıma sokarak harekât güvenilirliğini korurken yakıt tüketimini azaltabiliriz."
 sp_drone_patrol_boat:0 "İnsansız Karakol Botları"
 sp_drone_patrol_boat_desc:0 "Kıyı güvenliği ve deniz devriye görevleri, sınırlı insan gücü ve genişleyen harekât talepleriyle giderek zorlanıyor. İnsansız karakol botları konuşlandırarak daha büyük savaş gemileri görevlendirmeden kilit kıyı ve sahil bölgelerinde sürekli varlık sürdürebiliriz. Bu platformlar düşük yoğunluklu tehditleri daha fazla verim ve esneklikle izlememize, caydırmamıza ve karşılık vermemize olanak tanır."
 sp_drone_corvette:0 "İnsansız Korvetler"
 sp_drone_corvette_desc:0 "Deniz çatışmaları daha dağınık ve riskli hale geldikçe küçük yüzey muharebe gemilerinin rolü yeniden gözden geçiriliyor. İnsansız veya isteğe bağlı mürettebatlı korvet platformlarına yatırım yaparak mürettebatı gereksiz tehlikeye atmadan güç yansıtabilir ve deniz kontrolünü sürdürebiliriz."
 sp_drone_surface_combatant:0 "Otonom Yüzey Muharebe Gemileri"
 sp_drone_surface_combatant_desc:0 "Mürettebatı işe almak ve elde tutmak zorlaştıkça daha büyük yüzey muharebe gemileri otomasyon etrafında yeniden tasarlanıyor. İsteğe bağlı mürettebatlı fırkateynler ve destroyerler, daha ağır bir gelişmiş elektronik yükünü kabul ederek insan gücünün çok küçük bir kısmıyla açık deniz varlığımızı sürdürmemizi sağlar."
 sp_rail_gun_naval_battery:0 "Deniz Ray Topu Bataryası"
 sp_rail_gun_naval_battery_desc:0 "İlk ray topu konseptleri tek, yüksek etkili atışlara odaklansa da gelişen deniz muharebesi sürekli ve esnek ateş gücü gerektiriyor. Çok namlulu bir ray topu bataryası geliştirerek daha yüksek atış hızına ve daha iyi hedef doyurmaya yöneliyoruz."
 sp_nuclear_torpedoes:0 "Nükleer Torpidolar"
 sp_nuclear_torpedoes_desc:0 "Deniz caydırıcılığı su altı üstünlüğüne kaydıkça yalnızca konvansiyonel yükler artık yeterli olmayabilir. Nükleer başlıklı torpidolar geliştirerek geniş deniz alanlarını kullanıma kapatabilen ve yüksek değerli deniz oluşumlarına kesin karşılık verebilen bir silah ortaya koyuyoruz."
 sp_fusion_reactor_engine:0 "Füzyon Reaktör Motoru"
 sp_fusion_reactor_engine_desc:0 "Modern deniz sistemlerinin artan güç talepleri, geleneksel tahrik ve enerji üretimini sınırlarına zorluyor. Gemilerimiz için füzyon tabanlı reaktör motorlarına yatırım yaparak dayanıklılıktan ödün vermeden gelişmiş silahları, sensörleri ve tahriki desteklemeyi hedefliyoruz. Bu proje, yeni nesil yüksek enerjili deniz platformlarının temelini atarak denizde uzun vadeli harekât üstünlüğünü güvence altına alır."
 sp_naval_swarm_module:0 "Deniz Sürü İnsansız Araç Fırlatma Sistemleri"
 sp_naval_swarm_module_desc:0 "Yüzey gemilerine modüler fırlatma sistemlerinin entegre edilmesiyle deniz platformları, keşif, elektronik harp ve vuruş görevleri için çok sayıda otonom insansız aracı konuşlandırma yeteneği kazanır. Bu sürü sistemleri geminin sensör menzilini genişletir, düşman savunmasını bunaltır ve ana gemiyi doğrudan çatışmaya sokmadan esnek güç yansıtma sağlar."
 sp_radar_jamming_module:0 "Deniz Radar Karıştırma Sistemleri"
 sp_radar_jamming_module_desc:0 "Düşman radar sistemlerini aksatmak ve bozmak için tasarlanmış gelişmiş elektronik harp donanımları kullanan yüzey gemileri, denizdeki gerçek konumlarını ve hareketlerini gizleyebilir. Bu karıştırma sistemleri hedef tespitine ve atış kontrolüne müdahale ederek düşman sensörlerinin etkinliğini azaltır ve deniz çatışmalarında hayatta kalma şansını artırır."
 sp_anti_torpedo_module:0 "Deniz Torpido Savar Sistemleri"
 sp_anti_torpedo_module_desc:0 "Gelen su altı tehditlerini tespit etmek, sınıflandırmak ve etkisiz hale getirmek için tasarlanmış özel torpido savar savunma donanımları kullanan yüzey gemileri, seyir ve muharebe harekâtı sırasında modern torpidoların yarattığı riski azaltabilir. Bu sistemler hızlı sonar takibini, otomatik karşı tedbir konuşlandırmasını ve önleme çözümlerini birleştirerek güdümü bozar ve torpidoları isabetten önce yok eder; çekişmeli sularda hayatta kalma şansını artırır."
 sp_aircraft_project:0 "Uçak Deneyleri"
 sp_aircraft_project_desc:0 "Uçaklar, tasarlamak ve üretmek için ileri teknoloji bir sanayi gerektiren oldukça teknik cihazlardır. Kendi uçaklarımıza sahip olacaksak deneyler yapılmalıdır."
 sp_aircraft_project_bba_tt:0 "Aşağıdaki §YTeknoloji Hatlarının§! kilidini açar:\n- §YHafif Gövdeler§!\n- §YOrta Gövdeler§!\n- §YAğır Gövdeler§!\n- §YTaarruz Helikopterleri§!\n- §YNakliye Helikopterleri§!\n"
 sp_aircraft_project_non_bba_tt:0 "Aşağıdaki §YTeknoloji Hatlarının§! kilidini açar:\n- §YSavaş Uçakları§!\n- §YYakın Hava Desteği§!\n- §YBombardıman Uçakları§!\n- §Yİnsansız Muharebe Hava Araçları§!\n- §YHafif Savaş Uçakları§!\n"
 sp_helicopter_project:0 "Helikopter Tasarım Deneyleri"
 sp_helicopter_project_desc:0 "Bir otomobil ve diğer araçları tasarlamak gibi, helikopter tasarlamak ve üretmek de bu özel araçları yerelde üretmek için yerel bilgi birikimi gerektirir. Kendimize ait bir sürüm geliştirene kadar bazı tasarım deneyleri yürütmeliyiz."
 sp_helicopter_project_tt:0 "Aşağıdaki §YTeknoloji Hatlarının§! kilidini açar:\n- §YNakliye Helikopterleri§!\n- §YTaarruz Helikopterleri§!\n"
 sp_experimental_engines:0 "Deneysel Motor Türleri"
 sp_experimental_engines_desc:0 "Çeşitli grupların araştırma ve geliştirme ekiplerine sunulmuş bir dizi deneysel motor türü var. Motorların ve deneysel türlerin denenmesine yatırım yapmak, havada düşmanlarımıza karşı teknolojik bir üstünlük kazanmamızı sağlayabilir."
 sp_modern_air_electronics:0 "Modern Havacılık Elektroniği"
 sp_modern_air_electronics_desc:0 "Havadaki radarlar, kokpitler ve diğer sistemler için elektronikte yeni nesil bir ilerleme."
 sp_future_air_electronics:0 "Gelecek Havacılık Elektroniği"
 sp_future_air_electronics_desc:0 "Yüksek verimli havacılık teçhizatı için akıllı yapay zekânın, lazer sistemlerinin ve nanoteknolojinin en yeni teknolojisini birleştirmek."
 sp_modern_air_weapons:0 "Akıllı Havacılık Silahları"
 sp_modern_air_weapons_desc:0 "Akıllı hedefleme, silah üzerinde milimetre dalga radarlar, fırlatma sonrası kilitlenme. Geleceğin muharebe alanının yolunu açan yeni nesil silahlar."
 sp_future_air_weapons:0 "Yapay Zekâ Destekli Havacılık Silahları"
 sp_future_air_weapons_desc:0 "Önceki nesil hava füzelerini ve sensörleri yapay zekâ işlemcileriyle ve daha da hassas tespit ve hedefleme sistemleriyle geliştirmek."
 sp_hypersonic_missile:0 "Hipersonik Füzeler"
 sp_hypersonic_missile_desc:0 "Hipersonik füzeler, stratejik füze kuvvetimize düşman topraklarının derinliklerine, kısa süre öncesine kadar imkânsız sanılan hızlarda vurma yeteneği kazandıracak."
 sp_hypersonic_missile_tt:0 "§YHipersonik füze teknolojisinin§! kilidini açar"
 sp_nuclear_engines:0 "Uçak Nükleer Motorları"
 sp_nuclear_engines_desc:0 "Daha büyük ölçekli nükleer motorların minyatürleştirilmesinde ve nükleer motorların uçak gemilerinde ve başka yerlerde kullanımında bir dizi başarının ardından bilim insanları, uçaklara monte edilecek daha küçük bir nükleer motor sürümü tasarlamaya ve geliştirmeye başladı; böylece uçakta yakıt taşıma zorunluluğu ortadan kalkacak. Bu, daha uzak konuşlanmaya ve düşmanlarımız inmek zorunda kalırken uçaklarımızı gökyüzünde daha etkili tutmaya imkân verecek."
 sp_solar_engines:0 "Güneş Motorları"
 sp_solar_engines_desc:0 "Deneysel motor türleri geliştirme çabalarıyla birlikte güneş motoru, masaya gelen bir başka önerilen motor türü. Güneş motorlarını uçağın gövdesine monte etmek veya uçak gövdesine entegre etmek, uçağın uçuşu sırasında gökyüzünde otomatik olarak güç elde etmesini sağlar."
 sp_scramjet_engines:0 "Scramjet Motorları"
 sp_scramjet_engines_desc:0 "Scramjet, ramjetin bir türüdür. Gelen havayı ses altı hızlara yavaşlatmak yerine, scramjet havayı ses üstü hızlarda ateşler. Bu, uçak için çok daha yüksek hızlara olanak tanır."
 sp_ramjet_engines:0 "Turboramjet Motorları"
 sp_ramjet_engines_desc:0 "Normal bir turbojetin aksine ramjet, havayı türbin yerine hareketle içine alır. Bu, daha verimli ve basit bir motor yaratır ancak uçağın düşük hızlardaki çalışmasını sınırlar."
 sp_fully_autonomous_computers_framework:0 "Tam Otonom Bilgisayar Altyapıları"
 sp_fully_autonomous_computers_framework_desc:0 "Otonom bir hava kuvvetleri yaratma yolunda adımlar atabilmek için otonom bilgisayarların temelini deneyip oluşturmalıyız."
 sp_fully_autonomous_fighters:0 "Tam Otonom Savaş Uçakları"
 sp_fully_autonomous_fighters_desc:0 "Tamamen bilgisayar tarafından uçurulan bir savaş uçağı pilotlarımızın hayatını tümüyle kurtarmamıza olanak tanır ve kayıpları telafi etmek için uzun eğitim programlarına bağımlı kalmayız."
 sp_fully_autonomous_bombers:0 "Tam Otonom Bombardıman Uçakları"
 sp_fully_autonomous_bombers_desc:0 "Tamamen bilgisayar tarafından uçurulan bir bombardıman uçağı pilotlarımızın hayatını tümüyle kurtarmamıza olanak tanır ve kayıpları telafi etmek için uzun eğitim programlarına bağımlı kalmayız."
 sp_stealth_technology:0 "Görünmezlik Deneyleri"
 sp_stealth_technology_desc:0 "Düşmana karşı üstünlük sağlamak için savaş uçaklarımızı radar tarafından daha az tespit edilebilir kılmanın bir yolunu bulmalıyız."
 sp_arsenal_bird:0 "Cephanelik Kuşu"
 sp_aresnal_bird_desc:0 "Tam otonom uçakların, nükleer enerjili uçak motorlarının ve gelişmiş uçuş kontrol sistemlerinin geliştirilmesiyle, üzerinde koca bir insansız hava kuvvetini taşıyabilen bir uçak yapabiliriz. Son derece pahalı olan bu uçak, hava muharebe sistemlerinin zirvesi olacaktır."
 sp_anti_ship_drone_missile:0 "Gemi Savar İnsansız Araç Füzeleri"
 sp_anti_ship_drone_missile_desc:0 "Deniz vuruş yetenekleri giderek menzil, hassasiyet ve hayatta kalma ile tanımlanıyor. İnsansız araç tabanlı gemi savar füze sistemleri geliştirerek insanlı uçakların riskini azaltırken düşman gemilerini tehdit etme yeteneğimizi genişletebiliriz."
 sp_hover_helicopter_engine:0 "Havada Asılı Kalabilen Helikopter Motorları"
 sp_hover_helicopter_engine_desc:0 "Kentsel ortamlar ve dar araziler döner kanatlı havacılığa yeni talepler getiriyor. Havada asılı kalabilen motor sistemleri geliştirerek karmaşık harekâtlar sırasında düşük hızlı kararlılığı ve dikey kontrolü iyileştirmeyi hedefliyoruz."
 sp_hypersonic_engine:0 "Hipersonik Tahrik Sistemleri"
 sp_hypersonic_engine_desc:0 "Hava üstünlüğü giderek hız, menzil ve savunulan hava sahasına nüfuz etme yeteneğiyle şekilleniyor. Hipersonik tahrik sistemlerine yatırım yaparak geleneksel uçak performansının sınırlarının ötesine geçmeyi amaçlıyoruz."
 sp_awacs_project:0 "Havadan Erken Uyarı ve Kontrol Sistemi"
 sp_awacs_project_desc:0 "Modern hava harekâtının artan karmaşıklığıyla havadan erken uyarı ve kontrol sistemleri, gelişmiş hava kuvvetleri için kritik bir yetenek haline geldi. Güçlü radar dizilerini ve komuta sistemlerini uzun havada kalış süreli uçak platformlarına monte ederek."
 sp_fiber_drones:0 "Fiber Optik Güdümlü İnsansız Araç"
 sp_fiber_drones_desc:0 "İnsansız sistemlerin ve elektronik harbin hızlı gelişimiyle fiber optik güdümlü insansız araçlar, karıştırmaya ve sinyal girişimine karşı bir çözüm olarak ortaya çıktı. Kontrol sinyallerini telsiz haberleşmesi yerine fiziksel fiber bağlantılar üzerinden ileten bu araçlar, çekişmeli ortamlarda güvenilir biçimde çalışırken yüklerinin hassas kontrolünü sürdürebilir."
 sp_air_railguns:0 "Havadan Havaya Ray Topu"
 sp_air_railguns_desc:0 "Daha yüksek angajman hızları ve uzatılmış önleme menzilleri arayışı sürerken havadan havaya ray topları, geleneksel füze sistemlerine bir alternatif olarak önerildi."
 sp_air_railguns_helicopter:0 "Helikopter Ray Topu"
 sp_air_railguns_helicopter_desc:0 "Kompakt elektromanyetik topları döner kanatlı platformlara entegre ederek helikopterler, normalde daha ağır uçaklar veya kara sistemleri gerektirecek sertleştirilmiş hedefleri delebilecek son derece yüksek hızlı ateş sağlayabilir"
 sp_space_artillery:0 "Yörünge Ateş Desteği"
 sp_space_artillery_desc:0 "Uzay tabanlı sistemlerin modern harbe giderek daha fazla entegre olmasıyla yörünge ateş desteği kavramı, uzaydan yer hedeflerine hassas vuruşlar yapmanın bir yolu olarak ortaya çıktı."
 sp_air_pdl:0 "Yakın Savunma Lazerleri"
 sp_air_pdl_desc:0 "Yüksek hızlı füzelerden ve doyurma saldırılarından gelen tehdidin artmasıyla havadan yakın savunma lazerleri, gelen tehditleri ışık hızında önlemenin bir yolunu sunar. Yüksek enerjili lazer sistemlerini uçak platformlarına monte ederek bu silahlar füzeleri uçuş halinde etkisiz hale getirebilir, sınırlı önleyici stoklarına bağımlılığı azaltabilir ve çekişmeli hava sahasında hayatta kalma şansını artırabilir."
 sp_air_helicopter_drone_control:0 "Helikopter İnsansız Araç Kontrolü"
 sp_air_helicopter_drone_control_desc:0 "Tam bir insansız araç kontrol mimarisini döner kanatlı platformlara entegre etmek, helikopterleri insansız keşif ve vuruş varlıkları için havada komuta düğümlerine dönüştürür. Bu yaklaşım, rutin maruziyet görevlerinde mürettebatı riske atma ihtiyacını azaltırken muharebe sahasında eşgüdümü, hedeflemeyi ve temposunu iyileştirir. Yetenek, gelişmiş aviyonik, güvenli veri bağlantıları ve ek güç ile soğutma kapasitesi gerektirdiğinden sahaya sürülmesi pahalıdır."
 sp_air_gunship_railcannons:0 "Taarruz Uçağı Ray Topları"
 sp_air_gunship_railcannons_desc:0 "Bu proje, ağır ray topu dizilerini özel taarruz uçağı gövdelerine monte ederek sürekli elektromanyetik ateşle hedefleri parçalayabilen bir uçak yaratır. Aşırı namlu çıkış hızı ve hassas atış kontrolüyle insansız araçları, uçakları ve kara oluşumlarını geleneksel topların tepki verebileceğinden daha hızlı yok edebilir. Yetenek yıkıcı ölçüde pahalıdır; sistemi çalışır durumda tutmak için olağanüstü güç üretimi, gelişmiş soğutma ve yüksek kaliteli malzemeler gerektirir."
 sp_CNRP:0 "Karbon Nanotüp Takviyeli Polimer"
 sp_CNRP_desc:0 "Karbon nanotüp kafeslerini havacılık kompozitlerine gömmek, geleneksel karbon fiberden daha güçlü ve daha hafif gövde malzemeleri sağlar. Ağırlık tasarrufu doğrudan menzil, yük kapasitesi ve yapısal dayanıklılığın iyileşmesine dönüşür."
 sp_space_based_solar_farms:0 "Uzay Tabanlı Güneş Çiftlikleri"
 sp_space_based_solar_farms_desc:0 "Dünyada güneş enerjisinin uygulanması yaygın ve her yerde bulunan bir teknolojidir. Rüzgâr ve hidroelektrik enerji kadar yaygınlaşmış olup temel enerji kaynaklarımızdan biridir. Artan enerji talebimize yardımcı olmak için uzayda panellerden oluşan güneş dizileri kurulması ve enerjinin çeşitli boyutlardaki uydular ve başka araçlarla Dünya'ya aktarılması fikri ortaya atıldı."
 sp_improved_based_solar_farms:0 "Geliştirilmiş Yer Tabanlı Güneş Çiftlikleri"
 sp_improved_based_solar_farms_desc:0 "Daha iyi fotovoltaik hücreler ve teknolojinin temelindeki iyileştirmeler gibi ek değişikliklerin uygulanması, güneş çiftliklerimizin verimliliğini daha da artırmamıza olanak tanıyacak."
 sp_improved_maglev_trains:0 "Manyetik Levitasyonlu Trenler"
 sp_improved_maglev_trains_desc:0 "Eski manyetik levitasyonlu trenlerimizin iyileştirilmesine ve bunlara odaklanılmasına vurgu yapmak, ülkemizin ve ekonomimizin geleceği için şarttır. Bu trenler, altyapı bunu destekleyebildiği sürece ulaşımın neredeyse anlık olduğu bir geleceğin anahtarıdır."
 sp_construction_exoskeletons:0 "İnşaat Dış İskeletleri"
 sp_construction_exoskeletons_desc:0 "İnşaat dış iskeletleri, vinç, forklift gibi araçların yerini almak üzere tamamen tek bir operatörle kullanılabilen, çeşitli küçük, orta ve büyük dış iskeletlerin bir karışımıdır. Bu teknoloji inşaat mühendisliğimizi on yıllar ileri taşıdı ve inşaatı inanılmaz derecede verimli ve uygun maliyetli hale getirdi."
 sp_wireless_power_grid_expansion:0 "Kablosuz Elektrik Şebekesi Genişletmesi"
 sp_wireless_power_grid_expansion_desc:0 "Elektrik şebekemizi daha fazla orta ve uzun menzilli kablosuz güç aktarım hattı içerecek şekilde genişletmek, bakımını yapmamız gereken altyapıyı azaltmaya yardımcı olmalı; üretimimizi artırırken enerji kaybını ortadan kaldırmalıdır."
 sp_improved_synthetic_diamonds:0 "Geliştirilmiş Sentetik Elmaslar"
 sp_improved_synthetic_diamonds_desc:0 "Sentetik elmas üretimimizi ve sürecimizi daha uygun maliyetli ve verimli hale getirmek, giderek daha fazla sanayi kolunun laboratuvar üretimi elmasa geçmesini sağlayacak. Laboratuvar üretimi elmaslara geçiş, tıbbi ürünleri, bilgisayar parçalarını ve çok daha fazlasını önemli ölçüde ucuzlatacak."
 sp_atmospheric_water_recycling:0 "Atmosferik Su Geri Dönüşümü"
 sp_atmospheric_water_recycling_desc:0 "Atmosferden su geri dönüştürme yeteneğini uygulamak ve geliştirmek, daha önce tarıma elverişsiz sayılan bölgelerde tarım yapılmasına imkân tanıyacak. Ayrıca suyu temizlememize de olanak vererek toprağın veya yerel akiferlerin derinliklerinden su çekmek için daha saldırgan yöntemlere duyulan ihtiyacı ortadan kaldıracak."
 sp_space_program:0 "Uzay Programı"
 sp_space_program_desc:0 "Herkes uzaya çıkmak ister, Polonya hariç. Polonya uzaya çıkamaz."
 sp_space_program_tt:0 "Aşağıdaki §YTeknoloji Hatlarının§! kilidini açar:\n- §YGNSS§!\n- §YCOMSAT§!\n- §YSPYSAT§!\n- §YOLV§!\n"
 sp_space_weapons:0 "Uzay Tabanlı Silahlar"
 sp_space_weapons_desc:0 "Bir zamanlar bilim kurgu ürünüyken bilim insanlarımız sonunda KILLSAT'ları ve uzay boşluğunda kullanılabilecek diğer mühimmatı tasarlamaya başladı. Bu silahları kullanabilmek bizi yalnızca savunmada değil, saldırıda da güçlendirecek; çünkü yıldızlar arasında düşman güçleri önleyebilecek, aksatabilecek ve engelleyebileceğiz."
 sp_space_weapons_tt:0 "Aşağıdaki §YTeknoloji Hatlarının§! kilidini açar:\n- §YKILLSAT§!"
 sp_electronic_government:0 "Elektronik Devlet"
 sp_electronic_government_desc:0 "Devletin verimliliğini en üst düzeye çıkarmak için vatandaşlar, hükümetle kendi evlerinin rahatlığında erişebilmeli ve etkileşime girebilmelidir. Bu, vatandaşlar arasında daha fazla internet okuryazarlığını teşvik edecek ve devlet harcamalarını astronomik ölçüde düşük seviyelere indirecektir."
 sp_deep_sea_mining:0 "Derin Deniz Madenciliği"
 sp_deep_sea_mining_desc:0 "Büyüyen sanayi ve teknoloji talepleri, geleneksel kaynak tedarik zincirleri üzerindeki baskıyı artırıyor. Derin deniz madenciliği yeteneklerine yatırım yaparak geleneksel çıkarma bölgelerinin ötesinde bulunan kritik minerallere erişimi güvence altına almayı hedefliyoruz."
 sp_agriculture_drone:0 "Tarım İnsansız Araç Sistemleri"
 sp_agriculture_drone_desc:0 "Büyüyen bir nüfusu verimliliği koruyarak beslemek, merkezi bir stratejik sorun haline geliyor. Gelişmiş tarım insansız araç sistemleri sunarak tarım uygulamalarını gelişmiş izleme, hassas uygulama ve otomasyonla modernleştirebiliriz."
 sp_vertical_farming:0 "Dikey Tarım"
 sp_vertical_farming_desc:0 "Kentleşme ve arazi kıtlığı, gıda üretimine yaklaşımımızı yeniden şekillendiriyor. Dikey tarıma yatırım yaparak tarımsal üretimi hava ve coğrafyaya daha az bağımlı, kontrollü ve yüksek yoğunluklu ortamlara kaydırıyoruz."
 sp_robotic_humanoid:0 "Ev Tipi Robot Asistanlar"
 sp_robotic_humanoid_desc:0 "Gündelik yaşam teknolojiyle daha fazla bütünleştikçe insansı robotların insanlara evlerinde yardım etme potansiyeli artıyor. Ev tipi robot asistanlar geliştirerek ev bakımı, bakım hizmeti ve kişisel yardım gibi günlük işleri desteklemeyi hedefliyoruz."
 sp_robotic_surgery:0 "Robotik Cerrahi"
 sp_robotic_surgery_desc:0 "Sağlık sistemleri yaşlanan nüfuslar ve artan sağlık hizmeti talepleri nedeniyle giderek artan bir baskı altında. Robot destekli cerrahinin kullanımını genişleterek hassasiyeti artırmayı, iyileşme sürelerini kısaltmayı ve gelişmiş prosedürleri daha geniş kesimler için erişilebilir kılmayı hedefliyoruz."
 sp_smart_grid:0 "Akıllı Şebeke Altyapısı"
 sp_smart_grid_desc:0 "Artan enerji tüketimi ve gelişmiş teknolojilerin entegrasyonu ulusal elektrik şebekelerine yeni talepler getiriyor. Akıllı şebeke altyapısına yatırım yaparak elektrik dağıtımını daha iyi yönetebilir, arz ve talebi dengeleyebilir ve sistemik verimsizlikleri azaltabiliriz."
 sp_equipment_recycling:0 "Askeri Teçhizat Geri Dönüşüm Programı"
 sp_equipment_recycling_desc:0 "Eskimiş veya hasar görmüş askeri teçhizatı geri kazanmak, yenilemek ve geri dönüştürmek için kapsamlı bir program. Hizmet dışı bırakılan platformlardan kritik malzemeleri ve bileşenleri geri kazanan silahlı kuvvetler, sanayi üzerindeki baskıyı azaltabilir, ikmal dayanıklılığını artırabilir ve uzayan çatışmalar sırasında üretim kayıplarını kısmen telafi edebilir."
 sp_epigenetic_reprogramming:0 "Epigenetik Yeniden Programlama"
 sp_epigenetic_reprogramming_desc:0 "DNA dizilerini değiştirmeden gen ifadesini değiştirmeye odaklanan, askeri personelin fiziksel dayanıklılığını, bilişsel performansını ve iyileşme hızlarını artırmayı amaçlayan biyomedikal bir araştırma programı. Eğitim verimliliğinde ve muharebe hazırlığında uzun vadeli avantajlar sunma potansiyeline sahip olsa da program etik kaygılar doğurur ve sıkı düzenleyici denetim gerektirir."
 sp_microchip_production:0 "Mikroçip Üretim Laboratuvarları"
 sp_microchip_production_desc:0 "Bilgi işlem süreçlerimizi küçültme konusunda deneyler yaparak ve bunları büyük ölçekte üretmeyi öğrenerek modern silahlarda ve teçhizatta kullanacağımız kendi mikroçiplerimizi üretebileceğiz."
 sp_secure_military_network:0 "Güvenli Askeri Ağ"
 sp_secure_military_network_desc:0 "Komuta, sensörleri ve kuvvetleri dayanıklı, düşük gecikmeli veri bağlantılarıyla birbirine bağlayan, sertleştirilmiş ve şifreli bir ulusal haberleşme omurgası."
 sp_composite_production:0 "Kompozit Üretim Laboratuvarları"
 sp_composite_production_desc:0 "Yeni teknolojilerle ve eritme, karıştırma ve diğer kimyasal yöntemlerle deneyler yaparak modern, ileri kompozit malzemeler üretmenin yollarını geliştirebiliriz."
 sp_nuclear_energy:0 "Nükleer Enerji Reaktörü"
 sp_nuclear_energy_desc:0 "Nükleer reaktörler bomba malzemesi üretmek için iyidir. Ancak üretilen enerji, bunun yerine sivil ve askeri sanayiyi elektrikle de besleyebilir."
 sp_nuclear_warhead_program:0 "Nükleer Başlık Programı"
 sp_nuclear_warhead_program_desc:0 "Nükleer başlık geliştirmenin karmaşıklığı, sayısız çile ve zorluğun biridir. Kitlesel ölçekte yıkım yapabilen bir başlık inşa etmek yalnızca mühendislik, mekanik ve fizik alanında bir başarı değil, aynı zamanda insanlığın başkalarının yıkımını getirme iradesinin de bir kanıtıdır."
 sp_nuclear_warhead_program_tt:0 "Aşağıdaki §YNükleer Durumların§! kilidini açar:\n- §YNükleer Güç (Savunmacı)§!\n- §YNükleer Güç (Saldırgan)§!\n"
 sp_nuclear_bomb:0 "Nükleer Fisyon Bombası Projesi"
 sp_nuclear_bomb_desc:0 "Atomda depolanmış enerjiyi kıyamet misali tek bir anda serbest bırakmak için nükleer fisyon sürecini kullanan bir bomba. Cephaneliğimizde böyle bir silah varken kim bize karşı gelmeye cesaret edebilir?"
 sp_fusion_reactors:0 "Füzyon Reaktörleri"
 sp_fusion_reactors_desc:0 "Füzyon Reaktörü, nükleer fisyon yerine nükleer füzyonla elektrik üreten bir nükleer reaktördür. Füzyonun geniş çapta nükleer reaktörlerin geleceği olduğu kabul edilir ve nükleer yakıtın kilogramı başına yaklaşık dört kat daha fazla enerji üretebilir."
 sp_thorium_nuclear_fuel:0 "Toryum Nükleer Yakıtı"
 sp_thorium_nuclear_fuel_desc:0 "Toryum, yaygın bulunabilirliği ve daha yüksek verimi nedeniyle nükleer yakıt olarak yaygın ticari kullanım için özenle incelenmiş ve aranmıştır. Nükleer reaktörlerimizde kullanılmak üzere kararlı ve işlevsel bir nükleer reaktör ile nükleer yakıt geliştirmek, ülkemizin nükleer reaktörleri ve elektrik şebekemiz için büyük bir nimet olacaktır."
 sp_missile_project:0 "Füze Deneyleri"
 sp_missile_project_desc:0 "Gerçek uçak almaya gücümüz yetmediğinde füzeler ucuz bir alternatif olabilir. Ek taarruz yetenekleri kazanmak için füze bilimine (roket bilimine değil) yatırım yapmalıyız"
 sp_missile_project_tt:0 "§YKıtalararası Balistik Füzeleri§!, §YOrta Menzilli Balistik Füzeleri§!, §YKaradan Fırlatılan Seyir Füzelerini§! ve §YYerden Havaya Füzeleri§! araştırabileceğiz"
 sp_amws_combat_system:0 "AMWS-21 Muharebe Sistemi"
 sp_amws_combat_system_desc:0 "YÇMS platformlarımız için gelişmiş bir silah sistemi geliştirin. Bu projeyi tamamlamak §YAMWS-21 Muharebe Sistemi§! modülünün kilidini açar."
 sp_zamws_advanced_mws:0 "XAMWS-24 Gelişmiş Çoklu Silah Sistemi"
 sp_zamws_advanced_mws_desc:0 "YÇMS platformlarımız için daha gelişmiş bir çoklu silah sistemi geliştirin. Bu projeyi tamamlamak §YXAMWS-24 Gelişmiş Çoklu Silah Sistemi§! modülünün kilidini açar."
 sp_xciws_close_in_weapon_system:0 "XCIWS-2B Yakın Savunma Silah Sistemi"
 sp_xciws_close_in_weapon_system_desc:0 "YÇMS platformlarımız için bir yakın savunma silah sistemi geliştirin. Bu projeyi tamamlamak §YXCIWS-2B Yakın Savunma Silah Sistemi§! modülünün kilidini açar."
 sp_close_range_battle_halberd:0 "Tip-77 Yakın Mesafe Muharebe Teberi"
 sp_close_range_battle_halberd_desc:0 "YÇMS platformlarımız için yakın mesafe teberi geliştirin. Bu projeyi tamamlamak §YTip-77 Yakın Mesafe Muharebe Teberi§! modülünün kilidini açar."
 sp_great_sword:0 "BWS-3 Büyük Kılıç"
 sp_great_sword_desc:0 "YÇMS platformlarımız için güçlü bir büyük kılıç geliştirin. Bu projeyi tamamlamak §YBWS-3 Büyük Kılıç§! modülünün kilidini açar."
 sp_caterpillar_3512b:0 "Caterpillar 3512B Dizel Motor"
 sp_caterpillar_3512b_desc:0 "Caterpillar 3512B, deniz araçları, enerji üretimi ve ağır makineler dahil çeşitli uygulamalarda yaygın olarak kullanılan güçlü ve güvenilir bir dizel motordur. Sağlam tasarımı ve yüksek performansı, onu Antarktika'nın zorlu koşullarında teçhizatı çalıştırmak için ideal bir seçim yapar."
 sp_premium_living_quarters:0 "Birinci Sınıf Konaklama Birimleri"
 sp_premium_living_quarters_desc:0 "Bu birinci sınıf konaklama birimleri, Antarktika'da görevlendirilen personel için artırılmış konfor ve olanaklar sunarak memnuniyeti ve istasyon verimliliğini artırır."
