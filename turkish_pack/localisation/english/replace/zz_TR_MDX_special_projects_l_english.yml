 sp_tank_based_laser_main_cannons_reward_air_defence:0 "Hava Savunma Lazeri"
 sp_tank_based_laser_main_cannons_reward_air_defence_desc:0 "Lazer tabanlı silahlardaki ilerlemelerle mühendislerimiz, hava hedeflerini düşürmek için kullanılabilecek bir lazer geliştirdi."
 sp_afv_double_cannons_reward_improved_autoloader:0 "Geliştirilmiş Otomatik Yükleyici"
 sp_afv_double_cannons_reward_improved_autoloader_desc:0 "Mühendislerimiz, çift top yeniden yükleme sistemi üzerinde çalışırken tanklarımız için geliştirilmiş bir otomatik yükleyici geliştirdi."
 sp_truck_modular_seating_reward_quick_release_belt:0 "Hızlı Açılır Emniyet Kemeri"
 sp_truck_modular_seating_reward_quick_release_belt_desc:0 "Modüler oturma düzeni üzerinde çalışırken mühendislerimiz yeni bir 4 noktalı hızlı açılır emniyet kemeri geliştirdi. Bu, yaralı personeli araçlardan tahliye etmeyi çok daha kolay hale getirmeli."
