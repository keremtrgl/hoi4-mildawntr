 yugoslavia.1.t:0 "Yugoslavya'ya Davet"
 yugoslavia.1.d:0 "[FROM.GetName], yeniden kurulan Yugoslav federasyonuna katılmamızı önerdi. Kabul etmek katılmak demektir; reddetmek ise birleşme kampanyasının bize yönelmesine yol açabilir."
 yugoslavia.1.a:0 "Federasyona katıl"
 yugoslavia.1.b:0 "Birleşmeyi reddet"
 yugoslavia.30.t:0 "Bir Ulus Yugoslavya'ya Yöneliyor"
 yugoslavia.30.d:0 "Yeniden kurulacak bir Yugoslav federasyonuna verilen destek halkın dörtte üçünü aştı. 1990'larda gömülen fikir burada yeniden canlı bir siyasi proje."
 yugoslavia.30.a:0 "Hayal yaşıyor"
 yugoslavia_news.20.t:0 "Yugoslav Canlanisinin Dogusu"
 yugoslavia_news.20.d:0 "Savaş yıllarıyla aşırı milliyetçi yönetim, Yugoslavya'nın çöküşünden neredeyse on yıl sonra Balkanlar'da jeopolitik bir canlanış yarattı; bölgedeki bir ulus onun yeniden kurulması için çabalamaya başladı. \n\n[GetYugoDominantName] genelinde geçit törenleri ve retro tarzı işletmeler ortaya çıktı; 90'ların etnik çatışmalarından keskin bir dönüşle afişlerde 'Kardeşlik ve Birlik' ilkesi benimseniyor. Bu yenilenme birleşik bir Balkanlar için ivme olduğunu gösterse de hareketin büyümeye devam edip etmeyeceği ya da kaybolmuş bir ulusun kuğu şarkısı olarak sönüp gidip gitmeyeceği belirsiz."
 yugoslavia_news.20.a:0 "Bölge değişiyor."
 formed_yugoslavia:0 "Yugoslavya'nın Şanı"
 formed_yugoslavia_desc:0 "Yeniden kurulan federasyon, eski Yugoslav cumhuriyetlerinin topraklarını, kurumlarını ve kurucu halklarını bütünleştirme sorumluluğunu üstlendi."
 yugoslavia_restored:0 "Yugoslavya"
 yugo_bloc_dominant:0 "Yugoslav Canlanışının Lideri"
 yugo_bloc_dominant_desc:0 "Eski cumhuriyetler arasında diğer tüm halef devletlerden fazla nüfuza sahibiz. Başkentimiz, yeniden kurulacak federasyonla ilgili görüşmeler için doğal buluşma noktasıdır."
 yugo_bloc:0 "Yugoslav Yeniden Birleşmesi"
 yugo_bloc_desc:0 "Birleşmenin ilerleyebilmesi için yeniden kurulacak Yugoslavya'ya verilen desteğin hayatta kalan her halef devlette yüzde 75'e ulaşması gerekir. Eski cumhuriyetler arasında en fazla nüfuza sahip devlet canlanışa öncülük eder: §Y[GetYugoDominantName]§!.\n\n$yugo_nost_overview$"
 yugo_bloc_map:0 "Yugoslav Yeniden Birleşmesi"
 yugo_promote_nostalgia:0 "[FROM.GetName] Ülkesinde Yugonostaljiyi Teşvik Et"
 yugo_promote_nostalgia_desc:0 "Yeniden kurulacak federasyona destek oluşturmak için kültürel değişimi, ortak medyayı ve ortak anmaları finanse et. Hedef devlet üzerinde anlamlı bir nüfuz gerektirir."
 yugo_promote_own_nostalgia:0 "Yurt İçinde Yugonostalji Geliştir"
 yugo_promote_own_nostalgia_desc:0 "Eski federasyonu olumlu gösteren yurt içi anmaları, okul müfredatlarını ve kamu medyasını finanse et. Yurt dışında nostaljiyi teşvik etmekten daha yavaş ve pahalıdır, ancak başka bir devlette dayanak noktası gerektirmez."
 yugo_form_federation:0 "Federasyonu Topla"
 yugo_form_federation_desc:0 "Hayatta kalan her halef devleti yeniden kurulan bir Yugoslav federasyonuna çağır. Reddeden devletler federasyona birleşme savaş hedefi kazandırır. Görüşmeleri yalnızca baskın üye toplayabilir ve bunu yalnızca her halef devlet yeniden birleşmeyi destekledikten sonra yapabilir."
 news.85.t:0 "Yugoslavya Yeniden Kuruldu"
 news.85.desc:0 "Mimarları eski cumhuriyetlerde destek sağladıktan sonra yeniden kurulan bir Yugoslav federasyonu ilan edildi. Yeni devlet, 1990'larda dağılan federasyonun siyasi ve stratejik mirasına sahip çıkıyor."
 news.85.a:0 "Bir Balkan devleti geri dönüyor"
 yugoslavia_not_restored_tt:0 "Yugoslavya başka bir halef devlet tarafından zaten yeniden kurulmuş §Rdeğil§!"
