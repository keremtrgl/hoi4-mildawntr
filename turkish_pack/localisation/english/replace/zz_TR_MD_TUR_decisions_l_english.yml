 TUR_nationalized_weaponary_desc:0 "Türk Silahlı Kuvvetleri'nin tedarik kurumu olan Savunma Sanayii Müsteşarlığı (SSM), temel kabiliyetlerin kavramsal geliştirilmesi için TUSAŞ ile bir anlaşma imzaladı. Savaş uçağının tasarım, giriş ve geliştirme süreçlerine TUSAŞ ve TUSAŞ Motor Sanayii (TEI) liderlik edecekti. Çalışmalar, hangi mekanik ve elektronik sistemlerin kullanılacağını araştırırken uçağın maliyetini ve askeri havacılıktaki fırsat ve zorlukları daha geniş bir perspektiften ortaya koyacaktı."
 TUR_anti_chinese_reaction:0 "Çin Karşıtı Politika"
 TUR_anti_chinese_reaction_desc:0 "Çin'in ülkemizin gelişmesini engelleyebilecek projeleri var. Bu projeleri engellemek ve Türklüğümüze sahip çıkmak için belirli politikalar izlemeliyiz. Bu aynı zamanda Amerikan-Türk ittifakını da güçlendirecek."
