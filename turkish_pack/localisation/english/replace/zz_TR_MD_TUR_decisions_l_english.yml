 TUR_tourism_sector_management:0 "Türk Turizm Sektörü (Bacasız Sanayi)"
 CESME_X:0 "Çeşme, İzmir'den Bir Fotoğraf"
 TUR_tourism_sector_management_desc:0 "Türkiye, dünyanın dört bir yanından ziyaretçi çeken zengin bir kültürel mirasa, nefes kesici manzaralara ve canlı bir tarihe sahiptir. Altyapıya yatırım yaparak, sürdürülebilir turizmi teşvik ederek ve uluslararası tanıtım çalışmalarını güçlendirerek turizm sektörümüzü destekleyebilir ve ülkemizin güzelliklerini dünyaya gösterebiliriz.\n\nBu karar, turizmdeki büyümenin faydalarını beraberinde getirdiği sorunlarla dengelemeyi amaçlar. Ziyaretçi sayılarını düzenleyerek, çevre dostu uygulamaları teşvik ederek, altyapıya yatırım yaparak ve yerel toplulukları karar süreçlerine dahil ederek Türkiye hem ekonomik büyümeyi hem de kültürel bütünlüğü destekleyen bir turizm sektörü geliştirebilir.\n\n§YTurizm sektörü demokrasi, savaş, yönetim biçimi ve istikrar gibi etkenlerle şekillenir.§!\n§RTuristlerin niteliği ve sayısı koşullara göre değişir ve bu bir denge gerektirir.§!"
