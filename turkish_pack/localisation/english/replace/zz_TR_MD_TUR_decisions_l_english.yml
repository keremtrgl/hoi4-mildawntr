 TUR_desc_ideology:0 "§RKemalizm§!, Türkiye Cumhuriyeti'nin kurucu ideolojisidir. Mustafa Kemal Atatürk tarafından uygulandığı biçimiyle §RKemalizm§!, yeni Türk devletini Osmanlı selefinden ayırmak ve modern bir yaşam tarzını benimsetmek amacıyla tasarlanmış kapsamlı siyasi, sosyal, kültürel ve dinî reformlarla tanımlanır; bunlar arasında laikliğin tesisi, bilimin devlet tarafından desteklenmesi ve parasız eğitim yer alır. Bu reformların çoğu Türkiye'ye ilk kez Atatürk'ün cumhurbaşkanlığı döneminde getirilmiştir.\n\n§GIslamcılık§!, toplumsal ve siyasal bir hedef doğrultusunda §GIslami sembollerden§! ve geleneklerden yararlanan ve ilham alan geniş bir siyasi ideolojiler bütününü ifade eder.\n\n§YKürt milliyetçiliği§!, Kürtlerin bir millet olduğunu savunan ve parçası olduğu devletlerin çeşitli milliyetçiliklerine (Türk, Arap, İran, Irak ve Suriye) karşı Kürdistan'da bir devlet kurulmasını benimseyen milliyetçi bir siyasi harekettir.\n\n\n\n\n\n\n\n\n\n\nDoğu'daki Kürtler dışında tam birlik sağlanmadıkça ülke bütünleşemeyecek.\n\nYeşil Şehirler: Gelenekçilerin Kontrolünde\nKırmızı Şehirler: Kemalistlerin Kontrolünde\nMor Şehirler: Kürtlerin Kontrolünde"
