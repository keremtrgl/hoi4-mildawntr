 TUR_parliament:0 "Türkiye Büyük Millet Meclisi"
 TUR_parliaments_desc:0 "Genellikle kısaca TBMM veya Meclis olarak anılan Türkiye Büyük Millet Meclisi, Türkiye'nin tek meclisli yasama organıdır. Türkiye Cumhuriyeti Anayasası'nın yasama yetkisi verdiği tek organdır. Millî Mücadele'nin ortasında, 23 Nisan 1920'de Ankara'da kuruldu. Kısa süre sonra, Mayıs 1920'de kendi hükümeti olan İcra Vekilleri Heyeti'ni oluşturdu. Meclis, Türkiye Cumhuriyeti'nin ilk Cumhurbaşkanı Mustafa Kemal Atatürk ve arkadaşlarının Osmanlı İmparatorluğu'nun kalıntıları üzerinde yeni bir devlet kurma çabalarında temel bir rol oynadı.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nOrdunun ülke siyasetine müdahale etmesi durumunda Meclis kapatılabilir ve savaş hâlinde ordu yönetim organlarını kendi bünyesinde toplayabilir.\n\n\n\n\n\n\n\n\n\n\n\n\n                               Türkiye Büyük Millet Meclisi'nin Fotoğrafı"
