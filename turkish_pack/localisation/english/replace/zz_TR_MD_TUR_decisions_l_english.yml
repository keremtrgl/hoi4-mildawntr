 TUR_east_express_descs:0 "Doğu Ekspresi, Türkiye Cumhuriyeti Devlet Demiryolları tarafından işletilen bir yataklı yolcu treni seferidir. Tren, Ankara Garı'ndan Kars Garı'na kadar 1.310 km (814 mil) yol kat eder. Ankara'nın doğusundaki ilk gece seferidir. Doğu Ekspresi 7 il merkezinde durur: Ankara, Kırıkkale, Kayseri, Sivas, Erzincan, Erzurum ve Kars. İlk tren 1936'da İstanbul'daki Haydarpaşa Garı'ndan Çetinkaya'ya sefer yaptı. \n\nDoğu Ekspresi'nin hâlâ geliştirilmesi gerekiyor. Projelerimiz aşağıda listelenmiştir."
