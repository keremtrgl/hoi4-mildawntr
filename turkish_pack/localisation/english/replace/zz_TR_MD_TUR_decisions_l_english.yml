 TUR_robbing_desc:0 "Çalışmak tamamen gereksiz bir şey. Çalışmak yerine çalmak kâr ve güç getirir; bir mafya hükümeti olarak küresel dünyanın inovasyon programlarını ve parasını çalarak dünyaya hükmedecek ve zenginleşeceğiz. Dünyada hiçbir ülke bizim kadar kolay çalamaz, çünkü neredeyse hiçbir ülkede mafya tamamen bağımsız değildir ve gücü sınırlıdır. Burada ise tam tersine mafya özgürdür ve hükümeti o yönetir.\n\nHırsızlığa dayalı ekonomi programımız işe yarayacak! Örneğin: ABD Pentagon dosyalarını kaybederse ne olur? Rusya askeri sırlarının ifşa olduğunu öğrendikten sonra ne yapabilir? Hiçbir şey; yapabilecekleri tek şey bize boyun eğmek olacak! Yaşasın Yüce Mafya Rejimi!"
