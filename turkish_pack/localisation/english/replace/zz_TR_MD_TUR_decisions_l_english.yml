 TUR_turkic_council:0 "Türk Keneşi Reformları"
 TUR_turkic_council_desc:0 "Türk Keneşi, resmî adıyla Türk Dili Konuşan Ülkeler İşbirliği Konseyi, Türkiye ve dört eski Sovyet cumhuriyetinden oluşan, Türk ülkelerinin bir kısmını bir araya getiren uluslararası bir örgüttür. Türk devletleri arasında kapsamlı işbirliğini geliştirmeyi amaçlayan hükümetlerarası bir kuruluştur. 3 Ekim 2009'da Nahçıvan'da kuruldu. Böyle bir işbirliği konseyi kurma fikri ilk kez 2006'da Kazakistan Cumhurbaşkanı Nursultan Nazarbayev tarafından ortaya atıldı.\n\n\n\n\n\n\n\n\n\n\n\nGenel Sekreterlik Türkiye'de, İstanbul'dadır. Üye ülkeler Azerbaycan, Kazakistan, Kırgızistan, Türkiye ve Özbekistan'dır. Türkmenistan, tarafsızlık statüsü nedeniyle şu anda konseyin resmî üyesi değildir. Ancak Türk mirası gereği konseyin muhtemel gelecekteki bir üyesidir."
 TUR_toki:0 "TOKİ Doğu Konut Programı"
 TUR_toki_desc:0 "TOKİ (Toplu Konut İdaresi Başkanlığı), Türkiye'nin devlet destekli konut kurumudur. 1984'te kurulan TOKİ, projelerini ve faaliyetlerini öncelikle hükümetin yapılaşma ve toplu konut öncelikleri doğrultusunda Türkiye genelinde yürütür. 2004'te hükümet, yeni belediye kanunuyla ilçelerin dezavantajlı bölgeleri geliştirmek için TOKİ ile işbirliği yapmasının önünü açtı."
