 TUR_space_program:0 "Türk Millî Uzay Programı"
 TUR_space_desc:0 "Türkiye Uzay Ajansı, Gebze'de "Millî Uzay Programı Çalıştayı" adıyla bir çalıştay düzenledi.\n\nTürkiye Cumhurbaşkanı, TUA tarafından hazırlanan Millî Uzay Programı'nı kamuoyuna tanıttı. Programa göre Türkiye'nin hedefleri şunlardır:\n\n2023'te Ay'a sert iniş, 2028'de yumuşak iniş\n\nUydu üretimini tek çatı altında toplamak\n\nBölgesel bir konumlama ve zamanlama sistemi kurmak\n\nUzaya bağımsız erişim için bir uzay limanı kurmak\n\nBilimsel bir görev için bir Türk vatandaşını uzaya göndermek\n\nUzay havası üzerine bilimsel araştırmalar yapmak\n\nUzaydaki cisimleri yerden gözlemleme kabiliyetini artırmak\n\nUzay sanayii ekosistemini geliştirmek\n\nToplumda uzay farkındalığını artırmak ve nitelikli insan gücü yetiştirmek\n\nUzay Teknolojileri Geliştirme Bölgesi kurmak\n\nUzaya çıkabilirsek Türkiye tam anlamıyla gelişmiş ve güçlenmiş olacak. Bunu da başaracağız!"
 TUR_state_bank:0 "Türkiye Cumhuriyet Merkez Bankası"
 TUR_state_bank_desc:0 "Türkiye Cumhuriyet Merkez Bankası, Türkiye'nin merkez bankasıdır. Görevleri arasında para ve kur politikasını yürütmek, Türkiye'nin uluslararası rezervlerini yönetmek, banknot basmak ve ihraç etmek, ülkedeki ödeme sistemlerini kurmak, işletmek ve düzenlemek yer alır. TCMB, kanunla fiyat ve finansal istikrarı sağlamak ve sürdürmekle görevlendirilmiştir ve bu hedeflere ulaşmak için elindeki politika araçlarından herhangi birini kendi takdirine göre kullanma yetkisine sahiptir. Dolayısıyla araç bağımsızlığına sahiptir ancak amaç bağımsızlığına sahip değildir."
 TUR_state_capital_1:0 "AB Bankacılık Sistemine Bağlan"
 TUR_ulkist_desc:0 "Bozkurtlar, 1960'ların sonunda Albay Alparslan Türkeş tarafından kuruldu ve 1970'lerin sonundaki siyasi şiddet döneminde üyelerinin solcu aktivistler ve militanlarla şehir gerillası çatışmalarına girmesiyle öne çıktı.\n\nKatı bir Pantürkist örgüt olan Bozkurtlar, 1990'ların başında faaliyet alanlarını Türk ve Müslüman nüfusa sahip Sovyet sonrası devletlere genişletti. Binlerce üyesi Birinci Dağlık Karabağ Savaşı'nda Azerbaycan saflarında, Birinci ve İkinci Çeçen Savaşları'nda ise Çeçen saflarında savaştı."
