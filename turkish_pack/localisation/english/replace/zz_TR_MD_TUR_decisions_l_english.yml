l_english:
 TUR_army_resists:0 "Kemalizmin Muhafızları"
 TUR_armys_resists_desc:0 "Kendini ülkemizde Kemalizmin koruyucusu olarak gören ordumuz, Kemalist düzene zarar verildiğini düşündüğü için 1960 ve 1980'de darbe yaptı. \n\nOrdumuz genellikle muhafazakâr partilerden hoşlanmaz ve laik partileri destekler. \n\nOrdumuzun darbe yapmasını önlemek istiyorsak onu memnun tutmalıyız. Darbe ihtimalini tamamen ortadan kaldırmak istiyorsak biraz daha beklememiz gerekecek.\n\nOrdumuzun partiler hakkındaki görüşleri:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAskeri darbenin diğer nedenleri ülkenin istikrarı ve ekonomisidir. \n\n Ülkenin istikrarı §R20§!£stability_texticon altındaysa ve ekonomi kötüyse darbe ihtimali yüksektir."
