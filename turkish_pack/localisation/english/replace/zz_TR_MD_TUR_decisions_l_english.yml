 TUR_earthquake_cautions:0 "Türk Konut ve Deprem Güvenliği"
 TUR_earthquake_description_desc:0 "Türkiye pek çok deprem yaşamıştır. Bu liste, merkez üssü Türkiye'nin bugünkü sınırları içinde bulunan veya bu bölgede önemli etkilere yol açan kayda değer tarihî depremleri içerir. Genel olarak İstanbul gibi büyük şehirlerde nüfus, hem dayanıksız hem de depreme dayanıklı yapılardan oluşan karma bir yapı stokunda yaşamaktadır.\n\nTektonik yapı\nTürkiye, Avrasya Levhası ile Afrika ve Arap levhaları arasındaki karmaşık çarpışma kuşağında yer alan sismik açıdan aktif bir bölgedir. Ülkenin büyük kısmı, iki büyük doğrultu atımlı fay zonu olan Kuzey Anadolu Fayı ve Doğu Anadolu Fayı ile sınırlanan küçük bir levha olan Anadolu Levhası üzerinde bulunur. Ülkenin batısı ayrıca Helen yayının güneye doğru göçünün neden olduğu Ege Denizi'ndeki genişleme tektoniğinden de etkilenir. Türkiye'nin en doğu kesimi ise bindirme tektoniğinin hâkim olduğu Zagros kıvrım ve bindirme kuşağının batı ucunda yer alır.\n\nSismik tehlike\nTürkiye'de sismik tehlike levha sınırları boyunca en yüksek seviyededir, ancak ülkenin neredeyse her yerinde hasar verici deprem riski önemli ölçüdedir. Sismik risk haritaları zaman içinde değişmiştir.                     \n\n\n\n\n\n\n\n\n\n\n\n\n\n§gTürkiye'deki depremler konut projelerini etkiler; bu yüzden ülkemizde konut konusu zordur. Bir karar vermeliyiz:\n\n1) Ucuz malzeme kullanır, binaları kötü durumda bırakır ve halkımızın canını umursamayız.\n\n2) Konut projelerine makul bir bütçe ayırarak halkımızın canını korumaya çalışırız.\n\n3) Konut projelerini pahalı hâle getirerek halkımızın canını koruruz.\n\n§RBinalarımız kötü durumda kalırsa en yüksek hasarı alırız.\n§YBinalarımız orta derecede dayanıklı olursa orta düzeyde hasar alırız.\n§GBinalarımız tamamen dayanıklı olursa en düşük hasarı alırız.\n\n§YYalnızca 7 ve üzeri büyüklükteki depremlerin bu etkileri değiştirdiğini unutmayın.\n\n£pol_idea §YDepreme Dayanıklılık:§! §R[?TUR_building_resistancy]§!"
