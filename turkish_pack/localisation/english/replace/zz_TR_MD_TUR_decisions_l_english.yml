 TUR_crush_the_pkks_world_presence:0 "Kürt-Türk Çatışması - Dünya Cephesi"
 TUR_crush_the_pkks_world_presence_desc:0 "§Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§! ve diğer birçok küçük Kürt isyancı grubu, 1980'lerden beri Türk hükümetine karşı gerilla savaşı yürütüyor. Bu grupların hedefleri tam bağımsızlıktan geniş özerkliğe kadar uzanıyor. \n\n§Y£pkk PKK §! faaliyeti, örgütün §YSaldırganlığı§! ve §YGücü§! ile ölçülür.\n\n§YSaldırganlık§!, §Y£pkk PKK §!'nın genel savaşma isteğini ölçer ve saldırıların sıklığını etkiler. §YSaldırganlık§! her hafta belirli bir sınıra kadar doğal olarak azalır. Saldırganlık sınırı; Kürt illerinin kalkınmasına, sizin ve diğer ülkelerin olay ve kararlarına bağlı olarak hem azalabilir hem de artabilir. 50 veya altına düşerse §Y£pkk PKK §! ateşkes ilan eder. Düşük §HSaldırganlık§! hiç saldırı olmayacağı anlamına gelmez; yalnızca §Y£pkk PKK §!'nın her zamankinden daha az saldırı düzenleyeceği anlamına gelir.\n\n§YGüç§!, §Y£pkk PKK §!'nın askeri kabiliyetlerini ve popülerliğini ölçer ve Kürt bölgelerindeki direnişin gücünü etkiler. §YGüç§! değeri, §Y£pkk PKK §!'nın faaliyet gösterdiği her ülke için en az 15'tir. Güç ayrıca saldırıların verdiği hasarı da etkiler: ne kadar yüksekse o kadar çok zarar görürsünüz.\n\n§YSaldırganlık§! §Rsaldırıların daha sık olmasına§! yol açar, §HGüç§! ise bu saldırıların verdiği hasarı belirler. Bu rastgele saldırılar §Y£pkk PKK §! §HGücünü§! artırır; bu değer §H100!§! seviyesine ulaşırsa §Y£pkk PKK §! bizden bağımsızlığını ilan edebilir. Baskınlarla §Y£pkk PKK §!'nın §Hgücünü§! doğrudan azaltabiliriz, ancak bu §HSaldırganlıklarını§! artırma riski taşır.\n\n§Y£pkk PKK§!'yı tamamen ortadan kaldırmak için gücünün §Y15§! altında ve saldırganlığının §Y45§! altında olması gerekir. \n\n§Y£pkk PKK §! Saldırganlığı: [?TUR.TUR_PKK_aggro]\nSaldırganlık Sınırı: [?TUR.TUR_PKK_max_aggro]\nSaldırganlık: Haftada [?TUR.TUR_PKK_aggro_increase]\n\n§Y£pkk PKK §! Gücü: [?TUR.TUR_PKK_strength]\nAsgari Güç: [?TUR.TUR_PKK_min_strength]"
