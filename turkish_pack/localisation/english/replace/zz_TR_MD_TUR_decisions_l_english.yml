 TUR_mafiatic_ins:0 "Mafya Karargâhının Fotoğrafı"
 TUR_mafiatic_desc:0 "Türk mafyası, Türkiye merkezli ve/veya (eski) Türk vatandaşlarından oluşan suç örgütleri için kullanılan genel bir terimdir. Kökeni Türkiye'ye dayanan suç grupları, güçlü bir Türk göçmen topluluğunun bulunduğu Batı Avrupa'nın genelinde, daha az ölçüde de Orta Doğu'da faaliyet gösterir. Türk suç grupları geniş bir yelpazede suç faaliyetlerine katılır; uluslararası alanda bunların en önemlisi uyuşturucu, özellikle eroin kaçakçılığıdır. Eroin kaçakçılığında, eroini İtalya gibi ülkelere taşıyan Bulgar mafya gruplarıyla işbirliği yaparlar. Cosa Nostra ile Türk mafyasının son derece yakın olduğu bilinir. Diğer uyuşturucu türlerinin kaçakçılığı, yasa dışı kumar, insan ticareti, fuhuş ve haraç gibi suçlar hem Türkiye'de hem de Almanya, Hollanda, Belçika, Arnavutluk ve Birleşik Krallık gibi kalabalık Türk topluluklarının yaşadığı Avrupa ülkelerinde işlenir.\n\nTürk suç örgütlerinin çoğunun kökeni iki bölgeye dayanır: Türkiye'nin kuzeydoğusunda, Karadeniz kıyısındaki Trabzon ili ve ülkenin güneyindeki Doğu ve Güneydoğu Anadolu. En büyük kaynak, Trabzon yakınlarındaki Karadeniz kıyısıdır."
 TUR_mafias_organized:0 "Mafya Ele Geçirme İçin Yerleşti ve Örgütlendi"
 TUR_islamist_restorationists:0 "İslamcı Restorasyoncuların Gizli Planları"
 TUR_islamist_restorationists_desc:0 "Ülkemizdeki radikal İslamcı grupların iktidarı ele geçirmek için gizli planları var, ancak bu planları uygulayacak güçleri yok. Onlara yardım edersek Türk tarihinde büyük bir değişime yol açabiliriz ve bizim sayemizde Osmanlı İmparatorluğu ya da Büyük İslam Hilafeti yeniden doğabilir.\n\nİslam Devriminin Düşmanları ve Müttefikleri:\n\nMüttefikler: §Y[Caliphate_L]§! ve §Y[Monarchist_L]§!\n\nPotansiyel Müttefikler: §Y[Conservative_L]§!\n\nBaş Düşmanlar: §Y[socialism_L]§! ve §Y[Nat_Autocracy_L]§!\n\nPotansiyel Düşmanlar: §Y[conservatism_L]§!, §Y[communist_state_L]§! ve  §Y[Neutral_Autocracy_L]§!"
