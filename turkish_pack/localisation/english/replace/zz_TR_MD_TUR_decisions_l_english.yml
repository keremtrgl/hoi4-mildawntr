 TUR_court_desc:0 "Bazen AYM olarak kısaltılan Türkiye Cumhuriyeti Anayasa Mahkemesi, Türkiye'de anayasal denetim yapan en yüksek yargı organıdır. Kanunların, kanun hükmünde kararnamelerin ve Türkiye Büyük Millet Meclisi İçtüzüğü'nün Anayasa'ya şekil ve esas bakımından uygunluğunu denetler.\n\n§YAYM'nin istatistikleri:§!\n\n\n\n\n\n§YMahkeme içindeki gruplar:§!\n\n\n\n\n\n\nAYM'nin birlik oranı, mahkemenin kendini yenileme kapasitesini gösterir. Bu kapasite yüksekse AYM radikal kararları reddetme eğilimindedir. \n\nAYM'nin siyasallaşma oranı, mahkemedeki sorunların boyutunu gösterir. Siyasallaşma çok artarsa ordu devreye girebilir. \n\nGruplar yalnızca AYM rejimi devralırsa önem kazanır; o zamana kadar bunları dikkate almayabilirsiniz."
