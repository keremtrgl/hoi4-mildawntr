 TUR_union_situation_desc:0 "Türkiye'de işçi sendikaları, 1938 tarihli Cemiyetler Kanunu'ndaki “sınıf esasına dayalı cemiyet kurulamaz” ibaresinin 5 Haziran 1946'da metinden çıkarılmasıyla yasallık kazandı. 7 Aralık 1946'da sıkıyönetim kararıyla kapatılan sendikalar, 1947'de İşçi ve İşveren Sendikaları ve Sendika Birlikleri Hakkında Kanun'un kabulüyle yeniden yasal hâle geldi.\n\n§gBugün işçi sendikaları ile işveren sendikaları sürekli çatışma hâlinde. Bu sendikaları uzlaşı içinde tutmamız gerekiyor; aksi takdirde başımıza kötü şeyler gelir ve bu, insanların greve gitmesine kadar varabilir. Onları memnun tuttuğumuz sürece başımıza kötü bir şey gelmez.§!\n\nİşçi sendikası güçleri: §Y£disk DİSK, £turk_is TÜRK-İŞ ve diğerleri§!\nİşveren sendikası güçleri: §Y£tisk Kolektif TİSK§!\n\n§gİşveren sendikaları bizim için pek sorun oluşturmuyor; bu yüzden işçi sendikalarına odaklanıyoruz.§!\n\n§Yİşçi Sendikaları ve Tehditler:§!\n\n§gAşağıdaki koşulların çoğu oluşursa işçi sendikaları ayaklanabilir.\n\n§RGrevlerin Başlıca Nedenleri:§!\n\n§YSendikalarla Kötü İlişkiler:§! Sendikalar büyük ihtimalle sanayi üretimini düşürür.\n§YDüşük İstikrar:§! İşgücünde strese yol açar.\n§YEkonomik Buhran:§! İşgücünde genel huzursuzluğa yol açar.\n§YSavaş Hâli:§! İşgücü, tahammülü tükenene kadar üretmeye devam edebilir.\n\n§GSendikaların Siyasi Duruşu:§!\n\n§gSendikalarla iyi ilişkiler kurarak onlarla ittifak yapabilir, işçileri kızdırmadan sanayi üretimini artırabilir ve geliri en üst düzeye çıkarabilirsiniz.\n\n§YSendikaların Güç Aralığı:§!\n\n§gBelirli yasalar çıkararak güç aralıklarını daraltabilirsiniz; bu yasalar, onlarla ilişkileriniz 95'in üzerindeyken kullanılabilir hâle gelir.\n\n§gGüç aralıklarını daraltırsanız verebilecekleri zarar çok daha az olur.§!\n\n£population_texticon §Yİşçi Sendikalarıyla İlişkiler:§! §g[?TUR_union_acceptance]§!\n£puppet_texticon §YSendikaların Siyasi Duruşu (Lehte):§! §g[?TUR_union_uneasiness]§!\n£market_subsidy_small_texticon §YSendikaların Güç Aralığı:§! §g[?TUR_union_political_level]§!\n\n§RSanayinin büyümesinin sendikalaşmayı çarpıcı biçimde artıracağını unutmayın.§!"
