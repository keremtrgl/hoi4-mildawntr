 TUR_the_brain_drain_problem_desc:0 "Beyin göçü, nitelikli veya yetenekli bireylerin genellikle daha iyi fırsatlar, daha yüksek maaşlar veya daha iyi yaşam koşulları arayışıyla bir ülkeden başka bir ülkeye göç etmesini ifade eder.\n\nÜlkemizdeki beyin göçü son zamanlarda hızlı ve kontrol edilemez bir boyuta ulaştı. Bunu derhâl durdurmalıyız; aksi takdirde bu ülke nitelikli işgücü sıkıntısıyla karşı karşıya kalacak ve topallayarak ilerleyecek."
