 TUR_the_covid:0 "COVID-19"
 TUR_the_covid_desc:0 "Koronavirüs hastalığı 2019 olarak da bilinen COVID-19, şiddetli akut solunum sendromu koronavirüsü 2'nin (SARS-CoV-2) neden olduğu, son derece bulaşıcı bir solunum yolu hastalığıdır. Hastalık ilk kez Aralık 2019'da Çin'in Hubei eyaletindeki Wuhan'da tespit edildi ve hızla yayılarak küresel bir salgına dönüştü.\n\nDünya genelinde yayılan COVID-19 ülkemize de ulaştı ve ülkemize zarar vermeye başladı. Mutlaka kayıplar olacak ve bir şekilde bunun üstesinden gelmemiz gerekiyor. COVID-19'u yenmeye başlayalım."
