 MAF_DESC:0 "Ülkemizde belirli sayıda mafya grubu bulunuyor. §Y1980'lerin sonu ve 1990'larda mafya, komünistlere ve PKK terör örgütüne karşı mücadelede çalıştı.§! Mafyanın perde arkasında çalışmaya devam etmesi için ona sessizce belirli bir destek verebiliriz §Rya da mafyanın kökünü kazımak için kararlı bir operasyon başlatarak mafya düzenine son verebiliriz.§! Onların sonu, ülkemize belirli ölçüde istikrar ve güvenlik getirecektir."
