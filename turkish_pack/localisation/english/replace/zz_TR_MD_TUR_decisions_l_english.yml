 TUR_bitcoin_sell_buy_desc:0 "Bitcoin; merkez bankası veya tek bir yöneticisi olmayan, aracıya gerek kalmadan eşten eşe bitcoin ağı üzerinden kullanıcıdan kullanıcıya gönderilebilen merkeziyetsiz bir dijital para birimidir. İşlemler, ağ düğümleri tarafından kriptografi ile doğrulanır ve blokzincir adı verilen herkese açık, dağıtık bir defterde kaydedilir. Kripto para, 2008'de Satoshi Nakamoto adını kullanan kimliği bilinmeyen bir kişi ya da grup tarafından icat edildi. Para birimi, 2009'da yazılımının açık kaynak olarak yayımlanmasıyla kullanılmaya başlandı."
 TUR_osman_pamukoglu_question:0 "Osman Pamukoğlu'nun Görüşü"
 TUR_osman_pamukoglu_question_desc:0 "Osman Pamukoğlu, hâlen Türk Silahlı Kuvvetleri'nde görev yapan bir komutandır. Türk siyasetindeki gelişmeler bu komutanı siyasete atılmaya yöneltebilir; bu yüzden siyaset hakkındaki düşünceleri çok önemlidir.\n\n§YOsman Pamukoğlu'nun Türk siyasetine dair olumsuz görüşü yaklaşık §!§R%50§!§Y seviyesine çıkarsa, büyük ihtimalle komutanlığı bırakıp siyasete atılacaktır.§! \n\n§YOsman Pamukoğlu'nun Türk siyasetine dair olumsuz görüşü yaklaşık §!§G%25§!§Y seviyesinde kalırsa, büyük ihtimalle komutan olarak kalacaktır.§!"
