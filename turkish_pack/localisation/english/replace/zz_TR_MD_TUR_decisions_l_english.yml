 TUR_robbing_2_desc:0 "Ulusal güvenliğimizi sağlamak ve stratejik üstünlük elde etmek için Sessiz Sızma Operasyonu'nu yürütmeliyiz: yabancı ülkelerden hassas belgeleri ve istihbaratı çalmayı amaçlayan cüretkâr, gizli bir görev. Bu değerli bilgileri ele geçirerek istihbarat kabiliyetimizi önemli ölçüde güçlendirebilir ve olası tehditlere karşı daha iyi hazırlanabiliriz."
 TUR_municipality_race:0 "Türkiye Yerel Seçimleri"
 TUR_mun_desc:0 "Türkiye'deki yerel seçimler, şehirlerin, kasabaların ve ilçelerin yerel yönetimini belirledikleri için büyük önem taşır. Adaylar genellikle farklı siyasi partileri temsil eder ve seçim kampanyaları yerel sorunlara, altyapı gelişimine, kamu hizmetlerine ve toplumsal refaha odaklanır.\n\nÜlkedeki şehirlerin belediyelerini kazanırsak elde edeceklerimiz:\n\n+5 Yerel İnşa Hızı\n\nYerel seçimler genel seçimlerden bağımsız olarak yapılır; bu yüzden seçimleri yasaklasanız bile yerel seçimler devam edebilir.\n\n\n\n\n\n\n\n\n\n\nSarı Şehirler: Hükümet ve Koalisyon\nKırmızı Şehirler: Muhalefet"
