 TUR_relations_with_echologists:0 "Çevrecilerle İlişkiler"
 TUR_relations_with_echologists_desc:0 "Doğa, tüm karmaşık güzelliği ve çeşitliliğiyle gezegenimizdeki yaşamın temelini oluşturur. Gür ormanlardan canlı ekosistemlere, uçsuz bucaksız okyanuslardan iklimin hassas dengesine kadar doğa, tüm canlıları besleyen ve yaşatan vazgeçilmez bir varlıktır. Son zamanlarda doğanın refahımızdaki, çevredeki ve türümüzün geleceğindeki hayati rolünü giderek daha iyi anladıkça doğaya verilen önem de artmıştır.\n\nToplumun ekolojik görüşlere sahip eğitimli ve aydın\n kesimi bu doğayı korumak istiyor.\nDoğa devlet tarafından korunursa\n devleti destekliyorlar; korunmazsa\n protestolar düzenleyerek devletimize zarar veriyorlar. Bu yüzden\n onlarla ilişkimizi sıkı tutmalıyız, ancak bu\n durum sanayide bize çok şeye mal olabilir.\n\n§YBatı yanlısı popülerlik %25'in altına düşerse halk artık \nekolojik tahribatı umursamayacak."
