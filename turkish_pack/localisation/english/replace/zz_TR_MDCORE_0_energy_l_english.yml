 toggle_nuclear_power_plant_generation_tt:0 "§YNükleer Santral Üretimini Aç/Kapat§!\n§YNükleer Santral§! enerji üretimini aç veya kapat. Bunu, nükleer yakıtı ileride kullanmak üzere saklamak ya da biriktirmek için yalnızca diğer üretim yöntemlerine odaklanmak amacıyla yapabiliriz."
