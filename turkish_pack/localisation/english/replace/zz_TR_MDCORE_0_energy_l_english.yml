 decision_category_energy:0 "Enerji Karar Kategorisi"
 decision_category_energy_desc:0 "\n£MAIN_desctext_energy \n\n\n\n§Y[ROOT.GetFlag]Her ülkenin§! işlevlerinin ve hizmetlerinin aksamaması için belirli bir düzeyde enerji ihtiyacını karşılaması gerekir. Ekonomimizin sürekli büyüyen §Yenerji ihtiyacını§! karşılamakta §Rbaşarısız§! olursak ağır §Rsonuçlarla§! ve §Rtam kapsamlı bir ekonomik durmayla§! karşılaşabiliriz."
 energy_building_battery_parks:0 "Batarya Parkı §YInşa Ediliyor§!"
 energy_building_battery_parks_desc:0 "Genel yenilenebilir enerji yolunu seçtik. Artık yenilenebilir altyapımızın ürettiği enerjiyi depolamak için gereken malzemeleri inşa etmeye başlama zamanı."
 energy_automatic_fuel_purchase:0 "Otomatik §YYakıt Alımı§!"
 energy_automatic_fuel_purchase_desc:0 "Şu anda yakıtımız azaldığında her yirmi sekiz günde bir piyasa fiyatından yakıt satın alıyoruz."
 HEADER_TEXT_TITLE:0 "§YENERJİ§!"
 energy_dynamic_modifier:0 "Ulusal Elektrik Şebekesi"
 energy_dynamic_modifier_TT:0 "Bu Ruh; fosil yakıtlı santrallerin yakıt tüketiminin, elektrik dışı kaynaklardan doğrudan yakıt tüketiminin ve elektrik tüketiminin üretimle karşılanamaması hâlinde ortaya çıkacak olası cezaların toplamını gösterir. Ayrıca Enerji Yük Paylaşımı yoluyla başka bir ülkeden paylaşılan ya da verilen enerjiyi de gösterir."
 no_fuel_penalties_modifier:0 "Yakıt Eksikliği Cezaları"
 no_fuel_penalties_modifier_TT:0 "Bu Ruh, ülkenin tüm yakıt rezervlerini tüketip halkın tüketimi için hiç yakıt bırakmaması hâlinde ortaya çıkacak cezaları gösterir."
 hydroelectric_infrastructure_in_state:0 "Hidroelektrik Altyapısı"
 hydroelectric_infrastructure_in_state_TT:0 "Hidroelektrik Altyapısı; hidroelektrik barajların, depolamanın ve Hidroelektrik Enerjiyle ilgili diğer tesislerin tamamını kapsar. Eyaletteki çarpan, üretilen toplam enerjiyi ve depolayabileceği miktarı içerir. Toplam enerji üretiminize katkıda bulunur ve böylece sanayi ve halkın enerji tüketimini karşılamaya yardımcı olur."
 geothermal_infrastructure_in_state:0 "Jeotermal Altyapı"
 geothermal_infrastructure_in_state_TT:0 "Jeotermal Altyapı; tüm jeotermal enerji santrallerini ve benzer altyapıyı kapsar. Toplam enerji üretiminize katkıda bulunur ve böylece sanayi ve halkın enerji tüketimini karşılamaya yardımcı olur."
 renewable_capacity_factor_dyn_mod_TT:0 "§Y[THIS.GetName]§!, ya istikrarlı güçlü rüzgârlar ya da yıllık ortalamanın üzerinde güneş ışığı sayesinde yenilenebilir enerji üretimi için elverişli koşullara sahip bir §YYenilenebilir Enerji Odağıdır§!.\n\nYenilenebilir faktörü ne kadar yüksekse, bu bölgedeki yenilenebilir enerji parkları eyaletin sahibi için her hafta o kadar fazla enerji üretir."
 heavy_power_restrictions_spirit:0 "Ağır Elektrik Kısıtlamaları"
 heavy_power_restrictions_spirit_desc:0 "Hükümet, halkına bir dizi ağır elektrik kısıtlaması getirdi. Enerji ve elektrik tüketimi büyük ölçüde azaldı, ancak bunun bedeli vergi geliri kaybı ve diğer ekonomik cezalar oldu."
 some_power_restrictions_spirit:0 "Orta Düzey Elektrik Kısıtlamaları"
 some_power_restrictions_spirit_desc:0 "Hükümet, halkına bir dizi küçük elektrik kısıtlaması getirdi. Enerji ve elektrik tüketimi biraz azaldı, ancak bunun bedeli vergi geliri kaybı ve diğer ekonomik cezalar oldu."
 some_additional_consumption_spirit:0 "Orta Düzey Elektrik Tüketimi Sübvansiyonları"
 some_additional_consumption_spirit_desc:0 "Hükümet, mali yükü biraz hafifletmek için insanların elektrik kullanımına yönelik küçük ölçekli hedefli sübvansiyonlar başlattı. Harcamalar biraz arttı, ancak elektrik tüketimi fırladı."
 heavy_additional_consumption_spirit:0 "Yüksek Elektrik Tüketimi Sübvansiyonları"
 heavy_additional_consumption_spirit_desc:0 "Hükümet, mali yükü biraz hafifletmek için insanların elektrik kullanımına yönelik büyük ölçekli hedefli sübvansiyonlar başlattı. Ek harcamalar önemli ölçüde arttı, ancak elektrik tüketimi fırladı."
