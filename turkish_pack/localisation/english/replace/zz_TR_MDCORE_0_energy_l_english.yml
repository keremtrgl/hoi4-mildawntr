 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT:0 "Bu değer, §YNükleer Reaktörlerimiz§! için haftalık net §YReaktör Sınıfı Malzeme§! üretimini gösterir. Değer, §YReaktör Sınıfı Malzemenin§! haftalık üretimi ile tüketimi arasındaki farktır.\n\n§YReaktör Sınıfı Malzeme Stoku§!: £GFX_nuclear_material_texticon §G[?var_reactor_material_stockpile]§! Kg\n§YReaktör Sınıfı Malzemenin Haftalık Üretimi§!: [?total_nuclear_reactor_fuel_production|G2] Kg\n§YReaktör Sınıfı Malzemenin Haftalık Tüketimi§!: [?nuclear_fuel_consumption|-2] Kg\n\n§YÇarpanlar§!:\nYasa, Ulusal Ruh ve Teknolojilerin §YNükleer Reaktör Yakıtı§! Tüketimi üzerindeki etkisi: [?modifier@nuclear_fuel_consumption_modifier|-%]"
