 toggle_fossil_fuel_power_plant_generation_tt:0 "§YFosil Yakıtlı Santral Üretimini Aç/Kapat§!\n§YFosil Yakıtlı Santral§! enerji üretimini aç veya kapat. Bunu yalnızca yenilenebilir enerjiye odaklanmak ya da saatlik fosil yakıt tüketimini azaltmak için taktik bir tercih olarak yapabiliriz."
