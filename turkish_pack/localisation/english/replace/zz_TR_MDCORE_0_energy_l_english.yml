 DISP_UNEMPLOY_NUM:0 "§R[?ROOT.total_unemployed|3]§! §Ymilyon§!"
 total_ffp_amount_tt:0 "Bu değer, ülkemizdeki toplam §YFosil Yakıtlı Santral§! sayısını gösterir."
 total_ffp_amount_tt_delayed:0 "§YFosil Yakıtlı Santraller§!, fosil bazlı tüm termoelektrik enerji kaynaklarını kapsayan genel bir kategoridir. Kömür, doğal gaz ve petrol bunlardan bazılarıdır. Enerji üretimi tüketimden yüksekse §YFosil Yakıtlı Santraller§! boşta bekler.\n\nEyalete sağladıkları:\nGereken Temel İşçi Sayısı: §Y7,5 bin§!\n§YFosil Yakıtlı Santral§! Başına Temel GSYİH Çıktısı: $§Y1,7 Milyar§!\nTemel Enerji Kazancı: §G+2§! GW\n\nMevcut §YSantral Başına Enerji Kazancı§!: [?fossil_pp_energy_per_plant_display|+2] GW"
 total_nuclear_reactor_amount_tt:0 "Bu değer, ülkemizdeki toplam §YNükleer Reaktör§! sayısını gösterir."
 total_nuclear_reactor_amount_tt_delayed:0 "Bu bina, nükleer enerjiyi elektrik enerjisine dönüştürür ve bu süreçte orta düzeyde zenginleştirilmiş uranyum tüketir.\n\nEyalete sağladıkları:\nGereken Temel İşçi Sayısı: §Y115 bin§!\n§YNükleer Reaktör§! Başına Temel GSYİH Çıktısı: $§Y4 Milyar§!\nTemel Enerji Kazancı: §G+4§! GW\n\nMevcut §YReaktör Başına Enerji Kazancı§!: [?nuclear_energy_per_reactor_display|+2] GW"
 total_renewable_energy_amount_tt:0 "Bu değer, ülkemizdeki toplam §YYenilenebilir Enerji Altyapısı§! sayısını gösterir."
 total_renewable_energy_amount_tt_delayed:0 "§YYenilenebilir Enerji Altyapısı§!, tüm yenilenebilir enerji kaynaklarını kapsayan genel bir kategoridir. Güneş parkları, rüzgâr türbinleri, biyoyakıt rafinerileri, kömür tesisleri, biyoyakıtlı santraller ve daha fazlası bunlardan bazılarıdır. Bu nedenle yenilenebilir kaynakları kullanır ve bu kaynaklardan yakıt üretir.\n\nEyalete sağladıkları:\nGereken Temel İşçi Sayısı: §Y22,5 bin§!\n§YYenilenebilir Enerji Altyapısı§! Başına Temel GSYİH Çıktısı: $§Y2 Milyar§!\nTemel Enerji Kazancı: §G+0,5§! GW\n"
 total_fuel_silo_amount_tt:0 "Bu değer, ülkemizdeki toplam §YStratejik Kaynak Rezervi§! sayısını gösterir."
 total_fuel_silo_amount_tt_delayed:0 "§YStratejik Kaynak Rezervleri§!; depoların, kuru depolama alanlarının ve diğer §YYakıt§! benzeri depolama tesislerinin birleşimidir. Bu bina, ülkenize §HYakıt§! stoklamak için daha fazla alan sağlar."
 ENERGY_POLICY_AUTOMATION_SHORT:0 "Otomatik"
 ENERGY_POLICY_AUTOMATION_TT:0 "§YOtomatik Tüketim Politikası§!\nHaftalık enerji güncellemesi sırasında tüketim politikasını otomatik olarak bir kademe ayarlar. Sürdürülebilir net karşılama oranı §R%95§!'in altındaysa kısıtlamaları artırır; §G%110§!'un üzerindeyse kısıtlamaları gevşetir veya tüketimi artırır. Ek tüketim için, hiç depolama kapasitesi yoksa durum hariç, batarya depolamasının en az §Y%95§! dolu olması gerekir. Enerji ithalatı ve taahhüt edilmiş ihracat hesaba katılır; batarya çekimleri hesaba katılmaz. Bir politikayı elle seçmek otomasyonu devre dışı bırakır."
 heavy_power_restrictions_button_tt:0 "§YAğır Elektrik Kısıtlamaları§!\nEnerji tüketimimiz enerji üretimimizi aşıyor. Geçici bir çözüm, ek santraller, yenilenebilir enerji ve daha fazlasını inşa etmeye başlayana kadar halkın elektrik tüketimini hızla kısıtlamak olabilir. Halka ağır kısıtlamalar getirmek ekonomik büyümede, enerji tüketiminde ve siyasi etkide önemli bir düşüşe yol açacaktır."
 heavy_power_restrictions_button_delayed_tt:0 "§YEtkiler:§!\n[!heavy_power_restrictions_button_click]"
 some_power_restrictions_button_tt:0 "§YBazı Elektrik Kısıtlamaları§!\nEnerji tüketimimiz enerji üretimimizi aşıyor. Geçici bir çözüm, ek santraller, yenilenebilir enerji ve daha fazlasını inşa etmeye başlayana kadar halkın elektrik tüketimini hızla kısıtlamak olabilir. Halka bazı kısıtlamalar getirmek ekonomik büyümede, enerji tüketiminde ve siyasi etkide küçük bir düşüşe yol açacaktır."
 some_power_restrictions_button_delayed_tt:0 "§YEtkiler:§!\n[!some_power_restrictions_button_click]"
 no_power_restrictions_button_tt:0 "§YElektrik Kısıtlaması Yok§!\nMevcut durumun korunması, ülkemizin ekonomisi ve partimizin siyasi güvenliği için genellikle en normal senaryodur. Halkın tüketimini ne kısıtlıyoruz ne de ek tüketimi teşvik ediyoruz."
 no_power_restrictions_button_delayed_tt:0 "§YEtkiler:§!\n[!no_power_rules_button_click]"
 some_additional_consumption_button_tt:0 "§YBir Miktar Ek Tüketim§!\nŞu anda büyük ulusumuz için fazla enerji üretiyoruz. Fazla üretimimizden yararlanmak için bir miktar ek tüketimi teşvik etmeliyiz. Ek tüketimi teşvik etmek, halkın enerji tüketimini az miktarda artırırken inşaat hızında ve Siyasi Güçte küçük bir bonus sağlayacaktır."
 some_additional_consumption_button_delayed_tt:0 "§YEtkiler:§!\n[!some_additional_consumption_button_click]"
 heavy_additional_consumption_button_tt:0 "§YYüksek Ek Tüketim§!\nŞu anda büyük ulusumuz için fazla enerji üretiyoruz. Fazla üretimimizden yararlanmak için bir miktar ek tüketimi teşvik etmeliyiz. Yüksek ek tüketimi teşvik etmek, halkın enerji tüketimini çarpıcı ölçüde artırırken inşaat hızında ve Siyasi Güçte büyük bir bonus sağlayacaktır."
 heavy_additional_consumption_button_delayed_tt:0 "§YEtkiler:§!\n[!heavy_additional_consumption_button_click]"
 build_battery_park_button_tt:0 "§YBatarya Parkı İnşa Et§!\n§YBatarya Parkı§!, her biri fazla enerji üretiminin §Y100GWh§!'ini depolayabilen büyük ve pahalı bir yapıdır. Özellikle istikrarsız çıktısı nedeniyle yenilenebilir enerji kullanırken, tüketimi karşılayacak kadar üretemediğimiz zamanlar için enerji depolamak amacıyla bu tesisleri inşa etmek faydalı olabilir."
 build_battery_park_button_delayed_tt:0 "§YÖn Koşullar:§!\n[!build_battery_park_button_click_enabled]\n§YEtkiler:§!\n[!build_battery_park_button_click]\n£key_shift + £click_left §YShift + Sol Tıkla§! ile tek seferde §YÜç Batarya Parkını§! sıraya alabiliriz.\n§YÖn Koşullar:§!\n[!build_battery_park_button_shift_click_enabled]\n§YEtkiler:§!\n[!build_battery_park_button_shift_click]"
 buy_fuel_for_money_button_tt:0 "§YPiyasadan Yakıt Satın Al§!\nDünyanın dört bir yanındaki bazı satıcılar para karşılığında yakıt sunuyor. Yakıt satın almak, fosil yakıtlı santrallerimizi ve ordumuzu sıkışık anlarda çalışır durumda tutmaya yardımcı olabilir."
 buy_fuel_for_money_button_delayed_tt:0 "§YÖn Koşullar:§!\n[!buy_fuel_for_money_button_click_enabled]\n§YEtkiler:§!\n[!buy_fuel_for_money_button_click]\n£key_shift + £click_left §YShift + Sol Tıkla§! ile yakıtımız azaldığında otomatik §YYakıt§! alımı ayarla"
 enable_nuclear_reactor_fuel_production_tt:0 "§YNükleer Zenginleştirmeyi Etkinleştir§!\nGerekli tesislere sahipsek kendi nükleer reaktör yakıtımızı üretebiliriz. Süreç pahalı ve zaman alıcıdır, ancak ülkemizin nükleer reaktörlerinin çalışmaya devam edebilmesi için önemlidir."
