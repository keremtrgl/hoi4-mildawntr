 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES_TT:0 "Bu değer, tüm aktif §YFosil Yakıtlı Santrallerimizin§! günlük tükettiği toplam yakıt miktarını gösterir. Toplam üretim kapasiteniz toplam tüketiminizden büyük olduğunda §YFosil Yakıtlı Santraller§! boşta beklemeye başlar.\n\n§YÇarpanlar§!:\nYasa, Ulusal Ruh ve Teknolojilerin §YFosil Yakıtlı Santral Yakıtı§! Tüketimi üzerindeki etkisi: [?modifier@fossil_pp_fuel_consumption_modifier|-%]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES:0 "§YHalkın§! Günlük §YYakıt§! Tüketimi: [?non_electric_fuel_display|0R]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES_TT:0 "Bu değer, tüm §YHalkımızın§! günlük tükettiği toplam yakıt miktarını gösterir.\n\n§YÇarpanlar§!:\nYasa, Ulusal Ruh ve Teknolojilerin §YElektrik Dışı Yakıt§! Tüketimi üzerindeki etkisi: [?modifier@non_electric_fuel_consumption_modifier|-%]\nMevsimlik Halk Talebi: [?energy_seasonal_population_demand_factor|%0R]\n\nHalkın elektrik ve elektrik dışı yakıt talebi Aralık-Şubat ve Haziran-Ağustos aylarında %20 artar. Mevsimlik talep diğer çarpanlardan sonra uygulanır ve haftalık enerji hesaplamasıyla güncellenir."
