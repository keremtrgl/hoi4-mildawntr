 advanced_production_modifier:0 "Gelişmiş Üretim Kısıtlamaları"
 advanced_production_modifier_desc:0 "Teknoloji Metali ([?THIS.resource@tungsten|+]), Değerli Metal ([?THIS.resource@chromium|+]), Petrol ([?THIS.resource@oil|+]) veya Kauçuk ([?THIS.resource@rubber|+]) azalmaya başladığında mikroçip ve/veya kompozit üretimimiz zarar görür. Herhangi bir kaynaktaki açık, mikroçip ve/veya kompozit üretiminde düşüşe yol açar. Ayrıca mikroçip üretimi önemli miktarda enerji gerektirdiğinden, enerji kıtlıkları üretimi ayrıca [?unfulfilled_energy_demand_dynmod_var|%] oranında azaltır\n\n§YÜretim azalması her zaman temel üretim rakamlarının§! §R%95§!'i §Yile sınırlandırılır.§!"
 civilian_microchip_consumption_modifier:0 "Sivil ve Endüstriyel Mikroçip Tüketimi"
 civilian_microchip_consumption_modifier_desc:0 "Teknoloji işletmelere ve sıradan insanlara giderek daha fazla ulaştıkça halkımız ve gelişmiş sanayilerimiz mikroçip tüketmeye başlayacak. Bu talebe yetişmemiz gerekiyor, aksi hâlde üretim hatlarımız zorlanır. Savaş zamanında askeri üretim sivil kullanımın önüne geçer, ancak talepleri karşılanmadığı için bu halkta huzursuzluğa yol açabilir."
