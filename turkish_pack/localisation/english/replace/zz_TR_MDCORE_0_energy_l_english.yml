 is_currently_in_an_energy_load_sharing_agreement_tt:0 "[THIS.GetNameWithFlag] şu anda [ROOT.GetNameWithFlag] ile bir §YEnerji Yük Paylaşımı§! Anlaşması içinde\n"
 is_currently_importing_oil_tt:0 "[THIS.GetNameWithFlag] şu anda başka bir ülkeden §YFosil Yakıt§! ithal ediyor.\n"
 early_renewables:0 "Temel Güneş Panelleri"
 early_renewables_desc:0 "Temel güneş panellerinin geliştirilmesi, ülkelerin güneş ışığından yararlanıp elektriğe dönüştürmesini sağlar ve yenilenebilir enerjiye geçişin ilk adımını oluşturur."
 renewables:0 "Rüzgâr Türbini Gelişmeleri"
 renewables_desc:0 "Aerodinamik ve malzemelerdeki teknolojik iyileştirmeler daha verimli rüzgâr türbinlerinin inşasını mümkün kılarak güç üretim kapasitelerini artırır."
 improved_renewables:0 "Yüksek Verimli Fotovoltaikler"
 improved_renewables_desc:0 "Fotovoltaik hücre teknolojisindeki önemli gelişmeler daha yüksek güneş enerjisi dönüşüm oranlarına yol açarak güneş panellerini daha üretken ve uygun maliyetli hâle getirir."
 advanced_renewables:0 "Kompozit Rüzgâr Kanatları"
 advanced_renewables_desc:0 "Hafif ama sağlam kompozit malzemelerin kullanılmasıyla rüzgâr türbini kanatları daha verimli ve dayanıklı olur, rüzgârdan daha fazla enerji yakalar."
 modern_renewables:0 "İnce Film Güneş Teknolojisi"
 modern_renewables_desc:0 "İnce film güneş panellerinin ortaya çıkışı güneş sektöründe devrim yaratır; kurulumda esneklik ve uyum sağlarken genel verimliliği de artırır."
 improved_modern_renewables:0 "Açık Deniz Rüzgâr Çiftlikleri"
 improved_modern_renewables_desc:0 "Ülkeler, daha güçlü ve daha sürekli rüzgârlardan yararlanmak için açık denizde rüzgâr çiftlikleri kurmaya başlar; bu da büyük ölçekli rüzgâr enerjisi projelerinin önünü açar."
 advanced_modern_renewables:0 "Çift Yüzlü Güneş Panelleri"
 advanced_modern_renewables_desc:0 "Her iki yüzeyinden de güneş ışığı yakalayabilen çift yüzlü güneş panelleri kullanıma girer; çevredeki yüzeylerden yansıyan güneş ışığından yararlanarak enerji verimini artırır."
 early_renewables_9:0 "Gelişmiş Rüzgâr Türbini Kontrolleri"
 early_renewables_9_desc:0 "Son teknoloji kontrol sistemleri, kanat eğimini ve yön açılarını ayarlayarak türbin performansını optimize eder ve değişken rüzgâr koşullarından azami enerjiyi elde eder."
 renewables_9:0 "Perovskit Güneş Hücreleri"
 renewables_9_desc:0 "Perovskit güneş hücreleri ticari olarak uygulanabilir hâle gelir; daha yüksek verim ve daha düşük üretim maliyeti sunarak güneş enerjisinin benimsenmesini daha da hızlandırır."
 renewables_10:0 "Gelgit Santralleri"
 renewables_10_desc:0 "Okyanus gelgitlerinin gücünden yararlanarak kıyı şehirlerini besleyebiliriz."
 renewables_11:0 "Gelgit Genişlemesi"
 renewables_11_desc:0 "Gelgit enerjisi dönüşümündeki ilerlemeler modülleri eskisinden daha yoğun şekilde kurmamıza ve kıyıdan daha uzağa yayılmamıza olanak tanır."
 renewables_12:0 "Volkanik Enerji Santralleri"
 renewables_12_desc:0 "Aktif yanardağların yakınına santral kurmak, sağladıkları muazzam jeotermal enerjiyi toplamamıza ve ayrıca patlama tehlikelerini azaltmamıza olanak tanır."
 renewables_13:0 "Astenosfer Emilimi"
 renewables_13_desc:0 "Volkanik santral fikrini şiddetli sismik faaliyet bölgelerine yaymak, Dünya'nın astenosferinden gelen jeotermal enerjiye daha iyi erişmemizi sağlar."
 fuel_efficiency:0 "Gelişmiş Yanma Mühendisliği"
 fuel_efficiency_desc:0 "Yanma mühendisliğindeki yenilikler, tüketimi azaltırken fosil yakıtlardan daha fazla enerji elde etmemize olanak tanır ve enerji üretiminin geleceği için bir emsal oluşturur."
 fuel_efficiency2:0 "Entegre Gazlaştırma Kombine Çevrimi"
 fuel_efficiency2_desc:0 "Kömürü ve diğer karbon bazlı yakıtları gaza dönüştürerek daha temiz ve verimli enerji üretiminin potansiyelinden yararlanıyoruz; bu, fosil yakıtlı enerji santrallerimizin kapasitesinde bir sıçramaya işaret ediyor."
 fuel_efficiency3:0 "Yüksek Verimli Düşük Emisyonlu Teknolojiler"
 fuel_efficiency3_desc:0 "HELE teknolojilerini benimsemek, fosil yakıtlı santrallerimizin daha düşük emisyonla daha yüksek verime ulaşmasını sağlar ve enerji üretimi ile çevre koruma hedeflerini bir araya getirir."
 fuel_efficiency4:0 "Karbon Yakalama ve Depolama (CCS) Entegrasyonu"
 fuel_efficiency4_desc:0 "Karbon emisyonlarına ilişkin küresel endişeler arttıkça, santrallerimize CCS entegre etmek CO2 emisyonlarını tutup depolamamıza olanak tanır; bu da fosil yakıtlı enerjiyi hem güçlü hem de çevreye duyarlı kılar."
 fuel_efficiency5:0 "Yapay Zekâ Destekli Optimizasyon ve İzleme"
 fuel_efficiency5_desc:0 "Yapay zekânın gücünden yararlanan santrallerimiz artık işleyişini gerçek zamanlı olarak dinamik biçimde ayarlıyor; çevresel etkileri en aza indirirken en uygun yakıt tüketimini ve çıktıyı sağlıyor."
 fuel_efficiency6:0 "Sıfıra Yakın Emisyonlu Fosil Yakıt Santralleri"
 fuel_efficiency6_desc:0 "En yeni teknolojiler ve yöntemler sayesinde fosil yakıtlı santrallerimiz artık belirgin biçimde azaltılmış emisyonla çalışıyor ve verimli enerji üretiminin zirvesini temsil ediyor."
 fuel_efficiency_7:0 "Kuantum Yakıt Optimizasyonu"
 fuel_efficiency_7_desc:0 "Kuantum hesaplamayı yakıt sistemlerine uygulamak, enerji üretimini çok daha ayrıntılı bir düzeyde yönetmemize olanak tanır."
 fuel_efficiency_8:0 "AGI Uygulaması"
 fuel_efficiency_8_desc:0 "AGI, yakıt dönüşümünü öncekinden çok daha iyi bir oranda mikro düzeyde yönetebilir."
 fuel_efficiency_9:0 "Özel Yakıt Nanolifleri"
 fuel_efficiency_9_desc:0 "Gelişmiş lifler ısı kaçışını her zamankinden daha fazla sınırlar."
 fuel_efficiency_10:0 "Süper Zekâ Destekli İzleme"
 fuel_efficiency_10_desc:0 "Sürece süper zekâlı yapay zekâyı dahil etmek, enerji dönüşüm süreci üzerinde neredeyse mutlak kontrol sahibi olmamızı sağlar."
 energy_efficiency:0 "Termodinamik Temelleri"
 energy_efficiency_desc:0 "Termodinamik İlkelerinin bazı temel kurallarını uygulayarak fabrikalarda ve ofis binalarında enerji kaybı hemen azaltılabilir."
 energy_efficiency2:0 "Isı Yalıtımı Uygulaması"
 energy_efficiency2_desc:0 "Ulusal enerji maliyetinin büyük bir kısmı binaların ısıtılmasından ve soğutulmasından gelir. Isı yalıtımı kullanmak bu giderleri azaltarak kazanılan enerjinin başka yerlerde kullanılmasına olanak tanır."
 energy_efficiency3:0 "Gelişmiş Kontrol Entegrasyonu"
 energy_efficiency3_desc:0 "Termostatlara ve kontrol sistemlerine bazı basit algoritmalar entegre ederek verimlilik daha da artırılabilir ve ek enerji tasarrufu sağlanabilir."
 energy_efficiency4:0 "Yüksek Yoğunluklu Yalıtım"
 energy_efficiency4_desc:0 "Daha modern malzemeler kullanarak yalıtım yoğunluğu artırılabilir ve daha da yüksek enerji tasarrufu elde edilebilir."
 energy_efficiency5:0 "TEG ile Yükseltilmiş Santraller"
 energy_efficiency5_desc:0 "Birçok modern santral hâlâ suyu buhara çevirmek için ısı kullanmaya dayanır. Bu yıllar içinde daha verimli hâle gelse de yine de yüksek miktarda atık ısı üretir. Termoelektrik Jeneratörler, atık ısıdan ekstra gerilim elde etmek için esnek biçimde kullanılabilir. Bu, fabrikaların yakıt üzerindeki toplam maliyetinin düşmesiyle yansır."
 energy_efficiency6:0 "Nanolif Yalıtımlar"
 energy_efficiency6_desc:0 "Nanolif teknolojisindeki son gelişmeler bugüne kadarki en gelişmiş ve yoğun yalıtımın bir kısmının kullanılmasına olanak tanır. Bu, enerji verimliliğini ciddi şekilde artıracaktır."
 energy_efficiency7:0 "Büyük Ölçekli TEG Entegrasyonu"
 energy_efficiency7_desc:0 "Fabrikaları ve ofisleri düzgünce yalıtmanın ötesine geçerek, en modern ısı yalıtımıyla bile kaybolacak enerjiyi geri kazanmak için Termoelektrik Jeneratörler kullanılabilir."
 energy_efficiency8:0 "Mikro Jeneratörler"
 energy_efficiency8_desc:0 "Egzozlara küçük ölçekli jeneratör türbinleri takmak ve pencerelerden termoelektrik kablolar geçirmek, enerji geri kazanımını bir üst seviyeye taşır."
 energy_efficiency_9:0 "Kuantum Enerji Verimliliği"
 energy_efficiency_9_desc:0 "Ekipmanlarımızın enerji verimliliğini artırmak için kuantum teknolojisini kullanabiliriz."
 energy_efficiency_10:0 "Gelişmiş Kuantum Verimliliği"
 energy_efficiency_10_desc:0 "Kuantum teknolojisindeki en son bilimsel bulguları uygulamak verimliliği daha da artırır."
 energy_efficiency_11:0 "Kuantum Enerji Geri Kazanımı"
 energy_efficiency_11_desc:0 "Kuantum fiziğine dair anlayışımızdaki ilerlemeler, enerjinin atom düzeyinde geri kazanılmasına olanak tanır."
 energy_efficiency_12:0 "Kuantum Emilimi"
 energy_efficiency_12_desc:0 "Kuantum köpüğündeki değişimleri emip elektrik enerjisine dönüştürmek mümkün. Enerji kaybını enerji kazancına çevirdik!"
 TOTAL_GENERATION_ENERGY:0 "§HToplam Üretim§!: [?energy_sum|G2] GW"
 ENERGY_GENERATION_TOTAL_TT:0 "Aşağıdaki değerler, üretilen enerjinin nereden geldiğinin tam dökümünü oluşturur. Tükettiğinizden fazla enerji üretiyorsanız §YFosil Yakıtlı Santraller§! boşta bekler. Boştaki §YFosil Yakıtlı Santraller§! §YYakıt§! tüketmez.\n----------\n§YFosil Yakıt Enerjisi§! Üretimi: [?fossil_pp_energy_generation|G2] GW\n§YBoştaki Fosil Yakıtlı Santrallerin Gücü§! Üretimi: [?free_fossil_powerplants_power|Y2] GW\n§YHidroelektrik Enerji§! Üretimi: [?hydroelectric_energy_generation|G2] GW\n§YJeotermal Enerji§! Üretimi: [?geothermal_energy_generation|G2] GW\n§YNükleer Enerji§! Üretimi: [?nuclear_energy_generation|G2] GW\n§YGüneş ve Rüzgâr Enerjisi§! Üretimi: [?renewable_energy_display_var|G2] GW\n§YDiğer Kaynaklar§! Üretimi: [?other_energy_generation|G2] GW\n§YEnerji Depolamadan Çekilen§!: [?energy_withdrawal_from_storage|G2] GW\n\n----------\n§YPotansiyel Güneş ve Rüzgâr Enerjisi§! Üretimi: [?minimum_renewable_energy_var|+2] GW ile [?maximum_renewable_energy_var|+2] GW arası\n§YEnerji Yük Paylaşımı§! ile Toplam Enerji Üretimi: [?energy_load_sharing_gain_var|G2]"
 ENERGY_GENERATION_TOTAL_DELAYED_TT:0 "§YÇarpanlar§!:\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Enerji Üretimi§! üzerindeki etkisi: [?modifier@energy_gain_multiplier|+%]\nYasa, Ulusal Ruh ve Teknolojilerin §YYenilenebilir Enerji Üretimi§! üzerindeki etkisi: [?modifier@renewable_energy_gain_multiplier|%+]\nYasa, Ulusal Ruh ve Teknolojilerin §YFosil Yakıt Enerjisi Üretimi§! üzerindeki etkisi: [?modifier@fossil_pp_energy_generation_modifier|%+]\nYasa, Ulusal Ruh ve Teknolojilerin §YNükleer Enerji Üretimi§! üzerindeki etkisi: [?modifier@nuclear_energy_generation_modifier|%+]\n\n"
 TOTAL_CONSUMPTION_ENERGY:0 "§HToplam Tüketim§!: [?energy_consumption|R2] GW"
 TOTAL_CONSUMPTION_ENERGY_TT:0 "Aşağıdaki değerler, enerji tüketiminin nereden geldiğinin tam dökümünü oluşturur.\n----------\n§YHalk Enerjisi§! Tüketimi: [?population_energy_use_display_var|R2] GW\nMevsimlik Halk Talebi: [?energy_seasonal_population_demand_factor|%0R]\n§YToplam Bina Enerjisi§! Tüketimi: [?energy_use_buildings_total_display_var|R2] GW\n§YDiğer Enerji§! Tüketimi: [?other_energy_use_display_var|R2] GW\n----------\n§YTüre Göre Bina Enerji Tüketimi:§!\n§YSivil Fabrika Enerjisi§! Tüketimi: [?energy_use_civs_total_display_var|R2] GW\n§YOfis Enerjisi§! Tüketimi: [?energy_use_offices_total_display_var|R2] GW\n§YAskeri Fabrika Enerjisi§! Tüketimi: [?energy_use_mils_total_display_var|R2] GW\n§YTersane Enerjisi§! Tüketimi: [?energy_use_dockyards_total_display_var|R2] GW\n§YTicari Tarım Bölgeleri Enerjisi§! Tüketimi: [?energy_use_agriculture_district_total_display_var|R2] GW\n§YMikroçip Tesisi Enerjisi§! Tüketimi: [?energy_use_microchip_plant_total_display_var|R2] GW\n§YKompozit Tesisi Enerjisi§! Tüketimi: [?energy_use_composite_plant_total_display_var|R2] GW\n§YSentetik Rafineri Enerjisi§! Tüketimi: [?energy_use_synthetic_refinery_total_display_var|R2] GW\n\n"
