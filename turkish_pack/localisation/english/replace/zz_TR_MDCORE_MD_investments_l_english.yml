 investments_construction_agriculture_district:0 "§YTicari Tarım Bölgesi§!\nTicari Tarım Bölgesi, ülkemizdeki geçimlik olmayan tüm tarımı kapsayan genel bir kategoridir. Tarımsal sanayiyi, ekilebilir araziyi, tahıl silolarını, kasapları ve daha fazlasını içerir.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^14|3]§! Milyar"
