 state_owned_local_renewable_capacity_modifier:0 "Yerel Yenilenebilir Kapasitenin Genişletilmesi"
 state_owned_local_renewable_capacity_modifier_desc:0 "Yerel yenilenebilir enerji altyapısına yönelik bir dizi hedefli yatırımın ardından eyalet artık yenilenebilir kaynaklardan daha fazla enerji üretiyor."
 state_owned_encouraged_productivity:0 "Yerel Verimliliğin Teşviki"
 state_owned_encouraged_productivity_desc:0 "Yerel ekonomiye yönelik bir dizi hedefli yatırımın ardından eyalet ay be ay daha verimli hâle geliyor."
 state_owned_local_infrastructure_modifier:0 "Yerel Altyapının Genişletilmesi"
 state_owned_local_infrastructure_modifier_desc:0 "Eyalette yerel altyapının genişletilmesi, yerel altyapıyı büyük ölçüde iyileştirmeye yönelik çeşitli kısa vadeli projelere yol açtı."
 state_owned_local_military_infrastructure_modifier:0 "Yerel Askeri Altyapının Genişletilmesi"
 state_owned_local_military_infrastructure_modifier_desc:0 "Yerel askeri tesislere ve altyapı yenilemelerine yapılan önemli yatırımın ardından bölgedeki askeri tesisler tamamen modernize edildi. Eyaletin askeri üretim kapasitesi büyük ölçüde güçlendirildi."
 state_owned_local_energy_infrastructure_modifier:0 "Yerel Enerji Altyapısının Genişletilmesi"
 state_owned_local_energy_infrastructure_modifier_desc:0 "Yerel enerji şebekesine yönelik hedefli yatırımlar, eyaletin enerji üretim ve dağıtım altyapısının kapsamlı biçimde modernize edilmesiyle sonuçlandı. Eyalet artık tüm enerji sektörlerinde gelişmiş enerji üretim kapasitesine sahip."
 state_owned_build_forward_logistics_base_modifier:0 "İleri Lojistik Üsleri İnşa Et"
 state_owned_build_forward_logistics_base_modifier_desc:0 "Eyalet genelinde stratejik lojistik üsleri kuruldu ve ileri konuşlu bir ikmal ağı oluşturuldu. Bu tesisler birliklerin ve malzemelerin bölgeden geçişini önemli ölçüde iyileştirerek toplam ikmal ihtiyacını azaltıyor."
 state_owned_improve_rebuilding_efforts_modifier:0 "Gelişmiş Yeniden İnşa Çabaları"
 state_owned_improve_rebuilding_efforts_modifier_desc:0 "Yeniden yapılanma çabaları yerel halkın gönlünü kazandı; halkın iş birliğini artırıp toplumsal huzursuzluğu azalttı. Yerel altyapıya ve toplumsal yeniden inşa projelerine yapılan yatırım, yerel halkın uyumunu güçlendirdi."
 state_owned_hire_extra_primary_sector_workers_modifier:0 "Ek Birincil Sektör İşçisi İşe Al"
 state_owned_hire_extra_primary_sector_workers_modifier_desc:0 "Eyaletin birincil sektör iş gücü, hedefli işe alım ve eğitim girişimleriyle genişletildi. Tarım, madencilik ve diğer kaynak çıkarım faaliyetleri artık artan iş gücü bulunabilirliğinden yararlanıyor ve bu da daha yüksek kaynak çıktısı sağlıyor."
 state_owned_local_naval_infrastructure_modifier:0 "Yerel Deniz Altyapısının Genişletilmesi"
 state_owned_local_naval_infrastructure_modifier_desc:0 "Kıyı savunmasına ve deniz altyapısına yapılan yatırım, eyaletin denizcilik kabiliyetlerini dönüştürdü. Yeni deniz tesisleri ve ikmal merkezleri artık bölgedeki deniz harekâtına kapsamlı destek sağlıyor."
 state_owned_local_fortification_efforts_modifier:0 "Yerel Tahkimat Çabaları"
 state_owned_local_fortification_efforts_modifier_desc:0 "Eyalet genelinde siperler, kıyı tahkimatları ve müstahkem mevki ağları dahil kapsamlı savunma tesisleri inşa edildi. Bu askeri tesisler eyaletin işgale ve kara saldırısına karşı savunma kabiliyetini önemli ölçüde artırıyor."
