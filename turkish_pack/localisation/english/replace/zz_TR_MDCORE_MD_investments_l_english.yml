 check_for_investment_project_limits_tt:0 "Şu Anda Kullanılabilir Bir §Hİç Yatırım§! Yuvası Var (Boş Projeler: [current_soi_count] / [?ROOT.modifier@internal_investment_slot_number|0])"
 state_based_investments_screen_delayed_tt:0 "Aşağıdaki menü, [THIS.GetName] içinde çeşitli kalkınma türlerini teşvik etmek için alabileceğiniz bir dizi karardır. Otomatik tekrar için bir yatırım düğmesine Sağ Tıkla. Seçili yatırımların işlenmesi için Otomasyon Ayarları'nda §YSeçili İç Yatırımları Tekrarla§! seçeneğini etkinleştirin.\n\nTüm ülkeler, ülkenin tamamındaki eyaletleri için kullanabilecekleri en az iki yuvaya sahiptir. Bir eyalette birden fazla proje yapmayı ya da projeleri ülke geneline yaymayı seçebilirsiniz. Ülkenizin §YGüç Sıralamasını§! yükselterek ek yuvalar kazanabilirsiniz.\n\nGüç Sıralamasına Göre Yuvalar:\n- §YSüper Güç§!: 6\n- §YBüyük Güç§!: 5\n- §YÖnemli Güç§!: 4\n- §YBölgesel Güç§!: 3\n"
