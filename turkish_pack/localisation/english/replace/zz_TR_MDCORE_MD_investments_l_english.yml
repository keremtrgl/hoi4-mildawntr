 investments_construction_MIC:0 "§YAskeri Sanayi§!\nBu bina eyalete yeni askeri ekipman üretimi için sanayi sağlar. Gerekirse sivil sanayiye dönüştürülebilir.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^2|3]§! Milyar"
 investments_construction_MIC_delayed:0 "§YÖn Koşullar§!:\n[!select_mil_button_click_enabled]"
 investments_construction_NIC:0 "§YTersane§!\nBu bina eyalete yeni gemi inşa etmek için sanayi sağlar.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^3|3]§! Milyar"
 investments_construction_NIC_delayed:0 "§YÖn Koşullar§!:\n[!select_dockyard_button_click_enabled]"
 investments_construction_INF:0 "§YAltyapı§!\nBu bina eyaletin altyapısını iyileştirir. Stratejik bölgelerdeki ikmal gücünüzü ve tümenlerinizin hızını artırır, ayrıca ham kaynak çıkarımınızı da yükseltir.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^4|3]§! Milyar"
 investments_construction_INF_delayed:0 "§YÖn Koşullar§!:\n[!select_infrastructure_button_click_enabled]"
 investments_construction_offices:0 "§YOfis Sektörü§!\nOfis sektörleri, ekonominin çıkarım ve ağır sanayilerin dışında kalan tüm diğer sektörlerini temsil eder. Finans, müşteri hizmetleri, bilişim teknolojileri, perakende hizmetleri ve çok daha fazlası bunlara dahildir.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^5|3]§! Milyar"
 investments_construction_offices_delayed:0 "§YÖn Koşullar§!:\n[!select_office_button_click_enabled]"
 investments_construction_AA:0 "§YSHORAD Mevzileri§!\n§YSHORAD Mevzileri§! (Kısa Menzilli Hava Savunma), alçak irtifa hava tehditlerine karşı hava savunmasını yürüten uçaksavar silahları ve taktiklerinden oluşan kompleks ve gruplardır. Bu mevziler hava sahasını savunulabilir bölgelere ayırmak için birlikte çalışır ve yerel askeri hedeflere ile altyapıya helikopterlerden alçak uçuşlu uçaklara ve jetlere kadar her şeye karşı hava koruması sağlar.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^6|3]§! Milyar"
 investments_construction_AA_delayed:0 "§YÖn Koşullar§!:\n[!select_antyair_button_click_enabled]"
 investments_construction_RAD:0 "§YRadar İstasyonu§!\nRadar İstasyonları, yakındaki eyaletlerdeki düşman birlikleri hakkında istihbarat toplamanızı sağlar. Çeşitli radarlardan ve sensörlerden, ayrıca istihbarat varlıklarından ve gelişen durumu analiz etme kapasitesinden oluşur.\nDaha yüksek seviye etkili menzilini artırır.\nRadarları ayrıca eyaletin düşman hava kuvvetlerini daha iyi tespit etmesini sağlar ve uçaklarınıza onlarla çatışmada daha iyi bir şans verir.\nBunun yanı sıra radarlar denizdeki düşman filolarının tespitini de artırır.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^7|3]§! Milyar"
 investments_construction_RAD_delayed:0 "§YÖn Koşullar§!:\n[!select_radar_button_click_enabled]"
 investments_construction_AIR:0 "§YHava Üssü§!\nBu bina eyalete hava kuvvetlerinizin konuşlanması için imkân sağlar.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^8|3]§! Milyar"
 investments_construction_AIR_delayed:0 "§YÖn Koşullar§!:\n[!select_airbase_button_click_enabled]"
 investments_construction_fuel_silo:0 "§YStratejik Kaynak Rezervi§!\nBu bina ülkenize §HYakıt§! stoklamak için daha fazla alan sağlar.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^9|3]§! Milyar"
 investments_construction_fuel_silo_delayed:0 "§YÖn Koşullar§!:\n[!select_strategic_resource_reserve_button_click_enabled]"
 investments_construction_internet_station:0 "§YŞebeke Altyapısı§!\nŞebeke Altyapısı, telekomünikasyon ve radyo iletişimi alanlarında yayınları uzun mesafelere ya da yeraltı fiber optik kablolarına ve bulut bilişim sistemlerine taşımak için kullanılan yüksek yapılardır.\n\n§YŞebeke Altyapısının§! her seviyesi yerel verimlilik artış hızını §G+%5,00§! artırır.\n§YŞebeke Altyapısının§! her seviyesi §YUluslararası Yatırımların§! süresini §G-%5,00§! azaltır.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^10|3]§! Milyar"
 investments_construction_internet_station_delayed:0 "§YÖn Koşullar§!:\n[!select_internet_button_click_enabled]"
 investments_construction_REF:0 "§YYenilenebilir Enerji Altyapısı§!\nYenilenebilir enerji altyapısı, tüm yenilenebilir enerji kaynaklarını kapsayan genel bir kategoridir. Güneş parkları, rüzgâr türbinleri, biyoyakıt rafinerileri, kömür tesisleri, biyoyakıtlı santraller ve daha fazlası bunlardan bazılarıdır. Bu nedenle yenilenebilir kaynakları kullanır ve bu kaynaklardan yakıt üretir.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^11|3]§! Milyar"
 investments_construction_REF_delayed:0 "§YÖn Koşullar§!:\n[!select_renewable_power_plant_button_click_enabled]"
 investments_construction_POWER_PLANT:0 "§YFosil Yakıtlı Santral§!\nFosil Yakıtlı Santral, fosil bazlı tüm termoelektrik enerji kaynaklarını kapsayan genel bir kategoridir. Kömür, doğal gaz ve petrol bunlardan bazılarıdır.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^12|3]§! Milyar"
 investments_construction_POWER_PLANT_delayed:0 "§YÖn Koşullar§!:\n[!select_fossil_fuel_power_plant_button_click_enabled]"
 investments_construction_NUCLEAR_REACTOR:0 "§YNükleer Reaktör§!\nNükleer Reaktör binası, nükleer enerjiyi elektrik enerjisine dönüştürür ve bu süreçte orta düzeyde zenginleştirilmiş uranyum tüketir.\n\n§YYapı Başına Temel Maliyet:§! §R$[?global.build_cost_array^13|3]§! Milyar"
