 investments_build_button_tt_1:0 "İnşaat projelerine yatırım yapmak, hedef ülkedeki nüfuzunuzu artıracak ve ülkenize yatırım geliri sağlayacaktır.\n\n§YHem ülkenin yolsuzluk düzeyi hem de eyaletin altyapı düzeyi toplam inşaat süresini etkiler. İnşaat, çarpanlardan bağımsız olarak varsayılan olarak %35 daha uzun sürer.§!\n\n§LHedef ülke yatırım teklifinizi kabul ederse, inşaat süresinin sonunda bina onlara geçer.§!\nYapay zekâ, ekonomik sorunları varsa ya da iç nüfuzu çok düşükse yatırımları reddedecektir.\nBir eyalette bir projeyi iptal ettikten sonra orada yeniden yatırım yapabilmek için 3 gün beklememiz gerekir.\n\n[investments_gain_tooltip]"
 investments_build_button_tt_delayed:0 "§YÖn Koşullar§!:\n[!invest_button_click_enabled]\n§YEtkiler§!:\n[!invest_button_click]"
 investments_14_cooldown_tt:0 "Ülke kabul ederse, kabulle birlikte başlayan §Y14 günlük§! bir sayaç işleyecek. Bu bekleme süresi boyunca bu ülkeye ne kadar para akıtırsanız akıtın daha fazla nüfuz kazanmazsınız."
 investments_30_cooldown_tt:0 "Ülke kabul ederse, kabulle birlikte başlayan §Y30 günlük§! bir sayaç işleyecek. Bu bekleme süresi boyunca bu ülkeye ne kadar para akıtırsanız akıtın daha fazla nüfuz kazanmazsınız."
 investments_build_button_tt_2:0 "Aktif projeyi iptal et (Bu eyalette günde yalnızca bir yatırım yapabilirsiniz)."
 investments_build_button_tt_b:0 "Bu düğmeye basmak, eyaletin kontrolcüsünden izin isteyecektir. Kabul ederlerse karar sekmenizde bir inşaat projesi başlar. Bu proje, sıradaki tüm binalar tamamlanana kadar tekrarlanır.\n\n§Yİnşaat hızı normal hızına kıyasla %25 ceza alır (ülkenizin inşaat hızı çarpanları geçerlidir).§!\n\n§LAynı anda yalnızca bir aktif inşaat projeniz olabilir.\n\nBir eyalette birden fazla ülkeden aktif inşaat projesi bulunamaz.\n\nEyaletin kontrolcüsü size karşı olumsuz bir görüşe sahipse reddedecektir.§!"
 influence_gain_tooltip_yes_tt:0 "Bu yatırım projesiyle nüfuz kazanacağız.\n\n[investment_cooldown]"
 influence_gain_tooltip_no_tt:0 "Bu yatırım projesiyle nüfuz kazanmayacağız.\n\n[investment_cooldown]"
 internal_investment_slot_number:0 "§Yİç Yatırım Yuvası§!"
 investments_event.1.t:0 "[FROM.GetNameWithFlag] Ülkesinden Yatirim Teklifi"
 investments_event.1.d:0 "[FROM.GetName], [?pending_offer_state.GetName] eyaletinde [?pending_offer_amount]x [investments_get_pending_offer_construction_type] inşa etmeyi teklif ediyor.\n\nProjenin tam maliyeti $$[?pending_offer_total_cost] milyar olarak tahmin ediliyor. Bu projeyi tamamlamak tahminen [?pending_offer_duration] gün sürecek. [FROM.GetName], inşaat bedelinin %10'unu bizim karşılamamızı öngören bir anlaşma öneriyor. [FROM.GetNameWithFlag] bu çalışmadan nüfuz kazanabilir. [FROM.GetNameWithFlag] bu projeden kâr elde edecek.\n\n\nTamamlanma Süresi (Gün): [?pending_offer_duration]\nToplam Proje Maliyeti ([FROM.GetNameWithFlag]): $$[?pending_offer_total_cost] Milyar\nBina Türü: [investments_get_pending_offer_construction_type]\nYatırım Alan Maliyeti ([THIS.GetNameWithFlag]): $$[?investor_cost]\nKonum: [?pending_offer_state.GetName]"
 investments_event.1.o1:0 "Teklifi Kabul Et"
 investments_event.1.o2:0 "Teklifi Reddet"
 investments_event.2.t:0 "Insaat Izni Reddedildi"
 investments_event.2.d:0 "Olası yeni yatırım ortağımızdan ret yanıtı aldık. Projemizi reddetmeleri inanılmaz! Sanki ülkelerinin gelişmesine yardım ederek hükümetleri üzerinde nüfuz ya da kontrol kazanacak değildik! Neyse, [FROM.GetName] ile [?ROOT.investments_state_target.GetName] eyaletindeki yatırım anlaşması suya düştü, o hâlde yatırım teklifimizi başkasına gönderebiliriz."
 investments_event.2.o1:0 "Belki komşusuna..."
 investments_event.3.t:0 "Insaat Projesi Iptal Edildi"
 investments_event.3.d:0 "Maalesef [FROM.GetName] ülkesindeki dostlarımızla yatırım anlaşmamızı tamamlayamadık. Bunun hükümetle ilişkiler, finansman eksikliği ya da belki yerel halkın genel ilgisizliği gibi pek çok olası nedeni var. Bir başka zaman yine deneyebiliriz."
 investments_event.3.o1:0 "Kaybeden onlar!"
 investments_build_cost_tt:0 "§YYabancı Yatırım Maliyeti§!\n\n§YYabancı Yatırım Maliyeti§! §gbaşlatmayı düşündüğümüz projenin peşin maliyetidir. Doğrudan ülkemizin hazinesinden alınır ve projenin kabul edilmesiyle§! §YUluslararası Yatırımlarımıza§! §geklenir.§!\n\n§gBaşka bir ülkeden ya da eyaletten yeni geldiyseniz, gerçek maliyeti görmek için bina miktarını değiştirdiğinizden veya ipucunu güncellemek için başka bir binaya tıkladığınızdan emin olun.§!\n\n§gYolsuzluk, ulusal ruhlar ve daha fazlası yatırım projesinin maliyetini etkileyebilir. Yatırım alan ülkenin yolsuzluğu, yolsuzluk düzeyine göre projenin maliyetini artırır.§!\n"
