l_english:
 MODERN_DAY_NAME:0 "Bugünün Dünyası (GÜNCEL DEĞİL)"
 MODERN_DAY_DESC:0 "Açlık hiç bu kadar düşük olmamıştı. Gelir hiç bu kadar yüksek olmamıştı. Yine de dünya, hızlı toplumsal ve teknolojik değişim karşısında korkuyla damgalanmış durumda. Orta Doğu hibrit savaşa sürüklenirken ve Batı'yı bir milliyetçi popülizm dalgası kaplarken küreselleşmeye karşı tepki hissediliyor. Dünyanın ağırlık merkezi Asya'ya kayıyor, ancak dünyanın yükselen güçleri hâlâ hâkim Batı dünya düzenine çekici bir alternatif bulabilmiş değil."
 USA_MODERN_DAY_DESC:0 "Dünyanın tek süper gücü olan Amerika Birleşik Devletleri, uluslararası gücünde kademeli bir düşüşle karşı karşıya. Orta Doğu savaşlarına, devlet borcuna ve Çin ile diğer BRICS ülkelerinin ekonomik yükselişine saplanan Amerikan hegemonyası eskisi gibi değil. Ancak kendisine tam güvenlik sağlayan ve doğal düşmanı bulunmayan eşsiz coğrafi konumu sayesinde, hem ABD'nin hem müttefiklerinin hayati çıkarlarını savunmak için denizaşırı ülkelerde güçlü biçimde var olmaya devam edebilir. Yurt içinde ise hem elitizme hem küreselleşmeye karşı bir milliyetçi duygu dalgası, ülkeye gelmiş geçmiş en beklenmedik başkanı verdi: Donald Trump.\nAvrupalı ve Asyalı müttefikler hem Amerikan tek taraflılığından hem Batılı liberal kurumlardan çekilmesinden endişe ederken ABD, Batı dünya düzeninin hâkim kalmasını sağlayacak dengeyi kurabilecek mi?"
 ENG_MODERN_DAY_DESC:0 "Birleşik Krallık, hiçbir ülkenin daha önce bulunmadığı bir konumda. 2016 Brexit referandumu yaklaşık yüzde elli iki çoğunlukla geçti ve Birleşik Krallık, Avrupa Birliği'nin 50. maddesini işleten ilk ve tek ülke oldu. Tarih kitaplarında ya İngiliz halkı için en büyük karar ya da mümkün olan en kötü tercih olarak yer alacak.\nAnlaşmalı mı anlaşmasız mı, en büyük soru bu."
 FRA_MODERN_DAY_DESC:0 "Sanat, kültür ve diplomasinin küresel merkezi olan Fransa, umut ve fırsatlarla dolu yeni bir yüzyıla parlak gözlerle bakıyor. Eski monarşilerin zulmü ve Dünya Savaşlarının yıkımı Fransa'yı, kurucu üyesi olduğu Avrupa Birliği'ne doğru fırlattı. \n\nFransızların önündeki yüzyılın üstesinden nasıl geleceğini yalnızca zaman gösterecek."
 GER_MODERN_DAY_DESC:0 "Kemer sıkma ve reformlar sayesinde Alman ekonomisi, 2008 mali krizinin ve Avrupa borç krizinin ikili şokundan zarar görmeden çıktı. Açık ara en güçlü Avrupa ekonomisi olarak, bir zamanlar temkinli ve isteksiz olan Almanya'ya Brexit ve artan ulusal egemenlik çağrıları karşısında Avrupa Birliği'ni ileriye taşıma görevi düştü. Almanya için Avro Bölgesi'nin ve Avrupa Birliği'nin varlığı bir tercih değil, bir zorunluluk. Avrupa entegrasyonu, güçlü Alman sanayi sektörünün iç talebi çoktan aşması nedeniyle mallarına yetecek büyüklükte ortak bir pazar yarattı. Ayrıca düşüş eğilimindeki demografiyle Almanya, boşluğu doldurmak için artan göçe güvenmek zorunda; milliyetçiliğin yükseldiği bir dönemde bu tercih kuşkusuz tartışmalı olacak."
 JAP_MODERN_DAY_DESC:0 "Japonya, dünyanın en büyük ekonomilerinden biridir. Avrupa'daki birçok ülkeden daha fazla üretmeye devam eder ve aynı zamanda dünyanın en özgün kültürlerinden birini korur. Ancak bu büyük ekonomi inanılmaz miktarda borçla boğuşmaktadır. Japonya'nın devlet borcu GSYİH'sinin yaklaşık yüzde iki yüz kırk dokuzuna doğru gitmektedir. Ayrıca nüfusunun çoğunun kırk yaşın çok üzerinde olduğu ters nüfus piramidinden etkilenen birkaç ülkeden biridir.\nJaponya mali borcu ve nüfus krizi altında çökecek mi, yoksa zamanın sınavından geçip dünyanın en güçlü ülkelerinden biri mi olacak?"
 SOV_MODERN_DAY_DESC:0 "Sovyetler Birliği'nin çöküşü, 300 yıllık Rus yayılmacılığını tersine çevirdi ve yeni federasyonu 17. yüzyıl sınırlarıyla baş başa bıraktı. NATO'nun Doğu Avrupa'ya ve Sovyet sonrası devletlere doğru genişlemesi, kalbi savunulamaz Avrupa ovasında yer alan Rusya'yı savunmasız bıraktı. Bu nedenle Rusya'nın bölgesel bir güç ve makul bir ordudan fazlası olabilmesi için Ukrayna, Gürcistan ve Baltık ülkeleri gibi Sovyet sonrası devletler üzerinde Avrasya Birliği gibi girişimlerle dolaylı denetim elde etmesi her şeyden önemlidir. Ekonomik olarak düşük petrol fiyatları ve Batı yaptırımlarının ikili şokunu atlatmalı ve Rusya'nın aşırı merkezileşmiş bürokrasisindeki başıboş yolsuzlukla bir şekilde mücadele etmelidir."
 CHI_MODERN_DAY_DESC:0 "Çin'in coğrafyası, yani dağlar ve ormanlarla çevrili oluşu, onu korur ama aynı zamanda dünyanın geri kalanından yalıtır. Büyük azınlıkları olan çok etnikli bir imparatorluk olarak yalnızca toprak bütünlüğünü korumak bile büyük çaba gerektirir; çünkü denetimi sürdürmek için iç bölgelerine ve anlaşmazlık konusu topraklarına devasa yatırımlar yapmak zorundadır. Belki de en büyük zayıflığı, ihracata ve ABD ile Asya-Pasifik müttefiklerinin denetlediği açık okyanustaki ticarete bağımlılığıdır. Çin'in gerçek bir süper güç olabilmesi için ABD Donanması ile büyüklük ve nitelik bakımından rekabet etmesi ve mevcut Asyalı rakiplerini müttefike dönüştürmesi gerekir. Çin diplomasisini çekici bir siyasi modelden yoksun oluşu engellemektedir. Ancak devasa dış rezervleri ve bunları yurtdışında yatırım yapmak için kullanma istekliliği ona güç katmaktadır."
 BRA_MODERN_DAY_DESC:0 "Brezilya yüzyılın başında yavaş yavaş yükseliyor. Ülke büyüklük potansiyeline sahip. Dünyanın en büyük yükselen ekonomilerinden biri ve büyümesi hızlanmaya devam etti. Ancak son yıllarda Brezilya ekonomisi, 1997 Asya Mali Krizi ve sakat bir para birimi nedeniyle yaşanan sert bir durgunluktan geri çekiliyor. Şimdi sahneye yeni bir parti rakibi çıktı. PT devreye girdi ve hızla ivme kazanıyor.\n\nÜlkenin bir zamanlar büyük olan ekonomisini yeniden canlandırabilecek misiniz, yoksa PT ve sosyalist politikaları yönetimi mi ele geçirecek?"
 UKR_MODERN_DAY_DESC:0 "2014 yılı Ukrayna'yı, her an geri dönüşü olmayan sonuçlara yol açabilecek olayların merkez üssü yaptı. Onur devrimi Viktor Yanukoviç'in otoriter iktidarını devirdi ve Petro Poroşenko başkanlığında yeni bir Batı yanlısı hükümet getirdi. Pek çok seçim vaadine rağmen yeni seçilen güvence sahibi ülkeyi daha da büyük bir borç tuzağına soktu ve durumdan kendi çıkarına yararlandı. Halkın sabrı tükeniyor. Kırım yarımadası eski dostlarımız tarafından ilhak edildi ve Donbas'ın doğu bölgeleri savaşın alevlerine kapıldı. Yeni seçimlere yalnızca birkaç yıl kaldı, ancak halk başkanlık döneminin sonuna kadar dayanabilecek mi?"
 TUR_MODERN_DAY_DESC:0 "Son yıllar bağışlayıcı olmadı. PKK tehdidi neredeyse ortadan kaldırılmış olsa da onu tamamen bitirecek bir çözüm bulamadık. Darbe girişimi püskürtüleli yalnızca aylar oldu ve bazıları unutmaya bile başlasa da failler hâlâ firarda; birkaçı hâlâ ülkemizde, bazıları yurtdışında saklanıyor veya yılanın başı Fethullah Gülen de dahil düşmanlarımızca barındırılıyor. Bu arada bazı çevreler, Erdoğan'ın darbeyi bizzat kurgulayıp muhalefetten kurtulmak ve daha fazla iktidar ele geçirmek için bilerek başarısız olmasını sağladığı söylentilerini yayıyor. Yine de tasfiye edilenlerin bir kısmının masum olduğu ortaya çıktı ve bu hatalı mahkûmiyetler kanıtlandı."
 ISR_MODERN_DAY_DESC:0 "Eşaya'nın, insanlığın «kılıçlarını saban demirine, mızraklarını bağ bıçağına çevireceği» günü peygamberlik ettiği topraklar olan İsrail Toprakları, Yahudi halkının iki bin yıl sonra ilk kez bağımsızlığını yeniden kurmasından bu yana çok fazla kan gördü. 1990'ların Oslo Anlaşmaları sürecinin iyimserliği, Kasım 1995'te Başbakan Rabin'in suikastla öldürülmesiyle öldü ve Başbakan Barak'ın iyimserliğine rağmen İkinci İntifada kaçınılmaz. Ancak ondan nasıl bir İsrail çıkacak: eski halinin bir gölgesi mi, yoksa kendi koşullarında müzakere edebilen yükselen bir bölgesel güç mü? Ve şimdiye kadar bu kadar titizlikle kaçınılan, varlığının Yahudi ve Demokratik yönleri arasındaki hassas dengeyi nasıl ele alacak?"
 SYR_MODERN_DAY_DESC:0 "Suriye Silahlı Kuvvetleri'ndeki bölünmüş sadakatler ve 6 yıllık acımasız bir iç savaşın verdirdiği şaşırtıcı kayıplarla düzenli ordu tükenmiş bir güç. Suriye muharebe sahasındaki yerini, birlikte Esad'ın kayıplarını tersine çevirmeye başlayan çok çeşitli milisler, özel askeri şirketler, Hizbullah ve İran Devrim Muhafızları aldı. Ancak ekonomisi yıkılmış ve Suriye topraklarının çoğu teröristlerin, isyancıların ve Kürtlerin denetiminde olduğundan, birleşik bir Suriye ihtimali uzun bir mücadeleyi gerektirecek gibi görünüyor."
 PER_MODERN_DAY_DESC:0 "AMAD projesini küresel misillemeye rağmen sürdüren İran, nükleer silah edinme yürüyüşünü durdurmayan ancak zayıflatan ağır ekonomik yaptırımlarla karşılaştı. Bu zorluk döneminde İran, Kudüs Gücü'nü kullanarak Orta Doğu'da gücünü göstermeye de başlamıştı. Şimdi toparlanmaya başlayan İran, kendini küresel düzene ve Amerika Birleşik Devletleri'ne karşı durmaya istekli bir ülke olarak konumlandırdı. Buradan nereye gidecek?"
 FSA_MODERN_DAY_DESC:0 "Özgür Suriye Ordusu başlangıçta Esad karşıtı isyancı grupların çatı örgütü ve gerçek bir paralel hükümetti. Ancak Suriyeli militanların radikalleşmesi, hem El Kaide müttefiki Nusra Cephesi'ne hem IŞİD'e toplu geçişlere yol açtı ve Suriye'nin kuzeyinde ÖSO'nun ortadan kalkmasına katkıda bulundu. Sonuç olarak Özgür Suriye Ordusu bir örgüt olarak dağıtıldı. Ancak Müslüman Kardeşler bağlantılı çok çeşitli isyancı gruplar, birkaç Selefi ve laik grupla birlikte hâlâ bu etiketi taşıyor. Suriye'nin güneyinde ÖSO bağlantılı gruplar IŞİD'e karşı çöl savaşında başarılı oldu ve Dera'nın büyük kısmını hâlâ Esad'ın güçlerine karşı savunuyor. Kuzeyde Türk Silahlı Kuvvetleri'nin müdahalesi, iki Kürt kantonu arasına kama sokmada başarılı oldu."
 NUS_MODERN_DAY_DESC:0 "Ocak 2017'de birçok Mücahit grubu, zalim Esad'a karşı birleşik bir Cihat çağrısı altında birleşti. Hayat Tahrir el-Şam ya da Şam'ı Kurtuluş Komitesi olarak bilinen bu çetin örgüt, Suriye iç savaşının kanlı ortamında kuruldu. Grup, ABD tarafından terör örgütü ve El Kaide bağlantılı bir örgüt olarak sınıflandırılıyor."
 ROJ_MODERN_DAY_DESC:0 "Suriye İç Savaşı başlarken Esad'ın güçleri, kalbi olan bölgeleri savunmak için Kürt bölgelerinden çekildi. Bu, uzun süredir baskı altında tutulan Kürt halkının, sol görüşlü Demokratik Birlik Partisi ve milisi YPG aracılığıyla denetimi ele almasına ve demokratik sosyalizme ve cinsiyet eşitliğine dayalı Rojava'yı kurmasına olanak tanıdı. IŞİD Suriye muharebe sahasına girince Kürtleri güçle hedef aldı, Rojava'nın geniş kesimlerini ele geçirdi ve Kobani'ye yönelik başarısız saldırıyla sonuçlandı. Peşmerge, Türk PKK'sı ve ABD hava desteğinden gelen takviyelerle Kürtler dengeyi çevirmeyi ve IŞİD'i kaçmaya zorlamayı başardı. O zamandan beri eski ÖSO'nun bazı bölümlerini «SDG» bayrağı altında bünyesine kattı. Ancak geleceğe yönelik zorlukları sayısız; Türkiye defalarca savaşla tehdit ediyor ve Esad ile örtülü ittifakın çatışmaya dönüşebileceği korkusu yaklaşıyor."
 OTHER_MODERN_DAY_DESC:0 "Dünyanın büyüklü küçüklü ulusları, yeni bir küresel çatışmanın patlak vermesini nefeslerini tutarak beklemekle yetinmiyor. İç savaşın eşiğindeki büyük güçlerden Büyük Savaş'ın şekillendirdiği ve dönüştürdüğü pek çok ulusa kadar herkes, dünyanın geleceğinde etkili olmak için zor kararlar vermek ve idealleri pragmatizmle dengelemek zorunda kalacak."
 DEN_MODERN_DAY_DESC:0 "Danimarka, hem AB hem NATO üyesi olarak güvenli ve emniyetli bir ülkedir. Ancak iç ekonomik bir gerileme ve yavaşlama, yakın zamanda Danimarka devletini zorlamaya başladı. Danimarka'nın daha geniş dünyadaki çalkantılardan etkilenmeden kalmaya devam edip edemeyeceği hiç de kesin değil."
 ETH_MODERN_DAY_DESC:0 "Etiyopya'nın monarşisi 1974'te, ardından gelen komünist diktatörlüğü ise 1991'de devrildi. 1995 anayasası bir ölçüde istikrarlı bir demokrasi sağladı, ancak açlık, siyasi kriz ve yolsuzluk sorunlarına çözüm getiremedi."
 FIN_MODERN_DAY_DESC:0 "Tarafsızlığını korumaya her zaman önem veren Finlandiya, Sovyetler Birliği'nin çöküşünü ve ardından batı Avrupa entegrasyoncu projesinin siyasi genişlemesini dikkatle izledi. Finler 1995'te AB'ye katıldı ve ulusal para birimi olarak Avro'yu da benimsedi. Barış sürebilir mi? Ruslar gerçekten yatıştı mı?"
 ITA_MODERN_DAY_DESC:0 "İtalya, 20. yüzyılın başından beri diğer Büyük Güçlerin hafifçe gerisinde kaldı. İkinci Dünya Savaşı'ndaki yenilgisinden sonra İtalya'nın eski düşmanlarıyla ve eski müttefiki Almanya ile kurduğu güçlü bağ, onu yeniden yüksek düzeyde gelişmiş ve müreffeh bir ülke konumuna getirdi. Peki gelecek ne getirecek? Ulusal büyüklük mü, ekonomik felaket mi?"
 GRE_MODERN_DAY_DESC:0 "Yunanistan, zaten kırılgan olan ekonomisini daha da zayıflatan 2008 durgunluğunun ardından çalkantı içinde. Artan borç/GSYİH oranı ile radikal partilerin yükselişinden kaynaklanan gerilimler, Yunanistan'ın durumunu her geçen gün kötüleştiriyor. Ayrıca Yunanistan ve Türkiye'nin ilişkileri hâlâ gergin; bu da herhangi bir küçük olayın iki ülkeyi savaşa sürükleyebileceği anlamına geliyor.\n\nYunanistan kendini çöküşün eşiğinde buluyor; en küçük karar bile ülkeyi kurabilir ya da yıkabilir. Umalım ki doğru tercihleri yaparsınız."
 NRY_MODERN_DAY_DESC:0 "Norveç 1994'te Avrupa Birliği'ne katılmama yönünde oy kullandı ve sonrasında bir ölçüde Avrupa'dan uzak durdu. Yine de ülke bir NATO üyesi olmayı sürdürüyor ve kısa ama kritik bir sınırı, mutlaka temkinli olması gereken güçlü bir komşu olan Rusya Federasyonu ile paylaşıyor."
 SWE_MODERN_DAY_DESC:0 "İsveç, 1990'ların başında derin bir ekonomik kriz yaşadı ve ülkenin 1995'te AB'ye katılması sorunlarını hafifletmek için pek bir şey yapmadı. İsveç geleneği gereği askeri bakımdan tarafsız kalan İsveç ulusu, mevcut sorunlarına ekonomik yanıtlar bulmak zorunda."
 POL_MODERN_DAY_DESC:0 "Polonya, 2004'te Avrupa Birliği'ne katılmasından bu yana muazzam biçimde büyüdü. Artık bölgesel bir güç ve Avrupa'nın en hızlı büyüyen ekonomilerinden biri. Avrupa'nın en önemli güçlerinden biri olma yolunda ilerliyor. Polonya'nın mevcut siyasi durumu ilginç; PiS iktidara geldi ve AB ile ilişkiler gerginleşti. Kararlı biçimde Rus karşıtı bir ülke olan Polonya, Amerika Birleşik Devletleri ile ilişkilerini güçlendirmek için büyük çaba harcadı."
 SWI_MODERN_DAY_DESC:0 "Çok eski zamanlardan beri tarafsız olan İsviçre, hem NATO hem Avrupa Birliği dışında kalmaya karar verdi. Uluslararası toplum hâlâ İsviçre'nin her zaman olduğu gibi sessiz hakem ve tarafsız zemin olmasına güvenebilir mi? Yoksa İsviçre halkı hükümetinin barışı korumak ve İsviçre'nin ulusal çıkarlarını savunmak için yurtdışında daha etkin bir rol almasını mı görecek?"
 BRM_MODERN_DAY_DESC:0 "Bir zamanlar uluslararası toplumun gözdesi olan Aung San Suu Kyi, uluslararası kamuoyundaki talihinde dramatik bir tersine dönüş yaşadı. Artık karizmatik ve etkileyici bir insan hakları savunucusu değil; Arakan Krizi, Myanmar'ın fiili liderini birçoklarının gözünde nefret edilen bir savaş suçlusuna dönüştürdü. Ülkenin sınırları içinde isyancı gruplar ve hâlâ güçlü askeri generaller zayıflık belirtilerini gözetliyor. Uluslararası ve yerel bu ikili açmaz, Myanmar hükümetinin önüne önemli tercihler koyuyor. Arakan'daki Müslümanlara yönelik şiddete izin vermek ya da durdurmak. Batı ile ilişkileri onarmaya çalışmak ya da askeri cuntanın eski müttefiki Çin'e yaslanmak. Yanıt hiç de net değil."
 NIG_MODERN_DAY_DESC:0 "Nijerya'nın son on yılı, İslam Devleti'nin Boko Haram'ın büyük ayaklanmasını ve Nijerya'nın kuzeydoğusundaki Selefi isyancıları desteklerken gerçek yüzünü gösterdi. Nijerya ordusu yeni tür gerilla savaşında inanılmaz derecede etkisiz kaldı. Nijerya hükümeti Borno eyaleti üzerindeki denetimini giderek daha fazla yitirirken bu, yavaş yavaş büyük bir bölgesel çatışmaya dönüştü.\n İsyanı bitirecek misiniz, yoksa küresel cihada mı katılacaksınız?"
 BHR_MODERN_DAY_DESC:0 "Bahreyn, sözde «Arap Baharı»nın bir parçası olarak Orta Doğu'ya yayılan protesto dalgasından kurtulamayan bir ülkedir. Öfke Günü'nde Şii çoğunluk, yalnızca Şiilere karşı ayrımcı değil, aynı zamanda yabancı bir işgalci ve gerçek yerli Bahreynli halkın bir ezeni olarak algılanan bir monarşiye karşı öfkesini kustu. Yarımada Kalkanı müdahale etmeseydi monarşi 2011'de çökmüş olabilirdi.\n\nBu nedenle Halife hanedanının önceliği, Şii düşmanlığı karşısında iktidarını korumaktır. Tarihsel olarak Sünni muhalefet daha büyük bir tehdit oluştursa da İran nüfuzunun hayaleti ve sınırlı siyasi liberalleşme bu tehdidin en azından şimdilik yatışmasına yol açtı."
 KUW_MODERN_DAY_DESC:0 "Kuveyt uluslararası alanda nispeten rahat bir konuma sahiptir. Egemenliğine yönelik en büyük tehdit olan Saddam Hüseyin'in Irak'ı, 2003 Amerikan işgaliyle ortadan kaldırıldı ve Kuveyt, Orta Doğu'nun tüm bölgesel aktörleriyle iyi ilişkiler sürdürmeyi başardı.\n\nKuveyt'in acil olmasa da en büyük sorunu içeride. Ülkenin yarı demokratik yönetim sistemi hükümetin meşruiyetini güçlendirdi ancak Kuveyt'in petrole bağımlı ekonomisini çeşitlendirmek için gereken reformları engelledi. Üstelik Kuveyt'in reformları, hükümet sansürüne ve siyasi aktivistlere yönelik ara sıra yaşanan baskıya karşı çıkmaya devam eden muhalefeti tamamen yatıştırmadı."
 OMA_MODERN_DAY_DESC:0 "Umman, huzursuz ve çatışmaya yatkın bir bölgede barış ve istikrarın bir feneri olarak ün kazandı. Kabus bin Said el Said, 1970'te iktidara geldiğinden beri başarılı bir dış politika izledi ve hiç kimse tarafından nefret edilmeyen, herkes tarafından takdir edilen bir ülkeyi yönetti. Ancak Umman'ın da zorlukları yok değil. Sultan, iç muhalefete yönelik sert yaklaşımı nedeniyle eleştirildi; bu durum mutlak monarşinin sürdürülebilirliği konusunda belirsizlik yaratıyor. Üstelik Yemen'deki savaş yeni bir tehdit açtı. Umman, bölgenin Umman'daki Zufar ile yakın kültürel bağları nedeniyle Yemen'in el-Mehre eyaletini tarihsel olarak nüfuz alanının bir parçası saymıştır. Ancak Suudi askerlerinin varlığı Umman'ın sınırını tehdit ediyor ve Suudi savaş çabasını gizlice baltalamak anlamına gelse bile Umman devleti buna tahammül etmeyecektir."
 QAT_MODERN_DAY_DESC:0 "Katar, 1996'dan beri Körfez İşbirliği Konseyi içinde bağımsız bir rota izledi. Ülkenin doğal gaz rezervleri Katar'ın Suudi egemenliğindeki petrol piyasasının dışında faaliyet göstermesine olanak tanıdı ve onlarca yıldır Katar emirleri, Suudilerin ve Emirlerin otoritelerine giderek daha fazla tehdit olarak görmeye başladığı bir örgüt olan popülist Müslüman Kardeşler ile yakın bir ilişki yürüttü. El Cezire'nin yurdu olan Katar, Arap Baharı olarak bilinen Arap ayaklanmalarının yayılmasından kısmen diğer Arap otokrasileri tarafından sorumlu tutuluyor. Suudilerin ve Emirlik müttefiklerinin gözünde en kötüsü, Katar'ın varoluşsal tehdit olarak gördükleri bir devlet olan İran ile yakın ilişkisidir. Katar'ın komşularının onun özgün dış politikasına duyduğu düşmanlığın kaynama noktasına ulaşması an meselesidir."
 SAU_MODERN_DAY_DESC:0 "Suudiler, Orta Doğu'nun bir dizi önemli olayla geri döndürülemez biçimde dönüştüğünü izledi. Önce 2003 olayları, Suudi Arabistan, Irak ve İran arasındaki güç mücadelesinde önemli bir aktörü ortadan kaldırdı ve ardından gelen iç savaşın sonucunda Sünniler ile Şiiler arasındaki mezhep gerilimlerini alevlendirdi. Sonra Suudiler, Arap dünyasındaki dost rejimlerin Arap Baharı olarak bilinen olgu tarafından devrilişini dehşetle izledi. Son olarak Suudiler, Amerika'nın bölgeden kademeli çekilişini ve Obama döneminde İran ile yakınlaşmasını endişeyle gözlemledi. Tüm bunlar Suudileri daha proaktif bir dış politikanın gerekliliğine ikna etti; bu politika monarşiyi Orta Doğu genelinde İran nüfuzuna karşı saldırgan biçimde karşı koymaya yöneltti. Lübnan'dan Yemen'e, Suriye'den Irak'a cephe hatları çiziliyor."
 SIN_MODERN_DAY_DESC:0 "Singapur'un finans sektörü son yıllarda patlama yaptı. Ülke, bölgedeki diğer ülkelere örnek bir model olarak Güneydoğu Asya'nın ilgi odağını yavaş yavaş üzerine çekti. İş dünyası yanlısı mevzuatı, inanılmaz büyümeyi sürdürmesine ve kişi başı GSYİH bakımından gezegenin en zengin ülkelerinden biri olmasına olanak tanıdı. Aslan Şehir patlamaya ve genişlemeye devam ediyor, ancak Çin bu şehri gölgede bıraktı ve ufukta beliren daimi bir tehdit olmayı sürdürüyor."
 PHI_MODERN_DAY_DESC:0 "Ekonomik olarak Filipinler, en az yüzde 5 büyüme oranlarını sürdürmeye devam ettiği için yeni sanayileşen ülkelerden biri olarak anılıyor. Kaplan Yavruları Ekonomileri'nden biri olarak önemli yükselen piyasalar listesinde yer almayı sürdürebildi. Yakın zamanda 2016 seçimiyle Rodrigo Duterte iktidara geldi ve Kartellere karşı saldırgan bir savaşı sürdürme sözünün yanı sıra Moro İslami Kurtuluş Cephesi'ne karşı yumuşayan bir tutumla, Moroların haksız muamele gördüğünü ve temsillerinin genişletilmesini istediğini belirtti.\n"
 UAE_MODERN_DAY_DESC:0 "Amerikalı yetkililer tarafından sevgiyle «Küçük Sparta» lakabı takılan Birleşik Arap Emirlikleri, hem Amerika Birleşik Devletleri'nin hem Suudi Arabistan'ın yakın müttefiki ve çok taraflı askeri operasyonlara istekli bir katılımcı olmuştur. Emirlik silahlı kuvvetleri, özellikle saygın hava kuvvetleri ve seçkin Cumhurbaşkanlığı Muhafızları, Afganistan, Libya, Kosova, Somali ve şimdi Yemen'de görev yaptı. Ancak BAE yalnızca ABD'nin veya Suudi Arabistan'ın ikinci kemanını çalmakla yetinmiyor. Emirlikler dış nüfuz bakımından ağırlığının üzerinde bir etki yarattı; zaman zaman eski müttefikleriyle rekabet etti, örneğin Yemen'de Suudi destekli Hadi hükümetiyle geçici olarak müttefik olan ayrılıkçıların arkasına ağırlığını koydu. Ayrıca BAE, ekonomik çeşitlendirmenin tek başarılı örneğine ev sahipliği yapıyor; Dubai küresel bir şehir ve finans merkezi olarak ün kazandı."
 CAN_MODERN_DAY_DESC:0 "1982'de Birleşik Krallık'tan tam bağımsızlığını kazanan Kanada, dünyanın 4. büyük petrol ihracatçısıdır ve terörle mücadele operasyonlarında önde gelen ülkelerden biri olduğunu kanıtlamıştır. Dünyanın ikinci büyük kara parçasına sahip olan Kanada, çoğunlukla buz ovaları ve dağlardan oluşur ve nüfusunun çoğu ülkenin güneyinde yaşar. Emrinde büyük miktarda kaynak bulunan Kanada, sonsuz olanaklara ve potansiyele sahip bir ülkedir."
 KOR_MODERN_DAY_DESC:0 "Kore, tarihinin en dramatik başkanlık skandallarından birinin ortasında. Büyük gösterilerin ardından muhafazakâr Cumhurbaşkanı Park Geun-hye, Rasputin benzeri danışmanı Choi Soon-sil'in karanlık nüfuzu nedeniyle Ulusal Meclis tarafından yeni azledildi. İktidar partisi kaos içindeyken ve birkaç ay içinde yeni seçimlerin çağrılması muhtemelken, sahne sol görüşlü Demokrat Parti'nin iktidara dönüşü için hazır görünüyor.\n\nBaşkan adayı Moon Jae-in Mavi Saray'a ulaşırsa Kore siyasi sistemine güveni yeniden tesis etmesi, iddialı bir ekonomik gündemi hayata geçirmesi ve ABD başkanlık seçiminin ardından ABD ile Kuzey Kore arasında muhtemelen gergin olacak ilişkileri yönetmesi gerekecek."
 NKO_MODERN_DAY_DESC:0 "Genç ve toplu Kim Jong-un, Demokratik Halk Cumhuriyeti'nin Yüce Lideri olarak babasının makamını devralma zamanı geldiğinde birçokları tarafından hafife alındı. O zamandan beri bu İsviçre'de eğitim görmüş, az anlaşılan figürün hesaba katılması gereken bir güç olduğu açıkça anlaşıldı. İktidarı acımasızca pekiştirmesi, Kim'in amcasının ve bir dizi başka yetkilinin idamını içeriyordu; haberler doğruysa bir idam uçaksavar topuyla gerçekleştirildi. Ancak genç Kim'in konumu tamamen güvende değil. Kurum saflarındaki muhalefet sürüyor ve iddialı ekonomik reform gündemi hâlâ ivme kazanıyor. Kuzey'in Kim Hanedanı'nın son temsilcisi, babası ve dedesi gibi devleti ayakta tutabilecek mi? Yoksa krallığının çöküşüne mi tanık olacak?"
 BOT_MODERN_DAY_DESC:0 "Botsvana, istikrarlı demokrasisi, yüksek insani gelişme endeksi ve düşük yolsuzluğuyla Afrika'nın en gelişmiş ülkelerinden biridir. Botsvana servetini büyük miktarlarda elmas bulunmasının ardından kazandı; bu, Afrika'nın en yüksek kişi başı GSYİH'lerinden birine yol açtı. Ancak sorunsuz değil; siyasete, birçoklarının otokratik ve dışlayıcı gördüğü BDP partisi hâkim. Ayrıca ülkenin pek çok av rezervinde kaçak avcılık yaygın. Elmaslar da sonsuza dek sürmeyecek ve ekonomi için alternatifler bulacak bir çözüm bulunmalı."
 AFG_MODERN_DAY_DESC:0 "Koalisyon güçlerinin yardımıyla Kuzey İttifakı, Taliban rejimini başarıyla devirdi. Yok edilmek yerine Taliban parçalandı ve Afganistan'ın çeşitli bölgelerinde isyan yürütmeye başladı; koalisyon ve hükümet güçleri için hâlâ önemli bir tehdit oluşturuyor. Koalisyon güçlerinin bazı eylemleri Taliban'ın büyümesinin nedenleri arasında olsa da merkezi hükümetin verimsizliği ve yolsuzluğu ile Afganistan'ın kendine özgü modern öncesi aşiret kültürü, Taliban militanlarının Pakistan'ın bazı bölgelerinde saklanıp yeniden örgütlenerek Afganistan'daki savaşa dönebilmesinin yanı sıra, Taliban'ın yok edilmesini zorlaştıran başlıca nedenlerdir. Hükümet güçleri Taliban isyanını bitirecek mi? Yoksa Taliban'ı silahlarını barışçıl biçimde bırakıp hükümete katılmaya ikna edecek bir barış anlaşması mı olacak?"
 LIC_MODERN_DAY_DESC:0 "Lihtenştayn, Avrupa'nın kalbinde küçük ve gösterişsiz ama iyi gelişmiş bir ülkedir. Yalnızca yaklaşık otuz sekiz bin nüfusu ve dünyadaki yalnızca iki çifte kara ülkesinden biri olması nedeniyle kimsenin Lihtenştayn'dan fazla bir şey beklemediğini söylemek güvenlidir. Hem ekonomisi hem güvenliği için Alpler'deki komşularına büyük ölçüde bağımlı olan Lihtenştayn'ın önünde birçok zor tercih var. Uluslararası işbirliğinin bir kalesi mi, yoksa kötü niyetli uluslararası şirketlerin sığınağı mı olmalı? Gerçek bir askeri güç olma çabasıyla dünyanın dört bir yanından mültecileri kabul etmeli mi, yoksa sınırlarını kapatıp yalnızca kendine mi odaklanmalı? Yalnızca zaman gösterecek."
 COM_MODERN_DAY_DESC:0 "Komorlar kendi payına düşen eylemi gördü. 2008'de Anjuan'ın denetimini geri almak için yapılan işgal başarılıydı. Pek çok vatandaş ne yazık ki yoksul bir yaşam sürüyor ve birçoğu daha iyi bir yaşam arayışıyla Mayotte'a kaçıyor. Doğu Afrika Topluluğu üyeliği için iyi beklentiler var. Bu, Komorlar'a gelecek yatırım fırsatlarını büyük ölçüde artırabilir ve binlerce kişinin yaşam standardını yükseltebilir. Büyük olasılıkla bu ülke hayatı her zamanki gibi sürdürecek."
 MILLENNIUM_DAWN:0 "Binyıl Şafağı"
 MILLENNIUM_DAWN_DESC:0 "Dünya değişti. Küresel olarak konuşursak, yaklaşık yarım yüzyıldır bir barış ve refah atmosferi hüküm sürüyor. Ancak Soğuk Savaş'ın yakın zamanda sona ermesi ve Çin Halk Cumhuriyeti'nin yükselişiyle bu dünya kendini nasıl görecek? Kendini nasıl şekillendirecek? Amerika Birleşik Devletleri hâkimiyetini sürdürecek mi? Yeni Rusya Federasyonu kendi yolunu ilgi odağına doğru bulacak mı? Britanya, Fransa ve Almanya gibi eski büyük Avrupa imparatorlukları hangi rolleri oynayacak? Dünyanın demokrasileri ideolojilerini yaymada hangi rolü oynayacak? Ve terörizmin gölgesi hangi rolü oynayacak? Dünya değişti ve yeni binyıla girerken değişmeye devam edecek."
 CHI_MILLENNIUM_DAWN_DESC:0 "Dünün ücra köşesi. Yarının süper gücü. Onlarca yıllık Avrupa zorbalığı ve daha da fazla onlarca yıllık iç savaş, çekişme ve Japon işgalinden sonra Çin, kendini Asya'nın ve nihayetinde dünyanın en önde gelen gücü olarak yeniden inşa etmeye bakıyor. \n\nKomünist Parti'nin liderliğinde yeni bir Çin inşa etmede büyük adımlar atıldı. Ancak bu yeni Çin değişken. Çin çok yavaş reform yaparsa yıkılabilir. Çok hızlı reform yaparsa kendini yok edebilir."
 FRA_MILLENNIUM_DAWN_DESC:0 "Sanatın, kültürün ve diplomasinin küresel merkezi olan Fransa, umut ve fırsatlarla dolu yeni bir yüzyıla parlak gözlerle bakıyor. Eski monarşilerin zulmü ve Büyük Savaş ile İkinci Dünya Savaşı sırasındaki benzeri görülmemiş yıkım Fransa'yı Avrupa Birliği'ne doğru itti ve Fransız Devrimi'nin özgürlük, kardeşlik ve eşitlik ilkelerini izledi. Bu nedenle Fransa, Avrupa Birliği'nin kurucu üyesi oldu ve bu değerleri üye devletler ve dünyanın diğer ulusları arasında yerleştirmeye çalıştı. Fransa demokratik değerleri korumaya devam edecek mi, yoksa bu binyılda Fransa için yeni bir rota mı çizilecek?"
 GER_MILLENNIUM_DAWN_DESC:0 "Sovyetlerin çekilmesi ve Doğu ile Batı Almanya'nın yeniden birleşmesi ulusa yeni umut verdi. Almanya'nın travmatik geçmişi ve faşizmin dehşeti genel halk tarafından unutulmadı. Şimdi Almanya, güçlü bir sosyal refah sistemi ve Avrupa'nın en güçlü ekonomilerinden biriyle Avrupa'nın en demokratik ülkelerinden biri olarak duruyor. \n\nAvrupa Birliği'nin kurucu üyesi olan Almanya, olası bir Rus canlanmasına karşı bloğu Doğu Avrupa'nın eski Sovyet devletlerini de kapsayacak şekilde genişletmeyi hedefliyor."
 JAP_MILLENNIUM_DAWN_DESC:0 "Yaklaşık 6.852 adadan oluşan bir ülke olan Japonya'nın denizci halkı, İkinci Dünya Savaşı'ndan ve Hiroşima ile Nagazaki'ye atılan atom bombalarından bu yana uzun bir yol kat etti. Bugün Japonya, teknolojik yeniliği ve tüm dünyaya gönderilen kaliteli ürünleriyle ünlü, dünyanın ikinci büyük ekonomisi olarak duruyor. \n\nAmerikalı ve Avrupalı müttefiklerinin desteğiyle Japonya, eski rakibi Çin'e hem yeni bulduğu özgüvenle hem de yeni çatışma potansiyeliyle temkinli bakıyor."
 SOV_MILLENNIUM_DAWN_DESC:0 "Ağustos Darbesi ve 1991'de Sovyetler Birliği'nin ardından gelen çöküşü, Rus ekonomisini paramparça, gururunu sarsılmış ve geleceğini karanlık bir hale getirdi. Oligarklar ve yozlaşmış yetkililer, güçlü bir merkezi otoritenin yokluğunda güç boşluğunu doldurdu. \n\nVladimir Putin'in yakın zamandaki yükselişi, bu eski KGB subayının Rusya'nın mirasını nasıl yeniden tesis etmeye ve onu yeni bir çağa taşımaya çalışacağını birçok kişiye merak ettiriyor."
 ENG_MILLENNIUM_DAWN_DESC:0 "Hong Kong'un 1997'de Çin'e devredilmesiyle Birleşik Krallık, son büyük sömürge mülküne veda etti. Bir zamanlar dünyanın en güçlü ulusu olan ülke, kendini yeniden tanımlamaya ve büyüklük ve şan için yeni bir yol bulmaya çalışıyor. İki partili sistem siyasi alanı ikiye bölüyor: Muhafazakâr ya da İşçi. Ülkenin Ulusal Sağlık Hizmeti'nden ordunun politikalarına kadar nasıl yönetileceği konusunda artan anlaşmazlıklar var.\n\nBu yol Amerika Birleşik Devletleri ile sürekli işbirliğinde mi yatacak? Britanya Avrupalı kardeşlerine mi yaklaşmalı? Yoksa Britanya, tek başına, yeniden denizlere mi hükmedecek?"
 USA_MILLENNIUM_DAWN_DESC:0 "Sovyetler Birliği'nin çöküşü dünyanın ilk tek kutuplu anına yol açtı. Amerika Birleşik Devletleri, dünya genelinde işleyen tüm teknolojik, askeri ve kültürel güçlerin ön saflarında duruyor. Erişimi hiç bu kadar geniş olmamıştı ve geleceği hiç bu kadar parlak görünmemişti. \n\nYaklaşan seçimler, Amerika'nın ve iyisiyle kötüsüyle dünyanın gelecekteki seyrini belirlemede kritik bir an olacak."
 TUR_MILLENNIUM_DAWN_DESC:0 "Birinci Dünya Savaşı'nın sonunda Osmanlı İmparatorluğu'nun çöküşünden bu yana Türkiye büyük ölçüde jeopolitik meselelerin arka planında kaldı. Şimdi Türkiye'nin konumu, rakip ideolojiler ülkeyi bir yana ya da diğerine kaydırmak için çalışırken onu bir kez daha ilgi odağı yapıyor. \n\nCumhuriyet Atatürk'ün reformlarını sürdürüp AB ile tanınma mı aramalı, yoksa İslami mirasına sadık mı kalmalı? Başbakan Bülent Ecevit'in kötüleşen sağlığı, önümüzdeki dönemin belirsiz olduğuna işaret ediyor."
 UKR_MILLENNIUM_DAWN_DESC:0 "1999 seçimlerinin Ulusal Hareket'in liberal lideri Viyaçeslav Çornovil'e koşulsuz bir zafer getirmesi bekleniyordu. Ancak kısa süre sonra gizemli koşullarda bir trafik kazasında öldü. Mevcut başkan Leonid Kuçma, dürüst sloganlar ve popülist vaatlerin yokluğu sayesinde seçimi kazandı. Ancak görev süresinin ne getireceği hâlâ şüpheli. \n\n1996'da nükleer statüsünden mahrum bırakılan ve Budapeşte Memorandumu'nu imzalayan Ukrayna, en güçlü devletlerden koruma güvenceleri ve dünya sahnesine bir bilet aldı. Ancak genç ülke gelecekteki gösteride kim olacak? Doğrudan bir katılımcı mı, yoksa son sıralarda yalnızca bir seyirci mi?"
 BRA_MILLENNIUM_DAWN_DESC:0 "Brezilya yüzyılın başında yavaş yavaş yükseliyor. Ülke büyüklük potansiyeline sahip. Dünyanın en büyük yükselen ekonomilerinden biri ve büyümesi hızlanmaya devam etti. Ancak son yıllarda Brezilya ekonomisi, 1995 Asya Mali Krizi ve sakat bir para birimi nedeniyle yaşanan sert bir durgunluktan geri çekiliyor. Şimdi sahneye yeni bir parti rakibi çıktı. PT devreye girdi ve hızla ivme kazanıyor.\n\nÜlkenin bir zamanlar büyük olan ekonomisini yeniden canlandırabilecek misiniz, yoksa PT ve sosyalist politikaları yönetimi mi ele geçirecek?"
 SMA_MILLENNIUM_DAWN_DESC:0 "San Marino son derece küçük bir ülkedir ve aslında tamamen İtalya'ya bağımlıdır. Denize kıyısı ve havalimanı olmadığı için GSYİH'nin büyük bir bölümünü oluşturan turistlere büyük ölçüde bağımlıdır. İtalya'nın hesabına gitmeye, fiilen onun toprağı olarak kalmaya mı değer, yoksa kendi yolumuza gitmek mi gerekli? Bütün bunlara şu an, Büyük Genel Konsey tarafından 6 aylık süreyle atanan iki kaptan-naip karar veriyor. Büyük Genel Konsey'in 60 üyesi var. Ancak eski zamanlarda en yüksek organ olan, bugün gücünü neredeyse tamamen yitirmiş ama dilekçe hakkını korumuş Aile Reisleri Meclisi Arengo da var. Kaptan Naipler, vatandaşlar tarafından 1 Nisan'dan sonraki ilk Pazar günü ve 1 Ekim'den sonraki ilk Pazar günü sunulan çok sayıda dilekçe alır. Sunulan dilekçeler 6 ay içinde ele alınmalıdır."
 DEN_MILLENNIUM_DAWN_DESC:0 "Danimarka, hem AB hem NATO üyesi olarak güvenli ve emniyetli bir ülkedir. Ancak iç ekonomik bir gerileme ve yavaşlama, yakın zamanda Danimarka devletini zorlamaya başladı. Danimarka'nın daha geniş dünyadaki çalkantılardan etkilenmeden kalmaya devam edip edemeyeceği hiç de kesin değil."
 ETH_MILLENNIUM_DAWN_DESC:0 "Etiyopya'nın monarşisi 1974'te, ardından gelen komünist diktatörlüğü ise 1991'de devrildi. 1995 anayasası bir ölçüde istikrarlı bir demokrasi sağladı, ancak açlık, siyasi kriz ve yolsuzluk sorunlarına çözüm getiremedi. Etiyopya'nın Eritre ile süregelen çatışmasını da çözmedi."
 FIN_MILLENNIUM_DAWN_DESC:0 "Tarafsızlığını korumaya her zaman önem veren Finlandiya, Sovyetler Birliği'nin çöküşünü ve ardından batı Avrupa güçlerinin siyasi genişlemesini dikkatle izledi. Finler 1995'te AB'ye katıldı ve ulusal para birimi olarak Avro'yu benimsemek üzere. Barış sürebilir mi? Ruslar gerçekten yatıştı mı?"
 GRE_MILLENNIUM_DAWN_DESC:0 "21. yüzyıl Yunanistan'a doğarken ülke memnun görünüyor. Ancak yüzeyin altında borç krizi ve spektrumun her iki ucundaki radikal siyasi partilerin yükselişi konusunda artan endişeler var. Helen Cumhuriyeti'nin geleceği belirsiz ve doğru yönlendirilmezse karanlık bir yola girebilir."
 ICE_MILLENNIUM_DAWN_DESC:0 "Avrupa'nın gizli bir köşesinde İzlanda, 1944'teki bağımsızlığından bu yana başarıyla düşük profilini korudu. Britanyalılarla balıkçılık hakları konusundaki siyasi anlaşmazlıklar belki de İzlanda tarihinin en heyecanlı dönemiydi. İzlanda daha merkezi bir tutum almalı mı?"
 ITA_MILLENNIUM_DAWN_DESC:0 "İtalya, 20. yüzyılın başından beri diğer Büyük Güçlerin hafifçe gerisinde kaldı. İkinci Dünya Savaşı'ndaki yenilgisinden sonra İtalya'nın eski düşmanlarıyla ve eski müttefiki Almanya ile kurduğu güçlü bağ, onu yeniden yüksek düzeyde gelişmiş ve müreffeh bir ülke konumuna getirdi. Peki gelecek ne getirecek? Ulusal büyüklük mü, ekonomik felaket mi?"
 NRY_MILLENNIUM_DAWN_DESC:0 "Norveç 1995'te Avrupa Birliği'ne katılmama yönünde oy kullandı ve sonrasında bir ölçüde Avrupa'dan uzak durdu. Yine de ülke bir NATO üyesi olmayı sürdürüyor ve kısa ama kritik bir sınırı, mutlaka temkinli olması gereken güçlü bir komşu olan Rusya Federasyonu ile paylaşıyor."
 IRQ_MILLENNIUM_DAWN_DESC:0 "Irak zorluklara yabancı değil; İranlılarla yeni yeni 8 yıllık bir savaş vermiş olan Irak, borç ve ekonomik sıkıntıdan başka bir şey kazanmadı. Körfez ülkelerine olan borçlarını ödeyemeyen Saddam Hüseyin 1990'da Kuveyt'i işgal etti. Savaşın başlamasından kısa süre sonra koalisyon güçleri karşısında aşağılayıcı bir yenilgi yaşayan Irak, hâlâ toparlanmak ve yeniden inşa olmak için mücadele ediyor. Yaptırımlar Irak ekonomisini felç ederken ve Saddam Hüseyin ile Baas rejimi giderek daha otoriter bir tutum benimserken, Irak toplumunun büyük kesimleri kendilerini mevcut yönetim düzeniyle çelişir halde buluyor. Irak'ın kargaşaya mı sürükleneceğini yoksa bin yıllık bir altın çağı mı getireceğini yalnızca zaman gösterecek."
 RAJ_MILLENNIUM_DAWN_DESC:0 "Çin yarının süper gücüyse Hindistan gelecek haftanın süper gücüdür. Bir zamanlar bir İngiliz sömürgesiyken şimdi bağımsız, yükselen bir güç olan Hindistan, kuzey ve batıdaki komşusuyla anlaşmazlık içindedir. Keşmir'deki çatışma, Hindistan'ın önümüzdeki yıllar için tüm jeopolitik paradigmasını inşa etti. Şimdi Hindistan yeni bir yüzyıla girerken nihayet dizlerinin üzerinden kalkmalı ve Asya Kaplanı'nın tüm gücünü göstermelidir. Hindistan süper güç olabilir mi, yoksa uzun bir gerilemeye mi düşecek? Ve gelecek binyıl onun için ne tutuyor?"
 SPR_MILLENNIUM_DAWN_DESC:0 "1975'te Franco'nun ölümünden bu yana İspanya uzun bir toparlanma yolunda. Ekonomik ve toplumsal zorluklar boyunca ülke, onlarca yıllık faşizmin yol açtığı sorunları kısmen çözmeyi başardı. İspanya NATO'ya (1982) ve AB'ye (1986) katıldı ve Avrupa'nın daha güçlü ve zengin büyük ülkelerine, yani Almanya, Fransa, Britanya ve İtalya'ya yetişmek için yorulmadan ve en büyük çabalarla çalıştı.\nBöyle zamanlarda İspanya'nın güçlü bir liderliğe ve sağlam bir ele ihtiyacı var. Başbakan Aznar başarabilecek mi? Yoksa Halk Partisi daha layık bir liderliğe mi yer verecek?"
 SWE_MILLENNIUM_DAWN_DESC:0 "İsveç, 1990'ların başında derin bir ekonomik kriz yaşadı ve ülkenin 1995'te AB'ye katılması sorunlarını hafifletmek için pek bir şey yapmadı. İsveç geleneği gereği askeri bakımdan tarafsız kalan İsveç ulusu, mevcut sorunlarına ekonomik yanıtlar bulmak zorunda."
 SWI_MILLENNIUM_DAWN_DESC:0 "Çok eski zamanlardan beri tarafsız olan İsviçre, yalnızca NATO ve Avrupa Birliği dışında değil, hatta Birleşmiş Milletler dışında kalmaya karar verdi. Uluslararası toplum hâlâ İsviçre'nin her zaman olduğu gibi sessiz hakem ve tarafsız zemin olmasına güvenebilir mi? Yoksa İsviçre halkı hükümetinin barışı korumak ve İsviçre'nin ulusal çıkarlarını savunmak için yurtdışında daha etkin bir rol almasını mı görecek?"
 BRM_MILLENNIUM_DAWN_DESC:0 "Myanmar, 21. yüzyılın başında bir yol ayrımında duruyor. Askeri cunta, hem içeriden hem dışarıdan gelen demokratikleşme baskısı giderek güçlendikçe iktidar üzerindeki kontrolünün giderek gevşediğini fark etti. Ancak Myanmar hükümetinin önündeki tek sorun demokratikleşme ya da onun yokluğu değil. Bu Güneydoğu Asya ülkesinin toprak bütünlüğü bağımsızlıktan beri sarsıntılı; daha fazla özerklik için savaşan isyancı gruplar Myanmar'ın sınır bölgelerini bunaltıyor. Bu ikili açmazın çözümleri belirsiz kalıyor. Şiddet mi diplomasi mi? Demokrasi mi otoriterlik mi? Uzlaşma mı devrim mi? Yalnızca zaman gösterecek."
 LIC_MILLENNIUM_DAWN_DESC:0 "Lihtenştayn, Avrupa'nın kalbinde küçük ve gösterişsiz ama iyi gelişmiş bir ülkedir. Yalnızca altı bin nüfusu ve dünyadaki yalnızca iki çifte kara ülkesinden biri olması nedeniyle kimsenin Lihtenştayn'dan fazla bir şey beklemediğini söylemek güvenlidir. Hem ekonomisi hem güvenliği için Alpler'deki komşularına büyük ölçüde bağımlı olan Lihtenştayn'ın önünde birçok zor tercih var. Uluslararası işbirliğinin bir kalesi mi, yoksa kötü niyetli uluslararası şirketlerin sığınağı mı olmalı? Gerçek bir askeri güç olma çabasıyla dünyanın dört bir yanından mültecileri kabul etmeli mi, yoksa sınırlarını kapatıp yalnızca kendine mi odaklanmalı? Yalnızca zaman gösterecek."
 POL_MILLENNIUM_DAWN_DESC:0 "Polonya yakın zamanda Sovyetler Birliği'nin komünist bloğundan kurtuldu. Ülkedeki mevcut durum mükemmel olmaktan çok uzak. Komünizmin çöküşünden bu yana Polonya ekonomisinin büyümesine rağmen Polonya halkı mücadele etmeye devam ediyor. Bu zorluklara rağmen ulusun kendisi önemli bir ekonomik güç olma konusunda büyük bir potansiyele sahip. Kaostan yararlanarak iki rakip parti siyasi arenaya girdi: Avrupa şüpheci PiS ve Avrupa Birliği'ne sadık PO. Bu partilerin farklı görüşleri Polonya'yı bir Orta Avrupa ekonomik gücü yapabilir ya da komşularını yabancılaştırıp fetih yoluna yeniden sokabilir. Ayrıca bu 4 ülkenin en güçlüsü olarak Polonya'nın Polonya, Çek Cumhuriyeti, Slovakya ve Macaristan'ın tek bir bayrak altında nihai birleşmesine karar verebileceği ünlü Vişegrad Grubu'nu birleştirme fırsatı da vardı. Ancak iki büyük siyasi parti birbirine karşı savaşırken bazıları gölgelerden çıkmak için yalnızca beklemekte. Janusz Korwin-Mikke liderliğindeki milliyetçi UPR partisi bu düelloda galip gelebilir ve bu, Polonya'ya devasa değişiklikler getirecektir. Ancak bir milliyetçi tahta bu kadar kolay çıkamaz. Polonya'da komünizmi deviren anti-komünist Dayanışma'nın eski lideri Lech Wałęsa, ChDRP partisiyle siyasette hâlâ mevcut ve Korwin'in ülkeyi kaosa sürüklememesini sağlamak için her çabayı gösterecek."
 CZE_MILLENNIUM_DAWN_DESC:0 "Avrupa'nın ortasında yer alan bir ülke olan Çek Cumhuriyeti, Yeni Binyıla pek parlak olmayan bir durumda giriyor. Komünist rejim çoktan bitti ama Çekoslovakya da öyle. Ekonomi hâlâ tam olarak toparlanmadı ama özelleştirme süreci bitmek üzere ve tazminatlar tamamlanmaya doğru düz bir çizgide ilerliyor.\n\n Siyasi alan istikrarlı ama kaotik görünüyor. İki büyük rakip, muhafazakâr ODS ve sosyal demokrat ČSSD parlamentoya hâkim olurken diğer partiler hâlâ yeni koalisyonlar arıyor. ODS, KDU-ČSL ve yeşillerle ilişkilerini sürdürürken ČSSD son komünist parti KSČM ile işbirliğini derinleştiriyor.\n\nSiyasi eylemlerden bağımsız olarak bağımsız şirketler yabancı pazara açılmaya çalışıyor. Otomotiv şirketleri Škoda ve Tatra Çek araçlarını yükseltmenin yeni yollarını geliştirirken VOP CZ askeri sektörü iyileştirmek için daha fazla yol arıyor. Şirketler bağımsız ama ortak ilişkilerle çalışıyor. Küçük bir olay dönüşü sonunda onları tek bir büyük tekelde birleştirebilir.\n\nAma söylenecek daha çok şey var. Askeri general Petr Pavel, NATO'daki ve Çek Cumhuriyeti'ndeki kariyerini büyük ölçüde ilerletmek üzere. Deneyimi ve eğitimi sayesinde ülkeleri, Çek Cumhuriyeti'nin egemenliğine yönelik yaklaşan bir tehdide hazırlamak için yönetmek zorunda kalacak. Peki ABD'yi müttefik olarak tutarak NATO'da kalıp kariyerine devam edecek mi? Yoksa belki de korkulması gereken ABD midir?"
 NIG_MILLENNIUM_DAWN_DESC:0 "Afrika'nın en kalabalık ülkesi olan Nijerya, yüzyıl başından beri 200 milyonu aşan vatandaşından oluşan demografik avantajından ve genişleyen finans sektöründen yararlanarak uluslararası piyasalardaki tutunma noktasını güçlendirmek suretiyle bölgesel öne çıkışa istikrarlı biçimde yükseldi. Ülkenin 1999'da sivil yönetime geçişi, hem yurt içinde hem yurtdışında destek toplayan kırılgan ama umut vadeden bir demokratik sistem kurdu ve Batı Afrika genelinde daha büyük diplomatik etkiye olanak tanıdı. Ancak bu demokratik deney, on iki kuzey eyaletinin 2000'den beri değişen derecelerde Şeriat hukuku uygulamasıyla kritik bir meydan okumayla karşı karşıya ve dini çizgilerde keskin bir bölünme yaratıyor. Hristiyan çoğunluklu güney yaygın gösterilerle ve toplumsal huzursuzlukla karşılık verirken Kaduna ve Plateau eyaletleri gibi karma inançlı bölgelerde mezhepsel şiddet patlak verdi. Dini gerilimler tırmanıp her iki tarafta da silahlı milisler oluşurken soru belirginleşiyor: Ağırlıklı olarak Müslüman kuzey ile Hristiyan güney arasındaki dini kutuplaşma Nijerya'yı sonunda iç savaşa mı götürecek?"
 BHR_MILLENNIUM_DAWN_DESC:0 "Bahreyn'in yeni taç giyen emiri Hamad bin İsa Al Halife, tehlikeli bir konumu devralıyor. Bahreyn'in Şii çoğunluğu, yalnızca Şiilere karşı ayrımcı değil, aynı zamanda yabancı bir işgalci ve gerçek yerli Bahreynli halkın bir ezeni olarak algılanan bir monarşiye karşı önemli bir hayal kırıklığı besliyor. Sünni muhalefet, farklı nedenlerle de olsa Bahreyn hükümetinin otokratik doğasına içerliyor ve mutlak monarşinin sürmesine karşı çıkan Şii gruplarla saf tuttu. Emirin bazı danışmanları rejimin üzerindeki baskıyı azaltmanın yolu olarak siyasi liberalleşmeyi savunurken diğerleri otokratik yönetimin güçlendirilmesini savundu. Ülkenin rotasını çizmek Bahreyn'in yeni yöneticisine kalacak."
 KUW_MILLENNIUM_DAWN_DESC:0 "Çok da uzun zaman önce değil, Kuveyt işgal altındaki bir ülkeydi. Monarşisi, Kuveyt egemenliğinin yeniden tesisi için kampanya yürüterek sürgündeydi; Kuveyt halkı ise hem Sünniler hem Şiiler Iraklı zalime karşı birleşmişti. Körfez Savaşı Kuveyt'in bağımsızlığını geri getirdiğine göre monarşi, Kuveyt ulusunu yönetmenin siyasi denge oyununa yeniden başlamalı. Orta Doğu'nun en güçlü meclislerinden biri olan Kuveyt parlamentosu, hükümdarın otoritesi üzerinde güçlü bir denetim oluştururken sürekli daha fazla siyasi liberalleşme için baskı yapıyor. Ülkenin etkili tüccar sınıfı özel sektöre daha fazla yatırım yapılması için baskı yapmaya devam ediyor; kamu sektöründe çalışan Kuveytli vatandaşlar ise bunun kendi refahları pahasına gerçekleşmesini görmek istemiyor."
 OMA_MILLENNIUM_DAWN_DESC:0 "Umman, huzursuz ve çatışmaya yatkın bir bölgede barış ve istikrarın bir feneri olarak ün kazandı. Kabus bin Said el Said, 1970'te iktidara geldiğinden beri başarılı bir dış politika izledi ve hiç kimse tarafından nefret edilmeyen, herkes tarafından takdir edilen bir ülkeyi yönetti. Ancak Umman'ın da zorlukları yok değil. Sultan, iç muhalefete yönelik sert yaklaşımı nedeniyle eleştirildi; bu durum mutlak monarşinin sürdürülebilirliği konusunda belirsizlik yaratıyor."
 QAT_MILLENNIUM_DAWN_DESC:0 "Katar, 1996'dan beri Körfez İşbirliği Konseyi içinde bağımsız bir rota izledi. Ülkenin doğal gaz rezervleri Katar'ın Suudi egemenliğindeki petrol piyasasının dışında faaliyet göstermesine olanak tanıdı ve onlarca yıldır Katar emirleri, Suudilerin ve Emirlerin otoritelerine giderek daha fazla tehdit olarak görmeye başladığı bir örgüt olan popülist Müslüman Kardeşler ile yakın bir ilişki yürüttü. Suudilerin ve Emirlik müttefiklerinin gözünde en kötüsü, Katar'ın varoluşsal tehdit olarak gördükleri bir devlet olan İran ile yakın ilişkisidir. Katar'ın komşularının onun özgün dış politikasına duyduğu düşmanlığın kaynama noktasına ulaşması an meselesidir."
 SAU_MILLENNIUM_DAWN_DESC:0 "Suudi Arabistan tarihsel olarak Orta Doğu'nun önde gelen güçlerinden biri olarak rahat bir konuma sahip oldu. Mekke ve Medine'nin kutsal mekânlarının hizmetkârı olarak Krallık eşsiz bir dini meşruiyete sahiptir. Ancak 1979 İran Devrimi, yeni kurulan İran İslam Cumhuriyeti İslam dünyasının liderliği payesini talep etmeye çalışırken karşılıklı Suudi-İran şüphesini açık düşmanlığa dönüştürdü. Krallık içeride de İslam dünyası liderliği unvanı için rakiplerle karşı karşıya. Suudilerin 1991'de Amerikan askerlerinin ülkeye girmesine izin vermesinden bu yana El Kaide liderliği, Suudi monarşisini ve sahte dindarlığını yok edip yerine gerçekten İslami bir hükümet kurmaya yemin etti."
 SIN_MILLENNIUM_DAWN_DESC:0 "Yüzyılın başında Singapur, Asya ve dünya ulusları arasında en fazla bölgesel otoriteye sahipti. Asya mali krizi de Malay yarımadasının ağzındaki bu küçük ulusa bir iyilik yapmadı. Mali krizin ve küçük boyutunun dışında, antrepo ticaretinde, bankacılıkta ve yabancı yatırımda gücünü gösterdi. Singapurlular ve hükümeti «Aslan Şehir» olarak anılmanın ne demek olduğunu gerçekten gösterdi\n"
 PHI_MILLENNIUM_DAWN_DESC:0 "1998'deki son seçim, Filipin siyasi spektrumunda söylemde büyük bir değişim gördü. Estrada ve koalisyonu Laban ng Makabayang Masang Pilipino (Yurtsever Filipin Kitlelerinin Mücadelesi), muhalefetine karşı ezici bir başarı elde etti. Estrada döneminde Filipinler yüzde 3,4'lük ezici bir büyüme oranı gördü ve hızlı büyümeyi sürdürme yolunda ilerliyor. Ayrıca Estrada, Moro İslami Kurtuluş Cephesi'ne karşı topyekûn savaş ilanına hazırlanmak için AFP'yi seferber etmeye başladı. Bu neredeyse resimlere yakışır başkanlığın içinde yolsuzluk canavarı ve ardından gelecek bir yargılama gizleniyor."
 UAE_MILLENNIUM_DAWN_DESC:0 "Amerikalı yetkililer tarafından sevgiyle «Küçük Sparta» lakabı takılan Birleşik Arap Emirlikleri, hem Amerika Birleşik Devletleri'nin hem Suudi Arabistan'ın yakın müttefiki ve çok taraflı askeri operasyonlara istekli bir katılımcı olmuştur. Emirlik silahlı kuvvetleri, özellikle saygın hava kuvvetleri ve seçkin Cumhurbaşkanlığı Muhafızları, Körfez Savaşı'nda görev yaparak yararlı askeri deneyim biriktirdi.\n\nAncak BAE yalnızca ABD'nin veya Suudi Arabistan'ın ikinci kemanını çalmakla yetinmiyor. Emirlikler dış nüfuz bakımından ağırlığının üzerinde bir etki yarattı ve zaman zaman eski müttefikleriyle rekabet etti. Ayrıca BAE, ekonomik çeşitlendirmenin tek başarılı örneğine ev sahipliği yapıyor; Dubai küresel bir şehir ve finans merkezi olarak ün kazandı."
 KOR_MILLENNIUM_DAWN_DESC:0 "Kore Cumhuriyeti savaşı, yoksulluğu ve diktatörlüğü başarıyla aşarak dünyanın en gelişmiş ve istikrarlı ülkelerinden biri oldu. Cumhurbaşkanı Kim Dae-jung, Kore'ye demokrasiyi getirmedeki rolü nedeniyle geniş çevrelerce saygı görüyor ve birçokları onun Kuzey ile barış yapma çabaları konusunda umutlu.\n\nAncak yönetimi skandallarla lekelendi ve Kore siyaseti aşırı kutuplaşmış durumda. Siyasi partizanlık, hükümet yolsuzluğu ve cumhurbaşkanının Kuzey ile uzlaşma çabalarını çevreleyen belirsizlik, Kore'nin bu yeni binyıldaki geleceğini belirleyecek."
 NKO_MILLENNIUM_DAWN_DESC:0 "Sözde «Münzevi Krallık», dış dünyanın eşit ölçüde gizemli ve tehditkâr algıladığı bir yerdir. Ülkede gizli bir nükleer programa ilişkin söylentiler çoğalıyor ve güneydeki komşusu Kuzey'in niyetlerinden şüphe duymaya devam ediyor. Ancak Münzevi Krallık'ın aşılmaz imajında çatlaklar görünmeye başladı. Hâlâ Zorlu Yürüyüş olarak bilinen yıkıcı bir kıtlıktan toparlanma sürecinde olan KDHC, fırtınayı atlatmak için dış yardıma bağımlı kalmak zorunda kaldı. Kuzey'in yönetim sisteminin zayıflıkları açıkça ortada. Kim Jong-il bu eksikleri giderecek ve kalkınmayı kolaylaştırmak için dış dünyaya karşı diplomatik bir yaklaşım benimseyecek mi? Yoksa ordunun savaşçılığının ve partinin ideolojik coşkusunun savaşla sürdürülmesi gerektiğine mi karar verecek?"
 BOT_MILLENNIUM_DAWN_DESC:0 "Botsvana, istikrarlı demokrasisi, yüksek insani gelişme endeksi ve düşük yolsuzluğuyla Afrika'nın en gelişmiş ülkelerinden biridir. Botsvana servetini büyük miktarlarda elmas bulunmasının ardından kazandı; bu, Afrika'nın en yüksek kişi başı GSYİH'lerinden birine yol açtı. Ancak sorunsuz değil; siyasete, birçoklarının otokratik ve dışlayıcı gördüğü BDP partisi hâkim. Ayrıca ülkenin pek çok av rezervinde kaçak avcılık yaygın. Elmaslar da sonsuza dek sürmeyecek ve ekonomi için alternatifler bulacak bir çözüm bulunmalı."
 AFG_MILLENNIUM_DAWN_DESC:0 "Komünistlerin 1978'de iktidarı ele geçirmesinden bu yana Afganistan bir iç savaş ve dış müdahale döngüsü içinde. Sovyetler Birliği'nin 1989'daki çekilişi ve rejimin 1992'deki çöküşü barış getirmedi. Aksine, Mücahit grupları arasındaki çıkar çatışması, Pakistan destekli Taliban'ın iç savaştan yararlanıp Afganistan'ın büyük kısmını ele geçirdiği 1996'ya kadar süren çatışmalara yol açtı. Amaçları diğer tüm grupları ortadan kaldırmaktı; bu da eski savaş ağalarını General Mesud'un arabuluculuğunda Taliban'a karşı Kuzey İttifakı'nı kurmaya zorladı. Savaştan yıpranmış bu ülkenin geleceği ne getiriyor?"
 ARM_MILLENNIUM_DAWN_DESC:0 "SSCB'nin çöküşünden sonra ilk bağımsızlığını alanlardan biri olan Ermenistan'ın bağımsızlığı ona refah ya da büyüklük getirmedi. Milliyetçilerin başlattığı Dağlık Karabağ savaşı cumhuriyeti kan kaybettirdi. Aynı zamanda çatışmaların kendisinden çok Azerbaycan'ın Ermenistan'a uyguladığı abluka. Ermenistan'ın dümeninde, hem Ermenistan'da hem anlaşmazlık konusu Artsakh'ta büyük etkisi olan tartışmalı bir siyasetçi var. Ermenistan onun yönetiminde şan kazanabilecek mi, yoksa uzun vadeli bir uçuruma mı kayacak?"
 BLR_MILLENNIUM_DAWN_DESC:0 "Sovyetler Birliği'nin çöküşü Belarus'a uzun zamandır beklenen bağımsızlığı getirdi. Ama buna değdi mi? Ekonomi tamamen Rusya'ya bağımlı, ordu savaşa hazır değil ve Batı hâlâ Belarus'u Rus karşıtı duyguların kalesine nasıl dönüştüreceğine bakıyor. Lukaşenko ya da bir başkası Belarus için doğru yolu seçebilecek mi?"
 GEO_MILLENNIUM_DAWN_DESC:0 "SSCB'nin çöküşünden sonra Kafkasya'nın kenarında kalan Gürcistan, Abhazya ve Osetya'daki savaşla neredeyse eşzamanlı olarak bir iç savaşa sürüklendi. Cumhurbaşkanı Gamsahurdia'nın devrilmesi siyasi istikrarsızlığa yol açtı, birleşik bir Gürcistan umutlarını suya düşürdü ve halkta büyük bir iz bıraktı. Gürcistan bölgesel bir güç olabilecek mi, yoksa siyasi kaosa doğru ilerlemeye devam mı edecek?"
 AZE_MILLENNIUM_DAWN_DESC:0 "Şimdi otoriter eski komünist Haydar Aliyev yönetiminde olan Azerbaycan bir yol ayrımında. Artsakh'ta kaybedilen savaş, istikrarsız bir toplum ve halkın artan hırsları, Azerbaycan hükümetini belirsiz bir gelecekle karşı karşıya bırakıyor. Kafkasya'nın incisi olabilecek mi, yoksa siyasi istikrarsızlığa mı kayacak?"
 COM_MILLENNIUM_DAWN_DESC:0 "Komor adaları zinciri hayalî bir kırsala sahiptir. Ormanlar dağları ve Karthala yanardağını kaplar. İnsanların çoğunun balıkçı olarak sade hayatlar yaşadığı yer, ülkenin tek büyük geliri olan kıyıdır. Bu adalar her zaman huzurlu değildir. Darbeler sık yaşanan bir olaydır ve asi valiler daha fazla özerklik için ellerinden geleni yapar. Komorlar, kültürel komşusu Tanzanya ile çok şey paylaşır; ancak çoğunluğu Müslümandır ve hepsi yalnızca Svahili dilinin bir lehçesini konuşur.\n\nÜlkenin Fransa'nın denizaşırı departmanı Mayotte hakkında ilginç bir görüşü vardır. İrredentistler onun ulusun bir parçası olduğunu iddia eder, ancak Mayotte halkı bu görüşü paylaşmıyor gibi görünür."
 ABK_MILLENNIUM_DAWN_DESC:0 "Abhazya, uzun süredir bağımsızlığı için savaşan küçük bir ülkedir. 1993'te bu ülke bağımsızlık hakkını kazandı, ancak Rusya dışında kimse bu hakkı tanımadı. Belki yakında bütün dünya Abhazya'yı duyacak"
 EST_MILLENNIUM_DAWN_DESC:0 "Resmî adı Estonya Cumhuriyeti olan Estonya, Sovyetler Birliği'nden bağımsızlığının dokuzuncu yılını kutluyor; ancak bu, Rus nüfuzunun artmaya devam ettiği anlamına gelmiyor. Küçük Baltık ülkesi şimdi Doğu ile Batı'nın giderek artan çekimi arasında kalmış durumda. Şimdi bağımsızlığına yönelik tehditlerle, aşırı sağ düşüncenin yükselişiyle ve ülke içinde sorun yaratan etkisiz hükümet bürokrasisiyle başa çıkmak zorunda."
 FIJ_MILLENNIUM_DAWN_DESC:0 "Resmî adı Fiji Cumhuriyeti olan Fiji, çarpıcı biçimde çalkantılı bir tarihe sahip bir Pasifik ada ülkesidir. 1970'lerde bağımsızlığını kazanan Fiji, 2 darbe ve hem hükümetin hem anayasaların birkaç kez değişimini yaşadı; bunlar Etnik Fijililer ile Etnik Hint-Fijili halklar arasındaki büyüyen etnik bölünmeyle daha da güçlendi. Ancak yeni binyıl yeni sorunlarla geliyor; Fiji'nin kendini sattığı gibi gerçekten bir ada cenneti olup olamayacağını yalnızca zaman gösterecek."
 KAZ_MILLENNIUM_DAWN_DESC:0 "Sovyetler Birliği'nin gölgesinden çıkan son ulus olan Kazakistan, çökmüş devletliğinin yol açtığı artan ekonomik çöküşle damgalıdır. Yeni binyıl şafak söktüğünde siyasi ve ekonomik gidişatına dair sorular asılı kaldı. Kazakistan'ı 21. yüzyılda nasıl bir gelecek bekliyordu ve modernleşme özlemlerini kendine özgü kültürel kimliğini korumakla nasıl dengeleyecekti?"
 KYR_MILLENNIUM_DAWN_DESC:0 "Kırgızistan, bir dizi siyasi çalkantıyla damgalı, Orta Asya'da genç ve siyasi olarak istikrarsız bir ulustur. Bir başka yeni otokrat iktidarı kendi eline almayı başardı. Tacikistan ve Özbekistan ile alevlenen çatışma ortasında iktidarı elinde tutabilecek mi? Rusya ve Çin bunda hangi rolü oynayacak? Yeni binyılda Kırgızistan'ı bunların hepsi bekliyor."
 UZB_MILLENNIUM_DAWN_DESC:0 "2000 yılında Özbekistan, merkezileşmiş, otoriter bir hükümetle karakterize olan eski bir Sovyet cumhuriyetidir. Ekonomisi ağırlıklı olarak tarıma ve pamuk üretimine dayanıyordu. Yeni binyıl başlarken şu merak edilebilirdi: Özbekistan 21. yüzyılda nasıl bir geleceği benimseyecekti? Siyasi, ekonomik ve toplumsal olarak evrilecek miydi ve değişen Orta Asya manzarasında rolünü nasıl yönlendirecekti?"
 SER_MILLENNIUM_DAWN_DESC:0 "Korkunç NATO bombardımanı, Yugoslavya'nın her sakininin kalbinde izlerini bıraktı. Şimdi ülke, yeni binyılda hangi yöne gideceğini seçmek zorunda; belki de önceki liderlerden kurtulma zamanıdır? Ya da eski durumu geri kazanmaya mı çalışmalı?"
 KOS_MILLENNIUM_DAWN_DESC:0 "Ulusumuz sonunda tam bağımsızlığı kazanabileceğimiz âna yaklaşıyor.  Sırbistan'ın nüfuzuna karşı mücadelemiz son aşamaya yaklaşıyor; başladığımız işi bitirecek miyiz, yoksa pes edip yeniden başka bir ülkenin parçası mı olacağız?"
 VEN_MILLENNIUM_DAWN_DESC:0 "Yeni binyılın başında Venezuela, umut ve belirsizliğin bir karışımını taşıyan zengin ve karmaşık bir tarihin şekillendirdiği bir yol ayrımındaydı. 2000 yılı, bir dizi önemli siyasi ve toplumsal değişimin ardından ülkenin evriminde önemli bir kavşağı işaret ediyordu. 1999'da karizmatik bir askeri lider olan Hugo Chávez, Venezuela başkanlığına yükseldi. Seçilmesi ulusun anlatısında köklü bir dönüm noktası oldu. Chávez'in yükselişini, toplumsal eşitsizlik, yoksulluk ve siyasi yolsuzluğun süregelen sorunlarıyla yüzleşme taahhüdü itti. Siyasi hareketi Chavismo bayrağı altında, Venezuela'nın bol petrol servetinin daha adil ve hakkaniyetli dağıtılması vizyonunu savundu. Ancak yeni binyıl ilerledikçe ulus kendini kritik bir anda buldu; Venezuela'nın gelecekteki yönü terazide duruyordu. Chávez'in liderliği altında devam edilip edilmeyeceği ya da alternatif bir yolun araştırılıp araştırılmayacağı konusunda artan tartışmalar ve ayrışan bakış açıları vardı. Bazıları Chávez'in toplumsal eşitsizlikleri giderme misyonunu vurgulayarak görev süresinin uzatılmasını savunurken diğerleri yönetişim ve ekonomik istikrar için yeni yaklaşımlar arayarak farklı bir rota izlenmesini savundu. Venezuela'nın geleceğinde hükümet değişikliği görecek miyiz? Yoksa Beşinci Cumhuriyet'in sürdüğünü mü göreceğiz?"
 HEZ_MILLENNIUM_DAWN_DESC:0 "Lübnan İç Savaşı'nın başlamasından ve İran'daki İslam Devrimi'nin yaşanmasından bu yana, aslen Lübnan'ın İslami Emel hareketinin bir parçası olan ve fikirleri «İslami Direniş» doktrinine dayanan ve dayanmaya devam eden ortodoks bir örgüt kuruldu. Lübnan'ın en güçlü siyasi ve askeri yapısı olan Hizbullah kuruldu. O zamandan beri Hizbullah, Levant bölgesinde İsrail devletine ve müttefiklerine karşı bir koz olacak şekilde konumlandı. Aynı zamanda Lübnan devletinin kendisi üzerinde de hâkimiyet kurmaya çalışıyor. Basra Körfezi Savaşı'ndan beri Orta Doğu'daki gerilimler artarken Hizbullah, operasyon üssünü Orta Doğu'nun ötesine genişletmeye çalıştı. Şimdi bölgedeki gerilimler yeniden tırmanırken Hizbullah yeni planlarını ayarlamak zorunda; Direniş doktrini ve Hizbullah'ın Lübnan'daki siyasi hâkimiyeti başarılı olacak mı? Bunu yalnızca zaman ve dünyanın değişimleri gösterecek..."
 SOO_MILLENNIUM_DAWN_DESC:0 "Bir zamanlar Gürcistan SSC'nin parçası olan Güney Osetya, Gürcistan'dan ayrıldı ve bağımsızlığını ilan etti. Kanlı savaşın ardından Osetya bağımsızlığını savundu ve Rusya ile bütünleşme arayışına girdi, ancak 21. yüzyılın başında devletin durumu belirsizliğini koruyor. Bir yanda düşman Gürcistan, diğer yanda küçük ama gururlu Osetya'yı isteksizce evine almaya çalışan Rusya"
 BUL_MILLENNIUM_DAWN_DESC:0 "İkinci Dünya Savaşı'nı yaşayıp sosyalist bir cumhuriyet haline gelen Bulgaristan, ancak yakın zamanda demokratik bir devlet olarak şekillendi. Yeni binyıl Bulgaristan için Balkanlar'daki yeni, büyüyen bir demokrasinin karşı karşıya olduğu yeni zorluklarla parlıyor... Bulgaristan'ın yeni, belki de daha parlak yüzyılda neler başaracağını yalnızca zaman gösterecek."
 ROM_MILLENNIUM_DAWN_DESC:0 "Yeni binyılın şafağında Romanya bir yol ayrımında duruyor. On yıllarca süren komünist yönetimden çıkan ülkenin kurduğu kırılgan demokrasi şimdiye kadar istikrardan çok kaos getirdi.\n\nGolaniada'dan Altıncı Mineriada'ya kadar hükümetler demokratik kurumları sağlamlaştırmada ve ekonomik sorunları gidermede başarısız olurken gelecek kırılgan hissettiriyor. Yoksulluk artarken Corneliu Vadim Tudor gibi demagoglar hayal kırıklığına uğramış kitleler arasında devasa takipçiler kazanabiliyor, demokratik partiler ise uygulanabilir çözümler sunamayarak sendeliyor ve düşüyor.\n\nVe eski cumhurbaşkanı Ion Iliescu'nun siyasete dönüşüyle halk görünüşe göre iki kötüden daha az kötü olanı seçmek zorunda. Ama Romanya'nın geleceğini gerçekten kim bilebilir?"
 BOS_MILLENNIUM_DAWN_DESC:0 "Tarih ve kültür bakımından zengin bir ülke olan Bosna, Roma İmparatorluğu'nun gücünden Federal Yugoslavya Cumhuriyeti'nin çöküşüne kadar yabancı imparatorlukların elleriyle biçimlendi. Şiddetli bağımsızlık mücadelesinin bıraktığı izlere rağmen Bosna halkı daha iyi bir geleceğe giden yolculuğunda kararlı kalıyor. \n\nEtnik ve dini bölünmeler sürse de geçmişini aşmaya kararlı bir ulusun umudunu ve dayanıklılığını azaltmıyor. Bosna'nın geleceği belirsiz olabilir, ancak halkının sarsılmaz ruhu daha parlak bir yarına doğru parlayan bir ışık fenerdir."
 EGY_MILLENNIUM_DAWN_DESC:0 "2000 yılında Mısır siyasetine, otoriter denetim, sınırlı siyasi özgürlükler ve ara sıra reform girişimleriyle karakterize edilen Cumhurbaşkanı Hüsnü Mübarek'in yerleşik yönetimi hâkimdi. Bir miktar ekonomik büyümeye rağmen ülke yaygın yoksulluk, yolsuzluk ve toplumsal eşitsizlikle boğuşuyordu. Muhalefete sert baskıyla karşılık veriliyordu, ancak özellikle gençler ve sivil toplum grupları arasında muhalefet belirtileri ve değişim çağrıları sürüyordu. Ancak Mısır siyasetinin geleceği, ardıllık, sosyoekonomik şikâyetler ve gelişen teknolojilerin olası etkisi hakkındaki soruların ülkenin siyasi manzarasına karmaşıklık katmasıyla belirsiz kalıyordu."
 IND_MILLENNIUM_DAWN_DESC:0 "Endonezya ekonomik sorunlarla sarsılmasına rağmen Güneydoğu Asya meselelerinin merkezidir. 1997 Asya mali krizi, Endonezya'nın para birimi Rupiah'ı sakatladı; bu da takımada ülkesine büyük istikrarsızlık getirdi ve Açe'de kavuran yangınlarla daha da alevlendi. Artan enflasyon, radikalleşme ve ulus içindeki birlik eksikliği onun komşularının ve dünyanın geri kalanının gerisinde kalmasına yol açıyor ve liderlerini 21. yüzyılda hayatta kalmak için ne yapacaklarını bilemez halde bırakıyor"
 PMR_MILLENNIUM_DAWN_DESC:0 "2000 yılında Moldova'nın ayrılıkçı bölgesi Transdinyester uzun süreli bir siyasi çıkmaz içindeydi. 1990'da bağımsızlığını ilan eden bölge, egemenliği uluslararası alanda tanınmasa da kendini cumhuriyet ilan etmiş bir yapı olarak işledi. Başkan Igor Smirnov'un önderliğinde Transdinyester kendi kurumlarını ve güvenlik güçlerini sürdürdü ve fiilî bir devletlik oluşturdu. Ancak Moldova ile gerilimler sürdü; uzlaşma çabalarını ekonomik yaptırımlar, kaçakçılık ve bölgenin statüsü konusunda uzlaşı eksikliği engelledi. Uluslararası kuruluşların arabuluculuk yaptığı müzakereler barışçıl bir çözüm aradı, ancak Transdinyester'in siyasi durumu karmaşık ve çözümsüz kaldı; bağımsızlık özlemleri ile jeopolitik gerçekler arasında kırılgan bir denge ile damgalıydı."
 CUB_MILLENNIUM_DAWN_DESC:0 "Güneşin palmiye ağaçlarını ısıttığı ve deniz meltemini kıyıları yumuşakça kucakladığı güzel Küba adasında, 2000 yılı bir değişim havasına tanık oldu. Karayiplerin kalbinde, bu sıcaklık ve güzellik vahasında gelenek ve kültürel mirasla zengin bir tarih yaşıyordu. Ancak bu zengin güzelliğin gölgesinde siyasi güçlerin kızgın mücadelesi heyecan verici hamlelerini sürdürüyordu. Ülkedeki siyasi durum gergindi ve sürekli iktidar mücadelelerini ve ideolojik mücadeleleri yansıtıyordu. Buna rağmen Küba halkının ruhu yıkılmaz kaldı; yürekleri parlak bir gelecek umudu ve adalete inançla doluydu."
 LBA_MILLENNIUM_DAWN_DESC:0 "Muammer Kaddafi, ideallerini ve özlemlerini gerçekleştirmek için can atarak Libya'yı 31 yıldır yönetiyor. Libya şu anda nispeten istikrarlı; Kaddafi'nin kendi ailesinin üyeleri eksantrik liderin gözüne girmeye çalışıyor, ancak işler her an değişebilir.\n\nLibya 21. yüzyılda güç ve refaha ulaşabilir mi, yoksa sayısız başarısız devletler listesine mi girer? Muammer, yeni binyılın yeni dalgasından önce iktidarını elinde tutabilecek mi? Yalnızca zaman gösterecek..."
 TAJ_MILLENNIUM_DAWN_DESC:0 "1991'de Sovyetler Birliği'nden bağımsızlığını kazanmasından bu yana Tacikistan sürekli istikrarsızlık ve çekişme içinde. Ulus hızla acımasız bir iç savaşa sürüklendi; hükümet, İslamcı ve demokratik güçler dahil bir muhalefet gruplarının koalisyonuna karşı savaştı. 1997'ye gelindiğinde kırılgan bir barış sağlandı, ancak Emomali Rahmon hükümeti iktidarı pekiştirip birçok muhalefet grubunu devre dışı bırakırken gerilimler yüksek kaldı. Tacik toplumunda yolsuzluk, yoksulluk ve bölünmeler büyüyor; sıradaki ne olacağına yalnızca zaman tanıklık edecek..."
 HOL_MILLENNIUM_DAWN_DESC:0 "Bir zamanlar küresel bir denizci imparatorluğun kalbi olan Hollanda, 21. yüzyılda istikrarlı bir liberal demokrasi ve uluslararası diplomasi ile ticaretin temel taşı olarak ortaya çıktı. Avrupa Birliği ve NATO'nun kurucu üyesi olarak uzun süredir çok taraflılığı ve insan haklarını savundu. Ancak modern refahının altında büyüyen toplumsal gerilimler, ulusal kimlik üzerine tartışmalar ve sömürgeciliğin mirası kamusal söylemini yeniden şekillendirmeye başladı. Yükselen jeopolitik istikrarsızlık, ekonomik kaymalar ve küresel zorluklar ufukta belirirken Hollandalılar belirleyici bir soruyla karşı karşıya: ılımlılığın pragmatik sesi olarak devam mı edecekler, yoksa belirsiz bir dünyada yeni bir yol mu çizecekler?"
 OTHER_MILLENNIUM_DAWN_DESC:0 "Birinci Dünya Savaşı, İkinci Dünya Savaşı, Kore, Vietnam, Afganistan. Geçmişin savaşları, şimdinin uluslarını gelecek için korkutmuş durumda. Ancak insanlığın 20 yüzyıllık kan dökülmesini geride bırakıp barış ve istikrar dönemine geçişini tamamlamış olabileceğine dair büyük bir umut var."
 BOL_MILLENNIUM_DAWN_DESC:0 "And Dağları'nın akciğerlerinde yüksekte Bolivya yükselir: gümüş madenlerinden, devrimlerden ve unutulmuş imparatorluklardan dövülmüş bir ulus. Kıyısından yoksun bırakılmış ve darbelerle yaralanmış olsa da kalbi hâlâ kadim davulların gümbürtüsü ve halkının hayalleriyle atar. 20. yüzyıl geride yaralar bıraktı: kaybedilen savaşlar, bozulan antlaşmalar ve yabancı sermaye ile huzursuz bir dans. Yine de yeni binyıl şafak sökerken yüzeyin altında bir şeyler kıpırdıyor: yerlilerin uyanışının, kaynak milliyetçiliğinin ve toplumsal sözleşmenin yeniden yazılması talebinin giderek büyüyen ateşi. Toprağının altında lityumla ve sokaklarında huzursuzlukla Bolivya, büyük güç oyunlarında yalnızca bir piyon olmaktan fazlası olabilir. Fırtına olabilir."
 PER_MILLENNIUM_DAWN_DESC:0 "1979'daki İslam Devrimi'nin ardından İran, Batı yanlısı bir Monarşiden Batı karşıtı bir Şii Teokrasisine geçti. Doğu'dan Batı'ya İran dış güçlerce sıkıştırıldı ve kendisinden başka güvenebilecek kimsesi yok. Her köşede düşmanlık varken İran, kendini Müslüman dünyasında Şii nüfuzunun merkezi olarak sağlamlaştırdı ve varlıklarını sürdürmek için büyük ölçüde İran'ın parasal desteğine bağımlı Hizbullah gibi aşırılıkçı örgütler üzerinde sıkı bir denetim kurdu. Reformcu ve öğrenci hareketlerinin artan direnişiyle Hamaney rejiminin geleceği belirsiz. Nihayetinde İran'ın ayakta kalabilmesi için ya küresel cephede komşularıyla birlikte işbirliği yapması ya da tüm düşmanlarını ezmesi gerekecek. Arada bir yol yok."
 ISR_MILLENNIUM_DAWN_DESC:0 "Bazı bakımlardan İsrail hiç bu kadar iyi bir konumda olmamıştı. İsrail'in Arap komşularının bir zamanlar oluşturduğu varoluşsal tehdit, Mısır ve Ürdün ile ilişkilerin normalleşmesi sayesinde büyük ölçüde ortadan kalktı. 1993 Oslo Anlaşmaları ile Filistin sorununun çözümüne yönelik büyük adımlar atıldı.\n\nBuna rağmen İsrail huzursuz kalıyor. Terörizm ve haydut devletler ülkenin sürekli güvenlikleştirilmesini haklı çıkarırken Yahudi devletinin gelecekteki seyrine dair sorular İsrail siyasetine hâkim olmayı sürdürüyor. İsrail'in uluslararası toplumdan, Filistinlilerden ve kendi halkından gelen büyüyen ve çoğunlukla bağdaşmaz baskılara nasıl karşılık vereceği belirsiz."
 SYR_MILLENNIUM_DAWN_DESC:0 "Sömürge çıkarlarından doğmuş, darbeler ve istikrarsızlıklarla dolu bir tarihe sahip bir ulus olan Suriye, kuruluşundan bu yana çok mücadele etti. Baasçıların ele geçirmesinin ardından ve 1971'den beri ülke, Hafız Esad'ın istikrarlı ama otoriter yönetimi altında görünüşte birleşti. En uzun süre görev yapan cumhurbaşkanı olarak görev süresi, derin bir istikrar dönemini denetlemesiyle olduğu kadar aynı ölçüde kötü şöhretli siyasi şiddetle de anılıyordu. Hafız Esad'ın sağlığı şu anda kötüleşiyor ve yakında yeni bir halef yükselecek. Ancak birçok kişi bu durumu ve statükoyu sorgulamaya başladı ve birçoğu bunu değiştirmek istiyor. Suriyeliler bölünmelerini ve farklılıklarını aşıp parlak bir gelecek için birleşecek mi? Yoksa devlet halkının bölünmeleri ve kurumlarının başarısızlıkları yüzünden zamanın sınavı altında mı çökecek?"
 ALG_MILLENNIUM_DAWN_DESC:0 "On yıllık acımasız bir iç savaşın ardından 2000'de Cezayir kırılgan bir yol ayrımında duruyor. 1999'da askeri kuruluşun desteğiyle seçilen Cumhurbaşkanı Abdülaziz Buteflika ulusal uzlaşma, ekonomik toparlanma ve istikrara dönüş sözü verdi. Ancak Kara On Yıl'ın izleri derin. İslamcı isyancılar hâlâ dağlarda oyalanıyor, Kabiliye bölgesinde etnik gerilimler kaynıyor ve devlete güven düşük.\n\nÜlkenin geniş petrol ve gaz rezervleri ana ekonomik direği olmayı sürdürüyor, ancak işsizlik yüksek, yolsuzluk başıboş ve reform vaatleri çoğu zaman boş kalıyor. Yabancı yatırımcılar Cezayir'in kullanılmamış potansiyeline göz dikerken halk toplumsal adalet, kalkınma ve barış talep ediyor.\n\nCezayir bağımsızlığını ve kimliğini korurken modern, istikrarlı bir devlet kurabilir mi? Yoksa iç gerilimler ve iktidar mücadeleleri geleceğine musallat olmaya devam mı edecek?"
 GRN_MILLENNIUM_DAWN_DESC:0 "Dünyanın en büyük adası olan Grönland, 1979'da Özyönetim hakkını elde ederek Danimarka Krallığı içinde özerk bir bölge olmayı sürdürüyor. Buzsuz bir kıyı boyunca dağılmış küçük nüfusu, balıkçılık sektörüne ve Kopenhag'dan gelen yıllık blok hibeye büyük ölçüde bağımlı.\n\nBuzun altında geniş, kullanılmamış maden ve petrol rezervleri yatıyor ve ısınan iklim bir gün bunlara ulaşılmasını mümkün kılabilir. Daha fazla özyönetim çağrıları güçlendikçe Grönland belirleyici bir soruyla karşı karşıya: gerçek bağımsızlığa giden bir yol çizebilir mi, yoksa kendi kendine yetmenin maliyeti onu Danimarka tacına bağlı mı tutacak?"
 SIA_MILLENNIUM_DAWN_DESC:0 "Baht'ın çöküşünün Güneydoğu Asya ekonomilerini sarsmasından üç yıl sonra Tayland, Chuan Leekpai'nin Demokratlarının teknokratik yönetimi altında IMF kurtarma paketinden çıkıp toparlanmaya çalışıyor. Kemer sıkma para birimini dengeledi, ancak kırsal bölgeleri değil; burada telekom milyarderi Thaksin Shinawatra ve yeni Thai Rak Thai partisi, henüz hiçbir iktidarın yanıt veremediği bir makine kuruyor.\n\nGenç bir demokrasi, reformist 1997 anayasası altında ayaklarını yere basmaya çalışıyor ve eski kurumlar nasıl yürüdüğünü izliyor. Önümüzdeki on yılın tercihleri toparlanmanın kalıcı olup olmayacağını ve olduğunda Tayland adına kimin konuşacağını belirleyecek."
