 MD_raid.1.t:0 "[FROM.GetName] Toprak Bütünlügümüzü Ihlal Ediyor!"
 MD_raid.1.d:0 "Raporlar, [FROM.GetName] ülkesinin lideri [FROM.GetLeader] ülkemize yönelik bir dizi koordineli saldırıyı onayladığını gösteriyor. Bu saldırganlık, topraklarımız arasındaki sınırlara yönelik açık bir saygısızlığa veya kafa karışıklığına işaret ediyor. Burada pek çokları, özellikle milliyetçiler ve vatanseverler, bunu güçlü bir karşılık gerektiren açık bir savaş eylemi olarak görüyor. Ancak yurt içinde ve dışında başkaları, tam ölçekli bir çatışmayı önlemek için gerilimin düşürülmesini savunarak itidale çağırıyor."
 MD_raid.1.a:0 "Bir savaş eylemi cezasız kalamaz!"
 MD_raid.1.NATO:0 "5. Maddeyi Tetikle"
 MD_raid.1.b:0 "Halka karşılık vereceğimizin sözünü ver!"
 MD_raid.1.c:0 "[FROM.GetName] ülkesinden tazminat ve gerilimin düşürülmesini talep et"
 MD_raid.1.e:0 "Diplomatik protesto sun"
 MD_raid.2.t:0 "[FROM.GetName] Tazminat Talep Ediyor"
 MD_raid.2.d:0 "[FROM.GetName] ülkesinden bir bildiri aldık. Uğradıklarını iddia ettikleri ekonomik zararlar için tazminat talep ediyorlar. Yakın tarihli bir halka hitabında [FROM.GetLeader], ödemeyi reddetmenin «hızlı ve ağır» sonuçlarla karşılanacağı uyarısında bulundu."
 MD_raid.2.a:0 "Kuruş ödemeyeceğiz."
 MD_raid.2.b:0 "Barışın bedeli mi?"
 MD_raid.3.t:0 "[FROM.GetName] Tazminati Kabul Etti ve Gerilimi Düsürme Sözü Verdi"
 MD_raid.3.d:0 "Misilleme tehditlerimiz [FROM.GetName] yönetimini geri adım atmaya ikna etti; yönetim, toprak bütünlüğümüze yönelik haksız ve yasadışı ihlallerinin yol açtığı zararları karşılayacak fonları sağladı. Ayrıca açık diyaloğa girmeyi ve gelecekte her türlü saldırganlıktan veya düşmanca davranıştan kaçınmayı taahhüt ederek gerilimi düşürme sözü verdi; bölgeye bir nebze istikrar getirmeyi amaçlıyor."
 MD_raid.3.a:0 "İyi"
 MD_raid.4.t:0 "[FROM.GetName] Tazminat Ödemeyi Reddetti"
 MD_raid.4.d:0 "[FROM.GetLeader], bir kalabalığa yaptığı yakın tarihli konuşmada hükümetinin «tek bir kuruş» ödemeyeceğini cesurca ilan etti. Bu devletimiz için derinden aşağılayıcı bir an. Yalnızca ilk saldırıları toprak bütünlüğümüzü zedelemekle kalmadı, şimdi uluslararası sahnedeki itibarımız da tehdit altında."
 MD_raid.4.a:0 "Misilleme yapmalıyız!"
 MD_raid.4.b:0 "Hiçbir şey olmamış gibi davran."
 MD_raid.4.c:0 "Uluslararası Yaptırım İste!"
 MD_raid.5.t:0 "Hükümetimiz Uluslararasi ve Yurt Içinde Küçük Düstü"
 MD_raid.5.d:0 "Dünya basını, yabancı aktörlerin son saldırılarına verdiğimiz karşılığı tarif etmek için «boş sözler», «boş tehditler» ve «kâğıttan kaplan» gibi ifadeler kullandı. Kararlı bir karşılık verememiş olmamız hükümetimizin itibarına ağır bir darbe vurdu ve ordumuzun işe yarar bir savunma aracı olup olmadığı konusunda şüphe uyandırdı."
 MD_raid.5.a:0 "Kahretsin"
 MD_raid.6.t:0 "Misilleme!"
 MD_raid.6.d:0 "Yabancı topraklardaki son askerî operasyonlarımız [FROM.capital.GetCapitalVictoryPointName] rejiminin gözünden kaçmadı. Karşılık olarak sert uyarılarda bulundular ve ülkemize karşı hızlı ve kesin bir misilleme yemini ettiler. Geleceğini ilan ettikleri karşılığa hazırlanırken ülkemizde gerilim yüksek."
 MD_raid.6.a:0 "Blöf yapıyor olabilirler"
 MD_raid.10.t:0 "[FROM.GetName] Komsumuz [FROM.FROM.GetName] Ülkesine Saldirdi!"
 MD_raid.10.d:0 "Komşumuz [FROM.FROM.GetName], [FROM.GetName] tarafından saldırıya uğradı! Saldırıdan önce resmî bir savaş ilanı yapılmamış olması, bunun düşman bir gücün bölgesel toprak bütünlüğüne açık bir ihlali olduğunu gösteriyor. Bölge, bu saldırıya verilecek karşılığı endişeyle bekliyor."
 MD_raid.10.a:0 "Sıra bize mi gelecek?"
 MD_raid.10.b:0 "Muhtemelen bunu hak etmişti"
 MD_raid.12.t:0 "[FROM.GetName] [FROM.FROM.GetName] Ülkesine Vurdu!"
 MD_raid.12.d:0 "Şok edici ve çirkin bir saldırganlık eylemiyle [FROM.GetLeader], güçlerinin müttefikimiz [FROM.FROM.GetName] ülkesine askerî vuruş yapmasını onayladı. Bu pervasız saldırı ülkemizde şok dalgaları yarattı, kamuoyunda öfke uyandırdı ve hükümetimizde kararlı eylem çağrılarını ateşledi. Mesaj açık: Böylesi kışkırtılmamış bir saldırı göz ardı edilemez ve edilmeyecektir."
 MD_raid.12.a:0 "Müttefiklerimizin yanında olacağız!"
 MD_raid.12.b:0 "Zaten onları sevmiyorduk"
 MD_raid.13.t:0 "[FROM.GetName] Yaptirim Istiyor!"
 MD_raid.13.d:0 "[FROM.GetLeader], saçma tazminatlarını ödemeyi reddetmemizin ardından uluslararası toplumdan bize yaptırım uygulamasını talep etti. Dünyanın bu talebi izleyip izlemeyeceğini zaman gösterecek.\n\nUluslararası ilişkiler, siyasi ve ekonomik açıdan cezalara maruz kalacağız; bu cezalar, bize karşı yaptırımlara kaç ülkenin katıldığına bağlı olarak ağırlaşacak! Ülkeler bize ne kadar düşmansa veya diplomatik ya da ekonomik olarak bize karşıysa yaptırımlara katılma olasılıkları o kadar yüksek."
 MD_raid.13.a:0 "Ekonomimiz ayakta kalacak!"
 MD_raid.14.t:0 "[FROM.FROM.GetName] Uluslararasi Yaptirim Istiyor!"
 MD_raid.14.d:0 "[FROM.FROM.GetLeader], [FROM.FROM.GetName] ülkesine yönelik askerî vuruşunun ardından istenen tazminatı ödemeyi reddeden [FROM.GetName] ülkesine uluslararası toplumdan yaptırım uygulamasını talep etti. Dünya şimdi bu talebe karşılık vermek zorunda:"
 MD_raid.14.a:0 "Yaptırımlara Katılacağız!"
 MD_raid.14.b:0 "Hayır, şu an değil."
 MD_raid.16.t:0 "[FROM.FROM.GetAdjective] Saldirilarin Ardindan [FROM.GetName] Için Kriz Yaklasiyor"
 MD_raid.16.d:0 "[FROM.FROM.GetName] ülkesinin [FROM.GetAdjective] topraklarına yönelik kışkırtıcı vuruşlarının ardından gerilim kaynama noktasına ulaştı. [FROM.GetName] ülkesinin lideri [FROM.GetLeader], taviz vermeyen bir açıklamayla hükümetinin kararlı biçimde karşılık vereceğini ilan etti. Birlikleri seferber etme ve [FROM.FROM.GetAdjective] topraklarına ilerleme planlarını duyurarak «[FROM.FROM.capital.GetCapitalVictoryPointName] içindeki kuduz zalimleri bastırmaya» ve «gerekirse güç kullanarak düzeni yeniden sağlamaya» yemin etti. Bu hamle bölgesel ve küresel istikrarı gözler önüne seriyor ve diplomasi eksikliğinin yaratabileceği tehlikeleri gösteriyor. Şu an için diplomatik kanallar sessiz; bu da tırmanmanın uluslararası barış ve güvenlik açısından vahim sonuçları olan kontrolsüz bir çatışmaya dönüşebileceği korkularını artırıyor."
 MD_raid.16.a:0 "Sırada ne var?"
 MD_raid.17.t:0 "[FROM.GetName] NATO 5. Maddesini Tetikledi"
 MD_raid.17.d:0 "[FROM.FROM.GetAdjective] kuvvetlerin [FROM.GetAdjective] topraklara saldırılarının ardından [FROM.capital.GetCapitalVictoryPointName] hükümeti, NATO'nun 5. Maddesini tetikleyerek müttefiklerini saldırganlığa toplu biçimde karşılık vermeye çağırdı. [FROM.FROM.GetName] ülkesinin karşılıksız ve kışkırtılmamış olarak nitelendirilen saldırıları gerilimi önemli ölçüde tırmandırdı ve durumu savaşın eşiğine getirdi. NATO'nun 5. maddesini etkinleştirme kararı uluslararası sahnede şok dalgaları yarattı; dünya liderleri, ittifakın modern tarihteki en önemli sınavlarından biri olabilecek duruma karşılık vermek için çabalıyor. Diplomatlar ve analistler, daha fazla tırmanma ihtimalinin dünya üzerinde asılı durduğu bu gelişmenin geniş kapsamlı sonuçları konusunda uyarıyor."
