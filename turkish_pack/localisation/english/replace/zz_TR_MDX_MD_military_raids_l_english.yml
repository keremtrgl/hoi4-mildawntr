 nuclear_power_def_tt:0 "§YTaktik§! ve §YEyalet Düzeyinde Nükleer Vuruşlar§! yalnızca §YÇekirdek§! ve §YHak İddia Edilen§! eyaletlere yapılabilir.\n\n§YNükleer Vuruşlar§! ayrıca ilk vuruş olarak yapılabilmek için §Y%50§! §Rteslim sınırı§! gerektirir."
