 raid_type_drone_airfield_radar_strike_desc:0 "Düşman §Yhava alanlarına§! ve §Yradar istasyonlarına§! intihar dronu vuruşu düzenler; hava savunma altyapısını zayıflatır ve hava operasyonlarını engeller."
 raid_type_drone_power_grid_strike:0 "Dron Elektrik Şebekesi Vuruşu"
