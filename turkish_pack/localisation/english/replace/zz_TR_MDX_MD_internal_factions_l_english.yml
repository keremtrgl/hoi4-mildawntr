 wall_street_desc:0 "New York'ta sekiz blokluk bir cadde olan Wall Street, Amerikan finans hizmetleri sektörünün ve bir bütün olarak küresel kapitalizmin simgesi haline geldi. Dünyanın en büyük iki borsası olan New York Borsası ve NASDAQ'a ev sahipliği yapan Wall Street'in salt gücü ve ekonomik kudreti küçümsenmemelidir."
 wall_street_opinion_tt:0 "$md_internal_faction_effects_header$Grubun görüşü, §Y[?THIS.wall_street_opinion_min]§! değerinin üzerindeyken her ay [?global.monthly_internal_faction_tick_rate|Y] kadar yavaşça düşecektir.\n\n§Y$wall_street$§! görüşü: [WALL_opinion_display]\n\n§YGörüşten gelen etkiler:§!\n$modifier_production_speed_industrial_complex_factor$: [?THIS.WALL_psic_factor_var|%+]\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: [?THIS.WALL_local_resources_factor_var|%+]\n$MODIFIER_TRADE_OPINION_FACTOR$: [?THIS.WALL_trade_opinion_factor_var|%Y]\n$office_park_income_tax_modifier$: [?THIS.WALL_office_park_income_tax_modifier_var|+%]\n$investment_cost_modifier$: [?THIS.WALL_investment_cost_var|-%]\n$investment_duration_modifier$: [?THIS.WALL_investment_duration_var|-%]"
 display_wall_street_opinion:0 "§Y$wall_street$§! görüşü [?temp_opinion_change|+0] değişiyor (Mevcut: [WALL_opinion_display])\n"
 chaebols:0 "Çaebollar"
 chaebols_desc:0 "Çaebol, Güney Kore'ye özgü bir iş holdingi biçimidir. Küresel çok uluslu şirketlerdir ve çok sayıda uluslararası işletmeye sahiptirler. Hyundai, Samsung, LG ve SK Grubu en büyükleridir. Güney Kore çaebolları, ülkelerinin ekonomisinin büyüklüğüne kıyasla dünyanın en büyük şirketleridir ve Güney Kore'nin ulusal kalkınmasında vazgeçilmez bir rol oynamıştır."
 chaebol_opinion_tt:0 "$md_internal_faction_effects_header$Grubun görüşü, §Y[?THIS.chaebols_opinion_min]§! değerinin üzerindeyken her ay [?global.monthly_internal_faction_tick_rate|Y] kadar yavaşça düşecektir.\n\n§Y$chaebols$§! görüşü: [CHAE_opinion_display]\n\n§YGörüşten gelen etkiler:§!\n$modifier_production_speed_infrastructure_factor$: [?THIS.CHAE_psinfra_factor_avr|%+]\n$modifier_production_speed_industrial_complex_factor$: [?THIS.CHAE_psic_factor_var|%+]\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: [?THIS.CHAE_local_resouces_factor|%+]\n"
 display_chaebols_opinion:0 "§Y$chaebols$§! görüşü [?temp_opinion_change|+0] değişiyor (Mevcut: [CHAE_opinion_display])\n"
 has_economic_faction_TT:0 "Ekonomik iç grup"
 has_religious_faction_TT:0 "Dini iç grup"
 reduce_taxes_farmer_mission_tt:0 "§YKurumlar Vergisi Oranımız§! §Y[?reduction_target_farmers_tax_rate|0]%§! değerinden düşük (Mevcut §Y[?corporate_tax_rate|0]%§!)\n"
 display_internal_faction_election_effects:0 "Ülkemizdeki gruplar, seçim sırasında kararların sonucunu etkileyecek farklı düzeylerde destek sağlıyor."
 decision_category_internal_factions:0 "İç Gruplar Etkileşimi"
 decision_category_internal_factions_desc:0 "\n£MAIN_desctext_internal_factions \n\n\n\n[ROOT.GetName] ülkesinde birkaç grup var. Bunlar, ülkemizi inanılmaz derecede vergilendirebilecek güçlü gruplardır. Ancak bu gruplarla ne kadar uğraşırsak ileride o kadar sorun çıkarması da mümkündür."
 tax_labour_unions_decision:0 "Emek Sendikalarını Vergilendir"
 tax_labour_unions_decision_desc:0 "Emek sendikaları çok uzun zamandır fazlasıyla rahat durumda. Ülkedeki emek sendikaları üzerindeki vergileri artırmaya başlamalıyız"
 raise_wages_labour_unions_decision:0 "Ücretleri Artır"
 raise_wages_labour_unions_decision_desc:0 "Ülkede ücretleri artırmak, ülkedeki emek gruplarını hükümetimizden daha memnun kılacaktır."
 reduce_taxes_farmer_mission:0 "Çiftçiler Vergilerin Düşürülmesini Talep Etti"
 reduce_taxes_farmer_mission_desc:0 "Çiftçilerin yakın zamandaki düşük satışlar ve ekonomideki yükselen enflasyon nedeniyle ek paraya ihtiyacı var. Bu kampanyaya yardımcı olmak için §YKurumlar Vergisi Oranımızı§! §G%5§! düşürmemizi istediler."
 agricultural_district_tax_credits_decision:0 "§YTicari Tarım Bölgeleri§! Vergi Kredileri"
 agricultural_district_tax_credits_decision_desc:0 "Çiftçilerin ekonomik sorunlarını hafifletmek için bir dizi küçük vergi kredisi verebiliriz, ancak bunun bedeli önümüzdeki birkaç ay için gelir azalması olur. Nasıl ilerlemeliyiz?"
 allow_foreign_nationals_military_decision:0 "Orduda Yabancı Uyruklulara İzin Ver"
 allow_foreign_nationals_military_decision_desc:0 "Ordumuz nazik bir durumda ve onlara vatandaşlık garantisi vererek ek asker toplamamız gerekiyor."
 repeal_foreign_nationals_military_decision:0 "Ordudaki Yabancı Uyrukluları Yasakla"
 repeal_foreign_nationals_military_decision_desc:0 "Yakın zamanda yabancı uyrukluların orduya katılmasına izin verdik. Bu karar ordu içinde sorunlara yol açtı ve kararı yürürlükten kaldırmak değerli olabilir."
 encourage_religion_in_the_government_decision:0 "Hükümette Dini Teşvik Et"
 encourage_religion_in_the_government_decision_desc:0 "Yasalarımızda ilerlemeye devam ederken dindar kişileri hükümette yer almaya teşvik edin."
 encourage_additional_resource_production_decision:0 "Ek Kaynak Üretimini Teşvik Et"
 encourage_additional_resource_production_decision_desc:0 "Kaynak sektörümüzdeki ek üretimi teşvik etmek, kaynak bağımsızlığına yaklaşmamıza yardımcı olabilir. Bunu kısa vadede biraz vergi indirimi vererek yapabiliriz."
 cut_taxes_on_the_rich_decision:0 "Zenginlerin Vergilerini Düşür"
 cut_taxes_on_the_rich_decision_desc:0 "Ekonomide biraz büyümeyi tetiklemek için zenginlerin vergilerini düşürmenin zamanı geldi."
 impose_taxes_on_religious_institutions_decision:0 "Dini Kurumlara Vergi Getir"
 impose_taxes_on_religious_institutions_decision_desc:0 "Ülkemizdeki dini kurumlar şu anda vergi dairemizin gözünde yasaların üzerindedir. Hükümet hazinesine ek fon sağlamak için bu kurumların vergilendirilmesine dair yeni düzenlemeler getirmeliyiz."
 repeal_taxes_on_religious_institutions_decision:0 "Dini Kurumlardaki Vergileri Kaldır"
 repeal_taxes_on_religious_institutions_decision_desc:0 "Dini kurumlara yakın zamanda getirdiğimiz vergiler, kazandırabileceğinden çok daha fazla olumsuz sonuç doğurdu. Bu yasaları yürürlükten kaldırmayı değerlendirmeliyiz."
 sell_political_positions_to_the_highest_bidder:0 "Siyasi Makamları Sat"
 sell_political_positions_to_the_highest_bidder_desc:0 "Birkaç siyasi manevrayla bazı hayati olmayan siyasi makamları dostlarımıza satabiliriz."
 encourage_further_party_propaganda:0 "Daha Fazla Parti Propagandasını Teşvik Et"
 encourage_further_party_propaganda_desc:0 "Partimizin bir kısmı, mevcut konumumuza rağmen seçim konumumuzu korumak için daha fazla parti propagandası yapmamız gerektiğine inanıyor."
 allow_temporary_cut_backs_on_regulations_decision:0 "Düzenlemelerde Geçici Kesintilere İzin Ver"
 allow_temporary_cut_backs_on_regulations_decision_desc:0 "Daha fazla ekonomik kalkınmayı ve büyümeyi teşvik etmek için düzenlemelerde geçici bir azaltmaya izin vermek."
 cut_taxes_industry_decision:0 "Sanayilerin Vergilerini Düşür"
 cut_taxes_industry_decision_desc:0 "Sanayileri vergilendirmek ekonomimizi gerçekten zorladı. Kısa vadede ödedikleri vergileri azaltmalı, daha kalıcı çözümler üzerinde sonra çalışmalıyız."
 raise_wages_small_medium_business_owners_decision:0 "İşçi Ücretlerine Sübvansiyon Ver"
 raise_wages_small_medium_business_owners_decision_desc:0 "İşçi ücretlerine sübvansiyon vermek, Küçük ve Orta Ölçekli İşletme Sahipleri üzerindeki baskıyı bir miktar hafifleterek işletmelerine ve hizmet verdikleri yerel ekonomilere daha fazla yatırım yapmalarına olanak tanıyacaktır."
 subsidize_small_business_owners_decision:0 "Küçük İşletmelere Sübvansiyon Ver"
 subsidize_small_business_owners_decision_desc:0 "Küçük ve Orta Ölçekli İşletmelere aktif olarak sübvansiyon vermek, hizmet verdikleri bölgelerin ekonomisinde daha fazla yerel kalkınmaya ve diğer yatırımlara olanak tanıyacaktır."
 internal_faction_labour_dispute_companies_favoured:0 "Emek Anlaşmazlığı - Şirketler Kayırıldı"
 internal_faction_labour_dispute_companies_favoured_desc:0 "Yakın zamandaki bir emek sorununda hükümet, şirketlerin çıkarlarını emek sendikalarının çıkarlarına tercih etti"
 internal_faction_labour_dispute_union_favoured:0 "Emek Anlaşmazlığı - Emek Sendikaları Kayırıldı"
 internal_faction_labour_dispute_union_favoured_desc:0 "Yakın zamandaki bir emek sorununda hükümet, emek sendikalarının çıkarlarını şirketlerin çıkarlarına tercih etti"
 internal_faction_economic_boom:0 "Ekonomik Patlama"
 internal_faction_economic_boom_desc:0 "Gruplarımız ekonomik bir patlamada bize yardım ediyor!"
 internal_faction_subsidize_convoy_production:0 "Konvoy Üretimine Sübvansiyon Ver"
 internal_faction_subsidize_convoy_production_desc:0 "Ek nakit akışına ihtiyaç duyan tersanelerin isteği üzerine konvoy yük gemisi üretimine sübvansiyon verdik."
 internal_factions_allowed_foreign_nationals_military:0 "Askerlik Vatandaşlık Sağlıyor"
 internal_factions_allowed_foreign_nationals_military_desc:0 "Yakın zamanda yabancı uyrukluların vatandaşlık şartı olmadan orduya girmesine izin veren yasalar çıkardık. Bu, ordunun yeni asker alması için bir yöntem haline geldi ancak saflarda bir miktar istikrarsızlığa yol açtı."
 internal_factions_temporarily_reduce_migrations:0 "Geçici Olarak Düşürülmüş Göç Hedefleri"
 internal_factions_temporarily_reduce_migrations_desc:0 "Ülkedeki belirli yabancı çıkar gruplarının baskısı nedeniyle göç hedeflerimizi düşürdük."
 internal_factions_taxing_religious_institutions:0 "Dini Kurumların Vergilendirilmesi"
 internal_factions_taxing_religious_institutions_desc:0 "Hükümet, ülkedeki dini kurumlara vergi uygulamaya başladı. Bu, hükümetin bütçe açığına yardımcı oluyor ancak bedeli ülkemizdeki dini grupların hoşnutsuzluğu oluyor."
 internal_factions_taxing_religious_institutions_tt:0 "§YDini Kurumların Vergilendirilmesinden§! Ek Gelir: $$[?additional_income_taxing_religious_institutions|G3]"
 internal_factions_maritime_industry_dockyard_paying_dividends:0 "Denizcilik Sanayisi Patlaması"
 internal_factions_maritime_industry_dockyard_paying_dividends_desc:0 "Ülkemizdeki Denizcilik Sanayileri patlama yaşıyor ve hükümete temettü ödüyorlar. Hazineye ek gelir akışı görmeliyiz."
 internal_factions_events.0.t:0 "Isletme Sahipleri Vergi Indirimi Talep Ediyor"
 internal_factions_events.0.d:0 "Küçük ve orta ölçekli işletme sahiplerinin bir temsilcisi hükümetimize başvurdu. Ülkenin ekonomik durumu nedeniyle daha küçük işletmelerin zarar gördüğünü söylüyorlar. İşletmelerinin başarılı olmasına yardımcı olmak için geçici vergi indirimleri almak istiyorlar."
 internal_factions_events.0.o1:0 "Bazı vergileri azaltmayı kabul et"
 internal_factions_events.0.o2:0 "Bütçe buna dayanamaz!"
 internal_factions_events.0.o3:0 "Bunun yerine şirketlerin vergilerini artır!"
 internal_factions_events.0.o4:0 "Sorunu çözmek için Emek Sendikalarıyla çalış"
 internal_factions_events.1.t:0 "Satin Alinmaya Açik Girisim Sirketi"
 internal_factions_events.1.d:0 "Başarılı bir girişim şirketi yakın zamanda satışa çıkarıldı. Şu anda [ROOT.GetNameDef] ülkesinde faaliyetlerini genişletmek isteyen büyük bir yabancı şirketin büyük ilgisini çekiyor. Bazıları bu genişlemenin durdurulması gerektiğini söylüyor, ancak satın almayı engellemek serbest piyasa ilkelerine aykırı olurdu."
 internal_factions_events.1.o1:0 "Satın almanın gerçekleşmesine izin ver"
 internal_factions_events.1.o2:0 "Bunun durdurulması gerek"
 internal_factions_events.1.o3:0 "Devlet önce satın alacak"
 internal_factions_events.1.o4:0 "Bunun yerine yerli bir şirketle birleşmeye zorla"
 internal_factions_events.2.t:0 "Bürokrasi Yüzünden Çöken Girisim Sirketleri"
 internal_factions_events.2.d:0 "Birçok küçük işletme sahibi ülkedeki bürokrasi düzeyini eleştiriyor. Form üstüne form doldurmanın, izin başvurusunda bulunmanın ve daireden daireye koşturmanın insanları yeni şirket kurmaktan caydırdığını söylüyorlar. Küçük işletmeler üzerindeki bazı kısıtlamaları azaltmamızı istiyorlar."
 internal_factions_events.2.o1:0 "Bürokrasi miktarını azalt"
 internal_factions_events.2.o2:0 "O bürokratlar gerekli"
 internal_factions_events.2.o3:0 "Belki bazı kişiler için işi kolaylaştırabiliriz..."
 internal_factions_events.3.t:0 "Daha Fazla Girisim Sermayesi Talebi"
 internal_factions_events.3.d:0 "Bir grup iş insanı bize başvurarak yeni şirketleri desteklemek için daha fazla girişim fonu ayırmamızı istedi. Şirket kurmak pahalı bir iştir ve devlet küçük işletme sahiplerini desteklemelidir."
 internal_factions_events.3.o1:0 "Elbette girişimcilere daha çok yardım etmeliyiz"
 internal_factions_events.3.o2:0 "Devlet fonlarını özel işletmelere akıtmamalıyız"
 internal_factions_events.3.o3:0 "Bankalardan finansman sağla"
 internal_factions_events.4.t:0 "Küçük Isletmelere Kredi Yok"
 internal_factions_events.4.d:0 "Önümüze bir sorun getirildi. Birçok küçük işletmenin genel müdürü, bankaların onlara borç vermeye giderek daha isteksiz hale geldiğini söylüyor. Ancak bankacıların bir temsilcisi, bankaların birinin icat ettiği her 'devrimci' meyve suyu yapımcısına borç vermemesinin gayet normal olduğunu belirtti."
 internal_factions_events.4.o1:0 "Bankaları paralarını paylaşma konusunda daha cömert olmaya zorla"
 internal_factions_events.4.o2:0 "Bankalar kime borç vereceklerini seçmekte özgürdür"
 internal_factions_events.4.o3:0 "Daha küçük şirketlere devlet destekli krediler sağla"
 internal_factions_events.5.t:0 "Temiz Enerji Kavgasi"
 internal_factions_events.5.d:0 "Temiz enerji çözümleri sunan küçük bir şirket, büyük bir fosil yakıt şirketini mahkemeye taşıdı. Büyük şirket, küçük şirkete karşı kasıtlı olarak olumsuz pazarlama kampanyaları yürütmek, ayrıca sanayi casusluğu ve sabotaj yapmakla suçlanıyor. Dava ülke genelinde manşetlere çıkıyor ve yenilenebilir ile fosil enerji arasındaki bir mücadele olarak görülüyor."
 internal_factions_events.5.o1:0 "Yeşil enerjinin galip gelmesini sağla"
 internal_factions_events.5.o2:0 "Fosil yakıtların galip gelmesini sağla"
 internal_factions_events.5.o3:0 "Buna karışmamalıyız"
 internal_factions_events.6.t:0 "Büyük Havuzda Küçük Balik"
 internal_factions_events.6.d:0 "Birçok büyük şirketin küçük rakiplerini bilerek satın alıp kapatarak rekabeti önlediğine dair şikâyetler alıyoruz. Birçok kişi, büyük şirketlerin bir kartel kurmak ve piyasaları kontrol etmek için birlikte hareket ettiğinden korkuyor."
 internal_factions_events.6.o1:0 "Sadece iş bu, tatlım"
 internal_factions_events.6.o2:0 "Bu tür davranışları kınayın!"
 internal_factions_events.6.o3:0 "Kartel mi dediniz? Belki karşılıklı bir anlayışa varabiliriz"
 internal_factions_events.7.t:0 "Is Sözlesmesi Anlasmazligi"
 internal_factions_events.7.d:0 "İşletme sahipleri, ulusal iş sözleşmelerinin çalışan ile işveren arasındaki yerel sözleşmelerle esnetilmesini talep ediyor. Kimin işten çıkarılabileceğine dair daha az kısıtlama ve ayrılan çalışma saatlerinde daha fazla serbestlik tanınması, küçük işletmelerin personel işe almasını kolaylaştıracaktır. Emek Sendikalarının çoğu bu öneriye şimdiden karşı çıkarak işçi haklarının azaltılmasının söz konusu bile olamayacağını söyledi. Ücretli stajyerlik gibi uygulamaları ortadan kaldırmak için iş sözleşmelerinde daha fazla kısıtlama öneriyorlar."
 internal_factions_events.7.o1:0 "Yerel iş sözleşmeleri tercih edilir"
 internal_factions_events.7.o2:0 "Önce işçiler!"
 internal_factions_events.7.o3:0 "Belki bir anlayışa varabiliriz?"
 internal_factions_events.8.t:0 "Magazalar Kutsal Günde Açik"
 internal_factions_events.8.d:0 "Yakın zamanda büyük şehirlerimizden birinde bir mağaza sahibinin mağazasını ulusal bir dini bayramda açık tutmasıyla bir skandal patlak verdi. Dini kurum, bunun ulusun geleneklerine aykırı olduğunu, kutsal günlerin ibadet ve dua için olduğunu belirtti."
 internal_factions_events.8.o1:0 "Biz bir (buraya keyfî bir inanç yazın) ülkesiyiz ve geleneğe saygı gösterilmeli!"
 internal_factions_events.8.o2:0 "Din kimin umurunda ki zaten?"
 internal_factions_events.9.t:0 "Sirket Kendini Borsaya Kaydettirdi"
 internal_factions_events.9.d:0 "Popüler ve başarılı bir girişim şirketi kendini ulusal borsaya kaydettirmeye karar verdi. Bu, bize o şirketin hisselerinden bir kısmını satın alma şeklinde bir yatırım fırsatı sunuyor."
 internal_factions_events.9.o1:0 "Hisselerden bir kısmını satın al"
 internal_factions_events.9.o2:0 "Buna gücümüz yetmez"
 internal_factions_events.10.t:0 "Girisimler Patlama Yapiyor"
 internal_factions_events.10.d:0 "Ülkede yakın zamanda rekor sayıda yeni şirket kuruldu. Bu, birçok iş yarattı ve ekonomimizi olumlu etkiliyor. Ekonomi patlama yapıyor ve rekor sayıdaki girişimle gelişiyoruz!"
 internal_factions_events.10.o1:0 "Harika"
 internal_factions_events.11.t:0 "Siyasi Rakibe Kampanya Bagisi"
 internal_factions_events.11.d:0 "Siyasi rakibimiz, bir grup küçük işletmeden ortak bir bağış aldı. Görünüşe göre küçük işletmelerin genel müdürleri siyasetimizden memnun değil."
 internal_factions_events.11.o1:0 "Lanet olsun"
 internal_factions_events.13.t:0 "Büyük Sirket Iflas Etti!"
 internal_factions_events.13.d:0 "Ülkemizin en büyük şirketlerinden biri bugün iflas ilan etti. Ekonomimiz için gerçekten üzücü bir gün."
 internal_factions_events.13.a:0 "Üzücü"
 internal_factions_events.13.b:0 "İşletmeye Sübvansiyon Ver."
 internal_factions_events.14.t:0 "$labour_unions$ Zam Talep Ediyor"
 internal_factions_events.14.d:0 "$labour_unions$ artık ülkemizdeki işletmelerin ve sanayi holdinglerinin işçilerin ücretlerini artırmaya zorlanmasını talep ediyor."
 internal_factions_events.14.a:0 "İşletmelerden yana ol."
 internal_factions_events.14.b:0 "Sendikalardan yana ol."
 internal_factions_events.14.c:0 "Hiçbiri"
 internal_factions_events.15.t:0 "$labour_unions$ Daha Iyi Saglik Hizmeti Talep Ediyor"
 internal_factions_events.15.d:0 "$labour_unions$ sağlık bütçemizi genişletmemizi talep ediyor. Nasıl ilerlemeliyiz?"
 internal_factions_events.15.a:0 "Talepleri Kabul Et."
 internal_factions_events.15.b:0 "Talepleri Reddet."
 internal_factions_events.16.t:0 "$labour_unions$ Sosyal Yardim Harcamalarinin Artirilmasini Talep Ediyor"
 internal_factions_events.16.d:0 "Ülkedeki Emek Sendikaları, işçileri ve çalışamayanları daha iyi desteklemek için sosyal harcama bütçemizi genişletmemizi talep ediyor. Nasıl ilerlemeliyiz?"
 internal_factions_events.16.a:0 "Talepleri Kabul Et."
 internal_factions_events.16.b:0 "Talepleri Reddet."
 internal_factions_events.17.t:0 "Çiftçiler Tarim Reformuna Direniyor"
 internal_factions_events.17.d:0 "Küçük ölçekli geçimlik çiftçiler ayaklandı ve kırsal kalkınmaya çok sayıda unsurun dahil edilmesini talep ediyor. Çiftlik içi üretime dair Neoklasik kuramın, piyasa zorunluluklarına tabi çiftlik girdilerine bağımlı olanlar için yalnızca zorluk getirdiğini öne sürüyorlar.\n\nDevlet aktörleri ise geçimlik çiftçileri ihracat odaklı üreticilere dönüştürmenin kırsal bölgelerin piyasalaşma yoluyla kalkınmasına olanak tanıyacağını savunuyor."
 internal_factions_events.17.a:0 "Aşağıdan yukarıya kalkınma uygulamalarını hayata geçir."
 internal_factions_events.17.b:0 "Yalnızca yoksul yanlısı büyümeye odaklan."
 internal_factions_events.17.c:0 "Statükoyu sürdür."
 internal_factions_events.17.dd:0 "Neoklasik kalkınmayı derinleştir."
 internal_factions_events.18.t:0 "Çiftçiler Mali Yardim Talep Ediyor"
 internal_factions_events.18.d:0 "Çiftçiler şu anda mali sıkıntı yaşıyor. Bir tür sübvansiyonun olasılığını görüşmek üzere bir dilekçe sundular."
 internal_factions_events.18.a:0 "Çiftçilere Sübvansiyon Ver."
 internal_factions_events.18.b:0 "Toplu Ödeme Yap."
 internal_factions_events.18.c:0 "Zamana Ayak Uydur, Koca Adam."
 internal_factions_events.19.t:0 "Hava Siniri Ihlali"
 internal_factions_events.19.d:0 "Yabancı bir savaş uçağının hava sınırını ihlal etmesinin ardından ordu, bölgedeki hava savunmamızı güçlendirmemizi talep ediyor. Danışmanlar ek yerden havaya füze mevzileri inşa etmeyi veya eyaletimizi korumak için ek askeri sanayi kurmayı öneriyor. Aramızdaki pragmatistler ise basitçe her birinden birer tane inşa etmeyi öneriyor.\n\nOnları kesin bir dille geri çevirip bu süreçte kendimize hızlı siyasi puan kazandırmak da bir seçenek; ilişkilerimizi korumaya çalışmak da öyle."
 internal_factions_events.19.o1:0 "Daha fazla Yerden Havaya Füze Mevzii inşa et."
 internal_factions_events.19.o2:0 "Daha fazla Askeri Fabrika inşa et."
 internal_factions_events.19.o3:0 "Daha fazla Yerden Havaya Füze Mevzii ve Askeri Fabrika inşa et."
 internal_factions_events.19.o4:0 "Talepleri Reddet."
 internal_factions_events.20.t:0 "Denizcilik Sanayisi Sübvansiyon Talep Ediyor"
 internal_factions_events.20.d:0 "Ülkemizin Denizcilik Sanayisi hükümetten mali yardım talep ediyor. Tersanelerimizden bazıları bakımsız durumda ve acil ilgiye ihtiyaç duyuyor. Bu sübvansiyonları Denizcilik Sanayimize vermeli miyiz?"
 internal_factions_events.20.o1:0 "Sübvansiyonları Kabul Et."
 internal_factions_events.20.o2:0 "Sübvansiyonları Reddet."
 MAR_industry_subsidies:0 "§YDenizcilik Sanayisi Sübvansiyonları§!"
 internal_factions_events_additional_expense_tt:0 "Bütçeye §YEk Giderler§! eklenecek: [?mar_industry_calculator|0R3]\n"
 internal_factions_events.21.t:0 "Çiftçiler Biyoyakit Yatirimi Istiyor"
 internal_factions_events.21.d:0 "Tarım Sanayisi dernekleri hükümete başvurarak biyoyakıtlara yatırım yapılmasını talep etti. Bu, uluslararası çiftçilerle artan rekabet karşısında yurt içi tahıl piyasasını istikrara kavuşturmaya yardımcı olacaktır. Büyük petrol şirketlerinin temsilcileri öneriye karşı çıktıklarını dile getirdi."
 internal_factions_events.21.o1:0 "Çiftçileri Yok Say."
 internal_factions_events.21.o2:0 "Biyoyakıt Rafinerisine Yatırım Yap."
 internal_factions_events.21.o3:0 "İnşa Et, Ama Petrol Şirketlerini Rahatlat."
 internal_factions_events.22.t:0 "Ulusal Istihbarat Servisleri Vatandaslari Gözetlerken Yakalandi"
 internal_factions_events.22.d:0 "Ülkenin istihbarat servisleri, bir ihbarcı tarafından kendi vatandaşlarımızı gözetlemekle ifşa edildi. Halk öfkeli! Ancak hükümet liderleri ve İstihbarat Camiası, bunların hepsinin ülkemizi güvende tutmak için gerekli rutin davranışlar olduğunu söylüyor."
 internal_factions_events.22.o1:0 "İddiaları Yok Say."
 internal_factions_events.22.o2:0 "Kamuya Açık Soruşturma Başlat."
 internal_factions_events.22.o3:0 "Bilgi Sızıntısını Örtbas Et."
 internal_factions_events.22.o4:0 "İhbarcıyı Cezalandır."
 internal_factions_events.23.t:0 "Oligark Süpheli Islerde Yakalandi"
 internal_factions_events.23.d:0 "İstihbarat servislerimiz, ülkenin seçkinlerinden bir üyeyi bazı yasa dışı ticari işlemler yaparken yakaladı. Hükümet üyelerinden bazıları meseleyi kamuoyuna taşıyıp mahkemeye götürmek istiyor. Diğerleri sorunu halının altına süpürmeyi önerdi."
 internal_factions_events.23.o1:0 "Bunu Sessiz Tut."
 internal_factions_events.23.o2:0 "Kamuya Açık Bir Yargılama Düzenle."
 internal_factions_events.23.o3:0 "Oligarklara Yönelik Gelecek Soruşturmalardan Caydır."
 internal_factions_events.24.t:0 "Oligarklar Vergi Indirimi Istiyor"
 internal_factions_events.24.d:0 "Birkaç etkili iş insanı hükümet bakanlarına başvurarak vergileri düşürmemizi önerdi. Bunun yerli sanayiyi ve ticareti destekleyeceğini ve bu vergi indirimlerinin zamanla kendilerini finanse edeceğini söylüyorlar."
 internal_factions_events.24.o1:0 "Şu Anda Vergileri Düşüremeyiz."
 internal_factions_events.24.o2:0 "Bireylerin Vergilerini Düşür."
 internal_factions_events.24.o3:0 "Şirketlerin Vergilerini Düşür."
 internal_factions_events.24.o4:0 "Herkesin Vergisini Düşür."
 internal_factions_events.25.t:0 "Denizcilik Sanayisi Bir Anlasma Öneriyor"
 internal_factions_events.25.d:0 "Büyük gemi inşa firmalarımızın temsilcileri hükümete yeni bir anlaşmayla başvurdu. Satın alınabilecek birden fazla yük gemisi konvoyu araçları var. Üretime sübvansiyon vererek bu gemilerin daha fazlasını kazanmaya yardımcı olabiliriz ya da toplu bir ödeme yapıp satın alabiliriz. Nasıl ilerlemeliyiz?"
 internal_factions_events.25.o1:0 "Konvoy Üretimine Sübvansiyon Ver."
 internal_factions_events.25.o2:0 "Konvoyu Satın Al."
 internal_factions_events.25.o3:0 "Tüm konvoyları!"
 internal_factions_events.25.o4:0 "Kimin o çöpe ihtiyacı var!"
 internal_factions_events.26.t:0 "Ordu Hükümetimize Karsi Çikiyor"
 internal_factions_events.26.d:0 "Mevcut iktidar koalisyonumuzun yakın zamandaki politikaları orduda acınası ölçüde gözden düştü. Ulusal güvenliğimizi zayıflatmak için elimizden gelen her şeyi yaptığımızı öne sürüyorlar."
 internal_factions_events.26.o1:0 "Askeri Harcamaları Artır."
 internal_factions_events.26.o2:0 "İddiaları reddet!"
 internal_factions_events.26.o3:0 "İşleri yatıştır..."
 internal_factions_events.27.t:0 "Askeri Sanayi Gelisiyor"
 internal_factions_events.27.d:0 "Ülkemizdeki askeri sanayi, [ROOT.GetLeader] yönetimi altında gelişiyor. Silah sanayimizdeki bu mutlak patlamayı savunma sektörüne küçük bir yatırımla finanse etmeye bakabiliriz ya da onları alenen alkışlayabiliriz. Ne yapmalıyız?"
 internal_factions_events.27.o1:0 "Askeri Sanayiye Sübvansiyon Ver."
 internal_factions_events.27.o2:0 "Harika. Onları öv!"
 internal_factions_events.27.o3:0 "Bu onların işi."
 internal_factions_events.28.t:0 "Sanayi Holdingleri Sanayilesme Eksikligini Protesto Ediyor"
 internal_factions_events.28.d:0 "Sanayi Holdinglerinin liderleri [ROOT.GetLeader] yönetimine gelerek ülkedeki yakın zamandaki sanayileşme eksikliğinden yakındı. Ülkenin sanayi sektörünün ihmal edildiğine inanıyorlar ve sanayi sektörüne daha fazla yatırım yapılmasını istiyorlar. Doğrudan ülke ekonomisinin tarım tarafına açıkça odaklanmamızı gerekçe gösterdiler. Nasıl karşılık vermeliyiz?"
 internal_factions_events.28.o1:0 "Sanayicilerin canı cehenneme."
 internal_factions_events.28.o2:0 "Belki onlara birkaç kuruş verilebilir."
 internal_factions_events.28.o3:0 "Dürüst olmak gerekirse bu anlamsız."
 internal_factions_events.29.t:0 "Çiftçiler Vergi Indirimi Talep Ediyor"
 internal_factions_events.29.d:0 "Çiftçilerin liderleri bugün bize gelerek vergi oranımızı düşürmemizi talep etti. Vergi oranı şu anda zaten marjinal olan kârlarını eritiyor ve bazı çiftçilerin gereksiz yere strese girmesine neden oluyor. Bunun için yüzde beşlik bir vergi indirimini hedeflememizi istediler. Hamleyi hükümetimiz aracılığıyla yapmayı seçebilir veya mevcut bütçeyle devam etmeyi tercih edebiliriz. Bu, mevcut vergi gelirimizi azaltacak, ancak Çiftçilerimizin stresini hafifletecektir."
 internal_factions_events.29.a:0 "Talebi Kabul Et"
 internal_factions_events.29.b:0 "Paraya İhtiyacımız Var"
 internal_factions_events.30.t:0 "Tutulmayan Sözler"
 internal_factions_events.30.d:0 "Hükümet talep edildiği gibi vergileri düşürmedi ve bu nedenle Çiftçiler hükümetten memnun değil. Gerçekten üzücü bir gün ve bu, ileride gelecek daha kötü sonuçların habercisi olabilir."
 internal_factions_events.30.a:0 "Talihsiz"
 internal_factions_events.31.t:0 "Sanayiciler Bir Tarim-Sanayi Kompleksini Dönüstürüyor"
 internal_factions_events.31.d:0 "Ülkemizdeki Sanayiciler, bir miktar müzakereden sonra bir $agriculture_district$ alanını $industrial_complex$ alanına dönüştürme sürecini başlattı. Görünüşe göre bir traktör fabrikası olan yer şimdi otomobil fabrikasına dönüştürülüyor."
 internal_factions_events.31.a:0 "Ah, tamam."
 internal_factions_events.31.b:0 "O Traktörlere İhtiyacımız Var!"
 internal_factions_events.31.c:0 "Aslında, daha fazlasını dönüştürün!"
 internal_factions_events.32.t:0 "Bankacilar Bir Tahil Silosu Satin Aldi"
 internal_factions_events.32.d:0 "Yatırım camiamızın bir kısmı, yeni «ayrılıkçı ofisleri» için birkaç tahıl silosu satın almak üzere kaynaklarını birleştirdi. Ayrılıkçı ofisin ne olduğu hakkında hiçbir fikrimiz yok, ancak şehirlerin dışında ek bir şirket genel merkezimiz oldu."
 internal_factions_events.32.a:0 "Güzel"
 internal_factions_events.32.b:0 "Bir Çiftçiye Ver!"
 internal_factions_events.33.t:0 "Denizcilik Sanayileri Eski Bir Balikçilik Tesisi Edindi"
 internal_factions_events.33.d:0 "Denizcilik Sanayileri kıyıya yakın eski bir balıkçılık tesisi edindi. Eski tesis bakımsızdı ve ülkeyi daha da sanayileştirme çabasıyla piyasa fiyatından satın alındı."
 internal_factions_events.33.a:0 "Güzel"
 internal_factions_events.33.b:0 "Bir Çiftçiye Ver!"
 internal_factions_events.34.t:0 "Emek Sendikalari Göçmenleri Protesto Ediyor"
 internal_factions_events.34.d:0 "Emek Sendikaları, ülkeye giren yeni göçmenleri ve bunların sendikalı işçilerin ücretlerini baskılamasını protesto ediyor. Emek sendikalarının liderleri şu anda göçmen kotasını azaltmak için hükümete geliyor. Nasıl karşılık vermeliyiz?"
 internal_factions_events.34.a:0 "Çok endişeleniyorlar!"
 internal_factions_events.34.b:0 "Belki göçü azaltabiliriz?"
 internal_factions_events.34.c:0 "Göçü Kalıcı Olarak Azalt!"
 internal_factions_events.35.t:0 "Fosil Yakit Baronlari Bir Anlasma Öneriyor"
 internal_factions_events.35.d:0 "Fosil Yakıt Sanayileri bugün yeni bir Stratejik Ulusal Rezerv inşa etmek için yeni bir anlaşma önerdi. Hükümet geri kalanını ödeyecek fonu bulabilirse inşaatın yarısını ödemeyi teklif ediyorlar."
 internal_factions_events.35.a:0 "Anlaşmayı Kabul Et"
 internal_factions_events.35.b:0 "Anlaşmayı Reddet"
 internal_factions_events.36.t:0 "Yenilenebilir Enerji Yatirimi"
 internal_factions_events.36.d:0 "Özel çıkar grupları ve ülkedeki Yeşiller, hükümetin ek Yenilenebilir Enerji Altyapısına yatırım yapmasını talep ediyor. Yatırıma gitmeli miyiz?"
 internal_factions_events.36.a:0 "Yatırımı Kabul Et"
 internal_factions_events.36.b:0 "Yatırımı Reddet"
 internal_factions_events.37.t:0 "Tarim Sanayisi Göçmen Emegini Sömürüyor"
 internal_factions_events.37.d:0 "Tarım sanayisi her türlü göçmen emeğini sömürmekle suçlanıyor. Buna karşı sert önlemler alabiliriz ya da göz yumabiliriz. Ekonomi şimdilik gayet iyi gidiyor!"
 internal_factions_events.37.a:0 "Sert önlem al!"
 internal_factions_events.37.b:0 "Herkes onları sömürüyor!"
 internal_factions_events.38.t:0 "Dini Gruplar Temsil Talep Ediyor"
 internal_factions_events.38.d:0 "Ülkemizdeki dini gruplar şu anda hükümette ek temsil talep ederek dilekçe veriyor. Hükümet tarafından ezilmemelerini sağlamak için halkları adına daha iyi temsil edilmeyi hedefliyorlar."
 internal_factions_events.38.a:0 "Liderlerin Hükümette Yer Almasına İzin Ver"
 internal_factions_events.38.b:0 "Sınırlı Danışmanlığa İzin Ver."
 internal_factions_events.38.c:0 "Hayır."
 internal_factions_events.39.t:0 "Dini Gruplar Egitimde Yer Talep Ediyor"
 internal_factions_events.39.d:0 "Çeşitli dini gruplar, her kademedeki çeşitli eğitim kurullarında yer talep etti. Onlara eğitim kurulunda yer alma fırsatı tanıyabilir ya da taleplerini yok sayabiliriz."
 internal_factions_events.39.a:0 "Kurulda onlara bir koltuk ver."
 internal_factions_events.39.b:0 "Hayır, buna gerek yok."
 internal_factions_events.40.t:0 "Komünist Kadrolar ve Ordu Ideoloji Üzerine Tartisiyor"
 internal_factions_events.40.d:0 "Komünist Kadrolar ile ordu, ülkenin nasıl ilerlemesi gerektiğine dair fikirler üzerinde tartışmaya başladı. Çeşitli düzeylerde kibir ve daha fazlası, ikisi arasındaki tartışmayı bulandırmaya devam ediyor."
 internal_factions_events.40.a:0 "Komünist Kadroların Tarafını Tut"
 internal_factions_events.40.b:0 "Ordunun Tarafını Tut"
 internal_factions_events.40.c:0 "İkimizi de Destekle"
 internal_factions_events.41.t:0 "Komünist Kadrolar Hükümetten Ödün Talep Ediyor"
 internal_factions_events.41.d:0 "Komünist Kadrolar, önümüzdeki birkaç ay için geçici bir atama olarak hükümetten ödünler ve özel bir temsil talep etti. Bürokratik engelleri kaldırıp küçük hedefli değişiklikler yapmalarına izin vermek komünist kadro partilerine yarar sağlayacaktır."
 internal_factions_events.41.a:0 "Hükümete Girmelerine İzin Ver"
 internal_factions_events.41.b:0 "Sınırlı Danışmanlığa İzin Ver"
 internal_factions_events.41.c:0 "Talebi Reddet"
 internal_factions_events.42.t:0 "Cuma Hutbesi Siyasi Tartismayi Alevlendirdi"
 internal_factions_events.42.d:0 "Yakın zamanda bir Cuma namazı imamı hutbesinde hükümetin farklı yapması gereken konulardaki görüşlerini dile getirdi ve cemaat siyasi yorumlarına ezici çoğunlukla katıldı. Övgü ve şikâyetler bir arada yaşandı ve imamın siyasi yorumlarının haberi ülkede giderek daha fazla ilgi görüyor."
 internal_factions_events.42.a:0 "Önerilerinden bazılarını ele al ve uygula"
 internal_factions_events.42.b:0 "Onu yok say, aklını yitirmiş"
 internal_factions_events.43.t:0 "Dini Egitim Konusunda Anlasmazlik"
 internal_factions_events.43.d:0 "Yakın zamanda bir okul bölgesi ile bir din adamları vakfı arasındaki anlaşmazlık viral oldu. Kızgın tartışma, din adamlarının devlet eğitimi üzerindeki etkisi ve belirli derslerin öğretilme biçimi üzerineydi. Ulemâ, bazı fen derslerinin daha 'İslami' bir müfredat içerecek şekilde değiştirilmesi gerektiğini savundu."
 internal_factions_events.43.a:0 "Ulemâ'nın yanında yer al"
 internal_factions_events.43.b:0 "Okul bölgesinin yanında yer al"
 internal_factions_events.44.t:0 "Ulemâ Cami Projesi Için Fon Talep Ediyor"
 internal_factions_events.44.d:0 "Ulemâ, hükümetin ülke çapındaki bir cami yenileme ve geliştirme projesine kendi payını ödemesini talep etti. Amaç mevcut camileri iyileştirmek ve yükseltmek; bu camilerin boyutunu genişletmek için bazı arsaların kamulaştırılmasını gerektiriyor. Ulemâ, böyle bir projenin ülkeyi daha 'dindar' kılacağını ve hükümeti 'ahlaki' açıdan elverişli bir konuma getireceğini iddia ediyor."
 internal_factions_events.44.a:0 "Öneriyi doğrudan reddet"
 internal_factions_events.44.b:0 "Bir miktar mali yardım ver, ancak doğrudan katılma"
 internal_factions_events.44.c:0 "Arsaları kamulaştır ve din adamlarına ver"
 internal_factions_events.45.t:0 "Bölgesel ve Yerli Din Adamlari Arasinda Artan Is Birligi"
 internal_factions_events.45.d:0 "Son zamanlarda ülkemizdeki Ulemâ, bölgesel olanlarla yakın çalışıyor. Bu iş birliği, yabancı etkisinin [ROOT.GetName] ülkesine sızabileceğinden ve hükümetin itibarına zarar verebileceğinden korkan kabine üyelerimizi endişelendiriyor."
 internal_factions_events.45.a:0 "Tehdit oluşturmuyorlar"
 internal_factions_events.45.b:0 "Onlara karşı müdahale et"
 internal_factions_events.46.t:0 "Dini Fermana Karsi Halk Tepkisi"
 internal_factions_events.46.d:0 "Yakın zamanda bir din adamı, ulusal düzeyde ilan ettiği bir fermanı uygulamaya koyması için hükümete dilekçe vermeyi planladığını açıkladı. Kamuoyunun tepkisi karışık; olumsuz görüşler olumlulardan fazla, çünkü ferman kişisel özgürlükleri engelleyebilir. Ancak bazı yönlerden bu ferman hükümetimiz ve hedeflerimiz için faydalı olabilir, çünkü bu ferman sayesinde kendi gücümüzü artırabiliriz."
 internal_factions_events.46.a:0 "Fermanı ulusal düzeyde uygula"
 internal_factions_events.46.b:0 "Fermanı basın toplantısında alenen kına"
 internal_factions_events.47.t:0 "Vahhabi Ulemâ Sii ve Sufi Uygulamalarina Karsi Sert Önlem Çagrisi Yapiyor"
 internal_factions_events.47.d:0 "Önde gelen bir Vahhabi din adamının yakın zamandaki hutbesinin ardından birçok kişi, Şii ve Sufilerin 'kâfir' uygulamaları nedeniyle kovuşturulması için sert önlem alınması çağrısı yapıyor. Bu topluluklara saldırmak azınlıklar nezdindeki itibarımıza zarar verebileceğinden hükümet zor bir duruma sokuluyor."
 internal_factions_events.47.a:0 "Ulemâ haklı"
 internal_factions_events.47.b:0 "Onları yok say"
 internal_factions_events.48.t:0 "Vahhabiler Is Yerindeki Kadinlari Kiniyor"
 internal_factions_events.48.d:0 "Bugün ulusal televizyonda Vahhabi din adamları iş yerinde çalışan kadınları kınadı ve aktif olarak istihdam edilen ve iş yerinde yer alan kadınların sayısını azaltmaya çalışacak bir kampanya başlatmaya çalışıyorlar."
 internal_factions_events.48.a:0 "Onları yatıştırmak için birkaçını işten çıkar"
 internal_factions_events.48.b:0 "Onları yok say"
 internal_factions_events.49.t:0 "Vahhabiler Ahlak Devriyeleri Istiyor"
 internal_factions_events.49.d:0 "Vahhabiler, sokaklarda İslami gelenekleri ve hukuku göz ardı edenleri bulmayı amaçlayan ahlak devriyeleri çağrısı yapıyor. Bu devriyeler başladı ve hükümet bu uygulamalara dahil edilmedi. Sonuç olarak, bu devriyelerde kolluk kuvvetlerini aktif olarak göz ardı eden sivil gönüllüler var."
 internal_factions_events.49.a:0 "Devriyelerini destekle"
 internal_factions_events.49.b:0 "Onlara son ver"
 internal_factions_events.50.t:0 "Prens Havayolu Için Paraya Ihtiyaç Duyuyor"
 internal_factions_events.50.d:0 "Bir kraliyet prensi, yeni bir havayolu şirketini finanse etmek için hükümetten fon talep ediyor. Bu uçakları edinme azmi o kadar amansız ki girişimlerinin haberi viral oldu."
 internal_factions_events.50.a:0 "Peki, finanse et"
 internal_factions_events.50.b:0 "Finanse edeceğiz, ama hükümet mülkü olacak"
 internal_factions_events.51.t:0 "Aile Drami Viral Oldu"
 internal_factions_events.51.d:0 "Yakın zamanda iki kraliyet prensi arasındaki bir tartışma internette viral oldu. İkisi arasındaki bu şiddetli tartışma 'utanç verici' olarak nitelendirildi ve hanedanımızı uluslararası medyanın mercek altına aldı."
 internal_factions_events.51.a:0 "Prenslere destek veren bir açıklama yayımla"
 internal_factions_events.51.b:0 "Prensleri kına"
 internal_factions_events.52.t:0 "Kraliyet Prensi Firar Edip Yurt Disindan Hükümeti Kiniyor"
 internal_factions_events.52.d:0 "Bu hafta başında bir kraliyet prensi ülkeyi terk edip yurt dışına çıktı. Üyeler tatile gittiğini düşünmüştü, ancak çok geçmeden yabancı televizyonlarda hükümeti kınarken görünmeye başladı. Anlattıkları hükümeti mercek altına aldı ve eylemleri kraliyet ailesinin itibarını tehdit ediyor."
 internal_factions_events.52.a:0 "Hasarı örtbas etmeye çalış"
 internal_factions_events.52.b:0 "Kraliyet ailesinin tatillerini alenen kına ve eleştir"
