l_english:
 Solomon_Islands.1.t:0 "Munda Mutabakati"
 Solomon_Islands.1.d:0 "Milletler Topluluğu Özel Temsilcisi Sitiveni Rabuka'nın yoğun arabuluculuğunun ardından eyalet hükümeti ve muhalefet liderleri Munda Mutabakatı'nı imzaladı. Anlaşma, etnik şiddeti yatıştırmayı ve anayasal reform için bir yol haritası oluşturmayı amaçlayan Dokuz Maddelik bir Plan ortaya koyuyor."
 Solomon_Islands.1.a:0 "Kırılgan bir barış, hiç barıştan iyidir"
 Solomon_Islands.1.b:0 "Mutabakatı Çökert"
 Solomon_Islands.2.t:0 "Malaita Kartal Gücü Darbesi"
 Solomon_Islands.2.d:0 "Siyasi durum kırılma noktasına ulaştı. Bu sabah erkenden, paramiliter polis gücünün unsurlarınca desteklendiği bildirilen Malaita Kartal Gücü üyeleri Honiara'daki kilit stratejik noktaların denetimini ele geçirdi. Başbakan [SOL.GetLeader] silah zoruyla ev hapsine alındı. Malaita Kartal Gücü liderliği hükümetin Malaita çıkarlarını koruyamadığını iddia ediyor ve iktidarın derhal devredilmesini talep ediyor. Demokratik süreç fiilen askıya alındı."
 Solomon_Islands.2.a:0 "Manasseh Sogavare"
 Solomon_Islands.2.b:0 "Jimmy 'Rasta' Lusibaea"
 Solomon_Islands.3.t:0 "Isatabu Özgürlük Hareketi'nin Honiara Saldirisi"
 Solomon_Islands.3.d:0 "Isatabu Özgürlük Hareketi, Malaita nüfuzunu adadan atmak için büyük bir karşı saldırı başlattı. Gerilla savaşçıları ormandan çıkarak başkent Honiara'yı kuşattı. Resmî polis gücü etnik çizgilerde bölününce ülke tam ölçekli bir iç savaşa sürüklendi. Isatabu Özgürlük Hareketi Malaitalı yerleşimcilerin tamamen sürülmesini talep ederken, hükümet kent merkezi için kanlı bir savunmaya hazırlanıyor."
 Solomon_Islands.3.a:0 "Pasifik'te savaş."
 Solomon_Islands.4.t:0 "Solomon Adalari'nda Kriz"
 Solomon_Islands.4.d:0 "[SOL.GetNameWithFlag] toplumsal çöküş durumuna sürüklendi. Başbakan [SOL.GetLeader] yönetimi, Isatabu Özgürlük Hareketi ile Malaita Kartal Gücü arasında tırmanan gerilimlerle felç oldu. Çatışmanın kökeninde Guadalcanal'a yönelik iç göç ve yerli toprak hakları anlaşmazlıkları yatıyor. Kritik olarak, Gold Ridge madeni ve diğer hayati sanayiler faaliyetlerini durdurdu; bu da Güney Pasifik'teki ekonomik çıkarlarımızı tehdit ediyor."
 Solomon_Islands.4.a:0 "Bu istikrarsızlığı görmezden gelemeyiz."
 Solomon_Islands.4.b:0 "Kimin umurunda? Ben [ROOT.GetLeader]"
 Solomon_Islands.5.t:0 "Arabuluculuk Talebi"
 Solomon_Islands.5.d:0 "Toplam bir insani felaketi önleme çabasıyla [FROM.GetNameWithFlag], bizden bir barış zirvesine ev sahipliği yapmamızı resmen talep etti. Teklifleri, etnik hizipleri yatıştırmak için ademi merkeziyet ve özerklik reformlarıyla uzlaşma çerçevesi öneriyor. Ayrıca reform sürecinin militan müdahalesiyle kesintiye uğramaması için bir idari ve askerî danışman birliği talep ettiler."
 Solomon_Islands.5.a:0 "Barış sürecini kabul et"
 Solomon_Islands.5.b:0 "Bu bizim iç meselemiz, başkaları karışmasın"
 Solomon_Islands.6.t:0 "Arabuluculuk Reddedildi"
 Solomon_Islands.6.d:0 "[SOL.GetNameWithFlag] süren krizde arabuluculuk teklifimizi açıkça reddetti. Sert bir bildiride liderlik, iç işlerine yeni sömürgeci müdahaleye göz yummayacaklarını belirtti. Yabancı danışmanların ve diplomatik müdahalenin istenmediğini açıkça ortaya koydular ve Solomon Adaları'nın kendi anlaşmazlıklarını dış gözetim olmadan çözeceğinde ısrar ettiler."
 Solomon_Islands.6.a:0 "O hâlde sonuçlarıyla yalnız yüzleşirler."
 Solomon_IslandsNews.1000.t:0 "Avustralya, Solomon Adalari'nda Ateskesi Sagladi"
 Solomon_IslandsNews.1000.d:0 "Queensland'deki Townsville RAAF Üssü'nde günlerce süren müzakerelerin ardından bir uzlaşmaya varıldı. [SOL.GetNameWithFlag] Hükümeti kapsamlı bir barış antlaşması imzaladı. [AST.GetNameWithFlag], 30 günlük silah affını ve teslim edilen silahların imhasını denetleyecek Uluslararası Barış İzleme Ekibine liderlik etmeyi taahhüt etti. [AST.capital.GetName] ise görev kaymasından çekinmeyi sürdürüyor."
 Solomon_IslandsNews.1000.a:0 "Solomon Adaları'nda istikrar geri dönüyor"
 Solomon_IslandsNews.1001.t:0 "Solomon Adalari Ateskesi"
 Solomon_IslandsNews.1001.d:0 "[FROM.GetNameWithFlag], [SOL.GetNameWithFlag] içindeki çatışan hizipler arasında ateşkesi başarıyla sağladı. Anlaşma, silahsızlanma ve anayasal reform için bir yol haritası ortaya koyuyor. Tüm taraflar düşmanlıkların derhal sona ermesini ve tarafsız bir izleme gücünün kurulmasını kabul etti."
 Solomon_IslandsNews.1001.a:0 "Solomon Adaları'nda istikrar geri dönüyor"
 Solomon_IslandsNews.1002.t:0 "Solomon Adalari'nda Darbe"
 Solomon_IslandsNews.1002.d:0 "Malaitalı bir militan örgüt olan Malaita Kartal Gücü başkenti ele geçirdi. Çalıntı polis silahlarını kullanan ve Polis Saha Gücünün başıbozuk unsurlarınca desteklenen Malaita Kartal Gücü, bu sabah erkenden Başbakan Bartholomew Ulufa'alu'nun konutunu kuşattı. Ağır koruma altında ve şehrin cephaneliği isyancıların elindeyken Ulufa'alu istifasını sunmak zorunda kaldı. Malaita Kartal Gücü destekli hükümet şimdi Honiara'daki tek otorite olduğunu iddia ediyor."
 Solomon_IslandsNews.1002.a:0 "Yaklaşan Fırtına"
 Solomon_IslandsNews.1003.t:0 "Solomon Adalari Isyana Sürükleniyor"
 Solomon_IslandsNews.1003.d:0 "İç savaş, Isatabu Özgürlük Hareketi'nin tam zaferiyle sona erdi. Uzun bir gerilla savaşı kampanyasının ardından Isatabu Özgürlük Hareketi, Honiara'daki Malaita Kartal Gücü yanlısı yönetimin çöküşünü başarıyla sağladı."
 Solomon_IslandsNews.1003.a:0 "Honiara'da demokrasi çöküyor."
 Solomon_IslandsNews.1004.t:0 "Solomon Adalari Iç Çatismasinin Sonu"
 Solomon_IslandsNews.1004.d:0 "İç savaş, Isatabu Özgürlük Hareketi'nin tam zaferiyle sona erdi. Uzun bir gerilla savaşı kampanyasının ardından Isatabu Özgürlük Hareketi, Honiara'daki Malaita Kartal Gücü yanlısı yönetimin çöküşünü başarıyla sağladı."
 Solomon_IslandsNews.1004.a:0 "Sıradaki Bölüm Ne?"
 Solomon_IslandsNews.1005.t:0 "Solomon Adalari Iç Çatismasinin Sonu"
 Solomon_IslandsNews.1005.d:0 "Malaita Kartal Gücü'nün ve ulusal polisin kalıntılarının ortak operasyonları, Guadalcanal'ın iç kesimlerine yönelik acımasız bir taarruzun ardından Isatabu Özgürlük Hareketi isyanını sonunda ezdi."
 Solomon_IslandsNews.1005.a:0 "Sıradaki Bölüm Ne?"
 SOL_Histoical_path_TT:0 "Bu, [SOL.GetNameWithFlag] için §YTarihî Seçim§!dir"
 SOL_Lead_to_hostilities_TT:0 "Bu, [SOL.GetNameWithFlag] ülkesinde §RDüşmanlıklara§! yol açacak"
 SOL_IFM:0 "Isatabu Özgürlük Hareketi"
