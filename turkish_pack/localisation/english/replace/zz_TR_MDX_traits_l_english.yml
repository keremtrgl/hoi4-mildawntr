 loyalist_soldier:0 "Federalist"
 loyalist_soldier_desc:0 "Bu lider Orta Atlantik bölgesi olarak bilinen yerde ya da yurt dışında bir ABD ordusu ailesinde doğdu. Birliğe bağlılığı neredeyse sorgulanamaz."
 new_yorker_soldier:0 "New Yorklu"
 new_yorker_soldier_desc:0 "Bu lider New York Eyaleti'nde doğdu. Büyük Elma'sı büyük tehdit altındaysa Birliğe bağlılığı tartışmalı olabilir."
 new_england_soldier:0 "Yeni İngiltereli"
 new_england_soldier_desc:0 "Bu lider Yeni İngiltere bölgesinde doğdu. Evleri tehdit altında kalırsa Sam Amca yerine ailesini ve dostlarını savunmaya yönelebilir."
 southern_soldier:0 "Güneyli Asker"
 southern_soldier_desc:0 "Bu lider bir Güney eyaletinde doğdu ve memleketine daha sadık olma eğilimindedir. Ancak iş gerçekten çatışmaya dönerse sonunda Birlik'in yanında kalmayabilir."
 midwest_soldier:0 "Büyük Göller'li"
 midwest_soldier_desc:0 "Bu lider bir Orta Batı eyaletinde doğdu ve memleketine daha sadık olma eğilimindedir. Ancak iş gerçekten çatışmaya dönerse sonunda Birlik'in yanında kalmayabilir."
 texan_soldier:0 "Teksaslı"
 texan_soldier_desc:0 "Bu lider Teksas'ta doğdu. Birliğe bağlılığı olsa olsa tartışmalıdır ve fırsat doğarsa yeşermekte olan Sarı Gül'üne gitmesi muhtemeldir."
 great_plains_soldier:0 "Büyük Ovalar Askeri"
 great_plains_soldier_desc:0 "Bu lider bir Büyük Ovalar eyaletinde doğdu ve şansını ulusun kalbindeki ovalarda deneyecektir. En kötüsü gelirse büyük olasılıkla ortalıkta kalmaz."
 rocky_mountain_soldier:0 "Kayalık Dağlar Askeri"
 rocky_mountain_soldier_desc:0 "Bu lider Güney Kayalık Dağlar eyaletlerinde doğdu. Kendi ülkesinde bile olsa evden bu kadar uzakta olmak, onu yalnızca saf militarizmin ya da belki nafakanın uzak tutabileceği bir özlem duygusuna sürükler."
 california_soldier:0 "Kaliforniyalı"
 california_soldier_desc:0 "Ayı Cumhuriyeti serbest kalırsa, kıta olsun olmasın, bu lider eve dönüş yoluna girer."
 cascadian_soldier:0 "Cascadia'lı Asker"
 cascadian_soldier_desc:0 "Bu lider Pasifik Kuzeybatısı'nda doğdu. Washington DC'nin neredeyse tam zıddı olan Cascadia hareketi küçük de olsa yeni bir hayatın simgesi olurdu."
 puerto_rican_soldier:0 "Porto Rikolu"
 puerto_rican_soldier_desc:0 "Bu lider Porto Riko topraklarında doğdu. Ada neredeyse bir asırdır ulusumuzun içinde yer alsa da adadan pek çok kişi Birliğin parçası olmaya kayıtsız. Bağlılıkları olsa olsa belirsizdir."
 alaskan_soldier:0 "Alaskalı"
 alaskan_soldier_desc:0 "Bu lider Alaska eyaletinde doğdu. Çoğu Alaskalı alt 48 eyalette olup bitenleri pek umursamaz ve ciddi bir şey olsa gözünü bile kırpmaz. Bağlılıkları yok denecek kadar azdır."
 pacific_islander_soldier:0 "Pasifik Adalısı"
 pacific_islander_soldier_desc:0 "Bu lider Pasifik Okyanusu topraklarında doğdu. Hawaii'de doğmuş olsa bile gemi batıyorsa o gemiye katılmasını kimse beklemez."
