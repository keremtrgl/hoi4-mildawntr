l_english:
 gpu_development.1.t:0 "Radeon, GeForce'a Meydan Okuyor"
 gpu_development.1.d_usa:0 "NVIDIA'nın GeForce'u donanımsal dönüşüm ve aydınlatmayı sunmasından aylar sonra ATI, hız, sürücüler ve geliştirici sadakati konusunda doğrudan bir meydan okuma olarak Radeon'u tanıtmaya hazırlanıyor. Rekabet Amerikan grafik tasarımını sınıra taşıyor, ancak iki firma da fabrikasız ve her ilerleme birkaç Tayvanlı dökümhaneye bağımlılıklarını derinleştiriyor. Washington grafik standartlarını ve federal araştırmaları geniş ölçüde açık tutabilir ya da desteği en güçlü yerli tasarım şirketlerinin arkasında toplayabilir."
 gpu_development.1.a_usa:0 "Açık standartları ve araştırmayı destekle"
 gpu_development.1.b_usa:0 "Önde gelen tasarım şirketlerinin arkasında dur"
 gpu_development.1.d_can:0 "ATI Technologies, Markham'daki genel merkezinden Radeon'u tanıtmaya hazırlanıyor ve GeForce'un aylar önce aldığı performans liderliği için NVIDIA'ya meydan okuyor. Firma Kanada'nın az sayıdaki yarı iletken şampiyonundan biri, ancak sınırda rekabet etmek sermayeye, döküm kapasitesine ve hangi donanımın başarılı olacağına karar veren yazılım geliştiricilerine daha derin erişim gerektirecek. Ottawa ATI'nin bağımsızlığını ulusal bir tasarım şirketi olarak koruyabilir ya da onu Kanada tasarımını Amerikan sermayesine ve Asya üretimine bağlayan kıta ölçeğindeki tedarik zincirlerine katabilir."
 gpu_development.1.a_can:0 "ATI'nin bağımsızlığını koru"
 gpu_development.1.b_can:0 "ATI'yi kıta tedarikine entegre et"
 gpu_development.1.d_tai:0 "Radeon ile GeForce arasındaki rekabet, her iki fabrikasız tasarımcının çiplerini üretmek için yerel dökümhanelere bağımlı olduğu Tayvan'daki yeni wafer siparişleriyle birlikte geliyor. Bu yükselen grafik pazarı adanın Mikroçip sanayisinin müşteri tabanını genişletebilir ya da kıt ileri teknoloji kapasitesini en hızlı büyüyen tasarım şirketlerinin arkasında toplayabilir. Taipei, döküm erişimini birçok müşteriye açık tutmak mı yoksa birkaç çapa tasarımcıyla uzun vadeli sözleşmeler yapmak mı gerektiğine karar vermeli."
 gpu_development.1.a_tai:0 "Döküm erişimini genişlet"
 gpu_development.1.b_tai:0 "Çapa tasarım sözleşmelerini güvence altına al"
 gpu_development.2.t:0 "Gölgelendiriciler Programlanabilir Hale Geliyor"
 gpu_development.2.d_usa:0 "DirectX 8 ve yeni nesil grafik işlemciler, sabit boru hatlarının yerine programlanabilir köşe ve piksel gölgelendiricilerini getirdi. Donanım satıcıları, oyun stüdyoları ve işletim sistemi geliştiricileri artık gerçek zamanlı grafiklerin geleceğini şekillendirecek arayüzleri tanımlamak için yarışıyor."
 gpu_development.2.a_usa:0 "Gölgelendirici arayüzlerini standartlaştır"
 gpu_development.2.b_usa:0 "Satıcıların kendi yığınlarını genişletmesine izin ver"
 gpu_development.2.d_can:0 "ATI'nin Radeon mühendisleri, hızla ilerleyen bir grafik mimarisine programlanabilir gölgelendirici desteği ekliyor. Ortak arayüzler Kanada tasarımlarının pazarını genişletirken, özel eklentiler ATI'ye geçici bir teknik üstünlük sağlayabilir."
 gpu_development.2.a_can:0 "Ortak arayüzler etrafında inşa et"
 gpu_development.2.b_can:0 "Radeon platformunu farklılaştır"
 gpu_development.2.d_jap:0 "Programlanabilir grafikler, konsol üreticilerinin ve oyun stüdyolarının iş yükünü donanım ve yazılım arasında nasıl paylaştırdığını değiştiriyor. Japonya'nın platform sahipleri taşınabilir gölgelendirici standartlarını teşvik edebilir ya da kendi konsolları için sıkı biçimde optimize edilmiş mimarileri koruyabilir."
 gpu_development.2.a_jap:0 "Taşınabilir grafik standartlarını destekle"
 gpu_development.2.b_jap:0 "Yerli konsol platformları için optimize et"
 gpu_development.3.t:0 "AMD, ATI'yi Satin Aliyor"
 gpu_development.3.d_usa:0 "AMD, x86 işlemcileri, yonga setlerini ve grafikleri tek çatı altında birleştiren bir anlaşmayla ATI'yi satın almayı kabul etti. Birleşme entegre bilgi işlem platformları vaat ediyor, ancak grafik tasarımları ve döküm kapasitesi için rekabet eden bağımsız firma sayısını da azaltıyor."
 gpu_development.3.a_usa:0 "Birleşme çevresinde rekabeti koru"
 gpu_development.3.b_usa:0 "Entegre bir bilgi işlem platformunu teşvik et"
 gpu_development.4.t:0 "CUDA Paralel Hesaplamayi Açiyor"
 gpu_development.4.d_usa:0 "NVIDIA, programcıların uyumlu grafik işlemcileri görüntülemenin çok ötesindeki işler için kullanmasına olanak tanıyan CUDA'yı yayınladı. Bilimsel hesaplama, simülasyon ve veri analizi artık binlerce paralel iş parçacığından yararlanabilir; yeter ki geliştiriciler NVIDIA'nın yazılım ekosistemine bağlansın."
 gpu_development.4.a_usa:0 "Taşınabilir hesaplama standartlarını teşvik et"
 gpu_development.4.b_usa:0 "CUDA ekosistemini devreye al"
 gpu_development.5.t:0 "AlexNet Yapay Zekâ Yarisini Degistiriyor"
 gpu_development.5.d_usa:0 "AlexNet'in ImageNet'teki kesin sonucu, grafik işlemcilerde eğitilen büyük sinir ağlarının yerleşik bilgisayarlı görü yöntemlerini geride bırakabileceğini gösterdi. Amerikan laboratuvarları ve teknoloji şirketleri, rakipler atılımı büyük ölçekte tekrarlayamadan hızlandırıcıları, veri kümelerini ve araştırmacıları güvence altına almak için yarışıyor."
 gpu_development.5.a_usa:0 "Hızlandırıcı araştırmasını geniş ölçüde erişilebilir tut"
 gpu_development.5.b_usa:0 "Ticari yapay zekâ kümelerini ölçeklendir"
 gpu_development.5.d_can:0 "Toronto Üniversitesi araştırmacıları AlexNet'i eğitmek ve ImageNet yarışmasını dönüştürmek için NVIDIA grafik işlemcilerini kullandı. Kanada artık alışılmadık bir makine öğrenimi uzmanlığı yoğunluğuna sahip, ancak yabancı firmalar ekibi işe almak ve yöntemlerini ticarileştirmek için şimdiden yarışıyor."
 gpu_development.5.a_can:0 "Kamu araştırma ağını genişlet"
 gpu_development.5.b_can:0 "Atılımı bir yapay zekâ sanayisine dönüştür"
 gpu_development.6.t:0 "Tensör Çekirdekleri Veri Merkezine Giriyor"
 gpu_development.6.d_usa:0 "NVIDIA'nın Volta mimarisi, derin öğrenmede kullanılan matris işlemlerini hızlandırmak için tasarlanmış Tensör Çekirdeklerini sunuyor. Grafik işlemciler uzmanlaşmış veri merkezi motorlarına dönüşüyor ve bu da ileri üretim, yüksek bant genişlikli bellek ve sıkı entegre yazılım talebini artırıyor."
 gpu_development.6.a_usa:0 "Yapay zekâ hızlandırıcılarına erişimi genişlet"
 gpu_development.6.b_usa:0 "Tam yığın platformlara odaklan"
 gpu_development.6.d_tai:0 "Volta sınıfı hızlandırıcılar ileri teknoloji üretim ve giderek karmaşıklaşan paketleme gerektiriyor. Tayvan'ın dökümhaneleri yapay zekâ çiplerini birçok müşteri sınıfından biri olarak görebilir ya da kıt ileri kapasiteyi en hızlı büyüyen hızlandırıcı tasarımcılarına ayırabilir."
 gpu_development.6.a_tai:0 "İleri kapasiteyi geniş ölçüde erişilebilir tut"
 gpu_development.6.b_tai:0 "Stratejik hızlandırıcı siparişlerine öncelik ver"
 gpu_development.6.d_kor:0 "Yapay zekâ hızlandırıcıları, binlerce hesaplama birimini veriyle beslemek için yüksek bant genişlikli belleğe ihtiyaç duyar. Koreli bellek üreticileri HBM'yi açık bir sanayi standardı olarak genişletebilir ya da yeni kapasiteyi önde gelen hızlandırıcı platformlarına sıkıca bağlayabilir."
 gpu_development.6.a_kor:0 "HBM tedarikini standartlaştır ve genişlet"
 gpu_development.6.b_kor:0 "Uzun vadeli hızlandırıcı ortaklıkları güvence altına al"
 gpu_development.7.t:0 "GPU Tedariki Kuruyor"
 gpu_development.7.d_shortage:0 "Pandemi aksaması, yükselen elektronik talebi ve döküm kapasitesi için rekabet ekonomimizi Mikroçip bakımından darda bıraktı. Ekran kartları, araçlar, sunucular ve tüketici cihazları artık aynı kısıtlı arz için yarışıyor."
 gpu_development.7.d_resilient:0 "Pandemi aksaması ve yükselen elektronik talebi küresel Mikroçip pazarını zorladı, ancak mevcut arzımız dirençli kalıyor. Yurt dışındaki kıtlık yine de bir uyarı ve gelecekteki kapasiteyi güvence altına almak için bir fırsat sunuyor."
 gpu_development.7.a_usa:0 "Kritik kullanıcılar için erişimi koordine et"
 gpu_development.7.b_usa:0 "Yerli kapasite genişlemesini hızlandır"
 gpu_development.7.a_can:0 "Araştırmayı ve küçük tasarımcıları koru"
 gpu_development.7.b_can:0 "Kıta tedarik sözleşmelerini sabitle"
 gpu_development.7.a_tai:0 "Wafer'ları daha fazla müşteriye dağıt"
 gpu_development.7.b_tai:0 "Döküm genişlemesini hızlandır"
 gpu_development.7.a_kor:0 "Bellek arzını istikrara kavuştur"
 gpu_development.7.b_kor:0 "Stratejik çip üretimini genişlet"
 gpu_development.7.a_chi:0 "İthalatı sivil sanayi arasında karneye bağla"
 gpu_development.7.b_chi:0 "Yerli ikameyi hızlandır"
 gpu_development.7.a_jap:0 "Otomotiv ve elektronik üretimini koru"
 gpu_development.7.b_jap:0 "Yerli yarı iletken kapasitesini yeniden inşa et"
 gpu_development.8.t:0 "Hopper Bir Yapay Zekâ Motoru Oluyor"
 gpu_development.8.d_usa:0 "NVIDIA'nın Hopper mimarisi ve H100 hızlandırıcısı, büyük yapay zekâ modelleri için Transformer Motorlarını, yüksek bant genişlikli belleği ve yüksek hızlı ara bağlantıları bir araya getiriyor. Veri merkezi hızlandırıcısı artık uyarlanmış bir ekran kartı değil, başlı başına stratejik bir bilgi işlem sistemi."
 gpu_development.8.a_usa:0 "Daha geniş bir hızlandırıcı ekosistemini destekle"
 gpu_development.8.b_usa:0 "Önde gelen tam yığın platformu ölçeklendir"
 gpu_development.8.d_tai:0 "Hopper, büyük işlemci kalıplarını yüksek bant genişlikli belleğe bağlamak için TSMC'nin özelleştirilmiş sürecine ve ileri paketlemesine bağlıdır. Yapay zekâ talebi, hem wafer üretimini hem de paketleme hatlarını Tayvan Mikroçip sanayisi için stratejik darboğazlara dönüştürüyor."
 gpu_development.8.a_tai:0 "İleri paketlemeye erişimi genişlet"
 gpu_development.8.b_tai:0 "Çapa müşteriler için kapasite ayır"
 gpu_development.8.d_kor:0 "H100 sınıfı hızlandırıcılar HBM3 yığınları tüketiyor ve Koreli bellek üreticilerini yapay zekâ tedarik zincirinin merkezine yerleştiriyor. Kapasite çeşitli bir pazar için genişletilebilir ya da önde gelen platform satıcılarıyla derin ortaklıklara bağlanabilir."
 gpu_development.8.a_kor:0 "HBM3 arzını genişlet"
 gpu_development.8.b_kor:0 "Stratejik platform sözleşmelerine öncelik ver"
 gpu_development.9.t:0 "Yapay Zekâ Hesaplama Altyapisi Kurulumu"
 gpu_development.9.d_usa:0 "Üretken yapay zekâ, gelişmiş hızlandırıcılarla dolu veri merkezleri kurma yarışını tetikledi. Hiperölçekli firmalar Mikroçipler, elektrik gücü, ağ ekipmanı ve nitelikli işçiler için yarışıyor; bu da hesaplama kapasitesini ulusal bir sanayi meselesine dönüştürüyor."
 gpu_development.9.a_usa:0 "Hesaplama pazarlarını geniş ölçüde erişilebilir tut"
 gpu_development.9.b_usa:0 "Stratejik bir ulusal kurulumu destekle"
 gpu_development.9.d_can:0 "Kanada'nın yapay zekâ araştırma tabanı ve bol elektriği, yeni hızlandırıcı kümeleri ve veri merkezleri için teklifleri çekti. Kurulum üniversiteler ve girişimler için erişimi genişletebilir ya da yerli yetenekleri birkaç büyük yabancı platforma daha sıkı bağlayabilir."
 gpu_development.9.a_can:0 "Hesaplamayı açık bir araştırma ağı için ayır"
 gpu_development.9.b_can:0 "Kapasiteyi ölçeklendirmek için çapa firmaları kullan"
 gpu_development.9.d_tai:0 "Yapay zekâ işlemcilerine talep, ileri teknoloji döküm ve ileri paketleme sipariş defterlerini doldurdu. Tayvan bu kapasiteye erişimi yarı iletken ekosistemine yayabilir ya da yatırımı en hızlı genişlemeyi finanse edebilen müşterilerin arkasında toplayabilir."
 gpu_development.9.a_tai:0 "İleri kapasiteye erişimi çeşitlendir"
 gpu_development.9.b_tai:0 "Hızlı döküm genişlemesine odaklan"
 gpu_development.9.d_kor:0 "HBM, yapay zekâ hızlandırıcı üretimindeki en sıkı kısıtlardan biri hâline geldi. Koreli firmalar, yeterlilik ve arzı pazara yaymak mı yoksa yeni üretim hatlarını uzun vadeli stratejik müşterilere ayırmak mı gerektiğine karar vermeli."
 gpu_development.9.a_kor:0 "HBM yeterlilik ve arzını genişlet"
 gpu_development.9.b_kor:0 "Stratejik müşteriler etrafında inşa et"
 gpu_development.9.d_chi:0 "Yabancı hızlandırıcıların en gelişmişlerine erişim belirsizliğini korurken yapay zekâ hesaplamasına talep artıyor. Yerli tasarımcılar, dökümhaneler ve bellek üreticileri, her önde gelen bileşenin erişilebilir kalacağını varsaymadan eksiksiz bir tedarik zinciri oluşturmalı."
 gpu_development.9.a_chi:0 "Açık yerli hızlandırıcı standartlarını destekle"
 gpu_development.9.b_chi:0 "Kaynakları ulusal şampiyonlara yönelt"
 gpu_development.9.d_jap:0 "Yapay zekâ patlaması, Japonya'nın yarı iletken malzemelerinin, üretim ekipmanının, paketleme uzmanlığının ve yeni üretim projelerinin stratejik değerini yeniden canlandırdı. Koordineli yatırım bu güçlü yanları birbirine bağlayabilir, ancak sektör geniş tedarikçi erişimi ile yoğunlaştırılmış bir ulusal program arasında seçim yapmalı."
 gpu_development.9.a_jap:0 "Açık tedarikçi ekosistemini güçlendir"
 gpu_development.9.b_jap:0 "Ulusal bir kapasite programını koordine et"
 gpu_2000_graphics_market:0 "Grafik Pazarı Patlaması"
 gpu_2000_graphics_market_desc:0 "En yeni grafik hızlandırıcılara yönelik artan talep, mühendisleri ve siparişleri önde gelen tasarımlara çekiyor; araştırmayı hızlandırırken hepsinin bağımlı olduğu Mikroçip arzını zorluyor."
 gpu_accelerator_demand:0 "Hızlandırıcı Talebi"
 gpu_accelerator_demand_desc:0 "Grafik işlemcilere ve yapay zekâ hızlandırıcılarına talep, yatırımı, yeteneği ve Mikroçipleri ileri bilişime çekiyor. Ortaya çıkan genişleme araştırmayı ve veri merkezi büyümesini desteklerken daha geniş çip arzı üzerinde ek baskı yaratıyor."
 gpu_foundry_expansion:0 "Döküm Genişlemesi"
 gpu_foundry_expansion_desc:0 "Kamu ve özel yatırım, grafik işlemcilere ve yapay zekâ hızlandırıcılarına artan talebi karşılamak için Mikroçip Tesisi kapasitesini, ileri paketlemeyi ve yüksek bant genişlikli bellek üretimini genişletiyor."
