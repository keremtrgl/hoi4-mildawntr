 EU_news.20.t:0 "Kazara Ayrilis"
 EU_news.20.d:0 "[FROM.GetNameWithFlag], Avrupa Komisyonu (AK), Avrupa Merkez Bankası (AMB) ve Uluslararası Para Fonu'ndan (IMF) oluşan sözde Troyka'nın talep ettiği reformları gerçekleştiremedi. Diğer üye devletler Kurtarma Yasağı Maddesi'ne başvuruyor; bu nedenle [FROM.GetNameWithFlag], kendi yeni para birimini devalüe edip iflası önlemek için Avro Bölgesi'nden ve §C[EUU.GetFlag] Avrupa Birliği§!'nden ayrılmak zorunda."
 EU_news.20.a:0 "Elveda!"
 EU_news.21.t:0 "Bir Üye Devlet Birlikten Ayriliyor"
 EU_news.21.d:0 "[FROM.GetNameWithFlag], §C[EUU.GetFlag] Avrupa Birliği§!'nden ayrılıyor."
 EU_news.21.a:0 "Elveda!"
 EU_news.22.t:0 "50. Madde geri çekildi"
 EU_news.22.d:0 "[FROM.GetNameWithFlag], 50. Madde'yi geri çekti ve §C[EUU.GetFlag] Avrupa Birliği§!'nde kalıyor."
 EU_news.22.a:0 "Tamam"
 EU_news.23.t:0 "Çekilme Antlasmasi"
 EU_news.23.d:0 "[FROM.GetNameWithFlag] ile §C[EUU.GetFlag] Avrupa Birliği§! üye devletleri bir Çekilme Anlaşması imzaladı. [FROM.GetNameWithFlag], Çekilme Anlaşması'nda belirtilen koşullarla §C[EUU.GetFlag] Avrupa Birliği§!'nden ayrılacak."
 EU_news.23.a:0 "Hoşça kalın dostlar!"
 EU_news.24.t:0 "50. Madde Uzatmasi"
 EU_news.24.d:0 "[FROM.GetNameWithFlag] ile §C[EUU.GetFlag] Avrupa Birliği§! üye devletleri 50. Madde'yi üç ay uzatmayı kabul etti. [FROM.GetNameWithFlag] artık §C[EUU.GetFlag] Avrupa Birliği§!'nden üç ay sonra ayrılacak."
 EU_news.24.a:0 "Tamam"
 EU_news.34.t:0 "50. Madde isletildi"
 EU_news.34.d:0 "[FROM.GetNameWithFlag], 50. Madde'yi işletti ve §C[EUU.GetFlag] Avrupa Birliği§!'nden iki yıl içinde ayrılacak."
 EU_news.34.a:0 "Tamam"
 EU_news.25.t:0 "Filonun Avro Donanmasi'na Devri"
 EU_news.25.d:0 "[FROM.GetNameWithFlag], filosunu Avro Donanması Genel Sekreterliği makamının sahibi [FROM.FROM.GetNameWithFlag] ülkesine devrediyor."
 EU_news.25.a:0 "Tamam"
 EU_news.26.t:0 "Filo Devri Reddedildi"
 EU_news.26.d:0 "[FROM.GetNameWithFlag], filosunu Avro Donanması'na devretmeyecek."
 EU_news.26.a:0 "Tamam"
 EU_news.27.t:0 "Bir ülke Avrupa Birligi'ne katiliyor"
 EU_news.27.d:0 "[FROM.GetNameWithFlag], §C[EUU.GetFlag] Avrupa Birliği§!'ne katılıyor."
 EU_news.27.a:0 "Hoş geldiniz!"
 EU_news.32.t:0 "OMT Programi"
 EU_news.32.d:0 "AMB, OMT Programı'nı başlattı."
 EU_news.32.a:0 "Tamam"
 EU_news.33.t:0 "OMT Programi sona erdi"
 EU_news.33.d:0 "AMB'nin mevcut OMT Programı sona erdi."
 EU_news.33.a:0 "Tamam"
 EU_news.45.t:0 "OMT Programi'ni Küçült"
 EU_news.45.d:0 "AMB, OMT Programı'nı küçülttü.\n§YOMT Boyut Sınırı§!: §R-$200§! milyar ekle.\n§Yfaiz oranı§! §R%4,0§!'ın altındaki tüm üye devletler: §G+%5§! Avrupacılık ekle.\n§Yfaiz oranı§! §R%4,0§!'ın üzerindeki tüm üye devletler: §R-%5§! Avrupacılık ekle.\n"
 EU_news.45.a:0 "Tamam"
 EU_news.46.t:0 "OMT Programi'ni Genislet"
 EU_news.46.d:0 "AMB, OMT Programı'nı genişletti.\n§YOMT Boyut Sınırı§!: §G+$200§! milyar ekle.\n§Yfaiz oranı§! §R%4,0§!'ın altındaki tüm üye devletler: §R-%5§! Avrupacılık ekle.\n§Yfaiz oranı§! §R%4,0§!'ın üzerindeki tüm üye devletler: §G+%5§! Avrupacılık ekle.\n"
 EU_news.46.a:0 "Tamam"
 EU_news.47.t:0 "Avrupa Savunma Birligi (ASB)"
 EU_news.47.d:0 "Ortak çıkarlarını savunmak, dış çatışma ve krizlere yanıt vermek ve komşuluğumuzda güvenlik sağlamak için gerekli stratejik özerkliğe kavuşmak amacıyla üye devletler, askeri ittifak olarak Avrupa Savunma Birliği'ni (ASB) kurmaya ve topluca NATO'dan ayrılmaya karar verdi."
 EU_news.47.a:0 "Tamam"
 EU_news.48.t:0 "Avrupa Savunma Birligi (ASB)"
 EU_news.48.d:0 "Ortak çıkarlarını savunmak, dış çatışma ve krizlere yanıt vermek ve Avrupa komşuluğunda güvenlik sağlamak için gerekli stratejik özerkliğe kavuşmak amacıyla [EUU.GetFlag][EUU.GetName] üye devletleri, askeri ittifak olarak Avrupa Savunma Birliği'ni (ASB) kurmaya ve topluca NATO'dan ayrılmaya karar verdi."
 EU_news.48.a:0 "Tamam"
 EU_news.49.t:0 "Bir NATO üyesi ayrilip ASB'ye katiliyor"
 EU_news.49.d:0 "[FROM.GetNameWithFlag], NATO'dan ayrılıp [EUU.GetFlag] Avrupa Birliği'ne ve Avrupa Savunma Birliği'ne (ASB) katılıyor."
 EU_news.49.a:0 "Tamam"
 EU_news.50.t:0 "Sinirda Askeri Tatbikat"
 EU_news.50.d:0 "[FROM.GetNameWithFlag], sınırımızda Askeri Tatbikat yürütüyor. Buna karşılık vermeyi değerlendirmeliyiz."
 EU_news.50.a:0 "Tamam"
