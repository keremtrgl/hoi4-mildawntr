 EU_news.52.t:0 "[THIS.GetAdjective] [GetYear] Avrupa Parlamentosu Seçiminin Sonucu"
 EU_news.52.d:0 "Bu, [THIS.GetAdjective] halkının oyudur. [THIS.GetAdjective] siyasi partileri Avrupa Parlamentosu'na şu milletvekillerini gönderecek:\n [THIS.Western_Autocracy_L_icon] [?THIS.MEP_party_array^0], [THIS.conservatism_L_icon] [?THIS.MEP_party_array^1], [THIS.liberalism_L_icon] [?THIS.MEP_party_array^2], [THIS.socialism_L_icon] [?THIS.MEP_party_array^3], [THIS.communist_state_L_icon] [?THIS.MEP_party_array^4], [THIS.anarchist_communism_L_icon] [?THIS.MEP_party_array^5], [THIS.Conservative_L_icon] [?THIS.MEP_party_array^6], [THIS.Autocracy_L_icon] [?THIS.MEP_party_array^7], [THIS.Mod_Vilayat_e_Faqih_L_icon] [?THIS.MEP_party_array^8], [THIS.Vilayat_e_Faqih_L_icon] [?THIS.MEP_party_array^9], [THIS.Kingdom_L_icon] [?THIS.MEP_party_array^10], [THIS.Caliphate_L_icon] [?THIS.MEP_party_array^11], [THIS.Neutral_Muslim_Brotherhood_L_icon] [?THIS.MEP_party_array^12], [THIS.Neutral_Autocracy_L_icon] [?THIS.MEP_party_array^13], [THIS.Neutral_conservatism_L_icon] [?THIS.MEP_party_array^14], [THIS.oligarchism_L_icon] [?THIS.MEP_party_array^15], [THIS.Neutral_Libertarian_L_icon] [?THIS.MEP_party_array^16], [THIS.Neutral_green_L_icon] [?THIS.MEP_party_array^17], [THIS.neutral_Social_L_icon] [?THIS.MEP_party_array^18], [THIS.Neutral_Communism_L_icon] [?THIS.MEP_party_array^19], [THIS.Nat_Populism_L_icon] [?THIS.MEP_party_array^20], [THIS.Nat_Fascism_L_icon] [?THIS.MEP_party_array^21], [THIS.Nat_Autocracy_L_icon] [?THIS.MEP_party_array^22], [THIS.Monarchist_L_icon] [?THIS.MEP_party_array^23]"
 EU_news.52.a:0 "Tamam"
 EUU_idea_gdpr:0 "Genel Veri Koruma Tüzüğü"
 EUU_idea_gdpr_desc:0 "§YGenel Veri Koruma Tüzüğü§! (GVKT), Avrupa Birliği ve Avrupa Ekonomik Alanı (AEA) içinde bilgi gizliliğine ilişkin Avrupa Birliği düzenlemesidir. AB gizlilik ve insan hakları hukukunun önemli bir bileşeni sayılır; özellikle §YAvrupa Birliği Temel Haklar Şartı§!'nın 8(1). Maddesi ile ilişkilidir. Düzenlemenin temel amacı, bireyin verileri ve kişisel bilgileri üzerindeki denetimini güçlendirmek ve uluslararası ticaret açısından düzenlemeleri basitleştirmektir."
 foreign_data_kraken:0 "Yabancı Veri Krakeni"
 foreign_data_kraken_desc:0 "Yabancı Veri Krakeni, Genel Veri Koruma Tüzüğü'nden (GVKT) önceki yasalar bütününü temsil eder. Bu yasalar bütününde, Avrupa Birliği üye devletlerinin uzun vadeli güvenliği açısından sorun yaratan çeşitli boşluklar ve açıklar vardı."
 EU_copyright:0 "Dijital Tek Pazar'da Telif Hakkı Direktifi"
 EU_copyright_desc:0 "§YDijital Tek Pazar'da Telif Hakkı Direktifi§!, telif hakkı için iyi işleyen bir pazar sağlamak üzere kabul edilmiş bir Avrupa Birliği direktifidir. Avrupa Birliği telif hukukunu genişletir ve tek bir dijital pazara yayar."
 asylum_shopping:0 "Sığınma Alışverişi"
 asylum_shopping_desc:0 "Dünyanın dört bir yanından gelen sığınmacılar, en elverişli sığınma ülkesini bulmak için Avrupa Birliği içinde dolaşmayı sürdürüyor. Bu durum Avrupa Birliği genelinde bürokratik yük yaratıyor ve en kısa sürede çözüm aramamız gereken bir sorun."
 relocation_asylum_seekers:0 "Sığınmacıların Yeniden Yerleştirilmesi"
 relocation_asylum_seekers_desc:0 "Aşırı göçmen sayısını düşük tutmak için sığınmacıları yeniden yerleştirmeye başladık. Büyüyen bu soruna daha kalıcı bir çözüm bulmalıyız."
 EU_Turkey_deal:0 "AB-Türkiye Mutabakatı"
 EU_Turkey_deal_desc:0 "AB-Türkiye Anlaşması, Türkiye'den Yunan adalarına düzensiz yollarla geçişleri sınırlamayı amaçlıyordu. Avrupa Birliği'ne yönelik yasa dışı göçü azaltma yolunda çığır açıcı bir anlaşmaydı; ancak sığınmacı dalgasını durdurup durdurmayacağı henüz belli değil."
 European_Asylum_Agency:0 "Avrupa Sığınma Ajansı"
 European_Asylum_Agency_desc:0 "§YAvrupa Sığınma Ajansı§!, Avrupa Birliği üye devletlerinin sığınma konusundaki iş birliğini artırmak, Ortak Avrupa Sığınma Sistemi'nin uygulanmasını iyileştirmek ve sığınmacı baskısı altındaki üye devletleri desteklemek için kurulmuş bir Avrupa Birliği kuruluşudur."
 Frontex:0 "Frontex"
 Frontex_desc:0 "Genellikle Frontex olarak bilinen Avrupa Sınır ve Kıyı Güvenlik Ajansı, bir Avrupa Birliği kuruluşudur. Üye devletlerin sınır ve sahil güvenlik birimleriyle koordinasyon içinde Avrupa Schengen Alanı'nın sınır denetimini yürütür."
 EU_commission_president:0 "Avrupa Komisyonu Başkanı"
 EU_commission_president_desc:0 "§YAvrupa Birliği Başkanı§!, §C[EUU.GetFlag][EUU.GetName]§!'nin yürütme organının başıdır. Başkan, Kolej olarak anılan ve Avrupa Parlamentosu'na karşı toplu olarak sorumlu olan bir komiser kabinesine liderlik eder. Gerektiğinde komiserler arasında görev dağılımı yapma, görev değişikliğine gitme veya komiserleri görevden alma yetkisine sahiptir. Avrupa yasası olacak tasarıları önerme yetkisi yalnızca Komisyon'dadır."
 EU_council_president:0 "Avrupa Konseyi Başkanı"
 EU_council_president_desc:0 "§YAvrupa Konseyi Başkanı§!, yirmi yedi devlet ve hükümet başkanından oluşan Avrupa Konseyi'nin çalışmalarına başkanlık eder ve bunları ilerletir; aynı zamanda §C[EUU.GetFlag][EUU.GetName]§!'nin dünya sahnesindeki başlıca temsilcisidir. Kurum, devlet başkanları kolejinden ve Avrupa Komisyonu başkanından oluşur ve tüm Avrupa Birliği'ne siyasi yön verir."
 EU_parliament_president:0 "Avrupa Parlamentosu Başkanı"
 EU_parliament_president_desc:0 "§YAvrupa Parlamentosu Başkanı§!, Avrupa Parlamentosu'nun görüşmelerine ve faaliyetlerine başkanlık eder. Avrupa Parlamentosu'nu tüm hukuki konularda ve dış ilişkilerde, özellikle uluslararası ilişkilerde temsil eder. İki buçuk yıl görev yapar; Avrupa Birliği Bütçesi'nin ve ortak karar usulüyle kabul edilen Birlik işlemlerinin imzalanması için imzası gereklidir."
 frontex_ExDir:0 "Frontex İcra Direktörü"
 frontex_ExDir_desc:0 "§YFrontex İcra Direktörü§!, Avrupa Sınır ve Kıyı Güvenlik Ajansı'na (genellikle Frontex olarak bilinir) başkanlık eder. Frontex'in amacı, Avrupa Birliği üye devletlerine Avrupa dış sınırlarını koruma çabalarında sahada destek olmaktır. Ayrıca özgürlük, güvenlik ve adalet alanına katkı sağlamak için Schengen bölgesinde sınır denetimi yürütür."
 European_Defence_Fund:0 "Avrupa Savunma Fonu"
 European_Defence_Fund_desc:0 "§YAvrupa Savunma Fonu§!, Avrupa Birliği'nin Ortak Güvenlik ve Savunma Politikası'nın (OGSP) bileşenlerinden biridir; OGSP, ulusal savunma araştırması yatırımlarını ve Avrupa üyesi devletlerin silahlı kuvvetleri arasındaki birlikte çalışabilirliği koordine etmeyi ve artırmayı amaçlar. Özellikle Avrupa Savunma Fonu, ortak savunma projelerine finansman sağlayan bir programdır."
 European_Security_Council:0 "Avrupa Güvenlik Konseyi"
 European_Security_Council_desc:0 "§YAvrupa Güvenlik Konseyi§!, Avrupa Birliği'nin dahil olduğu her durumda stratejik düşünmesine ve hızlı ve etkili biçimde hareket etmesine yardım etmeyi amaçlayan bir güvenlik konseyidir."
 EUU_euroarmy_sc:0 "Avro Ordu Genel Sekreteri"
 EUU_euroarmy_sc_desc:0 "§YAvro Ordu Genel Sekreteri§!, Avrupa Birliği'nin Avro Ordusu'nun başıdır. Avrupa Birliği üye devletlerinin birleşik ve ortak silahlı kuvvetleri olan Avro Ordusu'nun koordinasyonundan sorumludur."
 EUU_euronavy_sc:0 "Avro Donanması Genel Sekreteri"
 EUU_euronavy_sc_desc:0 "§YAvro Donanması Genel Sekreteri§!, Avrupa Birliği'nin Avro Donanması'nın başıdır. Avrupa Birliği'nin birleşik ve ortak deniz gücü olan Avro Donanması'nın koordinasyonundan sorumludur."
 EUU_cfr_eu:0 "Avrupa Birliği Temel Haklar Şartı"
 EUU_cfr_eu_desc:0 "§YAvrupa Birliği Temel Haklar Şartı§!, Avrupa Birliği vatandaşlarının ve sakinlerinin siyasi, sosyal ve ekonomik haklarını Avrupa hukukuna kazandırır. Şart, Avrupa Birliği'nin özgürlük, güvenlik ve adalet alanı (ÖGAA) politika alanının bir parçasını oluşturur. Avrupa Birliği'nin ve Euratom'un tüm sınırlarında geçerlidir; bunlar şartın hükümlerine göre hareket etmek ve yasa yapmak zorundadır."
 european_spirit:0 "Avrupa Ruhu"
 european_spirit_desc:0 "Sonsuza dek, birlikte olduğumuzda bölünmüş olduğumuzdan daha güçlüyüz. Kıtamızın ve tüm dünyanın daha iyisi için Avrupa Birliği'ni güçlendirmeyi sürdürmeliyiz."
 EU_foreign_minister:0 "Birliğin Dış İlişkiler ve Güvenlik Politikası Yüksek Temsilcisi"
 EU_foreign_minister_desc:0 "§YBirliğin Dış İlişkiler ve Güvenlik Politikası Yüksek Temsilcisi§!, Avrupa Birliği'nin Ortak Dış ve Güvenlik Politikası'nın (ODGP) başlıca koordinatörü ve temsilcisidir. Unvan sıklıkla AB Dışişleri Bakanı olarak kısaltılır ve esas olarak üye devletler adına dış politikayı koordine eder."
 ECB_president:0 "Avrupa Merkez Bankası Başkanı"
 ECB_president_desc:0 "§YAvrupa Merkez Bankası Başkanı§!, Avro'nun yönetiminden ve Avro Bölgesi'nde Avrupa Birliği'nin para politikasından sorumlu kurum olan Avrupa Merkez Bankası'na (AMB) başkanlık eder. AMB'nin İcra Kurulu'na, Yönetim Konseyi'ne ve Genel Konsey'ine başkanlık eder ve bankayı yurt dışında temsil eder."
 ECB_zero_interest_rate_policy:0 "AMB Sıfır Faiz Politikası"
 ECB_zero_interest_rate_policy_desc:0 "AMB Sıfır Faiz Politikası, Avrupa Merkez Bankası'nın ortaya koyduğu para politikası kararlarını gerçekleştirmek için geliştirdiği makroekonomik kavramların bir parçasıdır. AMB Sıfır Faiz Politikası, çoğunlukla yavaş ekonomik büyüme, deflasyon ve borçların azaltılmasıyla ilişkilendirildiği için baskı altına girmiştir."
 EUU_national_dept_crisis_eu:0 "Ulusal Borç Krizi"
 EUU_national_dept_crisis_eu_desc:0 "ABD'deki Büyük Durgunluk dünyanın birçok bölgesinde yankı yaratmayı sürdürüyor. Avrupa'daki Ulusal Borç Krizi, bu devam eden etkinin yalnızca bir örneği. Ülkemizin artan borcu genel olarak Avro'yu tehdit etmeye başlıyor."
 european_debt_crisis:0 "Avrupa Borç Krizi"
 european_debt_crisis_desc:0 "ABD'deki Büyük Durgunluk dünyanın birçok bölgesinde yankı yaratmayı sürdürüyor. Birkaç Avrupa Birliği üye devleti, Büyük Durgunluk'un sonuçları nedeniyle zor durumda."
 euro_bonds:0 "Avro Tahvilleri"
 euro_bonds_desc:0 "Eurobond'lar, kamu borcunu finanse etmek için yeni bir seçenektir. Avro Bölgesi üyelerinin borçlarını finanse etmelerine yardımcı olmak için Eurobond ihraç edilir ve tasarruf sahiplerine ABD tahvil piyasasıyla rekabet eden likit yatırım fırsatları sunulur."
 euro_rescue_package:0 "Avro Kurtarma Paketi"
 euro_rescue_package_desc:0 "Avrupa Merkez Bankası, borç krizinin dalgasını durdurmak ve kontrol altına almak için bir kurtarma paketi açıkladı. Maliyetli bir önlem, ancak Avro Bölgesi'nin mevcut ekonomik durumunu istikrara kavuşturmalı."
 fiscal_union:0 "Mali Birlik"
 fiscal_union_desc:0 "Avrupa Birliği için bir mali birlik kurulması, ortak bir bütçeyi daha da paylaşmamıza olanak tanıyacak. Bu, Avrupa Birliği içinde büyüyen birlik duygusunu ve Birliğin bütünü için verilen tavizleri daha da pekiştiriyor."
 European_Economic_Government:0 "Avrupa Ekonomik Hükûmeti"
 European_Economic_Government_desc:0 "Avrupa Ekonomi Hükümeti'nin kurulması, [EUU.GetFlag][EUU.GetName] genelinin bir vergi otoritesi oluşturmasının ve üye devletler için harcama hedefleri belirlemesinin emsalini ve olanağını yarattı."
 EU_finance_minister:0 "Avrupa Ekonomi ve Maliye Bakanı"
 EU_finance_minister_desc:0 "§YAvrupa Ekonomi ve Maliye Bakanı§!, Avrupa Ekonomi Hükümeti'ne başkanlık eder ve mali birliğin kendisine verdiği yetkilere sahiptir. Bakan; vergi otoritesinin, üye devletler için asgari ücretin ve diğer ekonomik ve mali kararların denetiminden sorumludur."
 EUU_ambassador_unsc:0 "Birliğin Birleşmiş Milletler Büyükelçisi"
 EUU_ambassador_unsc_desc:0 "§YBirliğin Birleşmiş Milletler Büyükelçisi§!, tüm Avrupa Birliği üye devletlerinin diplomatik misyonlarıyla koordinasyon içinde çalışarak Avrupa Birliği'ni Birleşmiş Milletler'de temsil eder."
 EU_president:0 "Avrupa Federasyonu Başkanı"
 EU_president_desc:0 "§YAvrupa Federasyonu Başkanı§!, Avrupa Federasyonu'nun usulüne uygun seçilmiş liderdir. Avrupa Federasyonu, Avrupa Birliği'nin nihai federalleşme seçeneklerinden biridir ve bu nedenle çok güçlü bir makamdır."
 withdrawal_treaty:0 "Çekilme Antlaşması"
 withdrawal_treaty_desc:0 "Avrupa Birliği'nden çekilirken, ticaret anlaşmalarını veya diğer siyasi tavizleri masada tutarak ayrılmamıza olanak tanıyan bir Çekilme Anlaşması elde ettik."
 no_deal_exit:0 "Anlaşmasız Ayrılış"
 no_deal_exit_desc:0 "Anlaşmasız Ayrılış'ı seçtik. Ülkemizin Avrupa Birliği'nden ayrılmasının ayrıntıları üzerinde anlaşamadık."
 austerity:0 "Kemer Sıkma"
 austerity_desc:0 "Avrupa Komisyonu'nun Troyka Reformları'nın hedeflerini gerçekleştirdik. Ülkemiz uğruna kemer sıkmayı başardık ve ekonomimiz istikrara kavuşmaya devam ediyor."
 EUU_voting_rights_suspended:0 "Konsey'de AB Oy Haklarının Askıya Alınması"
 EUU_voting_rights_suspended_desc:0 "Avrupa değerlerinin defalarca ihlal edilmesi nedeniyle Avrupa Birliği'ndeki oy haklarımız askıya alındı. Ya ülkemizi götürdüğümüz yönü değiştirmenin ya da Birlik'ten ayrılmayı düşünmenin vakti geldi."
 EUU_subsidies_suspended:0 "AB Sübvansiyonlarının Askıya Alınması"
 EUU_subsidies_suspended_desc:0 "Eskiden aldığımız Avrupa Birliği sübvansiyonları askıya alındı. Bütçemizdeki ani değişime alışmak zaman alacak ve bize ayrılan sübvansiyonlardan yeniden yararlanabilmek için durumu düzeltmenin yollarını aramalıyız."
 Migrant_Crisis_Europe:0 "Göçmen Krizi"
 Migrant_Crisis_Europe_desc:0 "Göçmen Krizi Avrupa'yı bir balyoz gibi vurdu; hem ulusal birliği hem de iktidar partilerinin popülaritesini darmadağın ediyor. Suriye'deki savaş binlerce mültecinin komşu ülkelere kaçmasına yol açtı ve Avrupa savaştan zarar görenleri kabul etmeye hazır dursa da Kuzey Afrika ve Orta Doğu'nun dört bir yanından gelen yeni ve kalıcı göçmenlerin sayısı Avrupa'nın kurumlarını bunalttı ve birçok kişinin yeni gelenlere öfke duymasına neden oldu."
