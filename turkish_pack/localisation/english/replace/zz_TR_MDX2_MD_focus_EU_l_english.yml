 tooltip_ECB_Outright_Monetary_Transactions_complete_effect:0 "§Yfaiz oranı§! §R%4,0§!'ın üzerindeki tüm üye devletler: Borçları, §Yfaiz oranı§! §R%4,0§!'ın altına düşene VE §GOMT Boyut Sınırı§! > §BOMT Toplam Değeri§! olana dek azaltılır.\n"
