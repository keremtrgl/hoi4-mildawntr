 european_council_voting_members:0 "§GOy Kullanan Üyeler§!"
 european_council_voting_members_tt:0 "Avrupa Konseyi'ne sunulan yeni önlemler için oy kullanabilecek §C[EUU.GetFlag][EUU.GetName]§! üyelerinin listesi."
 european_council_header_tt:0 "§C[EUU.GetFlag][EUU.GetName]§! Yasal Düzenlemeleri\n--------------\n§C[EUU.GetFlag][EUU.GetName]§! yapısının şu ana kadar kabul edilen yasal düzenlemeleri.\n\nAvrupa Birliği Konseyi, genellikle çifte çoğunluk olarak bilinen Nitelikli Çoğunluk Oylaması (QMV) ile çalışır. Bunun için §CÜye Devletlerin§! %55'inin ve Avrupa Birliği nüfusunun %65'ini temsil eden §CÜye Devletlerin§! onayı gerekir."
 active_agenda_header:0 "§YŞu Anda Etkin Gündem§!"
 list_of_available_laws_header:0 "§HMevcut Avrupa Birliği Reformları§!"
 system_of_eu_values_text:0 "§YAvrupa Değerleri§!"
 system_of_eu_values_tt:0 "Avrupa Değerleri Sistemi:\nAB değeri:\nihlal konusu - ihlal düzeyi\n\nHukukun Üstünlüğü:\nFelç Edici Yolsuzluk - 5\nÇökerten Yolsuzluk - 4\nYaygın Yolsuzluk - 3\nDizginsiz Yolsuzluk - 2\nSistematik Yolsuzluk - 1\n\nİnsan onuruna ve özgürlüğe saygı:\nBir AB üyesi devlete karşı taarruz savaşı yürütmek - 10\nKomünist hükûmet - 2\nGerici hükûmet - 2\nKoalisyonda komünist olması - 1\nKoalisyonda gerici olması - 1\n\nDemokrasi:\nSeçim yok - 5\nDiktatörlük - 5\nKomünist Diktatörlük - 5\nFaşist Diktatörlük - 5\nKukla devlet olmak - 4\nYeni Emperyalizm - 1\n\nKadın ve Azınlık Hakları:\nKadınlara Askerlik Yasağı - 1\n%10 Seçim Barajı - 1\n\nKurtarma Paketi Yasağı maddesi:\nBorçlarda Temerrüt - 1\nKurtarma Paketi Verilmesi - 1"
