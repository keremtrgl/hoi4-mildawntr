 EU_recently_retired_from_an_eu_office_tt:0 "§Y[ROOT.GetNameWithFlag]§!, yakın zamanda bir Avrupa Birliği makamından emekli olmamış (Yeni Makam Üstlenmeye Kalan Gün: [?recently_retired_from_an_eu_office:days_left|Y0])\n"
 EU_does_not_hold_another_office_tt:0 "§Y[ROOT.GetNameWithFlag]§!, şu anda başka bir §C[EUU.GetFlag][EUU.GetName]§! makamı elinde tutmuyor\n"
 EU_president_council_tt:0 "§YAvrupa Konseyi Başkanı§!, devlet veya hükûmet başkanlarından oluşan Avrupa Konseyi'nin çalışmalarına başkanlık eder ve bunları ileri taşır; aynı zamanda dünya sahnesinde §C[EUU.GetFlag][EUU.GetName]§! yapısının başlıca temsilcisidir. Kurum, yirmi yedi devlet ve hükûmet başkanı ile Avrupa Komisyonu başkanından oluşur ve Avrupa Birliği'nin bütününe siyasi yön verir.\n\n§YMakamın Avantajları:§!\nBu makamı elinde tutmak, hiçbir üye üzerinde nüfuz harcamadan bir tasarıyı oylamaya sunmamızı sağlar.\n\nAvrupa Yanlısı ve Avrupa Şüpheciliği Kampanyalarının başarı oranını §G+%10§! artırır\n\n[!eu_president_council_back_click]\n"
 EU_president_council_unlocks_tt:0 "§YLizbon Antlaşması§!, §YAvrupa Konseyi Başkanlığı§! makamını tesis etti"
 eu_president_commission_tt:0 "§YAvrupa Komisyonu Başkanı§!, §C[EUU.GetFlag][EUU.GetName]§! yapısının yürütme organının başıdır. Başkan, topluca Avrupa Parlamentosu'na karşı sorumlu olan ve kısaca Kolej olarak anılan Komiser kabinesine liderlik eder. Gerektiğinde komiserler arasında görev dağılımı yapma, bu görevleri yeniden düzenleme veya komiserleri görevden alma yetkisine sahiptir. Komisyon, Avrupa Hukuku hâline gelecek yasa tasarılarını önermeye yetkili tek organdır.\n\n§YMakamın Avantajları:§!\nBu makamı elinde tutmak, hiçbir üye üzerinde nüfuz harcamadan bir tasarıyı oylamaya sunmamızı sağlar.\n\nAvrupa Yanlısı ve Avrupa Şüpheciliği Kampanyalarının başarı oranını §G+%10§! artırır\n\nBu makamı elinde tutmak, nüfuza bakılmaksızın üçten fazla ihlal düzeyine sahip üye devletleri askıya almamızı sağlar.\n\n[!eu_president_commission_back_click]\n"
 EU_high_representative_tt:0 "§YBirliğin Dış İlişkiler ve Güvenlik Politikası Yüksek Temsilcisi§!, Avrupa Birliği'nde Ortak Dış ve Güvenlik Politikası'nın (ODGP) baş koordinatörü ve temsilcisidir. Unvan sıklıkla AB Dışişleri Bakanı olarak kısaltılır ve temel olarak üye devletler adına dış politikayı koordine eder.\n\n§YMakamın Avantajları:§!\n\n[!foreign_affairs_security_back_click]\n"
 EU_high_representative_unlocks_tt:0 "§YAvrupa Dış Eylem Servisi§!, §YAvrupa Parlamentosu Başkanlığı§! makamını tesis etti"
 EU_president_european_parliament_tt:0 "§YAvrupa Parlamentosu Başkanı§!, Avrupa Parlamentosu'nun görüşmelerine ve faaliyetlerine başkanlık eder. Avrupa Parlamentosu'nu tüm hukuki konularda ve dış ilişkilerde, özellikle uluslararası ilişkilerde temsil eder. İki buçuk yıllık bir görev süresi vardır ve §C[EUU.GetFlag][EUU.GetName]§! bütçesinin ve ortak karar usulleriyle kabul edilen Birlik düzenlemelerinin imzalanması için imzası gerekir.\n\n§YMakamın Avantajları:§!\nBu makamı elinde tutmak, hiçbir üye üzerinde nüfuz harcamadan bir tasarıyı oylamaya sunmamızı sağlar.\n\nAvrupa Yanlısı ve Avrupa Şüpheciliği Kampanyalarının başarı oranını §G+%10§! artırır\n\n[!eu_parliament_president_back_click]\n"
 eu_parliament_president_unlocks_tt:0 "§YLizbon Antlaşması§!, §YAvrupa Parlamentosu Başkanlığı§! makamını tesis etti"
 EU_central_bank_president_tt:0 "§YAvrupa Merkez Bankası Başkanı§!, Avro'nun yönetiminden ve Avro Bölgesi'nde Avrupa Birliği'nin para politikasından sorumlu kurum olan Avrupa Merkez Bankası'na (AMB) başkanlık eder. AMB'nin icra kurulunun, Yönetim Konseyi'nin ve Genel Konseyi'nin başındadır ve bankayı yurt dışında temsil eder.\n\n§YMakamın Avantajları:§!\nBu makamı elinde tutmak, yüksek faiz oranına sahip üye devletlerin faiz oranlarını geçici olarak düşürmek için AMB'nin OMT Programı'nı başlatmamızı, genişletmemizi veya azaltmamızı sağlar.\n\n[!eu_central_bank_president_back_click]\n"
 EU_central_bank_idea_president_tt:0 "§CAvrupa Üye Devletlerindeki§! yatırımlarda $investment_cost_modifier$ ve $investment_duration_modifier$ değerini §G%15§! değiştirir\n"
 EU_ministry_of_economy_and_finance_tt:0 "§YAvrupa Ekonomi ve Maliye Bakanı§!, Avrupa Ekonomik Hükûmeti'nin başındadır ve mali birliğin kendisine verdiği yetkilere sahiptir. Bakan; vergi otoritesinin, üye devletler için asgari ücretin ve diğer ekonomik ve mali kararların denetiminden sorumludur.\n\n§YMakamın Avantajları:§!\n\nBu makamı elinde tutmak, makam sahibinin tüm nüfuz şartlarını atlayarak her zaman bir bütçe taslağını Avrupa Parlamentosu gündemine taşımasını sağlar.\n\n[!eu_minister_economy_finance_back_click]\n"
 EU_ministry_of_economy_and_finance_idea_tt:0 "§CAvrupa Üye Devletlerindeki§! yatırımlarda $investment_cost_modifier$ ve $investment_duration_modifier$ değerini §G%5§! değiştirir\n"
 EU_ministry_of_economy_and_finance_unlocks_tt:0 "§YAvrupa Ekonomi ve Maliye Bakanı§! Makamı Kuruldu"
 EU_frontex_director_tt:0 "§YFrontex İcra Direktörü§!, Avrupa Sınır ve Sahil Güvenlik Ajansı'na (halk arasında Frontex) başkanlık eder. Frontex'in amacı, Avrupa Birliği üye devletlerine Avrupa dış sınırlarını koruma çabalarında sahada destek olmaktır. Ayrıca özgürlük, güvenlik ve adalet alanına yardımcı olmak üzere Schengen bölgesinde sınır kontrolü uygular.\n\n§YMakamın Avantajları:§!\n\nBu makamı elinde tutmak, makam sahibinin görev süresi boyunca Frontex kuvvetlerinin kontrolünü geçici olarak ele almasını sağlar.\n\n[!eu_frontex_director_back_click]\n"
 EU_frontex_director_unlocks_tt:0 "§YAvrupa Sınır ve Sahil Güvenlik Ajansı§!, §YFrontex Direktörlüğü§! makamını tesis etti"
 EU_sec_general_euro_army_tt:0 "§YAvro-Ordu Genel Sekreteri§!, Avrupa Birliği'nin Avro-Ordu'sunun başıdır. Avrupa Birliği üye devletlerinin birleşik ve ortak silahlı kuvvetleri olan Avro-Ordu'nun koordinasyonundan sorumludur.\n\n§YMakamın Avantajları:§!\n\nBu makamı elinde tutmak, makam sahibinin görev süresi boyunca Avro-Ordu kuvvetlerinin kontrolünü geçici olarak ele almasını sağlar.\n[!eu_sec_general_euro_army_back_click]\n"
 EU_sec_general_euro_army_unlocks_tt:0 "§YAvro-Ordu§!, §YAvro-Ordu Genel Sekreterliği§! makamını tesis etti"
 EU_sec_general_euro_navy_tt:0 "§YAvro-Donanma Genel Sekreteri§!, Avrupa Birliği'nin Avro-Donanması'nın başıdır. Avrupa Birliği'nin birleşik ve ortak deniz gücü olan Avro-Donanma'nın koordinasyonundan sorumludur.\n\n§YMakamın Avantajları:§!\n\nBu makamı elinde tutmak, üye devletlerin donanmalarının kontrolünü ele almayı ve bunları tek bir Avrupa Filosu altında birleştirmeyi sağlar.\n[!eu_sec_general_euro_navy_back_click]\n"
 EU_sec_general_euro_navy_unlocks_tt:0 "§YAvro-Donanma§!, §YAvro-Donanma Genel Sekreterliği§! makamını tesis etti"
 EU_ambassador_to_un_tt:0 "§YBirliğin Birleşmiş Milletler Büyükelçisi§!, Avrupa Birliği'ni Birleşmiş Milletler'de temsil eder ve tüm Avrupa Birliği üye devletlerinin diplomatik misyonlarıyla koordinasyon içinde çalışır.\n\n§YMakamın Avantajları:§!\nBu makamı elinde tutmak, sahibi olan ülkeye BMGK Daimi Üyesi ulusal ruhunu kazandırır.\n\n[!eu_ambassador_to_un_back_click]\n"
 EU_ambassador_to_un_unlocks_tt:0 "§YBMGK Daimi Üyeliği§!, §YBirliğin Birleşmiş Milletler Büyükelçiliği§! makamını tesis etti"
 EU_president_of_the_eurofederation_tt:0 "§YAvrupa Federasyonu Başkanı§!, Avrupa Federasyonu'nun usulüne uygun seçilmiş lideridir. Avrupa Federasyonu, Avrupa Birliği'nin nihai federalleşme seçeneklerinden biridir ve bu nedenle çok güçlü bir makamdır.\n\n§YMakamın Avantajları:§!\n\n[!eu_pres_federation_back_click]\n"
