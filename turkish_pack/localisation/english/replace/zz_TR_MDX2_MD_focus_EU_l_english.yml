 EU_budget_mff_draft_desc:0 "Çok Yıllı Mali Çerçeveyi hazırlayan üye devlet, müzakerelerin sonunda taslağı Avrupa Parlamentosu gündemine taşımak zorundadır. Ödül olarak, hazırlayan üye devlet, Çok Yıllı Mali Çerçeve onaylanıp yürürlüğe girdiğinde yatırılan toplam siyasi gücü kazanır."
 EU_mff_draft_mission:0 "Çok Yıllı Mali Çerçeve Müzakereleri"
 EU_mff_draft_mission_desc:0 "Müzakereler sırasında tüm üye devletler, taslağı kendi anlayışlarına göre değiştirmek için siyasi güç yatırabilir. Taslakta yapılan değişiklikler, Avrupa Parlamentosu'ndaki siyasi grupların taslağa bakışını etkiler."
