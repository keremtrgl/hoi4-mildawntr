 EU_exit_category:0 "Avrupa Birliği'nden Çekilme"
 EU_exit_category_desc:0 "Birlik genelinde artan Avrupa şüpheciliğiyle birlikte bazı üye devletler §C[EUU.GetFlag] Avrupa Birliği§!'nden ayrılmayı düşünecek."
 Article_50:0 "[THIS.GetName] 50. Madde'yi işletti"
 EU_Article_50:0 "Avrupa Birliği'nden Ayrıl! (50. Madde)"
 EU_Article_50_desc:0 "«Her Üye Devlet, kendi anayasal gerekliliklerine uygun olarak Birlik'ten çekilmeye karar verebilir.»\n- Avrupa Birliği Antlaşması, 50(1). Madde.\n\n 50. Madde ilk olarak Avrupa Birliği Anayasa Antlaşması için kaleme alındı. Avrupa Anayasası'nın onay sürecinin başarısızlığa uğramasının ardından hüküm Lizbon Antlaşması'na dahil edildi."
 EU_Revoke_Article_50:0 "50. Madde'yi Geri Çek"
 EU_Revoke_Article_50_desc:0 "50. Madde'yi geri çek ve §C[EUU.GetFlag] Avrupa Birliği§!'nde kal\n«AAB'nin 50. Maddesi şu şekilde yorumlanmalıdır: Bir Üye Devlet, bu madde uyarınca Avrupa Konseyi'ne Avrupa Birliği'nden çekilme niyetini bildirmişse, bu madde söz konusu Üye Devlet ile Avrupa Birliği arasında akdedilen bir çekilme anlaşması yürürlüğe girmediği sürece veya böyle bir anlaşma akdedilmemişse AAB'nin 50(3). maddesinde öngörülen ve o fıkra uyarınca uzatılmış olabilecek iki yıllık süre dolmadığı sürece, ilgili Üye Devletin anayasal gerekliliklerine uygun olarak geri çekme kararını almasının ardından Avrupa Konseyi'ne yazılı bir bildirimle, açık ve koşulsuz biçimde bu bildirimi tek taraflı olarak geri çekmesine izin verir. Bu geri çekmenin amacı, ilgili Üye Devletin AB üyeliğini Üye Devlet statüsü bakımından değişmemiş koşullarla teyit etmektir ve bu geri çekme, çekilme sürecine son verir.»\n- Avrupa Birliği Adalet Divanı'nın C-621/18 sayılı davadaki kararı"
 EU_exit:0 "AB'den Ayrılma"
 EU_exit_desc:0 "§Y[ROOT.GetNameWithFlag]§!, Avrupa Konseyi'ne §C[EUU.GetFlag] Avrupa Birliği§!'nden ayrılma niyetini bildirdi. §Y[ROOT.GetNameWithFlag]§!, bildirimden iki yıl sonra Birlik'ten ayrılacak."
 EU_extend_Article_50:0 "50. Madde'nin Uzatılması"
 EU_extend_Article_50_desc:0 "§C[EUU.GetFlag] Avrupa Birliği§!'nden 50. Madde'nin uzatılmasını iste ve Birlik'ten daha ileri bir tarihte ayrıl."
 EU_exit_three_month:0 "Üç aylık uzatma"
 EU_exit_three_month_desc:0 "§Y[ROOT.GetNameWithFlag]§! için §C[EUU.GetFlag] Avrupa Birliği§! tarafından 50. Madde'de üç aylık uzatma tanındı. §Y[ROOT.GetNameWithFlag]§!, üç aylık sürenin ardından Birlik'ten ayrılacak."
 EU_withdrawal_treaty:0 "Çekilme Antlaşması"
 EU_withdrawal_treaty_desc:0 "§Y[ROOT.GetNameWithFlag]§! ile §C[EUU.GetFlag] Avrupa Birliği§! üye devletleri bir Çekilme Anlaşması üzerinde uzlaştı."
 EU_prepared_no_deal_exit:0 "Anlaşmasız Ayrılışa Hazırlan"
 EU_prepared_no_deal_exit_desc:0 "§C[EUU.GetFlag] Avrupa Birliği§! ile omurgasız uşakları ve Brüksel'deki şişirilmiş bürokratlar bize lehte bir çekilme anlaşması vermeyi reddediyor. Bir şey değişmedikçe ülkemizi kaçınılmaz Anlaşmasız Ayrılışa hazırlamalıyız."
