 EU_voting_category:0 "Avrupa Birliği"
 EU_voting_category_desc:0 "[ROOT.GetFlag] Avrupa Yanlılığı: [?ROOT.europeanism|%G1]\n[EUU.GetFlag] Avrupa Yanlılığı: [?global.var_europeanism|%G1]\n\nAvrupa yanlılığı (Avrupacılık veya Avrupa Birliği yanlılığı olarak da bilinir), Avrupa entegrasyonundan ve Avrupa Birliği (AB) üyeliğinden yana olan, gayriresmî olarak Avrupa Birleşik Devletleri adı verilen tek bir üst devleti arayan daha radikal Avrupa federalistlerini de kapsayan siyasi bir tutumdur. İlgili bir terim 'Avrupa sever'dir. Bir ülke için bu oran, üyelik referandumunda AB'de kalmaya oy verecek nüfusun payını tahmin eder. Birliğin bütünü için ise tüm üye devletlerdeki Avrupa severlerin payını tahmin eder.\n\n[ROOT.GetFlag] Avrupa Birliği değerlerinin ihlali: [?ROOT.breach_of_EU_value|g0]\n«Birlik; insan onuruna, özgürlüğe, demokrasiye, eşitliğe, hukukun üstünlüğüne ve azınlıklara mensup kişilerin hakları dahil insan haklarına saygı değerleri üzerine kurulmuştur. Bu değerler, çoğulculuğun, ayrımcılık yapmamanın, hoşgörünün, adaletin, dayanışmanın ve kadın ile erkek arasında eşitliğin hâkim olduğu bir toplumda Üye Devletler için ortaktır.»\n- Avrupa Birliği Antlaşması, Madde 2\n\n"
