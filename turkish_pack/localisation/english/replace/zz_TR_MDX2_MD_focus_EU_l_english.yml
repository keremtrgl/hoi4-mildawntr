 eu_voting_minor_popup_tt:0 "Bu bildirimleri artık almak istemiyorsanız, kararlar menüsünde küçük açılır pencereleri devre dışı bırakabilirsiniz. NOT: Bu, diğer olayları da gizler; ancak oylamalara veya konseyin ya da parlamentonun oturuma hazır olmasına ilişkin Avrupa Birliği pencerelerini özellikle gizlemez."
 EUvote.1.t:0 "AB Parlamentosu Oylamasi Basladi"
 EUvote.1.d:0 "AB Parlamentosu bir önlemi oylamaya getirdi! Önlemi incelemeye veya geçirmeye yardımcı olmak için AB'nin Parlamento bölümüne bakın."
 EUvote.1.a:0 "Sandık Başına!"
 EUvote.2.t:0 "AB Konseyi Oylamasi Basladi"
 EUvote.2.d:0 "AB Konseyi yeni bir yasa için oylamaya başladı! Oyunuzu kullanmak ve diğer ülkeleri etkilemek için Avrupa Oylaması bölümüne göz atın!"
 EUvote.2.a:0 "Sandık Başına!"
 EUvote.3.t:0 "AB Parlamentosu Oturuma Hazir"
 EUvote.3.d:0 "Avrupa Parlamentosu oturuma hazır. Avrupa Parlamentosu'na bir öneri sunmayı seçebilirsiniz; aksi halde yapay zekâ iki hafta içinde oturuma bir tasarı getirecek."
 EUvote.3.a:0 "Sandık Başına!"
 EUvote.4.t:0 "AB Konseyi Oylamasi Oturuma Hazir"
 EUvote.4.d:0 "Avrupa Konseyi oturuma hazır. Avrupa Konseyi'ne bir öneri sunmayı seçebilirsiniz; aksi halde yapay zekâ iki hafta içinde oturuma bir tasarı getirecek."
 EUvote.4.a:0 "Sandık Başına!"
 EUvote.5.t:0 "AB Konseyi Avrupa Birlesik Devletleri Için Oylama Yapiyor"
 EUvote.5.d:0 "Avrupa Konseyi, §YAvrupa Birleşik Devletleri§!'nin kurulması için oylamayı başlattı. Oylama kapanırsa Konsey'de karşı oy kullanmamış tüm üye devletler §Rtek bir Avrupa devletinde birleştirilecek§!. Karşı oy vermek ülkemizin egemenliğini korur, ancak §RAB üyeliğimize son verir§!. Çekimser kalmak birleşmeye onay sayılır. Oy, kapanmasına 14 gün kalana dek Avrupa Oylaması bölümünden değiştirilebilir."
 EUvote.5.d_president:0 "Avrupa Konseyi, §YAvrupa Birleşik Devletleri§!'nin kurulması için oylamayı başlattı. Komisyon Başkanlığı'nı elinde tutan ülke olarak ülkemiz §Gyeni devleti yönetecek§! ve Konsey'de karşı oy kullanmamış tüm üyeleri bünyesine katacak. Karşı oy veren üyeler bunun yerine Avrupa Birliği'nden ayrılır. Oylama 14 gün içinde kapanacak."
 EUvote.5.a:0 "Dağıtılmayacağız"
 EUvote.5.b:0 "Karar Konsey'e kalsın"
 EUvote.5.c:0 "Avrupa, liderliğimiz altında birleşecek"
 EUvote_5_reject_tt:0 "Oyumuz Avrupa Birleşik Devletleri'ne §Rkarşı§! olarak kaydedildi. Devlet kurulursa ilhak edilmek yerine Avrupa Birliği'nden ayrılacağız."
 EUvote_5_abstain_tt:0 "Oy kullanılmadı. Oylama kapanmadan önce Avrupa Oylaması bölümünde karşı oy verilmezse ülkemiz Avrupa Birleşik Devletleri'ne §Rilhak edilecek§!.\n§RÜlkemiz ortadan kalkacak ve oyun bizim için sona erecek.§!"
 EUvote_5_president_tt:0 "Oylama kapandığında karşı oy vermemiş tüm üyeler, Avrupa Birleşik Devletleri olarak §Gülkemize ilhak edilir§!."
 EUvote.6.t:0 "AB Parlamentosu Avrupa Birlesik Devletleri'ni Görüsüyor"
 EUvote.6.d:0 "Avrupa Parlamentosu'na §YAvrupa Birleşik Devletleri§!'nin kurulmasını öngören bir önerge sunuldu. Avrupa Parlamentosu üyelerinin çoğunluğu desteklerse mesele Avrupa Konseyi'ne gidecek ve karşı oy vermeyen tüm üye devletler §Rtek bir Avrupa devletinde birleştirilecek§!. Parti grupları Parlamento bölümünden ikna edilebilir. Konsey oylaması açıldığında yeniden uyarılacağız ve orada karşı oy verebileceğiz."
 EUvote.6.a:0 "Tartışmayı yakından izle"
 EUvote_6_tt:0 "Önerge Konsey'e ulaşırsa ülkemiz egemen kalmak için orada §Rkarşı oy vermelidir§!; bunun bedeli Avrupa Birliği'nden ayrılmaktır."
