 tooltip_EU_Revoke_Article_50_available:0 "§Y[ROOT.GetNameWithFlag]§! için §YAB'den Ayrılma§! Görevi VEYA §YÜç aylık uzatma§! Görevi etkin."
 tooltip_EU_Revoke_Article_50_effect:0 "§Y[ROOT.GetNameWithFlag]§!, §Y[EUU.GetFlag] Avrupa Birliği§!'nde kalıyor. §YAB'den Ayrılma§! Görevi VE §YÜç aylık uzatma§! Görevi kaldırılır.\nÖnümüzdeki §Y180 gün§! boyunca §Y50. Madde§!'yi işletemezsiniz."
