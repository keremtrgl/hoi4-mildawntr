 tooltip_EU_remove_laws_and_offices:0 "Tüm §YAB yasalarını ve makamlarını§! kaldır.\n"
 EU_defense_category:0 "AB'nin Savunma Politikaları"
 EU_defense_category_desc:0 "1950'lerde Avrupa Savunma Topluluğu fikri, Fransız Parlamentosu'nda onay alamayınca çöktü. Onun halefi Avrupa Birliği'nin Ortak Güvenlik ve Savunma Politikası oldu. Avrupa ülkelerinin çoğu Kuzey Atlantik Antlaşması Örgütü'nün (NATO) üyesi olduğundan 20. yüzyıl boyunca kendi Avrupa Savunma Örgütü'ne ihtiyaç duyulmadı. Ancak 21. yüzyılda artan dünya gerilimiyle birlikte bu durum değişiyor."
 EU_Frontex_take_control:0 "Frontex Kuvvetlerinin Denetimini Al"
 EU_Frontex_take_control_desc:0 "Avrupa'nın dış sınırları, son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa tanık oldu. Dış sınırı olan ülkeler sınır denetiminden tek başına sorumludur. Ancak Frontex, ağır göç baskısıyla karşı karşıya olan AB ülkelerine ek teknik destek sağlayabilir.\n Bunu, ek teknik teçhizatın (ör. uçak ve tekne) ve özel eğitimli sınır personelinin konuşlandırılmasını koordine ederek yapar."
 EU_EuroNavy_take_control:0 "Avro Donanması'nın Denetimini Al"
 EU_EuroNavy_take_control_desc:0 "21. yüzyılda çok uluslu filolar ve görev grupları giderek yaygınlaşıp önem kazandığından §C[EUU.GetFlag] Avrupa Birliği§! üye devletleri güçlerini birleştirmeye ve savaş gemilerini §YAvro Donanması§! adlı birleşik bir Avrupa Deniz Komutanlığı'na devretmeye karar verdi."
 EU_EuroArmy_take_control:0 "Avro Ordu'nun Denetimini Al"
 EU_EuroArmy_take_control_desc:0 "§C[EUU.GetFlag] Avrupa Birliği§! üye devletleri, §YAvro Ordu§! adlı ortak silahlı kuvvetler oluşturmaya karar verdi"
 EU_create_EDU:0 "Avrupa Savunma Birliği'ni (ASB) Kur"
 EU_create_EDU_desc:0 "Ortak çıkarlarını savunmak, dış çatışma ve krizlere yanıt vermek ve komşuluğumuzda güvenlik sağlamak için gerekli stratejik özerkliğe kavuşmak amacıyla üye devletler, askeri ittifak olarak §YAvrupa Savunma Birliği'ni (ASB)§! kurmaya ve topluca §YNATO§!'dan ayrılmaya karar verdi."
