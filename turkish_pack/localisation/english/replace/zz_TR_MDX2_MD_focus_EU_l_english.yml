 tooltip_ECB_adjust_OMT_limit_effect:0 "§GSol Tıkla:§! §YOMT Boyut Sınırı§!: §G+$200§! milyar ekle.\n§Yfaiz oranı§! §R%4,0§!'ın altındaki tüm üye devletler: §R-%5§! Avrupacılık ekle.\n§Yfaiz oranı§! §R%4,0§!'ın üzerindeki tüm üye devletler: §G+%5§! Avrupacılık ekle.\n\n§GSağ Tıkla:§! §YOMT Boyut Sınırı§!: §R-$200§! milyar ekle.\n§Yfaiz oranı§! §R%4,0§!'ın altındaki tüm üye devletler: §G+%5§! Avrupacılık ekle.\n§Yfaiz oranı§! §R%4,0§!'ın üzerindeki tüm üye devletler: §R-%5§! Avrupacılık ekle.\n"
