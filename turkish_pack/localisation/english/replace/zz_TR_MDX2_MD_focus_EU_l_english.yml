 eu_gui_tooltip:0 "§C[EUU.GetFlag][EUU.GetName]§! Arayüzü"
 eu_gui_tooltip_delayed:0 "§C[EUU.GetFlag][EUU.GetName]§! hakkındaki tüm bilgileri içeren ekranı açar: Avrupa Parlamentosu, Avrupa Birliği makam sahipleri, Avrupa Birliği Konseyi ve Avrupa bütçesi."
 fiscal_button_title:0 "Merkez Bankası"
 fiscal_button_desc:0 "§C[EUU.GetFlag][EUU.GetName]§! bütçesi. Bu ekran, Çok Yıllı Mali Çerçeve ve gelecek mali yılın bütçesiyle ilgili her şeyi yönetir."
 euro_voting_button_title:0 "Konsey"
 euro_voting_button_desc:0 "Avrupa Birliği Konseyi, Millennium Dawn'da §C[EUU.GetFlag][EUU.GetName]§! yapısının ikinci yasama organıdır. Avrupa Birliği Konseyi, yasama sürecinde üye devletleri temsil eder. Bu ekranda şu ana kadar kabul edilen tüm yasalar, hazırlanan yasa taslakları ve §C[EUU.GetFlag][EUU.GetName]§! yapısının oy hakkı olan üyelerinin listesi yer alır.\n\nAvrupa Birliği Konseyi, genellikle çifte çoğunluk olarak bilinen Nitelikli Çoğunluk Oylaması (QMV) ile çalışır. Bunun için §CÜye Devletlerin§! %55'inin ve Avrupa Birliği nüfusunun %65'ini temsil eden §CÜye Devletlerin§! onayı gerekir."
 parliament_button_title:0 "Parlamento"
 parliament_button_desc:0 "Avrupa Parlamentosu, Millennium Dawn'da §C[EUU.GetFlag][EUU.GetName]§! yapısının ilk yasama organıdır. Avrupa Parlamentosu, yasaların Avrupa Birliği'nin yasal düzenlemeleri hâline gelmek üzere oylamaya sunulabildiği ilk yerdir.\n\nOyuncunun, Avrupa Parlamentosu Üyelerinin (AP üyeleri) çoğunluk desteğini toplayarak görevi (bkz. kararlar) tamamlaması için 14 günü olacaktır. Yasa kabul edildiğinde Avrupa Birliği Konseyi'ne gönderilir."
 EU_europeanism_screen_title:0 "Avro-Bilgi"
 EU_europeanism_screen_desc:0 "Avro-Bilgi sekmesi; üye devletler, nüfusları, nüfus oranları ve Avrupa Birliği'nin Avrupa yanlılığı değerleri gibi Avrupa Birliği hakkındaki bilgileri içerir."
 EU_offices_screen_title:0 "Makamlar"
 EU_offices_screen_desc:0 "§C[EUU.GetFlag][EUU.GetName]§! makamları. §C[EUU.GetFlag][EUU.GetName]§! makamları, bir Avrupa Birliği üye devletinin elinde tutabileceği görevler bütünüdür."
