 EU_council_determine_serious_breach_of_EU_values:0 "AB Değerlerinin Ciddi İhlalini Tespit Et"
 EU_council_determine_serious_breach_of_EU_values_desc:0 "AAB'nin 7. Maddesi 2. fıkrası uyarınca Konsey, bir Üye Devletin Avrupa Birliği değerlerini ciddi ve sürekli biçimde ihlal ettiğini tespit edebilir. Bu, AB Oy Haklarının Askıya Alınması için bir ön koşuldur."
 number_of_eu_breaches_greater_than_three:0 "[THIS.GetAdjective] §YAB Değerlerinin İhlal Düzeyi§! 3'ten §RBüyük§! (Mevcut: [?THIS.breach_of_EU_value|0])"
 number_of_eu_breaches_greater_than_four:0 "[THIS.GetAdjective] §YAB Değerlerinin İhlal Düzeyi§! 4'ten §RBüyük§! (Mevcut: [?THIS.breach_of_EU_value|0])"
 can_determine_a_breach_of_values_ROOT:0 "[ROOT.GetNameWithFlag], diğer tüm (oy hakkı olan) üye devletlerde en etkili ilk 3 ülkeden biri olmalı."
 can_determine_a_breach_of_values_FROM:0 "[FROM.GetNameWithFlag], diğer tüm (oy hakkı olan) üye devletlerde en etkili ilk 3 ülkeden biri OLMAMALI."
 EU_council_revoke_determination_of_serious_breach_of_EU_values:0 "Tespiti Geri Çek"
 EU_council_revoke_determination_of_serious_breach_of_EU_values_desc:0 "İlgili Üye Devlet Avrupa Birliği değerlerinin ciddi ve sürekli ihlaline son verdiği için AAB'nin 7. Maddesi 2. fıkrasında belirtilen tespiti geri çek."
 EU_council_suspend_voting_rights:0 "AB Oy Haklarını Askıya Al"
 EU_council_suspend_voting_rights_desc:0 "AAB'nin 7. Maddesi 3. fıkrası uyarınca Konsey, Antlaşmaların ilgili Üye Devlete uygulanmasından doğan bazı hakların, o Üye Devlet hükümeti temsilcisinin Konsey'deki oy hakları da dahil olmak üzere, askıya alınmasına karar verebilir."
 EU_council_revoke_voting_rights_suspension:0 "AB Oy Haklarının Askıya Alınmasını Geri Çek"
 EU_council_revoke_voting_rights_suspension_desc:0 "AAB'nin 7. Maddesi 4. fıkrası uyarınca Konsey, 3. fıkra uyarınca alınan tedbirlerin uygulanmasına yol açan durumdaki değişikliklere bağlı olarak bu tedbirleri sonradan kaldırmaya karar verebilir."
 EU_council_suspend_subsidies:0 "AB Sübvansiyonlarını Askıya Al"
 EU_council_suspend_subsidies_desc:0 "AAB'nin 7. Maddesi 3. fıkrası uyarınca Konsey, Antlaşmaların ilgili Üye Devlete uygulanmasından doğan bazı hakların askıya alınmasına karar verebilir."
 EU_council_revoke_subsidies_suspension:0 "AB Sübvansiyonlarının Askıya Alınmasını Geri Çek"
 EU_council_revoke_subsidies_suspension_desc:0 "AAB'nin 7. Maddesi 4. fıkrası uyarınca Konsey, 3. fıkra uyarınca alınan tedbirlerin uygulanmasına yol açan durumdaki değişikliklere bağlı olarak bu tedbirleri sonradan kaldırmaya karar verebilir."
