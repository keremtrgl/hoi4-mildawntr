 focus__EP_agenda:0 "§C[EUU.GetFlag]Avrupa Parlamentosu§! şu anda herhangi bir gündemi ele almıyor.\n"
 EU_show_available_desc_101_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\n«Avrupa halkları, aralarında giderek daha yakın bir birlik kurarak, ortak değerlere dayalı barışçıl bir geleceği paylaşmaya kararlıdır. Manevi ve ahlaki mirasının bilincinde olan Birlik; insan onuru, özgürlük, eşitlik ve dayanışma gibi bölünmez, evrensel değerler üzerine kurulmuştur; demokrasi ve hukukun üstünlüğü ilkelerine dayanır.» - Şart'ın Başlangıç Bölümü -\n§YAvrupa Birliği Temel Haklar Şartı§!, Avrupa Birliği vatandaşlarının ve sakinlerinin siyasi, sosyal ve ekonomik haklarını Avrupa Hukuku'na dahil eder. Şart, Avrupa Birliği'nin özgürlük, güvenlik ve adalet alanı (AFSJ) politika alanının bir parçasını oluşturur. Avrupa Birliği ve Euratom'un tüm sınırlarında geçerlidir ve bu kurumlar, hükümlerine uygun hareket etmek ve yasa yapmak zorundadır."
 EU_show_available_desc_102_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\nLaeken Bildirgesi'nin ardından Avrupa Konseyi, vatandaşlar için daha sade, temel hedeflerini izlemede daha güçlü ve dünyada daha belirgin biçimde var olan bir Birliğe doğru belirleyici bir adım atmak amacıyla Birliğin geleceği üzerine bir Konvansiyon toplamaya karar verdi."
 EU_show_available_desc_103_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\nAvrupa Konvansiyonu, Avrupa için bir Anayasa oluşturan Antlaşma Taslağı ile sona erdi. Bu uluslararası antlaşma, mevcut Avrupa antlaşmalarının yerini alarak §C[EUU.GetFlag] Avrupa Birliği§! için birleştirilmiş bir anayasa oluşturacak ve Nitelikli Çoğunluk Oylamasını, daha önce üye devletler arasında oybirliğiyle karara bağlanan politika alanlarına da genişletecekti."
 EU_show_available_desc_104_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\nLizbon Antlaşması'na giden süreç, Avrupa Anayasası'nın onaylanma sürecinin olumsuz sonuçlanmasının bir ürünüdür. Lizbon Antlaşması, Avrupa Birliği Antlaşması'nı ve Avrupa Topluluğu'nu Kuran Antlaşma'yı değiştirir. İkincisinin adı Avrupa Birliği'nin İşleyişi Hakkında Antlaşma olarak değiştirilir."
 EU_show_available_desc_105_loc_key:0 "§9Bu önerilen yasa bir Makam AB Yasasıdır.§!\n\nAvrupa Dış Eylem Servisi, Avrupa Birliği'nin diplomatik servisidir. AB'nin dış ilişkiler sorumlusu olan Dış İlişkiler ve Güvenlik Politikası Yüksek Temsilcisi'nin Birliğin Ortak Dış ve Güvenlik Politikası'nı yürütmesine yardımcı olur."
 EU_show_available_desc_201_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nAvrupa Merkez Bankası para politikası kararlarını uygulamaya koymaya karar verdi ve Avrupa Merkez Bankası Yönetim Konseyi yeni bir para politikası araçları ve usulleri dizisi kabul etti. Avro sisteminin para politikası ve araçlarına ilişkin genel belgeler, AMB'nin bu araçlardan nasıl ve ne ölçüde yararlanabileceğini ortaya koydu. Bu yöntemlerden biri, AMB'nin belirlediği hedeflere ulaşmaya yardımcı olacak AMB Sıfır Faiz Oranı Politikası'dır."
 EU_show_available_desc_202_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nSon finansal krize yanıt olarak, tek pazar için daha güvenli bir finans sektörü sağlamak üzere Avrupa Bankacılık Birliği kuruldu. Bu girişimler, AB üyesi devletlerdeki tüm finansal aktörler için tek bir kurallar bütünü oluşturur. Bankalar için daha güçlü ihtiyatlılık gereklilikleri, mevduat sahipleri için gelişmiş koruma ve batan bankaların yönetimine ilişkin kuralları içerir."
 EU_show_available_desc_203_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nAvro Tahvilleri, kamu borcunu finanse etmek için yeni bir seçenektir. Avro bölgesi üyelerinin ortak tahvil ihracı, parasal birliğin önemli ölçüde derinleşmesi anlamına gelir. Tasarruf sahiplerine ve finans kuruluşlarına güvenli ve likit yatırım fırsatları sunarak ve ABD tahvil piyasasına denk bir Avro Tahvili piyasası kurarak hükûmetlere borçlarını finanse etmeleri için yeni yollar sağlar."
 EU_show_available_desc_204_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nEFSF, avro bölgesi üyesi devletlerce Avrupa borç krizinde geçici bir kriz çözüm mekanizması olarak kuruldu ve birkaç üye devlete mali yardım sağladı. Bu yardım, EFSF'nin sermaye piyasalarında EFSF tahvilleri ve diğer borç araçları ihraç etmesiyle finanse edildi. Bu görev artık yalnızca ESM tarafından yürütüldüğünden EFSF ek mali yardım sağlamaz."
 EU_show_available_desc_205_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nESM'nin görevi, ciddi finansman sorunları yaşayan veya bu sorunlarla tehdit edilen avro bölgesi ülkelerine mali yardım sağlamaktır. Bu yardım, yalnızca avro bölgesinin bütününün ve ESM Üyelerinin mali istikrarını korumak için gerekli olduğu kanıtlanırsa verilir."
 EU_show_available_desc_206_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nMali birlik, üye devletlerin aynı ortak bütçeyi paylaşmasını içerir. Harcama ve vergi düzeylerinin merkezi bir mali otorite tarafından belirleneceği anlamına gelir. Mali birlik, Avrupa entegrasyonunda daha ileri bir adım olarak önerilir. Merkezi bir Avrupa otoritesinin tüm üye devletler için harcama ve vergi oranlarını belirlemesi anlamına gelir."
 EU_show_available_desc_207_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nBir Avrupa Ekonomik Hükûmeti, AB'de ortak bir mali politikayı ve etkin bir ekonomi politikasını mümkün kılar. §C[EUU.GetFlag] Avrupa Birliği§!'ne kendi vergi otoritesini verir ve merkezi bir otorite üye devletler için asgari ücretleri belirler."
 EU_show_available_desc_208_loc_key:0 "§GBu önerilen yasa bir Ekonomik AB Yasasıdır.§!\n\nBir Avrupa Ekonomi ve Maliye Bakanı, Mali Birlik ve Avrupa Ekonomik Hükûmeti tarafından oluşturulan politikaları ve yetkileri tek bir makamda birleştirir."
 EU_show_available_desc_301_loc_key:0 "§RBu önerilen yasa bir Askeri AB Yasasıdır.§!\n\nAvrupa Savunma Ajansı, üye devletlere ve §C[EUU.GetFlag] Avrupa Birliği§!'ne kriz yönetimi alanında Avrupa savunma yeteneklerini geliştirme çabalarında destek olmak ve Avrupa Güvenlik ve Savunma Politikası'nı şimdiki hâliyle ve gelecekte gelişeceği şekliyle sürdürmek amacıyla kuruldu."
 EU_show_available_desc_302_loc_key:0 "§RBu önerilen yasa bir Askeri AB Yasasıdır.§!\n\nDaimi Yapılandırılmış İş Birliği (PESCO), istekli ve muktedir üye devletlerin ortak yetenek projelerini birlikte planlamasına, geliştirmesine ve bunlara yatırım yapmasına, silahlı kuvvetlerinin operasyonel hazırlığını ve katkısını artırmasına olanak tanır. Amaç, tutarlı ve tam kapsamlı bir kuvvet paketini birlikte geliştirmek ve bu yetenekleri üye devletlerin ulusal ve çok uluslu görev ve operasyonları için kullanıma sunmaktır."
 EU_show_available_desc_303_loc_key:0 "§RBu önerilen yasa bir Askeri AB Yasasıdır.§!\n\nAvrupa Savunma Fonu, Avrupa'nın stratejik özerkliğine, vatandaşlarının korunmasına ve savunulmasına önemli bir katkı sağlayacaktır. Şirketler arasında ve AB ülkeleri arasında savunma iş birliğini teşvik ederek yeniliği destekleyecek ve en son teknolojiye sahip savunma teknolojileri ile ürünleri geliştirecektir. Fon, ulusal savunma yatırımlarını koordine edecek, tamamlayacak ve güçlendirecektir."
 EU_show_available_desc_304_loc_key:0 "§RBu önerilen yasa bir Askeri AB Yasasıdır.§!\n\nBir Avrupa Güvenlik Konseyi (ESC), AB'yi uluslararası siyaset konusunda karar almaya daha hazır hâle getirecektir. AB tutarlı kararları daha hızlı alıp uygulayamazsa, AB kurallarını uygulatma ve çok taraflı formatları güçlendirme yeteneği zayıflayacaktır. Bu nedenle AB'nin diplomatik, mali ve askeri kaynakları, daha etkili bir hükûmetler arası iş birliği formatıyla desteklenmelidir."
 EU_show_available_desc_305_loc_key:0 "§9Bu önerilen yasa bir Makam AB Yasasıdır.§!\n\n§C[EUU.GetFlag] Avrupa Birliği§!'nin askeri yeteneklerini güçlendirmek için üye devletler ortak silahlı kuvvetler oluşturabilir. Bu kuvvetler §YAvro-Ordu§! olarak anılacaktır"
 EU_show_available_desc_306_loc_key:0 "§9Bu önerilen yasa bir Makam AB Yasasıdır.§!\n\n21. yüzyılda çok uluslu filolar ve görev güçleri daha yaygın ve önemli hâle gelirken §C[EUU.GetFlag] Avrupa Birliği§! üye devletleri güçlerini birleştirebilir ve savaş gemilerini §YAvro-Donanma§! olarak bilinen birleşik bir Avrupa Deniz Komutanlığı'na devredebilir."
 EU_show_available_desc_307_loc_key:0 "§9Bu önerilen yasa bir Makam AB Yasasıdır.§!\n\nÜye devletler, AB'nin Birleşmiş Milletler Güvenlik Konseyi'nin (BMGK) daimi üyesi olması gerektiğine karar verdi. Bu, BMGK'nın reform edilmesi veya hâlihazırda BMGK üyesi olan üye devletlerin koltuk(lar)ının AB'ye devredilmesi yoluyla yapılır."
 EU_show_available_desc_308_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\nNükleer güç olmak, AB'nin siyasi gücünü ve Birliğin dünyadaki nüfuzunu güçlendirecektir. Birlik, nükleer silahları, üye devletlerinin nükleer silahlarını devralıp paylaşarak veya kendi nükleer savaş başlıklarını geliştirerek edinecektir."
 EU_show_available_desc_401_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\nAB Genel Veri Koruma Tüzüğü (GDPR); Avrupa genelinde veri gizliliği yasalarını uyumlaştırmak, tüm AB vatandaşlarının veri gizliliğini korumak ve güçlendirmek ve bölgedeki kuruluşların veri gizliliğine yaklaşımını yeniden şekillendirmek üzere tasarlanmıştır."
 EU_show_available_desc_402_loc_key:0 "§CBu önerilen yasa bir Genel AB Yasasıdır.§!\n\nDijital teknolojiler, yaratıcı içeriğin üretilme, dağıtılma ve erişilme biçimini kökten değiştirdi. Kültürel çeşitliliğine değer veren bir Avrupa'da, AB telif hakkı kurallarını yeni tüketici davranışlarına uyarlıyoruz."
 EU_show_available_desc_403_loc_key:0 "§pBu önerilen yasa bir Göç/Sınır Kontrolü AB Yasasıdır.§!\n\nDublin II Tüzüğü, bir sığınma başvurusunu incelemekten yalnızca bir üye devletin sorumlu olduğu ilkesini getirir. Amaç, sığınmacıların bir ülkeden diğerine gönderilmesini önlemek ve ayrıca bir kişinin birden fazla sığınma başvurusunda bulunmasıyla sistemin kötüye kullanılmasının önüne geçmektir."
 EU_show_available_desc_404_loc_key:0 "§pBu önerilen yasa bir Göç/Sınır Kontrolü AB Yasasıdır.§!\n\nBaşvurularının başarıyla sonuçlanma ihtimali yüksek olan sığınmacılar, vardıkları Yunanistan ve İtalya'dan, sığınma başvurularının işleme alınacağı diğer üye devletlere yeniden konumlandırılır. Bu başvurular başarılı olursa, başvuru sahiplerine yeniden konumlandırıldıkları üye devlette ikamet etme hakkıyla birlikte mülteci statüsü verilir."
 EU_show_available_desc_405_loc_key:0 "§pBu önerilen yasa bir Göç/Sınır Kontrolü AB Yasasıdır.§!\n\n§C[EUU.GetFlag] Avrupa Birliği§! ve [TUR.GetNameWithFlag], Türkiye'den Avrupa'ya düzensiz göç akışını durdurmayı amaçlayan bir anlaşma müzakere edecek. Türkiye'den Yunan adalarına gelen ve sığınma başvuruları kabul edilemez bulunan tüm yeni düzensiz göçmenler ve sığınmacılar Türkiye'ye geri gönderilmelidir. §C[EUU.GetFlag] Avrupa Birliği§!, Türkiye'deki Mülteciler için Mali Yardım Mekanizması'na 3 milyar avro ödeyecektir."
 EU_show_available_desc_406_loc_key:0 "§pBu önerilen yasa bir Göç/Sınır Kontrolü AB Yasasıdır.§!\n\nAB Komisyonu, sığınma prosedürü boyunca üye devletlere hızlı ve eksiksiz hizmet sunmak için gerekli yetki, araç ve mali kaynaklarla donatılmış gelecekteki bir AB Sığınma Ajansı önerdi."
 EU_show_available_desc_407_loc_key:0 "§pBu önerilen yasa bir Göç/Sınır Kontrolü AB Yasasıdır.§!\n\nFrontex, AB ülkelerinin ve Schengen'e bağlı ülkelerin dış sınırlarını yönetmesine yardımcı olur. Ayrıca AB genelinde sınır kontrollerinin uyumlaştırılmasına katkıda bulunur. Ajans, her AB ülkesindeki sınır otoriteleri arasında iş birliğini kolaylaştırır; teknik destek ve uzmanlık sağlar."
 EU_show_available_desc_408_loc_key:0 "§pBu önerilen yasa bir Göç/Sınır Kontrolü AB Yasasıdır.§!\n\nFrontex, Avrupa Sınır ve Sahil Güvenlik Ajansı hâline gelir. Avrupa'nın dış sınırları son yıllarda AB'ye girmek isteyen göçmen ve mülteci sayısında eşi görülmemiş bir artışa tanık oldu. Dış sınırı olan ülkeler, sınır kontrolünden tek başına sorumludur. Ancak Frontex, ağır göç baskısıyla karşılaşan AB ülkelerine ek teknik destek sağlayabilir."
 EU_show_available_desc_601_loc_key:0 "§OBu önerilen yasa bir Genişleme AB Yasasıdır.§!\n\n1 Mayıs 2004'te, toplam nüfusu yaklaşık 75 milyon olan on yeni ülke AB'ye katıldı. 25 üyeli AB'nin artık 450 milyon vatandaşı var ve üç eski Sovyet cumhuriyetini (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! ve §Y[LIT.GetNameWithFlag]§!), SSCB'nin dört eski uydusunu (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! ve §Y[SLO.GetNameWithFlag]§!), eski bir Yugoslav cumhuriyetini (§Y[SLV.GetNameWithFlag]§!) ve iki Akdeniz adasını (§Y[CYP.GetNameWithFlag]§! ve §Y[MLT.GetNameWithFlag]§!) içeriyor."
 EU_show_available_desc_602_loc_key:0 "§OBu önerilen yasa bir Genişleme AB Yasasıdır.§!\n\nDoğu Avrupa'dan iki ülke daha - §Y[BUL.GetNameWithFlag]§! ve §Y[ROM.GetNameWithFlag]§! - AB'ye katılarak üye devlet sayısını 27'ye çıkarıyor."
 EU_show_available_desc_603_loc_key:0 "§OBu önerilen yasa bir Genişleme AB Yasasıdır.§!\n\n2013'te §Y[CRO.GetNameWithFlag]§! AB'ye katıldı ve üye devlet sayısı 28'e yükseldi."
 EU_show_available_desc_605_loc_key:0 "§OBu önerilen yasa bir Genişleme AB Yasasıdır.§!\n\nBatı Balkan ülkeleri §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! ve §Y[KOS.GetNameWithFlag]§! §C[EUU.GetFlag] Avrupa Birliği§! üyeliği için aday olur. "
