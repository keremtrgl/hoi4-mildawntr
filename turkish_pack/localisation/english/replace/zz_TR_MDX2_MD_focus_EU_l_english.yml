 EUevent.4.t:0 "Avrupa Birlesik Devletleri"
 EUevent.4.d:0 "[FROM.GetNameWithFlag], §C[EUU.GetFlag] Avrupa Birliği§!'nin üye devletlerini §C[EUU.GetFlag] Avrupa Birleşik Devletleri§! adlı tek bir Avrupa Süper Devleti altında birleştiriyor. [ROOT.GetNameWithFlag] egemenliğinden vazgeçecek ve §C[EUU.GetFlag] Avrupa Birleşik Devletleri§!'ne katılacak."
 EUevent.4.a:0 "Neşeye Övgü!"
 EUevent.5.t:0 "Avrupa Borç Krizi"
 EUevent.5.d:0 "Avrupa Birliği Avro Bölgesi reformunu hayata geçirmekte başarısız oldu. Birlik içindeki ülkeler devlet borçlarını ödeyemiyor ya da yeniden finanse edemiyor, aşırı borçlanmış bankaları da kurtaramıyor. Üye devletler Avro Bölgesi'nin mali ve ekonomik sürdürülebilirliğini güvence altına almak için reformları hızla ilerletmeye çabalıyor. Kriz başladı ve Avro uçurumun kenarında."
 EUevent.5.a:0 "Avro Tehlikede!"
 EUevent.6.t:0 "Avro Bölgesi Reformlari"
 EUevent.6.d:0 "Mali Birlik'in hayata geçirilmesi, Avrupa Merkez Bankası'nın (AMB) yetkilerinin genişletilmesi ve ek istikrar mekanizmaları gibi bir dizi Avro Bölgesi reformuyla yaklaşan borç krizi önlendi. Avro Bölgesi kurtarıldı ve Avrupa Birliği artık krizin atlatıldığı güvencesiyle geleceğe bakabilir."
 EUevent.6.a:0 "Çeşitlilikte birlik."
 EUevent.7.t:0 "Avro Bölgesi Reformlari"
 EUevent.7.d:0 "ABD'deki Küresel Mali Kriz, Avrupa ülkeleri arasında zincirleme bir etki yarattı. Avrupa Parlamentosu üyelerinin çoğu, Avrupa Birliği'ndeki bir dizi ülkede biriken borca çözüm arıyor. Bu ülkeler Küresel Mali Kriz'in ardından devlet borçlarını ödemekte ya da yeniden finanse etmekte, ayrıca çöken bankalara acil fon sağlamakta başarısız oldu. Söz konusu tüm üye devletler borçlarını ödeyemediklerini bildirdi ve bütçe açıklarının sanıldığından çok daha kötü olduğunu açıkladı. Ülkelerin ortak noktası, krizin kök nedeninin, ülkelerdeki zorlanan kurumları kurtarmak için yapılan borç kurtarma operasyonlarıyla özel borcun kamu borcuna aktarılması olmasıdır. Avrupa Merkez Bankası (AMB) ve Uluslararası Para Fonu (IMF), çok daha kötü bir krizi önlemek için üye devletlerle yardım paketleri ve ulusal kurtarma programları üzerinde anlaşmalar hazırlamaya başladı. Tek net olan şey, Küresel Mali Kriz denen fırtınanın tam ortasında durduğumuz bu sırada Avrupa Birliği'nin yıkıcı bir krizin eşiğinde olduğudur. Güçlü kalmalıyız ve fırtınayı atlatıp Avrupa Birliği'nin sarsılmayacağını göstermek için Birlik Avro Bölgesi'ni reforma tabi tutmalıdır. Şimdi değil, yarın değil, asla. Çeşitlilikte birlik."
 EUevent.7.a:0 "Avro için!"
 EUevent.8.t:0 "Troyka Reformlari Tamamlandi!"
 EUevent.8.d:0 "[ROOT.GetNameWithFlag], Avrupa Komisyonu (AK), Avrupa Merkez Bankası (AMB) ve Uluslararası Para Fonu'ndan (IMF) oluşan sözde Troyka'nın talep ettiği reformları hayata geçirdi. Bu, [ROOT.GetNameWithFlag] halkı için kemer sıkma demek!"
 EUevent.8.a:0 "Toparlanacağız!"
 EUevent.9.t:0 "Kazara Ayrilis"
 EUevent.9.d:0 "[ROOT.GetNameWithFlag], Avrupa Komisyonu (AK), Avrupa Merkez Bankası (AMB) ve Uluslararası Para Fonu'ndan (IMF) oluşan sözde Troyka'nın talep ettiği reformları gerçekleştiremedi. Diğer üye devletler Kurtarma Yasağı Maddesi'ne başvuruyor; bu nedenle [ROOT.GetNameWithFlag], kendi yeni para birimini devalüe edip iflası önlemek için Avro Bölgesi'nden ve §C[EUU.GetFlag] Avrupa Birliği§!'nden ayrılmak zorunda."
 EUevent.9.a:0 "Zor günler bizi bekliyor"
 EUevent.10.t:0 "Donanmayi Avro Donanmasi'na Devret"
 EUevent.10.d:0 "21. yüzyılda çok uluslu filolar ve görev grupları giderek yaygınlaşıp önem kazandığından [EUU.GetFlag] Avrupa Birliği üye devletleri güçlerini birleştirmeye ve savaş gemilerini Avro Donanması adlı birleşik bir Avrupa Deniz Komutanlığı'na devretmeye karar verdi. \n\n[FROM.GetNameWithFlag] Avro Donanması Genel Sekreterliği makamını elinde tutuyor ve filomuzun Avro Donanması'na katılmasını talep ediyor."
 EUevent.10.a:0 "Avrupa, dalgalara hükmet!"
 EUevent.10.b:0 "Filomuzdan asla vazgeçmeyiz!"
 EUevent.18.t:0 "[FROM.GetNameWithFlag] bizden Askeri Tatbikat'a ev sahipligi yapmamizi istiyor"
 EUevent.18.d:0 "[FROM.GetNameWithFlag], sınırımızda bir Askeri Tatbikat'a ev sahipliği yapmamızı istiyor. Sınırımızdaki bir Askeri Tatbikat Dünya Gerilimi'ni artırabilir; bu yüzden tatbikata izin vermeden önce seçeneklerimizi dikkatle tartmamız önemli."
 EUevent.18.a:0 "Evet"
 EUevent.18.b:0 "Hayır"
 EUevent.20.t:0 "[FROM.GetNameWithFlag] Için Ek Katilim Öncesi Yardim"
 EUevent.20.d:0 "[FROM.GetNameWithFlag], AB üyelik kriterlerini karşılamak için gerekli reformları yapmakta başarısız oldu. Onlara ek mali ve teknik yardım sağlamalıyız."
 EUevent.20.a:0 "Evet"
 EUevent.20.b:0 "Hayır"
 EUevent.21.t:0 "Bir Makam Bosaldi"
 EUevent.21.d:0 "Bir makam, görevin sona ermesi ya da görev süresinin dolması nedeniyle boşaldı. Makam yapay zekâ tarafından önümüzdeki on dört gün boş bırakılacak, ardından yapay zekâ makamı doldurmaya çalışacak. Lütfen Avrupa Birliği Makamları ekranına bakın."
 EUevent.21.a:0 "İpucu için teşekkürler!"
 EUevent.22.t:0 "Avrupa'daki Göçmen Krizi"
 EUevent.22.d:0 "Afrika ve Orta Doğu'daki çeşitli savaşlar, Radikal Cihatçılığın yükselişi ve daha fazlası birçok insanı yurdundan kaçmak zorunda bıraktı. Savaşın yıprattığı bu ülkelerdeki huzursuzluk ve istikrarsızlık, onlarca yıldır görmediğimiz ölçekte bir yerinden edilmeye yol açtı. Binlerce göçmen sığınma ve mülteci statüsü talebiyle Avrupa Birliği'ne akın etmeye başladı. Birliğin çevresindeki ülkeler göçmen dalgasını durdurmak için sınır muhafızlarını ve polisi seferber ediyor, ancak Birlik'ten kalıcı önlemler almasını bekliyor. Bazı geçici çözümler arasında göçmenlerin bir kısmını barındırmak için Türkiye ile anlaşma yapmak yer alıyor; bazıları ise bu dalgayı yönetmek için Avrupa Sığınma Ajansı gibi daha kalıcı bir kurum oluşturmayı düşünüyor. Kesin olan tek şey, bu sorunun hızlı ve etkili biçimde çözülmesi gerektiğidir."
 EUevent.22.a:0 "Yeni Bir Kriz Başlıyor."
 EUelection.1.t:0 "[GetYear] Avrupa Parlamentosu Seçimi"
 EUelection.1.d:0 "Avrupa Parlamentosu seçimleri her beş yılda bir yapılır."
