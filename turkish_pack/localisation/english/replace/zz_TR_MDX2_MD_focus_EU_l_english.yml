 EU_apply_for_membership_category:0 "AB'ye Katılım"
 EU_apply_for_membership_category_desc:0 "AB üyesi olmak, bir gecede gerçekleşmeyen karmaşık bir süreçtir. Aday ülke üyelik koşullarını karşıladığında, tüm alanlarda AB kurallarını ve düzenlemelerini uygulamak zorundadır.\nÜyelik koşullarını karşılayan her ülke başvurabilir. Bu koşullar 'Kopenhag kriterleri' olarak bilinir ve serbest piyasa ekonomisini, istikrarlı bir demokrasiyi ve hukukun üstünlüğünü, avro dahil tüm AB mevzuatının kabulünü içerir."
 EU_apply_for_membership:0 "AB'ye Katılım"
 EU_apply_for_membership_desc:0 "§Y[ROOT.GetNameWithFlag]§!, §C[EUU.GetFlag] Avrupa Birliği§!'ne katılabilir; hep birlikte Neşeye Övgü'yü söyleyelim:\nNeşe, ilahi kıvılcım,\nElysium'un kızı,\nAteşle sarhoş girdik,\nGöksel olan, senin mabedine!\nBüyün yeniden birleştirir\nÂdetin sertçe ayırdığını;\nTüm insanlar kardeş olur,\nNazik kanadının gölgesinde."
 EU_join_the_euro_decision:0 "Avro'ya Katılım"
 EU_join_the_euro_decision_desc:0 "Avro'yu kabul etmek için AB ülkelerinin ulusal mevzuatlarını ilgili AB hukukuyla uyumlu hale getirmeleri ve ekonomik yakınsamayı sağlamak üzere tasarlanmış belirli koşulları karşılamaları gerekir. AB Üye Devletlerinin 1991'de Maastricht'te üzerinde uzlaştığı bu gereklilikler, yakınsama kriterleri olarak bilinir."
 EU_joined_the_eurozone:0 "Avro Bölgesi'ne Katıldı"
 USoE_integrate_new_members:0 "Yeni Üye Devletleri Bütünleştir"
 USoE_integrate_new_members_desc:0 "Ek ülkeler ilerlemeye ve Birlik'e katılmaya karar verdi. Bu yeni üye devletleri bütünleştirmenin ve Avrupa Birleşik Devletleri'ni bundan sonra daha da güçlü kılmanın zamanı geldi."
 instrument_for_pre_accession_assistance:0 "Katılım Öncesi Yardım Aracı (IPA)"
 instrument_for_pre_accession_assistance_desc:0 "Katılım Öncesi Yardım Aracı (IPA), AB'nin genişleme bölgesindeki reformları mali ve teknik yardımla desteklemesinin yoludur."
 instrument_for_pre_accession_assistance_tt:0 "AB adayları §YKatılım Öncesi Yardım Programları§! alır"
 pre_accession_assistance_program:0 "Katılım Öncesi Yardım Programı"
 pre_accession_assistance_program_desc:0 "§C[EUU.GetFlag][EUU.GetName]§!, üyelik adaylarının §C[EUU.GetFlag][EUU.GetName]§! katılım kriterlerini karşılayabilmesi için reformlarını destekliyor. Yardım öncelikle yolsuzluğun ortadan kaldırılmasına yardımcı olmayı ve ülkenin maliyesini düzene sokması için bir miktar ekonomik destek sağlamayı hedefliyor."
