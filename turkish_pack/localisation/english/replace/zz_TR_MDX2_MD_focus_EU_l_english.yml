 EU_Tech_Share_name:0 "Avrupa Savunma Ajansı (ASA)"
 EU_Tech_Share_desc:0 "Üye devletler araştırma çabalarını birleştiriyor. Avrupa Savunma Ajansı (ASA), Avrupa Birliği üye devletleri arasındaki çabaları koordine ediyor."
