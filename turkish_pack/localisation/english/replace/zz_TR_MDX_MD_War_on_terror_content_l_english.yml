 TT_AFGHANISTAN_NEW_ADMINISTRATION_KARZAI:0 "Popüler bir adayın yönettiği Batı yanlısı bir hükümet kur. §RBu, daha muhafazakâr halkı rahatsız edecek!§!\n"
 TT_AFGHANISTAN_NEW_ADMINISTRATION_RABBANI:0 "Muhafazakâr bir adayın yönettiği bağlantısız bir hükümet kur.\n"
 TT_AFGHANISTAN_NEW_ADMINISTRATION_MASSOUD:0 "Bir savaş kahramanının yönettiği bağlantısız bir hükümet kur. §GBu, Afganistan'a istikrar getirecek!§!\n"
