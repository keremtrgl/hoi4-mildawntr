 USA_wot_attack_occurred:0 "Büyük Bir Terör Saldırısı Gerçekleşti"
 USA_failed_to_win_in_iraq:0 "§Y[IRQ.GetNameWithFlag]§! ülkesinde başarısız oldu\n"
 war_on_terror_category:0 "Kalıcı Özgürlük Harekâtı ve Teröre Karşı Savaş"
 war_on_terror_category_desc:0 "Kalıcı Özgürlük Harekâtı (OEF), ABD hükümetinin Küresel Terörle Savaş için kullandığı resmî addır. Bu strateji yabancı ülkelerdeki terör örgütlerini hedef alır ve ABD'nin teröristlere ve destekçilerine cezasız biçimde vurmasına olanak tanır"
 KUR_war_on_terror_category:0 "Irak'a Özgürlük Harekâtı"
 KUR_war_on_terror_category_desc:0 "Amerika Birleşik Devletleri, Irak'ın işgali olan Irak'a Özgürlük Harekâtı'nı başlattı. Bu, [IRQ.GetLeader] yönetimine karşı harekete geçmek ve Irak boyunduruğundan kendimizi daha da uzaklaştırmak için bir fırsat."
 usa_increase_intelligence_spending:0 "İstihbarat Harcamalarını Artır"
 usa_increase_intelligence_spending_desc:0 "Yaklaşan ciddi bir terör saldırısına dair dağınık raporlar alıyoruz. Şu anda bu tehditle gereğince mücadele edecek araçlara sahip değiliz. İstihbarat fonlarını genişletmeli ve FBI ile CIA'nın gözetim haklarını artırmalıyız. Bu siyasi açıdan maliyetli olacak, ancak ülkemizin güvenliği tehlikede."
 usa_demand_extradition_of_bin_laden:0 "Usame bin Ladin'in İadesini Talep Et"
 usa_demand_extradition_of_bin_laden_desc:0 "İstihbaratımıza göre yakın zamandaki terör saldırısının ana gücü Usame bin Ladin'di. Bildiğimiz kadarıyla şu anda Afganistan'da Taliban'ın himayesinde ikamet ediyor. Taliban'la temasa geçip El Kaide ile bağlarını koparmalarını ve bin Ladin'i bize teslim etmelerini talep etmeliyiz."
 usa_seek_unsc_extradition_mandate:0 "Bin Ladin'in Teslim Edilmesini Güvenlik Konseyi'nde Talep Et"
 usa_seek_unsc_extradition_mandate_desc:0 "Tek bir asker Afganistan'a girmeden önce, Taliban'ı yalnızca bize değil, Konseyin tamamına hesap vermeye zorlamalıyız.\n\nGüvenlik Konseyi daha önce de bin Ladin'in teslim edilmesini talep etti ve Taliban bunu yok saydı. Yaptırımlarla desteklenen yeni bir karar tek başına onu çıkarıp getirmez. Ancak yapacağı şey, rejimin bunun bir Amerikan kavgası olduğu savını elinden almak, onlara sığınak veren her komşuyu uyarmak ve daha silaha sarılmadan önce reddetmeyi onlara bir şeye mal etmektir.\n\nYine de reddederlerse, bu salonda hiç kimse denemediğimizi söyleyemez."
 usa_operation_enduring_freedom:0 "Kalıcı Özgürlük Harekâtı'nı (OEF) Uygula"
 usa_operation_enduring_freedom_desc:0 "Taliban bize bin Ladin'i vermeyi reddetti, onu kendimiz almak zorunda kalacağız. Afganistan'a teçhizat göndermemize ve yere asker indirmemize olanak tanıyacak Kalıcı Özgürlük Harekâtı'nı hazırlamalıyız."
 usa_homeland_security_act:0 "İç Güvenlik Teşkilatı Kur"
 usa_homeland_security_act_desc:0 "Yönetim, 'Amerika Birleşik Devletleri İç Güvenlik Bakanlığı' adlı yeni bir bakanlık fikrini gündeme getirdi. İç Güvenlik, Federal Acil Durum Yönetimi Ajansı dahil 22 federal kurum ve ofisi bünyesine katacak.\n\nNebraska Avenue Kompleksi'nde konuşlanacak İç Güvenlik'in görevi, Amerika Birleşik Devletleri'ni ve müttefiklerini başta terörizm olmak üzere yabancı yıkıcı tehditlerden korumak olacak. Diğer ülkeler bu görevi çoğunlukla içişleri bakanlığına verir, ancak Amerikan olanı bunu belli ki başaramadı."
 usa_setup_new_administration_in_afghanistan:0 "Afganistan'da Yeni Bir Yönetim Kur"
 usa_setup_new_administration_in_afghanistan_desc:0 "Taliban yenildiğine göre yeni bir yönetim kurmalıyız. Afganistan'ın lideri olarak kimi atayacağımız konusunda birden fazla seçenek var."
 usa_create_guantanamo_bay:0 "Guantanamo Körfezi Gözaltı Merkezi'ni Kur"
 usa_create_guantanamo_bay_desc:0 "Gelecekteki şüpheli veya kanıtlanmış teröristlerle başa çıkmak için Amerika Birleşik Devletleri hükümeti ve gizli servisleri, bir cezaevi isyanı veya firar durumunda Amerikan sivillerini riske atmayan düzgün ve güvenli bir hapishaneye ihtiyaç duyacak. Böyle bir yer, ideal olarak topraklarımızın sınırını yakından izleyen düşman bir hükümete de ev sahipliği yapan bir adada olmalıdır; neyse ki tam böyle bir düzen Küba adasında mevcut: Amerika Birleşik Devletleri, 1903'ten beri Guantanamo Körfezi Deniz Üssü bölgesinde (Küba hükümetinin artık tanımadığı) bir kiralamaya sahip ve bu kira 1934'te süresiz olarak uzatıldı.\n\nAyrıca bu konumun bir diğer avantajı, Guantanamo Körfezi'nin ne bir eyalet ne de bir ABD toprağı olmasıdır; yani ABD yasaları ve hatta ABD anayasası orada zorunlu olarak geçerli değildir. Bu da CIA'ya bazı ilginç seçenekler sunacak..."
 usa_run_war_support_campaign_against_iraq:0 "Irak'ın İşgali İçin Savaş Desteği Kampanyası Yürüt"
 usa_run_war_support_campaign_against_iraq_desc:0 "BM, Irak'ı işgalimizi onaylamadı. İşgale geçmeden önce Amerikan halkını yanımıza çekmek için bir medya kampanyası yürütmeliyiz."
 usa_operation_iraqi_freedom:0 "Irak'a Özgürlük Harekâtı"
 usa_operation_iraqi_freedom_desc:0 "Irak'a Özgürlük Harekâtı'nın ön planlama aşaması 2002 Eylül'ünün başlarında başlamıştı. Ancak planlama asıl olarak, Irak hükümetinin kararın kendi payına düşen kısmını yerine getirmediği, ordusunu silahsızlandırmayı reddettiği ve Kitle İmha Silahları üretimini durdurmadığı 2002 Kasım'ında hız kazandı. Uymazlarsa Irak'a Özgürlük Harekâtı'nı uygulamaktan başka çaremiz kalmayacak."
 USA_wot_iraq_gave_us_cause:0 "Irak Zaten Bize Savaş Gerekçesi Verdi"
 KUR_join_invasion_of_iraq:0 "Irak'ın İşgaline Katıl"
 KUR_join_invasion_of_iraq_desc:0 "Irak'a karşı harekete geçme şansı şimdi!"
 wot.2.t:0 "Dogu Yakasi'nda Büyük Terör Saldirisi"
 wot.2.da:0 "Doğu Yakası'nda bir terör saldırısı girişimine dair raporlar aldık. Bu sabah erken saatlerde Boston'daki Logan Uluslararası Havalimanı'nda ve Washington D.C.'deki Dulles Uluslararası Havalimanı'nda El Kaide üyesi oldukları şüphelenilen birkaç kişi tutuklandı. Bu erken uyarılara rağmen beş terörist, New York'taki Newark Uluslararası Havalimanı'ndan 93 sayılı uçuşa binmeyi başardı. Uçağı kaçırmaya çalıştıkları sırada yolcuların direnişi, uçağın Pennsylvania'daki Stonycreek Kasabası'nda bir tarlaya düşmesine yol açtı. Yedi mürettebat, 33 yolcu ve beş korsan kazada hayatını kaybetti.\n\nMevcut istihbaratımıza göre uçakların, Dünya Ticaret Merkezi, Pentagon ve Kongre binası dahil Doğu Yakası'ndaki birkaç hedefe çarptırılması planlanıyordu.\n\nNeyse ki istihbarat servislerimiz teyakkuzdaydı ve korkunç bir trajediyi önlemeyi başardık."
 wot.2.db:0 "Doğu Yakası'nda büyük bir terör saldırısına dair raporlar aldık. Büyük olasılıkla El Kaide üyesi olan korsanlar, American Airlines 11, United Airlines 175, American Airlines 77 ve United Airlines 93 sayılı ticari yolcu uçaklarını Amerika Birleşik Devletleri'ne karşı uçan bomba olarak kullandı. \n\nBu sabah erken saatlerde, 08.46'da 11 sayılı uçuş New York'taki Dünya Ticaret Merkezi'nin Kuzey Kulesi'ne çarptı, hemen ardından 175 sayılı uçuş 09.03'te Güney Kulesi'ne çarptı. 09.37'de 77 sayılı uçuş Washington D.C.'deki Pentagon'a çarptı. Muhtemelen Kongre binasına doğru ilerleyen dördüncü uçak olan 93 sayılı uçuş, yolcular onu korsanlardan geri almaya çalışırken 10.03'te düştü.\n\nÜlkemiz korkunç bir günün ardından toparlanmak zorunda. Siyasi durum dünkünden tamamen farklı."
 wot.2.dc:0 "Doğu Yakası'nda büyük bir terör saldırısına dair raporlar aldık. Büyük olasılıkla El Kaide üyesi olan korsanlar, American Airlines 11, United Airlines 175, American Airlines 77 ve United Airlines 93 sayılı ticari yolcu uçaklarını Amerika Birleşik Devletleri'ne karşı uçan bomba olarak kullandı. \n\nBu sabah erken saatlerde, 08.46'da 11 sayılı uçuş New York'taki Dünya Ticaret Merkezi'nin Kuzey Kulesi'ne çarptı, hemen ardından 175 sayılı uçuş 09.03'te Güney Kulesi'ne çarptı. 09.37'de 77 sayılı uçuş Washington D.C.'deki Pentagon'a çarptı. Dördüncü uçak olan 93 sayılı uçuşta yolcular uçağı korsanlardan geri almaya çalıştı ancak başarısız oldu. Teröristler uçağı havada tutmayı başardı ve sonunda 10.23'te Kongre binasının yan tarafına çarptırdı.\n\nÜlkemiz korkunç bir günün ardından toparlanmak zorunda. Siyasi durum dünkünden tamamen farklı."
 wot.2.a:0 "93 sayılı uçuşun fedakârlığını onurlandıracağız"
 wot.2.b:0 "Ah, insanlık adına!"
 wot.2.c:0 "Ah, insanlık adına!"
 wot.3.t:0 "Dünya Ticaret Merkezi Saldirilarina Diplomatik Karsilik"
 wot.3.d:0 "Amerika Birleşik Devletleri, düşman terörist savaşçılar tarafından kasıtlı ve ani bir saldırıya uğradı.\n\nAmerika Birleşik Devletleri Dünya Ticaret Merkezi ve Pentagon'a yönelik saldırılara diplomatik ve askeri karşılığını hazırlarken [Root.GetAdjective] dışişleri bakanı hükümeti konuyla ilgili kararlı ve net bir açıklama yapmaya giderek daha fazla zorluyor."
 wot.3.a:0 "Amerika'nın yanındayız! Ne olursa olsun!"
 wot.3.b:0 "Saldırıları kınayın, ancak söz vermeyin."
 wot.3.c:0 "Başka ülkelerin işlerine karışınca böyle olur."
 wot.4.t:0 "Yerel Siyasetçi Hükümeti Destekliyor"
 wot.4.da:0 "Cumhuriyetçi yönetim son terör saldırısına kararlı bir karşılık bulmak için telaş ederken Demokrat Parti şimdiye kadar kenarda durup az çok durumu gözlemledi; saldırganları kınayan açıklamalar yaptı ancak kesin bir siyasi söz veya talepte bulunmadı.\n\nŞimdi, etkilenen New York eyaletinden Demokrat Parti'nin önemli bir üyesi, saldırılara verilen tepkilerde merkezi bir konum aldı: New York Senatörü ve Amerika Birleşik Devletleri'nin eski First Lady'si Hillary Clinton net bir konuşma yaptı: «Her ulus ya bizimle ya da bize karşı olmalıdır. Teröristlere barınak sağlayanlar veya onları finanse edenler bedelini ödeyecek.»\n\nÜlkenin dört bir yanındaki Demokratlar Clinton'ın açıklamaları etrafında toplanmaya başladı; bu yalnızca senatörleriyle değil, bu yalnızca korkunç değil, aynı zamanda özünde Amerikan karşıtı olan saldırıya uygun bir yanıt bulmak için gerekli her yola başvurma konusunda ilerlemek isteyen Cumhuriyetçi yönetimle de dayanışma işareti."
 wot.4.db:0 "Demokrat yönetim son terör saldırısına kararlı bir karşılık bulmak için telaş ederken Cumhuriyetçi Parti şimdiye kadar kenarda durup az çok durumu gözlemledi; saldırganları kınayan açıklamalar yaptı ancak kesin bir siyasi söz veya talepte bulunmadı.\n\nŞimdi, etkilenen New York eyaletinden Cumhuriyetçi Parti'nin önemli bir üyesi, saldırılara verilen tepkilerde merkezi bir konum aldı: New York Belediye Başkanı ve eski bir Amerika Birleşik Devletleri Savcısı olan Rudy Giuliani net bir konuşma yaptı: «Her ulus ya bizimle ya da bize karşı olmalıdır. Teröristlere barınak sağlayanlar veya onları finanse edenler bedelini ödeyecek.»\n\nÜlkenin dört bir yanındaki Cumhuriyetçiler Giuliani'nin açıklamaları etrafında toplanmaya başladı; bu yalnızca belediye başkanıyla değil, bu yalnızca korkunç değil, aynı zamanda özünde Amerikan karşıtı olan saldırıya uygun bir yanıt bulmak için gerekli her yola başvurma konusunda ilerlemek isteyen Demokrat yönetimle de dayanışma işareti."
 wot.4.a:0 "Birlik içindeyiz!"
 wot.4.b:0 "Sadece bir trajediden çıkar sağlamaya çalışıyorlar!"
 wot.5.t:0 "Ulusal Dua Töreni"
 wot.5.d:0 "Terör saldırılarının kurbanları için Washington Ulusal Katedrali'nde bir Ulusal Dua Töreni düzenlenmesi önerildi. Amerika Birleşik Devletleri'nin birkaç eski başkanı, görevdeki başkanla birlikte; Hristiyanlığın çeşitli kolları, İslam, Hinduizm, Sihizm ve Yahudilik dahil birkaç inançtan dini liderlerle birlikte hazır bulunacak.\n\nAnma töreninin ana konuşmasını [USA.GetLeader] yapacak."
 wot.5.a:0 "Bu önemli bir tören"
 wot.5.b:0 "Kurbanları anmak için buna ihtiyacımız yok"
 wot.6.t:0 "Balbir Singh Sodhi'nin Öldürülmesi"
 wot.6.d:0 "Terör saldırılarının doğrudan bir sonucu olarak, Amerika Birleşik Devletleri genelinde İslamofobik duygular ve şiddet çarpıcı biçimde arttı; ancak saldırıların çoğu ırksal veya dini saiklerle yapılan sözlü tacizler, hırsızlık veya mala zarar vermeyle sınırlı kaldı. Balbir Singh Sodhi için durum böyle olmadı.\n\nHindistan doğumlu Sih, Arizona'nın Mesa kentindeki benzin istasyonunda 42 yaşındaki Frank Silva Roque tarafından (Orta Doğulu görünümü ve türbanı nedeniyle) yanlışlıkla Müslüman sanıldı. Singh, ardından Roque tarafından kamyonetinden .380 kalibreli tabancayla vurularak öldürüldü. Roque olay yerinden kaçtı ve yirmi dakika sonra başka bir kişiyi, Lübnan doğumlu bir mağaza çalışanını öldürmeye çalıştı.\nBu suikast girişimi başarısız olunca Roque terör dalgasını kendi eski evinde, şimdi bir Afgan ailenin yaşadığı binada sonlandırdı; binaya ateş etti ancak can kaybına yol açmadı. Ertesi gün tutuklandı ve sonunda birinci derece cinayetten idama mahkûm edildi."
 wot.6.a:0 "Teröristlere asla teslim olmayacağız! Ten rengi ne olursa olsun!"
 wot.6.b:0 "Anlaşılabilir bir yanlış anlamaydı"
 wot.7.t:0 "Sarbon Saldirilari"
 wot.7.d:0 "FBI dosya adından dolayı Amerithrax olarak da bilinen şarbon saldırıları, terör saldırısından kısa süre sonra başladı.\n\nŞarbon sporları içeren mektuplar, haber muhabirleri ve iki ABD senatörü dahil birden fazla kişiye gönderildi. Biyoterörizm olayının Doğu Yakası'ndaki terör saldırısıyla bağlantılı olduğu düşünülüyor (ancak devam eden FBI soruşturması henüz kesin kanıt bulamadı) ve şu ana kadar 5 kişinin ölümüne ve 17 kişinin daha yaralanmasına yol açtı."
 wot.7.a:0 "Tüm engelleri aşacağız"
 wot.7.b:0 "Bunu yapanları bulmalıyız!"
 wot.8.t:0 "Teröre Karsi Savas Konusmasi"
 wot.8.d:0 "[USA.GetLeader], ABD Kongresi'nin ortak oturumunda yaptığı konuşmada, kendi deyimiyle bir «Teröre Karşı Savaş» ilan etti.\n\nBaşkan, terörizme kararlı ve doğrudan karşılıklar vereceğine söz verdi ve dünyanın diğer tüm ülkelerine şu meşhur çağrıyı yaptı: «Her bölgedeki her ulusun artık bir karar vermesi gerekiyor. Ya bizimlesiniz ya da teröristlerle.»"
 wot.8.a:0 "Adaleti getireceğiz"
 wot.8.b:0 "Ve bu hızlı olacak"
 wot.9.t:0 "ABD Usame bin Ladin'in Iadesini Talep Ediyor"
 wot.9.d:0 "Doğu Yakası'ndaki terör saldırısının ardından ABD yetkililerimizle temasa geçti ve müttefikimiz El Kaide ile lideri Usame bin Ladin'le tüm bağlarımızı koparmamızı talep ediyor. Ayrıca bin Ladin'i yakalayıp ABD'nin eline teslim etmemiz gerekiyor. Önceki söylemlere bakılırsa talebi reddetmek ABD'yi kesinlikle düşmanımız yapacak."
 wot.9.a:0 "Büyük Şeytan hiçbir şey alamayacak!"
 wot.9.b:0 "Belki şeytanla bir anlaşma gerekli..."
 wot.10.t:0 "Taliban Iadeyi Reddediyor"
 wot.10.d:0 "Taliban, El Kaide ve bin Ladin'le iş birliğini bırakmayı reddetti. Suçluları mahkemeye çıkarmanın tek yolu Taliban rejiminin tamamını devirmek gibi görünüyor."
 wot.10.a:0 "Bu şaşırtıcı bir sonuç değildi"
 wot.11.t:0 "Taliban Iadeyi Kabul Ediyor"
 wot.11.d:0 "Şaşırtıcı biçimde Taliban, El Kaide'yi ülkeden çıkarmayı ve bin Ladin'in peşine düşmeyi kabul etti. Teröristleri adalet önüne çıkarmak için ABD ordusuyla iş birliği yapmaya istekli olduklarını söylediler. Bin Ladin'i bilinen son konumunda yakalamak için şimdiden bir özel kuvvetler grubu sevk ettik"
 wot.11.a:0 "Bu... tuhaf"
 wot.12.t:0 "ABD Taliban Konusunda Yardim Istiyor"
 wot.12.d:0 "Amerika Birleşik Devletleri, Taliban'ı Afganistan'dan çıkaracak. Mücadelede desteğimizi talep etti."
 wot.12.a:0 "Mücadeleye asker göndereceğiz!"
 wot.12.b:0 "Yerel milisleri silahlandıracağız!"
 wot.12.c:0 "Manevi destek sağlayacağız! Hadi takım!"
 wot.13.t:0 "Bir Aday Seçmek"
 wot.13.da:0 "Afganistan'ın yöneticisi olarak kimi önermemiz gerektiğine karar vermeliyiz. Afganistan'ın mevcut yerel hükümetinin önerimize uyması muhtemel. Aralarından seçim yapabileceğimiz dört iyi aday var.\n\nSeçeneklerimiz: babası El Kaide tarafından öldürüldükten sonra Kuzey İttifakı'na katılan Hamid Karzai; Afganistan'ın mevcut resmî cumhurbaşkanı ve muhafazakâr İslamcı Camiyat partisinin lideri Burhaneddin Rabbani; Pencşir Aslanı Ahmed Şah Mesud; ya da Afganistan'ın sürgündeki kralı Muhammed Zahir Şah."
 wot.13.db:0 "Afganistan'ın yöneticisi olarak kimi önermemiz gerektiğine karar vermeliyiz. Afganistan'ın mevcut yerel hükümetinin önerimize uyması muhtemel. Aralarından seçim yapabileceğimiz üç iyi aday var.\n\nSeçeneklerimiz: babası El Kaide tarafından öldürüldükten sonra Kuzey İttifakı'na katılan Hamid Karzai; Afganistan'ın mevcut resmî cumhurbaşkanı ve muhafazakâr İslamcı Camiyat partisinin lideri Burhaneddin Rabbani; ya da Afganistan'ın sürgündeki kralı Muhammed Zahir Şah."
 wot.13.a:0 "Hamid Karzai"
 wot.13.b:0 "Burhaneddin Rabbani"
 wot.13.c:0 "Ahmed Şah Mesud"
 wot.13.d:0 "Muhammed Zahir Şah"
 wot.15.a:0 "Yine de işgalle ilerle"
 wot.15.b:0 "Sanırım onları dinlemek zorunda kalacağız..."
 wot.17.t:0 "Irak'in Isgaline Katilim?"
 wot.17.d:0 "Amerika Birleşik Devletleri, [IRQ.GetLeader] hükümetini devirmek için Irak'ı işgal etmeyi planlıyor. ABD savaşlarına katılmamızı talep ediyor."
 wot.17.a:0 "Elbette müttefiklerimize yardım edeceğiz!"
 wot.17.b:0 "Bu haksız bir savaş"
 wot.20.t:0 "Usame bin Ladin Yakalanmaktan Kurtuldu"
 wot.20.d:0 "Bin Ladin'i yakalama operasyonumuz tam bir başarısızlık oldu. Güçlerimiz şüphelendiğimiz yerleşkesine ulaştığında bin Ladin çoktan gitmişti. Ona sempati duyan güçlerin operasyonumuzu ona haber vermesi ve kaçması için bol zaman tanıması muhtemel.\n\nŞimdiye kadar nereye kaçtığına dair istihbaratımız yok, ancak büyük olasılıkla Afganistan'dan çıkış yolunda."
 wot.20.a:0 "Bir dahaki sefere yakalarız"
 wot.21.t:0 "Usame bin Ladin Yakalandi"
 wot.21.d:0 "Özel kuvvetlerimiz Usame bin Ladin'i Afganistan'daki sığınağında yakalamayı başardı. Yerel Taliban muhbirlerinin yardımıyla tam konumunu belirleyebildik ve direnmeden teslim oldu."
 wot.21.a:0 "Hanımlar ve beyler, onu yakaladık"
 wot.22.t:0 "Usame bin Ladin'in siginagi bulundu"
 GetBinLadenHideoutName_unknown:0 "bilinmeyen bir ülke"
 GetBinLadenHideoutAdjective_unknown:0 "ev sahibi"
 wot.22.d:0 "İstihbarat servislerimiz Usame bin Ladin'in yeni sığınağını tespit etti. [GetBinLadenHideoutName] içinde bir yerleşke belirledik. İnsansız araç görüntülerine ve yerel kaynaklara dayanarak bu kesinlikle bin Ladin'in konumu. Derhal [GetBinLadenHideoutAdjective] hükümetini bilgilendirip bin Ladin'i etkisiz hale getirmek için özel harekât görevi yürütme izni istemeliyiz"
 wot.22.a:0 "Ev sahibi ülkeyle hemen temasa geç!"
 wot.22.b:0 "Tek bir terörist kimin umurunda?"
 wot.23.t:0 "Amerika Birlesik Devletleri Bin Ladin'i Tespit Etti"
 wot.23.d:0 "Bugün Amerika Birleşik Devletleri dışişleri bakanı bizimle temasa geçerek Usame bin Ladin'in ülkemizde bir sığınak bulduklarını bildirdi. El Kaide'nin lideri Usame bin Ladin, birkaç yıl önceki büyük terör saldırısından sorumlu. Kendi istihbarat servislerimiz ABD'nin sağladığı bilgilerin bir kısmını doğrulayıp teyit edebildi. Bin Ladin'in gerçekten ülkemizde gizli bir yerde ikamet ediyor olması çok muhtemel.\n\nABD'nin bu operasyonu yapmasına izin vermek küresel terörizme karşı büyük bir darbe olacak, ancak yabancı özel kuvvetlerin ülkemizde faaliyet göstermesine izin vermek riskli. Bununla birlikte bin Ladin dünyanın en çok aranan teröristlerinden biri ve ABD'nin erişimini reddetmek muhtemelen Amerika Birleşik Devletleri ile iyi gitmeyecektir"
 wot.23.a:0 "Operasyona izin ver"
 wot.23.b:0 "ABD'nin egemenliğimizi tehlikeye atmasına izin vermeyeceğiz!"
 wot.24.t:0 "[FROM.GetName] Operasyonu Kabul Ediyor"
 wot.24.d:0 "[FROM.GetName], özel kuvvetlerimize ülkesine girip bin Ladin'in sığınağına baskın düzenleme izni verdi. Operasyonun sonuçlarını birkaç gün içinde almalıyız."
 wot.24.a:0 "Harika"
 wot.25.t:0 "[FROM.GetName] Talebimizi Reddediyor!"
 wot.25.d:0 "[FROM.GetName] ülkesinin sahada bin Ladin araması yapma iznini almak için birçok girişimde bulunulduktan sonra [FROM.GetLeader] basit bir yanıt gönderdi: «Hayır». Bazıları, terörle savaşta bize yardım çağrımızı açıkça yok saydığı için [FROM.GetName] ülkesinin sert biçimde cezalandırılmasını istiyor; ancak yurt içinde ne kadar popüler olmasa da meseleyi geçiştirebiliriz..."
 wot.25.a:0 "Sanırım egemenliklerine saygı gösterilmeli."
 wot.25.b:0 "Biz ve yardımlarımız olmadan ne kadar dayanabilirler?"
 wot.25.c:0 "O halde onlarsız gireriz."
 wot.26.t:0 "Washington Sartlar Sunuyor"
 wot.26.d:0 "Amerikalılar bir tümen yerine bir arabulucu gönderdi ve getirdiği şartlar şunlar. Afganistan bizde kalıyor. Hükümetimiz, mahkemelerimiz ve yasalarımız bizde kalıyor. Karşılığında Kuzey İttifakı'yla savaş olduğu yerde sona eriyor ve Emirlik, yaptırım altında, ambargolu ve gözetim altında, dünya pazarlarından kopuk ve bir kez olsun lehimize oy kullanmayacak bir Güvenlik Konseyi'ne hesap vermek zorunda olarak günlerini geçiriyor.\n\nŞura üyeleri arasında bunun anlaşma kılığına girmiş bir teslimiyet olduğunu, Sovyetleri Washington'ın elimize tasma takması için kovmadığımızı söyleyenler var. Arap Denizi'ndeki uçak gemisi grupları işaret edip alternatifin ne olduğunu soranlar da var.\n\nKabil'in yine de kabul etmesi gerekiyor. Ama reddedersek, Kabil'in kabul edeceği hiçbir şey kalmayacak."
 wot.26.a:0 "Şartları kabul et. Yaptırım altındaki bir Emirlik yine de bir Emirliktir."
 wot.26.b:0 "Sovyetlerle Washington'ın bize tasma takması için savaşmadık."
 wot.27.t:0 "Istemedigimiz Bir Baris"
 wot.27.d:0 "Pencşir'e bir Amerikan elçisi bir kâğıt ve bir teklifle geldi ve bu, on yıldır uğrunda savaştığımız teklif değil.\n\nTaliban, Washington'ın şartlarını kabul etti. Amerika'nın istediği adamları teslim edecek ve yaptırımlara boyun eğecekler, karşılığında Kabil'i, Kandahar'ı ve bugün ellerinde tuttukları her vadiyi koruyacaklar. Savaş öylece duruyor. Ölülerimiz ölü kalıyor, sürgünümüz kalıcı oluyor ve Necibullah'ı bir fener direğinden asan adamlar, bize vaat edilen ülkeyi yönetiyor.\n\nAmerikalılar, nezaketsiz olmayan bir biçimde, kazanmadığımızı belirtiyor. Haksız da değiller. Ancak bir savaşı kaybetmek ile kayıp için adımızı imzalamak arasında fark var."
 wot.27.a:0 "İmzala. Kazanmıyoruz ve ülke kan kaybediyor."
 wot.27.b:0 "Bunu yapan adamlar Kandahar'ı elinde tutmayı hak etmiyor."
 wot.28.t:0 "Anlasma Çöküyor"
 wot.28.d:0 "Görüşmeler öldü. Masadan hangi taraf kalkmış olursa olsun, masamıza düşen sonuç aynı: parayı harcadık, itibarı harcadık ve hiçbir şey satın almadık.\n\nAfganistan'daki savaş bizsiz devam ediyor. Bin Ladin'e ev sahipliği yapan adamlar hâlâ Kabil'de ve diplomasinin bunu çözebileceği savı, yüksek sesle, herkesin önünde tersi yönde çözüldü. Şahinler şimdiden açıklamalarını hazırlıyor.\n\nGeriye tek bir araç kalıyor ve bu odadaki herkes bunun ne olduğunu biliyor."
 wot.28.a:0 "O halde işi öbür yoldan yaparız."
 wotnews.1.t:0 "ABD Dogu Yakasi'nda Büyük Terör Saldirisi"
 wotnews.1.da:0 "Amerika Birleşik Devletleri'ndeki haber muhabirleri dikkatimizi Doğu Yakası'nda bir terör saldırısı girişimine çekti. Bu sabah erken saatlerde Boston'daki Logan Uluslararası Havalimanı'nda ve Washington D.C.'deki Dulles Uluslararası Havalimanı'nda El Kaide üyesi oldukları şüphelenilen birkaç kişi tutuklandı. Bu erken uyarılara rağmen beş terörist, New York'taki Newark Uluslararası Havalimanı'ndan 93 sayılı uçuşa binmeyi başardı. Uçağı kaçırmaya çalıştıkları sırada yolcuların direnişi, uçağın Pennsylvania'daki Stonycreek Kasabası'nda bir tarlaya düşmesine yol açtı. Yedi mürettebat, 33 yolcu ve beş korsan kazada hayatını kaybetti.\n\nMevcut istihbaratımıza göre uçakların, Dünya Ticaret Merkezi, Pentagon ve Kongre binası dahil Doğu Yakası'ndaki birkaç hedefe çarptırılması planlanıyordu.\n\nNeyse ki istihbarat servislerimiz teyakkuzdaydı ve korkunç bir trajediyi önlemeyi başardık."
 wotnews.1.db:0 "Amerika Birleşik Devletleri'ndeki haber muhabirleri dikkatimizi Doğu Yakası'nda büyük bir terör saldırısına çekti. Büyük olasılıkla El Kaide üyesi olan korsanlar, American Airlines 11, United Airlines 175, American Airlines 77 ve United Airlines 93 sayılı ticari yolcu uçaklarını Amerika Birleşik Devletleri'ne karşı uçan bomba olarak kullandı. \n\nBu sabah erken saatlerde, 08.46'da 11 sayılı uçuş New York'taki Dünya Ticaret Merkezi'nin Kuzey Kulesi'ne çarptı, hemen ardından 175 sayılı uçuş 09.03'te Güney Kulesi'ne çarptı. 09.37'de 77 sayılı uçuş Washington D.C.'deki Pentagon'a çarptı. Muhtemelen Kongre binasına doğru ilerleyen dördüncü uçak olan 93 sayılı uçuş, yolcular onu korsanlardan geri almaya çalışırken 10.03'te düştü."
 wotnews.1.dc:0 "Amerika Birleşik Devletleri'ndeki haber muhabirleri dikkatimizi Doğu Yakası'nda büyük bir terör saldırısına çekti. Büyük olasılıkla El Kaide üyesi olan korsanlar, American Airlines 11, United Airlines 175, American Airlines 77 ve United Airlines 93 sayılı ticari yolcu uçaklarını Amerika Birleşik Devletleri'ne karşı uçan bomba olarak kullandı. \n\nBu sabah erken saatlerde, 08.46'da 11 sayılı uçuş New York'taki Dünya Ticaret Merkezi'nin Kuzey Kulesi'ne çarptı, hemen ardından 175 sayılı uçuş 09.03'te Güney Kulesi'ne çarptı. 09.37'de 77 sayılı uçuş Washington D.C.'deki Pentagon'a çarptı. Dördüncü uçak olan 93 sayılı uçuşta yolcular uçağı korsanlardan geri almaya çalıştı ancak başarısız oldu. Teröristler uçağı havada tutmayı başardı ve sonunda 10.23'te Kongre binasının yan tarafına çarptırdı.\n\nBu korkunç bir gün ve teröristlerin hedeflerine ulaşmak için ne kadar ileri gidebileceğini gözler önüne seriyor."
 wotnews.1.o1:0 "Bunu unutmayacağız."
 wotnews.1.o2:0 "Bu zamanlarda birlikte duruyoruz."
 wotnews.1.o3:0 "Ah, insanlık adına!"
 wotnews.1.o4:0 "Kâfirler."
 wotnews.2.t:0 "Demokratlar ve Cumhuriyetçiler Saf Tutuyor"
 wotnews.2.d:0 "Terör saldırılarına karşılık olarak Demokrat ve Cumhuriyetçi Partiler, iki partili siyasi çatışmanın savaş baltasını gömme kararı aldı.\n\nNew York'ta Rudy Giuliani önderliğindeki Cumhuriyetçiler ve Hillary Clinton önderliğindeki Demokratlar, felakete karşı koymak için şimdiden başarıyla iş birliği yaptı. İki partinin bu krizin ardından da birlikte çalışacağı anlaşılıyor. Sadece bu seferlik."
 wotnews.2.a:0 "Amerika terörizme karşı birleşiyor."
 wotnews.3.t:0 "Amerikan Ulusal Dua Töreni"
 wotnews.3.d:0 "Washington Ulusal Katedrali'nde düzenlenen Ulusal Dua Töreni, Amerika Birleşik Devletleri'ne son üç günün sürekli çalkantısının ardından kısa bir dinlenme sağlama girişimiydi.\n\nBaşkan [USA.GetLeader] etkinliğin ana konuşmasını yaptı ve şöyle dedi: 'Bu olaylardan henüz üç gün geçti, Amerikalılar henüz tarihin getirdiği mesafeye sahip değil. Ama tarihe karşı sorumluluğumuz şimdiden açık: Bu saldırılara karşılık vermek ve dünyayı kötülükten arındırmak'."
 wotnews.3.a:0 "Ulusun iyileşmek için zamana ihtiyacı var."
 wotnews.4.t:0 "Balbir Singh Sodhi'nin Öldürülmesi"
 wotnews.4.d:0 "Terör saldırılarının ardından Amerika Birleşik Devletleri'nde çeşitli etnik ve dini gruplara yönelik şiddet fırladı. Bunlar arasında Arap Müslümanlar ve öyle görünen insanlar da var.\n\nHindistan doğumlu bir Sih ve Arizona'da bir benzin istasyonunun sahibi olan Balbir Singh Sodhi, bugün kendini Amerikan vatanseveri ilan eden 42 yaşındaki Frank Silva Roque tarafından hiçbir kışkırtma olmadan acımasızca pusuya düşürülüp öldürüldü; Roque ardından Lübnan veya Afgan kökenli birkaç kişiyi daha öldürmeye çalışacaktı."
 wotnews.4.a:0 "Çatışmadan çatışma doğar."
 wotnews.5.t:0 "Amerikan Sarbon Saldirilari"
 wotnews.5.d:0 "FBI, Doğu Yakası'ndaki terör saldırısından kısa süre sonra başlayan, şarbon sporlarıyla bulaştırılmış mektuplar kullanılan bir dizi suikast girişimi olan «Amerithrax» dosyası hakkında kamuya açık bilgi yayımladı.\n\nMektupların alıcıları arasında ABD Senatosu Çoğunluk Lideri Tom Daschle (D) ve Vermont senatörü Patrick Leahy (D) de vardı.\n\nŞu ana kadar beş kişi öldürüldü. FBI henüz olası şüphelilere dair bir bilgi yayımlamadı."
 wotnews.5.a:0 "Terör sürüyor."
 wotnews.6.t:0 "«Teröre Karsi Savas»"
 wotnews.6.d:0 "Doğu Yakası terör saldırılarından iki hafta sonra [USA.GetLeader], 2000'lerin başının belki de en belirleyici konuşmasını yaptı. İç ve dış politikadan söz etti ve şu sözlerle 'bizimle ya da bize karşı' ilanında bulundu: 'Her bölgedeki her ulusun artık bir karar vermesi gerekiyor. Ya bizimlesiniz ya da teröristlerle. Bu günden itibaren, terörizme barınak sağlamaya veya destek vermeye devam eden her ulus, Amerika Birleşik Devletleri tarafından düşman bir rejim olarak görülecek.'"
 wotnews.6.a:0 "Savaş mı geliyor?"
 wotnews.7.t:0 "[USA.GetLeader] 'Kalici Özgürlük'ü Duyurdu"
 wotnews.7.d:0 "Amerika Birleşik Devletleri Başkanı [USA.GetLeader], ABD Kongresi'ni yarın Taliban yönetimindeki Afganistan İslam Emirliği'ne askeri bir işgalin başlayacağı konusunda bilgilendirdi.\n\nAmerikan askeri saldırısı «Kalıcı Özgürlük Harekâtı» adını taşıyacak. Başkan ayrıca müttefik ülkeleri bir şekilde savaş çabasına dahil etme niyetini duyurdu.\n\nAfganistan hükümeti şimdiden protesto bildirisi yayımladı, ancak dünyada Afganistan ile diplomatik ilişkisi olan büyük bir ülke bulunmadığından bunun bir etkisi olması pek olası değil."
 wotnews.7.a:0 "Savaş geliyor."
 wotnews.8.t:0 "Bonn Anlasmasi"
 wotnews.8.d:0 "Taliban'sız bir Afganistan'da düzgün bir savaş sonrası düzen kurma girişimiyle çeşitli Batılı ülkelerin ulusal heyetleri, Almanya'nın Bonn kentinde 25 Afgan liderle bir araya geldi.\n\n[AFG.GetLeader], uluslararası toplum tarafından Afganistan'ın meşru Cumhurbaşkanı olarak tanındı. Dünya ülkelerinin çoğu artık Afganistan ile yeniden diplomatik ilişkiler kurmaya başladı."
 wotnews.8.a:0 "Afganistan sonunda barışı bulacak mı?"
 wotnews.9.t:0 "Guantanamo Körfezi Gözalti Merkezi"
 wotnews.9.d:0 "11 Eylül Terör Saldırılarına karşılık olarak Amerika Birleşik Devletleri hükümeti, terör faaliyetlerine katılmakla veya bunu aktif olarak planlamakla suçlanan yüksek riskli mahkûmları yerleştirecek bir yer arıyordu.\n\nBöyle bir merkez şimdi Küba adasında, Amerikan kontrolündeki bir kısımda, Guantanamo Körfezi Deniz Üssü'nde kuruldu. Amerika'nın Guantanamo Körfezi'ndeki devam eden kirasını tanımayan Küba hükümeti, adadaki Amerikan askeri varlığının derinleşmesine karşı şimdiden protesto yayımladı."
 wotnews.9.a:0 "Bunun kesinlikle yasal ve insani olacağından eminiz."
 wotnews.11.t:0 "Irak Savasi Basliyor"
 wotnews.11.d:0 "Irak'ın başkenti Bağdat'ta patlamaların ardından kısa süre sonra Başkan [USA.GetLeader] canlı bir konuşma yaptı; bu, Irak'a Özgürlük Harekâtı'nın başladığını gösteriyordu. ABD öncülüğündeki kampanya, Irak'ı diktatörü [IRQ.GetLeader] yönetiminden kurtarmayı ve kitle imha silahı stokunu depolama, geliştirme ve konuşlandırma yeteneğini ortadan kaldırmayı hedefliyor. Saldırı, Irak Cumhurbaşkanı [IRQ.GetLeader] yönetiminin ülkeyi terk etmesi için verilen 48 saatlik süreyi hiçe saymasından yalnızca birkaç gün sonra geldi. Askeri işgale karşılık, Bağdat'taki Irak Cumhuriyeti Radyosu «Kötüler, Tanrı'nın, vatanın ve insanlığın düşmanları, vatanımıza ve halkımıza karşı aptalca bir saldırganlık gerçekleştirdi.» dedi. Bu sırada ABD askeri kaynakları, [IRQ.GetLeader] dahil Irak rejiminin beş kilit üyesinin ilk saldırılarda hedef alındığını söyledi."
 wotnews.11.a:0 "Teröre karşı savaş sürüyor."
 wotnews.12.t:0 "Saddam Hüseyin Yakalandi"
 wotnews.12.d:0 "ABD güçleri bugün, memleketi Tikrit yakınlarındaki bir çiftlikteki yeraltı sığınağında sakallı ve bitkin görünümlü Saddam Hüseyin'i yakaladı. Tutuklama, ABD birliklerinin Irak başkentine girmesinden birkaç ay sonra gerçekleşti ve tarihin en yoğun insan avlarından birine son verdi. Bu öğleden sonra televizyonda yayımlanan bir konuşmada ABD Başkanı [USA.GetLeader], Saddam'ın «milyonlardan esirgediği adaletle» karşılaşacağını söyledi. Eski Irak liderinin tutuklanmasının «onun ve onun adına zorbalık edip öldürenlerin yolunun sonu olduğunu» belirtti. Ancak Başkan, bunun Irak'taki şiddetin sonu anlamına gelmediği uyarısında da bulundu."
 wotnews.12.a:0 "Hanımlar ve beyler, onu yakaladık!"
 wotnews.13.t:0 "Saddam Hüseyin Idama Mahkûm Edildi"
 wotnews.13.d:0 "Saddam Hüseyin, bir Irak mahkemesi tarafından insanlığa karşı suçlardan mahkûm edilmesinin ardından bugün şafakta idam edildi. Hüküm, Bağdat'ın Şii bir semtindeki eski bir askeri istihbarat karargâhında yerel saatle 06.05'te (GMT 03.05) infaz edildi. Hazırlanmış bir açıklamada [USA.GetLeader], Saddam'ın idamının Irak'taki şiddeti durdurmayacağı uyarısında bulundu, ancak bunun «Irak'ın kendi kendini yönetebilen, sürdürebilen ve savunabilen, teröre karşı savaşta müttefik olan bir demokrasi olma yolunda önemli bir dönüm noktası» olduğunu söyledi. Irak Başbakanlığı, Saddam'ın idamının kendi halkına karşı suç işleyen acımasız liderlere «güçlü bir ders» olduğunu belirten bir açıklama yayımladı."
 wotnews.13.a:0 "Pekâlâ."
 wotnews.14.t:0 "ABD Irak'tan Birliklerini Çekiyor"
 wotnews.14.d:0 "Son ABD asker konvoyu Irak'tan ayrıldı; iki taraf için de çok sayıda can kaybına yol açan, neredeyse dokuz yıl süren savaş sona erdi ve geride siyasi belirsizlikle boğuşan bir ülke kaldı. Çoğu ABD'ye ait yaklaşık 100 MRAP zırhlı aracından oluşan, 500 ABD askerini taşıyan son kolon, geceyi ve şafağı boyunca güney Irak çölünde son üslerinden çıkıp boş bir otoyol boyunca Kuveyt sınırına doğru ağır ağır ilerledi. Amerika Birleşik Devletleri için bu çekilme, geniş çapta Vietnam'dan beri en gözde olmayan savaş sayılan ve Amerika'nın dünyadaki itibarını zedeleyen bir çatışmadan askerleri eve getirme sözünün yerine getirilmesi demek. Iraklılar içinse ayrılış, egemenlik hissi getiriyor; ancak bu his, ülkelerinin 2006-2007'de zirveye çıkıp binlerce kişinin canına mal olan türden bir mezhep şiddetine yeniden sürüklenebileceği yönündeki sürekli kaygılarla gölgeleniyor."
 wotnews.14.a:0 "Irak sonunda barışa kavuşacak mı?"
 wotnews.15.t:0 "Amerika Birlesik Devletleri Usame bin Ladin'i Yakaladi"
 wotnews.15.d:0 "Bugün [USA.GetAdjective] hükümeti, Usame bin Ladin'i Afganistan'da yakaladığını duyurdu. Bin Ladin, Amerika Birleşik Devletleri'ne yönelik terör saldırısının baş beyniydi. Yerel Taliban muhbirlerinin yardımıyla ABD özel kuvvetleri bin Ladin'in karargâhına baskın düzenledi. Özel kuvvetlerle karşılaşınca çatışmadan teslim olduğu bildiriliyor."
 wotnews.15.a:0 "İlginç"
 wotnews.16.t:0 "Usame bin Ladin Öldürüldü"
 wotnews.16.d:0 "Amerika Birleşik Devletleri, [GetBinLadenHideoutName] bölgesinde bir terörle mücadele operasyonu yürüttüğünü ve El Kaide lideri Usame bin Ladin'i gizli bir karargâhta öldürdüğünü duyurdu. Bir grup Deniz Kuvvetleri SEAL komandosu yerel saatle gece yarısından kısa süre sonra bölgeye baskın düzenledi ve silahsız terör liderini vurduğu bildirildi. Cesedi kimliğinin tespiti için yakındaki bir ABD uçak gemisine götürüldü; ölen koruması ve maiyetinin geri kalanı ise yerel güvenlik güçlerine bırakıldı. Birkaç saat sonra İslami geleneğe uygun olarak denize gömüldü.\n\nABD bunu terörizme karşı büyük bir zafer olarak görüyor; birçok aşırılıkçı grup ise şimdiden Amerikalılardan intikam alacağına yemin etti."
 wotnews.16.a:0 "İlginç"
 wotnews.17.t:0 "Bin Ladin Afganistan'dan Sivisti"
 wotnews.17.d:0 "Koalisyon uçakları Tora Bora mağaralarını bombalarken, peşinde oldukları adam çoktan gitmişti. İstihbarat servisleri artık Usame bin Ladin'in haftalar önce sınırı geçtiğine ve sempatizanların himayesinde, güvenli evler arasında dolaşarak [GetBinLadenHideoutName] bölgesinde barındırıldığına inanıyor.\n\nAfganistan harekâtı hâlâ kazanılabilir. Ancak av daha yeni başlıyor ve koalisyonun savaşta olmadığı bir ülkede yürütülmek zorunda."
 wotnews.17.a:0 "Sonsuza dek saklanamaz."
 wotnews.19.t:0 "Iz Sogudu"
 wotnews.19.d:0 "Usame bin Ladin'in peşindeki av sessizce sona erdi. Gözetlenecek karargâh, baskı yapılacak hükümet, Amerikan parasını alacak muhbir kalmadı. Onu barındıran son güvenli evler, onlara göz yuman devletlerle birlikte yok oldu.\n\nİstihbarat yetkilileri yalnızca onun 'artık aktif bir operasyonel tehdit olarak değerlendirilmediğini' söylüyor. Hayatta olup olmadığı sorulduğunda yanıt vermiyorlar. Hâlâ kimsenin onu arayıp aramadığı sorulduğunda da yanıt vermiyorlar.\n\nDünyanın en çok aranan adamı, bir yerlerde, sadece bulunamaz hale geldi."
 wotnews.19.a:0 "Bazı savaşlar cesetsiz biter."
 wotnews.20.t:0 "Baskin Bos Eve Düstü"
 wotnews.20.d:0 "Amerikan helikopterleri karanlıkta, izinsiz ve uyarısız egemen bir sınırı geçti ve eli boş döndü.\n\nKarargâh boştu. Önceden haber alıp almadığını, istihbaratın baştan yanlış olup olmadığını ya da sadece bir hafta erken taşınıp taşınmadığını Washington'da kimse söylemeye yanaşmıyor. Tartışılmayan şey ise yabancı bir özel kuvvetler birliğinin, Amerika Birleşik Devletleri'nin savaşta olmadığı bir ülkenin topraklarında silahlı operasyon yürüttüğü ve bu sırada o ülkenin birkaç vatandaşını öldürdüğü.\n\nGüvenlik Konseyi yarın toplanıyor. Yönetimin gösterebileceği hiçbir sonuç yok."
 wotnews.20.a:0 "Tam bir fiyasko."
 MD_terror.20.t:0 "Bölgesel Terör Agi Genisliyor"
 MD_terror.20.d:0 "İstihbarat raporları, bölgemizde faaliyet gösteren bir terör örgütünün ilk yerel üssünün ötesine geçtiğini gösteriyor. Grup, daha geniş bölge çapında ağlar ve hücreler kurdu. Güvenlik analistleri, ülkemizin artık onların operasyon planlarının menzili içinde olabileceği konusunda uyarıyor."
 MD_terror.20.a:0 "Endişe verici, ama henüz acil sorunumuz değil."
 MD_terror.20.b:0 "Yurt içindeki terörle mücadele varlığımızı artıralım."
 MD_terror.20.c:0 "Davaları yayılıyor. Hamd olsun."
 MD_terror.21.t:0 "Terör Örgütü Küresel Erisime Ulasti"
 MD_terror.21.d:0 "Dünya çapındaki istihbarat teşkilatları, büyük bir terör örgütünün küresel ölçekte saldırı düzenleme kapasitesine ulaştığını değerlendirdi. Bir zamanlar bölgesel bir tehdit olan örgüt; hücrelerden, finansman ve lojistikten oluşan uluslararası bir ağ kurdu. Hiçbir ülke kendini onların planlarının erişiminin dışında sayamaz."
 MD_terror.21.a:0 "Teyakkuzda kalacağız."
 MD_terror.21.b:0 "Terörle mücadele operasyonlarımızı derhal güçlendirelim."
 MD_terror.21.c:0 "Hilafetin erişimi artık tüm dünyayı kapsıyor."
 war_on_terror_leader:0 "Teröre Karşı Savaş Harekâtı"
 USA_wot_extradition_accepted:0 "§YTaliban ile İşbirliği§!"
 USA_unilateral_raid_threat:0 "Yabancı topraklarda tek taraflı baskın"
 usa_petition_invasion_of_iraq:0 "Irak'ın Silahsızlandırılmasını Güvenlik Konseyi'ne Taşı"
 usa_petition_invasion_of_iraq_desc:0 "[IRQ.GetLeader] yönetiminin kitle imha silahları olduğunu biliyoruz. Güvenlik Konseyi'ne, Irak'ı silahsızlanma yükümlülüklerini maddi olarak ihlal etmekle suçlayan ve ciddi sonuçlar konusunda uyaran bir karar tasarısı sunacağız.\n\nBu karar bir işgale yetki vermeyecek. Böyle bir karar oylamadan geçmez ve kendi hukukçularımız da bunu biliyor. Ama bize kazandıracağı şey itibar; nasıl olsa Bağdat'a gireceksek, Konsey'e rağmen değil, Konsey'in desteğiyle girmek daha iyidir."
 TT_IRAQ_DISARMAMENT_UNSC_PETITION:0 "§YBM Güvenlik Konseyi§!'ne bir silahsızlanma kararı sun. Kabul edilirse §YIrak§! maddi ihlalde bulunmuş sayılır ve işgal için diplomatik örtü kazanırız. Reddedilirse yalnız gireriz."
 wot.15.t:0 "Güvenlik Konseyi Karar Verdi"
 wot.15.da:0 "Karar kabul edildi. Irak, silahsızlanma yükümlülüklerini maddi olarak ihlal etmiş ilan edildi ve Konsey, [IRQ.GetLeader] yönetimi uymazsa ciddi sonuçlar doğacağı uyarısında bulundu.\n\nKararın yapmadığı şey ise bize işgal yetkisi vermek. Zaten hiçbir zaman vermeyecekti; bunu açıkça söyleyen ikinci bir karar için ısrar etmek Fransa'ya bir veto hakkı, salonun geri kalanına da bir bahane sunmaktan öteye geçmezdi. Ama Konsey'in kayıtlarında bir tutanağımız var. Şimdi Irak'a girersek, hukuken savunulabilir bir dayanakla ve müttefiklerimizin bizi izleyebileceği bir zeminde gireriz."
 wot.15.db:0 "Karar reddedildi. Konsey, maddi ihlal tespitine bile imza atmadı ve ikinci bir girişim olmayacak.\n\nBu bizi hep sezdiğimiz noktaya getirdi: [IRQ.GetLeader] yönetiminin tehdit olduğundan eminiz ve bu konuda bir şey yapmaya istekli olan tek taraf da biziz. Hâlâ Irak'a girebiliriz. Sadece örtüsüz gireceğiz ve bunun faturası Bağdat düştükten çok sonra önümüze gelecek."
 TT_IRAQ_INVASION_WITH_COVER:0 "§YGüvenlik Konseyi§! kaydıyla işgal ediyoruz. §GUluslararası tepki azalır ve ortaklarımız bizi izleyebilir.§!"
 TT_IRAQ_INVASION_WITHOUT_COVER:0 "§Rhiçbir diplomatik örtü olmadan§! işgal ediyoruz. §RUluslararası tepki ağır olur ve Güvenlik Konseyi bunu affetmez.§!"
 USA_iraq_invasion_threat:0 "Irak'ın İşgali"
 usa_broker_afghan_settlement:0 "Afganistan'da Uzlaşma Sağla"
 usa_broker_afghan_settlement_desc:0 "Bin Ladin'i bize teslim ettiler. Hâlâ Kuzey İttifakı ile savaşıyorlar ve Afganistan'ı onun gibi adamların kaybolabileceği bir yer yapan şey tam da bu savaş.\n\nBunu tek bir Amerikan tümeni olmadan bitirebiliriz. Taliban'ı, yaptırım altında tuttuğumuz ve gözetlediğimiz, mesafeli durduğumuz bir devletin hükümeti olarak tanıyıp on yıldır onlarla savaşan Pencşir'deki adamlara barışı dayatabiliriz. Bu kimseyi memnun etmeyecek. Kabil bize borçlu kalacak, Kandahar bizden nefret edecek, evdeki şahinler de buna teslimiyet diyecek.\n\nAyrıca bu, Amerika'nın başlatmak yerine bitirdiği, yaklaşık bir kuşağın ilk savaşı olacak."
 TT_AFGHAN_SETTLEMENT_OFFERED:0 "§YTaliban§! ve §YKabil§! ile şartları görüş. §RHerhangi biri masadan kalkıp gidebilir.§!"
 TT_WOT_DIPLOMATIC_VICTORY:0 "§GOnu savaşsız ele geçirdik.§! Şahinler bunu affetmeyecek."
 TT_WOT_INVADE_AFTER_COMPLIANCE:0 "§ROnu teslim ettiler ve biz yine de işgal ediyoruz.§! Güvenlik Konseyi bunu unutmayacak, kendi halkımız da unutmayacak."
 TT_WOT_TORE_UP_OUR_OWN_TREATY:0 "§RBarışı biz yazdık, §YKabil§!'e imzalattık ve şimdi onu kendimiz yırtıyoruz.§! Afganistan bize bir daha asla güvenmeyecek ve §Rbölgedeki nüfuzumuz çöküyor§!."
 USA_wot_unprovoked_invasion:0 "Uyumlu Bir Rejimin İşgali"
 USA_wot_broken_settlement:0 "Afgan Uzlaşması Bozuldu"
 wotnews.18.t:0 "Afganistan'da Baris"
 wotnews.18.d:0 "Sovyetler çekildiğinden beri Afganistan'ı kasıp kavuran savaş bugün sona erdi; ne Kabil'de ne de Kandahar'da, bir konferans masasında; bir yanda Amerikan parası, öbür yanda bir Taliban heyeti vardı.\n\nTaliban ülkeyi elinde tutuyor. Yaptırım altında, ambargolu ve gözetim altında, Washington'ın eli Kabil'in omzunda. Kimse buna zafer demedi. On yıldır Pencşir vadisinde savaşan adamlar evlerine dönüyor ve Usame bin Ladin Amerikan gözetiminde.\n\nWashington'da 101. Hava İndirme Tümeni'nin bunun yerine Kandahar'da olmasını isteyenler var. Bunu yirmi yıl boyunca tartışacaklar."
 wotnews.18.a:0 "Savaş bitti."
 wot.0.t:0 "Bin Ladin ABD'de Saldiri Kararli"
 wot.0.d:0 "Başkanın masasındaki Günlük Başkanlık Bilgi Notu bu sabah bir buçuk sayfa tutuyor. Ne bir tarih, ne bir şehir, ne de bir hedef içeriyor. Usame bin Ladin'in 1997'den beri Amerika Birleşik Devletleri içinde saldırı yapmak istediğini, takipçilerinin yıllardır burada yaşadığını ve Büro'nun, uçak kaçırma hazırlıklarıyla uyumlu olarak nitelendirdiği şüpheli faaliyet örüntüleri gördüğünü söylüyor.\n\nBu tek bir not. Bunun gibi onlarcası oldu ve onu yazan adamlar bize ne zaman, nerede ya da nasıl olacağını söyleyemiyor. Ama tek bir şeyden eminler: o geliyor ve bunu burada yapmak niyetinde.\n\nBir buçuk sayfalık tahmin yüzünden istihbarat camiasını savaş durumuna geçirebiliriz ve hiçbir şey olmazsa maliyetinin hesabını veririz. Ya da dosyalayıp bir kenara koyarız."
 wot.0.a:0 "Camiayı savaş durumuna geçir."
 wot.0.b:0 "Yüzlerce notun yalnızca biri."
 TT_WOT_PDB_ACT:0 "§YEl Kaide§! üzerinde §Y10§! istihbarat kazan. Daha iyi istihbarat, gelmekte olan her neyse onu engelleme şansımızı artırır."
 TT_BIN_LADEN_RAID_UNILATERAL:0 "Onları izinsiz gönder. §G%75 ihtimalle baskın §YUsame bin Ladin§!'i öldürür.§!\n§R%25 ihtimalle karargâh boştur: o yer değiştirir, Güvenlik Konseyi bizi kınar ve evde hesabını biz veririz.§!"
 TT_WOT_INTEL_COOPERATION:0 "§GBizimle konuşmaya devam ediyorlar. §YEl Kaide§! üzerinde §Y15§! istihbarat kazan.§!"
 TT_WOT_INTEL_PRESSURE:0 "§GSığınak gürültülü hale geliyor. §YEl Kaide§! üzerinde §Y5§! istihbarat kazan ve ağ daha fazla açığa çıkar.§!"
