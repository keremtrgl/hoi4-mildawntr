 ANTARCTICA_CCAS_TEXT:0 "Antarktika Fokları Korunma Sözleşmesi (CCAS), Antarktika'da fok avcılığını düzenleyen bir anlaşmadır. Fok popülasyonlarını korumak ve kaynaklarının sürdürülebilir kullanımını sağlamak için 1972'de kurulmuştur."
