 MD_antarctica_news.1.t:0 "[FROM.GetName] Antarktika Antlaşması'na Katılmak İçin Başvurdu"
 MD_antarctica_news.1.d:0 "[FROM.GetName] Antarktika Antlaşması'na katılmak için başvurdu; bu, dış politikasında ve çevrenin korunmasına bağlılığında olası bir değişime işaret ediyor. Antarktika Antlaşması, Antarktika'nın barışçıl amaçlarla ve bilimsel araştırma için kullanılmasını düzenleyen, kıtanın eşsiz ekosistemini de koruyan uluslararası bir anlaşmadır. [FROM.GetName] başvurusu uluslararası toplumdan sıcak karşılık gördü; kimileri bunu küresel iş birliği yolunda olumlu bir adım olarak överken kimileri de [FROM.GetName] niyetleri ve antlaşmanın ilkelerine bağlılığı konusunda kuşkularını dile getiriyor. Başvuru süreci bir ay sürecek."
 MD_antarctica_news.1.a:0 "Zaman gösterecek"
 MD_antarctica_news.1.b:0 "Zamanı da gelmişti"
 MD_antarctica_news.2.t:0 "[FROM.GetName] Antarktika Antlaşması'na Katıldı"
 MD_antarctica_news.2.d:0 "Bugün, [GetDateText] tarihinde [FROM.GetName], Antarktika'nın barışçıl amaçlarla ve bilimsel araştırma için kullanılmasını düzenleyen uluslararası anlaşmanın üyesi olarak Antarktika Antlaşması'na resmen katıldı. Antlaşmaya katılarak [FROM.GetName], Antarktika'da çevre korumacılığı ve uluslararası iş birliği ilkelerini sürdürmeyi taahhüt etti. Bu adım küresel toplumdan olumlu tepkiler aldı; pek çok kişi [FROM.GetName] ülkesini Antarktika'nın eşsiz ekosistemini koruma ve uluslar arasında barışçıl iş birliğini teşvik etme konusundaki kararlılığı için övüyor."
 MD_antarctica_news.2.a:0 "Bir Üye Daha"
 MD_antarctica_news.2.b:0 "Hadi iş başına!"
 MD_antarctica_news.3.t:0 "[FROM.GetName] Antarktika Antlaşması'ndan Ayrılmaya Çalışıyor"
 MD_antarctica_news.3.d:0 "[FROM.GetName] bugün Antarktika Antlaşması'ndan ayrılmaya karar verdi. Antarktika Deniz Canlı Kaynaklarının Korunması Komisyonu (CCAMLR), Antarktika'daki araştırma istasyonlarını sökmesi ve kaynak sömürüsü ya da askerî varlık gibi yasaklı faaliyetlerden kaçınması için ona 2 yıl veriyor. Antlaşmadan ayrılma kararı uluslararası toplumdan karışık tepkiler aldı; kimileri çevre ve küresel iş birliği için olası sonuçlar nedeniyle hayal kırıklığı ve endişe dile getirirken kimileri de [FROM.GetName] uluslararası anlaşmalardaki katılımı hakkında kendi kararlarını verme hakkını destekliyor. Antlaşmadan ayrılma süreci 2 yıl sürecek."
 MD_antarctica_news.3.a:0 "Ne yazık"
 MD_antarctica_news.3.b:0 "Yapacak daha iyi işlerimiz var"
 MD_antarctica_news.4.t:0 "[FROM.GetName] Antarktika Antlaşması'ndan Ayrıldı"
 MD_antarctica_news.4.a:0 "Antlaşma Zayıfladı"
 MD_antarctica_news.4.b:0 "Her neyse"
 MD_antarctica_news_4_desc_1:0 "Antarktika Antlaşması'ndan ayrılma sürecinden 2 yıl sonra [FROM.GetName], Antarktika'nın barışçıl amaçlarla ve bilimsel araştırma için kullanılmasını düzenleyen uluslararası anlaşmadan resmen ayrıldı. Uyarılara rağmen [FROM.GetName], Antarktika'da bir Araştırma İstasyonu varken antlaşmadan ayrıldı; bu, Antlaşma üyelerinden olası yaptırımlar ve diplomatik tepki dahil küresel bir karşılığa yol açtı."
 MD_antarctica_news_4_desc_2:0 "Antarktika Antlaşması'ndan ayrılma sürecinden 2 yıl sonra [FROM.GetName], Antarktika'nın barışçıl amaçlarla ve bilimsel araştırma için kullanılmasını düzenleyen uluslararası anlaşmadan resmen ayrıldı. [FROM.GetName], Antarktika'daki tüm araştırma istasyonlarını başarıyla söktü ve kaynak sömürüsü ya da askerî varlık gibi yasaklı faaliyetlerden kaçındı; bu da çevre ve küresel iş birliği açısından olası sonuçların hafifletilmesine yardımcı oldu."
 MD_antarctica_news.5.t:0 "[FROM.GetAdjective] Antarktika İstasyonunda Açık Döngü Tesisleri Tespit Edildi"
 MD_antarctica_news.5.d:0 "Yakın zamandaki gözlemci görevi sırasında Antlaşma gözlemcileri, [FROM.GetAdjective] Antarktika araştırma istasyonlarından birinde Açık Döngü Tesisleri kullanımını tespit etti. Bu, çevreye zarar verebilecek ya da Antarktika ekosistemini bozabilecek her faaliyeti yasaklayan Antarktika Antlaşması'nın ihlalidir. Açık Döngü Tesislerinin tespiti Antlaşma üyeleri arasında endişe yarattı ve diplomatik sonuçlara yol açabilir."
 MD_antarctica_news.5.a:0 "Bazıları ucuzuna kaçmak zorunda"
 MD_antarctica_news.5.b:0 "Eh"
 MD_antarctica_news.6.t:0 "[FROM.GetAdjective] Antarktika İstasyonunda Yasa Dışı Laboratuvar Faaliyetleri Tespit Edildi"
 MD_antarctica_news.6.d:0 "Yakın zamandaki gözlemci görevi sırasında Antlaşma gözlemcileri, [FROM.GetAdjective] Antarktika araştırma istasyonlarından birinde yasa dışı laboratuvar faaliyetlerini tespit etti. Bu davranış kabul edilemez ve Antarktika Antlaşması'nın açık bir ihlalidir. Antlaşmanın Danışman Tarafları bu konuyu ele alacak ve Antarktika'nın eşsiz ekosisteminin korunmasını ve antlaşmanın bütünlüğünü sağlamak için uygun adımları atacak."
 MD_antarctica_news.6.a:0 "Bu kabul edilemez"
 MD_antarctica_news.6.b:0 "Bu konuda bir şey yapmalıyız"
 MD_antarctica_news.7.t:0 "[FROM.GetAdjective] Antarktika İstasyonunda Nükleer Silah Araştırması Tespit Edildi"
 MD_antarctica_news.7.d:0 "Yakın zamandaki gözlemci görevi sırasında Antlaşma gözlemcileri, [FROM.GetAdjective] Antarktika araştırma istasyonlarından birinde nükleer silah araştırması tespit etti. Bu, her türlü askerî faaliyeti ve çevreye zarar verebilecek ya da Antarktika ekosistemini bozabilecek her faaliyeti yasaklayan Antarktika Antlaşması'nın ağır bir ihlalidir. Barışçıl bir araştırma istasyonunu nükleer silah yapımı ve denemesi için kullanmak, tüm dünyanın güvenliğini ve emniyetini tehdit eden skandal bir davranıştır. Antlaşmanın Danışman Tarafları bu konuyu ele almak ve sorumluları eylemlerinden hesap vermeye çağırmak için derhal ve kararlı adımlar atacak. Uluslararası toplum bu davranışı kınamak ve Antarktika'nın bilimsel araştırma ve iş birliği için barışçıl ve korunan bir ortam olarak kalmasını sağlamak için bir araya gelmeli."
 MD_antarctica_news.7.a:0 "Bu skandal!"
 MD_antarctica_news.7.b:0 "Daha önemliydi"
 MD_antarctica_news.8.t:0 "[FROM.GetName] Antarktika Antlaşması'nı Çok Fazla İhlal Etti"
 MD_antarctica_news.8.d:0 "Antarktika Antlaşması'nın defalarca ihlal edilmesinin ardından [FROM.GetName] kritik bir noktaya ulaştı; Antlaşmanın Danışman Tarafları onu antlaşmadan çıkarmaya ve ağır diplomatik sonuçlar uygulamaya karar verdi. Antlaşmanın ilke ve düzenlemelerinin tekrarlanan ihlalleri anlaşmanın bütünlüğünü zedeledi ve Antarktika'nın eşsiz ekosisteminin korunmasını tehdit etti. Antlaşmanın Danışman Tarafları, [FROM.GetName] eylemlerinden hesap vermesini ve Antarktika Antlaşması'nın uluslararası iş birliği ile çevre korumacılığı için güçlü ve etkili bir çerçeve olarak kalmasını sağlamak için kararlı adım atacak."
 MD_antarctica_news.8.a:0 "Bunu kendi başlarına getirdiler"
 MD_antarctica_news.8.b:0 "Bu çok fazla"
 MD_antarctica_news.9.t:0 "Antarktika Genelinde Şiddetli Rüzgârlar"
 MD_antarctica_news.9.d:0 "Antarktika genelinde şiddetli rüzgârlar bildirildi ve araştırma istasyonlarını etkiliyor. Antlaşmanın Danışman Tarafları durumu izliyor ve personelin güvenliğini ve devam eden araştırmaların bütünlüğünü sağlamak için destek veriyor. Hava koşulları düzelene kadar gözlemci görevleri geçici olarak askıya alındı."
 MD_antarctica_news.9.a:0 "İyi değil"
 MD_antarctica_news.10.t:0 "[FROM.GetName] Antarktika Araştırma İstasyonu İnşasına Başladı"
 MD_antarctica_news.10.d:0 "[FROM.GetName] yeni bir Antarktika araştırma istasyonu inşasına başladı; bu, bölgedeki bilimsel araştırma ve çevre korumacılığına bağlılığını gösteriyor. İstasyonun inşasının birkaç ay sürmesi bekleniyor ve Antlaşmanın Danışman Tarafları, Antarktika Antlaşması'nın ilke ve düzenlemelerine uyumunu sağlamak için ilerlemeyi yakından izleyecek."
 MD_antarctica_news.10.a:0 "Harika!"
 MD_antarctica.1.t:0 "Gözlemci Görevi Yolda"
 MD_antarctica.1.d:0 "[FROM.GetName], Antarktika araştırma istasyonlarımızdan birini denetlemek için Antlaşma gözlemcileri gönderdi. Görevin §Y7 gün§! içinde varması bekleniyor."
 MD_antarctica.1.a:0 "Gelişlerini bekleyeceğiz"
 MD_antarctica.3.t:0 "Gözlemci Görevi Raporu: Açık Döngü Tesisleri Tespit Edildi"
 MD_antarctica.3.d:0 "Antlaşma gözlemcileri Antarktika araştırma istasyonumuzdaki denetimi tamamladı ve Açık Döngü Tesisleri kullanımının tespit edildiğini bildirdi. Bu, Antarktika Antlaşması'nın ihlalidir ve diplomatik sonuçlara yol açabilir. Antlaşmanın Danışman Tarafları, tesislerin daha çevre dostu seçeneklerle değiştirilmesi için eyleme geçilmesini talep etti."
 MD_antarctica.3.a:0 "Bundan kurtulmalıyız"
 MD_antarctica.4.t:0 "Gözlemci Görevi Raporu: Yasa Dışı Laboratuvar Faaliyetleri Tespit Edildi"
 MD_antarctica.4.d:0 "Antlaşma gözlemcileri Antarktika araştırma istasyonumuzdaki denetimi tamamladı ve yasa dışı laboratuvar faaliyetlerinin tespit edildiğini bildirdi. İstasyonumuzdaki tüm yasa dışı faaliyetlere son verirsek Danışman Taraflar başka bir yaptırım uygulamayacak."
 MD_antarctica.4.a:0 "Bu konuda bir şey yapmalıyız"
 MD_antarctica.5.t:0 "Gözlemci Görevi Raporu: Nükleer Silah Araştırması Tespit Edildi"
 MD_antarctica.5.d:0 "Antlaşma gözlemcileri Antarktika araştırma istasyonumuzdaki denetimi tamamladı ve nükleer silah araştırmasının tespit edildiğini bildirdi. Bu, Antarktika Antlaşması'nın ağır bir ihlalidir ve derhal diplomatik sonuçlara yol açacaktır. Antlaşmanın Danışman Tarafları bu konuyu ele almak ve sorumluları eylemlerinden hesap vermeye çağırmak için kararlı adım atacak; istasyonumuzdaki tüm nükleer araştırma faaliyetlerinin derhal durdurulmasını talep ediyor."
 MD_antarctica.5.a:0 "Bundan derhal kurtulmalıyız!"
 MD_antarctica.6.t:0 "Antarktika Antlaşması İhlali: Çok Fazla İhlal"
 MD_antarctica.6.d:0 "Sayın [ROOT.GetLeader],\n\nÜlkeniz [ROOT.GetName] için, toplam [?antarctica_station_reports] ihlalle Antarktika Antlaşması'nı çok fazla kez ihlal ettiğinizi üzülerek bildiririz. Bunun sonucunda Antlaşmanın Danışman Tarafları, [ROOT.GetName] ülkesini 2 yıl içinde antlaşmadan çıkarmaya ve ağır diplomatik sonuçlar uygulamaya karar verdi. Antlaşmanın ilke ve düzenlemelerinin tekrarlanan ihlalleri anlaşmanın bütünlüğünü zedeledi ve Antarktika'nın eşsiz ekosisteminin korunmasını tehdit etti. Bu meseleyi ciddiye almanızı ve üyeliğiniz iptal edilmeden önce araştırma istasyonunu kaldırmanızı rica ederiz.\n\nSaygılarımızla,\nAntarktika Antlaşması Danışman Tarafları"
 MD_antarctica.6.a:0 "Bunu kendi başımıza getirdik"
 MD_antarctica.7.t:0 "[FROM.GetName] Ülkesine Ambargo Uygulansın mı?"
 MD_antarctica.7.d:0 "[FROM.GetAdjective] Antarktika araştırma istasyonlarından birinde nükleer silah araştırmasının yakın zamanda tespit edilmesi nedeniyle Antarktika Antlaşması Danışman Tarafları, [FROM.GetName] ülkesine ambargo uygulamayı değerlendiriyor. Bu, antlaşmanın ilke ve düzenlemelerinin ihlaline karşılık olarak [FROM.GetName] ile ticari ve diplomatik ilişkilerin kısıtlanması anlamına gelir."
 MD_antarctica.7.a:0 "Eylemlerinin bedelini ödemeli"
 MD_antarctica.7.b:0 "Buna değmez"
 MD_antarctica.9.t:0 "Antarktika İstasyonu Modülü Hasar Gördü"
 MD_antarctica.9.d:0 "Antarktika araştırma istasyonlarımızdan birindeki bir modül kar fırtınası nedeniyle hasar gördü. Mühendisler onarımlara hazırlanıyor ve hava koşulları düzelir düzelmez başlayacak.\n\nOnarımlar kar fırtınası bittiğinde başlar (§Y[?global.antarctica_blizzard_days_remaining|0]§! gün fırtına kaldı) ve tamamlanması §Y14§! gün sürer. Kalan süreyi istasyon görünümünde ve hasarlı modülün ipucunda görebilirsiniz."
 MD_antarctica.9.a:0 "Lanet hava!"
 MD_antarctica.10.t:0 "İlhak edilen ülkenin Antarktika Araştırma İstasyonu söküldü"
 MD_antarctica.10.d:0 "Araştırma İstasyonu bulunan ülke ilhak edildiği için istasyon söküldü."
 MD_antarctica.10.a:0 "Tamam"
 ANT_nukes_research_discovered_idea:0 "Antarktika İstasyonunda Nükleer Silah Araştırması Ortaya Çıktı"
 ANT_nukes_research_discovered_idea_desc:0 "Bu ülke, nükleer silahlarla ilgili araştırma yaparak Antarktika'da askerî araştırmanın tümüyle yasaklanması ilkesini ihlal etti."
 antarctica_small_treaty_admin_cost_1:0 "Antarktika Küçük Antlaşma İdaresi"
 antarctica_small_treaty_admin_cost_1_desc:0 "Bu ülke bir Antarktika küçük antlaşması (CCAS ya da CCAMLR) imzaladı ve siyasi eylemler için idari yükü artırdı."
 antarctica_small_treaty_admin_cost_2:0 "Genişletilmiş Antarktika Antlaşması İdaresi"
 antarctica_small_treaty_admin_cost_2_desc:0 "Bu ülke her iki Antarktika küçük antlaşmasını (CCAS ve CCAMLR) imzaladı ve daha geniş antlaşma idaresi ile uyum kaynakları gerektiriyor."
 ANT_kicked_from_treaty_idea:0 "Antarktika Antlaşması'ndan Atıldı"
 ANT_kicked_from_treaty_idea_desc:0 "Antarktika Antlaşması'nın tekrarlanan ihlalleri nedeniyle bu ülke anlaşmadan dışlandı ve önümüzdeki iki yıl boyunca yeniden katılamaz."
 ANT_illegal_extraction_idea:0 "Antarktika Yasa Dışı Kaynak Çıkarımı"
 ANT_illegal_extraction_idea_desc:0 "Diğer ülkelerle ilişkilerimiz daha kötü çünkü buzlu bir çorak arazinin güzel manzarasını korumak için değerli kaynakları ticaret dışı bırakmak istemeyen azınlıktanız. Onlar o donmuş blokla fazla ilgileniyor."
 ANT_military_training_idea:0 "Antarktika Yasa Dışı Askerî Eğitim"
 ANT_military_training_idea_desc:0 "Askerlerimizi bir kış taarruzuna hazırlamak için Antarktika'dan daha iyi bir yer yok."
