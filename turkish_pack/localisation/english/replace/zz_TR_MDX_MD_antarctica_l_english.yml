 ANTARCTICA_STATION_FIND_OR_CREATE_TEXT_DELAYED:0 "§YEtkiler:§!\nAntarktika istasyonunuzu seçer ve planını açar.\n\nBir istasyonu kontrol etmiyorsanız iç bölgede istasyon kurulumunu başlatır.\n- Kurulum Maliyeti: §R$15,00 milyar§! (Antarktika kışında iki katı).\n- Kurulum Süresi: §Y45 gün§! (Antarktika kışında iki katı).\n\nKalan kurulum süresi: §Y[?antarctica_station_setup_days_remaining|0]§! gün."
