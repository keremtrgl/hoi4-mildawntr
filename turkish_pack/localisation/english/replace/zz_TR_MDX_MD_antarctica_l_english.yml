 ANTARCTICA_STATION_SEND_SUPPLIES_TEXT:0 "Malzeme Gönder"
 ANTARCTICA_STATION_SEND_SUPPLIES_TEXT_DELAYED:0 "§YÖn Koşullar:§!\n[!antarctica_station_send_supplies_button_click_enabled]\n§YEtkiler:§!\nİstasyonu azami yakıt kapasitesine kadar doldurur.\nMaliyet: §R1000 yakıt başına $0,25 milyar§! (Antarktika kışında iki katı).\nHazineden sipariş anında tahsil edilir, yakıt teslimat süresinin ardından gelir.\n\n§YTeslimat süresi:§! §G15 gün (Kasım-Mart)§! ya da §R30 gün (Nisan-Ekim)§!."
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT:0 "Gözlemci Gönder"
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT_DELAYED:0 "§YÖn Koşullar:§!\n[!antarctica_station_send_observers_button_click_enabled]§YKar Fırtınası Durumu:§! [MD_antarctica_observer_blizzard_status]\n\n§YEtkiler:§!\nSeçili istasyona bir gözlemci görevi gönderir.\nHedef ülkeye hemen bildirilir.\nGözlemciler §Y7 gün§! sonra varır ve yasa dışı laboratuvar faaliyetlerini ya da Açık Döngü Tesisleri kullanımını denetler."
