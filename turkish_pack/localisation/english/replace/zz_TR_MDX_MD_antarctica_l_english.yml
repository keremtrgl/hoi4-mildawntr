 leave_antarctica_treaty_warning_tt:0 "§RUYARI:§!\n§CAntarktika§!'da bir §YAraştırma İstasyonu§! varken §CAntarktika Antlaşması§!'ndan ayrılmak, Antlaşma üyelerinden olası yaptırımlar ve diplomatik tepki dahil küresel bir karşılık görmenize yol açar. Olumsuz sonuçlardan kaçınmak için antlaşmadan ayrılmadan önce §CAntarktika§!'daki tüm araştırma istasyonlarının sökülmesi önerilir.\n\nYine de istasyon varken Antlaşma'dan ayrılmayı seçerseniz hiçbir madde sizi §CAntarktika§!'da kaynak sömürüsü ya da askerî varlık gibi yasaklı faaliyetlere başlamaktan alıkoyamaz; bu da ülkenizin küresel itibarı için ağır sonuçlara yol açabilir.\n\n§YAntlaşma Sonrası Antarktika Faaliyetleri§! kararları yalnızca ayrılma §Y2 yıl§! sonra tamamlandığında ve o sırada bir §YAraştırma İstasyonu§! kalmışsa açılır."
