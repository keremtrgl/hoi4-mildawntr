 antarctica_join_ccas_effect_tt:0 "§YCCAS§!'a katıl.\nİlgili laboratuvar çıktılarını §G+%20§! artırır:\n- §YGen Teknolojisi§! çıktısı\n- Sağlık Maliyeti Çarpanı çıktısı\n- Aylık Nüfus çıktısı\nÖrnek: §Y+%8,0§! Gen, §G+%9,6§! olur."
