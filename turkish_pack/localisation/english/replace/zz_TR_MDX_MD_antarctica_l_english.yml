 antarctica_reports_warning_tt:0 "§RUyarı:§!\nRapor sayısı 7'yi aşarsa Antarktika Antlaşması Danışman Tarafları ülkenize karşı ağır yaptırımlar ve varsa ATDT statüsü kaybı dahil diplomatik adımlar atabilir. Olumsuz sonuçlardan kaçınmak için rapor sayısını 7'nin altında tutmanız önerilir.\n\nNükleer araştırma tespit edilmişken bu sınır aşılırsa her Antarktika Antlaşması ülkesi, ülkenize ambargo uygulaması için bir olay alır."
