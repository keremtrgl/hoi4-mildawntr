l_english:
 track_HVTs:0 "Yüksek Değerli Hedefleri Bul"
 track_HVTs_desc:0 "[FROM.GetNameDef] içinde faaliyet gösteren birkaç §Y[name_of_org_disp]§! komutanı olma ihtimali var. Bu komutanları ortadan kaldırmak için önce kesin konumlarını belirlemek üzere istihbarat ajanları kullanmalıyız."
 OPERATION_TOKEN_HVT:0 "Yüksek Değerli Hedef Konumu"
 OPERATION_TOKEN_HVT_DESC:0 "Yüksek değerli hedefin yerini tespit etti."
 OPERATION_TOKEN_FOREIGN_ADVISOR:0 "Yabancı Danışman"
 OPERATION_TOKEN_FOREIGN_ADVISOR_DESC:0 "Hedefte yabancı danışman var."
 ct_track_HVTs:0 "Yüksek Değerli Hedefleri Tespit Et"
 ct_track_HVTs_desc:0 "Ajanlarımız cihatçı komutanları bulmak için yerel muhbirleri ve sinyal istihbaratını birlikte kullanacak. Bu bilgi sonra gelecekteki bir operasyona hazırlık için karargâha iletilecek."
 ct_track_HVTs_outcome:0 "Ajanlarımız yerel muhbirler ve cihatçı haberleşmesinin başarılı izlenmesi sayesinde önemli bir cihatçı komutanın konumunu elde etmeyi başardı."
 ct_track_HVTs_outcome_fail:0 "§RCihatçı militanlar ajanlarımızın operasyonundan haberdar oldu ve önemli komutanları bulmalarına fırsat vermeden onları ücra bir yerde pusuya düşürdü. Pusu başladığında ajanlarımızla bağlantımız koptu.§!"
 locate_training_camps:0 "Eğitim Kamplarını Tespit Et"
 locate_training_camps_desc:0 "§Y[name_of_org_disp]§!, [FROM.GetNameDef] topraklarını örgüt ve faaliyetleri için eğitim sahası olarak kullanıyor olabilir. Sahadaki personelin yürüteceği dikkatli istihbarat operasyonları bu tesislerin yerini hedef alınmak üzere tespit edebilir."
 locate_regional_headquarters:0 "Terör Örgütü Karargâhını Tespit Et"
 locate_regional_headquarters_desc:0 "Dikkatli istihbarat toplama ve operasyonlar sayesinde, §Y[name_of_org_disp]§! örgütünün ana karargâhının ve dolayısıyla üst düzey liderliğinin çoğunun [FROM.GetNameDef] içinde bulunduğunu belirledik. Sığınaklarını tespit edip güçlerini nasıl hareket ettirdiklerini çözebilirsek §Y[name_of_org_disp]§! örgütünü kökten yok edecek bir operasyon yürütebiliriz."
 decapitation_strike:0 "Başsızlaştırma Vuruşunu Koordine Et"
 decapitation_strike_desc:0 "Artık bir [FROM.GetAdjective] komutanın yeri tespit edildiğine göre, onu ortadan kaldırmak için hassas bir hava saldırısını yönlendirecek sahadaki ajanları kullanabiliriz. Hava saldırıları ajanlarımız için özel kuvvet baskınlarına göre daha az risklidir, ancak istihbarat sağlamaz ve hedefi ıskalayıp sivil kayıplara yol açma ihtimali daha yüksektir."
 ct_drone_strike:0 "Dron Vuruşu Çağır"
 ct_drone_strike_desc:0 "Ajanlarımız hedefin konumuna hâkim bir gözlem noktasına ilerleyecek. Hedef kesin olarak tanımlandığında ajanlarımız hedefi lazerle işaretleyip vuruş çağıracak. Yakındaki üslerimizden birinden bir insansız hava aracı hedefi ortadan kaldırmak için konuma ilerleyecek."
 ct_drone_strike_outcome:0 "Ajanlarımız hedefi kesin olarak tanımladı ve hava saldırısını başarıyla çağırdı. Dron operatörü üsse dönmeden önce birkaç füze fırlattı."
 ct_drone_strike_outcome_fail:0 "§RAjanlarımız gözlem noktasına ulaşamadan cihatçı militanların saldırısına uğradı ve karargâhla bağlantıları koptu.§!"
 ct_helicopter_strike:0 "Helikopter Vuruşu Çağır"
 ct_helicopter_strike_desc:0 "Ajanlarımız hedefin konumuna hâkim bir gözlem noktasına ilerleyecek. Hedef kesin olarak tanımlandığında ajanlarımız hedefi lazerle işaretleyip vuruş çağıracak. Yakındaki üslerimizden birinden bir taarruz helikopteri hedefi ortadan kaldırmak için konuma ilerleyecek."
 ct_helicopter_strike_outcome:0 "Ajanlarımız hedefi kesin olarak tanımladı ve hava saldırısını başarıyla çağırdı. Helikopter pilotu üsse dönmeden önce birkaç füze fırlattı."
 ct_helicopter_strike_outcome_fail:0 "§RAjanlarımız gözlem noktasına ulaşamadan cihatçı militanların saldırısına uğradı ve karargâhla bağlantıları koptu.§!"
 ct_fighter_strike:0 "Jet Vuruşu Çağır"
 ct_fighter_strike_desc:0 "Ajanlarımız hedefin konumuna hâkim bir gözlem noktasına ilerleyecek. Hedef kesin olarak tanımlandığında ajanlarımız hedefi lazerle işaretleyip vuruş çağıracak. Yakındaki üslerimizden birinden bir savaş jeti hedefi ortadan kaldırmak için konuma ilerleyecek."
 ct_fighter_strike_outcome:0 "Ajanlarımız hedefi kesin olarak tanımladı ve hava saldırısını başarıyla çağırdı. Savaş pilotu üsse dönmeden önce birkaç füze fırlattı."
 ct_fighter_strike_outcome_fail:0 "§RAjanlarımız gözlem noktasına ulaşamadan cihatçı militanların saldırısına uğradı ve karargâhla bağlantıları koptu.§!"
 terror.17.t:0 "[FROM.FROM.GetName] Komutanı [FROM.GetAdjective] Hava Saldırısında Öldürüldü"
 terror.17.d1:0 "[FROM.GetAdjective] uçaklar, istihbarat servislerimizin yardımıyla önde gelen bir [FROM.FROM.GetAdjective] cihatçı lideri bulup ortadan kaldırmayı başardı. Analistlerimiz, onun ortadan kalkmasının [FROM.FROM.GetNameDef] faaliyetlerini önemli ölçüde engelleyeceği, bölgede radikal köktendinci teröristlerin yarattığı tehdidi azaltacağı görüşünde."
 terror.17.d2:0 "Korkakça bir hava saldırısıyla vurulan cesur komutanımıza ağır bir yürekle veda etmek zorundayız. Onun fedakârlığını da, onu bu dünyadan alan alçakları da asla unutmayacağız."
 terror.17.a:0 "Görev tamamlandı."
 terror.17.b:0 "Huzur içinde yatsın!"
 terror.18.t:0 "Yanlış Teşhis Sivil Kayıplara Yol Açtı"
 terror.18.d:0 "Ajanlarımız hedeflerinin başarıyla ortadan kaldırıldığını bildirse de son raporlar durumun böyle olmadığını gösteriyor. Hatalı istihbarat ve beceriksizliğin birleşimi, yanlış yerde yanlış zamanda bulunan birkaç sivilin ölümüne yol açtı. Bu hata kaçınılmaz olarak yerel halkın cihatçı davaya duyduğu sempatiyi artıracaktır, ancak yurt içindeki etkisi olaya karışmayı inkâr ederek hafifletilebilir."
 terror.18.a:0 "Sorumluluğu kabul et."
 terror.18.b:0 "Karışmayı inkâr et."
 kill_or_capture_raid:0 "Öldür veya Yakala Baskını Yap"
 kill_or_capture_raid_desc:0 "Artık yüksek rütbeli bir [FROM.GetAdjective] cihatçının yerini tespit ettiğimize göre, komutanı öldürmek veya yakalamak için seçkin bir özel kuvvet birliği gönderebiliriz. Yüksek değerli hedefi yakalamak, başka bir hedefin konumu gibi cihatçı faaliyetler hakkında bize yararlı istihbarat sağlayacaktır."
 helicopter_infiltration:0 "Helikopterle Sızma"
 helicopter_infiltration_desc:0 "Ajanlarımız üslerimizden birinde helikopterlere binecek, helikopterler ardından hedef konuma ilerleyecek. Ajanlar halatla yere inecek ve ardından hedefe doğru ilerleyecek."
 helicopter_infiltration_outcome:0 "Ajanlarımız ıssız bir noktada helikopter nakliyelerinden başarıyla inip hedefe doğru ilerledi."
 helicopter_infiltration_outcome_failure:0 "Ajanlarımız helikopter nakliyelerinden inmeye çalışırken düşman ateşine maruz kaldı ve karargâhla bağlantıları koptu."
 helicopter_exfiltration:0 "Helikopterle Tahliye"
 helicopter_exfiltration_desc:0 "Ajanlarımız önceden belirlenmiş bir iniş bölgesine ilerleyecek ve konumlarını bildirmek için dumanlı işaret fişeği atacak. Nakliye helikopterleri ardından ajanları alıp üsse dönecek."
 helicopter_exfiltration_outcome:0 "Ajanlarımız iniş bölgesini güvene almayı ve helikopter pilotlarına işaret vermeyi başardı; pilotlar onları alıp üsse döndü."
 helicopter_exfiltration_outcome_failure:0 "Helikopter pilotlarımız iniş bölgesine ulaşmadan ajanlarımız tarafından uyarıldı ve tahliye iptal edildi. Bunun, iniş bölgesinin düşman tarafından ele geçirilmiş olmasından kaynaklandığı çok yüksek ihtimal."
 raid_compound:0 "Yerleşkeye Baskın"
 raid_compound_desc:0 "Ajanlarımız ve özel kuvvet personeli gece karanlığının örtüsü altında yüksek değerli hedefin bulunduğu yerleşkeye baskın düzenleyecek. Mümkünse hedefi yakalama, değilse öldürme görevi verilecek."
 raid_compound_outcome:0 "Personelimiz yerleşkeye başarıyla baskın düzenleyerek şüpheli militanların çoğunu öldürdü ve hiç kayıp vermedi."
 raid_compound_outcome_failure:0 "Cihatçılar baskınımızdan haberdar edilmişti ve ajanlarımız için bir tuzak hazırlamıştı. Özel kuvvet personelimiz kargaşada yanlarındaki ajanları bulamadı ve cihatçıların karşı saldırısı yüzünden onlarsız çekilmek zorunda kaldı."
 terror.19.t:0 "[FROM.FROM.GetName] Komutanı [FROM.GetAdjective] Baskınının Ardından Etkisiz Hale Getirildi"
 terror.19.d1:0 "Özel harekât kuvvetlerimiz, önde gelen bir [FROM.FROM.GetAdjective] komutanı yakalamayı başardıklarını doğruladı. Bu, komutanın yokluğuna uyum sağlamak için çabaladığı bildirilen [FROM.FROM.GetNameDef] için önemli bir darbe oldu. Üstelik esirimiz örgütünün faaliyetleri hakkında şimdiden yararlı bilgiler verdi."
 terror.19.d2:0 "Mücadelemizin başına felaket geldi: komutanlarımızdan biri düşman tarafından yakalandı. Savaşçılarımızın davaya sadakatine güvensek de örgütümüz hakkında düşmanın bize karşı kullanabileceği bilgileri vermek zorunda bırakılmış olma ihtimalini göz ardı etmemeliyiz."
 terror.19.d3:0 "Özel harekât kuvvetlerimiz, [FROM.FROM.GetAdjective] yüksek değerli hedefin çatışmada öldürüldüğünü doğruladı. Komutanın ölümü, onun yokluğuna uyum sağlamak için çabaladığı bildirilen [FROM.FROM.GetNameDef] için önemli bir darbe oldu. Ancak onu sağ yakalayarak elde edebileceğimiz ek istihbaratı alamadık."
 terror.19.d4:0 "Mücadelemizin başına felaket geldi: komutanlarımızdan biri düşman tarafından öldürüldü. Cesur komutanımızın düşman eline düşmektense kendini öldürdüğü bildirildi; ahirette kuşkusuz ödüllendirileceği takdire değer bir davranış."
 terror.19.b:0 "Umarız ağzını sıkı tutar..."
 terror.20.d:0 "Özel kuvvet baskınımızın hedefine ulaşamadığı giderek netleşti. Ölenlerin çoğunun cihatçı militan değil sivil olduğu ortaya çıktı ve baskının ortadan kaldırması gereken hedef ortalıkta yoktu. Bu hata kaçınılmaz olarak yerel halkın cihatçı davaya duyduğu sempatiyi artıracaktır, ancak yurt içindeki etkisi olaya karışmayı inkâr ederek hafifletilebilir."
 terror.21.t:0 "Sızıntılar Başarısız Terörle Mücadele Operasyonunun Örtbas Edildiğini Ortaya Çıkardı"
 terror.21.d:0 "Ordu içindeki bir muhbir, yarım yıl önceki başarısız operasyonumuza dair bilgileri ülkemizdeki önde gelen bir haber kuruluşuna iletti. Birden fazla sivilin ölümüyle sonuçlanan yurt dışı operasyonunun örtbas edilmesi kamuoyunda öfkeyle karşılandı."
 terror.21.a:0 "Bu tartışmadan sağ çıkabilir miyiz?"
 locate_arms_caches:0 "Silah Depolarını Tespit Et"
 locate_arms_caches_desc:0 "§Y[name_of_org_disp]§! örgütünün [FROM.GetNameDef] içinde patlayıcı depolarıyla birlikte silah depoları olması muhtemel. Bu silah depolarının çoğu havadan görülemez; bu nedenle gizli depoları bulmak için yerel muhbirleri ve sinyal istihbaratını kullanabilecek sahadaki ajanların bilgisi gerekir."
 OPERATION_TOKEN_ARMS_CACHE:0 "Silah Deposu Konumu"
 OPERATION_TOKEN_ARMS_CACHE_DESC:0 "Gizli bir silah deposunun yerini tespit etti."
 OPERATION_TOKEN_TRAINING_CAMP:0 "Eğitim Kampı Konumu"
 OPERATION_TOKEN_TRAINING_CAMP_DESC:0 "Gizli bir eğitim kampının yerini tespit etti."
 OPERATION_TOKEN_REGIONAL_HEADQUARTERS:0 "Bölge Karargâhı Konumu"
 OPERATION_TOKEN_REGIONAL_HEADQUARTERS_DESC:0 "Gizli bir bölge karargâhının yerini tespit etti."
 strike_arms_caches:0 "Silah Depolarına Vuruşu Koordine Et"
 strike_arms_caches_desc:0 "Artık bir [FROM.GetAdjective] silah deposunun yeri tespit edildiğine göre, onu ortadan kaldırmak için hassas bir hava saldırısını yönlendirecek sahadaki ajanları kullanabiliriz. Hava saldırıları ajanlarımız için özel kuvvet baskınlarına göre daha az risklidir, ancak istihbarat sağlamaz ve hedefi ıskalayıp sivil kayıplara yol açma ihtimali daha yüksektir."
 raid_arms_caches:0 "Silah Depolarına Baskın Düzenle"
 raid_arms_caches_desc:0 "Artık gizli bir [FROM.GetAdjective] silah deposunun yerini tespit ettiğimize göre, onu yok etmek için seçkin bir özel kuvvet birliği gönderebiliriz. Silah deposu, başka bir hedefin konumu gibi cihatçı faaliyetler hakkında yararlı istihbarat da barındırıyor olabilir."
 terror.22.t:0 "[FROM.FROM.GetAdjective] Silah Deposu [FROM.GetAdjective] Hava Saldırısında Yok Edildi"
 terror.22.d1:0 "[FROM.GetAdjective] uçaklar, istihbarat servislerimizin yardımıyla önemli bir cihatçı silah deposunu bulup yok etmeyi başardı. Analistlerimiz, depo yok edilmesinin [FROM.FROM.GetNameDef] faaliyetlerini engelleyeceği, bölgede radikal köktendinci teröristlerin yarattığı tehdidi azaltacağı görüşünde."
 terror.22.d2:0 "Silah depolarımızdan biri düşman hava saldırısıyla yok edildi ve örgütümüzün faaliyetlerini aksattı."
 terror.22.b:0 "Mücadelemiz yine de sürüyor..."
 terror.23.t:0 "[FROM.FROM.GetAdjective] Silah Deposu [FROM.GetAdjective] Baskınında Yok Edildi"
 terror.23.d1:0 "Özel harekât kuvvetlerimiz büyük bir [FROM.FROM.GetAdjective] silah deposunu yok etmeyi başardıklarını doğruladı. Bu, [FROM.FROM.GetNameDef] savaş çabasına önemli bir darbe indirdi. Ne yazık ki ajanlarımız silah deposundan işe yarar bir istihbarat elde edemedi."
 terror.23.d2:0 "Düşman kuvvetleri gizli silah depolarımızdan birini yok ederek savaş çabamıza darbe indirdi. Neyse ki depoyu yok etmeden önce içinden işe yarar bir istihbarat elde edememişler gibi görünüyor."
 terror.23.d3:0 "Özel harekât kuvvetlerimiz büyük bir [FROM.FROM.GetAdjective] silah deposunu yok etmeyi başardıklarını doğruladı. Bu, [FROM.FROM.GetNameDef] savaş çabasına önemli bir darbe indirdi. Üstelik ajanlarımız silah deposundan işe yarar istihbarat elde etmeyi başardı."
 terror.23.d4:0 "Düşman kuvvetleri gizli silah depolarımızdan birini yok ederek savaş çabamıza darbe indirdi. Daha da kötüsü, depoyu yok etmeden önce içinden işe yarar istihbarat elde etmeyi başarmış görünüyorlar. Bize yönelik daha fazla [FROM.GetAdjective] operasyona hazırlıklı olmalıyız."
 raid_cache:0 "Silah Deposuna Baskın Yap"
 raid_cache_desc:0 "Ajanlarımız cihatçı silah deposuna yapılacak baskında özel harekât kuvvetlerine eşlik edecek. Asgari bir direniş bekliyoruz. Personelimiz silah deposunun denetimini ele geçirdiğinde, onu patlayıcılarla yok etmeden önce işe yarar istihbarat için arayacak."
 raid_cache_outcome:0 "Ajanlarımız, silah deposunun bulunduğu bildirilen köye baskın düzenleyerek birkaç şüpheli cihatçıyı öldürdü."
 raid_cache_outcome_failure:0 "Ajanlarımız silah deposuna ulaşmadan önce cihatçı militanlardan beklenmedik ölçüde direnişle karşılaştı ve özel kuvvetlerimizi aceleyle geri çekilmeye zorladı. Karışıklıkta özel kuvvet personeli yanlarındaki ajanlarla bağlantıyı kaybetti."
 increase_graft:0 "Yolsuzluğu Artır"
 increase_graft_desc:0 "[FROM.GetName] ülkesinde nüfuzumuzu artırma operasyonlarımızın zaman alıcı ve pahalı olduğu görüldü; belki rüşvete daha açık olsalardı bu daha hızlı gidebilirdi..."
 increase_graft_cost:0 "Yolsuzluk Maliyetini Artır"
 lobbying_government:0 "Hükümete Lobi Yap"
 lobbying_government_desc:0 "[FROM.GetNameDef] içindeki konumumuz erişim sağlar, erişim de milletvekillerini satın alır. Bakanlıklara ve yasama organına yönelik sürekli bir maaş, sinekür ve sessiz ayrıcalık kampanyası, [FROM.GetAdjective] siyasetçilerin nüfuzumuzla yüzleşme iştahını bırakmayacak ve bunun için ayıracak oyları da kalmayacak."
 lobbying_government_outcome_tt:0 "§Y180§! gün boyunca [FROM.GetNameWithFlag] §Ryabancı nüfuzla mücadele§! edemez ve özellikle nüfuzumuza §Rsaldıramaz§!.\n"
 sabotage_aramco:0 "Aramco'ya Sabotaj Yap"
 sabotage_aramco_desc:0 "Suudi ekonomisine ağır bir darbe indirmek için Yemen ve Arabistan'daki nüfuzumuzu kullanacağız."
 blow_nahariya_weapon_storage:0 "Nahariya Silah Deposunu Vur"
 blow_nahariya_weapon_storage_desc:0 "Siyonist rejimdeki istihbarat nüfuzumuz arttı, savaşı kimin kazanacağını onlara göstermenin zamanı geldi..."
 blow_turkey_iraqi_base:0 "Türkiye-Irak Üssünü Vur"
 blow_turkey_iraqi_base_desc:0 "Türkiye'deki istihbarat nüfuzumuz arttı, bunu birliklerine zarar vermek için kullanabiliriz."
 blow_baku_gas_canals:0 "Bakü Gaz Kanallarını Vur"
 blow_baku_gas_canals_desc:0 "Azerbaycan'daki istihbarat nüfuzumuz arttı, bunu ekonomilerine zarar vermek için kullanabiliriz."
 ct_intel_raid_tt:0 "Bu istihbarat operasyonunu tamamlamak, bu ülkede yürütülebilecek bir §YÖzel Kuvvetler Baskınının§! kilidini açacak."
