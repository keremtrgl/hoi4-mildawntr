 bankruptcy_default_on_debts_tt:0 "Borcumuzun §Y%25§!'i hemen tasfiye edilecek. Borcumuzun §Y%50§!'si temerrüde taşınacak. Bu temerrüde düşmüş borçtan kurtulmanın bir yolunu bulmak için §Y360 günümüz§! olacak. §RZamanında bir çözüm bulamazsak, nüfuz sahibi ülkeler parayı zorla tahsil etmeye çalışabilir§!\n\n"
