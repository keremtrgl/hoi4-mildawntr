 arms_industry_stipends_tt:0 "§YSilah Sanayii Teşvikleri§!"
 arms_industry_stipends_delayed_tt:0 "Yerel silah şirketlerinin kurulmasını teşvik etmek işleri gerçekten hareketlendirebilir!\n\n§YÖn Koşullar:§!\n[!arms_industry_stipends_click_enabled]\n§YEtkiler:§!\n[!arms_industry_stipends_click]"
 retool_shipyards_tt:0 "§YTersaneleri Yeniden Donat§!"
 retool_shipyards_delayed_tt:0 "Sivil tersaneleri yeniden donatmak, ordumuzun düşmanlarımıza karşı kullanacağı daha fazla savaş gemisi inşa etmesine yardımcı olabilir.\n\n§YÖn Koşullar:§!\n[!retool_shipyards_click_enabled]\n§YEtkiler:§!\n[!retool_shipyards_click]"
 agro_industrial_expansion_tt:0 "§YTarımsal Sanayi Genişlemesi§!"
 agro_industrial_expansion_delayed_tt:0 "Tarım bölgelerimizi modernize etmek mahsul verimini artıracak ve gıda güvenliğimizi güçlendirecek.\n\n§YÖn Koşullar:§!\n[!agro_industrial_expansion_click_enabled]\n§YEtkiler:§!\n[!agro_industrial_expansion_click]"
 advanced_manufacturing_tt:0 "§Yİleri İmalat§!"
 advanced_manufacturing_delayed_tt:0 "İleri imalata yatırım yapmak, yüksek teknolojili sanayi tabanımızı hızlandıracak.\n\n§YÖn Koşullar:§!\n[!advanced_manufacturing_click_enabled]\n§YEtkiler:§!\n[!advanced_manufacturing_click]"
 energy_grid_modernization_tt:0 "§YEnerji Şebekesi Modernizasyonu§!"
 energy_grid_modernization_delayed_tt:0 "Modernize edilmiş bir enerji şebekesi ışıkları yanık, fabrikaları çalışır tutar.\n\n§YÖn Koşullar:§!\n[!energy_grid_modernization_click_enabled]\n§YEtkiler:§!\n[!energy_grid_modernization_click]"
 strategic_defense_infrastructure_tt:0 "§YStratejik Savunma Altyapısı§!"
 strategic_defense_infrastructure_delayed_tt:0 "Savunma altyapımızı güçlendirmek ülkemizi güvende tutacak.\n\n§YÖn Koşullar:§!\n[!strategic_defense_infrastructure_click_enabled]\n§YEtkiler:§!\n[!strategic_defense_infrastructure_click]"
