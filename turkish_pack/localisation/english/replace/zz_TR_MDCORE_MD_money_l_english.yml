 debt_default_decisions:0 "Borç Temerrüdü"
 debt_default_decisions_desc:0 "Kalan temerrüde düşmüş borcumuzu tasfiye etmenin bir yolunu bulmalıyız.\n\nKalan temerrüt borcu: §Y$[?debt_default_left] milyar§!"
 debt_default_main_mission:0 "Temerrüde Düşmüş Borçlarımızı Öde"
 debt_default_main_mission_desc:0 "Temerrüde düştüğümüz kalan borcu tazmin etmenin, tasfiye etmenin veya ödemenin bir yolunu bulmalıyız"
 debt_default_pay_10_from_treasury:0 "Hazinemizden §Y10 Milyar $§! Öde"
 debt_default_pay_10_from_treasury_desc:0 "Eski borçlarımızı ödemenin bir yolu, yeni borç alıp bununla eskileri kapatmaktır. Elbette alacaklılar, yeniden yüksek borçla yaşamaya başlamamıza izin verecek bu düzenlemeyi kabul etmeyecektir"
 debt_default_pay_50_from_treasury:0 "Hazinemizden §Y50 Milyar $§! Öde"
 debt_default_pay_50_from_treasury_desc:0 "Eski borçlarımızı ödemenin bir yolu, yeni borç alıp bununla eskileri kapatmaktır. Elbette alacaklılar, yeniden yüksek borçla yaşamaya başlamamıza izin verecek bu düzenlemeyi kabul etmeyecektir"
 debt_default_concessions_to_the_imf:0 "§1IMF§!'ye §YSiyasi Tavizler§!"
 debt_default_concessions_to_the_imf_desc:0 "IMF, daha önce düştüğümüz çukura yeniden düşmememiz için sert kemer sıkma önlemleri almamızı talep ediyor. Şartları ağır, ancak dediklerini yapmazsak borçlarımızı tasfiye etmeyi reddediyorlar"
 debt_default_political_concessions_to_biggest_influencer:0 "§Y[?var:FROM.influence_array^0.GetNameWithFlag]§!: §YSiyasi Tavizler§!"
 debt_default_political_concessions_to_biggest_influencer_desc:0 "[?var:FROM.influence_array^0.GetAdjective] hükümetine bazı siyasi tavizler vermeyi kabul edersek, borcumuzun bir kısmını tasfiye etmeye razılar"
 debt_default_political_concessions_to_second_biggest_influencer:0 "§Y[?var:FROM.influence_array^1.GetNameWithFlag]§!: §YSiyasi Tavizler§!"
 debt_default_political_concessions_to_second_biggest_influencer_desc:0 "[?var:FROM.influence_array^1.GetAdjective] hükümetine bazı siyasi tavizler vermeyi kabul edersek, borcumuzun bir kısmını tasfiye etmeye razılar"
 debt_default_sell_civilian_factories:0 "Devlet Sanayilerini §YSat§!"
 debt_default_sell_civilian_factories_desc:0 "Temerrüde düşmüş borcumuzdan kurtulmak için fon toplamamız gerekiyor; bu amaçla inşaat şirketleri, enerji santralleri ve kamu hizmetleri gibi devletin elindeki birincil sektörün bir kısmını tasfiye edip satmalıyız. Ekonomimiz için ağır bir darbe, ama yapılmalı"
 debt_default_dismantle_military_factories:0 "Askeri Sanayiyi §YSök§!"
 debt_default_dismantle_military_factories_desc:0 "Askeri ekipman üreten tesislerimizin bir kısmı, temerrüde düşmüş borcu ödemek için kapatılmalı. Tüm makine ve ekipman diğer ülkelerin ilgisini çekecektir; envanteri yedek parça olarak satabiliriz"
 debt_default_scrap_dockyard:0 "Tersaneleri §YHurdaya Çıkar§!"
 debt_default_scrap_dockyard_desc:0 "Devam eden bazı gemi inşaatlarımız var. İnşaatı durdurup bitmemiş gemileri hurdaya çıkarırsak bu bize bir miktar fon sağlar. Tersane ekipmanının geri kalanını da anlaşmaya dahil etmeliyiz"
 debt_default_cut_down_government_services:0 "Ofis Sektöründe §YKesintiye Git§!"
 debt_default_cut_down_government_services_desc:0 "Bazı devlet hizmeti harcamaları kesilmeli ve kullanılmayan ofis alanları elden çıkarılmalı"
 cheap_loan_from_the_imf_mission:0 "§1IMF§!'den §YUcuz Kredi§!"
 cheap_loan_from_the_imf_mission_desc:0 "IMF, alacaklılarımıza yaptığımız ödemelerdeki dalgalanmayı yönetmemize yardımcı olacak bir kredi limitine erişim sağladı. Bu, faiz oranımızı düşürmemize ve ülkemizi rayına oturtmamıza yardımcı olacak. Gelirimizi, mevcut borcumuzun olası maliyeti dahil giderlerimizin üzerine çıkarmakla görevlendirildik. Süre dolduğunda ödemeye başlamamız beklenecek; aksi hâlde kaybettiğimiz her dönem için devlete ait varlıklarımızı yitireceğiz..."
