 bankruptcy.4.t:0 "[From.GetNameWithFlag] kurtarma talebimizi reddetti!"
 bankruptcy.4.d:0 "[From.GetName] ülkesinde dün gerçekleşen üst düzey görüşmede [From.GetLeader] ile [Root.GetLeader] bir araya geldi; ancak [From.GetAdjective] tarafı ihtiyaçlarımıza tamamen kayıtsız kaldı ve bizi kurtarmayı reddetti. [From.GetName] bize bir şey borçlu değildi, ancak bu ret, onları güvenilir bir ortak olarak görmemizi zedeledi."
