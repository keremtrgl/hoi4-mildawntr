 NUM_STATE_PRODUCTIVITY_DELAYED_DESC:0 "§YEyaletin Aylık Verimlilik Büyümesi:§! [?state_productivity_growth_scaled|3+]\n\nDünya Ortalama Verimliliği: [?global.average_world_productivity|3]\nEyalet Verimliliği: [?productivity_state_var|3]\n§YYerel Büyüme Değiştiricisi:§! [?modifier@state_productivity_growth_modifier|%+1]\n\nPozitif ulusal büyüme (1 + (dünya ortalaması / eyalet verimliliği - 1) ×0,5) ile çarpılır, 0–2 arasıyla sınırlanır, ardından (1 + yerel büyüme değiştiricisi) ile çarpılır. Bu hesapta eyalet verimliliği 100–100.000 arasıyla sınırlıdır.\nUlusal büyüme sıfır veya negatifse bunun yerine eyalet verimliliği / dünya ortalaması ile çarpılır. Bu hesapta dünya ortalaması 100–10.000 arasıyla sınırlıdır ve yerel büyüme değiştiricileri uygulanmaz.\n\nUlusal büyüme ve değiştiricileri için Ekonomi penceresine bakın."
 PERSONAL_INCOME_TAXES:0 "§CHalk Geliri:§!"
 PERSONAL_INCOME_TAXES_TOOLTIP:0 "Halk Vergilerinden Gelen Gelir"
 PERSONAL_INCOME_TAXES_TOOLTIP_DELAYED:0 "Halk Vergileri, vatandaşlarımızdan topladığımız çeşitli vergilerdir. KDV, gelir vergisi, servet vergisi ve şahsi sermaye kazancı vergisi bunlara örnektir. Vergi gelirimiz nüfusumuza ve §YHalk Vergisi Oranımıza§! bağlıdır. §YHalk Geliri§! esas olarak §YEkonomik Döngü§! ve §YYolsuzluk Seviyesinden§! etkilenir. Gelir çeşitli fikirlerle de değişebilir.\n\nİnsanlar vergi yükleri karşılığında hizmet beklediğinden halk vergisinin her §Y%1§!'i istikrarımızı §R-%1§! düşürür.\n\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Vergi Gelirlerine§! etkisi: [?modifier@tax_gain_multiplier_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YHalk Vergisi Gelirine§! etkisi: [?modifier@population_tax_income_multiplier_modifier|+%0]\n"
 CORPORATE_INCOME_TAXES:0 "§LKurumlar Geliri:§!"
 CORPORATE_INCOME_TAXES_TOOLTIP:0 "Kurumlar Vergilerinden Gelen Gelir:\n§YTicari Tarım Bölgelerinden§! $[?agriculture_district_tax|+3]\n§YGeçimlik Tarımdan§! $[?agriculture_tax_gain|+3]\n§YSivil Sanayiden§! $[?civil_fac_tax|+3]\n§YAskeri Sanayiden§! $[?military_fac_tax|+3]\n§YTersanelerden§! $[?dockyard_tax|+3]\n§YOfis Sektörlerinden§! $[?office_tax|+3]\n§YMikroçip Tesislerinden§! $[?microchip_plant_tax|+3]\n§YKompozit Tesislerinden§! $[?composite_plant_tax|+3]\n§YSentetik Rafinerilerden§! $[?synthetic_refinery_tax|+3]\n§YNükleer Reaktörlerden§! $[?nuclear_reactor_tax|+3]\n§YFosil Yakıtlı Santrallerden§! $[?fossil_powerplant_tax|+3]\n§YYenilenebilir Enerji Altyapısından§! $[?renewable_energy_tax|+3]\n§Yİnternet İstasyonlarından§! $[?internet_station_tax|+3]\n§YDemiryolu Terminallerinden§! $[?rail_terminal_tax|+3]\n§YSağlık Hizmetlerinden§! $[?healthcare_tax_gain|+3]"
 CORPORATE_INCOME_TAXES_TOOLTIP_DELAYED:0 "Kurumlar Vergileri, ülkemizde faaliyet gösteren şirketlerden aldığımız vergilerdir. KDV, arazi vergisi ve elbette kâr vergileri bunlara örnektir. Vergi gelirimiz ülkemizdeki §YSivil Sanayi§!, §YAskeri Sanayi§!, §YTersane§!, §YOfis Sektörü§! ve §YTicari Tarım Bölgesi§! sayısına ve §YKurumlar Vergisi Oranımıza§! bağlıdır. §YKurumlar Geliri§! esas olarak §YEkonomik Döngü§! ve §YYolsuzluk Seviyesinden§! etkilenir. Gelir çeşitli fikirlerle de değişebilir.\n\nKurumlar vergisi §YVergi Maliyetimizi§! (inşaat için kullanamadığımız §YSivil Sanayi§! sayısını) belirler ve diğer ülkelerin eyaletlerimize yatırım yapmak için ödemesi gereken parayı da etkiler\n\nYasa, Ulusal Ruh ve Teknolojilerin §YTüm Vergi Gelirlerine§! etkisi: [?modifier@tax_gain_multiplier_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YKurumlar Vergisi Gelirine§! etkisi: [?modifier@corporate_tax_income_multiplier_modifier|+%0]\nVerimliliğin §YKurumlar Vergisi Gelirine§! etkisi: [?productivity_tax_effect_display|+%]\nYasa, Ulusal Ruh ve Teknolojilerin §YOfis Sektörü Vergi Gelirine§! etkisi: [?modifier@office_park_income_tax_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YTersane Vergi Gelirine§! etkisi: [?modifier@dockyard_income_tax_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YSivil Sanayi Vergi Gelirine§! etkisi: [?modifier@civilian_industry_tax_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YAskeri Sanayi Vergi Gelirine§! etkisi: [?modifier@military_industry_tax_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YTicari Tarım Bölgesi Vergi Gelirine§! etkisi: [?modifier@agriculture_district_income_tax_modifier|+%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YMikroçip Tesisi Vergi Gelirine§! etkisi: [?modifier@microchip_plant_income_tax_modifier|+%0]\n\nYasa, Ulusal Ruh ve Teknolojilerin §YKompozit Tesisi Vergi Gelirine§! etkisi: [?modifier@composite_plant_income_tax_modifier|+%0]\n\nYasa, Ulusal Ruh ve Teknolojilerin §YSentetik Rafineri Vergi Gelirine§! etkisi: [?modifier@synthetic_refinery_income_tax_modifier|+%0]\n\nYasa, Ulusal Ruh ve Teknolojilerin §YSağlık Hizmetleri Gelirine§! etkisi: [?modifier@healthcare_income_multiplier_modifier|+%0]\n"
