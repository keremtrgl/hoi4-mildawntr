 lease_military_factories_tt:0 "§YAskeri Fabrikaları Kirala§!"
 lease_military_factories_delayed_tt:0 "Askeri malzemede kendi kendine yeterli üretim geçmişte kaldı. İhtiyaç duyduğumuz malzemeleri üretmek için yurtdışından askeri fabrikalar sözleşmeyle kiralayabiliriz.\n\n§YEk Giderler:§! $§R[?lease_military_factories_cost_display|-3]§!\n\nBu fabrikalar bize §YGSYİH§! veya §YKurumsal Gelir§! sağlamaz\nŞu An Kiralanan Fabrikalar: §Y[?leased_military_factories]§!"
 lease_civilian_factories_tt:0 "§YSivil Fabrika Komplekslerini Kirala§!"
 lease_civilian_factories_delayed_tt:0 "Yabancı inşaat ve imalat şirketlerini istihdam etmek kendi sanayimizi geliştirmemize olanak tanıyacak.\n\n§YEk Giderler:§! $§R[?lease_civilian_factories_cost_display|-3]§!\n\nBu fabrikalar bize §YGSYİH§! veya §YKurumsal Gelir§! sağlamaz\nŞu An Kiralanan Fabrikalar: §Y[?leased_civilian_factories]§!"
 lease_naval_dockyards_tt:0 "§YTersaneleri Kirala§!"
 lease_naval_dockyards_delayed_tt:0 "Donanmamızı genişletmek için yabancı gemi inşa şirketleriyle sözleşme yapabiliriz.\n\n§YEk Giderler:§! $§R[?lease_naval_factories_cost_display|-3]§!\n\nBu fabrikalar bize §YGSYİH§! veya §YKurumsal Gelir§! sağlamaz\nŞu An Kiralanan Fabrikalar: §Y[?leased_dockyards]§!"
 industrial_projects_tt:0 "§YSanayi Projeleri§!"
 industrial_projects_delayed_tt:0 "Yerel sanayi projelerine yatırım yapmak GSYİH'yi ve yerel ekonomik değeri artırmaya yardımcı olabilir.\n\n§YÖn Koşullar:§!\n[!industrial_projects_click_enabled]\n§YEtkiler:§!\n[!industrial_projects_click]"
 service_constructions_tt:0 "§YHizmet Sektörü İnşaatları§!"
