 very_high_interest_country_modifiers_desc:0 "Çok Yüksek Faiz Oranı"
 very_high_interest_country_modifiers_tt:0 "Giderek artan faiz oranları, halkın ve mali kurumların hükümete duyduğu güveni aşındırıyor. Durumu yakında düzeltmezsek işler daha da kötüye gidecek.\n\n"
 debt_default_ecomomic_boom:0 "Temerrüt Sonrası Ekonomik Patlama"
 debt_default_ecomomic_boom_desc:0 "Ülke borcunu ödemeyi reddedip kaosa sürüklendikten sonra yerel para birimi değer kaybetti, enflasyon fırladı, işsizlik arttı ve borsa çöktü. Durumu istikrara kavuşturduğumuza göre, işgücü, mal ve mülk maliyetleri tüm zamanların en düşük seviyesinde olduğu için birçok yabancı aktör bizi ucuz bir yatırım olarak görüyor. Ülkeye yabancı para akın ederken bu, ekonomimiz için kısa süreli bir ivme olacak"
