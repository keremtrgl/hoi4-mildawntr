 bankruptcy_decisions_desc:0 "\n£MAIN_desctext_dept \n\n\n\n[ROOT.GetFlag]§YHükümetimiz§! giderek daha fazla §Rborç§! biriktiriyor. Yakın zamanda bir eşiği aştık ve mevcut §Yborcumuz§! için artık §R%10§!'dan fazla faiz ödüyoruz\n\n§YOyuncuya Not§!: Bu karar kategorisi etkinleştiğinde, ülkenizin borcunu etkileyecek olaylar almaya başlayacaksınız. Bunlar cezalar olabileceği gibi geçici yeniden finansman gibi küçük avantajlar da olabilir.\n\n§YFaiz Oranı§!: [?interest_rate|1]%               §YBorç/GSYİH Oranı§!: §Y[?debt_ratio|-%1]§!\n§YBorca Ödenen Faiz§!: §Y$$§! [?debt_rate|-3]\nFikrin §YFaiz Oranı§! üzerindeki etkisi: [?modifier@interest_rate_multiplier_modifier|-2]%\n\n§YFaiz Oranı§! §Y%10§!'dan yüksek olursa, büyüyen borcumuzu yönetmek için acil durum kararlarına erişim kazanırız. Faiz §Y%15§!'in üzerine çıktığında ekonomimiz yavaşlamaya başlar ve başka olumsuz etkiler de yaşarız. Bu noktada (büyük bir bedel karşılığında) borcumuzu ödemeyi reddetme imkânına kavuşuruz. §YFaiz§! §Y%20§!'yi aştığında elle daha fazla borç alamayız. §YBorç Faizi§! §YGayrisafi Gelirimizi§! aşarsa ülkemiz çöker."
 bankruptcy_cheap_loans_from_imf:0 "§1IMF§!'den §YUcuz Kredi Al§!"
 bankruptcy_cheap_loans_from_imf_desc:0 "Gelişmiş bir ülke olarak IMF ile düşük faizli bir kredi için pazarlık yapabiliriz. Bu yeni kredi paketiyle eski borçlarımızın bir kısmını ödeyeceğiz, ancak IMF bütçemizi dengelememizi talep ediyor. Bu girişimi yürütmek için bir yılımız var; aksi hâlde IMF, borcumuzu devlet mülklerine el koyarak tahsil edecek. Başarılı olmamız şart, yoksa başımız büyük belaya girer.\n\n§YOyuncuya Not§!: Bu görev 365 gün sonra kaldırılır ve başarısız olduğumuz her seferinde yeniden eklenir. Ayrıca aşağıdaki mekanikleri engeller:\n- İç Yatırımlar\n- Uluslararası Yatırımlar."
 bankruptcy_cheap_loans_from_african_investment_fund:0 "§1Afrika Para Fonu§!'ndan §YUcuz Kredi Al§!"
 bankruptcy_cheap_loans_from_african_investment_fund_desc:0 "Afrika Para Fonu'nun kurulmasıyla IMF'den alamayacağımız kredilere erişebiliyoruz. Bu ucuz kredilerle eski borçlarımızın bir kısmını ödeyecek, toplam faizimizi geçici olarak düşüreceğiz. Ancak bu yalnızca geçici bir önlem; bir yıl sonra faiz oranlarımız normale dönecek"
 bankruptcy_seek_bailout_from_biggest_influencer:0 "§YBorç Kurtarma Desteği İste§!: §Y[?var:FROM.influence_array^0.GetNameWithFlag]§!"
 bankruptcy_seek_bailout_from_biggest_influencer_desc:0 "Büyük ekonomik destekçilerimizden borcumuzun bir kısmını üstlenmelerini ve bir kısmını silmelerini isteyebiliriz. Doğal olarak bu, kurtarıcıya üzerimizde büyük bir nüfuz kazandıracaktır"
 bankruptcy_seek_bailout_from_second_biggest_influencer:0 "§YBorç Kurtarma Desteği İste§!: §Y[?var:FROM.influence_array^1.GetNameWithFlag]§!"
 bankruptcy_seek_bailout_from_second_biggest_influencer_desc:0 "Büyük ekonomik destekçilerimizden borcumuzun bir kısmını üstlenmelerini ve bir kısmını silmelerini isteyebiliriz. Doğal olarak bu, kurtarıcıya üzerimizde büyük bir nüfuz kazandıracaktır"
 bankruptcy_seek_bailout_from_neighbour:0 "§YKomşumuzdan Borç Kurtarma Desteği İste§!: §Y[FROM.GetNameWithFlag]§!"
 bankruptcy_seek_bailout_from_neighbour_desc:0 "Borçlarımızın bir kısmı daha zengin komşumuz [FROM.GetNameDef] tarafından verildi. Dost komşumuz olduğuna göre, belki bizi kurtarmasını isteyebiliriz?"
 bankruptcy_seek_bailout_from_overlord:0 "§YHâkim Devletimizden Borç Kurtarma Desteği İste§!: §Y[?overlord.GetNameWithFlag]§!"
 bankruptcy_seek_bailout_from_overlord_desc:0 "Siyasetimizin büyük bir kısmı hâkim devletimiz tarafından kontrol edildiğinden, mali durumumuzdan da onların sorumlu olması doğaldır. Onlardan yardım istemeliyiz"
 bankruptcy_seek_bailout_from_imf:0 "§YBorç Kurtarma Desteği İste§!: §1IMF§!"
 bankruptcy_seek_bailout_from_imf_desc:0 "Son çare olarak IMF'den borç hafifletmesi isteyebiliriz. IMF, dünya çapındaki pek çok finans kuruluşunu temsil ettiği için para kullanımı konusunda çok katıdır. Gelecekte borçlarımızı ödeyebileceğimizden emin olmak için mali politikalarımızda değişiklik yapmamızı talep edecekler."
 bankruptcy_seek_bailout_from_african_monetary_fund:0 "§YBorç Kurtarma Desteği İste§!: §1Afrika Para Fonu§!"
 bankruptcy_seek_bailout_from_african_monetary_fund_desc:0 "Son çare olarak Afrika Para Fonu'ndan borç hafifletmesi isteyebiliriz. IMF'nin aksine Afrika Para Fonu bize ikinci sınıf vatandaş muamelesi yapmayacak."
 bankruptcy_incoming_collapse:0 "§YYaklaşan§! Mali §RÇöküş§!"
 bankruptcy_incoming_collapse_desc:0 "Artık her şey ortada. Hükümetimizin borcuna ödediği faiz o kadar büyüdü ki toplam gelirimizin bile gölgesinde bırakıyor. Bu tam bir kâbus senaryosu ve halkımızı her şeyin kontrol altında olduğuna ikna etmek çok zor olacak"
 bankruptcy_default_on_debts:0 "§RBorçlarımızı§! §YÖdemeyi Reddet§!"
 bankruptcy_default_on_debts_desc:0 "Borçlarımızı ödemeyi reddederek alacaklılarımıza, borcun tamamını ödememizin gerçekçi bir yolu olmadığını bildirmiş oluruz. Bu, ağır borçlu bir ülkenin borç krizini çözmek için başvurabileceği son çaredir. Genellikle borcumuzun bir kısmı alacaklılarımız tarafından tasfiye edilir (silinir); çünkü tam bir çöküşte her şeyi kaybetmektense paranın bir kısmını almayı tercih ederler. Ancak bu, siyasi tavizler vermeden olmaz. Borçlarımızı ödemeyi reddedip alacaklılarımızı hiçbir şekilde tazmin etmemek çok tehlikeli olabilir."
 cheap_loans_from_imf_tt:0 "§1IMF§!, ekonomimizi düzeltmek için §YPotansiyel Giderlerimizi§! §YPotansiyel Gelirimizin§! altına çekmemizi isteyecek. Önümüzdeki yıl boyunca borçlarımızın faizini ödemek zorunda olmayacağız; ancak bunu başaramazsak devlete ait varlıklarımızı kaybederek cezalandırılacağız."
 cheap_loans_from_amf_tt:0 "[THIS.GetNameWithFlag] §YBorcu§! $§R[?debt_addition|0]§! §Ymilyar§! artacak, ancak §YFaiz Oranı§! bir yıl boyunca §G-%3§! düşecek"
 bankruptcy_seek_bailout_from_biggest_influencer_tt:0 "[?var:FROM.influence_array^0.GetNameDef] ülkesinden §Y$[ROOT.debt_bailout_20_preview] milyar§! tutarındaki borcumuzu üstlenmesini isteyeceğiz. Toplamın dörtte üçünü ödeyecek, kalanı tasfiye edilecek. [?var:FROM.influence_array^0.GetNameDef] ülkesinin borcu ödeme istekliliği kendi mali durumuna bağlı olacak.\n\nAnlaşmayı kabul ederse bizim üzerimizde §R%15§! nüfuz kazanacak!\n\n"
 bankruptcy_seek_bailout_from_second_biggest_influencer_tt:0 "[?var:FROM.influence_array^1.GetNameDef] ülkesinden §Y$[ROOT.debt_bailout_15_preview] milyar§! tutarındaki borcumuzu üstlenmesini isteyeceğiz. Toplamın üçte ikisini ödeyecek, kalanı tasfiye edilecek. [?var:FROM.influence_array^1.GetNameDef] ülkesinin borcu ödeme istekliliği kendi mali durumuna bağlı olacak.\n\nAnlaşmayı kabul ederse bizim üzerimizde §R%10§! nüfuz kazanacak!\n\n"
 bankruptcy_seek_bailout_from_neighbour_tt:0 "[FROM.GetNameDef] ülkesinden §Y$[ROOT.debt_bailout_10_preview] milyar§! tutarındaki borcumuzu üstlenmesini isteyeceğiz. Toplamın yarısını ödeyecek, kalanı tasfiye edilecek. [FROM.GetNameDef] ülkesinin borcu ödeme istekliliği kendi mali durumuna bağlı olacak.\n\nAnlaşmayı kabul ederse bizim üzerimizde §R%5§! nüfuz kazanacak!\n\n"
 bankruptcy_seek_bailout_from_overlord_tt:0 "[?overlord.GetNameDef] ülkesinden §Y$[ROOT.debt_bailout_50_preview] milyar§! tutarındaki borcumuzu üstlenmesini isteyeceğiz. Toplamın yarısını ödeyecek, kalanı tasfiye edilecek. [?overlord.GetNameDef] ülkesinin borcu ödeme istekliliği kendi mali durumuna bağlı olacak.\n\nAnlaşmayı kabul ederse bizim üzerimizde §R%5§! nüfuz kazanacak!\n\n"
 bankruptcy_seek_bailout_from_imf_tt:0 "IMF ile iletişime geçip borcumuzun §Y$[ROOT.debt_bailout_10_preview] milyar§! kadarını tasfiye etmelerini ve bir yıl boyunca bize daha düşük bir faiz oranı vermelerini isteyeceğiz. Karşılığında mali politikalarımızı değiştirmemizi isteyecekler. §RTaleplerini reddedersek geçici olarak daha yüksek bir faiz oranıyla cezalandırılırız!§!\n\n"
 bankruptcy_seek_bailout_from_amf_tt:0 "Afrika Para Fonu ile iletişime geçip borcumuzun §Y$[ROOT.debt_bailout_10_preview] milyar§! kadarını tasfiye etmelerini isteyeceğiz. Ancak bunu yılda yalnızca bir kez yapmamıza izin verecekler.\n\n"
 bankruptcy_seek_bailout_from_imf_low_gdp_per_capita_tt:0 "§RKişi Başı GSYİH'miz 5 bin$'ın altında olduğu için normalden daha ağır talepler alacağız!§!"
