 MAXIMUM_MIGRATION_RATE_TT_DELAYED:0 "§YAzami Göç Oranı§!, ülkeye yönelik toplam potansiyel §YGöçtür§!. §YEkonomik Döngü§!, §YVerimlilik§!, §YMevcut İktidar Partisi§!, §Yİşçi Karşılama§!, §Yİşsizlik Oranı§!, §YSavaş Desteği§! ve savaşta olup olmadığınıza göre değişir. Bu değer yukarıdaki ölçütler dışında doğrudan artırılamaz; §YGöç Yasanızı§! yükselterek ya da ulusal odaklar, fikirler veya kararlarla §YGöç Oranının§! daha büyük kısmını yakalayabilirsiniz. Ayrıca §YNet Göç Oranınız§!, §YAzami Göç Oranınızın§! §YNet Göç Oranı Değer Çarpanınızla§! değiştirilmiş §YTemel Net Göç Oranı§! ile çarpılmasıyla hesaplanır.\n\n§YAzami Göç Oranını Etkileyenler:§!\n--------------\n§YVerimlilikten Azami§!: [?immigration_productivity_calculations_display|%+]\n§OAzami İşçi Karşılama/İşsizlik Oranı§!: [?immigration_employment_factor_display|%-]\n§Gİktidar Partisi§!: [?immigration_government_factor_display|%+]\n§pSavaştaki Komşulardan Gelen Mülteciler§!: [?neighbour_war_refugees_display|%+]\n§0Savaşta Olmamız Nedeniyle Kendi Mültecilerimiz§!: [?personal_war_refugees_display|%+]\n§LEkonomik Döngü/Fikirler§!: [?modifier@maximum_migration_rate_value|%+]"
