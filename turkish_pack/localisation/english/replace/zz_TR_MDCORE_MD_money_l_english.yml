 News_bankruptcy.3.d:0 "[From.GetName] ülkesinde dün gerçekleşen üst düzey görüşmede [From.GetLeader] ile [Root.GetLeader] bir araya geldi ve [From.GetAdjective] tarafı bizi kurtarmayı vaat etti. Ancak bizi iflastan kurtarmak karşılığında [From.GetName] ülkesine uzun bir siyasi taviz listesi vermek zorunda kalacağız."
 News_bankruptcy.3.a:0 "Tamam"
 News_bankruptcy.4.t:0 "[FROM.GetNameDef] Yeni Seçimlere Hazirlaniyor"
 News_bankruptcy.4.d:0 "Kötü mali politikalar ve giderek büyüyen borç nedeniyle yapılan protestoların ardından [FROM.GetAdjective] lider [FROM.GetLeader], muhalefet partilerinin yeni seçim yapılması talebini kabul etti. [FROM.GetLeader] liderinin görevini sürdürmek için yeterli halk desteğine sahip olup olmayacağı, yoksa yeni bir partinin ülkeyi mali çöküşten kurtarmaya çalışıp çalışmayacağı ise henüz belli değil."
 News_bankruptcy.4.a:0 "İlginç"
 News_bankruptcy.5.t:0 "[FROM.GetNameDef] Ülkesinde Radikal Siyasi Degisim"
 News_bankruptcy.5.d:0 "Kötü mali politikalar ve giderek büyüyen borç nedeniyle yapılan protestoların ardından [FROM.GetNameDef] ülkesinin eski yönetimi, muhalefetin istifa talebini kabul etti. Protestocular parlamentoyu bastığında durum tırmanmıştı. Muhalefet lideri [FROM.GetLeader], bir geçiş hükümetinin başında ülkeyi mali iyileşmeye taşıyacağına söz verdi."
 News_bankruptcy.5.a:0 "İlginç"
 News_bankruptcy.6.t:0 "Mali Çöküs [FROM.GetNameDef] Ülkesinde Çatismaya Yol Açti"
 News_bankruptcy.6.d:0 "Kötü mali politikalar ve giderek büyüyen borç nedeniyle yapılan protestoların ardından [FROM.GetAdjective] lider [FROM.GetLeader], orduya parlamentoyu basmaya çalışan protestocu grubu dağıtma ve tutuklama emri verdi. Dağıtma sırasında birkaç kişi öldürüldü ve çok geçmeden bazı ordu birlikleri, [FROM.GetLeader] liderinin şiddet yöntemlerine karşı çıkan protestoculara katıldı. Durum yatışmadan hükümete bağlı güçlerle muhalefet güçleri arasında çatışmalar yaşandığına dair haberler geldi.\n\n[FROM.GetNameDef] vatandaşlarının, kötü devlet maliyesinin yanında endişe listesine iç savaşı da eklemesi gerekecek gibi görünüyor"
 News_bankruptcy.6.a:0 "İlginç"
