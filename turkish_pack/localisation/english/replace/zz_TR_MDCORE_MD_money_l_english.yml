 INFRA_EXPENSE:0 "§LAltyapı:§!"
 INFRA_EXPENSE_TOOLTIP:0 "Altyapı Harcaması"
 INFRA_EXPENSE_TOOLTIP_DELAYED:0 "Altyapı bakımı, kritik enerji ve iletişim altyapımızın haftalık işletme maliyetlerini kapsar. Buna §YNükleer Reaktörlerin§!, §YFosil Yakıtlı Santrallerin§!, §YYenilenebilir Enerji Altyapısının§!, §Yİnternet İstasyonlarının§! ve §YDemiryolu Terminallerinin§! bakımı dahildir. Maliyetler §YEnflasyonla§! birlikte artar.\n\nYasa, Ulusal Ruh ve Teknolojilerin §YAltyapı Harcamasına§! etkisi: [?modifier@infrastructure_cost_multiplier_modifier|-%0]\n§YEnflasyonun§! §YAltyapı Harcamasına§! etkisi: [?inflation_rate_var|-%]\n\n§YNükleer Reaktörler§! ([?nuclear_reactors|0]): $[?nuclear_infra_expense|+3]\n§YFosil Yakıtlı Santraller§! ([?number_of_fossil_pps|0]): $[?fossil_infra_expense|+3]\n§YYenilenebilir Enerji Altyapısı§! ([?renewable_energy_infra|0]): $[?renewable_infra_expense|+3]\n§Yİnternet İstasyonları§! ([?internet_station_total|0]): $[?internet_infra_expense|+3]\n§YDemiryolu Terminalleri§! ([?rail_terminal_total|0]): $[?rail_infra_expense|+3]"
 INTEREST_EXPENSE:0 "§RBorç Faizi:§!"
 INTEREST_EXPENSE_TOOLTIP:0 "Ödenen Faiz"
 INTEREST_EXPENSE_TOOLTIP_DELAYED:0 "Ülkemizin biriktirdiği borç için faiz ödemek zorundayız. Faiz oranımızı esas olarak §YBorç/GSYİH oranımız§! belirler. Oran yükseldikçe finans kuruluşlarının borcu ödeyebileceğimize güveni azalır ve faiz oranı yükselir. Faiz oranımız çeşitli §YUlusal Ruhlardan§! etkilenebilir.\n\n§YFaiz Oranının§! §Y%10§!'u aşması, büyüyen borcumuzla başa çıkmak için acil durum kararlarını açar. Faiz §Y%15§!'in üzerine çıktığında ekonomimiz yavaşlamaya başlar ve başka olumsuz etkiler yaşarız. Bu noktada borcumuzu (ağır bir bedelle) temerrüde düşürme imkânı doğar. §YFaiz§! §Y%20§!'yi aştığında elle daha fazla borç alamayız. §YBorç Faizimiz§! §YBrüt Gelirimizi§! aşarsa ülkemiz çöker.\n\nMevcut §YFaiz Oranımız§! %[?interest_rate|3]\n\nMevcut Borç/GSYİH Oranımız: §Y[?debt_ratio|%1]§!\n\nFikirlerin §YFaiz Oranına§! etkisi: %[?modifier@interest_rate_multiplier_modifier|-2]\n[debt_automatic_repayment_toggled]"
