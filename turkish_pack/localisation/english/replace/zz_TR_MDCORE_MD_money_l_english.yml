 BUREAUCRACY_EXPENSE_TOOLTIP:0 "Bürokrasi Harcaması"
 BUREAUCRACY_EXPENSE_TOOLTIP_DELAYED:0 "Bürokrasi harcaması, ülkenin idaresini yürütmek için kullandığımız paradır. Temel maliyet altyapı ve genel giderleri kapsar; nüfusa ve §Yİdare§! seviyesine göre ölçeklenir. Yüksek idare seviyeleri nüfusun daha büyük bir kısmını memur olarak istihdam eder ve bu memurların maaşları altyapı maliyetine eklenir; yani bureau_05 seviyesindeki ülkeler hem en yüksek genel gider çarpanını hem de en büyük maaş yükünü öder.\n\nKişi Başı GSYİH'nin §YBürokrasi Harcamasına§! etkisi: [?education_cost_gdp_multiplier_display|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YBürokrasi Harcamasına§! etkisi: [?modifier@bureaucracy_cost_multiplier_modifier|-%0]\n§YEnflasyonun§! §YBürokrasi Harcamasına§! etkisi: [?inflation_rate_var|-%]\n\nDevlet İdaresi İş Gücü Karşılama: [?bureaucracy_manpower_fulfillment|%0]"
 DEFENCE_SPENDING:0 "§OSavunma:§!"
 DEFENCE_SPENDING_TOOLTIP:0 "Savunma Harcamalarının Dağılımı:\n$[?defence_breakdown_industry|-3] §YSanayi Maliyeti§! olarak harcanır\n$[?defence_breakdown_land|-3] §YKara Kuvvetleri İşletme Maliyeti§! olarak harcanır\n$[?defence_breakdown_navy|-3] §YDeniz Kuvvetleri İşletme Maliyeti§! olarak harcanır\n$[?defence_breakdown_airforce|-3] §YHava Kuvvetleri İşletme Maliyeti§! olarak harcanır\n$[?defence_breakdown_cyber|-3] §YSiber Komutanlık Maliyeti§! olarak harcanır"
 DEFENCE_SPENDING_TOOLTIP_DELAYED:0 "Savunma Harcaması, ordumuzu finanse etmek için kullandığımız paradır ve iki bileşenden oluşur: §YSanayi Maliyeti§! ve §Yİşletme Maliyeti§!. §YSanayi Maliyeti§!, savunma sanayimizi ayakta tutmak için harcadığımız paradır. Askeri fabrika ve tersane başına temel maliyet §YAskeri Harcama§! yasamıza bağlıdır; daha yüksek yasa daha pahalıdır. §YKişi Başı GSYİH§! de maliyeti artırır. Ayrıca §YHava ve Füze Savunması§! maliyetleri de eklenir.\n\n§Yİşletme Maliyeti§!, konuşlandırdığımız bölük, gemi ve uçak sayısına ve depoda tuttuğumuz teçhizat ile uçak miktarına dayanır. Bu maliyet daha sonra §YAskerlik Yasamız§!, §YSubay Eğitimi Yasamız§! ve §YKişi Başı GSYİH§! ile değişir.\n\n§YSiber Komutanlık Maliyeti§!, ulusal siber programı sürdürmenin haftalık genel gideridir. Maliyet §YGSYİH§! ve §YKabiliyet Kademesi§! ile ölçeklenir ve §YSiber Güvenlik Altyapısı Maliyeti§! değiştiricisinden etkilenir.\n\nKişi Başı GSYİH'nin §YSanayi Maliyetine§! etkisi: [?defence_breakdown_industry_gdp_modifier|-%0]\nKişi Başı GSYİH'nin §YPersonel Maliyetine§! etkisi: [?defence_breakdown_personnel_gdp_modifier|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §YPersonel Maliyetine§! etkisi: [?modifier@personnel_cost_multiplier_modifier|-%0]\n§YEnflasyonun§! §YSanayi Maliyeti§! ve §YTeçhizat Maliyetine§! etkisi: [?inflation_rate_var|-%]\n§YSiber Maliyet§! değiştiricisi: [?modifier@cyber_cost_multiplier_modifier|-%0]"
 POLICE_SPENDING:0 "§8İç Güvenlik:§!"
 POLICE_SPENDING_TOOLTIP:0 "İç Güvenlik Harcaması"
 POLICE_SPENDING_TOOLTIP_DELAYED:0 "İç Güvenlik harcaması, polis gibi iç güvenliğe ve istihbarat teşkilatları biçimindeki dış güvenliğe ayırdığımız paradır. İç güvenlik harcamasının temel maliyeti ülkenin toplam nüfusuna dayanır ve her §Yİç Güvenlik§! seviyesi maliyeti artırır.\n\nKişi Başı GSYİH'nin §Yİç Güvenlik Harcamasına§! etkisi: [?education_cost_gdp_multiplier_display|-%0]\nYasa, Ulusal Ruh ve Teknolojilerin §Yİç Güvenlik Harcamasına§! etkisi: [?modifier@police_cost_multiplier_modifier|-%0]\n§YEnflasyonun§! §Yİç Güvenlik Harcamasına§! etkisi: [?inflation_rate_var|-%]"
