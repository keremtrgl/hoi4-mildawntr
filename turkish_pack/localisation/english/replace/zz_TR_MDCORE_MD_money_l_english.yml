 bankruptcy.10.t:0 "Muhalefet Seçim Talep Ediyor"
 bankruptcy.10.d:0 "Birkaç muhalefet partisi lideri bugün ortak bir açıklama yaparak [ROOT.GetLeader] ve [show_ruling_party] yönetiminin ülkeyi mali yıkıma sürüklediğini belirtti. Halkın yetkisini taşıyan ve ülkenin mali çöküşünü düzeltebilecek yeni bir hükümet kurmak için derhal seçim talep ediyorlar. İstihbarat raporlarımıza göre bu talep oldukça geniş bir halk desteği toplamış görünüyor. Böyle bir krizde iktidarı elde tutmaya çalışmak felaketle sonuçlanabilir."
 bankruptcy.10.a:0 "Yeni bir seçim yapmalıyız"
 bankruptcy.10.b:0 "Seçimleri görev süremiz dolduğunda yapacağız, daha erken değil"
 bankruptcy_financial_collapse_restructuring_tt:0 "Borç, haftalık borç servisi brüt gelirin §Y%75§!'ini aşmayacak şekilde yeniden yapılandırılacak. §Y3 yıl§! boyunca yeni bir mali çöküş yaşanamaz."
 bankruptcy.11.t:0 "Protestocular Meclisi Basmaya Çalisiyor"
 bankruptcy.11.d:0 "[ROOT.GetLeader] yeni seçim yapılmayacağını açıkladıktan hemen sonra [ROOT.GetName] halkı sokaklarda yürümeye başladı. [ROOT.GetLeader] liderinin istifa etmesini (ya da daha kötüsünü) talep eden, ana muhalefet partisinin genel başkanının önderlik ettiği bir protestocu grup parlamento binasına doğru yürümeye başladı.\n\nYerel polis protestocuları durdurmayı başaramadı; protestocular şu anda başkenti ele geçirmekle meşgul. Ne yapmalıyız?"
 bankruptcy.11.a:0 "Bir saniye, paltomu ters çevireyim..."
 bankruptcy.11.b:0 "Orduya müdahale etmesini ve bu isyancıları tutuklamasını söyle!"
 bankruptcy.11.a_tt:0 "§GEn büyük muhalefet partisi iktidarı barışçıl bir şekilde devralır§!"
 bankruptcy.11.b_tt:0 "§GMevcut iktidar partisi iktidarını korur§!"
 bankruptcy.12.t:0 "Muhalefet [show_ruling_party] Partisinden Istifa Talep Ediyor"
 bankruptcy.12.d:0 "Birkaç muhalefet partisi lideri bugün ortak bir açıklama yaparak [ROOT.GetLeader] ve [show_ruling_party] yönetiminin ülkeyi mali yıkıma sürüklediğini belirtti. [show_ruling_party] iktidardan çekilmesini ve halkın yetkisini taşıyan, ülkenin mali çöküşünü düzeltebilecek daha meşru bir siyasi partinin yeni bir hükümet kurmasına izin vermesini talep ediyorlar. İstihbarat raporlarımıza göre bu talep oldukça geniş bir halk desteği toplamış görünüyor. Böyle bir krizde iktidarı elde tutmaya çalışmak felaketle sonuçlanabilir."
 bankruptcy.12.a:0 "İktidardan çekilmeliyiz"
 bankruptcy.12.b:0 "Böyle taleplerde bulunmaya haklarının yok"
 bankruptcy.13.t:0 "[FROM.GetNameDef] Borçlarini Sifirladi!"
 bankruptcy.13.d:0 "Bir yıl önce [FROM.GetNameDef] borçlarını geri ödeyemeyeceğini açıkladı ve borçlarını temerrüde düşürme sürecini başlattı. Yapılan düzenlemeyle temerrüde düşen borcu ödemeyi ya da tasfiye etmeyi planlıyorlardı. Ancak bir çözüm bulmak yerine, bunu tazmin etmenin bir yolunu aramaya hiç niyetlenmeden eski borçlarını tamamen sildiler. Ne yapmalıyız?"
 bankruptcy.13.a:0 "Savaşa, yaşasın savaş!"
 bankruptcy.13.b:0 "Kimin umurunda?"
 bankruptcy.14.t:0 "[FROM.GetNameDef] Borçlarini Sifirladi!"
 bankruptcy.14.d:0 "Bir yıl önce [FROM.GetNameDef] borçlarını geri ödeyemeyeceğini açıkladı ve borçlarını temerrüde düşürme sürecini başlattı. Yapılan düzenlemeyle temerrüde düşen borcu ödemeyi ya da tasfiye etmeyi planlıyorlardı. Ancak bir çözüm bulmak yerine, bunu tazmin etmenin bir yolunu aramaya hiç niyetlenmeden eski borçlarını tamamen sildiler. Hükümetimiz onlarınkiyle yakından bağlantılı olduğundan, borç verenleri şimdi bizim peşimize düştü. [FROM.GetName] ülkesinin borçlu olduğu paranın en azından bir kısmını tazmin etmekten başka çaremiz kalmadı. Bu ekonomimiz için iyi değil, ama en azından [FROM.GetName] üzerinde koz sahibi olduk."
 bankruptcy.14.a:0 "Belki de liderlikte bir değişime ihtiyaç vardır"
 bankruptcy.100.t:0 "IMF Daha Az Bürokrasi Talep Ediyor"
 bankruptcy.100.d:0 "Mali durumumuzu inceleyen IMF, ekonomik ve mali sorunlarımızdan ülkenin ağır bürokrasisinin sorumlu olduğu sonucuna vardı. İşletmelerin ülkede faaliyet göstermeye daha fazla ilgi duyması ve finans kuruluşlarının mali işleyişlerini uygun gördükleri şekilde yürütmesinin kolaylaşması için kırtasiyecilik azaltılmalı.\n\nIMF'ye göre idarenin bu şekilde küçültülmesi, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.100.a:0 "Başka Çaremiz Yok"
 bankruptcy.100.b:0 "Bu çok ağır"
 bankruptcy.101.t:0 "IMF Ordunun Küçültülmesini Talep Ediyor"
 bankruptcy.101.d:0 "Mali durumumuzu inceleyen IMF, ekonomik ve mali sorunlarımızdan ülkenin yüksek askeri harcamalarının sorumlu olduğu sonucuna vardı. Milyarlarca dolar orduyu finanse etmek ve ekipman satın almak için harcanıyor. IMF'ye göre bu, ülkenin parayı akılcı yatırımlara ayırmasını engelliyor. Ayrıca orduya ayrılan büyük kaynak, birçok girişimciyi ordunun müdahale edip siyasi sistemi istikrarsızlaştırabileceği endişesine sürüklüyor.\n\nIMF'ye göre askeri harcamaların derhal kısılması, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.101.a:0 "Başka Çaremiz Yok"
 bankruptcy.101.b:0 "Bu çok ağır"
 bankruptcy.102.t:0 "IMF Polisin Küçültülmesini Talep Ediyor"
 bankruptcy.102.d:0 "Mali durumumuzu inceleyen IMF, güvenlik aygıtının ülkemiz üzerinde fazla büyük bir yük oluşturduğu sonucuna vardı. Güvenlik ihtiyacını anladıklarını belirtseler de onlara göre polisin bütçesini kısıp parayı daha akılcı kullanmak daha fazla güvenlik sağlayacaktır.\n\nIMF'ye göre borcumuzu yeniden yapılandırmak için iç güvenlik birimlerimizin bütçesinde kayda değer bir kesintiye gidilmesi şarttır."
 bankruptcy.102.a:0 "Başka Çaremiz Yok"
 bankruptcy.102.b:0 "Bu çok ağır"
 bankruptcy.103.t:0 "IMF Devlet Egitimine Verilen Destegin Azaltilmasini Talep Ediyor"
 bankruptcy.103.d:0 "Mali durumumuzu inceleyen IMF, vatandaşlarımızın eğitimine verdiğimiz desteğin düzeyinin fazla yüksek olduğu sonucuna vardı. Yükseköğretime ve çeşitli araştırma bursları için verilen devlet desteğinin azaltılmasını öneriyorlar. Öğrencilerimizi desteklemek yerine, özel öğrenci kredilerine bağımlılıklarını artırmalıyız.\n\nIMF'ye göre eğitim harcamalarındaki bu azalma, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.103.a:0 "Başka Çaremiz Yok"
 bankruptcy.103.b:0 "Bu çok ağır"
 bankruptcy.104.t:0 "IMF Saglik Hizmetlerinin Özellestirilmesini Talep Ediyor"
 bankruptcy.104.d:0 "Mali durumumuzu inceleyen IMF, ekonomik durumumuza kıyasla halkımıza ücretsiz sunduğumuz sağlık hizmetlerinin düzeyinin fazla yüksek olduğu sonucuna vardı. En azından bazı hastanelerin özelleştirilmesini ve özel sağlık sigortası şirketlerinin faaliyetlerinin genişletilmesini öneriyorlar.\n\nIMF'ye göre sağlık hizmetlerimizi rasyonelleştirmek, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.104.a:0 "Başka Çaremiz Yok"
 bankruptcy.104.b:0 "Bu çok ağır"
 bankruptcy.105.t:0 "IMF Sosyal Hizmetlerde Kesinti Talep Ediyor"
 bankruptcy.105.d:0 "Mali durumumuzu inceleyen IMF, sosyal destek ağımızın fazla geniş olduğu sonucuna vardı. Gereksiz yüksek emekli maaşları, cömert işsizlik ödenekleri, uzun ebeveyn izinleri; bunların hepsi halkın çalışması gerektiği zamanlarda iş bulmaya istekli olmamasına yol açıyor.\n\nIMF'ye göre sosyal hizmetlerimizi kısmak ve insanların geçimlerini çalışarak sağlamasını temin etmek, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.105.a:0 "Başka Çaremiz Yok"
 bankruptcy.105.b:0 "Bu çok ağır"
 bankruptcy.106.t:0 "IMF Daha Açik Piyasalar Talep Ediyor"
 bankruptcy.106.d:0 "Mali durumumuzu inceleyen IMF, kaynaklarımızı tam kapasiteyle kullanmadığımız sonucuna vardı. Kaynaklarımızın çoğu devletin yararına kullanılıyor. Oysa bunların rekabete ve açık piyasalara açılması gerekir.\n\nIMF'ye göre kaynak piyasasını serbestleştirmek, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.106.a:0 "Başka Çaremiz Yok"
 bankruptcy.106.b:0 "Bu çok ağır"
 bankruptcy.107.t:0 "IMF'nin Arka Kapisindan Gelen Bir Temas"
 bankruptcy.107.d:0 "IMF'de çalışan -ya da en azından öyle olduğunu iddia eden- birinden tuhaf bir teklif aldık. Davamıza ve ülkemize sempati duyduğunu, gerekirse kolayca bir borç hafifletme programı ayarlayabileceğini söylüyor. Bizden tek istediği, bazı devlet ve idari kadrolara birkaç arkadaşını yerleştirmemiz. Mesajda sırt kaşımalardan ve karşılıklı çıkarlardan bahsediliyordu."
 bankruptcy.107.a:0 "Sanırım bazı ipleri çekebiliriz"
 bankruptcy.107.b:0 "Yolsuzluk mu? Benim [ROOT.GetName] ülkemde mi?"
 bankruptcy.108.t:0 "IMF Toprak Reformu Talep Ediyor"
 bankruptcy.108.d:0 "Mali durumumuzu inceleyen IMF, mevcut arazi kullanımımızın çok verimsiz olduğu sonucuna vardı. Arazinin büyük bir kısmı kalkınma için hiç kullanılmıyor ve bazı arazi kayıtlarımız tamamen eskimiş görünüyor.\n\nIMF'ye göre bir toprak reformu, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.108.a:0 "Başka Çaremiz Yok"
 bankruptcy.108.b:0 "Bu çok ağır"
 bankruptcy.109.t:0 "IMF Maliye Üzerinde Daha Fazla Kontrol Talep Ediyor"
 bankruptcy.109.d:0 "Mali durumumuzu inceleyen IMF, mevcut kadromuzun mali kurumlarımızı yönetmek için yetersiz olduğu sonucuna vardı. Mali işlerimizin profesyoneller tarafından yürütüldüğünden emin olmak için IMF'nin iyi eğitimli ve deneyimli personeli çeşitli bakanlıklara ve merkez bankasına yerleştirilmeli.\n\nIMF'ye göre tüm atıl iş gücünden kurtulmak, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.109.a:0 "Başka Çaremiz Yok"
 bankruptcy.109.b:0 "Bu çok ağır"
 bankruptcy.110.t:0 "IMF Din Adamlarina Saldiriyor"
 bankruptcy.110.d:0 "Mali durumumuzu inceleyen IMF, din adamları sınıfının idareden büyük miktarda fon çektiği sonucuna vardı. IMF, bu kadar çok paranın dini kurumları finanse etmeye gitmesini onaylamıyor. Bu para akışı durdurulmalı ve fonların bir kısmı devlete iade edilmeli.\n\nIMF'ye göre fonları dini kurumlardan başka alanlara kaydırmak, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.110.a:0 "Başka Çaremiz Yok"
 bankruptcy.110.b:0 "Bu çok ağır"
 bankruptcy.111.t:0 "IMF Askeri Sanayinin Sökülmesini Talep Ediyor"
 bankruptcy.111.d:0 "Mali durumumuzu inceleyen IMF, devlet sübvansiyonlu askeri fabrikaların ülke kaynakları üzerinde bir yük olduğu sonucuna vardı. Bu fabrikalar sökülmeli ve kaynaklar daha iyi yönlendirilmeli.\n\nIMF'ye göre anlamsız askeri yığınağı iptal etmek, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.111.a:0 "Başka Çaremiz Yok"
 bankruptcy.111.b:0 "Bu çok ağır"
 bankruptcy.112.t:0 "IMF Limanlarin Özellestirilmesini Talep Ediyor"
 bankruptcy.112.d:0 "Mali durumumuzu inceleyen IMF, devlet sübvansiyonlu tersanelerin ülke kaynakları üzerinde bir yük olduğu sonucuna vardı. Bunlar özelleştirilip hükümetin elinden çıkarsa ülkeye daha iyi hizmet edecektir.\n\nIMF'ye göre limanlarımızı özel kullanıma açmak, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.112.a:0 "Başka Çaremiz Yok"
 bankruptcy.112.b:0 "Bu çok ağır"
 bankruptcy.113.t:0 "IMF Vergilerin Artirilmasini Talep Ediyor"
 bankruptcy.113.d:0 "Mali durumumuzu inceleyen IMF, halkımızdan çok az vergi aldığımız sonucuna vardı. Devlet kurumlarını etkin biçimde yürütebilmek için geçici olarak daha yüksek bir vergi oranı uygulanmalı. Aksi takdirde hükümet faizini geri ödeyecek fonu hiçbir zaman toplayamaz.\n\nIMF'ye göre vergileri artırmak, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.113.a:0 "Başka Çaremiz Yok"
 bankruptcy.113.b:0 "Bu çok ağır"
 bankruptcy.114.t:0 "IMF Varliklarin Tasfiyesini Talep Ediyor"
 bankruptcy.114.d:0 "Mali durumumuzu inceleyen IMF, değerli miktarda varlığı elimizde tuttuğumuz ve satmayı reddettiğimiz sonucuna vardı. IMF, uluslararası yatırımlarımızdaki varlıklarımızı normalin üzerinde bir oranla satın almayı ve bu fonları borç ödemelerimize ek olarak kullanmayı teklif ediyor.\n\nIMF'ye göre önce kendi varlıklarımızı tasfiye etmek, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.114.a:0 "Başka Çaremiz Yok"
 bankruptcy.114.b:0 "Bu çok ağır"
 bankruptcy.114_low_gdp_tt:0 "IMF §YUluslararası Yatırımlarımızı§! değerinin %70'i üzerinden satın alacak!"
 bankruptcy.114_tt:0 "IMF §YUluslararası Yatırımlarımızı§! değerinin %80'i üzerinden satın alacak!"
 bankruptcy.115.t:0 "IMF Devlet Sanayilerinin Özellestirilmesini Talep Ediyor"
 bankruptcy.115.d:0 "Mali durumumuzu inceleyen IMF, devletin sunduğu bazı kamu hizmetlerinin özelleştirilip rasyonelleştirilebileceği sonucuna vardı.\n\nIMF'ye göre devlete ait bazı sanayilerden kurtulmak, borcumuzu yeniden yapılandırmak için kesinlikle şarttır."
 bankruptcy.115.a:0 "Başka Çaremiz Yok"
 bankruptcy.115.b:0 "Bu çok ağır"
 bankruptcy.200.t:0 "[Western_Autocracy_L] Güçlü Lider Hükümetle Alay Ediyor"
 bankruptcy.200.d:0 "'...ve işte bu yüzden düşecekler. [ROOT.GetLeader] zayıf bir lider ve karar alamaması [ROOT.GetNameDef] ülkesini kaosa sürükleyecek. Ekonominin etkin yönetilmesi için IMF ve Batılı müttefiklerimizle daha yakın çalışmalıyız.'\n\nBir [Western_Autocracy_L] liderinin sözleri, parti liderinin adını haykıran kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.200.a:0 "Lanet olsun"
 bankruptcy.200.b:0 "Bir karşı kampanya başlat"
 bankruptcy.201.t:0 "[conservatism_L] Eski Güzel Günleri Özlüyor"
 bankruptcy.201.d:0 "'Ülkenin düzgün yönetildiği günleri hatırlıyor musunuz? Ekonominin harika, ülkenin genel olarak daha da iyi olduğu günleri? [ROOT.GetLeader] eski yollardan çok uzaklaştı ve şimdi hepimiz bedelini ödüyoruz...'\n\nBir [conservatism_L] liderinin sözleri, nostaljiye kapılmış kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.201.a:0 "Lanet olsun"
 bankruptcy.201.b:0 "Bir karşı kampanya başlat"
 bankruptcy.202.t:0 "[liberalism_L] Daha Toplumsal Sorumluluk Tasiyan Mali Politikalar Istiyor"
 bankruptcy.202.d:0 "'[ROOT.GetLeader] hükümetinin mevcut politikaları insanları yoksulluğa sürüklüyor. [show_ruling_party] yönetiminin durmaksızın biriktirdiği sonsuz borcu finanse etmek için en çaresiz kesimlerin ceplerinden giderek daha fazla para çekiliyor...'\n\nBir [liberalism_L] liderinin sözleri, şu anda aşevinde sıra bekleyen kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.202.a:0 "Lanet olsun"
 bankruptcy.202.b:0 "Bir karşı kampanya başlat"
 bankruptcy.203.t:0 "[socialism_L] Sendikalari Toplantiya Çagiriyor"
 bankruptcy.203.d:0 "'Kötü mali politikaların yükünü daha ne kadar taşıyacağız? Biz, bu ülkenin belkemiği olarak? Biz çalışanlar, her zaman [show_ruling_party] yönetiminin hatalarının bedelini ödüyoruz...'\n\nBir [socialism_L] liderinin sözleri, bir sendika toplantısındaki kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.203.a:0 "Lanet olsun"
 bankruptcy.203.b:0 "Bir karşı kampanya başlat"
 bankruptcy.204.t:0 "[communist_state_L] Lideri Fabrika Isçilerini Kiskirtiyor"
 bankruptcy.204.d:0 "'Sizi bağlayan zincirleri görmüyor musunuz? Çocuklarınız ve torunlarınız sonsuza dek bankerlerin kölesi olacak. İşçi sınıfından yapılan bu hırsızlık durmalı, yoksa biz durduracağız!'\n\nBir [communist_state_L] liderinin sözleri, bir fabrikadaki kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.204.a:0 "Lanet olsun"
 bankruptcy.204.b:0 "Bir karşı kampanya başlat"
 bankruptcy.205.t:0 "[anarchist_communism_L] Ögrenci Mitingi Düzenliyor"
 bankruptcy.205.d:0 "'Hepimiz biliyoruz ki [ROOT.GetLeader] ile [show_ruling_party] yönetiminin mevcut hükümeti, yalnızca yüzde birlik kesimin cebine daha fazla para koymak için iktidarda. Kapitalist dünya düzenine boyun eğmek sona ermeli!'\n\nBir [anarchist_communism_L] liderinin sözleri, bir üniversitedeki genç öğrenci kalabalığının tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.205.a:0 "Lanet olsun"
 bankruptcy.205.b:0 "Bir karşı kampanya başlat"
 bankruptcy.206.t:0 "[Conservative_L] Lideri Gelismekte Olan Ülkelerin Siyasetçileriyle Görüsüyor"
 bankruptcy.206.d:0 "Yabancı siyasetçilerle yaptığı bir görüşmede [Conservative_L] liderlerinden biri, [ROOT.GetLeader] devrilmesi gerekse bile [ROOT.GetNameDef] ülkesinin kötü ekonomik durumu için bir şeyler yapılması gerektiğini söyledi.\n\nİçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.206.a:0 "Lanet olsun"
 bankruptcy.206.b:0 "Bir karşı kampanya başlat"
 bankruptcy.207.t:0 "[Autocracy_L] Güçlü Lider Destegi Toplaniyor"
 bankruptcy.207.d:0 "'Siyasetçilerimiz emperyalistlerin mevcut ekonomimizden faydalanmasına ve onu yok etmesine izin veriyor. Adaletsiz kredi şartlarıyla ülkemiz iflasa sürükleniyor. Hükümetimizi finanse etmek için alternatifler aramalıyız...'\n\nBir [Autocracy_L] liderinin sözleri, [ROOT.GetLeader] liderinin devrilmesini isteyen kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.207.a:0 "Lanet olsun"
 bankruptcy.207.b:0 "Bir karşı kampanya başlat"
 bankruptcy.208.t:0 "[Mod_Vilayat_e_Faqih_L] Din Adami Atesli Bir Hutbe Veriyor"
 bankruptcy.208.d:0 "'Siyonist köpekler ve onların Tekfirci şeytan yavruları, Büyük Şeytan'ın lanetli dolarını ekonomimizi baltalamak için kullanıyor. Amaçları biz dindar Müslümanları boyunduruk altına alıp köleleştirmek! [ROOT.GetLeader] ve Siyonist efendileri alaşağı edilmeli!'\n\nBir [Mod_Vilayat_e_Faqih_L] din adamının sözleri, yerel bir camideki takipçilerinin övgüyle karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.208.a:0 "Lanet olsun"
 bankruptcy.208.b:0 "Bir karşı kampanya başlat"
 bankruptcy.209.t:0 "[Vilayat_e_Faqih_L] Din Adami Atesli Bir Hutbe Veriyor"
 bankruptcy.209.d:0 "'Siyonist köpekler ve onların Tekfirci şeytan yavruları, Büyük Şeytan'ın lanetli dolarını ekonomimizi baltalamak için kullanıyor. Amaçları biz dindar Müslümanları boyunduruk altına alıp köleleştirmek! [ROOT.GetLeader] ve Siyonist efendileri alaşağı edilmeli!'\n\nBir [Vilayat_e_Faqih_L] din adamının sözleri, yerel bir camideki takipçilerinin övgüyle karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.209.a:0 "Lanet olsun"
 bankruptcy.209.b:0 "Bir karşı kampanya başlat"
 bankruptcy.210.t:0 "[Kingdom_L] Din Adami Dini Liderlik Talep Ediyor"
 bankruptcy.210.d:0 "'Ülkemiz mevcut liderlerimiz tarafından yok ediliyor! Allah'ın, adına salât ü selam olsun, yardımıyla ülkeyi istikrara kavuşturacak ve büyük bir geleceğe taşıyacak güçlü ve dindar bir hükümdara ihtiyacımız var'\n\nBir [Kingdom_L] din adamının sözleri, yerel bir camideki takipçilerinin övgüyle karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.210.a:0 "Lanet olsun"
 bankruptcy.210.b:0 "Bir karşı kampanya başlat"
 bankruptcy.211.t:0 "[Caliphate_L] Lideri Cihada Çagiriyor"
 bankruptcy.211.d:0 "'[ROOT.GetLeader] ve [show_ruling_party] içindeki dostlarının kâfir köpekleri, Siyonist dünya düzenine ve şeytani bankerlerine boyun eğerek Allah'la, adına salât ü selam olsun, alay ediyor...'\n\nDün YouPipe'ta, kalitesiz bir mağarada çekildiği belli olan kalitesiz bir video dolaşıma girdi; videoda [Caliphate_L] sözcüsü liderlerinin son hezeyanlarını aktarıyordu. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.211.a:0 "Lanet olsun"
 bankruptcy.211.b:0 "Bir karşı kampanya başlat"
 bankruptcy.212.t:0 "[Neutral_Muslim_Brotherhood_L] Islami Degerleri Vurguluyor"
 bankruptcy.212.d:0 "'Batı değerlerinin liderlerimizi nasıl yozlaştırdığını görüyor musunuz? Borç alıyorlar ve yarın yokmuş gibi harcıyorlar. Bu davranış Allah'ın iradesine aykırıdır...'\n\nBir [Neutral_Muslim_Brotherhood_L] liderinin sözleri, yerel bir kültür merkezindeki takipçilerinin övgüyle karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.212.a:0 "Lanet olsun"
 bankruptcy.212.b:0 "Bir karşı kampanya başlat"
 bankruptcy.213.t:0 "[Neutral_Autocracy_L] Güçlü Lider Hükümetle Alay Ediyor"
 bankruptcy.213.d:0 "'...ve işte bu yüzden düşecekler. [ROOT.GetLeader] zayıf bir lider ve karar alamaması [ROOT.GetNameDef] ülkesini kaosa sürükleyecek. Kendi ayaklarımız üzerinde durmalı ve etkin yönetilen bir ekonomi için yeni çözümler düşünmeliyiz.'\n\nBir [Neutral_Autocracy_L] liderinin sözleri, parti liderinin adını haykıran kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.213.a:0 "Lanet olsun"
 bankruptcy.213.b:0 "Bir karşı kampanya başlat"
 bankruptcy.214.t:0 "[Neutral_conservatism_L] Eski Güzel Günleri Özlüyor"
 bankruptcy.214.d:0 "'Ülkenin düzgün yönetildiği günleri hatırlıyor musunuz? Ekonominin harika, ülkenin genel olarak daha da iyi olduğu günleri? [ROOT.GetLeader] eski yollardan çok uzaklaştı ve şimdi hepimiz bedelini ödüyoruz...'\n\nBir [Neutral_conservatism_L] liderinin sözleri, nostaljiye kapılmış kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.214.a:0 "Lanet olsun"
 bankruptcy.214.b:0 "Bir karşı kampanya başlat"
 bankruptcy.215.t:0 "[oligarchism_L] Siyasetçi Harcamalari Elestiriyor"
 bankruptcy.215.d:0 "'Hükümet değerli vergi paramızın hepsini saçma şeylere harcıyor. Bütçeyi kısmalı ve harcamalara yerel işletmeleri destekleyecek şekilde öncelik vermeli. Bunu kendim dürüst bir işadamı olduğum için söylemiyorum; arkadaşlarım ve seçmenlerim de dürüst işadamları olduğu için söylüyorum...'\n\nBir [oligarchism_L] siyasetçisinin sözleri, bir iş dünyası kongresindeki kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.215.a:0 "Lanet olsun"
 bankruptcy.215.b:0 "Bir karşı kampanya başlat"
 bankruptcy.216.t:0 "[Neutral_Libertarian_L] Siyasetçi Harcamalari Elestiriyor"
 bankruptcy.216.d:0 "'Hükümet, yani, hiç para harcamasın bence, adamım,' diyor bir [Neutral_Libertarian_L] siyasetçisi, şüpheli biçimde elde sarılmış görünen bir sigaradan bir nefes daha çekerken. Bir duman bulutu üflerken havaya küflü bir koku yayılıyor. 'Hiç para olmadığını düşün, ahbap. Para yoksa faiz de ödeyemezsin,' diye devam ediyor, parmağıyla şakağına vururken.\n\n[ROOT.GetLeader], bu partiye nasıl düştüğünü bilmiyor..."
 bankruptcy.216.a:0 "Harika, ahbap"
 bankruptcy.216.b:0 "Kafayı bulmuşlar..."
 bankruptcy.217.t:0 "[Neutral_green_L] Hükümete 'Sorumsuz' Diyor"
 bankruptcy.217.d:0 "'Hükümet tüm parasını silahlara harcıyor ve ülkemizi borca boğuyor. Bu para sürdürülebilir enerji üretimine yatırım yapmak ve toplumumuzun kapsayıcılığını artırmak için kullanılmalı...'\n\nBir [Neutral_green_L] liderinin sözleri, başkentteki parklardan birinde gerçekleşen toplantıdaki kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.217.a:0 "Lanet olsun"
 bankruptcy.217.b:0 "Bir karşı kampanya başlat"
 bankruptcy.218.t:0 "[neutral_Social_L] Sendikalari Toplantiya Çagiriyor"
 bankruptcy.218.d:0 "'Kötü mali politikaların yükünü daha ne kadar taşıyacağız? Biz, bu ülkenin belkemiği olarak? Biz çalışanlar, her zaman [show_ruling_party] yönetiminin hatalarının bedelini ödüyoruz...'\n\nBir [neutral_Social_L] liderinin sözleri, bir sendika toplantısındaki kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.218.a:0 "Lanet olsun"
 bankruptcy.218.b:0 "Bir karşı kampanya başlat"
 bankruptcy.219.t:0 "[Neutral_Communism_L] Lideri Fabrika Isçilerini Kiskirtiyor"
 bankruptcy.219.d:0 "'Sizi bağlayan zincirleri görmüyor musunuz? Çocuklarınız ve torunlarınız sonsuza dek bankerlerin kölesi olacak. İşçi sınıfından yapılan bu hırsızlık durmalı, yoksa biz durduracağız!'\n\nBir [Neutral_Communism_L] liderinin sözleri, bir fabrikadaki kalabalığın tezahüratlarıyla karşılanıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.219.a:0 "Lanet olsun"
 bankruptcy.219.b:0 "Bir karşı kampanya başlat"
 bankruptcy.220.t:0 "[Nat_Populism_L] Küreselcilere Veryansin Ediyor"
 bankruptcy.220.d:0 "'Elitler ve küreselciler ülkemizi kontrol ediyor. Medyamız üzerinde sıkı bir hâkimiyetleri var; her türlü muhalefeti engelliyor ve gerçeği saklıyorlar. Hükümetin internet sitesinden aldığım şu istatistiklere bakarsanız ülkemizin biriktirdiği akıl almaz borcu göreceksiniz! Hükümet bu bilgiyi sansürlemeye ve biz eleştirmenleri susturmaya çalışıyor...'\n\nBir [Nat_Populism_L] siyasetçisi bugün ulusal haber kanalında hükümetimize veryansın etti. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.220.a:0 "Lanet olsun"
 bankruptcy.220.b:0 "Bir karşı kampanya başlat"
 bankruptcy.221.t:0 "[Nat_Fascism_L] Büyük Bir Miting Düzenliyor"
 bankruptcy.221.d:0 "'Bizim yerimize kimse geçemeyecek! Hükümet, Siyonist Kertenkele İnsanlar bizi İlluminati'ye satabilsin diye ülkemizi derin bir borca sürüklüyor!'\n\n[Nat_Fascism_L] liderinin sözleri gürleyen alkışlarla karşılanıyor. Konuşma bir süre devam ediyor ve bağırışlar yüzünden içeriğin bir kısmı anlaşılmıyor. Konuşmanın sonundaki çeşitli dalgalı el işaretlerine bakılırsa, altı kişilik grubun alışveriş merkezi otoparkında yalnızca trafiği saptırmak için toplandığı anlaşılıyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.221.a:0 "Lanet olsun"
 bankruptcy.221.b:0 "Bir karşı kampanya başlat"
 bankruptcy.222.t:0 "[Nat_Autocracy_L] General Para Yetersizliginden Sikâyet Ediyor"
 bankruptcy.222.d:0 "'Sürekli parasız kaldığımız bir ordu ülkeyi nasıl savunacak? Daha dün askerlerin süpürge sapları sallayıp 'pat pat' diye bağırdığını gördüm, çünkü mermimiz yok. Bir önceki gün ise sadece tank sürmeyi çalışmak için alışveriş arabalarında birbirlerini itiyor, ağızlarıyla trampet sesleri çıkarıp taş atıyorlardı. Bu saçmalık.'\n\nBir generalin bugünkü gazetedeki sözleri ordumuzun üzücü bir tablosunu çiziyor. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.222.a:0 "Lanet olsun"
 bankruptcy.222.b:0 "Bir karşı kampanya başlat"
 bankruptcy.223.t:0 "[Monarchist_L] Tahta Talip Kraliyet Bildirisi Yayimladi"
 bankruptcy.223.d:0 "'[ROOT.GetName] soyluları devletimizin içine düştüğü durumdan utanç duyuyor. Geçen hafta eşimle uzun uzun konuştum. Uzun bir sohbetin ardından kuzenim ve ben, demokrasinin ortadan kaldırılmasını talep eden bu bildiriyi yayımlamaya karar verdik. Demokrasi halkımızı açıkça yüzüstü bıraktı. Bu noktada istikrarı yalnızca hanedan sağlayabilir.'\n\n[Monarchist_L] içindeki Kraliyet tahtına talip kişi, [ROOT.GetAdjective] Tacı'na yönelik bugün bir kraliyet bildirisi yayımlayarak monarşinin yeniden kurulmasını istedi. İçinde bulunduğumuz kötü mali durum, muhalefet partilerinin destek toplaması için mükemmel bir araç."
 bankruptcy.223.a:0 "Lanet olsun"
 bankruptcy.223.b:0 "Bir karşı kampanya başlat"
 News_bankruptcy.1.t:0 "[From.GetNameWithFlag] kurtarma paketini onayladi"
 News_bankruptcy.1.d:0 "[From.GetName] ülkesinde dün gerçekleşen üst düzey görüşmede [From.GetLeader] ile [Root.GetLeader] bir araya geldi ve [From.GetAdjective] tarafı bizi kurtarmayı vaat etti. Ancak bizi iflastan kurtarmak karşılığında [From.GetName] ülkesine uzun bir siyasi taviz listesi vermek zorunda kalacağız."
 News_bankruptcy.1.a:0 "Tamam"
