 bankruptcy.1.t:0 "[From.GetNameWithFlag] borç kurtarma destegi istiyor"
 bankruptcy.1.d:0 "[From.GetName] ülkesinin borç sorunu o kadar ağırlaştı ki, borcu eritme ya da en azından faiz ödemelerini karşılama konusunda gerçekçi bir şansı kalmadı. İflas ihtimali çok gerçekken, [From.GetAdjective] lider [From.GetLeader], umutsuz bir durumda [Root.GetName] ülkesine gelip [Root.GetLeader] liderinden yardım diledi.\n\n[From.GetNameWithFlag], borcunun $[FROM.debt_bailout_display] §Ymilyar§! tutarındaki kısmının %75'ini ödememizi ve kalanını silmemizi istiyor. Bunu yaparsak diğer uluslararası borç verenleri yatıştırır, [From.GetName] ülkesinin borçlanma maliyetlerini ciddi biçimde düşürür ve büyük borcunu yönetilebilir hâle getiririz.\n\nBu işlemden para kaybedecek olsak da onlar ciddi şekilde bize borçlu kalacak, üzerlerindeki nüfuzumuz önemli ölçüde artacak."
 bankruptcy.1.a:0 "[From.GetNameWithFlag] için kurtarma paketini onayla"
 bankruptcy.1.b:0 "Üzgünüz, bunu karşılayamayız"
