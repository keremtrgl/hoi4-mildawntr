 DEBT_TOOLTIP_DELAYED:0 "£click_left $ 1 §Ymilyar§! borç almak için §YSol Tıkla§!.\n£GFX_click_right $ 1 §Ymilyar§! geri ödemek için §YSağ Tıkla§!.\n£GFX_click_right $[?treasury] §Ymilyar§! geri ödemek için §YSağ Tık + Alt §!.\n§YCtrl§! (10 kat), §YShift§! (100 kat) ve §YAlt§! (1000 kat) ile hazinenin tamamına kadar daha fazla öde.\n%1 borçlanma ücreti; $ 1 §Ymilyar§! borç = $ 1,01 §Ymilyar§! borç yükü.\n\n§YFaiz Oranı§! etkenleri:\n  Borç/GSYİH Oranı: %[?debt_interest_premium|-2]\n  Ulusal Ruhlar: %[?modifier@interest_rate_multiplier_modifier|-2]\n  Merkez Bankası Politika Faizi: %[?cb_rate_premium|-2]\n  Dünya Gerginliği: %[?threat_interest_premium|-2]\n  Yarattığımız Dünya Gerginliği: %[?adjusted_tension_premium|-2]\n[interest_rate_clamp_line]\n§YFaiz Oranının§! etkileri:\n  §YFaiz Oranı§! > §Y%10§!: borçla başa çıkmak için acil durum kararları açılır.\n  §YFaiz Oranı§! > §Y%15§!: ekonomik §Ryavaşlama§!, diğer §Rolumsuz etkiler§! ve büyük bedel karşılığında borcu temerrüde düşürme imkânı.\n  §YFaiz Oranı§! > §Y%20§!: borçlanma kısıtlanır ve bütçe açıkları için artık kredi alınamaz.\n  §YBorç Faizi§! > §YBrüt Gelir§!: ülkemiz §Rçöker!§!\n\n§YAlt + Shift + £GFX_click_right Sağ Tık§! ile §YOtomatik Borç Ödemesini§! açın; her fazlanın %25'i otomatik olarak borca ödenir."
