 monetary_expand_active_idea:0 "Genişletilmiş Para Arzı"
 monetary_expand_active_idea_desc:0 "Merkez bankası kısa süre önce para arzını genişletti; bu da enflasyonu artırdı, ancak rezerv para birimimizi elinde tutan diğer ülkelerden gelen gelirde bir artış sağladı."
