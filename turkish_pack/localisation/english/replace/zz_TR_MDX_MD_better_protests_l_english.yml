 protests_main_text:0 "Aşağıdaki tablo vatandaşların sizden ne beklediğini ve şu anda neyi finanse ettiğinizi gösterir. Kırmızı açıklar protesto kaymasını besler; bunları kapatmak gerginliği düşürmenin en doğrudan yoludur.[fuel_protests_TT]\n"
 OPEN_PROTESTS_BUTTON:0 "§YProtesto Sistemi§! Ekranını Aç"
 OPEN_PROTESTS_BUTTON_TT:0 "§YProtesto Sistemi§! panelini aç. Aylık kayma kaynaklarını, mevcut Protesto Gücünü ve Radikalleşmeyi, ayrıca vatandaşların beklediği harcama düzeylerini incele."
 CLOSE_PROTEST_SCREEN:0 "§YProtesto Sistemi§! Ekranını Kapat"
 expected_law_mechanic_tt:0 "§YHarcama tablosunu okuma§!\n"
 EL_green_square_explanation_tt:0 "§GYeşil§!: §gkamuoyunun aldığı beklenen harcama. Her yeşil kare, vatandaşların protesto etmesi için bir neden daha eksik demektir.§!"
 EL_blue_square_explanation_tt:0 "§BMavi§!: §gvatandaşların şu an beklediğinin üzerindeki harcama. Her ay para harcar ama ek protesto rahatlaması sağlamaz.§!"
 EL_red_square_explanation_tt:0 "§RKırmızı§!: §gsağlamakta §Rbaşarısız§! olduğumuz beklenen harcama. Her kırmızı kare, yukarıdaki kayma dökümünde yer alan §YHarcama etkisi§! satırını besler.§!"
 EL_white_square_explanation_tt:0 "Beyaz: §gne beklenen ne de finanse edilen yasa düzeyleri. Vatandaş beklentileri bunları gerektirecek kadar yükselene dek boşta kalır.§!"
 expected_social_spending_tt:0 "Vatandaşlar; yasalarınız, ulusal ruhlarınız, teknolojiniz ve kişi başı GSYİH'nize göre belirlenen bir §YSosyal Harcama§! düzeyi bekler. Her tam sayı bir düzeydir ve bu kategoride mevcut yasalarla sınırlıdır.\n\n§YBeklenen düzey:§! §Y[expected_social_spending_law_name]§! (şu an [?expected_welfare_spending|0Y])\n\n§YDöküm§!\nYasalar, ruhlar, teknoloji: [?ROOT.modifier@expected_welfare_modifier]\nKişi başı GSYİH: [calculate_gdp_c_modifier_welfare_spending]\n"
 expected_health_spending_tt:0 "Vatandaşlar; yasalarınız, ulusal ruhlarınız, teknolojiniz ve kişi başı GSYİH'nize göre belirlenen bir §YSağlık Harcaması§! düzeyi bekler. Her tam sayı bir düzeydir ve bu kategoride mevcut yasalarla sınırlıdır.\n\n§YBeklenen düzey:§! §Y[expected_healthcare_spending_law_name]§! (şu an [?expected_health_spending|0Y])\n\n§YDöküm§!\nYasalar, ruhlar, teknoloji: [?ROOT.modifier@expected_healthcare_modifier]\nKişi başı GSYİH: [calculate_gdp_c_modifier_healthcare_spending]\n"
 expected_adm_spending_tt:0 "Vatandaşlar; yasalarınız, ulusal ruhlarınız, teknolojiniz ve kişi başı GSYİH'nize göre belirlenen bir §Yİdari Harcama§! düzeyi bekler. Her tam sayı bir düzeydir ve bu kategoride mevcut yasalarla sınırlıdır.\n\n§YBeklenen düzey:§! §Y[expected_bureau_spending_law_name]§! (şu an [?expected_adm_spending|0Y])\n\n§YDöküm§!\nYasalar, ruhlar, teknoloji: [?ROOT.modifier@expected_adm_modifier]\nKişi başı GSYİH: [calculate_gdp_c_modifier_adm_spending]\n"
 expected_edu_spending_tt:0 "Vatandaşlar; yasalarınız, ulusal ruhlarınız, teknolojiniz ve kişi başı GSYİH'nize göre belirlenen bir §YEğitim Harcaması§! düzeyi bekler. Her tam sayı bir düzeydir ve bu kategoride mevcut yasalarla sınırlıdır.\n\n§YBeklenen düzey:§! §Y[expected_education_spending_law_name]§! (şu an [?expected_edu_spending|0Y])\n\n§YDöküm§!\nYasalar, ruhlar, teknoloji: [?ROOT.modifier@expected_education_modifier]\nKişi başı GSYİH: [calculate_gdp_c_modifier_education_spending]\n"
 expected_police_spending_tt:0 "Vatandaşlar; yasalarınız, ulusal ruhlarınız, teknolojiniz ve kişi başı GSYİH'nize göre belirlenen bir §YPolis Harcaması§! düzeyi bekler. Her tam sayı bir düzeydir ve bu kategoride mevcut yasalarla sınırlıdır.\n\n§YBeklenen düzey:§! §Y[expected_police_spending_law_name]§! (şu an [?expected_police_spending|0Y])\n\n§YDöküm§!\nYasalar, ruhlar, teknoloji: [?ROOT.modifier@expected_police_modifier]\nKişi başı GSYİH: [calculate_gdp_c_modifier_police_spending]\n"
 expected_defence_spending_tt:0 "Vatandaşlar; yasalarınız, ulusal ruhlarınız, teknolojiniz ve kişi başı GSYİH'nize göre belirlenen bir §YAskerî Harcama§! düzeyi bekler. Her tam sayı bir düzeydir ve bu kategoride mevcut yasalarla sınırlıdır.\n\n§YBeklenen düzey:§! §Y[expected_mil_spending_law_name]§! (şu an [?expected_military_sp|0Y])\n\n§YDöküm§!\nYasalar, ruhlar, teknoloji: [?ROOT.modifier@expected_mil_modifier]\nKişi başı GSYİH: [calculate_gdp_c_modifier_military_spending]\n"
 MD_protests_state_calm_text:0 "§GSakin§!: etkin huzursuzluk görevi yok."
 MD_protests_state_calm_tt:0 "Etkin bir uyarı veya isyan görevi yok. §YProtesto Gücü§! 20'nin üzerinde olduğu sürece bu panel görünür kalır. Kriz tetiklenmeden önce yükselen kaymaya müdahale edin."
 MD_protests_state_warning_text:0 "§YUyarı§!: protesto hareketi oluşuyor."
 MD_protests_state_warning_tt:0 "§YYaklaşan Protestolar§! görevi etkin. Süre dolarsa uygun bir başkent dışı çekirdek eyalette huzursuzluk başlar. Uyarıyı tetikleyen ekonomik ve siyasi koşulları istikrara kavuşturarak çözün ya da zaman kazanıp Gücü düşürmek için §YProtestocuları Yatıştır§! ve §YÖnleyici Reform§! seçeneklerini kullanın."
 MD_protests_state_revolt_text:0 "§Rİsyan§!: çekirdek eyaletlerde direniş."
 MD_protests_state_revolt_tt:0 "§YYaklaşan İsyan§! görevi etkin. Her ay yeni başkent dışı bölgeler isyana katılabilir; ihtimal, mevcut §YProtesto Gücü§! eksi §YProtesto Yorgunluğu§!'na eşittir ve üst sınırı §Y%75§!'tir. Yorgunluk her etkin ayda §G5§! puan artar. Etkilenen eyaletler §Y%50 Uyum§! ve §Y%40 Direniş§! altında temizlenir. Protesto Gücünü §Y60 gün§! boyunca §G0§! tutmak isyanı bitirir. Ana görev önce biterse ve Güç 0'ın üzerindeyse, iç savaş çözülmemiş eyaletlere ve Radikalleşmeye bağlı olarak ülkenin §Y%10§! ile §Y%50§! arasını alır."
 MD_protests_state_cooldown_text:0 "§BBekleme Süresi§!: krizden toparlanma."
 MD_protests_state_cooldown_tt:0 "Bir protesto krizinin ardından toparlanma dönemi. §Y1000§! gün boyunca yeni bir protesto görevi tetiklenemez. Bu nefes alma süresini, baskı yeniden artmaya başlamadan önce harcamaları dengelemek ve istikrarı yeniden kurmak için kullanın."
 MD_top_resistant_state_active:0 "§YEn kötü eyalet:§! [event_target:MD_top_resistant_state_scope.GetName] (§R%[?MD_top_resistant_state_value|0]§!)"
 MD_top_resistant_state_none:0 "§YEn kötü eyalet:§! §Gyok§!"
 MD_drift_diagnosed_tt:0 "Çözülmemiş, en yüksek §YDirenişe§! sahip başkent dışı çekirdek eyalet. Direnişi §Y%40§! altına indirmek ve Uyumu §Y%50§! düzeyine çıkarmak için isyan kararlarını ve yeterli garnizonu kullanın.\n\nEtkilenen her eyalet sakinleştiğinde §Gyok§! gösterilir."
 MD_drift_header_text:0 "§YAylık kayma kaynakları§! (son tur)"
 MD_protests_strength_readout_text:0 "§YGüç:§! §Y[?protest_strength|0]§!§Y / 100   ·   Radikalleşme:§! §Y[?protest_radicalisation|0]§!§Y / 10§!"
 MD_protests_strength_readout_tt:0 "Protesto döngüsünü iki gösterge yönlendirir.\n\n§YProtesto Gücü§! (şu an [?protest_strength|0] / 100) ülkenin krize ne kadar yakın olduğunu izler. §Y50§! üzerinde Uyarı görevi tetiklenebilir. Etkin bir isyan sırasında Güç yalnızca huzursuzluğun yayılma ihtimalini belirler. Onu §Y60 gün§! boyunca §G0§! tutmak isyanı bitirir.\n\nGüç, yukarıda gösterilen kayma kaynaklarıyla her ay artar. Kendiliğinden soğuma, §YÖnleyici Reform§! ve başarılı Vaat görevleriyle düşer.\n\n§YProtesto Radikalleşmesi§! (şu an [?protest_radicalisation|0] / 10), Güç en az 50 iken veya bir protesto görevi etkinken her ay §Y%20§! ihtimalle artar. Aksi hâlde §Y%10§! ihtimalle düşer. Yüksek Radikalleşme, başarısız bir isyanın iç savaşının boyutunu artırır."
 MD_drift_total_tt:0 "Etkin tüm kayma kaynaklarının ve kendiliğinden soğumanın toplamı. Pozitif, Protesto Gücünün yükseldiği; negatif, düştüğü anlamına gelir.\n\nNeti negatife çevirmek için yukarıda gösterilen en büyük etkeni hedefleyin. Yapısal çözümler yerini bulurken §YÖnleyici Reform§! ve §YProtestocuları Yatıştır§! zaman kazandırır.\n\nÜç §YVaat§! kararı, 200 ile 350 günlük bir hedefe bağlanmayı gerektirir. Başarılırsa İsyan görevi daha fazla süre kazanır; başarısız olursa tutulmayan vaat küçük bir ceza ekler. §YVaat: Acil Polis Fonu§! 200 gün sürer ve Protesto Gücünü §G10§! düşürmenizi ister; karşılığında İsyan görevine §G+75§! gün verir. §YVaat: Vergi İndirimi§! 300 gün sürer ve İstikrarı §G%5§! artırmanızı ister; karşılığında §G+100§! gün verir. §YVaat: İstihdam Programı§! 350 gün sürer ve işsizliği §G%1,5§! düşürmenizi ister; karşılığında §G+120§! gün verir."
