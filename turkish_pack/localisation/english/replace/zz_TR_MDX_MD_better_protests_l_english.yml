l_english:
 MD_protests_open_button_text:0 "§YProtesto Menüsü§!"
 PROTEST_TITLE:0 "§YProtesto Sistemi§!"
 MD_protests_state_subtitle:0 "§gHuzursuzluk hakkında güncel bilgi§!"
 MD_protests_state_warning_subtitle:0 "§gProtestolar hakkında güncel bilgi§!"
 MD_DRIFT_SPENDING_TEXT:0 "Harcama etkisi:"
 MD_drift_spending_tt:0 "Vatandaşlar temel düzeyde sosyal yardım, sağlık, eğitim, polis, idari ve askerî harcama bekler. Yetersiz harcama protesto gücünü artırır; fazla harcama gerginliği azaltır ama hazineyi eritir. Yakıt tükendiğinde sabit §R+1§! eklenir.\n\nEn büyük açıkları kapatmak için aşağıdaki harcama tablosunda kırmızı işaretli yasaları yükseltin. Dengeyi yeniden kurarken §YProtestocuları Yatıştır§! ve §YÖnleyici Reform§! zaman kazandırabilir."
 MD_DRIFT_STABILITY_TEXT:0 "Düşük istikrar + seçimler:"
 MD_drift_stability_tt:0 "İstikrar §Y%20§! altına düştü ve hükümet hâlâ seçim yapıyor; bu yüzden seçmenler sokaklara dökülüyor.\n\nİstikrar sağlayan odakları ve olayları geçirin, istikrarı aşağı çeken pahalı askerî inşaatları durdurun. §YVaat: Vatandaşlara Vergi İndirimi§!, 300 gün boyunca §G+%5§! istikrar etkeni ekler ve diğer tüm istikrar kazanımlarını hızlandırır. Siyasi yolunuz geçişe izin veriyorsa seçimsiz bir hükümet bu etkeni tamamen ortadan kaldırır."
 MD_DRIFT_INTEREST_TEXT:0 "Yüksek politika faizi:"
 MD_drift_interest_tt:0 "§YPolitika Faizi§! §Y%8,9§! üzerinde. Sıkı para politikası kredileri yavaşlatır, işletmeler personel çıkarır ve halk hükümeti suçlar.\n\n§YPolitika Faizini§! §YPara§! sekmesinden düşürün. §G%8,9§! altındaki her değer bu etkeni kaldırır. Faiz eşiğin ne kadar üzerindeyse aylık darbe o kadar büyür. Borcu ödemek bu satırı temizlemez. Faiz artışlarını kısa tutun ve yalnızca enflasyona karşı kullanın."
 MD_DRIFT_DEBT_INTEREST_TEXT:0 "Yüksek faiz oranı:"
 MD_drift_debt_interest_tt:0 "Devlet borcundaki §YFaiz Oranı§! §Y%8,9§! üzerinde. Borç ödemeleri harcamaları sıkıştırır ve halk hükümeti suçlar.\n\nBorcu §YPara§! sekmesinden ödeyin. Ulusal ruhlar, dünya gerginliği ve §YPolitika Faizi§! da bu orana etki eder. §G%8,9§! altındaki her değer bu etkeni kaldırır. Faiz eşiğin ne kadar üzerindeyse aylık darbe o kadar büyür. Borç yoksa faiz §G%0§! olur ve bu etken devre dışı kalır."
 MD_DRIFT_RECESSION_TEXT:0 "Durgunluk:"
 MD_drift_recession_tt:0 "Ekonomi durgunlukta. Her ay ortalama yaklaşık §R+3§! Protesto Gücü değerinde rastgele bir darbe eklenir.\n\nEkonomi sistemi üzerinden §Ydurgunluk§! fikrini temizlemek bu etkeni tamamen kaldırır. Toparlanma olayları için ekonomi panelini izleyin; en kötü dönemi atlatmak için §YProtestocuları Yatıştır§! ve §YÖnleyici Reform§! seçeneklerine yaslanın."
 MD_DRIFT_DEPRESSION_TEXT:0 "Buhran:"
 MD_drift_depression_tt:0 "Ekonomi buhranda; durgunluğun daha kötü kardeşi. Her ay ortalama yaklaşık §R+4§! Protesto Gücü değerinde rastgele bir darbe eklenir; bu, durgunluktan kabaca üçte bir daha kötüdür.\n\nEkonomi sistemi üzerinden §Ybuhran§! fikrini temizlemek bu etkeni kaldırır. Hedefleri tutturabilirseniz §YVaat: Vergi İndirimi§! ve §YVaat: İstihdam Programı§! protesto baskısını azaltır; §YProtestocuları Yatıştır§! ve §YÖnleyici Reform§! ise zaman kazandırır."
 MD_DRIFT_WAR_TEXT:0 "Savaş yorgunluğu:"
 MD_drift_war_tt:0 "§Y36§! aydan uzun süredir savaştayız ve halk bitkin. Her ek 24 aylık savaş, ayda bir §R+1§! daha ekler. Dört yıllık savaş §R+2§!, altı yıllık savaş §R+3§! vurur; üst sınır yoktur.\n\nSavaşı bitirmek bu etkeni hemen sıfıra indirir. İsyanlar başladıysa, savaşı sonlandırırken §YGönülleri Kazanma Kampanyası§! uyumu artırır."
 MD_DRIFT_CORRUPTION_TEXT:0 "Koalisyon zayıflığı:"
 MD_drift_corruption_tt:0 "Yolsuzluk fikri etkinken veya seçimler askıdayken hükümet koalisyonunun gücü §Y%30§! altında. Koalisyon ne kadar zayıfsa darbe o kadar büyür. Koalisyon gücü §Y%10§! iken aylık maliyeti §R+0,2§!, §Y%20§! iken §R+0,1§! olur.\n\nYolsuzlukla mücadele odakları ve olaylarıyla yolsuzluk fikrini düşürün. Alt ideoloji paktlarıyla koalisyon desteği oluşturun. Seçimleri yeniden başlatmak bu etkeni tamamen kaldırır. §YVaat: Vergi İndirimi§!, başarıyla tamamlanırsa koalisyon gücüne §G+%3§! ekler; istikrar yükselmeye başladığında işe yarar."
 MD_DRIFT_CT_TEXT:0 "Terörle mücadele politikası:"
 MD_drift_ct_tt:0 "İnternet izleme veya protesto tutuklamaları etkin. Baskı, ortalama yaklaşık §R+5§! Protesto Gücü değerinde rastgele bir aylık darbe ekler; rastgele kaynakların en sertidir.\n\nBunlar kısa vadeli araçlar olmalıdır. Etkin görev tamamlanınca Terörle Mücadele fikrini kaldırın, aksi hâlde kayıp süresiz sürer. Aktif bir kriz sırasında Terörle Mücadeleyi §YVaat: Acil Polis Fonu§! ile birlikte kullanmak direniş artışındaki azalmayı katlar."
 MD_DRIFT_PASSIVE_TEXT:0 "Kendiliğinden soğuma:"
 MD_drift_passive_tt:0 "Kamuoyunun ilgisi dağılır. Her ay §Y%50§! ihtimalle kendiliğinden §G-2§! Protesto Gücü düşer; bu yılda ortalama yaklaşık §G-12§! eder ve bedavadır.\n\n§YProtestocuları Yatıştır§! ve §YÖnleyici Reform§! ile zaman kazanmak, kendiliğinden soğumanın işin çoğunu yapmasını sağlar."
 MD_drift_total_text:0 "§YGeçen ayın net değeri:§!"
 MD_protests_revolt_states_text:0 "§RHâlâ direnen çekirdek eyaletler:§!"
 MD_protests_revolt_states_tt:0 "§YYaklaşan İsyan§! görevi bu değer §G0§! olduğunda tamamlanır. Etkilenen başkent dışı eyaletler, §Y%50 Uyum§! ve §Y%40 Direniş§! altında kendiliğinden temizlenir. Başkent eyaletleri isyana katılamaz."
