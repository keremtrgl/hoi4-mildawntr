 revolt_party_TT:0 "§H[party_name_by_index] olarak Devrim Başlat (§Y[?party_pop_array^v|%1]§!)§!\n\n§YÖn Koşul:§!\n[!revolt_button_click_enabled]\n§YEtkiler:§!\n[!revolt_button_click]"
 boost_party_TT:0 "§H[party_name_by_index] Partisini Destekle (§Y[?party_pop_array^v|%1]§!)§!\nAsıl siyasi rakiplerimizin gücünü dağıtmak için siyasi mekanizmamızı kullanarak diğer partilerin popülerliğini artırabiliriz\n\n§YÖn Koşul:§!\n[!boost_button_click_enabled]\n§YEtkiler:§!\n[!boost_button_click]"
 attack_party_TT:0 "§H[party_name_by_index] Partisine Saldır (§Y[?party_pop_array^v|%1]§!)§!\nHükümet dışındaki büyük partiler hakkında topladığımız kirli dosyaları ve dezenformasyon kampanyalarını kullanarak popülerliklerine ağır darbe vurabilir, iktidarımıza meydan okuyamaz hâle getirebiliriz. Her türlü ilgi küçük partilere popülerlik kazandıracağından bu yalnızca [?election_threshold|%0] seçim barajının üzerindeki büyük partilerde işe yarar\n\n§YÖn Koşul:§!\n[!attack_button_click_enabled]\n§YEtkiler:§!\n[!attack_button_click]"
 ban_party_TT:0 "§H[party_name_by_index] Partisini Yasakla (§Y[?party_pop_array^v|%1]§!)§!\nBir siyasi partiyi veya hareketi yasa dışı ilan etmek, onun seçimle asla iktidara gelememesini sağlar ve üyelerine yönelik kovuşturmayı kolaylaştırır.\n\n§YÖn Koşul:§!\n[!ban_button_click_enabled]\n§YEtkiler:§!\n[!ban_button_click]"
 allow_party_TT:0 "§H[party_name_by_index] Partisini Yasallaştır (§Y[?party_pop_array^v|%1]§!)§!\nYasağı kaldırmanın ve üyelerinin kamu görevlerine aday olup yasal biçimde örgütlenmesine izin vermenin zamanı geldi.\n\n§YÖn Koşul:§!\n[!allow_button_click_enabled]\n§YEtkiler:§!\n[!allow_button_click]"
