 IP_TITLE:0 "İdeolojik Güçler"
 IP_communist_category_desc_delayed:0 "§LKomünistler genellikle Marksizm-Leninizmin bir biçimini ya da benzer bir ideolojiyi izler. Devlet güdümlü ekonominin savunucuları olarak yabancı sanayileri millileştirip beş yıllık planlarla daha kolay sanayileşirler. Casusları aracılığıyla kendi görüşlerini de daha etkili biçimde yayabilirler.§!"
 IP_socialist_category_desc_delayed:0 "§LSosyalistler piyasa ve devlet kapitalizminin öğelerini ilerici fikirlerle birleştirir. Çoğu zaman amaç, hükümetin tüm çabasını ülkenin kendisine yatırmaktır. Sosyal refah politikaları ve devletin ekonomiye müdahalesi sayesinde ülkelerinin iç durumunu kolayca iyileştirirler.§!"
 IP_conservative_category_desc_delayed:0 "§LMuhafazakârlar genellikle ülkenin olduğu gibi kalmasını, hatta bazı ilerici yasaların geri alınmasını ister. Muhafazakârlık çoğu zaman milliyetçilik ve derin dini inançlarla iç içedir. Köklü değişim nadir olduğundan muhafazakâr ülkeler siyasi ve ulusal istikrarı daha kolay korur.§!"
 IP_liberal_category_desc_delayed:0 "§LLiberaller özgürlük fikrini savunur; bazı partiler ise meselelere daha ilerici (sosyal liberal) bir yaklaşım benimser. Çoğu liberal partinin özünde devlet müdahalesinin çok sınırlı olduğu serbest piyasa fikri yatar.§!"
 IP_autocrat_category_desc_delayed:0 "§LOtokratlar ülkeyi yönetmek için güçlü liderlere dayanır. Bu demagoglar istediklerini elde etmek için şüpheli yöntemlere ve perde arkası pazarlıklara başvurmaktan çekinmez. Otokratlar yüksek yolsuzluğa daha kolay katlanır ve ülkeyi demir yumrukla yönetir.§!"
 IP_monarchist_category_desc_delayed:0 "§LMonarşistler ülkeleri soy ve şan üzerinden yönetir. Gücü tek bir ailede toplamanın avantajları vardır: Bu aile güç getirir ve hükümdarlar halklarına ilham vermekte ustadır.§!"
 IP_fundamentalist_symbol_desc_delayed:0 "§LKöktendinciler, İslam'ın radikal ya da aşırı muhafazakâr bir yorumunu izleyen katı muhafazakârlardır. Asıl amaçları bu muhafazakâr görüşleri başka ülkelere de yaymaktır.§!"
 IP_communist_powers_desc:0 "§YKomünistler§!\n\n§YGüçlere sahip olanlar:§!\n  [communist_state_L]\n  [Neutral_Communism_L]\n\n§YBonuslar:§!\n  $BOOST_IDEOLOGY_MISSION_FACTOR$: §G+%25§!\n  §YKararlar§! ile kendi §YBeş Yıllık Planlarını§! uygulayabilir\n  §YKararlar§! ile büyük yabancı nüfuz sahiplerinin varlıklarını §YMillileştirebilir§!\n\n§YDezavantaj:§!\n  $buildings_worker_requirement_modifier$: §R+%15§!"
 IP_socialist_powers_desc:0 "§YSosyalistler§!\n\n§YGüçlere sahip olanlar:§!\n  [socialism_L]\n  [anarchist_communism_L]\n  [Neutral_green_L]\n  [neutral_Social_L]\n\n§YBonuslar:§!\n  $health_cost_multiplier_modifier$: §G-%15,00§!\n  $social_cost_multiplier_modifier$: §G-%15,00§!\n  $MODIFIER_POLITICAL_POWER_FACTOR$: §YSınırlı Müdahalecilik§!'in altındaki her seviye için §G+%15§!\n\n§YYalnızca [Neutral_green_L]:§!\n  $modifier_state_production_speed_renewable_energy_infra_factor$: §G+%50,00§!\n\n§Y[Neutral_green_L] hariç hepsi:§!\n  $internal_investments_pp_cost_modifier$: §G-%25,00§!\n  $internal_investments_money_cost_modifier$: §G-%25,00§!\n\n§YDezavantaj:§!\n  $foreign_influence_defense_modifier$: §R-%15§!"
