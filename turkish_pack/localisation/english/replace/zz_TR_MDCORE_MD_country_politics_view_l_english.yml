 prowestern_propaganda_button_tt:0 "§YBatı Yanlısı§! Propaganda Kampanyası \nBilgi savaşıyla dünyadaki duruma ilişkin kamuoyunu etkileyebiliriz. Ancak insanlar zamanla ilgisini kaybettiğinden bu tür kampanyalar yalnızca sınırlı bir süre etkili olur.\n\n§YPropaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YBatı Yanlısı Propaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%] \n\n§YÖn Koşul:§! \n[!prowestern_propaganda_button_click_enabled] \n§YEtkinken Değiştiriciler:§! \n[!prowestern_propaganda_button_click]"
 emerging_propaganda_button_tt:0 "§YYükselen§! Propaganda Kampanyası \nBilgi savaşıyla dünyadaki duruma ilişkin kamuoyunu etkileyebiliriz. Ancak insanlar bir süre sonra ilgisini kaybettiğinden bu tür kampanyalar yalnızca sınırlı bir süre etkili olur.\n\n§YPropaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YYükselen Görüş Propaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%] \n\n§YÖn Koşul:§! \n[!emerging_propaganda_button_click_enabled] \n§YEtkinken Değiştiriciler:§! \n[!emerging_propaganda_button_click]"
 nonaligned_propaganda_button_tt:0 "§YBağlantısız§! Propaganda Kampanyası \nBilgi savaşıyla dünyadaki duruma ilişkin kamuoyunu etkileyebiliriz. Ancak insanlar zamanla ilgisini kaybettiğinden bu tür kampanyalar yalnızca sınırlı bir süre etkili olur.\n\n§YPropaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YBağlantısız Propaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%] \n\n§YÖn Koşul:§! \n[!nonaligned_propaganda_button_click_enabled] \n§YEtkinken Değiştiriciler:§! \n[!nonaligned_propaganda_button_click]"
 nationalist_propaganda_button_tt:0 "§YMilliyetçi§! Propaganda Kampanyası \nBilgi savaşıyla kamuoyunun dünyadaki duruma milliyetçi bir bakış açısıyla bakmasını sağlayabiliriz. Ancak insanlar zamanla ilgisini kaybettiğinden bu tür kampanyalar yalnızca sınırlı bir süre etkili olur.\n\n§YPropaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YMilliyetçi Propaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%] \n\n§YÖn Koşul:§! \n[!nationalist_propaganda_button_click_enabled] \n§YEtkinken Değiştiriciler:§! \n[!nationalist_propaganda_button_click]"
 fascism_propaganda_button_tt:0 "§YFaşizm§! Propaganda Kampanyası \nBilgi savaşı ve aşırı muhafazakâr din adamlarının öne çıkarılması gibi yöntemlerle kamuoyunu Selefilik lehine etkileyip radikalleştirebiliriz. Ancak insanlar zamanla ilgisini kaybettiğinden bu tür kampanyalar yalnızca sınırlı bir süre etkili olur.\n§RHer ülke Selefi propagandası yapamaz!§!\n\n§YPropaganda Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YSelefi Telkin Kampanyası Maliyeti§! Değiştiricisi: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%] \n\n§YÖn Koşul:§! \n[!fascism_propaganda_button_click_enabled] \n§YEtkinken Değiştiriciler:§! \n[!fascism_propaganda_button_click]"
