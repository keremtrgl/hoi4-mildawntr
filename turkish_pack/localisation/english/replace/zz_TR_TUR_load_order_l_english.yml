 TUR_LOAD_ORDER_WARNING_TITLE:0 "Mod Cakismasi Tespit Edildi"
 TUR_LOAD_ORDER_WARNING_TEXT:0 "§R+Turkey'nin Türkiye başlangıç ayarları yüklenmedi.§!\n\nOynanış setinizdeki başka bir mod Türkiye'nin ülke geçmişini değiştiriyor. Bu yüzden Türkiye, +Turkey'nin partileri, liderleri, ulusal ruhları ve başlangıç ayarları olmadan başlıyor; odak ağaçları ve olaylar da amaçlandığı gibi çalışmayabilir.\n\nBu genelde ikinci bir Türkiye modu ya da Türkiye'yi de değiştiren büyük bir moddur. Düzeltmek için:\n §Y1.§! Türkiye'yi değiştiren diğer modu kapatın ya da\n §Y2.§! oynanış setinizde §Y+Turkey§!'yi onun altına alın (Millennium Dawn en üstte kalır).\n\nArdından yeni bir oyun başlatın."
 TUR_LOAD_ORDER_WARNING_OK:0 "Anladım"
