 AUKUS_Tech_Share_desc:0 "Birleşik Krallık, Amerika Birleşik Devletleri ve Avustralya, tek bir çizim setinden ortak bir nükleer tahrikli saldırı denizaltısı geliştiriyor. Reaktör tesisleri, sonar takımları ve torpido çalışmaları Barrow-in-Furness, Amerikan tersaneleri ve Osborne arasında paylaşılıyor; böylece bir ortağın tasarım ofisinde bulunan çözüm diğer ikisine ulaşıyor."
 BNL_tech_sharing_group_name:0 "Benelüks Araştırma İş Birliği"
 BNL_tech_sharing_group_desc:0 "Benelüks Ekonomik Birliği'nden bu yana onlarca yıllık entegrasyona dayanarak Belçika, Hollanda ve Lüksemburg araştırma ve sanayi uzmanlıklarını bir araya getiriyor. Ortak finansman, paylaşılan laboratuvarlar ve tek bir yenilik pazarı her ortağın diğerlerinin atılımlarından yararlanmasını sağlayarak birlik genelinde teknolojik ilerlemeyi hızlandırıyor."
